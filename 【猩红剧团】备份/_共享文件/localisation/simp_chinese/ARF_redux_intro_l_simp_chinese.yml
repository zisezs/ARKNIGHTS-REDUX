 redux_intro.1.t: "重铸明日 · redux 模组介绍 v1.5"
 redux_intro.1.d: "§Y【关于本模组】§!\n本模组由汲取了明日方舟编剧政治智慧的 §GDeepSeek§! 和 §GQwen§! 编写，§YAI 拷打员§!为紫色。\n\n§Y【当前流程勉强完整的国家】§!\n· §G伊比利亚§!\n· §G猩红剧团§!\n· §G深池§!（§R大量 BUG§!）\n· §G乌萨斯帝国§!\n\n§Y【目前完成度比较高的国家】§!\n· §G大炎§!\n· §G叙拉古§!\n· §G整合运动·柳德米拉线§!（索科洛夫定制 galgame）\n\n§Y【1.4 版本更新内容】§!\n· 完全重制了哥伦比亚系、乌萨斯、大炎的 §G民族精神图标§! 和 §G军工设计商图标§!，完全重制了 §G乌萨斯的国策图标§!。\n· 新增 §G第十二次乌卡战争§! 内容，§Y玛恩纳§!将会带领复国骑士团向乌萨斯发起最后的进军！\n\n§Y【1.5 版本「天有烘炉」更新内容】§!\n· 完全重制了 §G伊比利亚§! 的 §G国策图标§! 和 §G军工企业§!，并增加了新的 §G军事国策树§!——更大的重制将在明日方舟更新伊比利亚新剧情后同步更新！\n· 将 §R潜龙腾渊§! 的民用科技树「天工开物」移植了过来，感谢 §B风鹰§! 老大的授权！\n\n§Y【10 月 1 日补丁】§!\n· §G乌萨斯§! 的国策正在全面重制中！\n· 新增了 §G莱塔尼亚§! 国策树，§R仅供看海§!。\n· 全面修复了不规范的国策效果文本。\n\n§R【急聘美工、策划、文案、代码！】§!\n\n其余势力仍在铺设之中。若是碰上打不开的门、断掉的链子、卡住的事件，那多半是还没修完，不是你走错了路。\n祝你在泰拉走完这一程。"
 redux_intro.1.a: "收下这份说明，出发"
