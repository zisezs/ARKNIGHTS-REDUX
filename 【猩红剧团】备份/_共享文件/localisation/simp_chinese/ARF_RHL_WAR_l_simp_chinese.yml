l_simp_chinese:

# ══════════════════ 决议分类 ══════════════════
 RHL_war: "莱茵生命·作战"

# ══════════════════ 共用启用条件（available 灰掉时显示）══════════════════
 RHL_war_tt_peace_only: "§R莱茵生命必须处于和平状态§!"

# ══════════════════ 决议 · 作战（1098 且泰拉平衡委员会成立后解锁）══════════════════
# 清单 = 本 mod 有独立国策树的 13 个主要国家，一条决议打一国，顺序由玩家自定。

# ── 一、维多利亚圈 ──
 RHL_war_vwi: "向[VWI.GetFlag]§R[VWI.GetName]§!宣战"
 RHL_war_vwi_desc: "作战评估：边防集团军沿温德米尔走廊展开，补给依赖三座铁路桥。切断任一节点，其机动兵力将在一周内失去油料。\n\n「先算补给，再算敌人。」"
 RHL_war_vwi_tt: "§Y效果：§!立即向§R[VWI.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_vic: "向§R维多利亚帝国§!宣战"
 RHL_war_vic_desc: "作战评估：帝国本部主力分散在边境领与蒸汽骑士团之间，动员需要时间。抢在它完成集结之前推入核心区，是唯一划算的算法。\n\n「帝国的重量在集结的那一刻，之后只剩惯性。」\n\n§L目标为当下控制伦蒂尼姆的政权，无论其旗帜换成了哪一面。§!"
 RHL_war_vic_tt: "§Y效果：§!立即向§R当下控制伦蒂尼姆的维多利亚政权§!宣战（战争目标：吞并全部）"

# ── 二、乌萨斯圈 ──
 RHL_war_urs: "向[URS.GetFlag]§R[URS.GetName]§!宣战"
 RHL_war_urs_desc: "作战评估：帝国军力庞大但内线不稳，各集团军辖区之间的协同早已名存实亡。逐个击破优于正面决战。\n\n「一个帝国的装甲厚度，取决于它的命令能不能传到。」"
 RHL_war_urs_tt: "§Y效果：§!立即向§R[URS.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_ufe: "向[UFE.GetFlag]§R[UFE.GetName]§!宣战"
 RHL_war_ufe_desc: "作战评估：边疆区地广人稀、公路单一，控制干线即等于控制全境。\n\n「荒原的胜负写在里程表上。」"
 RHL_war_ufe_tt: "§Y效果：§!立即向§R[UFE.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_kmg: "向[KMG.GetFlag]§R[KMG.GetName]§!宣战"
 RHL_war_kmg_desc: "作战评估：目标是草原上的骑兵与冶金传统，冬季推进代价过高。应抢在封冻前结束主要作战。\n\n「别在别人的季节里打仗。」"
 RHL_war_kmg_tt: "§Y效果：§!立即向§R[KMG.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_omn: "向[OMN.GetFlag]§R[OMN.GetName]§!宣战"
 RHL_war_omn_desc: "作战评估：机械化程度中等、工业分散。优先摧毁其修理与油料节点，之后的推进将不成比例地便宜。\n\n「打掉维修厂，比打掉坦克便宜十倍。」"
 RHL_war_omn_tt: "§Y效果：§!立即向§R[OMN.GetName]§!宣战（战争目标：吞并全部）"

# ── 三、西方 ──
 RHL_war_gul: "向[GUL.GetFlag]§R[GUL.GetName]§!宣战"
 RHL_war_gul_desc: "作战评估：共和国刚从废墟里站起来，兵力与工业都在重建期。此刻动手，成本最低。\n\n「最好的时机，是它还没站起来的时候。」"
 RHL_war_gul_tt: "§Y效果：§!立即向§R[GUL.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_ibr: "向[IBR.GetFlag]§R[IBR.GetName]§!宣战"
 RHL_war_ibr_desc: "作战评估：沿海国家，海军与港口即命脉。陆上僵持时，封锁比进攻更有效。\n\n「让它的船停在港里，比击沉它便宜。」"
 RHL_war_ibr_tt: "§Y效果：§!立即向§R[IBR.GetName]§!宣战（战争目标：吞并全部）"

# ── 四、新大陆 ──
 RHL_war_clb: "向[CLB.GetFlag]§R[CLB.GetName]§!宣战"
 RHL_war_clb_desc: "作战评估：目标与莱茵生命同源。特里蒙的实验室、天空热、万星园——全部写在清算清单第一页。\n\n「我们是从它里面长出来的，所以最清楚该从哪里下刀。」"
 RHL_war_clb_tt: "§Y效果：§!立即向§R[CLB.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_zzz: "向§R废土（ZZZ）§!宣战"
 RHL_war_zzz_desc: "作战评估：目标区域的战略价值集中在废土带上的残存设施与通道。占领成本低于放射与损耗带来的长期代价。\n\n「废土不需要征服，只需要清点。」"
 RHL_war_zzz_tt: "§Y效果：§!立即向§R废土（ZZZ）§!宣战（战争目标：吞并全部）"

# ── 五、东方 ──
 RHL_war_yan: "向[YAN.GetFlag]§R[YAN.GetName]§!宣战"
 RHL_war_yan_desc: "作战评估：东方帝国的纵深与人力储备是长期变量。此战不可速胜，只能以工业产出换空间。\n\n「和一个千年帝国打仗，先准备十年。」"
 RHL_war_yan_tt: "§Y效果：§!立即向§R[YAN.GetName]§!宣战（战争目标：吞并全部）"

# ── 六、非国家行为体 ──
 RHL_war_scr: "向[SCR.GetFlag]§R[SCR.GetName]§!宣战"
 RHL_war_scr_desc: "作战评估：目标没有固定领土，指挥链以演出为掩护，常规战果难以量化。必须先摧毁其舞台网络。\n\n「剧本没了，演员会散。」"
 RHL_war_scr_tt: "§Y效果：§!立即向§R[SCR.GetName]§!宣战（战争目标：吞并全部）"

 RHL_war_reu: "向[REU.GetFlag]§R[REU.GetName]§!宣战"
 RHL_war_reu_desc: "作战评估：游击队化整为零，正面消耗战无意义。应以封锁与据点推进压缩其活动半径。\n\n「反游击不是打赢，是让它无处可去。」"
 RHL_war_reu_tt: "§Y效果：§!立即向§R[REU.GetName]§!宣战（战争目标：吞并全部）"
