 SCR_corsica_char: "科西嘉莉"
 the_empress: "高卢的皇女"
 the_empress_desc: "她不是从史书里走出来的。她是被舞台的追光重新投出来的那一道影子。"
 SCR_corsica_party: "高卢倒影皇廷"
 SCR_corsica_party_long: "高卢倒影皇廷——皇女复国记"
 special_corsica_subtype: "剧场皇室"
 special_corsica_subtype_desc: "高卢倒影皇廷的宫廷意识形态。皇冠、幕布与军旗被缝在同一件法袍上：国家是一场永不谢幕的演出，而科西嘉莉既是主演，也是坐在包厢里的唯一观众。"
 SCR_Gallic_Reflection: "高卢倒影"
 SCR_Gallic_Reflection_ADJ: "高卢倒影"
 SCR_Gallic_Reflection_DEF: "高卢倒影"
 scr.26.t: "唯有高卢"
 scr.26.d: "剧院的灯一盏接一盏亮起。卢西恩·德·高卢站在舞台中央，手里握着那枚猩红血钻。他没有戴面具——今夜的剧本里，他不再需要面具。\n\n台下的旧贵族、旧军官和旧官僚被请到前排。剧团长坐在最后一排，像一个普通的观众。\n\n「高卢不需要第二个演员。」卢西恩说，「它只需要一个愿意替它把戏演完的人。」\n\n从今夜起，高卢先锋国的旗帜将代替剧团的幕布。"
 scr.26.a: "让旧军团先入场。"
 scr.26.b: "先清点战利品。"
 scr.27.t: "高卢倒影皇廷"
 scr.27.d: "林贡斯的钟楼在午夜敲了十三下。剧团长摘下帽子，向舞台中央的年轻女人行礼。\n\n「科西嘉莉陛下，」他说，「观众已经到齐了。」\n\n她抬起头。她的脸与旧世界的高卢并无关系，但当她开口时，整个剧院都听见了那个名字——不是卢西恩的，也不是剧团长的。\n\n从今夜起，高卢倒影皇廷将代替剧团的幕布。世界之都的倒影，终于有了自己的皇冠。"
 scr.27.a: "让他们记住这个夜晚。"
 scr.27.b: "先让军队宣誓。"

