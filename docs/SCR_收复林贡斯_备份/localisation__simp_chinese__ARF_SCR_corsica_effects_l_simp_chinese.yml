 SCR_corsica_vanguard_unlock_tt: "解锁「近卫军之锋」编制（上限 4），在首都生成 2 个满编师。"
 SCR_corsica_dolls_tt: "在首都生成 2 个满编「颂乐人偶」师。"
 SCR_vanguard_recruit_tt: "在首都生成 1 个满编「近卫军之锋」师。"
