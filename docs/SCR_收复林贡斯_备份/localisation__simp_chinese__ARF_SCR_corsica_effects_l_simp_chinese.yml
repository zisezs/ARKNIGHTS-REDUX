l_simp_chinese:

# 猩红剧团 · 科西嘉线 / 转线 —— 新增内容本地化
 SCR_dyn_corsica: "世界之都的倒影"
 SCR_dyn_corsica_modify_tt: "§Y世界之都的倒影§!追加效果："
 SCR_dyn_corsica_value_tt: " 政治点数获取/稳定度/战争支持度: $RIGHT|+=%1$"
 SCR_dyn_corsica_lite_value_tt: " 科研速度/建造速度: $RIGHT|+=%1$"
 SCR_dyn_corsica_army_value_tt: " 陆军攻击/防御/士气: $RIGHT|+=%1$"
 SCR_dyn_corsica_int_value_tt: " 加密/破译: $RIGHT|+=%1$"
 SCR_dyn_corsica_tooltip: "§G世界之都的倒影：政治、经济、军事与情报随科西嘉线国策逐级成长。§!"
 SCR_timed_gaul_name: "以高卢之名"
 SCR_timed_gaul_name_desc: "高卢的名字重新被念出。村口的旧旗、酒馆里的旧歌、征兵站前的长队，都在替这个名字作证。"
 SCR_timed_scavenging: "废土求生"
 SCR_timed_scavenging_desc: "断墙下能长出麦子，弹坑里能养鱼。剧团把求生写成一门手艺，而不是一句祈祷。"
 SCR_timed_return: "高卢归来"
 SCR_timed_return_desc: "流亡者沿着旧驿道回来，带着外国的口音和本地的姓氏。他们要在废墟上重新登记自己的名字。"
 SCR_timed_three_dawns: "黄昏·正午·黎明"
 SCR_timed_three_dawns_desc: "黄昏属于死者，正午属于活人，黎明属于还没出生的人。高卢把三个时辰都排进了同一张日程表。"
 SCR_timed_blazing_sun: "灿如烈阳"
 SCR_timed_blazing_sun_desc: "舞台的追光第一次照向战场。士兵说那光太亮，军官说那正是他们需要的。"
 SCR_timed_overload: "为高卢过载"
 SCR_timed_overload_desc: "锅炉烧到发红，工人三班倒，机器不许停。剧团的台词只有一句：再快一点。"
 SCR_timed_mobilization: "总动员"
 SCR_timed_mobilization_desc: "从十六岁到六十岁，从工厂到农庄，所有人都收到了同一张纸条。上面没有商量的余地。"
 SCR_timed_borrowed_time: "用未来换当下"
 SCR_timed_borrowed_time_desc: "把明天的钢材、后年的人力和下一个十年的安宁，全部抵押给今天。账本由胜利者来写。"
 SCR_timed_coronation: "加冕彩排"
 SCR_timed_coronation_desc: "皇冠还没戴上，礼仪官已经在纠正每一个角度。剧团从不允许正式演出时出现意外。"
 SCR_timed_final_war: "第二次四皇会战"
 SCR_timed_final_war_desc: "地图上的箭头重新指向维多利亚与莱塔尼亚。这一次，高卢不再只是别人剧本里的注脚。"
 SCR_timed_burn_out: "燃烧殆尽"
 SCR_timed_burn_out_desc: "要么高卢烧尽旧世界，要么旧世界烧尽高卢。剧团把两种结局都写好了，只等观众选择。"
 SCR_timed_night_ops: "暗夜行动"
 SCR_timed_night_ops_desc: "刀锋在夜里比在白天更诚实。剧团的情报员把这句话写进了行动手册的第一页。"
 SCR_timed_parade: "战前阅兵"
 SCR_timed_parade_desc: "靴跟踏过林贡斯的石板，军旗在风里作响。所有人都在看台上，所有人也都知道明天会发生什么。"
 SCR_timed_infected_amnesty: "感染者同胞"
 SCR_timed_infected_amnesty_desc: "剧团第一次把矿工、病人和被遗忘的人请进正厅。不是出于仁慈，而是因为他们也买票。"
 SCR_timed_exercise: "联合军演"
 SCR_timed_exercise_desc: "卡西米尔的骑士与高卢的炮兵在同一片荒原上开火。语言不通，但弹道会说话。"
 SCR_timed_terror: "白色恐怖"
 SCR_timed_terror_desc: "异议被请进后台，再没有出来。前台的掌声更响了，后台的走廊也更安静了。"
 SCR_timed_consensus: "高卢共识"
 SCR_timed_consensus_desc: "各派在旧剧院里坐了一夜，最后只达成一句话：先让高卢活下来。"
 SCR_timed_reflection_tour: "倒影巡演"
 SCR_timed_reflection_tour_desc: "林贡斯的倒影在维多利亚与莱塔尼亚上空展开。观众抬头看见的，是另一个世界的高卢。"
 SCR_corsica_category: "倒影宫廷"
 SCR_corsica_category_desc: "科西嘉莉的宫廷把剧目、军队与加冕礼排进同一本日程。"
 SCR_corsica_coronation_rehearsal: "加冕彩排"
 SCR_corsica_coronation_rehearsal_desc: "把加冕礼先演一遍。礼仪、军队与观众都要到位——正式演出时不许有意外。\n\n§Y效果：§!180 天内政治点数获取 +15%、稳定度 +10%、消费品需求 −5%。"
 SCR_corsica_tour_reflection: "倒影巡演"
 SCR_corsica_tour_reflection_desc: "让林贡斯的倒影去邻国上空演一场。有人会把它当噩梦，有人会把它当预言。\n\n§Y效果：§!180 天内稳定度 +10%、神秘主义漂移 +0.01、政治点数获取 +5%。"
 SCR_corsica_rebuild_fund: "重建基金"
 SCR_corsica_rebuild_fund_desc: "把旧贵族的地窖和投机者的金库一起撬开，换成砖、钢和烟囱。\n\n§Y效果：§!首都州 +1 建筑槽与 1 座民用工厂。"
 SCR_corsica_salvage_flagship: "打捞科西嘉旗舰"
 SCR_corsica_salvage_flagship_desc: "旧海军的旗舰沉在河口。剧团把它捞起来，修好，重新挂上高卢的旗。\n\n§Y效果：§!海军经验 +75，首都州 +1 船坞。"
 SCR_recruit_militia: "剧团招聘：乡土自卫队"
 SCR_recruit_militia_desc: "每个村庄出六个小伙子，发一支枪、一件工兵铲。剧团负责把他们排成队。\n\n§Y效果：§!创建「乡土自卫队」编制并生成 1 个满编师。"
 SCR_corsica_declare_final_war: "第二次四皇会战"
 SCR_corsica_declare_final_war_desc: "把地图上的旧箭头重新擦亮。维多利亚与莱塔尼亚，一起谢幕。\n\n§Y效果：§!对仍存在的 VIC 与 LTN 宣战，目标为完全吞并。"
 SCR_lucian_purge: "白色恐怖"
 SCR_lucian_purge_desc: "异议者被请进后台。前台的掌声会更响，后台的走廊会更安静。\n\n§Y效果：§!90 天内稳定度 +10%、政治点数获取 +10%、战争支持度 −5%。"
 SCR_corsica_congress: "高卢共识"
 SCR_corsica_congress_desc: "各派在旧剧院里坐到天亮，最后只留下一句共同声明。\n\n§Y效果：§!120 天内稳定度 +5%、政治点数获取 +10%、战争支持度 +5%。"
 SCR_decapitation_strike: "斩首行动"
 SCR_decapitation_strike_desc: "先杀他们的指挥官，再让他们的士兵自己决定为谁而战。\n\n§Y效果：§!90 天内行动成果 +15%、破译 +1、陆军攻击 +5%。"
 SCR_tour_requiem: "林贡斯安魂曲"
 SCR_tour_requiem_desc: "为旧世界奏一曲安魂，让活着的人听见自己该站在哪一边。\n\n§Y效果：§!90 天内稳定度 +10%、人口增长 +5%。"
 SCR_tour_empress: "皇女复国记"
 SCR_tour_empress_desc: "新剧目首演。主角不是卢西恩，也不是剧团长——是科西嘉莉。\n\n§Y效果：§!90 天内陆军攻击 +10%、陆军经验获取 +50%。"
