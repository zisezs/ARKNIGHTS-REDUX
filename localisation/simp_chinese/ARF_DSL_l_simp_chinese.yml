#国家精神
 feast_city: "醉生梦死之城"
 feast_city_desc: "在内战频仍的玻利瓦尔，多索雷斯这座以消费主义、麻醉药品、轻工业以及旅游闻名的城邦几乎成为了全玻利瓦尔乃至大半个泰拉的梦想之城。这里是冒险家的天堂、富翁的乐园、战乱之国的和平孤岛……但就在城市之外，醉生梦死世界的一墙之外的地方，充斥着无限度的加班、精神药品与烈酒的滥用，当然还有庸俗娱乐的野蛮刺激。来到这座城市的人，无论贫富都将交出自己的理智，任由药品、烈酒和角斗比赛把控自己的思想与心灵。\n一旦失去这些镇痛药，这座城市的繁华外衣就将降解殆尽，露出它腐朽溃烂的内里。"