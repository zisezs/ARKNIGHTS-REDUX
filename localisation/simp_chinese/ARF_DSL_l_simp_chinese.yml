 #人物
 DSL_Candela_Sanchez: "坎黛拉·桑切斯"
 DSL_Candela_Sanchez_desc: "存在就是一切、一切为了存在，在政权的存在面前无论是意识形态、政治党派、个人立场亦或者财富积累都可以为了这一点而妥协——这就是坎黛拉的政治哲学。\n\n拜她仰赖莱塔尼亚太君鼻息来稳定自己统治的废物市长父亲所赐，出身名门的她深切体会过落入底层的滋味、金钱利益的威力、以及政权的存在对政治家本人的重要性。当她借助外部力量，通过一次不算光彩的秘密行动重返市长宝座的时候，她几乎像是一个行将饿死的人一样疯狂的攫取和巩固自己的权力。她掌控了这小小城邦的各种黑道白道的经济命脉、拥有了城市地上地下的几乎全部武装，通过营造一个醉生梦死的和平幻梦，多索雷斯成为了战乱之国上的一颗璀璨宝石。\n\n坊间传闻她的上台和某个东方大国有关，考虑到多索雷斯大量进口的炎国工业制成品，这说法可能也不是空穴来风——毕竟她确实有能力在社会民族主义者、君主主义者与拉乌尼达的寡头们间谈生意，这样的机会正是炎国政府一直想要的。\n\n重新执掌这个城邦七年之后，这位独裁者已经成为了多索雷斯市的绝对统治者，它的终身市长。但这里是玻利瓦尔，战乱之国的脆弱和平不过是梦幻泡影。这个城市连同她的命运在她的斡旋之中犹如在三个鸡蛋上跳舞，一旦一个鸡蛋破裂粉碎，那么她苦心营造的都市幻梦就将和她自己一起跌倒在地、粉身碎骨。"
 DSL_mayor_for_life: "终身市长"

