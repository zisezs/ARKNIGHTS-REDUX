 kzmse.1.t:0 "第十二次乌卡战争"
 kzmse.1.d:0 "1101年3月，乌萨斯的统一战争把驻军的补给队列拖向内陆。卡瓦莱利亚基的哨卡在换班时少了一个人，而库房后门的锁，已经在夜里被人换过一遍了。\n\n那天清晨后门打开，外面站满了人。他们没有番号、没有统一制服，一半人连像样的护具都没有，只带了各自藏了三年的东西——遣散纸、盾牌、账簿、工具，和一把不知道从哪儿弄来的骑枪。当年有四十六面印着家族纹章的盾牌全部回到了卡西米尔的土地，没有一面被丢下；今天出库的那一面，人们也打算照同样的规矩带回来。\n\n玛恩纳·临光把那封压了多年的辞职信撕成两半，念出了一个从不曾出现在任何文件上的名字。第十二次乌卡战争没有宣战书，只有天亮。"
 kzmse.1.a:0 "§T家训是，不畏苦暗！§!"
 KZM_super_event_twelfth_war_title:0 "第十二次乌卡战争"
 KZM_super_event_twelfth_war_quote:0 "「天要亮了。在极夜尽头亮起来的那种光，不是温柔的光。」\n——卡瓦莱利亚基，起义第一日"
 KZM_super_event_twelfth_war_close:0 "§T家训是，不畏苦暗！§!"
