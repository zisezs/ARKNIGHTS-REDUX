# ---------------------------- 顾问特质说明（数值由引擎自动列出，此处只写人话） ----------------------------

YAN_Taifu_advisor_desc:0 "三公之首坐在政事堂里，把能谈的先在纸上谈一遍，再决定要不要动人。他署名的条陈下来，六部办事的次序肉眼可见地变了。"
YAN_Taiwei_advisor_desc:0 "主兵的这一位在朝堂上从不给自己留余地。他一句话，校场的号子就密了三分——也难怪有人因此睡不安稳。"
YAN_Ning_Chunqiu_advisor_desc:0 "她带回来的不是一纸盟约，而是让对面愿意坐下来听一句话的交情。四方使节开始把百灶算作必经的一站。"
YAN_Liang_Xun_advisor_desc:0 "管过钱粮的人最清楚工程卡在哪一环。他重排了工期与料单，尚蜀的城渠因此提早合龙，谁也没多等一天。"
YAN_Chun_advisor_desc:0 "司岁台的值夜册上，名字被圈了又圈。她盯着的从来不是岁，而是每一个可能把岁放出来的人。"
YAN_Zuo_Le_advisor_desc:0 "年轻的监正把「监视名册」改成了「共事名册」，眼睛反倒比从前更多——愿意主动来报消息的人，也多起来了。"
YAN_Wei_Yanwu_advisor_desc:0 "龙门总督的印信在百灶不好使，他的人脉却是。他一句话能省下的公文，比御案上摞起来的还厚。"
YAN_Yu_Cheng_advisor_desc:0 "他重开旧卷宗不为翻案本身，只为让还活着的人敢把话说完。大理寺的门槛，从那天起没那么高了。"
YAN_Lao_Tianshi_advisor_desc:0 "他在学宫里只待了三天，留下的三页笔记替源石技艺的后进省了十年弯路。旁人问他师承，他说自己只是在厨下看火看得久。"
YAN_Zuo_Xuanliao_advisor_desc:0 "老将在玉门的城墙上站了四十年，不用看地图也知道风从哪一面来。士们把他的名字刻进了工事的砖缝。"
YAN_Chen_Huijie_advisor_desc:0 "办案讲究快、准、不留尾巴。她把同一套东西搬到参谋席上：先插进去，再让合不上。"
YAN_Chong_Yue_advisor_desc:0 "教头下操不问出身，只问还能不能再走一遍。他练过兵的地方，伤兵最少，肯往前冲的人最多。"
YAN_Lao_Tianshi_high_command_desc:0 "术师成建制地上阵，是他点的头。头一回演练收兵，观摩的老将们在原地站了很久，谁也没先开口。"
YAN_Liang_Xun_high_command_desc:0 "他算过一支大军一天要吃掉几座城的粮，所以他的命令单上永远先写辎重，再写进攻。"
YAN_Taiwei_army_chief_desc:0 "他把进攻写成条令：不必等对面布完阵，先把自家拳头砸进去。军中自此只认一件事——谁先动手，谁定节奏。"
YAN_Zuo_Xuanliao_army_chief_desc:0 "他任内的陆军条例反反复复只有一句话：先把阵脚站稳，再谈别的。"
YAN_Wei_Yanwu_army_chief_desc:0 "总督调兵不看面子看时机。将领们很快就发现，他批下来的机动余地比兵部给的还宽。"
YAN_Taifu_theorist_desc:0 "他把历次国策的成例编成了一部章程。后来的人照着办，就少绕三年路——这是他能给慢节奏的朝堂最实在的东西。"
YAN_Jun_theorist_desc:0 "口含天宪的那一位相信，写得够细的规矩能替人管住人心，连也一样。他的稿子送进修律馆，就没有再被改回来过。"
YAN_Ling_theorist_desc:0 "她讲安定，不讲进取。朝堂上肯听她的人不多，可凡是听了的地方，当年的凶案就少了几桩。"
YAN_Ling_advisor_desc:0 "织梦的人不常上朝，她只在梦里把该拦的事先拦一遍。醒来递进宫的那道条陈，往往比边关的奏报还早三天。"
YAN_Nian_advisor_desc:0 "她嫌工部的炉子太钝，索性自己开了一间。玄极巨兵的关节件从这里出去，连带着几条流水线的良率一起被抬了起来。"
YAN_Xi_advisor_desc:0 "《拙山尽起图》挂出去的那一年，四方使节都想方设法要一幅真迹。她从不替谁说话，名气替她说了。"
YAN_Shu_advisor_desc:0 "他看荒年的本事比看军报还细。仓廪先满起来，队伍才走得出玉门的风沙。"
YAN_Yu_advisor_desc:0 "余味居的灶子搬进军中那天起，前线的伙房就换了章程。兵士们说不出什么道理，只是更肯守自己那段墙。"
YAN_Chen_Huijie_special_desc:0 "书刀在她手里只干一件事：把被抹掉的名字一页页翻回来。将士们因此信了一件事——名字不会被随便涂改，战功也不会。"

# ---------------------------- 路线动态精神：每个国策的具体 BUFF 提示 ----------------------------

YAN_route_politics:0 "承平之治"
YAN_route_politics_desc:0 "太师掌教化，太傅辅政，太尉主兵，六部各安其位。朝堂上没人再急着出奇策——把旧规走稳，本身就是本事。此后每走稳一步，这份治世便厚一分。"

YAN_route_sui:0 "岁陵司秉烛"
YAN_route_sui_desc:0 "秉烛人夜夜巡陵，记档、勘验、轮值。地脉的读数一日日压下去，百灶的夜也一日日安下去。"

YAN_route_military:0 "禁军整训"
YAN_route_military_desc:0 "校场上的号声密了，革甲换成了新的。承平之兵重新学会一件事：把队列走整齐，也是要练的。"

YAN_route_industry:0 "百灶工造"
YAN_route_industry_desc:0 "能源桩往地下再扎一截，工坊三班连轴。百灶的灯，从此夜里也不熄。"

YAN_route_research:0 "百灶学宫"
YAN_route_research_desc:0 "学宫重开，四院并立。肯较真的读书人聚到一处，大炎便有了自己的脑子。"

YAN_route_local:0 "十九宣政司"
YAN_route_local_desc:0 "宣政司各领其地，府、州、县层层向六部负责。中央的手不必伸得太远，可账目得清楚。"

YAN_route_diplomacy:0 "四方馆"
YAN_route_diplomacy_desc:0 "礼部重开四方馆，迎来送往。大炎太久不曾主动与人打交道，这一步，是姿态也是国策。"


