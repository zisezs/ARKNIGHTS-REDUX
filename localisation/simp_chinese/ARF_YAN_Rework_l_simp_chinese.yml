# ---------------------------- 决议分类与机制读数 ----------------------------

YAN_Suiling_Affairs:0 "岁陵司"

YAN_sui_status_calm:0 "\n§G岁兽苏醒度：平稳§!——岁陵安静，司岁台的记档里只有几行闲笔。"
YAN_sui_status_stirring:0 "\n§Y岁兽苏醒度：渐醒§!——地脉的读数在动，秉烛人开始加派人手。"
YAN_sui_status_warning:0 "\n§O岁兽苏醒度：警戒§!——岁陵的封印已不堪重负，再拖下去就要出事。"
YAN_sui_status_critical:0 "\n§R岁兽苏醒度：危急§!——岁陵随时会裂，必须立刻决断。"

YAN_shudao_status_intact:0 "\n§G书刀完整度：完好§!——刀锋无损，仍可删改历史。"
YAN_shudao_status_worn:0 "\n§Y书刀完整度：磨损§!——刀口已经卷了，再用下去撑不了几回。"
YAN_shudao_status_broken:0 "\n§R书刀完整度：崩裂§!——书刀已卷刃，太尉一系正盯着天镜阁。"

YAN_bufan_status_none:0 "\n§T不反准备度：未备§!——血脉未淬，源石未引。"
YAN_bufan_status_preparing:0 "\n§Y不反准备度：筹备中§!——不反的引子已经备下了一些。"
YAN_bufan_status_close:0 "\n§O不反准备度：将成§!——再走一步，就能送真龙上路。"
YAN_bufan_status_ready:0 "\n§R不反准备度：就绪§!——只要真龙一句话，随时可以同归。"

YAN_agent_status_hostile:0 "\n§R代理人信任：敌对§!——代理人已开始避开司岁台的眼线。"
YAN_agent_status_wary:0 "\n§T代理人信任：戒备§!——他们愿意谈，但都留着后手。"
YAN_agent_status_cooperative:0 "\n§G代理人信任：合作§!——几位代理人愿意为大炎办些不方便的事。"
YAN_agent_status_family:0 "\n§B代理人信任：一家§!——十二片碎片终于坐到了一张桌上。"

# ---------------------------- 决议 ----------------------------

YAN_decision_suiling_report:0 "岁陵司近况"
YAN_decision_suiling_report_desc:0 "禀真龙：岁陵、天镜阁、不反库房与十二代理人的近况，都记在这张折子上。看与不看，折子都要送到。"

YAN_decision_sishuitai_alert:0 "颁司岁台警戒令"
YAN_decision_sishuitai_alert_desc:0 "调秉烛人巡陵，加派术师复检地脉，把警戒令逐级传下去。声势闹得大些，岁陵那边便会安分几日——至少看起来如此。"

YAN_decision_zenith_patrol:0 "秉烛人巡陵"
YAN_decision_zenith_patrol_desc:0 "让秉烛人下到年久失修的岁陵夹层去，实地看一看封印，也顺便与守在外围的代理人打个照面、说几句好话。"

YAN_decision_reinforce_seal:0 "加固岁陵封印"
YAN_decision_reinforce_seal_desc:0 "倾国库之力再封一次岁陵：重铸镇石、改派术师、迁走附近的村屯。压得住一时，也压得万人怨声。"

YAN_decision_erase_history:0 "书刀删改"
YAN_decision_erase_history_desc:0 "以书刀删去史册上的一段记载，连带抹掉那个名字在大炎人记忆里的分量。岁陵那边会因此安静一些——刀锋也会更薄一些。"

YAN_decision_seal_shudao:0 "封存书刀"
YAN_decision_seal_shudao_desc:0 "将书刀重新封入天镜阁的旧匣，附殿大学士轮流看守。不用它，它就还是那柄能保大炎体面的刀。"

YAN_decision_prepare_bufan:0 "筹备不反"
YAN_decision_prepare_bufan_desc:0 "以真龙血脉为引，取源石为薪，把一切备到「只差一个人点头」的地步。这件事一旦开始，便不能回头。"

YAN_decision_launch_bufan:0 "启动不反"
YAN_decision_launch_bufan_desc:0 "真龙亲赴岁陵，以自身为引点燃不反。此举可一朝解大炎千年之患，代价是当朝真龙与岁同归于尽——此后史书如何叙他，全看留在世上的人。"

YAN_decision_reward_agents:0 "嘉奖代理人"
YAN_decision_reward_agents_desc:0 "给愿意共事的几位代理人一些实在的体面：敕封、宅邸、祭田，或者只是让司岁台别再无休止地跟着。"

YAN_decision_screen_agents:0 "甄别代理人"
YAN_decision_screen_agents_desc:0 "彻查十二片碎片的行止，把可疑的逐一登记造册、调离要地。朝堂会因此安心，代理人也会因此更远。"

YAN_decision_invite_wang:0 "请望入局"
YAN_decision_invite_wang_desc:0 "正式请望入岁陵这盘棋。他来不来另说，但这一步落定之后，岁陵的终局就只剩黑白两种走法。"

YAN_decision_purge_demon_threat:0 "清除邪魔威胁"
YAN_decision_purge_demon_threat_desc:0 "北境的邪魔本不该认什么国界，可它们如今却和乌萨斯纠缠得难分彼此。秉烛人把一张图铺在殿上：从冰原一路南下，越过山口与冻河，直指大炎的边城。真龙看罢只问了一句——是等着它们找上门，还是我们把战场推回去？\n\n檄文随后送往圣骏堡。大炎的刀锋，第一次朝北。"
YAN_purge_demon_threat_tt:0 "§Y乌萨斯帝国§!将获得民族精神§R寸步不让§!：陆军攻击 §G+10%§!、陆军防御 §G+10%§!、工厂产出 §G+50%§!"

# ---------------------------- 事件 ----------------------------

yan_sui.1.t:0 "岁陵传警"
yan_sui.1.d:0 "司岁台的急报是子夜送进禁城的：岁陵夹层的镇石同时发热，三处封记自己裂了。秉烛人不敢擅动，只把折子递了上去。\n\n「按旧例，该加派人手了。」监正的声音很轻，「可旧例里没写，封记会自己裂。」"
yan_sui.1.a:0 "加派秉烛人，此事不可外传。"

yan_sui.2.t:0 "岁兽之乱"
yan_sui.2.d:0 "百灶先乱，接着是邙山。夜里的街巷满是伥物的动静，巡防营的号令一夜间变了三次。天亮时，城里的人发现很多铺子不再开门——而城外的官道上，多了些举着旗子赶路的人。\n\n大炎为拖延付出的代价，终于开始收了。"
yan_sui.2.a:0 "传令各处弹压。"

yan_sui.3.t:0 "书刀案"
yan_sui.3.d:0 "书刀不见了。天镜阁连夜封门，殿前司的人进进出出，谁也不敢看谁的眼睛。\n\n有传言说刀在太尉手里，也有说在陈晖洁手里。无论哪一种，都意味着天镜阁以后再不能替谁改史了。"
yan_sui.3.a:0 "封锁消息，彻查到底。"

yan_sui.4.t:0 "代理人离心"
yan_sui.4.d:0 "司岁台的回报一封比一封含糊：几位代理人已经很久没有应召了，守在外围的秉烛人说，有人搬走了，连门都没关。\n\n碎片们开始把大炎当成需要防备的一方。"
yan_sui.4.a:0 "备些薄礼，再去请一次。"

yan_sui.10.t:0 "岁陵决战"
yan_sui.10.d:0 "岁陵这一夜不再平静。棋盘、封印、源石与血脉，所有这些拖了很多年的东西，都在同一处收了账。\n\n天亮之前，会有人从陵里走出来，告诉等待的人：谁活下来了，大炎欠了谁。"
yan_sui.10.a:0 "静候结果。"
yan_sui.10.b:0 "昭告天下，大炎自此无岁。"

yan_sui.11.t:0 "不反"
yan_sui.11.d:0 "真龙在岁陵深处点燃了不反。那一夜，整个百灶都看见东边的天在发白，却听不见一点声音。\n\n岁兽死了，岁陵静了。留下的只是一句话：那一位再没有回来。"
yan_sui.11.a:0 "举国缟素。"

# ---------------------------- 国策 · 起点 ----------------------------

YAN_True_Dragon_Court:0 "真龙临朝"
YAN_True_Dragon_Court_desc:0 "封禅已毕，真龙坐回那张空了很久的椅子。丹墀之下，太傅与太尉各自垂着眼，没人知道他先要动的是岁陵、旧案，还是那位远在龙门的兄长。"
YAN_Xuanji_giant_armor_tt:0 "重装甲研究加速（装甲类 +50%，共 2 次），玄极巨兵实验装甲师可扩编成军"
YAN_Start_Bufan_tt:0 "解锁「启动不反」决议，需在不反准备度满后执行"
YAN_Suiling_Stirring_tt:0 "岁兽苏醒度设为 45，此后持「岁兽之患」时每月上涨"

# ---------------------------- 国策 · 政治线 ----------------------------

YAN_Three_Dukes:0 "三公议政"
YAN_Three_Dukes_desc:0 "太师掌教化，太傅辅政，太尉主兵。三公各守一摊，六部各领一事——朝堂从此慢下来，但也少有人能一手遮天。"

YAN_Taifu_Strategy:0 "太傅：上兵伐谋"
YAN_Taifu_Strategy_desc:0 "太傅把一卷棋谱推到御案上：岁未必要斩，代理人未必要杀，旧案未必要瞒。能靠谈、靠换、靠时间了结的，就不该拿人命去填。"

YAN_Grand_Examination:0 "设置大考"
YAN_Grand_Examination_desc:0 "重开大考，以策问取士。太傅要的不只是新官，是一批肯把「岁」当成政务、而不是忌讳来谈的年轻人。"

YAN_Bingzhu_New_System:0 "秉烛新制"
YAN_Bingzhu_New_System_desc:0 "司岁台添了「共事」一职。秉烛人仍旧夜行，只是手里的烛，从今往后也替代理人照路。"

YAN_Taiwei_Rearmament:0 "太尉：整军经武"
YAN_Taiwei_Rearmament_desc:0 "太尉的话向来只有一句：祸在，就除；有刀，就用。校场上的号声比往年密了许多，朝堂上的争论也尖了许多。"

YAN_Yumen_Fire:0 "玉门开火"
YAN_Yumen_Fire_desc:0 "玉门全线备战，炮口不再只对着大漠。军报上，太尉只批了四个字——不必留情。"

YAN_Seize_Shudao:0 "夺取书刀"
YAN_Seize_Shudao_desc:0 "书刀锁在天镜阁顶楼，需监正与第四代理人的钥匙。太尉的人推开那扇门时，学士们没有拦。"

YAN_Start_Bufan:0 "启动不反"
YAN_Start_Bufan_desc:0 "不反的引子已经备齐，只等真龙点头。这一点头之后，大炎会失去它的天子，也会永远失去岁。"

YAN_Yumen_Mutual_Ruin:0 "玉门同归"
YAN_Yumen_Mutual_Ruin_desc:0 "另一条更硬的路：不启不反，把玉门整条防线压上岁陵，用炮火与人命把岁填死。这条路不体面，却不必真龙去死。"

YAN_Taishi_Rehab:0 "太师平反"
YAN_Taishi_Rehab_desc:0 "旧案像一根刺，扎在大炎皮肉里四十年。既然要谈岁、谈代理人，就先从自己家这笔账谈起。"

YAN_Probe_Old_Case:0 "彻查旧案"
YAN_Probe_Old_Case_desc:0 "卷宗重开，谁主谋、谁沉默、谁改过笔录，一条条摆到光下——包括当年提刀上殿的那位皇太子。"

YAN_Pardon_Gu_Quan:0 "赦免顾筌、宁述"
YAN_Pardon_Gu_Quan_desc:0 "顾筌已死，宁述老了。赦书一下，大炎等于当众认下：当年那句「天下一白」，是对的。"

YAN_Huang_Meets_Ning_Yin:0 "煌与宁茵相认"
YAN_Huang_Meets_Ning_Yin_desc:0 "一桩被旧案拆散的家事，终于有了一天能坐下来相认。朝堂翻案，落到人身上，不过是让两个人叫出彼此的名字。"

YAN_Tianxia_Yibai:0 "天下一白"
YAN_Tianxia_Yibai_desc:0 "最后一页卷宗合上，压在百官心头的那口冤气散了。从此大炎不必再替一个错误的名字守密——天下一白，人心自安。"

YAN_Sishuitai_Reform:0 "司岁台改革"
YAN_Sishuitai_Reform_desc:0 "把司岁台从「看坟的衙门」里拽出来：该查的照查，该记的照记，只是不再事事只做一件事——瞒。"

YAN_Chun_Resigns:0 "椿辞职"
YAN_Chun_Resigns_desc:0 "椿递辞表时只说了半句：「那个秘密，我守得比岁陵还久了。」剩下半句，她咽了回去。"

YAN_Zuo_Le_takes_office:0 "左乐接任监正"
YAN_Zuo_Le_takes_office_desc:0 "年轻的秉烛人接过司岁台。第一道命令不是加派人手，而是把「监视名册」改成「共事名册」。"

YAN_Bingzhu_people_new:0 "秉烛人新制"
YAN_Bingzhu_people_new_desc:0 "新章程颁下：巡陵、存档、勘验之外，秉烛人有权代朝廷与代理人交涉。烛照到的地方，不再只有嫌疑。"

YAN_Shudao_back_to_Tianjingge:0 "书刀归天镜阁"
YAN_Shudao_back_to_Tianjingge_desc:0 "书刀请回天镜阁，交回学士之手。刀还在，只是不再是谁想拿就能拿的东西。"

YAN_Shudao_Sealed:0 "书刀封存"
YAN_Shudao_Sealed_desc:0 "封匣、加锁、附殿大学士轮值看管。不让任何人用它——因为任何人都可能想用它。"

YAN_Chen_Huijie_holds_shudao:0 "陈晖洁持书刀"
YAN_Chen_Huijie_holds_shudao_desc:0 "书刀交到陈晖洁手上。她不打算删改任何东西，只想把那些被删改过的，一页页翻回来。"

YAN_Tiankui_Sword:0 "天喟之剑"
YAN_Tiankui_Sword_desc:0 "刀锋出鞘那夜，龙门近卫局的人只看见她一个人走进雨里。回来时鞋上全是泥，赤霄剑却收得很稳。"

YAN_True_Dragon_and_Wei:0 "真龙与魏彦吾"
YAN_True_Dragon_and_Wei_desc:0 "龙门与百灶之间那条线，说到底是两兄弟的事。真龙决定先动这一步——不论对面接不接。"

YAN_Brothers_standoff:0 "兄弟对峙"
YAN_Brothers_standoff_desc:0 "会面没有称兄道弟，也没有掀桌。两个人都清楚对方的筹码，也清楚再耗下去会便宜谁。"

YAN_Brothers_one_heart:0 "兄弟同心"
YAN_Brothers_one_heart_desc:0 "龙门的人马开始向百灶靠拢。大炎头一回不必把一半心思花在提防自己人身上——这比多出十个师管用。"

# ---------------------------- 国策 · 岁兽线 ----------------------------

YAN_Suiling_Stirring:0 "岁陵惊动"
YAN_Suiling_Stirring_desc:0 "司岁台的观测回报：陵下巨物呼吸转沉，隐有翻身之象——比预想中来得早。"

YAN_Sishuitai_Alert:0 "司岁台警戒"
YAN_Sishuitai_Alert_desc:0 "加派人手、复勘封印、重排轮值。压不下根子上的东西，至少把发作的时辰往后推。"

YAN_Watch_Agents:0 "监视代理人"
YAN_Watch_Agents_desc:0 "十二片碎片的行止逐日记档。记得越细，越有人觉得他们不过是想过日子的普通人——这才是最让人不安的地方。"

YAN_Purge_Agents:0 "诛杀代理人"
YAN_Purge_Agents_desc:0 "既然是岁的碎片，就不该留。诛杀令一下，朝堂上空出的位子，很快被别的东西填上。"

YAN_Agents_Cooperation:0 "代理人合作"
YAN_Agents_Cooperation_desc:0 "大炎终于愿意承认：这十二个「碎片」首先是十二个人。请他们入朝、议事、出工，而不是只在名册上被标注为「待观」。"

YAN_Chong_Yue_enters:0 "重岳入岁陵"
YAN_Chong_Yue_enters_desc:0 "执掌「武」的那一片自己走进岁陵。他说得干脆：「这债不是我的，可守门的事，我熟。」"

YAN_Ling_and_Jun_dream:0 "令、均织梦"
YAN_Ling_and_Jun_dream_desc:0 "一个织梦，一个写律。两人在岁陵外围织了一层看不见的封条——梦里定下的规矩，也会落在实处。"

YAN_Nian_and_Xi_ward:0 "年、夕镇伥"
YAN_Nian_and_Xi_ward_desc:0 "年带着铸造的镇压器，夕以画境圈住游荡的伥物。百灶郊外的夜，头一回静得让人不习惯。"

YAN_Shu_and_Yu_settle:0 "黍、余安民"
YAN_Shu_and_Yu_settle_desc:0 "黍去修仓廪，余去管流民。岁陵的事还没了结，可先得让活着的人有饭可吃、有处可去。"

YAN_Shudao_research:0 "书刀研究"
YAN_Shudao_research_desc:0 "学士们获准研究书刀本身：它删掉的究竟是字，还是字背后的记忆？这件事想清楚之前，谁也不敢再用它。"

YAN_Erase_history:0 "删改历史"
YAN_Erase_history_desc:0 "一笔落下，某段记载消失了。岁陵那边随之安静，可史官在灯下发现，自己已经想不起刚刚删掉的是什么。"

YAN_Erase_Sui_word:0 "抹去「岁」字"
YAN_Erase_Sui_word_desc:0 "把「岁」从史册与告示里一点点抹掉。名字没了，祸患似乎也少了一分力气——代价是提笔的人自己也开始忘事。"

YAN_Weaken_Sui:0 "岁兽意识削弱"
YAN_Weaken_Sui_desc:0 "岁陵深处的意识因此迟缓。它还在，只是不再那么容易醒。"

YAN_Bufan_prepare:0 "不反准备"
YAN_Bufan_prepare_desc:0 "不反的库房重新启用：点炭、验石、试引。所有人都在做准备，所有人都不往御案那边看。"

YAN_True_Dragon_blood:0 "真龙血脉"
YAN_True_Dragon_blood_desc:0 "取真龙之血为引，淬进不反的核心。医官的手很稳，殿里没人说话。"

YAN_Bufan_Originium_Rite:0 "不反源石"
YAN_Bufan_Originium_Rite_desc:0 "整块不反源石嵌进岁陵的引座。此后只等一个人，站到它前面。"

YAN_Wang_chess:0 "望的棋局"
YAN_Wang_chess_desc:0 "望入岁陵，不为斩岁，只为与它下一盘棋。棋盘铺开之后，大炎头一回有了不必流血的可能。"

YAN_181_black_stones:0 "一百八十一黑子"
YAN_181_black_stones_desc:0 "一百八十一枚黑子落定，每一枚都对岁陵的一条脉络。望要把这盘棋下成和局——和局里，人可以替兽。"

YAN_Suiling_Decisive:0 "岁陵决战"
YAN_Suiling_Decisive_desc:0 "倾国之战落向岁陵：凭十二人的信任，凭不反的准备。两样都不足，便是最坏的那一种收场。"
YAN_Suiling_Decisive_wang_tt:0 "岁陵一战由望收官：移除「岁兽之患」，获得「望之枷锁」「新岁之影」与「岁兽之祸终结」"
YAN_Suiling_Decisive_bufan_tt:0 "真龙亲启不反：移除「岁兽之患」，获得「岁兽之祸终结」与「真龙陨落」"
YAN_Suiling_Decisive_fail_tt:0 "准备不足，岁陵失守：获得「岁兽之乱」与「巨兽苏醒」"

YAN_Wang_replaces_Sui:0 "望取代岁"
YAN_Wang_replaces_Sui_desc:0 "他把自己换成岁，锁进永眠，以未来近乎永恒的折磨为代价——与永世不得超生，没有分别。"

# ---------------------------- 国策 · 军事线 ----------------------------

YAN_Military_Reform:0 "军事改革"
YAN_Military_Reform_desc:0 "承平太久，军里早习惯了按例操演。太尉要改的不是编制，是那股「反正打不起来」的气。"

YAN_Yumen_Fortress:0 "玉门要塞"
YAN_Yumen_Fortress_desc:0 "玉门是西北的锁，也是岁陵的门。工事修到城墙之外，烽燧接成一线。"

YAN_Pingfeng_Guard:0 "屏风卫"
YAN_Pingfeng_Guard_desc:0 "城墙外再挂一道会走的墙。不求进取，只求墙后的人能睡个整觉。"

YAN_Shajq:0 "沙渠"
YAN_Shajq_desc:0 "沿旧河道掘渠排沙，让兵马在天灾与风沙里也能走得动、扎得下。"

YAN_Tianzai_fort:0 "天灾工事"
YAN_Tianzai_fort_desc:0 "照天灾的脾气修掩体与储水：风来的日子不进不退，只在墙后等它过去。"

YAN_Wangfeng_Festival:0 "望烽节"
YAN_Wangfeng_Festival_desc:0 "开春点烽火、擂征鼓，三日不息。告诉城里的人：城池无恙，山河无恙，大炎无恙。"

YAN_Imperial_Guard_Expansion:0 "禁军扩编"
YAN_Imperial_Guard_Expansion_desc:0 "禁军由六镇再添，京畿与外省要地都驻上精锐。人多则粮饷重，可国都的安全值这个价。"

YAN_Imperial_Guard:0 "御林卫"
YAN_Imperial_Guard_desc:0 "御林卫专守宫城与京师，遇乱先保中枢。他们站在那里，就是给百官吃的一颗定心丸。"

YAN_Patrol_Battalions:0 "巡防营"
YAN_Patrol_Battalions_desc:0 "巡防营铺到州县去：缉盗、查盐、弹压械斗。这些琐碎事，才是稳定最实在的底子。"

YAN_Border_Army_Training:0 "边军整训"
YAN_Border_Army_Training_desc:0 "边军常年守备，疏于操演。整训的重点不在进攻，而在风沙与严寒里还能不能站住岗。"

YAN_Tianshi_office:0 "天师府"
YAN_Tianshi_office_desc:0 "重整天师府，把散在江湖里的术师收归编制。土木、农业、天灾信使各成一门——他们要对付的不是人。"

YAN_Tianshi_support_company:0 "天师术师支援连"
YAN_Tianshi_support_company_desc:0 "每镇配属一队天师术师：勘地脉、破邪术、镇伥物。有他们在，部队在异常地带才不至于手足无措。"

YAN_Qintianjian:0 "钦天监"
YAN_Qintianjian_desc:0 "钦天监不只观星，也要算出天灾来的时辰。算准一次，省下的就是几座城。"

YAN_Originium_arts:0 "源石技艺"
YAN_Originium_arts_desc:0 "把源石技艺从术师秘传改成军学：可控、可教、可量产，才谈得上在战场上用。"

YAN_Xuanji_giant_armor:0 "玄极巨兵"
YAN_Xuanji_giant_armor_desc:0 "玄极巨兵是炎国最大胆的造物，也是年最得意的作品。能不能用、会不会烧起来，都得等它先动了才知。"

YAN_Crush_Shanhaizhong:0 "剿灭山海众"
YAN_Crush_Shanhaizhong_desc:0 "山海众的根扎得太深，谈是谈不掉的。既如此，只好一段段地拔。"

YAN_Amnesty_Shanhaizhong:0 "招安山海众"
YAN_Amnesty_Shanhaizhong_desc:0 "与其把山海众逼成永远的清剿对象，不如给他们一个将功补过的名分——比如，去对付更凶的东西。"

# ---------------------------- 国策 · 工业线 ----------------------------

YAN_Baizao_Energy:0 "百灶能源桩"
YAN_Baizao_Energy_desc:0 "百灶的能源桩再往深处扎一截。城会走得更远，付出的油与料也更多。"

YAN_Originium_vein_cost:0 "源石矿脉消耗"
YAN_Originium_vein_cost_desc:0 "采掘再狠一些，同一处矿脉能榨出更多东西。至于这片地被榨空之后怎么办，那是下一代的事。"

YAN_Dahuang_Agriculture:0 "大荒城农业"
YAN_Dahuang_Agriculture_desc:0 "渠、仓、屯田一并收拾出来。大军能不能打，先看这里的粮能不能撑。"

YAN_Twelve_towers:0 "十二楼五城"
YAN_Twelve_towers_desc:0 "十二楼五城全面开工。大炎的城市不只是住人的地方——它们会走、会躲，会把天灾甩在身后。"

YAN_Longmen_trade:0 "龙门贸易"
YAN_Longmen_trade_desc:0 "龙门是东陆的钱袋子。把口岸、关税与商路理顺，百灶的账面自然好看。"

YAN_Tianjingge_expansion:0 "天镜阁扩建"
YAN_Tianjingge_expansion_desc:0 "天镜阁增置书库与学士。一个能改史的机构，最该先做的是把史收全。"

# ---------------------------- 国策 · 科研线 ----------------------------

YAN_Baizao_Academy:0 "百灶学宫"
YAN_Baizao_Academy_desc:0 "百灶学宫重开大门：算学、工造、医理、律令各设一院。大炎要的是一批肯较真的读书人。"

YAN_Six_ministries_college:0 "六部学院"
YAN_Six_ministries_college_desc:0 "六部各办学院，把衙门里的门道编成教材。官吏不再只靠师徒相授，政务才有统一的尺子。"

YAN_Tianshi_originium_study:0 "天师府源石技艺"
YAN_Tianshi_originium_study_desc:0 "天师府与学宫合开讲席：把玄的东西写成能验的条目，术法才不至于只靠天赋。"
YAN_Tianshi_originium_study_tt:0 "解锁源石技艺研究讲席与术师支援"

YAN_Qintianjian_forecast:0 "钦天监天灾预测"
YAN_Qintianjian_forecast_desc:0 "以地动、风向与水质为凭，推算天灾来的时辰。预测比抵御便宜得多。"

YAN_Behemoth_research:0 "巨兽研究"
YAN_Behemoth_research_desc:0 "整理历代诛神与镇岁的文书，研究巨兽的脾性、弱点与来历。要跟天敌打交道，先把它当对手来认识。"

YAN_Shudao_history_research:0 "书刀历史研究"
YAN_Shudao_history_research_desc:0 "以书刀为对象，研究「历史被改过多少次」。想明白这件事，比多修十座城更能让朝廷稳下来。"

# ---------------------------- 国策 · 地方线 ----------------------------

YAN_Local_Governance:0 "地方治理"
YAN_Local_Governance_desc:0 "宣政司与州府重新划界、定权、核账。中央的手不必伸得太远，但得知道各地到底有多少东西。"

YAN_Longmen_governance:0 "龙门"
YAN_Longmen_governance_desc:0 "龙门不归宣政司，由总督任行政长官。真龙要先理顺这层关系——那座城攥着东陆的钱与人。"
YAN_Longmen_governance_tt:0 "解锁魏彦吾与陈晖洁顾问，龙门方向的贸易与警务加成"

YAN_Shangshu_governance:0 "尚蜀"
YAN_Shangshu_governance_desc:0 "尚蜀风高，山道难行，兵匪都不易根除。理清这里的仓与驿，等于给大炎多留一条退路。"

YAN_Yumen_governance:0 "玉门"
YAN_Yumen_governance_desc:0 "玉门既是边关也是擂台，军民杂处、武馆林立。把这里收进秩序，西北才算真的稳住。"
YAN_Yumen_governance_tt:0 "解锁玉门戍卫师的强化与玉门方向的防御加成"

YAN_Dahuang_governance:0 "大荒城"
YAN_Dahuang_governance_desc:0 "大荒城地广人稀，屯田与水利是命脉。多开一道渠，边军就少饿一天。"

YAN_Mangshan_governance:0 "邙山"
YAN_Mangshan_governance_desc:0 "邙山靠着岁陵，器物多化为伥，人与伥同住一镇。镇压、安民、改设巡检司，一件都不能少。"

YAN_Baizao_governance:0 "百灶"
YAN_Baizao_governance_desc:0 "百灶是天子脚下，也是大炎的门面。把这里的学宫、工坊与市面经营好，天下就有了样板。"

# ---------------------------- 国策 · 外交线 ----------------------------

YAN_Yan_Diplomacy:0 "大炎外交"
YAN_Yan_Diplomacy_desc:0 "大炎太久不曾主动与人打交道。重新打开礼部与四方馆的门，是国策，也是姿态。"

YAN_Rhodes_island:0 "罗德岛合作"
YAN_Rhodes_island_desc:0 "与罗德岛签下合作：矿石病的防治、感染者的安置，以及一些不便由朝廷出面的事，都可交给他们。"

YAN_Ussuri_border:0 "乌萨斯边境"
YAN_Ussuri_border_desc:0 "北边的邻居从不安静。加固关隘、整备边军，同时留出谈判的余地。"

YAN_Aegir_immigration:0 "阿戈尔移民"
YAN_Aegir_immigration_desc:0 "接纳从东部海域上岸的阿戈尔人。他们带来的不只是人手，还有大炎尚未学会的海洋。"

YAN_Shanhaizhong_issue:0 "山海众问题"
YAN_Shanhaizhong_issue_desc:0 "把山海众当成一件外交与内政交织的旧案来办：该清的清，该议的议，不再一味硬打。"
YAN_Shanhaizhong_issue_tt:0 "移除「山海众渗透」"

YAN_Behemoth_diplomacy:0 "巨兽外交"
YAN_Behemoth_diplomacy_desc:0 "与后、矩、睚这些仍在沉睡的存在接触。跟天的旧敌谈条件，本是荒唐事——可总比再打一场诛神大战便宜。"

# ---------------------------- 其他 ----------------------------

YAN_xuanji_armor:0 "玄极巨兵装甲"
YAN_Sun_Zaizhi_desc:0 "大炎旧臣，主张以乡约与宗族自治替朝廷分忧。他那一套「先安人心、再谈国是」的说法，在承平年代颇有人缘。"
YAN_Li_Shouting_desc:0 "出身下层的工会组织者，主张把源石工业的利润还给做工的人。他的话在百灶的工人区很有分量，在朝堂上则不受欢迎。"

