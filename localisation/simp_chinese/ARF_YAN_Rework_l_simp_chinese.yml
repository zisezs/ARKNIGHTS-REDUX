# ---------------------------- 民族精神（开局） ----------------------------

YAN_True_dragon_reign:0 "真龙治下，国祚永昌"
YAN_True_dragon_reign_desc:0 "真龙临朝，百官俯首。数百年不曾对外兴兵，天下承平日久——大到边关的烽燧，小到巷口的茶摊，都默认明天与今天一样。只是这份安稳是拿「不必再争」换来的：朝野上下，渐渐忘了怎么打一场真正的仗。"

YAN_Divine_subjects:0 "敕封神明，大炎子民"
YAN_Divine_subjects_desc:0 "诛神之后，大炎把「人定胜天」写进了国本：山川河岳由朝廷敕封，邪魔巨兽被记作待斩的祸患。这套神话是子民的骄傲，也是一道门槛——四邻畏其强，亦惧其傲。"

YAN_Three_dukes:0 "三公六部，承平暗弱"
YAN_Three_dukes_desc:0 "太师掌教化，太傅辅政，太尉主兵，六部各守一摊。这样的制衡让朝政极少出大错，也极少出大功：文书要走完的衙门太多，军队的锐气，就在一次次「再从长计议」里磨钝了。"

YAN_Mobile_cities:0 "移动城邦与源石矿脉"
YAN_Mobile_cities_desc:0 "百灶建在源石矿脉之上，整座城会走。天灾来时，任它碾过大地的旧城，人早已随城躲开——这是大炎对天灾最骄傲的答案。代价写在账本上：能源的胃口极大，脚下的土地也一年薄过一年。"

YAN_Sishuitai_candle:0 "司岁台秉烛"
YAN_Sishuitai_candle_desc:0 "秉烛人夜夜提灯，记下十二个人的一举一动。名义上他们是同僚，实际上是被监视的碎片；而秉烛人自己也说不清，守的是岁陵，还是一场随时会醒的旧梦。"

YAN_Martial_tradition:0 "尚武传统"
YAN_Martial_tradition_desc:0 "玉门擂台的鼓声未歇，廉家武馆、铁意六合拳、红梅咏春的招牌就挂满了半条街。大炎人把「能打」当作体面的一部分，即便朝堂早已忘了远方还有战事。"

YAN_Taishi_injustice:0 "太师冤案"
YAN_Taishi_injustice_desc:0 "四十年前，皇太子提刀上殿兵谏，老真龙驾崩，太师担下谋逆之名被处死。百官嘴上不提，心里都清楚：连太师都能这样收场，那还有谁是不能牺牲的。"

YAN_Shanhaizhong:0 "山海众渗透"
YAN_Shanhaizhong_desc:0 "山海众从未真正被剿灭。他们渗进驿道、盐场与边军的伙房，把仇怨磨成可以经营的东西。朝廷的告示贴得再多，也堵不住那些在风雪里递出的暗号。"

YAN_Shudao_in_Tianjingge:0 "书刀在天镜阁"
YAN_Shudao_in_Tianjingge_desc:0 "书刀悬在天镜阁顶楼，能删改的远不止史书上的一个名字。只要它还锁在那里，真龙就还是真龙——所以盯着它的，从来不止谏官。"

YAN_Bufan_originium:0 "不反源石"
YAN_Bufan_originium_desc:0 "不反是留给真龙血脉的最后一条路：以身为引，与岁同归。它被锁在最深的库房里，钥匙只系在一个人腰上——用它的代价，从来都由那一个人独自付清。"

# ---------------------------- 民族精神（国策解锁） ----------------------------

YAN_Taishi_rehabilitated:0 "太师昭雪"
YAN_Taishi_rehabilitated_desc:0 "旧案重翻，冤名尽洗。压了四十年的一口气终于吐出来，朝野上下的脊背也随之直了起来：原来这朝廷，还是讲道理的。"

YAN_Brothers_one_heart:0 "兄弟同心"
YAN_Brothers_one_heart_desc:0 "真龙与魏彦吾隔着龙门多年的心结，终于有一句话把它解开。一个坐镇百灶，一个看着龙门，兄弟二人不再互相防着，大炎便少了半座内耗的墙。"

YAN_Bingzhu_new_system:0 "秉烛新制"
YAN_Bingzhu_new_system_desc:0 "司岁台换了当家的，也换了做法：不再只是盯着代理人，而是试着与他们共事。秉烛人依旧夜行，只是烛光照到的地方，比从前宽了。"

YAN_Tiankui_sword:0 "天喟之剑"
YAN_Tiankui_sword_desc:0 "书刀交到陈晖洁手上，它便不再只是删改名字的器物——刀刃指向的，是那些想用假史盖住一切的东西。"

YAN_Agents_family:0 "代理人一家"
YAN_Agents_family_desc:0 "十二片碎片，终究是同一个人裂开的。重岳守门、令与均织梦、年与夕镇伥、黍与余安民——他们当中有人入朝，有人隐居，有人只想把日子过好。大炎愿意把他们当人看，他们便也愿意为大炎出一次手。"

YAN_Wang_shackles:0 "望之枷锁"
YAN_Wang_shackles_desc:0 "岁陵深处换了主人。望接过旧的枷锁，替大炎按住那条盘了千年的根。需要有人永远守在地下，这件事没有变，变的只是守的人。"

YAN_New_sui_shadow:0 "新岁之影"
YAN_New_sui_shadow_desc:0 "岁陵之下不再是兽，而是一个「人」。他以源石为身、以山川为忆，替大炎看着这方土地：既像旧日的祸患，又像新的神明。"

YAN_Sui_calamity_ended:0 "岁兽之祸终结"
YAN_Sui_calamity_ended_desc:0 "纠缠大炎千年的那一根刺，终于被拔掉了。岁陵不再渗血，伥物不再作乱，边关的夜风里也不再有那种让人牙根发紧的动静——一个朝代，终于可以只操心人的事。"

YAN_Rhodes_cooperation:0 "罗德岛合作"
YAN_Rhodes_cooperation_desc:0 "与罗德岛的一纸协议，让大炎第一次愿意正视矿石病：不再是「免得漏了」，而是「该治了」。"

YAN_Shudao_case:0 "书刀案"
YAN_Shudao_case_desc:0 "书刀被夺的消息压不住，天镜阁连夜封门。史书被改过，名字被抹掉，朝堂上人人自危——从这天起，谁也不敢保证自己明天还叫这个名字。"

YAN_Behemoths_awaken:0 "巨兽苏醒"
YAN_Behemoths_awaken_desc:0 "岁陵那边的动静，惊醒了沉睡在八荒边界的其他东西。它们还没有动，可边关的巡骑已经不敢在天黑之后出城。"

YAN_Sui_disaster:0 "岁兽之乱"
YAN_Sui_disaster_desc:0 "岁陵裂了。百灶与邙山一带字侑、伥物横行，夜里整条街都在响，稳定已成空话。大炎为拖延付出的代价，正在一笔一笔地收。"

YAN_Xiemo_influence:0 "邪魔影响"
YAN_Xiemo_influence_desc:0 "与乌萨斯的战火烧到了极北的边际，那些被冰原裂隙吞没的「邪魔」循着战争的气息渗了过来。边关驿卒说，深夜的营火会突然熄灭，雪地上会多出一串不属于任何人的脚印，而辎重队穿过荒原时，马匹总在同一个位置莫名惊跳。士兵们不只是在与乌萨斯人作战——还在与自己投在雪地里的影子作战。\n\n§R陆军补给消耗 +20%§!／§R陆军防御 -30%§!／§R陆军组织度 -30%§!"

YAN_Lao_Tianshi_guashuai:0 "老天师挂帅"
YAN_Lao_Tianshi_guashuai_desc:0 "极北的败报一天短过一天，短到只剩一句「又是那样死的」。朝廷没了办法，只好去请那位早不管事的老人。他下山没带仪仗，只提一根木棍；教士卒的不是阵法，是怎么在夜里认出同伴的呼吸。三军知道他站在最前面，于是敢站在最后面，辎重车队也不再在半途空转，等一道永远不会来的号令。\n\n§G陆军攻击 +30%§!／§G液化源石消耗 -50%§!"

YAN_True_dragon_fallen:0 "真龙陨落"
YAN_True_dragon_fallen_desc:0 "真龙以身为引，与岁同归。岁兽死了，真龙也死了——大炎失去了它最神圣的那一个人，也失去了让天下安心的那个由头。"

# ---------------------------- 三条路线 ----------------------------

YAN_Route_Jingtian_Baomin:0 "敬天保民"
YAN_Route_Jingtian_Baomin_desc:0 "炎据泰拉东，真龙统之。六部三公理政，大理寺、肃政院司法，天师府、钦天监、司岁台分职。国祚在真龙，亦在子民；安民固圉，平反冤狱，是其本。"

YAN_Route_Dashou_Weitian:0 "大狩维天"
YAN_Route_Dashou_Weitian_desc:0 "太古巨兽号神，岁为最古。真龙大狩，诛神逐兽，岁裂为十二代理人。司岁台监之，岁陵镇之，玉门备之，“不反”为同尽之器。望终入岁陵，杀岁识而代之，纳“不反”，受睚仇，以永劫易大炎安。"

YAN_Route_Baiye_Zhengxing:0 "百业争兴"
YAN_Route_Baiye_Zhengxing_desc:0 "百灶为都，玉门为塞，龙门通商，大荒劝农。饮食、武术、书画、诗词、影视、物流、侦探诸业并盛，烟火不绝。"

# ---------------------------- 路线大BUFF（每条线一个，三档递进） ----------------------------






















# ---------------------------- 人物 ----------------------------

YAN_Taifu:0 "太傅"
YAN_Taifu_desc:0 "三公之首，主谋国是。他相信大炎的敌人不在边关，而在自己心里那条不肯认输的执念；所以能谈的，他都想先谈一次。"

YAN_Taiwei:0 "太尉"
YAN_Taiwei_desc:0 "三公之中掌兵的那一位。他从不掩饰主张：岁兽是祸，就该除；代理人既是碎片，就不该留。朝堂上他把话说得最直，也最让人不安。"

YAN_Ning_Chunqiu:0 "宁辞秋"
YAN_Ning_Chunqiu_desc:0 "礼部左侍郎，宁述的孙女。比起陈兵边境，她更信一纸文书能办成的事——而她确实办成过几件。"

YAN_Liang_Xun:0 "梁洵"
YAN_Liang_Xun_desc:0 "尚蜀知府出身，后升玉门参知，又调百灶天镜阁誊录郎。管钱粮、修城渠的老手，也正因如此，他最清楚这座帝国的家底经不起几场大战。"

YAN_Chun:0 "椿"
YAN_Chun_desc:0 "司岁台监正，秉烛人里资历最深的一个。她守了那个秘密大半辈子，也为颉的死背过一段说不清的旧账。"

YAN_Zuo_Le:0 "左乐"
YAN_Zuo_Le_desc:0 "左宣辽之子，景教授之子，年轻的秉烛人。他比前任更愿意把代理人当人看，也更愿意把「监视」这一职，改叫共事。"

YAN_Wei_Yanwu:0 "魏彦吾"
YAN_Wei_Yanwu_desc:0 "本名炎武，原皇太子，如今龙门总督，也是真龙的兄长。四十年前他提刀上殿，此后离京；如今他握着一座城的钱与人，对百灶的态度始终是四个字：先看再说。"

YAN_Yu_Cheng:0 "虞澄"
YAN_Yu_Cheng_desc:0 "刑名出身的清官，为太师案查了半辈子，曾一把火烧掉大理寺卷牍库。他信冤案不平则国无宁日，因此得罪过的人比他的部下还多。"

YAN_Lao_Tianshi:0 "老天师"
YAN_Lao_Tianshi_desc:0 "提着木棍的老者，扫邪魔、破巨兽所向披靡，闲下来却在厨房拨火添柴。他不太谈天师府的事，也不谈自己怎么活这么久。"

YAN_Zuo_Xuanliao:0 "左宣辽"
YAN_Zuo_Xuanliao_desc:0 "玉门的老将，一辈子守在西北的风沙里。他不在乎朝堂的算计，只在乎城墙还立不立得住。"

YAN_Chen_Huijie:0 "陈晖洁"
YAN_Chen_Huijie_desc:0 "龙门近卫局高级警司，魏彦吾的外甥女，炎景公主之女。持赤霄剑，办案不讲情面，偏偏对「历史可以被人随意涂改」这件事，比谁都耿耿于怀。"

YAN_Chong_Yue:0 "重岳"
YAN_Chong_Yue_desc:0 "十二分之一，排行第一，执掌「武」。曾任玉门武术教官，把「朔」之名与残魂封进剑里，换来一具人的身体。他自认是人，不认那段岁的来历。"

YAN_Jun:0 "均"
YAN_Jun_desc:0 "排行第四，口含天宪，曾治狱、研究《炎律》。他相信规矩能管住人心，也相信只要写得够细，连岁也会被规矩困住。"

YAN_Ling:0 "令"
YAN_Ling_desc:0 "排行第三，诗人，好饮酒。曾戍北百年，尚蜀一役独退天灾。她看得太透，所以懒得争，只偶尔在梦里替大炎拆掉一两个不该发生的凶祸。"

YAN_Nian:0 "年"
YAN_Nian_desc:0 "排行第九，管铸造。她造的物件比大炎任何工坊都精巧，能造玄极巨兵，也能造十二楼五城；代价是她走到哪里，哪里就莫名其妙地烧起来。"

YAN_Xi:0 "夕"
YAN_Xi_desc:0 "排行第十一，画家，隐居灰齐山。她画下的东西会成真，代表作《拙山尽起图》。所以她极少落笔——除非有人值得她记下来。"

YAN_Shu:0 "黍"
YAN_Shu_desc:0 "排行第六，农业天师，曾在大荒城做农业研究。他把荒年的活命本事看得比什么都重，于是走到哪里，哪里的仓廪就先满起来。"

YAN_Yu:0 "余"
YAN_Yu_desc:0 "排行第十二，幺弟，余味居的老板。他话少，熬得一手好汤——对于一支大军能不能吃上饭这件事，他比谁都清楚。"

