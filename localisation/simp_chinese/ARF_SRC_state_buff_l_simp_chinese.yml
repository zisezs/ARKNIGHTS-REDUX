l_simp_chinese:

############################################################
# 叙拉古 (SRC) · 地块 BUFF：家族盘踞 / 新沃尔西尼模式示范区
# 州级精神、两个决议分类、四个决议与其 custom_effect_tooltip
############################################################

 SRC_dyn_family_entrenchment: "家族盘踞"
 SRC_dyn_family_entrenchment_desc: "市政的公文出不了新沃尔西尼的环城路。码头的班次由威尼斯家排，酒庄的账由萨卢佐家记，矿上的工头、警局的副手、法院的书记员——名字都登在灰厅的册子上，不在人事部。工厂开着，订单要抽三成；壮丁在册，征来的兵不认你的旗。这不是叛乱，这只是叙拉古的日常。"

 SRC_dyn_volsinii_model_zone: "新沃尔西尼模式示范区"
 SRC_dyn_volsinii_model_zone_desc: "示范区立在城东的新区：统一招标、公开账目、营业执照不看姓氏，法院直接受理对家族的诉讼。同一座城，两套规矩——这里的工厂敢开第二班，因为没人来收“管理费”。界线每往外推一寸，灰厅的脸色就难看一分。"

 SRC_family_purge_category: "家族整顿"
 SRC_family_purge_category_desc: "灰厅的规矩刻在人身上，法律写在纸上。要在叙拉古办事，就得先决定跟哪一套打交道：查名册、断账本、拆掉保护费的链条。一次拔不光所有钉子，但可以一次拔一根。"

 SRC_volsinii_model_category: "新沃尔西尼模式"
 SRC_volsinii_model_category_desc: "示范区的经验不是一张布告，而是一整套能复制的东西——市政、法院、工会、招标平台、警务与运输班次。把它往外推，每一步都要拿政治点去换，还得留出时间让新规矩真正落地。"

 SRC_dec_crack_down_families: "镇压家族势力"
 SRC_dec_crack_down_families_desc: "宪兵、法警与税务局同时进门：查封赌场、冻结账户、把收保护费的按在桌上签字，工头换成人事部的任命。先动哪个区，抽签与情报各占一半——快不起来，但每拔一根，那块地就交还给城市一天。"

 SRC_dec_vm_phase_one: "示范区第一期 · 新区与码头"
 SRC_dec_vm_phase_one_desc: "先做看得见的东西：冷库、泊位、变电站，三十七条街区并入同一套市政账目。招标挂上公开平台那天，半夜有人打电话来谈“合作”，也有人生平第一次拿到不看姓氏的营业执照。"

 SRC_dec_vm_phase_two: "示范区第二期 · 工厂与工会"
 SRC_dec_vm_phase_two_desc: "把规矩伸进车间：学徒合同、工伤赔付、班次上限，工会代表被允许坐在厂务会的对面。家族的企业要么按新格式重新注册，要么看着自己的工人走进示范区搭的招聘棚。"

 SRC_dec_vm_phase_three: "示范区第三期 · 全域并轨"
 SRC_dec_vm_phase_three_desc: "最后一步最难：法院、警察、税务与市政在同一天换印章，灰厅的仲裁从此只算私人调解。签字的人收起笔说，这座城市第一次属于活着的人。"

 SRC_tt_crackdown_going: "§Y立即§!：在 §Y一个随机控制的叙拉古地区§! 解除【家族盘踞】；随后 §Y30 天§! 内无法再次动手。"
 SRC_tt_vm_phase_going: "§Y工程进行中§!：期间无法同时推进另一期，完成后永久抬高示范区 BUFF 的工厂加成。"
 SRC_tt_vm_p1_done: "【新沃尔西尼模式示范区】地区可用工厂数量 §G+10%§!，累计 §Y+30%§!。"
 SRC_tt_vm_p2_done: "【新沃尔西尼模式示范区】地区可用工厂数量 §G+10%§!，累计 §Y+40%§!。"
 SRC_tt_vm_p3_done: "【新沃尔西尼模式示范区】地区可用工厂数量 §G+10%§!，累计 §Y+50%§! —— 三期已满，本决议组到此结束。"
