# ══════════════════ 国策描述 ══════════════════
 RHL_td_council_desc: "十科合议厅的灯光彻夜未熄。\n当十位主任在宪章上落下名字，莱茵生命的每一个科室，都将成为这个国家的一根支柱。"

 RHL_td_s1_l1_desc: "「科学属于超人。庸众可以去选择政客，庸众可以去崇拜领袖……但唯有科学，他们不配染指。」\n帕尔维斯在实验室里独自面对那些培养槽数十年。将不同的生命缝合在一起，是通往「超越」的第一步。"
 RHL_td_s1_l2_desc: "「灵魂层面上的嵌合会产生什么影响？」\n当帕尔维斯第一次看到递质——那种对微振动极度敏感的银色液体——他意识到，自己苦寻数十年的「土壤」终于出现了。"
 RHL_td_s1_l3_desc: "「他们被称为『死魂灵』。」\n帕尔维斯翻开了那些封皮漆黑的书籍。他的手指拂过晦涩的咒文，就像在抚摸一件尚未完成的艺术品。"
 RHL_td_s1_l4_desc: "「我真正投入精力的研究方向始终只有一个——嵌合实验。」\n当意识与递质融合的那一刻，他知道自己不再需要肉体的躯壳。但灵魂的重量，远比他想象中更难以承受。"
 RHL_td_s1_r1_desc: "「我不支持任何人，因为他们终究只是平庸的科学家。我也是。」\n那只「老山羊」心中有一套独属于自己的评判标准——而庸众，从来不在其中。"
 RHL_td_s1_r2_desc: "「但唯有科学，他们不配染指。」\n这句话在莱茵生命内部引发了巨大的争议。赫默愤怒地离开了他的实验室，但帕尔维斯只是平静地端起了茶杯。"
 RHL_td_s1_r3_desc: "「我们背负科学，我们被它命令，供它驱策。」\n帕尔维斯相信，平庸的时代即将结束，科学的神祇必须归位。而他，将是那个为神祇铺路的人。"
 RHL_td_s1_r4_desc: "「已经庸碌太久了。我必须……我仍可以追上她，她也必须闪耀。」\n当帕尔维斯将自己的意识注入递质的那一刻，他不再是那个左右逢源的老山羊。他成为了「奇迹」的一部分，哪怕只是作为搭车客。"
 RHL_td_f1_desc: "「他完成了自己的实验，以意料之外的方式。」\n帕尔维斯离开了。但结构科的嵌合实验没有停止。莱茵生命开始量产那些嵌合生命体——它们是武器，是工具，是灵魂的容器。没有人知道它们是否拥有自我意识，也没有人敢问。"

 RHL_td_s2_l1_desc: "「我们管它叫『递质』。它对微振动非常敏感，能够充当接收并编码神经信号的媒介。」\n斐尔迪南将递质视为自己最得意的成果。"
 RHL_td_s2_l2_desc: "「它能让源石技艺适应性普通的人摇身一变成为优秀的术师。」\n当无数人通过递质连接在一起，他们将成为一个「超个体」。"
 RHL_td_s2_l3_desc: "「哥伦比亚需要『导航』。」\n军方需要一种能够跨越距离、精准地将武器送到任意地点的技术。而递质，恰好提供了这个答案。"
 RHL_td_s2_l4_desc: "「我们头顶……整个实验区，存储了更多同种物质……总体积是我们面前这些的上万倍。」\n当递质网络覆盖整个哥伦比亚，每一个连接到网络的人，都将成为这张巨网上的一个节点。"
 RHL_td_s2_r1_desc: "「整个特里蒙的能量循环系统是我设计的。」\n斐尔迪南亲手设计了特里蒙的能量循环系统。但他知道，这远远不够。他需要一座能够汇集整个哥伦比亚能量的超级设施。"
 RHL_td_s2_r2_desc: "「克丽斯腾从石棺里取火，莱茵把火变成了电网。」\n石棺的能量远远超出了泰拉人的认知。当斐尔迪南第一次看到那些读数时，他几乎不敢相信自己的眼睛。"
 RHL_td_s2_r3_desc: "「它刚才吸收的能量，足足能够维持整个哥伦比亚所有移动城市至少半年的消耗。」\n当能量井开始过载，整个特里蒙都为之颤抖。这不仅仅是能源——这是权力。"
 RHL_td_s2_r4_desc: "「博士，抓稳一些。我看到了『石棺』。」\n成百上千座远超泰拉认知的维生装置，成为了莱茵生命最宝贵的遗产。"
 RHL_td_f2_desc: "「莱茵生命是我的手段，我的阶梯，我的臂膀。」\n斐尔迪南曾经被视为投机者，被清除，被裹挟。但最终，他的能量井成为了莱茵生命合众国的心脏。没有人再敢嘲笑他。"

 RHL_td_s3_l1_desc: "「所有人都该获得平等的机会，天赋的差异不该决定任何人的人生走向。」\n多萝西出身拓荒者家庭。她相信，递质能够抹除这种差距。"
 RHL_td_s3_l2_desc: "「施术者是他们全部。」\n数十名受试者的意识被连成一体。在这个网络中，每个人都能平等地感受彼此。"
 RHL_td_s3_l3_desc: "「我不欺骗你们，也不想有所隐瞒。」\n多萝西坚持让每一位受试者签署知情同意书。这是她与那些「疯狂科学家」之间最后的区别。"
 RHL_td_s3_l4_desc: "「通过我的技术，人们将能更平等地感受彼此，也将更平等地感受土地、空气与雨水。」\n当中枢网络覆盖整个哥伦比亚，所有人都将平等地感受彼此。"
 RHL_td_s3_r1_desc: "「在哥伦比亚，我希望我们生来平等。」\n多萝西的梦想是让每一个哥伦比亚人都能平等地使用源石技艺，而不是被天赋决定命运。"
 RHL_td_s3_r2_desc: "「就像遭遇车祸的人利用假肢重新奔跑。」\n洛肯·威廉姆斯的天才构想，被多萝西变成了现实。可植入的施术单元，让普通人也能拥有术师的力量。"
 RHL_td_s3_r3_desc: "「每一个士兵，都能成为术师。」\n当施术单元开始量产，哥伦比亚的军队将不再是少数精英的天下。"
 RHL_td_s3_r4_desc: "「科学是真切地看向每一个人。」\n赫默的这句话，最终成为了源石技艺应用科的座右铭。"
 RHL_td_f3_desc: "「我不该让你们困在这里。我也……不该困住我自己。」\n多萝西最终亲手摧毁了自己的造物。但她的理念没有消失——一个所有人平等感受彼此的世界。尽管这个世界的代价，只有少数人知道。"

 RHL_td_s4_l1_desc: "「发问，再解决，如此循环。」\n娜斯提将女妖的咒言视为一种程序语言。只要找到正确的语法，咒言就能实现任何功能。"
 RHL_td_s4_l2_desc: "「这支骨笔上……有我熟悉的咒言的痕迹。」\n每一段打孔纸带都布满细密的孔洞——那是咒言，也是程序。"
 RHL_td_s4_l3_desc: "「将咒言封存在模块之中，可是划时代的发明！」\n咒言不再需要声音——它可以被存储，被复制，被部署。"
 RHL_td_s4_l4_desc: "「如果需要处理信息残余，那就建一座服务器；如果信号覆盖不到，那就把它搬到天上。」\n娜斯提的「树」是一个能够自循环修复的系统。它将在天空中，为所有萨卡兹提供魂归之处。"
 RHL_td_s4_r1_desc: "「这就是莱茵生命工程科的实力。」\n浮空种植单元利用植物进行远距离能量传输。它们不仅是空中电缆，更是整座园区的血管。"
 RHL_td_s4_r2_desc: "「它们都是园区基础架构的重要组成部分。」\n当浮空结构层建成，「螺旋桨天堂」成为全泰拉唯一一座浮空实验园区。而这仅仅是开始。"
 RHL_td_s4_r3_desc: "「从来没人说过移动城市……只能在地上匍匐。」\n娜斯提想要的，是一座能够自由翱翔于天空的城市。"
 RHL_td_s4_r4_desc: "「那是，一个城市的雏形。」\n当第一座空中城市的雏形出现在特里蒙上空，所有人都抬起了头。"
 RHL_td_f4_desc: "「（萨卡兹语）天空，亦是萨卡兹的应许之地。」\n娜斯提为莱茵生命建造了天空的血管，也为萨卡兹找到了新的应许之地。那棵「树」将永远飘浮在哥伦比亚的晴空之上。"
 RHL_td_sky_city_desc: "「从来没人说过移动城市……只能在地上匍匐。」\n一座真正的空中城市在特里蒙上空落成。它是工程科的丰碑，也是莱茵生命合众国的皇冠。"

 RHL_td_s5_l1_desc: "「在无根之花盛开得最灿烂的地方，我发现了……那个圆形巨构的碎片。」\n马里亚姆在因非冰原的最深处，发现了上个时代的遗迹。"
 RHL_td_s5_l2_desc: "「无根之花盛开得最灿烂的地方……」\n那些不需要土壤就能生长的花朵，证明了泰拉曾经拥有过远超现在的科技。"
 RHL_td_s5_l3_desc: "「她说上个时代的人称之为，『星门』。」\n星门的碎片被带回莱茵生命。这将改变一切。"
 RHL_td_s5_l4_desc: "「或许，我们能借此重建与上个时代的对话。」\n马里亚姆开始研究星门的碎片。他相信，这扇门将通向一个全新的时代。"
 RHL_td_s5_r1_desc: "「如果前进意味着不能回头，那我们如何确认自己走在最初选择的道路上？」\n只有了解边界，才能真正走向远方。"
 RHL_td_s5_r2_desc: "「那片被沼泽和冰原封锁起来的僻远土壤，远离文明。」\n马里亚姆在萨米的冰原上建立了观测站。那里是泰拉最寒冷的地方，也是离星空最近的地方。"
 RHL_td_s5_r3_desc: "「哥伦比亚的二十多支科考队消失在了黑流树海。」\n那片神秘沼泽中埋藏着泰拉最深的秘密。"
 RHL_td_s5_r4_desc: "「星荚防线是哥伦比亚的盾。」\n当星门被打开，星荚防线将成为抵御未知威胁的最后屏障。"
 RHL_td_f5_desc: "「那个圆形巨构的碎片……上个时代的人称之为『星门』。现在，它是我们的。」\n马里亚姆站在因非冰原的最深处。他知道，这将是一个全新时代的开始。"
 RHL_td_stargate_program_desc: "「星门计划，正式启动。」\n莱茵生命倾尽全力重启上个时代的巨构。这一次，门后将不再是无尽的黑暗。"

 RHL_td_s6_l1_desc: "「我不是一片树叶，我只是一滴水。」\n缪尔赛思在莱茵生命总部建起了一座生态园。那是她唯一能够自由呼吸的地方。"
 RHL_td_s6_l2_desc: "「这个山村，不是精灵的聚落，而是精灵的坟场。」\n缪尔赛思找到了自己父母的墓地。那些淡杉，是精灵一族最后的痕迹。"
 RHL_td_s6_l3_desc: "「生命在消逝前经历的一切，都会有意义留存。」\n即使精灵一族终将消逝，他们留下的痕迹也不会消失。"
 RHL_td_s6_l4_desc: "「这座生态园，它所承载的未来……就是我的梦想。」\n当生态园的技术被推广到整个哥伦比亚，她的梦想终于实现了。"
 RHL_td_s6_r1_desc: "「一旦感染上矿石病，我们的寿命恐怕不会超过一个月。」\n缪尔赛思从小就意识到自己的不同。她一直在寻找答案——关于精灵，关于自己。"
 RHL_td_s6_r2_desc: "「他们小心翼翼却又勇敢地活着。」\n缪尔赛思要为精灵找到一条真正能够生存下去的道路。"
 RHL_td_s6_r3_desc: "「那上路吧。」\n如果大地不再是精灵的归处，那就去天空寻找答案。"
 RHL_td_s6_r4_desc: "「在大地之外……说不定有一片未被源石侵蚀的空间，能够真正接纳你和你的种群。」\n万星园虽然坠落了，但希望没有消失。"
 RHL_td_f6_desc: "「我想帮助迷迭香。我想探寻事件的真相。我想试着找寻我自己。」\n缪尔赛思最终找到了自己的位置。她不再是那个孤独的精灵，而是这片土地上所有生命的守护者。"

 RHL_td_s7_l1_desc: "「我的源石技艺能够对周围含有钙元素的物质进行粒子层面的重构。」\n塞雷娅的钙质化是她最强大的武器，也是她最沉重的负担。"
 RHL_td_s7_l2_desc: "「你丢弃了那个最初由我们两人一起研究出来的公式。」\n塞雷娅不再追求完美，而是追求实用。"
 RHL_td_s7_l3_desc: "「强硬地对抗……并不足以走到终点。」\n她放弃了精密度，换取了释放速度。更加脆弱，但也更加迅速。"
 RHL_td_s7_l4_desc: "「我确实不讨厌战斗。」\n当钙质化技术被应用到军队装备上，莱茵国防军拥有了前所未有的防御能力。"
 RHL_td_s7_r1_desc: "「我是防卫科主任，这是我的职责所在。」\n塞雷娅用自己的方式守护着这家公司——即使这意味着与整个莱茵生命为敌。"
 RHL_td_s7_r2_desc: "「我需要用它证明自己还能将军功章从灰尘里捡起来。」\n塞雷娅与国防部签订了合同。这是一场危险的游戏，但她别无选择。"
 RHL_td_s7_r3_desc: "「还有什么比一个一无所有的失败者更好控制的吗？」\n布莱克上校成为了莱茵生命在军方的盟友。但他的忠诚，从来都只属于哥伦比亚。"
 RHL_td_s7_r4_desc: "「从今天起，莱茵的保安就是国家的军队。」\n防卫科被改编为莱茵国防军。塞雷娅成为了这支军队的最高指挥官。"
 RHL_td_f7_desc: "「真正的先驱者，应当为全人类开道，而不是率先跳进深渊，有去无回。」\n塞雷娅的防卫科成为了这个国家的基石。没有人再敢挑战莱茵生命的权威——因为塞雷娅的钙质化，比任何盾牌都要坚硬。"

 RHL_td_s8_l1_desc: "「我帮助疯子们成功。」\n小贾斯汀从不亲自做研究，但他的棋盘上，摆满了整个哥伦比亚的科技公司。"
 RHL_td_s8_l2_desc: "「我像颗掉进洗衣机里的洋葱，掉了一层又一层的皮。」\n天空贷让无数哥伦比亚人实现了飞天梦，也让无数人倾家荡产。这是必要的代价。"
 RHL_td_s8_l3_desc: "「但凡沾上『天空』二字的股票保准一路大涨。」\n当天空概念股席卷福拉尔街证券交易所，哥伦比亚的狂热已经不可阻挡。"
 RHL_td_s8_l4_desc: "「媒体是莱茵的喉舌。」\n从《科技评论》到《进步之声》，莱茵生命的声音无处不在。"
 RHL_td_s8_r1_desc: "「我今天要联系的人里，甚至包括大法官。」\n他的通讯录上，写满了哥伦比亚政商两界最有权势的名字。"
 RHL_td_s8_r2_desc: "「议员们开始收到来自特里蒙的『礼物』。」\n当联合议会的多数议员都成为莱茵生命的代理人，他离目标又近了一步。"
 RHL_td_s8_r3_desc: "「如果哥伦比亚的法院变得软弱退缩，那么这里就不再值得我继续为之工作。」\n哥伦比亚的法律，将为莱茵生命劈开荆棘。"
 RHL_td_s8_r4_desc: "「这个国家并没有生活在一个阴谋之中，只是荒唐的事情发生得太有条理。」\n当马克·麦克斯总统发现自己再也无法掌控局势，莱茵生命的时代已经到来。"
 RHL_td_f8_desc: "「我会掌控它，我会支配它。我会向它指明前进的方向。」\n小贾斯汀的商务科掌控着整个国家的经济命脉。而他的棋盘上，摆满了整个泰拉。"

 RHL_td_s9_l1_desc: "「我们的『家』。至少小时候，我们真的都把塞勒涅先生当爷爷。」\n雅拉在塞勒涅孤儿院长大。那里是梅兰德基金会的前身，也是她一生都无法摆脱的羁绊。"
 RHL_td_s9_l2_desc: "「梅希亚，别忘记……你姓『塞勒涅』。」\n梅希亚是雅拉最得意的后辈。她的源石技艺能够抹消记忆——但她自己，却无法忘记那些被抹消的人。"
 RHL_td_s9_l3_desc: "「梅兰德不会容许任何人，尤其是一名叛逃特工触碰不应触碰的信息。」\n当梅希亚选择违抗命令，梅兰德基金会内部的分裂已经不可避免。"
 RHL_td_s9_l4_desc: "「莱茵的商务科和梅兰德的特工，在同一个屋檐下办公。」\n当情报总局成立，梅兰德的阴影，终于被莱茵生命的光芒驱散。"
 RHL_td_s9_r1_desc: "「他们和你一样，都是这家公司的基石，贾斯汀。」\n雅拉始终认为，感染者也是莱茵生命的一部分。"
 RHL_td_s9_r2_desc: "「感染者可以买股票，但多数人只买得起收治区的床位。」\n这只是一种更隐蔽的控制手段。但至少，感染者有了自己的资产。"
 RHL_td_s9_r3_desc: "「科学是真切地看向每一个人。」\n赫默的这句话，成为了收治区改革的指导思想。"
 RHL_td_s9_r4_desc: "「哥伦比亚的感染者，永远是莱茵的燃料。」\n当感染者公民权法案通过，雅拉知道，这只是开始。真正的平等，还有很长的路要走。"
 RHL_td_f9_desc: "「我们这些无处可去的孤儿，都能成为哥伦比亚的孩子。」\n雅拉最终选择了站在莱茵生命一边。她的孩子们，将成为哥伦比亚新的脊梁。"

 RHL_td_s10_l1_desc: "「万星园才是这座实验室，或者说飞行器唯一的名字。」\n总辖构件科汇集了莱茵生命几乎所有主任的智慧，也承载了克丽斯腾一生的梦想。"
 RHL_td_s10_l2_desc: "「无论是星星的位置，还是轨道变化的精度，这座星象仪都远超任何一位星象学家的想象。」\n万星园的星象仪，是克丽斯腾对天空的致敬。"
 RHL_td_s10_l3_desc: "「我很高兴……我们很快就能一起找到答案了。」\n缪尔赛思的生态园被搬进了万星园。这些植物将在星荚之外存活——为精灵，也为所有生命。"
 RHL_td_s10_l4_desc: "「接下来，我将躺入洛肯研制的维生休眠舱。」\n克丽斯腾最终躺入了维生休眠舱。她不知道等待自己的是什么，但她知道，自己已经完成了使命。"
 RHL_td_s10_r1_desc: "「虚假的天空终于被扯碎。亘古的双月露出真容。」\n当万星园撞向星荚，整个泰拉都为之颤抖。人类第一次看到了真实的星空。"
 RHL_td_s10_r2_desc: "「『地平弧光计划』……是一沓从来就不具备可行性的废纸。」\n克丽斯腾欺骗了军方，但也留下了宝贵的遗产。"
 RHL_td_s10_r3_desc: "「聚焦发生器是哥伦比亚的利剑。」\n当聚焦发生器开始量产，哥伦比亚拥有了前所未有的战略打击能力。"
 RHL_td_s10_r4_desc: "「那个圆形巨构的碎片……现在，它是我们的。」\n当星门被打开，莱茵生命合众国迈向了全新的时代。"
 RHL_td_f10_desc: "「我只是一双眼睛。一双……替所有生活在这片大地上的人们，看向陌生深空的眼睛。」\n克丽斯腾已经离开了。但那棵飞天的「树」，那座万星园，那扇星门——都是她留给这个世界的礼物。"
 RHL_td_stargate_apotheosis_desc: "「今夜，真实终于被人类首次窥见。」\n星门完全开启。克丽斯腾的遗志终于实现——莱茵生命，将替所有人看向深空。"

 RHL_td_grand_desc: "「从今天起，莱茵生命就是哥伦比亚。」\n当塞雷娅签下最后一份文件，当小贾斯汀举起最后一杯香槟，当雅拉走出那扇门，当娜斯提抬起头看向天空——莱茵生命合众国，正式成立了。"
 RHL_td_end_utopia_desc: "「企业即国家，国家即企业。」\n在十科合议厅的治下，哥伦比亚成为了第一座运转完美的企业乌托邦。至少，账面上是。"
 RHL_td_end_technocracy_desc: "「统治这个国家的，不是总统，不是议会，而是科学本身。」\n十科合议厅改组为最高技术官僚评议会。一切非理性之物，都将被优化。"
 RHL_td_end_beast_desc: "「鸭爵对这个结果表示满意。」\n哥伦比亚成为了兽主的游戏场。只要默许还在增长，谁又在乎明天会发生什么呢？"
 RHL_td_end_maylander_desc: "「梅兰德没有死。梅兰德只是换了一副面孔。」\n情报总局与梅兰德残部达成共治。阴影成为了这个国家的另一半。"

