# ══════════════════ 超事件：莱茵生命企业国建立 ══════════════════
# 触发：哥伦比亚联邦（CLB）不存在（on_annex 吞并即时触发，on_monthly 兜底）
 rhlse.1.t: "莱茵生命企业国建立"
 rhlse.1.d: "联合议会的公报还墨迹未干，特里蒙上空的旗帜已经换了图样。塞雷娅签下最后一道政令，缪尔赛思的微笑同时出现在每一块公共屏幕上，而克丽斯腾只留下一句话，便转身走向了发射井——从今天起，实验室的墙就是国境线，十科合议厅就是最高权力机关。哥伦比亚联邦成为历史名词，取而代之的，是莱茵生命企业国。"
 rhlse.1.a: "§T我离真理更近！§!"
 RHL_corporate_state_title: "莱茵生命企业国建立"
 RHL_corporate_state_quote: "“当公司成为国家，真理便有了疆土。”\n——十科合议厅成立宣言"
 RHL_corporate_state_close: "§T我离真理更近！§!"
# 超事件：「孤星」探测火箭发射成功（rhlse.2，全球广播，面板 RHL_super_event_lone_star）
 rhlse.2.t: "“孤星”探测火箭发射成功"
 rhlse.2.d: "「遥测曲线越过了所有已知的上限，然后安静地继续向上。」\n阻隔层在 6972 米处被撕开一道口子，只维持了一瞬——一瞬之内，有一个不属于天体的东西在按人的意志运动。各国的电务处、气象台和观测所几乎同时记下了这次回波，却没有人在第一时间说出它是什么。\n莱茵生命发出的电报只有三行：高度、速度，和一枚载荷的名字——孤星。他们没有宣布胜利，只是把那张表交给了所有人。\n今晚，许多从不抬头的人抬起了头。"
 rhlse.2.a: "§T摘取未来之人§!"
 RHL_super_event_lone_star_title: "“孤星”探测火箭发射成功"
 RHL_super_event_lone_star_quote: "「一百二十年来第一次，有人从上面回话了。」"
 RHL_super_event_lone_star_close: "§T摘取未来之人§!"
 RHL_td_tt_need_launch: "万星园还没有把任何东西送上去过。先成功发射一次，再来谈星门。"

