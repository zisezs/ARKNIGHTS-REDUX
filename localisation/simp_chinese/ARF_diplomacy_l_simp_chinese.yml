 RECALL_VOLUNTEERS_TITLE: "召回志愿军"
 RECALL_VOLUNTEERS_DESC: "召回所有已派往§Y[FROM.GetNameDef]§!的志愿军？"
 RECALL_VOLUNTEERS_ACTION_DESC: "召回所有已派往该国的志愿军。"

 DEMILITARIZATION_TITLE: "去军事化"
 DEMILITARIZATION_DESC: "强制§Y[FROM.GetNameDef]§!解散所有军队，并且使其无法训练部队或编辑部队编制。"
 DEMILITARIZATION_ACTION_DESC: "对该国实行去军事化"

 REMILITARIZATION_TITLE: "重新军事化"
 REMILITARIZATION_DESC: "允许§Y[FROM.GetNameDef]§!训练部队或编辑部队编制，并且其能够在一段时间内快速训练部队。"
 REMILITARIZATION_ACTION_DESC: "允许该国重新军事化"

 SOVEREIGNTY_RESTORATION_TITLE: "恢复主权"
 SOVEREIGNTY_RESTORATION_DESC: "恢复§Y[FROM.GetNameDef]§!的主权将使其不再是我们的附庸国，并且能够训练部队或编辑部队编制，在一段时间内快速训练部队。"
 SOVEREIGNTY_RESTORATION_ACTION_DESC: "解除与该国附庸关系"

 REDETERMINE_COUNTRY_DESTINY_TITLE: "重新决定该国命运"
 REDETERMINE_COUNTRY_DESTINY_DESC: "我们将会吞并§Y[FROM.GetNameDef]§!，并可以重新触发该国相关的领土处置决议"
