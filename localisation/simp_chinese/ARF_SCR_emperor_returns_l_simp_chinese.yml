l_simp_chinese:

 # 猩红剧团（SCR）【皇帝的归来】国策树 · 国策名称与描述
 # 生成器：docs/gen_scr_emperor_returns.cjs（勿手改本文件）
 # 名称 63 条；描述 19 条（设计稿只补了一部分，其余留空）。
 SCR_er_87: "皇帝归来...嗯？"
 SCR_er_87_desc: "为我科西嘉莉欢唱吧，我的子民们！  等等，你们这眼神...为什么你们都不信任我！"
 SCR_er_88: "巫师之国...呵！"
 SCR_er_88_desc: "莱塔尼亚，以源石技艺闻名的国度，我的舰队于此，我的荣耀埋葬于此。  但我决不会咽下这份屈辱。"
 SCR_er_89: "狮王之傲...哈！"
 SCR_er_90: "重新审视源石技艺"
 SCR_er_90_desc: "我很不想承认，我在战争中对源石技术的滥用确实造成了很多恶果，但是...但是...  源石武器很强大，降低了战场伤亡，只要稍加留心..."
 SCR_er_91: "缝合高卢裂片"
 SCR_er_92: "我的国家，我的人民"
 SCR_er_93: "召开第一次御前会议"
 SCR_er_94: "感染者也是同胞"
 SCR_er_94_desc: "不，我不允许你们歧视他，他是因为战争而感染的烈士，他是我们的同胞...  ...离远些，感染者！"
 SCR_er_95: "罗德岛...谁？"
 SCR_er_95_desc: "他们似乎是个极具潜力的新势力，我在克莱布拉松沉淀的时候与他们有过一面之缘。  治疗矿石病，就凭他们？"
 SCR_er_96: "安抚市长与领主"
 SCR_er_97: "回忆过去吧，高卢人！"
 SCR_er_98: "畅想未来吧，高卢人！"
 SCR_er_99: "接见老近卫军"
 SCR_er_100: "对军工集团的许诺"
 SCR_er_101: "旧行政体系的存废"
 SCR_er_102: "保护源石技艺使用者"
 SCR_er_102_desc: "我不在的这段时间里，源石技艺的花样是越来越多了，破坏力也越发惊人了。既然如此，这样宝贵的战争兵器我们可不能弃之如敝履。"
 SCR_er_103: "推广矿石病抑制剂"
 SCR_er_103_desc: "...好东西 ...如果那时就有 ...必须推广"
 SCR_er_104: "清算殖民者与卖国者"
 SCR_er_105: "征用维多利亚的技术"
 SCR_er_106: "禁忌源石技艺无害化"
 SCR_er_106_desc: "四皇会战中，我曾经授权使用过许多像魔族佬的“阿喃那”一样邪恶、恐怖的源石武器。  萨卡兹也干了。  我们会改的！"
 SCR_er_107: "矿石病预防教育"
 SCR_er_107_desc: "你说你请来了罗得岛的医疗部门进行矿石病防治教育的推广？谁允许你把这些掌握可怖武力的危险分子放进来的！  下不为例！"
 SCR_er_108: "制度化施法者连队"
 SCR_er_108_desc: "我看我们高卢的施法者一点都不比莱塔尼亚差，小伙子小姑娘的作战手段和战后善后工作都做得很棒。  该给他们一个名分了。"
 SCR_er_109: "剿灭地方分离主义者"
 SCR_er_110: "取缔非法语言文字"
 SCR_er_111: "讨还哥伦比亚的旧债"
 SCR_er_112: "宫廷之外的声音"
 SCR_er_113: "更新感染者处理机制"
 SCR_er_113_desc: "乌萨斯的沙皇很有想法，把感染者放在炉子里烧——这很不环保，很不安全。  但我们必须学习其他国家的先进处理经验。"
 SCR_er_114: "不因矿石病而束缚！"
 SCR_er_114_desc: "矿石病肆虐泰拉，而我们战胜了矿石病！  我没在开玩笑！"
 SCR_er_115: "建设我们的高卢"
 SCR_er_116: "新时代的新高卢！"
 SCR_er_117: "漫步硝烟之中"
 SCR_er_118: "慰问前线近卫军"
 SCR_er_119: "游荡田野之间"
 SCR_er_120: "暗访外地乡巴佬"
 SCR_er_121: "猛攻后勤部门！"
 SCR_er_122: "狠踹无能官僚！"
 SCR_er_123: "新国家不要旧官僚！"
 SCR_er_124: "黎博利远胜阿斯兰！"
 SCR_er_125: "战火中重生"
 SCR_er_126: "废墟中崛起"
 SCR_er_127: "女皇万岁！"
 SCR_er_128: "高卢万岁！"
 SCR_er_129: "皇帝归来！"
 SCR_er_130: "赫尔昏佐伦，出来！"
 SCR_er_130_desc: "我从来没畏惧过巫王那个疯子！他只不过是比我更没有底线而已，我对源石技艺的理解丝毫不逊色于他...  理应如此！"
 SCR_er_131: "弗雷德里克，过来！"
 SCR_er_132: "莱塔尼亚的不谐和音"
 SCR_er_132_desc: "巫王已经死了三十年了！所谓的“帕维永”不过是他的坟墓而已。  巫王残党，我们有共同的敌人！"
 SCR_er_133: "双子女皇之敌"
 SCR_er_133_desc: "这两个经常光顾妓院（？）人造人统治者竟然能被贵族们接受？  哼，我不接受，他们也不会甘心。"
 SCR_er_134: "选帝侯的私欲"
 SCR_er_134_desc: "双子女皇的改革已经引发了国内诸多利益集团的不满，尤其是那些在巫王之死事件中推波助澜的选帝侯们。  他们能干第一次，也能干第二次。"
 SCR_er_135: "撞击双子塔！"
 SCR_er_135_desc: "巫王的高塔的确令人印象深刻，尽管那座战争高塔早已随着他本人一同灰飞烟灭，但双子女皇的黑白高塔仍然不可小觑。  我们的间谍和内应，是时候发挥作用了！"
 SCR_er_136: "高塔倾倒..."
 SCR_er_136_desc: "现在是莱塔尼亚最虚弱的时候，只要我们进军，他就会轰然倒塌！"
 SCR_er_137: "维多利亚的崭新伤痕"
 SCR_er_138: "新晋狮王的弱点"
 SCR_er_139: "塔拉人摩拳擦掌！"
 SCR_er_140: "反制碎片大厦"
 SCR_er_141: "陵寝颓圮..."
 SCR_er_143: "健康者，感染者...爱国者"
 SCR_er_144: "好人，恶人...高卢人"
 SCR_er_145: "穷人，富人...高卢人"
 SCR_er_147: "我为英勇者加冕"
 SCR_er_148: "我为胆怯者羞愧"
 SCR_er_149: "他的土地在哪？"
 SCR_er_150: "他的家园在哪？"
 SCR_er_151: "世界即舞台！"
 SCR_er_151_desc: "老实说，我不知道我为什么会从所谓的“内化宇宙”里钻出来，那位长生者也没有解释我为什么变成了女人。  但我知道，世界才是我的舞台！"

 ########################
 # 【皇帝的归来】动态民族精神
 ########################
 SCR_dyn_new_emperor: "空剧场里的新皇帝"
 SCR_dyn_new_emperor_desc: "他从内化宇宙回到科西嘉，坐进一座空无一人的剧场。高卢人还没学会信任这位归来的皇帝，但舞台的灯已经为他亮起。"
 SCR_dyn_old_gaul_disaster: "天灾，矿石病，旧高卢！"
 SCR_dyn_old_gaul_disaster_desc: "天灾、矿石病与旧高卢的亡魂一同压在新生政权肩上。皇帝只能用一场接一场的胜利，把这份重负一点点卸下来。"
 SCR_er_new_emperor_gain_tt: "§Y获得民族精神【空剧场里的新皇帝】：§!"
 SCR_er_old_gaul_gain_tt: "§Y获得民族精神【天灾，矿石病，旧高卢！】：§!"
 SCR_er_old_gaul_modify_tt: "§Y民族精神【天灾，矿石病，旧高卢！】追加效果：§!"
 SCR_er_ltn_bonus: "对莱塔尼亚的复仇"
 SCR_er_ltn_bonus_desc: "莱塔尼亚的宫廷还记得旧高卢的结局。现在，轮到他们听完我们的乐章。"
 SCR_er_duke_bonus: "对维多利亚诸公爵领的复仇"
 SCR_er_duke_bonus_desc: "开斯特、威灵顿、温德米尔——三顶公爵冠冕，三笔尚未结清的账。"
 SCR_dyn_theatre_empress: "剧场女皇，高卢倒影"
 SCR_dyn_theatre_empress_desc: "皇帝终于承认，王座上的那个人已经不是当初归来的自己。高卢的倒影站上了舞台，而真正的皇帝退到了幕布之后。"
 SCR_dyn_gaul_reflection: "高卢倒影"
 SCR_dyn_gaul_reflection_desc: "剧场女皇最终承认，自己只是高卢在舞台上的倒影。名字变了，台下的人却没有变。"
 SCR_dyn_new_gaul_world: "旧世界，新高卢"
 SCR_dyn_new_gaul_world_desc: "灾难的旧名被留在幕布后面。新国家把矿石病、天灾与旧高卢的亡魂一并收进档案，然后继续向前。"
 SCR_dyn_not_a_toy: "国家不是玩具，陛下"
 SCR_dyn_not_a_toy_desc: "皇帝想把国家当成一场可以随时叫停的戏，但官僚、军队与工厂都有自己的脾气。每一项任性的命令，都要用稳定与产能来偿付。"
 SCR_dyn_glory_hand: "荣耀之手"
 SCR_dyn_glory_hand_desc: "军官团把荣誉缝回袖口。进攻是他们的本能，防御只是为了让下一次进攻站得更稳。"
 SCR_er_new_emperor_modify_tt: "§Y民族精神【空剧场里的新皇帝】追加效果：§!"
 SCR_er_not_a_toy_gain_tt: "§Y获得民族精神【国家不是玩具，陛下】：§!"
 SCR_er_not_a_toy_modify_tt: "§Y民族精神【国家不是玩具，陛下】追加效果：§!"
 SCR_er_empress_rename_tt: "§Y民族精神【空剧场里的新皇帝】改名为【剧场女皇，高卢倒影】§!"
 SCR_er_mio_funds_tt: "§Y所有装备制造商获得 §G1000§! 经费§!"
 SCR_er_glory_hand_tt: "§Y解锁军官团精神【荣耀之手】§!"
 SCR_er_noncore_penalty_tt: "§Y非核心领土的负担§!：每拥有一个非核心地块，稳定度 §R-5%§!"
 SCR_er_bacchus_mercy_tt: "§Y触发事件【酒神的怜悯】§!"
 SCR_er_private_state_tt: "§Y触发事件【民办国家】§!"
 SCR_er_bone_bearer_tt: "§Y触发事件【手捧骸骨者】§!"
 SCR_er_this_is_an_order_tt: "§Y触发事件【这是命令！】§!"
 SCR_er_lucien_invitation_tt: "§Y触发事件【卢西恩的邀请】§!"
 SCR_er_army_rectification_tt: "§Y触发事件【全军整风运动】§!"
 SCR_er_court_rectification_tt: "§Y触发事件【宫廷整风运动】§!"
 SCR_er_gaul_pilgrimage_tt: "§Y触发事件【高卢巡礼】§!"
 SCR_er_great_infrastructure_tt: "§Y解锁经济法案【大基建运动】§!"
 SCR_er_puppet_division_tt: "§Y在首都生成 16 支【颂乐人偶师】§!"
 SCR_er_final_rename_tt: "§Y【剧场女皇，高卢倒影】改名为【高卢倒影】；【天灾，矿石病，旧高卢！】改名为【旧世界，新高卢】§!"
 SCR_er_unfinished_business_tt: "§Y触发事件【未竟之业】§!"
 SCR_great_infrastructure_campaign: "大基建运动"
 SCR_great_infrastructure_campaign_desc: "把全国的动员能力转向道路、厂房与城市骨架。民用工厂建设速度显著提高，但消费品与能源压力也会随之上升。"

