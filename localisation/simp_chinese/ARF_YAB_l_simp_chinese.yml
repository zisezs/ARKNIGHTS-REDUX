#人物
 YAB_An_Sishun: "安思顺"
 YAB_An_Sishun_desc: "多年以前，由于西北地区的叛乱，安思顺随着家族被迫到中原投奔亲友，亲友见其身姿孔武，推荐他去应征当兵，如此一来，家中少一张嘴吃饭，他也可以靠军饷补贴家用。安思顺听从了亲戚的建议，当了兵。随后几年，因为在军中的表现优异，他被上级送去长定陆战武备学堂深造。从长定学堂毕业后，靠着“长定系”的关系，这个年轻人一路高升，年纪轻轻便成为了当时安北都护王仲嗣的副手。在王仲嗣的手下，安思顺领兵一次又一次地挫败了梦魇遗民的叛乱，并一手设计了对梦魇游牧部族的强制迁徙政策。而当王仲嗣因百京内部的权力斗争而被迫辞官后，安思顺便接过了他的位置，继续经营着大炎的北部边疆。安思顺是一介武夫，但不代表他缺乏政治头脑。他对大炎皇帝极尽忠诚，但同时，他也在密切关注着百京的风吹草动，他可不想重蹈他长官的覆辙，作为镇守一方的大将，给自己找好后路是必要的。"
 YAB_northern_frontier_general: "定北将军"
 YAB_Jogetu_Orzen: "绰阔思·鄂曾"
 YAB_Liu_Song: "刘松"

 YAB_northern_front: "大北方防线"
 YAB_northern_front_desc: "定北都护府所承担的防御职责是三个都护府中最重的，她需要直接面对乌萨斯和邪魔的威胁，同时混乱的东国局势也让边防压力更上一层，而定北都护府境内，前朝梦魇遗民的反抗和新兴的山海众势力又是另一种形式的威胁。这一切都将定北都护府导向唯一的一个结果：以武为重。虽然靠南方的地区适宜发展更为先进的农业和工业，少数民族的物产也具有极高的贸易价值，但在安全威胁远大于经济利益的定北都护府，一切都需要为军事让步。"