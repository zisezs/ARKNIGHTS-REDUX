 VIC_Alexandrina_Vina_Victoria: "亚历山德莉娜·维娜·维多利亚"
 VIC_Alexandrina_Vina_Victoria_side_Windermere_desc: "“逃避”是亚历山德莉娜·维娜·维多利亚过往经历的底色，无论是物理还是心理层面都如此。她从宫廷中逃离、从革命中逃离、从伦蒂尼姆的围城中逃离。她曾经欺骗自己，从宫中逃出并加入格拉斯哥帮的那段时光，是她人生中真正自由的时光。但贵族与萨卡兹人的追剿不会因为她的逃避而停止，而地下黑拳和收保护费也算不上什么好营生。命运规定了，她不属于街头。\n\n维娜最终带着她的帮派伙伴逃到了罗德岛，卡兹戴尔流亡反对派建立的医药托拉斯实体。这远不是她的结局，实际上，这只是她真正人生的开端。罗德岛与卡兹戴尔军事委员会终有一战，正如维娜·维多利亚终将回到这个以她的姓氏命名的国家。以“推进之王”之名行动的维娜在罗德岛协助下，与伦蒂尼姆市民自救军进行了有限的合作，将象征维多利亚的圣剑——诸王之息——收入囊中，得到了对抗萨卡兹源石技艺优势的关键武器。然而她们也因此在伦蒂尼姆陷入萨卡兹军队的重重包围。\n\n但齿轮已经开始旋转。温德米尔公爵的军队启动了救援行动，维娜和随行人员大多被成功救出。在公爵的支持下，亚历山德莉娜·维娜·维多利亚在伦蒂尼姆城下加冕为维多利亚之王。长达十数年的流亡经历，换来的是一顶沉重而难受的王冠，这绝非维娜·维多利亚想要的结果。然而同样是流亡的时光，让维娜明白了一个事实：有些人一旦能够行走在大地上，就永远无法只为自己而活。无论自己只是要扮演好一个傀儡的角色，还是要真正地成为维多利亚在这个时代的王，亚历山德莉娜·维娜·维多利亚，都不会再拒绝，因为她已经坦然接受了自己的命运，也是维多利亚的命运。"
