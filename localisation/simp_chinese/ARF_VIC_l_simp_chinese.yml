 event_vic.100017.t: "自光辉中奔涌"
 event_vic.100017.d: "致全体忠于职守的友邻部队：\n\n搭载于开斯特集团军群的高速火炮陆行舰上的天灾控制仪“剑座”已于伦蒂尼姆时间1345启动，目前已观测到空中出现抑制粒子与源石尘埃反应产生的金色光芒，“圣约斩铁之剑”综合气象干预系统的实战价值得到验证。\n\n为获取“圣约斩铁之剑”系统的启动密钥“诸王之息”，无数英勇的士兵与公民付出了他们的生命，请允许我们以维多利亚之名，为他们献上最崇高的敬意。\n\n对源石潮的抑制生效后，萨卡兹军队先前通过碎片大厦围绕伦蒂尼姆都会区所构筑的高浓度复杂源石环境将会逐渐消失，我方部队得以进入先前无法抵达的区域，进而完成围攻伦蒂尼姆都会区的战略部署。预计在48小时内，区域内源石尘埃浓度将下降至较低水平，我部将派出防源石工兵部队作为先遣部队进入，构筑准备工事。预计在72小时后，源石潮将完全消散，可以进行总攻部署。\n\n本人，玛丽·开斯特·维多利亚，谨以个人名义呼吁，各公爵军与各民间武装建立战略协调通道，在即将到来的伦蒂尼姆战役中一致对外、协同作战，并在战后通过谈判解决争端。"
 event_vic.100017.a: "武运昌隆。"

