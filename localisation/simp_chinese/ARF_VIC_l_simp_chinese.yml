#国策
 VIC_provisional_parliament_formation: "组建临时议会"
 VIC_provisional_parliament_formation_desc: "随着卡兹戴尔军事委员会占领伦蒂尼姆及其周边地区，维多利亚帝国的核心已经事实上瘫痪，曾经掌控大权，作为最高立法与最高司法机构的议会也同样因遭到占领军的监视与“指导”而事实上失去其原本作用。但在如今的危机局势下，各公爵仍需要一个负责协商议事的政治中枢，而新组建的临时议会就将填补上这个窟窿。"
 VIC_public_evacuation: "提案：优先疏散群众"
 VIC_public_evacuation_desc: "在伦蒂尼姆被萨卡兹人占领的当下，或许将从中撤离具有重大价值的资产列到日程首位是个合乎情理的想法。但若国家丢了人心，有再多金银器物与精密机械也是毫无意义的。我们将会把“人”放在首位，尽可能将更多无辜的大伦蒂尼姆地区群众疏散到没有魔族视线的安全地区。"
 VIC_asset_evacuation: "提案：优先撤离重要资产"
 VIC_asset_evacuation_desc: "在伦蒂尼姆被萨卡兹人占领的当下，或许优先疏散群众这种倾向人道主义的提议乍一听很是合理。但我们要清楚一个事实：即撤离或疏散的本质事实上在于避免那些重要资源落到魔族手上。人力与劳动力的确弥足珍贵，但从如今的局势来看，或许注重撤离那些对当下乱局更有价值的机械与财物才更有意义。"
 VIC_take_over_bankrupt_factories: "提案：接管破产工厂"
 VIC_take_over_bankrupt_factories_desc: "拜我国几十年来的政治混乱所赐，伦蒂尼姆金融潮的余波至今还未结束，而众多破产工厂也在这些艰难岁月中成为了部分城市的“靓丽街景”。在如今帝国的危急存亡之秋，这些在人们眼中或许已经毫无价值的东西或许大有用处。我们将派出政府官员将其接管，以为国家效力。"
 VIC_relief_for_difficult_enterprises: "提案：救济困难企业"
 VIC_relief_for_difficult_enterprises_desc: "拜我国几十年来的政治混乱所赐，伦蒂尼姆金融潮的余波至今还未结束。诸多企业在当年便受到金融潮冲击当场破产，而同样数量众多的许多企业也长久以来面临严重的财政危机与诸多其他问题。毫无疑问，政府有必要出手解决这些企业面临的问题。商业救济将向社会发放，相信这能够解决不少问题。"
 VIC_expand_local_forces: "提案：扩大地方部队"
 VIC_expand_local_forces_desc: "遥想属于弗雷德里克三世的伟大时代，维多利亚军队是如此纪律严明、武器精良。可看看如今的状况，虽然硕果仍存的军事遗产依然够我们保家卫国，可在萨卡兹人的入侵之下，如今的军备状况或许已难守护国家。为了未来着想，必须将更多资源调拨到军事领域，协助建设诸公爵的军事力量。"
 VIC_distributing_relief_supplies: "发放救济物资"
 VIC_distributing_relief_supplies_desc: "卡兹戴尔军事委员会在伦蒂尼姆施行的治理无疑是一场灾难，他们砍掉了大量市政、福利乃至于基本的民生开支，以至于伦蒂尼姆市民们如今极其缺额发食品、衣物甚至饮用水等各类基本生活物资。为了稳定首都市民的民心，并确保政府与其的纽带不彻底断连，我们需要尽可能地伸出援助之手。"
 VIC_duke_conference: "公爵会议"
 VIC_duke_conference_desc: "自先帝被共和主义叛党推上绞刑架已经有几十年了，而公爵们也如同几十年前的混乱时代一样相互党同伐异，争斗不休。如果他们还不团结起来，维多利亚帝国该凭借什么击退如今盘踞于首都的外敌？或许一场公爵会议能够解决这些问题，让公爵们至少勉强团结起来些。"
 VIC_monitoring_market_behavior: "监控市场行为"
 VIC_monitoring_market_behavior_desc: "无论在哪个国家，何种时代，“发国难财”的行为都总是存在。好吧，说点不好听的：维多利亚目前就有不少借传闻与民众的恐慌心理操控物价，大赚不义之财的黑心商人，而比他们更致命的一点在于市场本身的不稳定。虽说自由放任很受部分社会精英看好，但在如今，还是有必要使用一些干涉主义的手段。"
 VIC_wartime_civilian_factories: "提案：修建战时民用工厂"
 VIC_wartime_civilian_factories_desc: "萨卡兹人的进一步扩张显然难以避免，但我们无疑可以在他们真正开启行动之前做好充足准备。考虑到如今部分地区的生活物资紧缺，以及战争可能会进一步导致的生产能力受创，我们需要调拨资源，修建更多的民用工厂。"
 VIC_military_material_allocation: "提案：军用物资调配"
 VIC_military_material_allocation_desc: "在如今愈发低效的军事管理状况下，诸多本身没什么军备缺口的部队武器堆积如山，而真正缺铳少弹的士兵们却可能长久以来都等不来补给。为此，我们有必要绕过那些繁文缛节，让议会直接调配军用物资，将它们交给真正需要其的部队。"
 VIC_spying_on_the_Sarkaz: "提案：刺探萨卡兹情报"
 VIC_spying_on_the_Sarkaz_desc: "在与萨卡兹人的正面冲突已经难以避免的今日，或许专注寻找王室下落以稳定人心的确有其价值，但优先去对付魔族才是更好的选择。而任何一个懂军事的人都明白，战争绝不局限于正面的刀枪剑戟，也涵盖了常被人忽视的隐秘战线——间谍战。我们将向伦蒂尼姆派遣间谍，探明所谓“卡兹戴尔军事委员会”的虚实。"
 VIC_searching_for_royalty: "提案：寻找王室下落"
 VIC_searching_for_royalty_desc: "在与萨卡兹人的正面冲突已经难以避免的今日，相较于被炮火与铳弹覆盖的正面战场与情报及渗透主宰的隐秘战线，更不为人所注意的内政“战线”或许才是真正的突破口。我们将尽可能地投入资源以搜寻阿斯兰王室的身影，以稳定人心。当然，如果能真正找到王室后裔，结束王座空悬的现状就更好了。"
 VIC_wartime_military_factories: "提案：修建战时军用工厂"
 VIC_wartime_military_factories_desc: "萨卡兹人的进一步扩张显然难以避免，但我们无疑可以在他们真正开启行动之前做好充足准备。考虑到将会到来的战争将使各类军械物资需求大幅上涨，我们需要尽可能将生产重心转移到军事上，修建更多的军用工厂。"

#事件 
 event_vic.1.t: "开始联合进军"
 event_vic.2.t: "众叛亲离"
 event_vic.2.d: "安费莉丝·温德米尔公爵站在“全能”号陆行战列舰的舰桥上，伦蒂尼姆城郊的荒原景色尽收眼底。尽管距离市区仅剩五千米，她的目光所及之处依然只有空无人烟的田野和破败不堪的房屋，而她对此并不惊讶。\n\n过去几个月来，已经有数万人拖家带口离开了伦蒂尼姆大城，仓皇逃往乡村地带甚至邻近国家。在萨卡兹军事委员会的铁腕治下，这颗昔日的帝国之心几乎被彻底掏空，仅留下一条条筑满工事的街道，以及一具具布满弹孔的尸体。本该守护维多利亚的诸位公爵之中，卡文迪许与斯塔福德两枚小卒业已身死，诺曼底与高多汀避战不出，开斯特和威灵顿态度暧昧，至于法夫、亚伯科恩与阿什沃思三人则无足轻重。惟有她——安费莉丝·温德米尔，可以拯救这个摇摇欲坠的帝国。\n\n随着特雷西斯摄政王试图将卡兹戴尔的影响力从伦蒂尼恩一带延伸至维多利亚全境，她终于争取到了其余七位公爵的军事支持，并在数天前的帝国会议上正式宣布开始“联合进军”，准备把萨卡兹人彻底驱逐出伦蒂尼姆城。眼下，“全能”号战列舰即将抵达预定攻击方位，只要其余公爵部署的舰队全数到位，安费莉丝便能下达进攻命令。\n\n但某些事情似乎不大对劲。\n\n她放下望远镜，眉头拧成了一团，“联络官，威灵顿公爵和‘加斯特里尔’号在哪里？”\n\n“雷达在方圆十公里范围内没有探测到任何友方单位，公爵大人。”\n\n“但他们早就该在侧翼位置保持待命了。”她沉思片刻，随即下令道：“联系威灵顿公爵！”\n\n通讯音阵的指示灯闪烁了几下，一个威严而稳重的嗓音随之响起：“我是维斯利·威灵顿。温德米尔公爵，请表明你的意图。”\n\n“威灵顿公爵，我倒希望你先表明自己的意图。”她冷冷地说，“联合进军行动在即，你的部队在哪里？”\n\n“于我来说，参加联合进军是一个严重的错误，也是一次出卖灵魂的交易。考虑到塔拉地区与整个维多利亚帝国的利益，我决定不再参与联合进军，开斯特公爵和高多汀公爵同样如此。祝你好运，温德米尔公爵，愿战争之神常伴你左右。”\n\n未等安费莉丝做出反应，对方便终止了通讯，音阵中只发出阵阵刺耳的电波杂音。\n\n她抬手扶住额头，深吸了一口气，"
 event_vic.2.a: "“给我接开斯特和高多汀——立刻！”"
 event_vic.3.t: "遗憾离场"
 event_vic.3.d: "“……不准后退一步，各单位继续向前推进！祖国的命运就寄托在我们身上！”\n\n“城防炮！小心城防炮！快让连队散开——”\n\n“渗透小队报告，卡兹戴尔王庭军正在部署重火力装甲载具，再重复一遍，敌方正在部署重火力装甲载具！贝塔组、伽马组损失惨重，请求立即后撤！”\n\n“这里是第四装甲旅，我们已经失去了九成有生力量……滋滋……彻底落入了萨卡兹人的圈套。我和弟兄们会发动最后一次攻击，为其他部队争取一点时间。为了先王和维多利亚！”\n\n炮火在“全能”号舰桥的舷窗外不时亮起，通讯音阵中传来杂乱无章的对话。安费莉丝·温德米尔低垂着头，任由阴影缓缓淹没面庞。从战斗陷入僵局的那一刻起，她便下意识地开始在心中计算自己呼吸的次数。虽然中途断了几次，但加起来大概也已经有三千多次了。\n\n过去半小时内，没有任何一艘其他公爵麾下的陆行舰加入战局，就连步兵乃至补给支援都不见踪影。她只收到了五名公爵寄来的致歉信，信中是他们拒绝参加联合进军的各种借口。\n\n于是，温德米尔边防军被迫独自支起战线，并在城防炮的远程轰击之下陷入溃败。尽管她赢得了几场漂亮的破袭战，但特雷西斯依靠伦蒂尼姆军工力量打造的王庭军依然挡住了整体攻势，并逼得边防军步步后撤。倘若仍要死战不退，大多数陆行舰乃至旗舰“全能”号恐怕都会葬身此地。\n\n一片沉默之中，安费莉丝抬起了头，“联络官，请为我接通所有部队。”\n\n随着音阵终端上的指示灯由红转绿，她闭上双眼，下定了决心。\n\n“边防军的诸位将士们，我是你们的最高指挥官，安费莉丝·温德米尔公爵。”她坚定地说道，“在此前的战斗中，你们已经展现了维多利亚帝国军人应有的素质和精神，但仅凭这些仍然无法战胜强敌，因为我们遭到了来自盟友的可耻背叛。此刻，伦蒂尼姆战役正在走向失败，而我不希望你们为了难以触及的胜利果实付出生命。在此，我正式下令——”\n\n一发炮弹在“全能”号附近爆炸，火光照亮了安费莉丝的脸颊。"
 event_vic.3.a: "“——全军撤退。”"
 event_vic.4.t: "公爵会议"
 event_vic.4.d: ""
 event_vic.4.a: "好的。"
 event_vic.5.t: "漫长的白日梦"
 event_vic.5.d: "自魔族进驻伦蒂尼姆，维多利亚本就不稳的秩序更进一步崩塌后，杰克·雅泽尔已经长久以来没听说过任何好事了。他所居住的这座小镇时而宣布“临时”断水停电，时而启动诸如宵禁、安全检查之类的人身限制，令人不禁怀疑起国家是否已经进入战争状态。可就在这种糟糕的时局下，雅泽尔仍未放弃他每日订报看报的习惯。好吧，他也知道，在这种时局下，报纸上又能报道什么好事儿呢？每天雅泽尔都怀揣着“今天一定不会更坏”的心情摊开报纸，可各种关于难民、犯罪与政治动荡的新闻却一次一次地无情击碎这种预期。\n\n“今天又会有些什么新闻呢？”雅泽尔点燃了手头上的最后一根香烟，随后如以往般阅读起了新鲜送达的最新头条。可他还未将这张《维多利亚时报》完全展开，便看到了那耸人听闻的标题：《卡兹戴尔军事委员会方面出台最新法案，宣布将全面开展劳动禁令》\n\n“什么？这帮魔族佬疯了吗？”随着目光扫过一行行文字，雅泽尔的瞳孔愈加放大，而浑身也起了满满的鸡皮疙瘩。依据几位调查记者在伦蒂尼姆九死一生的探查，报纸头条的文字上描绘出了令人不安的真相：为驱使所有维多利亚工人为其工作，占领伦蒂尼姆的军事委员会政权丧心病狂地禁止了一切民营雇佣劳动，并宣布一切工人只有在占领军控制下的工厂劳动才是合法的。\n\n文章中还提到，大量工人在这项法案颁布后即刻失业，伦城失业率在短期内达到了自金融潮消退后从未有过的水准。而更多冒死拍下来的珍贵证据则进一步展现了伦蒂尼姆的糟糕状况：工业区陷入萧条，街头一幅死气沉沉之景。更有一位市民在接受采访时声称，她曾因为非萨卡兹雇主打零工而遭到当地萨卡兹人殴打辱骂……\n\n“这群混账魔族佬，真是无法无天了！”雅泽尔越看越感到怒火自心中上涌。但与愤怒同时燃起的，更多的是一股无力的悲怆之情。祖国是何时变成这样的？又是谁将那个曾经繁荣与强大的维多利亚帝国摧残成了这样？这个问题再度于雅泽尔的脑海中闪过，可他却已不愿再去想它了。"
 event_vic.5.a: "这帮魔族佬究竟想走到什么地步？"
 event_vic.6.t: "暴风雨中的航船"
 event_vic.6.d: "当静静坐在图书馆的某个角落时，凯特总会默默思考诸多事情。从与她息息相关的邻家草坪、路上行人，到各种宏大的国家大事、外交棋局，她的脑中总是蕴含世间万物。而在当下，在这个无人在意的角落中，凯特的思维仍在飞速运转。\n\n这本书的内容令她回想起了诸多本世纪的重大历史事件，也同样使她在庞杂的文字中认知到了更多课本上不会教的知识。对求知若渴的凯特而言，如果有机会，她一定会去逐一找到这本《维多利亚当代史事集》的编者们挨个握手。从四皇会战中击破科西嘉一世；到战后四十余年的黄金盛世；再到伦蒂尼姆金融潮与1072年革命带来的无尽混乱……或许在许多人眼中，这本书里那长篇大论的文字除了令人头疼一无是处。但在凯特看来，它们却能为人带来诸多对过去、当下及未来的思考。\n\n八大公爵，一个在当今维多利亚政界无法被忽视的词汇。在先帝遭逆贼所杀，皇位自此陷入空缺以来，他们便主导着帝国的政治领域。而在这八位公爵之间，温德米尔、开斯特、高多汀、威灵顿这四位的权势最盛。而当思考到这四位公爵时，凯特的思维也下意识地将其同国家的历史及前程绑定在了一起。\n\n追思往日伟大岁月，“铁公爵”维利斯·威灵顿在世界大战中立下汗马功劳，而“帝国丧钟”这个称号也无疑体现了其军事才华于战争之中迸发的能量；开斯特公爵以其同皇室的深厚关系与对议会的非凡掌控力成为了当下帝国特殊政治生态中的重要“稳定维系者”；高多汀公爵虽在军事及政治表现上显然没有前者那般耀眼，却依然将他的一方领地治理得井井有条——至少相对这个大体上混乱到顶的时局而言；至于温德米尔公爵旗下的边防军，以及她对于今日乱局的关心，或许也值得人们的尊敬与赞许。\n\n“可在如今？他们之中谁才是真正能够引领维多利亚脱离当下艰难岁月，走向未来的人？”当心中冒出这个想法的时候，凯特不禁为她祖国的前途暗暗叹了口气。一个没有皇帝的帝国、一个连首都都难以控制的强权、一个或许处在百年以来最低谷的国家，这些都是属于维多利亚的形容词。凯特还记得自己最初看到“维多利亚内战论”时内心的荒诞感。但从现在的角度看，这也未必不会是一种最糟的可能性。想到这里，她的思维又回到了先前的那个问题上来。\n\n“未来的维多利亚，将会由谁引领？”"
 event_vic.6.a: "温德米尔公爵必将拯救国家。"
 event_vic.6.b: "开斯特公爵永远值得人们信赖。"
 event_vic.6.c: "高多汀公爵会指引我们走向新曙光。"
 event_vic.6.e: "威灵顿公爵能够带来再一场胜利。"
 event_vic.8.t: "风暴撤离"
 event_vic.8.d: "“把这些东西运走，快！”詹森上尉指挥着三辆悬浮运输车驶出C14闸口，开上了撤离伦蒂尼姆的公路。他回头望去，一座座城防炮在薄雾之中若隐若现，卡兹戴尔军事委员会的灰色旗帜正飘扬在城市上空。\n\n“要命……”他眯起眼睛，然后举起通讯腕表喊道：“各小组，检查货物状态！”\n\n很快，腕表中传来两个小队长的回应：“一号小组，四台源石动力引擎，无异常；二号小组，两台陆行舰发动机冷却模块，无异常。”\n\n“三号小组呢？”一阵不安席卷了上尉，“三号小组，立刻答复！”\n\n通讯腕表中传来一阵滋滋声。上尉心头一紧、顿觉不妙，急忙看向右侧的三号运输车。然而，他所目睹的却是挡风玻璃上的斑斑血迹，以及驾驶员垂挂在车门旁的尸体。一辆漆有卡兹戴尔徽标的载具与悬浮车并驾齐驱，而后者货仓中的集装箱正被几个萨卡兹蒙面武士悄无声息地有序搬走。\n\n上尉怒骂一声，朝着那几个萨卡兹人端铳射击，但子弹仅在对方的盔甲上激起一阵紫色火花，然后便被源石技艺生成的屏障轻松弹开。其中一名蒙面武士察觉到了敌人，他缓缓转身，抬手指向了上尉。几发法术火球随即呼啸飞过，瞬间掀飞了上尉的维多利亚军帽。\n\n“真要命——”上尉从腰间掏出一枚源石尘手雷，不假思索地朝对方扔去。橙金色与沙黄色的浓雾在顷刻间笼罩了萨卡兹人的载具，也一并扰乱了他们的视线。法术飞弹与弩箭仍在四处飘飞，却无一直接命中上尉。\n\n上尉露出不怀好意的微笑，又掏出一枚其貌不扬的红色铁球，然后如投掷长矛般狠狠扔向对方。几秒过后，源石尘雾中闪出耀眼光芒，低沉的隆隆声随之传来。\n\n在确认那支卡兹戴尔小队已经葬身尘雾后，上尉紧绷的肌肉终于松弛了下来。虽然三号运输车和里面的源能发电机芯体也跟着完蛋了，但自己至少止住了进一步损失。他索性盘腿坐在指挥车顶上，从军大衣兜里掏出了一根雪茄和一台火机。暗弱的火光转瞬即灭，一缕青烟随风而逝。他叼着烟、吹着风，不禁自言自语道："
 event_vic.8.a: "“我记得内战还没爆发吧？”"
 event_vic.9.t: "古兹曼的沉思"
 event_vic.9.d: "“我们刚刚讲到，可计算的数在密码中的实际应用……”\n\n阿兰·古兹曼刚举着粉笔在黑板上写下几个字母，一阵从窗外传来的愤怒喊声便打断了他。随后，教室上方的水晶吊灯忽然一阵颤动，窗户也在同时发出令人不安的嗡嗡声。他无奈地叹了口气，收起了粉笔与书本。\n\n“教授，您打算走了吗？”听众席间的一个红发学生站起来问道。\n\n古兹曼费力地从用于垫高自己的椅子上爬下来，讲台马上遮住了他娇小的身躯，只露出一个满头金发的小脑袋，“——呃，外边儿又开始静坐战了，大概讲不下去咯。”\n\n“可恶啊教授，为什么他们连伦蒂尼姆大学都不放过！”又一个学生愤愤道。\n\n“泰勒先生，这就不在我们该考虑的范畴之内了。”古兹曼有些担忧地整了整衣领，这场对话似乎在朝着不妙的方向发展。\n\n“萨卡兹人为了战争和利益可以无所不用其极！”一个身材高大的学生站了起来，挥着拳头怒吼道。\n\n古兹曼连忙打断说：“温岑特先生，我不允许你在我的课堂上挑动对立——”\n\n“——我赞成温岑特！而且八大公爵也好不到哪去！”\n\n“喂，说过头了吧！我们现在最该指望的反倒才是诸位公爵吧？”\n\n“我不管！明明是他们把萨卡兹人引进来的，现在却一副道貌岸然的君子相！”\n\n古兹曼闭着眼深吸了一口气，然后夹着尾巴溜出了已经沦为辩论角斗场的教室。一迈出室内，他便闻到了一股淡淡的硝烟味。薄雾笼罩着傍晚的伦蒂尼姆城，周遭建筑在一片暮色朦胧中闪烁着点点灯光。萨卡兹语与维多利亚语在空气中混杂交织，打斗声与怒骂声则如同一曲混沌交响乐的间奏。\n\n“已经这么乱了么……”古兹曼抬头仰望天空，却只看到了层叠不尽的阴云与隐于天边的双月。直至不久以前，他还满心期盼着卡兹戴尔强势介入的喧嚣不会波及伦蒂尼姆大学，但眼下的一派混乱显然推翻了他的推测。\n\n他向来不愿在萨卡兹与诸公爵之争中选择站队亦或发表意见。即便伦蒂尼姆大学的脆弱安宁已然濒于碎裂，他也未曾加入师生间的政治争论。但在这一刻，他却少有地沉思起这座城市与维多利亚的未来……"
 event_vic.9.a: "……一切最终会变成什么样呢？"
 event_vic.10.t: "秃鹫"
 event_vic.10.d: "“真是冷清。”曼彻斯特政务官安普站在一座破败的工厂前，身旁跟着几名随从与军人。他向着自己的搭档佩雷恩准尉使了个眼色，后者便立刻上前几步，礼貌地叩响了大门。\n\n“先生？我们是曼彻斯特市政府，请打开门。”\n\n预料中的回应并未传来，二人面前只有冬日寒风仍在呼呼作响。趁着佩雷恩伤神之际，安普细细打量了一番这栋建筑。破败掉漆的墙体上，几抹烟痕与裂缝依稀可见，两三株枯死的常春藤攀于其上，一切仿佛是社会萧条在街巷角落的一个小小投影。\n\n安普一转头，望见佩雷恩仍在耐心地试图劝说工厂主打开大门。他皱起眉头，不耐烦地说道：“里面恐怕根本没有人，直接闯进去算了。”\n\n“政务官？”佩雷恩露出困惑的表情，“这违反了……”\n\n“你不急我还急呢，我今天下午得赶着送小孩回盖尔兰的娘家。”\n\n“呃，好吧，那，”准尉耸了耸肩，转身对着几个士兵说：“你们都听到政务官的命令了——强制撬开大门，但休得无理。”\n\n一声沉闷的巨响过后，大门轰然倒塌，安普拉着佩雷恩大步流星地跨入门内，便迎面撞见一个手持铁棍的矮小老头。他双眼充血、神色紧张，死死地盯着安普和佩雷恩二人。\n\n“嘿，这位先生……”佩雷恩试图好言相劝，却被安普一把打断：“给我让开，先生。我们是曼彻斯特市政府，依法前来收缴这座破产工厂。不要妨碍我们执行公务！”\n\n老头闻言瞪大眼睛，颤抖着举起了铁棍：“——不！这座工厂是我和我太太经营几十年的心血！我们只是做小本生意的守法公民，绝对……”看清楚安普与佩雷恩身后的那队士兵时，他嘴唇蠕动着扔下了铁棍，“不，尊敬的大人们，不！求求你们，这是我们家最后的——”\n\n安普一把推开了他，冷冷地回头说道：“准尉，让你手下的人把这位先生带走。”\n\n老头发出一阵尖叫，嘶吼着猛扑向安普，但两名士兵立即上前扣住了他的双臂。随后，安普大步流星地离开了厂房，而佩雷恩则叹了口气，走上前对老人说道："
 event_vic.10.a: "“我很抱歉，但这是例行公务。”"
 event_vic.11.t: "贵族府的会晤"
 event_vic.11.d: "“提斯敦子爵，我向您保证，萨卡兹族绝不会威胁到您的领地和家眷……”佩雷恩少尉话音未落，便被一个苍老而急迫的声音打断：“不，别扯谎！你们只会开出空头支票，然后把我们扔在这里等死——”\n\n眼前这位子爵懦弱而无能，他惧怕自己的家业与地位毁于动乱，却在内心深处极度渴望避免此事发生。只需要一个可靠之人为他提供安抚与保证，便能轻而易举地获取他的信任。佩雷恩如此想道。\n\n“冷静下来，大人！”佩雷恩敲了敲桌子，直视着因受惊而脸色发白的提斯敦子爵，“请听我说，八大公爵已经将卡兹戴尔的影响力限制在伦蒂尼姆一带，他们几乎不可能威胁到提斯敦。即使日后发生变故，维多利亚军队也能将您与您的亲属迅速转移至安全地区。”\n\n提斯敦子爵掩面片刻，稍稍冷静了一些，“那我的房子，我的财富，还有我的领地……”\n\n“军队也将全力确保您名下的一切私有财产不受动乱波及。”佩雷恩坚定地说，“子爵大人，我和我身后的两名军官都可以为此作出担保。”\n\n提斯敦子爵喘了口气，“最好是这样。”\n\n“但是，大人，我有一个条件。”佩雷恩微微前倾，眼中迸出锋利的光芒，“假若诸公爵间兵戎相见，您必须效忠于开斯特公爵一方。”\n\n“兵戎相见？我的天哪！准尉，你在说什么？”提斯敦子爵的呼吸再次急促起来，“我无法想象，魔族入侵怎会演变成这等冲突……”\n\n“在伦蒂尼姆，您所说的这等冲突已经爆发了，大人。”佩雷恩冷冷地说，心中对这位养尊处优却孤陋寡闻的贵族充满鄙夷之情，“很遗憾，如果您想在动乱中保全您的家人与财产，就必须向开斯特公爵宣誓效忠，并承诺在可能的公爵冲突中允许开斯特的部队通过或驻扎于您的封地。”\n\n“我怎么能……”子爵瞪大眼睛，双手抱头，“天哪，如果你在威胁我的话……”\n\n“恳请大人恕罪，但我无意胁迫您做任何事，这只是在陈述事实。”佩雷恩从腰间抽出一份印有开斯特纹章的协议书，“如果您对此表示同意，请在这份协议上署名。”\n\n提斯敦子爵低垂着头，陷入了焦虑而痛苦的沉思中。府邸客厅的落地钟滴答作响，时间一分一秒地流逝。暮光透过玻璃长窗照进室内，洒下了斑驳陆离的昏暗光影。"
 event_vic.11.a: "良久，子爵提起了笔。"
 event_vic.12.t: "从天而降的救兵"
 event_vic.12.d: "“别闹了，老天，你们能不能有点秩序！”克拉克·艾特尼抓着头发，对着面前争相抢夺救济粮的难民大叫道。然而，无论他喊得有多大声，被饥饿冲昏头脑的难民们都仿佛聋子一般充耳不闻。\n\n“看啊，看啊，这是谁来啦？”在艾特尼身后，一名西装革履的年轻政客正抛着硬币走来，一丝戏谑的神情在他脸上浮现，“哇，真令人难以置信，连我们的枢密院长都被拉去发救济粮了。”\n\n艾特尼转头盯着他，“布朗伍德？你难道不该待在内阁办公室吗？”\n\n“哎呀，这个问题应该由我问你才对。”布朗伍德略带讥讽地笑了笑，随即正色道，“咳咳，院长阁下，我来向你传达八大公爵的意愿。”\n\n“什么？”艾特尼警觉地竖起了两只耳朵。\n\n“嗯……他们同意为社会援助署提供更多食品和日用物资，并承诺在伦蒂尼姆市内设立更多救济站点。”布朗伍德将硬币朝天一掷，然后稳稳接住，“看来，我在公爵会议上的游说算是有点效果。”\n\n“你可真行！”艾特尼转身与布朗伍德击了个掌，“那么，新一批援助物资什么时候才会到？”\n\n布朗伍德正准备开口时，某种刺耳的引擎噪音却从半空中传来。二人不约而同地仰头望去，只见一架漆着红十字标志的帝国旋翼机正缓缓降低高度，机下的吊舱中堆满了装载各类物资的板条箱。\n\n“乖乖，瞧这阵仗……”艾特尼压低声音惊叹道，布朗伍德则靠在墙边吹了个口哨。在两人身后，大批饥肠辘辘的平民也高举着手欢呼旋翼机的到来。\n\n直至旋翼机与货物吊舱都安然着陆后，艾特尼才一拍脑袋、惊觉不妙，猛地冲到落地话筒面前喊：“喂喂，大家听我说！别忙着抢东西，一步一步排队来，热汤人人都有份！”"
 event_vic.12.a: "“这才对嘛。”布朗伍德笑道。"
 event_vic.13.t: "杯水车薪"
 event_vic.13.d: "“汤姆，听说帝国银行要给小企业主们提供商业救济。”伊斯克手上抓着一把扑克牌，正一脸狡黠地望着面前的两名对手，“喂，我可以首攻了吗？”\n\n“你请便。”汤姆伸手整了整破旧的领带。他是一位陷入融资困境的企业总裁，眼下只能靠着和朋友打牌来舒缓苦闷。因此，他冷冷地补充道：“对了，伊斯克，如果帝国银行真打算给小企业发放什么救济——那么你现在已经知道了，因为我会马上告诉你。”\n\n“那你的消息实在有点不灵通，连伊斯克这个小傻帽都比你强。”汤姆身旁的发牌人，泰晤士报记者吉布森此刻开口道。而当伊斯克以令人目不暇接的速度赢下第一墩时，他则哼了一声，“好吧，看来伊斯克也不是小傻帽。”\n\n“等等，什么叫作我消息不灵通？”汤姆的双眉因困惑而扭在一起，“这么说来，帝国银行的商业救济是真的？”\n\n“惊喜！嘭。”吉布森用手比出一把枪的形状，假装朝天扣动了扳机，“内阁办公厅在今天上午刚刚放出的消息，现在还只有几个大报社的记者知道内情。啧，我告诉你们是因为兄弟情深，可别把这件事儿透露给别人。”\n\n“好，好。”汤姆笑着甩出一张扑克牌，“那你知道救济金额具体有多少吗？”\n\n吉布森托腮思索片刻，说：“应该不会太大。但从内阁办公厅发言人的豪言壮语来看，这笔钱足够他们把大多数濒临破产的企业从泥潭里打捞上来了。”\n\n“当然，我这些话可有一个前提条件——你的救济金不会被某位地方官给偷偷吃了。”吉布森摇了摇头，“你知道的，这种事情在维多利亚可不见怪。”\n\n“这倒是对的。”汤姆叹了口气，将手中的牌丢在桌上，“那就让大家祈祷帝国政府这次开开恩吧，否则我就惨了。”\n\n“乐观点，汤姆，活在当下。”一旁的伊斯克则得意洋洋地清点着手牌，“举个例子——你看，现在我好牌在手，赢钱才是硬道理！”他将扑克牌一把拍在桌上，又赢下了第二墩。"
 event_vic.13.a: "活在当下。"
 event_vic.14.t: "有关河口郡的古怪案件"
 event_vic.14.d: "当喝下又一杯对他而言有些太甜的拿铁咖啡（因为局里不提供免费黑咖啡），并顺眼看了看墙上高悬的钟表之时，贝恩斯才意识到他又挑灯夜战到了天明。自入职以来，这位警探从未收到过如此古怪的调查档案。一支好好的陆军部队，竟不知为何突然像中了咒般集体将武器投入当地的钢厂熔炉，随后便一同逃入荒野。就单这寥寥数十字即可阐述清楚的事情，就使他在第一次看到时大脑足足宕机了两分多钟。而随着对这一系列档案的阅读愈发深入，更为离奇与古怪的内容则使贝恩斯更为神情恍惚。\n\n“这个阿尔图罗到底脑子有什么问题……还是说萨科塔人都这个鬼样子？”当将咖啡杯放下时，贝恩斯愈发感到怀疑人生。在最初接手调查时，他还从未想到这桩案子竟然会同一位声名狼藉的拉特兰音乐家兼通缉犯牵扯上关系。\n\n“经我们调查其履历，发现其于不久前曾参与过对（已删节）剧院的清剿任务，当时该剧院被怀疑与塔拉分裂分子有所勾连。但剧院本身并非重点，重点在于当时正于剧院中演出的萨科塔音乐家阿尔图罗·吉亚洛……”档案中是这样写的。而正是自这段起，接下来的内容便越来越倾向于阿尔图罗其人而非案件本身。一晚上的高强度阅读虽难以使贝恩斯推理出些什么新东西，但他至少摸清了这阿尔图罗的“精彩履历”。\n\n1086年时，便有关于她在拉特兰城某疗养院进行公益演出，却导致该建筑被源石技艺与数千气球一同拖拽着拔地而起的记录；1091年，哥伦比亚联邦法院大法官马歇尔自立为帝，并以皇室名义颁布持续“感染者解放法令”，此前这位大法官曾被目击醉倒在母校的草坪上，而阿尔图罗正在一旁演奏空酒瓶；1093年，她受邀到萨尔贡塔尔萨王酋领公开表演，可王酋在演出中途勃然大怒并下令所有听众驱离现场。随后不久，该地便爆发起义，积怨已久的领民涌入王宫。而据亲历者回忆，狂乱的琴声贯穿了整场起义，直到王酋被推上绞刑架……\n\n回顾这一个个放在幻想小说里都过于离谱的真实事件，贝恩斯的大脑近乎再度宕机。他曾想过，或许不论如何，都应该先去替拉特兰人逮捕这位通缉犯。可在继续查资料时，贝恩斯才发现阿尔图罗事实上早已消失得无影无踪。“或许她已经离开了维多利亚，又或许躲到了一个无人可知的地方？”警探如此想道。随着窗外的太阳缓缓升起，他的困意也愈发难以被咖啡因压抑。"
 event_vic.14.a: "也许真该休息一下了。"
 event_vic.15.t: "浮生一日"
 event_vic.15.d: "按下电梯按钮，望着那些脚下与身旁的破木板与纸壳子，布莱尔心中暗暗对魔族佬骂了句很脏的粗口。真该死，也许他早该离开这间看起来年岁已与他爷爷的爷爷齐平的垃圾公寓，带上儿子回丽茵卡登城郊老家生活。作为一名拥有优厚薪酬待遇的政府公务员，如今这住所的条件显然太糟糕了：自来水与电力系统都经常出问题，隔三岔五就要断电停水，要么就是抽水马桶或者水管又诡异地出了些奇怪毛病。\n\n布莱尔几次三番无法忍受这里，可在他数次比对后，却不得不接受这座“垃圾公寓”就是最佳住址的事实。他曾经找到了两个“优异选项”，可它们一个离儿子的学校太远，一个又离市政府太远，皆难能胜任他和儿子的住宅。不过虽说寻找新家的想法最终告吹，但至少93年年末市政府宣布要搞的“住宅公寓重修计划”还给了他点希望——当然，仅限一段时间。他所居住的这座城市非常不幸地挨在伦蒂尼姆边上，因此“光荣”接受了卡兹戴尔军事委员会监管。魔族混蛋们很快便废除了一系列旧市政府提出的建设计划以“节约开支”，其中便不幸包括了重修公寓的。\n\n叮地一声，电梯门缓缓打开。布莱尔走进昏暗走廊之中，转头再看了看电梯。这么久了，那些木板依旧没人收拾可真糟心。他叹了口气，继续向前行去。“楼层公告板”上原本贴的一些留言不知何时无了踪影，取而代之的是张宣传“伦蒂尼姆人同萨卡兹亲善”的虚伪宣传画。而走廊的灯也好像又坏掉一盏，难怪今天似乎又比往常要暗。\n\n望着这糟心的一切，布莱尔依然以笑脸面对自己那个刚刚小学毕业没多久的儿子小卡特。他还是如以往一般聪明与热情，对那些语法与数学题都了然于胸，几乎犯不上由父亲来指导功课。“或许他就是这肮脏大地上的唯一一束光了”——当往微波炉中塞速食披萨时，布莱尔如是所想。正因如此，他要坚强地活下去，坚强地带领小卡特生活下去。可望向窗外，看着那被薄雾遮掩的残阳，他不禁开始思考一个问题："
 event_vic.15.a: "“继续待在这里真的适合我们吗？”"
 event_vic.16.t: "蓝天先生"
 event_vic.16.d: "卡特虽然年纪不大，但这并不代表他对时事没有半点察觉。报纸和电视里关于萨卡兹人的报导，邻居间的窃窃私语，还有父亲昨日眼中的焦虑神情——这一切似乎都预示着将有大事发生。而现今，望着将行李一件件塞入汽车后备箱的父亲，他意识到自己的想法似乎并非杞人忧天。\n\n“好了，儿子，我们爷俩终于把东西收拾好了。看好你手上的地图，我们必须趁魔族佬封锁所有道路前远离伦蒂尼姆。”二人分别坐上汽车的驾驶座与副驾驶座，布莱尔小心翼翼地关掉了收音机等“危险”的电子产品，并再度检查起汽车的状况。他小声嘀咕起各项数据：“液化源石……满的，轮胎……没问题，还有引擎……差不多。——好了，终于可以离开这个鬼地方了。”\n\n汽车于冷清的大道上行驶，布莱尔依然为是否能够逃离伦蒂尼姆而发愁，而小卡特则思考着更多东西。他想提出自己好像还没到能坐副驾驶的年纪，可又不敢说出来，只得看向窗外疏解情绪。他记得自己在先前曾在某本地理读本中看到，他所居住的城市位于伦蒂尼姆以东，在古代还曾经受不少国王喜爱，常作为他们狩猎或度假的地方。可卡特从未见过国王或是皇帝——他只在课上学到：自1072年暴民们杀死阿利斯泰尔二世起，维多利亚便成为了无皇帝的帝国，或许未来也找不到新的皇帝。\n\n卡特不是很在意皇帝和公爵，他再度看向窗外，却发现汽车恍然已行至乡村。那是一片或许曾经还焕发着生机的田野，如今却已遭荒废。而不远处则能够看到风车与牲畜，可当它们逐渐靠近之时才能看清牧场的冷清。卡特还记得上一次见到它们的时候，那似乎是他还小的时候，父母亲一同带着他坐火车到伦蒂尼姆。那时正值金秋，麦浪在田中翻腾，而牧场中的瘤兽与羽兽也似乎在为丰收报喜。\n\n卡特还记得那风景，可他已经难以想起母亲的样貌。曾经，他在离这条公路不远的铁路上前往伦蒂尼姆。而如今，又要沿着这条道路离开。望向已经愈行愈远的铁道口，卡特不禁开始遐想列车行驶的场面。而当他沉浸于想象世界的纷繁中时，汽车已载着父子二人悄然逃离了伦蒂尼姆。"
 event_vic.16.a: "离开吧，离开吧，永不再回头。"
 event_vic.17.t: "丽茵卡登在呼唤"
 event_vic.17.d: "“伦蒂尼姆局势进一步恶化，一位独立记者发表对卡兹戴尔军事委员会统治的担忧……”换台。\n\n“温德米尔公爵再度呼吁诸公爵团结一致并驱逐魔族占领军，然而至今似乎仍未有显著成效……”再换台。\n\n“如果大家团结一致，往卡兹戴尔-维多利亚团结的路来走，我们就一定能够复兴帝国！一定能够保卫中陆……”\n\n老人的表情显得多少有些不耐烦，他缓缓站起，走到电视柜前关掉了这只会输出坏消息的机器。“怎么所有频道都在播政治宣传？就没有点别的吗？”老布莱尔又叹了口气：“伦蒂尼姆状况一直不好我很清楚，可这地方小电视台不能播点轻松节目吗？报纸上头条全是公爵和魔族间的破事，收音机也差不多，除去那个叫‘披萨’还是什么的流行乐队的音乐就满是时政，搞得人人都心神不宁。”\n\n“所以你看，还是我说的对吧。”老伴笑了笑：“人老了就最好少关注新闻，像我这样，找个爱好——比如园艺啊、养鳞啊之类才最适合我们这种老头老太太。比如说你年轻的时候买了很多书，说要好好研究下它们，现在反倒全都给我用来打发时间了，这就算是一种兴趣爱好。”\n\n叮铃，老布莱尔好像听到了一声嘶哑的“叮铃”。那似乎是门铃的声音，他对此印象深刻。那门铃十年多前声音还很清脆，而如今随着岁月侵蚀却只能发出古怪的声音。\n\n叮铃，嘶哑的门铃声再度传来。老布莱尔最初还以为这是他的幻听，可随着第二、第三乃至更多“叮铃”声传来，他已可以确信的确有人在按门铃。“你听到门铃声了吗？蒂娜？”布莱尔向大门走去，他实在难以想象这偏僻的乡村寓所会有谁上门拜访，而透过锁孔看到的景象更是令他大吃一惊：那是他的儿子小布莱尔，还有小布莱尔的儿子——也就是他的孙子。\n\n老布莱尔尽可能抑制住自己的惊异之感，拉开房门。他没有看错，也没有出现幻觉，面前二人果真是他的儿子与孙子。\n\n“天啊……”尽管做好了大多数心理准备，老人仍为儿子的突然到来而惊讶得难以组织语言。“……布拉，你怎么突然就出现在这里？连打个电话告诉我要回老家都没？”"
 event_vic.17.a: "望着儿子风尘仆仆的面孔，老布莱尔不禁回想起那则电视新闻。"
 event_vic.18.t: "顺其自然"
 event_vic.18.d: "“我来帮忙搬行李，快快进来吧。”在勉强平复情绪之后，一行泪从老布莱尔的脸颊流下。坦白来说，他自魔族佬接管伦城后便相当担忧儿子的状况。虽然儿子住的那座城市并不是伦蒂尼姆，但它离帝国首都的咫尺之距依然叫人大为忧虑。不过，虽恐惧之心常伴老人，但他终归相信命运会给予他公正之果。而如今，随着儿孙完好无缺地出现在面前，老布莱尔可算能够告诉自己：维尔德终究站在他的那边。\n\n祖孙三人，以及孩子的奶奶蒂娜都参与了这场“卸货行动”。尽管扛的行李一个赛一个沉，老布莱尔依旧没有停下他最爱的“维式幽默”。\n\n“哈！小布拉。”老人卸下一袋面粉：“你还是最爱哈廷牌低筋面粉。”\n\n“嘿！儿子，这不是你小时候就喜欢吃的乌萨斯果酱吗？要是以后真和魔族干仗了，它可是能当战略物资！”\n\n“嗨！孩子他爹，你的移动终端怎么在一堆衣服里面？难不成像扮演‘灰礼帽’那样的高级特工？”\n\n在这些乱七八糟的幽默中，小布莱尔时而同父亲母亲一起哈哈大笑，时而又为一些陈年老话题感到尴尬。而小卡特有些难以接受爷爷某些笑话的粗鲁部分，但他依然对这位许久未见的长辈好感颇佳。祖孙四人在一顿七手八脚后可算将所有行李罗列整齐，而正在这时，老布莱尔先前煮的茶也刚好烧开。\n\n“真巧啊。”老布莱尔端来茶壶。四人随意地坐在茶几边，而那位最长者正一一为人们倒茶。“大家喝杯热茶暖身子吧。——对了，布拉，我差点忘记问了，你们是怎么想到回老家的？大伦蒂尼姆的状况又怎么样？是不是还算不错？”老人的语气相比刚开门时要舒缓不少。\n\n“爸，别说笑了。”小布莱尔抿了口茶。“我先前所在的那座城市……唉，和伦蒂尼姆也差不多算是被魔族给占领了。街上遍地是萨卡兹鬼子和本地二鬼子，更荒诞的是，这帮外国侵略者一边取消了旧市政府的公共工程项目……一边还宣传什么‘共荣’、‘团结’之类的。每次看到那些标语，我心里都相当恶心。”\n\n“时事艰难啊……”老布莱尔在拉下窗帘前看了看远方，那地平线上的落日仿佛在暗示着什么，而远处若隐若现的火车汽笛声也使长者感到一丝悲凉。但看了看身边的老伴与后辈，他的心还是重新温暖起来。"
 event_vic.18.a: "“幸好我们能够在一起。”"
 event_vic.19.t: "永远的草莓地"
 event_vic.19.d: "尽管魔族占领军的阴影仍在人们心中，而新学校中的老师与同学们也都对伦蒂尼姆的事态忧心忡忡，但卡特依然爱上了在丽茵卡登郊区的生活。好吧，虽然父亲因为工作变动没法再送他去上学；而爷爷奶奶每天也在菜园里忙得很，他只能一个人上学去。但至少……那辆老自行车还不错！回家和上学路上虽说大多数时候找不到人说话，但却能够享受穿梭于城乡交界地带的感受。\n\n这里或许难称得上多么美丽，但相较于那座伦蒂尼姆以东的肮脏小城已经相当棒了。散发着生机的麦田、郊野中活蹦乱跳的动物、还有那些脸上甚至能看出希望的行人……尽管在这里遇到了不少不便，卡特仍如常热爱他的生活。\n\n今天，卡特如常骑车回家，却在半路上遇到了一群游行的人，而在道路两侧也有二人正窃窃私语，谈着些似乎很重要的话题。\n\n“叔叔……我能冒昧地打搅一下，问问你们在讲什么吗？”在好奇心驱动他说出这句话之前，小卡特已经做好了被拒绝的预期，可结果却异于他的想象。\n\n两位男子中的矮个子转过头来，他叹了口气，随后说道：“我们在聊的东西，小兄弟你看街上的那帮人应该就清楚。他们来游行，是谴责诸公爵对首都盘踞的魔族不够强硬的。可好死不死，管咱们城的温德米尔公爵——她正是态度最强硬的一位。”\n\n“是啊。”另一位高个子附和。“所以这场游行莫名其妙地就从反政府游行变成亲政府的了。你看，他们甚至在高举着温德米尔公爵的画像，一边大骂：‘弄死魔族佬’，一边高喊：‘公爵万岁’。可还有谁记得，他们昨天还在批评议会呢？”\n\n“政治就是如此无厘头的东西。——对了，说到公爵，听说她正在制定一项大计划……”在不经意间，卡特已经于这二人的谈天说地中骑上自行车，离开了这条相当“热闹”的街道。或许那位矮叔叔的话是对的，在许多时候，政治的确如今天所见一般没那么严肃。"
 event_vic.19.a: "世界如此荒谬。"
 event_vic.20.t: "于风中飘摇"
 event_vic.20.d: "“战争已经无可避免。”当父亲说出这句话时，小布莱尔不禁打了个寒战。没错，他还在大伦蒂尼姆时便能感到局势的不断恶化，但从未有过关于战争甚至国家分裂的假想。虽表情依旧沉稳，坐在父亲与爷爷身边的卡特内心却已然翻涌。他或许尚且幼小，但并非不知道爷爷所说战争的涵义。但在还未回到家乡时，卡特便清楚魔族的占领终究会引来报复，也就是他们一家人所谈论的“战争”。但在他看来，或许与卡兹戴尔的战争还不是最糟的。若公爵之间未能团结便先起干戈……维多利亚又会走向何方？卡特已经难以想象，他还是决定继续倾听爷爷的想法。\n\n“从近些天的了解来说，我可以确信这场卡兹戴尔人占领首都的闹剧迟早要结束。前天我去了丽茵卡登城里——和你父亲一起。对吧，孙子。”老布莱尔看向卡特，随之将一幅地图搁在茶几上方。“过去进城的时候总是能见到一派欣欣向荣，或者稳定安宁的景象。可如今，随着伦蒂尼姆不稳，像是我们所在的边疆也人心思变。”\n\n老布莱尔将一颗果仁放在伦蒂尼姆的位置，并随后以不同颜色的纽扣组成一簇簇“网络”。\n\n“卡特，还有布拉。看，这颗果仁就是魔族占领军，而这些纽扣是开斯特公爵、那些则是温德米尔公爵……自当年革命推翻阿利斯泰尔二世皇帝后，八大公爵便拥兵自重。如果他们能够团结起来，必然可以赶跑侵略军。”卡特看到爷爷将诸色纽扣逐一移动到地图上“伦蒂尼姆”之边，它们好似组成了一股浪潮，又或是持长枪的方阵，将那颗象征占领军的果仁团团包围。\n\n“公爵们一同收回伦蒂尼姆或许是此事的最好结局，可若他们没能团结，反而同室操戈呢？”老布莱尔将地图上的“棋子”一一“洗牌”，并放置了几枚饮料瓶盖象征边疆的分离主义者。“当他们打得火热之时，塔拉、下高卢甚至盖尔兰的分裂分子行动起来，而莱塔尼亚也恐怕会对我们的东疆发起渗透。在无尽战火之中中，帝国将会生灵涂炭……”\n\n未等卡特与小布莱尔从那可怕设想中缓过来，长者便开启了下一个话题：“所以，布拉，还有小卡特。无论这两种设想谁会真正发生，我们都必须做好准备。如果战端一开，像是世界大战（即四皇会战）时的物价管制与配给制必将重返。我们家庭之中，只有我和蒂娜清楚在那种情形下如何生存——必须尽早做好准备。”"
 event_vic.20.a: "暴雨来临之前？"
 event_vic.21.t: "漫长而曲折之路"
 event_vic.21.d: "《向伦蒂尼姆的进军失败，旧日团结已成幻影？》\n\n《安费莉丝·温德米尔的独行，为救国还是揽权力？》\n\n《下高卢分裂主义再兴，诺曼底公爵发表严厉谴责》\n\n眼神扫过晚报上的一行行文字，小布莱尔的瞳孔愈发放大。或许过去父亲对战争的两种预测未能成真，但如今发生的事情的确在很大程度上贴合了老人家的预言。公爵们的确发动了一场针对魔族的“联合进军”，但它虽名为“联合”，实则只是温德米尔公爵对占领军的绝望冲击，而最终也令人毫不意外地落败。\n\n叮铃，那嘶哑的门铃声响起，是老布莱尔与蒂娜回来了。小布莱尔“噌”地站起，以百米冲刺般地速度跑到门前为父母开门，而那二位亲人的表情与他一样充满惊恐。\n\n“我早就料到了这一天……”一字一句从长者口中吐出，他在老伴搀扶下勉强走进房间，一屁股瘫倒在那根本称不上“软”的沙发上。“就不该天天关心时事，搞得这事发生的时候和外面那些小年轻一样惶恐万分。”他的心率不亚于任何一个短跑路上的运动员。\n\n“知道联合进军失败意味着什么吗？公爵们的不和人尽皆知，但在驱赶占领军的重大事件上依旧我行我素……”老布莱尔拧开纯净水瓶，匆忙灌了口水润喉。“……这意味着，我们勉强维持的帝国，就将陷入‘准分裂状态’。”\n\n“议会就快要散摊子了。”他直起身来。“这不是什么滑坡，不过是根据过去发生的事情做出的合理推测。人们无比清楚，维多利亚的中央政府早就死在了1072年。如今在维持的，不过是公爵们拼凑起具的躯壳罢了。而在联合进军的失败后，这具躯壳显然已无法再维持太久。”\n\n小布莱尔从未发现，父亲的话竟能够如此一针见血。或许这位如今的“乡下老人”在年轻时也有些从未向他诉说过的辉煌。拾起在茶几上搁置的那份报纸，他一度想将其撕得粉碎。“可那样，又能改变什么？”一个声音从小布莱尔的脑中响起，而一行泪也不争气地从眼角流下。"
 event_vic.21.a: "在没有游鳞的黄金蒿中……"
 event_vic.22.t: "垂垂老矣之雄狮"
 event_vic.22.d: "维多利亚帝国无疑是核心圈中的强权，泰拉中陆的霸主。她拥有继承自四皇会战遗产的强大军队，广袤的领土与海外殖民地，以及在泰拉诸国不俗的影响力。她长期有着建立维多利亚单极化国际体系的美丽梦想，也曾为此不断向外扩张，输出影响。1072年前，皇帝权柄似乎稳如高山，而帝国的力量也接近顶峰。可变故，正是从那年开始。\n\n自击败高卢的至耀时刻已过去四十年矣，但天下无不散之宴席，亦无不终之盛世。1072年革命将阿利斯泰尔二世皇帝推上了断头台，而广泛的社会运动亦使维多利亚帝国动荡至今。比这更糟糕的莫过于后来发生的伦蒂尼姆金融潮，这两个当代历史上的重大事件致使本来繁荣与稳定的政治、经济皆不复过往。今日的维多利亚虽仍维持着广泛霸权，但已不再拥有鼎盛时期的力量。\n\n如今国内状况绝难被称之为稳定，古代维多利亚王国与古塔拉王国之间的纠缠缘分，抑或说德拉克与阿斯兰王族之间纷争的遗产依旧影响着国家。塔拉人长期在进行分离主义活动；盖尔兰的地方主义者向伦蒂尼姆索取更多自主权；高卢复国主义者躁动不安；甚至连帝国势力范围内的一些地区都试图脱离控制。\n\n与社会上的不稳一样，皇帝死后的王位空缺也在影响着维多利亚之局势。王座空悬致使议会掌握了更大权力，但它长久处于不休的争吵与混乱之中。真正掌握权力者并非议会本身，而是其议员——即那些在过去的扩张中获得崇高声望的贵族们。\n\n权势滔天的八大公爵都已盘算着他们的心思，或是成为权力集团的中心，或是与其他公爵结盟对立。何其不幸，公爵们之间的争斗甚至有时会把自身利益置于国家至上。就在不久之前，首都伦蒂尼姆便不幸被卡文迪许公爵（愿他安息）邀请来的“卡兹戴尔军事委员会”实际控制，而其领袖特雷西斯更是个难以处理的危险人物。\n\n无论维多利亚的未来将走向何方；无论帝国何时能够结束没有皇帝的空位期；无论自1072年革命以来的政治混乱会在哪一刻画上句号，显然公爵们都须要先解决这个“肉中尖刺”，才能坐下来商谈更远大的问题。"
 event_vic.22.a: "未来将何去何从？"
 event_vic.23.t: "新地方军"
 event_vic.23.d: "若谈及如今的维多利亚军队，先皇弗雷德里克三世的全方位军事改革无疑是个逃不开的话题。这位伟大的军事家大刀阔斧地修改了军队架构，并建立了一支由皇帝及议会直接指挥的强大职业军队，而正是这支军队击败了科西嘉的野望，也为帝国打下了今日霸权的基石。\n\n世人皆知维多利亚军队的强大，可在由中央直控的部队之外，属于各公爵的武装力量却在很多时候不为人所注意。事实上，这些地方性武装力量的作用虽在弗雷德里克三世军改后很大程度上遭到削弱，但随着1072年革命以致如今王位空缺的局势，它们又逐渐回归过往地位，再度成为了维多利亚国防体系不可或缺的一部分。而在魔族入侵，帝国处于累卵之危的当下，这些地方部队也变得至关重要。\n\n随着有关扩大地方部队的提案在议会中开始讨论，应当把现有资源投入到哪一位公爵所控制的武装力量上成为了争论的焦点。考虑到东方的边防缺口及南方不断的分离主义躁动，有许多议员认为优先支持温德米尔旗下的边防军与威灵顿在塔拉的部队是最佳选择，但认为高多汀或开斯特公爵更需要议会支持的人也不在少数。但最终，议会决定专注训练……"
 event_vic.23.a: "……高多汀公爵的部队。"
 event_vic.23.b: "……威灵顿公爵的部队。"
 event_vic.23.c: "……温德米尔公爵的部队。"
 event_vic.23.e: "……开斯特公爵的部队。"
 event_vic.24.t: "军火速递"
 event_vic.24.d: "从古至今，对于军事而言，武器装备都是十分重要的。可在魔族入侵如达摩克里斯之剑悬于头上，内部困境却仍未解决的今日之维多利亚，各地部队的军备状况却大多面临着不同程度的欠缺。而为尽可能缓解这一问题，将军用物资转移到需要它的地方，最新的议案已被提交到议会。若其得以通过，便能够赋予议会在接下来将大量军用物资调配到某处的权力。\n\n可在高堂之上，各大公爵的支持者们却就这些军火究竟该被调往何处产生了争议。“公说公有理，婆说婆有理。”正如这句炎国的俗话一般，无论是支持将武器调配给哪位公爵的说法听上去似乎都不无道理。但最终，还是有一个观点成为了辩论的最终胜者，而这些武器也将会在未来被送往……"
 event_vic.24.a: "……高多汀公爵领。"
 event_vic.24.b: "……威灵顿公爵领。"
 event_vic.24.c: "……温德米尔公爵领。"
 event_vic.24.e: "……开斯特公爵领。"
 event_vic.25.t: "战时民用工厂建设选址"
 event_vic.25.d: "考虑到未来与当下占领维多利亚首都的“卡兹戴尔军事委员会”可能爆发的冲突，议会已开始讨论修建战时民用工厂，以备战时民生需求的议案。虽说关于施工、招标、承建之类问题的讨论引发了不少冲突，但工厂选址问题才是当下议会中最大的争议。\n\n考虑到当地优厚的基础设施与工业基础条件，开斯特公爵领被认为是一个优秀的选择。但温德米尔、高多汀与威灵顿公爵的支持者们也提出了他们各自的意见，以诸如“应当优先带动工业弱势地区产业”、“边疆更需要工业建设”、“塔拉地区再不发展就得被共和军攻占”等等理由鼓吹优先在他们所支持地区修建战时民用工厂的合理性。而在当下这场辩论之中，最终获得胜利的是……"
 event_vic.25.a: "……高多汀公爵。"
 event_vic.25.b: "……威灵顿公爵。"
 event_vic.25.c: "……温德米尔公爵。"
 event_vic.25.e: "……开斯特公爵。"
 event_vic.26.t: "战时军用工厂建设选址"
 event_vic.26.d: "考虑到未来与当下占领维多利亚首都的“卡兹戴尔军事委员会”可能爆发的冲突，议会已开始讨论修建战时军用工厂，以备战时军用需求的议案。虽说关于施工、招标、承建之类问题的讨论引发了不少冲突，但工厂选址问题才是当下议会中最大的争议。\n\n考虑到当地优厚的基础设施与工业基础条件，开斯特公爵领被认为是一个优秀的选择。但温德米尔、高多汀与威灵顿公爵的支持者们也提出了他们各自的意见，以诸如“东部边防军亟待武装”、“卡拉顿更需要军备增援”、“纳斯尔纱的卫戍部队再缺武器这城迟早要被共和军攻陷”等等理由鼓吹优先在他们所支持地区修建战时军用工厂的合理性。而在当下这场辩论之中，最终获得胜利的是……"
 event_vic.26.a: "……高多汀公爵。"
 event_vic.26.b: "……威灵顿公爵。"
 event_vic.26.c: "……温德米尔公爵。"
 event_vic.26.e: "……开斯特公爵。"
 event_vic.27.t: "议案通过"
 event_vic.27.d: "尽管伦蒂尼姆的议会已成过去，但公爵们在临时议会中的争论烈度仍不亚于往昔。不过这一次，大小贵族们可算能够松上一口气了。在经过一系列复杂的立法流程，并获得大多数公爵的支持后，近期在讨论的议案可算获得通过，而临时议会中不同派系的政治博弈也算是告一段落。\n\n传统上来说，议会议长总是由皇帝亲自担任，掌握着至高的权力及在议员之间调解与统合的职责。但由于几十年来的王位空缺，这个职位已经事实上成为了一种礼节性的“冗余设计”。随着现任临时议长正式签署法案，这份文件中以白纸黑字写就的蓝图也将投入实际。\n\n或许无论在议会中，还是广大平民百姓的谈论声中，都会有人对新的法案抱有不满之心，但这项议案的通过本身便说明了维多利亚帝国又向光明前途迈进一步。"
 event_vic.27.a: "愿这能够助力我们的事业。"
 event_vic.28.t: "议案未通过"
 event_vic.28.d: "尽管伦蒂尼姆的议会已成过去，但公爵们在临时议会中的争论烈度仍不亚于往昔。或许是因为本次的议案太过激进、触犯利益、甚至是因为看起来有些不靠谱抑或别的原因，这一次的争论最终导向了一个糟糕的结果——对议案的反对之声压过了其支持者的拥护话语，最终致使在表决时议案未能通过。\n\n这一次的失败致使本就不算特别团结的临时议会再遭创伤，民间报刊杂志中亦多有人表达遗憾，抑或发表更为刺耳的批评。毫无疑问，本场失败无疑给本就愈烧愈旺的危机之火又添了把油，或许重振士气将会是个艰难的任务。"
 event_vic.28.a: "别再来了。"
 event_vic.29.t: "六百磅"
 event_vic.29.d: "雪一直下着，不大，但很粘稠。没人知道这场雪会下到什么时候。在一间狭小的办公室中，老洛克威尔心力交瘁。\n\n“拿着，赶紧走。别再点数额了，总共六百磅，摆什么谱？”公司代表的声音从桌对面传来。\n\n“我点了数额就走。”老洛克威尔说道。\n\n“你爱怎么着怎么着吧，我也不急在这一时。铁路废线快两年，你是最后一个签补偿金清算合同的。”公司代表显得是如此不耐烦，而在“五八，五九，六十。”的计数声中，那憔悴工人可算点完了数额。\n\n“哎……这事总算结了。合同签好，钱已点清，现在你可以传出去了吧。”那代表长叹一声，望向墙上挂钟。可那工人依然没有离开。\n\n“天啊，我们马上就要下班了，老伯你还杵在这儿干甚啊？”代表的表情逐渐显得不耐烦，而老洛克威尔只是淡淡地说道：“我只是在想公司当年许诺的那些东西。电影院，公共浴室，托儿所，车间里的盐汽水。有些实现了，有些没实现。但我以前想，已经有的，总不会再变了吧。”\n\n“爱想回家想！你不想下岗，我还想下班呢！”代表下了最终的“逐客令”。\n\n老洛克威尔本想说些什么，但还是咽了下去。他默默走了出去，走到了那糟糕的夜半街道之上。街灯年久失修，一半已经不亮，另一半无力地闪着，反衬得商业区方向的雪夜一片刺眼的橘黄。\n\n“站住。”声音自工人背后传来，可他仍耳不闻，还要往前迈步，但一柄小刀已经抵在他的腰间。天公真是不凑巧，老洛克威尔遇上了一场抢劫。\n\n“我非常清楚，你刚得了一笔钱。现在赶快拿出来，别磨蹭。”看着一言不发的老工人，劫匪威胁道。\n\n“你是机务段哪个车间的？检修车间？咱好好聊两句行吗？你要是真有过不去的坎，我借你……”老洛克威尔缓缓吐出句子。\n\n“别废话，拿钱！”劫匪看似人狠话少，然而老洛克威尔却在他的声音中嗅出了畏惧之感。而见工人毫无反应，劫匪将手中的刀往前送了送，割开了工人的衣服。捅破什么东西的感觉传到手上，劫匪的刀尖却触电般往后缩了几寸。\n\n“你——”劫匪的话尚未说出口，老洛克威尔从怀中掏出不甚厚实的信封，隔着自己的肩膀递了过去。劫匪如临大赦，颤抖着手将信封夺过。等到工人转过身时，歇斯底里的劫匪已经连同补偿金消失在了黑夜里，六百磅就这么被人轻易夺去。老洛克威尔站了一会儿，他慢慢走到马路边，在裤兜里摸了半天，摸出一根烟来，用仅剩的一根火柴点上。"
 event_vic.29.a: "他深深吸上一口烟，仿佛醉了般地蹲下去。一点红光在黑暗中明灭。"
 event_vic.30.t: "伟大的父亲……"
 event_vic.30.d: "男人缓缓推开房门。“罗谢尔，我回来了。”老洛克威尔疲惫地说道，可没有听到任何回应。\n\n“罗谢尔？罗谢尔·洛克威尔！”他的语气显得有些焦急。“跑哪去了？天黑了，又下着雪，我得找她去——”\n\n工人转头望去，却没想到正和女儿打个照面。“爸爸……”罗谢尔抢先开口。“天哪……我听邻居说，你给人抢了……这是真的吗？”\n\n望着女儿的眼睛，老洛克威尔没有直接开口。他只是轻轻地点了点头，以作为回答。\n\n “我刚刚到他们说的地方去，那里已经一个人都没有了。爸！是谁抢了你？其他区的劫匪不会到我们这儿来的，一定是轻工业区的人，不会错的。罗他甚至还知道你今天领补偿金！”罗谢尔的语气义愤填膺。“到底是谁抢了你？爸！你有注意他的相貌吗？其他区的劫匪不会到我们这儿来的，一定是轻工业区的人，不会错的。罗他甚至还知道你今天领补偿金！我一定要让他被绳之以法……”\n\n“罗谢尔，算了。”父亲将手搁置在桌上，望着那只“饱经风霜”的存钱罐。“我和他稍微说了几句话，他也是没办法。这也许就是‘可恨人必有可怜之处’的由来吧。”老洛克威尔从桌底抽出椅子，而后缓缓坐下。\n\n在女儿说出下一句话前，他做出了一个“停”的手势，而后看向橱柜。“他下不去手的。真下得去手的人，会直接在背后用榔头敲人脑袋，几个月前那人就是那么干的。”\n\n在这个寒冷的夜里，依旧固执穿着她自制工服的罗谢尔不禁打了个寒战，而他父亲则继续说道：“他身体实在太糟，现在这种时候，也没人愿意借他钱，他才不得不抢。大家都是工友，他只是一时糊涂。等到光景好起来……总会还的。”\n\n“真的会有那一天吗？”罗谢尔满腹疑虑。\n\n“忘了吗？几年前你过生日，机务段的所有人一起给你用边角料造了一架无人机，还能飞的。——不光机务段，其实整个轻工业区的人都是一家人，我相信他一定会还的。”父亲追忆起往昔，而洛克尔依旧心怀担忧。\n\n“可是……”她还没有完整地说出这句话，便被父亲打断：“不谈这些了……我明天再去街上转转，看看有没有厂子还要锅炉工。实在不行，我还可以做力工活。”\n\n“可你的腰……”罗谢尔叹了口气。\n\n“没事。哪个工人没点小伤小病？我这已经算好的了。不用担心我，早点睡吧。”老洛克威尔起身，而罗谢尔注意到了他的左手仍扶着腰部。"
 event_vic.30.a: "……与艰难的时代。"
 event_vic.31.t: "褪色花瓣"
 event_vic.31.d: "窗外传来齿轮啮合的沉闷轰鸣，整座城市正在晨间调整中缓缓转向。能看见相邻城区的高塔缓慢滑过视野，塔尖的蒸汽排放口喷吐着乳白色的雾团，在春末的微风中迅速消散。稀薄阳光自窗棂斜射进来，能看见相邻城区的高塔缓慢滑过视野，塔尖的蒸汽排放口喷吐着乳白色的雾团，在春末的微风中迅速消散。玫兰莎坐在梳妆台前，手指轻轻按压着左肩，那里隐隐作痛，不是剧烈的疼痛，而是一种持续的、钝重的异样感。\n\n紫罗兰雪松的香气在房间里漫开，却压不住心底翻涌的不安。她掀开衬衫的领口，露出肩头那片暗沉的病灶。黑色的结晶在皮肤下若隐若现，像是某种诅咒的烙印。\n\n“源石结晶。”体检报告上的字句简洁而冰冷：“体细胞与源石融合率2%。病灶位于左肩。”医生说这是轻度感染。\n\n她的目光落在墙角的击剑护具上。父亲当初安排她学习击剑，是为了“改善体质，培养气质”。教练是一位来自炎国的老剑客，在某个冬日午后对她说:“维多利亚的剑术追求优雅，但真正的剑，是为了保护珍视之物。”在那之后，纤细的直刃长刀取代了笨重的西方剑，流畅的步法取代了僵硬的突刺。玫兰莎握紧拳头，那些训练有何意义？连自己都保护不了的人，又如何……\n\n敲门声打断了她的思绪。“玫兰莎。”父亲的声音从门外传来，温和却带着不容置疑的坚定。门被推开，父母并肩而立。父亲穿着深灰色的家常便服，但鬓角的银丝似乎又多了几缕；母亲的妆容精致得体，却掩不住眼底的疲惫。\n\n“我们找到了一家医疗机构。”父亲在床边坐下，“罗德岛制药，专门治疗感染者的组织，医疗技术在泰拉大陆上首屈一指。我们已经和他们联系过了，你不必担心费用和环境。”\n\n玫兰莎沉默着。她知道这是一种体面的流放，将“污点”送到远方。但她也看到了父亲微微发颤的手指，母亲强忍的泪光。这同样是父母能给予的、最后的保护。\n\n“罗德岛不仅提供治疗，也需要有能力的人。”父亲继续说，“你的剑术，你的学识，都不会被浪费。玫兰莎，这不是终点，而是另一个开始。”\n\n窗外，移动城市的汽笛声响起，宣告着又一次启程。玫兰莎看向父母，缓缓点头。左肩的疼痛依旧存在，但此刻，她感到某种奇异的释然。"
 event_vic.31.a: "就像那把纤细的长刀，终于找到了它真正的用途。"

 event_vic.10001.t: "火光热浪"
 event_vic.10001.d: "“唉，又起雾了。我永远习惯不了伦蒂尼姆的鬼天气。我们驻扎在莱塔尼亚边境的时候，虽然气候也说不上好，但下午总是可以晒晒太阳的。去，告诉操舵手，这天气观察站什么都看不到，雷达也会有干扰，该返航了。”隶属于温德米尔边防集团军的一艘高速陆行舰正停泊在伦蒂尼姆大区边缘的位置。理论上，这个位置在移动城市城防炮的打击范围之外，不过显然这艘陆行舰的长官一秒钟也不想在这里多待。\n\n皮尔斯·斯通坐在观瞄系统的显示屏前，他的长官说的没错，无论是肉眼观察还是红外热成像，笼罩在薄雾中的伦蒂尼姆什么都观测不到。碎片大厦、城防炮、萨卡兹军队在城外的驻地，还是那一艘悬浮在高空的飞空艇，都没有任何动静。\n\n“开斯特的部队老实待在自己的阵线里，高多汀的队伍仍然在向后移动，老威灵顿的主力舰队依旧没有露面。除去我们敬爱的温德米尔公爵阁下，剩下的公爵大人照旧是那副观望的样子。巡逻完毕。”军官以一种同时具有傲慢和慵懒的语调向书记官发号施令起来，坐在舰桥后方的那名书记官似乎有些犹豫，毕竟想要把这几句话改成一篇合格的巡逻报告，不是那么容易的一件事。\n\n“长官，那萨卡兹……”皮尔斯鼓起勇气，决定指出长官的问题所在。仗着自己平日里和这位长官的私情还不错，替他带过好几盒雪茄，长官应该不会为难自己。\n\n“皮尔斯，我当了十几年的兵了，我知道温德米尔公爵阁下想要的是什么。”军官白了皮尔斯一眼，不过如皮尔斯预料，他确实没发大火，“你看不出来公爵阁下备战的真正目的是什么吗？萨卡兹人干了什么，一点关系都没有。”\n\n皮尔斯识趣地把头扭回去，继续盯着显示屏。然后他察觉到了不对劲的地方。\n\n那一架飞空艇的前端，在红外镜头中迅速亮起。\n\n“长官，请来看看这个——”皮尔斯犹疑地向正准备离开舰桥的长官请示，这将是他此生最后悔的一次迟疑。那名军官慢悠悠地走到了显示屏旁边，看了一眼，然后他的脸色骤然苍白，干枯的喉咙撕扯着喊出了那一句没有人想听到的口令。"
 event_vic.10001.a: "“战斗警报！”"
 event_vic.10002.t: "前线报告"
 event_vic.10002.d: "伦蒂尼姆时间1542，我方代号“勇敢”的陆地高速战舰在伦蒂尼姆城东方遭到卡兹戴尔军事委员会炮击，舰体主结构断裂，伤亡情况未知但初步估计数量较大，基本损失作战能力。现友邻部队正在前往搜救幸存者。袭击来源已确认为卡兹戴尔军事委员会未知型号飞空艇，其具体作战参数尚未明确，需要更多交战记录验证。\n\n萨卡兹军队的突然袭击对我军士气造成了严重动摇，若不进行及时应对，军队士气的损失将是不可避免和不可挽回的。并且如果长期对于伦蒂尼姆城内的萨卡兹坐视不管，我军的国内外声望也将受到严重影响，民众将会质疑我们的合法性。同时，如果让卡兹戴尔军事委员会利用伦蒂尼姆的资源持续壮大，其对于我部乃至整个维多利亚的影响都不可预测。"
 event_vic.10002.a: "准备第二次联合进军。"
 event_vic.10003.t: "前线报告"
 event_vic.10003.d: "伦蒂尼姆时间1542，温德米尔边防集团军代号“勇敢”的陆地高速战舰在伦蒂尼姆城东方遭到卡兹戴尔军事委员会炮击，基本损失作战能力。袭击来源已确认为卡兹戴尔军事委员会未知型号飞空艇，其具体作战参数尚未明确，需要警惕其对我军发起攻击的可能。\n\n萨卡兹军队的突然袭击所展现的实力，对我军士气造成了严重动摇，若不进行及时回应，军队士气的损失将是不可避免和不可挽回的。并且如果长期对于伦蒂尼姆城内的萨卡兹坐视不管，我军的国内外声望也将受到严重影响，民众将会质疑我们的合法性。同时，如果让卡兹戴尔军事委员会利用伦蒂尼姆的资源持续壮大，其对于我部乃至整个维多利亚的影响都不可预测。"
 event_vic.10003.a: "准备第二次联合进军。"
 event_vic.10004.t: "技术原因"
 event_vic.10004.d: "“诺伯特区的市民们，你们好。我是伦蒂尼姆城防军代理指挥官，莱托中校。由于移动城市的区域连接模块出现线路故障，诺伯特区将与伦蒂尼姆大区进行短暂分离，届时区域间交通、水电和通信将暂时中断。请市民们不要惊慌，就近前往政府驻地或拥有认证的救济机构，领取储备物资，在家中等待城防军救援……”\n\n虽说广播里反复播放着莱托的声明，但是无论是莱托自己，还是诺伯特区的市民，谁都知道这只是托辞。嘈杂的人群围在被萨卡兹占为营地的一处公园外，这里的每一个人都在一早醒来后发现街区外竖起了一道道隔离墙，更有一些倒霉蛋在前一天晚上便被萨卡兹士兵从家里扔了出来，大部分人被扔出来的时候只穿着睡衣，还有几个倒是多了一层裹尸袋。\n\n“萨卡兹！我们只是想知道发生了什么，这是个合理的诉求！”一个工人模样的男人扒开了挡在面前的所有人，直直地瞪着眼前的萨卡兹士兵，“我们这么多人被拎出了自己的家，被赶到了这么狭窄的一个街区里，没有住处，没有食物，没有自由，现在我们只是想要一个解释！”\n\n“够了，先生，小心……他们带着武器呢！”一个菲林女性颤抖着地试图拉住这个愤怒的男人，但立即被他甩手推开。“放开我！我不需要小心什么！告诉你们，萨卡兹，我在这里住了三十年，这是我的城市！这是我的街区！告诉我，为什么一夜之间诺伯特区开出了伦蒂尼姆？街区外面的这些墙是什么意思？！”\n\n或许是他太愤怒、太激动了，也有可能是他单纯无法看到那个萨卡兹士兵面罩下的表情。在他的嘶吼结束后，他只听到面罩下方传来沉重而沙哑的怒音。\n\n“你凭什么认为……我没有权力？”\n\n砰，砰，砰。一开始是短促的响声，随后是越来越急促而连贯的脆响，夹带着人群逃窜的尖叫与哀嚎。\n\n“队长，我记得长官说，不能对平民使用过度武力……”面对下属怯生生的疑问，那名萨卡兹士兵踢了一脚面前那一具已经被子弹打碎了脸的尸体，轻蔑地笑了笑。\n\n“他又没说不能对‘暴民’进行反击。反正，那个家伙上战场的年头比我还少了两年，事后我去和他解释。”"
 event_vic.10004.a: "“他会原谅我的。”"
 event_vic.10005.t: "善意背叛"
 event_vic.10005.d: "事情变化得尤其突然，在几分钟前，自救军内部还在对于诺伯特区的突然分离商讨对策，然后就被公开频段的呼救声所打断。来自罗德岛的那名博士，在安抚惊慌失措的自救军成员之余，也在内心里暗自感叹，军事委员会的巷战能力，比起卡兹戴尔内战时期精进了不少。\n\n根据自己临时想出来的计划，自救军在城内的高层将分头前往在城外的自救军根据地，萨卡兹暂时还没有能力在公爵们眼皮底下剿灭自救军，而罗德岛和格拉斯哥帮将朝反方向撤离，利用海布里区的运输通道逃出核心城，随后与罗德岛本舰会合。\n\n不过事实证明，在客观的实力差距面前，再天才的战略家也无法避免失败。军事委员会没有预测到这条路线，但依靠城市道路迅速派出了机动部队追了上来，并且将一行人逼进了死胡同中。\n\n“卧倒，做好防御姿态。别怪我没提醒你们。”\n\n一个带有电子声调的嗓音在半空中响起，虽然不知道对方是谁，但博士与推进之王都不约而同地让自己的同行者俯下身子。\n\n一发高爆榴弹从头顶掠过，在接触地面后弹跳了一下，然后精准地扎入那辆刚刚停稳的萨卡兹越野车的底盘，一车追兵瞬间灰飞烟灭。然后一阵难以察觉的闷响声从两侧的建筑传来，微声铳中射出的子弹让用脚追上罗德岛的士兵们倒在了巷子前。\n\n“你们是谁？”阿米娅眼瞳中闪过一丝黑光，站在了博士与那些索降到地面的灰色身影中间。\n\n“不用那么紧张，罗德岛的各位。我们是‘灰礼帽’特别战术行动组，之前我的同事与亚历山德莉娜打过照面，可惜不太顺利。\n\n“不要用那种眼神看我，亚历山德莉娜殿下。我们都是听命办事。”领头的那位灰礼帽把手中的冲锋铳甩到背后，向前迈了两步，“你的姑姑认为你们可以与她做个交易。”\n\n“我喜欢你的品质。”博士微笑道，“不打哑谜。”\n\n“我首先是个军人，你们应当庆幸这一点。如果是那些接受了间谍训练的同僚，可能不会如我一般直白。”灰礼帽微微鞠躬，像是在表达感谢，“尊贵的开斯特公爵希望你们能够为了维多利亚，协助摧毁停靠在诺伯特区的那台飞空艇，扫除公爵部队展开战线的阻碍。”\n\n“为了维多利亚？”推进之王身边的因陀罗挤出厌恶的表情。"
 event_vic.10005.a: "“为了维多利亚。”"
 event_vic.10006.t: "广播热线正繁忙"
 event_vic.10006.d: "“我是戴菲恩·温德米尔，我是戴菲恩·温德米尔，我现在呼叫温德米尔边防集团军群、第一集团军、第二集团军，以及任何忠于维多利亚的友邻部队。\n\n“使用这一频段，是因为情况极端紧急，这一信息必须传达到所有可能接收到它的部队。\n\n“今天下午，维多利亚正统继承人，亚历山德莉娜·维娜·维多利亚殿下，在萨卡兹部队追击下被迫撤离至目前已完全脱离伦蒂尼姆大区的诺伯特区块，而此区块正由于萨卡兹的极端压迫政策，处于严重的粮食短缺之中，饥荒已经不可避免。同时由于萨卡兹术士部队施放的不明源石法术，大量居民感染矿石病，疫情存在失控风险。\n\n“在一次由难民争抢物资导致的骚乱中，维娜殿下为了平息骚乱、保护难民安全，被迫揭露了自己的身份，这在短期内平息了难民的情绪，但也使得殿下的身份暴露，生命安全面临严重威胁。我无法保证，不会有萨卡兹合作者或走投无路的难民选择向萨卡兹告密，使得维娜殿下的藏身之处暴露。\n\n“灰礼帽的一支渗透小队与维娜殿下随行，我的身份可能已经暴露，但目前灰礼帽方面尚未展示敌意，仍然在保护维娜殿下安全并协助撤离行动。此外，在据点附近观察到塔拉极端民族主义者部队活动，不排除对方有袭击我们的企图。与维娜殿下同行的罗德岛制药公司已被证实为萨卡兹内部反对派，可以确认为合作对象。\n\n“我请求任何拥有攻城能力的部队前往诺伯特区块，协助维娜殿下和区块内难民撤离，并且尝试破坏位于此地的不明型号飞空艇，为后续战役扫除障碍。”"
 event_vic.10006.a: "“通讯完毕，这将是我的最后一次通信。”"
 event_vic.10007.t: "捂住耳朵"
 event_vic.10007.d: "推进之王知道这一天终会来临。她之所以只对少数人坦白自己的身份，不只是担忧让那些激进反君主制分子意识到自己一直在和一位公主做朋友，更是害怕那些知道自己身份的人撕下最后一层体面，从而威胁她朋友的安全。她知道，现代国家对于秘密行动的规定慎之又慎，重要目标必然需要经过层层甄别，谁也不想让宝贵的特种部队去袭击一个“长得很像”王室继承人的帮派领袖——除非她的身份已经被证实。\n\n所以当深池紧急应变单位的小队在深夜破窗而入时，维娜其实并不感到意外。戴菲恩是第一个拔出武器的，然后她手中的短剑就被子弹打飞，冲击力将她的手腕震得脱臼。而其他人还没有从难得的熟睡中反应过来，就已经被枪口顶在了脑门上。\n\n“维娜女士，请不要慌张，我们接到了通讯，前来护送您前往安全的区域。”紧急应变单位的领头人倒是没有蒙面，他顶着塔拉人独特的红发，用带有浓厚塔拉口音的句子向推进之王“问好”。\n\n推进之王没有说话，她清楚塔拉人对阿斯兰王室的态度，面前的这个家伙很有可能都只是在压制内心的恨意。她只是冷漠地看着对方，以及其他用冲锋铳指着她的人，等待混乱的到来。\n\n两声枪响，距离推进之王最近的两个深池士兵应声倒下。灰礼帽特别战术行动组从同样的窗子里跳进屋子，然后用枪口对准了深池的人。说实话，维娜在心里想，这场面有点滑稽。\n\n“灰礼帽。”深池紧急应变单位的领头人愤怒地举着手中的冲锋铳，手指已经放在了扳机前，“你们他妈的想干什么，老开斯特与我们是有协议的。”\n\n“开斯特还有一条原则，禁止赢家通吃。她在这些人身上有投资。弗雷迪，如果我是你，我就会带着剩下的队员撤退，这样威灵顿公爵就不会背上刺杀王室成员的骂名。”\n\n“哈！威灵顿那老家伙是死是活都两说呢。”红发的塔拉人冷笑一声，不知道是不屑还是认输，“不过你说得是对的，我们输了。”\n\n弗雷迪摆手，做出撤退的手势，深池紧急应变单位的队员举着枪缓慢从门口退出，始终有一只枪口瞄准着维娜的眼睛。作为最后退出房间的人，弗雷迪对着屋内比了个中指，“尼克，我的队员的命，记得在战场上还回来。”\n\n随着大门被重新关上，灰礼帽的人对耳机里说了一句“威胁解除”，维娜终于松了一口气。她跨过倒在脚边的塔拉人尸体，走回沙发上躺下。"
 event_vic.10007.a: "他们还挺讲礼貌的。"
 event_vic.10008.t: "沉没成本"
 event_vic.10008.d: "“什么叫做他妈的‘在这些人身上有投资’，你说清楚！‘推进之王’，哦不对，应该是维娜殿下！”卡铎尔抄起手边的拳套，向推进之王扔过去。对方没有闪躲，而拳套偏离了推进之王的脸，在惨白的墙壁上擦出一道灰印子。\n\n“不说是吧，那你来说怎么样？摩根？你是不是也像她们一样，是什么曼彻斯特或者伯尔米努姆公爵家的大小姐？”\n\n“婊子养的，那老娘就告诉你！”摩根冲上前，一巴掌打在大吼大叫的卡铎尔脸上，“维娜一直以来给你好脸色，你还真觉得自己他妈的是拳馆里最牛逼的了？”\n\n“你真以为我们一个不贩毒不拉皮条的小帮派，能靠拳馆的收入跟那一点和做慈善没差别的保护费维持运转？你一个没学会数学的混账东西也不指望你看得懂账本，我告诉你吧，拳馆一直在亏钱，从我们抢下来之前就没赚过！”\n\n“维娜不想靠黑拳和赌博赚钱，所以拳馆的资金缺口比以前更大，萨卡兹人进城甚至帮了我们，因为我们还可以靠走私生意赚差价。你知道吗？不，你他妈不知道！你只会每天来拳馆揍沙袋，然后拿架子上的酒喝，并且还不他妈的给钱！”\n\n“我不知道那笔钱是怎么进来的，但是它就是进来了！”摩根咳嗽两声，显然是破口大骂让她的嗓子有些难受，“自从伦蒂尼姆的情况一天比一天烂，每周都会有一个装满现金的包裹被丢进帮派的保险柜，就是那个实际上锁不住所以也没有密码的破保险柜——唯一的作用是让我们看起来是个正经帮派！”\n\n“维娜告诉了我全部，因为她知道是我管钱。我们得到的利益还不止这点。你以为条子为什么不来找我们的麻烦？难道是萨卡兹人来了以后他们突然不贪污了吗？为什么我们总能拿到便宜的威士忌？因为有一群人护着一条从法夫到伦蒂尼姆的地下运输路线！”\n\n“事到如今，你还真以为我们能在这个世道活下来是理所应当？”摩根的语气平静下来，也许是她喊累了，也许是看到面前的卡铎尔已经呆住了，“不管你愿不愿意承认，格拉斯哥帮的好日子，都是阿斯兰王室的福荫——包括你喝的威士忌。”"
 event_vic.10008.a: "“所以我至少会知恩图报。”"
 event_vic.10009.t: "被弃之人"
 event_vic.10009.d: "“戴菲恩阁下，贵安。我是第二集团军代理参谋长丽塔·斯卡曼德罗斯。风暴突击队正在前往诺伯特区外围城墙执行VIP护送任务，预计120分钟抵达计划位置。炮兵部队正在对诺伯特区的‘变形者’部队进行压制，请不要偏离预定撤离路线，以免误伤。通讯完毕。”\n\n戴菲恩背起便携电台，向门口的推进之王使了个眼神。门外的难民已经排成了一个乌泱泱的长队，罗德岛的干员和“灰礼帽”特战队员正在努力维持秩序，对于参与过切尔诺伯格事变后续安置工作的罗德岛而言，这项工作他们已经轻车熟路，不过对于那些特战人员就是另一回事了。\n\n“该走了……推进之王。”\n\n“不行，贝尔德还没跟上来！”因陀罗堵在门口，朝着与人潮相反的方向张望。“揍歪下巴”拳馆在撤离计划决定时已经被格拉斯哥帮放弃，但总有人放不下他们的过去，“摩根说她回去找录像厅老板了……”\n\n“戴菲恩阁下，迅速撤离，重复，迅速撤离！防空部队向我汇报，观察到敌飞空艇正在向你们的方向移动，并且伴随高烈度法术波动！深池部队已经在和它交火……天啊……那是红龙的法术。情报官，给我过来……”\n\n“我们必须离开！”电台里传来的消息每个人都能听到，戴菲恩也少见地怒吼出声。这是她不愿做的抉择，但是现在确实到了选择死一个人还是死无数人的时候了，况且，贝尔德也不一定就……\n\n“汉娜，你快帮我看看，那个人是不是就是麦克拉伦？队伍最后面那几个人里……他刚刚才跟上来的！”摩根欣喜的声音打破了尴尬的氛围，众人顺着她手指的方向看过去，那个脸色苍白的佝偻男人一瘸一拐地走入了人群中。\n\n“贝尔德应该就在附近才对啊，他们难道不是一起……等等，那把蝴蝶刀，贝尔德的刀怎么会在麦克拉伦手里？”\n\n摩根的语气从高昂迅速转变为颤抖，她扭头看向维娜，寻求验证或是安慰。而推进之王同样转过头去，那个不需要说明的最坏结果得到了她的确认。"
 event_vic.10009.a: "每个人都看到了刀上的血。"
 event_vic.100010.t: "两难境地"
 event_vic.100010.d: "“全能”号的甲板上仍然散落着零碎的战场痕迹，弹片、灰烬、血迹，如果夜晚走上甲板的人稍不注意，仍然有可能踩上一脚。推进之王靠着一门高射炮坐下，怀里抱着用破布条裹着的“诸王之息”。这艘温德米尔公爵的旗舰正趁着夜色，带着难民全速驶向最近的大城市，从自己的首都侥幸逃生后，推进之王不愿错过全速行进给甲板带来的凉风。\n\n“殿下。介意我在这儿也待一会吗。”一个沙哑的男声扰乱了推进之王的宁静，虽然与戴着面罩时略有差别，推进之王还是认出了，这是那个“灰礼帽”特别战术行动组的领队，似乎被那些深池士兵称为“尼克”。\n\n推进之王没有同意，也没有拒绝，她知道，反正无论如何这家伙都有话要说。\n\n“很抱歉之前没有闲暇进行自我介绍。尼古拉斯·巴克尔，‘灰礼帽’特别战术行动组队长，呼号‘草房子’。”尼古拉斯在推进之王身边一米多远的地方坐下，显然他还想维持基本的政治礼仪，“其实我到这艘船上以后，得到了新的任务，总部让我们去侦察这艘船的结构。但是我不想做。”\n\n“‘全能’号在卡拉顿城建造，高多汀公爵拥有她的全套图纸，而我们的人已经跑去偷了一份复制品，威灵顿公爵也没有理由不去做同样的事情。这艘陆行舰的结构不是什么秘密。我相信‘荣光’号的图纸，温德米尔也同样有一份。那我们还费什么劲！”\n\n“殿下。”尼古拉斯·巴克尔顿了顿，虽然他摘下了面罩，但这个没有月亮的夜晚，依然看不清他的脸，“你知道，我也知道，萨卡兹根本不是维多利亚真正的敌人，尽管他们很难缠，并且不知道屠杀了多少伦蒂尼姆的公民。”\n\n“我的小队得到的真正任务是，把您和诸王之息带上‘荣光’号。‘荣光’号上的剑座是专门为诸王之息设计的，是启动天灾抑制法术阵列的钥匙。”尼古拉斯站起身来，推进之王这才嗅到，他喝了点酒，“而您，是公爵大人建立统治合法性的证明。”\n\n“开斯特公爵大人对您有‘投资’。我想温德米尔公爵也有，她的女儿必然不可能是出于纯粹的友谊而与您同行。因此，我不会也无权强迫您与我离开，我们最低限度的任务目标，是至少把这把剑带回去，确保抹平萨卡兹对我们的技术优势。”\n\n尼古拉斯有些哽咽，推进之王不知道他想到了什么，她惊讶于一个经验丰富的士兵的多愁善感，但她很快知道了原因。\n\n“抱歉，殿下……不，陛下。我们即将陷入一场内战，而您的抉择将决定数千万人的命运。”\n\n推进之王凝视着尼古拉斯·巴克尔黑色的身影，她在这个身影背后看到了无数的人。她做出了抉择。"
 event_vic.100010.a: "“我会和你走。”"
 event_vic.100010.b: "“把这根铁条拿走吧。”"
 event_vic.100011.t: "紧急通讯"
 event_vic.100011.d: "公爵大人：\n\n温德米尔边防集团军领袖，温德米尔公爵，安费莉丝·温德米尔，于诺伯特区外围战斗中遭遇萨卡兹法术巡飞弹袭击，已确认身亡。\n\n她的继承人，戴菲恩·温德米尔，据悉已抵达集团军司令部，初步控制局势。但由于前任公爵死亡，其控制区内局势不稳，有多重叛乱风险，可能涉及外国势力干涉。我部短期内无法直接干预，但仍需持续关注事态变化。\n\n根据已知情报，维娜·维多利亚殿下正是在此次遭遇战中获救，当前应当处于其控制下。若维娜·维多利亚殿下与温德米尔公爵达成政治联盟，将极大增强其政治威望，反之，若双方决裂，可能对温德米尔方面的局势产生未知的不良影响。"
 event_vic.100011.a: "通讯完毕。"
 event_vic.100012.t: "紧急通讯"
 event_vic.100012.d: "公爵大人：\n\n温德米尔边防集团军领袖，温德米尔公爵，安费莉丝·温德米尔，其旗舰于诺伯特区外围战斗中，遭到萨卡兹军队袭击，温德米尔公爵身受重伤，但生命体征平稳。\n\n此次遭遇战展现出萨卡兹军队超出此前预估的斩首能力。据悉，其使用的是一种由法术辅助控制的土制巡飞弹，具有快速、灵活、隐蔽的特征。我部真诚建议公爵大人加强要人保护力度，尤其增强舰桥、指挥所等中枢场所的防护强度。\n\n根据已知情报，维娜·维多利亚殿下正是在此次遭遇战中获救，当前应当处于其控制下。若维娜·维多利亚殿下与温德米尔公爵达成政治联盟，将极大增强其政治威望，反之，若双方决裂，可能对温德米尔方面的局势产生未知的不良影响。"
 event_vic.100012.a: "通讯完毕。"
