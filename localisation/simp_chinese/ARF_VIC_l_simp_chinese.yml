 VIC_Parliamentary_disagreement_idea: "议会分歧"
 VIC_Parliamentary_disagreement_idea_desc: "在国王离去后公爵议会已经已经完全接管了维多利亚的方方面面，维多利亚目前也尚在平稳航行。但随着公爵们队权力的欲望，维多利亚已然濒临崩溃。在这恐怖的未来成为事实前，我们必须要做点什么。"
 VIC_The_former_king_is_gone_idea: "先王已去"
 VIC_The_former_king_is_gone_idea_desc: "虽然难以承认，但目前维多利亚的皇冠仍然空悬在此。而诸王之息也就此蒙上尘埃。而在现在，我们必须要一个继承者来团结维多利亚，并带领我们重铸辉煌。"
 VIC_Hidden_crisis_idea: "暗藏危机"
 VIC_Hidden_crisis_idea_desc: "塔拉人，高卢人，以及许多的异见者，他们无疑早已在暗中潜藏多年，而在此危急时刻，他们无疑是一把高悬在维多利亚头上的利剑。我们必须要将其反叛的气焰完全挫灭。"
