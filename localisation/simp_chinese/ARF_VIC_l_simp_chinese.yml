 event_vic.32.t: "拼凑的晨星"
 event_vic.32.d: "“我妹妹自杀了。”伯尼灌下一口啤酒，然后向这间昏暗的酒馆说道，周边沉默的人们都抬头看向他。\n\n“她是伦蒂尼姆自救军的一个工人自卫队的小队长，联合进军那天，她满怀希望地带着工友起义，夺取了一座生产军服的纺织厂。”伯尼也抬起头，看向酒馆墙上挂着的电视机，电视上衣着光鲜的“政治分析员”正在冠冕堂皇地说明，开斯特公爵出于“减少国民不必要的流血牺牲”这一高尚理由，停止了向伦蒂尼姆进军的步伐。\n\n“然后，当知道联军永远也不会来之后，她让所有队员扔下武器各自逃生。给我带来消息的那个工友，只知道在他离开厂房后的几分钟，那座建筑就被从内部燃起的大火吞没了。”伯尼的声音很平静，似乎不像一个失去了亲人的人应有的表现。\n\n“没有人看见贝蒂走出来。”\n\n“开斯特公爵不可能在意工人的死活，我们早就知道的。”伯尼接着说，他看见周围不少人都默默地点头，“但是最令人痛心的背叛，就是议会里那些社会党和共产党人，居然到了这种时候，还在开斯特公爵的那个狗屁临时议会里卑躬屈膝！”\n\n伯尼听到酒馆里有个人大声喊道“没错”，于是他继续说道，“所以我们不能再坐以待毙。伯纳姆总书记的计划，你们一定都清楚了。”\n\n他听到铳械上膛的声音。一声，两声，然后是此起彼伏的“咔嚓”声。\n\n伯尼看了看表，推开酒馆的大门，朝天空中打出一发信号弹。几乎同一时间，相同的数枚信号弹在曼彻斯特城的各个街道冲上云霄。"
 event_vic.32.a: "“革命万岁，公社万岁！”"
