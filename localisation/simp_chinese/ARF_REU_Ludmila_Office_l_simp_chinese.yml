 REU_LUD_4075: "她走了。军靴踩在碎石上，发出细碎的声响。大衣下摆被风掀起，露出腰间那把短刀——刀鞘上的划痕还在。"
 REU_LUD_4076: "你站在谷仓里，嘴里还残留着她嘴唇的触感。火堆在外面噼啪响了一声。麦田沙沙地响了一整夜。"
 REU_LUD_4300: "巷口的军靴声越来越近。不止一队——从三个方向同时压过来，靴底砸在冻土上的声音像闷雷。柳德米拉把地图塞回口袋，侧耳听了一秒，伸手抓住你的手腕。"
