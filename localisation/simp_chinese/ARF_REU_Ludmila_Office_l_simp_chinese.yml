 REU_LUD_4900: "车间里的工人们已经散得差不多了，只剩下几个技术员在角落里收拾工具。你站在洗手间门外，手里攥着那卷丝袜，纸带被你捏得发皱。洗手间的门虚掩着，里面传来水龙头流水的声音。"
 REU_LUD_4901: "你还没走？"
