 REU_LUD_4005: "嗯。"
 REU_LUD_4006: "她咬了一口大列巴，嚼着，目光盯着火。火光在她脸上跳，把下颌的线条照得格外锋利。沉默持续了很久，久到树枝被削断了一截。"
 REU_LUD_4007: "你今天冲进去的时候，想什么。"
