 REU_LUD_5281: "她收回手，但没缩回座位角落。就坐在原处，裙子松垮，头发散了一半，光着脚。车厢里很暗。她的呼吸很轻。你能闻到她身上残留的宴会厅的香水味，混着一点她自己的气息——金属味，矿石病的那种，很淡，像铁锈浸在雪水里。"
