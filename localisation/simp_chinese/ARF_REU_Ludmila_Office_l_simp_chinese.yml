 REU_LUD_3757: "你快要到了。她能感觉到——脚心里的■■又胀了一圈，血管跳得厉害。她没停，也没加速，只是把右脚脚心完全贴上来，脚趾张开，把你的■■整个包在脚趾和脚心之间，然后脚趾慢慢收拢，像握拳一样，把你的■■握在脚趾中间。左脚脚心则贴住柱身，从根部往上推。两只脚配合得很紧，脚趾缝里全是摩擦的水声，很轻，但在安静的谷仓里听得见。"
 REU_LUD_3758: "（低声）要射就射。别弄到衣服上。"
 REU_LUD_3759: "她说这话的时候终于抬头看了你一眼。灰色的眼睛在昏暗里显得很亮，不是温柔，但也不是冷漠。就是看着你。脚上动作没停，脚趾一松一紧，脚心一推一收。你射了。■■从■■顶端喷出来，打在她右脚脚趾上，又顺着脚趾缝流到脚心，滴在左脚脚背上。她没躲，也没缩脚。脚趾上全是■■，和融化的雪水混在一起。她低头看了一眼自己的脚，表情很淡，但耳尖又红了。"
 REU_LUD_3760: "（把脚收回去，看了看脚趾上的■■，又看你）……下次别弄到脚趾缝里。难洗。"
 REU_LUD_3761: "她从靴子里抽出那只湿袜子——已经半干了——擦了擦脚趾和脚心。动作很随便，像在擦泥。擦完把袜子扔到一边，赤脚踩回靴子里。靴筒里还有水，但她没再皱眉。"
 REU_LUD_3762: "（站起身，把军大衣裹紧）睡觉。明天还有任务。"
 REU_LUD_3763: "她走到谷仓另一头，背对着你躺下。军大衣盖在身上，脚缩在衣服下面。油灯灭了。黑暗里，你听见她翻了个身，然后是很轻的一句话，用叙拉古语说的，你没听懂。但语气比白天软。可能是那句童谣的下一段。也可能是别的什么。"
 REU_LUD_3764: "雪还在下。铁皮屋顶上的声音从沙沙变成了簌簌，更密了。你躺回自己的位置，身上还带着她的温度。脚的味道。还有一点盐汽水的气味——她今天没喝，但口袋里的瓶子空了很久，味道渗进布料里了。你闭上眼。明天，她还是那个弑君者。你也是她的部下。但今晚，有些东西不一样了。"
 REU_LUD_4000: "三天后，临时营地，入夜。"
 REU_LUD_4001: "篝火在营地中央噼啪作响，难民们被安置在帐篷里，伤员得到了处理。索科洛夫坐在火堆边，用匕首削着一根树枝，削得并不专心，刀口歪歪斜斜。远处传来麦田的风声，和三天前一样。"
 REU_LUD_4002: "柳德米拉从阴影里走出来，手里还攥着半块大列巴——和三天前那半块是同一块。她在他旁边蹲下，军大衣下摆拖在地上，蹭了一层灰。"
 REU_LUD_4003: "人都安顿好了？"
