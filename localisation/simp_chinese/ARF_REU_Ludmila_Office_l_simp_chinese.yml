 REU_LUD_4574: "她推开门，外面的光涌进来，把地下室照得发白。她走进光里，背影很直，步子很稳。"
 REU_LUD_4575: "走了。还有一座城的粮食要查。"
 REU_LUD_4600: "汽灯的光晕里浮着细小的尘粒。三十四双眼睛盯着黑板，或者盯着她。没有人知道讲台下面藏着一个人。"
 REU_LUD_4601: "柳德米拉站在黑板前，手里的粉笔在“气压”两个字旁边画了一个圈。她的军大衣已经脱了，搭在讲台边的椅背上。灰蓝色的旧工装贴着腰线，袖口还是挽到小臂中段。"
 REU_LUD_4602: "——所以，压强增大，沸点升高。反过来，压强减小——"
 REU_LUD_4603: "她的声音停了一拍。只有半秒。底下没人察觉，但她的右手在黑板边缘按了一下，指节发白。"
 REU_LUD_4604: "讲台下方，你的手指正隔着那层薄薄的工装布料，沿着她大腿内侧的线条慢慢往上。她的腿很紧，肌肉绷着，像随时要踢出去。但她没有动。她只是把左手插进工装口袋里，攥住了里面的什么东西。"
 REU_LUD_4605: "……反过来，压强减小，沸点降低。高原上的水，不到一百度就开了。"
 REU_LUD_4606: "她继续写。粉笔划过黑板，声音比刚才重了一点，灰黑的粉末簌簌往下落。你的指尖已经摸到了她工装裤的裤腰。布料是粗棉的，洗得发软，但没有弹性。她今天没有系皮带——讲课前她嫌勒得慌，解了。"
 REU_LUD_4607: "你从裤腰边缘探进去。里面还有一层。棉布的，贴身的，已经被体温焐热了。"
 REU_LUD_4608: "她的呼吸没有乱。至少听不出来乱。但她拿着粉笔的手顿了一下，在黑板上留下一个比预想更长的竖线。"
 REU_LUD_4609: "局长同志，那高压锅又是怎么回事？"
 REU_LUD_4610: "她转过身，面对着底下的人。你的手还在她裤腰里。她低头看了一眼提问的老矿工，眼神和平时一模一样——没什么温度，但也没不耐烦。"
 REU_LUD_4611: "高压锅。人为制造高压，让水在更高的温度才沸腾。这样食物熟得快。"
 REU_LUD_4612: "她说话的时候，你的手指已经隔着那层棉布，按在了她的阴阜上。布料很薄，下面那条缝隙的形状能摸出来。她的身体很热，比手掌热得多。"
 REU_LUD_4613: "她的大腿微微夹了一下。只夹了一下，就松开了。动作小得像是站累了换个重心。"
 REU_LUD_4614: "——但高压锅有风险。压力阀堵了，锅会炸。所以用之前要检查。"
 REU_LUD_4615: "她说“检查”两个字的时候，咬字特别清晰。你听懂了。这是给你的警告。但你没停。"
 REU_LUD_4616: "你的手指勾住那层棉布的边缘，往下扯了扯。布料被拉离了原来的位置，卡在■■■。她的■■露出来了。皮肤是浅褐色的，大■■饱满，因为常年不见光，颜色比大腿内侧深不了多少。毛发稀疏，修剪过——在叙拉古时养成的习惯。缝隙合得很紧，但指尖探过去的时候，能感觉到那道缝里渗出来的湿意。"
 REU_LUD_4617: "她不是没反应。她只是控制住了。"
 REU_LUD_4618: "好，今天的内容讲完了。下面是提问时间。谁有不懂的，现在问。"
