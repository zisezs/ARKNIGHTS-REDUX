# ============ 隐藏回忆章节（1095~1101） ============
 REU_LUD_3700: "雪没有停。柳德米拉出去转了一圈，回来时靴子上裹了一层冰壳，走路的声音像在踩碎骨头。她跺了跺脚，冰碴簌簌往下掉，但靴筒里已经灌了雪，融水正沿着脚踝往下渗。她没吭声，坐到油灯旁的木箱上，弯腰去解鞋带。手指冻得不太听使唤，解了两下没解开。"
 REU_LUD_3701: "……啧。"
 REU_LUD_3702: "她把靴子硬拽下来，倒出一小堆雪水和冰渣。袜子是粗毛线的，早湿透了，贴在脚上，脚趾冻得发红，脚背的皮肤被靴子磨出一道道浅痕。她皱着眉把袜子也脱了，露出一双脚。脚不大，脚型偏窄，脚趾修长但蜷着——冷的。脚底有常年奔波磨出的薄茧，脚后跟有些干裂，脚趾甲剪得很短，甲缝里还嵌着一点雪泥。脚踝内侧有一道旧疤，不知道是什么时候留下的。"
 REU_LUD_3703: "看什么看。"
 REU_LUD_3704: "她注意到你的视线，语气里带着惯常的防备，但没有把脚收回去。太冷了，冷到她暂时懒得维持那套“别靠近我”的规矩。她把脚往油灯方向伸了伸，灯焰的热量杯水车薪。"
 REU_LUD_3705: "乌萨斯的冬天，脚冻掉了都不知道。我见过一个侦察兵，回来脱靴子，脚趾头跟着袜子一起掉下来。他没感觉。"
 REU_LUD_3706: "她说得平淡，像在讲别人的事。但你注意到她脚趾不自觉地又蜷紧了一些，脚背上细小的血管在冷空气里泛着青紫色。她把手凑到灯边搓了搓，又去够自己的脚，但手也是僵的，搓了两下没什么效果。"
 REU_LUD_3707: "……你要是闲得没事就出去，别在这儿杵着。"
 REU_LUD_3708: "她抬头看你，眼神里带着明显的审视和一丝没来得及藏好的意外。"
 REU_LUD_3709: "你手热？"
 REU_LUD_3710: "她没拒绝，但也没答应。只是看着你。油灯的火苗晃了晃，在她脸上投下忽明忽暗的影子。她的嘴唇抿成一条线，这是她思考时惯常的表情——嘴上不说，脑子里在算：这个人想干什么，这么做有没有代价，代价她付不付得起。"
 REU_LUD_3711: "……行。就捂脚。别想别的。"
 REU_LUD_3712: "她最后这么说道。语气像在下命令，但声音比刚才轻了一点。她把脚从灯边收回来，搁在木箱边缘，离你近了半尺。湿袜子被她随手搭在靴筒上，还在滴水。谷仓外面风刮得铁皮哗哗响，里面倒是安静，只有油灯偶尔爆出一点噼啪声。"
 REU_LUD_3713: "不用。"
 REU_LUD_3714: "她答得很快，几乎是条件反射。"
 REU_LUD_3715: "别折腾。烧水要生火，生火冒烟，冒烟会暴露位置。你想让全乌萨斯的宪兵都知道这儿有人？"
 REU_LUD_3716: "她把脚往自己那边收了收，像是怕你多管闲事。"
 REU_LUD_3717: "我自己能行。冻习惯了。"
 REU_LUD_3718: "但她没能把脚捂热。过了一会儿，她又把脚伸回灯边，脚趾还是红的。她没再看你，只是盯着灯焰，表情很平，平到你知道她在忍着什么。"
 REU_LUD_3719: "……哑了？"
 REU_LUD_3720: "她瞥你一眼，没再管你。自己伸手去搓脚，动作很用力，但手也在抖。搓了一会儿，她停下来，看着自己的脚趾，不知道在想什么。油灯的光把她的侧脸照得发黄，颧骨上有一道很淡的旧伤疤，平时藏在头发下面，这会儿露出来了。"
 REU_LUD_3721: "（低声，像是自言自语）爸爸说过，脚是人的根。根冻坏了，人就站不住了。"
 REU_LUD_3722: "她把这句话说得像在念一句和自己无关的谚语。但说完之后，她安静了很久。"
 REU_LUD_3723: "不管选了什么，外面的雪越下越大。谷仓里没有多余的柴火，油灯的煤油也快见底了。柳德米拉的脚还是冷，她面上不显，但你看见她左脚脚趾偶尔会不自主地抽一下——冻得狠了才会这样。她的脚型很好看，脚弓高，脚趾长而直，如果不是脚底的茧和脚踝的疤，这双脚放在别处，应该穿的是暖和的毡靴，踩的是铺了地毯的地板，而不是谷仓里落着雪渣的泥地。她把脚趾蜷起来又松开，反复了几次，试图靠活动血液来取暖，但效果不大。"
 REU_LUD_3724: "……你看够了没有。"
 REU_LUD_3725: "她终于开口，语气硬邦邦的，但耳尖有一点点红，不知道是冻的还是别的什么。她没有把脚藏起来。大概是觉得藏了就显得在意了，而她不想显得在意。"
 REU_LUD_3726: "我脚冷。你手要是真热，就过来。别磨蹭。别说话。别用那种眼神看我。"
 REU_LUD_3727: "她把“别用那种眼神看我”说得很重，像在警告，又像在给自己打预防针。她坐着的木箱不高，脚伸出来刚好到你的膝盖高度。油灯放在旁边的地上，光从下往上打，把她的脚照得轮廓分明——脚背的皮肤因为冷显得偏白，脚底的茧是浅黄色的，脚趾尖微微泛红，脚后跟的干裂在光下像细小的纹路。她没涂指甲油，也没那个条件，但脚趾甲修得整齐，是瑞柏巴人特有的干净习惯。"
 REU_LUD_3728: "你伸手握住她的脚。她的脚在你掌心里明显僵了一下，像一只被突然抓住的鸟。但她没抽回去。她的脚很凉，凉到你的手心一下子被吸走了温度。脚底的茧在你指腹下有点粗，脚趾缝里还带着一点融雪的水汽。你搓了搓她的脚背，又用拇指按了按她的脚心。她的脚趾不自觉地勾了一下。"
 REU_LUD_3729: "（低声）……手劲小点。"
 REU_LUD_3730: "她说这话的时候没看你。但也没让你停。"
 REU_LUD_3731: "你把外套解开，把她的脚拉过来贴在自己小腹上。她的脚趾碰到你皮肤的一瞬间猛地缩了一下，像被烫到——其实是她的脚太冷，你的身体太热。"
 REU_LUD_3732: "你——"
 REU_LUD_3733: "她只吐出一个字，就顿住了。你的体温从脚底传上来，她的小腿肌肉明显放松了一点。她没再说话，只是把脸别到一边，看着墙上的裂缝。脚趾在你腹肌上轻轻动了动，像是在试探这温度是不是真的。"
 REU_LUD_3734: "（很轻）……别告诉别人。"
 REU_LUD_3735: "你蹲下来，凑近她的脚，对着脚趾哈了一口气。热气碰到她冰凉的脚趾，她整个人颤了一下，脚趾猛地蜷紧又松开。"
 REU_LUD_3736: "你干什么——"
 REU_LUD_3737: "她低头看你，眼神里有惊讶，还有一点别的什么，一闪而过。你没停，又哈了一口。她的脚趾这次没蜷，反而微微张开了一点。脚背上的青紫血管在热气里慢慢淡下去。她没再问，只是看着你，呼吸比刚才轻了一些。"
 REU_LUD_3738: "……你这个人。"
 REU_LUD_3739: "她说了半句，没说完。"
 REU_LUD_3740: "不管前面选了哪种，谷仓里的温度没有升高多少，但你们之间的距离缩短了。柳德米拉的脚不再像冰块一样，至少表面有了一点活人的温度。她看着你，目光从你的脸移到你的手，又移回你的脸。油灯的火焰跳了一下，她的瞳孔缩了缩。她不是不知道接下来可能发生什么。她只是没阻止。在整合运动里，冬天是最难熬的，冷到骨头里的夜晚，人会做出很多平时不会做的事。她见过。她也做过。但这次不一样——这次她是被服务的那一方，这让她不太习惯。"
 REU_LUD_3741: "你硬了。"
 REU_LUD_3742: "她说得很直接。目光往下扫了一眼，又抬起来，表情没什么变化。不是嘲讽，也不是邀请。就是陈述。"
 REU_LUD_3743: "……我脚冷，你下面热。公平交易。"
 REU_LUD_3744: "她说着，把脚从你手里（或身上、嘴边）抽回来，活动了一下脚趾。然后她抬起右脚，脚心朝你，脚趾微微分开。脚底的茧在灯光下看得很清楚，脚心的纹路很深，脚趾之间还有一点没干的水汽。她把脚往前伸了伸，脚趾碰到你裤裆的位置，隔着布料，她能感觉到那里的温度和硬度。她停了一秒，然后脚趾收拢，隔着裤子轻轻捏了一下。"
 REU_LUD_3745: "脱了。"
 REU_LUD_3746: "她说。语气还是命令式的，但声音比平时低。你没动的话，她会补一句："
 REU_LUD_3747: "要么脱，要么滚。别在这儿磨。"
 REU_LUD_3748: "你把裤子解开。她看着，没催。等你把■■露出来，她的目光落在上面停了两秒——不躲，不惊，不笑。整合运动里的人对肉体没那么矫情，但她的眼神里还是有一丝细微的变化，像是确认了什么。然后她移开视线，把右脚抬起来，脚心贴上你的■■侧面。"
 REU_LUD_3749: "她的脚还是凉的，但已经比刚才好多了。脚心贴上来的一瞬间，你■■上的皮肤猛地一紧，热和冷撞在一起，你小腹的肌肉不自觉地绷了一下。她的脚心很软，和脚底的茧形成对比——脚弓处的皮肤细而薄，贴着你的■■侧面，能感觉到她脚心细微的汗湿。她的脚趾张开，从■■根部开始，慢慢往上推。脚趾一个一个地蹭过去，脚趾缝夹着柱身，脚趾肚按在血管上，有点粗粝，又有点痒。她动作不快，像是在试探你哪里最敏感。"
 REU_LUD_3750: "（低声）……别出声。外面有人巡逻。"
 REU_LUD_3751: "她左脚也抬起来，两只脚一起夹住你的■■。左脚脚背贴着你，右脚脚心贴着你，形成一个不太标准的■■。她的脚踝交叉，脚趾勾着，脚底并拢，把你的■■夹在中间。你■■上的热度透过她的脚心传进去，她的脚趾终于彻底松开了，不再蜷着。她的脚开始上下动。从根部到顶端，脚心贴着柱身滑上去，脚趾再夹着■■轻轻转一下，然后滑下来。动作很慢，但很稳。她做任何事都稳，哪怕是这种事。"
 REU_LUD_3752: "你能感觉到她脚心的温度在慢慢升高。你的■■在她脚心里越来越滑，顶端渗出的液体被她右脚的大脚趾蹭开，涂在■■上，又被左脚脚背抹回去。她的脚趾缝里全是你的味道。她低头看了一眼，没说话，只是脚上动作加快了一点。脚趾夹着■■的时候，会稍微用力，像在确认硬度。脚心贴柱身的时候，又会放松，像在感受脉搏。她的呼吸比刚才重了一点，但脸上没什么表情，只是嘴唇微微张开，呼出的白气变短了。"
 REU_LUD_3753: "（用乌萨斯语低声骂了一句）"
 REU_LUD_3754: "你没听懂，但语气不凶。她的右脚脚趾突然夹紧你的■■，脚趾肚按在冠状沟上，慢慢转了一圈。你的腰不受控制地往上顶了一下。她立刻用左脚脚心压住你的小腹，把你按回去。"
 REU_LUD_3755: "别动。我说了别出声。"
