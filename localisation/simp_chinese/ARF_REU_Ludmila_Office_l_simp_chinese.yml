 REU_LUD_4025: "我之前说过，回来的时候如果我还活着，我就来收麦子。"
 REU_LUD_4026: "我记得。"
 REU_LUD_4027: "麦子今天没收成。但我说过的话，我认。"
 REU_LUD_4028: "她伸出手，把他从地上拽起来。她的手心很糙，指腹上有薄茧，虎口处有一道旧疤。她拽得不用力，但很稳。"
 REU_LUD_4029: "跟我来。"
 REU_LUD_4030: "她把他带到营地边缘的粮仓——其实是半塌的谷仓，顶上还漏着风。里面堆着几袋面粉和那半块大列巴的另外四分之一。她踢过来一个倒扣的木箱，坐上去，翘起一条腿。军靴的鞋带松了一根，她没管。"
 REU_LUD_4031: "脱。"
 REU_LUD_4032: "……什么？"
 REU_LUD_4033: "裤子。脱。"
 REU_LUD_4034: "她说这话的时候语气很平，像在下达一个普通的战术指令。但她的手已经在解自己军装的领口，把大衣往后一掀，露出里面的灰色衬衣。衬衣贴着她的身体，勾勒出并不丰满但结实的轮廓——胸不大，被运动绷带束着，几乎看不出弧度。腰很窄，肋骨在薄薄的衬衣下隐约可见。"
 REU_LUD_4035: "我说话不说第二遍。"
 REU_LUD_4036: "索科洛夫解开了腰带。裤子滑落到膝盖，露出已经半硬的■■。柳德米拉扫了一眼，没评价，只是把嘴里最后一点面包咽下去，然后从木箱上滑下来，单膝跪在他面前。谷仓的干草扎着她的膝盖，她皱了下眉，但没动。"
 REU_LUD_4037: "难民的事，谢了。"
 REU_LUD_4038: "她伸出手，握住他的■■。掌心粗糙，指腹的薄茧蹭过柱身，力道不轻不重，像在握一把匕首。她低头看了一眼——■■在她手里微微发颤，■■已经渗出透明的液体。她没说什么，只是把嘴唇凑上去，先是用舌尖■了一下■■顶端，尝到咸涩的味道。"
 REU_LUD_4039: "……嗯。"
 REU_LUD_4040: "她张开嘴，含了进去。"
 REU_LUD_4041: "她的嘴很热。口腔内壁滚烫，上颚有一道不太平整的隆起——源石结晶化的增生组织，在舌根上方形成粗糙的颗粒感，蹭过■■时带来一种奇异的摩擦。她的舌头很灵活，贴着柱身下侧滑动，像在舌头上做一套精确的战术动作。她的嘴唇裹得很紧，收在牙齿外面，吸■时脸颊微微凹陷。"
 REU_LUD_4042: "她吃得并不快。每次含入都只到一半左右，■■顶到上颚那道增生组织时她会停顿一下，喉咙里发出很轻的、压抑的吞咽声。唾液分泌得很快，混着■■渗出的液体，沿着柱身往下淌，打湿了她握着根部的手指。她的手指没有松开，一直在根部缓慢地撸动，配合着嘴的动作。"
 REU_LUD_4043: "她抬眼看他。灰绿色的眼睛在谷仓的阴影里显得很亮。目光里没有媚态，没有讨好，甚至没什么温度——但很专注。像在执行一个任务。一个她答应过要完成的任务。"
 REU_LUD_4044: "她吐出■■，舌尖还抵在马眼上，拉出一道细长的银丝。嘴角和下巴沾着唾液，在火光里亮晶晶的。她用手背抹了一下嘴。"
 REU_LUD_4045: "别光站着。"
 REU_LUD_4046: "她重新含进去。这次更深了一些。■■挤过舌根那道隆起的增生组织时，她的喉咙明显收缩了一下，发出一声干呕般的闷响。她没退，只是闭了一下眼，睫毛颤了颤，然后继续往里吞。她的鼻尖几乎碰到他小腹的时候停住了，整个■■埋在她嘴里，喉咙口的软肉一下一下地裹着■■，像在吞咽。"
 REU_LUD_4047: "她维持了几秒。然后慢慢退出来，唇瓣刮过柱身，发出湿润的声响。她喘了一口气，嘴角挂着唾液和■■■■的混合物，滴到衬衣前襟上。她低头看了一眼自己胸前的湿痕，没擦。"
 REU_LUD_4048: "……还行。"
 REU_LUD_4049: "主任——"
