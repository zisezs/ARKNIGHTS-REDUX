# ============ 事件 ============
 reu_ludmila.1.t: "我和柳德米拉的回忆录"
 reu_ludmila.1.d: "从今夜起，走廊尽头那扇门对你不再上锁；书架上那些年头，你也翻得开了。\n敲两下门，里面只传出一个字：「进。」\n\n【我和柳德米拉的回忆录】已在决议中开架——一年一本，年份到了才翻得开。"
 reu_ludmila.1.a: "我明白了。"

 reu_ludmila.3.t: "她记住了你的话"
 reu_ludmila.3.d: "「你比其他人多问了一句。」柳德米拉说，「在这里，这就算是熟人了。」\n\n§G柳德米拉与你的关系：熟识§!"
 reu_ludmila.3.a: "（关系更近了一步）"

 reu_ludmila.4.t: "留给你的那把椅子"
 reu_ludmila.4.d: "深夜的办公室里，她开始习惯把你的椅子放在桌边；文件往来时，第一页总是先递给你。\n\n§G柳德米拉与你的关系：信任§!"
 reu_ludmila.4.a: "（关系更近了一步）"

 reu_ludmila.5.t: "不谈公务的那一会儿"
 reu_ludmila.5.d: "办公室的暖气居然修好了。她坐在窗边，第一次没有把卷宗摆在两人中间。\n\n§G柳德米拉与你的关系：羁绊§!"
 reu_ludmila.5.a: "（静静坐着）"

 reu_ludmila.6.t: "备用钥匙"
 reu_ludmila.6.d: "她把一枚黄铜钥匙推过桌面：「深夜不必通过门房。你懂我为什么给你。」\n\n§H柳德米拉与你的关系：挚友§!"
 reu_ludmila.6.a: "我不会弄丢它。"

 reu_ludmila.7.t: "见证索科洛夫与柳德米拉的婚礼"
 reu_ludmila.7.d: "圣骏堡的宴会厅难得灯火通明。柳德米拉没有穿军装，她穿过人群向你走来，脚步和当年在冻原上向你伸出手时一样稳。\n\n「我从整合运动一路走到这里，身后跟着的人，始终是你。」\n\n§H她与你并肩站上台阶，掌声漫过整个宴会厅。§!"
 reu_ludmila.7.a: "（握住她的手）"

 reu_ludmila.90.t: "调试：回忆录 / 主席办公室"
 reu_ludmila.90.d: "仅用于测试本机制。回忆录决议开局即解锁，年份门槛可以用下面的选项跳过。"
