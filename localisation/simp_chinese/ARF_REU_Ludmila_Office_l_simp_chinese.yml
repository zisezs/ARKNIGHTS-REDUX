# ============ 主线台词（占位，随时可整段替换） ============
 REU_LUD_100: "夜里十一点，走廊尽头那间办公室还亮着。你敲了两下门，里面只传出一个字。"
 REU_LUD_101: "「进。」她没抬头，笔尖在纸上划了半行才停下，「坐。别站在那儿挡我的光。」"
 REU_LUD_102: "我把门带上，在桌边那把坐了快十年的椅子上坐下——四条腿只有一条不晃。高窗的光柱斜斜落在地图桌上。"
 REU_LUD_103: "「塔露拉来信了。」她的笔停了半秒，「她说那边一切都好。……有时候我真想去看一眼。」"
 REU_LUD_104: "「今晚不谈公务。」她把笔搁下，往椅背上靠了靠，「你想说什么？想好了再说，我等得起。」"
 REU_LUD_110: "「她呀……小时候总缠着我讲故事。」她笑了笑，很轻，「这种事我不对第二个人讲。你别记在纸上。」"
 REU_LUD_111: "「你总是这样。」她叹了口气，却没有赶你走，「把灯调暗些，剩下的明早再说。」"
 REU_LUD_112: "「我睡得够多。」她硬声硬气地顶了回来，过了一会儿又低下去，「……最近确实有些晚。连你都看出来了。」"
 REU_LUD_113: "「……谢谢。」她隔了很久才说出这两个字，「我不习惯有人陪着而不图什么。」"
 REU_LUD_114: "「今晚到此为止，索科洛夫。」她重新拿起笔，「门带上。还有——下次别在走廊里站着，直接进来。」"
 REU_LUD_900: "「文件我都签好了。」她抬眼看你，「你留到最后才走。别以为我不知道。」"

# ============ 间隙与互动反应（占位） ============
 REU_LUD_800: "「今天批完的比预想早。」她把外套挂在椅背上，整个人松了一截，「你既然来了就别站着——想找点儿什么事做？」"
 REU_LUD_901: "她拆开包装纸，看了一眼，又抬眼看回来：「你从哪儿弄来的？……别声张。」她把盒子挪到了自己那一侧。"
 REU_LUD_902: "你们谁也没说话。雪把楼前那条路盖成一片白，她在玻璃上呵了口气，画了个很难看的箭头，指着食堂的方向。"

# ============ 回忆：肃反大队·雪夜（1095 年冬天，通过决议触发） ============
 REU_LUD_1000: "雪落在铁皮屋顶上，沙沙作响。谷仓里只点了一盏油灯，光勉强照亮半张桌子。"
 REU_LUD_1001: "弑君者站在门口，背对着你。她没穿整合运动那身标志性的制服，只披了件旧军大衣，领口竖着，遮住半张脸。口罩是布的，洗得发白。"
 REU_LUD_1002: "主任，人已经处理了。尸体拖到村外，按规矩没留痕迹。"
 REU_LUD_1003: "嗯。"
 REU_LUD_1004: "她没有回头。"
 REU_LUD_1005: "名字。"
 REU_LUD_1006: "……什么？"
 REU_LUD_1007: "那个人的名字。你查过没有。"
 REU_LUD_1008: "档案上写的是「安德烈·帕夫洛夫」，乌萨斯第六步兵师退伍兵，三个月前加入后勤队。\n涉嫌向切尔诺伯格当局传递情报。"
 REU_LUD_1009: "涉嫌。"
 REU_LUD_1010: "她转过身。灰色的眼睛在昏暗里像两颗冻住的石头。"
 REU_LUD_1011: "证据呢。"
 REU_LUD_1012: "塔露拉同志那边转来的密报。三份，都指认他和城里的宪兵队有接触。"
 REU_LUD_1013: "密报。接触。"
 REU_LUD_1014: "她重复这两个词，语气没有波动，但你知道她不满意。"
 REU_LUD_1015: "他死之前说了什么。"
 REU_LUD_1016: "他说他是清白的。说那些密报是……"
 REU_LUD_1017: "是什么。"
 REU_LUD_1018: "是诬陷。他说后勤队里有人跟他有仇。"
 REU_LUD_1019: "沉默。雪从门口飘进来，落在她肩头。"
 REU_LUD_1020: "你信吗。"
 REU_LUD_1021: "……我不确定。"
 REU_LUD_1022: "不确定。"
 REU_LUD_1023: "她走近一步。油灯把她的影子拉得很长。"
 REU_LUD_1024: "你不确定，就把他杀了？"
 REU_LUD_1030: "命令。"
 REU_LUD_1031: "她冷笑了一声。很短，几乎听不见。"
 REU_LUD_1032: "你倒是学会说这个词了。"
 REU_LUD_1033: "主任——"
 REU_LUD_1034: "别叫我主任。叫我弑君者。至少那个名字不撒谎。"
 REU_LUD_1040: "好兵。"
 REU_LUD_1041: "她说这话的时候没有看你。"
 REU_LUD_1042: "你比我强。我到现在还会想，那些密报到底是谁写的。"
 REU_LUD_1050: "她看着你，看了很久。"
 REU_LUD_1051: "……你和我一样。"
 REU_LUD_1052: "？"
 REU_LUD_1053: "一样没用。"
 REU_LUD_1100: "她摘下口罩，从口袋里摸出一根烟，但没点。她的呼吸在冷空气里凝成白雾，\n喉咙里有一丝很轻的、像砂纸摩擦的声音——上呼吸道的结晶在夜里总是更磨人。"
 REU_LUD_1101: "我入整合运动的时候，塔露拉还不是「同志」。"
 REU_LUD_1102: "……"
 REU_LUD_1103: "她站在废墟上讲话，说感染者要活下去，要有尊严地活。底下的人都在哭。我也在哭。\n那时候我觉得，就算明天死了，也值。"
 REU_LUD_1104: "她把烟叼在嘴里，还是没点。"
 REU_LUD_1105: "现在她开会，讲的是「纪律」「肃清」「必要牺牲」。她不再看底下的人。她看的是地图。"
 REU_LUD_1106: "主任，您这话……"
 REU_LUD_1107: "我这话怎么了。"
 REU_LUD_1108: "她看你一眼，眼神锋利。"
 REU_LUD_1109: "你也觉得我该闭嘴？"
 REU_LUD_1150: "听我的？"
 REU_LUD_1151: "她哼了一声。"
 REU_LUD_1152: "听我的，你现在就该去把那个写密报的人找出来。你敢吗？"
 REU_LUD_1153: "……"
 REU_LUD_1154: "不敢就别说这种话。"
 REU_LUD_1160: "行。"
 REU_LUD_1161: "她笑了一下。不是高兴的那种。"
 REU_LUD_1162: "你是个好兵。好兵不需要想太多。"
 REU_LUD_1170: "她看了你两秒。"
 REU_LUD_1171: "你倒是会说话。"
 REU_LUD_1172: "但你说得对。我累了。"
 REU_LUD_1200: "她终于把烟点上了。火光亮了一下，又暗下去。她吸了一口，立刻掐灭。"
 REU_LUD_1201: "呛到你了。"
 REU_LUD_1202: "没关系。"
 REU_LUD_1203: "有关系。烟是我的，肺是别人的。我不想让谁因为我的破习惯咳半宿。"
 REU_LUD_1204: "她把掐灭的烟塞回口袋。"
 REU_LUD_1205: "主任，您为什么一直在肃反大队？"
 REU_LUD_1206: "……你什么意思。"
 REU_LUD_1207: "您擅长的是潜伏、突袭、暗杀。肃反……不一样。"
 REU_LUD_1208: "有什么不一样。"
 REU_LUD_1209: "肃反杀的是自己人。"
 REU_LUD_1210: "沉默。很长。油灯的火苗晃了一下。"
 REU_LUD_1211: "你以为暗杀就不是杀自己人？"
 REU_LUD_1212: "……？"
 REU_LUD_1213: "我杀过乌萨斯的军官，杀过贵族的打手，杀过宪兵。他们中有人是乌萨斯人，\n有人是感染者，有人可能昨天还在给穷人发面包。但命令下了，我就动手。"
 REU_LUD_1214: "她看着雪。"
 REU_LUD_1215: "暗杀和肃反，对我来说没区别。都是把刀捅进一个人的身体，然后看着他的眼睛暗下去。\n区别只在于——肃反之后，我还能记住那个人的名字。"
 REU_LUD_1216: "您记住他们的名字？"
 REU_LUD_1217: "每一个。"
 REU_LUD_1218: "她把手插进口袋。"
 REU_LUD_1219: "安德烈·帕夫洛夫。我记住了。你记不记得住，是你的事。"
 REU_LUD_1220: "她走向门口。"
 REU_LUD_1221: "回去睡觉。明天还有任务。"
 REU_LUD_1222: "主任。"
 REU_LUD_1223: "嗯？"
 REU_LUD_1224: "您觉得……我们会赢吗？"
 REU_LUD_1225: "她停在门口。雪在她面前铺开，像一张没有字的纸。"
 REU_LUD_1226: "赢？"
 REU_LUD_1227: "她回头。嘴角有一个很淡的弧度。不是笑。"
 REU_LUD_1228: "我从来没想过「赢」。我只想过——让那些坐在王座上的人，知道下面有人会咬人。"
 REU_LUD_1229: "弑君者……这名字不是我自己起的。是他们给的。因为他们怕我。"
 REU_LUD_1230: "但怕，也是一种记住的方式。"
 REU_LUD_1231: "她走进雪里。"
 REU_LUD_1232: "她的背影很快被白色吞没。你站在原地，听见风里传来一句模糊的叙拉古语童谣。"
 REU_LUD_1233: "雪教她歌唱，雨教她持刀……"
 REU_LUD_1234: "后面的听不清了。"

# ============ 回忆录：秋日麦穗与焦黑的大列巴（1096 年秋天，通过决议触发） ============
 REU_LUD_1300: "三天前，这里还有一座村子。"
 REU_LUD_1301: "土路两旁的木屋只剩下黑黢黢的骨架，烟囱歪着，像折断的手指。远处田里的麦子没人收，穗子垂着头，风一吹就沙沙地响，金得晃眼——和这片焦土格格不入。"
 REU_LUD_1302: "柳德米拉走在前面，军靴踩在碎瓦上，发出细碎的声响。她没说话，但从进村起，她的步子就比平时慢。"
 REU_LUD_1303: "主任。前面没什么东西了，侦察组已经撤了。"
 REU_LUD_1304: "嗯。"
 REU_LUD_1305: "她没停。走到一间塌了半边的面包房前，蹲了下去。灰烬里露出一截黑乎乎的东西，她扒了两下，拽出来——半块大列巴，烤得过了火，外壳焦黑，内里硬得像砖。"
 REU_LUD_1306: "……别吃了。我包里还有压缩饼干。"
 REU_LUD_1307: "压缩饼干是整合运动的。"
 REU_LUD_1308: "她把大列巴在袖口上蹭了蹭，蹭掉一层灰，张嘴咬了一口。"
 REU_LUD_1309: "这也是整合运动的。只不过发得更早一点。"
 REU_LUD_1310: "……"
 REU_LUD_1311: "她嚼得很慢。硬壳在她牙齿间发出嘎吱声，像在啃石头。"
 REU_LUD_1312: "还行。比叙拉古的硬面包软。"
 REU_LUD_1313: "您以前吃过？"
 REU_LUD_1314: "老师教我烤过。她说叙拉古人做面包不放糖，放盐。因为甜是贵族的味道。"
 REU_LUD_1315: "她又咬了一口。这次嚼得更慢。"
 REU_LUD_1316: "她还说，面包要等凉了再切。热着切，切口会塌。"
 REU_LUD_1317: "……您老师是面包师？"
 REU_LUD_1318: "不。她是叙拉古的……算了。"
 REU_LUD_1319: "她把大列巴放下，站起来。目光越过焦黑的屋顶，落在田里。"
 REU_LUD_1320: "麦子该收了。"
 REU_LUD_1321: "这片区域刚打完仗，没人敢下田。"
 REU_LUD_1322: "我知道。"
 REU_LUD_1323: "她走到田埂上。麦穗在她腿边蹭过去，饱满的，金黄的，沉甸甸地弯着腰。她伸手折了一穗，放在掌心里搓了搓，吹掉壳，露出饱满的麦粒。"
 REU_LUD_1324: "看。熟得正好。再不下雨，就该烂在地里了。"
 REU_LUD_1325: "……主任？"
 REU_LUD_1326: "她没回应。她把那几颗麦粒放进嘴里，嚼了嚼。"
 REU_LUD_1327: "甜的。"
 REU_LUD_1328: "麦子本来就是甜的。"
 REU_LUD_1329: "不。乌萨斯南部的麦子，秋收前会有一层霜。霜打过的麦子才甜。我爸爸说的。"
 REU_LUD_1330: "她提到「爸爸」的时候，声音没什么变化，但手停了一下。"
 REU_LUD_1331: "他以前在研究所……下班回来会绕路去田里看看。他说，麦子的颜色比任何实验数据都诚实。"
 REU_LUD_1332: "您父亲是农学家？"
 REU_LUD_1333: "他是科学家。"
 REU_LUD_1334: "她转过身，军大衣下摆扫过麦穗。"
 REU_LUD_1335: "研究源石的。那时候我还不懂，觉得他整天对着那些发光的石头有什么意思。他说，柳达，石头不会撒谎，人才会。"
 REU_LUD_1336: "柳达？"
 REU_LUD_1337: "她看了你一眼。"
 REU_LUD_1338: "……小时候的名字。别叫。"
 REU_LUD_1339: "是。"
 REU_LUD_1340: "她走回面包房前，把那半块大列巴捡起来，拍了拍灰，又咬了一口。这次嚼得更用力，像在跟谁较劲。"
 REU_LUD_1341: "索科洛夫。"
 REU_LUD_1342: "在。"
 REU_LUD_1343: "你老家在哪。"
 REU_LUD_1344: "切尔诺伯格。矿区。"
 REU_LUD_1345: "家里种过地？"
 REU_LUD_1346: "没有。矿工不种地。"
 REU_LUD_1347: "那你不懂。"
 REU_LUD_1348: "她看着田。"
 REU_LUD_1349: "这片麦子，播种的人可能已经不在了。收割的人可能也不会来了。但它还长着。还熟着。"
 REU_LUD_1350: "……"
 REU_LUD_1351: "你觉不觉得……有点可笑。人死了，村子烧了，整合运动和乌萨斯军打得头破血流。可麦子还在那儿。该抽穗抽穗，该灌浆灌浆，该熟熟。"
 REU_LUD_1352: "麦子不知道打仗。"
 REU_LUD_1353: "对啊。麦子不知道。"
 REU_LUD_1354: "她把最后一口大列巴塞进嘴里，嚼完，咽下去。然后拍了拍手上的灰。"
 REU_LUD_1355: "但我知道。"
 REU_LUD_1360: "仗打完。"
 REU_LUD_1361: "她重复了一遍，像在嚼这三个字。"
 REU_LUD_1362: "行。等仗打完。你记得提醒我。"
 REU_LUD_1363: "……好。"
 REU_LUD_1364: "你记性好，对吧。你记得安德烈·帕夫洛夫。那再记一件事——1096 年秋天，乌萨斯南部，有一片麦子熟了，没人收。"
 REU_LUD_1365: "我记住了。"
 REU_LUD_1370: "她愣了一下。"
 REU_LUD_1371: "收？"
 REU_LUD_1372: "我们只有十二个人。这片田少说两百亩。拿什么收？镰刀都没有。"
 REU_LUD_1373: "那您为什么一直看。"
 REU_LUD_1374: "……"
 REU_LUD_1375: "因为我看不了别的。"
 REU_LUD_1376: "她把手插进口袋。"
 REU_LUD_1377: "走吧。看两眼就够了。"
 REU_LUD_1380: "沉默。这次比之前都长。"
 REU_LUD_1381: "后来。"
 REU_LUD_1382: "后来他被研究所派去切尔诺伯格。再后来，浩劫来了。再再后来，我听说他死了。"
 REU_LUD_1383: "抱歉。"
 REU_LUD_1384: "不用。"
 REU_LUD_1385: "她踢开脚边一块焦木。"
 REU_LUD_1386: "他死之前把我送走了。送到叙拉古。我那时候恨他。现在不恨了。"
 REU_LUD_1387: "为什么？"
 REU_LUD_1388: "因为他没办法。"
 REU_LUD_1389: "她看着田。"
 REU_LUD_1390: "就像这片麦子。它没办法。种下去，长起来，熟了，没人收，它就烂在地里。麦子能恨谁？"
 REU_LUD_1400: "她转身朝村口走去。"
 REU_LUD_1401: "主任，那片田——"
 REU_LUD_1402: "不管。"
 REU_LUD_1403: "她没回头。"
 REU_LUD_1404: "整合运动有任务。我们没有时间收麦子。"
 REU_LUD_1405: "……"
 REU_LUD_1406: "但是。"
 REU_LUD_1407: "她停了一下。"
 REU_LUD_1408: "回来的时候，如果它还在，如果那时候我还活着，我就来收。"
 REU_LUD_1409: "您一个人？"
 REU_LUD_1410: "我不是一个人。"
 REU_LUD_1411: "她侧过脸，半张脸在灰烬和夕阳之间。"
 REU_LUD_1412: "你不是在吗。"
 REU_LUD_1413: "风从田里吹过来，麦穗沙沙地响。她走在前面，大衣的下摆被风掀起，露出腰间那把短刀的刀鞘。刀鞘上有一道很深的划痕，是新的。"
 REU_LUD_1414: "主任。"
 REU_LUD_1415: "嗯？"
 REU_LUD_1416: "那半块大列巴……是您故意留的？"
 REU_LUD_1417: "她没停步，但肩膀动了一下。"
 REU_LUD_1418: "面包房里一共找到三块。两块被炸碎了。这一块在炉灰最底下，没烧透。"
 REU_LUD_1419: "所以您吃它，不是因为饿了。"
 REU_LUD_1420: "面包是粮食。"
 REU_LUD_1421: "我知道。"
 REU_LUD_1422: "粮食不该扔。"
 REU_LUD_1423: "她走出村口，消失在暮色里。最后一句话被风吹回来，很轻，像自言自语。"
 REU_LUD_1424: "爸爸说过，糟蹋粮食的人，不配站在土地上。"
 REU_LUD_1425: "麦田在她身后继续沙沙地响。夕阳把麦穗染成血一样的颜色。"
 REU_LUD_1426: "你站在原地，看见田埂上有一串脚印——她的，从村口一直走到麦田深处，又走回来。只在最深的地方停过一次。"
 REU_LUD_1427: "那里的麦子，被人轻轻折了一穗。"

# ============ 回忆录：阳光与尘埃下的移动城市（1097 年，通过决议触发） ============
 REU_LUD_1600: "这座城市已经停了。"
 REU_LUD_1601: "移动城市的履带早就熄了火，巨大的底盘搁浅在冻土上，像一头死去的巨兽。下层区的街道上没有人，店铺的门板被砸开，风从破洞里灌进去，卷出几张烧了一半的传单。"
 REU_LUD_1602: "阳光很好。好得不像话。光从楼宇的缝隙间斜切下来，照出空气里悬浮的每一粒尘埃。"
 REU_LUD_1603: "……安静得不对劲。"
 REU_LUD_1604: "侦缉队说这一带已经清空了。"
 REU_LUD_1605: "清空。他们用词倒是文雅。"
 REU_LUD_1606: "她贴着墙根走，短刀已经出鞘，刀身压在小臂内侧。她的步子很轻，几乎不发出声音——这是暗杀者的本能，和肃反主任无关。"
 REU_LUD_1607: "两个路口前那家药铺，门口的脚印是新的。"
 REU_LUD_1608: "乌萨斯军警？"
 REU_LUD_1609: "军靴。三十六码半到三十八码之间，步幅一致。至少四个人，列队行进。"
 REU_LUD_1610: "您连鞋码都看得出来？"
 REU_LUD_1611: "我看不出。我猜的。但不管是谁，他们没走远。"
 REU_LUD_1612: "她拐进一条窄巷。阳光在这里断了，阴影里有股潮湿的铁锈味。她突然停住，抬手。"
 REU_LUD_1613: "……有人。"
 REU_LUD_1614: "巷子尽头，三个穿灰色制服的乌萨斯军警正围着一个瘦小的身影。那人背靠墙壁，校服上沾满泥，手里死死攥着一个布包。"
 REU_LUD_1615: "再说一遍。你叫什么。"
 REU_LUD_1616: "……尤里。尤里·伊万诺夫。"
 REU_LUD_1617: "伊万诺夫。这个姓在通缉名单上。"
 REU_LUD_1618: "那是我叔叔！不是我！"
 REU_LUD_1619: "你包里是什么。"
 REU_LUD_1620: "课本！只是课本！"
 REU_LUD_1621: "打开。"
 REU_LUD_1622: "少年的手在抖。他慢慢解开布包——几本旧书，一本笔记，半块黑面包。军警A伸手去翻那本笔记，翻到某一页，停住了。"
 REU_LUD_1623: "「整合运动宣言摘要」……你自己写的？"
 REU_LUD_1624: "那是课堂笔记！老师让我们——"
 REU_LUD_1625: "老师？哪个老师。名字。"
 REU_LUD_1626: "我……"
 REU_LUD_1627: "不说？那就跟我们走。到地方你就说了。"
 REU_LUD_1630: "急什么。"
 REU_LUD_1631: "她按住你的手臂。力道很重。"
 REU_LUD_1632: "三个人，巷口可能还有暗哨。你冲出去，死的是你，不是他。"
 REU_LUD_1633: "那怎么办？"
 REU_LUD_1634: "等。"
 REU_LUD_1640: "对。等。"
 REU_LUD_1641: "她的眼睛眯起来。"
 REU_LUD_1642: "看他们的队长在哪。这三个人里没有队长。队长不会亲自搜包。"
 REU_LUD_1650: "我决定？"
 REU_LUD_1651: "她看了你一眼。"
 REU_LUD_1652: "索科洛夫。你跟我多久了。"
 REU_LUD_1653: "快两年。"
 REU_LUD_1654: "两年了还问我「您决定」。你什么时候能自己决定一次。"
 REU_LUD_1655: "……"
 REU_LUD_1656: "算了。等。"
 REU_LUD_1660: "军警A把笔记塞进自己的口袋，揪住少年的领子。少年挣扎了一下，布包掉在地上，黑面包滚出来，沾了灰。"
 REU_LUD_1661: "……面包。"
 REU_LUD_1662: "她的声音很低。低到你差点没听见。"
 REU_LUD_1663: "老实点！"
 REU_LUD_1664: "动手。"
 REU_LUD_1665: "她动起来的时候，你几乎看不清。灰影一闪，短刀的刀背砸在军警A的手腕上，发出一声闷响。军警A松手，少年跌坐在地。军警B刚要拔枪，你的刀已经架在他脖子上。"
 REU_LUD_1666: "别动。"
 REU_LUD_1667: "整、整合运动——"
 REU_LUD_1668: "聪明。"
 REU_LUD_1669: "军警C的手刚摸到枪套，柳德米拉的刀已经横在他喉咙前。三个军警，一个捂着手腕蹲在地上，两个僵着不敢动。"
 REU_LUD_1670: "索科洛夫。搜他们。武器卸了，通讯器砸了。"
 REU_LUD_1671: "是。"
 REU_LUD_1672: "你搜身的时候，柳德米拉蹲下来，捡起那块沾灰的黑面包，在袖口上蹭了蹭，放回少年的布包里。"
 REU_LUD_1673: "起来。"
 REU_LUD_1674: "……你们是……"
 REU_LUD_1675: "整合运动。"
 REU_LUD_1676: "少年的脸白了。"
 REU_LUD_1677: "怕什么。我们要杀你，刚才就不用救。"
 REU_LUD_1678: "我、我不是整合运动的人——"
 REU_LUD_1679: "我知道。你是学生。你的笔记里写的是「宣言摘要」，不是行动计划。"
 REU_LUD_1680: "……您怎么知道？"
 REU_LUD_1681: "因为行动计划不会用「摘要」这种词。"
 REU_LUD_1682: "她把军警A口袋里的笔记本抽出来，翻了两页，还给他。"
 REU_LUD_1683: "字不错。比我的好看。"
 REU_LUD_1690: "绑了。扔巷子里面。天亮之前他们醒不过来。"
 REU_LUD_1691: "不杀？"
 REU_LUD_1692: "杀他们干什么。三个小兵，什么都不知道。杀了浪费子弹。"
 REU_LUD_1693: "对。先问话。"
 REU_LUD_1694: "她转向少年。"
 REU_LUD_1695: "尤里。你在这座城市住了多久。"
 REU_LUD_1696: "他？"
 REU_LUD_1697: "她看了少年一眼。"
 REU_LUD_1698: "先问话。问完了再说。"
 REU_LUD_1700: "你把三个军警拖到巷子深处，用他们的皮带捆了。回来的时候，柳德米拉正靠在墙上，少年蹲在对面，抱着布包，像只受惊的猫。"
 REU_LUD_1701: "说吧。列夫·托尔斯泰号怎么回事。"
 REU_LUD_1702: "……三个月前，城里来了新的行政官。说是从切尔诺伯格调来的。"
 REU_LUD_1703: "名字。"
 REU_LUD_1704: "我不知道。大家都叫他「总督」。他来了之后，就开始抓人。"
 REU_LUD_1705: "抓什么人。"
 REU_LUD_1706: "先是矿工。然后是小贩。然后是学生。只要是和整合运动沾边的，或者被举报和整合运动沾边的，全抓。"
 REU_LUD_1707: "举报？"
 REU_LUD_1708: "对。有奖。举报一个人，给半个月的粮票。所以大家都在互相举报。"
 REU_LUD_1709: "柳德米拉没说话。她的手指在刀鞘上敲了一下。"
 REU_LUD_1710: "你被谁举报的。"
 REU_LUD_1711: "……我同学。他看上了我妹妹。"
 REU_LUD_1712: "粮票？"
 REU_LUD_1713: "粮票。"
 REU_LUD_1714: "她哼了一声。"
 REU_LUD_1715: "面包。又是面包。"
 REU_LUD_1716: "什么？"
 REU_LUD_1717: "没什么。继续说。城里现在什么情况。"
 REU_LUD_1718: "下层区已经空了。能跑的跑了，跑不了的被抓了。中层区还有人在，但都不敢出门。上层区……上层区现在只让军警和总督府的人进。"
 REU_LUD_1719: "粮食呢。"
 REU_LUD_1720: "配给制。每人每天三百克黑面包。但最近一个月连这个都不够了。有人说总督把粮食运走了，运去别的城市卖。"
 REU_LUD_1721: "运走。"
 REU_LUD_1722: "她重复这个词的时候，语气很平，但你知道她在想什么。"
 REU_LUD_1723: "这座城市还有多少人。"
 REU_LUD_1724: "下层区……大概还有三四千。都是走不了的。老人，孩子，病人。"
 REU_LUD_1725: "三四千。"
 REU_LUD_1726: "嗯。"
 REU_LUD_1727: "她沉默了一会儿。阳光从巷口照进来，照在她脸上。她的皮肤很白，白得有点不健康——上呼吸道的结晶化让她的嘴唇泛着一层薄薄的灰。"
 REU_LUD_1728: "尤里。你妹妹呢。"
 REU_LUD_1729: "在、在家里。中层区，三号街区。"
 REU_LUD_1730: "你出来干什么。"
 REU_LUD_1731: "找吃的。家里已经两天没东西了。"
 REU_LUD_1732: "柳德米拉从腰间的布袋里摸出一块压缩饼干，扔给他。少年手忙脚乱地接住。"
 REU_LUD_1733: "吃。"
 REU_LUD_1734: "谢、谢谢……"
 REU_LUD_1735: "少年咬了一口，噎住了，咳了两声。"
 REU_LUD_1736: "慢点。没人抢你的。"
 REU_LUD_1740: "做什么。"
 REU_LUD_1741: "她看着你。"
 REU_LUD_1742: "你说。十二个人，一座城，一个总督。你告诉我，做什么。"
 REU_LUD_1743: "你算术不错。"
 REU_LUD_1744: "她冷笑了一声。"
 REU_LUD_1745: "十二个人。三四千张嘴。一个不知道有多少兵的总督。你告诉我，这仗怎么打。"
 REU_LUD_1746: "我在想……"
 REU_LUD_1747: "她抬头看天。阳光从楼宇缝隙间落下来，照出满天尘埃。"
 REU_LUD_1748: "我在想，我爸爸要是看见这座城，会说什么。"
 REU_LUD_1749: "……"
 REU_LUD_1750: "他大概会说：「柳达，你看，城市也是活的。它需要粮食，需要水，需要人。你把粮食拿走了，它就是死的。」"
 REU_LUD_1760: "她低下头。"
 REU_LUD_1761: "索科洛夫。"
 REU_LUD_1762: "在。"
 REU_LUD_1763: "我们打不了总督。我们只有十二个人。"
 REU_LUD_1764: "……"
 REU_LUD_1765: "但是。"
 REU_LUD_1766: "她站直了。手指在刀鞘上又敲了一下。"
 REU_LUD_1767: "粮食在哪，是能查的。运粮的路线，是能截的。总督有多少兵，是能数的。"
 REU_LUD_1768: "您的意思是……"
 REU_LUD_1769: "我的意思是，我们不做英雄。我们做老鼠。"
 REU_LUD_1770: "她看着巷口的方向。阳光在那里铺开，亮得刺眼。"
 REU_LUD_1771: "老鼠啃不动整座粮仓，但能咬穿一个袋子。"
 REU_LUD_1772: "然后呢？"
 REU_LUD_1773: "然后？"
 REU_LUD_1774: "她看了你一眼。灰色的眼睛里有一点光，很淡，像灰烬里没灭的火星。"
 REU_LUD_1775: "然后，袋子里的粮食会漏出来。落在街上，落在人手里。三四千张嘴，总有人能吃到。"
 REU_LUD_1776: "少年抬起头，嘴里还含着半块压缩饼干。"
 REU_LUD_1777: "你们……要救我们？"
 REU_LUD_1778: "不救。"
 REU_LUD_1779: "她转身朝巷口走去。"
 REU_LUD_1780: "我们只是让总督不痛快。你们能不能活，看你们自己。"
 REU_LUD_1781: "主任。"
 REU_LUD_1782: "嗯？"
 REU_LUD_1783: "您去年看那片麦田的时候，也是这么说的。"
 REU_LUD_1784: "她停了一步。"
 REU_LUD_1785: "……那不一样。"
 REU_LUD_1786: "哪不一样。"
 REU_LUD_1787: "那麦子不会说话。这些人会。"
 REU_LUD_1788: "她走出巷子，走进阳光里。尘埃在她身后飘起来，像金色的雾。"
 REU_LUD_1789: "等一下！你们……你们叫什么名字？"
 REU_LUD_1790: "她没回头。"
 REU_LUD_1791: "弑君者。"
 REU_LUD_1792: "……"
 REU_LUD_1793: "告诉外面的人。让他们知道，这座城市里还有人没走。"
 REU_LUD_1794: "她的声音从阳光里传回来，很平，但每个字都砸在地上。"
 REU_LUD_1795: "还有人在看着他们。"
 REU_LUD_1796: "她走了。你跟在后面，回头看了一眼。少年站在巷口的阴影里，手里攥着那本笔记，布包抱在胸口。他目送你离开，嘴唇动了动，像在记你的样子。"
 REU_LUD_1797: "你追上她的时候，她正在看一张手绘的城市地图。"
 REU_LUD_1798: "索科洛夫。"
 REU_LUD_1799: "在。"
 REU_LUD_1800: "今晚开始。查粮仓，查路线，查总督的巡逻。"
 REU_LUD_1801: "是。"
 REU_LUD_1802: "还有。"
 REU_LUD_1803: "她把地图折起来，塞进口袋。"
 REU_LUD_1804: "三号街区，中层区，有个叫尤里的学生的妹妹。你去找她。给她粮食。"
 REU_LUD_1805: "……您不是说不管吗。"
 REU_LUD_1806: "我说的是「不救」。没说「不管」。"
 REU_LUD_1807: "她走在前面，背影被阳光拉得很长。"
 REU_LUD_1808: "这两件事不一样。"

# ============ 回忆录：来，把夜校保护好！（1098 年，通过决议触发） ============
 REU_LUD_1900: "这间教室原本是间废弃的仓库。木板钉成的课桌歪歪扭扭地排成四列，黑板是用锅底灰混着猪血刷的，擦多了会掉色。天花板上挂着一盏汽灯，光晕黄得发暗，照得每个人的脸都像蒙了一层旧报纸。"
 REU_LUD_1901: "门口没有牌子。窗户用厚布帘遮着。从外面看，这不过是一间普通的、深夜还亮着灯的仓库。"
 REU_LUD_1902: "而今晚，仓库里坐着三十四个人。矿工、洗衣妇、码头搬运工、两个半大孩子。他们的手上都有洗不掉的灰，或者冻裂的口子。他们来听一个人讲课。"
 REU_LUD_1903: "——所以，水的沸点取决于气压。气压越低，沸点越低。"
 REU_LUD_1904: "她站在黑板前，穿一件灰蓝色的旧工装，袖口挽到小臂中段。没有勋章，没有绶带，连那把从不离身的短刀都留在了办公室。她的声音很平，像在念一份没什么要紧的报告。但她的眼睛是亮的。"
 REU_LUD_1905: "这意味着什么。意味着你在高原上煮东西，它熟得比平地慢。如果你的面包烤不熟，不是面包的问题，是气压的问题。"
 REU_LUD_1906: "底下有人笑了。一个老矿工举手。"
 REU_LUD_1907: "局长同志，那感情好。我们矿区那帮厨子总算有借口了。面包硬得能砸死人，回头就说——不是我的错，是气压的错。"
 REU_LUD_1908: "面包硬，是发酵的问题。气压不背这个锅。"
 REU_LUD_1909: "底下又笑。她没笑，但嘴角有极淡的弧度。"
 REU_LUD_1910: "下一个问题。"
 REU_LUD_1911: "局长同志……您说的是「气压」。可这跟咱们有什么关系？咱们又不造气压计。"
 REU_LUD_1912: "你家烧水吗。"
 REU_LUD_1913: "烧啊。"
 REU_LUD_1914: "水开了冒气，气就是汽。汽压大了，能把锅盖顶翻。你每天洗衣服，天天跟气压打交道，怎么就没关系了。"
 REU_LUD_1915: "洗衣妇张了张嘴，没说出话。"
 REU_LUD_1916: "科学不是实验室里的东西。科学是你每天活着的道理。懂了它，你就不会被人随便糊弄。"
 REU_LUD_1917: "她转身在黑板上写了两行字，灰黑的锅底灰粉笔断了一截。"
 REU_LUD_1918: "往下。今天讲第二个问题——什么是谎言。"
 REU_LUD_1919: "底下安静了。她把手上的灰在工装上蹭了蹭。"
 REU_LUD_1920: "谎言分两种。一种是说假话，说「水是固体」。这是蠢谎，好认。"
 REU_LUD_1921: "另一种是说半真不假的话。说「水在零度结冰」——对。但它没说，在零度以上，水也会结冰，只要气压够低。"
 REU_LUD_1922: "后半句，他们不告诉你。"
 REU_LUD_1923: "所以你要自己学会看。学会问。学会问一句——「你没说的那半句呢？」"
 REU_LUD_1924: "她放下粉笔，看着底下的人。"
 REU_LUD_1925: "这就是我今天要讲的全部。下课。"
 REU_LUD_1926: "桌椅响动。人们站起来，低声交谈着往外走。柳德米拉站在黑板前没动，等最后一个人离开。你靠在门框上，看着她。"
 REU_LUD_1927: "今晚人比上周多六个。"
 REU_LUD_1928: "多三个。门口台阶上还坐着一个，没进来。"
 REU_LUD_1929: "一个腿脚不便的老人。我看见了。"
 REU_LUD_1930: "嗯。下次把前排的桌子撤两张，留出通行的路。"
 REU_LUD_1931: "是。"
 REU_LUD_1932: "她从讲台上拿起水杯喝了一口。水是凉的。她的喉咙里又传来那种很轻的、砂纸摩擦的声音。"
 REU_LUD_1933: "您的药，今天吃了吗。"
 REU_LUD_1934: "吃了。"
 REU_LUD_1935: "什么时候。"
 REU_LUD_1936: "……索科洛夫。"
 REU_LUD_1937: "在。"
 REU_LUD_1938: "你是我部下，不是我妈。"
 REU_LUD_1939: "她把水杯放下，走到窗边，掀开布帘一角。外面是漆黑的巷子，路灯坏了一盏，另一盏忽明忽暗。远处，情报局大楼的灯还亮着。"
 REU_LUD_1940: "街道清了？"
 REU_LUD_1941: "两组人，一组前门，一组后巷。都是信得过的。"
 REU_LUD_1942: "信得过。"
 REU_LUD_1943: "她重复了这三个字，语气没什么波动。"
 REU_LUD_1944: "上周在后巷的那个，也是「信得过」的。"
 REU_LUD_1945: "……他死了。"
 REU_LUD_1946: "他死了，因为他先动手。不是因为他信不过。"
 REU_LUD_1947: "您知道我的意思。"
 REU_LUD_1948: "她没接话。她看着窗外那盏忽明忽暗的路灯，看了一会儿。"
 REU_LUD_1949: "索科洛夫。你跟了我三年。"
 REU_LUD_1950: "快四年了。"
 REU_LUD_1951: "四年。那你应该知道，我为什么非要自己出来讲课。"
 REU_LUD_1952: "因为您觉得工人们需要教育。"
 REU_LUD_1953: "还有呢。"
 REU_LUD_1954: "……因为您不怕。"
 REU_LUD_1955: "错。"
 REU_LUD_1956: "她放下布帘，转过身。"
 REU_LUD_1957: "我怕。上个月他们打死了两个教员。一个在城东，一个在码头。他们死的时候，手里还攥着课本。"
 REU_LUD_1958: "她的声音没有变，但手指在窗台边缘敲了一下。"
 REU_LUD_1959: "我怕得要命。"
 REU_LUD_1960: "那您为什么——"
 REU_LUD_1961: "因为我更怕另一件事。"
 REU_LUD_1962: "她看着你。"
 REU_LUD_1963: "我怕有一天，这些工人不再来了。怕他们觉得，读书是危险的，是没用的，是「局长同志」的一厢情愿。怕他们回到矿井里，回到洗衣盆前，回到那种——别人说什么就是什么的日子。"
 REU_LUD_1964: "那种日子，我过过。"
 REU_LUD_1965: "她离开窗边，走到讲台前，把那截断了的粉笔捡起来，在手指间转了一圈。"
 REU_LUD_1966: "我爸爸是科学家。他在研究所里写报告，做实验，一切都要有数据，有论证。他教过我一句话——柳达，你要学会自己判断，因为没有人会替你判断。"
 REU_LUD_1967: "后来他被带走了。没人替他判断。"
 REU_LUD_1968: "她把粉笔放回粉笔槽。"
 REU_LUD_1969: "我判断不了他的死活。但我能判断一件事——这间教室里的三十四个人，今晚学到的每一个字，都会变成他们自己的东西。别人拿不走。"
 REU_LUD_1970: "……"
 REU_LUD_1971: "所以我不怕。我怕，但我还是要来。"
 REU_LUD_1972: "她走到门口，从衣架上取下那件军大衣，披上。动作很快，像在结束一场她不想多谈的对话。"
 REU_LUD_1973: "走吧。"
 REU_LUD_1974: "等一下。"
 REU_LUD_1975: "你从口袋里摸出一样东西，递过去。一个布包，很小，用麻绳扎着。"
 REU_LUD_1976: "什么。"
 REU_LUD_1977: "面包。黑麦的，没放糖。烤得有点过，壳硬。"
 REU_LUD_1978: "她看着那个布包，没接。"
 REU_LUD_1979: "你什么时候学会烤面包的。"
 REU_LUD_1980: "上次在南部，您说叙拉古的面包放盐不放糖。我记着。"
 REU_LUD_1981: "我说过吗。"
 REU_LUD_1982: "1096 年秋天，乌萨斯南部，一片没人收的麦田。"
 REU_LUD_1983: "她沉默了两秒。"
 REU_LUD_1984: "……你记性确实好。"
 REU_LUD_1985: "她接过布包，揣进大衣内侧的口袋里。没有说谢。"
 REU_LUD_1986: "走吧。前门那组人该换岗了。"
 REU_LUD_1987: "她推开门。夜风灌进来，带着冻土和煤灰的味道。巷子里的路灯还在闪，一亮一灭，把她的影子拉得忽长忽短。"
 REU_LUD_1988: "她走在前面。军大衣的下摆扫过积了霜的地面。你跟在后面，回头看了一眼那间仓库。汽灯的光从布帘缝隙里漏出来，在黑暗里划出一道细细的、温热的线。"
 REU_LUD_1989: "索科洛夫。"
 REU_LUD_1990: "在。"
 REU_LUD_1991: "明天去情报局档案室，把去年到现在所有教员遇袭的记录调出来。时间、地点、手法。"
 REU_LUD_1992: "您要做什么？"
 REU_LUD_1993: "我要看看他们什么时候来。"
 REU_LUD_1994: "她停了一步，回头看了一眼仓库的灯光。"
 REU_LUD_1995: "来，把夜校保护好。"
 REU_LUD_1996: "她的声音很轻，但每个字都像钉进冻土里的钉子。"
 REU_LUD_1997: "这间教室，多亮一晚上，他们就多怕一晚上。"
 REU_LUD_1998: "是。"
 REU_LUD_1999: "她转过身，继续走。身影很快被巷子的黑暗吞没，只剩下军靴踩在霜地上的、有节奏的声响。"
 REU_LUD_2000: "你跟上她。身后，仓库里的汽灯还亮着。明天，后天，只要灯还亮着，就有人会来。"

# ============ 回忆录：奇妙的源石工业与奇妙的丝袜（1099 年，通过决议触发） ============
 REU_LUD_2200: "这座工厂是情报局去年从一家倒闭的贵族工坊手里接管的。三层砖楼，外墙上还留着旧主人的纹章，被红漆粗暴地盖掉了。车间里机器轰鸣，空气中飘着细密的丝絮，混着源石蒸汽那股淡淡的甜腥味。"
 REU_LUD_2201: "柳德米拉局长穿着她那件灰蓝色的旧工装，戴着口罩，走在车间过道里。身后跟着厂长、总工程师和两个技术员。你走在最后面，手按在腰间的枪套上，目光扫过每一扇窗户。"
 REU_LUD_2202: "——局长同志，请看。这是我们最新改造的源石蒸汽釜，热效率比旧型号高出百分之十七。安全阀组是双回路设计，即使一个阀体堵塞，另一个也能在零点三秒内响应。"
 REU_LUD_2203: "零点三秒。"
 REU_LUD_2204: "是，是的。"
 REU_LUD_2205: "如果两个都堵了呢。"
 REU_LUD_2206: "……那个概率极低，大约在——"
 REU_LUD_2207: "概率低不等于不会发生。上个月城东面粉厂的蒸汽釜爆炸，死了十一个人。报告上写的是「意外」，意思是没人知道为什么会炸。"
 REU_LUD_2208: "总工程师的脸白了。"
 REU_LUD_2209: "带我去看你们的安全阀组。"
 REU_LUD_2210: "她走到那台巨大的蒸汽釜前，蹲下来，手指沿着管道接口摸过去。她的指尖在某个法兰盘上停住了。"
 REU_LUD_2211: "这里。"
 REU_LUD_2212: "局、局长？"
 REU_LUD_2213: "垫圈老化。边缘有裂纹，深度大约两毫米。你们多久没换了。"
 REU_LUD_2214: "按照规程，每季度——"
 REU_LUD_2215: "规程写的是每季度。你们上次换是什么时候。"
 REU_LUD_2216: "……"
 REU_LUD_2217: "我替你回答。去年十二月。到今天已经超过五个月。"
 REU_LUD_2218: "她站起来，看着厂长。"
 REU_LUD_2219: "停机。今天停机。垫圈全部换新，安全阀组拆检。三天后我再来。"
 REU_LUD_2220: "局长同志，可是生产任务——"
 REU_LUD_2221: "生产任务？"
 REU_LUD_2222: "她看着厂长。灰色的眼睛很平，没有什么情绪。"
 REU_LUD_2223: "如果你手底下的工人因为一个三卢布的垫圈死了，你拿什么完成生产任务。"
 REU_LUD_2224: "厂长张了张嘴，没说出话。"
 REU_LUD_2225: "停机。"
 REU_LUD_2226: "……是。"
 REU_LUD_2227: "她继续往前走。技术员们低着头跟在后面。你看见她的手在袖口里轻轻敲了一下——那是她心情不好的习惯。"
 REU_LUD_2228: "车间尽头是一间产品陈列室。玻璃柜里摆着各色丝织品，绸缎、绡纱、还有几排用木架撑开的丝袜。黑的、肉色的、深灰的，在灯光下泛着油亮的光泽。"
 REU_LUD_2229: "这些是什么。"
 REU_LUD_2230: "丝袜，局长同志。我们厂的传统产品。战前是供应给圣骏堡的，现在……现在我们只能卖给合作社和黑市。"
 REU_LUD_2231: "黑市？"
 REU_LUD_2232: "合法的黑市！我是说，民间贸易市场——"
 REU_LUD_2233: "行了。"
 REU_LUD_2234: "她走到玻璃柜前，看着那排丝袜。她的目光停在那双黑色的上面，看了几秒。"
 REU_LUD_2235: "这个。产量多少。"
 REU_LUD_2236: "每月大约两千双。主要是女工和家庭主妇买。"
 REU_LUD_2237: "原料呢。"
 REU_LUD_2238: "进口生丝，还有本地一部分。源石蒸汽处理，柔化纤维。处理过程中会用到微量源石粉尘。"
 REU_LUD_2239: "粉尘浓度安全吗。"
 REU_LUD_2240: "安、安全。车间里有排风系统——"
 REU_LUD_2241: "排风系统哪年装的。"
 REU_LUD_2242: "……"
 REU_LUD_2243: "我明天让检测组来测。粉尘超标的话，停产整改。"
 REU_LUD_2244: "是、是。"
 REU_LUD_2245: "她转身要走，又停住了。目光回到玻璃柜里那双黑丝袜上。"
 REU_LUD_2246: "索科洛夫。"
 REU_LUD_2247: "在。"
 REU_LUD_2248: "去车间门口等我。"
 REU_LUD_2249: "她说话的语气没什么变化，但你听出了另一种东西。不是生气，不是命令。像是……好奇。"
 REU_LUD_2250: "你守在车间门口，大约过了二十分钟。工人们已经停机，在工头的带领下开始拆卸管道。你听见身后传来脚步声。很轻，但节奏和平常不太一样。"
 REU_LUD_2251: "索科洛夫。"
 REU_LUD_2252: "你回头。她站在洗手间的门里，只露出上半身。脸上还是没什么表情，但耳尖有一点点红。你怀疑是车间里太热了。"
 REU_LUD_2253: "过来。"
 REU_LUD_2254: "……主任？"
 REU_LUD_2255: "局长。叫局长。"
 REU_LUD_2256: "她的声音压得很低。你走过去，停在离洗手间门两步远的地方。她看了你一眼，然后侧开身子，让出门缝。"
 REU_LUD_2257: "洗手间的镜子前，堆着几条拆封的丝袜包装。她的工装裤已经穿回去了，但裤脚卷着。脚上……穿了一双黑色的丝袜。泛着油亮的光，贴在她的腿上，一直延伸到工装裤的裤管里。"
 REU_LUD_2258: "那个厂长说，这是他们的主打产品。"
 REU_LUD_2259: "她的语气很随意，像在汇报工作。"
 REU_LUD_2260: "源石蒸汽柔化，纤维强度提升。防水，抗拉伸。我试了一下。"
 REU_LUD_2261: "……"
 REU_LUD_2262: "你哑巴了。"
 REU_LUD_2263: "您……穿着？"
 REU_LUD_2264: "不然呢。光着腿试？"
 REU_LUD_2265: "她低头看了一眼自己的腿。丝袜在洗手间昏黄的灯光下泛着那种廉价又夸张的光泽，像刷了一层油。"
 REU_LUD_2266: "这玩意儿。"
 REU_LUD_2267: "她用手背蹭了一下小腿。丝袜发出很轻的「沙」声。"
 REU_LUD_2268: "滑的。像蛇皮。"
 REU_LUD_2269: "……"
 REU_LUD_2270: "我问你。"
 REU_LUD_2271: "她抬起头。灰色的眼睛盯着你。脸上什么表情都没有，但耳尖那点红已经蔓延到了耳根。"
 REU_LUD_2272: "我穿这玩意儿，好不好看。"
 REU_LUD_2280: "她看了你两秒。"
 REU_LUD_2281: "适合？"
 REU_LUD_2282: "什么叫适合。适合上战场？适合开肃反会议？"
 REU_LUD_2283: "我是说……好看。"
 REU_LUD_2284: "哼。"
 REU_LUD_2285: "她转过身，对着镜子看了一眼。"
 REU_LUD_2286: "油光光的。像刚出锅的香肠。"
 REU_LUD_2287: "……"
 REU_LUD_2288: "不过你说的。好看。"
 REU_LUD_2290: "她挑了挑眉。"
 REU_LUD_2291: "怪？"
 REU_LUD_2292: "您平时穿工装和军靴。这个……对比有点大。"
 REU_LUD_2293: "所以是不好看。"
 REU_LUD_2294: "我没说不好看。"
 REU_LUD_2295: "你说「怪」。"
 REU_LUD_2296: "怪和不好看不一样。"
 REU_LUD_2297: "她盯着你看了三秒。然后哼了一声。"
 REU_LUD_2298: "你倒是会说话。"
 REU_LUD_2300: "她愣了一下。"
 REU_LUD_2301: "主任。"
 REU_LUD_2302: "肃反主任。"
 REU_LUD_2303: "她看着镜子里的自己。"
 REU_LUD_2304: "那个主任现在穿着黑丝袜站在工厂洗手间里。你觉得她该叫什么。"
 REU_LUD_2305: "柳德米拉。"
 REU_LUD_2306: "她从镜子里看你。"
 REU_LUD_2307: "……就你会说。"
 REU_LUD_2320: "她弯下腰，把裤脚放下来。丝袜被遮住了，只露出脚踝上方一小截黑色。"
 REU_LUD_2321: "这个东西，有实用价值。"
 REU_LUD_2322: "……什么？"
 REU_LUD_2323: "冬天。穿在裤子里面，保暖。比棉裤薄，不影响行动。潜伏的时候——"
 REU_LUD_2324: "潜伏的时候？"
 REU_LUD_2325: "没。没什么。"
 REU_LUD_2326: "她把丝袜包装的纸团成一团，扔进垃圾桶。动作很利落。"
 REU_LUD_2327: "走了。三天后还要来复查垫圈。"
 REU_LUD_2328: "她推门出去。你跟在后面。车间里的工人正在拆卸管道，金属碰撞声此起彼伏。她走过的时候，几个工人抬头看了一眼，又低下头继续干活。"
 REU_LUD_2329: "走到车间门口，她忽然停住。"
 REU_LUD_2330: "索科洛夫。"
 REU_LUD_2331: "在。"
 REU_LUD_2332: "刚才的事。"
 REU_LUD_2333: "我什么都没看见。"
 REU_LUD_2334: "她回头看了你一眼。嘴角有一个很淡的弧度。不是笑。"
 REU_LUD_2335: "你记性那么好，「什么都没看见」？"
 REU_LUD_2336: "……我忘了。"
 REU_LUD_2337: "行。"
 REU_LUD_2338: "她走出车间。外面的阳光照在她灰蓝色的工装上，照在她口罩上方那双灰色的眼睛上。风把她的短发吹起来，露出一小截脖颈——上面有源石结晶的纹路，像霜。"
 REU_LUD_2339: "三天后回来。垫圈的事，你盯着。"
 REU_LUD_2340: "是。"
 REU_LUD_2341: "还有。"
 REU_LUD_2342: "她从口袋里摸出一样东西，扔给你。你接住。一小卷黑色的丝袜，用纸带扎着。"
 REU_LUD_2343: "给夜校那个洗衣妇。她上次说冬天腿冷。"
 REU_LUD_2344: "……您刚才不是只拿了一双？"
 REU_LUD_2345: "我拿了两双。"
 REU_LUD_2346: "她走在前面，背影笔直。军靴踩在石板路上，发出有节奏的声响。"
 REU_LUD_2347: "一双试。一双送人。"
 REU_LUD_2348: "那您试的那双呢？"
 REU_LUD_2349: "她没回头。"
 REU_LUD_2350: "留着。"
 REU_LUD_2351: "留着做什么？"
 REU_LUD_2352: "你管我。"
 REU_LUD_2353: "她的耳根又红了。这次你看得很清楚。风从工厂的方向吹过来，带着丝絮和源石蒸汽的味道。她走得更快了一些。"

# ============ 回忆录：军阀与暴君的宴会潜入记（1100 年，通过决议触发） ============
 REU_LUD_2500: "圣骏堡的秋天比南方冷得早。涅瓦大街两旁的椴树叶子已经黄了大半，风一吹就簌簌地落，铺在石板路上，被马车轮子碾成金色的泥。"
 REU_LUD_2501: "一辆黑色四轮马车停在街角。车帘掀开一条缝，露出柳德米拉半张脸。她没穿工装，也没穿军大衣。她穿着一件深灰色的羊毛长裙，领口扣到最上面一颗，头发用一根素银簪子别起来。没戴口罩。"
 REU_LUD_2502: "……这衣服勒得慌。"
 REU_LUD_2503: "裁缝说这是圣骏堡今年的流行款式。"
 REU_LUD_2504: "流行的意思是「把人勒死也不许喘气」？"
 REU_LUD_2505: "她放下车帘，在黑暗里瞪了你一眼。你看不清她的表情，但能感觉到。"
 REU_LUD_2506: "还有这鞋。跟太高了。"
 REU_LUD_2507: "您穿军靴能进宴会吗？"
 REU_LUD_2508: "我能穿军靴踢开宴会厅的门。那才是我擅长的。"
 REU_LUD_2509: "……今天不行。"
 REU_LUD_2510: "我知道。"
 REU_LUD_2511: "她从袖口里摸出一样东西——一把很小的折叠刀，刀刃只有两根手指长。她把它塞进手袋内侧的夹层里。然后她又摸了摸另一个口袋，确认那份伪造的邀请函还在。"
 REU_LUD_2512: "索科洛夫。"
 REU_LUD_2513: "在。"
 REU_LUD_2514: "你确定你那身礼服没问题？"
 REU_LUD_2515: "裁缝说没问题。"
 REU_LUD_2516: "裁缝说没问题。裁缝还说我这身好看呢。"
 REU_LUD_2517: "……确实好看。"
 REU_LUD_2518: "沉默了三秒。"
 REU_LUD_2519: "闭嘴。"
 REU_LUD_2520: "她推开车门，踩着小高跟下了车。脚落地的时候晃了一下，你伸手扶住她的手臂。她瞪了你一眼，但没甩开。"
 REU_LUD_2521: "松手。"
 REU_LUD_2522: "是。"
 REU_LUD_2523: "她站直了。深吸一口气。然后，她的肩膀松了下来，下巴微微抬起，眼神从「肃反主任」变成了另一种东西——一种你从没见过的、属于贵族舞会的、慵懒而矜持的弧度。"
 REU_LUD_2524: "记住。我叫安娜·米哈伊洛夫娜·沃尔孔斯卡娅。丈夫是退役的近卫军上尉，做木材生意，跟圣骏堡的几家商行有往来。"
 REU_LUD_2525: "我叫——"
 REU_LUD_2526: "你叫德米特里·彼得罗维奇·沃尔孔斯基。我的丈夫。"
 REU_LUD_2527: "她说「我的丈夫」的时候，语气很平。但耳根有一点点红。你怀疑是秋天的风太冷。"
 REU_LUD_2528: "走吧，「德米特里」。"
 REU_LUD_2529: "她伸出手臂。你愣了一下，才反应过来——她让你挽着她。你伸手过去。她的手搭在你的臂弯上，指尖冰凉。"
 REU_LUD_2530: "别紧张。你紧张，别人就会看出来。"
 REU_LUD_2531: "我没紧张。"
 REU_LUD_2532: "你的手臂硬得像木头。"
 REU_LUD_2533: "谢尔盖·伊里奇·沃尔孔斯基公爵的宅邸是圣骏堡最老的建筑之一。大理石台阶从门廊一直铺到三楼宴会厅，两旁站满了穿制服的侍从。水晶吊灯从穹顶垂下来，光被切成无数碎片，落在每个人的肩章和勋章上。"
 REU_LUD_2534: "柳德米拉挽着你走上台阶。她的步子很稳，小高跟踩在大理石上，发出清脆的声响。她的目光从每个侍从身上扫过去，扫过他们的肩章、腰带、佩剑。"
 REU_LUD_2535: "左边第二个，肩章上有三道杠。近卫军中尉。他看人的时候先看手。你在矿场干过活，手上有茧。别让他看见。"
 REU_LUD_2536: "明白。"
 REU_LUD_2537: "她说话的时候，嘴唇几乎没动。脸上的表情还是那种慵懒的、贵族式的浅笑。"
 REU_LUD_2538: "门口那个侍从长，灰色头发。他的手一直在摸左边袖口。里面有枪。"
 REU_LUD_2539: "宴会厅里还带枪？"
 REU_LUD_2540: "圣骏堡的宴会厅。每个人都带枪。只是看谁先拔出来。"
 REU_LUD_2541: "她走上最后一级台阶，宴会厅的大门在面前敞开。里面是人声、乐声、杯盏碰撞声混成的暖流，裹着香水味和烤肉的油脂气扑面而来。"
 REU_LUD_2542: "笑。"
 REU_LUD_2543: "她低声说了一个字。然后她自己先笑了——那种恰到好处的、浅浅的、对一切都习以为常的笑。你跟着笑。你们走进宴会厅，像一对再普通不过的、来圣骏堡过秋的年轻夫妇。"
 REU_LUD_2544: "宴会厅很大。主桌在正前方，坐着几个穿深绿将官制服的人。柳德米拉挽着你在人群里穿行，时不时跟人点头致意。她的步伐很慢，像是在闲逛。"
 REU_LUD_2545: "主桌。左边第二个。肩章上有金色橡叶，那是集团军参谋长。他右边那个人——你看他的领口，有两枚交叉的银箭。那是帝国情报局的人。"
 REU_LUD_2546: "目标是谁？"
 REU_LUD_2547: "目标是一个带公文包的人。参谋长不会亲自拿文件。他身边一定有一个副官，专门负责机密文件的保管。"
 REU_LUD_2548: "她的目光从主桌扫向侧厅。"
 REU_LUD_2549: "侧厅。靠窗的位置。穿少校制服，手里拿着一个黑色牛皮公文包。就是他了。"
 REU_LUD_2550: "怎么接近？"
 REU_LUD_2551: "你负责引开他的注意力。我负责公文包。"
 REU_LUD_2552: "怎么引开？"
 REU_LUD_2553: "她侧过脸看了你一眼。"
 REU_LUD_2554: "你是我的丈夫。你想个办法。"
 REU_LUD_2555: "……"
 REU_LUD_2556: "别告诉我你连这个都不会。"
 REU_LUD_2557: "……我可以去跟他攀谈。说我是退役上尉，对集团军的部署感兴趣。"
 REU_LUD_2558: "太蠢了。你一开口就是矿工口音。"
 REU_LUD_2559: "那怎么办？"
 REU_LUD_2560: "她停下脚步。目光从你脸上移到旁边。一个穿淡蓝色裙子的年轻女人正端着酒杯走过来。她看见你们，笑着点了点头。"
 REU_LUD_2561: "哦！伊莲娜·德米特里耶夫娜！好久不见！"
 REU_LUD_2562: "她松开你的手臂，迎上去握住那个年轻女人的手。两个人用圣骏堡贵族圈里那种又快又轻的腔调聊起来。你站在旁边，看着柳德米拉一边笑一边说话，手指在对方手背上轻轻拍着，完全是一副久别重逢的闺中密友的样子。"
 REU_LUD_2563: "然后她侧过身，对你招了招手。"
 REU_LUD_2564: "德米特里，亲爱的，来认识一下伊莲娜·德米特里耶夫娜。她的丈夫就是那位——啊，说曹操曹操到。"
 REU_LUD_2565: "你看见那个穿少校制服、拿黑色公文包的人正从侧厅走过来。他看见伊莲娜，笑着加快了脚步。柳德米拉对你眨了一下眼。你明白了——她认识这个女人的丈夫。"
 REU_LUD_2566: "安娜？安娜·米哈伊洛夫娜！"
 REU_LUD_2567: "帕维尔！天哪，你看起来一点都没变。"
 REU_LUD_2568: "她迎上去，跟少校握了手。动作很自然，像真的在跟旧相识打招呼。少校手里的公文包还夹在腋下。"
 REU_LUD_2569: "你们什么时候来圣骏堡的？"
 REU_LUD_2570: "昨天。德米特里——这位就是我跟你提过的帕维尔·尼古拉耶维奇，伊莲娜的丈夫。我们小时候在庄园里一起骑马。"
 REU_LUD_2571: "幸会。"
 REU_LUD_2572: "你伸出手。少校把公文包换到左手，腾出右手跟你握。你注意到柳德米拉的目光落在公文包上。她看了大约一秒钟。"
 REU_LUD_2573: "帕维尔，你还是老样子。公文包不离手。以前你上学的时候就这样，课本从来不借人。"
 REU_LUD_2574: "哈！职业病了。我现在在参谋部，文件太多，丢一份就是掉脑袋的事。"
 REU_LUD_2575: "这么严重？我还以为你在近卫军当差呢。"
 REU_LUD_2576: "调了。去年调的。参谋部，管后勤部署。"
 REU_LUD_2577: "后勤？那岂不是整个圣骏堡的粮食和弹药都归你管？"
 REU_LUD_2578: "差不多吧。还有集团军的一部分布防——算了，不说这个。你们住哪儿？明天一起吃个饭？"
 REU_LUD_2579: "好啊。我们住在涅瓦大街的「欧罗巴」旅馆，三号房。"
 REU_LUD_2580: "她松开少校的手，转向伊莲娜，又聊了两句家常。然后她挽起你的手臂，往另一个方向走去。走出一段距离之后，她低头看了一眼自己的手。"
 REU_LUD_2581: "好了。"
 REU_LUD_2582: "什么好了？"
 REU_LUD_2583: "她松开你的手臂，手指间夹着一把很小的铜钥匙——公文包的钥匙。"
 REU_LUD_2584: "什么时候——"
 REU_LUD_2585: "刚才握手的时候。他换手提公文包，钥匙挂在包扣上，晃了一下。"
 REU_LUD_2586: "您怎么知道是哪把？"
 REU_LUD_2587: "公文包只有一层锁。钥匙上有编号。我看了一眼就知道。"
 REU_LUD_2588: "那我们现在……"
 REU_LUD_2589: "等。等他去拿酒。公文包会放在桌上，或者交给侍从。"
 REU_LUD_2590: "她端起一杯香槟，喝了一小口。眼睛一直盯着侧厅的方向。"
 REU_LUD_2591: "少校去了洗手间。公文包被放在侧厅的一张空桌上。柳德米拉从你身边走过，裙摆轻轻扫过你的腿。她没有看你，但她的手在你手背上敲了一下。信号。"
 REU_LUD_2592: "你走向侧厅，在公文包对面的椅子上坐下。柳德米拉从另一侧走过来，手袋的拉链开着。她在桌前停了一秒。两秒。三秒。然后她转身走开，手袋里多了一卷纸。"
 REU_LUD_2593: "你站起来，慢步走出侧厅。柳德米拉已经在走廊拐角等你了。她把那卷纸塞进你的口袋。"
 REU_LUD_2594: "走。"
 REU_LUD_2595: "这么快——"
 REU_LUD_2596: "少校要回来了。我从走廊窗户看见他出洗手间了。"
 REU_LUD_2597: "她挽住你的手臂，加快脚步。你们穿过宴会厅，走向主楼梯。"
 REU_LUD_2598: "马车驶离贵族区，拐进涅瓦大街。柳德米拉把车帘放下，长长地呼出一口气。然后她伸手从你口袋里摸出那卷纸，展开，借着车窗外路灯的微光看了一眼。"
 REU_LUD_2599: "帝国集团军，西部集群。部署图。标注到了连级。"
 REU_LUD_2600: "真的？"
 REU_LUD_2601: "真的。"
 REU_LUD_2602: "她把纸重新卷起来，塞进手袋里。"
 REU_LUD_2603: "回去之后立刻复制。原件送回去。"
 REU_LUD_2604: "送回去？"
 REU_LUD_2605: "明天少校发现公文包里少了东西，会怎么样？"
 REU_LUD_2606: "会全城搜捕。"
 REU_LUD_2607: "对。但如果东西还在——只是被人动过，位置偏了一点点——他可能根本不会发现。"
 REU_LUD_2608: "……所以您计划让他自己放回去。"
 REU_LUD_2609: "不是我。是你。"
 REU_LUD_2610: "我？"
 REU_LUD_2611: "明天中午，你去欧罗巴旅馆，找帕维尔少校。就说你捡到了他的公文包钥匙，来还给他。"
 REU_LUD_2612: "钥匙？"
 REU_LUD_2613: "我配了一把。原件我放回去了。"
 REU_LUD_2614: "她从手袋里摸出另一把钥匙，扔给你。"
 REU_LUD_2615: "他拿到钥匙，会打开公文包检查。文件还在，但顺序乱了。他会以为是自己记错了。然后他会放下心。"
 REU_LUD_2616: "如果他不放心呢？"
 REU_LUD_2617: "那就看你随机应变。"
 REU_LUD_2618: "她靠回座位，闭上眼睛。马车在石板路上颠簸，路灯的光从车帘缝隙里一明一暗地扫过她的脸。"
 REU_LUD_2619: "索科洛夫。"
 REU_LUD_2620: "在。"
 REU_LUD_2621: "今天你表现不错。"
 REU_LUD_2622: "她的声音很轻。"
 REU_LUD_2623: "「德米特里·彼得罗维奇」。你演得像个真的退役上尉。"
 REU_LUD_2624: "……您演得更像。"
 REU_LUD_2625: "我演过很多次。在整合运动的时候，暗杀目标经常在宴会厅里。我扮过女仆，扮过乐师，扮过舞女。"
 REU_LUD_2626: "她睁开一只眼。"
 REU_LUD_2627: "扮妻子还是第一次。"
 REU_LUD_2628: "……"
 REU_LUD_2629: "别多想。任务需要。"
 REU_LUD_2630: "她闭上眼，又靠回座位。"
 REU_LUD_2631: "不过。"
 REU_LUD_2632: "嗯？"
 REU_LUD_2633: "你挽我的时候，手在抖。"
 REU_LUD_2634: "……我没有。"
 REU_LUD_2635: "你抖了。"
 REU_LUD_2636: "那是您的手在抖。"
 REU_LUD_2637: "她睁开眼，瞪了你一下。"
 REU_LUD_2638: "闭嘴。"
 REU_LUD_2639: "马车拐进一条小巷，停在情报局的安全屋前。柳德米拉推开车门，踩着小高跟跳下车，落地的时候又晃了一下。这次她没让你扶，自己扶住了车门。"
 REU_LUD_2640: "明天中午，欧罗巴旅馆。别迟到。"
 REU_LUD_2641: "是。"
 REU_LUD_2642: "她走进安全屋，反手关上门。你站在马车旁边，听见里面传来她的声音，很轻，像是在自言自语。"
 REU_LUD_2643: "……该死的鞋。"
 REU_LUD_2644: "你低头看了一眼马车座位。她刚才坐过的地方，落了一根素银簪子。你捡起来，揣进口袋里。"

# ============ 回忆录：白面包与黑火药（1101 年，通过决议触发） ============
 REU_LUD_2800: "苏维埃宫是旧帝国东部参议院改建的。穹顶上还留着双头鹰浮雕被凿平的痕迹，裂缝里嵌着没清干净的石膏。长桌两旁坐满了人，烟雾缭绕，空气闷得像要下雨。"
 REU_LUD_2801: "桌子的尽头，塔露拉坐在主位上。她比几年前更瘦了，颧骨突出，眼睛陷在阴影里，但目光还是那么亮，亮得像烧红的铁。她左边坐着博卓卡斯替，温迪戈的角从额际弯出来，军装袖口被撑得紧绷。他手里攥着一支铅笔，在桌上敲。"
 REU_LUD_2802: "……所以，结论是，我们还需要三个月。"
 REU_LUD_2803: "是。西部集群的整编还需要时间。目前能投入一线作战的满编师只有十一个，而帝国方面已经集结了至少十七个师。"
 REU_LUD_2804: "十一个……够了。"
 REU_LUD_2805: "博卓卡斯替同志，如果算上后勤和预备队——"
 REU_LUD_2806: "我说……够了。"
 REU_LUD_2807: "铅笔在桌上敲了一下。很响。他的声音从喉咙深处挤出来，每个词之间隔着半拍，像齿轮卡了石子。"
 REU_LUD_2808: "北原。十个师。对十七个。我们……赢了。"
 REU_LUD_2809: "靠的……不是人数。靠的是……敢不敢，把刀子捅进去。"
 REU_LUD_2810: "你的意思是，集中全部力量，打一场决战。"
 REU_LUD_2811: "对。"
 REU_LUD_2812: "他把铅笔放下，手指按在桌面上。"
 REU_LUD_2813: "他们……还没准备好。补给线，太长。兵力，散在三座城。只要……在他们汇合之前，打掉一路——"
 REU_LUD_2814: "然后呢。"
 REU_LUD_2815: "然后？"
 REU_LUD_2816: "他喉咙里发出一声很低的、像砂纸刮过铁皮的笑。"
 REU_LUD_2817: "他们退。退到……圣骏堡。缩进城墙。我们围城。打援。用不了……半年——"
 REU_LUD_2818: "然后我们的士兵吃什么。"
 REU_LUD_2819: "声音从桌子中段传来。不大，但整个房间都安静了。柳德米拉坐在那里，没穿工装，换了一身深色的情报局制服。领口的扣子扣到最上面一颗，手里什么也没拿。面前摊着一份文件，已经翻到最后一页。"
 REU_LUD_2820: "柳德米拉。"
 REU_LUD_2821: "博卓卡斯替同志。"
 REU_LUD_2822: "你……在整合运动的时候，打的是游击。现在，管情报。"
 REU_LUD_2823: "他停顿了一下，喉咙里那股砂纸声更重了。"
 REU_LUD_2824: "打仗的事……你不懂。"
 REU_LUD_2825: "对。打仗的事我不懂。所以我没跟您争该怎么打。"
 REU_LUD_2826: "她用手指敲了敲面前的文件。"
 REU_LUD_2827: "我说的是另一件事。粮食。"
 REU_LUD_2828: "后勤部……会解决。"
 REU_LUD_2829: "后勤部拿什么解决。"
 REU_LUD_2830: "她翻开文件，推到桌子中间。"
 REU_LUD_2831: "这是情报局上个月的调查报告。南部产粮区，今年的秋收比去年少了四成。原因不是天灾——是帝国军撤退的时候烧了粮仓，烧了田，把能抢的牲口全抢走了。"
 REU_LUD_2832: "西伯利亚铁路沿线的三座城市，面粉库存只够撑两个月。如果我们现在把全部资源投入军事，两个月后，前线的士兵吃什么？后方的工人吃什么？城里的孩子吃什么？"
 REU_LUD_2833: "柳德米拉。"
 REU_LUD_2834: "塔露拉同志。"
 REU_LUD_2835: "你说的这些，我知道。"
 REU_LUD_2836: "塔露拉站起来。她双手撑在桌面上，身体前倾，眼睛盯着柳德米拉。"
 REU_LUD_2837: "你以为只有你一个人看到那份报告？你以为只有你一个人在算这笔账？我比任何人都清楚。但是——"
 REU_LUD_2838: "但是什么。"
 REU_LUD_2839: "但是如果我们输了这场决战，我们连算这笔账的资格都没有。"
 REU_LUD_2840: "她的声音提高了一些。"
 REU_LUD_2841: "帝国不会给我们时间。他们已经放话了——「叛乱者一个不留」。柳德米拉，你比我更清楚这句话的意思。我们在切尔诺伯格见过。在整合运动的时候我们就见过。那些被「一个不留」的人，里面有你的父亲。"
 REU_LUD_2842: "柳德米拉的手指在文件上停住了。"
 REU_LUD_2843: "如果我们不集中力量打掉他们，他们就会打掉我们。然后你的粮食，我的粮食，博卓卡斯替的粮食——所有人的粮食，都喂狗。"
 REU_LUD_2844: "她坐回去。"
 REU_LUD_2845: "所以，说说你的方案。你说要给穷人留资源。那你说，怎么留。从哪里省。"
 REU_LUD_2846: "从弹药里省。"
 REU_LUD_2847: "……什么？"
 REU_LUD_2848: "我们囤了太多重炮弹。西部集群的仓库里，152 毫米炮弹的库存是标准基数的三倍。而我们的重炮数量根本用不了这么多。"
 REU_LUD_2849: "那是为决战准备的储备——"
 REU_LUD_2850: "储存弹药需要钱。需要仓库。需要守卫。需要运输。这些钱从哪里来？从粮食预算里来的。"
 REU_LUD_2851: "她把文件翻到另一页。"
 REU_LUD_2852: "如果削减三分之一的重炮弹储备，换成粮食储备，我们可以多养活十五万人。三个月。"
 REU_LUD_2853: "十五万……人。"
 REU_LUD_2854: "对。十五万。相当于两个满编师。不拿枪的师。"
 REU_LUD_2855: "博卓卡斯替沉默了一会儿。铅笔在他手里转了半圈。喉咙里那声粗重的呼吸，像风箱漏了气。"
 REU_LUD_2856: "如果……决战，需要这些炮弹呢。"
 REU_LUD_2857: "如果决战需要，我们可以造。但我们不能凭空造出粮食。工厂可以三班倒，田地不能。"
 REU_LUD_2858: "粮食可以进口。"
 REU_LUD_2859: "从哪进？卡西米尔？莱塔尼亚？他们和帝国穿一条裤子。叙拉古？"
 REU_LUD_2860: "她停顿了一下。"
 REU_LUD_2861: "叙拉古的卡车互助会答应帮忙运一批。但数量有限，而且必须用黄金结算。"
 REU_LUD_2862: "……我们已经没有多少黄金了。"
 REU_LUD_2863: "对。所以我们才要省。"
 REU_LUD_2864: "她合上文件。"
 REU_LUD_2865: "我说完了。"
 REU_LUD_2866: "会议室里安静了很久。塔露拉靠在椅背上，手指交叠。博卓卡斯替还在转铅笔。参谋长低头翻自己的笔记。"
 REU_LUD_2867: "博卓卡斯替。"
 REU_LUD_2868: "嗯。"
 REU_LUD_2869: "你怎么看。"
 REU_LUD_2870: "……"
 REU_LUD_2871: "温迪戈把铅笔放下。他的手指很长，指节粗大，指甲边缘有旧伤。他说话之前，喉咙里先响了一声——像石头滚过干河床。"
 REU_LUD_2872: "柳德米拉。你……跟着我，打过北原。"
 REU_LUD_2873: "是。"
 REU_LUD_2874: "那时候。黑面包。冻土豆。"
 REU_LUD_2875: "他停了一下，吞咽的动作很明显，喉结上下滚动。"
 REU_LUD_2876: "你说过……「士兵吃不饱，打不了仗」。"
 REU_LUD_2877: "我说过。"
 REU_LUD_2878: "现在……我说。士兵没有炮弹……"
 REU_LUD_2879: "他攥了一下拳头。"
 REU_LUD_2880: "也打不了仗。"
 REU_LUD_2881: "炮弹可以少打两发。人不能少吃两顿。"
 REU_LUD_2882: "……"
 REU_LUD_2883: "他看了她很久。然后他站起来，拿起桌上的军帽。他的动作很慢，像每一节骨头都在疼。"
 REU_LUD_2884: "塔露拉。今天的会……我退出。"
 REU_LUD_2885: "博卓卡斯替——"
 REU_LUD_2886: "我……尊重柳德米拉。她是个好情报局长。"
 REU_LUD_2887: "他把军帽戴上。帽檐压得很低。"
 REU_LUD_2888: "但打仗的事。我……不让步。"
 REU_LUD_2889: "他走向门口。走到柳德米拉身边的时候，他停了一下。他的呼吸很重，胸腔起伏很大。开口之前，喉咙里又响了那声砂纸。"
 REU_LUD_2890: "柳德米拉。"
 REU_LUD_2891: "博卓卡斯替同志。"
 REU_LUD_2892: "你说得对。粮食……很重要。"
 REU_LUD_2893: "他低头看着她。温迪戈的角在灯光下投出一道很长的影子。"
 REU_LUD_2894: "但这场仗……输了。"
 REU_LUD_2895: "他顿了很久。久到你以为他不会再说了。"
 REU_LUD_2896: "我们连……种粮食的地……都没有。"
 REU_LUD_2897: "他推门出去。门在他身后关上，发出很重的一声响。"
 REU_LUD_2898: "会议室里剩下几个人。塔露拉看着桌上的地图，没说话。参谋长在收拾文件。柳德米拉坐在原位，眼睛盯着面前那份已经被她合上的报告。"
 REU_LUD_2899: "索科洛夫。"
 REU_LUD_2900: "在。"
 REU_LUD_2901: "你先出去。我跟柳德米拉谈谈。"
 REU_LUD_2902: "你看了一眼柳德米拉。她没有看你，只是点了一下头。你走出会议室，门在身后关上。"
 REU_LUD_2903: "走廊很长，铺着磨得发亮的大理石。你靠着墙站了一会儿。窗户外面，远处的城市在暮色里沉下去，路灯一盏一盏亮起来。你听见会议室里传来模糊的说话声，听不清内容。"
 REU_LUD_2904: "大约十分钟后，门开了。柳德米拉走出来。她的表情和进去的时候没什么变化，但手在袖口里攥着。"
 REU_LUD_2905: "……谈完了？"
 REU_LUD_2906: "谈完了。"
 REU_LUD_2907: "结果？"
 REU_LUD_2908: "塔露拉同意把重炮弹储备从三倍基数降到两倍。省出来的预算，一半给粮食，一半给军备。"
 REU_LUD_2909: "一半给军备？"
 REU_LUD_2910: "政治是妥协。她让步了。我也要让步。"
 REU_LUD_2911: "她走在前面，军靴踩在大理石上，发出清脆的声响。你跟在后面。走廊里很安静，只有脚步声。"
 REU_LUD_2912: "索科洛夫。"
 REU_LUD_2913: "在。"
 REU_LUD_2914: "你去帮我做件事。"
 REU_LUD_2915: "什么事？"
 REU_LUD_2916: "情报局三处有个旧仓库。里面堆着从前线撤回来的物资，一直没清点。你带人去看看，有没有粮食。哪怕只是面粉、土豆、罐头——全部分出来，登记造册，送到工人夜校去。"
 REU_LUD_2917: "夜校？"
 REU_LUD_2918: "夜校的学员都是最穷的。矿工、洗衣妇、码头搬运工。他们每天只能吃一顿。我知道。"
 REU_LUD_2919: "……您怎么知道？"
 REU_LUD_2920: "因为他们是我的学生。"
 REU_LUD_2921: "她停住了。站在走廊尽头的大窗前。窗外，城市的灯一盏一盏亮着，像撒在地上的碎星星。"
 REU_LUD_2922: "我教他们科学。教他们怎么算气压，怎么认谎言。但我教不了他们怎么在粮食配给里多活一个月。"
 REU_LUD_2923: "她转过身，看着你。"
 REU_LUD_2924: "所以，去找。仓库里应该有。后勤部那群人懒得清点，好东西都压在底下。"
 REU_LUD_2925: "是。"
 REU_LUD_2926: "她继续往前走。"
 REU_LUD_2927: "还有。"
 REU_LUD_2928: "嗯？"
 REU_LUD_2929: "明天早上，去一趟面包房。拿十个白面包。"
 REU_LUD_2930: "白面包？"
 REU_LUD_2931: "夜校那个洗衣妇。她女儿病了。医生说需要营养。"
 REU_LUD_2932: "白面包在配给里是给伤员和孕妇的。"
 REU_LUD_2933: "对。所以需要「情报局」出面。"
 REU_LUD_2934: "她回头看了你一眼。"
 REU_LUD_2935: "有问题吗。"
 REU_LUD_2936: "没有。"
 REU_LUD_2937: "好。"
 REU_LUD_2938: "她走出苏维埃宫的大门。外面的风很冷，带着远处前线传来的、隐隐约约的炮声。她站在台阶上，深吸了一口气。呼吸在冷空气里凝成白雾。"
 REU_LUD_2939: "索科洛夫。"
 REU_LUD_2940: "在。"
 REU_LUD_2941: "你觉得——这场仗，我们能赢吗。"
 REU_LUD_2942: "你看着她。她没看你，只是看着远处被炮火映红的天际线。"
 REU_LUD_2943: "……您问的是真心话？"
 REU_LUD_2944: "我问的是你的判断。"
 REU_LUD_2945: "你沉默了一会儿。"
 REU_LUD_2946: "如果只看军事，我不知道。但如果看别的——看夜校的灯还亮着，看工人们还在来上课，看您还在教他们认字——"
 REU_LUD_2947: "够了。"
 REU_LUD_2948: "她抬手，打断你。"
 REU_LUD_2949: "我不是要你安慰我。"
 REU_LUD_2950: "我没安慰您。我说的是实话。"
 REU_LUD_2951: "她看了你两秒。灰色的眼睛在路灯下很亮。"
 REU_LUD_2952: "……走吧。"
 REU_LUD_2953: "她走下台阶。军靴踩在石板路上，一步一步，很稳。你跟在后面。"
 REU_LUD_2954: "明天早上，面包房。别忘了。"
 REU_LUD_2955: "不会忘。"
 REU_LUD_2956: "还有。"
 REU_LUD_2957: "她没回头。"
 REU_LUD_2958: "今天在会上，你一直没说话。"
 REU_LUD_2959: "我不该说话。"
 REU_LUD_2960: "为什么。"
 REU_LUD_2961: "因为您说的已经够了。我再说，只会让博卓卡斯替觉得我们情报局在逼他。"
 REU_LUD_2962: "她停了一步。"
 REU_LUD_2963: "……你学聪明了。"
 REU_LUD_2964: "跟您学的。"
 REU_LUD_2965: "哼。"
 REU_LUD_2966: "她继续走。风把她的短发吹起来。你跟在后面，听见远处又传来一声炮响——很闷，很远，像大地在喘气。"
 REU_LUD_2967: "快走。今晚还要把报告写完。"
 REU_LUD_2968: "是。"
 REU_LUD_2969: "她走在前面，你跟在后面。路灯把两个人的影子拉得很长，投在石板路上，一前一后，像两把并排的刀。"

# ============ 回忆录：暴君不只在外面！（1102 年，通过决议触发） ============
 REU_LUD_3100: "凌晨三点。苏维埃宫的走廊里已经没人了。路灯把空荡荡的过道照得惨白，脚步声在里面回荡，一下一下，像锤子砸在铁板上。"
 REU_LUD_3101: "柳德米拉坐在办公桌后面，面前摊着一份名单。名单很长，用打字机敲出来的，每一个名字后面都盖着红色的「已处理」印章。她没看名单。她的眼睛盯着桌角的一盏台灯，光把她的影子投在墙上，大而扭曲。"
 REU_LUD_3102: "你推门进来的时候，她没抬头。"
 REU_LUD_3103: "……关门。"
 REU_LUD_3104: "你关上门。锁舌咔哒一声落进槽里。"
 REU_LUD_3105: "名单看了吗。"
 REU_LUD_3106: "看了。"
 REU_LUD_3107: "多少。"
 REU_LUD_3108: "三百一十七。"
 REU_LUD_3109: "嗯。"
 REU_LUD_3110: "她伸手把名单合上，推向桌角。"
 REU_LUD_3111: "三百一十七个。其中有两百零三个是基层军官。四十九个是后勤处的。剩下的——文职、教员、两个报务员、一个厨子。"
 REU_LUD_3112: "厨子？"
 REU_LUD_3113: "他给博卓卡斯替送过病号饭。塔露拉的人觉得他可能在饭里夹带消息。"
 REU_LUD_3114: "……夹带什么消息？"
 REU_LUD_3115: "不知道。他们没问。"
 REU_LUD_3116: "她终于抬起头。灯光下她的脸很白，白得几乎透明，上呼吸道的结晶纹路从下巴一直延伸到喉部，像霜爬满了窗户。她的眼睛是干的。"
 REU_LUD_3117: "索科洛夫。你知道博卓卡斯替现在在哪吗。"
 REU_LUD_3118: "军医院。源石病恶化，上个月住的院。"
 REU_LUD_3119: "对。上个月。"
 REU_LUD_3120: "她从抽屉里摸出一样东西，放在桌上。是一张折叠的纸条，纸边发黄，沾着药渍。"
 REU_LUD_3121: "这是他三天前托人送出来的。"
 REU_LUD_3122: "……您看了？"
 REU_LUD_3123: "看了。"
 REU_LUD_3124: "她把纸条推给你。你展开。上面的字歪歪扭扭，像是用左手写的——他的右手已经不太能动了。墨迹很淡，有几处断了，但还能读。"
 REU_LUD_3125: "柳德米拉。他们……不让我见人。病房外面，有哨兵。不是军医院的。是塔露拉的。我问护士。护士不说话。你……小心。暴君……不只在外面。"
 REU_LUD_3126: "你把纸条放下。"
 REU_LUD_3127: "暴君不只在外面。"
 REU_LUD_3128: "对。"
 REU_LUD_3129: "她站起来。走到窗边。窗帘拉着，但她掀开一条缝，往楼下看了一眼。苏维埃宫门前的广场上，停着三辆黑色的囚车。车厢门关着，里面没有灯。"
 REU_LUD_3130: "三百一十七个人。他们没有审判。没有罪名。甚至没有正式的逮捕令。就是一张名单，上面盖了塔露拉的私章。"
 REU_LUD_3131: "博卓卡斯替同志知道吗。"
 REU_LUD_3132: "他知道。他知道又能怎么样。他现在连床都下不了。"
 REU_LUD_3133: "她放下窗帘。转过身。"
 REU_LUD_3134: "索科洛夫。我问你一个问题。"
 REU_LUD_3135: "您问。"
 REU_LUD_3136: "暴君是什么。"
 REU_LUD_3137: "她看着你。灰色的眼睛在台灯下很亮，像结了冰的湖。"
 REU_LUD_3138: "……您说过。蔑视玩弄权谋、人心和国家秩序的君王。"
 REU_LUD_3139: "对。我说过。那是五年前。在夜校的黑板上写的。"
 REU_LUD_3140: "她走回桌前。手指在名单上敲了一下。"
 REU_LUD_3141: "那么告诉我。现在坐在这张桌子对面的人——我，柳德米拉·伊里尼奇娜，情报局局长——和五年前那个在黑板上写字的柳德米拉，是不是同一个人。"
 REU_LUD_3142: "……"
 REU_LUD_3143: "回答我。"
 REU_LUD_3144: "是。也不是。"
 REU_LUD_3145: "什么叫「是也不是」。"
 REU_LUD_3146: "您还是您。但您坐的位置变了。"
 REU_LUD_3147: "她愣了一下。然后她笑了。不是高兴的笑。是那种喉咙里挤出来的、像砂纸刮过铁皮的笑。"
 REU_LUD_3148: "坐的位置变了。"
 REU_LUD_3149: "她坐回椅子里，靠在椅背上，闭上眼睛。"
 REU_LUD_3150: "你知道这份名单是怎么来的吗。"
 REU_LUD_3151: "塔露拉。"
 REU_LUD_3152: "不。名单是我写的。"
 REU_LUD_3153: "她睁开眼。"
 REU_LUD_3154: "塔露拉给了我一份「可疑分子」的初始名单，一百多个人。她说，柳德米拉，你是情报局长，你来查。你查出来的，我们处理。你没查出来的，我相信你。"
 REU_LUD_3155: "我查了。我熬了六个通宵，一个一个名字核对。我找到证据，证明其中一部分人确实对塔露拉有怨言——他们写信，私下聚会，发牢骚。但没有人通敌。没有人叛变。没有人拿帝国一分钱。"
 REU_LUD_3156: "我把这些写进报告。我说，塔露拉同志，这些人最多是「思想不坚定」，不是敌人。建议批评教育，不要清洗。"
 REU_LUD_3157: "她从桌上拿起一份文件，翻到最后一页，竖起来给你看。上面有塔露拉的批注，红笔，只有两个字。"
 REU_LUD_3158: "「重查。」"
 REU_LUD_3159: "她把文件放下。"
 REU_LUD_3160: "重查。我重查了。第二遍，我查出了更多「证据」。第三遍，名单上多了两百个名字。第四遍——就是现在这份。三百一十七个。每一个都有「确凿证据」。"
 REU_LUD_3161: "你猜那些证据是怎么来的。"
 REU_LUD_3162: "……您写的？"
 REU_LUD_3163: "我签的字。审的报告。盖的章。"
 REU_LUD_3164: "她站起来。走到墙边，那里挂着一幅乌萨斯全国地图。地图上插着各色小旗——红色的代表苏维埃控制区，黑色的代表帝国控制区，灰色的代表交战区。她站在地图前，背对着你。"
 REU_LUD_3165: "我父亲是科学家。他教我用数据说话。他教我——柳达，你要学会自己判断。因为没有人会替你判断。"
 REU_LUD_3166: "我判断了。我用数据、用证据、用逻辑，判断出三百一十七个人是「威胁」。我签了字。我盖了章。我让那些人上了囚车。我让棺材堆满了监狱。"
 REU_LUD_3167: "她转过身。"
 REU_LUD_3168: "暴君不只在外面。"
 REU_LUD_3169: "暴君就在这里。"
 REU_LUD_3170: "她用手拍了拍自己的胸口。"
 REU_LUD_3171: "就在这儿。穿着情报局长的制服。盖着苏维埃的章。用着科学家的逻辑。"
 REU_LUD_3172: "……您是被迫的。"
 REU_LUD_3173: "被迫？"
 REU_LUD_3174: "她走回桌前，双手撑在桌面上，身体前倾，盯着你。"
 REU_LUD_3175: "你以为被迫的意思是——有人拿枪指着我的头？说「签字，不然开枪」？"
 REU_LUD_3176: "不是。"
 REU_LUD_3177: "被迫的意思是——我知道签字是错的，但我还是签了。因为不签，下一个进监狱的就是我。因为不签，我就没法保护你，没法保护夜校，没法保护那些还没上名单的人。"
 REU_LUD_3178: "这叫「两害相权取其轻」。这是我爸爸教我的。科学家的逻辑。"
 REU_LUD_3179: "她坐回椅子里。声音低下来。"
 REU_LUD_3180: "但两害相权，选出来的还是害。"
 REU_LUD_3181: "……那博卓卡斯替同志的字条——"
 REU_LUD_3182: "他看出来了。"
 REU_LUD_3183: "她看着你。"
 REU_LUD_3184: "他看出来了，但他现在什么都做不了。所以他把字条送给我。他在提醒我。"
 REU_LUD_3185: "提醒您什么？"
 REU_LUD_3186: "提醒我……我还是柳德米拉。"
 REU_LUD_3187: "她伸手从抽屉里摸出一样东西。很小，用手帕包着。她打开手帕，里面是那根素银簪子——圣骏堡宴会上你捡到的那根。"
 REU_LUD_3188: "这簪子，是你还给我的吧。"
 REU_LUD_3189: "是。"
 REU_LUD_3190: "那天你放在我桌上。我没问，你没说。"
 REU_LUD_3191: "她把簪子重新包好，放回抽屉。"
 REU_LUD_3192: "索科洛夫。我跟你说一件事。这件事我没跟任何人说过。"
 REU_LUD_3193: "您说。"
 REU_LUD_3194: "上个月，塔露拉找我谈话。她说，柳德米拉，你知道博卓卡斯替为什么反对我吗。"
 REU_LUD_3195: "我说，因为他不认同您的军事路线。"
 REU_LUD_3196: "她说，不。因为他怕我。他怕我变成下一个暴君。但他自己——他当年在北原打仗的时候，屠过三个村子。他说那是「必要的牺牲」。"
 REU_LUD_3197: "她说，你看，博卓卡斯替的「必要牺牲」和我的「清洗」，有什么区别？都是杀人。都是革命需要的杀人。区别只在于——他反对我，因为他想坐我的位置。"
 REU_LUD_3198: "她停顿了一下。"
 REU_LUD_3199: "我当时没说话。"
 REU_LUD_3200: "……您信吗？"
 REU_LUD_3201: "信什么。信博卓卡斯替屠过村？信塔露拉说的「他想坐她的位置」？"
 REU_LUD_3202: "她摇了摇头。"
 REU_LUD_3203: "我不信塔露拉的话。但我信一件事——博卓卡斯替确实怕她。他怕的不是她的位置。他怕的是她变成暴君之后，没人能拦得住。"
 REU_LUD_3204: "而现在他躺在病床上，拦不住了。"
 REU_LUD_3205: "她站起来，走到衣架前，取下那件灰色工装。"
 REU_LUD_3206: "您要出去？"
 REU_LUD_3207: "去军医院。"
 REU_LUD_3208: "现在？凌晨三点？"
 REU_LUD_3209: "现在。塔露拉的哨兵在病房外面。但情报局有情报局的办法。"
 REU_LUD_3210: "她穿上工装，把扣子扣好。然后她打开抽屉，取出那把她从不离身的短刀，别在腰后。"
 REU_LUD_3211: "索科洛夫。"
 REU_LUD_3212: "在。"
 REU_LUD_3213: "你跟我去。"
 REU_LUD_3214: "是。"
 REU_LUD_3215: "她走到门口，手放在门把上，停了一下。"
 REU_LUD_3216: "还有。"
 REU_LUD_3217: "嗯？"
 REU_LUD_3218: "如果——我是说如果——有一天，你发现我变成了塔露拉那样的人。"
 REU_LUD_3219: "她没回头。"
 REU_LUD_3220: "你记得提醒我。"
 REU_LUD_3221: "怎么提醒？"
 REU_LUD_3222: "用你记性好的那个脑子。记着1096年的麦田，记着1098年的夜校，记着今天这张名单。"
 REU_LUD_3223: "然后告诉我——柳德米拉，暴君不只在外面。"
 REU_LUD_3224: "她推开门。走廊里空荡荡的，路灯惨白。她走在前面，脚步很轻，像很多年前在列夫·托尔斯泰号的下层区穿行时那样。"
 REU_LUD_3225: "你跟在后面。远处，监狱的方向，传来一声很闷的响动。像是有人在关门。很大的门。很厚的门。"

# ============ 回忆录：密信与政变（1102 年冬，通过决议触发） ============
 REU_LUD_3400: "这间屋子在地图上不存在。它在苏维埃宫地下二层，原本是旧帝国参议院的档案库，后来被情报局改成了审讯室，再后来被柳德米拉封了，只在最要紧的时候用。屋里只有一张桌，两把椅，一盏吊灯。墙上没有窗，空气里有一股旧纸和铁锈混在一起的味道。"
 REU_LUD_3401: "柳德米拉坐在桌子对面，面前摊着三样东西：一份名单，一张圣骏堡的城防图，还有博卓卡斯替那张字条。她把字条放在最上面，像是某种镇纸。"
 REU_LUD_3402: "索科洛夫。门锁了？"
 REU_LUD_3403: "锁了。外面两道岗，都是跟了您三年以上的人。"
 REU_LUD_3404: "三年以上。"
 REU_LUD_3405: "她重复了一遍，语气没什么波动，但手指在名单边缘敲了一下。"
 REU_LUD_3406: "三年以上的，也未必靠得住。上个月被枪毙的那个报务员，跟了我四年。"
 REU_LUD_3407: "……他不是因为背叛您。"
 REU_LUD_3408: "我知道。他是因为给博卓卡斯替传了话。但这说明一件事——在塔露拉眼里，跟了我四年的人，也可以因为一句话就消失。"
 REU_LUD_3409: "她把名单翻到最后一页。上面有她自己的批注，用铅笔写的，很密，字迹比平时潦草。"
 REU_LUD_3410: "名单上三百一十七个人，现在还活着的，不到八十。其余的，要么已经枪毙，要么在监狱里等着。"
 REU_LUD_3411: "这八十个人里面，有十一个是我情报局的人。他们没上名单，不是因为他们清白，是因为我把他们的名字从名单上划掉了。"
 REU_LUD_3412: "您划掉的？"
 REU_LUD_3413: "对。我伪造了三份报告，改了五次证人证词，还烧了一个档案袋。塔露拉没发现。她太忙了——忙着看地图，忙着调兵，忙着跟博卓卡斯替斗。"
 REU_LUD_3414: "她从怀里摸出一样东西。不是文件。是一支钢笔。银灰色，笔帽上刻着一行很小的字，你凑近才看清：「柳达，生日快乐。爸爸。」"
 REU_LUD_3415: "我爸爸给我的。十六岁生日。他那时候还在研究所，每天回家很晚，但从来不忘我的生日。"
 REU_LUD_3416: "……您一直带着？"
 REU_LUD_3417: "一直带着。从叙拉古到整合运动，从整合运动到这儿。中间丢过三次，每次都找回来了。"
 REU_LUD_3418: "她把钢笔放在桌上，笔尖对着博卓卡斯替的字条。"
 REU_LUD_3419: "索科洛夫。你知道我为什么给你看这个吗。"
 REU_LUD_3420: "……不知道。"
 REU_LUD_3421: "因为我要做一件事。这件事做完之后，我可能就不再是柳德米拉了。也可能是。"
 REU_LUD_3422: "她站起来。走到墙边。墙上挂着一幅手绘的苏维埃宫结构图，是她自己画的，标注了每层楼的岗哨位置和换班时间。她用手指沿着一条线划过去，从地下二层一直划到顶层。"
 REU_LUD_3423: "苏维埃宫。顶层。塔露拉的办公室和住所。她每天凌晨两点睡，早上六点起。睡前会喝一杯热牛奶，牛奶由她的专属勤务兵从厨房端上去。勤务兵叫米沙，十九岁，切尔诺伯格人。他父亲死在浩劫里，塔露拉亲自把他招进来的。他信她。"
 REU_LUD_3424: "您要动米沙？"
 REU_LUD_3425: "不。我要用米沙。"
 REU_LUD_3426: "她转过身。"
 REU_LUD_3427: "米沙每晚会把牛奶从厨房端到电梯口。电梯上到顶层，需要刷塔露拉的专属门禁卡。但电梯操作员——那个操作员叫安娜，四十岁，丈夫是西部集群的炮兵军官。她丈夫三个月前被清洗了。"
 REU_LUD_3428: "安娜恨塔露拉。她只是不敢说。我找过她。她愿意帮我们。"
 REU_LUD_3429: "……帮我们什么？"
 REU_LUD_3430: "在牛奶里放东西。不是毒药。是一种镇静剂。情报局三处研发的，无色无味，溶于热牛奶。喝下去之后半小时起效，人会昏睡四到六个小时。醒来之后头晕、口干，但不会有后遗症。"
 REU_LUD_3431: "她走回桌前。"
 REU_LUD_3432: "米沙把牛奶端上去。塔露拉喝了。睡着了。安娜在电梯口等着，确认牛奶空了之后，给我信号。然后——"
 REU_LUD_3433: "我带人上去。把她控制住。不伤她。不杀她。只是让她——暂时不能发号施令。"
 REU_LUD_3434: "软禁。"
 REU_LUD_3435: "对。软禁。"
 REU_LUD_3436: "她坐回椅子里。看着你。"
 REU_LUD_3437: "我说完了。现在你说。"
 REU_LUD_3440: "确定？"
 REU_LUD_3441: "她笑了一下。那种砂纸刮过铁皮的笑。"
 REU_LUD_3442: "索科洛夫，你以为我在做什么。开夜校？发白面包？"
 REU_LUD_3443: "我在救这个政权。救那些还没上名单的人。救博卓卡斯替。救我自己。"
 REU_LUD_3444: "如果这叫政变，那这就是政变。"
 REU_LUD_3446: "他不知道。"
 REU_LUD_3447: "她看着博卓卡斯替的字条。"
 REU_LUD_3448: "他躺在病床上，连床都下不了。我把计划告诉他，他会怎么样？他会让我别做。他会说「柳德米拉，再等等，等我好起来」。"
 REU_LUD_3449: "但我等不了了。他好不起来。他的源石病已经到了晚期。医生说他最多还有半年。"
 REU_LUD_3451: "她看了你两秒。"
 REU_LUD_3452: "好。"
 REU_LUD_3453: "你跟我这么多年，这是我最需要你的一次。"
 REU_LUD_3454: "记住——不杀人。一个人都不杀。"
 REU_LUD_3460: "她从抽屉里取出两样东西。一把钥匙，一个小布袋。"
 REU_LUD_3461: "这把钥匙是顶层备用电梯的。旧帝国时期修的，塔露拉不知道。从地下二层可以直达顶层走廊尽头，出口在清洁间后面。"
 REU_LUD_3462: "这个布袋里是镇静剂。交给安娜。告诉她，牛奶倒进杯子之后，把药粉撒进去，搅三圈。不能多，不能少。"
 REU_LUD_3463: "您不亲自去？"
 REU_LUD_3464: "我去。但不是从电梯。我从前楼梯上去。塔露拉在顶层有三个哨兵，两个在走廊，一个在楼梯口。楼梯口那个哨兵，是我的人。"
 REU_LUD_3465: "她把钥匙和布袋推到你面前。"
 REU_LUD_3466: "你走电梯。我到楼梯口之后，会先解决楼梯口的哨兵——把他支开，让他去楼下「取文件」。然后你从清洁间出来，和我汇合。我们一起进塔露拉的办公室。"
 REU_LUD_3467: "如果她没喝牛奶呢？"
 REU_LUD_3468: "她会喝。她每天晚上都喝。这个习惯她从整合运动时期就有。那时候我们还在切尔诺伯格，她每天晚上都要喝一杯热牛奶才能睡着。"
 REU_LUD_3469: "她的声音在说到「切尔诺伯格」的时候，略微停顿了一下。"
 REU_LUD_3470: "那时候，牛奶是奢侈品。她把自己的配给省下来，分给伤员。我亲眼见过她把一杯牛奶端到一个断了腿的矿工面前，说「喝了它，你能活」。"
 REU_LUD_3471: "……"
 REU_LUD_3472: "那是同一个人。同一双手。端牛奶的手，和签清洗令的手。"
 REU_LUD_3473: "所以我不杀她。"
 REU_LUD_3474: "她把那支银灰色钢笔拿起来，别在工装内侧的口袋里，紧贴着心脏的位置。"
 REU_LUD_3475: "我要让她活着。让她看着——她做的事，她造成的这一切。"
 REU_LUD_3476: "然后呢？"
 REU_LUD_3477: "然后？"
 REU_LUD_3478: "她站起来。把工装的扣子一颗一颗扣好。然后把短刀别在腰后，刀鞘上的划痕在灯下反了一下光。"
 REU_LUD_3479: "然后让她在软禁室里喝热牛奶。每天晚上。直到博卓卡斯替好起来——或者不好起来。"
 REU_LUD_3480: "直到我们想清楚，这个政权到底该怎么走下去。"
 REU_LUD_3481: "她走到门口。手放在门把上，回头看了你一眼。"
 REU_LUD_3482: "索科洛夫。"
 REU_LUD_3483: "在。"
 REU_LUD_3484: "今晚之后，你和我就是政变者了。"
 REU_LUD_3485: "她的眼睛很亮。不是塔露拉那种烧红的铁一样的亮，是冰面下的水，冷，但深。"
 REU_LUD_3486: "你怕吗。"
 REU_LUD_3490: "不怕？"
 REU_LUD_3491: "她看了你两秒。"
 REU_LUD_3492: "你撒谎。"
 REU_LUD_3493: "不过没关系。我也怕。"
 REU_LUD_3495: "怕就对了。"
 REU_LUD_3496: "她转过身。"
 REU_LUD_3497: "不怕的人是疯子。怕，但还是去做——这才是人。"
 REU_LUD_3499: "她愣了一下。"
 REU_LUD_3500: "怕。"
 REU_LUD_3501: "我怕的要命。我怕我变成塔露拉。我怕博卓卡斯替醒不过来。我怕明天早上名单上多出你的名字。"
 REU_LUD_3502: "但怕完了，还是要做。"
 REU_LUD_3510: "她推开门。走廊里漆黑一片，只有远处楼梯口有一盏灯。她走在前面，脚步很轻，几乎没有声音。"
 REU_LUD_3511: "你跟在后面。布袋在口袋里，钥匙在你手心攥出了汗。远处，苏维埃宫顶层，塔露拉的办公室亮着灯。灯下有一杯热牛奶，正在慢慢变凉。"
 REU_LUD_3512: "电梯停了。门打开的时候没有声音。你从清洁间后面闪出来，柳德米拉已经在走廊拐角等你了。她的短刀已经出鞘，刀刃压在袖口内侧。"
 REU_LUD_3513: "楼梯口的哨兵支走了。走廊里两个，都在打瞌睡。米沙刚把牛奶端进去。安娜在电梯口，信号确认——杯子空了。"
 REU_LUD_3514: "药效呢？"
 REU_LUD_3515: "半小时前喝的。现在应该已经起效了。"
 REU_LUD_3516: "她贴着墙走，你跟在后面。走廊尽头，塔露拉的办公室门虚掩着，门缝里透出一线暖黄色的光。"
 REU_LUD_3517: "柳德米拉在门前停下。她深吸了一口气。你看见她握刀的手很稳，但她的肩膀在微微发抖。"
 REU_LUD_3518: "索科洛夫。"
 REU_LUD_3519: "在。"
 REU_LUD_3520: "进去之后，你站在她左侧。我站右侧。不管她说什么——不管她说什么——不要拔刀。"
 REU_LUD_3521: "她推开门。"
 REU_LUD_3522: "塔露拉靠在沙发椅上。她的头歪向一边，眼睛半睁半闭，呼吸很浅。面前的茶几上放着那只空了的牛奶杯。杯底还剩一点白色的痕迹。"
 REU_LUD_3523: "她听见门响，眼皮抬了一下。目光从柳德米拉脸上滑到你脸上，又滑回去。她的嘴唇动了动，声音含糊不清，像从很深的水底传上来。"
 REU_LUD_3524: "……柳德米拉？"
 REU_LUD_3525: "是我。"
 REU_LUD_3526: "你来……干什么……"
 REU_LUD_3527: "柳德米拉走到她右侧，停下。她没有拔刀，双手垂在身侧，站得笔直。"
 REU_LUD_3528: "塔露拉同志。我来告诉你一件事。"
 REU_LUD_3529: "……"
 REU_LUD_3530: "你被软禁了。"
 REU_LUD_3531: "塔露拉的眼睛猛地睁大。她挣扎着想坐起来，但四肢不听使唤，身体晃了一下，又倒回椅子里。"
 REU_LUD_3532: "你……你——"
 REU_LUD_3533: "我下了药。在你今晚的牛奶里。你现在四肢无力，但意识清醒。你能听见我说的每一句话。"
 REU_LUD_3534: "我不想杀你。不想伤你。我只想让你——停下来。听一听你听不见的声音。"
 REU_LUD_3535: "塔露拉靠在椅背上。她的呼吸很重，眼神从愤怒变成困惑，又从困惑变成某种很深的、很累的东西。"
 REU_LUD_3536: "……博卓卡斯替。"
 REU_LUD_3537: "他不知道。"
 REU_LUD_3538: "你……一个人……"
 REU_LUD_3539: "不是一个人。"
 REU_LUD_3540: "柳德米拉侧过脸，看了你一眼。然后她转回塔露拉。"
 REU_LUD_3541: "索科洛夫。跟我很多年了。你认识他。"
 REU_LUD_3542: "……索科洛夫。"
 REU_LUD_3543: "她的目光转过来，落在你脸上。涣散的，但还认得你。"
 REU_LUD_3544: "你……也……"
 REU_LUD_3545: "塔露拉同志。"
 REU_LUD_3546: "……同志。"
 REU_LUD_3547: "她喉咙里发出一声很低的、苦涩的笑。然后她的头慢慢垂下去，靠在沙发椅的靠背上。呼吸变得均匀，像是睡着了。但她的眼睛还睁着一条缝，看着柳德米拉。"
 REU_LUD_3548: "柳德米拉……你会……后悔的。"
 REU_LUD_3549: "也许。"
 REU_LUD_3550: "她走到塔露拉面前，蹲下来。这个动作很突然，你差点以为她要拔刀。但她只是伸出手，把滑到塔露拉腰间的毛毯拉上来，盖住她的肩膀。"
 REU_LUD_3551: "但现在，你先睡一会儿。"
 REU_LUD_3552: "她站起来。走到办公室的窗前，把窗帘拉开。外面，天边已经泛白。远处监狱的方向，晨雾里隐约还有灯光。"
 REU_LUD_3553: "索科洛夫。"
 REU_LUD_3554: "在。"
 REU_LUD_3555: "去把博卓卡斯替同志接过来。用情报局的车。不要走正门，走地下通道。"
 REU_LUD_3556: "是。"
 REU_LUD_3557: "她转过身。晨光照在她脸上，把那些源石结晶的纹路照得很清楚：。她的眼睛是干的。"
 REU_LUD_3558: "从今天起，苏维埃的军事指挥权，由博卓卡斯替同志代理。情报局负责内部安全。塔露拉同志——休养。"
 REU_LUD_3559: "……休养？"
 REU_LUD_3560: "对。休养。"
 REU_LUD_3561: "她走向门口。经过你身边的时候，停了一步。"
 REU_LUD_3562: "还有一件事。"
 REU_LUD_3563: "嗯？"
 REU_LUD_3564: "昨天夜里，监狱里有一批犯人被转移了。名单上最后八十个人。我签的字。"
 REU_LUD_3565: "转到哪？"
 REU_LUD_3566: "转到情报局三处的旧仓库。有吃有喝，有床有药。等局势稳了，一个一个重新审。"
 REU_LUD_3567: "她推开门。走廊里的灯亮了。她走出去，脚步很稳。"
 REU_LUD_3568: "暴君不只在外面。"
 REU_LUD_3569: "她的声音从走廊里传回来。"
 REU_LUD_3570: "但至少——今天晚上，这里的暴君，睡着了。"

 REU_LUD_C8_1: "「好看。非常适合您。」"
 REU_LUD_C8_2: "「……说实话，有点怪。」"
 REU_LUD_C8_3: "「您穿什么都是主任。」"
 REU_LUD_C9_1: "「您确定吗？这是政变。」"
 REU_LUD_C9_2: "「博卓卡斯替同志知道吗？」"
 REU_LUD_C9_3: "「我不问。您说怎么做，我就怎么做。」"
 REU_LUD_C10_1: "「不怕。」"
 REU_LUD_C10_2: "「怕。但我跟您走。」"
 REU_LUD_C10_3: "「……您怕吗？」"

 REU_LUD_C5_1: "「我上。你掩护。」"
 REU_LUD_C5_2: "「再等等。看他们往哪走。」"
 REU_LUD_C5_3: "「主任，您决定。」"
 REU_LUD_C6_1: "「主任，军警怎么办？」"
 REU_LUD_C6_2: "「先问清楚城市的情况。」"
 REU_LUD_C6_3: "「这孩子怎么办？」"
 REU_LUD_C7_1: "「主任，我们得做点什么。」"
 REU_LUD_C7_2: "「三四千人……我们只有十二个人。」"
 REU_LUD_C7_3: "「您在想什么？」"

 REU_LUD_C4_1: "「主任，等仗打完，这片田会有人收的。」"
 REU_LUD_C4_2: "「您想把这片麦子收了？」"
 REU_LUD_C4_3: "「您父亲……后来呢？」"

 REU_LUD_C2_1: "「命令就是命令。塔露拉同志亲自批的。」"
 REU_LUD_C2_2: "「我信密报。战时不能冒险。」"
 REU_LUD_C2_3: "「……我信他。但我没有选择。」"
 REU_LUD_C3_1: "「不。我听您的。」"
 REU_LUD_C3_2: "「塔露拉同志不会错。」"
 REU_LUD_C3_3: "「您累了。今天先休息吧。」"

