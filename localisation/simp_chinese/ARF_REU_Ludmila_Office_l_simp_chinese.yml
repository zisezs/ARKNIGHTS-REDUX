# ============ 决议：我和柳德米拉的回忆录（开局即解锁，年份到了才可点） ============
 REU_Ludmila_Memoir_Category: "我和柳德米拉的回忆录"
 REU_ludmila_memory_1095: "回忆录-1095年，雪夜谷仓与第一个贪污犯"
 REU_ludmila_memory_1095_desc: "1095 年冬天，乌萨斯边境，一座废弃的谷仓。\n那时候她还叫弑君者；索科洛夫也不是她的心腹，只是肃反大队里的一名部下。\n那一夜她问了他一个问题，他答了什么，她记了十几年。\n\n§G首次观看：柳德米拉的好感度 +2§!\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1095 年。§!"
 REU_ludmila_memory_1096: "回忆录-1096年，秋日麦穗与焦黑的大列巴"
 REU_ludmila_memory_1096_desc: "1096 年秋天，乌萨斯南部，一个刚打完仗的村子。\n那时她的职务是整合运动肃反科主任；索科洛夫仍是跟着她的一名部下。\n麦子熟得正好，却没人来收。她从面包房的灰烬里扒出半块烤焦的大列巴，就着夕阳啃完了。\n那天她提到了老师、父亲，还有她小时候的名字。\n\n§G首次观看：柳德米拉的好感度 +3§!（她让你知道了「柳达」）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1096 年。§!"
 REU_ludmila_memory_1097: "回忆录-1097年，阳光与尘埃下的移动城市"
 REU_ludmila_memory_1097_desc: "1097 年，乌萨斯，移动城市「列夫·托尔斯泰号」的下层区。\n城市停了，人在互相举报换粮票。她在巷子里救下一个叫尤里的学生，然后说了一句「我们不做英雄，我们做老鼠」。\n\n§G首次观看：柳德米拉的好感度 +4§!（她让你看到了「老鼠」的计划）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1097 年。§!"
 REU_ludmila_memory_1098: "回忆录-1098年，来，把夜校保护好！"
 REU_ludmila_memory_1098_desc: "1098 年，乌萨斯，苏维埃工人与感染者情报局办的工人夜校。\n仓库改的教室，锅底灰刷的黑板，三十四个学生。她穿着旧工装来讲气压和谎言，下课后说了一句「来，把夜校保护好」。\n\n§G首次观看：柳德米拉的好感度 +5§!（她让你守住了那盏灯）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1098 年。§!"
 REU_ludmila_memory_1099: "回忆录-1099年，奇妙的源石工业与奇妙的丝袜"
 REU_ludmila_memory_1099_desc: "1099 年，乌萨斯，情报局辖区的第一丝织品制造厂。\n蒸汽釜、垫圈、粉尘浓度——她把厂长问到说不出话；然后，在洗手间里，她穿着他们厂产的黑色丝袜，问了你一个不该由下属回答的问题。\n\n§G首次观看：柳德米拉的好感度 +5§!（她让你看到了「柳达」的另一种样子）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1099 年。§!"
 REU_ludmila_memory_1100: "回忆录-1100年，军阀与暴君的宴会潜入记"
 REU_ludmila_memory_1100_desc: "1100 年，乌萨斯帝国首都圣骏堡，沃尔孔斯基公爵的宴会厅。\n她叫安娜·米哈伊洛夫娜·沃尔孔斯卡娅，你叫德米特里·彼得罗维奇·沃尔孔斯基——她的丈夫。公文包的钥匙、少校的部署图、马车里的那根素银簪子。\n\n§G首次观看：柳德米拉的好感度 +6§!（她让你当了一晚上的「丈夫」）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1100 年。§!"
 REU_ludmila_memory_1101: "回忆录-1101年，白面包与黑火药"
 REU_ludmila_memory_1101_desc: "1101 年，乌萨斯最高苏维埃，苏维埃宫的最高军事委员会会议室。\n塔露拉、博卓卡斯替、参谋长——一张桌子上摊着十七个师、三个月的整编、四成的秋收。她不跟人争仗该怎么打，她只问一句：「然后我们的士兵吃什么。」\n\n§G首次观看：柳德米拉的好感度 +6§!（她让你看到了她为什么要在夜里教课）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1101 年。§!"
 REU_ludmila_memory_1102: "回忆录-1102年，暴君不只在外面！"
 REU_ludmila_memory_1102_desc: "1102 年，苏维埃宫，情报局局长办公室。\n凌晨三点，一份三百一十七个名字的名单，每一个后面都盖着红色的「已处理」。博卓卡斯替从病床上递出来的字条上只有一句话：暴君不只在外面。\n她说，名单是我写的。我签的字。审的报告。盖的章。\n\n§G首次观看：柳德米拉的好感度 +7§!（她让你记住了「暴君就在这里」）\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1102 年。§!"
 REU_ludmila_memory_1102_winter: "回忆录-1102年冬，密信与政变"
 REU_ludmila_memory_1102_winter_desc: "1102 年冬，苏维埃宫地下二层，情报局密室。\n一份名单，一张城防图，一支刻着「柳达，生日快乐」的钢笔——和一杯端上顶层的热牛奶。\n她说：暴君不只在外面。暴君就在这里。\n\n§G首次观看：柳德米拉的好感度 +8§!（她让你成了政变者）\n§R看完这一章，柳德米拉会成为国家领袖。§!\n§!随时可以重看，好感只在第一次结算。§!\n§Y需要 1102 年 12 月。§!"

