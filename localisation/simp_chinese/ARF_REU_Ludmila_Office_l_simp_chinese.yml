 REU_LUD_4624: "她走回黑板前，拿起粉笔。你的手指还贴着她。■■已经硬了，从包皮里探出一点头，滑腻腻的。你用指腹压着它，画了一个小圈。"
 REU_LUD_4625: "她的左手在黑板上写了一个字。歪了。她把那个字擦掉，重写了一遍。"
 REU_LUD_4626: "……还有问题吗。"
 REU_LUD_4627: "底下又有人举手。一个码头搬运工，问的是蒸汽机的事。她开始回答。声音很稳，语速和平时一样。但她的膝盖在微微打颤。两条腿并得很紧，脚后跟不自觉地踮了一下。"
 REU_LUD_4628: "你把手指往下移，滑到■■口。那里已经湿透了，分泌物黏在指尖上，拉着丝。你探进一个指节。"
 REU_LUD_4629: "她的■■很热，内壁紧而滑。她今天没有穿内裤——那层棉布根本就是工装裤的内衬。她平时不是不穿的人。今天没穿，是嫌麻烦，还是——她出门前就知道你会来。"
 REU_LUD_4630: "你的手指往里推。第二指节。她的骨盆不自觉地往前倾了一下，像是要把你吞得更深。然后她立刻意识到了，脚后跟重重踩回地面。"
 REU_LUD_4631: "——蒸汽机的效率，取决于气缸的密封性。密封不好，漏气，做功就少。"
 REU_LUD_4632: "她说完这句话，咽了一口唾沫。喉咙里的砂纸声更明显了。她的上呼吸道本来就有结晶，平时说话超过半小时就会哑。今晚她讲了快一个小时了。"
 REU_LUD_4633: "你把手指抽出来一点，又推回去。带出一小股透明的液体，顺着你的手腕往下淌。她的■■已经充血了，比刚才更饱满，颜色深了一些，像熟透的浆果。■■还露在外面，没缩回去。"
 REU_LUD_4634: "她的呼吸终于乱了。很轻微，只有胸腔起伏的节奏变了，快了一点点。底下没人看得出来——她本来就站得直，现在还是直的。"
 REU_LUD_4635: "好。时间到了。下课。"
 REU_LUD_4636: "她说完这两个字，牙齿咬了一下。很轻。然后她退到讲台后面，两只手撑在桌面上。指节泛白。"
 REU_LUD_4637: "学生们站起来，桌椅乱响。没有人注意到讲台后面那双手在抖。他们陆续往外走。老矿工经过讲台时停了一步。"
