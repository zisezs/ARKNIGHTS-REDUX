 REU_LUD_4051: "她重新握住根部，手指收紧了一些。"
 REU_LUD_4052: "叫柳达。"
 REU_LUD_4053: "她再次含入。这次她开始加速。头前后摆动，嘴唇紧裹着柱身，每次退到只剩■■在嘴里，再一口气吞到底。唾液被搅出黏腻的水声，在安静的谷仓里格外清晰。她的头发从耳后散下来，一缕黑发垂在脸侧，随着动作轻轻晃动。她没有用手去撩。"
 REU_LUD_4054: "她的另一只手撑在他大腿上，指甲掐进皮肉。指甲不长，但很硬，留下几个浅浅的月牙形印子。她的膝盖在干草上磨得发疼，但她没换姿势。军靴的鞋带彻底散了，靴筒松垮垮地堆在脚踝上。"
 REU_LUD_4055: "她嘴里的温度在升高。上颚那道增生组织反复蹭过■■冠状沟，粗糙的颗粒感像砂纸，却又带着血肉的柔软。她的舌头在柱身下侧来回扫动，有时卷住■■打转，有时贴着系带用力压过去。她吸得很紧，口腔内壁的软肉从四面八方裹上来，像一只手攥着。"
 REU_LUD_4056: "快感在堆积。他的呼吸变粗了，小腹绷紧。她感觉到了，因为嘴里的■■又胀大了一圈。她没退，反而吞得更深。喉咙口的软肉箍着■■，一收一缩。她的眼睛又抬起来看他，灰绿色的瞳孔里映着谷仓缝隙透进来的月光。"
 REU_LUD_4057: "他射了。"
 REU_LUD_4058: "第一股■■冲进她嘴里的时候，她皱了一下眉。量不少，浓稠，带着微咸和淡淡的苦涩。她没有吐出来，也没有咽。只是含着，让■■在嘴里和唾液混在一起。■■在她嘴里一下一下地跳，她把每一股都接住了，直到最后一滴渗出来，她才慢慢退开。"
 REU_LUD_4059: "她跪在干草上，嘴里含着满口的■■和唾液的混合物，腮帮子微微鼓起。她看着他，目光很平静。然后她偏过头，把嘴里的东西吐在旁边的干草上。白色的液体挂在草茎上，缓缓往下淌。她用手背抹了抹嘴角，又吐了一口唾沫。"
 REU_LUD_4060: "……真腥。"
 REU_LUD_4061: "她站起来，膝盖上沾着干草屑和灰。她弯腰把松了的鞋带重新系好，系得很紧，打了个死结。然后她拿起那剩下的大列巴，咬了一口，嚼着，面包的碎屑沾在嘴角。"
 REU_LUD_4062: "麦子的事，明天再说。"
 REU_LUD_4063: "她走出谷仓。月光从顶上的破洞漏进来，照在那摊被她吐在干草上的■■上，亮晶晶的。风从麦田方向吹过来，带着熟透的麦穗的甜味。"
 REU_LUD_4064: "她在谷仓门口停了一下，没回头。"
