 REU_LUD_4020: "她把面包从嘴边拿开，侧过脸来看他。火光照亮她半张脸，另外半张沉在阴影里。她的眼睛是灰绿色的，像结了霜的湖面。"
 REU_LUD_4021: "对。人救出来了。"
 REU_LUD_4022: "她把剩下的大列巴塞进嘴里，嚼完，咽下去，拍了拍手上的碎屑。然后她站起来，居高临下地看着他。"
