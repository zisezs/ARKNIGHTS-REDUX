 REU_ludmila_gift_chocolate_desc: "她办公桌上永远只有冷茶和半块巧克力。从配给渠道弄一包真正的好巧克力，放在她够得着的地方。\n\n§G柳德米拉的好感度 +6§!\n§!花费 25 政治力量，每月一次。§!"
 REU_ludmila_handle_paperwork_desc: "政治保卫局的文书堆到天花板。你把能签的分出来、能压的后压上，让她少走两个小时的弯路。\n\n§G柳德米拉的好感度 +4§!\n§G随后她会单独和你说一句话§!\n§!花费 40 政治力量，每月一次。§!"
 REU_ludmila_watch_snow_desc: "不汇报、不请示，只是站在窗帘旁边，看楼前那条被雪盖住的街。\n\n§G柳德米拉的好感度 +3§!\n§!花费 15 政治力量，每月一次。§!"
 REU_ludmila_gift_chocolate_ui: "送她一包巧克力\n§G好感度 +6§!"
 REU_ludmila_handle_paperwork_ui: "替她处理文件\n§G好感度 +4§!"
 REU_ludmila_watch_snow_ui: "陪她看一会儿雪\n§G好感度 +3§!"

