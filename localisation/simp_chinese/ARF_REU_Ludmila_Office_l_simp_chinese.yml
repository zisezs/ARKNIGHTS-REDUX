 REU_LUD_4996: "她推开门。外面车间的灯已经暗了，工人们都下了班。走廊里很静，只有远处传来蒸汽管道的低鸣。她走在前面，军靴踩在水泥地上，脚步声比平时重了一点。你跟在后面。她的后颈上有一小块红痕，是刚才撞在镜子上留下的。"
