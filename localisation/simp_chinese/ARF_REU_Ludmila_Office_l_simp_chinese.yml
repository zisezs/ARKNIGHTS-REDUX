 REU_LUD_4307: "没。进去看看。"
 REU_LUD_4308: "……啧。"
 REU_LUD_4309: "她贴着门缝往外看。三个军警正在往这边走，手里的手电在墙上扫。地下室的门是薄木板，藏不住两个人。"
 REU_LUD_4310: "怎么办？"
