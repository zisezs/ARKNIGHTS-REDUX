 #国家领袖\将领\内阁
 LUM_Wei_Zunwu: "魏遵武"
 LUM_Wei_Zunwu_desc: "魏遵武，龙门的领袖。"
 LUM_Liu_Baoguo: "刘保国"
 LUM_Liu_Baoguo_desc: "男性鲁珀，出生炎国某地。\n\n军人世家出生，16岁之时便在父母的安排下早早地加入到了都护府的军队中作为杂役和预备役和许多老兵一同进行军事训练，在利用“业余”时间完成学业后便全身心的投入到了军队这个大家庭。\n\n不仅名字上满是爱国热情，他更是让其父将“精忠报国，护民救世”八个大字写在了自己的双臂上，以表自己的决心。而当他得到了要去到龙门作为城防军督察和教头时，他也义不容辞的接下了这个任务。"
 LUM_Wei_Gaakhong: "魏格康"
 LUM_Wei_Gaakhong_desc: "男性斐迪亚，出生炎国某地。\n\n作为龙门官方工会机构事实上的掌控者，魏格康的强硬手段是众所周知的。同时也被委任应对外来势力对于龙门的渗透和颠覆破坏行动，可以说只要是在龙门进行的间谍活动，就不可能从魏格康的眼皮子底下绕开。\n\n通过自己盘根错节的情报网，魏格康甚至知晓了许多关于当年龙门事变和魏遵武私兵等一系列隐秘的政治关联事件。"
 LUM_Merlin_Swire: "梅林·诗怀雅"
 LUM_Merlin_Swire_desc: "男性菲林，龙门本地出生。\n\n诗怀雅家族法理上的现任继承人，自身野心勃勃，有着将龙门收入诗怀雅家族的想法。然而在如今龙门民间“军”、政、钱被三王垄断的状态下，他也只能悲叹只因权钱不足。\n\n不过他的野望固然不会因为当前的困局而放弃。只要出现机会，他就一定会抓住并不惜一切的达到自己想要的目标，纵使要因而跟自己的其他家族成员甚至龙门当局发生冲突。"
 LUM_Touh_Yauhlahm: "屠友琳"
 LUM_Touh_Yauhlahm_desc: "女性黎博利，出生炎国某地。\n\n魏格康的得力干将，对于魏格康绝对忠诚，并且谣传两人有着暧昧不清的爱恋关系。其主要负责执行和监督对于龙门暴乱和间谍行动的镇压和突袭行动，虽然她无权调动军警力量，但是可以派遣暴乱对策委员会和长尾党等一系列官方暴力组织参与到行动中去。\n\n虽然掌控着兵权，不过屠友琳对于权力却无欲无求。对于她来说，稳定的现状好过于一切。"
 LUM_Sung_Hohnihn: "松贺年"
 LUM_Sung_Hohnihn_desc: "女性瓦伊凡，龙门本地出生。\n\n出生就含着金汤匙的少数人，自小便表现出了在金融和策略上的异于常人的天赋。不过最后并未从政而是选择了继承家业，成为了一名商贾，并在经历过了一系列事件后，得到了名利双收的结果。\n\n然而对于外人来说，最无法理解的就是她为何要取一名萨卡兹为自己的丈夫。而且还有小道消息称其丈夫曾经是卡兹戴尔的一名军阀，并参与过数场在龙门当中有名的惨案当中——当然，这些都是没有任何根据的猜测罢了。"

