 #民族精神
 LUM_East_Terra_economic_center: "泰拉东部经济中心"
 LUM_East_Terra_economic_center_desc: "龙门奇迹让无疑给了泰拉东部的大多数国家一针强心剂，而大炎则是其中最大的受益者之一。不过其处于乌萨斯边境的特殊位置又使得龙门长期处于受侵略的危险中。\n\n但也正因为经济中心的特殊地位，龙门本身并没有多少现有的军队，而大炎也不会允许龙门拥有太多的驻军——除非迫不得已。因而龙门虽然保有着一定数量的军队，但是却无法进行扩展，最多只能够招募新人员替补退役人员。这使得一旦开战，龙门在初期必然会处在劣势的状态。\n\n不过也正因为不用维持数目庞大（相对龙门的体量）的军队，龙门可以把全部的经济和工业的重心放在金融经济、民用领域和对外贸易上面。"

