# 莱茵生命 · 三路线（选国家界面路线卡片专用）
 RHL_Route_Armed_Truth:0 "武装捍卫科学真理！"
 RHL_Route_Armed_Truth_desc:0 "“科学不容侵犯，真理只在射程之内。”塞雷娅将以武力为莱茵生命筑起壁垒。任何试图干涉科研的外部势力——无论是军方、梅兰德，还是联合议会——都将面对钙质化的铁拳。她不会谈判，不会妥协。她只会站在实验室门前，直到最后一个敌人倒下。"
 RHL_Route_Tear_The_Mask:0 "撕下猪猡的面具"
 RHL_Route_Tear_The_Mask_desc:0 "“当猪猡们还在争权夺利，精灵的网早已收拢。”缪尔赛思的分身已渗入哥伦比亚的每一滴水中。议会、政府、军队、媒体——她用微笑与谎言织成一张看不见的网，将整个国家握在掌心。撕下面具的那一刻，他们才会发现，自己早已是水中的囚徒。"
 RHL_Route_Star_Fool:0 "追星星的傻瓜"
 RHL_Route_Star_Fool_desc:0 "“我只是一双眼睛。一双……替所有生活在这片大地上的人们，看向陌生深空的眼睛。”克丽斯腾从未放弃对星空的凝视。登月，只是第一步。她将把整个莱茵生命拖入一场豪赌——为科学献身，哪怕被世人称作傻瓜。当万星园再次升空，没有人能阻止她触碰那片真实的星空。"
