 BCG_Prietita_de_Sonora: "普里埃塔·德·索诺拉"
 BNF_The_unfinished_revolution: "未竟之革命"
 BNF_The_unfinished_revolution_desc: "当真正玻利瓦尔人解放阵线于1050年代初立，并在后来于青年党主导下召开大会，试图团结全玻利瓦尔的进步势力时，人们曾一度相信它能够驱逐辛嘉斯与联合政府的腐朽统治，再造属于玻利瓦尔人的玻利瓦尔。然而，后来的发展却使人们大失所望。虽在最初的正面战场与敌后阵线中取得了出色成果，但战线的愈发停滞与逐渐再起的内部政治分歧却为阵线的革命热情泼上了一大盆冷水。\n\n如今，真正玻利瓦尔人解放阵线虽仍在青年党的领导下勉强维持统一，但阵线内部的伤口却仍在持续撕裂。而在阵线的“解放区”之外，辛嘉斯军则以“香肠战术”逐步蚕食其在境内活动的游击队，并对真正玻利瓦尔人解放阵线的后方大本营虎视眈眈。没人知道青年党领导层能否继续坚持下去，更无人清楚这份自由理想的未来究竟会导向何方。"
 BNF_National_liberation_above_all: "民族解放高于一切"
 BNF_National_liberation_above_all_desc: "自革命肇始以来，真正玻利瓦尔人解放阵线一直有着浓厚的民族主义色彩。无论对于阵线的领导层抑或基层而言，这份民族热忱都是把既锋利而又无法控制的双刃剑。它既鼓励着人们为家国独立浴血奋战，又制造了诸多内部纷争与无可挽回的人道悲剧。随着旧日烈火逐渐消退，如今的民族主义情绪虽已逐步褪去了向一切被视作“叛徒”者挥刀的极端色彩，但其政治涵义仍对于解放阵线中的各党派而言仍是个待定议题。"
 BNF_economic_lag: "经济滞后"
 BNF_economic_lag_desc: "作为真正玻利瓦尔人的主要根据地，临近诺勒特海的西北高原绝非一片富饶的土地。无论是资源稀少，气候不佳，抑或糟糕的地理环境皆限制了其发展。但依靠人民自己的奋斗与莫达拉克等国际进步势力的暗中支持，基本经济秩序仍能勉强维持，但境内工农业发展仍滞后于世。而由于内部派系政治观点的疏离，生产资料究竟应当归属公有、国有、私有还是混合所有制的争执也使各类经济建设计划多有挫折。"
 BNF_chaotic_revolutionary_troops: "混乱的革命武装"
 BNF_chaotic_revolutionary_troops_desc: "自建立之始，真正玻利瓦尔人解放阵线的武装力量便是其核心，早期的组织架构也多有军政色彩。可以武装力量为重的阵线却从未使其军事体系达成统一：南方解放军、斗争联盟的安那齐民兵、民族劳工党战斗队，以及更多其他党派与非党派的军事及准军事组织互不相让，各自对立。\n\n由于工业体系十分落后，解放阵线的许多士兵甚至在使用世界大战时的旧式步铳乃至弓弩与冷兵器，而专注于游击战所带来对现代战争的认知缺失也是个重大问题。"
