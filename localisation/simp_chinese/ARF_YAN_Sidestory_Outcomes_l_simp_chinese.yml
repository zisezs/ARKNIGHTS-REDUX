# ---------------- 洪炉示岁 ----------------
 yan_honglu_aftermath: "洪炉余烬"
 yan_honglu_aftermath_desc: "年关之后，二十一号城区重建了两年。新路面下面压着旧路面，旧的下面还有。龙门人不再提那一夜，只在每年除夕把爆竹放得比别处响。\n\n司岁台立了一条新规：年关前后，全城源石器械强制降载，各城邦一体遵行。公文里叫「洪炉条令」，民间叫「别让那东西又拿我们的城当炉子」。\n\n玄极巨兵的残件封存在龙门地下工事，编号上锁，每年清点。清点的人换了三任，谁也没敢动。"
 yan_honglu_pact: "与年立约"
 yan_honglu_pact_desc: "朝廷最终没有把年列为讨伐对象。它长驻罗德岛，名义上是代理人，实际上谁也管不住。它向那些对人类不敌意的同胞推销罗德岛，很热情，成功率不明。\n\n司岁台档房里，夕名字下面那行小字改成了：代理人，在册。年、夕、令三人的档案并进同一个卷宗，封皮写「岁之分身」，另起一行是椿的笔迹：先按在册办，敌友以后再论。\n\n炎熔后来长成能独当一面的干员。年对此表示欣慰，并且拒绝解释自己为什么会欣慰。"

# ---------------- 将进酒 ----------------
 yan_jjj_twelve_towers: "十二楼五城"
 yan_jjj_twelve_towers_desc: "太傅从尚蜀带回京的，除了一个梁洵，还有一份图样：十二楼五城，机关三千座，兵俑百万台。造这些东西是为了换回一个人，一个戍守北境三百七十余年的老前辈。年接下这份活，条件是朝廷不再过问尚蜀那一年的事。\n\n工部第一批料在第二年开春动了工。到第三年，玉门以西的几处废矿重新点起炉子。有人问年要造多久，年说：良辰美景方为山顶。"
 yan_jjj_shangshu_quiet: "尚蜀无事"
 yan_jjj_shangshu_quiet_desc: "那只黑盏最后不知所终。有人说被沉进攥江，有人说被令带走了，也有人说它本来就没离开尚蜀，只是再没人见过。\n\n梁洵入京，宁辞秋赴玉门，尚蜀换了一任知府。行裕客栈照旧开门，郑掌柜还是每天待在后厨。挑山人不再上山，改在城里给人挑水。杜遥夜带走了尚蜀的一批年轻人。\n\n司岁台与礼部的争执被太傅判了个五五之间，两边都不算输。此后的公文里多了一句套话：事涉代理人，两署会商。这句话没什么用，但尚蜀因此安静了很多年。"

# ---------------- 画中人 ----------------
 yan_hzr_agents_registered: "代理人在册"
 yan_hzr_agents_registered_desc: "司岁台的章程改了。改的是分类，权限没有动：过去代理人一栏写「待定」「在察」「未归」，现在统一改成两个字，在册。\n\n在册不表示听命，只是承认它们有名字、有一半的人形、有可以坐下来谈的余地。椿为这三个字跟兵部吵了半年，最后是重岳的一句话定下来：我是我，祂是祂。\n\n此后数年，大炎处置巨兽相关的事省下不少力气。代价是史官要多留一栏，专门记那些既不是人、也不肯被称作灾的东西。"
 yan_hzr_painting_sealed: "画卷封存"
 yan_hzr_painting_sealed_desc: "灰齐山那幅画被封了，用了三层：土木天师的封印、司岁台的封条、天经阁的封档。三道齐了才算完，谁也不能单独开。\n\n夕在册上仍是未归，但不再有人提除岁。朝廷只记了年烧穿画卷这一功，别的一概不写。往后每年除夕，勾吴一带会有人自发在门口烧一炉竹。他们不知道为了什么，只觉得该烧。"

# ---------------- 登临意 ----------------
 yan_dly_eighteenth_drum: "第十八声鼓"
 yan_dly_eighteenth_drum_desc: "玉门复航之后，望烽节的鼓从十七声改成十八声。第十八声没有名目，是左宣辽自己加上去的，为了那一夜在城头演武的人，为了瓮城里独自以酒对风暴的人，也为了那半城被迁走的百姓。\n\n此后的北境军，新兵入营第一课是听这十八声鼓。教官会说，第十七声记劫难，第十八声记我们捱过来了。\n\n《武典》后来颁行天下。养生功法那一卷开头写着编修官的名字，第一个是槐天裴。"
 yan_dly_sword_kept: "朔留玉门"
 yan_dly_sword_kept_desc: "那把剑最终留在了玉门。重岳走的时候没有带走它，说交给比武第一人，就交了出去。接剑的人比他想的更适合拿它，槐天裴把剑挂在医馆后院，平日不拔，只在每年望烽节取下来擦一次。\n\n司岁台对「玉门宗师乃巨兽化身」这件事的办法是不写。档上只记重岳守城百年的功，功以下的事一概不载。百姓其实不在乎，他们只知道那个在城头站了一百年的人走了，留下了一把剑和一个再练四十年的约定。"

# ---------------- 相见欢 ----------------
 yan_xjh_taishi_vindicated: "太师昭雪"
 yan_xjh_taishi_vindicated_desc: "三道旨意在同一夜出宫：赦太师，昭雪其冤；赦废储君魏彦吾，召其回京；真龙自认「不能明断是非，致使忠良蒙冤」之罪。\n\n四十年压在卷宗底下的那一页终于翻了出来。重新写史的活交给太史阁，执笔的是宁茵。她在最后一篇末尾附了一行小字，记下顾筌的名字和生卒年，没有加评语。\n\n虞澄戴着枷进牢，进去之前只问了一句：你能否担得起真相的分量。"
 yan_xjh_sui_pact: "岁陵之约"
 yan_xjh_sui_pact_desc: "百灶把全城七成的能源从民生里抽出来，灌进岁陵。那一夜全城灯火暗了一半，中秋落了雪，多年没有过的事。\n\n望走了进去，去跟那位分生死。条件写在旨意里：事成则功，事败则以倾国之力诛杀。真龙只批了四个字：准。事已至此。\n\n此后半年，百灶的能源一直没能缓过来。工部的账上多了一栏，没有名目，只有一个数目。管账的人不敢问那是什么。更北的地方，有人看见冬天提前来了。"
