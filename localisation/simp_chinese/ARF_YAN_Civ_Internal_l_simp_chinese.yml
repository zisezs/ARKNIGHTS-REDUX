# ---------------- 事件 yan_civ.1 宣政司改革 ----------------
 yan_civ.1.t:0 "宣政司改革"
 yan_civ.1.d:0 "§W〔旁白〕§!：尘封的旧账从司岁台内库抬出，足足搬了六趟。惊蛰清点完最后一册，啪地合上木箱。\n§C惊蛰§!：「共计六百一十七册，一卷不落。」\n§Y太合§!：「……整整二十年的烂账，这得核对到猴年马月去。」\n§M太傅§!：「账要先勘，新章程也得今日就拟。」\n§Y太合§!：「太傅，旧账还没理清，这新章程从何下笔？」\n§M太傅§!：「等六百本账核完，黄花菜都凉了。今日分两班人马，一班死磕旧账，一班先把宣政司的章程立起来。」\n§Y太合§!：「若是后头查出亏空，与章程抵触了呢？」\n§M太傅§!：「章程是写给活人立规矩的，旧账是留着拿人问罪的。两不耽误。」"
 yan_civ.1.b:0 "先定章程，账目后议"

# ---------------- 事件 yan_civ.2 落子无悔 ----------------
 yan_civ.2.t:0 "落子无悔"
 yan_civ.2.d:0 "§W〔旁白〕§!：岁陵前的石桌上摆着一局残棋。盘上黑白子皆有残缺，少的那几枚，正拢在太傅袖中。\n§M太傅§!：「这盘棋，你复盘过几回了？」\n§C望§!：「三遍。每算到第七十手，你这边的路就断了。」\n§M太傅§!：「路断了，不代表棋输了。岁陵的事到此为止，往后朝野上下谁再借题发挥，老夫一概不接。」\n§C望§!：「朝廷拍拍袖子不接了，那我呢？」\n§M太傅§!：「你手里捏着那枚黑子迟迟不落，不就是在等老夫这句话么。」\n§C望§!：「我若不留一手，太傅哪肯把底牌亮出来。」\n§M太傅§!：「……以退为进，这话还是当年老夫教你的。」\n§C望§!：「你教我的时候，可没说有一日会用在你自己身上。」\n§W〔旁白〕§!：望指尖一翻，将那枚黑子不紧不慢地收入袖中。\n§C望§!：「既如此，这盘棋便暂且封盘吧。」"

