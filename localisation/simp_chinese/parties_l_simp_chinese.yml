#共产主义
 communism: "共产主义"
 communism_noun: "共产主义"
 communism_subtype: "共产主义"
 communism_subtype_desc: "§Y共产主义§!§W（共产主义）§!\n\n“无产阶级平等要求的实际内容都是消灭阶级的要求。任何超出这个范围的平等要求，都必然要流于荒谬。”——韦伯·海森（莱塔尼亚）\n\n共产主义是泰拉左翼意识形态的先锋，其源自于马佐夫与海森的思想风暴和革命实践，并随花语运动撒向泰拉各地，衍生出许多变体。共产主义的最高理想是建立一个没有压迫、没有剥削，生产资料完全公有，人类真正得到解放的社会。为达成这一目标，就要启发无产阶级的自觉意识，通过由先锋队领导的阶级斗争，推翻旧社会，建立无产阶级专政的共产主义国家。\n\n在现实中，由于不同国家革命者对共产主义的不同理解和实际的国情差异，对于如何实现共产主义，产生了多种分支学说。但即使共产主义者之间有再多的分歧，阶级斗争的理论和公有制的原则容不得篡改，所以不同的共产主义者都选择了相同的暴力革命之路。这也使得共产主义者在任何一个国家，都不受到当局的欢迎，共产主义也因此被贬低为空想童话与异端学说。共产主义者们无心理会这种拙劣的话术，他们只在乎无产阶级挣脱锁链后，将获得一个怎样的新世界。"
 bolshevism_subtype: "布尔什维主义"
 bolshevism_subtype_desc: "§Y布尔什维主义§!§W（共产主义）§!\n\n“我们要追求公平也不需要什么原因。因为我们本来就该追求公平。如果这片大地不肯给，那我们就从它那拿回来。”——塔露拉·雅特利亚斯（乌萨斯）\n\n布尔什维主义是东达利亚的感染者游击队对共产主义的创造性发展。这群在冻原上与乌萨斯政府军和自然搏斗的感染者战士们，在接受了共产主义理论后，结合他们的革命经验与实践，将共产主义中关于“先锋队”的理论进一步发展，形成了一套完整的理论体系。\n\n布尔什维主义宣称自己是共产主义的继承者和实践者，其核心是先锋队理论和“苏维埃”体制。在革命阶段，无产阶级必须通过一个组织严密、纪律严明、思想进步的革命政党来领导革命，对政治、经济和文化进行全面的控制和引导，达成建成共产主义的革命目标。在革命道路上，鉴于乌萨斯城乡对立的实际情况，布尔什维主义主张在远离城市的冻原乡村地区建立根据地，积蓄革命的力量，然后再一步步从乡村到小城市、大城市，最终完成一国的革命。基于这一特殊的革命道路，布尔什维主义又引入了“苏维埃”体制以管理根据地，在先锋队的绝对领导下，各级苏维埃将在根据地实行有限的民主自治，而先锋队和苏维埃又可以在人员和政策上形成正向循环，使得革命稳健地向前推进。"
 committee_communism_subtype: "联合体共产主义"
 committee_communism_subtype_desc: "§Y联合体共产主义§!§W（共产主义）§!\n\n“群众是决定性的，群众是磐石，革命将依靠这块磐石取得最后胜利。”——康拉德·克内希（卡兹戴尔）\n\n联合体共产主义由卡兹戴尔流亡革命者康拉德·克内希在莱塔尼亚提出，在经过左转激进化的红玫瑰主义者进一步发展后，成为了共产主义理论的一个重要分支。联合体共产主义的关键理论是革命自发性理论，其主张自下而上地组织革命，反对过度的威权政治。\n\n联合体（Gemeinwesen）一词源自自治城市，但是在近现代莱塔尼亚群众由罢工而自发联系建立的地方自治团体也为此名，被联合体共产主义者们认为是最佳的组织形式。通过对群众的教育和引导，激发革命的自发性，群众在革命中不断自我锻炼，斗争智慧和意志不断提高，就能使革命走向一个又一个新的高潮。在这一过程中，群众以联合体的原则组织起来，内部实行充分的民主，如此又可进一步激发群众的革命智慧，并且与当局的威权统治形成对抗。联合体共产主义主张弱化先锋队的影响，先锋队只应当作为协调各地革命行动的组织存在，并且对革命进行适当的引导。联合体共产主义者担忧，先锋队对革命进程的过分控制，会压制群众的革命自发性，反而对革命的前途不利。只有无产阶级在自发的联合体中实现自觉的解放，他们才有底气去解放整个泰拉，联合体共产主义者对此坚信不疑。"
 stratocratic_communism_subtype: "军政共产主义"
 stratocratic_communism_subtype_desc: "§Y军政共产主义§!§W（共产主义）§!\n\n“战胜可憎的敌人天生就是荣誉，我却不为更多牺牲而感到骄傲。”——博卓卡斯替（乌萨斯）\n\n军政共产主义的提出基于这样一个现实：资产阶级和其他旧势力的力量过于强大，尤以军事力量为最。要想取得革命的胜利，必须首先在战场上战胜反动派的军队，因此共产党人要将军事斗争摆在第一位。军政共产主义者正是这么做的。军政共产主义强调建设一支强大的革命军队的重要性，并将军队置于先锋党的同等地位，或干脆直接宣称，革命军队本身就是无产阶级的先锋队。\n\n对于其他左翼派系对他们军政府色彩的批判，军政共产主义者反复强调，革命军队的组成就是工人、农民和革命士兵，这些人经受过与军事训练同等量级的政治教育，是完全值得信赖的革命先锋队。并且这支军队内部也严格遵守了共产主义的原则，这里不存在军官对士兵的压迫，革命士兵也不会像反动军队那样掠夺百姓。在经济上，军政共产主义者要求一切建设为军事建设让位，尽可能高效地建立起一支在装备和意志上都能与敌军匹敌的部队。但条件允许的话，他们也不会刻意去忽视人民的需求。军政共产主义者的目的很简单，依托战无不胜的革命军队将资产阶级彻底碾碎，然后在他们的尸骸上建立起一个新世界。"
 liism_subtype: "李哲笙主义"
 liism_subtype_desc: "§Y李哲笙主义§!§W（共产主义）§!\n\n“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。”——李哲笙（炎）\n\n当共产主义的思潮随着花语运动传播到世界各地之时，其在位于遥远东陆的炎国并未掀起多少涟漪。但共产主义终究还是在那里留下了几粒种子，而其中一颗种子最终成长为了名为“李哲笙思想”的参天大树。李哲笙思想也被一些炎国革命者称为“李哲笙主义”，其主要来源于炎国革命者李哲笙本人的革命实践和理论研究，也融合了其他炎国左翼革命者的思想，用李哲笙本人的话来说，这是“集体智慧的结晶”。\n\n和共产主义的其他流派一样，李哲笙主义具有鲜明的炎国色彩，其核心为群众路线，或是人民自决理论。李哲笙主义认可先锋队的领导作用，但更强调先锋队与人民群众的联系与互动，认为先锋队应当来自于人民之中而非凌驾于人民之上。先锋队应当从群众中吸收人才、经验和智慧，而先锋队自身就应当由人民组成。此外，面对炎国特殊的革命形势，李哲笙主义还提出了团结其他革命阶级的统一战线理论，和塑造革命合法性的“造反有理”理论。而随着共产主义在炎国出人意料的胜利，可以预见到，李哲笙主义将成为共产主义的又一大主流理论体系。"

#社会主义
 socialism: "社会主义"
 socialism_noun: "社会主义"
 socialism_subtype: "社会主义"
 socialism_subtype_desc: "§Y社会主义§!§W（社会主义）§!\n\n“通过对资本主义文明的批判，无产阶级已经或正在形成统一的意识；这种批判含有文化的性质，而不仅仅是一种自发的和自然主义的进化。”——安东·嘉兰西奥（叙拉古）\n\n社会主义一词囊括了许多派别，虽然这些派别的诉求各不相同，但他们的相同点在于，都反对资本主义秩序，都主张建立一个生产资料公有，劳动者能够得到解放的新社会。虽然共产主义也被认为是社会主义的意识形态之一，但此处所称的社会主义，多为正统共产主义者之外的其他社会主义流派。\n\n社会主义的历史可以追朔到各国古代建立起的农业公社，或是高卢启蒙运动中的激进共和主义者。社会主义通常是革命的，也就是说，社会主义者不会放弃彻底摧毁资本主义和其他反动派的目标。但在现实中，出于自保或革命宣传的考量，社会主义者也会展现其温和一面。在城市或乡村之间进行社会实验，或是以候选人的身份参与资产阶级的议会。简单来说，只要能够实现目的，社会主义者不介意采取什么手段。"
 anarchism_subtype: "无政府共产主义"
 anarchism_subtype_desc: "§Y无政府共产主义§!§W（社会主义）§!\n\n“这场革命如何发生？没有人知道它将如何在人类中发生，但每个人都清楚地感受到它。然而在我们的世界里，每个人都想改变人类，没有人想改变自己。”——列夫·费尔蒙泰戈（乌萨斯）\n\n无政府主义，又称安那其主义，其词源为古米诺斯语的一个单词，意为“没有统治者”。正如其名，无政府主义堪称最为激进的左翼意识形态，其否定私有制的合法性，反对一切自上而下的统治，既包括资本主义制度，也包括任何形式的政府。对于如何在这种情况下组织社会生产和生活，无政府主义者选择相信无产阶级自发的互助与合作，认为在这种自然状态下，人的自由意志和自我解放才能充分地实现。当然，这种理想的自然状态缺乏现实的检验，因此，无政府主义者在泰拉各地进行了许多实验，从乌萨斯的农业无政府主义村社，到伊比利亚的地区海嗣防御委员会，无政府主义至今仍在实践中发展着自身。\n\n作为最颠覆常识的激进左翼，无政府主义遭到了许多怀疑和挑战，左翼“同志”质疑这种组织方式缺乏目标，反动派则嘲笑他们的松散和混乱。即使是无政府主义者内部，也会担忧多数人的暴政与自私自利导致的以邻为壑。但纵使现实中有再多的艰难险阻，也无法阻挡无政府主义者们追寻自由和解放的步伐。"
 syndicalism_subtype: "工团主义"
 syndicalism_subtype_desc: "§Y工团主义§!§W（社会主义）§!\n\n“历史具有长远的眼光。它最终会对暴君做出严厉的审判，并会证明那些因反对政治压迫和经济奴役，为人类自由奋斗而受苦、监禁和牺牲的人无罪。”——阿莱莎·塞拉斯（哥伦比亚）\n\n随着源石工业将工业资本主义抬上它的王座，名为工团主义的幽灵也在王座下的血汗中滋长。工团主义起源于哥伦比亚工人自发建立的互助组织，在与当局的斗争中，工团组织不断发展成熟，并逐渐成为了一个拥有正式纲领的政治理念：以工会为中心进行斗争，持续地教育、组织工人阶级，通过酝酿一场“总罢工”，瘫痪资本主义秩序，推翻资产阶级统治，建立一个工团主义的工人国家。\n\n工团主义的基础是工会或工团，所有斗争都是围绕着工会进行的。在和平时期，工会既是工人们向资本家争取薪酬的领导者，也是工人们串联、学习的场所。而在斗争阶段，工会则是组织工人武装，策动罢工运动的中心。而在工团主义者对工人国家的规划中，工会同样被置于重要的位置，其将成为工人国家的基本政权组织，作为公有制经济的生产单位和工人民主的政治平台而存在。在斗争策略上，工团主义者寄希望于一场规模巨大的“总罢工”，能够使得资本主义的经济彻底瘫痪，让资产阶级自愿或被迫交出政权。虽然有意见认为，总罢工是一种机会主义的一厢情愿，但工团主义者们清楚，只要离了工人，资本主义秩序就再也无法存续。"
 leftwing_nationalism_subtype: "左翼民族主义"
 leftwing_nationalism_subtype_desc: "§Y左翼民族主义§!§W（社会主义）§!\n\n“见多识广的民族，蒙受教训、深知并珍视神明赋予他们的权利，这种民族是不会被奴役的。暴政始于无知。”——本雅明·莱特（哥伦比亚）\n\n社会主义者常说，无产者没有祖国。但左翼民族主义者不同意这一点。资本主义的触角伸到了泰拉的每个角落，这片大地上所有的无产者都受着它的压迫——但总有些人受的压迫比其他人深重得多。左翼民族主义者同时持有民族主义和社会主义的观点，取得民族的独立和解放是他们的首要目标，而社会主义国家的建立则依托前者的实现，也有一些左翼民族主义者试图毕其功于一役，但这种想法缺乏真实案例的支撑。\n\n在社会主义和民族主义之间，左翼民族主义者常常以民族主义为先，这也使得他们不时收到“修正主义”的帽子。诚然，在实践当中，左翼民族主义者更欢迎与其他阶级的合作，也更愿意接受资本主义的生产要素，许多左翼民族主义者还具有强烈的排外倾向。但若是代入左翼民族主义者的视角，他们从未背叛自己的理想。他们的兄弟姐妹由于民族和经济地位的不同，在资本主义统治下承受了双倍的不公，而左翼民族主义者只不过是想让资本主义体系的受益者把他们的血肉还回来。"
 scistate_socialism_subtype: "科国社会主义"
 scistate_socialism_subtype_desc: "§Y科国社会主义§!§W（社会主义）§!\n\n“我们所知晓的‘前文明’代表了我们已知宇宙内，文明的最高水平。而若要达到如此高度，除了能够极大解放生产力的共产主义道路，断无其他途径。”——迪特里希·布伦伯格（莱塔尼亚）\n\n科国社会主义是一个崭新的思潮，其与军政社会主义有些许相似之处，二者皆是将某一事业置于其他事业之上的社会主义，对于军政社会主义，这一事业是军事，而对于科国社会主义，这一事业则是科学。科国社会主义者对科学技术有着极其狂热的追求，其核心观点之一，便是社会主义（或共产主义）是人类社会进化的一个崭新阶段，而科学技术的进步，必将带来生产力的极大发展和人类的极大解放，是“新人类”在这个崭新时代所必要的利刃与甲胄。\n\n基于这种“科技至上”的理念，科国社会主义者进一步描绘出他们理想中的政治经济体制蓝图。国家完全由绝对理性但同时具有自觉阶级意识的技术官僚所统治，借助控制论理论，无产阶级化的技术官僚将通过极为高效和科学的决策和行动，将社会的方方面面安排得井井有条。在此基础上，国家的一切重心都将转向追求科学技术的突破，而科技的突破又将转化为更高效的生产力和人民更美好的生活质量。在这条不断追逐未来的道路上，科国社会主义者渴望成为未来本身。"
 agrarian_socialism_subtype: "农业社会主义"
 agrarian_socialism_subtype_desc: "§Y农业社会主义§!§W（社会主义）§!\n\n“农村革命是农民阶级推翻封建地主阶级的权力的革命。农民若不用极大的力量，决不能推翻几千年根深蒂固的地主权力。”——李哲笙（炎）\n\n相比在工业时代关注城市工人的其他社会主义者，农业社会主义是一个异类。这一思潮主要流行于农业仍占据社会生产主要地位的国家和地区，认为农村才是社会主义革命的主战场。土地理应属于耕种它的劳动者，农民理应获得他们的所有劳动成果。大多数农业社会主义者都认可社会主义的公有制原则和集体主义经济，但也有一些农业社会主义者更倾向农民私人拥有土地和自发的村社生产。\n\n农业社会主义者在经济政策上的分歧，使得他们在其他方面的主张也显得更加千奇百怪。一些农业社会主义者声称，农业生产才是通向社会主义的正确道路，田园牧歌才是理想社会应有的的状态，而另一些人则承认，农业社会主义终将通过更温和的集体化和工业化迈向工业时代。不过，无论持有何种立场，农业社会主义者的行动都是基于一个朴素的出发点：让那些养活了人类文明的劳动者，也能养活他们自己。"
 revolutionary_front_subtype: "革命阵线"
 revolutionary_front_subtype_desc: "§Y革命阵线§!§W（社会主义）§!\n\n“我们社会主义者必须坚信，如今流下的鲜血和遭受的苦难，都将为未来社会的变革作奠基，并让我们朝着人类和平的目标迈出一大步。”——阿莱莎·塞拉斯（哥伦比亚）\n\n很多时候，左翼革命者的力量不够强大，而为了建立社会主义社会的共同目标，不同派别的革命者往往选择联合起来组建革命阵线，向资本主义秩序发起挑战。维系革命阵线的关键在于共识与妥协。除了对社会主义的共同追求，在具体的政策上，如政权的组织形式和集体化的手段，不同的革命者之间也需要达成共识。若共识难以确立，那么阵线的团结就只能寄托于某个激进派暂时放弃其诉求，或是各派之间的相互妥协。\n\n通常来说，这样的革命阵线还会依靠一位或几位声望巨大的领袖，去获得更广泛的支持和维持阵线的团结，前述的共识与妥协也常常依赖政治领袖的推动。但若是领袖离去或退出政治舞台，革命阵线自然也难以维持稳态，其结局大多是各奔西东或是主流派系赢者通吃。对于阵线中的革命者，如果最终的崩溃不可避免，他们只能祈祷这个结局发生在资本主义被战胜之后。"

#进步主义
 progressivism: "进步主义"
 progressivism_noun: "进步主义"
 progressivism_subtype: "进步主义"
 progressivism_subtype_desc: "§Y进步主义§!§W（进步主义）§!\n\n“民主政府生来就有能力保护人民，使我们免遭一度认为是不可避免的灾难，解决一度认为是不可解决的问题。我们拒绝把我们的共同福利问题交给机会的阵风和灾难的狂飙去摆布。”——克里斯·洛泽维尔特（哥伦比亚）发表就职演说\n\n进步主义滥觞于花语运动的大潮之中，起初是作为对抗被僭主篡改的自由主义的武器，但随着激进思想在人们的脑海中生根发芽，进步主义与自由主义之间的裂隙越来越大。与自由主义相比，进步主义更强调公平与民生，认为社会公平是自由民主的真正基石，资本主义需要转向更人道而非更功利的方向。\n\n经济上，进步主义在认同市场经济的前提下，希望建立更完善的社会福利体系，以保障那些“落后之人”的经济权益。社会文化方面，进步主义者尤其强调平权，申明机会公平的原则，反对在政治、就业和社会生活方面的歧视。比起更加激进的民粹主义和社会主义者，进步主义并不要求对体制进行彻底的变革，但他们也承认变革本身的重要性，因此他们会尝试推动一些渐进式的改良。在民众的眼中，进步主义为他们提供了功利的自由主义和古板的保守主义之外的第三种选项，一个温和而具有人性面孔的资本主义。"
 social_democracy_subtype: "社会民主主义"
 social_democracy_subtype_desc: "§Y社会民主主义§!§W（进步主义）§!\n\n“每个人都有权利力选择战斗的方式，他们有权力选择战争，我们就有权力选择和平。而这并不是一种软弱——这是一种智慧，以道德伦理之名的智慧。”——格尔尼斯·威廉姆斯（哥伦比亚）\n\n社会民主主义是最典型的中左翼意识形态之一，在花语运动中也被称作“紫罗兰主义”。与其他激进的左翼分子不同，社会民主主义者并不寻求改变资本主义制度。在他们眼中，资本主义的生产方式和其所代表的精神，是维系社会良好运行的必要条件，只是需要一些调整以适应变幻着的时代。在实践中，社会民主主义者会将政策制定的重心放在经济层面，例如完善劳动法规，提供廉价公共服务和更全面的社会保障。\n\n社会民主主义的历史注定了其温和主义的底色。比起在花语运动中声势浩荡的红玫瑰派，社会民主主义在当时的主要支持者多为单纯的教授和理论家。因此，自诞生以来，社会民主主义就更注重于经济和社会方面的改良，忽视了那些被学究们瞧不上的政治运作。这也导致他们遭到了不少嘲讽，左翼鄙夷他们的软弱，右派则批判他们的浪费。因此社会民主主义者也更倾向于在建制派当中寻找盟友，不管外界的声音如何评价，他们相信人民和历史总会做出公正的回答。"
 democratic_socialism_subtype: "民主社会主义"
 democratic_socialism_subtype_desc: "§Y民主社会主义§!§W（进步主义）§!\n\n“另一个哥伦比亚——贫困的哥伦比亚——被今天的人们以一种前所未有的方式藏起来了。千千万万的哥伦比亚穷人在我们面前隐身了。”——迈克·布莱顿（哥伦比亚）\n\n民主社会主义常被划分在进步主义即中左翼的光谱内，但现实中许多的民主社会主义者常常自称社会主义者或共产主义者。造成这一现象的原因，在于民主社会主义看似矛盾的政治观点。其持有鲜明的社会主义立场，不论其自称哪一派别，都认可工人民主和公有制的必要性，否定一切形式的资本主义。但另一方面，民主社会主义者认同民主政治和其价值，他们声称民主制度本身没有强烈意识形态色彩，社会主义者应当广泛参与到民主政治当中，为劳动者争取权利，和平地获得政权，走向社会主义。\n\n在花语运动中，被称为“红玫瑰主义”的民主社会主义曾是当时的左翼旗手。尽管这一身份后来让位于更激进的马佐夫主义者和工团主义者，但只要人们对民主和人权的信念没有动摇，对社会主义的理想没有改变，那么民主社会主义就永远不缺忠实的支持者。"
 revisionist_syndicalism_subtype: "工联主义"
 revisionist_syndicalism_subtype_desc: "§Y工联主义§!§W（进步主义）§!\n\n“工人的社会不安全感是他们对国家构成威胁的真正原因。”——劳恩堡大公（莱塔尼亚）\n\n当花语运动的热潮开始减退，哥伦比亚的资产阶级重新开始了他们的联合，哥伦比亚的工团主义者也必须面对抉择。改良派和激进派之间的矛盾最终到了无法弥合的地步，双方最终分裂，改良派最终成为了如今的工联主义者。表面上，工联主义者仍然坚持着工团主义的诸多原则，例如以工会为中心进行活动，组织工人进行经济斗争，主张将工会作为组建国家的基本单位。但细看不难看出，工联主义实质上放弃了革命立场，而是主张通过渐进式改良，促进工人政治地位的提升。\n\n革命的工团主义者常常怒斥他们为叛徒，在这些腐败的工会官僚治下，工会的运作会越来越低效，也越来越倾向保守，最终成为资本主义的傀儡，并预言这种“工会主义”的倾向不会长久。但时下的工联主义者仍在为工人的权益而奔走，他们相信，通过温和的改良手段，工人同样可以获得最终的解放，只要解放以后他们还按时交会费就行。"
 constitutional_progressivism_subtype: "宪政进步主义"
 constitutional_progressivism_subtype_desc: "§Y宪政进步主义§!§W（进步主义）§!\n\n“衡量我们进步的标准,不是看我们给富人们带来什么,而是要看给那些一无所有的穷人能否提供基本保障。”——克里斯·洛泽维尔特（哥伦比亚）\n\n在许多进步主义者心中，在抑郁时代拯救了哥伦比亚的克里斯·洛泽维尔特是他们永远的偶像。这位前总统曾力排众议，在任上进行了大刀阔斧的改革，极大提高了政府对经济的控制水平。遗憾的是，一场恶毒的刺杀让洛泽维尔特被迫退出政坛，而他的改革也戛然而止。但他的理念还是找到了继承者，宪政进步主义者在新的时代，重新扛起了这面旗帜。\n\n概括来说，宪政进步主义继承并体系化了以洛泽维尔特为代表的哥伦比亚民主党人的政治理念。他们热烈欢迎政府对经济进行干预，包括国有化公共服务、税收优惠与补贴、大规模的政府投资建设，并且希望这种对经济的宏观调控能够制度化，成为全社会的共识。面对称他们为“威权主义者”的质疑，宪政进步主义者一再声称，他们之所以要控制经济运行，正是要防范自然垄断和经济危机对民主和自由的破坏。他们也同样大力支持平权和反歧视运动，意图扩展民主的基础。如果那些反对者认为宪政进步主义者在破坏民主，那就让他们看看，选民们会把选票放进谁的投票箱里。"
 leftwing_populism_subtype: "左翼民粹主义"
 leftwing_populism_subtype_desc: "§Y左翼民粹主义§!§W（进步主义）§!\n\n“祖国更重于生命，是我们的母亲，我们的土地。只要有爱，就值得去战斗和歌唱，就值得活在世上。为了民族，为了全人类，人人都会一百次地把生命献上。”——保罗·巴索阿尔托（玻利瓦尔）\n\n左翼民粹主义源于对自由主义的怀疑，在“自由平等”的统治之下，为什么许许多多的人还生活中贫困的枷锁中？左翼民粹主义者要求更进一步，在自由与平等之上，还有公平与正义。资产阶级的精英掌握了太多的财富和权力，他们操控着舆论和选票的流向，实际上已经成为了民主制度的叛徒和威胁。左翼民粹主义者要求对制度的彻底变革，不仅是政治上的，还包括经济与社会上的。他们与其他进步主义者类似，主张扩大社会福利和保护弱势群体，但口号变成了“重新分配财富”和“帮助我们的兄弟姐妹”。在受压迫国家活动的左翼民粹主义者，还同时会具有强烈的反霸权和民族主义倾向。\n\n在有着不公不义的地方，就有左翼民粹主义生长的土壤。这个地方可以是移动都会的贫民区块，也可以是半殖民地国家的种植园与矿井。政客、企业家和买办眼睁睁看着左翼民粹主义在他们脚下的土地扩散，恐惧又无可奈何，因为这是他们自找的恐怖麻烦。"
 popular_front_subtype: "人民阵线"
 popular_front_subtype_desc: "§Y人民阵线§!§W（进步主义）§!\n\n“让我们致力于米诺斯人在很多很多年前就曾写下的内容：驯服人的野蛮并创造这个世界的温雅生活。”——鲍比·弗雷（哥伦比亚）\n\n人民阵线是几乎所有左翼意识形态的大集合，从社会主义者到一般的中左翼自由派，甚至一些共产党人和保守派也会被囊括其中。能把这些意识形态分歧巨大的派别团结在一起的理由，只有可能是某种外界的威胁，也许是外来入侵，也许是某个独裁者的恐怖统治。\n\n人民阵线并不应该被称为一种意识形态，其更像是基于现实情况形成的一种多派系联合的状态。人民阵线的基调是左翼的，这使其可以获得尽可能广泛的阶层的拥护，从而增强整体的力量。但为维系阵线的团结，不同派别之间必须达成某些妥协，这也使得人民阵线的政治主张会较为模糊。而这种外力形成的团结无疑是脆弱的，各派本身就对维护阵线的存在缺乏足够的兴趣。人民阵线只有可能是一个临时的状态，这一状态会在外部威胁消除、阵线取得最终胜利之后，被主流派系的绝对统治或回归分裂的结局所取代。"
 rimbilliton_system_subtype: "雷姆必拓体制"
 rimbilliton_system_subtype_desc: "§Y雷姆必拓体制§!§W（进步主义）§!\n\n“事情捅得越大，要开的会就越多，浪费的时间也越多。”——雷姆必拓谚语\n\n富饶的源石矿让工人、设备和资本源源不断地流向雷姆必拓，这片位于泰拉大陆东南方的土地。但自由和民主却并没有随他们一起到来。各国的殖民当局和矿业公司用最反动的方式对待这片土地和生活于此的人民，殖民、奴役、镇压，无所不用其极。雷姆必拓的人民只能寻求自保，数量众多的自治州不约而同地建立起来，大部分自治州都是以当地矿业工会为核心，这也使得许多自治州一开始就带有了工团主义的色彩。\n\n在自治州出现后，各州开始寻求政治上的联合。以围栏事件为代表的几次事变无疑加速了这一进程。雷姆必拓矿业联合最终成立，反殖民、自治、工团主义，成为了这一体制的支柱。需要强调的是，雷姆必拓的工团主义并非属于革命工团主义，实际上是一种妥协的结果。坚持正统的革命工团主义的自治州确实存在，但雷姆必拓矿业联合的属性更类似于辛迪加联盟，其自身也是资本主义国际体系的重要一环。不过随着泰拉形势的变化，这一体制也有可能发生变革，毕竟雷姆必拓的矿工们从来不缺少促进变革的精神。"
 revolutionary_democracy_subtype: "雅各宾主义"
 revolutionary_democracy_subtype_desc: "§Y雅各宾主义§!§W（进步主义）§!\n\n“皇帝必须死，因为祖国必须生！”——雅各宾主义著名口号\n\n雅各宾主义，或者说革命民主主义，从一开始就有极为浓烈的暴力抗争色彩。该思潮崛起于高卢帝国时期的启蒙运动，因其成员曾长期租用林贡斯雅各宾修道院的礼堂作为活动场地而得名。雅各宾派在遭科西嘉一世镇压后转入地下运作；而在高卢灭亡、惨遭殖民的岁月里，雅各宾派全力扛起民族解放的大旗，在游击战争中经受了血与火的考验。相较于其他进步主义派系，雅各宾主义者更看重革命而非改良的作用，但与社会主义以及共产主义者相比，雅各宾主义者更少提及无产阶级和阶级斗争。\n\n有时这派政治家的民族主义和反精英倾向令人联想到左翼民粹主义，但他们一般只把这些运动视为推进革命的手段，并不愿意让自己完全受制于这些意识形态目标。\n\n总的来说，雅各宾主义者依然认可进步主义的多数主张，但却认为这些主张只能用坚决的革命手段才能实现；他们乐于和社会主义者以及共产主义者合作推动暴力革命，但是却总对无产阶级有所提防；他们有时还会在民族独立运动中和中右翼的民族主义者一同工作，但是过不了多久就会尝试对付这些右派；他们和其他进步主义者一样崇尚民主，但他们偶尔也会认为革命的威权反而能促进真正的民主。\n\n多年以来，雅各宾主义思潮的影响力不断增强，在泰拉大地的各处开花结果，特别是对乌萨斯革命民主派和哥伦比亚激进人士产生了深远影响。"

#自由主义
 liberalism: "自由主义"
 liberalism_noun: "自由主义"
 liberalism_subtype: "自由主义"
 liberalism_subtype_desc: "§Y自由主义§!§W（自由主义）§!\n\n“人生而自由，却无时无刻不在枷锁之中。他自以为是其他一切人的主人，但因此也反比其他一切人更像奴隶。”——雅客·罗素尔（高卢）\n\n泰拉的自由主义诞生于资本主义发展中的自然状态，它从高卢启蒙运动的沙龙中走来，在独立的哥伦比亚扎根生长。时至今日，自由主义仍然是泰拉大陆最光明的一座灯塔，将光芒洒向那些仍在蒙昧黑暗中的人们。自由主义的原则是自由与平等，人民在社会生活中当享受充分的自由和平等权利，而政府产生于人们自愿的契约，自然也应当是这种权利的守护者。\n\n在自由平等的理想指引下，自由主义先驱们从古代米诺斯的城邦政体中汲取灵感，创立了现代民主主义的政治学说。当代的全部民主政治思潮都发端于早期自由主义，而自由主义者也是民主制最忠诚的卫道士。自由主义经济学是他们的另一大贡献，自由主义者相信市场的自我调节，但也重视政府的规范作用。他们支持全面的市场经济和自由贸易，并主张限制垄断组织以实现真正的自由竞争。"
 progressive_liberalism_subtype: "进步自由主义"
 progressive_liberalism_subtype_desc: "§Y进步自由主义§!§W（自由主义）§!\n\n“变革是生命的法则。那些只关注于过去或现在的人无疑会错过未来。”——杰拉德·弗雷（哥伦比亚）\n\n虽然改良主义的高卢失去了四国战争的胜利，但战后的经济奇迹属于自由主义的哥伦比亚。经济的腾飞塑造了自由主义的神话，“泰拉的灯塔”被吹捧到了一个不属于她的高度，而不少自由主义者对此展现了担忧。自由主义从来不是什么神话，它是一门科学，需要不断修正其理论而非笃信它的全能。进步自由主义由此产生，其糅合了很大一部分进步主义者的政治主张，如更广泛的平权和必要的社会救济，并且更倾向劳动者的立场，以促进劳资关系的协调与缓和。\n\n事实证明，进步自由主义者的担忧并非没有必要。伦蒂尼姆金融潮和随后的“抑郁时代”将传统自由主义拉下神坛，先前的狂热信徒也不得不投靠真正的预言者。进步自由主义者如今的任务，是通过一系列的试验和改革，增进政府效能和人民福祉，随后让民主平等和自由市场重新成为社会的主流思潮。这一回，进步自由主义不再是令人迷信的神话，而是能够俘获理智的真理认知。"
 market_liberalism_subtype: "市场自由主义"
 market_liberalism_subtype_desc: "§Y市场自由主义§!§W（自由主义）§!\n\n“自由主义者对社会的态度，像一个照顾植物的园丁，为了创造最适宜于它成长的条件，必须尽可能了解它们的结构以及这些结构是如何起作用的。”——费德里克·海耶斯（莱塔尼亚）\n\n市场自由主义是一种特殊的自由主义，其代表了自由主义者内部的一种经济主义倾向，他们只关注自由市场原则是否得到贯彻，个人和企业是不是真的能通过勤奋劳动和自由竞争实现成功。市场自由主义者主张对政府进行限制，因为过多的干预会使自由市场遭到破坏，用无意义的“平权”换来的市场混乱是人们难以承担的代价。\n\n市场自由主义的反对者批评其对市场神话过于迷信，并且忽视了那些成为代价的民众。而且在实践中，市场自由主义者也并不总是能严格地做到言行合一，因为在很多情况下，为了促成某些产业的发展，或是抵御外国经济的冲击，市场自由主义者也会祭出补贴或关税等法宝。应该说，市场自由主义者确实坚持自由市场的原则，但这一“原则”会随着时局的变化被灵活地定义。"
 national_liberalism_subtype: "民族自由主义"
 national_liberalism_subtype_desc: "§Y民族自由主义§!§W（自由主义）§!\n\n“爱国主义和民族主义之间存在深刻的区别。前者，强调的是对自己祖国的爱，而后者，强调的是对所有其他民族的恨。”——迪米特里·莱赫切夫（乌萨斯）\n\n现代民族主义的历史几乎与自由主义的历史等长，在过去二者的结合也并不少见。民族自由主义者认同自由主义的原则，即自由与平等，同时他们强调，这种自由平等不仅存在于个人与个人之间，同样应当适用于各民族之间。他们比其他自由主义者更强调民族意识和国家建构，也更偏爱从传统价值观出发去制定政策。在这些议题上，民族自由主义者与保守派有着更多的共同话题。\n\n持民族自由主义立场的政治团体多为中右翼的民主建制派，或是一些受压迫国家的自由主义者。而他们具体的政策取向，也与他们的现实处境相关。比如，在独立国家议会中的民族自由主义会更倾向欢迎外来资本的自由流通，但落后国家中的那部分人会更倾向采取贸易保护政策和补贴民族企业，以让本民族在泰拉市场的竞争中取得多一点的优势。"
 plumism_subtype: "梅花主义"
 plumism_subtype_desc: "§Y梅花主义§!§W（自由主义）§!\n\n“一切革命都必须是社会之革命，以社会之变革为基础；否则便不成其为革命，只是改换政府而已。”——宋清琳（炎）\n\n当西陆的思想家和政客们在花语运动中激烈交锋时，炎国的共和主义者效仿西方人，为自己的共和主义理念冠上了“梅花主义”的名号。梅花主义的理论体系具有鲜明的炎国特色，其以共和主义为核心，并向进步主义的方向发散出两点。这三条主线也被梅花主义者概括为民权、民和、民生。\n\n居于核心地位的共和主义，其代表的政治诉求也很简单，即推翻炎国现有的君主制度，消灭各阶级之间的等级秩序，建立一个自由平等的议会制民主国家。民和主义则有两个层面的指向，首先反对炎夏主体民族对其他少数族裔的压迫，主张各族平等和睦共处，其次是改造旧文化，重塑精神文明，实现全社会的稳定和谐。梅花主义者的民生观点也同样融合了炎国古代的许多政治思想，更加强调人民物质生活的稳定和富足，比起无序竞争的自由市场，他们更青睐进步主义者调控市场、救济百姓的理念。\n\n一如梅花所代表的高洁和坚贞，在一个拥有千年君主制传统的帝国，掀起一场共和主义革命需要极大的勇气，而失败的阴影也时刻萦绕在革命者的心头。但梅花主义者相信胜利终究属于他们，因为严寒的冬日和沉重的霜雪，无法阻止梅花的灿然绽放。"
 technological_liberalism_subtype: "技术自由主义"
 technological_liberalism_subtype_desc: "§Y技术自由主义§!§W（自由主义）§!\n\n“它不再短视，不再软弱，它将超越所有的局限，挽救日渐平庸的一切。这才是科学的应许之义。”——阿伦茨·帕尔维斯（哥伦比亚）\n\n技术官僚是泰拉社会上出现的一个新兴阶层，区别于传统文官和政客，他们具有更多的专业知识，更有能力解决国家面对的现实问题，并对科学与效率有着近乎狂热的追求。技术自由主义将技官政治的理论与自由主义原则相结合，更具体来说，是将控制论的极度理性和自由平等的政治原则相结合。技术自由主义者认为，要实现人类真正的自由和平等，就需要对人类社会进行完全的重构，让政治权力的分配更加合理，让资源配置更加精准高效，让技术进步能第一时间促进人民福祉。而这个蓝图的实现，依赖于控制论与自由主义的有机结合。\n\n技术自由主义者将人类文明的升格为己任，他们认为科技飞升是人类文明升级的先导，因此会调集一切资源和力量以促进科技革命。同时，他们也认为人类幸福在这个过程中不能被忽视，因此相比一般的技官统治支持者，技术自由主义者会更关注技术在民生方向的转化。技术自由主义还认可民主政治的重要性，将其视为人类文明走向更高阶段的必要条件，所以技术自由主义者更欢迎人民对其进行监督、批评与建议，也主张在技术官僚内部实行民主选举与决策，以保证科学与民主并存于治理实践之中。"
 anarcho_capitalism_subtype: "无政府资本主义"
 anarcho_capitalism_subtype_desc: "§Y无政府资本主义§!§W（自由主义）§!\n\n“对财富生产的控制，就是对人类生活本身的控制。”——费德里克·海耶斯（莱塔尼亚）\n\n资本主义对泰拉文明的巨大贡献，除了使生产力得到空前发展之外，便是催生了各种挑战传统社会的意识形态。而在这些意识形态中，最为新奇的一支便是无政府资本主义。无政府资本主义的底层逻辑十分简单:市场既然是能通过自我调节实现资源最优配置的全能存在，那么还需要政府做什么呢？\n\n虽然无政府资本主义的理论家们提出了诸如“互不侵犯原则”“契约社会”之类的说辞，将其描述为一个提倡资源自由流动、企业自由竞争、个人自由发展的意识形态，但真正在实践这一理论的地方展示了另一个现实。几大巨型企业垄断了社会的方方面面，政府完全被各式承包商取代，金钱成为全社会的唯一崇拜对象。由于政府不复存在，民主选举失去了意义，所有公民都是这个或那个企业的员工，只需要服从经理和主管的命令行事。商业巨鳄们将国家作为棋盘，玩弄自由竞争的市场游戏，而普通人则被迫接受奴隶般的劳动契约，并将薪酬用来购买一个又一个被巨企们私有化的公共物品，以维持自己唯一拥有的东西——生命。"

#保守主义
 conservatism: "保守主义"
 conservatism_noun: "保守主义"
 conservative_subtype: "保守主义"
 conservative_subtype_desc: "§Y保守主义§!§W（保守主义）§!\n\n“真正的法律是符合自然的正确理性……试图改变这项法律是一种罪过，也不允许废除它的任何部分，更不可能完全废除它。”——基凯罗（古阿加门）\n\n保守主义是民主意识形态的一个分支，主要特点为对制度变革持否定态度，在文化立场上倾向传统和民族主义。在实践中，保守主义通常只指代那些在民主政治框架下产生的保守派意识形态。民主政治是保守主义的一个重要前提，在保守主义者眼中，民主体制是建构政治文明的关键一环，同样是他们需要维护的光荣传统。也因此，保守主义者在排斥左翼的同时，与那些抵制民主制的激进右派也同样关系恶劣。保守主义者也因此被冠以“保守建制派”之名。\n\n保守主义者在社会治理方面，通常更倾向大政府模式，主张扩大政府权力，让政府回到传统的“公共服务提供者”的角色。但他们也强调市场的自由竞争，因为在这些资产阶级眼中，资源在市场中的自由流动，同样也是不可改变的世界规律。"
 conservative_liberalism_subtype: "保守自由主义"
 conservative_liberalism_subtype_desc: "§Y保守自由主义§!§W（保守主义）§!\n\n“当获得政府帮助的欲望蒙蔽了我们的双眼，看不清它所具有的伤害我们的巨大权力，这个时候，政府是最危险的。”——雷蒙德·切尼（哥伦比亚）\n\n资本主义带来了滚滚不断的财富，但也带来了滋生罪恶和堕落的温床。在这一层面上，保守自由主义者是贪婪的：他们无法放弃拜金主义，但又希望传统美德能够重塑社会与国家。与传统的保守主义者不同，保守自由主义者在强调传统道德之余，在经济上采取了自由主义的立场。经济并不是政府应当干预的领域，政府应做的事在经济之外，例如维护法律权威、引导国民道德和打击犯罪。\n\n现实中，模糊的权力边界是保守自由主义面临的最大难题。其中一些人认为，维护市场的秩序同样是政府的职责，但另一部分人却笃信着市场的自我调节。当面对这种分歧时，保守自由主义的保守本色大多时候会占据上风。实用主义的道路已经向历史证明了自己的效果，那么保守自由主义者需要做的只是坦然接受。"
 religious_democracy_subtype: "宗教民主主义"
 religious_democracy_subtype_desc: "§Y宗教民主主义§!§W（保守主义）§!\n\n“日间，萨科塔见天上乌黑，不见太阳。夜间，魔鬼的军兵追来，戕害众多萨科塔。萨科塔失去许多辉光。众圣徒说：跟随我。于是石塔矗立。众圣徒说：聆听我。于是钟声鸣响。”——拉特兰经典《创城记》\n\n任何宗教都是向善的，而一个人民能够充分发声、政府为社会提供服务与保护的社会，显然与大多数宗教的价值观是相吻合的。宗教民主主义就试图将宗教和资本主义民主制相结合，以在虔信者群体之中获得支持。这种意识形态既可以作为落后国家将保守势力和进步派凝聚在一起的纽带，也可以是民主国家中的保守派抵制进步主义侵蚀的盾牌。\n\n宗教民主主义者在其他领域的政策非常灵活，在这一层面上，他们可能是最坚持实用主义立场的一群人。他们会支持充分竞争的市场，因为这符合宗教伦理，但他们也可能同意限制企业对劳工的剥削，因为教义不允许压迫弱者。因此宗教民主主义并不总是属于右翼的阵营之中。他们不会改变的只有一点，那就是对宗教本身的忠诚，并且会持之以恒地为民主主义与宗教的融合而努力。"
 populist_conservatism_subtype: "民粹保守主义"
 populist_conservatism_subtype_desc: "§Y民粹保守主义§!§W（保守主义）§!\n\n“在保卫自由时，极端不是恶。在追寻正义时，中庸不是善。”——道恩·查尔斯（哥伦比亚）\n\n民粹主义在许多语境中带有贬义的取向，常常被认为是一种操控民意的行为，因而民粹主义者多给人留下狂热煽动者的印象，但这一印象在民粹保守主义者身上并不适用。他们与传统意义上的政客并无不同，看上去温文尔雅、博学多识，在进行政治活动时也不似那些草根政客一般大大咧咧，而是像其他的保守派人士一般，遵循着传统的礼仪与日常道德。\n\n但一旦他们开始讲述他们的政治理念，人们就会发现，他们与其他民粹主义者别无二致。他们对时下的民主政治持怀疑和批评态度，鼓吹变革的必要性，以让这个制度更加符合大众的利益。他们更偏爱产业保护和强效监管而非绝对自由的市场经济，也对公共服务和社保体系持欢迎态度，同时对激进主义和进步主义施以白眼。民粹保守主义的支持者大多为农民或小业主之类的有产者，他们不像最底层的群众那么激进，但同样也缺乏在政府中的发声渠道，而民粹保守主义为他们提供了这种希望，一个让国家按照他们的意愿前进的希望。"
 neoconservatism_subtype: "新保守主义"
 neoconservatism_subtype_desc: "§Y新保守主义§!§W（保守主义）§!\n\n“一切法律中最重要的法律，既不是刻在大理石上的，也不是刻在铜表上的，而是铭刻在公民的内心里。”——雅克·罗素尔（高卢）\n\n无论在西方还是东方，托古改制在历史上并不鲜见，通过挖掘传统的政治智慧并对其重新定义，有时候保守派也可以成为变革的先锋。新保守主义是一个年轻的政治理念，事实上都难以被称作一种意识形态。新保守主义通常秉持传统价值观，但对其的阐释却与其他保守派不同。相比于关注制度和价值观本身，新保守主义者更愿意关注构成这些价值观的要素，这也让他们与进步主义者有很多的共同话题。在新保守主义者看来，他们所坚持的保守主义是对民众生活和其构成的现代文明的维护，而不是无视社会自然的新陈代谢，一味地开历史倒车。\n\n基于他们对保守主义的全新阐释，新保守主义者对社会福利、平权运动等进步议题持开放态度，甚至会积极地参与和推动相关立法。新保守主义者认为，这些发祥于公民社会中的变革，能够成为凝聚整个国家和民族的新的基石，进而化作传统价值不可割裂的一部分。毕竟，如今人们口中的传统，在历史上也源于先民脑海中闪过的一瞥灵光。"
 paternalistic_democracy_subtype: "家长制民主"
 paternalistic_democracy_subtype_desc: "§Y家长制民主§!§W（保守主义）§!\n\n“一个人越是诚实，就越不会怀疑别人的虚伪，卑鄙的灵魂总是为高贵的行为预设最卑鄙的动机。”——基凯罗（古阿加门）\n\n家长制民主是民主主义的一种特殊存在形态，它基于一个常见的政治怀疑:人民不知道他们想要什么。家长制民主主义者的回答是，正因为人民仍然不清楚自己的所来所往，精英阶级需要扛起社会大家庭中家长的重担，通过政治宣称和教育，使人民从懵懂走向成熟，并在这之前保护人民生活和国家稳定不受威胁。不论这种“民智未开”的状态是真实存在，还是精英们一厢情愿的想象，家长制民主主义者都会据此制定自己的政策。\n\n一窥家长制民主主义者的政治观点，人们多会感叹，这些人确实很像家族中的大家长。一方面，家长制民主主义倡导社会救济和劳动保障，要求政府保障公共服务的提供，但另一方面，他们也会通过大量的政治宣传来引导选票流向，并通过文化和教育产业灌输保守价值观。民众不需要怀疑民主的真实性，因为家长永远会为孩子们提供最好的。"
 parliamentary_monarchy_subtype: "议会君主制"
 parliamentary_monarchy_subtype_desc: "§Y议会君主制§!§W（保守主义）§!\n\n“我在你们所有人面前宣誓，无论此生短暂或漫长，我都将会为维多利亚的全体人民、为我们同属的帝国家庭鞠躬尽瘁，奉献一生。”——亚历山德莉娜·维娜·维多利亚（维多利亚）在某一时间线的加冕仪式\n\n君主曾是国家的同义词，但泰拉正在变化。一些君主仍手握杀生予夺，一些君主被他们的人民抛弃，还有一些君主在放弃了部分权力之后，依然端坐在王座之上。议会君主制是一种既新颖又古旧的政治形态，其保留了君主制但剥夺了君主的大部分权力，国家真正的权力中心是以民主主义原则组织起来的议会。君主名义上仍是国家的领袖，但再也无法随心所欲地支配一切。\n\n根据改革措施和文化传统的不同，议会君主制的具体形式也有所差别。有些君主仍然保留了如任免首相或否决法令的权力，能够在一定程度上干预政治。有些国家的议会仍是由贵族与官僚占据多数，真正的民选政客难以成为政府的一员。但无论如何，民主的盒子已经打开，已经存在于泰拉大陆上的议会君主制国家，是走向真正的民主与自由，还是退化成威权政治的又一层遮羞布，只有历史能对此作出回答。"
 eastern_constitutionalism_subtype: "东方立宪主义"
 eastern_constitutionalism_subtype_desc: "§Y东方立宪主义§!§W（保守主义）§!\n\n“人君之于天下，不能以独治也。独治之而刑繁矣，众治之而刑措矣。”——顾绛（炎）\n\n炎虽旧邦，其命维新。东方的改革者们认为，文明之所以能在历史的洪流中屹立不倒，并非因为她是一块冲刷不倒的巨石，而是因为她是流水本身，而水最擅长的便是改变自己。炎国的体制已经无法适应如今的泰拉，只有因时代浪潮而变，帝国才能真正地走向下一个千年。\n\n东方立宪主义的思想发端于近百年前的反乾起义，当时的思想家们从反对大乾王朝的暴政出发，进而对整个君主专制制度提出了质疑。随着后世对反乾民主思想的进一步发展，加之西陆启蒙思想的传入，东方立宪主义应运而生。虽然高傲的东方文人并不接受这一带有浓厚中陆政治文化色彩的名称，但这个名字确实说明了这一意识形态的特点。区别于西方话语中的立宪主义，这些炎国改革者认同用法律来规范统治秩序、约束统治者与官员的做法，但他们对选举民主却充满怀疑。他们认为这种将权力过分下放的制度会影响治理的科学性，因为“人民并不知道他们想要什么”。他们更信任经受过历史检验的科举和公议制度，科举制可以选拔优质的精英进入政府，并在层层遴选和提拔后，培养出真正心系百姓的决策者，法律化的公议制度则可以让百姓拥有发声的权利，又不至于过分干预决策。因此，他们更注重扩大文官体制的统治基础，并且反对政府对经济的过度干预，因为这有损民众的进取之心，从而威胁帝国的未来。\n\n在政治光谱上，虽然东方立宪主义拥有极强的改革倾向，但其仍然被视为一种保守的意识形态，这是因为在除去其对于民主政治的怀疑后，东方立宪主义对君主制和传统道德的态度同样是保守的。东方立宪主义者认为君主制和相伴其生长的炎国传统道德，是维系炎国文明的根基，这一体系同样应当被改造得更加现代，但并不代表它应当被彻底抛弃。这也显示了东方的改革者们内心的挣扎与恐惧，在谋求变革的表征下，他们对这套古老的制度能否适应新的药引感到忧虑，害怕自己与整个国家一同跌入万劫不复的深渊。"

#威权主义
 authoritarianism: "威权主义"
 authoritarianism_noun: "威权主义"
 authoritarian_democracy_subtype: "威权民主主义"
 authoritarian_democracy_subtype_desc: "§Y威权民主主义§!§W（威权主义）§!\n\n“对我来说，所有分割和约束各派的制度都是次要的。我首先想到的是莱塔尼亚，她的国际地位，她的独立性，我们的组织方式，以让我们在泰拉自由呼吸。”——劳恩堡大公（莱塔尼亚）\n\n威权民主主义实际上是一个宽泛的政治名词，并不指代某一具体的意识形态。正如其名称所示，威权民主主义同时具有了“威权”和“民主”两个看似水火不容的特性。其威权倾向在现实政治中的表现，多为对传统价值的维护，强硬的对外政策，以及扩大政府的经济和政治职权。民主主义的定位，则说明其政治运作依然会基于民主和法制的框架下进行，至少不会像独裁者一般明目张胆。\n\n常见的威权民主主义者，多为民主国家中持有强硬立场的政治人物。一个立场右倾的政党领袖，一个权力巨大的帝王式总统，或是一个在危机时期采取临时的强硬措施的民选领导人，都可以被归为威权民主主义者。在此类政治人物治下，政府的权力将前所未有地扩大，民主的声音虽不非法但也会被暂时压制，此时公民们只能暗自祈祷，这种状态会在下一次选举或危机结束之后得到改变。"
 rightwing_populism_subtype: "右翼民粹主义"
 rightwing_populism_subtype_desc: "§Y右翼民粹主义§!§W（威权主义）§!\n\n“在群体之中，绝对不存在理性的人。因为正如我们前面所说，群体能够消灭个人的独立意识，独立的思考能力。事实上，早在他们的独立意识丧失之前，他们的思想与感情就已被群体所同化。”——高登·勒本（高卢）\n\n右翼民粹主义发端于花语运动的后期，其最主要的支持者，是那些对声势浩大的进步派心存恐惧的平民百姓。在他们的记忆中，传统仍然代表着荣耀，并且这种荣耀不是上层精英的创造，而是实打实的属于他们这些遵纪守法、艰苦劳动的平民的荣耀。但社会主义者吹嘘了太多的空头支票，威胁着他们坚信的传统价值，而自由主义者对此漠不关心，那些商人们只关注如何从平民身上榨取更多财富。而右翼民粹主义者嗅探到了这种不满，他们恰如其分地提出了全新的政治观点。他们一方面坚定地抵制进步派鼓吹的社会变革，另一方面又向百姓许诺，他们会建立更全面的社会保障，促进经济的再度振兴，让发展红利真正属于创造它的人。\n\n不少建制派批评右翼民粹主义者是借着鼓动民粹攫取选票，实际上是一种无耻的政治操弄。只不过这种批评不会伤到右翼民粹主义者分毫，因为他们可以将原话复述给支持他们的民众，以此证明精英阶层对他们的不满和恐惧，然后就可以坐等渴望改变的选民，用选票将他们送进首都。"
 rightwing_nationalism_subtype: "右翼民族主义"
 rightwing_nationalism_subtype_desc: "§Y右翼民族主义§!§W（威权主义）§!\n\n“无论我们是否愿意，变革的洪流都会席卷整片大陆，民族意识的增强客观存在于政治领域。”——斯托克顿伯爵（维多利亚）\n\n民族主义与右派在意识形态上天生亲近，因此右翼民族主义的诞生可以说是天作之合。右翼民族主义者持有强硬的民族主义立场，并主张采取威权主义的政体和政策。通常来说，右翼民族主义支持有监管的自由市场，也会提供必要的公共服务，政治上则倾向采用强人政治或有限民主的大政府。但无论右翼民族主义者采取何种政策，都必然是服务于他们民族主义的目标。\n\n右翼民族主义可以被全泰拉的民族主义者所采用，不论他们是希望从其他帝国手中获得独立，还是谋求延续祖国的光荣，高效的威权主义显然是诱人的选择。通过开动强大的政府宣传机器，整个民族可以迅速地被唤醒，然后团结在同一面旗帜之下，为了一个共同的目标而奋斗，而政府又将成为妥善利用这种凝聚力的工具。"
 authoritarian_corporation_subtype: "威权企业制"
 authoritarian_corporation_subtype_desc: "§Y威权企业制§!§W（威权主义）§!\n\n“人类有很多危险的性格，由于存在发财机会而导入较为无害的路途；如果没有这条宣泄的途径，这些危险性格或许会发展成残暴、不顾一切地唯个人权势是图以及其他形式的自大狂。”——约翰·凯熙（维多利亚）\n\n企业国家是一个新颖的概念，保守政客对这种异端的国家学说嗤之以鼻，进步活动家则是担忧其中广泛的剥削与压迫。实际上，以运营企业的方式去治理一个国家的确是不切实际的幻想，因此需要引入其他的政治理念，比如威权主义。\n\n威权主义实际上与企业制非常契合，因为许多企业家在企业之中便是以帝王的方式行事，奖励忠诚者，处理反对者，唯一的不同可能是古代的王国中没有工作绩效。在这一类企业国家中，企业的领导人往往兼任国家的领袖，或是通过各种手段把政客们变成了傀儡。通过这个表面上的政府，企业可以建立起一定程度上的威权统治，进而直接对整个国家进行管理。应该来说，威权企业制在企业国家当中属于较温和的那一类，因为政府在表面上仍与企业分属两个体系，企业在社会治理中仍然无法超越政府的角色。但对于民众来说，成为这个企业的忠实客户和终身雇员，已经成为了在出生和死亡之外，人生无法逃脱的一环。"
 dual_monarchy_subtype: "二元君主制"
 dual_monarchy_subtype_desc: "§Y二元君主制§!§W（威权主义）§!\n\n“我是天意的工具，她用我完成她的设计，然后就会像打碎玻璃一样将我打碎。”——科西嘉一世（高卢）\n\n不管君王们愿不愿意承认，君主制已越来越难以适应这片大地出现的变化。出于维护自己地位的现实需要，以及偶有出现的伟大政治理想，君王们主动或被动地对制度进行了改革，二元君主制便是成果之一。这套制度在保留了君主的大量权力的同时，将立宪民主引入其中，使得国家得以迈入现代政治文明的门槛。\n\n在实践当中，二元君主制的实际效果难以论说，很大程度上仍然取决于君主的个人能力与自觉。由于君主仍然保有了如否决法令或调动军队的极大权力，名义上的宪政政府无法对君主形成有效的约束。在许多采用了二元君主制体制的国家，君王与政府间的争斗已经成为了常态，即使在那些愿意分享权力的君主治下，议员们也终日提心吊胆，因为他们的权力不知何日就有可能被收回，这一切仍然取决于君主的意志，与千百年前没有什么不同。"
 oligarchy_subtype: "寡头政治"
 oligarchy_subtype_desc: "§Y寡头政治§!§W（威权主义）§!\n\n“我们的哥伦比亚体制——或者说哥伦比亚主义，或者说资本主义，随你怎么称呼它——只要我们用双手抓住它并充分利用，它就会给我们每个人一个巨大的机会。”——萨尔瓦多雷·德克萨斯（哥伦比亚）\n\n寡头政治指的是权力掌握在少数寡头人物手中的政治体制。“寡头”的身份可以多种多样，可以是手握重兵的军头，也可以是垄断企业的主人，但他们的共同点就在于手握政权，能够通过这一体制操控政治，掌握整个国家。形成寡头政治的原因同样很多，可能是多名寡头联合将政府架空，可能是几个政治强人联手治理国家，还可能是某国自古以来的寡头传统。\n\n寡头政治的民主程度较高，多个寡头的存在本身就避免了一人独裁的风险，也使得寡头政治的决策科学性会胜过其他专制政体。在一些比较开明的寡头政府治下，国民也可以拥有一些民主权利，甚至能够通过选票决定国家的领导人。但这种“民主”终归是虚假的门面，权力仍然只是在几个集团之间流转。不过对于生活在那些更加残暴的寡头手中的人民来说，拥有这种虚伪的权利已经是一种奢望。"
 stratocracy_subtype: "军政体制"
 stratocracy_subtype_desc: "§Y军政体制§!§W（威权主义）§!\n\n“军人最可取的品质就是在疲倦中坚持不懈；勇气只是第二位的。”——科西嘉一世（高卢）\n\n军队不一定总是反动力量的代表，在某些特殊情境下，军方反而有可能是最为进步的力量。军政体制相较于人们通常理解的军政府，具有更多的民主色彩，政府只是受到军事监管而非被完全关闭，政治活动也没有被彻底禁止，人民的权益也会得到充分尊重和保障。军队内部也保留了一定民主，士兵和军官都可以对政府的政策发表意见。这种特殊的军政府一般出现在较为落后的国家，由较为进步的军方带领国家向前发展，或是某些拥有高尚道德和理想的军事领袖，为了拯救危机中的国家所采取的紧急手段。\n\n军政体制最严重的结构性危机，便是其开明统治的基础极为脆弱，完全依赖于军队和领袖个人的自觉。若是某些野心家将开明的军事领袖取代，那么这一体制便会迅速蜕化为专制的军政府统治，变得和其他的军阀头子没有任何区别。"
 technocracy_subtype: "技官专制"
 technocracy_subtype_desc: "§Y技官专制§!§W（威权主义）§!\n\n“如果你病了，你是召集民众为你治病呢？还是去找医术精湛的大夫呢？你一定会去找医术精湛的大夫，那么治理一个国家，其责任和难度远远大于一个大夫，你该找谁呢？”——帕拉托（古米诺斯）\n\n技官专制是官僚制度的发展中出现的一个变体，居于其核心的是技术官僚而非传统的文官。技术官僚的特点决定了技官专制的特点，即以效率与秩序为准绳，将技术的发展与高效的生产作为目标。基于这种政治追求，技官专制必然会与传统的文官专制进行切割，因为后者代表了腐败与低效。控制论为技官专制的重要理论依据，技术官僚们相信，通过科学严谨的制度安排，他们可以探索人类社会效率的极限，并据此让社会的每个原子各安其所。而在这一探索的过程中，投票选举和议会吵架之类无意义且低效的活动完全没有必要存在，民众对制度安排的反对也不需要关注，因为乌合之众不可能理解如此伟大的事业。\n\n作为一个新兴的阶层，技术官僚的力量在泰拉仍然很弱小，仅仅在几个发达的国家存在，建立技官专制的统治也被人们认为是一种恐怖的幻想，而非可以实践的政治理念。但支持这一意识形态的技术官僚们坚信，他们代表了泰拉文明未来的真正方向。"
 eastern_authoritarianism_subtype: "东方威权主义"
 eastern_authoritarianism_subtype_desc: "§Y东方威权主义§!§W（威权主义）§!\n\n“臣闻天之所大奉使之王者，必有非人力所能致而自至者，此受命之符也。天下之人同心归之，若归父母，故天瑞应诚而至。”——董生（炎）\n\n位于泰拉大陆最东端的炎国，是泰拉历史上延续时间最长的君主制国家之一，帝制的烙印已经深深的刻在炎国的政治基因中。这套在千年之中不断完善的集权体制，让炎国可以将神明敕封，将异族外敌逐出中原，必然也可让炎国坐上泰拉一极的宝座，因而所有对这套体制的质疑和挑战，都是没有必要且大逆不道的。\n\n炎国的中央集权君主专制被称为东方威权主义，之所以为之赋上一个崭新的名号，是因为其在不断的自我革新中，已经与通常意义上的君主专制截然不同。自炎朝建立以来，历代统治者都主动推进政治制度的变革，因为没有哪个皇帝愿意重演大乾王朝的最终篇章。而在顾绛等众治派思想家的门客进入政府、参与改革后，炎国的权力分配开始出现变化。皇帝仍然是帝国的最高统治者，但大量的权力已经被文官政府分割，而后者逐渐成为了帝国的实际掌控者。文官集团在政治实践中，开始是作为沟通皇帝与百姓的桥梁，而最终却成为了政治体系的中心。皇帝必须依靠经验丰富的文官治理庞大的国家，朝廷的决策也依赖于三公九卿的建议。百姓的生计则须仰仗当地的“父母官”，因为经济发展到社会安定都与这些专业官僚相关。而文官集团自身又通过科考制度与传统道德的制约，确保了其自我更新与自我限制。帝国因此可以拥有秩序和繁荣，这套体系本身也将延续至下一个千年。至少人们希望如此。\n\n与外人的刻板印象不同，东方威权主义并不排斥变革。这一体系的存在价值便在于维护其自身的存续，因此有利其延续的革新是不可能被拒绝的。具体来说，当今时代的东方威权主义者希望建立一个更强大的政府，能够将反复无常的经济和民心都牢牢控制在手中。只要整个国家都在统治秩序当中各安其位，那么文明就能在历史的浪涛中行稳致远。"

#专制主义
 despotism: "专制主义"
 despotism_noun: "专制主义"
 dictatorship_subtype: "独裁专制"
 dictatorship_subtype_desc: "§Y独裁专制§!§W（专制主义）§!\n\n“一切权威都在王座之中；王座是什么？是这个覆盖着丝绒的木架子吗？不，我就是王座。”——科西嘉一世（高卢）\n\n独裁专制特指由独裁者一人独揽大权的政治形态，是权力最为集中的政治体制之一。一般来说，独裁者并没有什么政治理想和合法性，他们的权力来源于铁腕手段而非民众或法律，而他们本人也对实现治理目标缺乏兴趣。将权力掌握在自己手中是独裁者唯一关注的政治目标，而为了达成这个目的，他们也会无所不用其极，从制定可笑的法律到豢养一支忠诚的打手部队，将自己的亲信塞满整个政府。国家体制的一切设计是为了满足独裁者的权力欲望和物质享乐，而经济的发展、社会的安定、人民的未来，则完全是听天由命。也许这会让国家滑向深渊，但独裁者们从不在乎。\n\n不可否认，在特定情况下，有些独裁者会为了某些个人的理想，将整个国家作为实现理想的工具，而这也可能为国家带来制度的变革或是经济状况的改观。但人们很难评价，这些将整个国家作为自己野心的赌注的独裁者，会比那些单纯的权力怪兽更好还是更坏。"
 papacy_subtype: "教廷专制"
 papacy_subtype_desc: "§Y教廷专制§!§W（专制主义）§!\n\n“真正的律法从来就只有一条。——让我们的存在延续下去。”——教宗伊万杰利斯塔十一世（拉特兰）\n\n教廷专制，顾名思义，是以一种宗教力量为核心的、以专制统治为手段的政治体制。泰拉最著名的教廷专制国家为拉特兰，但这并不意味着这一体制独属于拉特兰正教所有。教廷专制的内核与其尊奉的宗教并没有直接关联，在教廷专制国家中，并不存在独立的世俗权力，一切事务都含有宗教色彩，在名义上都为宗教而服务。其最高统治者首先为宗教领袖，其次才是为神明代行世俗权力的裁决者。宗教教义几乎等同于国家律法，在束缚信徒的同时，也对教会起到了一定制约。\n\n与传统认知中的专制制度不同，教廷专制具有一定的民主色彩。出于朴素的宗教观念，宗教领袖的产生可能遵循禅让或选举的原则，神职者的任免也需要遵循一定的程序。但神明与教会的地位毕竟不可动摇，政府的大门也永远不会对普通百姓开放。对于异端者和民主主义者来说，在教廷的羽翼下生存的日子，与活在军阀的枪口下无异。"
 absolute_monarchy_subtype: "君主专制"
 absolute_monarchy_subtype_desc: "§Y君主专制§!§W（专制主义）§!\n\n“因为自然的（世袭的）君主侵害人民的理由和必然性都较少，所以他理当更受爱戴。只要没有超乎寻常的恶行使他为人所憎恨，那么合乎情理的是，他将自然而然地获得（民众的）好感。”——尼科洛·马契托维（叙拉古）\n\n君主制为泰拉大陆上最古老的政治形态之一，其核心为君主专制统治，辅以一套严密的行政体系和国家道德，用于巩固君主统治和维护国家的持续运转。君主在法理上和实质上均为国家的最高领导人，独揽国家的一切权力。君主可以选择与其所信任的大臣或机构分享权力，同样也可以随时凭自己的意愿将权力收回，因为一切权力的来源均为君主本身。君主制的权力传承遵循世袭制的原则，王位只会在君主的后裔或家族分支中传承，这种传承方式也让宫廷阴谋和继承战争从古至今都经久不衰。\n\n随着泰拉政治文明的不断发展，君主专制遭到了越来越多的质疑，一些国家的君王也选择了放弃部分权力以维持地位或促进国家的发展。但权力一旦染上就难以戒除，在泰拉的许多地区，君主们仍然独揽权柄，口含天宪，静待历史的车轮碾来——或是与他们擦肩而过。"
 military_junta_subtype: "军政府"
 military_junta_subtype_desc: "§Y军政府§!§W（专制主义）§!\n\n“每个士兵都觉得自己的所作所为有道德的成分。但所有战争都是非道德的，想得太多，你就不是个好兵。”——艾莫斯·奥古斯特（哥伦比亚）\n\n军政府指的是军队直接控制权力的政府组织形式。军政府的成因多种多样，最常见的即是军事政变，但也有文官政府邀请军队以控制局面的先例。通常来说，军政府意味着军队会使用他们最熟悉的方式治理国家，即军事管制和镇压。反对政府或要求民主化显然是非法的，一些温和无害的社会活动仍然被允许，但也会受到军队的严格监管。\n\n军政府的权力分配并不总是固定的，有时是单一将领的个人独裁，有时则是在山头林立的军队之中分享权力。军政府与其他专制统治者的不同之处，在于他们清楚地知晓一点，他们的权力缺乏合法性。因此军政府比其他独裁者更乐意推动社会进步和经济发展，甚至对未来的民主化持开放态度。军政府也有可能选择迈向军国主义的道路，这种情况一般出现在较为弱小而又面临领土争端的国家。"
 civilian_dictatorship_subtype: "文官专制"
 civilian_dictatorship_subtype_desc: "§Y文官专制§!§W（专制主义）§!\n\n“不仅在君主国，而且在民主共和国，国家依然是国家，也就是说仍然保留着它的基本特征：把公职人员，‘社会公仆’，社会机关，变为社会的主人。”——康拉德·克内希（卡兹戴尔）\n\n文官存在的历史，可能与泰拉的国家存在的历史一样漫长。文官群体在人们眼中常常具有两副面孔，温和又理智，腐朽而低效，而文官专制便是结合了这两种印象的政治体制。一方面，文官专制相较于其他的威权政体更为“文明”，他们尊重法律和制度，无理由的暴力镇压之类的手段并不多见，一部分文官专制政府甚至会允许合法反对派的出现。另一方面，文官专制仍然是一种集权专制制度，权力只在文官政府内部转移，无论是执政党还是“反对派”都不过是粉饰这种制度化专制的工具，而贪腐与裙带关系在政府中更是常态。\n\n比起其他专制政体，文官专制的确更加吸引人一些。由于官僚体系的自我更新，民众拥有成为公务员并进一步成为权力分享者的机会。经过政治训练的官僚，其治理下的国家也会比其他独裁政府拥有更稳定的社会秩序和经济增长。只要不去追寻“虚无缥缈”的政治权利，文官专制治下的生活对泰拉的大多数人来说，已经足够美好了。"
 colonial_government_subtype: "殖民政府"
 colonial_government_subtype_desc: "§Y殖民政府§!§W（专制主义）§!\n\n“我想说殖民主义是一件很棒的事情。它把文明传播到西陆。在此之前，他们没有书面语言，没有我们所知道的轮子，没有学校，没有医院，甚至连普通的衣服都没有。”——伊尼戈·塞拉斯（伊比利亚）\n\n伊比利亚对西陆的大发现拉开了大殖民时代的序幕，而当大静谧与西陆独立运动让潮水退去，仍有数个殖民政府顽强地扎在大地的各个角落。殖民政府是负责管理殖民地、协调殖民活动的文官机构，其完全从属于宗主国，殖民官员大多从本国派遣而来，少数底层官僚可能来自当地的合作者。根据不同宗主国的殖民政策，殖民政府的统治风格也不尽相同。有些殖民政府可能与当地人开展有限的合作，扶持起值得信任的本地力量，有些殖民政府则干脆将当地人甚至殖民者排除在政府之外，只信任来自母国的文官与军队。\n\n殖民政府的统治方式无疑是专制的，殖民当局掌握着立法、行政和司法的权力，一切忤逆当局和宗主国的行为，都会被定罪并投入监牢。殖民军队也完全听命于殖民政府，在当地人的怒火难以压制时执行最终解决方案。鉴于殖民开发程度的不同，殖民政府有时甚至掌握操控殖民地经济运作的权力，而这也使得某些殖民地的官职成为了其母国的一种肥差。"
 feudal_aristocracy_subtype: "封建贵族制"
 feudal_aristocracy_subtype_desc: "§Y封建贵族制§!§W（专制主义）§!\n\n“你们这些贵族，我手下杰出之人的子孙，软弱而花哨，迷信你们的出身和财富，不关心我的命令和自身的进步，你们忽视了对学问的追求，沉溺于享乐、懒惰和愚蠢的运动中。”——弗雷德曼大帝（莱塔尼亚）\n\n君王的权力并不总是能延伸至国家的每个角落，在中央难以触及的地区，精明的统治者会选择册封当地实力派或自己的亲信，代行国家职权，维护名义上的统治。这种在旧时代盛行的政治体制被称为封建制度。这些封建贵族与中央政府的联系非常松散，除了为上层贵族缴税和派兵的义务之外，其在采邑封地内拥有几乎可以与君主相称的专制权力。\n\n作为旧时代的残留，封建贵族制与君主专制有着许多相似之处，但并不像君主制一般，有着诸多约定俗成的规章限制。比如，在官吏的任用上，贵族可以更加自由地选择自己的幕僚与家臣，而不是像君主一般受到选官制度的制约。而贵族在其属地内的经济权力也同样巨大，例如可以征收中央政府规定之外的税款。如此强大的经济和政治权力造就了封建贵族的极大独立性，这也常常成为他们对抗中央政府的底气。"
 resistance_group_subtype: "反抗组织"
 resistance_group_subtype_desc: "§Y反抗组织§!§W（专制主义）§!\n\n“予恐炎土久污膻腥，生民扰扰，故率群雄奋力廓清，志在逐胡虏，除暴乱，使民皆得其所，雪炎夏之耻，尔民等其体之。”——魏渊彰（炎）\n\n能够凝聚起一个反抗组织的意识形态有很多，受压迫民族的抵抗，反对苛政的起义，甚至只是在无边的冻原中勉强苟活，都可以成为一个反抗组织存在的理由。但抛开意识形态不谈，这些反抗组织都具有一个共同点，那就是它们都缺乏一个现代的组织架构，在实践中常常团结在一个或多个领袖周围，而这些运动领袖的权力便顺理成章地变得越来越大，在反抗组织当中实际行使着独裁者一般的专断权力。\n\n解释这种权力分配的角度有很多，例如外部的斗争压力、组织整体较低的政治素养等等。而这种有军事色彩的专制通常是临时的，一些反抗领袖会公开宣称，在取得胜利之后会放弃手中的权力，推动这样或那样的改革。但也有许多的反抗者会被这种权力迷惑双眼，而他们的结局不是在胜利后的争权夺利中摔碎在地上，就是将整场运动带向与胜利相反的方向。"
 sargon_monarchy_subtype: "萨尔贡君主制"
 sargon_monarchy_subtype_desc: "§Y萨尔贡君主制§!§W（专制主义）§!\n\n“拿酒来呵！让我就着蔷薇与眼泪，缓缓入睡。”——萨尔贡诗歌\n\n在哥伦比亚的殖民者举起独立的旗帜之前，梦魇的铁蹄踏碎泰拉的一切之前，阿加门的雄主东征至大地尽头之前，萨尔贡便已存在。各个文化迥异但共同生活在这片土地上的文明，将他们之中最强大国家的主人尊奉为“万王之王”，作为所有萨尔贡人的皇帝。皇帝通过派出他信任的帕夏去管理诸王酋，帕夏和王酋则为皇帝奉上萨尔贡的一切。\n\n时过境迁，萨尔贡的荣光早已被淹没在扎伊尔湖底，与那条丑陋的运河一起被冲进深海。万王之王的号令只能在沙尔-阿加德和她的郊区被忠诚的人民传唱，而更为遥远的大漠与雨林中，名义上仍然服从于黄金之城的帕夏和当地王酋掌控着那里的一切，皇帝能从他们手中获得的，除了被层层克扣的税款和聊胜于无的奇珍异宝，再无其他。\n\n不论如何，端坐在沙尔-阿加德的皇帝仍然掌握着一个专制君主应有的权力。忠诚的官员仍然可以得到任用，皇帝制定的法令仍然可以成为国家的意志，黄金之城仍然歌舞升平。只是，萨尔贡的未来，已经不再是万王之王的意志可以决定的了。"
 primitive_tribe_subtype: "原始部落"
 primitive_tribe_subtype_desc: "§Y原始部落§!§W（专制主义）§!\n\n“萨米部落的核心是‘雪祀’，一个部落只有一个。雪祀除了占卜外，也管理其他世俗事务，至少这些事情我能够看得懂。”——费多特·迭日涅夫（乌萨斯）\n\n部落，对于泰拉的大部分人来说，已经是一个历史名词。但在萨尔贡的丛林里或是萨\n\n米的雪原中，部落对于当地人来说，其意义与国家无异。原始部落通常坐落于与世隔绝之地，其政治架构千奇百怪，有数个部落组成的部落联盟，也有坚持着奇怪传统和信仰的母系或父系氏族，但它们都统一的具有鲜明的前现代特征。\n\n一个部落通常由一个酋长统治，部落的几乎所有权力都集中于酋长一身。但在实践中，酋长并不会像独裁者一般独断专行，而是遵循古老的部落民主传统，与其他成员协商后才进行决策。尽管如此，部落制度依然不能被认定为民主制。毕竟，在许多部落当中仍然实行着原始的公有制分配制度，这是他们在贫瘠的自然条件下生存下来的必须。但如果据此将他们认定为社会主义，左翼分子是会非常不满的。"

#法西斯主义
 fascism: "法西斯主义"
 fascism_noun: "法西斯主义"
 fascism_subtype: "法西斯主义"
 fascism_subtype_desc: "§Y法西斯主义§!§W（法西斯主义）§!\n\n“同志们，现在不是空谈的时候，而是行动的时候；现在不再是语言的时代，而是行动的时代，像阿加门人一样行动！”——加百列·拉帕尼塔（高卢）\n\n法西斯主义是泰拉大陆冉冉升起的新兴右翼思潮的代表，其词源来自曾经统治泰拉核心圈的古阿加门帝国，意为“束棒”。这个曾经属于阿加门保民官的礼器与刑具，如今被用来称呼一个带有强烈威权倾向，宣扬法团主义经济和阶级调和的意识形态，并随着其支持者的狂热宣传，散播到泰拉各国的街头巷陌。\n\n法西斯主义受到了资本主义和社会主义的双重影响，主张将二者结合并探索“第三道路”。与进步主义者不同，法西斯主义者更注重阶级立场，它承认阶级理论，但更提倡阶级合作与调和。法西斯主义者推崇法团主义经济，通过将工人和资本家整合到行会或法团之中，国家得以掌控经济以规避危机，而更合理的劳资关系和传统价值观也可以使阶级关系逐渐得到缓和。对于民主政治，大部分法西斯主义者对之不屑一顾，他们更热衷于建立强大的威权政府，以达成对社会的全面控制。"
 national_imperialism_subtype: "民族帝国主义"
 national_imperialism_subtype_desc: "§Y民族帝国主义§!§W（法西斯主义）§!\n\n“你的前任来到米诺斯，给我们带来了巨大的伤害，尽管我们之前没有伤害过他们。我被任命为阿加门人的领袖，为了惩罚提卡兹人，我来到了卡兹戴尔，这是我从你手中夺走的。”——阿加门的阿莱克修斯大帝给奎隆王的信。\n\n民族社会主义是泰拉有史以来出现过最极端的政治思想，其以狂热的民族主义和极权的政体构想著称。民族社会主义者称其思想受到共产主义启发，实际上也大量的“抄袭”了共产主义的先锋党和国有制计划经济的理论，但其用民族和国家叙事替代了阶级，从而使得他们对异族和异国具有极强的仇恨和侵略性，这又使得民族社会主义者狂热地鼓吹军国主义。另一方面，民族社会主义者也宣称“学习”了法西斯主义的诸多内容，如承认私营企业和法团存在的合理性，以及对领袖的个人崇拜。\n\n民族社会主义的问题在于，如此极端和狂热的意识形态，难以在和平国家的繁荣时代吸引信众，各国政府也会对这些激进分子采取打压的政策。但如果世界陷入混乱，民族社会主义就会在悲伤和愤怒中钻入人们的伤口，然后在大地上撕开一个更大的裂痕。"
 national_syndicalism_subtype: "民族工团主义"
 national_syndicalism_subtype_desc: "§Y民族工团主义§!§W（法西斯主义）§!\n\n“一切都在国家之内，没有什么在国家之外，没有什么能反对国家。”——贝妮黛塔·那玻利尼（叙拉古）\n\n工团主义随着花语运动和工业化走向了泰拉各地，也像自由主义一般出现了诸多变体，而民族工团主义就是其中之一。民族工团主义又称国家工团主义，在叙拉古、伊比利亚这一类相对落后的资本主义国家拥有相当的人气。民族工团主义认可工团主义的政治理念，主张为工人的利益发声，将工会视为斗争和政权建设的中心。但他们同时强调了民族主义的重要性，无论这是出于落后国家的不甘还是没落帝国的自尊，民族的复兴与工人的利益是牢牢绑定在一起的。又出于民族主义的立场，民族工团主义者更倾向阶级合作而非斗争，因为他们认为暴力的革命会损害民族的力量。\n\n正统工团主义者批评民族工团主义抛弃阶级立场，是站在国家的角度鼓吹阶级合作，法西斯主义者则欢呼他们获得了又一个朋友。而民族工团主义者则用革新理论同时反驳了两方，在他们看来，此刻的阶级调和不代表永久的调和，民族工团主义注重自我革新，这意味着诸如旧道德和旧阶级之类的落后之物，会随着这种吐故纳新，被民族工团主义远远抛在身后。"
 corporate_control_subtype: "企业统制"
 corporate_control_subtype_desc: "§Y企业统制§!§W（法西斯主义）§!\n\n“南东国的产业开发是我的画作。对这部作品我感到无限留恋。”——郭贞义（炎）\n\n与法团主义类似，企业统制比起一种政治思想，更像是一个经济理论。企业统制是指在一个国家或地区中，由一个或数个巨型企业控制着社会的方方面面，就连政府公务员甚至国家的领导人，也是企业的成员。一般来说，企业统制国家会将企业的利益置于国家利益之上，并且通过商业行为和铁腕政治控制国家的方方面面。但企业统制最显著的特点，在于其管理层的绝对权力，这一点使企业统制与法西斯主义更为相似，而不是传统意义上的资本主义企业制度。企业统制国家的领袖拥有几近独裁的权力，无论是政治还是商业，都必须遵循其意愿运转，而各层级的管理者也更像是冷血的技术官僚，保证整个国家在精密的计算中不断产出经济效益。\n\n企业国家是对传统政治伦理的一种挑战，而企业统制也许是对这个问题的一种回答。一个完全由资本主义企业组成的国家令人质疑其合法性，但是一个专断的独裁者，一个井井有条的官僚体制，和一个国家主导的繁荣经济，看起来就容易接受得多了。"
 neo_orderism_subtype: "新秩序主义"
 neo_orderism_subtype_desc: "§Y新秩序主义§!§W（法西斯主义）§!\n\n“过去人活着的意义就是去为生存奋斗，而现代人活着的意义是去为祖国而奋斗。”——约瑟夫·艾芬格（哥伦比亚）\n\n新秩序主义在学术上被称为民粹法团主义，是糅合了民粹主义、保守主义和法团主义，并再此基础上加以创新的一种全新意识形态。新秩序主义者并不认可这个学术意义上的名称，他们更愿意以“新秩序”自称，而这种倾向与其精神领袖，艾芬格父子，不无关系。在花语运动声势浩大地席卷哥伦比亚时，老艾芬格敏锐地察觉了这些进步主义者的“堕落”倾向，遂创立了新秩序主义的学说与之对抗。在他逝世后，他的养子辛德勒将他的理论进一步发展并付诸实践，新秩序主义者的政党成为了哥伦比亚的一股不可忽视的力量。\n\n新秩序主义者并不接受将他们与法西斯主义者类比的说法，他们认为自己与法西斯主义有诸多不同之处。例如，法西斯主义者的经济政策被他们认为是变种的社会主义，新秩序主义者们更青睐垄断资本主义经济，认为应当以企业为主发展法团主义经济;新秩序主义者也反对建立极权政府，认为民主制度有可取之处，只是需要他们所带来的“新秩序”对其进行改造。总的来说，新秩序主义者相比其他右翼意识形态，更加关注传统社会的复归和民主体制的变革，但反左派、威权主义倾向和民族主义这些右派的共同点，也是同样存在于新秩序主义身上的标签。"
 national_populism_subtype: "民族民粹主义"
 national_populism_subtype_desc: "§Y民族民粹主义§!§W（法西斯主义）§!\n\n“在我眼前，躺在这城市里的和平生活和他的懒惰的人民；在我灵魂里，反复响着这神圣的字句。‘我要给你们以晨星。’”——波尔卡·萨文科娃（乌萨斯）\n\n为何一个民族已经雄立于泰拉民族之林，她的人民却仍然在温饱线之下挣扎？乌萨斯民族民粹主义者的回答是，腐化的精英攫取了全民族创造的果实，成为了民族走向伟大的真正阻碍。民族若想走向兴盛，真正的能量必然蕴藏在她的人民之中。在这一思想的指导下，民族民粹主义者吸收了法西斯主义和乌萨斯农粹主义的部分要素，提出了乌萨斯民粹革命的几大关键，包括建立共和制、发展以国民中心的法团主义经济、塑造全新的民族文化。\n\n民族民粹主义者主张有限的阶级调和，他们首先将王侯与权贵从这一体系中排除，之后才基于此建立劳资关系的阶级合作制度。在民族主义的层面，他们同样希望重构民族文化，因为旧的民族主义被腐朽的权贵歪曲得太多。不难看出，这样的革命目标在乌萨斯帝国可谓困难重重，因此，民族民粹主义者和法西斯主义者一致，要求组建一个强有力的党，建立起开明的威权统治，如此才能实现对国家与民族的彻底改造，实现民族的真正振兴。"
 extreme_militarism_subtype: "极端军国主义"
 extreme_militarism_subtype_desc: "§Y极端军国主义§!§W（法西斯主义）§!\n\n“没人喜欢战争，确切来说，正常人都不会喜欢战争。除非先在他的意识中如此灌输：他在战争中可以得到什么，以及怎样去得到。”——《战争论》\n\n传统意义上的军国主义，即将军事置于国家的任何事业之上，而极端军国主义更进一步，国家组织的全部力量都为军事工业和军事行动服务，而军事行动的目标，通常为疯狂的对外扩张或民族主义的复仇。军事管制极权政体是极端军国主义存在的保障。只有极权政体才能够打击异见者，才能向国民灌输极端思想，从而让整个国家成为一台战无不胜的战车。\n\n相比其他的右翼意识形态，极端军国主义几乎不去关注社会的建构和经济的发展，在他们眼中，只有战争本身值得关注。他们不会去担忧战争失败可能导致整个体制的崩溃，他们只会尽可能去获得胜利，因为这已经成为了他们的使命，他们的存续基础。一株浮萍去想象没有水和空气的世界，没有任何意义。"

#神秘主义
 mysticism: "神秘主义"
 mysticism_noun: "神秘主义"
 mysticism_subtype: "神秘主义"
 mysticism_subtype_desc: "§Y神秘主义§!§W（神秘主义）§!\n\n“人类最古老、最强烈的情感是恐惧，而最古老、最强烈的恐惧是对未知的恐惧。”——豪威尔·普罗维登（哥伦比亚）\n\n何为“真实”？这个问题在泰拉似乎很难回答，最坚定的唯物主义者也不得不承认，某些无法用现有科学解释的现象确实存在。也正因诸多超自然而不可知之物仍存于世，这些造物又成为了迷茫失意的生灵的精神寄托。其中的有识之士迫切地想要一个更有章法的理论，或是经书，来让他们能够在这片大地上发出自己的声音，神秘主义应运而生。\n\n偏执或神性，实际上都不与神秘主义完全绑定。神秘主义者当中有信仰暴力的凶恶之徒，同样也有全心全意修行积德的虔信之人。神秘主义只有一个共通的特点，即对神秘力量的信仰与推崇，而这并不代表神秘主义就必定与现代文明为敌。信徒们也会承认工业生产的伟力或是民主政治的合理之处，因为这些事物能够存在于世上，也许亦是神的旨意。"
 gods_jurisdictions_subtype: "神祇辖地"
 gods_jurisdictions_subtype_desc: "§Y神祇辖地§!§W（神秘主义）§!\n\n“人似乎是到哪里都是一样的，我在谢拉格见过的喜怒哀乐，到了外面，似乎没有任何改变。真有意思，但也真没意思。”——耶拉冈德（谢拉格）\n\n神明在泰拉大陆上真实存在，而其中不乏对现实仍存兴致之人，一些神明更是会亲自降临世间，对一片土地进行全知全能而至高无上之统治。而祂们的目的，也许是心系苍生，也许仅仅是缺乏娱乐。在神的国度，质疑神明是绝对不被允许的，世俗国家所认同的政治自由和公民权利在神祗辖地是不存在的，民主主义者所言天赋人权，而神祗国度的天就是它的统治者。当然，这并不代表神祗脚下的人民生活在无安火宅之中，若是神明的神性温和而慈爱，神明国度的人们也许会享受着无上极乐，但是相反，恶神也仍然没有离这片大地远去。\n\n但是神明的力量终归是有限的。千年前的东方帝国便能弑神，手握工业伟力的现代人类当然也可以。因此，全能的神明也必须放下身段，拥抱更为至高的历史之神，才能避免自己在黄昏结束后灰飞烟灭。"
 esoteric_realm_subtype: "秘教国度"
 esoteric_realm_subtype_desc: "§Y秘教国度§!§W（神秘主义）§!\n\n“我诅咒你们……我要诅咒你们……直到陆地被淹没……你们会像盐粒一样，逃出大海……最后还是被大海溶解。在你们的尸骨堆砌的贫瘠荒原上，我们鼓动不歇的潮声会在苍白夜空下浸没大陆！”——昆图斯（伊比利亚）\n\n秘教国度是以神秘主义性质的宗教为核心的教权专制国家，其统治的核心为秘教教会，通过信仰灌输和铁腕手段控制整个国家。秘教与其他宗教的不同点，在于其具有极强的封闭性和异端色彩，世俗主义者或是主流宗教的信徒，都会对秘教的教义冷眼相看。\n\n教会是秘教国度的核心，而教会自身更是神秘至极。在大部分秘教国度中，教会的组织结构不为世人所知，即使是信徒和基层会众，也不一定能够了解中上层的主教和神甫，参见教主更是痴心妄想。秘教教会渗透进了国家的方方面面，可以说是秘教国度实质上的政府，但其统治方式远不如现代政府一般文明。由于秘教的神秘主义特点，洗脑式的传教、严苛的捐税甚至是使用异端者进行的献祭行为，在秘教国度都有可能存在。需要指出的是，秘教国度的神秘主义色彩和教会极权统治二者缺一不可，换句话说，只要是被认定为秘教国家，那么这些秘教极端分子便没什么理性和文明可言。"

#特殊意识形态
 special: "特殊意识形态"
 special_noun: "特殊意识形态"
 disorder_subtype: "无序之地"
 disorder_subtype_desc: "§Y无序之地§!§W（特殊意识形态）§!\n\n“大地上的生命十分顽强，它们在演化中有着自己的位置，后天的驯化与对抗往往只是徒劳。”——凯尔希\n\n人类的力量在自然面前仍是渺小的，探索的脚步常常会因诸多现实因素而停驻，而那些少有人烟或与世隔绝的地方，便是无序之地。无序之地的类型很多，它们的共同点在于“无序”，即没有任何一个政府能够在这里建立起统治秩序。有一些无序之地尚在某个国家的宣称领土中，只是由于各种原因无法开发，有一些地区则干脆是各国唯恐避之不及的烫手山芋。\n\n造成某地成为无序之地的原因有很多，可能是开拓活动受到自然条件制约而止步，或是由于天灾人祸导致居民从当地迁出。需要注意的是，无序之地并不一定没有人类活动，逃犯、匪徒、沉默的旅商和与世隔绝的部落，都有可能在这些地方出没，尽管秩序在这里并不存在，但生活依然照常进行。"
 gestalt_subtype: "格式塔族群"
 gestalt_subtype_desc: "§Y格式塔族群§!§W（特殊意识形态）§!\n\n“海洋漠视生命，海洋污染土地，海洋触犯了我们文明所知的一切底线。”——费尔南多·亚历杭德罗·德拉特兰（伊比利亚）发布沉默诏令，1038年\n\n格式塔族群并不代表一种意识形态和政治制度，而更像是一种生物学概念。格式塔族群中的物种拥有集群的意识，而单独的个体通常只拥有最基本的智能。其活动的方式常常是基于生物指令的集群行动，这种指令的来源多为个别较高级的个体或唯一的中心生命体，在一些特殊情况下，这些特殊个体的智能可能与普通人相近。\n\n大多数情况下，格式塔族群的智能无法与人类文明相媲美，但由于种群数量或个体实力的差距，仍有一些地区处于这些族群的控制之下，比较常见的为野生源石虫集群。除此之外，也有力量远胜于人类文明的格式塔族群存在，它们对人类社会的潜在威胁，现阶段仍然难以评估。"
