#民族精神
 AKA_Gavel_returns: "密林悍将"
 AKA_Gavel_returns_desc: "哦吼！这里是雨林！虽然部落民们文明水平不高，但是大家会打架！"
 AKA_what_does_underground_have: "地底下有什么？"
 AKA_what_does_underground_have_desc: "有些人知道，有些人不知道，反正杜林人的城邦就在那里，在这个雨林的下面。如果杜林人对“地上人”的印象有所改观，那么他们就会给阿卡胡拉提供一些技术上的援助，相反，如果我们惹他们不高兴了，那这些家伙又会把他们自己封闭在地下的穹顶里了。"