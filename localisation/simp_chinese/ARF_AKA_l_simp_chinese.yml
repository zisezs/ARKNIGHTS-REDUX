#国家领袖
 AKA_Inam: "依娜姆"
 AKA_Inam_desc: "一个天灾信使，怎么就成了部落酋长呢？依娜姆闲下来的时候，就会问自己这个问题。她受皇帝洪恩，千里迢迢从黄金之城来到这个穷得羽兽不拉屎的地方，观测和预警天灾的同时，也替中央政府监视这片雨林。但是这里实在是太！穷！了！无事可做的她只好用闲暇时间与其他王酋领的移动城市做生意，用雨林里的特产换一些现代社会的产物，谁知她的业余爱好让她积攒了越来越多的威望，最后成为了部落的大酋长，同时代表整个阿卡胡拉地区与外界进行交流。依娜姆搞不明白这个问题，只好继续帮老乡们买更多的工业产物，顺便为那个她已经忘得差不多的政权继续监视这片土地。"
