#国家领导人/将领/内阁
 BZN_Andrea_Genoa: "安德烈亚·热那亚"
 BZN_Andrea_Genoa_desc: "自从安德烈亚·热那亚上台以来，围绕在这个老人身边的争议就连日不断。有些人担忧博尔扎诺军队的前任总司令当选总督有可能破坏共和国的民主，有些人质疑他代表着利古里亚的财团利益，还有人痛斥他出卖博尔扎诺的独立以讨好莱塔尼亚。这些批评无疑侧面展示了安德烈亚·热那亚的复杂。他出身于一个已经失去贵族身份的勋贵家庭，在军旅中一步步走到顶峰，依靠着军队现代化的巨大声望为博尔扎诺公民联盟赢得了上一届选举。安德烈亚·热那亚的确更亲近莱塔尼亚，其贸易政策主张也确实养肥了利古里亚城中的商贾，但他坚信这些是博尔扎诺的正确道路，不论外人如何评论，他的心中绝无一点私情。"
 BZN_Juliana_Medici: "朱莉安娜·美第奇"
 BZN_Juliana_Medici_desc: "在许多年前的叙拉古第一次内战中，美第奇家族分裂成了两派——尽管某些阴谋论者称他们只是两头下注，跟随博尔扎诺共和国出走的美第奇家族继续发挥着他们在政治和商业上的才干，而朱莉安娜·美第奇便是家族天赋的集大成之人。年轻的朱莉安娜·美第奇曾经利用她的商业头脑，为困境中的家族企业打开了炎国的商路，如今她又靠着自己的政治才华，让自由党重新夺得总督之位。朱莉安娜清楚，作为东陆与核心圈贸易航道的重要节点，博尔扎诺的营商环境远胜于臭不可闻的叙拉古，这将为共和国带来源源不断的财富，以及面对叙拉古那群腐朽家族时的绝对优势。"
 BZN_Giocomo_Martini: "吉奥科莫·马提尼"
 BZN_Giocomo_Martini_desc: "作为社会民主同盟乃至整个泛叙拉古地区的第一个左翼领导人，吉奥科莫·马提尼很清楚自己将要面对什么。作为一个靠着批评当局而名声大振的议员，吉奥科莫·马提尼被选为社会民主同盟本次大选的花瓶，但却获得了意料之外的大胜。政治水平远不止是花瓶角色的吉奥科莫·马提尼清楚，他的胜利是由于公民党和自由党在国内问题上的失败，而社会民主同盟内的政客们也都对如何改变博尔扎诺有着自己的想法。作为临时被推出来的胜利者，吉奥科莫·马提尼必须在钢丝上行走，否则他就将落入下面的万丈深渊。"
