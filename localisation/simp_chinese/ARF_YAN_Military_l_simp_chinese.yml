YAN_shortcut_military:0 "军事·整军经武"
YAN_mil_tianzhu:0 "朝野同心"
YAN_mil_tianzhu_desc:0 "天枢之司合应、通、侦、补四事于一部。粮道、星枢、数通、天镜，皆自此出；朝中画策与军中行事同出一心，故号「朝野同心」。天枢每成一策，此心便厚一分。"
yan_mil.11_hap_tt:0 "§Y哈拉帕帝国§!在首都集结§R两百个满编师§!，并获民族精神§R滥用邪魔力量§!（补给消耗 §R−90%§!、陆军攻击 §R+100%§!、军工产出 §R+100%§!）"
YAN_Military_Reform:0 "大炎军改"
YAN_mil_dec_army_exercise:0 "校场秋点兵"
YAN_mil_dec_army_exercise_desc:0 "以实战之课训陆军：昼夜行军、攻坚、防御，一次演习胜于三月操典。"
YAN_mil_dec_navy_exercise:0 "楼船夜雪"
YAN_mil_dec_navy_exercise_desc:0 "水师出海演习：编队、索敌、炮击、登岸，按新制逐一验之。"
YAN_mil_dec_air_exercise:0 "长空砺翼"
YAN_mil_dec_air_exercise_desc:0 "云骑全员升空：制空、拦截、支援、侦察，四课同演。"
YAN_mil_dec_grand_manoeuvre:0 "三军合演"
YAN_mil_dec_grand_manoeuvre_desc:0 "三军同场：陆上进、海上渡、天上掩。此演习只验一事——令出能否三军同动。"

