# ---------------------------- 国策 ----------------------------

YAN_mil_reform_root:0 "整军经武"
YAN_mil_reform_root_desc:0 "大炎兵部久废弛，军令不出三门。今当重立军制：三军之序、将弁之阶、演习之章，自今日始。"

YAN_mil_people:0 "民为邦本"
YAN_mil_people_desc:0 "兵出于民，民安则兵足。军伍既立，先正其本：不夺农时，不扰市井。"

YAN_mil_drill:0 "秣马厉兵"
YAN_mil_drill_desc:0 "罢一切虚文，专意训战。马秣于厩，兵厉于野，日日如此。"

YAN_mil_council:0 "玉门论兵"
YAN_mil_council_desc:0 "玉门城头，诸将论兵三日。军令出于一门，则百万之众可驱。"

YAN_mil_modernization:0 "革故鼎新"
YAN_mil_modernization_desc:0 "去旧军之弊，立新军之纲。演习之制、参谋之司、诸军之职，皆自此更张。"

YAN_mil_air_root:0 "御风而行"
YAN_mil_air_root_desc:0 "天空本不属炎土。欲争其上，先习御风：立空军之部，定长空之序。"

YAN_mil_air_warning:0 "司天观星"
YAN_mil_air_warning_desc:0 "设观星之台于十二楼。敌机未至，先见其影；影既见，则无所遁。"

YAN_mil_air_craft:0 "云骑临风"
YAN_mil_air_craft_desc:0 "云骑者，大炎之新羽。铸之以天工，试之以长空，不求其多，但求其锐。"

YAN_mil_air_uav:0 "无形之翼"
YAN_mil_air_uav_desc:0 "不载人而能战，不见形而有威。以器械代血肉，此谓无形之翼。"

YAN_mil_air_ew:0 "万籁俱寂"
YAN_mil_air_ew_desc:0 "凡电波所及，皆可乱之。使敌目盲耳聋，进退失据，而我军自如。"

YAN_mil_air_line:0 "天工开物"
YAN_mil_air_line_desc:0 "天工院开脉动之线：一机出而百机随，工不辍而料不积。"

YAN_mil_air_rs:0 "鹰击长空"
YAN_mil_air_rs_desc:0 "侦与打合为一事。见即击，击即毁，不留瞬息之隙。"

YAN_mil_air_supremacy:0 "气吞万里"
YAN_mil_air_supremacy_desc:0 "制天权在握，则万里山河皆在翼下。此后征战，先决于天。"

YAN_mil_navy_root:0 "楼船夜雪"
YAN_mil_navy_root_desc:0 "大炎之海，北起沧波，南至溟渤。楼船夜雪，水师当兴，海疆不可无人。"

YAN_mil_navy_capital:0 "艨艟巍峨"
YAN_mil_navy_capital_desc:0 "重甲巨舰，非复原之艨艟，而有其势。海战之骨，终在主力。"

YAN_mil_navy_shipyard:0 "百工维新"
YAN_mil_navy_shipyard_desc:0 "船坞易以新法：分段而作，以时程课功。船出如流水，不待数年。"

YAN_mil_navy_marines:0 "蛟龙出水"
YAN_mil_navy_marines_desc:0 "水师之锐，能自浪中登岸，夺敌之要。此军不用于守，只用于攻。"

YAN_mil_navy_carrier:0 "浮城载翼"
YAN_mil_navy_carrier_desc:0 "以城为舰，以舰载翼。移动城邦之遗法，移用于海上。"

YAN_mil_navy_amphib:0 "浮海攻坚"
YAN_mil_navy_amphib_desc:0 "登岸之制，非一事一器，乃全军之体系：备船、备粮、备向导、备天气。"

YAN_mil_navy_warships:0 "渊龙入海"
YAN_mil_navy_warships_desc:0 "渊龙者，潜而不见，出则海震。新舰当如是：不争一时之速，只求一击之重。"

YAN_mil_navy_supremacy:0 "沧溟万里"
YAN_mil_navy_supremacy_desc:0 "海内既清，沧溟万里皆我行舟之地。自此大炎之海，无他人之帆。"

YAN_mil_army_root:0 "沙场点兵"
YAN_mil_army_root_desc:0 "校场秋点兵。军之根本终在步骑之合：兵不精，则器不足以济事。"

YAN_mil_army_livefire:0 "校场演武"
YAN_mil_army_livefire_desc:0 "弃演而近实，以实战为课。演习之地即战场，演习之敌即真敌。"

YAN_mil_army_armor:0 "铁马冰河"
YAN_mil_army_armor_desc:0 "铁甲成阵，履冰河如平地。陆战之骨，自此而立。"

YAN_mil_army_artillery:0 "霹雳神机"
YAN_mil_army_artillery_desc:0 "神机火炮，声如霹雳。攻坚破垒，非此不可；守土御敌，亦非此不可。"

YAN_mil_army_mobile:0 "其疾如风"
YAN_mil_army_mobile_desc:0 "其疾如风，其徐如林。不与敌相持，只与敌相追：先至者胜。"

YAN_mil_army_firepower:0 "雷火俱发"
YAN_mil_army_firepower_desc:0 "侦得的，便打得到。雷火俱发，无有先后，无有远近。"

YAN_mil_army_officers:0 "登坛点将"
YAN_mil_army_officers_desc:0 "登坛拜将，将弁再训。兵之强弱，半在于将；将不明，则兵不达。"

YAN_mil_army_elite:0 "金戈铁马"
YAN_mil_army_elite_desc:0 "金戈铁马，铁甲精锐尽在此军。此大炎陆军之极致，亦步骑之终成。"

YAN_mil_support_root:0 "天枢整军"
YAN_mil_support_root_desc:0 "天枢之司，合应、通、侦、补四事于一部。军之耳目手足，自此归于一枢。"

YAN_mil_support_logistics:0 "粮草先行"
YAN_mil_support_logistics_desc:0 "军未动而粮先行。辎重不断，则军不疲；不绝，则军不散。"

YAN_mil_support_satellite:0 "星汉灿烂"
YAN_mil_support_satellite_desc:0 "星汉灿烂，若出其里。星网既成，天下无盲区，行止皆有所据。"

YAN_mil_support_digital:0 "运筹帷幄"
YAN_mil_support_digital_desc:0 "运筹帷幄之中，决胜千里之外。数通既成，则全军共一耳目。"

YAN_mil_support_units:0 "辎重辚辚"
YAN_mil_support_units_desc:0 "辎重辚辚，炊烟不绝。军行千里而不饥，此非天幸，乃制度。"

YAN_mil_support_future:0 "来者可追"
YAN_mil_support_future_desc:0 "往者不可谏，来者犹可追。明日之军，成于今日之谋。"

YAN_mil_support_cyber:0 "天镜无隙"
YAN_mil_support_cyber_desc:0 "天镜阁封其隙，使敌手不得入我网；既入，亦不得出。"

YAN_mil_support_steadfast:0 "不动如山"
YAN_mil_support_steadfast_desc:0 "不动如山，进如渊。攻守之法尽在保障：能久者，方能胜。"

YAN_mil_joint:0 "同袍同泽"
YAN_mil_joint_desc:0 "岂曰无衣，与子同泽。三军同气，乃可共进退；各自为战者，虽众必败。"

YAN_mil_staff:0 "共谋帷幄"
YAN_mil_staff_desc:0 "设联合军机处：一令而下三军，一谋而合三军之见。"

YAN_mil_ascend:0 "飞龙在天"
YAN_mil_ascend_desc:0 "飞龙在天，利见大人。大炎之军至此功成：步、骑、舟、翼，皆可为国之爪牙。"

# ---------------------------- 民族精神 ----------------------------

YAN_mil_service_army_1:0 "大炎帝国陆军"
YAN_mil_service_army_1_desc:0 "初制：步骑分列，合则为阵。兵出于民，器成于国。"
YAN_mil_service_army_2:0 "大炎帝国陆军"
YAN_mil_service_army_2_desc:0 "训战：罢一切虚文，专意训战。行军、攻坚、防御皆有定章。"
YAN_mil_service_army_3:0 "大炎帝国陆军"
YAN_mil_service_army_3_desc:0 "铁甲：铁甲成阵，履冰河如平地。陆战之骨自此而立。"
YAN_mil_service_army_4:0 "大炎帝国陆军"
YAN_mil_service_army_4_desc:0 "神机：神机火炮列于阵后，声如霹雳，攻坚破垒非此不可。"
YAN_mil_service_army_5:0 "大炎帝国陆军"
YAN_mil_service_army_5_desc:0 "疾行：其疾如风，其徐如林。先至者胜，不与敌相持。"
YAN_mil_service_army_6:0 "大炎帝国陆军"
YAN_mil_service_army_6_desc:0 "火网：侦得的便打得到。雷火俱发，无有先后，无有远近。"
YAN_mil_service_army_7:0 "大炎帝国陆军"
YAN_mil_service_army_7_desc:0 "将弁：登坛点将，将弁再训。兵之强弱，半在于将。"
YAN_mil_service_army_8:0 "大炎帝国陆军"
YAN_mil_service_army_8_desc:0 "成军：金戈铁马，步骑炮工合为一路。此大炎陆军之极致。"
YAN_mil_service_air_1:0 "大炎帝国空军"
YAN_mil_service_air_1_desc:0 "立部：云骑既成，长空始有大炎之影。"
YAN_mil_service_air_2:0 "大炎帝国空军"
YAN_mil_service_air_2_desc:0 "司天：设观星之台于十二楼，敌机未至先见其影。"
YAN_mil_service_air_3:0 "大炎帝国空军"
YAN_mil_service_air_3_desc:0 "云骑：铸之以天工，试之以长空。不求其多，但求其锐。"
YAN_mil_service_air_4:0 "大炎帝国空军"
YAN_mil_service_air_4_desc:0 "无形：不载人而能战，不见形而有威。以器械代血肉。"
YAN_mil_service_air_5:0 "大炎帝国空军"
YAN_mil_service_air_5_desc:0 "静默：凡电波所及皆可乱之，使敌目盲耳聋而我自如。"
YAN_mil_service_air_6:0 "大炎帝国空军"
YAN_mil_service_air_6_desc:0 "天工：开脉动之线，一机出而百机随，工不辍而料不积。"
YAN_mil_service_air_7:0 "大炎帝国空军"
YAN_mil_service_air_7_desc:0 "鹰击：侦与打合为一事。见即击，击即毁。"
YAN_mil_service_air_8:0 "大炎帝国空军"
YAN_mil_service_air_8_desc:0 "制天：制天权在握，万里山河皆在翼下。此后征战先决于天。"
YAN_mil_service_navy_1:0 "大炎帝国海军"
YAN_mil_service_navy_1_desc:0 "立部：楼船既造，海疆始有人守。"
YAN_mil_service_navy_2:0 "大炎帝国海军"
YAN_mil_service_navy_2_desc:0 "艨艟：重甲巨舰，非复古之艨艟，而有其势。海战之骨在主力。"
YAN_mil_service_navy_3:0 "大炎帝国海军"
YAN_mil_service_navy_3_desc:0 "百工：船坞易以新法，分段而作，以时程课功。"
YAN_mil_service_navy_4:0 "大炎帝国海军"
YAN_mil_service_navy_4_desc:0 "蛟龙：水师之锐，能自浪中登岸，夺敌之要。此军只用于攻。"
YAN_mil_service_navy_5:0 "大炎帝国海军"
YAN_mil_service_navy_5_desc:0 "浮城：以城为舰，以舰载翼。移动城邦之遗法移用于海上。"
YAN_mil_service_navy_6:0 "大炎帝国海军"
YAN_mil_service_navy_6_desc:0 "浮海：登岸非一事一器，乃全军之体系：备船、备粮、备向导、备天气。"
YAN_mil_service_navy_7:0 "大炎帝国海军"
YAN_mil_service_navy_7_desc:0 "渊龙：潜而不见，出则海震。不争一时之速，只求一击之重。"
YAN_mil_service_navy_8:0 "大炎帝国海军"
YAN_mil_service_navy_8_desc:0 "沧溟：海内既清，万里皆我行舟之地。自此大炎之海无他人之帆。"

