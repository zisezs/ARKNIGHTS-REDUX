l_simp_chinese:

# ══════════════════ 决议分类 ══════════════════
 Ursus_Unification_War: "乌萨斯全境统一"

# ══════════════════ 共用启用条件（available 灰掉时显示）══════════════════
 Ursus_unify_war_tt_after_1101: "§R需在 1101 年 1 月 1 日之后方可发起统一战争§!"
 Ursus_unify_war_tt_need_east_unification: "§R需先完成「东乌萨斯的统一」§!"
 Ursus_unify_war_tt_must_border: "§R需与目标接壤§!"

# ══════════════════ 决议 · 统一战争（一条打一国，顺序自定）══════════════════

 Ursus_unify_war_urs: "向[URS.GetFlag]§R[URS.GetName]§!宣战"
 Ursus_unify_war_urs_desc: "帝国本部。工业、人力与源石产能最集中的一环，也是统一乌萨斯的核心目标。正面推进代价最高，但不拿下它，统一无从谈起。"
 Ursus_unify_war_urs_tt: "§Y效果：§!立即向§R[URS.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ufa: "向[UFA.GetFlag]§R[UFA.GetName]§!宣战"
 Ursus_unify_war_ufa_desc: "正规军底子完整，装备与训练水平在乌萨斯各势力中居前。辖区经济结构单一，长期作战的后劲不足。"
 Ursus_unify_war_ufa_tt: "§Y效果：§!立即向§R[UFA.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_uea: "向[UEA.GetFlag]§R[UEA.GetName]§!宣战"
 Ursus_unify_war_uea_desc: "东线主力，以要塞群与铁道为骨干。攻其一点会牵动全线，宜先夺枢纽车站。"
 Ursus_unify_war_uea_tt: "§Y效果：§!立即向§R[UEA.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_uta: "向[UTA.GetFlag]§R[UTA.GetName]§!宣战"
 Ursus_unify_war_uta_desc: "北线部队，寒区作战经验丰富。补给半径长，冬季推进成本高。"
 Ursus_unify_war_uta_tt: "§Y效果：§!立即向§R[UTA.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ucm: "向[UCM.GetFlag]§R[UCM.GetName]§!宣战"
 Ursus_unify_war_ucm_desc: "以城市起义与游击战起家，正规战能力弱。控制其据点即可瓦解其动员基础。"
 Ursus_unify_war_ucm_tt: "§Y效果：§!立即向§R[UCM.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ulb: "向[ULB.GetFlag]§R[ULB.GetName]§!宣战"
 Ursus_unify_war_ulb_desc: "流亡自由派与知识分子主导，兵力薄弱，但外交腾挪空间大，开战前需留意其外部靠山。"
 Ursus_unify_war_ulb_tt: "§Y效果：§!立即向§R[ULB.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ufs: "向[UFS.GetFlag]§R[UFS.GetName]§!宣战"
 Ursus_unify_war_ufs_desc: "动员速度快、士气高，通过闪电式扩张取得现有地盘。工业支撑不足，拖成消耗战即占优。"
 Ursus_unify_war_ufs_tt: "§Y效果：§!立即向§R[UFS.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ufe: "向[UFE.GetFlag]§R[UFE.GetName]§!宣战"
 Ursus_unify_war_ufe_desc: "地广人稀、公路单一。控制干线即等于控制全境，无需逐城争夺。"
 Ursus_unify_war_ufe_tt: "§Y效果：§!立即向§R[UFE.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_reu: "向[REU.GetFlag]§R[REU.GetName]§!宣战"
 Ursus_unify_war_reu_desc: "化整为零的游击结构，正面消耗战没有意义。应以据点推进加封锁，压缩其活动半径。"
 Ursus_unify_war_reu_tt: "§Y效果：§!立即向§R[REU.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_kmg: "向[KMG.GetFlag]§R[KMG.GetName]§!宣战"
 Ursus_unify_war_kmg_desc: "草原骑兵传统与冶金工业并存。冬季对其有利，应抢在封冻前结束主要作战。"
 Ursus_unify_war_kmg_tt: "§Y效果：§!立即向§R[KMG.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_omn: "向[OMN.GetFlag]§R[OMN.GetName]§!宣战"
 Ursus_unify_war_omn_desc: "机械化程度中等，工业分散。优先摧毁其修理厂与油料节点，其后推进成本将大幅下降。"
 Ursus_unify_war_omn_tt: "§Y效果：§!立即向§R[OMN.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_skh: "向[SKH.GetFlag]§R[SKH.GetName]§!宣战"
 Ursus_unify_war_skh_desc: "极北边地，气候与补给是主要对手。沿河与铁路线推进可绕开大部分地形障碍。"
 Ursus_unify_war_skh_tt: "§Y效果：§!立即向§R[SKH.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_bak: "向[BAK.GetFlag]§R[BAK.GetName]§!宣战"
 Ursus_unify_war_bak_desc: "坐拥水电与交通枢纽。切断其与内地相连的铁路，即可令其工业与外贸同时停摆。"
 Ursus_unify_war_bak_tt: "§Y效果：§!立即向§R[BAK.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_sgt: "向[SGT.GetFlag]§R[SGT.GetName]§!宣战"
 Ursus_unify_war_sgt_desc: "以矿产与商路立足，常备军规模有限。占领矿区即可同时削弱其财政与兵源。"
 Ursus_unify_war_sgt_tt: "§Y效果：§!立即向§R[SGT.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_nax: "向[NAX.GetFlag]§R[NAX.GetName]§!宣战"
 Ursus_unify_war_nax_desc: "新兴边疆势力，根基尚浅，正规部队数量少。速攻可避免其完成动员。"
 Ursus_unify_war_nax_tt: "§Y效果：§!立即向§R[NAX.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_ist: "向[IST.GetFlag]§R[IST.GetName]§!宣战"
 Ursus_unify_war_ist_desc: "经济政策相对自由，工业底子尚可，动员能力一般。"
 Ursus_unify_war_ist_tt: "§Y效果：§!立即向§R[IST.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_cyb: "向[CYB.GetFlag]§R[CYB.GetName]§!宣战"
 Ursus_unify_war_cyb_desc: "工业基础在乌萨斯东部各领中居前，兵力中等。宜先瘫痪其军工产出，再行推进。"
 Ursus_unify_war_cyb_tt: "§Y效果：§!立即向§R[CYB.GetName]§!宣战（战争目标：吞并全部）"

 Ursus_unify_war_kzc: "向[KZC.GetFlag]§R[KZC.GetName]§!宣战"
 Ursus_unify_war_kzc_desc: "哥萨克式骑兵编成，机动性强而不耐久战。避免在开阔地与其周旋，逼其进入城镇作战。"
 Ursus_unify_war_kzc_tt: "§Y效果：§!立即向§R[KZC.GetName]§!宣战（战争目标：吞并全部）"

# ══════════════════ 决议 · 整合核心（战后把亡国的乌萨斯系势力的核心州转成自己的）══════════════════

 Ursus_unify_core_urs: "整合[URS.GetFlag]§R[URS.GetName]§!的核心区"
 Ursus_unify_core_urs_desc: "圣骏堡的档案库烧掉了一半，剩下的一半仍然写着旧皇帝的年号。要把这些州真正算进自己的版图，就得先让户籍、税册和驻军命令换上一套名号。"
 Ursus_unify_core_urs_tt: "§Y效果：§!我方控制的、原属§R[URS.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ufa: "整合[UFA.GetFlag]§R[UFA.GetName]§!的核心区"
 Ursus_unify_core_ufa_desc: "泽尔格勒的参谋们直到最后一刻仍认为自己是帝国军本身。番号散去之后，他们留下的仓库、铁路和军管条例，都要由新的主人一份份重新签发。"
 Ursus_unify_core_ufa_tt: "§Y效果：§!我方控制的、原属§R[UFA.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_uea: "整合[UEA.GetFlag]§R[UEA.GetName]§!的核心区"
 Ursus_unify_core_uea_desc: "第八集团军以要塞群和铁道为骨架，指挥层解体之后剩下的只是一串无人认领的弹药库。让铁路重新按一个时刻表运行，比插上旗帜更能说明谁在统治。"
 Ursus_unify_core_uea_tt: "§Y效果：§!我方控制的、原属§R[UEA.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_uta: "整合[UTA.GetFlag]§R[UTA.GetName]§!的核心区"
 Ursus_unify_core_uta_desc: "北线的寒区部队习惯服从番号而非政府。番号消失之后，屯营地、补给站和冻土上的界线都得重新丈量一遍。"
 Ursus_unify_core_uta_tt: "§Y效果：§!我方控制的、原属§R[UTA.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ucm: "整合[UCM.GetFlag]§R[UCM.GetName]§!的核心区"
 Ursus_unify_core_ucm_desc: "他们起事时烧掉了地主的册子，却来不及建立自己的登记制度。这些州从游击区变成行政区，缺的从来不是热情，而是一套能用的文书。"
 Ursus_unify_core_ucm_tt: "§Y效果：§!我方控制的、原属§R[UCM.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ulb: "整合[ULB.GetFlag]§R[ULB.GetName]§!的核心区"
 Ursus_unify_core_ulb_desc: "阵线里的知识分子乐于起草宣言，不擅长清点仓库。接收他们的地盘，等于把一堆未完成的草案变成必须执行的政令。"
 Ursus_unify_core_ulb_tt: "§Y效果：§!我方控制的、原属§R[ULB.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ufs: "整合[UFS.GetFlag]§R[UFS.GetName]§!的核心区"
 Ursus_unify_core_ufs_desc: "闪电式扩张留下的疆界是用行军速度画出来的。现在要把这条线固定成税界与征兵界，就得把军团抢下的家当重新造册。"
 Ursus_unify_core_ufs_tt: "§Y效果：§!我方控制的、原属§R[UFS.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ufe: "整合[UFE.GetFlag]§R[UFE.GetName]§!的核心区"
 Ursus_unify_core_ufe_desc: "远东的干线比任何官衙都更能说明谁在统治。接管之后第一件要办的事不是挂旗，而是把沿线各站的调度权收归一处。"
 Ursus_unify_core_ufe_tt: "§Y效果：§!我方控制的、原属§R[UFE.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_reu: "整合[REU.GetFlag]§R[REU.GetName]§!的核心区"
 Ursus_unify_core_reu_desc: "化整为零的结构在战争里是优势，在行政上就是难题。要把这些活动半径重新拼成州界，先得让分散的据点接受同一套号令。"
 Ursus_unify_core_reu_tt: "§Y效果：§!我方控制的、原属§R[REU.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_kmg: "整合[KMG.GetFlag]§R[KMG.GetName]§!的核心区"
 Ursus_unify_core_kmg_desc: "旧贵族的封地从来既是庄园也是选区。账簿、矿工名册与陆行舰的维修记录，如今都要从公爵宅邸搬进新的公署。"
 Ursus_unify_core_kmg_tt: "§Y效果：§!我方控制的、原属§R[KMG.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_omn: "整合[OMN.GetFlag]§R[OMN.GetName]§!的核心区"
 Ursus_unify_core_omn_desc: "机械化的骨架散落在十几个修理厂与油料站里。把它们并入同一套军工调度，这片土地才算真正被统一。"
 Ursus_unify_core_omn_tt: "§Y效果：§!我方控制的、原属§R[OMN.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_skh: "整合[SKH.GetFlag]§R[SKH.GetName]§!的核心区"
 Ursus_unify_core_skh_desc: "极北的界碑是猎人和驯鹿商队默认的，不是官府立的。要让这些州改名换姓，就得让河运与渡口认下新的印章。"
 Ursus_unify_core_skh_tt: "§Y效果：§!我方控制的、原属§R[SKH.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_bak: "整合[BAK.GetFlag]§R[BAK.GetName]§!的核心区"
 Ursus_unify_core_bak_desc: "大公领的水电与枢纽养活了半个东达利亚。接管不是抢下一座电站，而是把并网、售电与铁路结算一并搬到自己名下。"
 Ursus_unify_core_bak_tt: "§Y效果：§!我方控制的、原属§R[BAK.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_sgt: "整合[SGT.GetFlag]§R[SGT.GetName]§!的核心区"
 Ursus_unify_core_sgt_desc: "矿区与商路是它的全部家当。矿脉归谁开采、商队向谁纳税，如今都要在新的税册上重写一遍。"
 Ursus_unify_core_sgt_tt: "§Y效果：§!我方控制的、原属§R[SGT.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_nax: "整合[NAX.GetFlag]§R[NAX.GetName]§!的核心区"
 Ursus_unify_core_nax_desc: "新兴的边疆势力根基尚浅，许多土地不过是一处营地。把它们变成州，需要的不是胜利，而是户籍和道路。"
 Ursus_unify_core_nax_tt: "§Y效果：§!我方控制的、原属§R[NAX.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_ist: "整合[IST.GetFlag]§R[IST.GetName]§!的核心区"
 Ursus_unify_core_ist_desc: "公爵的特许状与贸易合同写得漂亮，但它们承认的是旧主人。新的行政机构必须逐条判定：哪些继续有效，哪些直接作废。"
 Ursus_unify_core_ist_tt: "§Y效果：§!我方控制的、原属§R[IST.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_cyb: "整合[CYB.GetFlag]§R[CYB.GetName]§!的核心区"
 Ursus_unify_core_cyb_desc: "博斯克军火集团的机器仍按军管的节拍转动。收编这片土地，等于同时收编一份份外包合同与一支支私人护厂队。"
 Ursus_unify_core_cyb_tt: "§Y效果：§!我方控制的、原属§R[CYB.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_core_kzc: "整合[KZC.GetFlag]§R[KZC.GetName]§!的核心区"
 Ursus_unify_core_kzc_desc: "哥萨克的土地向来由河边的习惯法来分。要把这些习惯变成国家的登记，就得让营地、渡口和牧场接受新的名册。"
 Ursus_unify_core_kzc_tt: "§Y效果：§!我方控制的、原属§R[KZC.GetName]§!的核心州改挂我方核心，并移除其核心"

 Ursus_unify_annex_ufa: "吞并[UFA.GetFlag]§R[UFA.GetName]§!"
 Ursus_unify_annex_ufa_desc: "泽尔格勒的参谋部还在按旧番号领取补给。既然要打要谈都由我们说了算，就不必再留一面挂在自己旗下的军旗——把编制表收进公署，把军管区改成行省。"
 Ursus_unify_annex_ufa_tt: "§Y效果：§!30 天后吞并§R[UFA.GetName]§!，其控制的全部州转入我方，原属其核心的州改挂我方核心"
# —— 以上由 docs/_ursus_unify_core_decisions.js 生成 ——
