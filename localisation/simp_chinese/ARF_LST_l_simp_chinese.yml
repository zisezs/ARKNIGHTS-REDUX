#人物
 LST_Lu_Qi: "鲁琦"
 LST_Lu_Qi_desc: "鲁琦，她的本名是鲁奇卡·浦迦那，作为一名炎国商人与当地人的女儿，她在青年时便展现出了经商的天赋，因父母接连因病退休，鲁奇卡在年仅二十多岁时便接过了家族产业，并且在几年的经营后，把家族产业从一城扩展至当时的满贾帕希一国。然而1073年的内战将她的努力几乎摧毁，苦于战争的鲁奇卡与其他商人在一次密谋后，推翻了班克拉城的领主，宣布成立狮星共和国，脱离满贾帕希王国独立。为了在独立后获取这片区域的最大贸易对象，炎国的支持，鲁奇卡将自己的名字改为鲁琦，以展现自己对炎国的忠诚。在狮星独立后的这十几年间，鲁琦和她组建的共和大联盟成功将内战带来的破坏消除殆尽，并且通过谈判，阻止了甘武者王朝的进一步入侵。然而随着经济恢复，国内的反对派也开始为难鲁琦，指责她违背了共和原则，成为了事实上的新国王。而鲁琦的回应，是如期举行每一次的国会选举，她相信，选票不会骗人。"
