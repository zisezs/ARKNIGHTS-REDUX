#国家精神
 LST_Merchant_republic_in_the_east: "东方的商人共和国"
 LST_Merchant_republic_in_the_east_desc: "狮星国的政体在泰拉的东方显得如此的特殊：国家元首为国会选举出的总理，而国会又是由国内进行了财产登记的有产者选举产生的。无论来自哪个国家，只要在狮星国国内拥有一定的资产，就可能在班克拉的国会内拥有一席之地。这样的制度无疑在专制制度仍占主流的泰拉东陆显得极为特殊，实际上，这也是狮星国能够在短时间内摆脱内战带来的伤痛的主要原因。"
 LST_Frustrated_trade: "受挫的贸易"
 LST_Frustrated_trade_desc: "大静谧引发的海嗣骚动对于本地的贸易是一次不小的打击，而1073年的内战则彻底摧毁了狮星的对外贸易，而伦蒂尼姆金融潮的余波又让贸易航线的恢复再度推迟，当狮星终于准备好重新开启对炎国和哈拉帕的航路时，她尴尬的发现，安南、檀国和甘武者王朝已经取代了她之前的位置。虽然狮星的人们都相信，狮星的地缘优势和贸易传统能够让狮星国重回内战前的贸易地位，但显而易见，这条路注定坎坷。"
 LST_Among_giants: "在巨人之间"
 LST_Among_giants_desc: "狮星国的前身，满贾帕希王国的东部地区，从来就是一个不同文化的交汇之地，在海嗣威胁尚未如今天这般严重时，来自炎夏和哈拉帕地区的商人和移民便聚集在这个半岛地区，这成为了如今狮星国开放、包容的社会氛围的基石。但挑战也随之而来，当这两种文化各自的母国在泰拉东陆的对抗日益激烈，被夹在中间的狮星，必须作出自己的选择。"