#国家元首
 ANT_Azez_I: "阿泽兹一世"
 ANT_Azez_I_desc: "作为先皇与皇后唯一的女儿，阿泽兹一世在一阵质疑声中登上了皇位。这些质疑来自其他贵族和新兴的资产阶级，但阿泽兹让质疑她的人们都闭上了嘴。对帝位图谋不轨的地方贵族在发起叛乱前便被粉碎，皇室其他成员被她的治国手段和权谋技巧所折服，而资产阶级则是在经济的持续增长中识趣地噤声。阿泽兹一世可能会是一个守成之君，但是也存在另一种可能，那就是她不满足于仅仅在历史留下姓名。她想要书写历史。"
