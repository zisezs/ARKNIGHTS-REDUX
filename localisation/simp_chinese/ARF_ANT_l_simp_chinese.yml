#民族精神
 ANT_chief_emperor: "酋长皇帝"
 ANT_chief_emperor_desc: "尽管安纳托利亚帝国名义上仍是萨尔贡帝国的王酋领，但是无论是黄金之城里的贝希斯敦王朝还是布尔萨城里的乌尔汉王室都心知肚明，安纳托利亚值得被称作一个帝国。由于位于萨尔贡的东部门户，安纳托利亚比深居内陆的帝国更先一步接受了来自东方的科技与思想，加上先前几位皇帝进行的有限改革，安纳托利亚如今的处境远比困境之中的萨尔贡帝国更好。随着两方的力量对比一日日改变，所有人都不禁问出那个问题：安纳托利亚与萨尔贡的决裂何时到来？"
 ANT_Youth_Anatolia_Movement: "青年安纳托利亚运动"
 ANT_Youth_Anatolia_Movement_desc: "青年安纳托利亚运动，是由曼苏尔·阿塔图尔克发起的一场模仿花语运动的政治运动，其旨在推进安纳托利亚的民主化进程，并且从萨尔贡帝国完全独立，在泰拉的国际舞台上扮演更重要的角色。这场运动得到了女皇阿泽兹一世和她的堂姐莎巴赫亲王的支持，而曼苏尔也于1093年被任命为帝国宰相，但也正因如此，这场囊括了激进左派到保守自由派的政治运动，未来将面对更多的变数，这对安纳托利亚未必是一个好消息。"
 ANT_swollen_guard: "臃肿的禁卫军"
 ANT_swollen_guard_desc: "禁卫军，或“拜克塔军团”，是安纳托利亚帝国的精锐部队……至少以前如此。这支在萨尔贡的诸侯争霸历史中立下赫赫威名的部队，如今只是一个军纪败坏、武备松弛的垃圾聚集地，只有守护首都布尔萨的那一支亲卫队还维持着精锐的脸面。如何处理这一支尾大不掉的队伍，是摆在安纳托利亚执政者面前的一道难题。"
 ANT_Akrotti_Treaty: "《阿克罗蒂条约》"
 ANT_Akrotti_Treaty_desc: "多年以前，安纳托利亚帝国治下的几个边境部落与北边的米诺斯邦联爆发了边境冲突，这场规模不大但惨烈的冲突最终以安纳托利亚帝国代表手下的部落与米诺斯邦联签署《安纳托利亚-米诺斯互不侵犯条约》（又称《阿克罗蒂条约》）告终。这个条约最令人哭笑不得的是，此前被卷入冲突的边境部落与帕拉斯领导的边境村庄联盟，都无法代表安纳托利亚与米诺斯邦联的官方态度，如果两国任意一方的外交政策发生转变，那么这个建立在脆弱地基上的条约面临的结局只有被无情地撕毁。"
 