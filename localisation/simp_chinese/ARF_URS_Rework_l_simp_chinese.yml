l_simp_chinese:
 # ===== 乌萨斯政治国策树「整合改革线」 2026-09-15 重制 =====
 # 国策 27 条（起点1 + 皇帝线8 + 议会线8 + 圣愚线10）/ 共享民族精神 2 个 / 矛盾决议 6 条 / 分类 1 个

 # ---- 决议分类 ----
 URS_reform_conflict_decisions: "乌萨斯的改革矛盾"
 URS_reform_conflict_decisions_desc: "三张药方互相排斥：皇帝的集权要稳定作代价，议会的立宪要政治点作代价，而广场上的圣愚索取的是这片土地本身。\n\n当前局势\n§Y圣愚支持度§!：[?URS_fool_support|%0]\n§Y邪魔污染度§!：[?URS_demonic_corruption|%0]\n§Y政变风险§!：[?URS_coup_risk|%0]"

 # ---- 共享民族精神 ----
 URS_ursus_shall_not_die: "乌萨斯还不能死！"
 URS_ursus_shall_not_die_desc: "帝国的三张药方都从这一个病人身上出账。改革推进多少，这张账单就长多少——但至少，乌萨斯还不能死。"
 URS_ursus_demonic_campaign: "乌萨斯邪魔化运动"
 URS_ursus_demonic_campaign_desc: "锚定已经完成。跪着的人替邪魔把这片土地钉住了，圣愚与「国度」共用同一批信徒、同一份名单、同一座钟楼。改革的遗产没有消失，只是换了主人；而在它之上，又压上了 23 条只有邪魔读得懂的账目——信徒不需要光、不需要暖、不需要食物，也不需要理由。\n\n§Y邪魔污染§!：[URS_demonic_corruption_level_loc]\n§Y圣愚支持§!：[URS_fool_support_level_loc]\n§Y纳斯塔霞的恐惧§!：[URS_nastasya_fear_level_loc]"


 # ---- 圣愚帝国转型（政党名 / 国名 / 领袖） ----
 URS_mysticism_party: "圣愚锚定会"
 URS_The_Fool: "圣愚"
 URS_The_Fool_desc: "没有人见过圣愚的脸。它起初只是广场上一个被雪浇透的布道人，后来成了乌萨斯人心里那句「总还有人在听」的凭据——直到有一天，凭据自己站起来，把整片大地钉在了原处。\n\n它不需要皇冠，也不需要名字。纳斯塔霞替它戴上冠冕，内卫替它握剑，圣愚卫队替它看住每条街口。而它只需要足够多愿意相信的人。"
 URS_fool_state: "乌萨斯圣愚国"
 URS_fool_state_ADJ: "乌萨斯圣愚国"
 URS_fool_state_DEF: "乌萨斯圣愚国"

 # ---- 圣愚的领袖特质「邪魔本质」 ----
 URS_demonic_essence: "邪魔本质"
 URS_demonic_essence_desc: "它不需要皇冠，因为皇冠需要一个头。它不需要盟友，因为盟友需要一份条约。它只需要足够多愿意相信的人——而这份名单，正在把乌萨斯从世界地图上摘出去。\n\n§Y陆军攻击 +50%§!／§Y陆军组织度 +50%§!／§R稳定度 -50%§!\n§Y与所有其他国家关系 -200§!（上台时对全世界施加）／关系永远无法改善"

 # ---- 圣愚线专用说明键（手写） ----
 URS_tt_demonic_swap: "§Y民族精神更名§!：乌萨斯还不能死！ → §R乌萨斯邪魔化运动§!（保留全部改革遗产，并追加 11 条邪魔专属修正：陆军防御／突破／组织度／核心领土攻击／陆军经验／冬季损耗／补给消耗／顺从度增长／燃油容量／建设速度／每月人口）"
 URS_tt_demonic_finale: "§Y终局§!：圣愚帝国结局标识已置（URS_after_time_flag）——邪魔化运动走完全程，乌萨斯以信仰的形式存续。"

 # ---- 国策 ----
 URS_grave_illness: "病入膏肓"
 URS_grave_illness_desc: "瓦西里把报告合上，说了一句谁都知道、谁都不愿承认的话——听上去，乌萨斯已经病入膏肓。\n\n帝国同时开了三张药方：皇帝与维特的改革、议会与学生的请愿、广场上圣愚的布道。走哪一条由你决定，但三条路要交的学费都由同一个病人来付。\n\n§Y民族精神§!：乌萨斯还不能死！（§R稳定 -10%§!／§R政治点 -0.5/日§!）\n§Y开局态势§!：打开帝国皇庭与经济复兴决议面板"
 URS_imperial_army_group: "皇帝的远征军"
 URS_imperial_army_group_desc: "皇帝要把全国武装力量整编成一支可以直接带出边境的远征军——旧的集团军制被拆散，指挥权直接落在皇帝手上。\n\n§G+50§! 政治点\n§Y民族精神§!（§G政治点 +0.10/日§!）\n§Y收归军权§!：集团军制解散，远征军直属皇帝"
 URS_add_money: "得加钱"
 URS_add_money_desc: "远征军要钱、要装备、要后勤。皇帝把账单推回给了帝国本身——政令可以更便宜地签发，代价是全国的消费品供应再让一步。\n\n§Y民族精神§!（§G政令花费 -25%§!／§R消费品需求 +20%§!）\n§Y所有决议花费降低§!"
 URS_andrea_doreyan: "安德烈亚·多里安"
 URS_andrea_doreyan_desc: "大区神甫安德烈亚·多里安被任命为皇帝执行委员会的代表——皇帝的话由他传进每一个教区，教会的服从从此是国家的一部分。\n\n§Y民族精神§!（§G稳定 +5%§!／§G政治点 +0.10/日§!）\n§Y教会归附国家§!：宗教系统成为行政传导链"
 URS_great_region_reform: "大区"
 URS_great_region_reform_desc: "在乌萨斯本部划设六个大区，大区总督由皇帝直接指派，取代各州各自为政的旧格局。命令从圣骏堡到边境，少了四层转述。\n\n§Y民族精神§!（§G稳定 +10%§!／§G资源动员 +5%§!）"
 URS_military_mobilization: "军事动员"
 URS_military_mobilization_desc: "取消监察官体系，扩大预备役编成，重组防空军。军队不再只是阅兵场上的秩序，而是一台随时可以启动的机器。\n\n§Y民族精神§!（§G动员能力 +20%§!／§G战争支持 +10%§!／§G资源动员 +10%§!）"
 URS_great_purge: "大清洗"
 URS_great_purge_desc: "清洗一切不安因素——潜伏的政变企图、渗透的邪魔痕迹、上街的学生。名单一次比一次长，朝廷里只剩下一种声音和它的回声。\n\n§Y民族精神§!（§G政治点 +0.5/日§!／§G情报网增长 +20%§!／§R稳定 -10%§!）\n§Y宫廷·政变风险§!（§R+10%§!）"
 URS_it_is_time: "是时候了"
 URS_it_is_time_desc: "政治改革即将到来——不是议会递上来的那种。全国进入配给与管制状态，稳定与消费品同时往下走，换取一个不再需要解释的明天。\n\n§Y民族精神§!（§R稳定 -15%§!／§R消费品需求 -10%§!）\n§Y政治改革启动§!"
 URS_oath_of_a_madman: "狂人的誓言"
 URS_oath_of_a_madman_desc: "广场上出现新的圣愚。人民跪下了，爱国者们也跪下了。没人再等帝国的药方——他们开始等神迹。\n\n§Y民族精神§!（§R稳定 -20%§!／§R战争支持 -10%§!）\n§Y圣愚支持度§!（§R+30%§!）\n§Y圣愚上台§!：解锁圣愚线前置"
 URS_anastasia_gift: "阿纳斯塔西娅的赠礼"
 URS_anastasia_gift_desc: "皇帝把阿纳斯塔西娅赐给维特。这既是奖赏，也是人质——皇帝的善意写在婚书上，皇帝的不信任写在婚书背面。\n\n§G+30§! 政治点\n§Y民族精神§!（§G稳定 +5%§!／§G政治点 +0.10/日§!）"
 URS_rising_dawn: "初升的曙光"
 URS_rising_dawn_desc: "反对派尝试重新召开杜马。新杜马一开张就否决了皇帝提交的法律——议席上的第一缕曙光照进来，照出的是一整套还没谈拢的权力分配。\n\n§Y民族精神§!（§R稳定 -5%§!／§R政治点 -0.10/日§!／§G外交关系改善 +15%§!）\n§Y解锁决议§!：稳定议会／夺取议会"
 URS_first_five_year_plan: "一五计划"
 URS_first_five_year_plan_desc: "杜马通过一系列法案：驱逐圣骏堡的资本家，把矿脉、电厂与铁路重新交回国家手里，乌萨斯重新工业化。\n\n§Y民族精神§!（§G资源动员 +20%§!／§R消费品需求 -5%§!）\n§Y解锁决议§!：冬季配给"
 URS_rebuild_saint_grypherburg: "重建圣骏堡"
 URS_rebuild_saint_grypherburg_desc: "重建圣骏堡：修复兵工厂、恢复电网、把流散在乡间的技术官僚重新召回首都。国家的工业命脉回到它原本该在的地方。\n\n§Y民族精神§!（§G资源动员 +10%§!／§G稳定 +10%§!／§G科研速度 +5%§!）"
 URS_great_coup: "大政变"
 URS_great_coup_desc: "议会派试图夺取政权。政变没成，代价却已经付清——大量议员倒在圣骏堡的走廊里，议席空出一片。\n\n§Y民族精神§!（§R稳定 -15%§!／§G政治点 +0.15/日§!）\n§Y宫廷·政变风险§!（§R+10%§!）"
 URS_where_to_go: "何去何从"
 URS_where_to_go_desc: "议会派夺权失败，皇帝失踪，维特握着空掉的议席。乌萨斯站在路口上：继续立宪，还是回到一个人的手里。\n\n§Y民族精神§!（§R稳定 -10%§!）\n§Y解锁决议§!：新年后演讲"
 URS_it_is_time_council: "是时候了"
 URS_it_is_time_council_desc: "政治改革即将到来——这一次是由议会宣布的。全国进入配给与管制状态，稳定与消费品同时往下走，换取一个能被写进法律的明天。\n\n§Y民族精神§!（§R稳定 -15%§!／§R消费品需求 -10%§!）\n§Y政治改革启动§!"
 URS_vitte_dictatorship: "维特的独裁"
 URS_vitte_dictatorship_desc: "维特作为乌萨斯唯一一个还愿意自称自由派的人，用独裁来保住改革：议会休会、报纸集中审查、政令直接下达各州。\n\n§Y民族精神§!（§G政治点 +0.5/日§!／§G稳定 +5%§!）\n§Y维特掌权§!：议会／军政府路线接管"
 URS_fool_bell_failed: "敲钟失败"
 URS_fool_bell_failed_desc: "别乔克站在矿井口，手里握着奶奶留下的铁徽章。她举起手，准备敲响那口废弃了三十年的钟——但她的手停在了半空。\n\n圣愚的声音从雪原尽头传来，不通过耳朵，而是直接在她脑海中响起：你敲不响的。因为你心里已经相信我了。钟没有响。矿工们站在雪地里等着那声信号，信号没有来。别乔克跪了下去。圣愚的锚定没有松动，反而扎得更深。\n\n§Y民族精神更名§!：乌萨斯还不能死！ → 乌萨斯邪魔化运动（§G大幅强化§!，并追加 10 条邪魔专属修正）\n§Y民族精神§!（§R稳定 -10%§!／§R战争支持 -5%§!）\n§Y圣愚支持度§!（§R+10%§!）／§Y邪魔污染度§!（§R+5%§!）"
 URS_fool_guard: "圣愚卫队"
 URS_fool_guard_desc: "圣愚的宣讲从广场蔓延到军营、工厂、学校、矿区。第一批圣愚卫队在圣骏堡成立，成员是学生、工人和退伍士兵，他们穿着灰色制服、佩戴骏鹰徽章，在街上巡逻，维持秩序，分发圣愚的语录。\n\n内卫没有阻拦，因为内卫已经跪下；议会没有阻拦，因为议会已经沉默。维特在冬宫窗口看着卫队走过，对瓦西里说：我们清除了病灶，却让伤口长出了牙齿。瓦西里没有回答——他正在看一份报告：圣愚卫队已经控制了卡托加区的所有入口。\n\n§Y民族精神§!（§G占领抵抗度 -20%§!／§G稳定 +5%§!）\n§Y邪魔·顺从度增长§!（§G+15%§!）／§Y邪魔·组织度§!（§G+15%§!）\n§Y圣愚支持度§!（§R+10%§!）"
 URS_fool_coronation: "纳斯塔霞加冕"
 URS_fool_coronation_desc: "纳斯塔霞在圣骏堡大教堂加冕为乌萨斯女皇。仪式由叶莉莎女大公主持，圣愚站在祭坛旁，没有说话。她戴上皇冠时，教堂的烛火全部熄灭，只剩下圣愚身上那层淡淡的灰色光芒。\n\n她转身面对民众：受苦受难的兄弟姐妹，从今往后，你们的痛苦就是我的痛苦，你们的信仰就是我的信仰。广场上的人群跪下，唱起那首失传已久的圣歌。礼成后她对圣愚说：你不需要皇冠。圣愚回答：我需要你。\n\n§Y民族精神§!（§G稳定 +10%§!／§G战争支持 +10%§!／§G政治点 +0.20/日§!）\n§Y邪魔·核心领土攻击§!（§G+20%§!）／§Y邪魔污染度§!（§R+5%§!）"
 URS_fool_guards_sainted: "内卫圣化"
 URS_fool_guards_sainted_desc: "内卫在圣愚的注视下接受「圣化」。仪式在内卫总部的地下大厅举行，赫拉格站在角落里看着，没有拔剑。内卫指挥官单膝跪地，把佩剑放在圣愚脚下。\n\n圣愚没有捡起剑，只是把手放在指挥官头上：你效忠的不是我，是乌萨斯。指挥官抬起头，眼睛里泛着灰色的光。从那天起，内卫的制服上多了一枚骏鹰徽章，徽章中央刻着一只眼睛。赫拉格在仪式结束后离开了总部，再也没有回来。\n\n§Y民族精神§!（§G陆军攻击 +15%§!／§G占领抵抗度 -20%§!）\n§Y邪魔·陆军经验获取§!（§G+15%§!）／§Y邪魔·突破§!（§G+15%§!）\n§Y宫廷·政变风险§!（§G-15%§!）／§Y解锁决议§!：政变线与邪魔线的整合"
 URS_fool_mine_anchored: "矿区锚定"
 URS_fool_mine_anchored_desc: "远北中心矿区的矿工们在雷尔金的带领下反抗圣愚：炸毁圣愚卫队的哨所，烧掉宣讲台，把圣愚的画像扔进奥卡流体池。但圣愚没有派兵镇压，只是让纳斯塔霞来到矿区，在矿井口发表演讲。\n\n纳斯塔霞说：你们的痛苦我都看见了，你们的愤怒我都感受到了——但你们知道吗，你们的痛苦和愤怒，就是圣愚的力量。矿工们放下了武器。雷尔金站在人群后面，看着自己的手，发现它在发抖。他曾经说过：当你睁眼看到发生在我们周围的一切时，你难道不会愤怒吗？现在他愤怒了，但愤怒的方向已经不由他决定了。\n\n§Y民族精神§!（§G动员能力 +20%§!／§G工业产出 +10%§!）\n§Y邪魔·顺从度增长§!（§G+15%§!）／§Y邪魔·每月人口§!（§G+20%§!）\n§Y圣愚支持度§!（§R+10%§!）"
 URS_fool_realm_expansion: "国度扩张"
 URS_fool_realm_expansion_desc: "「国度」从圣骏堡向外扩张：卡托加区、泽尔格勒、布列斯克、远北矿区，一个接一个地落入圣愚的锚定范围。邪魔污染不再是肉眼可见的灰色雾气，而是一种更深层的东西——人们开始相信圣愚是永恒的，是乌萨斯本身。\n\n议会最后一次开会时，维特坐在议长席上，看着台下空荡荡的座位。大部分议员已经离开圣骏堡，剩下的要么加入了圣愚卫队，要么闭上了嘴。他在会议记录上写下最后一句话：乌萨斯没有灭亡。乌萨斯变成了别的东西。然后他合上了记录本。\n\n§Y民族精神§!（§G情报网增长 +30%§!／§G占领抵抗度 -25%§!／§G政治点 +0.20/日§!）\n§Y邪魔·建设速度§!（§G+15%§!）／§Y邪魔·核心领土攻击§!（§G+20%§!）\n§Y邪魔污染度§!（§R+10%§!）"
 URS_fool_priestess_approval: "普瑞赛斯的认可"
 URS_fool_priestess_approval_desc: "普瑞赛斯站在石棺深处，面对凯尔希和博士。你证明了吗？博士没有回答。他想起费奥多尔说过的话，想起别乔克手里的铁徽章，想起早露递出去的药，想起凛冬在封锁区里说的「你来了」——但那些人已经被圣愚的锚定吞没了。\n\n普瑞赛斯看着博士的眼睛：你没有证明。你只是见证了。源石计划将继续。乌萨斯是第一个，但不是最后一个。石棺深处传来流体以多种语言传递的同一个词：辩论。但辩论已经结束了。\n\n§Y民族精神§!（§G工业产出 +10%§!／§R科研速度 -15%§!／§R外交关系改善 -15%§!／§G政令花费 -15%§!）\n§Y邪魔·燃油容量§!（§G+30%§!）／§Y邪魔污染度§!（§R+10%§!）"
 URS_fool_empire: "圣愚帝国"
 URS_fool_empire_desc: "乌萨斯帝国更名为「圣愚帝国」。国徽从骏鹰换成那只刻着眼睛的骏鹰徽章，国旗是灰色的，中央印着圣愚的剪影：纳斯塔霞是女皇，圣愚是国父，内卫是圣徒，圣愚卫队是信徒。\n\n旧贵族制度被废除，新的「信仰等级」取而代之：圣愚在最上层，纳斯塔霞在第二层，内卫与卫队在第三层，普通信徒在第四层，未受锚定者在最底层。维特被软禁在冬宫偏殿，最后一篇日记写道：乌萨斯曾经是一个帝国。现在它是一个信仰。信仰不需要皇帝，不需要议会，不需要法律。信仰只需要一个空壳，和足够多愿意相信的人。\n\n§Y民族精神§!（§G陆军攻击 +10%§!／§G稳定 +15%§!／§G战争支持 +20%§!／§G情报网增长 +25%§!）\n§Y邪魔·陆军防御§!（§G+30%§!）／§Y邪魔·突破§!（§G+15%§!）"
 URS_fool_burning_in_dark: "在暗夜中燃烧"
 URS_fool_burning_in_dark_desc: "圣骏堡的灯光熄灭了。不是因为没有燃料，而是因为不需要灯光。圣愚的信徒们在黑暗中行走，不需要照明，不需要取暖，不需要食物——他们只需要圣愚的声音。\n\n纳斯塔霞站在冬宫阳台上，看着广场上黑压压的人群。她想起自己加冕那天说的话：你们的痛苦就是我的痛苦。现在她感觉不到痛苦了，也感觉不到任何东西。她转头看向圣愚，发现圣愚也在看她。圣愚的眼睛里没有光，只有一面灰色的镜子，镜子里映着整座城市，整片大地，整个乌萨斯。她问：我们成功了吗？圣愚回答：你成功了吗？她没有回答，只是转身走回冬宫，关上了阳台的门。\n\n§Y邪魔·冬季损耗§!（§G-60%§!）／§Y邪魔·补给消耗§!（§G-30%§!）\n§Y民族精神§!（§G消费品需求 -45%§!）\n§Y邪魔·顺从度增长§!（§G+10%§!）／§Y邪魔·建设速度§!（§G+10%§!）\n§Y邪魔污染度§!（§R+15%§!）"
 URS_fool_after_time: "时间之后"
 URS_fool_after_time_desc: "凯尔希站在石棺深处，面对普瑞赛斯。你赢了。普瑞赛斯摇头：我没有赢，我只是证明了——证明了泰拉文明可以被信仰吞没，证明了希望可以被锚定取代，证明了你们还没有准备好。\n\n凯尔希想起预言家的话：去寻找生命的痕迹，去寻找希望与未来。她找了很久。她找到了生命，但生命变成了信仰；她找到了希望，但希望变成了锚定；她找到了未来，但未来变成了圣愚。普瑞赛斯问：你还要继续找吗？凯尔希回答：我会继续找。但这一次，我不会再相信任何空壳。\n\n她转身离开石棺，走进乌萨斯的雪原。雪原上什么也没有，只有灰色的天空，和灰色的地平线。\n\n§Y民族精神§!（§G陆军攻击 +30%§!／§G动员能力 +25%§!／§G政治点 +0.50/日§!／§G占领抵抗度 -20%§!／§G战争支持 +15%§!／§G工业产出 +15%§!）\n§Y邪魔·陆军经验获取§!（§G+20%§!）／§Y触发终局§!：圣愚帝国结局标识"

 # ---- 矛盾决议 ----
 URS_conflict_stabilize_council: "稳定议会"
 URS_conflict_stabilize_council_desc: "给杜马足够的时间、足够的钱和足够长的议程。让议会把这套制度撑起来——持续期间，全国稳定度目标值翻倍。"
 URS_conflict_stabilize_council_tt: "§Y稳定议会§!（§G稳定度目标值 +50%§!，持续 120 天）"
 URS_conflict_seize_council: "夺取议会"
 URS_conflict_seize_council_desc: "星火不如一夜，皇帝与维特直接接管杜马。稳定度立刻归零，但所有议会相关决议同时解锁——恶名远扬。"
 URS_conflict_seize_council_tt: "§Y稳定度归零§!（§R立即降至 0%§!）\n§Y立刻开启所有议会相关决议§!（冬季配给／新年后演讲）\n§R政变风险 +20%§!"
 URS_conflict_winter_rationing: "冬季配给"
 URS_conflict_winter_rationing_desc: "把配给线画在城市的边缘，先保工厂、后保商店。冬天会替政府向下解释这件事。"
 URS_conflict_winter_rationing_tt: "§Y配给期间§!（§G消费品 -5%§!）"
 URS_conflict_new_year_speech: "新年后演讲"
 URS_conflict_new_year_speech_desc: "新年第一天，维特站在全国广播前。两周之内，政令的签发速度会快得让人以为帝国痊愈了。"
 URS_conflict_new_year_speech_tt: "§Y演讲期间（14 天）§!（§G政治点 +2.0/日§!）"
 URS_conflict_darya_demand: "达莉娅的要求"
 URS_conflict_darya_demand_desc: "达莉娅带来了北方的口信：圣愚要一个名分，而它愿意用稳定来付账。接受她的要求，圣愚线才会出现在国策树上。"
 URS_conflict_darya_demand_tt: "§Y接受达莉娅的要求§!：解锁圣愚线（「时间之前（序曲）」）\n§R圣愚支持度 +10%§!"
 URS_conflict_fool_integration: "政变线与邪魔线的整合"
 URS_conflict_fool_integration_desc: "把内卫的镇压名单和圣愚的皈依名单并成一份：不肯跪的人由内卫处理，肯跪的人由圣愚收编。政变线与邪魔线从此共用同一套档案。"
 URS_conflict_fool_integration_tt: "§Y整合期间§!（§G占领抵抗度 -10%§!／§G战争支持 +5%§!）"

