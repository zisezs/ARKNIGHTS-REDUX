 BCG_Oligarchic_country: "寡头之国"
 BCG_Oligarchic_country_desc: "玻利瓦尔联合政府所施行的体制可谓独树一帜，它在名义上拥有被称为“最高议会”的代议机构，其议员作为人民意志代表施行权力。可事实却与这些表面文章截然相反：十五名最高议会议员均由享有终身任期的精英寡头担任，而在如暗箱般的政治运行中，腐败、勒索乃至密谋暗杀之事都近乎司空见惯。这数十位身居高位的“成功人士”们皆各怀着各自的野心纵横交错，党同伐异。可在哥伦比亚的政治控制下，他们却永远无法实现独掌乾坤之愿景。\n\n如今，由本地地主精英组成的本土派、由亲哥伦比亚买办商人组成的哥伦比亚派，以及作为边缘派系的自由派寡头们在数十年的政治内耗中达成了勉强的团结，可这份团结是如此脆弱，以至于仅需些微变局便可能恩断义绝。未来尚未明晰，但下一场来临的风暴必将改变现状。"
 BCG_Almost_anarchic: "近乎无政府状态"
 BCG_Almost_anarchic_desc: "对于不同人而言，他们各自对联合政府的显然也各有千秋。哥伦比亚特区的政客们或许会大谈特谈其作为盟友的“战略价值”，并对最高议会大加赞誉；大辛德拉卡托的贵族们则会闻之面红耳赤，将一切他们能想到的玻利瓦尔语与莱塔尼亚语粗口倾泻而出；而联合政府治下的民众显然想法更为复杂——因为他们虽清楚这个政府名为联合政府，但却对其联合了什么一无所知，更不明白这个政府究竟在何时履行过其职责。\n\n最高议会中的寡头近乎将所有精力投入了争权夺利与以权谋私，致使社会治理近乎崩溃，人民亦深陷水火之中。这种状态若长久延续下去必将导致恶果，但寡头们何时能够意识到此仍是个问题。"
 BCG_Colombia_strong_control: "哥伦比亚的强力控制"
 BCG_Colombia_strong_control_desc: "在任何一个稳固的现代政治体运行中，权力制衡体系都不可缺少。在哥伦比亚这样的民主共和国，它体现为制度化的三权分立机制；在莱塔尼亚与维多利亚一类的现代君主立宪制国家，它则体现在君主、议会与地方间的平衡合作与良性竞争。可在玻利瓦尔联合政府治下，情况却大有不同。\n\n其虽拥有实质上的“权力制衡”，可天平的两端却是本土的最高议会与外部的哥伦比亚。从铁路到工厂，从移动城市到种植园，无处不在的哥伦比亚影响竟成为了联合政府在政治与经济稳定上的最大支撑，而寡头们则对这套体制乐享其成，致使经济体系更加深陷泥潭，无力自拔。"
 BCG_mixed_quality_army: "良莠不齐之军"
 BCG_mixed_quality_army_desc: "在名义上，联合政府境内有着一套完备的征兵体系。可剥去其现代外衣，内里所呈现的却是种古怪的雇佣兵制，其本质不过是由寡头出资雇佣民众成为士兵而已。而这些“公民雇佣军”的教官也大多是凭金钱雇佣来的各国退役军人，其水平可谓之参差，而所采取理论与训练方式也同样复杂且互不兼容。这种古怪的军事模式使联合政府的军事组织相当混乱且良莠不齐，除去接受军事系统外训练的军警部队国民警卫队，几乎难能找到一支有着稳定协同性的部队。"
