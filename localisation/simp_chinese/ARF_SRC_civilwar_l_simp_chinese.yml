# ── 国家与人物 ──
 SR1: "守旧派家族联军"
 SR1_ADJ: "家族联军"
 SR1_democratic: "守旧派家族联军"
 SR2: "博尔扎诺分离主义者"
 SR2_ADJ: "博尔扎诺"
 SR2_democratic: "博尔扎诺分离政权"
 SR1_Alberto_Ribelle: "阿尔贝托·萨卢佐"
 SR1_Alberto_Ribelle_desc: "萨卢佐家的家主，家族联军的名义统帅。他反对的不是新沃尔西尼，而是“一座不需要家族也能运转的城市”。"
 SR2_Rettore_Provinciale: "行省执政官"
 SR2_Rettore_Provinciale_desc: "博尔扎诺的行省执政官，趁乱举起分离旗号。他要的不是叙拉古的未来，而是旧账本上属于自己那一页。"

# ── 精神 ──
 SRC_reform_victory: "改革派凯旋！"
 SRC_reform_victory_desc: "灰厅的圆桌终于空得能照见人影。十二家族的营业执照还在，但坐在桌边的只剩城市自己。稳定度§G+15%§!、政治点获取§G+20%§!、战争支持度§G+10%§!、消费品需求§G-5%§!。"
 SRC_grey_hall_concession: "灰厅的沉默"
 SRC_grey_hall_concession_desc: "修正案撤回了，灰厅连一句评价都没有给。这比否决更难受——它不需要提醒你它还在。稳定度§R-5%§!、政治点获取§R-10%§!。"
 SRC_family_rot: "家族可能会倒闭，但绝不会变质"
 SRC_family_rot_desc: "宪法签了，家族也活着。他们把名字从族谱挪到营业执照上，把打手换成法务，把保护费换成咨询费——桌子底下的东西一样没少，只是不再需要当着你的面拿出来。每周稳定度§R-1%§!，持续§Y365天§!。"

# ── 国策前提 ──
 SRC_tt_need_reform_victory: "需要民族精神：§Y改革派凯旋！§!（由开局事件链【叙拉古内战】的终幕结算）"

# ── 事件链 ──

# 事件 1
 src_cw.1.t: "灰厅的否决"
 src_cw.1.d: "灰厅圆桌。十二家族的代表罕见地全员到场。莱昂图索坐在那把“无家族城市代表”的椅子上，面前摆着《管理法修正案》——加征关税、家族企业特许经营、允许新沃尔西尼模式向其他移动城市推广。\n\n威尼斯家族代表第一个站起来：“莱昂图索·贝洛内，你坐在灰厅里，用着我们定下的规则，却想掀翻我们的桌子。”\n\n萨卢佐代表紧随其后：“阿尔贝托先生让我转告你一句话——‘人们只知道我不喜欢下注，却不知道，我一旦下注，不见到胜利，决不罢休。’”\n\n罗塞蒂代表沉默。贝洛内代表席位空着。十二家族联名否决。西西里夫人的位置空着，但巨狼之口的徽记在桌上投下一道长长的影子。\n\n莱昂图索收起文件，站起来，环视圆桌。\n\n“你们否决了修正案。但新沃尔西尼的港口、法院、国民卫队、运输保障署，不会因为你们的否决而消失。”\n\n他走向门口，在门边停了一下。\n\n“下一次坐在这张桌边的人，可能就不是我了。”"
 src_cw.1.a: "坚持改革"
 src_cw.1.b: "暂缓修正案"
 src_cw.1.a.tt: "改革派正式与十二家族翻脸：基础稳定度 §R-12%§!、政治点 §R-30§!，修正案继续推进。"
 src_cw.1.b.tt: "修正案撤回：基础稳定度 §R-10%§!、政治点 §G+20§!，获得§Y灰厅的沉默§!。改革窗口关闭，事件链中止 90 天，起始国策在此之前无法开始。"

# 事件 2
 src_cw.2.t: "威尼斯的走私船"
 src_cw.2.d: "深夜，新沃尔西尼港第三码头。诺埃米带着警察局突击队埋伏在集装箱后面。情报显示，威尼斯载具公司的“货轮”今晚靠岸，船上不是葡萄酒，而是制式弩、施术单元、源石炸药。\n\n探照灯亮起。走私船被截停。英格丽·威尼斯站在甲板上，手里握着一把弩，但没有举起来。\n\n“诺埃米警官，”她说，“你知道威尼斯家族为什么能聚而不散吗？因为体面。你现在让我很不体面。”\n\n诺埃米举起弩：“这里是新沃尔西尼。这里的法律没有情面可讲。”\n\n英格丽笑了一下，把弩扔在甲板上：“好。那就看看，你的法律能不能拦住接下来发生的事。”\n\n她身后的集装箱一个接一个打开——里面不是武器，是三百名被胁迫的卡车司机家属。老威尼斯的底牌。"
 src_cw.2.a: "强行扣留"
 src_cw.2.b: "谈判放行"

# 事件 3
 src_cw.3.t: "萨卢佐的私兵"
 src_cw.3.d: "新沃尔西尼城外，萨卢佐酒庄。阿尔贝托坐在酒窖里，面前是一瓶标着“1092”的葡萄酒——那一年，德克萨斯家族被清算，拉普兰德被逐出家门。\n\n一个家族军官走进来：“先生，城外集结了七百人。都是萨卢佐的老兵。”\n\n阿尔贝托没有抬头：“谁下的命令？”\n\n“德米特里先生。”\n\n阿尔贝托终于抬起头，看了军官一眼：“德米特里·切塔尔多？贝洛内家的军师？”\n\n“他现在是贝洛内家的家主。”\n\n阿尔贝托沉默了很久，然后拿起那瓶酒，倒了两杯：“替我给他带句话——‘你父亲当年在我手下做事时，从没让我失望过。’”\n\n军官转身要走。阿尔贝托又叫住他：“等等。再加一句——‘但你现在做的事，你父亲不会认。’”"
 src_cw.3.a: "德米特里压下私兵"
 src_cw.3.b: "德米特里默认集结"

# 事件 4
 src_cw.4.t: "卡西米尔的最后通牒"
 src_cw.4.d: "沙雷的私人飞机降落在新沃尔西尼港。他带着卡西米尔商业联合会的正式照会：如果《管理法修正案》在三十天内生效，卡西米尔将撤出在新沃尔西尼的全部投资，并冻结叙拉古在卡西米尔的一切资产。\n\n莱昂图索在市政厅会客厅见他。\n\n“莱昂图索先生，”沙雷把照会推过去，“公平竞争——这是我们来这里的原因。但你现在要加税、要特许经营、要本地保护。这不是公平竞争。”\n\n莱昂图索没有看照会：“沙雷先生，你听过卢比奥这个名字吗？”\n\n沙雷皱眉。\n\n“他曾经是食品安全部部长。他在就职广播里说了一句话——‘所谓的文明，本就是为了克服暴力而存在的。’然后他自杀了。”\n\n莱昂图索站起来，把照会推回去。\n\n“你们没有变得更文明。你们只是变得更虚伪了。三十天？我给你三天。三天之内，你要么按新沃尔西尼法律重新注册，要么滚出叙拉古。”"
 src_cw.4.a: "三天期限"
 src_cw.4.b: "延长谈判"
 src_cw.4.a.tt: "卡西米尔全面撤资：基础稳定度 §R-15%§!、政治点 §R-40§!。短期阵痛由市政厅自己扛下，但资本不再替这座城市定价。"

# 事件 5
 src_cw.5.t: "拉维妮娅的法槌"
 src_cw.5.d: "新沃尔西尼法院，大法庭。被告席上坐着安东尼奥·威尼斯——走私、胁迫、策划控制市政厅。辩护律师来自哥伦比亚，收费按分钟计算。\n\n拉维妮娅坐在法官席上，荆棘手套放在面前。她听完双方陈词，拿起法槌。\n\n“安东尼奥·威尼斯，本庭宣判：走私罪名成立，胁迫罪名成立，危害公共安全罪名成立。数罪并罚，判处终身监禁，剥夺政治权利终身，没收全部非法所得。”\n\n辩护律师立刻站起来：“法官阁下，我的当事人是威尼斯家族成员，根据灰厅规则——”\n\n拉维妮娅的法槌落下。\n\n“这里是新沃尔西尼。灰厅规则在本法庭无效。”\n\n法庭后排，几个穿黑西装的鲁珀男人站起来，走向门口。其中一个回头看了拉维妮娅一眼，手指在喉咙上划了一下。\n\n拉维妮娅面无表情地拿起下一份卷宗。"
 src_cw.5.a: "灰厅规则在本庭无效"

# 事件 6
 src_cw.6.t: "德米特里的选择"
 src_cw.6.d: "德米特里站在贝洛内宅邸的阳台上，面前是萨卢佐私兵的集结地。他手里攥着两份文件：一份是贝洛内企业的合法营业执照，一份是萨卢佐私兵的调令。\n\n莱昂图索从身后走过来：“德米特。”\n\n“你来了。”\n\n“你要选哪边？”\n\n德米特里没有回头：“我从小就被教导，家主理应照顾好每一个家人。但现在‘家人’的定义变了。贝洛内家的残部，萨卢佐的老兵，威尼斯的走私贩，罗塞蒂的残党——他们都是叙拉古人。我不管他们，谁管？”\n\n莱昂图索沉默了很久。\n\n“德米特，我不是来劝你的。我是来告诉你——不管你怎么选，贝洛内企业在新沃尔西尼的执照，我不会吊销。”\n\n德米特里终于回头，看着莱昂图索：“你比你父亲狠。”\n\n“你教的。”"
 src_cw.6.a: "他选了新沃尔西尼"
 src_cw.6.b: "他选了家族"

# 事件 7
 src_cw.7.t: "伊雷妮的卡车"
 src_cw.7.d: "运输保障署的车队在新沃尔西尼城外被拦截。拦路的是威尼斯家族的私兵，领头的说：“前方道路管制，请运输保障署返回。”\n\n伊雷妮从驾驶室里跳下来，走到领头面前：“谁下的命令？”\n\n“威尼斯家族。”\n\n伊雷妮回头看了一眼车队——三百辆卡车，满载着新沃尔西尼的粮食、药品、源石燃料。司机们从车窗里探出头来，有人手里握着扳手，有人握着弩。\n\n“你知道索默尔吗？”伊雷妮问。\n\n领头沉默。\n\n“他是我最好的朋友。他为了救女儿，被你们威尼斯家族胁迫运货，最后死在车祸里。他教会了我一件事——除了我们自己，这座城市里的任何人都不值得信任。”\n\n她转身，对着车队举起手。\n\n“我们只能靠自己保护自己。哪怕那意味着暴力。”\n\n三百辆卡车同时发动引擎。领头后退了一步。"
 src_cw.7.a: "运输保障署武装化"

# 事件 8
 src_cw.8.t: "拉普兰德的赌局"
 src_cw.8.d: "拉普兰德出现在新沃尔西尼港口时，没有人注意到她。她穿着出租车司机的制服，靠在栏杆上，看着威尼斯家族的走私船被扣留、萨卢佐私兵在城外集结、国民卫队在港口布防。\n\n扎罗趴在她脚边：“你打算看多久？”\n\n“看到他们打起来。”\n\n“然后呢？”\n\n拉普兰德笑了一下：“然后我选一边。或者两边都不选。或者——”\n\n她转身，走向市政厅。\n\n“——我让德克萨斯选。”\n\n德克萨斯在市政厅门口拦住她。\n\n“拉普兰德。”\n\n“德克萨斯。”\n\n两人对峙。港口的海风吹过，吹起拉普兰德的衣角，露出腰间的双剑。\n\n“你要帮谁？”德克萨斯问。\n\n“我来问你。”拉普兰德说，“你要帮谁？”\n\n德克萨斯沉默。\n\n“你帮莱昂图索，我就帮家族。你帮家族，我就帮莱昂图索。你不选，我就两边都打。”\n\n“为什么？”\n\n拉普兰德收起笑容：“因为我想看看，你到底是不是货真价实的理想主义者。”"
 src_cw.8.a: "德克萨斯选了莱昂图索"
 src_cw.8.b: "德克萨斯拒绝选择"

# 事件 9
 src_cw.9.t: "第一枪"
 src_cw.9.d: "新沃尔西尼法院广场。拉维妮娅正在主持一场公开审判，被告是萨卢佐家族的杀手，罪名是暗杀国民卫队军官。法庭外，三百名市民举着联邦旗帜声援。\n\n一声铳响。\n\n拉维妮娅面前的法官席被击穿一个洞。她本能地低头，荆棘手套划破了脸颊。诺埃米冲上来把她按倒在地，同时对着耳麦大喊：“狙击手！法院对面屋顶！”\n\n广场大乱。市民四散奔逃。国民卫队封锁现场。\n\n拉维妮娅被拖进法院地下通道时，回头看了一眼广场——一个穿黑西装的鲁珀男人站在法院台阶上，手里举着萨卢佐家族的徽记。\n\n他大声喊：“新沃尔西尼没有家族？那就让叙拉古的家族来告诉你们，什么叫秩序！”\n\n铳声再次响起。男人倒地。开枪的是甘比诺——他站在广场另一头，手里的铳还在冒烟。\n\n“西西里人，”甘比诺对着尸体说，“现在你知道什么叫秩序了。”"
 src_cw.9.a: "进入战时状态"
 src_cw.9.a.tt: "基础稳定度 §R-18%§!、政治点 §R-40§!。公开审判被打断，城市进入战时状态。§Y全面内战§!还要等灰厅自己走完最后一步——见终幕。"

# 事件 10
 src_cw.10.t: "巨狼之口出动"
 src_cw.10.d: "巨狼之口出现在新沃尔西尼城外时，没有人知道他们是怎么来的。十二个穿黑斗篷的人站在萨卢佐私兵阵前，领头的是文。\n\n阿尔贝托亲自出迎：“文先生，西西里夫人是什么意思？”\n\n文摘下兜帽：“夫人让我带一句话——‘铳与秩序，是十二家族不得互相倾轧。你们现在做的事，叫互相倾轧。’”\n\n阿尔贝托皱眉：“新沃尔西尼先动的手。”\n\n“新沃尔西尼没有家族。”文说，“它不在灰厅规则之内。夫人说，你们可以打，但不能在灰厅规则下打。要么退出灰厅，要么停手。”\n\n阿尔贝托沉默。\n\n文转身离开前，补了一句：“夫人还让我告诉你——‘阿尔贝托，你女儿比你聪明。她至少知道，有些赌局不能上桌。’”"
 src_cw.10.a: "家族联军退出灰厅"
 src_cw.10.b: "家族联军暂时停手"

# 事件 11
 src_cw.11.t: "西西里夫人的沉默"
 src_cw.11.d: "莱昂图索独自前往西西里城。没有随从，没有卫队，只有一份《联邦宪法》草案。\n\n西西里夫人在灰厅圆桌旁见他。桌上没有茶，没有酒，只有一把铳。\n\n“你来了。”\n\n“我来了。”\n\n“你知道我为什么不表态吗？”\n\n莱昂图索摇头。\n\n西西里夫人拿起那把铳，放在桌上转了一圈：“这把铳，是我从拉特兰带回来的。它代表秩序。但秩序不是铳本身，是所有人都知道铳里有子弹。如果我把子弹打出去，铳就空了。”\n\n她停下转铳的手，看着莱昂图索。\n\n“你现在做的事，是在告诉我：铳里可能没有子弹。”\n\n莱昂图索把《联邦宪法》草案放在桌上：“夫人，我不是来挑战您的。我是来问您——当年您问阿格尼尔神父，有没有人能提出让您满意的答案。现在，答案在这里。”\n\n西西里夫人看着草案，沉默了很久。\n\n“叙拉古不需要未来。”\n\n“但叙拉古人需要。”\n\n西西里夫人拿起草案，翻了两页，然后合上。\n\n“去吧。让我看看你的答案。”"
 src_cw.11.a: "她愿意看下去"

# 事件 12
 src_cw.12.t: "德克萨斯的抉择"
 src_cw.12.d: "德克萨斯站在新沃尔西尼港的塔吊上。下面是集结的国民卫队、运输保障署车队、贝洛内企业安保。远处是家族联军的营地。\n\n能天使爬上来：“德克萨斯，你想好了吗？”\n\n“想好什么？”\n\n“帮谁。”\n\n德克萨斯看着远处。她想起萨尔瓦多雷·德克萨斯，想起朱塞佩·德克萨斯，想起1092年的清算，想起拉普兰德在哥伦比亚的决斗，想起乔万娜在法庭上的证词，想起莱昂图索在市政厅的蓝图。\n\n“这片土地还没有那么无可救药。”她说，“所以，我不逃了。”\n\n她跳下塔吊，落在国民卫队阵前。\n\n“我帮新沃尔西尼。”\n\n远处，拉普兰德站在家族联军阵前，看着德克萨斯。\n\n“好。”她低声说，“那就让我们看看，谁能先毁灭叙拉古。”"
 src_cw.12.a: "我帮新沃尔西尼"

# 事件 13
 src_cw.13.t: "移动城市分裂"
 src_cw.13.d: "布鲁奈罗城宣布加入新沃尔西尼阵营。蒙特卢佩宣布中立。特尔尼宣布加入家族联军。其余移动城市各自站队，叙拉古地图上出现三色分界。\n\n灰厅圆桌空着。城邦联合议事会流亡。城邦联合法院分裂成两个法庭，一个在新沃尔西尼，一个在蒙特卢佩。\n\n莱昂图索在市政厅召开战时会议。\n\n“我们有多少城市？”\n\n“布鲁奈罗、新沃尔西尼、帕勒莫、索伦托——七座。”\n\n“家族联军？”\n\n“萨卢佐、威尼斯、特尔尼、雷欧帝、吉诺维斯——九座。”\n\n“中立？”\n\n“蒙特卢佩、美第奇、波吉亚——六座。”\n\n莱昂图索在地图上画了一条线：“七对九。但我们有港口、有法院、有罗德岛、有企鹅物流、有狼群的中立承诺。够了。”"
 src_cw.13.a: "七对九，够了"
 src_cw.13.a.tt: "基础稳定度 §R-20%§!、政治点 §R-40§!。二十三座移动城市三色分界，城市归属要等内战打完再结算。"

# 事件 14
 src_cw.14.t: "罗德岛介入"
 src_cw.14.d: "凯尔希的通讯出现在屏幕上。身后是罗德岛医疗队。\n\n“莱昂图索，罗德岛不参与叙拉古内战。但我们可以提供医疗、感染者收容、战场救援。条件只有一个：新沃尔西尼模式胜利后，感染者权益保障法必须推广到整个叙拉古。”\n\n莱昂图索看向拉维妮娅。拉维妮娅点头。\n\n“成交。”\n\n凯尔希顿了一下：“还有一件事。红在找真狼。如果她找到新沃尔西尼，请让她进城。她需要凯尔希。”\n\n“红？”\n\n“猎狼人。你们应该见过拉普兰德了。”"
 src_cw.14.a: "成交"

# 事件 15
 src_cw.15.t: "狼之主的选择"
 src_cw.15.d: "扎罗、凯撒、瓦古、阿涅塞、大帝、大祭司、多利——七位狼之主在荒野边缘聚集。拉普兰德站在中间，手里握着双剑。\n\n凯撒：“你选了人类。”\n\n拉普兰德：“我选了叙拉古。”\n\n瓦古：“你会输。”\n\n拉普兰德：“也许会。但你们不会。”\n\n大帝从远处走过来：“小姑娘，你知道权力是什么吗？”\n\n“是真正的狼群。”\n\n大帝笑了一下：“那你为什么还要帮人类？”\n\n拉普兰德沉默了一会儿，然后说：“因为德克萨斯在那边。因为我想看看，她能不能做到。”\n\n扎罗站起来，走到拉普兰德身边：“我跟你走。”\n\n阿涅塞：“你疯了。”\n\n扎罗：“我活了这么久，第一次想看看结局。”"
 src_cw.15.a: "扎罗跟她走了"

# 事件 16
 src_cw.16.t: "灰厅圆桌的最后一次会议"
 src_cw.16.d: "灰厅圆桌。十二家族的代表、新沃尔西尼的代表、移动城市自治联盟的代表、城邦联合法院的代表、运输保障署的代表、罗德岛观察员、企鹅物流观察员——所有人围坐在同一张桌边。\n\n西西里夫人的位置不再空着。她坐在主位，面前放着那把铳。\n\n“打够了？”\n\n没有人说话。\n\n“叙拉古打了这么久，死了这么多人，烧了这么多城市。现在，告诉我——你们打出了什么？”\n\n莱昂图索站起来：“打出了一个答案。”\n\n阿尔贝托站起来：“打出了一个教训。”\n\n拉普兰德靠在门边：“打出了一个笑话。”\n\n德克萨斯站在她旁边：“不。打出了一个未来。”\n\n西西里夫人拿起铳，退出弹匣，把子弹一颗一颗放在桌上。\n\n“十二颗子弹。奥法内战十二个家族。现在，还有几颗？”\n\n桌上只有五颗。\n\n“叙拉古不需要未来。”西西里夫人站起来，“但叙拉古人需要。所以，我给你们一个机会——最后一次机会。”\n\n她把《联邦宪法》草案放在桌上。\n\n“签，还是不签。”"
 src_cw.16.a: "签署宪法"
 src_cw.16.b: "拒绝签署"
 src_cw.16.a.tt: "§Y和平过渡§!：基础稳定度 §R-15%§!，获得民族精神§Y改革派凯旋！§!，叙拉古联邦共和国的国策树就此开放。但家族没有被武力清算——同时获得§Y家族可能会倒闭，但绝不会变质§!：每周稳定度 §R-1%§!，持续§Y365天§!。"
 src_cw.16.b.tt: "§Y叙拉古全面内战§!：基础稳定度 §R-25%§!（开战效果另扣 §R-15%§!）。守旧派家族联军（SR1）占据 585 / 578 / 561，博尔扎诺分离主义者（SR2）占据 510 / 532 / 498；守旧派顾问离任；SRC 首都得到 20 个§Y沃尔西尼防暴部队§!师，SR1 得到 10 个§Y打手战团§!，SR2 得到 10 个§Y博尔扎诺干涉军§!。两个反叛政权都不存在时，触发§Y改革派凯旋！§!（不会有「家族可能会倒闭，但绝不会变质」）。"

# 事件 17
 src_cw.17.t: "灰厅的沉默"
 src_cw.17.d: "修正案撤回后的第九十天，灰厅没有再提起它。这本身就是一种表态：它不需要提醒你它还在。\n\n拉维妮娅把一份新的草案放在莱昂图索面前，封面上什么都没有写。\n\n“上一次我们输在声音太大。”她说，“这一次，先把字写小一点。”\n\n德米特里倚在门框上，没有进来，也没有走。\n\n“家族不会因为你安静就同意。”他说，“但家族也不会因为你安静就不动手。”\n\n莱昂图索看着那份没有封面的草案。\n\n“再推一次。”"
 src_cw.17.a: "重新推动修正案"
 src_cw.17.b: "就这么算了"
 src_cw.17.b.tt: "基础稳定度 §R-10%§!、政治点 §G+40§!。改革窗口就此关闭：本局拿不到§Y改革派凯旋！§!，叙拉古联邦共和国的国策树无法开始。"

# 事件 20
 src_cw.20.t: "改革派凯旋！"
 src_cw.20.d: "最后一支家族武装在特尔尼城外放下武器那天，没有举行受降仪式。国民卫队接管了萨卢佐的酒窖，警察局的封条贴上了威尼斯的码头仓库，灰厅的圆桌第一次空得能照见人影。\n\n莱昂图索一个人坐在那张圆桌边，从傍晚坐到夜里。桌上摆着两份名单：一份是愿意按新法律重新注册的家族，一份是不愿意的。不愿意的那份，短得几乎不需要读完。\n\n拉维妮娅推门进来，把一份文件放在他手边——《联邦宪法》最终文本，扉页上是起草委员会所有人的签名，包括德米特里的。\n\n“灰厅议事程序已经终止。”她说，“从今天起，这座城市的规则只有一部。”\n\n莱昂图索翻到最后一页，那里还留着西西里夫人放下的五颗子弹的位置。现在那里是空的。\n\n“新的一天已经来了。”他说。"
 src_cw.20.a: "民主的胜利"
