YAN_eco_empty_treasury:0 "国库空虚..."
YAN_eco_empty_treasury_desc:0 "账本一摊开，我最先看的不是银子。银子少了能挣，账烂了，挣多少都填不回去。要救急，先说清三件事：欠谁的、什么时候还、拿什么抵押。三样不齐，我这掌柜的不敢点头。\n——绩，在账房拨算盘时发言"
YAN_eco_financial_crisis:0 "金融危机席卷泰拉..."
YAN_eco_financial_crisis_desc:0 "泰拉的银根一紧，大炎也跟着打摆子。可越是这种时候，越看得出本钱厚薄：别人恐慌抛货，我们得看准了收。风险要两边一起背，这才叫合伙生意。眼光放长远些，看的是往后几季。\n——绩，在账房拨算盘时发言"
YAN_eco_rotten_shelves:0 "朽坏的货架与商品..."
YAN_eco_rotten_shelves_desc:0 "货架朽了，先别急着怪货。仓库进水、账面虚报、伙计偷拿，哪一样不是老毛病？我做生意讲究货真价实四个字，货不真，价再实也没人上门。先盘库，再定规矩，谁的账谁签，签了就认。\n——绩，在账房拨算盘时发言"
YAN_eco_rotten_shelves_tt:0 "§Y获得民族精神【大炎前路黯淡...】：§!"
YAN_eco_veteran_calm:0 "老资历波澜不惊！"
YAN_eco_veteran_calm_desc:0 "波澜不惊的老资历，是定力，也可能是惰性，要分清。见过风浪的人不该慌，可也不该拿「见过」当「做过」。老臣以为，资历只值一句话的功夫，说完了，还得看折子办得如何。后浪推前浪，本是好事。\n——太傅，在朝房批折子时发言"
YAN_eco_veteran_calm_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_chen_governs:0 "陈晖洁执政为民！"
 YAN_eco_chen_governs_desc:0 "“执政”二字用在我身上并不准确，这只是一份沉甸甸的差事。无论过去在近卫局，还是后来走在荒野与江湖上，我做的一切无非是为了“公义”二字。接手这些事务后，我的规矩和从前一样：不留糊涂账，不搞表面文章，更不允许任何人被当成所谓“大义”的代价。"
YAN_eco_chen_governs_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_pity_farmer:0 "《悯农》"
 YAN_eco_pity_farmer_desc:0 "现在很多人都觉得，大炎有了那么多座宏伟的移动城市，城里有水培工厂、有天师府的法阵、有工部的机械，粮食和物产好像就有了万全的指望。\n\n可实际上呢？只靠移动地块上的粮食，是喂不饱所有人的。\n\n大炎太大了。在那些偏远的乡村，那些移动城市覆盖不到的荒野和山坳里，始终会有人忍饥挨饿。为了从天地间抢来这一亩三分耕地，古往今来的人们想了太多办法。早些年科技不够发达的时候，大荒城的人甚至因为一些错误的巧合，摸索出用“棉石虫”的体液去施肥，好让庄稼避开源石环境的影响。现在回头看，那法子自然是笨拙的，可那就是一代又一代人试错留下的脚印。"
YAN_eco_pity_farmer_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_hearth_fire:0 "灶火长燃"
 YAN_eco_hearth_fire_desc:0 "我六姐在大荒城种地那么辛苦，姜齐城、大荒城的粮食和果蔬收上来，要是驰道不通、关卡抽税太重，或者运输慢吞吞的，等菜运到百灶，烂了一半，成本翻了一番，我这小店拿什么去卖便宜饭？\n\n所以我的第一个建议，就是官府得把运粮、运菜、运炭火盐巴的驰道彻底打通。凡是拉着民生吃穿用度的车马，过关少收点钱、少卡半天工夫；再在城里多辟出几处正经的早市和晚市，让城郊的菜农、牧民能直接把新鲜食材拉进来卖，让我们这些开小馆子的能去晚市拣点实惠菜，不用被中间的大商号一层层盘剥。菜篮子轻省了，老百姓碗里的肉片才能厚实呀！"
YAN_eco_hearth_fire_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_longmen_streets:0 "走在龙门街巷中"
 YAN_eco_longmen_streets_desc:0 "我的根在龙门，这点永远不会改变。龙门的大街小巷我都走过，码头、招牌、坡道，那些风景一直印在心上。后来我回过龙门几次，除了最熟悉的肠粉店不见了，其他都是令人欣喜的变化——街上的近卫局成员越来越少，从人们口中也渐渐听不到“贫民区”这个词了。但要想把事情真正做好，就不能只坐在办公室里看卷宗，必须继续走在街巷之中，亲眼去看百姓当下的日子。"
 YAN_eco_siesta_harvest:0 "多索雷斯之旅的收获"
 YAN_eco_siesta_harvest_desc:0 "如果我想要对付或者拯救某一样东西，不首先去了解它是不行的。那些外部的旅游城市有着极强的经济活力，但光鲜背后往往也藏着贪腐与倾轧。取其经验，引以为戒，这就是过往旅途留下的收获。"
YAN_eco_researchers_field:0 "科研者走进试验田"
 YAN_eco_researchers_field_desc:0 "种瓜得瓜，种豆得豆。智者畏因，愚人畏果。在天灾面前，如果我用权能救了庄稼这一次，之后人们便只会想着这样的“神迹”如何才能再发生，而不会再去琢磨育种、沤肥和水利。可我做不到每一次都能救下所有，总有一天，我也会消失不见的。到那时，我现在滥用的力量，就会变成害得后人坐以待毙的“恶因”。\n\n我时常会想起我的五姐颉。她曾留下过那么多书卷字帖，想教天底下每个人读书识字；她走后，那些原迹连我都没能留下一张。可后来我去过几所学堂和天师府，看到有些书本里的字迹竟和她的一模一样，她说过的话，又从那些学生的嘴里说了出来。\n\n种地和护国也是一样的道理。曾经有一位“神农”，总结了二十四节气，冒着生命危险把万顷冻土开垦成良田，教给人们耕种的知识。早些年大荒城不过百多人，如今能成为一座城，靠的不是哪尊神明的庇佑，而是人们把过去的经验记下来，闻道有先后，先学到的人再转述给更多人。"
YAN_eco_researchers_field_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_food_safety_law:0 "制定《食品安全法》"
 YAN_eco_food_safety_law_desc:0 "民以食为天，入口的东西最容不得含糊。"
YAN_eco_food_safety_law_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_nian_new_idea:0 "年的新想法！"
 YAN_eco_nian_new_idea_desc:0 "新想法？我一晚上能想八个！不过这个是真的能成！"
YAN_eco_nian_new_idea_note_tt:0 "§8年的新点子：奇观图纸已送工部存档，动工要等【奇观兴国！】§!"
YAN_eco_develop_good_spots:0 "开发好位置！"
 YAN_eco_develop_good_spots_desc:0 "“好位置”原本是我在战场上寻找掩体与射界时的习惯用语。放在市政建设里，指的就是那些亟待修缮的街区与基础设施。这些年我在百灶修过屋、在姜齐通了水道，很清楚一砖一瓦对普通人意味着什么。把旧城区那些曾被忽视的角落彻底改造、打通民生管线，让每个人都有安稳的容身之处，这才是真正的“好位置”。"
YAN_eco_develop_good_spots_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_develop_good_spots_note_tt:0 "§8【穷乡僻壤大开发！】决议组尚未完工（待实装）§!"
YAN_eco_open_good_spots:0 "开放好位置！"
 YAN_eco_open_good_spots_desc:0 "内部改造完成之后，自然不能闭门造车。将清理、整顿好的优质地段对外开放，是为了吸纳正当的商业合作与技术交流。只要把律法和规矩立在前面，开放就能为城市带来新的生机，而不是给投机者提供温床。"
YAN_eco_open_good_spots_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_wasteland_model:0 "复兴「大荒模式」"
 YAN_eco_wasteland_model_desc:0 "至于你说的“民生”到底是什么模样……其实不用去翻户部的卷宗，你跟着我去城里走一走就知道了。\n\n很多年前，大家做小甜饼只能用粗蔗糖做馅，吃的果子也是酸涩的；如今小店里卖的是细砂糖，我们培育出的新果子又甜又香，连小余那孩子都能变着花样做出一袋子点心来。\n\n民生就是农忙时大家一块儿在田里插秧，夏收后能喝上一碗热汤；是入冬三九四九冰上走的时候，家里能围着吃一顿热气腾腾的火锅——虽然小年放的辣椒实在太多了些，总得看着她点；也是神农祭的时候，街上敲锣打鼓办着社戏，像小满那样的孩子们聚在巷子口玩翻花绳，老人们坐在屋檐下晒太阳。\n\n这世间万物可爱，就在它此时此刻的模样。春种秋收，哪怕繁盛过后最终都会被一场大雪掩埋，但只要积雪之下还有春芽新绽，只要人们来这世间走过一遭时，能吃饱穿暖、能体味到生长的欢喜，这本身不就是最好的结果了吗？\n\n……唔，不知不觉和你说得有些多了。\n\n这是我新做的小甜饼，用的是细砂糖，你尝尝看合不合口味。吃完要是还有空的话……正好试验田里还有些野草没处理干净，现在又是插秧的时候，大伙都忙得很，不如你也挽起裤腿，来给我搭把手？"
YAN_eco_wasteland_model_tt:0 "§R州【隆仓·大荒】获得地块加成【大荒模式标杆！】：§!"
YAN_eco_stalls_restaurants:0 "小摊贩与大酒楼"
 YAN_eco_stalls_restaurants_desc:0 "我这“余味居”，铺面是我七哥绩的房产。他人虽然精明，但隔三差五来我这儿慢条斯理吃顿饭，一高兴就把房租给我免到了后年。可全天下的小掌柜，哪有每个人都能摊上这么个吃白食抵房租的哥哥呀？\n\n你看，像我这店，一年到头也就勉强回本。有一回为了凑三千块钱，我还得赶在月底前每天多送几趟外卖才堵上窟窿。这要是遇上个天灾歉收、或是家里有人害病，别说三千块，就是三百块也能把一家小店逼得关门大吉。\n\n炖汤讲究个“文火慢炖，着急不得”。要是火太猛，汤一下就烧干糊锅了。\n\n我就建议，户部和地方衙门别总盯着小店那点仨瓜俩枣的税钱催命。遇上年景不好、粮价波动的时候，官府能不能牵个头，把街面铺子的房租稳一稳？税钱许人缓交两个月，或者由官府设个救急的平准钱庄，让本分经营的小掌柜缺那两三千块钱周转的时候，能低息借上一笔，靠自己多送几趟外卖、多蒸几笼包子慢慢还上。"
YAN_eco_stalls_restaurants_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_char_siu_gold:0 "叉烧猫暴力榨金！"
 YAN_eco_char_siu_gold_desc:0 "如果让诗怀雅听见，恐怕立刻就要闹起来。推行基建与民生改造确实需要庞大的资金，但这不代表要用什么“暴力”手段。诗怀雅是我的朋友，也是并肩作战过的战友，她在大是大非上从不含糊。规范龙门各大商会的税务、引导家族资本投入公共建设，按律法与章程去谈就足够了。这个胡闹的名字，稍后必须改掉。"
YAN_eco_char_siu_gold_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_phase1_review:0 "验收第一阶段成果"
 YAN_eco_phase1_review_desc:0 "阶段性的汇总与核查必不可少。卷宗、账目、工程进度，做到哪一步就如实记录哪一步。一切都是为了更好地推进后续工作，核对无误、确认没有遗留隐患后，立刻进入下一阶段。"
YAN_eco_phase1_review_note_tt:0 "§8第一阶段验收通过：龙门新区、叉烧猫、述职报告三条线已开门§!"
YAN_eco_longmen_new_district:0 "就是你，龙门新区！"
 YAN_eco_longmen_new_district_desc:0 "内部改造完成之后，自然不能闭门造车。将清理、整顿好的优质地段对外开放，是为了吸纳正当的商业合作与技术交流。只要把律法和规矩立在前面，开放就能为城市带来新的生机，而不是给投机者提供温床。"
YAN_eco_longmen_new_district_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_waste_audit:0 "谁在铺张浪费？"
 YAN_eco_waste_audit_desc:0 "官府管营商环境也是一样。灶火边上不能屯棉花，后厨要干净，秤杆子要平，这些店规家法，一条条白纸黑字写清楚贴在墙上，我们做生意的自然老老实实照办。最怕的就是规矩写得模模糊糊，今天这个衙门来查一通，明天那个卫兵来封一天路。\n\n哦，对了！还有司岁台和城防的那些大人们——跟在我身边盯梢的秉烛人，最长的都跟了整整十五年了。我是不介意啦，反正走进馆子、坐上餐席，在我眼里就只是个食客，我还常给他们做员工餐呢。但换作别家普通的街坊小店，大清早外面全是巡逻卫兵，或者屋里坐几个冷着脸盯梢的便衣，普通客人哪还敢进门吃饭呀？"
YAN_eco_waste_audit_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_resource_storage:0 "战略资源仓储体系"
 YAN_eco_resource_storage_desc:0 "以前人们总觉得，防备邪魔污染是大哥在玉门关外挥刀的事，是小年造出“十二楼五城”那些铁家伙去堵门的事；而种粮食，则是关内江南水乡的事。\n\n但只靠移动地块上的粮食喂不饱所有人，只靠高墙和铁甲，也挡不住无孔不入的荒芜。如果边关之外千里无人烟、寸草不生，那戍边的将士吃什么？那些搬不进移动城市的偏远村落又该怎么活？\n\n所以我常说，最好的防线，其实就是农田，和一旁的粮仓。"
YAN_eco_resource_storage_tt:0 "§R全部本土州获得地块加成【备战，备荒，为人民】：§!"
YAN_eco_cannot_out:0 "坎诺特滚出界园！"
 YAN_eco_cannot_out_desc:0 "这一条的措辞虽然糙了些，但态度没有错。我在外游历的这些年，见过太多苦难，也见过不少借着绝望在背后穿针引线、兜售筹码的人。无论是那个叫坎诺特的商人，还是其他想在界园、岁陵一带浑水摸鱼的外部势力，都没资格在大炎的土地上设局。守住防务底线，把这些不安分的触手彻底清理出去，才能为大炎争取安稳的余地。"
YAN_eco_cannot_out_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_emperor_culture:0 "大帝的潮酷文化？"
 YAN_eco_emperor_culture_desc:0 "对流行音乐与外来文化没有偏见，企鹅物流以前在龙门也确实出过不少力。但包容的前提是守法。引进文化活动可以，倘若那位“大帝”的新唱片发布会再像过去那样把街区炸上天，维修费照价赔偿，人也照样得按规矩传唤问话。"
YAN_eco_emperor_culture_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_emperor_culture_note_tt:0 "§Y可招募将领：【德克萨斯】【蕾缪乐】§!"
YAN_eco_green_mountains:0 "绿水青山...金山银山"
 YAN_eco_green_mountains_desc:0 "大荒城以玉琮礼地，呼风唤雨、涤荡污秽，在我手中当然是能做到的。可我救了这一次，往后一旦再有天灾或是污染，人们便只会仰起头，盼着这样的“神迹”如何才能再发生。可总有一天，我会彻底消失不见的。到那时，没人再去研究怎么靠人力净化土壤，没人再去培育抗病的谷种，我现在用的力量，就会变成害了所有人性命的“恶因”。\n\n真正能克制那些死寂与污染的，从来不是某个人惊天动地的手笔，而是这片土地上生生不息的“活气”。\n\n你看，为什么当年神农要把万顷冻土开垦成良田？为什么大荒城明明压着污染，上面却要年复一年地春耕夏耘、办神农祭、唱社戏？因为当成千上万的农人踩在泥水里插秧，当一季季稻花飘香、落英入土滋养根系的时候，这片土地就是活生生的、热气腾腾的。枯骨生荒草，丘墟化桑田。只要土地还在生长，只要上面的人心里有奔头、手里有活计，那些靠着荒芜与恐惧滋生的邪魔，就扎不下根。"
YAN_eco_green_mountains_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_price_stabilization:0 "平抑市场物价"
 YAN_eco_price_stabilization_desc:0 "官府管营商环境也是一样。灶火边上不能屯棉花，后厨要干净，秤杆子要平，这些店规家法，一条条白纸黑字写清楚贴在墙上，我们做生意的自然老老实实照办。最怕的就是规矩写得模模糊糊，今天这个衙门来查一通，明天那个卫兵来封一天路。\n\n哦，对了！还有司岁台和城防的那些大人们——跟在我身边盯梢的秉烛人，最长的都跟了整整十五年了。我是不介意啦，反正走进馆子、坐上餐席，在我眼里就只是个食客，我还常给他们做员工餐呢。但换作别家普通的街坊小店，大清早外面全是巡逻卫兵，或者屋里坐几个冷着脸盯梢的便衣，普通客人哪还敢进门吃饭呀？"
YAN_eco_price_stabilization_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_look_beyond_borders:0 "放眼国门之外"
 YAN_eco_look_beyond_borders_desc:0 "守住底线，不代表画地为牢。从切尔诺伯格到多索雷斯，再到维多利亚与乌萨斯的风雪，这些年的所见所闻让我无比确信——如今我们面对的麻烦，并非单纯依靠武力就能解决。我们必须看得更多、走得更远，去了解国门之外这片大地的真实面貌。"
YAN_eco_look_beyond_borders_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_duck_letter:0 "鸭爵来信"
 YAN_eco_duck_letter_desc:0 "哥伦比亚那位“鸭爵”是个精明的生意人，他主动递信过来，多半是看中了新区开发背后的利益，或是手头握着某些灰色地带的情报。纯粹的善恶很容易分辨，难处理的是这种并不纯粹的交易。这封信不必直接回绝，可以转交给林雨霞或者老鲤去摸清底细。只要不触碰律法的红线，外来的资金与情报网同样可以为我们所用。"
YAN_eco_duck_letter_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_mortal_smoke:0 "凡人的烟火气"
 YAN_eco_mortal_smoke_desc:0 "……好了，说了这么久，你肚子不饿吗？天大的事也不能耽误吃饭。汤的火候刚好，我再给你炒两个菜。至于价钱嘛——这顿算我请的，下次记得再来就是了。"
YAN_eco_mortal_smoke_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_suppress_corruption:0 "镇压邪魔污染"
 YAN_eco_suppress_corruption_desc:0 "我在大荒城耕种了千年，替当年那位“神农”看着地底下压着的那些脏东西，最清楚它们的模样。那些污染一旦渗进土里，不只是让庄稼枯死，而是会把泥土里原本的因果与生机都搅乱，把人的恐惧、痛苦翻出来，变成扭曲的影子。\n\n但你要说它们有多可怕吗？其实也未必。\n\n上次大荒城遭逢那场意料之外的灾祸，地底的污染翻涌上来，我曾对那个被污染幻化出的影子说过一句话——“你在害怕，因为你不曾真的活过，你不知道这片大地真实的样子。”\n\n邪魔是没有根的。它们不懂什么是春种秋收，不懂为什么一粒死物般的种子落在土里，吸饱了水、晒足了日头就会发芽，更不懂为什么人们明明知道生命终有尽头、繁盛过后会被大雪掩埋，却还是要在田间流汗、在社戏上欢笑。"
YAN_eco_wonders:0 "奇观兴国！"
 YAN_eco_wonders_desc:0 "奇观兴国？兴不兴国我不知道，反正够好看。图纸是好图纸，可造奇观最忌好大喜功，玄极巨兵也不是一天铸成的。"
YAN_eco_wonders_tt:0 "【奇迹工程模块未实装】"
YAN_eco_chen_report:0 "老陈的述职报告"
 YAN_eco_chen_report_desc:0 "我只知道，历史应该记录真实，这对我而言，就是公义。处理政务也是一样。在所有阶段性工作结束之后，我会将每一笔账目、每一项决策的得失、包括我本人在内的所有权责，全部如实写进这份述职报告里，公开备查，给所有人一个交代。"
YAN_eco_chen_report_tt:0 "§Y解锁贸易法案【独善其身，兼济天下】：§!"
YAN_eco_chen_report_note_tt:0 "§8和平时期：科研速度 +20%，工厂产出 +20%，战略资源出口 +30%\n战争时期：战略资源出口 +10%，军用工厂建造速度 +30%，每周稳定度 -1%§!"
YAN_eco_steady_sailing:0 "大炎平稳航行..."
 YAN_eco_steady_sailing_desc:0 "船行得稳，最怕的是把「稳」当成「停」。船在水上，不进则退；国在世上，亦然。老臣主张缓中求进：风浪大时不冒进，风浪小时不贪闲。\n——太傅，在朝房批折子时发言"
YAN_eco_steady_sailing_tt:0 "§Y解锁经济法案【不烧心经济】：§!"
YAN_eco_steady_sailing_note_tt:0 "§8新法案与民用经济同档，但民用工厂建造速度 +30%§!"
YAN_eco_ride_waves:0 "大炎乘风破浪！"
 YAN_eco_ride_waves_desc:0 "一个对所有人都公正的地方，依然是遥远的理想，我也不知道自己是否离它近了一些。但大炎有壮丽的山河形胜，更有无数筚路蓝缕却生生不息的人。我从不怀疑理想中的公正是否存在，当我们为所见的不公愤怒时，当千千万万普通人想要挺身而出把日子过好时，它就是存在的。总有一天，我们可以不用在剑锋上寻找公义——这片土地与生活其上的人，自会乘风破浪，一直向前走下去。"
YAN_eco_ride_waves_tt:0 "§Y民族精神改名为【大炎乘风破浪！】并追加效果：§!"
