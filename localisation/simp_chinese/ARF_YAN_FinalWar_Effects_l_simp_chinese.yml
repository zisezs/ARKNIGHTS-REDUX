# ---------------- 事件 ----------------
yan_fw.1.t:0 "军演地点的选择"
yan_fw.1.d:0 "§W〔旁白〕§!：山河舆图铺满长案，西境的理塘与东境的龙门，皆被朱笔重重画了红圈。\n§M太傅§!：「理塘地势极高，俯瞰西陲，且高原风口凛冽，最宜锤炼边军苦战之风。」\n§Y魏彦吾§!：「龙门水陆通衢，船坞港口一应俱全，大军补给朝发夕至，排场自然好看。」\n§G兵部侍郎§!：「陛下，太傅重地利，魏公重人和，兵部一时实在难以决断。」\n§Y真龙§!：「世界最高城，理塘！……不过大军西调耗时太久。魏公，这回便委屈你的龙门，替朕敞开城门迎客三天。」\n§Y魏彦吾§!：「军国大事，龙门自当效劳。不过丑话说在前头——只借三天，第四天大军若是还不拔营，老夫这账单可就要递进兵部了。」"
yan_fw.1.b:0 "龙门"
yan_fw.2.t:0 "唯日与月"
yan_fw.2.d:0 "§W〔旁白〕§!：百灶宫城的铜壶滴漏停了一刻。檐下日影微斜，太傅案头的算筹已摆了一整夜。\n§M太傅§!：「日升月落，原本各司其职，从无并立之理。」\n§C望§!：「可偏偏今年天道乱了，日月要同悬于天。」\n§M太傅§!：「这盘大局，老夫从跟你下第一盘棋起便开始布子，等的便是你按捺不住的这一刻。」\n§C望§!：「我在阴影里忍了六十年，不差这一时半刻。」\n§M太傅§!：「所以老夫今日不押别的，拿整个大炎的国运与你对赌。」\n§C望§!：「赌什么？」\n§M太傅§!：「赌你终究下不去手毁了这人间。」\n§W〔旁白〕§!：棋枰之上已然清空，黑白棋子尽数归盒，唯余一枚黑子被死死按在天元之位。\n§Y真龙§!：「……二位拿大炎作赌注，朕这个真龙，倒成了局外人不成？」\n§M太傅§!：「陛下毋须开口。老夫这一局押在盘心里的，正是陛下万钧之重的一子。」\n§W〔旁白〕§!：真龙不置可否，只是探手入局，将天元上那枚黑子稳稳翻了个面。"
yan_fw.3.t:0 "源石风暴席卷东陆！"
yan_fw.3.d:0 "§W〔旁白〕§!：东境的天幕彻底暗了一夜。次日破晓，遮天蔽日的源石粉尘漫过山脊，如海啸般向内陆平推而来。\n§G左乐§!：「秉烛人急报：罕见的特大天灾风暴自渊海生成，正裹挟高浓度活性源石尘直扑东陆！」\n§R太尉§!：「外围城防障壁可还撑得住？」\n§G左乐§!：「装甲障壁挡得住碎石，却滤不尽漫天毒尘。城内循环系统最多撑过三日。」\n§M太傅§!：「天威难测，不可硬撼。传令各移动城池即刻断开锚点，向内陆地脉深厚处规避。」\n§G左乐§!：「太傅，钦天监刚测过地脉——受岁兽躁动影响，如今越往内陆腹地，地脉反而越发脆弱。」\n§M太傅§!：「那便只剩一条路可走了。」\n§G左乐§!：「……全军向北，借岁陵周边的地脉稳固城基。」\n§W〔旁白〕§!：殿内霎时一片死寂。谁都清楚，北边那座岁陵底下究竟镇压着什么。\n§R太尉§!：「太傅，你是打算把整座主城直接开到岁陵头顶上去？！」\n§M太傅§!：「钦天监的航道图就在老臣袖中。陛下若决意移城，老臣这便陪陛下登城督行。」\n§W〔旁白〕§!：殿门之外，钦天监的一众天师早已捧着罗盘候命多时。"
yan_fw.4.t:0 "阿纳萨罗阇国宣布脱离大炎"
yan_fw.4.d:0 "§W〔旁白〕§!：自西北大漠赶来的信使满面风霜，怀中死死护着一卷以生羊皮缝就的盟书。\n§G阿纳萨使者§!：「西域阿纳萨诸部共尊罗阇，特遣我来通告百灶：自今日起，沙海诸部自立为国，不再奉大炎正朔！」\n§R太尉§!：「放肆！区区化外游牧部族，受朝廷庇护多年，如今也敢妄称国号？」\n§G阿纳萨使者§!：「我族在黄沙与风暴里繁衍生息了两千年，靠的是先祖的苦修与绿洲的泉水，何时靠过百灶的官印？」\n§M太傅§!：「大旱之年，朝廷也曾开仓放粮，调拨天师平息风灾。这桩桩件件，莫非沙海里的人都忘了？」\n§G阿纳萨使者§!：「官府只在天灾时露一面，灾后留下的却是苛捐与关卡！往后西域的商道由阿纳萨自己护卫，不劳大炎费心。」\n§W〔旁白〕§!：使者言罢，依着沙漠部族的古礼直挺挺跪倒在地，脊背绷得如同一张硬弓。\n§Y真龙§!：「西域通商互市，朝廷可以给你们开绿灯。但裂土称国——绝无可能。」\n§W〔旁白〕§!：使者叩首不起，殿外穿堂的朔风吹过，怀中的羊皮盟书猎猎作响。"
yan_fw.5.t:0 "山海众军团宣布脱离大炎"
yan_fw.5.d:0 "§W〔旁白〕§!：十九司的烽火急报一日连递七封，说的尽是同一桩祸事：山海众的黑旗，已插遍了西南群山的险道。\n§G左乐§!：「据斥候查探，这批山海众结成军团之势，却并不急于攻占大城，专挑官仓、驿道下手，沿途朝廷信使无一活口。」\n§R太尉§!：「焚粮断道、屠戮钦差，这已是十恶不赦的叛乱！老夫请旨，即刻发兵进山清剿！」\n§W〔旁白〕§!：太尉咳了一阵，仍撑着案角不肯落座。\n§M太傅§!：「寻常流寇图的是金银粮草，山海众断绝驿道，图的是将西南群山彻底从大炎的版图上剖出去。」\n§G左乐§!：「太傅的意思是，他们在借此举向朝廷正式宣战？」\n§M太傅§!：「他们奉巨兽为神明，视朝廷礼法如寇仇。杀信使、焚官署，就是要断绝百灶对西南山民的号令。」\n§C望§!：「信使自然该杀。信使带进山的是大炎的律法，律法一日不断，山里那些信奉旧神的人就一日不得自在。」\n§W〔旁白〕§!：望冷冷抛下这句诛心之言，便阖目不再言语。殿上群臣面面相觑，无人敢接他的话头。\n§Y真龙§!：「……左乐。」\n§G左乐§!：「秉烛人在。」\n§Y真龙§!：「你亲自下山走一趟。带上司岁台的官印，也备好礼敬先民的清茶——能抚则抚，不能抚，便提兵去见。」"
yan_fw.6.t:0 "岁陵司督政府宣布脱离大炎"
yan_fw.6.d:0 "§W〔旁白〕§!：一纸岁陵司督政府的告示，竟堂而皇之地贴在了百灶司岁台的衙门正门上。落款处赫然盖着司岁台的大印，只是篆文已被私自改刻。\n§G左乐§!：「驻守北境岁陵的旧部哗变了……他们以护陵为名另立督政府，公开拒绝听从宣政司与兵部的调遣。」\n§R太尉§!：「反了！连司岁台自己养的看门人都敢拥兵自重，还立什么督政府，这与谋逆何异？！」\n§M太傅§!：「他们倒还没蠢到直接反大炎——这群人反的，是百灶如今的朝堂。」\n§G左乐§!：「司岁台立衙千载，向来只管镇抚巨兽、不涉朝局，下官实在想不通他们为何会走上这一步……」\n§M太傅§!：「三千年不涉朝政，是因为历代朝廷从不动岁陵的根基。如今朝廷的手伸进了他们的禁臠，有人自然要跳出来掀桌子。」\n§R太尉§!：「普天之下莫非王土，朝廷整顿防务，那是他们自己心怀鬼胎！」\n§M太傅§!：「不管是不是心怀鬼胎，这祸根终究是咱们自己点着的。」\n§W〔旁白〕§!：那张撕下来的布告被呈上御案，末尾一行大字刺目惊心：本府只护大炎万年之基，不奉百灶乱命之臣。\n§G左乐§!：「……秉烛人惶恐，实在参不透这帮同僚究竟受了谁的蛊惑。」\n§Y真龙§!：「你参不透无妨，朕看懂了。」\n§W〔旁白〕§!：散朝时，太尉拂袖而去，步履急促。左乐独自留在殿门外，将那张被揉皱的布告一寸寸重新展平。"
yan_fw.7.t:0 "梦魇可汗国宣布脱离大炎"
yan_fw.7.d:0 "§W〔旁白〕§!：梦魇可汗的国书是直接用短刀刻在整张鞣制兽皮上的，刀痕深可见骨。草原使者单膝点地，行的仍是游牧汗国的礼数。\n§Y可汗使者§!：「我家可汗托我问大炎皇帝一句话：这天下共主的宝座，究竟是靠铁骑的弯刀砍出来的，还是靠祖宗的血脉传下来的？」\n§R太尉§!：「一派胡言！我大炎受命于天，传国千载，岂容尔等塞外蛮夷妄议神器！」\n§M太傅§!：「太尉稍安勿躁。使者既是带着国书来的，不妨把你们可汗的真正条件摆到明面上。」\n§Y可汗使者§!：「可汗说了，草原的雄鹰不稀罕南边的砖瓦城池，但大炎必须即刻撤出北境草场，正式尊奉梦魇大汗与真龙并立！」\n§G左乐§!：「妄图与真龙并立，这便是要分裂北疆，另立汗国了。」\n§Y可汗使者§!：「草原上从不讲你们大炎的藩属规矩！在北原，只有跨上战马的征服者，和跪在马蹄下的败军之将。」\n§M太傅§!：「口气倒是不小。只是不知贵部这位新立的大汗，手里的兵马可够喂饱我大炎北境的边军？」\n§W〔旁白〕§!：使者猛地昂起头，眼中凶光毕露，按在刀柄上的手没有半分退让。\n§Y可汗使者§!：「够与不够，开春的草场上见真章！」\n§W〔旁白〕§!：使者冷笑一声，起身抱拳，大步流星地跨出殿门，只在玉阶前留下一串带泥的马靴印。"
yan_fw.8.t:0 "大炎苏维埃共和国临时政府宣布脱离大炎"
yan_fw.8.d:0 "§W〔旁白〕§!：临时政府的起义宣言是用源石滚筒印刷机连夜赶印的，纸张粗糙，油墨浓重，一夜之间糊满了三座工业城池的街巷。\n§Y临时政府代表§!：「我谨代表工农兵苏维埃向百灶宣告：大炎的天下属于千千万万劳苦大众，绝不属于高高在上的任何一任真龙！」\n§R太尉§!：「大胆狂徒！当朝大殿之上，也敢口出此等大逆不道之言！来人——」\n§M太傅§!：「慢着。太尉且听清楚，这位代表方才说的，是『任何一任』。」\n§G左乐§!：「……太傅，这四字有何深意？」\n§M太傅§!：「前朝造反的草头王，图的是自己坐上龙椅；而这群人要砸烂的，是龙椅本身。」\n§Y临时政府代表§!：「旧朝廷的封疆裂土我们不稀罕，高官厚禄更收买不了觉醒的平民！我们今日进京递这份宣言，只为叫禁城里的诸位看清外头的天色！」\n§Y真龙§!：「……尔等在三座城池里煽动串联，究竟聚起了多少人？」\n§Y临时政府代表§!：「在宣言上按下红手印的工农与感染者，已有三十七万之众。」\n§W〔旁白〕§!：大殿之内霎时针落可闻。三十七万——这数字比司岁台与京畿卫戍在册的人马加起来还要多。\n§R太尉§!：「陛下，断不可退让！今日若是对这群泥腿子松了口，大炎千年的纲常就彻底散了！」\n§M太傅§!：「……可若是立刻动刀兵，明日那三十七万人便会彻底掀翻三座大城。乌萨斯当年的前车之鉴，诸位大人想必比老臣更清楚。」"
yan_fw.9.t:0 "界园封印失控！"
yan_fw.9.d:0 "§W〔旁白〕§!：界园那扇尘封百年的朱漆大门，无声无息地洞开了。门开的一瞬，整座园林里漫天飞舞的落雪竟凭空悬停在半空。\n§G左乐§!：「陛下，天师府查验过了——界园的大阵并非被外力攻破，而是从内侧寸寸崩裂的！」\n§R太尉§!：「从里面裂开的？莫非……镇在园子深处的那个东西彻底醒了？！」\n§G左乐§!：「不，界园的叠景阵法本就是由内向外锚定的。阵眼松动，未必是那尊巨兽苏醒，倒像是……」\n§M太傅§!：「倒像是有人刻意从界园里头，替它抽掉了门栓。」\n§W〔旁白〕§!：幽深的园林深处隐约传来一声极轻的叩击，恰似有人在乾涸的池畔落下一枚棋子。悬停的飞雪纹丝不动。\n§C望§!：「……不必看我，这扇门不是我开的。」\n§M太傅§!：「老夫知道不是你。」\n§C望§!：「哦？太傅如今倒这般信我，连问都不必问？」\n§M太傅§!：「老夫只清楚一桩事——你那位兄弟姐妹藏在界园里的执念若真被彻底放出来，今夜之后，这世上便再无你们容身之处。」\n§W〔旁白〕§!：望神色微敛，没有反驳。随着那声轻响散去，园中凝滞的风雪骤然狂乱，比先前更加铺天盖地。\n§Y真龙§!：「传令司岁台，不惜一切代价，把门给朕重新封死。」\n§G左乐§!：「陛下，界园空间已经彻底错乱，仅凭秉烛人眼下的法器，恐已无法从外部合拢阵门！」\n§Y真龙§!：「外头封不上，那就派人进园子里去——给朕当面问问，究竟是谁开的门。」"
