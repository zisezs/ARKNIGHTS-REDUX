# 猩红剧团 · 三路线（选国家界面路线卡片专用，bm0「酒神的恶趣味」）
 SCR_Route_Lucien_De_Gaul:0 "卢西恩·德·高卢"
 SCR_Route_Lucien_De_Gaul_desc:0 "“卢西恩热爱高卢的一切，包括但不限于喜剧、悲剧、活人、死人、好人、坏人、真实的谎言、虚假的事实.....没人能从他手中夺走他的高卢！”\n剧作家如是写道——"
 SCR_Route_Immortal_Bad_Taste:0 "长生者的恶趣味"
 SCR_Route_Immortal_Bad_Taste_desc:0 "“剧团长阁下，恕我直言，我们真的有陪他们演这出无聊的滑稽戏的必要吗？”\n“嘘。”"
 SCR_Route_Lead_Not_Unique:0 "主演并不唯一"
 SCR_Route_Lead_Not_Unique_desc:0 "钟楼，世界之都！\n林贡斯的倒影在维多利亚与莱塔尼亚上空浮现——\n酒神知道，那是另一个世界的回声——\n“可怜人哟，终究是由我帮你了却夙愿呵！”\n“——尊敬的，科西嘉莉陛下。”"
