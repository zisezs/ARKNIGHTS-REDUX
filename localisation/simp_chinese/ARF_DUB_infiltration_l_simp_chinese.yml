l_simp_chinese:
 DUB_infiltration_decisions: "死火渗透"
 DUB_infiltrated_state: "[DUB_infiltrated_state_decisions_name]"
 DUB_infiltrated_state_desc: "死人可以走很远，活人可以走得更近。让一些人带着一点火种混进维多利亚的城市，先从电线杆、邮局后门和酒馆的桌子开始。每完成一次渗透，这些愿意开门的人会为我们带来§G5000§!人力。"
 DUB_infiltrate_in_state: "在[FROM.GetName]埋下死火"
 DUB_deepen_in_state: "在[FROM.GetName]加深渗透"
 DUB_consolidate_in_state: "在[FROM.GetName]收拢阵线"
 DUB_infiltrated_state_max_num: "当前可同时进行的渗透数"
 DUB_infiltrated_state_num_available_tt: "$DUB_infiltrated_state_max_num$（[?DUB_infiltrated_state_num|Y0]）<[?DUB_infiltrated_state_max_num|Y0]"
 DUB_infiltrated_state_1_modifier: "星火渗入"
 DUB_infiltrated_state_1_modifier_desc: "几条街、几间屋子、几个愿意在夜里开门的人。不多，但已经够了。"
 DUB_infiltrated_state_2_modifier: "暗流涌动"
 DUB_infiltrated_state_2_modifier_desc: "驻军的车队开始莫名抛锚，巡逻表总是慢半拍，城里的消息比公文走得还快。"
 DUB_infiltrated_state_3_modifier: "死火在城"
 DUB_infiltrated_state_3_modifier_desc: "这一带已经不再需要我们下令了。等到开战那天，维多利亚人会发现脚下的每一块地砖都在响。"
 DUB_infiltrated_state_3_modifier_tt: "该地开战时将爆发抵抗"
 NOT_DUB_counter_infiltration: "反渗透"
 NOT_DUB_counter_infiltrated_state: "在[FROM.GetName]清剿深池渗透"
 NOT_DUB_counter_infiltrated_state_desc: "警察和驻军挨家挨户地搜，抓走几个，剩下的就缩回去——至少他们是这么以为的。"
