l_simp_chinese:

# ==============================================================================
#  大炎 · 相见欢（事件链 · 10 环）
#  · 原作 act40side，地点大炎京师百灶，时间中秋（真龙寿辰）
#  · 视角：全篇就在京畿禁城与百灶城里，玩家即朝廷本身
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 卷牍库
# ------------------------------------------------------------------
 yan_xjh.1.t: "七万四千册"
 yan_xjh.1.d: "中秋前一月，十五日夜，大理寺卷牍库南区起火。\n\n烧掉的是七万四千册，六十年的旧案。七塔里的两塔，烧得只剩骨架。\n\n其中大部分，是虞澄当年亲办的太师案卷宗。虞澄是前任大理寺少卿，浩然阁出身，如今已经在狱里了。\n\n火起当夜，他在狱中当众自首，认下纵火。\n\n供词荒诞得不像话：他说有一只乌黑的羽兽衔着稻草飞进库房；他说他听见铁镣撞了栏杆八百六十三下。\n\n然后他指名要一个人来做笔录。\n\n麟青砚。大理寺少卿，天师府苍霆伯的弟子，罗德岛那边叫她惊蛰。\n\n大理寺卿谌彻下了令：麟青砚不得插手。\n\n御史解真却找上她，说了一句反话：你该去现场，亲眼看一看。"
 yan_xjh.1.a: "准麟青砚主审此案"
 yan_xjh.1.b: "依谌彻所请，就此结案"
 yan_xjh.1.c: "交肃政院与大理寺会审"

# ------------------------------------------------------------------
# 2 寻味
# ------------------------------------------------------------------
 yan_xjh.2.t: "一道桔红酥"
 yan_xjh.2.d: "麟青砚把煌从罗德岛带回了百灶，软禁在宅子里，约法三章：勿近生人，勿露感染者身份，勿提父亲。\n\n第一天，煌就跳窗溜了。\n\n她在余味居点了一道桔红酥，嫌太甜，跟店里那个少年大厨打起了赌。少年姓什么没人知道，大家都叫他小大厨。\n\n同一天，她结识了一个自称「行箸散人」的美食评论家。\n\n这两个人在百灶待了一个月，把城里所有的点心铺尝了一遍，只为找回一种味道——十年前从百灶寄往维多利亚的味道。\n\n散人后来说：一个人，只要还愿意好好吃饭，那至少说明，他还愿意好好活着。\n\n这句话是小大厨说的。她说这话的时候，正在给他续汤。"
 yan_xjh.2.a: "拨内帑给余味居，许其在京营业"
 yan_xjh.2.b: "查。一个来历不明的厨子"
 yan_xjh.2.c: "不管。京师里的事够多了"

# ------------------------------------------------------------------
# 3 查档
# ------------------------------------------------------------------
 yan_xjh.3.t: "一份被清空的档案"
 yan_xjh.3.d: "麟青砚潜进了百灶学宫的档案室。\n\n她查出两件事。\n\n第一，顾筌的礼部档案是伪造的。\n\n第二，学宫的档案被整份清空了——不是丢了，是有人按册页一张张抽走的。抽走之后，唯一的去处是刑部死狱。\n\n她姐姐景教授破例放了行。景教授是兵部参知，左乐的母亲。她查出了那个人的真名：顾笙，一〇三七年生于琅珆，一〇六二年与妻女同列失踪档案。\n\n她还点破了一件事：当年支持学界改革的那个太师，和「弑君谋逆」的那个太师，可能不是同一个人——至少，不是同一个叙事。\n\n她说：你要查的是真相，还是那个已经印好的说法？"
 yan_xjh.3.a: "准其调阅刑部死狱旧档"
 yan_xjh.3.b: "驳回。学宫档案不得再动"
 yan_xjh.3.c: "命兵部另遣人复核此案"

# ------------------------------------------------------------------
# 4 宁府
# ------------------------------------------------------------------
 yan_xjh.4.t: "名单上添了一个名字"
 yan_xjh.4.d: "中秋前三日是宁述的寿辰。\n\n宁述是前任礼部尚书，太师的门生。四十年前那桩案子之后，他收养了太师府里活下来的孩子，一直养到今天。\n\n席上来了两个人。\n\n一个是他的孙女宁辞秋，礼部侍郎，刚从大荒城回京。\n\n一个是梁洵，玉门参知，原尚蜀知府。\n\n梁洵在席上讲了一段话：上兵伐谋。他说，对岁兽这一仗，不该打。\n\n宁述当席没有表态。散席之后，他在宴请名单上添了梁洵的名字。\n\n同一天，麟青砚上门质问顾筌的调令。宁述说：他自己求去，病重，想回维多利亚故居。\n\n行箸散人的真身也在这一日揭晓——宁茵，宁述的养女，太史阁的史官。\n\n她把顾筌用过的那间书房，和一只遗留的止痛药瓶，交给了煌。\n\n她说：你能否担得起真相的分量？"
 yan_xjh.4.a: "准麟青砚查宁府旧人"
 yan_xjh.4.b: "驳回。宁述是四朝老臣"
 yan_xjh.4.c: "召宁述入宫，当面问一次"

# ------------------------------------------------------------------
# 5 鼎丰楼
# ------------------------------------------------------------------
 yan_xjh.5.t: "天下一白"
 yan_xjh.5.d: "煌顶替小大厨去参加鼎丰楼的厨师选拔。\n\n第一关品茶，她尝出那是「小寒酒」。\n\n第二关抽签，她抽到一道菜名：天下一白。\n\n她当众把那道菜的来历讲了出来——那是太师当年献的一道菜，一碟清炖萝卜，旁边摆一个夹红腐乳的白馒头。太师献这道菜，是为了劝学。\n\n满堂都静了。总厨莫不服从后厨走了出来。\n\n同一天，麟青砚去查上月十五鼎丰楼第一百号灶台的纵火案。她认出了莫不服——他本名莫小六，当年在刑部死狱做过厨子。\n\n她问出三件事：顾筌曾经入狱；虞澄给他送过饭；宁述把他从狱里带了出去。\n\n后厨漏油起火。一个蒙面人现身又逃脱，临走反问她一句：\n\n你是看不到真相，还是不敢看？"
 yan_xjh.5.a: "查鼎丰楼，溯其总厨来历"
 yan_xjh.5.b: "保护莫不服，不许再有人进后厨"
 yan_xjh.5.c: "封店。鼎丰楼即日起停业"

# ------------------------------------------------------------------
# 6 封口
# ------------------------------------------------------------------
 yan_xjh.6.t: "意外坠河"
 yan_xjh.6.d: "谌彻把话说明白了。\n\n他说：煌的真实出生地是百灶，不是维多利亚。这一点，四十年前的卷宗上写得很清楚——只是那一页被抽走了。\n\n他当着麟青砚的面，把笔录烧了。\n\n然后递上一份卷宗：顾筌，意外坠河，结案。\n\n麟青砚宣布结案，送煌离境。她说这些话的时候，手在抖。\n\n同一时间，百灶遣禁军送了一封邀请函到龙门。\n\n魏彦吾决定赴京。\n\n文月劝他。她说：没有人会记得一个为民请命的大臣，只会有人记得一个弑君弑亲的皇子。用错误弥补错误，是没有尽头的。\n\n魏彦吾没有改主意。他备了车，带了影卫。"
 yan_xjh.6.a: "准结案。此事到此为止"
 yan_xjh.6.b: "不准结案，另遣人密查"
 yan_xjh.6.c: "撤谌彻之职，另委大理寺卿"

# ------------------------------------------------------------------
# 7 对质
# ------------------------------------------------------------------
 yan_xjh.7.t: "从头到尾是冤案"
 yan_xjh.7.d: "莫不服夜访余味居。\n\n他说，三十年前他在百灶城外的古寺门口吃过一碗面，那碗面不像人间的滋味。他找了三十年。\n\n他尝出煌那碗面的汤底跟那一碗同源。他留下一封信，收她为徒。\n\n大理寺的狱里，虞澄等到了宁述。\n\n宁述亲口认下：太师谋逆从头到尾是一桩冤案。老真龙是病死的。朝廷需要一个说法，于是有了这个说法。刑部尚书是他派人杀的。\n\n虞澄反推出换婴与顾笙之死的完整链条。\n\n宁述最后说：我去见陛下。\n\n同夜，解真向麟青砚摊牌。三桩疑案——卷牍库的火、蜜糖封口、鼎丰楼的饵——全是他和虞澄一起设的。\n\n麟青砚才是那个被选中的人：用见得了光的手段，去翻一桩见不得光的案子。\n\n那一夜，麟青砚留下了辞呈和官袍，越狱出走。"
 yan_xjh.7.a: "接宁述的认罪，即日翻案"
 yan_xjh.7.b: "压下口供。案卷依旧封存"
 yan_xjh.7.c: "只查刑部尚书一案，余者不问"

# ------------------------------------------------------------------
# 8 百珍宴
# ------------------------------------------------------------------
 yan_xjh.8.t: "一场形似异兽的妖火"
 yan_xjh.8.d: "中秋夜，禁城，真龙寿辰。\n\n百珍宴开到一半，梁洵动手了。\n\n他造出一场低温妖火，形状像一头异兽，从殿外扑进来。国宴中断。他要挡的不是真龙——是太尉。太尉的作战计划早已拟好，钱粮人力连战后修复花销都算清了，只等今夜先斩后奏，逼真龙对岁兽开战。\n\n宁茵伪造了请柬，冒用户部侍郎唐俭的名义，把麟青砚放进了宫。\n\n禁军小教头在宫中截住了煌。他当众道破：她是四十年前那桩谋逆案里，罪臣家中唯一失踪的孩子。\n\n麟青砚挡在前面。她以惊雷轰开宫墙，把煌掷出了禁城。\n\n宁茵换下煌的衣裳，引开卫兵。\n\n她被刺中，重伤垂死。\n\n最后把她送回宁府的，是一个站在阴影里的人——四十年前，正是这个人留下了她的性命。\n\n他命宁述自己选。"
 yan_xjh.8.a: "追究梁洵扰乱国宴之罪"
 yan_xjh.8.b: "嘉梁洵阻战之功，罪其行而录其心"
 yan_xjh.8.c: "追捕煌与麟青砚，一体拿办"

# ------------------------------------------------------------------
# 9 送饭
# ------------------------------------------------------------------
 yan_xjh.9.t: "五只巨兽"
 yan_xjh.9.d: "中秋后一日，左乐整合了从大炎之外赶回的巨兽学士的情报。\n\n东北、北、西三向，共五只巨兽有苏醒迹象。\n\n这不是天灾，是布局。望布局百年，等的就是这一刻——他要朝廷同时面对五个方向，然后自己一个人走进岁陵。\n\n太傅在城楼上斥梁洵：算得上能谋，但不可谓善断。执棋者以身作子，大多不得善终。\n\n他贬梁洵去天镜阁当誊录郎，随后乘车赴尚蜀古寺。\n\n余关掉了余味居，把店交给老姜。他熬了一锅汤，带去见他的二哥。那锅汤用了他从未动用过的力量，加上陵外百年的烟火。\n\n他只想说一件事：别怀着死志去做那件事。"
 yan_xjh.9.a: "三向同时增兵，全线戒严"
 yan_xjh.9.b: "只备不战。先稳住五只巨兽"
 yan_xjh.9.c: "主力北调，玉门转入攻势"

# ------------------------------------------------------------------
# 10 落子
# ------------------------------------------------------------------
 yan_xjh.10.t: "到你落子了"
 yan_xjh.10.d: "煌以血引火。她和麟青砚、解真、重伤未愈的太合四个人，拦下了禁军小教头。\n\n小教头在师父那句「剑在你手中，做出选择」和眼前这个局面之间，最后收了剑。\n\n禁城撤防。\n\n真龙独自见了煌，吃下那碗长寿面，听她把太师的故事讲完。\n\n她问：你在后悔吗。\n\n他答不出。\n\n她不要道歉，也不要平反。她只要一个承诺：别忘了他们。\n\n随后真龙下了三道旨。\n\n调动百灶全城七成能源，开启岁陵；赦望之罪，准其入陵一搏，事败则以倾国之力诛杀。\n\n赦太师，昭雪其冤。\n\n赦废储君魏彦吾，并自认「不能明断是非，致使忠良蒙冤」之罪，召其回京。\n\n百灶能源紧缩，全城灯火暗了一半。\n\n中秋落雪。多年未雪。\n\n望走入岁陵。它对着黑暗中那位说：胜者生存，败者消亡。\n\n到你落子了。"
 yan_xjh.10.a: "三罪俱赦，昭雪太师，重写史册"
 yan_xjh.10.b: "启陵诛岁。倾国之力，一战定之"
 yan_xjh.10.c: "赦而载其罪。功过并存，以儆后人"
