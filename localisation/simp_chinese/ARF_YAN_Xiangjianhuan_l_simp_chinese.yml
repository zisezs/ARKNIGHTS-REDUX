l_simp_chinese:

# ==============================================================================
#  大炎 · 相见欢（事件链 · 10 环）
#  · 原作 act40side，地点大炎京师百灶，时间中秋（真龙寿辰）
#  · 视角：全篇就在京畿禁城与百灶城里，玩家即朝廷本身
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 卷牍库
# ------------------------------------------------------------------
 yan_xjh.1.t: "七万四千册"
 yan_xjh.1.d: "中秋前一月，十五日夜，大理寺卷牍库南区起火。烧掉的是七万四千册、六十年的旧案，七塔里的两塔只剩骨架。其中大部分是虞澄当年亲办的太师案卷宗。虞澄是前任大理寺少卿，浩然阁出身，如今已经在狱里。\n\n火起当夜，他在狱中当众自首，认下纵火。供词荒诞得不像话：他说有一只乌黑的羽兽衔着稻草飞进库房，又说听见铁镣撞了栏杆八百六十三下。然后他指名要一个人来做笔录：麟青砚，大理寺少卿，天师府苍霆伯的弟子，罗德岛那边叫她惊蛰。\n\n大理寺卿谌彻下令麟青砚不得插手。御史解真却找上她，说了一句反话：你该去现场，亲眼看一看。"
 yan_xjh.1.a: "准麟青砚主审此案"
 yan_xjh.1.b: "依谌彻所请，就此结案"
 yan_xjh.1.c: "交肃政院与大理寺会审"

# ------------------------------------------------------------------
# 2 寻味
# ------------------------------------------------------------------
 yan_xjh.2.t: "一道桔红酥"
 yan_xjh.2.d: "麟青砚把煌从罗德岛带回百灶，软禁在宅子里，约法三章：勿近生人，勿露感染者身份，勿提父亲。第一天，煌就跳窗溜了。\n\n她在余味居点了一道桔红酥，嫌太甜，跟店里那个少年大厨打起了赌。少年姓什么没人知道，大家都叫他小大厨。同一天，她结识了一个自称「行箸散人」的美食评论家。两个人在百灶待了一个月，把城里所有点心铺尝了一遍，只为找回一种味道：十年前从百灶寄往维多利亚的味道。\n\n散人后来说：一个人只要还愿意好好吃饭，至少说明他还愿意好好活着。这话是小大厨说的，她说的时候正在给他续汤。"
 yan_xjh.2.a: "拨内帑给余味居，许其在京营业"
 yan_xjh.2.b: "查这个厨子的来历"
 yan_xjh.2.c: "不管，京师里的事够多了"

# ------------------------------------------------------------------
# 3 查档
# ------------------------------------------------------------------
 yan_xjh.3.t: "一份被清空的档案"
 yan_xjh.3.d: "麟青砚潜进百灶学宫的档案室，查出两件事。\n\n第一，顾筌的礼部档案是伪造的。第二，学宫的档案被整份清空。档案没有丢，有人按册页一张张抽走了它们，抽走之后唯一的去处是刑部死狱。\n\n她姐姐景教授破例放了行。景教授是兵部参知，左乐的母亲。她查出那个人的真名：顾笙，一〇三七年生于琅珆，一〇六二年与妻女同列失踪档案。她还点破一件事：当年支持学界改革的太师，和「弑君谋逆」的太师，未必是同一个人，也未必是同一件事。她问麟青砚：你要查的是真相，还是那个已经印好的说法？"
 yan_xjh.3.a: "准其调阅刑部死狱旧档"
 yan_xjh.3.b: "驳回，学宫档案不得再动"
 yan_xjh.3.c: "命兵部另遣人复核此案"

# ------------------------------------------------------------------
# 4 宁府
# ------------------------------------------------------------------
 yan_xjh.4.t: "名单上添了一个名字"
 yan_xjh.4.d: "中秋前三日是宁述的寿辰。宁述是前任礼部尚书，太师的门生，四十年前那桩案子之后，他收养了太师府里活下来的孩子，一直养到今天。\n\n席上来了两个人：他的孙女宁辞秋，礼部侍郎，刚从大荒城回京；还有梁洵，玉门参知，原尚蜀知府。梁洵在席上讲了一段话，上兵伐谋，对岁兽这一仗不该打。宁述当席没有表态，散席之后在宴请名单上添了梁洵的名字。\n\n同一天，麟青砚上门质问顾筌的调令。宁述说他自己求去，病重，想回维多利亚故居。行箸散人的真身也在这一日揭晓：宁茵，宁述的养女，太史阁的史官。她把顾筌用过的那间书房和一只遗留的止痛药瓶交给煌，说：你能否担得起真相的分量？"
 yan_xjh.4.a: "准麟青砚查宁府旧人"
 yan_xjh.4.b: "驳回，宁述是四朝老臣"
 yan_xjh.4.c: "召宁述入宫，当面问一次"

# ------------------------------------------------------------------
# 5 鼎丰楼
# ------------------------------------------------------------------
 yan_xjh.5.t: "天下一白"
 yan_xjh.5.d: "煌顶替小大厨去参加鼎丰楼的厨师选拔。第一关品茶，她尝出那是小寒酒；第二关抽签，她抽到一道菜名：天下一白。\n\n她当众把那道菜的来历讲了出来。那是太师当年献的一道菜，一碟清炖萝卜，旁边摆一个夹红腐乳的白馒头，太师献这道菜是为了劝学。满堂都静了，总厨莫不服从后厨走了出来。\n\n同一天，麟青砚去查上月十五鼎丰楼第一百号灶台的纵火案，认出了莫不服。他本名莫小六，当年在刑部死狱做过厨子。她问出三件事：顾筌曾经入狱，虞澄给他送过饭，宁述把他从狱里带了出去。后厨漏油起火，一个蒙面人现身又逃脱，临走反问她：你是看不到真相，还是不敢看？"
 yan_xjh.5.a: "查鼎丰楼，溯其总厨来历"
 yan_xjh.5.b: "保护莫不服，不许再有人进后厨"
 yan_xjh.5.c: "封店，鼎丰楼即日起停业"

# ------------------------------------------------------------------
# 6 封口
# ------------------------------------------------------------------
 yan_xjh.6.t: "意外坠河"
 yan_xjh.6.d: "谌彻把话说明白了。他说煌的真实出生地是百灶，不是维多利亚，这一点四十年前的卷宗上写得很清楚，只是那一页被抽走了。\n\n他当着麟青砚的面把笔录烧了，然后递上一份卷宗：顾筌，意外坠河，结案。麟青砚宣布结案，送煌离境。她说这些话的时候，手在抖。\n\n同一时间，百灶遣禁军送了一封邀请函到龙门。魏彦吾决定赴京。文月劝他，说没有人会记得一个为民请命的大臣，只会有人记得一个弑君弑亲的皇子，用错误弥补错误是没有尽头的。魏彦吾没有改主意，备了车，带了影卫。"
 yan_xjh.6.a: "准结案，此事到此为止"
 yan_xjh.6.b: "不准结案，另遣人密查"
 yan_xjh.6.c: "撤谌彻之职，另委大理寺卿"

# ------------------------------------------------------------------
# 7 对质
# ------------------------------------------------------------------
 yan_xjh.7.t: "从头到尾是冤案"
 yan_xjh.7.d: "莫不服夜访余味居。他说三十年前在百灶城外的古寺门口吃过一碗面，那碗面不像人间的滋味，他找了三十年。他尝出煌那碗面的汤底跟那一碗同源，留下一封信，收她为徒。\n\n大理寺的狱里，虞澄等到了宁述。宁述亲口认下：太师谋逆从头到尾是一桩冤案，老真龙是病死的，朝廷需要一个说法，于是有了这个说法；刑部尚书是他派人杀的。虞澄反推出换婴与顾笙之死的完整链条。宁述最后说：我去见陛下。\n\n同夜，解真向麟青砚摊牌。三桩疑案，卷牍库的火、蜜糖封口、鼎丰楼的饵，全是他和虞澄一起设的。麟青砚才是那个被选中的人：用见得了光的手段，去翻一桩见不得光的案子。那一夜，麟青砚留下辞呈和官袍，越狱出走。"
 yan_xjh.7.a: "接宁述的认罪，即日翻案"
 yan_xjh.7.b: "压下口供，案卷封存"
 yan_xjh.7.c: "只查刑部尚书一案，余者不问"

# ------------------------------------------------------------------
# 8 百珍宴
# ------------------------------------------------------------------
 yan_xjh.8.t: "一场形似异兽的妖火"
 yan_xjh.8.d: "中秋夜，禁城，真龙寿辰。百珍宴开到一半，梁洵动手了。\n\n他造出一场低温妖火，形状像一头异兽，从殿外扑进来。国宴中断。他要挡的人是太尉，并非真龙。太尉的作战计划早已拟好，钱粮人力连战后修复花销都算清了，只等今夜先斩后奏，逼真龙对岁兽开战。\n\n宁茵伪造请柬，冒用户部侍郎唐俭的名义，把麟青砚放进宫。禁军小教头在宫中截住煌，当众道破：她是四十年前那桩谋逆案里罪臣家中唯一失踪的孩子。麟青砚挡在前面，以惊雷轰开宫墙，把煌掷出禁城。宁茵换下煌的衣裳引开卫兵，被刺中，重伤垂死。最后把她送回宁府的是一个站在阴影里的人，四十年前正是这个人留下了她的性命。他命宁述自己选。"
 yan_xjh.8.a: "追究梁洵扰乱国宴之罪"
 yan_xjh.8.b: "嘉梁洵阻战之功，罪其行而录其心"
 yan_xjh.8.c: "追捕煌与麟青砚，一体拿办"

# ------------------------------------------------------------------
# 9 送饭
# ------------------------------------------------------------------
 yan_xjh.9.t: "五只巨兽"
 yan_xjh.9.d: "中秋后一日，左乐整合了从大炎之外赶回的巨兽学士的情报：东北、北、西三向，共五只巨兽有苏醒迹象。\n\n天灾只是表面，背后是一盘下了百年的局。望等的就是这一刻，他要朝廷同时面对五个方向，然后自己一个人走进岁陵。太傅在城楼上斥梁洵：算得上能谋，但不可谓善断；执棋者以身作子，大多不得善终。他贬梁洵去天镜阁当誊录郎，随后乘车赴尚蜀古寺。\n\n余关掉了余味居，把店交给老姜。他熬了一锅汤，带去见他的二哥。那锅汤用了他从未动用过的力量，加上陵外百年的烟火。他只想说一件事：别怀着死志去做那件事。"
 yan_xjh.9.a: "三向同时增兵，全线戒严"
 yan_xjh.9.b: "只备不战，先稳住五只巨兽"
 yan_xjh.9.c: "主力北调，玉门转入攻势"

# ------------------------------------------------------------------
# 10 落子
# ------------------------------------------------------------------
 yan_xjh.10.t: "落子"
 yan_xjh.10.d: "煌以血引火。她和麟青砚、解真、重伤未愈的太合四个人，拦下了禁军小教头。小教头在师父那句「剑在你手中，做出选择」和眼前这个局面之间，最后收了剑。禁城撤防。\n\n真龙独自见了煌，吃下那碗长寿面，听她把太师的故事讲完。她问：你在后悔吗。他答不出。她不要道歉，也不要平反，只要一个承诺：别忘了他们。\n\n随后真龙下了三道旨：调动百灶全城七成能源开启岁陵，赦望之罪，准其入陵一搏，事败则以倾国之力诛杀；赦太师，昭雪其冤；赦废储君魏彦吾，并自认「不能明断是非，致使忠良蒙冤」之罪，召其回京。百灶能源紧缩，全城灯火暗了一半。中秋落雪，多年未雪。望走入岁陵，对着黑暗中那位说：胜者生存，败者消亡。"
 yan_xjh.10.a: "三罪俱赦，昭雪太师，重写史册"
 yan_xjh.10.b: "启陵诛岁，倾国之力一战"
 yan_xjh.10.c: "赦而载其罪，功过并存"
