#决议
 KRT_Hubery_decision: "核心城特别调查组"
 krt_noble_ultimatum: "贵族的最后通牒"
 krt_noble_ultimatum_desc: "我们的时间有限，当贵族们得知紧急会议的计划后随时都有可能做出推举新皇的反应！尽管紧急会议能够尽可能的拖住他们，但我们可没办法拖一辈子......"
 decision_button_text: "开始探索"
 decision_close_text: "退出窗口"
 one_decision_text_tt: "27号城区"
 one_decision_text_desc: "大灾变发生时，一整座首都都遭遇了灭顶之灾，其中80%的建筑都在灾难性的气浪冲击波下倒塌，调查队用钉镐和炸弹爆破打开了一条被掩埋的隧道，小队全副武装，成功登陆了源石辐射较小的27号区域。\n根据郊外营地众多幸存者的陈述，他们在匆忙撤离时还看到许多掩埋在废墟下的人没能来得及逃出来，27号城区是一个纯粹的居民区，这里还有不少逃窜的源石虫和硕鼠正在破坏本就岌岌可危的基座结构，废墟中也能依稀听见幸存者的哀鸣，居民楼内很可能还有遗留下的食物和必要物资。\n很显然这里出现皇储线索的几率不大，不过在继续前进之前，我们在27号城区建立了前进营地，眼下摆在调查队面前的只有一个问题，我们不能丢下那些幸存者。"
 two_decision_text_tt: "新乡区"
 two_decision_text_desc: "新乡区是中央-核心城市的边境区域，在很久以前城市刚刚建立之时，这里部署了许多乌萨斯迁移团带来的农业模块，那些模块都被部署在了最初的移动基底上，作为他们的新家园，“新乡”这个名字由此得来，这里的土地耕种区孕育出了无数科里亚特人，成为了那一代共同的回忆。\n几十年的岁月过去了，时间彻底削去了曾经那批久远的科里亚特人忙碌的痕迹，但从这里依稀可以辨认曾经的古旧遗址，即便是恐怖的大灾变也没能彻底摧毁新乡区，但这里寸草不生，盘踞着无数源石虫，那些可怖的源石虫在活性源石的影响下变得富有攻击性，抵达这里的调查队神色忧伤，他们凝望着这里的源石废土，有朝一日科里亚特定要重新将这里再复新生。"
 three_decision_text_tt: "西兰贵族区"
 three_decision_text_desc: "调查队穿过了新乡区的源石虫隧道，从这里开始出现了岔路口，向右是以往的贵族居所，这片豪华奢侈的别墅曾经只有贵族阶级才有资格享有，现在往日美轮美奂的温泉，富有中陆特色的哥特式建筑，乌萨斯的厚顶教堂全部沦为了一片瓦砾堆，放眼望去，只有残破的科里亚特旗帜还在夜空飞扬。\n首都的贵族们作恶多端，这废墟下除了那些贵族臃肿肥臭的身体，还有为了修筑这片城区而死去的无辜劳工，凯林登陛下的极权统治埋葬了多少这样的二等公民？在西兰区贵族们的灯红酒绿之下，那些冤魂却日日夜夜无法得到安宁，这或许就是上天给科里亚特的报应。\n我们从这里能找到什么？又或者连调查队自己都不确信，他们如果在这里看到那些幸存的贵族，能不能控制住自己的身体，不会一铁锹拍上去。"
 four_decision_text_tt: "21号区"
 four_decision_text_desc: "21号城区有着一条长长的水渠被称为斯诺河，这条特别的人工运河于1076年开凿完成，距今近乎20年时间，岸边逐渐伴随着渐渐转凉的天气而冷却，但这条长河已经被大灾变的炽焰消灭殆尽，只剩下河床底部干裂的皲纹和凌乱的源石晶体了，还能偶尔在底部看见船只的铁板甚至发动机的碎屑。\n尽管这里不是调查队前往中央城区的必经之路，但安德尔森还是派出了一支小队进行探查，如果能发现什么有价值的物品将其回收，也好过对这片区域不闻不问。"
 five_decision_text_tt: "新伦隔离桥"
 five_decision_text_desc: "所谓的“内城区”和“外城区”其实是科里亚特帝国专门为了区分两种人所设置的一种隔离区，在中央-核心城这个地方，内外城区被一道高达35米的恢弘巨墙所阻隔开来，被人们称之为隔离壁垒，上面常备驻扎着城防军的数万名士兵和上千座警戒塔，保护着内城区的永恒灯火免遭外界觊觎，同时也看管着外城区数不清的二等公民恪尽职守，为他们的内城老爷们尽心尽力。象征着永恒皇帝不坠落的权力。\n在大灾变前的那场首都内战，隔离壁垒遭遇了一场最为激烈的绞杀战，霍夫曼的军队在这里与城防军激烈搏杀，只为了一个虚无缥缈的皇位，当调查队员们站在巨壁脚下，不禁怅然若失的感慨他们犯下了多么可笑的错误。如果这道壁垒当时阻隔住了霍夫曼的军队，或许大灾变也就不会发生了。\n现在的新伦隔离桥是唯一连接着内外城区的桥梁，也成为了凯林登时代的遗迹，那里破破烂烂，到处都是弹坑，无言诉说着那场政变的激烈和残酷。好笑的是，那道只向上等人敞开的大门已经打开，摆在调查队员面前的阻隔已经不存在了。"
 six_decision_text_tt: "中央城区"
 six_decision_text_desc: "这里没有活人，曾经灯火璀璨的繁荣中央城区已经沦为了地狱，当安德尔森和他的队员们走进这里，他们看到的只有高度源石化的尸体，满是源石怪物的地狱，这里每分每秒都飘散着足以令人窒息的粉尘，那些血红色的活性源石更是在不断增生，调查队员们甚至怀疑这样下去会不会生成源石云簇并导致一场天灾，但专家还是表示这种可能性不是很大。\n在地狱中漫步，与死亡同行，我们每时每刻都在被源石怪物袭击，有不少人在灰霾中死去，但整个科里亚特的希望在我们手中，我们绝不能放弃指尖的那一抹微光。"
 seven_decision_text_tt: "议会区隧道"
 seven_decision_text_desc: "我们的一支小队在这边发现了一小条秘密隧道，但是有点奇怪，我们不知道这里还有这样一个地方，这里的位置相当隐蔽，根据调查队员拉尔森的说法，这是他们先前救下的一名叫做莉莉丝的贵族小姐告诉他们的地方。\n根据她的描述，这里原本是莉斯芬家族的地下区域通道，大灾变过后入口就被掩埋了，我们不知道下面还有没有活人，但是值得一探究竟不是么？"
 eight_decision_text_tt: "科里亚特宫"
 eight_decision_text_desc: "战斗，战斗，厮杀，直到血腥狂热！\n与看不到头的源石生物搏杀已经成为了我们轻车熟路的日常，白天和那些畜生战斗，晚上还要被源石虫骚扰，我们的伤口化脓感染，甚至溃烂，这里的环境要不了几天就能让身体不行的人拉稀拉死。更糟糕的是我们连干净的食物都得不到，感染者数量与日俱增，我敢肯定要不了几天大家就都是感染者了，为什么要来这里遭这份儿罪？\n哈，你猜猜更搞笑的是啥？（此处笔迹缭乱）\n我——们——还——他——妈——要——去——找——权——杖！\n——在大灾变里死了妈的拉尔森下士记于1094年。"
 ning_decision_text_tt: "圣骏堡工业区"
 ning_decision_text_desc: "我们终于回来了！仅仅在几周前，圣骏堡工业区还是帝国初生的奇迹工程之一，这里有上万个分散的零件组装场所，完备的工业化生产线和重型机床，只要全力动工可以快速将数十万人武装起来，也能让帝国崭新的装甲巨兽源源不断下线。\n前进吧，为了祖国，安德尔森有这个预感，调查队员的心情是恐惧伴随着喜悦，他们马上就要接近霍夫曼的宅邸了，在那里他们肯定会发现有关于休伯特皇储的下落......一定会。"
 ten_decision_text_tt: "科里亚特大议会"
 ten_decision_text_desc: "一切兜兜转转又回到了起点，所有的线索都指向一个区域，科里亚特大议会，那里是调查队最终的目标，休伯特皇储的线索就在那里，霍夫曼将最重要的东西留在了那里，他制造的爆炸案就是为了将反对者和证据一同毁灭在那座建筑里，为此放置了巨量的源石炸弹。\n我们现在只能希望，议会的废墟下面还掩埋着我们所需要的东西，让调查队员这几个月来的牺牲不至于白费，现在只有放手一搏，然后等待命运的宣判，无论有没有皇储的线索，我们都问心无愧。"
 elevnt_decision_text_tt: "白夜别墅"
 elevnt_decision_text_desc: "这里是那个罪魁祸首的住所，是那个导致帝国沦为废墟的罪徒之家，他亲手葬送了自己的生命，也彻底摧毁了所有人的伟业，还有几十年来的和平安定，那个人的名字叫做——科里亚特·维尔德·霍夫曼。\n该如何看待这个凯林登陛下的第五个儿子呢？他出身卑微，只不过是凯林登寻花问柳时偶然的产物，这个孩子对于他而言可有可无，霍夫曼经历了一段坎坷的童年时期，宫廷内的仆人瞧不上他，宫廷外的大臣和高官们鄙夷他，就连最不起眼的二等公民都视他为空气，凯林登也时时刻刻把他当成撒气筒，殴打和折磨成为常态。原因无他，只因为科里亚特皇储这个身份实在是可笑之极。在每个夜深人静的漫漫长夜，唯有他的妻子莉娅可以安抚那颗痛苦而强撑坚强的内心，两人相依为命，生活本该这样平凡到底。\n直到浑浑噩噩的日子过了四十余年，凯林登陛下的身体出现了严重的危机，霍夫曼做出了令所有科里亚特人震惊的事情，他雷厉风行控制了首都的绝大部分军队，一手炮制了消灭异见者的议会爆炸案。又用绝对残忍的手段伐同党异，将那些昔日瞧不起他的贵族全都肢解抛入了下水道里独自腐朽，然后裹挟着首都数百万人，毅然决然走向了大灾变的万劫不复中。\n现在，无论这个皇储有多么伟大的野心亟待实践，都已经无从得知他的具体计划，只剩下这座伴随他20余年，自他成为皇储以来就孤冷萧索的别墅，他将其称为“白夜”，这个透露出不详的名字令凯林登陛下很是不高兴，但霍夫曼也从未改变过。\n或许，这也是所有人的白夜，命中注定的白夜，昭示了科里亚特几十年的罪与罚，玩弄岁月者，终究被岁月所玩弄。"
 tweal_decision_text_tt: "守望者酒吧"
 tweal_decision_text_desc: "真不可思议，我们在这里发现了一个怪人，更为震惊的是他是活着的，其实用“活着”这个词汇去描述不太恰当，因为实际上调查队员也不好说他到底是什么状态，试想一个人的皮肤被源石彻底覆盖，就连脸上都被源石裂解成了狰狞可怖的模样，这都已经不能算是感染者了，简直就是超级感染者，这样一个生物还真的能称之为“人类”吗？\n面对这样一个“源石人”，我们又该怎么办呢？如果让这个诡异的生物逃走，是否会造成什么不可言说的严重后果？我们该早做决定！"

#事件(新闻事件)
 news_krt.1.t: "大科里亚特帝国崩溃！"
 news_krt.1.d: "70年前，乌萨斯叛将伊万·凯林登建立了这个帝国。在他英明的统治下，无论是维多利亚、乌萨斯还是哥伦比亚，没有谁能撼动这个帝国的位置——但今天，他崩溃了，从自己人手里。\n\n征战一生、不可一世的君主没有死在黄沙漫天的战场上，他死在了他曾经最信任的皇储手上；随着老皇帝一同离去的还有大逆不道的皇储、帝国首相以及那外强中干的大科里亚特帝国。\n\n皇储叛乱将整个科里亚特皇室拖下地狱，一场被称为“大灾变”的人祸彻底摧毁了帝国的秩序......哥伦比亚等大国宣布将在“大灾变”中保持中立，毕竟又有谁会关心这一个并不重要的“地区大国”呢？这片大地所承受的苦难已经足够多了，我们又何必去关注别人的痛楚？这不过是又一个茶余饭后的谈资罢了。"
 news_krt.1.a: "也许他们会迎来自己的救世主？"

#事件(国家事件)
 event_krt.1.t: "虚假的永恒？"
 event_krt.1.d: "“呃，陛下...皇帝陛下？”\n\n“您有听见我说话吗？”\n\n仆人惊恐的呼唤着，凯林登一世睁开眼睛，这位留着精干胡须的乌萨斯人从昏沉中悠悠转醒。\n\n最近他发现自己格外的嗜睡，似乎有什么东西在胸腔中滚动。口渴的感觉从喉咙中传递上来，皇帝命令仆人给自己倒了一杯水，然后将怅然若失的目光停驻在了中央城区外的街道上。\n\n似乎是惊讶于自己在如此重要的御前会议上睡着了，凯林登一世回过神来，刹那间阴沉的脸色和狐疑的目光就让叫醒他的仆人无比惊恐。\n\n因为皇帝下一秒的命令相当可怕。\n\n“贱人！砍下他的手足，剜出他的心脏，然后全都挂在晾肉架上暴晒！”\n\n在狼哭鬼嚎的仆人被卫兵拖下去后，凯林登一世的心情才稍稍好了起来，放松眉头，抚上自己的前额，仔细思考了一会儿，叫来了内阁总管。\n\n“拿下去检查一下。”皇帝指向他会议前喝过的那杯清水。\n\n总管挑了挑眉头，不敢多说什么，望着再度安静下来的宫殿，凯林登放空大脑，让自己那数十倍于常人的记忆得到完整的释放。\n\n他究竟统治了多少年？\n\n很难说清，中央城区的这条街道已经换了无数茬，就宛如秋天一轮轮被收割的金色麦种，那些久过于远的回忆都被那些过于漫长的时间所吞没了，而温柔的季风一次次从遥远的山岭吹拂而来，自己的精力从未衰竭，身体也没有任何时候会出现问题。\n\n今天定然是那个贱人给自己的水里下了某种安眠药物，竟然愚蠢到以为他发现不了？\n\n直到第二天的一份报告出现在桌子上，化验结果显示，那只是一杯清水。"
 event_krt.1.a: "皇帝沉默的盯着报告上的字眼"
 event_krt.2.t: "永远的皇储"
 event_krt.2.d: "该如何评价科里亚特的皇储呢，答案是无比可悲。霍夫曼最初还不是伟大的科里亚特帝国皇储的时候度过了一段还算安娴的时光，直到他的几个哥哥相继死去，好日子到头了，现在轮到他来承受这个痛苦了。\n\n父皇的生命永不衰竭，而其他人都会遵从生命规律逐渐凋零...他从一出生开始，命运就注定了他无缘皇位。\n\n正因如此，霍夫曼在宫廷内的地位相当可悲，不少贵族将他视为笑柄，称呼他为“永远的皇太子”，并且加之以各种侮辱性的绰号，霍夫曼大多时候都能豁达的一笑置之，对这些奚落表现出了充分的忍让。\n\n直到某次，太子妃莉雅在众人面前受到了奚落，人们讽刺她永远成为不了皇妃，建议她赶紧去上皇帝陛下的床免得错失良机，这直气的太子妃崩溃大哭。\n\n霍夫曼气急败坏拔剑杀死了那个出言不逊的混蛋，只要他不去挑战那个混蛋父亲，皇储的身份注定他可以在这个国家肆意妄为，贵族们异常惊恐，但更多的流言蜚语也随之而来，人们认为他小气，自私，贪婪，总之铺天盖地的咒骂随之而来，帝国皇储一夜之间名声狼藉。\n\n永远的皇储成为了大街小巷人尽皆知的笑话，人们都在用这个词形容一无是处的人，这在霍夫曼看来是无比恶劣的侮辱，但凯林登一世似乎也乐于见到这种皇储的地位被贬低的情况，他现在又能怎么办呢？\n\n霍夫曼常常在夜深人静时独自叹息，想到或许一劳永逸的结束自己的生命，让皇室颜面扫地，才是报复混蛋父亲的最好方式，但他又是如此的不甘，如此渴望亲自攫取帝国皇位，看一看那个权力的世界有多么美妙非凡，以至于泪眼婆娑的莉雅跪坐在床边看向他时，他柔软的心再一次动摇了。"
 event_krt.2.a: "“别担心，莉雅，我不会做傻事的。”"
 event_krt.3.t: "金钱和情报"
 event_krt.3.d: "北方军驻地，埃帕尔城的风沙连天吹过，西陆独有的荒漠天气令人烦躁，在这种干燥环境下，连最精干的驮兽都必须频繁补充水分，才能在荒野上泛滥的源石风沙中顺利前行，贫瘠的牧民们一次次穿行在这片了无生机的土地上，为这个不为他们着想的国家奉上一分心力。\n\n“你在开玩笑？”\n\n安德烈皱起眉头，五皇子对眼前这个鬼精鬼精的沃尔珀男人的话相当不满，他说自己带来了首都内独一无二的消息，出价20000个源石锭，少一个子他都不会成交，并声称这个消息绝对值得这个价钱。\n\n真搞笑，安德烈心下嗤之以鼻，他为什么要在自己的地盘上花大价钱去买一个骗子的谎言？他甚至连消息的真实性与否都没办法核实，20000源石锭可不是一个小数目了。\n\n“别着忙，我的大人，您该看看这个。”\n\n古灵精怪的沃尔珀诡异的笑了笑，脸上露出无比期待的神情，然后将一张名片递了过去，上面显示他的身份是荒野旅团的秘密眼线，他们对侦查和反侦查都有顶尖的能耐，最重要的是，荒野旅团绝对不会说谎，否则他们的信用将彻底破产。\n\n安德烈微微思索，放下了焦躁的心情，他突然好奇起来，什么消息能值这个价钱。\n\n“滚去领赏，然后赶紧滚回来告诉我是什么！”\n\n笑眯眯的沃尔珀不久后便回来了，然后凑了过来，在皇子的耳边一字一顿，只说了几个简单的单词。\n\n“凯-林-登-陛-下-正-在-衰-竭。”\n\n空气似乎一瞬间冰洁了，房间内压抑的气氛蔓延开来。"
 event_krt.3.a: "安德烈错愕的抬起了头"
 event_krt.3.tt: "§Y皇帝的秘密正在北方军中曝光，安德烈已经意识到什么了？§!"
 event_krt.4.t: "宫廷医生"
 event_krt.4.d: "霍夫曼并不是一个蠢货，恰恰相反，他在昨天就意识到不对劲了，作息一向规律的凯林登陛下昨日未能来到他忠诚的科里亚特宫聆听臣民的汇报，平时的脾气也变得异常暴躁易怒，经常因为小事就处死一些可怜的仆人，那些残忍的手段让哀鸣连夜不绝，让他都感觉做的有些过了。\n\n而且还有一个很明显的变化让人不得不去注意，宫殿内的气氛很是奇怪，那些皇帝近臣战战兢兢，他们眼神恍惚谨小慎微，生怕惹出什么乱子或犯下错误引起别人注意，每当自己看向他们，都能感觉他们几乎要把头埋到胸口。\n\n发生什么事了？\n\n霍夫曼苦思冥想，近几年来南方比勒陀利亚人的进犯屡次被击退，与哥伦比亚拓荒团持续了数十年的边境冲突也因为安德烈北方军的常驻而告终，整个帝国欣欣向荣，人民一片幸福，还有什么地方值得老皇帝忧心？\n\n突然，一个可怕的猜想出现在他的脑海中。\n\n霍夫曼脊背发寒，他悄悄吩咐自己的亲信，将宫廷内那位训练有素的斯顿医生带到自己面前，并亲自给了他一大笔钱，那是足以让医生远走高飞的数字，许诺他不会有任何人知道这件事。\n\n几天后，从核心城的中央区，信使带来了一份秘密的日常体检报告，它被放在了霍夫曼的桌子上，上面特别用绝大多数科里亚特人看不懂的莱塔尼亚文字写明了病因。\n\n——心脏衰竭。"
 event_krt.4.a: "财富是如此巨大的力量"
 event_krt.4.tt: "霍夫曼已经知晓了皇帝的秘密"
 event_krt.5.t: "焦虑"
 event_krt.5.d: "霍夫曼呆呆地站在父皇的房间前不知所措，他仅仅是路过宫殿，就听到了如此可怕的声音，几乎是再三吸气，才有勇气推开那扇比看上去要沉重的多的大门，映入眼帘的是凯林登一世惨白的脸色，他不可置信的表情仅仅闪过一瞬间，随之而来的是难以想象的欣喜，他没有任何表情露出哪怕一丝破绽，只是将倒在地上抽搐的老皇帝扶起，然后关心式的询问了几句。\n\n凯林登一世勃然大怒，他歇斯底里的咆哮甚至穿透了科里亚特宫结实的天花板，一路抵达最上层的勃兰利特斯基大厅，所有人都感到无比恐惧，每次皇帝这样做，都意味着有坏事发生了，长生者瞪着血红的双眼，手臂还在不停发颤，试图在着旁边的虚无抓到什么。\n\n“滚出去！滚！朕不需要你的搀扶！你这个幼稚而愚蠢的孩子！以为我有什么问题吗？”\n\n“是的父皇，很高兴看到您还能活动自如。”霍夫曼识趣的松开手臂，勾起嘴角转过身去，然后愉悦的看到凯林登有些臃肿的身躯蹒跚了几下，再度跌倒，嘭的一声碰掉了附近的某种瓷器或者高脚杯，然后又是极力遮掩的哀鸣和怒火充盈的怒吼。\n\n门口的仆人面面相觑，苦涩的望着霍夫曼轻松的大步离开，他们看着那扇装点的富丽堂皇的大门，谁也不敢去进去探明情况，但还有什么需要看的呢？\n\n那不过是一个老人在挣扎起身，试图证明自己罢了。\n\n今天晚上，科里特宫传出消息，凯林登一世砍了两名不知死活试图采访皇帝的记者，然后把他们的人头腌在了酱缸里，这让核心城内一片哗然。\n\n霍夫曼皇子今天则跟莉娅特地吃了两大碗饭，胃口很好。"
 event_krt.5.a: "他越是遮掩自己的虚弱，他就越是感到愉悦。"
 event_krt.6.t: "焦虑"
 event_krt.6.d: "安德烈努力把自己脑袋里打结的想法转过来，为什么呢？他始终想不透，也不明白来自荒野旅团的消息为什么会如此深刻的动摇他的心思，但是父皇要死了，心脏衰竭是只有那些凡人才能生的病，但这并无药可治，至少当前他还没有听说过有什么地方的什么机构能他妈治好这种东西，莱茵生命？黑钢国际？沃朗沃科斯基？全都他妈的废物！\n\n相比较这种绝症，好像连矿石病这种慢性绝症都不算什么了，安德烈的冷汗浸湿了衣衫，在夜空下，四周静悄悄的，只剩下北方军的灯火在巡逻的移动城市中摇曳晃动，他站了起来，再也无法忍受下去，想一想吧，如果凯林登那个老不死就此完蛋，霍夫曼将会成为皇帝，而他们平时的关系只能用糟糕透顶来形容，谁能担保他会大度的既往不咎？\n\n况且，他根本就不想看到那个整天只会对自己老婆发癫的二傻子上台，他不能坐以待毙，北方军还在他的手里，从埃帕尔到华雷兹的人民全都支持他的宣称，而霍夫曼手里有什么？那群指挥混迹宴会厅互相吹捧的狐朋狗友？首都核心城虽然坚不可摧，但他手中的陆行舰同样不是吃素的。\n\n那是属于他的皇位，谁都别想夺走。\n\n想到这里，安德烈露出了一个诡异的笑容，他叫来了北方军的参谋总长，也是他所信任的心腹，然后旁敲侧击问了他几个军事上的问题，得知了陆行舰的油料和北方军的士兵随时都能出发。\n\n安德烈想了想，不假思索的将双手背过腰间，用正义凛然的语调开口。\n\n“很好，先生，根据情报，首都附近出现了绣锤。”"
 event_krt.6.a: "“让我们去给他们一些教训！”"
 event_krt.6.tt: "安德烈的北方军所属的陆行舰和移动城市开始朝首都移动了......"
 event_krt.7.t: "城市戒严"
 event_krt.7.d: "“戒严？有必要这么干吗？”\n\n克里·羽皱起眉头，用不信任的眼神瞧着霍夫曼，皇储给出的毫无说服力的理由，没有让她相信现在真的到了什么危急关头，哥伦比亚人打过来了还是南方土邦造反了？就因为皇帝自己的问题就封锁整个核心城？而且在没有任何根据的情况下断言全城处于危险中？简直疯了。\n\n现在中央核心城乱作一团，宪兵占据了每个街道，警察局的长官也全都配合军队的调度开始拉起警戒线，惊恐不安的市民在质疑到底发生了什么，而贵族议会的人似乎全都默认了霍夫曼的行动。\n\n克里·羽思索片刻，冷眼盯着傲慢的霍夫曼缓缓开口：“我们是不是应该谨慎考虑这件事？”\n\n“不好意思，克里·羽小姐，但是现在这个国家已经有了新的主人，现在我不是在跟你谈判。”\n\n霍夫曼微笑的坐在椅子上，喝了一口热咖啡，然后漫不经心的瞧着核心城正在缓缓启动的城防炮，他的军队已经准备好了，并且联络了维尔德大区虽有忠于他的贵族，只要安德烈那个蠢货踏入火炮射界，就立刻把他那该死的凯林登号陆行舰送上天！\n\n“现在是抉择的时候了，站在我这边，或者是...”他的言外之意相当明确，而且从门外的脚步声来看，至少有好几名全副武装的帝国近卫埋伏在房间周围。\n\n克里·羽突然有点想笑，凯林登陛下才仅仅宣布隐退几天，这个国家的两个皇子就迫不及待准备谋权篡位，她一瞬间就明白了霍夫曼的意思。\n\n作为帝国最后的几个王朝派代言人之一，少女明白这种时候如果拒绝意味着什么，她仅仅思考片刻便给出了答复：“好。”\n\n“很高兴你能加入我们，克里·羽小姐。”霍夫曼笑了笑，他当然不会白痴到相信这个女人仅仅一个字的应答，于是示意门外的近卫走了进来，矗立在门边如同一具深铜色的雕塑。\n\n“请不要随意外出，小姐，我们会保障你的日常饮食。”霍夫曼冷笑几声，跟随亲信走了出去，他要彻底掌控城市，然后将那些不服从的人尽数清除干净。\n\n她被软禁了，当克里·羽意识到这个事实时，少女相当平静，她望着遥远的核心城天际线，眼眸低垂，希望一切都能平稳落幕......"
 event_krt.7.a: "中央城陷入了白色恐怖当中，全面戒严的日子到来了。"
 event_krt.7.tt: "§R为了霍夫曼皇储！§!"
 event_krt.8.t: "无一幸存"
 event_krt.8.d: "克里·羽从废墟中挣扎爬起，当大灾变发生时，她很幸运没能看到那个璀璨夺目的巨大火球，因为有幸经历那个画面的人已经被恐怖的热源风夺取了视力甚至生命。霍夫曼的软禁某种意义上救了她，那段厚实而特别坚固的异钢混铸墙吸收了来自第一轮的全部冲击力，然后才以缓慢的速度碎裂开来。\n\n她的脸色仍旧有点难看，望着一片了无生机的废墟，缓缓抚上自己的双臂。说不出的情绪涌上心头。\n\n战争以如此滑稽可笑的方式落幕未免令人伤感，但克里·羽此时想的是另外一件事，这场意外对帝国来说意味着什么呢？努力构筑了一百年的集权象征不复存在，统治者的威望被一扫而空，而现在这座残破的首都也失去了其全部灵魂，她该如何继续保证科里亚特王朝的存续呢？\n\n“很高兴你幸运的活下来了，克里·羽小姐。”平时在议会里有幸与她见过一面的安德尔森表情复杂的走了过来，她认识这个人，贵族议会中为数不多对她抱有好感的一位维尔德贵族，人称“老好人”的慷慨绅士。\n\n“你看见其他幸存者了么？”克里·羽只在必要时礼貌性的点头，顺便低声问道，“发生什么了？难道因为天灾信使的失职，核心城被陨石撞击了？”\n\n“要是陨石撞击很可能就不是这样轻松了。”安德尔森苦笑几声，他首先跟克里·羽握了握手，然后思索了片刻，“中央城区的主动力炉发生了爆炸，内城区已经没有幸存者了。”\n\n“很遗憾，我们没能找到两位皇储以及陛下的遗体...”\n\n没有幸存者了，这句话变成撞钟叩动了克里·羽的心脏，少女的眼神狠狠抽动了几下，凯林登，安德烈，霍夫曼三个人狗咬狗，最后三者先后葬入地狱，这个结局还真是令人找到了滑稽剧的感觉。她总是习惯将自己理性的情绪隐藏在波澜不惊的表情下，但这一次，她没能一如既往。\n\n“小姐，比起这场爆炸本身，现在有一个更严重的问题。”安德尔森皱了皱眉。\n\n“我知道。”\n\n克里·羽打断了他，语气相当平淡，“科里亚特王朝目前没有继承人，而贵族议会在几天前就被某皇子解决了，我们必须讨论接下来该如何解决继承问题，全国很快就会动荡不安了。”"
 event_krt.8.a: "永恒的皇冠终于坠落在地......"
 event_krt.8.tt: "§R大灾变很快就会被全国乃至邻国所知，他们很可能会采取行动，我们要抓紧恢复秩序！§!"
 event_krt.9.t: "上层风流"
 event_krt.9.d: "科里亚特·迈因作为中央核心城的城防军总督，帝国的中央总参谋长和维尔德战区的最高长官以精干明练为人熟知，其五官端正的特质也能给别人一眼留下好印象。\n\n久而久之，许多维尔德贵族都与这位可敬的军官建立了牢固的联系，在他人口中的迈因饱受赞誉，在凯林登陛下为其亲自授予南方战役黄金勋章后，顺理成章的成为了所有保皇党人士的领袖人物。\n\n“大灾变”发生时，迈因作为外城区城防军总司令指挥自己的部队与冲入城市的北方军搏斗，他们的位置靠近外侧，当源源不断的北方军士兵几乎如同潮水涌上移动城市的高耸壁垒，这些混账竟然下令朝着源石锅炉开火，那些居民区灰飞烟灭的画面令迈因相当震撼。\n\n很快，随着皇储全部遇难和皇帝的身死，王朝派人士集结了起来，迈因的个人魅力和目前无可争议的威望将劫后余生的北方军和残余的城防军团结了起来，他暂时接管了北方军的指挥权，并将满腔怒火很好的忍耐了下来，现在这个快要散架的鬼地方再也经受不起哪怕半点冲突了。\n\n“大灾变”发生六小时后，迈因与一些城防军军官正式宣布接管城市，军队在外城区了设置哨卡，严禁任何人进入内城区的废墟地带，并召集所有仅剩的政府官僚前来讨论下一步的计划，克里·羽及其幕僚也在其中，帝国的保皇党们集结了起来。"
 event_krt.9.a: "我们伤痕累累，也被迫学会团结。"
 event_krt.10.t: "上层风流"
 event_krt.10.d: "科里亚特·迈因作为中央核心城的城防军总督，帝国的中央总参谋长和维尔德战区的最高长官以精干明练为人熟知，其五官端正的特质也能给别人一眼留下好印象。\n\n久而久之，许多维尔德贵族都与这位可敬的军官建立了牢固的联系，在他人口中的迈因饱受赞誉，在凯林登陛下为其亲自授予南方战役黄金勋章后，顺理成章的成为了所有保皇党人士的领袖人物。\n\n“大灾变”发生时，迈因作为外城区城防军总司令指挥自己的部队与冲入城市的北方军搏斗，他们的位置靠近外侧，当源源不断的北方军士兵几乎如同潮水涌上移动城市的高耸壁垒，这些混账竟然下令朝着源石锅炉开火，那些居民区灰飞烟灭的画面令迈因相当震撼。\n\n很快，随着皇储全部遇难和皇帝的身死，王朝派人士集结了起来，迈因的个人魅力和目前无可争议的威望将劫后余生的北方军和残余的城防军团结了起来，他暂时接管了北方军的指挥权，并将满腔怒火很好的忍耐了下来，现在这个快要散架的鬼地方再也经受不起哪怕半点冲突了。\n\n“大灾变”发生六小时后，迈因与一些城防军军官正式宣布接管城市，军队在外城区了设置哨卡，严禁任何人进入内城区的废墟地带，并召集所有仅剩的政府官僚前来讨论下一步的计划，克里·羽及其幕僚也在其中，帝国的保皇党们集结了起来。"
 event_krt.10.a: "我们伤痕累累，也被迫学会团结。"
 event_krt.101.t: "克里·羽就任帝国首相"
 event_krt.101.d: "举结果在所有人的意料之中——克里·羽以绝对的优势击败了所有的竞争对手。这位在“大灾变”中以惊人速度崛起的“少数派”领袖正式以保皇党党魁的身份就任帝国首相。\n\n克里·羽是休伯特王子的坚定支持者，这也是她一度泯于众人的原因之一。因为没有人会关心一个放弃政治地位的王子——在新的时代开启之日，过去的固化的思维定式也早应该被打破了。\n\n作为紧急会议的主要发起人之一，克里·羽在政治地位的飞跃中仍始终坚持致力于创建一个“只忠于休伯特殿下“的保皇党。凭借强大的政治手腕，她确实冲破了异议者的围剿。\n\n无论如何，人们相信随着克里·羽的上台，帝国距离属于她的重生又更近了一步。"
 event_krt.101.a: "为新领袖欢呼！"
 event_krt.102.t: "最后的皇储"
 event_krt.102.d: "尽管最近有不少科里亚特发生严重内乱的消息传出，但对科里亚特早已没有多少认同感的休伯特对此并没有多少在意——尽管他几个月前险些死在了某个科里亚特人手里。如今休伯特只想尽情地混迹在叙拉古的底层人民手里，靠着在叙拉古政府任职的薪金来支持他的社会学研究活动。\n\n因为自己做居住的社区被与之结仇的黑帮彻底封锁，休伯特今天不得不留在家中。靠在椅背上，他百般聊赖地翻阅着一位乌萨斯左派学者所著的《MapkonЗm-ЛehИhИЗm》，嘴上还不住地评论着书中的内容。突然，房屋内的座机响了。\n\n休伯特一脸嫌弃地望向座机上显示着来自科里亚特的终端号码。接通终端，他听见了那个熟悉而又陌生的声音：“您好，请问这是贝尼托·休伯特先生的号码吗？”\n\n......\n\n挂断电话，休伯特瘫坐在椅子上，四周的一切仿佛都变得孤独惨淡。他的心跳得飞快，不知这是登上帝位所带来的兴奋还是家破人亡所带来的悲伤。隐居海外十余年的休伯特想过自己重归祖国的那天，但绝对没想到自己的海外生涯竟会如此收场。\n\n看向不远处一脸迷惑的亲信埃里克斯，休伯特无力道：“收拾收拾东西，咱们得回去了。”他叹了口气“小维啊，你家里死过人吗？”"
 event_krt.102.a: "咱们坐航空器回去吧"
 event_krt.103.t: "休伯特一世"
 event_krt.103.d: "载着皇储科里亚特·维尔德·休伯特的车队很快就要到达中央。然而,迎接这位新皇储的不是欢呼的民众与满地的鲜花，而是一批又一批紧张的士兵与不久前从哥伦比亚进口的装甲战车。\n\n混乱的帝国今非昔比，全国上下都笼罩在在大灾变所带来的混乱中。时至今日，中央核心城已经经历了近百次大大小小的袭击，各地驻军自顾不暇，驻守中央的军队仅剩从大灾变中幸存的部分正规军与警察部队了。\n\n为了确保新帝的安全，休伯特的登基典礼在省去了大量不重要的步骤后显得十分简短。接过象征着权力与地位的权杖后，登上帝位的休伯特改称科里亚特·维尔德·休伯特一世，正式成为了大科里亚特帝国的第二任皇帝。\n\n面对着寥寥无几的政府官员与记者，休伯特发表了一篇简短的继位演讲，号召人民团结起来恢复秩序。帝国的官方媒体很快将新皇继位的消息与演讲内容发往全国，并声称和平与稳定很快就会到来。\n\n如今,科里亚特王朝的第九位王子、帝国最后的合法继承人——科里亚特·维尔德·休伯特一世；一个脱离政坛十余年,毫无威望的叛逆王子重新回到了这个令他熟悉而又陌生的帝国。"
 event_krt.103.a: "他也许不是最合适的，但他绝对是最正统的"
 event_krt.103.tt: "§Y帝国永存 §!"
 event_krt.10.t: "战争巨兽"
 event_krt.10.d: "月光下，中央外环的楼房好似一条连绵不断的长城。不高，却封锁着整个核心城。\n\n作为拱卫京城的存在，外环拥有有仅次于核心城的防御体系，平时叛军攻不进去，今天政府军也打不出来。如今它是贵族叛军的地盘。经过长时期与政府军的作战，叛军在外环建立了36个堡垒，各个堡垒遥相呼应，形成一条被称为“牢不可破”的防线。\n\n夜晚，在11区堡垒高大的哨塔里，一名身披轻甲的士兵打起探照灯，对身边的同僚说道：“核心城真的敢反扑吗?”\n\n围困中央已成为各路军阀的共识，超过五万大军将核心城围了个水泄不通。虽说紧急会议仍有近八万的军事力量，但却乏补给的城防军无力突破叛军的封锁。\n\n同僚架起弩箭，不屑道:“那帮尸位素餐的官僚，咱们开个炮都能让他们拉一裤子屎。”\n\n“反扑也好!等那群娘们哭着跑回家找阿妈时，咱们去捞几个皮诺萨——那滋味!嘿嘿......”\n\n“如果有菲林就更好了！”\n\n两人对视一眼，齐声哄笑。\n\n“你不知道!我那一次......”\n\n守卫边说着话边向核心城方向看去，然而以往灯火辉煌的核心城似乎被一块黑色的幕布遮挡，随之而来的还有一串微弱的大型原石引擎声。\n\n此时的内外环交界处荒无人烟，更没有什么人会在大半夜启动这种只有重型作战模块才会装备的原石引擎——更何况根本就没有哪股叛军拥有此等规模的重型载具，除了......\n\n突然，那名守卫想到了什么，两眼发直，颤抖着抬起了探照灯，难以置信地死盯着眼前的庞然大物：“战....战争巨兽？他们怎么敢!”\n\n在守卫按响警报之前，巨大的火球便吞没了整个哨塔，也毁灭了坚垒与周围的民房。同样的突袭还发生在其它的35个堡垒上……\n\n紧急会议出动了所有的陆军、空军与重型作战模块，一场全面的协同打击毁灭了叛军苦心经营的整个外环防线。尽管整个内外环交界地区在城防军的炮火之下几乎夷为平地，但紧急会议不计成本，不计损失的突装计划取得了圆满成功——整个中央重新回到了城防军的控制之中。"
 event_krt.10.a: "这只是清算的开始!"
 event_krt.10.tt: "§R我们将不计一切代价!§!"
 event_krt.201.t: "无威之君"
 event_krt.201.d: "这个毫无君主气质的皇帝陛下从来都不是那么的简单。他厌恶了皇室的龙争虎斗，厌恶了贵族生活的纸醉金迷。\n\n不同于大多数迂腐守旧的贵族子弟，科里亚特不但拥有自己的终端，还拥有一部哥伦比亚进口的新型电脑；他通过网络了解卡西米尔的骑士商业化，他通过网络阅读莱塔尼亚的哲学与文化，他向往哥伦比亚的高度信息化，他敬佩龙门币货币体系的成功与繁华......作为帝国最小的皇子，皇帝陛下对这个默默无闻的九皇子几乎毫无关注，而大哥们则试图将这个小老弟拉拢进自己的势力。16岁那年，厌恶了争斗的科里亚特带着几名卫兵和一大批皇室俸禄离开了祖国，开启了他那跌宕起伏的海外生涯。\n\n科里亚特去过伦蒂尼姆，到过圣俊堡，他见识了哥伦比亚的民主与繁华，也看到了莱塔尼亚的哲学与文化......外国之旅深深震撼了本性善良的科里亚特———他惊讶于底层人民的生活的饥寒交迫，更震感于感染者社会的水深火热！\n\n“为什么要这么对他们？他们只是生病了啊！”\n\n尽管儿时在常常看见外城的农民们抱怨政府征收的苛捐杂税，听着大哥们一次又一次谈论屠杀感染者们的快感。然而道听途说远不及亲眼见证，如今的科里亚特才真真正正的接触到了泰拉大陆最卑微，最底层的这一批人。\n\n后来随着腐败的官员们把科里亚特每年所得的俸禄一拖再拖，花光了最后一点积蓄的科里亚特不得不在外靠着友邦接济，进厂打工甚至是当雇佣兵为生；但他仍然愿意为那些饥寒交迫的流民带上一块面包，让那些流离失所的感染者们住进自己本就不宽敞的小屋......\n\n从外国回来后，迎接的文武百官与民众们并没有看到一个光鲜亮丽的九五至尊，他们只看到了一个风尘仆仆的新王与那一大箱精心保存的社会学著作。如今的科里亚特拥有了一个他愿为之终身奋斗的梦想———一个没有所谓偏见，没有歧视，没有是非感染者之分的，真正平等的世界！\n\n此后的人们常常看到一个白日里总是出没于底层人民与感染者社区的“败家老爷”，与皇宫高楼那一盏黑夜里从未熄灭过的灯......"
 event_krt.201.a: "天佑吾皇"
 event_krt.202.t: "决心"
 event_krt.202.d: "“为什么要这么对待他们？他们只是生病了。”儿时被当成笑柄的一句戏言升旗改变了休伯特一世的命运。\n\n在炎国游历时，一位大儒的名言为休伯特一世带来了前所未有的启发“为天地立心，为生民立命，为往圣继绝学，为万世开太平。”\n\n“我为自己立的命是什么？我的初心又是什么？”这两个问题伴随了休伯特一世剩下的旅程，亦使他完成了从一名贵族阶层同情者到社会活动家的蜕变。\n\n“感染者，苦苦挣扎的人……这就是答案吗？”\n\n站高塔上的休伯特一世扫过夜空中的点点繁星，看向一片漆黑的感染者社区与手中不久前病死的感染者小女孩送来的布偶，暗暗下定了决心……"
 event_krt.202.a: "走自己的路，让别人去说"
 event_krt.203.t: "风暴前夜"
 event_krt.203.d: "今天上午，休伯特一世在修缮完成的皇宫里召来了自己的文武百官。这位无威之君召开了自己政治生涯真正意义上的第一场会议，议题是国家的重建工作。这是休伯特一世计划开始前的最后一步——他需要了解官场对自己与底层民众的态度。\n\n不出所料，会议在激烈的争吵中不欢而散。尽管以克里·羽为首的忠君派占了参会者的相当一部分，但紧急会议结束后，官僚们便又一次失去了共同的利益，开始着手收回“大灾变”时帝国欠下他们的“人情”。\n\n在他们看来，毫无威信的皇帝不过是一个软弱无能的傀儡，手无雨铁的底层民众是用于谋利的工具，而感染者不过是一群任人宰割的牲畜。休伯特一世需要时间立威，克里·羽也需要时间重新整合政府——但他们不愿再等了！\n\n经过一整夜的商讨，皇帝与首相各自回到了他们的工作岗位。前者得到了他的答案，后者得到了她的计划；一份又一份的名单被秘密送进克里·羽控制的内务部，两人将合力掀起一场新的风暴"
 event_krt.203.a: "我们即将步入新的时代！"
 event_krt.204.t: "时事新闻"
 event_krt.204.d: "半夜，休伯特一世歪坐在办公桌前，百无聊赖地翻阅着泰拉大陆的时事新闻。突然，他坐正身子，向门外的卫兵叫道：“安娜，进来一下。”\n\n卫兵走进门，休伯特一世头也不抬，专注着电脑屏幕：“安娜，你去过哥伦比亚吗？”\n\n“是的，陛下。”\n\n“那帮哥伦比亚佬竟然在他们的新政策里鼓吹公平？每个人都能找到自己的位置？包括感染者？”休伯特一世注视着卫兵，“那么，哥伦比亚佬什么时候才能把公平灌输到感染者隔离法案？呵，安娜！这是公平么？”\n\n“报告陛下！这显然不是公平。真正的公平应该是每个社会成员都拥有平等的社会、经济权利，而哥伦比亚人将感染者排除在外。”\n\n“不错，你还记得这些我教过的内容。”休伯特一世走到卫兵面前，端正她的衣领，“感染者……那群大老爷们的牲口，你怎么看？”\n\n“报告陛下！虽然比较特殊，但他们也是与我们一样的人。尽管比较难控制……”\n\n休伯特一世走到窗边，示意卫兵站在身旁。他叹了口气，指向远处汇成一片星河的光斑：“那是康特的家，他是一个感染者，也是个有潜力的家伙。帝国的军事学院，感染者是不让进的；但他混在工人里，还是溜进了学院。靠着这个办法，他偷学了一个月的战术指挥课程；上周，他混进来听课时被我抓了个正着。带他去校长室聊天时，我才发现这是个不可多得的将才。安娜，他们一点都不特殊，也一点都不好事，他们只是一群找不到医生的病人！欺负弱者，压迫同胞，何必？”\n\n“继续奋斗吧！安娜，我们会为他们带来一个更好的世界。”\n\n“是，陛下！”"
 event_krt.204.a: "一个理想主义者的自我陈述"
 event_krt.205.t: "子弹如苏打般涌现"
 event_krt.205.d: "当这批官员被全副武装的士兵们押送到凯林登广场时，他们看到了一大群前来围观的群众与不久前帝国花重金请来的五个拉特兰公证的重型连发铳班组。当初嘲笑皇帝玩物丧志的官员们终于知道了休伯特一世请来这些天使真正的目的——送他们去见上帝。\n\n这群死到临头的官员只觉得自己经历了无比离谱且梦幻的一天。内务部的莫明其妙地掌握了他们几乎所有的犯罪证据，而皇家卫队的顶尖高手则亲自下场将这群或军阀或文官或财阀从他们自认为牢不可破的层层保护中轻描淡写地将他们如小鸡一般拎出来由正规军的列车送往中央审判。\n\n起初这群犯官们还在审判庭上大喊“我为帝国流过血，是我们迎回了皇帝，我要去见陛下！”但当他们发现在场人员几乎全是除克里·羽派以外的党派要员时，一片沉默。\n\n为了激起民众的兴趣，帝国处刑方特意开放了开火倒数服务。在群众乐子人兴高采烈的倒数下，一名犯官望着吐着火舌的铳口与飞速而来的子弹苦中作乐：“子弹如苏打般涌现……”"
 event_krt.205.a: "他们又是否想过有这样的一天？"
 event_krt.205.tt: "帝国真正是我们的了！"
 event_krt.206.t: "犯官财产的处置问题"
 event_krt.206.d: "成功的突袭使我们几乎完全控制了这些犯官在帝国境内所有的财富——一笔惊人的巨款！若能合理地利用这笔财富，这将为我们带来一个不错的收益。"
 event_krt.206.a: "这可是我们一年的税收！全部收入国库。"
 event_krt.206.b: "让他们回到自己原来的主人手里吧！"
 event_krt.206.c: "朕的！全是朕的！"
 event_krt.1000.t: "《我有一个梦想》"
 event_krt.1000.d: "内容待定"
 event_krt.1000.a: "欢迎来到泰拉人的时代！"

#事件(国策事件)
 focus_krt.1.t: "帝国1094决议"
 focus_krt.1.d: "帝国的1094决议是由我们永恒不灭的伟大陛下，凯林登一世所亲手起草拟定，规定了国家未来三年的主要发展方向，决议上列出的许多目标深刻的表明了皇帝陛下将科里亚特建设成工业化强国的决心，首先，决议明确规定了需要征召数以万计的劳工前往核心城，在27号城区开辟出至少额外的三个工业区划，其次，帝国在南方的农业区划也需要悉心建设，皇帝陛下特别要求财政预算保留在农业领域的需要，在育种和开辟新田方面都起到了积极的作用，想必我们南方的人民定然对此欢呼雀跃。\n\n在北方，我们于哥伦比亚的的贸易路线十分稳定，荒野旅团也时不时带来远方的商品，大科里亚特帝国的人民在西陆的生活数一数二，我们由长生者统治的国家注定和其他的君权制国家不同，我们永远拥有一位伟大的皇帝在指引我们走向正轨，因此我们不会惧怕任何敌人。"
 focus_krt.1.a: "我们的国家正在蒸蒸日上。"
 focus_krt.2.t: "贪婪之触"
 focus_krt.2.d: "科里亚特帝国是整个西陆官僚最多的国家，如此多的官僚大多都是吃空饷的存在，这里也是贵族最多的聚居地，赘余的编制早已容纳不了如此多的裙带关系，于是官官相护的情况渐渐成为了常态，不健全的法律根本约束不了任何贪腐行为。\n\n这里的贵族构成绝大多数都是乌萨斯人，所谓维尔德贵族就是那批最早追随吾皇凯林登一世抵达这片土地的人，百年时间过去了，当年的贵族虽然已经死去，但他们的后代仍然在这片土地上繁衍生息。\n\n或许当年那批离开中陆的乌萨斯溃军还保留有血性和不屈的开拓精神，但到了这一代，对所有科里亚特人来说，贵族已经成为了腐朽的代名词，政府效率低下，跟那些有着贵族血脉身份的公务员说话简直都是天大的恩赐，去办理一张简单的出行身份证明如果没有关系至少需要一个月，而如果真的是什么大事那你就只能祈祷神主保佑了，那个主事的贵族真的能偶然看见你的请求，然后又大发慈悲的从家里走五步路到马路对面的办公室给你盖个戳，然后看都不看一眼丢到你面前，那简直都能让人乐死。\n\n当然，绝大多数人最后都只是收获了失望，曾经有许多民众联合起来在凯林登格勒，这座以伟大陛下命名的城市揭露某些贵族无赖的贪腐行径，但这些声音很快就石沉大海，甚至有人拦在了贵族的铁牢里面，从那以后，抗议事件销声匿迹。\n\n金钱和权力，这是在科里亚特唯一有用的两行铁律，这里只有三种人，维尔德贵族和低等人，还有不可接触者，如果你很倒霉的的不是最前者，那最好想办法另谋出路走出这里，或者在这个国家继续受苦，直到某天迎来生命终结。"
 focus_krt.2.a: "要么离开，要么接受。"
 focus_krt.3.t: "南方土邦"
 focus_krt.3.d: "科里亚特帝国的领土构成很有趣，作为一个融合国家，外来的乌萨斯人和部分当地土酋构成了如今的科里亚特统治阶级，帝国建国之初仅拥有维尔德大区和移动城市中央城，而今通过数次哥伦比亚战争和征服土邦，我们已经将领土延伸到了比勒陀利亚的固有势力范围内。\n\n对于帝国南境的的萨尔贡人来说，大科里亚特帝国是一个噩梦，他们在帝国属于二等公民，也就是跟那些感染者没什么区别，科里亚特人自诩高贵，他们打心眼里瞧不起萨尔贡人，更遑论居住在当地的比勒陀利亚居民。\n\n自从比勒陀利亚的军队惨败于此，耀武扬威的土酋们就长期骑在他们横征暴敛，但中央城却对这些视而不见，任由帝国南方不足三分之一的人口承担了帝国三倍有余的赋税，同时对这里的萨尔贡人进行强制征召劳役，荒野部落们日日南望，希望在那风沙之中能出现某个萨尔贡世界派来的马穆鲁克骑兵，然而令他们一次次失望的是，那边只有无穷无尽的野蛮滩涂。\n\n不过，这些南方的土邦酋长相当明白一顿饱和顿顿饱的区别，在帝国给了他们强大自治权的前提下，他们也明白，进一步争取独立是不现实也不可取的方式，只要帝国能一直保持这种现状，他们不介意将从贱民那里收上来的多余赋税上交，而他们仍然能将自己的腰包塞的满满的，这是完美的互惠共赢，帝国的统治因此定会长治久安。\n\n1094决议中要求的农业补贴大多都流入到了当地土邦的手中，分到农民手中的少之甚少，随着帝国南境愈发贫瘠，几次当地人起义已经让科里亚特南方出现混乱局面，不过凭借着强大的镇压机器正在运作，土邦酋长们仍能控制局面。\n\n当然，副作用就是整个国家在源源不断的内耗中虚弱下去，至于荒野上的饥荒？\n\n我问你，移动城市里的人饿着了么，没有你急什么哇？"
 focus_krt.3.a: "附骨之疽，生而不散。"
 focus_krt.4.t: "二等公民"
 focus_krt.4.d: "泰拉世界并不仅仅局限于移动城市，或者是，移动城市只是泰拉很小的一部分。\n\n源石引擎给居住在城市里的人带来了常年的稳定，这一个个城区都可谓是美妙的工业奇迹，当天灾来临，他们能从容不迫的离开，而当天灾席卷而过，他们又能再次回到这片土地上，有规律可循的天灾意味着他们建立了一个稳定而足以养活绝大多数人口的活动范围，这被称为所谓的安全航线，也是绝大多数国家确定国土的依据。\n\n而在航线的夹缝或者间隙，有许多固定的村镇和乡野，这些地区的人在其他国家或许能得到照顾，但在科里亚特，有资格的人都被招入移动城市，而没有资格或犯下罪行的人，则会被丢到航线上的这些固定居住点，他们既能给帝国开拓荒野，也可以作为给移动城市的补给点。\n\n泰拉世界的农业大概分为两部分，第一部分是依靠移动城市固有的农耕区，第二部分就是荒野的耕种区了，天灾泛滥，这个世界的人们也逐渐习惯了恶劣的环境，在周期性的天灾下努力在创痕大地上耕种出代表希望的粮食。\n\n孤星城外，夏米怯生生的探出脑袋，盯着从移动城市出来的大人物们，作为感染者，他们不被允许居住在城市里，从她记事起，那些巨大的钢铁模块中就居住着许许多多的大人物，他们衣装华丽，身份显赫而高贵，每次来到村子里都会挑出许多精干的人，然后用麻匹或者是粗布将他们完全裹住，装到一个下面有轮胎的大箱子里，然后看着他们逐渐走远。\n\n他们是帝国的二等公民，由于长时间从事野外工作，夏米的爸爸患上了矿石病，在某次体检中被检测出来，随后被丢到了荒野上，这个感染者村落每年最不愿意看到的就是移动城市因为天灾迁徙经过他们的村子，那意味着，有人要来“收货”了。\n\n“这次的感染者足够了？”一个工头踩下油门，不耐烦的回头瞥了几眼，卡车上的“货物”，无视了村庄内感染者复杂的目光。\n\n“差不多，工厂应该不缺人了，帕尔克先生差不多会满意的。”另一个年轻的工头不自然的缩了缩肩膀，他心虚的回望村子，发觉自己的腿脚哆嗦的厉害。\n\n黄色的烟尘滚滚而起，夏米哭了起来，那辆卡车里抓走的有她的朋友，菲林小女孩尚且纯粹天真，她不知道那意味着什么，她只知道，自从妈妈被抓走后，已经一年没有回来了。现在家里只有她，他们为什么全都要去那个巨大的铁盒子里面呢？什么时候才能回来陪夏米？\n\n村长摇头叹息，将夏米接到了自己家，那天晚上后，村子里仅剩的几个孩子明白了，二等公民在帝国意味着什么，以及他们被送进工厂代表着什么。"
 focus_krt.4.a: "日复一日，工厂主们在这块宝地中肆意狞笑。"
 focus_krt.5.t: "贵族议会"
 focus_krt.5.d: "议会？哪有什么议会？\n\n这个词本身就是错误的。\n\n科里亚特的人们流传着这种笑话，对于议会，最好不要抱什么期待，因为你没准找随便一个贵族跟他说两句粗俗的俚语反应可能还更大些，没准能过来给你一巴掌或是什么的——至少有反馈不是？\n\n泰拉许多的国家都是这样做的，比如维多利亚，再比如莱塔尼亚，搞出一个虚妄的议会来敷衍平民们，让他们相信自己的国家自由而民主，要不是高卢战争带来的一系列麻烦事，贵族们才懒得废这些功夫搞这些表面文章。\n\n民主制度是失败而低效的，高卢的毁灭已经很说明了问题，如果没有绝对权威的声音来引导那些贱民，他们不知道要提出多少个馊主意然后搞乱我们的国家，公投不会存在，更没有什么全民投票，贵族议会本身就是最佳的权利机构，由少数人决定多数人的方向，然后坚定不移的执行它。\n\n贵族们在有闲情逸致聊天的时候发表过这些看法，不过对于科里亚特的贵族们来说，他们显然没有意识到，所谓的威权民主与贵族议会压根不是一回事，这只不过是他们用来操纵国家的傀儡与工具罢了。\n\n权利与义务本应相辅相成，但在科力亚特完全反过来了，贵族们几乎享有无限的权利而不必为其他人负担些什么，为什么没有人提出建设一个真正的议会呢？\n\n去公墓啊，那些人已经被凯林登陛下埋在土里了。"
 focus_krt.5.a: "贵族即国家。"
 focus_krt.6.t: "大议会的毁灭"
 focus_krt.6.d: "科里亚特大议会，指的是位于帝国首都中央-核心城广场的中心地标建筑，其自1064年修建完毕为止就屹立在广场的中心，建筑最高处达30米，呈现出九边形，美轮美奂的异铁和五彩缤纷的玻璃构成了西陆最宏伟的建筑之一，整体抗震能力极强，自建国以来，大议会就是科里亚特团结统一的象征，也是贵族议会和国防军军官的办公处，是帝国开放自由的标志，也是凯林登一世为之骄傲的杰作。\n\n天气晴朗，清风柔和，一辆油光锃亮的军车停驻在广场上，几名军官有说有笑谈论着最近的新闻，帝国广播电台的《每日笑话》成为了城防军中风靡一时的节目，其主播谈吐风趣幽默，里面的情色笑话也成为了士兵们闲聊之余的热门话题。\n\n“将军？有什么问题吗”军官疑惑的看向突然停下来的长官，不由得低声问道。\n\n科里亚特·迈因今天皱起眉头，他不满于由于秘书的失职，自己在今天重要的会议中迟到了几分钟，他叹了口气，只好扶了扶自己的帽檐思考着待会与会上要说的内容，作为首都城防军的最高指挥官，他总感觉今天眉心有股异样，似乎有某种危险的直觉在提醒他离开这里，大议会的墙面反射出五颜六色的霞光，温暖柔和的夕阳正在下落，这里和以前并没有什么太大的不同，魅力非凡。\n\n他犹豫片刻，然后突然意识到什么，向后快步跑去，朝着另外几个呆若木鸡的军官大声嘶吼。\n\n“该死的！有问题，快去叫...操！”\n\n事实证明，他的直觉是对的！这救了他一条命！\n\n——轰！\n\n还没等他喊完，如同平地惊雷的巨响便彻底震惊了整个中央核心城，迈因刚刚没跑出多远，中央城区升起了一大缕令人瞩目的黑烟。漆黑色的源石穿刺天空，弥漫出一股血红色的光芒漫过了视野，整个广场的所有声音都被超过音速的气流所压制，迈因被气浪掀翻出去，自己的耳膜阵阵疼痛，不由得痛苦的皱起五官，广场上的所有人呆滞的望着这副景象，男人们惊吓大吼，女人捂住嘴忍不住抽泣。\n\n一个盖过视野的巨大火球升腾而起，彻底覆盖了整座科里亚特大议会...\n\n“天啊！大议会！”\n\n“神明在上...”\n\n当迈因从被爆炸掀翻的晕眩感中回过神来，他才发现那座科里亚特的象征，皇帝的骄傲已经倒塌了，碎成了一滩瓦砾堆，那场爆炸的威力是如此惊人，而比起这座珍贵的建筑本身毁灭，迈因却注意到更加恐怖的事情——城防军和贵族议会几乎全部重要人员都在那座建筑里！\n\n很快，姗姗来迟的救护人员在废墟中无助的搜寻着生还者，自然，他们所能找到的只剩下一片茫茫的黑灰...广场的遇难者多达上千人，重磅源石炸药同时爆炸的威力，令人恐惧。\n\n这件事在第二天登上了新闻头条，整个帝国的民众为之震惊，随之而来的是震怒，纷纷要求政府搜捕凶手。\n\n讽刺的是，凯林登陛下曾经说过，只要他在位，这座建筑就是泰拉世界最安全的地方。"
 focus_krt.6.a: "嗯，不错，好消息，至少我们以后都不需要开会了。"
 focus_krt.6.tt: "§R议会已经覆灭了§!"
 focus_krt.6.ttt: "§Y王朝派的影响力下降了，§!§R这正是某些人所希望的......§!"
 focus_krt.7.t: "消失的凶手"
 focus_krt.7.d: "凶手是谁？\n\n当警察和鉴定人员在大议会的地下发现了提前埋葬的大量炸药残骸，推测出事发前有术士算准时机用源石技艺远程引爆了那批炸药时，克里·羽心里就已经有答案了，能够提前凿开厚达五米的大议会地基，再神不知鬼不觉的把大量源石炸药埋进去，除了那位皇子殿下有这样的能力，还能有谁呢？\n\n她只能怅然若失的叹了口气，然后静静等待着事件的发酵。\n\n没过两天，舆论的风向大变，似乎从一开始就准备好了，媒体和新闻报纸上的论调开始针对起北方军，《科里亚特时报》率先开炮，声称爆炸的凶手是来自北方军的一名士兵，而安德烈皇子亲自策划了此事，那名士兵也在众人面前认罪，这无疑坐实了北方军的罪名。\n\n而北方军的回应也同样强烈，军队马不停蹄，穿越孤星城抵达郊外地区，安德烈对于中央的软蛋说什么压根不甚在意，凯林登号陆行舰已经逼近首都不足六十公里的位置，双方都即将达到主炮的最大射程范围内，安德烈呼吁首都内的居民们不要抵抗，北方军唯一的目的就是消灭以霍夫曼为首的叛军。\n\n双方军队剑拔弩张，城防炮已经升起，校准标尺瞄准了地平线以外的凯林登号，而城外的野战军也已经占据了有利攻击位置，炮击阵地已经在高地部署完毕。\n\n“您知道这意味着什么吗？”安德烈如此质问冒进的军方参谋，将军舰抵近到如此近距离的位置很可能引爆冲突，但他实际上不想在这个时候对首都动武，如果核心城能够识相的话，这场政变将以最少的牺牲方式结束。\n\n三十分钟后，有一名上校违反了安德烈的命令，过度紧张将对方的警告炮击当作了实质攻击，因此下达了进攻命令。\n\n拂晓的日光照射在陆行舰的甲板上反射出亮眼的光泽，随着凯林登号三联主炮一声炮响，科里亚特帝国的中央城壁垒随之颤动，战斗打响了，北方军的登录步兵伴随着大量无人机开始涌入3号城区，安德烈表情错愕，看着他的军队疯狂向着移动城市涌了过去。\n\n然而，至于是谁在议会放下了炸弹，仍然没有任何定论。"
 focus_krt.7.a: "战争时刻已至！攻下那里！安德烈万岁！"
 focus_krt.7.tt: "§R核心城陷入了动荡！§!"
 focus_krt.8.t: "天命"
 focus_krt.8.d: "“不要去，求你了！”\n\n莉娅抱住霍夫曼的手臂，她没有想到事情会沦落到如此地步，就在两个月前，似乎还什么都没有发生，她的生活还能正常进行，丈夫也能和往常一样结束一天的工作安然回到家中，她不求什么皇妃或者彪炳千古的名声，她只不过希望能有一个温暖的家罢了。\n\n霍夫曼咬了咬牙，已经是关键时刻了，只要杀了凯林登，然后再凭借核心城的天然优势一举解决安德烈，然后他就是这个帝国的主宰，怎么能在这个时候前功尽弃？\n\n“相信我，我会是最后的胜利者。”\n\n“不...求你了...不！”莉娅瞪大眼睛，泪水从她的眼眶滑落，沿着光滑的脸蛋一滴一滴溅到华丽的胸衣上，她张开双手，固执的当在大门面前，不顾外面弩枪和巨炮的刺耳轰鸣。\n\n“滚开！”霍夫曼冷下心肠，将她推开，这是他四十年来最兴奋的一天，现在城防军绝大多数力量都效忠于他，那个老头子死期将至了，没有人能阻止他，就算是安德烈也一样！这是多么千载难逢的一个机会，可能再也不会有了。\n\n皇储丢下了她，任由莉娅跪倒在地，捂脸痛哭。\n\n“陛下万岁！凯林登一世万岁！！”\n\n中央核心城内的壁垒坚固无比，城防军中分裂成了两股势力在街道上激烈交战，双方拿着相同的武器厮杀，喊着相同的口号，双眼血红，源石技艺和爆炸笼罩了街区，窗户早已被贴封上胶布，又被火炮爆炸的余波所震碎，一辆坦克碾过残垣断壁，用最后一发主炮终结了内城区最后的抵抗。\n\n霍夫曼几乎是欣喜若狂的看到自己的军队冲入了内城，然后城防军的旗帜和帝国的旗帜同时在狂风中跌落，内城区的富豪和资本家早已闻到消息卷款逃亡，他歇斯底里的咆哮着，举起长剑，然后带头冲入科里亚特宫，他要趁乱做完这件他早已期待多年的事情。"
 focus_krt.8.a: "“为了帝国！”"
 focus_krt.9.t: "致命地带"
 focus_krt.9.d: "外城区的战斗进入了白热化，短短几个小时，北方军就以强大的法术和重炮混合火力压制了桥头，几艘陆行舰配合工程桥开始强行建立桥头堡，但在城防军霍夫曼派无人机的重磅轰炸下损失惨重，法术的爆炸，冷兵器敲击的声音，重炮的轰鸣将整个城墙壁垒绞成了一团鲜血磨盘。\n\n炮弹炸出一个个璀璨的源石花朵，鲜血将其滋润的更加鲜艳妖冶，这片土地洒满了血肉，源石虫四处逃窜，不知在这样的滋养下，日后会开出怎样的花朵？\n\n城防炮的压制火力令城外的炮兵阵地苦不堪言，双方的炮战以北方军的完败而告终，陆行舰“亨特里尔”号被一炮击中了弹药库，巨大的火球殉爆将整个战舰残骸抛射到了天空上，令整个战场为之恐惧。\n\n安德烈有些坐立不安，进攻持续了六个小时依然毫无进展，甚至已经出现了极大的损失，他不能容忍这种情况继续下去了，时间拖得越久，北方军的境况就会越不利，他们无从补充补给，而霍夫曼的力量只会越来越强，这仗就没法打了！\n\n他命令参谋长启动预备方案，开始在城外修筑固定炮台，使用406mm大威力源石火炮直接轰击几个给城防主炮供能的源石电站。\n\n“但是殿下，这样做的话...”参谋长震惊于安德烈的命令，想要继续辩驳什么。\n\n“没有可是！我让你们做！立刻！”\n\n安德烈愤怒的一脚将参谋长踢开，抽出军刀横刃向前，咬牙切齿朝着所有在场的嘶吼起来：“今天，要么我征服这座城市，要么北方军的所有人死在壁垒之下，霍夫曼不会放过你们任何一个人，已经没有退路了！”\n\n“前进！科里亚特人民期待着一场全面胜利！想想伟大的凯林登陛下！为了帝国！”\n\n紧锣密鼓的修筑工作持续了半天，直到黑夜，一道绚丽的火光划过天际，准确的击中了移动城市边界区划的链接桥和供电站，刹那间，源石锅炉的殉爆至少让上千人遇难，无数居民区和街道在惊叫和恐慌中被烈火吞噬，源石粉尘相继蔓延，数个城区成为了恐怖的高危感染区。\n\n“胜利！胜利！胜利！！”被冲昏头脑的北方军跨过了瘫痪的惩防炮，成功在中央城建立了数个前进基地，现在霍夫曼那个混蛋就洗干净脖子等死吧！\n\n军队本是为了保护人民，而现在......\n\n一个北方军士官面对燃烧的外城区，颤抖的扔下了自己的弩枪，又哭又笑，在燃烧的房间前跪了下来。"
 focus_krt.9.a: "像野兽般磨牙吮血，没有怜悯。"
 focus_krt.10.t: "弑君"
 focus_krt.10.d: "窗外的秋日愈发明亮，凯林登一世安静的坐在床榻上，对耳中的动乱充耳不闻，仿佛外面惨遭屠戮的仆人，七零八落的打砸声都不存在，这位乌萨斯长生者终于也尝到了无数人都要走的必经之路，死亡所带来的厚重深刻的刺激着他，无能为力的感觉这么多年以来头一次出现。\n\n大门被一个源石技艺炸开了，被弩箭射成筛子的卫兵瞪大眼睛倒在红地毯上，将那颜色混合的更加鲜红，霍夫曼勾起从容的微笑，示意其他人站在门外，而他则肚子走向那位皇帝，就像是在一条无比神圣的朝圣之路前行，每一步都格外沉重。\n\n“都结束了。”霍夫曼平静无比，擦拭着手中的精致弩枪，他想象着那个画面，仅仅是想想就要让全身的血液都沸腾起来。\n\n“是么？”凯林登突然诡异的笑了笑，那一瞬间他回忆起了久远的中陆战争，那可真是个地狱啊，乌萨斯的贫瘠冻土，故乡吹来的暖风，还有圣骏堡上的大阅兵，博卓卡斯替那位令乌萨斯军队敬佩不已的无冕之王，过去的战友出现在面前...马德尔，道丁，拉斯维克，他们来接自己了，来接这个他们在百年前就该带走的兄弟。\n\n凯林登一世脸上露出淡淡的笑容，他无比从容，是时候结束他有关科里亚特的春秋大梦了，他也要好好休息一下，去地狱和老朋友们说一说，百年后的世界多了些什么，又少了些什么。\n\n“你有胆量杀掉我么？”\n\n“要弑君，那就来吧？你真的敢扣下扳机，蒙受弑君罪名？”\n\n霍夫曼的表情不可抑制的扭曲了过来，这个垃圾，这个只不过因为幸运一点就不可一世，不把所有人放在眼里的混账东西还有什么资格跟他叫板？老东西早就该被岁月夺去生命了，自己来帮他一把也没什么不对的，只不过是早晚的问题，他马上就是皇帝！大科里亚特皇帝！所有人都会对他俯首称臣！\n\n他的手颤抖的举了起来，对准了皇帝的眉心，直到那几乎不听使唤的手指毫无知觉的扣下扳机，然后是第二下，第三下，第四下...弩弹穿颅而过，带出一抹蓬松的血肉，凯林登一世毫无痛苦的结束了自己上百年的光阴岁月，终于，那些老朋友微笑朝他伸出了手。\n\n“皇储！皇储殿下！他已经死了！”\n\n“什么...”\n\n霍夫曼大口喘息，稍稍有些恍惚，当看到那具熟悉又陌生的尸体时，他的眼泪从眼角倾泻而出，喃喃对着虚无说出一句无人听得清楚的呓语。"
 focus_krt.10.a: "“再见了，父亲。”"
 focus_krt.10.tt: "§R真的结束了？§!"
 focus_krt.10.ttt: "§Y科里亚特·维尔德·凯林登一世§!逝去\n§Y科里亚特·维尔德·霍夫曼§!成为§Y大科里亚特帝国§!的领导人"
 focus_krt.11.t: "大灾变"
 focus_krt.11.d: "很难说中央城区的源石锅炉到底是如何爆炸的，或许是源自一场意外，或许是某个冒失鬼在战斗中把爆炸物丢进了锅炉内部，导致了灾难性的连锁爆炸，也或许是当安德烈的北方军冲入内城区时有人悲观的认为局势无法挽回，故主动过载引爆了移动城市的主锅炉，不管真相如何，但事情就是这么发生了。\n\n核心锅炉的爆炸是毁灭性的，它在空中生成了一个巨大的蘑菇云，灾难性的热浪和气流冲过了整个内城区，将几乎全城化为了惨不忍睹的源石焦土，也几乎消灭了内城区全部的军队，当劫后余生的市民和幸存者回过神来，他们悲哀的发现，两位皇子已经在爆炸中全部身逝，而北方军和城防军全部遭到重创，这场战斗以最悲哀的方式落下了帷幕，眼前仅留下一片了无生机，充满辐射的源石废土，所有百年前的财富全部归于尘埃。\n\n还有谁能救赎帝国？这是我们自己犯下的罪恶，彷徨的市民们四处望去，发现他们找不到任何可以信任的人，犯罪和抢劫充斥着劫后余生的移动城市，遇难者不计其数，感染者因此急速增加。\n\n曾经繁荣的首都沦为废墟，这是我们无法承担的损失，以及足以永远铭记的血泪。"
 focus_krt.11.a: "放眼望去，尸山血海。"
 focus_krt.11.tt: "§R首都的战争结束了，两位皇子与陛下全部在这场冲突中逝去，现在帝国进入了悲哀的空位期，大科里亚特帝国的未来飘忽不定......§!"
 happy_krt.12.t: "圣骏堡工业区——完工"
 happy_krt.12.d: "凯林登一世在科里亚特宫的最高点，俯视着脚下的移动城市，经过将近半年的计划的筹备，中央-核心城最庞大的“圣骏堡”工业区已经完成，这个区划以他的母国乌萨斯首都命名，那里有数十万名从帝国各地抓来的感染者和荒野奴隶，他们将为这个帝国发光发热，直到他们不堪其苦倒地而亡，而他们生产的一辆辆装甲巨兽则能够为帝国带来更多的下等公民，今天是这座伟大工业区正式建成的日子，也是帝国1094决议的成果结晶。\n\n皇帝用略显明朗的目光凝视着那些从烟囱冒出来的滚滚黑烟，这源石的力量是如此令人痴迷沉醉。\n\n曾经有人说过，君主制是世界上最稳定的制度，一个精明能干的君主能机敏的察觉整个国家的弊端，并使用雷厉风行的措施解决掉所有危机，它唯一的缺点就是伟大的君王终究会走到寿命的尽头，而金钱，财富，权力，力量，世界上所有的可贵之物都换不来半点寿命，但他凯林登已经超脱了这种局限性，他的永恒帝国就是泰拉大陆独一无二的存在，终有一日，这无垠的力量终将颠覆整个世界，凯林登如此相信着。\n\n人们必须承认世界上有两种斗争方法，一种是运用法律，一种是运用武力。前种方法是人类特有的理性行为，而后者则是兽性行为。\n\n在天灾横行的社会现实面前，前者常常使人力不从心，迫使人们必须将解决问题的方式诉诸武力。这就要求君王必须懂得如何善于运用野兽的行为进行斗争，做君王的如果总是善良，就肯定会灭亡，他必须狡猾如狐狸，凶猛如狮子。然后又兼具蟒蛇般的残忍，将所有猎物无情撕碎。\n\n在中央城区下方，庆祝游行队伍从脚下经过，他们为帝国的繁荣昌盛而欢呼，这些帝国的高等公民是如此发自真心的爱戴他的统治，那些维尔德贵族会与他结成一个牢固的千年同盟，这个帝国将在永恒的团结下击败所有敌人，无数人都将为永恒的皇帝而摘帽致意。\n\n凯林登笑了，他在位几十年来第一次笑的如此发自真心，不是所有人都有资格接受永恒皇帝的馈赠，他明白那些愚不可及的下等人；那些早已被驱逐到荒野的共和派，那些在阴暗的下水道里游窜的老鼠，还有那些饥肠辘辘的感染者都无比渴望杀死他，这都不重要。那些恨着他的人只能日复一日看着他的统治愈发稳固。他的统治从来都不是一昧的打压所有人，而是让高贵者应有尽有，让下贱之人一无所有。\n\n在首都人山人海的欢呼和一声声狂热的“凯林登陛下万岁”的喊声中，凯林登一世才从科里亚特宫的顶端走回了房间内，这个西陆极权之国只会一直璀璨生辉下去，终有一天，凯林登陛下的军队将踏过哥伦比亚，踏过西陆原野，踏过每一寸旧时代的铁索，然后回到他的乌萨斯故土去，将他的意志贯彻到每个人的脑海中——永生者会攫取世间一切权力，带领愚昧之人探寻困扰众生的真理。"
 happy_krt.12.a: "黑暗的大地将永日不复希望和光明。"
 happy_krt.12.tt: "§R大科里亚特终将征服世界！§!"
 focus_krt.12.t: "达成一致！"
 focus_krt.12.d: "王朝派的紧急会议持续了一整天，在外城区幸存下来的人们团结了起来，虽然很难相信，克里·羽以及科里亚特·迈因两个人领导的分歧派别暂时达成了一致，他们决心暂时放下对国家继承问题的分歧，先着手保护首都上百万流离失所的居民免遭饥饿与寒冷的威胁。\n\n鉴于中央城区已经化为源石废土，而移动城市的动力源泉和主要工业区也已瘫痪，首都成立了紧急议会，国家近卫军的工作人员开始在首都组织人们暂时前往首都郊外避难，但是问题仍旧相当严峻。\n\n泰拉世界的补给绝大多数依靠移动城市的生产与陆行舰的输送，移动城市内固有的农耕区和粮仓可以保证市民的稳定生活，也是政治中心和权力象征，不幸的是，大灾变同时消灭了两者。首都已经基本毁灭，更何况凯林登陛下的逝世实际上已经把国家权力推向岌岌可危的地步，不会有太多人承认首都紧急议会的合法性，除非我们能用某种手段说服他们。\n\n不论如何，都行动起来！我们没时间可浪费了！"
 focus_krt.12.a: "以王朝之名！"
 focus_krt.13.t: "空缺的皇冠"
 focus_krt.13.d: "两位尚在国内的皇储和陛下已死，现在帝国进入了空位期，但对于科里亚特王朝来说，最后一位九皇子休伯特于六年前离开了科里亚特，前往中陆诸国游览。虽然不知道他当时抱有什么想法，但现在看来他未能卷入国内斗争真是一件幸运的事，克里·羽希望能找到方法联络到休伯特皇储，然后让他马上回国稳定局势。\n\n“我说了多少遍，现在皇帝根本就不重要，你认为我们要晾着首都一百多万饥肠辘辘的嘴巴，然后等着陛下的九皇子有没有闲情逸致回来瞧瞧祖国变成了什么样子？”\n\n迈因忍不住阴阳怪气的讽刺道，他靠在一堵临时拉起来的帐篷边缘，反对将紧急会议为数不多的精力放在继承问题上。最近这几天让她寝食难安，城市的秩序正在走向崩坏。尽管城防军和北方军的部分人员都在努力维持治安，但有些绝望的市民已经做出了相当不理智的行为。\n\n克里·羽不禁心下嘲弄，漫不经心的把玩着自己那块精致的怀表：“我问你，如果没有皇帝的协助，你觉得我们能够号令那些油盐不进的贵族为首都哪怕掏出一个子儿来？你说对不对？”\n\n迈因相当烦躁，他早就知道跟这个愚蠢的大脑袋站在一起说话是个错误，迈因稍有郁闷的叹了口气，要不是城里那些白痴贵族执着要求克里·羽来说话，这紧急会议他真是一秒也呆不下去了，“好好好，那么你觉得现在我们该上哪找休伯特殿下呢？”\n\n克里·羽思索片刻，像是小狐狸般低笑几声：“我不知道，不过我认为应该向远方派出信使探查消息，看看有没有休伯特的踪迹，你觉得呢？”\n\n迈因闻言哭笑不得，他这辈子头一回可以把微笑保持的如此无语，在整片大地找一个特定的人，这种蠢事也亏她有勇气提出来："
 focus_krt.13.a: "“真有你的，想在整片大陆找一个特定的人？”"
 focus_krt.14.t: "皇储的线索"
 focus_krt.14.d: "“嗯哼，我说你有时间来听听么，我发现了有意思的东西。”克里·羽勾起嘴角，将一台录音机放在了桌子上，然后按下了播放键，里面传来了一名前皇储派人士结结巴巴的声音，他声称皇子休伯特已经死了，他按照霍夫曼的命令亲手给国外的皇子寄去了炸弹，现在帝国不可能再有任何科里亚特王朝的继承人。\n\n克里·羽的脸色稍稍落寞下来，在她的记忆中，勾勒出的休伯特是一个心性善良的人，与冷血无情的凯林登不同，休伯特不论何时都充斥着一种足以鼓舞人心的正义感，他对底层人民的同情心在维尔德贵族圈里也算是异类了，少女某种意义上渴望休伯特能够回来主持大局，这也是她所一直在紧急议会中提倡的解决方案。不论如何，尽管对凯林登一世没什么好感，但克里·羽对休伯特皇储的印象仍然不会受到任何影响。\n\n“可他已经死了，你就想跟我说这个？”迈因哑然失笑，他希望能够联络其他的维尔德贵族进而赶紧让帝国脱离空位期，而不是继续执着于一个死人。\n\n克里·羽有一种天然的直觉，促使她不假思索道：“相信我，皇储没那么容易死，霍夫曼以为一枚炸弹就能杀死他？这是不是太高看自己的能力了。”\n\n迈因怅然若失，他不明白为什么克里·羽如此执着，但现在他不想继续吵架，只能生了一肚子闷气：“这没什么用，不管他到底有没有逃过袭击。我们仍然不知道他在哪里。”\n\n克里·羽微微一笑，他似乎对此相当有自信：“相信我，给我几个月时间，我会找到他的，然后我们可以重新恢复科里亚特的稳定。”\n\n迈因无奈耸了耸肩，他并不讨厌休伯特，如果能找到他当然更好，如果不能，那他将不得不将视线转往其他地方，至少要让众望所归的贵族继承皇位，然后让科里亚特王朝能够继续存续下去，这也是他生存的唯一意义。"
 focus_krt.14.a: "帝国皇储流落在外，是时候接他回家了"
 focus_krt.15.t: "脆弱的构架"
 focus_krt.15.d: "科里亚特帝国的唯一心脏就是中央，当这个心脏不复存在，会产生怎样的危机——克里·羽很悲观的表示，除去一些对科里亚特王朝死心塌地的贵族之外。其他人都巴不得首都人赶紧去死，指望他们来救核心城于水火之中真是异想天开的主意。\n\n想想吧，当那些南部的萨尔贡人听到凯林登陛下逝世的消息绝对会乐到一蹦三尺高，到时候可能来的不是增援，反而是一群拿着草叉火把要把在座各位全都吊死的暴民，现在首都的力量相当薄弱，饶是一贯支持对萨尔贡人缓解关系的克里·羽在面对这件事上也是心有忌惮。\n\n“我们应该封锁消息，但是这样持续不了多久，很快全国各地都会意识到中央出现了严重的问题。”克里·羽如此总结道，许多站在她一面的保皇党人也都如此同意，她继续说下去：“我们的帝国会土崩瓦解，形势会失去控制，在这种情况发生之前，我们必须提前做好准备；要是我们真的让全国都看见首都的窘境，那怕是一切都完了，至少要等我们发现休伯特皇储的下落再说。”\n\n迈因默默吐了一口闷气，他已经连续吃了三四天的木屑餐了，有时甚至是源石虫：“我能理解你的担忧，不过我们至少应该先联络一下其他信得过的城市，至少得让我们从这个该死的情况中得救。”\n\n克里·羽站了起来，接着迈因的话茬说了下去，“我明白，我已经联系了凯林登格勒，他们大概需要一点时间从筹备到抵达这里，那里的总督绝对信得过，我们也可以借此脱离窘境，然后当成现在首都人民的筹码。”\n\n“我们需要依靠他们的军队？”有人不可思议的喊道，有人对凯林登格勒能够信任感到怀疑，但最终，无言的沉默还是笼罩了房间，会议进行的很顺利，直到天黑，至少大家听完克里·羽的话都相继冷静下来。"
 focus_krt.15.a: "为了帝国，我们必须坚持下去。"
 focus_krt.15.tt: "§Y凯林登格勒的军队会给我们提供必要的支持\n三个来自§Y凯林登格勒§!的§Y训练有素§!的§Y作战旅§!与一个来自§Y凯林登格勒§!的§Y训练有素§!的§Y机动化师§!加入了我们。"
 focus_krt.16.t: "联络信使"
 focus_krt.16.d: "大灾变近一个月后，克里·羽踌躇不定的召来了首都仅剩的信使，信使们都相当有精神，有一个小伙子爽朗的笑容让她几乎遗忘了现在的窘境，天气晴朗，荒野上的源石虫在此时也成为了不能浪费的肉制品，现在我们唯一能做的事情就是将视线投向外界，希望全国各地能尽可能团结起来。\n\n她清了清嗓音，然后让自己的话语尽可能清晰：“我们必须尽可能稳住地方，然后让他们知道首都并没有崩溃，如果地方官员对紧急议会抱有敬意，他们就很可能支持我们。”\n\n“你们要了解自己的职责，首都人民的命运掌握在你们手中，为了达成目的，我允许你们使用谎言，欺诈，甚至暴力。”克里·羽的目光闪烁，那一刻所有信使都明白了这位大人的意思，没有什么比帝国的团结更重要，他们要动身前往祖国各地了。\n\n信使们出发了，经过核心城外的原野时，驻扎在那里的市民有人注意到了这些身影，以往这些训练有素的帝国信使就是传达凯林登陛下意志的最好喉舌，但是现在陛下溘然长逝，有多少人能听从他们的命令还是个问题。"
 focus_krt.16.a: "人们众说纷纭，讨论他们能带回什么。"
 focus_krt.17.t: "北方双雄"
 focus_krt.17.d: "北方地区虽然原则上由中央委派的当地总督管辖，但是在七次哥伦比亚战争中逐渐沦为了北方军掌控的地区，中央很难对北方有什么实际掌控，安德烈犯下了难以挽回的错误，将重要的陆行舰队和移动城市全部带回了首都，并最终因自己的大意和冒进而葬身于此。\n\n安德烈的死让北方实际上陷入了群龙无首的境况，余下的北方军已经开始公开划分自己的势力范围，两名军团长约瑟夫·赫贝格尔与阿列克谢·斯图科夫互不相让，这样下去他们肯定会毁了北方战线的稳定。\n\n同时，孤星城的独立主义者也在帝国的北方焦急不已，当地总督希望能快速联系到首都并搞清楚发生了什么，孤星城及其附近的城市如果接洽得当必将称为紧急会议重新控制全国的一大助力。\n\n若要让祖国重归稳定，目前迫在眉睫的问题就是让两位不安分的军团长大人重新效忠紧急议会——哪怕是暂时上的。"
 focus_krt.17.a: "帝国北方不能乱！"
 focus_krt.18.t: "来自首都的条件"
 focus_krt.18.d: "克里·羽派出的秘密信使于今天中午抵达了埃帕尔驻地，这座固定军事基地在风沙中屹立不倒，老将阿列克谢隆重接待了信使，他在这个世界与哥伦比亚人打了二十年的仗。起先他只不过是北方军中一个最微不足道的侦察兵，然后是指挥一艘陆行舰，一路到现在的近卫军团总长，除去安德烈之外，没有人比他在军中威望更高。\n\n然后是约瑟夫，这个五官皱巴巴的乌萨斯总是有种不易近人的感觉，他在军队中的地位并没有阿列克谢那样出彩，但作为贵族军官在北方军中饱受欢迎，上流阶级往往对阿列克谢这种底层出身的乡巴佬不屑一顾，却唯独钟爱约瑟夫身上与生俱来的贵气。\n\n两人能在北方军共事过去全都依赖安德烈皇储的威望，现在矛盾重重的北方军并不团结，两个人经常避免有任何形式上的交流，阿列克谢称呼约瑟夫为“又懒又蠢的白痴”，而约瑟夫则称呼阿列克谢为“下贱人的代表”。\n\n在听说首都愿意赦免北方军进攻首都的罪行后，阿列克谢略有不安，而约瑟夫则是感到无比惊讶，随即两人都陷入了沉思。半晌，约瑟夫用他嘹亮的嗓音问信使：“我们当然可以对首都提供帮助，但你们打算如何让士兵们安心？”"
 focus_krt.18.a: "“您觉得呢？不如您猜猜首都现在打算怎么做？”"
 focus_krt.18.b: "“很抱歉，将军们，你们必须立刻返回首都，否则将被视为叛国。”"
 focus_krt.19.t: "将军们失去了耐心"
 focus_krt.19.d: "阿列克谢冷笑几声，他的声音仍旧掷地有声：“真抱歉，我不在乎首都怎么做，要是克里·羽认为她有这个能力掌控大局，迈因元帅认为能仅凭威胁能支配什么，那就随他们去吧，北方军的小伙子们不会因为任何事情屈服。”\n\n约瑟夫狡猾的笑了笑，他听明白阿列克谢的意思了，如果首都拿不出像样的诚意，那他也没必要继续在这里打马虎眼，他起身示意自己的卫兵开门，自己率先走了出去。\n\n这次谈判没能获得任何进展，北方军停止了与首都的一切沟通，紧急会议无法代表帝国，这是今天凌晨北方移动城市电台里传出的消息。\n\n毫无疑问，帝国内部先前的矛盾随着凯林登陛下的逝去已经全部暴露在了明面上。"
 focus_krt.19.a: "嘁，区区一群叛徒！"
 focus_krt.20.t: "谈判继续"
 focus_krt.20.d: "两位将军神色怪异，他们继续就首都的情况旁敲侧击，信使抓住他们的好奇心反将一军，表示首都的情况一切良好，得益于信使个人出色的口才与在凯林登时期的经验，他半恐吓的言论还是让两位将军对首都的强大深信不疑。\n\n最终，在论及北方军的赦免条件时，阿列克谢直截了当的表示将把军队中的安德烈残党主动处置掉，同时会尽其所能援助首都人民，但紧急议会不能再抓住叛乱这件事继续发难。"
 focus_krt.20.a: "“休想。”"
 focus_krt.20.b: "“好吧，很高兴我们达成了共识。”"
 focus_krt.21.t: "两位将军退让了"
 focus_krt.21.d: "在信使不遗余力的施压之下，火药味渐浓的讨论持续了很久，双方的骂战很快演变为了互相抛掷筹码的威胁，但最后还是来自首都经验丰富的信使更胜一筹。在他明确表示北方军的六艘主力陆行舰现在全都能开到北方“镇压某些不听话的人”之时，约瑟夫的脸上露出了恐惧的表情。\n\n最后，沉默渐渐占据了上风，阿列克谢不自然的蹭着胸口，两人面面相觑，回到首都无疑是不可能接受的条件。最终还是约瑟夫主动开口，希望戴罪立功，表示北方可以提供更多的资源，甚至是武器装备，毕竟北方军现在需要指挥者。\n\n这种力量威慑或许只能愚弄他们一段时间，但也足够首都狠狠在这里敲上一笔了。"
 focus_krt.21.a: "“很好，紧急议会需要继续观察你们的表现。”"
 focus_krt.22.t: "北方军内战"
 focus_krt.22.d: "遥远的北方传来了坏消息，大量的流民正在朝着维尔德大区涌来，紧急议会派出的官员从那里了解到事情的经过，北方军已经分裂了，约瑟夫带领的一部分贵族成员发动了兵变，在暗杀阿列克谢的行动失败后，两名军团长已经决裂，紧急会议的调停失败了，现在北方已经不再听从来自首都的指令，至少在他们决出胜负之前是这样的。\n\n克里·羽对这件事情相当头疼，她不想在处理首都棘手的问题时还要兼顾国内的各种地方矛盾，但似乎事情总是朝着最坏的方向一路火花带闪电，尤其是那两个愚蠢的大脑袋白痴竟然决定在这个时候大打出手：“现在北方打成了一地鸡毛，我们肯定暂时派不出任何力量去解决他们的问题。”\n\n安德尔森则对此不以为然，他站起身简单说道：“北方现在无暇顾及首都反而时最好的情况，你要知道孤星共和国的一些专员是绝对忠诚于帝国的，真正让我头疼的反而是北方军那两个心怀叵测的家伙，现在他们自己打起来反而给我们争取了时间。”\n\n克里·羽心下有些微妙，总感觉有哪里不太对劲，期盼着自己国家打内战她还是头一次听说，不过北方军在自相残杀总归是消耗着帝国为数不多的力量，她不能容忍这种情况长期进行下去，只要凯林登格勒将所有人都接到安全的位置，紧急会议才能着手调兵镇压北方不服从的势力。\n\n虽然不能够直接出兵影响北方内战，但我们还是能够通过政治影响来间接影响北方内战的结果，同时北方的难民也不能将其弃之不顾，他们都是帝国的子民，只能暂时加入到首都等待救援的队伍中来了……"
 focus_krt.22.a: "手足相残的无聊剧目到底还要重复多少次啊。"
 focus_krt.22.b: "或许把难民编入军队是个好主意"
 focus_krt.23.t: "皮洛萨斯克专员"
 focus_krt.23.d: "对科里亚特来说，处理南方大大小小数百个当地土邦简直是令人头皮发麻的事情，尤其是当地的萨尔贡人和西陆土著混居的情况，在几十年的统治下已经孕育出了新的民族和群体，长期以来在帝国南方抱团自治。\n\n皮洛萨斯克是所谓帝国内一支悍勇的民族“皮洛萨人”命名的移动城市，长久以来，当地人都对凯林登一世的统治较为不满，在南征时期帮助比勒陀利亚军队给帝国军队造成了严重的麻烦，在征服这片地区后，凯林登一世下令在此处修建移动城市作为边境要塞，同时慷慨的将其赠送给皮洛萨人以展现帝国的高贵，这种拉拢政策是行之有效的，自此皮洛萨人在帝国南方安稳了数十年。\n\n大灾变过后，南方情况迅速恶化，首都的混乱也让一些南方共和派看到了机会，他们想要趁机颠覆帝国的统治，皮洛萨人和萨尔贡人都是帝国拉拢的对象，他们会给予紧急议会很大助力，当然也要小心他们趁机要求更大的自治权……那些被贪婪冲昏头脑的土邦在这个时候什么都有可能做得出来，当然金钱或许是解决问题的最好方式。"
 focus_krt.23.a: "南方必须重归首都号令！"
 focus_krt.24.t: "金钱促进友谊？"
 focus_krt.24.d: "科里亚特帝国任命的皮萨洛专员——巴尔特马尔·布里托，他被认为是皮洛萨斯克最富权威的领导者，也是皮洛萨人目前的首领，领导着整座移动城市和附近的皮洛萨部族，可以说争取这个斐迪亚的支持是首都能否拿下南方控制权举足轻重的一步。然而来自首都的信使花了一个月时间抵达这里，却在大门前足足等了半天也没能见到皮洛萨斯克专员，正当他心下怀疑是不是被对方敷衍了事之际，几个头戴羽毛挂饰的当地部族才用几里哇啦的土语喊他进去。\n\n巴尔特马尔神色无趣，目光尖锐如同豺狼，直勾勾的盯着信使的脸宛如正在打量猎物，他壮硕的身躯将那威风凛凛的兽袍撑起了一个骇人的曲线，粗略估计能有两磅的腱子肉，这是他第一次来拜访皮洛萨斯克专员，信使不由得开始暗暗腹诽会不会被对方一拳打死在这儿，但愿对方不是什么荒野上的野蛮人。\n\n在信使开口之前，对方也不多废话，直接从旁边的瓷碗里抓起一只油腻腻的烤兽腿啃得满嘴流油，几乎是口水四溅伴随着含糊粗重的嗓音：“告诉我，凯林登那老东西死了之后，现在首都是谁在主事，你解释清楚就可以滚了，不然我会把你的头砍下来当尿壶用。”\n\n信使微微皱起眉头，附近的部落战士几乎要哄堂大笑，用饶有趣味的目光打量着来自首都的小白脸，似乎是希望他能在专员面前出丑，甚至是吓瘫在地，他只好思考片刻，凝重道："
 focus_krt.24.a: "“首都蒙受灾难，不知道一份金钱可否能促进紧急会议与专员的友谊？”"
 focus_krt.24.b: "“你在帝国的使者面前太放肆了，贱人，紧急议会随时能派出陆行舰队灭了你们的小小城市。”"
 focus_krt.25.t: "专员震怒"
 focus_krt.25.d: "巴尔特马尔气的半死，听到这番话后，他的脸色如同一个通红的猪头肉，在听见信使那轻蔑的威胁后瞬间暴起，刹那间营帐内的所有人都被压迫到脊椎的源石技艺拍在了地板上，专员用难以理解的法术卡住了信使的脖子，他连个细微的哀鸣或者惊慌的祈求都没能来得及发出，然后所有人都听见了恐怖的嘎巴声……\n\n“你说——你要做什么？嗯？你的愚蠢的紧急会议现在可救不了你！叫啊！再多跟老子叫几声！”专员毫不留情，用自己无与伦比的法术力量捏碎了信使的头骨，在场的所有人面容呆滞，看着那红白色的东西一路流淌到地板上，现在不需要多想了。皮洛萨人彻底跟首都决裂，接下来要面对的可能就是战争了。\n\n在那之后，议事厅内几乎所有人都听到了巴尔特马尔仍旧怒不可遏的咆哮，一次次咒骂着紧急会议，连他的幕僚都有些看不下去了，有人开始讨论，要不要连夜脱离科里亚特帝国，顺便联系南方的比勒陀利亚人，毕竟对于他们而言换一面旗帜效忠也不是很难接受的事情。\n\n几天后，皮洛萨斯克彻底断绝了与首都的联系。"
 focus_krt.25.a: "该死，我们失去了一个机会！"
 focus_krt.26.t: "反对首都的都他妈是叛！国！者！"
 focus_krt.26.d: "信使的挑衅在现场引起了震怒，周围一圈的皮洛萨战士都愤怒的站了起来，他们都想要把这个出言不逊的家伙剁碎，然后装进肥肠里送给专员作为他的生日礼物，然而这些想法还未能付诸实践，巴尔特马尔就用法术攥住了第一个走下台阶的战士，然后毫不留情的处决了这个冒失鬼。\n\n嘎嘣！令人头皮发麻的声音随着头骨一声脆响迸发而出，在场的皮洛萨人目瞪口呆，望着那血淋淋的尸体缓缓倒下，然后专员的怒吼彻底盖过了所有人的嘈杂。\n\n“反对首都的都他妈是叛！国！者！”\n\n巴尔特马尔怒气腾腾的如此喊道，让信使被冷汗浸湿的衣衫逐渐冷却下来，谢天谢地神明保佑，首都的影响力和强大的武力威胁终究是让这个野蛮的专员冷静下来，此后的谈判进行的很顺利，巴尔特马尔保证皮洛萨人会给首都供应一批额外的食物，并绝对拥护紧急会议在非常时期的任何决定，并且会把不识趣的土邦全都收拾掉。\n\n不管怎么说，信使还是高兴的称赞了识大体的巴尔特马尔。"
 focus_krt.26.a: "哼，南方佬还是识趣的。"
 focus_krt.27.t: "南方共和派动乱"
 focus_krt.27.d: "1094年下半旬，来自南方的战争终于打响，凯林登的死彻底引爆了积怨已久的帝国南方火药桶，共和派领袖安德尔克率先发难，无数共和派军队开始在有目的的集结并朝他们所看到的所有荒野村落进攻，甚至一些移动城市也难逃一劫，由于帝国长期严苛的公民区分制度让这些共和派的声音很受欢迎，安德尔克试图号召南方脱离科里亚特帝国，与比勒陀利亚建立一个“西陆萨尔贡联邦”，这种声音从很早之前就已经在科里亚特出现了。\n\n皮洛萨人对共和派的主张嗤之以鼻，一部分南方土邦也不希望这些共和军来搅乱美妙的土皇帝日子，于是南方战火再燃，双方打成了一锅乱粥，大量的难民随之涌向首都，迈因望着这些狼狈的人怅然若失，若是对那里放任不管，有朝一日南方的共和派也会将在座的各位全部吊死，他对此深信不疑。"
 focus_krt.27.a: "帝国在燃烧中崩溃"
 focus_krt.27.b: "把难民编入战斗序列吧。"
 focus_krt.28.t: "凯林登格勒之手"
 focus_krt.28.d: "天气渐凉，在凯林登格勒，作为维尔德大区核心圈最重要的城市之一，这座城市以陛下的名字命名，市民们一如既往走上街道，在教堂内虔诚祷告，克里斯安怔怔的望着窗外的飘雪，这个时节下雪是一件不寻常的事情，但天灾横行的大地上出现什么事情都不值得意外，尤其是这个动荡不安的年代。\n\n他思忖片刻，叫来了来自首都的信使，正是他一周前告诉克里斯安首都发生了什么让人大吃一惊的事情，那座本应带来安心感的锅炉殉爆并毁灭了一切，成为了埋葬皇储们的罪魁祸首，真是让人唏嘘不已。\n\n克里斯安勾起嘴角，望着信使焦急的面孔，他一贯都对政治上的事情漠不关心，也没办法关心什么，作为维尔德贵族他已经习惯了凯林登一世永恒不变的统治和高悬在头上的科里亚特皇冠，他的家族什么也改变不了，莫不如顺从陛下当一个顺民岂不安好？\n\n克里斯安的思绪渐渐飘远，不自觉地放到了继承问题上，现在陛下已逝，国内仅剩的两位皇储也在首都死去，帝国皇位还能给谁呢？最好的方式是由贵族们召开一场会议，然后共同推举出一位公认的权威者，但现在最为关键的问题是有谁能当这个权威者呢？克里斯安微微悸动，他感觉自己麻木了几十年的血脉重新躁动起来，作为凯林登格勒的主人，对于指定继承人这个问题上的话语权，他拥有绝对的优势，那这个皇帝之位的归属权还有任何争议可言吗？\n\n“请您快些遵照紧急议会的命令出发吧，首都的民众正等待着一位救星。”\n\n克里斯安没听清使者说了什么，他满嘴应承下来，盯着那个信使恼火的走出房间，不是很理解信使的行为，真可笑，他在跟未来的皇帝摆什么谱？"
 focus_krt.28.a: "贱民就是贱民。"
 focus_krt.29.t: "再见了姑娘"
 focus_krt.29.d: "在克里斯安的安排下，凯林登格勒准备派出其一个城区区划用来转运首都难民，移动城市的移动往往相当复杂麻烦，它往往需要解除城区之间的隔离墙然后进行分离，这个过程往往能持续数个小时到数天不等，这需要技术人员的通力协作才能完成，克里斯安几乎抑制不住自己激动的心情，好像能看到自己抵达首都，然后顺理成章受众人拥戴加冕皇帝的场景了。\n\n“再见了姑娘们，当我回来，你们将看到一个全新的我！”克里斯安今天打扮的格外体面，在出发前往首都的移动城市模块上朝着凯林登格勒观望的众人招手，让不少人抓拍了许多珍贵镜头，他当过陛下的内阁顾问，也去过首都瞻仰过宏伟的帝国议会，虽然这一切都在大灾变中化为虚无，但在他的引导下，相信大科里亚特的未来仍旧会十分光明。\n\n广场上人群欢呼，至少看到自己的领主高升是一个好消息，更加令人愉悦的是大灾变后，那座残破的源石死城是绝对没办法继续作为首都了，这意味着凯林登格勒的地位很快就会变得与众不同，或许他们的福利也会得到相应的提高，这是绝大多数市民的正常想法。\n\n至于克里斯安，他翘起嘴角，志得意满的坐在城区模块一处豪宅的沙发上与他的幕僚们共享美酒，已经开始讨论当自己荣登皇位，该如何让全国地方势力臣服的问题了。当首都派来的信使意识到克里斯安在想些什么的时候，他的眼神无比怪异，因为紧急会议很显然并没有表达过要将他拥立为皇帝的意思，但现在直接说出来，他有点害怕这个家伙一个不高兴砍了他。"
 focus_krt.29.a: "要不……委婉点提醒下？"
 focus_krt.30.t: "敷衍，还是敷衍。"
 focus_krt.30.d: "克里·羽耐着性子托腮听完这番话，突然感到无比郁闷，冷眼瞧着眼前这个有点急不可耐甚至是愤怒的中年贵族，莫名有一种开不了口的感觉，他的自大已经超乎了自己的想象，虽然少女很感激凯林登格勒及时抵达并拯救了无数首都人民，这有不少都是克里斯安的功劳，但她不明白到底是什么给了他这种迷之自信——直截了当的联合部分维尔德贵族索要皇帝冠冕，要知道还有一位休伯特皇储的下落不明呢。\n\n“听着小姐，我不想对紧急议会的权力有任何质疑，我也感谢议会能在这个时候仍然保护了这么多人在大灾变之后幸免于难。”克里斯安笑眯眯的如此表示，他听说过有不少人对克里·羽表达过溢美之词，因此对她的看法也相当重视，“这个国家岌岌可危，所有人都在对我们阳奉阴违，我对凯林登陛下和皇储们的逝去表达深刻的哀悼，但现在必须有人重新挑起国家的重担不是么？”\n\n克里·羽突然有些想笑，这已经是他第四次来找自己谈这个问题了，上次迈因应付他的理由是肚子不好临时拉稀，跑到厕所里蹲了半个点才应付了事，她仔细斟酌片刻，嘴角微微抽搐，鉴于实在找不到什么正当的理由了，于是只好纠结道：“真不好意思，陛下的皇冠在大灾变中遗失了，我们可以在废墟里找到以后再谈这件事。”然后克里·羽冷漠的起身告辞，没去听瞪大眼睛的克里斯安再多说任何一句话。\n\n当晚，克里斯安歇斯底里的咆哮无数遍回荡在核心城的废墟上空，那样子像极了某些放走猎物的荒漠野兽。最后一批市民已经迁往凯林登格勒，不少人摇头叹息，望着在源石废墟中努力扒挖皇冠的那群人感到莫名其妙，明明皇冠在几周前就被紧急议会转移到了安全的地方啊？"
 focus_krt.30.a: "“他妈的，皇冠呢？”"
 focus_krt.31.t: "故友重逢"
 focus_krt.31.d: "泰拉1094年末，当皇储休伯特得知消息乘坐叙拉古官方友情提供的陆行舰高莱斯·西西里号最终抵达科里亚特帝国，他第一眼看到的西陆熟悉的茫茫荒原，自己阔别祖国六年，经历了多少不知名的苦难，又看过了多少人间悲剧，他早已经过了伤春悲秋的年纪，但也难免心中感慨万千。休伯特只是静静凝视着荒漠，这里仿佛已经换了风貌，又跟儿时的记忆完全吻合，一望无垠的荒野带走了许多故事，温柔的风沙轻轻吹拂在脸上，犹如为帝国最后的皇储奉上最高敬意，他深吸几口气，这才缓缓走下了陆行舰扶梯。帝国将官前来迎接，他先与走上前的几名士官亲切的握了手，然后才将视线投向迎在前方的那个女人。\n\n当休伯特皇储真的露面时，在场的不少人都发出由衷的感叹和唏嘘，当这位王子当年离开帝国时，没有人关心在意，甚至不会想到有朝一日他能以这样的身份重返科里亚特。命运揣测多变，或许休伯特陛下的昭昭天命早就如此注定下来，人们聚拢了过来，争相想要看一看这位帝国最后的合法继承人。\n\n克里·羽的眼眶有点湿润，她咳了咳，不动声色的将自己眼角的泪光遮掩下去，然后才压抑着自己满腹激动的心情走上前，用半带揶揄的声音调侃：“怎么出去几年连个路都走不稳？”实际上，他的样子跟少女记忆中的那个皇储大相径庭，他的皮肤粗糙了不少，整个人的气质大变，目光里的坚毅却远比当年更加深邃，似乎那个不经风霜的深宫皇储已经一去不复返了。\n\n休伯特笑了笑，凯林登的永恒统治到此终结，皇储没有回答，他只是静静的环顾四周的荒野景象，张开双手，“克里·羽小姐，不至于让我在这里跟你说话吧？”他的亲信埃里克斯随即上前，希望先给皇储找到一个休息的地方，毕竟连续几天的陆行舰颠簸并不好受，从叙拉古到科里亚特是如此漫长的旅途。克里·羽微微翘起嘴角，心情相当美妙，表示最好的房间早已预备完毕："
 focus_krt.31.a: "“欢迎回来，我的陛下。”"
 focus_krt.31.tt: "§R国内的贵族守旧派们会不满意的§!"
 focus_krt.32.t: "皇帝敕令"
 focus_krt.32.d: "凯林登一世在昏黄的天台上注视着远方的金辉，若有所思的把玩着那盏琉璃杯，帝国在过去几十年来取得的成绩已经足够辉煌，它仍将继续前进，以一个非凡的姿态获取泰拉世界的统治地位。\n\n在过去的几天里，皇帝向帝国的所有贵族领派出了无数大大小小的信使，他们负责调查那些领主的具体情况，目前所拥有的财产和领地的总体人口，甚至包括军队的相关情况。这自然引起了领主们的怀疑和不安，他们不惜花费大量金钱贿赂打点，以搞清楚陛下的具体意图。很可惜的是那些帝国信使本身也不理解，或者说只能猜测出皇帝的大概想法，这让贵族们颇为气馁。\n\n皇帝身边聚集了无数顶尖的顾问，他们有些是出身市民，有些是出身军队，但就是很少有人出身贵族，陛下在刻意的疏远一些人，尤其是那些影响力巨大的领主。最乐观的想法就是皇帝大概只是想弄明白国家的情况，而不乐观的想法则是皇帝可能要在法理上动文章，收回一部分贵族享有的权利和土地。\n\n而这一次，洋洋洒洒的数十条皇帝敕令令贵族们的眼睛快要掉下来了，凯林登陛下个人的敕令在很大程度上要高于国家法律，甚至说他的意志就是在绕过国家，独断专行的在某些领域起作用，他规定皇帝拥有城市市长的任命权。按照土地的大小和工厂的规模征税，并且对于领主们的税款也有一个最低限度要求，这有别于以往最简单的情况。\n\n只有一件事是毋庸置疑的，在贵族们的疑虑中，帝国的齿轮悄然开转，而科里亚特所有的任命权现在都在陛下一人手中了，领主们无权对人事任免有任何意见，否则《二等公民法》可不仅仅针对平头百姓。"
 focus_krt.32.a: "帝国之威，始于当下。"
 focus_krt.33.t: "公平"
 focus_krt.33.d: "那段岁月给了萨尔贡人浸泡在油烟中的感觉，那是1094年，那是一段最艰难的时刻，不仅仅是对这片土地上的萨弗拉人，也与每个头上冠有萨尔贡血统的人息息相关。\n\n科里亚特对萨尔贡人苛刻的压榨从来没有结束过，比勒陀利亚战争结束后，皮洛萨人成为了他们的走狗，在因战败而割让的萨尔贡土地中，有三分之二或更多的萨尔贡人要承受超过标准赋税的三倍压力，而他们还要在1094这一年额外向土邦们交上一笔税款。用以支持首都的工业区划建设，每个村庄都要出三十个壮年人，大一点的可能会变本加厉的提高到五十个，可以想象在那个年代科里亚特南方到底被盘剥到了什么样子。\n\n终于，在某次征税和徭役的双重压力下，几个村庄和部落的长者走到了一起，他们找到土邦的负责人并告诉他，他们实在是拿不出任何东西了。并隐晦的暗示他如果帮他们隐瞒下来，村庄将拿出仅有的禽鸭鱼肉来孝敬他，于是征税官点头同意了，他也很清楚自己在这个地方征不到几个子，于是第一批税款的逃脱就这么开了头。\n\n而另外一边，皮洛萨人又很抱怨，他们为“帝国守南疆”并不是为了把一笔笔税款交往中央去执行什么工业计划，那些事情对于南方饿的头昏眼花的饥民可没什么用。他们于是私下与农民达成了协议，把中央的征税官留在了城市里。把税款折中交给了他们应付了事，而多余的那部分则被全部私吞，有了第一次，便也有了第二第三次，他们抱有非常愚蠢的侥幸心理。\n\n这种情况持续了大概半年，随后税款越来越少的南方迎来了皇帝的惩罚——凯林登一世的问责在这里掀起了腥风血雨，贡金数额非但没有减少，反而因为皇帝的震怒而变本加厉的翻倍了，但这一次没有任何人再敢耍小聪明。因为他们看到了无数被特制长矛贯穿的尸体，展示着帝国的权威——那是不可跨越的生死线。"
 focus_krt.33.a: "无论贵族还是平民，在税款上，所有人都是公平的。"
 focus_krt.34.t: "土酋矿场的故事"
 focus_krt.34.d: "“克洛斯佛德，吃饭了！”\n\n砰，一只破烂的铁碗被丢在了面前，艾米璐饥渴难耐，不敢用满是泥灰的手去拿，小心翼翼的用那个脏兮兮的毛巾包裹住双手，然后捧起铁碗走向满脸不耐烦的大厨，那铁锅就是他所希望的全部东西了，里面会是什么？是烧好的饭菜还是酥炸源石虫？他都不想去管，只要能饱餐一顿便好。\n\n“这是什么？”一声刺耳的尖叫把艾米璐拉回了现实，她恐惧的看到了那个叫斯福尔的矿工崩溃的坐在地上，那碗里的东西是一坨烧红的腐烂磐蟹块——南陆有很多这种东西，但基本上没有人会想去吃它。\n\n矿场沸腾了，萨尔贡人们纷纷表达了自己的抗议，抱怨着不能给他们吃这种气味恶心，令人作呕的垃圾，但并没有人理会这些事。艾米璐大概也清楚，她趁着事态还没扩大，自己悄悄溜到铁锅旁边盛了一碗，然后赶紧跑到一旁。果不其然，没过多久走进矿场的是科里亚特人的警备队，那些闹事的人都被按在地上毒打一顿，没过多久便进气少出气多了。\n\n或许等到秋天麦子成熟的时候，他们就能走出暗无天日的地下矿场了，她流着泪吞咽着腐臭的磐蟹，但即便那样又能如何？她是一个可悲的萨尔贡人，又会被另一个工程拉过去充当奴隶，却按上一个荣誉公民的可笑称谓。更可怕的是每天都有萨尔贡人屈服于这种现状，敢于拿起武器的人越来越少，那个可以预见的未来令她看不到希望，而且充满恐惧。"
 focus_krt.34.a: "萨尔贡人的未来啊......"
 focus_krt.35.t: "皇朝羽翼"
 focus_krt.35.d: "克里·羽最失意的日子大概莫过于这几年了，她的祖父在北方的哥伦比亚战争中死去，被一枚不知道哪里来的弩弹打爆了脑袋，她从那时起就失去了自己最后一个爱她的亲人。随后母亲也相继因为重病离世，混账父亲则在一个大雨天消失的无影无踪，她的家族开始一蹶不振的没落下去。凯林登陛下的王朝仍然繁盛，但这与她的关系并不大，那时她只有11岁，便恨透了哥伦比亚人，也恨透了对他们漠不关心的贵族亲戚。\n\n唯一能给予她安慰的是陛下的九皇子休伯特，在某天夜里他们偶然结识在首都的一家酒吧，休伯特皇子大抵是她见过的最良善成熟的男性，虽然克里·羽自己也承认她没见过多少皇家成员，但她还是一眼就相中了对方朴实无华的理想情怀。休伯特经常语出惊人，而且能在方方面面提出与众不同的观点，比如他曾说过，对于感染者如果可以加以合适的管理并将平等观念普及人心，那么帝国内的叛乱才能更好的消匿下去。这在当时算得上绝对的异端邪说。\n\n从那时起，她便有了一个想法，那个念头就像是积压在厚厚火山灰下的苗头，如果凯林登陛下有朝一日逝去。她很希望休伯特能接过权利，这个念头就像是多年的梦魇一般一发不可收拾。连克里·羽自己都不清楚她的这般冲动与悸动的源头，但唯有一点可以周知，她因休伯特而成为了最坚定的保皇党，无论科里亚特的情况是怎么样的，她都相信只有休伯特能带领这个国家走入正轨。\n\n很可惜，当休伯特在几年前离开帝国后，克里·羽这份仅剩的念头也被熄灭了，她笑了笑，走下了大风吹拂的台阶，今天还有一场重要的会议要去参加。"
 focus_krt.35.a: "而那将是一位富有魅力的君主。"
 focus_krt.36.t: "新任工头"
 focus_krt.36.d: "这是周末，在往常应该是工厂聚餐的时间，但今日却显得格外凝重肃穆，工人们聚集在一起，就在弹压机旁边。\n\n帝国的工厂出现了严重的爆炸，那是上一任工头的错，那个混蛋简直就是一个不折不扣的工作疯子，他的生产指标也定在了几乎达不到的程度。必须所有人都全力以赴才能勉强完成，这样的事情终究导致了恶果，超负荷的机器再加上疲倦的工人导致了灾难，这张事故造成了三死多伤，有人永远要残疾下去了。\n\n新任工头推开了大门，工人们麻木的转过头，“简·尼尔森呢？”他们问道，一双双昏黄的眼睛浑浊不堪，黑漆漆的眼袋宛如破气球垂挂在眼眶边缘，看起来睡眠严重不足。\n\n“他已经被免职了，很快会为这场事故负责。”新工头想了想，他也不希望刺激到这些人，于是如此说，“我们今天休息半天，中午吃饭之后才动工。”这终于能让他们好受一些了，尽管那些贵族佬大概都不在乎他们的死活。\n\n几天后，因为事故而出现的残疾工人拿到了他们的赔偿，那是两枚源石锭，虽然已经是他们难以奢望的一笔钱了，但这点东西让人看来还是心情复杂。所有人望着那六枚简单的源石锭，围成一圈，拿着他的工人手指颤抖，他几乎要说些什么，然后突然抿起嘴，上弯成一条细细的弧线。\n\n——砰！源石锭被狠狠的砸在了工厂的墙壁上，砸出了一个小凹痕。"
 focus_krt.36.a: "“我们的命他妈就值这个？就这个？！”"
 focus_krt.37.t: "盛怒"
 focus_krt.37.d: "贵族议会对1094决议的一些细节抱有怀疑，在科里亚特大议会的讨论中，有许多人向皇帝陈述了指标可能会难以完成的问题，由于帝国在诸多地方都存在困难，比如人手不够，又或者是某些区域的道路问题和资金问题。\n\n凯林登一世听完后勃然大怒，因为根据他先前的调查，维尔德贵族领地完全有这个能力完成他定下的目标，首都的工业区划只不过是冰山一角，如果连这个都要在他眼前喋喋不休的抱怨个不停，那还怎么做成事情？这一定是他们贪污的结果，这些事情皇帝都心知肚明。\n\n皇帝的咆哮一如既往地威力巨大，当凯林登那标志性的声音如同破风车响起，贵族们就纷纷歇了火。克里·羽是第一个闭嘴的，随后禁卫军的迈因元帅也擦了擦汗，只好站立在皇帝旁边充当空气，至于其他人诸如安德尔森与皇储霍夫曼更是全部僵在原地，他们不敢去多提半句话。\n\n“现在还有什么问题吗？”皇帝努了努嘴冷冷看向克里·羽，这股目光让她感到毛骨悚然，她立刻站起身，表示工程计划一定会照常执行，皇帝的盛怒才隐隐消除半分，直到他令人敬畏的身影消失在走廊尽头。\n\n“皇帝的脾气越来越暴躁了。”迈因奇怪的看向克里·羽，如此不安的提了一嘴。\n\n“......可能是最近的精神比较紧绷吧。”克里·羽头疼的扶了扶额头，不着痕迹的拭去那些冷汗，在皇帝面前，她连大气都不敢喘一口。"
 focus_krt.37.a: "随后科里亚特大议会陷入了久久的沉默。"
 focus_krt.38.t: "金色商线"
 focus_krt.38.d: "科里亚特帝国的大工厂主们构成了一股不容小觑的资本力量，他们的财富在整个帝国实属上乘，不少贵族都无法与他们相提并论。\n\n克里斯汀·帕尔克，谢钦·伊戈尔·伊万诺维奇，还有妮诺·布尔贾纳泽，这三个人分别经营着帕尔克军工，萨尔德电子和帝国重工。在允许私有产权的科里亚特帝国，这三个人代表着工厂主的利益，团结在皇帝的周围。\n\n在首都兴建新的大规模工业区，并将其命名为“圣骏堡”工业区，理论上这应当是整个西陆最庞大的新兴工业区，建成它需要数年时间，但工程无疑被大大加快了，这个消息令三大承包商都颇为高兴，他们现在希望皇帝能从三家企业做出抉择，将圣骏堡工业区归到自家名下，这会加强他们的实力，当然了，他们也将为帝国提供相应的支持。"
 focus_krt.38.a: "帕尔克军工更为不错。"
 focus_krt.38.b: "萨尔德电子相当可靠。"
 focus_krt.38.c: "为什么不将其归于帝国重工？"
 focus_krt.39.t: "伟业"
 focus_krt.39.d: "伟业！对！你，小子！就你！为凯林登陛下实现了他永远不可能完成的伟业！好家伙，开挂是吧！？凯林登有了你都要哭了！\n\n让我猜猜你是怎么点到这的，“~fa”是吧，开控制台是吧，那小子你退游吧。\n\n或者是你已经打完了科里亚特的剧情好奇来开控制台把这点完，那么这个不同寻常的事件就作为特特酱给你的玩笑吧XD\n\n抑或是你发现了蠢驴的逆天bug（真的会有人从头到尾挂着国策界面不动吗），那么恭喜你又有了一个骂蠢驴的理由lol\n\n——来自科里亚特主策+代码：特特酱（Krrat_Main）。"
 focus_krt.40.t: "混乱的局势"
 focus_krt.40.d: "在凯林登格勒的临时议会内，这里的陈设相当凌乱，那是几个小时前几个随从手忙脚乱将其布置好的，休伯特随意扫了几眼，然后走进房间自顾自的瞻仰起房间内的画像，上面是乌萨斯一幅名画的复制品，内容则是北境绚丽夺目的极地冰花。\n\n仆人们听说过凯林登陛下的苛刻，相当担心这个异常简陋的房间会激怒这位帝国新皇，不过直到其他人全都走进来，他也没有说任何一个字，这让仆人们在心下暗暗庆幸。\n\n克里·羽很高兴看到皇帝的精神状态不错，她率先开口简单说，“根据我们从难民和间谍那里获得的情报，南方的共和派叛军和萨尔贡人勾结一通，多个城市沦陷，南方的土邦军队在联合起来的当地人面前溃不成军，只能不断向帝国求援。”\n\n“然后是北方的问题，北方军...如我们之前所预料的，帝国的北方已经崩溃了，约瑟夫和阿列克谢似乎出现了矛盾，他们的支持者大打出手，这两个人似乎也都没有表明要重新效忠陛下的意愿。”克里·羽说到这里，她略带凝重的接着说，“这就是我们现在要解决的问题，不能让他们继续胡闹了。”\n\n“所以各位，我们今天就需要讨论具体的进军方案，帝国需要南北出击，这已经不是第一次了。”\n\n议会内的气氛沉闷下来，不管是谁听见这些让人头大的事情都不会有太好的心情，每个议员都神色严肃，小声的讨论起叛乱的事情。坐在一旁的禁卫军元帅迈因的表情则相当微妙，他准备好的解决叛乱的方案还没有跟陛下说过，现在似乎是一个在新皇面前表现的大好机会。\n\n休伯特站在原地，若有所思的盯着乱糟糟的房间，他失望的发现议员们没提出任何有用的建议，凯林登养出了一帮废物，失去了他那个父亲的机敏狡诈，这些油腻的贵族根本不懂得如何解决国家大事。他勾起微笑，休伯特在冷漠的观望了十分钟后，终于说话了。"
 focus_krt.40.a: "“克里·羽，给我多说一些南方的事情。”"
 focus_krt.40.b: "“哪位将军能站出来么，我想听听北方军的现状。”"
 focus_krt.40.c: "“好了，我已经知道了。”"
 focus_krt.41.t: "南方叛乱的细节"
 focus_krt.41.d: "克里·羽似乎轻微的叹了口气，皇帝问起这件事的时候，她不知道该具体从哪里说起，于是她先简单说了一些有关于皮洛萨人在南方的暴行，有关于萨尔贡矿工的悲惨现状，以及土邦军队长期以来横征暴敛的习性。这些以往在凯林登皇帝那里都是被默许的事情，说完这些，她最后才提到了被取缔的共和派分子...以及在南方频繁活动的萨尔贡游击队，这个无足轻重的叛乱问题比起南方长期的顽疾来说简直不算什么了。\n\n“萨尔贡游击队？”休伯特目光如炬，在房间里来回走动，他对这一点很感兴趣，他直接追问说，“难不成那些荒野游民还能搞到足以攻下移动城市的武器？”\n\n克里·羽默认了这一点，她露出让人难以移开目光的笑脸，“陛下，我想比勒陀利亚人也在暗中支持南方的萨尔贡人反抗我们，这跟正常，那些源石制品...弩弹法杖，甚至某些从工厂加工出来的重型火炮都在游击队那里有所发现，他们就是那样攻下城市的。”\n\n“我们的士兵在荒野巡逻很容易遭到袭击，一名驻军...或者说军警受伤就需要消耗药品和更多的食物，还要有医疗人员的压力，这些物资都需要从圣马丁工业区乃至中央转运，运输成本居高不下，我们在南方的治安长期都是混乱状态。”\n\n见皇帝专注的听着，克里·羽继续说：“这次叛乱声势浩大，游击队应该先是攻下了数个矿场，然后用重型火炮轰断了萨哈比亚堡的履带。那座城市在坚守了一个月后被四面包围的萨尔贡人攻破了，借助那座城市内的资源，他们的装备越来越好，队伍也越来越庞大。从这个时候开始皮洛萨人就已经一败涂地了。萨尔贡人坚定的解放着他们的土地，他们无疑会要求独立，这是我们不能接受的。”\n\n“至于皮洛萨斯克的专员，巴尔特马尔被游击队打的一塌糊涂，他们只能龟缩在几个固定堡垒和移动城区内瑟瑟发抖，不断朝我们派出信使，他们反而是问题最小的，我想只要帝国军队抵达，皮洛萨人会感激的痛哭流涕，不然萨尔贡人绝对会扒了他们的皮。”\n\n休伯特点了点头，他犀利的评价说：“真是一塌糊涂。”皇帝用了几十秒才平复自己的心情，再次抬起头看向其他人。"
 focus_krt.41.a: "“哪位将军能站出来么，我想听听北方军的现状。”"
 focus_krt.41.b: "“好了，我已经清楚了。”"
 focus_krt.42.t: "北方军叛乱细节"
 focus_krt.42.d: "迈因立刻站了起来，他迫不及待的对皇帝表明了北方军的肮脏勾当，不断的咒骂着安德烈皇储对军队结构的破坏，以及北方军高层长期以来借着抵抗哥伦比亚的借口肆意敛财的手段，一条不落。休伯特似笑非笑的盯着这位禁卫军元帅，要不是他知道这个人的脾气，还以为他早就打过草稿。\n\n最后，迈因痛斥了约瑟夫和阿列克谢两个人结党私营的可耻行径，他直接指出北方军的内乱实际上是两人都争相接管安德烈权利的行为。两人不和已久，北方军在安德烈死后也发生了分裂，成为了任由他们恣意妄为的私军，他们完全不是在为祖国而战，而是听从那两个将军的命令行事。\n\n“凯林登格勒必须阻止内战继续发酵，我是说...我们的外交状况也并不如想象中那么好，如果北方军在内战中损失殆尽，任由那两个蠢蛋挥霍一空，我们还怎么...怎么面对来自哥伦比亚的威胁？”迈因最后总结道，他愤怒的环视四周在场的贵族议员，得到了一片赞同的声音。\n\n休伯特听完这些以后点了点头，他知道军队中的贵族习性，维尔德贵族长期以来控制着军官和军队，相比于坐在办公室喝茶的官僚，他们除了凯林登皇帝之外，一概听从上级贵族的命令，这才是北方军迅速崩溃的根本原因。\n\n新皇才值几个子？休伯特心里清楚得很，与其效忠自己，他们更喜欢跟自己利益瓜葛息息相关的将军们行事，想要稳定自己在帝国的统治，北方军的某些大贵族必须被消灭，他们已经在凯林登一世的纵容下放肆太久了，现在不把任何除了他以外的人放在眼里。"
 focus_krt.42.a: "“克里·羽，给我多说一些南方的事情。”"
 focus_krt.42.b: "“好了，我已经清楚了。”"
 focus_krt.43.t: "休伯特的想法"
 focus_krt.43.d: "“首先，南方叛乱是迫在眉睫的问题，比勒陀利亚正在支持南方的萨尔贡人，甚至有可能伺机进军，我们的外交手段和战略威慑都能起到作用，但他们不一定会吃这套。”\n\n休伯特说到这里，他补充道：“你们也知道失去南方赋税和田地对于帝国来说意味着什么，土邦领地长期以来出产帝国超过三分之二的粮食，如果失去那里，我们基本上连怎么过冬都是个问题。”\n\n“所以，南方叛军头领必须被消灭，那些煽动者没有任何被赦免的可能，他们必须被处死。但你们也要知道，其他人是我们的子民，他们也跟着我们同样经历了70年代的拓荒和垦殖岁月，我们不能把他们一概而论。”\n\n议员们深有同感，听到这里，迈耶率先跳了出来，他说出了自己对南方有一套健全而细节明确的战争计划，然后保证会消灭南方叛军，不会让皇帝失望的，科里亚特的装甲巨兽会让萨尔贡佬回忆起真正的战争是怎么样的，禁卫军全员都已经准备好了。\n\n休伯特哂笑一声，他简单称赞了迈因的积极性，然后瞥了保持沉默的克里·羽几眼，继续道：“随后是北方，北方军的问题是帝国内政，但我们也不能放任不管，最简单的方法当然是大军镇压，但我们也可以用选择的分化一部分士兵。总之，我们必须以最快速度北方军的内战，先派出信使，如果必要时只能诉诸武力。”\n\n“克里·羽，你来负责这件事情，凯斯特会协助你。”休伯特一世说完，克里·羽立刻站起身表示，她会竭尽全力让北方忠勇的士兵回归帝国。"
 focus_krt.43.a: "未来掌握在自己手中。"
 focus_krt.44.t: "聚焦于内乱"
 focus_krt.44.d: "南方军区司令部，国防军大本营内发生了激烈的争吵，帝国最高统帅部对几种出击方案进行了推演和分析，力求能够在镇压作战中取得胜利。他们在沙盘上模拟了数次作战的损失，然后是分析在最糟糕的情况下，直接拿掉了一个集团军，推演在这种极度劣势的情况下还能否取得胜利，最后他们得到了肯定的答案，估算萨尔贡人的数量在十万到十五万左右，这是最大数字。\n\n总参谋部的文职要员，来自凯林登格勒的皇帝顾问克里·羽、禁卫军总长科里亚特·迈因，被休伯特任命作为计划监督的凯斯特将军，还有负责装甲集群行动的总参谋长安娜·克里斯蒂娜都参加了会议，场上的总体气氛还算融洽，几个人没打起来就算成功。\n\n“首先我们要着手解决南方，萨哈比亚堡的位置太致命了，直接卡住了几条重要公路，不论后续计划如何展开，攻击这里是必要条件。”安娜将手抵在地图边缘，纤细的手指划过几个地名，如此朝着各个指挥官解释起来，“而且我们的速度必须要快，重炮组必须及时到位，必须在叛军反应过来前夺下城市，不然麻烦就大了。”\n\n安娜提出速战速决的方案，用两个成规模的装甲集群快速突破萨尔贡人的防线，大概有十个装甲师左右的兵力会投入到突破中。由于帝国很有可能南北两线出击，如果实施战术不够迅速果断，很可能导致国内的叛乱更进一步，毕竟北方军可比不上这些农民那么好对付。他们还要考虑之后的问题。\n\n“那么泰梅尔...”克里·羽似乎有点疑虑，根据情报来看，萨尔贡人还有数万大军在包围皮洛萨斯克，那些土邦虽然战斗力不怎么样，但居然顽强的扛下了一个月的攻击，看来他们也知道被萨尔贡人逮到了有什么好下场。\n\n文职人员终究是比不上专业军官，凯斯特这时插了一嘴，“我们应该相信皮洛萨人的能力，他们会处理好眼前的问题，比起救援皮洛萨斯克，歼灭叛军主要力量才是应该做的事。”安娜对这个观点也颇为赞同，她希望凯斯特将军协助指挥另一个装甲集群向劳也伦斯托克地区推进。\n\n克里·羽随后不再多说什么，她只是提了一句，那些萨尔贡人也并不是十恶不赦之人，如果不是活不下去，没人会想拿起简陋的武器反抗帝国。按照休伯特陛下的意愿，应该把这些人区分对待，她说完后，发现没有几个军官在听她说话，她也自觉没趣，只好暗暗腹诽国防军果然如同传言那样都是一群高傲又难以听进建言的家伙。"
 focus_krt.44.a: "野蛮的国防军!"
 focus_krt.45.t: "动员令"
 focus_krt.45.d: "凯林登格勒人头攒动，人们在街头发现了往日他们没有注意到的新告示，帝国临时政府出台了新的召令，呼吁人们踊跃参军，为了平复帝国的叛乱而奉上一份心力。\n\n踌躇满志的军官全身穿戴整齐，他神采飞扬的表情看起来就像是什么凯旋归来的英雄人物。三天前从这里出发的南征大军在人们心中留下了很深的印象，科里亚特子民从来都有很强的抗压能力，而且征兵令上的许诺给士兵的待遇不菲。最关键的是，休伯特陛下废除了自建国之初颁布的感染者禁令，不管你是什么身份，都可以加入到帝国军队，为南征尽一份力。\n\n终于，在犹豫中，几个人缓缓举起了手，他们对军官说，自己也想参加南征大军。有人注意到了他们是感染者，因此对军官大喊大叫，要求把他们抓起来，人群顿时响起一片嘘声，对这几个人唯恐避之不及。\n\n步兵军官冷眼瞧着这几个勇敢的感染者，怜悯的问他们，“你们是发自内心要为帝国而战，但是因为你们是感染者，所以只能充当最危险的兵种，你们也愿意吗？”\n\n这几个感染者互相看了几眼，他们从对方的眼里都看出了一种狠劲...比起继续流浪饿死在不知名的角落，这已经是莫大的恩赐。\n\n“你叫什么名字？”军官瞥了他们几眼，拿出了征兵登记表和一根笔，伸手递了过来。"
 focus_krt.45.b: "年轻人走上前，坚定的写下了自己的名字——维塔利·卡列申"
 focus_krt.45.tt: "在§Y凯林登格勒§!获得一支由§Y9个常规步兵营§!组成的§Y训练有素§!的§Y感染者步兵师§!"
 focus_krt.46.t: "南方创痕"
 focus_krt.46.d: "利特维尔今天照常登上了距离根据地三公里外的那个小山坡，萨尔贡人的抵抗从来没停止过，从二十年前科里亚特人屠戮了他的部落开始，某些仇恨就已经在内心发酵到了无可挽回的地步。\n\n他仍记得那一天，多年前自己仍是个毛头少年的时候，科里亚特的先帝拿起了戈矛和武器，冒着烟的战舰运来了无数盔甲明亮，脚步坚实的士兵。愤怒的萨尔贡人拿起尖矛和盾牌奋起反抗，然后在那一瞬间，匆匆而过的炮火和枪弹就碾碎了所有人的抵抗意志，相比于战争，那更像是可怕的屠杀。\n\n在那之后，这片土地在绝望和哭声与中失去了光明，而南方的子民被迫屈服于北国的炮舰和残暴的皮鞭，他们向暴君低下头颅，也在这个过程中被挖走了余生的希冀和幸福。那道可怕的创痕难以愈合，已经溃烂成了无法直视的样子。\n\n斗争永不停息，直到他们能重新在这片祖先的土地上获得自由，打倒这些该死的科里亚特土邦只是第一步...为了萨尔贡人，为了死去的同胞。就算科里亚特人一次次把无数萨尔贡人葬入黄沙，他们也会保佑更多的金土子民从废墟中站起。\n\n“科里亚特人为什么要来帮那些土邦？这跟他们完全没关系不是吗？”跟着他的一个年轻人抓紧法杖，他的口吻有些不解，作为一个单纯的感染者来说，他还理解不了萨尔贡人和科里亚特人的诸多民族恩怨。\n\n利尔维特不假思索，他很想给后来的孩子们普及那段历史，但他最后的口吻却莫名的讽刺：“这笔烂账已经多少年了，是一代人的记忆。”\n\n“不把我们杀光，科里亚特人的皇帝能高兴么，他的皇冠能戴的稳吗？”"
 focus_krt.46.a: "战斗下去，直到自由降临。"
 focus_krt.47.t: "父辈的旗帜"
 focus_krt.47.d: "南征大军组织了两个集团军，总计十八万名士兵和数不清的火炮、坦克、用源石装置激发的步枪。乃至源石制品和对应的军用法杖，军官们都说1074年的那场战争要比这次动静小多了。那些小山般高的陆行舰从中央大区出发，跨过了南方军区边境，进入了土邦地界，将大量的士兵送到了他们应该抵达的位置，然后进攻就要开始了，科里亚特军队的抵达将迅速改变战场态势。萨尔贡叛军不得不抽出很大一部分兵力北上迎击，这当然是总参谋部预估的战场形势，如果装甲先登部队进展顺利，他们应该能先发制人夺取几个重要的荒野节点。\n\n迈因元帅临危受命，负责整个南方军团的斟乱行动。贵族的年轻一代也纷纷跟着南征军团出发了，他们举起了父辈的旗帜，听到了休伯特陛下的号召，回想起了帝国的黄金岁月，这唤醒了他们心中最深处的渴望。贵族社会已经在和平中安逸了二十年，但又有多少人真的忘记了战争和鲜血呢？北方军才不是唯一优秀的战士，他们也是。\n\n“士兵们！我向你们保证，一个月之后，所有人都将会回家与家人团圆。你想象自己在哪里，你就会在哪里。我们将在绿野里奔驰，我们将在黄沙上畅饮鲜血！有温暖的阳光为你的英勇送行，不要觉得奇怪，因为你现在站在帝国军团的队伍中！”\n\n“让我们的身姿演变为后世赞颂的凯歌，让我们的军旗在后世的博物馆中腐烂吧！我们今天将创造历史，你们每个人都是这场伟大战役的见证者，神明保佑你们，帝国永存！皇帝万岁！大科里亚特万岁！”\n\n迈因元帅慷慨陈词，下方的贵族青年们发出的欢呼和冲破了苍穹，他们举起二十年前征服南方的军旗，再一次踏上了道路，从前进的陆行舰和铁履中...他们看到了过去父辈们的荣光，皇帝的号召将再一次拯救帝国，然后他们将备受帝国男男女女的瞩目，忠诚即是赞歌，怒吼化作雷鸣！"
 focus_krt.47.a: "前进！跨越梅萨河！"
 focus_krt.48.t: "装甲与黄沙"
 focus_krt.48.d: "帝国南方的萨尔贡人一开始根本没把科里亚特军队当回事。\n\n他们想，这个帝国正在内乱中迅速崩溃，根据一些零零散散的情报透露出来的消息，科里亚特的两个皇储和他们的皇帝都已经在烈焰中灰飞烟灭了。甚至连他们所谓的荣耀首都现在都已经成为了一片废墟，他们完全没有理由去惧怕科里亚特人，固执的起义军领袖也不认为北国能再拉起一支像样的军队，因此强烈的驳斥了几个将领危言耸听的言论，他们的主力军队应该全力围剿皮洛萨斯克。\n\n这让他们错失了先机，导致了严重的后果，安娜将军指挥的帝国装甲部队率先出发，他们按照计划甩开了步兵很长一段距离，Ba90坦克飞驰的负重轮成为了南方黄沙漫天中壮观的景象，他们把荒野远远落在自己身后，在一路风尘中碾碎沿途的障碍。\n\n梅萨河天堑完全没有起到阻挡的效果，游击队仅仅是炸毁了那两座桥梁就没有任何进一步的行动了，他们甚至没有向河岸派出斥候和任何的侦查人员。这种松懈给他们带来了难得的机遇。帝国工兵在短短三天内就修筑了一条临时桥梁，科里亚特军队的迅速渡河震惊了萨尔贡人，他们的主力此时还在慢慢悠悠的北上。安娜将军带领的装甲集群在半数渡河后就开始朝着下马哈拉佩和哈博罗内狂奔飞驰，短短一天就向前抵近了130公里，冲进了数个当地已经被叛军占据的城镇和据点。\n\n在荒野的几个驻扎点，如同神兵天降般的坦克部队让叛军士兵萌生出无力感，他们惊恐的看到Ba90装备的75毫米主炮发射，榴弹径直轰穿了叛军在荒野上草率铸起的围栏，将黄沙地的一角轰的尘土飞扬，顺带着掩盖了萨尔贡人惊恐的表情。\n\n坦克随后向前推进直接碾过了木桩残片和拒马，然后车载机枪的扫射让还所有还未来得及上前施展源石技艺的术士倒下了枪林弹雨之下，整个据点逃出追击的绝对不超过十个人。截止到天明，安娜装甲集群便收回了帝国数个重要的南方村镇。\n\n当安娜的前线指挥部抵达距离丰都城70公里外的荒野时，她皱起眉头，对频传的捷报已经生出了一丝怀疑，萨尔贡人的防线就像是纸糊的那样脆弱无力，不过她的参谋官和士官们对此信心十足，他们不关心叛军的部署到底如何。"
 focus_krt.48.a: "将军！下一个目标在哪？"
 focus_krt.49.t: "萨哈比亚堡之围"
 focus_krt.49.d: "萨哈比亚堡，科里亚特西部为数不多的规模化移动城市，也是科里亚特在1077年正式设立的帝国西部行政区，位于梅萨河东岸，北临圣马丁辖区，南临劳也伦斯托克；再往西边就是帝国的矿产区和较为荒凉孤立的原野乡镇，因此地理位置较为重要——这座城市以西的所有交通贸易都要依靠这里的陆行舰枢纽进行转运，同时这里也是关乎到核心地区的门户。游击队夺取这里后，当地懦弱的土邦首领居然丢下了帝国的城市逃走了，这让凯斯特几乎怒不可遏。\n\n在快速渡过梅萨河之后，科里亚特军队依靠装甲集群打了几个漂亮的歼灭战，在路上还在前进中的萨尔贡军队显然缺乏经验和素质。一头撞进了科里亚特装甲师的伏击圈，他们大多数是游击队在解放南方城市后拉起来的矿奴和奴隶，比起战术素养较高的帝国装甲部队几乎是一触即溃。同时缺乏对付坦克的重武器，也没有像样的法杖和施术设备，仅有少数掌握破坏力法术的狂躁感染者能对坦克造成威胁。\n\n基本上没有任何悬念，血肉之躯对战车载机枪，他们的下场十分凄惨，在将近十分钟的屠杀后，八千名分散行军的萨尔贡叛军...或者说平民陷入了大溃败，他们在黄沙上亡命奔逃，不断被后方追击上来的坦克和机动步兵射倒，染红了这一小片沙滩，直到剩下的两千八百个失去战意的农民跪地求饶。这支装甲部队的指挥官对他们不屑一顾，留下了一个连的步兵将这些瑟瑟发抖的可怜人送到后方，然后在天明前切断了萨哈比亚堡的后方航道，剩下的部队兵分两路分头前进，目标分别是泰梅尔和纳米布土邦。\n\n轰！惨烈的爆炸将守军从清晨的睡梦中惊醒，在所有人都没回过神的时候，第二声巨大的响声紧接着传来，然后有人才意识到什么，颤抖着喊道，“炮击！是炮击！快点跑出去！”随后整个房间像是炸了锅，找袜子的、穿鞋的、踩到别人尾巴的、甚至是在推搡中崴到脚的叫声占据了狭小的空间。\n\n尤尔斯猛然睁开眼睛，然后顾不得擦去自己的眼屎，手忙脚乱的穿上自己的外套飞奔而出，在那里他看见无数道刺眼的黄色光芒从低矮的城市壁垒上划过，如同极速坠地的流星般轰入城市外的几处军营，将那个建立在壁垒区域的瞭望塔炸成了城墙下凌乱的一摊废铁。\n\n“科里亚特人！是科里亚特军队！我们被包围了！”游击队员焦虑的吼叫着，跑过3号城区的内部和空场，他的表情相当紧张。\n\n“发生了什么？我们城外的兄弟呢？”尤尔斯惊呆了，他一只手抓过自己的朋友，质问他究竟发生了什么事情。\n\n“他们...他们都...”那个可怜的人语气微弱，脸色惨白，颤抖着指向城外的黄沙，那里悬挂着友军的旗帜。这已经能说明很多问题了。\n\n科里亚特人的火炮阵地在可以看到的地平线远方耀武扬威的不断开火，从容的就像是走路回家，他们身后的城市随之在烈焰中燃烧，黑色的源石残片攀附在漂亮的尖顶小房子上，笔直的伸向天空。"
 focus_krt.49.a: "把大炮拉上来！反击！反击！"
 focus_krt.50.t: "重夺重镇"
 focus_krt.50.d: "萨尔贡人已经难以抵挡了，对于游击队和部分支持脱离帝国的南方民主人士来说，围攻持续了半个月左右，他们随之经历了半个月的折磨和摧残。\n\n尤尔斯盯着燃烧的中央壁垒和城门，他的脑壳一阵嗡鸣作响，满脑子都在回想自己是如何输掉这场战斗的，他们输得一败涂地，而乐观者所期望的援军也迟迟未到，城市被上万枚各式炮弹射成了筛子，她的城墙也没办法起到多少作用在轰击中保护它的子民。\n\n科里亚特人非常狡猾，他们养成了豺狼般敏锐的嗅觉和方法，城外的炮击阵地的质量和数量都要优于移动城市内的情况，他们依靠几门城防炮在炮战中已经不足以抵抗下去，先是四号城区的炮塔被摧毁，然后是七号城区，最后是十一号城区的隔离桥和基础通道被炸断，两个城区之间的链接就像是被打断的腿吊在离地三十米高的底盘缝隙之间...那场景真是让人绝望不已。\n\n当最后一门城防炮也在对射中被敌军重型火炮摧毁，然后便再也没有什么东西能够阻止敌军的火炮肆虐，游击队员们悲哀的发现他们失去了最后的手段，试图逃出城市的人只要踏出壁垒区就会被不知何方射来的弩弹或法术击中，颓然倒下——到了18日，科里亚特人又拿出了新式武器，他们见所未见的超级巨炮，装载到了那辆...或者应当说那艘战舰上，它的轰鸣在一瞬间就击溃了他们绞尽脑汁维持了半个月的城市壁垒，在移动城市的履带到城墙的一角上轰出了豁口。形容起来就像是菜板上的破碎的边角料，城市和地面之间足足有三十米高度差竟然被火力活活的抹平了，这里坍塌出了一个支离破碎的斜坡，将城市的动力轮和履带压在了下方。\n\n在那之后，敌军送来了使者，他举着双手被送到了尤尔斯的面前，对方用萨尔贡语警告说，如果他们不打算放弃抵抗，科里亚特军队将会发起全面进攻，到时候可就不是几发炮弹那么简单的事情了。如果他们放下武器，那么所有奴隶可以免去一死，帝国向来宽容。\n\n在一阵沉默后，尤尔斯瞥了一眼坍塌的城墙，还有城内筋疲力尽，用颤抖的目光瞧着领袖的游击队员们，他在西陆原野的黄沙飞扬中陷入了沉默，然后半晌转过身，看向那个加入他们的科里亚特人。\n\n“你会说科里亚特语吧？”尤尔斯淡淡问道。\n\n“是的？”得到那人的回答，尤尔斯微微一笑，随后戏谑的指向脸色阴沉的科里亚特使者。\n\n“给我骂他。”"
 focus_krt.50.a: "20日黎明，尤尔斯的脑袋被摆在了科里亚特人的桌子上。"
 focus_krt.51.t: "游击队之殇"
 focus_krt.51.d: "短短的一个月，战争便结束了，硝烟并没有持续太久，在短暂的流血牺牲后，在南方猖獗了数年的萨尔贡游击队领导人皮奇尼尼就在两面夹击中死在了科里亚特人的手中，他的上万追随者死亡惨重，虽然理论上南方叛军有十万之众多。但大多数人见风使舵，许多游移不定的感染者和奴隶在看到科里亚特军旗以及坦克的屠杀后，就完全丧失了他们一个月前的勇气，也背弃了自己向领袖许下的追随到底的诺言，重新跪倒在地请求原谅，这个时候科里亚特人展现出一点仁慈，能留下他们的性命，他们就能重返奴隶工厂或者矿场去了。\n\n然后呢，科里亚特军官们互相打趣，他们打赌这些奴隶可以杀死想要解放他们的领袖——比如那个煽动感染者奴工起来抵抗的头子，于是他们做了这个有趣的实验，把一个游击队的队长带到了那些哭泣的奴隶面前。下令要求他们杀死这个几天前还在鼓励他们作战的队长，这样他们就能得到自由，摆脱奴隶和帝国三等公民的身份，甚至是获得移动城市的居住权。\n\n然后那几个奴隶照做了，他们争先恐后把尖刀刺入了那个想要拯救并解放他们的游击队员的胸膛，然后割掉了他的脑袋，抢着向他们的科里亚特主子邀功，这颗带着绝望和死不瞑目表情的头颅便成为了这两个奴隶通往自由的通行证，于是几个军官笑了，他们大度的许诺了这两个奴隶自由，然后说：“瞧吧，这就是萨尔贡人的样子，这就是为什么萨尔贡人会在我们脚下臣服，成为奴隶。”士兵们听完以后纷纷笑出了声。\n\n几天后，游击队的临时继承者杜塞特·科尼也被当地人出卖，在一个村庄试图蒙混过关时，两个合作者向科里亚特军官举报了他，然后换来了33个科元，那能让他们多购置两只牲畜，或者是四只幼崽。在这个时候，曾经数万人规模，让当地土邦难以忍受的萨尔贡游击队，已经被精锐的帝国军队剿灭的只剩下几千人了，遁入了更深处的荒野，当然这里还有数万名俘虏，那些人都是听信游击队的声音，起来反抗的人。\n\n在被押解到指挥部的路上，杜塞特垂头丧气，一言不发的望着军车外面的风土漫天，车轮碾碎了一只觅食的源石虫。好像他的事业和所有的希望也跟着那只源石虫粉碎殆尽，他被几个军官推向了指挥部，然后见到了那个眉目清秀，五官端正的女人——安娜·克里斯蒂娜，两个对南方作战的装甲集群指挥官之一。\n\n安娜端详着这个满脸正气的人物，用一种漠不关心的眼神瞧着他，她的脑海里在那一刻出现了截然不同的两个想法，似乎哪一种解决问题的手段都可以，然后她对自己的副官说。"
 focus_krt.51.a: "“杀了吧。”"
 focus_krt.51.a.tt: "§Y科里亚特社会将更加§R极权化......§!"
 focus_krt.51.b: "“克尔曼，把这个家伙送到集团军指挥部，交给克里·羽处理。”"
 focus_krt.51.b.tt: "§Y科里亚特社会将更加§C包容化......§!"
 focus_krt.52.t: "埃里克的首秀"
 focus_krt.52.d: "第一场装甲战爆发在通往埃尔文斯克的路上。\n\n埃里克在沉闷的坦克车身内艰难的喘息着，这破烂的通风系统就跟他们家的那个吱嘎作响的破门轴没什么区别，从维尔德堡高强度行军了一天，就跟走进了磨坊的绞盘里没什么区别，狗屎般的减震器没有起到任何作用，他一直都想吐槽帝国坦克在乘员舒适度上的糟糕设计。\n\n“车长！距离九百码！榴弹装填完毕！”\n\n“开火！”埃里克大声下令，“让那些步兵别冲到前面去送死，该死的！”\n\n两辆Ba90坦克碾过荒原，203号坦克黑洞洞的主炮迸发出刺眼的明黄色，随后远方的草垛便在爆炸中被扬成了一片凌乱的灰色尘埃，爆炸将掩体后面的几名北方军士兵当场掀飞了数米之远，乘胜追击的帝国士兵便乘着坦克的优势飞快向着前方的建筑飞奔，冲入了村庄的一角。\n\n“敌军坦克！”在前方五十米的拐角，埃里克大声咒骂着，那辆清晰的蓝色涂装坦克进入了观瞄镜的视野内，双方的距离不到一百米，在这个距离谁先开火都能贯穿对方的装甲。\n\n嘭轰！汉森轻车熟路将一枚穿甲弹装填进炮闩，踩下脚踏板，撞针瞬间激发了坦克炮的源石底火，那辆北方军坦克被正面贯穿，摇摇晃晃的借着惯性继续向前滑动了几米，然后如同失去灵魂一般停在了原地。\n\n“倒车！倒车！”还没等驾驶员回过神来，埃里克歇斯底里的大吼就传遍了整个坦克内部，他想也不想就踩下倒车，在Ba90坦克逐渐向后倒退的过程中，那发惊险至极的穿甲弹沿着坦克前沿不到几米的距离穿过，把侧面的一堵精心装饰的围墙砸的尘土飞扬。\n\n“你怎么知道的？”驾驶员德米里特·伊万诺维奇震惊的吼道。\n\n“直觉！”埃里克咬了咬自己的后槽牙，他在自己的观瞄镜里发现了好几辆北方军坦克，全都是新式的Ba90式，他镇定地要求自己的炮手继续装填，然后在这个绝佳的射击角度有一炮击中了那辆距离200米远的坦克油箱，猛烈的殉爆刮起一阵热浪......"
 focus_krt.52.a: "在战斗结束后，他们一共击毁了7辆北方军的Ba90式坦克。"
 focus_krt.53.t: "孤星城回归帝国？"
 focus_krt.53.d: "“不行，我受够了在奥维斯因河上跟那帮北方佬撕扯，这根本行不通，我们会活活流干最后一滴血。”帝国总参谋部内，阿廖沙·沃尔伊诺维奇忍不住对参谋官抱怨起来，近几日他们损失的装备和人力都远远超出了预期，他希望能在某个位置上打破僵局，鹰钩般的目光在战术地图上左右扫视。\n\n战争陷入了僵持，双方的炮击阵地互相对轰，然后在整个北梅萨奥维斯因河拉出了一条长长的战线，集中突破的几次攻势均以失败告终，北方军十分善于防守，他们的侦察术士日夜沿着河岸部署，在察觉任何帝国的坦克痕迹时就会放出法术照明弹预警。\n\n参谋长擦了擦自己头上的冷汗，小心翼翼解释道，“但是北方军的防线相当稳固，他们在对岸的炮击阵地已经稳固下来了，而且您知道因为南方的缘故...我们的装甲力量没有什么优势。”\n\n阿廖沙有些暴躁的盯着副官和参谋的脸色，然后他重复了一遍自己的命令：“我不想要解释，我想要结果，如果下一周我们还没办法推进到孤星城，我就把自己在阵地前面埋了，我不开玩笑！”\n\n他说完这句话，整个房间都鸦雀无声，副官现在已经在思考调集第三和第四装甲师再组织一次进攻的问题了，可是继续强行渡河在这片宽阔的海岸平原上无疑是活靶子，最后他只能垂头丧气的放弃了这个提议，转而支持等待埃尔文斯克侧翼的装甲部队从侧翼袭击敌人。\n\n“好消息，长官。”这个时候科里亚特·德恩斯快步跑到指挥部，朝着长官敬了一个礼，“孤星共和国在昨天联系我们，打算回归祖国，”\n\n“消息可靠么？本杰明·安东尼奥那只老狐狸不知道又打着什么坏心眼，那帮孤星佬满嘴跑火车的技术不比我妈差劲太多！”阿廖莎质问他。\n\n德恩斯挑了挑眉头，他直接道：“我想应该是可靠的，他们甚至送来了北方军在近几日的阵地情况，与我们的侦察基本相符，他们主动邀请我们在东维尔德方向发起攻势，要是计划顺利，我们可以从那边跨国河岸天堑，然后三面包围孤星城的北方佬。”\n\n阿廖莎沉寂了一会儿，然后盯着德恩斯的眼睛。"
 focus_krt.53.a: "“那就去做。”"
 focus_krt.54.t: "跌落的北方骏鹰"
 focus_krt.54.d: "在新维多利亚最后的一处北方军驻地，约瑟夫·赫尔贝格灰头土脸，毫无神采的注视着地堡中昏暗的文件，地下掩体内倒着两具尸体，是他女儿和妻子的尸体，几分钟前他才刚刚用毒药杀死了她们。外面时不时传来一声沉闷的爆炸，让他难以入睡，两周前孤星共和国的倒戈让战局彻底失去了悬念，他的所思所想也都在那一刻被无情击碎，科里亚特步兵已经前进到的距离已经能让火炮都落到他的眼前。\n\n他想啊，他为科里亚特付出了一生的代价，从年少时就征战在哥伦比亚战场，在战场上出生入死，奔波在孤星共和国和祖国的边境来回战斗。最终为自己赢得了榴弹屠夫的称号，他不曾害怕死亡，唯独害怕为人所遗忘，作为北方军的将领，赫尔贝格家族的三子，他只能死在自己的枪下，也绝不接受虚伪的审判。\n\n约瑟夫露出了一个难以察觉的笑容，他不能继承安德烈的事业，但能为自己的生命画上句点，在爆炸声越来越近的同时，将那把令人生畏的榴弹枪拿了出来，充盈着黄光的源石弹药被悉数装填，抵在了源导装置上，然后他将其对准了房间了一角。\n\n轰！爆炸掩埋了他，也掩埋了这颗血腥残忍的心。\n\n当科里亚特士兵找到这个可疑的房间，他们只发现了高浓度源石留下的残片和废墟瓦砾，而这位战功赫赫的祖国将领，就这么消失在历史的风烟中了，从第三次哥伦比亚战争的一战成名，再到叛乱的硝烟散去，或许以后也不会有多少人了解这位乌萨斯的事迹。\n\n阿廖沙在得知这件事的时候露出了黯然神伤的表情，他们本可以是对抗哥伦比亚的战友，但终究不能得偿所愿。"
 focus_krt.54.a: "“榴弹屠夫终死于自己的残暴和野心，无人会为他垂泪。”"
 focus_krt.55.t: "捷报"
 focus_krt.55.d: "秋天的枫叶在眼前飘动，寒潮在入秋之后愈发向整个帝国靠近，街道上的行人都加了一层厚衣物。\n\n在凯林登格勒的御前会议上，休伯特一世昂首站在临时宫殿前的阳台上，这里本是先帝度假时修建的休闲别墅，现在已经在临时整修后重启为了议会和临时宫殿，尽管皇帝本人并不在意这些排场，但几个内阁大臣还是坚持认为帝国并不能缺少一个具有威严的议事场所。\n\n安德尔森带来了秘密调查局的信息，“陛下，叛乱的问题都解决完毕了，克里·羽和迈因大人刚刚提交了报告，北方军和南方叛军都已经被剿灭完毕，现在帝国南北的军团都驻扎在当地处于维稳状态，我们可以开始之后的工作了。”\n\n“嗯。”休伯特一世淡淡回应，他早已经知道这个结局，历经磨难和战火，他得到了千疮百孔的帝国和一贫如洗的子民，但这又有什么关系，生命长存，希望永在。皇帝用明亮的目光注视着安德尔森，他关心道，“听说你之前因为寻找朕的线索，染上了矿石病是么？”\n\n安德尔森瞬间浑身冰冷，他不知道是谁将这个消息传出去的，知道这一点的只有深入核心城同队的队员，他不由得露出了苦笑，难道新皇打算处置自己，就像是以往先帝处置其他感染者那样，丢进隔离区等死或者是哪个暗无天日的南方奴隶矿场？\n\n“陛下...我...”安德尔森浑身战栗，他试图解释些什么，但他绝望的发现不管说什么都苍白无力，感染者就像是原罪，哪怕传染性微乎其微也不能让固执的反感染者人士明白他们不该死。\n\n“不用担心，朕明白。”休伯特看出了他的恐惧，然后似乎露出了怜悯的神色，上前拍了拍他的肩膀，“注意身体，希望你能长命百岁。”\n\n“从今以后，你就跟着苏维做事，帝国境内的感染者再也不会受到任何苛责与奴役，从你开始，这是朕对你个人的承诺。”\n\n“我——要解放感染者。”皇帝戏谑的勾起嘴角，一字一顿的在他耳边说。\n\n安德尔森呆在原地，他愣愣的点着头，然后注视着皇帝的身影越过议会大厅的红地毯，消失在门帘尽头，他的热泪终于涌出眼眶。"
 focus_krt.55.a: "这份简单的承诺不知饱含多少血泪。"
 focus_krt.56.t: "科里亚特再统一"
 focus_krt.56.d: "帝国从南到北再次归于一面旗帜下！\n\n这是多么不易的事情，从大灾变开始以来的民众终于能松一口气，北方军再次回归，土邦再次臣服，从孤星城到皮罗萨斯克的土地再次结为一个整体。他们的动乱时代暂时结束了，新皇组建的政府将很快展开他的工作，为了科里亚特人民的共同利益，休伯特一世会按照他的想法改造这个凯林登时代的遗物，将其蜕变为真正的西陆明珠之国。\n\n虽然帝国统一是一件好事，但政府内已经出现了担忧和质疑的声音，国内的贵族阶级和资产阶级均对新皇抱有不同程度的不信任，在失去了凯林登后，新的帝国政府很可能会改变当下的政策，但那些政策无疑能让他们得到难以想象的权益，如果展开改革，那势必让他们蒙受损失，因此先皇的反对者并不算少，不少上流社会人士都希望重新选出一位维尔德贵族公认的继承人，来接管帝国的执政权。\n\n当然，皇储派对此强烈反对，支持和拥护休伯特派的声音与反对者混成了一滩看不出本来样貌的浓汤，政治的强烈动荡或许会严重影响帝国政府的稳定度，如果新皇难以在大灾变中挽回民众的信心和国内的危机，那么恐怕反对休伯特的贵族将会趁机发难，到时候失去公信力的贵族很可能也会失去人民的支持。\n\n不过帝国绝大多数深处痛苦深渊的底层感染者和二等公民仍然抱有希望，新皇承诺的改革让他们看到了解脱的曙光，那一丝生机或许就在前方，他们只需要心怀期待，并等待最后的结果。"
 focus_krt.56.a: "叛乱尘埃落幕，但也只是开端"
 focus_krt.57.t: "天上的繁星"
 focus_krt.57.d: "杜塞特·科尼被人生硬的扯了出去，在安娜下达命令的那一刹那，周边的士兵就面无表情地动了起来，他微弱的张了张嘴，好像要喊出几声讽刺来为自己壮胆，但恐惧攥住了心房促使他最后什么都没有说出来，面如土色被两三个科里亚特士兵推出了营帐。\n\n紧接着，他被带到了一个荒无人烟的沼泽地。整个过程都只能听得见自己的喘息声，身后的士兵狠狠踢向他的膝盖促使他跪下，脚步声渐渐远离，然后是一阵可怕的静默。\n\n每个萨尔贡人都是天上的繁星，这片土地上流传着这样的话语，萨尔贡人的传承是继承自天上的星星，他们每个人从降临到时间开始，就受到星辰的庇佑，只有死亡能将他们重新带回来时的星宿，然后他们将与逝去的家人团圆，在那个远方的美好世界继续下一段旅程，这里的人不认为存在死亡这个概念，他们的灵魂只不过是在不同的世界之间游荡而已。\n\n杜塞特微笑出来，最后在漫天风沙中呼吸了一下这个世界的空气，他想要记住这个气味，记住故乡的土地孕育的生息，或许在离去到另一个世界的时候，他能和死去的家人在那边相逢，然后他希望跟他们诉说今生的最后几秒钟的所思所想。\n\n“萨尔贡人万岁！”他大声喊道，让自己的声音回荡在整片沼泽地里，这里没有神明，没有黄沙金土下的驮兽和金色沙铃，只有一个萨尔贡人自始自终不曾放弃希望的心，相信自由终将来临，相信人们总会找到出路，正如他所信仰的闪闪红星。\n\n砰！一声枪响划过天际，随后万籁俱寂的沼泽地里传来了沉闷的响声。"
 focus_krt.57.a: "又有一颗纯洁的灵魂回归了远方闪烁的繁星中。"
 focus_krt.57.tt: "§b萨尔贡游击队已经消逝。§!"
 focus_krt.58.t: "宽恕和效忠"
 focus_krt.58.d: "杜塞特·科尼怪异的抬起头，他随后被两名士兵粗暴的推搡出营地，他们在背后用阴阳怪气，或许还夹杂着略微的不满：“真幸运啊，小子，不过别高兴的太早，天知道为什么安娜将军没把你毙了。”\n\n他不怕死，杜塞特冷笑不已，在心里暗暗瞧不起这些科里亚特佬，他们自诩为了皇帝而战，但是他们的皇帝会如何对待他们呢？据他所知，科里亚特人的生活并不好，他们全都是那个只手遮天的贪婪暴君怀中的柴火，随时可以投入名为帝国的烈火中燃烧殆尽。\n\n经过了几个小时的车程，杜塞特才到了他们的指挥所，这个科里亚特总队的营地相比那个简陋的前线指挥部看起来要更加可怕了。这里筑起了简易的异铁高墙，同时也能看到几名禁卫军的身影，他们的目光杀气满溢，表情也在阴婺中透着狠辣的感觉。\n\n“我想想，煽动叛乱、袭击帝国荒野车队、谋杀政府官员、非法持有武器，反抗帝国专员，这么多条罪行够你在科里亚特的大牢里死上四百遍，别说你还是个萨尔贡人。”克里·羽用数落的语气讽刺说，直勾勾地瞧着这个衣衫褴褛的家伙，“不过你很幸运，休伯特陛下禁止我处置任何游击队首脑，你可以活下来并被送到凯林登格勒等候宣判，陛下对你很感兴趣，他希望得到你的协助，所以你大概率能留下一条小命。”\n\n杜塞特惊疑不定的抬起头，他的生命从进入游击队的那天开始就全都奉献给了共产主义事业，用充满血丝的眼神看着克里·羽平静无比的表情，眼皮上下跳动，沉默持续了半分钟，然后他用沙哑的嗓音大声质问这个女人：“杂种，这又是什么想要折磨我的阴谋？想听我求饶，像是那些奴隶一样卑躬屈膝？”\n\n“别做梦了！科里亚特佬！有种你现在就杀了我！萨尔贡的子民总有一天会找到你们的软肋，然后亲手为我们复仇！这片土地的斗争永远都不会停止！牺牲的战士们万岁！人民万岁！”\n\n克里·羽饶有兴趣地听完这个人的话，她现在发现每个游击队员都有这套嘴上功夫，她抿了一口氤氲的棕茶，“这不是什么阴谋，你这个稀里糊涂的愣头青，我都不想跟你多说半个字，如果你们真的那么强大，现在就是我要跪着向你求饶了。”\n\n“这是一份来自新皇的宽恕，还有你们萨尔贡人的机会。”她听着杜塞特的眼睛，把皇帝撰写的命令推到了他面前，认真的一字一顿道。"
 focus_krt.58.a: "房间里再次陷入了诡异的沉默。"
 focus_krt.58.tt: "§R星火仍存......§!"
 focus_krt.59.t: "征战北方"
 focus_krt.59.d: "“乌云已然笼罩我们的天空，那是北方军的刀剑和强权！那些北方的野蛮人压根不把我们当成同胞！他们因为自己的私欲给首都带来的无穷的劫难，将中央-核心城抢掠一空！这就是他们的野蛮本质！愚昧！可恨！当他们再次来到我们的家园，他们会给你们一样的待遇！”\n\n“现在，他们还要索取我们的帝国，抢走科里亚特人民的皇冠！让我们在一个不折不扣的暴君手下臣服，凯林登陛下的军旗还在你们上空飘扬！先帝和新皇都不会容许这样的事情发生！”\n\n“全体军士谨记！神明正在注视着你们！为了先皇！为了休伯特陛下！杀光所有犯上作乱的北方叛军，帝国万岁！你们要英勇、无畏、展现出一名士兵的荣誉、胜利！胜利！胜利！为了胜利——！！”\n\n中央军区第四装甲师，203号坦克车长埃里克随心所欲的靠在墙壁旁，在凯林登格勒听着来自营长的演讲，他的声音措辞有利，洪亮饱满，让在场的每个士兵都打起了精神，他们的眼中满是冰冷和坚毅，每个人都渴望尽力结束北方的战争，然后带着荣耀凯旋回乡。\n\n炮手汉森从角落走了出来，递过来一支烟，然后掏出打火机：“嗨，埃里克，瞧见那边的征兵告示没有？帝国要大扩军了！”\n\n“这稀奇么？”埃里克眯着眼睛，接过这支烟吸了一口，辛辣的气息一路窜进了鼻腔，让他的精神稍稍抖擞起来，他感叹于祖国的分裂和南北的对峙气氛，是什么让科里亚特变为如今分裂的模样呢，他从自己的脑海里找不到答案，“你觉得北方人有他们说的那样糟糕么？”\n\n“我不知道，反正他们确实没做什么好事，我们没什么资格评价营长的话。”汉森苦笑几声，他不敢去多谈论国家大事，谁知道会被某个小心眼的有心人听取，报告给上级就是一场大麻烦，凯林登时代已经让每个政府官员都养成了谨小慎微的习惯，他们不太想去关心自己利益以外的事情，这个社会往往并不麻木，麻木的只是人心。\n\n“我们什么时候出发？”埃里克抬起头，终于问起正事。\n\n汉森怔了几秒，然后说：“一天后，我们会向北梅萨河进发。”"
 focus_krt.59.a: "“看起来我们的小伙子有事可做了。”"
 focus_krt.60.t: "一念之间"
 focus_krt.60.d: "火焰横扫街道与住宅，城市在巨炮的轰鸣中呻吟，地平线上升起一阵银白色的寒光，那是刀枪剑戟与巨炮铁履在前进。\n安德烈的北方军在第二个黎明到来前就突入了城市，内城区的抵抗在瓦解后相当混乱，据说霍夫曼皇储已经被他的军队护送到了城内相对安全的位置，从安东尼斯大区到圣马丁街道都陷入了火海。区办公厅长官和贵族宅邸都被扫荡了几遍，往日的贵族成员像是野狗一样被拖到街上杀死，北方军的肆意妄为令人相当恐惧。在外城发生了劫掠和屠杀，财富、女人、还有其他的东西都被争先恐后的抢夺一空，安德烈用这种方式来犒赏并凝聚他的军队，让他不至于难以指挥这支虎狼之师发起叛乱，而科里亚特费力编织的西陆之都如今只剩下硝烟余烬中的灼浪，现在她的子民也自身难保。\n核心城，反应锅炉的三号电机组，二等兵马尔科守卫在最后一道防线内，他的长官早就因贪生怕死随便找了个理由逃之夭夭，然后留守在锅炉区的两百名士兵逃走了一大半，只剩下不足五十个人坚守在自己的岗位上。守军并不是首都军团的精锐，他们只能用简陋的武器朝着北方军射出法术和子弹，几分钟前另一个战友也死去了，对马尔科说的最后一句话是，“你他妈一定给老子活下去，从这场该死的灾难下！”\n马尔科攥住自己的铳枪霰弹，暗暗咒骂着这座毫无生气的城市，远方的炮声和源石技艺撕扯的声音都折磨着他脆弱的神经，三分钟前，他打出的一枪成功杀死了距离自己不到两百米的一个敌人。在战斗了数个小时后，这名列兵终于筋疲力尽的靠在核心城的中央锅炉旁，马尔科偶然想起今年初皇帝在这座高塔的最上方演讲的盛况，他许诺过永恒、繁荣、以及伟业之类的概念，但现在那些都成为了骗局，首都还剩下什么呢？\n滚烫的泪滴从脸上滑落，马尔科的手中燃起一簇明亮的火焰，他听到了门外爆炸带来的巨响，敌军步兵已经杀入锅炉区了，与这里负隅顽抗的人争夺着走廊和阶梯，这座强烈的源石反应堆是驱动这座城市在荒野驰骋的工业奇迹，马尔科血红的眼神死死盯着那个仍在运行状态的三号锅炉，他知道自己无论如何活不下去了，脑海中诡异的冒出了一个无比疯狂的想法，同时又有另一个理智的声音在脑海里呼唤着他，别那么做……"
 focus_krt.60.a: "马尔科痴笑着熄灭了火焰，一切归于沉寂……"
 focus_krt.60.b: "火焰砸入了源石电机组……灾变之地的闸门随之打开。"
 focus_krt.60.tt.1: "然而，一切顺利……"
 focus_krt.60.tt.2: "§R别那么做……§!"
 focus_krt.61.t: "科里亚特内战"
 focus_krt.61.d: "轰！在巨响中，锅炉区那扇规格极高的装甲大门在几次爆炸后轰然裂解，从正中间融化了一个红灿灿的大洞，被融化的铁水流淌在地面上冒出滚烫的白气，然后迅速凝固成焦黑的模样，北方军的术士分队杀入了最后一道装甲大门，马尔科被看不清的源石技艺转瞬之间摘掉了脑壳，那冲天的热血泼洒在锅炉外壁上，形成了狰狞的放射性形状。\n两三个突击组士兵将马尔科的无头尸体拖走，然后走进来的北方军军官在几个攻击术士的簇拥下满意的注视着眼前的首都锅炉区，这个黎博利杀了无数首都的人，手上沾染平民的血比他在前线杀的哥伦比亚人还要多。但他一点都不感到愧疚，每个北方军士兵都震惊于首都居民的生活之奢侈，贵族家宅中隐藏的财富到底有多么夸张，所有的怜悯便都被另一股混合且复杂的情绪占据了——既有愤怒，也有贪婪，更有发自内心的痛恨。\n三号电机组及其配套的锅炉设备现在是他们的囊中之物了，也意味着这座城市落入了他们的控制下，首都的抵抗很快就会停止，安德烈陛下也能如愿以偿荣登皇位，军官心里有着自己的小心思，他能主动献上这个锅炉，然后在新皇面前得到不少赏赐。\n“长官，我们怎么处置这些人？”一个士兵兴奋的跑了过来，在军官的身边征求意见，他指了指那些被俘虏的首都城防军，“要把他们送到后方吗？”\n军官沉默了几秒钟，然后满怀戏谑的口吻，“不，把他们扔进锅炉融化，让他们和这座伟大的城市合二为一吧！”\n几分钟后，惨叫占据了每个锅炉区士兵的内心，他们把这些人前前后后投入了烈火，几十个人，一个不留。军官对这些士兵说，现在他们死不见尸，你们可以随意占据他们留下的财富，然后每个人会心一笑，对这件事守口如瓶。\n1095年，中央-核心城，西陆永恒之都沦陷，北方军在这里扫荡了一周，将贵族成员尽数屠杀，劫掠城市财富，数十年来未曾被外族征服的城市倒在了自己人的脚下，留下了数万具肿胀的浮尸。而对于长期积攒了不满和愤怒的北方军来说，则意味着他们终于占据了帝国的核心区域，他们的所作所为只是向首都的吸血虫讨回二十年来本应属于北方的东西。在士兵护送下逃出城市的皇储霍夫曼逃往南方地区在全国公布了安德烈所纵容的恶行，并宣布北方军叛国，这个凯林登营造了数十载的极权之国以令人惊叹的速度土崩瓦解，陷入到了混乱的深渊中，毫无疑问，支持两个皇储的派系已经开始在国内大打出手。"
 focus_krt.61.a: "支持南方！霍夫曼才是帝国正统！"
 focus_krt.61.b: "北方军万岁！安德烈将引领我们！"
 focus_krt.61.tt.1: "§B在内战中，你选择坚信自由和平等。§!"
 focus_krt.61.tt.2: "§R在内战中，你选择走向铁血和征服。§!"
 focus_krt.62.t: "噩梦"
 focus_krt.62.d: "马尔科露出了笑脸，他做到了，他下定决心看着自己扔出的那枚火球坠入了看不到的深渊，他很清楚自己究竟做了什么事情，最多几秒钟，或者几十秒钟，这枚火球就会带着绝望与愤怒接触到锅炉的核心部分，爆炸会破坏其内部不稳定的源石反应，然后极具冲击力的烈焰就能把这片天地灼烧成他想都不敢想的模样。\n他想到了自己被送入工厂再也没有出现的感染者妻子，想到了自己在荒野惨遭不幸的儿女。这辈子他别无所依，失去了所有能失去的，也做了许多难以想象的错事，他唯独不后悔扔下这枚火球，或许这终于能让他从长达几十年的噩梦中解脱了，或许天国之上的妻子能对他这番做法感到失望，亦或者数年之后他的名字会被刻在历史的耻辱柱上？不管怎么说这都不重要了。\n马尔科静静聆听着这台机器发出的剧烈咆哮。然后他看到了冲天的烈焰喷发而出，他所看到的整个世界随之天翻地覆，闪光和烈焰将他拥入怀中，在那道白光的尽头，逝去的妻子和儿女在向他招手微笑，现在愚昧和混沌的噩梦都散去了。他们终于在白光的尽头团圆，然后灵魂也一路升到了看不见的天上，在那里他们终于能幸福的生活在一起，免去泰拉上的喧闹以及无穷无尽的迫害，就连神主也不禁为他们洒下热泪，用天使般洁白的羽毛铺筑出一条看不到尽头的道路。\n然后，下一个噩梦在其他人的眼中才刚刚开始。"
 focus_krt.62.a: "看呐……那多像日光。"
 focus_krt.62.tt: "§R源石绽放出死亡红莲，总有一天它会将文明毁蚀殆尽。§!"
 focus_krt.63.t: "帝国叛乱"
 focus_krt.63.d: "克里斯安得知了今天皇子归来的消息，整个凯林登格勒的大街小巷都在讨论来自休伯特皇子的事迹，克里·羽和迈因领导的紧急议会已经宣布重新改组为全新的帝国政府，并坚决拥护休伯特陛下对整个科里亚特帝国的正当宣称，这让他整个人的表情相当难看...这个几年前离开帝国的混蛋怎么有资格来抢走他的位置？他发疯般的在自家别墅砸光了所有能砸的东西，然后独自诅咒着那个休伯特很快就会无力处理局势，进而导致全面崩溃。\n\n不过现在从西部到东部，整个科里亚特都在静静聆听来自凯林登格勒的演讲，休伯特陛下今天正式加冕，并且对外宣布帝国将一改凯林登时代的体制，这似乎意味着科里亚特持续多年的独裁统治将会结束，这位雄心勃勃的新君第一时间便得到了来自迈因近卫军团的效忠，他们纷纷表示绝对不会让君主失望的！道路两旁装点华丽的卫兵抽出军刀，人群欢呼，彩旗涌动，记者蜂拥而至，凯林登格勒作为临时加冕地点，帝国黑帜在城市上空缓缓升起，大科里亚特今天将迎来新的篇章！\n\n不过也不是所有人都对新君继位感到满意，不少地方的维尔德贵族和共和派叛军揭竿而起，他们以几个主要头目为首，不打算承认休伯特对帝国的继承权，希望维护来自凯林登时代的特权，他们声称所谓的紧急议会找回来的皇储只不过是篡权的阴谋罢了，那个没有任何建树的乡巴佬根本没资格继承皇位。\n\n“他们不打算承认朕的位置？”休伯特翘起嘴角，在加冕仪式完成后，走进了凯林登格勒的议事大厅，克里·羽面带微笑紧随其后，“是的，我的陛下，是时候让他们付出代价了。”少女随后拍了拍手，门外的几名军方参谋长跟迈因相继走了进来，作为凯林登格勒绝对效忠于科里亚特王朝的地方军，他们的作战能力绝对有所保证,在对叛军正式宣战前,现在只需要等待两种准备方案完成而已。\n\n休伯特微微思索，道："
 focus_krt.63.a: "“朕觉得克里·羽的外交计划不错，并按照迈因的方法办吧。”"
 focus_krt.63.tt: "§R不少原来支持我们的势力叛变了......§!"
 focus_krt.64.t: "内部肃清"
 focus_krt.64.d: "迈因过去的一些经历告诉他，最可怕的敌人并不在国外，而在国内，甚至就在这凯林登格勒的某个阴暗角落，随时准备在关键时刻咬断他们的脖子，饱尝鲜血，他不会坐以待毙在某个时刻才意识到这些叛徒的存在，对于这些威胁到科里亚特王朝的虫豸，是时候让他们意识到谁才是国家的主人了！到底谁才能代表人民！\n\n啪！大门被几名军官推开，被五花大绑压进来的是几个平日里张扬无比的凯林登格勒本地贵族，他们瞪大眼睛，看到迈因的一瞬间其中一个还在口齿不清的痛骂：“你找死！家族不会放过你的，我是凯林登陛下亲自册封的贵族，你们都会因为犯上作乱而被吊死！”\n\n迈因冷笑几声，挥了挥手，示意他的副手宣读罪状，眼前这几个酒囊饭袋很显然没意识到自己平时对紧急议会不屑的言论到底有多少落到了迈因的秘密探员手中，但当那些话都被法术复现出来时，他们全都露出了相当惊恐的眼神。\n\n扑哧，随着匕首落下，迈因轻松的走出了密室大门，无视了身后那些惨叫声和骇人的割肉声，他跟几个秘密探员简短的交流几句，名单上的最后一批不安定分子已经被圈出来了。"
 focus_krt.64.a: "抓起来，然后用尖锐的矛头捅穿那些密谋者的肚皮。"
 focus_krt.64.tt: "§Y维尔德贵族的势力被削弱了......§!"
 focus_krt.65.t: "斩首行动"
 focus_krt.65.d: "“为什么？为什么会这样？”克里斯安声音颤抖，几乎是赤身裸体的从卧室中冲了出来，手忙脚乱的关上了自己的房门，在外边。隶属于近卫军的人员已经冲入了别墅，他的保镖顷刻之间就沦为了弩弹下的一具尸体，而那些重装术士正在挨个房间搜查，展开了一场血腥的屠杀，很快别墅就被血腥的气息所完全沾满。\n\n他没有想过背叛皇帝！没有！克里斯安极其不甘，他只是私下与几个狐朋狗友谩骂了休伯特那个不知好歹的小子偏偏在这个时候回来，他做错什么了么？这些家伙就因为他说错了话就要致整个家族于死地？凯林登陛下绝不会允许他们这样做的。\n\n贱人！等他出去...一定要把那几个贱人全都吊死，还有迈因那个蠢货，真的以为休伯特那单纯到可笑的脑袋瓜能让他们几个免遭劫难，克里斯安冷笑着拿起了弩枪，往里面放置了沉重的铁丸，然后对准了大门，直到几名术士的火球爆炸，房间内木屑纷飞。\n\n“放下武器！”\n\n砰砰！在几轮激烈的对射后，房间终于重归寂静...凯林登格勒最大的守旧派贵族领袖自此彻底消失了，所有守旧派贵族的军队相继放下武器，宣布将向休伯特陛下效忠，几分钟后，迈因瞧着斩首部队的报告，满意的点了点头："
 focus_krt.65.a: "“很出色。”"
 focus_krt.65.tt: "§Y凯林登的守旧派领袖已经逝去，是时候收回凯林登格勒属于陛下的军队了！§!"
 focus_krt.66.t: "保卫局成立"
 focus_krt.66.d: "自维尔德·冯·辛斯在莱塔尼亚追随休伯特陛下在中陆旅行以来，他就见到了许许多多的奇闻异事，他常常为陛下的乐观精神所打动，并在潜移默化下也生起了对感染者和那些贫苦人的同情之心，感染者管理法案是泰拉各国的畸形产物，维尔德对此深信不疑，并相信休伯特可以打造出一个与众不同的西陆世界，这也是他毅然决然跟随陛下一同前往科里亚特的原因之一，他要在这里一直保护陛下，直到最后一刻。\n\n“你认为有必要在这之后再建立一支常备的秘密部队？”迈因坐在自己的办公室里饶有趣味的听着来自维尔德的建议，他希望迈因能与他通力协作，来担任帝国保卫局的第一任行动部长，这个提议对他而言实际上充满了诱惑力，因为迈因也深刻的感觉到了内务机构的能力到底多么有用。\n\n“正是如此。”维尔德如此承认，他接着简单陈述自己的想法，“莱塔尼亚有女皇之声，拉特兰有枢机和审判庭，炎国人有黑蓑部队，乌萨斯帝国也有负责渗透的内卫部队，事实一次次证明很多情况秘密部队都能提供很大的便利。科里亚特也应该有这样一支特务部队，既能对外也能对内，我建议将部分精锐的军方士兵纳入这个体系，然后再逐渐发展出专业的渗透特工。”\n\n迈因抬起头沉默片刻，他们就这个问题聊到了深夜，随后他给出了有趣的评价，如果保卫局能够在许多情况下避免发生意外，那它的建立就是有益的，这将成为皇帝的手与眼，为帝国保驾护航，这被维尔德称之为“科里亚特秘密之眼”。"
 focus_krt.66.a: "秘密之眼在凯林登格勒缓缓睁开。"
 focus_krt.67.t: "击碎枷锁"
 focus_krt.67.d: "长路漫漫走到了尽头，对凯林登格勒反对派的镇压和秘密肃清已经结束了，这些守旧派几乎无一幸存，城市刮起的腥风血雨于今天告终，这个过程虽然有点残酷血腥，但迈因还是精心监制了整个计划顺利完成。\n\n他目睹守旧派的惨死，就好像看到了凯林登一世精致的枷锁被一块块肢解投入干柴烈火，无疑这是令人鼓舞的进步，他相信自己不是在做一件错事，那些贵族骑在人民上太久太久，久到让他有时都忘记了自己也是出身于平民。\n\n上等公民，二等公民，感染者，到处都罗列了这种可笑的等级区分，就好像一些萨尔贡野蛮人做的那样，迈因微微思忖起来，当他们在帝国保卫局的尖矛利斧下化为尘埃，不知道他们还会不会想起当年同样残害过那些无辜的可怜人。\n\n想到这里，迈因大为畅快，将内心的罪恶感抛到了九霄云外，他甚至开始有点开始庆幸休伯特皇储还活着，让他有机会实践这些他曾经敢想不敢做的方案，接下来他将帮助陛下稳固后方，直到解决全国的叛乱前，帝国保卫局的全体都将效忠于唯一的陛下，干的好，所有真正为了帝国而战的勇士们。"
 focus_krt.67.a: "至少，我们不必再看到守旧派那些难看的老脸了。"
 focus_krt.67.tt: "§Y我们彻底控制了凯林登格勒，也就此掌控了国家的未来。§!"
 focus_krt.68.t: "外交再均衡"
 focus_krt.68.d: "所谓“眼镜蛇外交”意思是指萨尔贡眼镜蛇攻击前会谨慎的消除外部因素，再对猎物发动一次致命性的攻击，其取自这个含义，意味着克里·羽要为帝国先解决来自外部的危机。\n\n无疑，帝国目前有两个最为严峻的敌人，分别是北方的哥伦比亚，以及南方虎视眈眈的比勒陀利亚，大灾变后，虽然帝国的基本盘并没有太大动摇，但全国各行其是的叛军实际上已经把来自外国的压力无限放大了，如果不能解决来自外国的压力，很可能在镇压叛军的过程中会遭到来自外国的入侵。\n\n“只有这些了？”克里·羽翻阅着来自外交部长呈递上来的所有外交案本，她不由得眯了眯眼，对于北方的哥伦比亚，她相当清楚帝国当前与他们最大的矛盾就是边境地区的争议问题，如果能邀请他们重返边境谈判并做出相应的许诺，想必哥伦比亚忙于西部拓荒行动，至少不会在今年对科里亚特挑起战争。\n\n只要稳住了哥伦比亚人，来自北线的压力便能完全卸除，对于南方的萨尔贡人，帝国则可以充足的精力使用武力威胁，而反过来也是相同的情况，绝不能同时对付两个敌人。\n\n克里·羽拿定心思，虽然放弃这些地方的宣称对于帝国来说是一次失败，但克里·羽微微勾起嘴角，对外交部长语重心长道："
 focus_krt.68.a: "“我们将拉拢哥伦比亚，然后专注对付萨尔贡人。”"
 focus_krt.68.a.tt: "§Y我们将致力于对哥伦比亚寻求和解，国策哥伦比亚线可用。§!"
 give_in_to_colombia: "我们将外交重心转向了哥伦比亚"
 focus_krt.68.b: "“必须确保北方边境的安全，可以给萨尔贡人一些利益上的让步。”"
 focus_krt.68.b.tt: "§Y“必须确保北方边境的安全，可以给萨尔贡人一些利益上的让步。”§!"
 sargon_negotiate_again: "我们将外交重心转向了比勒陀利亚"
 focus_krt.69.t: "卸除南线压力"
 focus_krt.69.d: "克里·羽近几日都在大使馆，从凯林登格勒至比勒陀利亚的外交信使由她全权指派，那些萨尔贡人的使者也开始前来凯林登格勒集结，他们提出了一些明确的要求，如果想达成一份互不侵犯条约，除去科里亚特解除目前单方面的贸易禁运之外，还必须要在许多实际问题上让步，包括在边境设置商贸区，提供大量所谓的抵押金，乃至是一座工业城市的生产力。\n\n克里·羽微微皱眉，显然，这对科里亚特是一份不平等条约，这些贪婪多做怪的家伙真是不知好歹，帝国绝不可能接受更多条款，克里·羽颇觉无趣，丢开了萨尔贡人列出的长长列表，她直接朝着萨尔贡大使开口，声音冷冽："
 focus_krt.69.a: "“一年土邦的全部农业税，这是我们的底线。”"
 focus_krt.70.t: "资金换条约"
 focus_krt.70.d: "有趣，科里亚特帝国的外交部门最近向我们提供了一份条约，他们希望能与我们签订一份互不侵犯条约，为此可以用他们南方的一年赋税来换取，我们大概能够猜到这是为了什么，但我们确实没理由拒绝他们的提议，如果他们能够因此与哥伦比亚打个你死我活那就最好了不是么？"
 focus_krt.70.a: "很好，不错的交易。"
 focus_krt.71.t: "华雷兹-埃帕尔条约修正"
 focus_krt.71.d: "哥伦比亚边界长期以来都处于动荡不安的状态，两国的紧张对峙状态已经持续很久了，多次战争和埃帕尔-华雷兹条约的存在更是让两国关系低落至冰点，鉴于哥伦比亚强大的国力，帝国始终不敢对边界掉以轻心，有一支训练有素的北方军常年驻扎在边境地区。\n\n当克里羽领导的外交部门朝哥伦比亚提出签订互不侵犯条约时，实际上考虑到了两国的历史关系，于是主动提出废除埃帕尔-华雷兹条约的部分内容，当年条约签订时，凯林登陛下明确指出，任何哥伦比亚的商队都不能通过科里亚特领土，否则将被帝国无条件击毁扣押。\n\n克里羽决定在边境的贸易封锁上做出让步，如果修正案能顺利达成，帝国将会主动修建安全的贸易站并为哥伦比亚舰队提供补给，这无疑将大大减轻哥伦比亚对萨尔贡的贸易压力，他们的陆行舰商队将不必绕过科里亚特，穿过遥远的西陆荒野抵达南陆，而作为交换的只不过是一份简单的互不侵犯条约而已。\n\n当哥伦比亚大使满意的与克里羽签订了这份修正协定，这无疑是本赚钱买卖，两国的外交人员欢欣雀跃的站在一起，宣称这是西陆“友好和平”的新开始，一张照片记录了凯林登格勒壁垒前的景象。"
 focus_krt.71.a: "毫无疑问，我们化解了来自北方的敌人"
 focus_krt.72.t: "与科里亚特的贸易谈判"
 focus_krt.72.d: "昨日，我们与科里亚特帝国达成了一个外交修正案，他们打算就埃帕尔-华雷兹协议上规定上的边境封锁进行让步，并为我们的贸易陆行舰提供支持，我们没有任何理由拒绝这份提议，如果萨尔贡人能跟科里亚特佬厮杀到天昏地暗，我们就没有必要让我们的小伙子付出生命。"
 focus_krt.72.a: "甜美的外交胜利。"
 focus_krt.73.t: "外患暂平"
 focus_krt.73.d: "克里羽在办公室深深松了一口气，通过简单的外交运作，她将帝国成功从南北两线作战的窘境中打开了局面，现在只有一个方向需要面对来自外国的压力，帝国军队可以轻易的从漫长的边境线抽手，然后给予来犯之地狠狠一击，最重要的是，我们相信经过这番外交，至少在镇压叛军时不会四面受敌了。\n\n但这只是暂时的，帝国不会永远对那些无耻的敌人妥协退让，当休伯特陛下稳固政局，大科里亚特终将在废墟上重新崛起，萨尔贡人，哥伦比亚人只不过是伟大君王的垫脚石，克里羽的思绪逐渐飘远，她曾经看过来自草原的一本书，那些库兰塔人为梦魇可汗撰写的历史，当可汗的天途踏平了正片大地，那是如何一番令人惊叹的伟业？终有一天，休伯特陛下将化为天空翱翔的雄鹰，裹挟着她全部的期望，让科里亚特的黑帜永世不倒！\n\n接下来要做的很简单，召集军队，然后将那些不承认陛下冠冕的宵小之徒用帝国的装甲巨兽完全碾碎，这只不过是第一步，我们的所有军队都已经准备好了，而那些外国人不会有任何大胆的军事行动，克里羽脸上挂着淡淡的微笑，起身走出了办公室，她的军车最终消失在街角。"
 focus_krt.73.a: "能为陛下出一份心力，就是她最大的荣幸。"
 focus_krt.74.t: "大科里亚特荣光"
 focus_krt.74.d: "休伯特一世在众人的簇拥下登上凯林登格勒的最高处，检阅仪式正在进行，站在他身边的都是帝国最后的高级官员，克里羽，迈因，埃塞克斯，安德尔森...他们大多都是自己见过的，熟悉的面孔，而台下还有无数对他而言陌生的士兵，那些士兵对于他这位没有任何功绩乃至存在感的皇子并不感冒，他们同样对他感到陌生，只不过是出自对迈因将军的信任而站在广场上罢了。\n\n面对场下的士兵方阵，休伯特说不清楚自己是什么感受，但他从未如此真切地感到命运掌握在自己手中，他碰了碰自己的麦克风，面对众人沉默了足足有三分钟，当一丝不苟的士兵方队有些许唏嘘，克里羽还在略微担忧，陛下今天是不是身体不适或者临时出现了什么情况？\n\n突然，休伯特挥起双臂，抡圆了胳膊，用自己刺破天空的声音打破了场下的所有喧嚣：“伟大的祖国士兵们，我们的帝国再一次站在了历史的分叉路口，那些叛军宣称自己是国家的主人，他们发誓要将帝国的皇冠踩在脚下，然后把自己自私贪婪的本性施加到每个人头顶！”\n\n“在一切开始之前，我要为所有人道歉，我的父皇对所有人的残酷带来了几十年的阴沉，麻木，还有无穷无尽的苦难和僵硬死板的服从，现在我以神民的名义发誓，那些都已经过去了，我或许不能保证科里亚特成为西陆霸主，但我至少要让我所有治下的人民重归自由！”\n\n“我相信你们不想生活在暴君的统治之下，我绝不是像我父亲那样的暴君，凯林登的时代已经过去了，那个长生者终究被打入了历史的垃圾堆中独自腐朽，而现在忠诚于他，妄图颠覆人民意志的蛆虫也必将失败！”\n\n“大科里亚特属于每一个心向自由的人民！我绝不会弃你们不顾！那些旧时代的贵族没资格将他们的贪婪和无耻继续强加到你们头上！让帝国真正成为人民的帝国！消灭叛军！消灭独裁！消灭整个科里亚特积攒了几十年的恶臭肿瘤！前进！我伟大的士兵们！”\n\n刹那间，广场鸦雀无声，每个士兵的脸上都略微动容，一位皇帝在向他们道歉，在向他们承诺改革，他本不必做这些多余的事情，但当这位君主真的用富有感染力的声音说出这番话，整个凯林登格勒都被山呼海啸的“皇帝万岁”淹没了，大科里亚特从来未曾失去这种向心力,他们只是在凯林登的压制下沉默了太久太久了，每一个人都意识到了，这位小皇帝或许很厉害。"
 focus_krt.74.a: "前进！为了皇帝陛下，拯救全科里亚特！拯救人民的未来！"
 focus_krt.74.a.tt: "§Y人们团结在了休伯特一世的号召下，派系斗争已经不是问题了。§!"
 focus_krt.75.t: "北方荼毒"
 focus_krt.75.d: "凯林登格勒也沉浸在大灾变的悲伤中，城市上飘扬的旗帜降下了一半的高度，街头巷尾匆匆走过的人耷拉着头颅，不想惹上任何不必要的麻烦，人们用麻木的心态对待生活，仿佛这个死气沉沉的社会已经跟着逝去的首都一起沉入了肮脏的泥沼。没人怀有希望，正所谓先帝凯林登和新皇之间也不会有什么大区别，这是绝大多数人在大灾变发生后的切实想法。\n\n但总要有人继续支撑摇摇欲坠的国家，在启程出发前往北方之前，克里·羽有些心神不宁，她先是问了一下其他贵族军官对这件事的看法，也就是该如何会见北方的那两头暴躁棕熊，然后劝说他们重新回归帝国这件事。考虑到维尔德贵族的交际圈相当广泛，与北方军有关系的贵族也不在少数。\n\n其他军官均对此表示同情，前往北方是一件苦闷的差事，没准就会碰到什么意外，就算没有意外也很可能一无所获。他们希望克里·羽最好不要从军事的角度上威胁那两个北方汉子，相信没有多少将军会愿意听威胁的。于是克里·羽记下了这些，在前往北方的几天内，交涉主要围绕着紧急议会先前赦免北方军绝大多数军官的内容，除了直接进攻首都造成大灾变的罪魁祸首意外，其他北方军士兵都不会被追究。\n\n帝国要求北方立刻停战的要求被回绝了，原因无他，约瑟夫·赫尔贝格在北方的长达几个月战争中已经取得了优势，他的军队已经直抵城下，准备将整个北方纳入自己的麾下，而他的傲慢最终让紧急议会先前和现在的谈判成为了一张毫无用处的纸张，努力化为泡影，克里·羽失望的回到了凯林登格勒，她带来了一个简单的信息。\n\n“那是一场叛乱，约瑟夫的要求是索取皇位，他痴心妄想取代安德烈成为帝国的最高统帅。”\n\n克里·羽说完，贵族议会随即响起一片嘘声，猪皮也想蒙上牛油，妄想索取皇冠的傲慢只会把约瑟夫送入地狱。来自北方的战争不远了，在简单的交涉阶段结束后，这成为了帝国高层的共识。"
 focus_krt.75.a: "为休伯特陛下而战！"
 focus_krt.76.t: "母亲河的帷幕"
 focus_krt.76.d: "400名精锐的科里亚特士兵身穿北方军的制服，悄悄展开渗透行动，他们在右臂上戴了鲜艳的红色袖标以方便辨识敌友，一个月来的战斗让他们缴获了不少这种东西，奥德拉上校带领这批突击队悄悄沿着河岸乘坐皮划艇过渡到河岸对面，所有士兵均轻装噤声，上校谨慎的看了几眼浩瀚的夜空，进攻的时间快到了，夜色的帷幕如同温柔的轻语。\n\n突然，河岸对面炸出一缕耀眼的白光，敌人的术士向天空射出了预警信号！他们察觉到渡河行动了！\n\n“冲！冲！冲！”皮划艇一靠岸，奥德拉就大声嘶吼咆哮着，几百名队员手忙脚乱拿着自己的步枪和武器冲下渡河，然后举枪朝着黑夜中可疑的任何目标射击，子弹在冰冷的黑夜中划过令人心寒的锐响，他一马当先用冲锋枪扫倒了芦苇地里的两个敌人，然后一头扎进了深邃的夜。\n\n几分钟后，河对岸冒出一缕星火，然后是无比剧烈的爆炸，先遣突击队成功炸毁了北方军这个方向上的炮击阵地，随后帝国军队的全面进攻开始。\n\n“科里亚特万岁！帝国万岁！”整个河面上都铺满了各式皮筏，士兵用力划桨直到靠岸，迎接匆忙赶到的北方军部队的是来自对岸的火炮打击和凶猛的机枪扫射，不乏多时，一面迎风招展的黑色军旗立在了对岸。\n\n“成功了！”总参谋部内，随着传令官激动的推开房间大门，整个沉闷压抑的指挥所才有了好转的迹象，阿廖沙松了口气，这场战役已经毫无悬念了。所有为这次行动付出努力的士兵都应该得到帝国颁发的利剑勋章！"
 focus_krt.76.a: "这是属于他们的荣耀。"
 focus_krt.77.t: "重夺北方"
 focus_krt.77.d: "本杰明·安东尼奥注视着空气中不知名的位置，他若有所思的看着眼前的克里·羽，这个女人自称代表皇帝，但他没有看出这个平平无奇的检察官到底秉持着何种态度，孤星共和国不希望成为科里亚特的敌人，同时也不希望在新皇登基后他的人民像是垃圾一样被对待。因此他提出了简单的要求，那就是孤星共和国依然要保持帝国政治经济特区的位置，不能被皇帝的意志随便干涉，这样他们才能获得孤星共和国的忠诚。\n\n另外，对于北方军的态度，安东尼奥的想法也是相同的，他十分不想看到第二个安德烈出现在北方，将这里单纯作为一个驻扎的军事区和产粮地，长期以来他们都为了祖国的北方边疆付出了太多。\n\n“帝国当然会尊重朋友的看法，凯林登陛下对孤星共和国保留的政策都会一如既往，这次叛乱的所有责任都在北方军的某些将领上，你们不会被追究损失的责任。”克里·羽将听完他的想法后，如此好言安慰，这算是让安东尼奥松了口气。\n\n“另外，根据陛下的想法，北方军将会迎来重组，当然具体安排还有待议会和皇帝共同磋商，帝国政府会尽快安排妥当，在这段时间里我希望北方能保持稳定，因此中央军区会暂且接管北方的防务，这一点希望你理解。”\n\n安东尼奥点头默认，他抿了抿干裂的嘴唇，“我对此毫无看法，我们关心的是北方军的统帅问题。”\n\n“孤星共和国长久以来为帝国的稳定做出了巨大牺牲，我们这些年在哥伦比亚战争的死伤有目共睹，现在我们希望能在帝国中有发声的权力，帝国北方军应该有我们的一席之地。”\n\n克里·羽听出了安东尼奥的弦外之音，他居然想要攫取北方军统帅的位置，她心下暗暗吃惊，这件事不是她能左右的，因此她只能打起马虎眼，表明自己会向皇帝提到这件事，于是安东尼奥才稍稍缓和下来。\n\n“现在只有一个问题了，对安德烈余党的处置。”安东尼奥盯着克里·羽的眼睛，意味深长的笑了笑。\n\n克里·羽陷入了深思，一方面她不想留下任何北方军残党作为隐患，但她同样不希望违背休伯特的意愿，在两难的抉择中，安东尼奥听到了这样的回答。"
 focus_krt.77.a: "“所有与安德烈有所牵扯的贵族和党羽一旦查实，都会被从重处置。”"
 focus_krt.77.a.tt: "科里亚特将会更加§R极权化§!......"
 focus_krt.77.b: "“我们不会做的太过火，希望您能理解，他们也是我们的同胞。”"
 focus_krt.77.b.tt: "科里亚特将会更加§C包容化§!......"
 focus_krt.78.t: "一根绞索"
 focus_krt.78.d: "新皇的清算到来了，每个与安德烈有关系的党羽都逃不掉，政治风貌，家庭背景，乃至私下关系都被秘密调查局考虑在内，然后在投降的军队中展开了内肃，这些全程都是秘密执行的，死去的人将会对外宣称是死于平叛战火，当人也不会有人知道真相，他们本人都会跟档案永远烂在一起。/n/n阿列克谢·斯图科夫被宪兵反绑双臂，带到了一个昏暗无光的小房间面前，眼前的绞索是那样刺眼，深深震撼了他的心灵，他不知道自己犯了什么罪，反抗皇帝？还是背叛人民？他只是做了自己该做的事，反抗约瑟夫企图颠覆新皇的阴谋，他为什么会落到这个下场？到底是为什么？/n/n“我要见陛下！这不是真的！绝对是有人要陷害我！我是北方军的阿列克谢·斯图科夫！是帝国上将！你们不能...！”他汗津津的吼道，希望有人能听到，然后赶紧来制止这荒谬绝伦的事情，他只是想让帝国更好，让北方军就此强大，让哥伦比亚人和所有科里亚特的敌人都付出代价！这也有错？/n/n“老实点！”宪兵狠狠的用铁棍殴打在他的额头上，鲜红的血迹滚滚流下，他绝望的看着那两个宪兵将他强制吊起，直到他的呼吸被这可怕的绳索所阻断。一切仿佛都在那一瞬间结束了，他两眼暴突，艰难的想要让自己正在枯死的肺部呼吸到一丁点的空气，同时死死盯着那个监督执行的审判官，帝国调查局的走狗就他妈不能给他一个痛快吗？/n/n作为军人，他宁愿收获一枚枪子儿，也不愿意被声名狼藉的吊死在无人问津的垃圾堆里腐烂。\n\n这个审判官是一个十分黑色幽默的家伙，有一点点心理变态的倾向，他十分享受捏碎别人希望和看到别人绝望时的样子，于是文质彬彬的拿出了一本小册子，“我们在你的家里搜到了支持安德烈的证据，这些...嗯，亲密合作的倾向十分明显，我们担心你会和对皇室不满的军国派有联系，这是你为什么会被挂在这儿，不过别担心。你的尸体不会被展现给你的家人，甚至对你的家人还会有所优待。”\n\n“这是克里·羽最后的怜悯，好好享受吧。”他说出了这个女人的名字，然后在那一瞬间，这个当地的神经病审判官意识到了什么，突然恐惧的瞪大眼睛，他犯下了可怕的错误，那几个阴森森的调查局宪兵回过头冷冷一笑，盯着这个管不住嘴的东西，他们从今以后又有新的秘密小乐子了。\n\n几分钟后...房间里悬挂着两具尸体，一具是阿列克谢的，另一具是审判官的。"
 focus_krt.78.a: "老兵不死，只是挂在绞索上。"
 focus_krt.79.t: "新路"
 focus_krt.79.d: "“恭喜您，上将先生，现在你自由了，皇帝陛下以后会很高兴在首都见到您，然后听一听您对哥伦比亚军队的见解，不过现在显然不是时候，北方还需要您这样经验老道的人来坐镇。”\n\n阿列克谢盯着眼前这几个人，从鼻子里冒出一声不屑至极的冷嗤，他为帝国出生入死不是为了听这种蠢蛋在这里恭维了，他想知道，自己未来能不能好好在北方军里带领兄弟们继续作战，随时给哥伦比亚佬沉痛一击，在这个过程中他不想继续跟像是安德烈或者约瑟夫那样的家伙撕扯了。\n\n他微弱的动了动嘴，“北方军的重组会如何进行？”\n\n几个官员的表情仍然没变，他们笑眯眯的，给人一种极度的不安和虚伪。\n\n“这不是你应该关心的事情。”那个领头人的语气稍稍冷漠下来，“新皇和议会肯定会有他们的决定。”\n\n“那么...有关于军队的建设...”上将还想说些什么，但当他看见这个房间内的人明显表情不悦时还是住嘴了，他不想继续惹祸上身，北方军已经是新皇手里肆意拿捏的玩偶。\n\n“好吧。”他转而松了口气，然后也跟着露出了轻松的神态，“我将效忠休伯特陛下，直到永远。”\n\n“很好，希望你记住今天的誓言，抛弃安德烈那个蠢货的任何观点。”那两个来自凯林登格勒的官员站起身，说完与他握了握手。"
 focus_krt.79.a: "到此为止，北方军不该继续流血了。"
 focus_krt.79.a.ttt: "获得§Y三个§!由§Y12个常规步兵营§!组成的§Y训练有素§!的§Y步兵师§!"
 focus_krt.79.a.tt: "§Y科里亚特军国派管理已经启用......§!"

#交互事件
 international_krt.1: "斩击行动"
 international_krt.1.t: "斩击行动"
 international_krt.1.d: "真令人惊讶，我们在孤星共和国与华雷兹-埃帕尔边境的侦察兵探查到了有趣的情报，似乎科里亚特帝国的内部出现了问题，根据返回侦察兵的口述，从中央-核心城方向升腾起了一朵恐怖的蘑菇云，驻扎在边界的几艘敌军陆行舰也已经全部消失了，尤其是令人恐惧的凯林登号。\n\n虽然暂时不清楚具体情况，总参谋部仍然做出了分析，敌人的绝大多数兵力可能都调回了内陆，既然敌人的内部出现了问题，我们可以重新计划，调动军队在南方发动一次当机立断的袭击，撕毁条约并趁着这个机会狠狠对打击敌人的有生力量！\n\n问题来了，这是一次军事冒险，我们不一定能成功，也很可能因此与科里亚特彻底交恶，但我们毕竟从未信任过这个不友善的邻居，不是么？"
 international_krt.1.a: "很好，我们的小伙子该行动起来！"
 international_krt.1.b: "我们对科里亚特内部的情况不明，应该从长计议。"
 international_krt.2: "来自北方的坏消息"
 international_krt.2.t: "来自北方的坏消息"
 international_krt.2.d: "尊敬的中央-核心城敬启。\n\n我们的北方边境传来了坏消息！哥伦比亚既没有宣战也没有照会就对边境发起了声势浩大的突然袭击，敌军的陆行舰伴随着近卫士兵和大量火炮跨越了先前《埃帕尔-华雷兹协议》规定的两国边界，现在边境战火再燃，北方军的士兵们全都无比愤怒，我们绝不能容忍这种伤害伟大祖国的卑鄙行径，无需首都指示，北方军的每一个人都会拿起武器，痛击哥伦比亚佬！\n\n祖国万岁！用我们的鲜血染红科里亚特黑旗！——北方军宣言。"
 international_krt.2.a: "这群背信弃义的狗杂种，我们就不该信任他们！"
 international_krt.2.b: "我们必须全力支援北方！"
 international_krt.3: "北方败局"
 international_krt.3.t: "北方败局"
 international_krt.3.d: "真糟糕，尽管我们的军队已经在北方绞尽脑汁抵御敌军的推进，但很显然羸弱的北方军已经没有足够的力量继续抵抗下去了，随着近卫师整支整支被歼灭，敌军陆行舰已经登上了我们的广袤领土，哥伦比亚的狗杂种趁机长驱直入，北方军通讯传来的最后一个消息是他们正在攻击并劫掠埃帕尔地区，而阿列克谢将军正在指挥他的陆行舰发起猛烈反击，但是当他们最终夺回城市，那里只剩下残破的败土，大量的设备都被抢掠一空。\n\n阿列克谢的落款只有短短一行字——愿帝国武运昌隆。"
 international_krt.3.a: "该死！"
 international_krt.4: "北方军凯旋"
 international_krt.4.t: "北方军凯旋"
 international_krt.4.d: "我们勇猛的将士发挥了自己强大的战斗力，尽管在政变过后北方军的整体实力已经相当衰微，但他们仍然在哥伦比亚人的突击中稳固了防线，甚至在混战中还有相当多的小分队可以发起反冲锋，在你来我往将近三周的边境绞杀战后，哥伦比亚人终究是畏惧来自我军的大口径重炮选择了撤退，战场上只丢下了毫无意义的几千具遗弃的尸体。\n\n向北方军致敬！大科里亚特万岁！"
 international_krt.4.a: "哼，希望他们这次能得到教训。"
 international_krt.5: "行动顺利进行"
 international_krt.5.t: "行动顺利进行"
 international_krt.5.d: "我们的计划十分顺利，随着联邦军队快速开入敌军边境，我们得以在边境完全展开，在小规模的几次冲突下，我们的渗透部队成功潜入华雷兹-埃帕尔并攻破了他们的隔离壁垒，他们所谓的北方军就如同不会动弹的死鸭子被我们玩弄于股掌之间。伴随着越来越多的陆行舰支援前线，我们可以想象得到他们绝望的眼神。\n\n现在，斩击行动大获全胜，我们狠狠的在埃帕尔-华雷兹地区给了科里亚特人一记重拳，随着大量的工业设备被带回国内，这有助于边境省份的地区发展，我们的人民全都展开了为期一周的庆祝活动，联邦万岁！为哥伦比亚奉上至高忠诚！"
 international_krt.5.a: "不出所料。"
 international_krt.6: "边境战争失利"
 international_krt.6.t: "边境战争失利"
 international_krt.6.d: "斩击行动遭遇了意外之中的抵抗，似乎敌人的北方军早有准备，我们的渗透部队在行动初期就被相继发现并逮捕，敌人移动城市中进入了为期一周的戒严状态，陆军的小规模交火已经展开，我们已经下令陆行舰提供支援。但对方同样也能借助要塞城市的优势在高地进行防御。\n\n战斗持续了一段时间，但随着局面僵持下来，越来越多的阵亡士兵带来了国内的抗议和游行示威，虽然我们有把握靠着源源不断地后续支援击败科里亚特，但碍于国内的舆论，我们不得不终止了斩击行动的后续手段。"
 international_krt.6.a: "早就知道这是个错误！"
 international_krt.7: "来自科里亚特的机会"
 international_krt.7.t: "来自科里亚特的机会"
 international_krt.7.d: "根据我们在科里亚特境内安插的密探报告，我们这个不太友善的邻居最近发生了一场令人惊讶的灾难，从尚且混乱的情报中我们可以确定，他们的首都最近经历经历了一次武装政变，我们或许可以趁着科里亚特政局不稳之际夺取两国边界的争议地区。\n\n我们可以在秘密准备后发起一次突然袭击，相信我们英勇的士兵可以在此时取得胜利，但要小心，科里亚特边防军仍然能予以回击，如果我们一无所获，那国民很可能会失去对我们的信任，但如果放弃这次机会，军方很可能会相当失望。"
 international_krt.7.a: "千载难逢，科里亚特佬在自相残杀！准备干涉！"
 international_krt.7.b: "搁置这个提议。"
 international_krt.8: "玻利瓦尔军队边境挑衅！"
 international_krt.8.t: "玻利瓦尔军队边境挑衅！"
 international_krt.8.d: "我们的西部边境传来了坏消息，玻利瓦尔声称对方商团在我国境内遭到绣锤暴徒袭击，要求军队进入并进行“贸易保护”，在收到国防军的严厉拒绝后悍然发起了突袭，目前潮水般的玻利瓦尔士兵正在沿着边界线不断增援，圣马丁辖区正在进行初步战争动员。号召人民起来保卫家乡，我们必须守护好祖国的西部领土！"
 international_krt.8.a: "火炮上膛！全弹发射！"
 international_krt.8.b: "还不够！大炮！把所有大炮都他妈拉过去！"
 international_krt.9: "圣马丁沦陷！"
 international_krt.9.t: "圣马丁沦陷！"
 international_krt.9.d: "真令人遗憾，尽管我们的西部重镇面对玻利瓦尔的突然袭击做出了相当程度的反应，但最终还是以失败告终，狡诈的敌人提前判断出了移动城市的机动方向，三艘陆行炮舰提前堵住了缺口并用几轮齐射瘫痪了城市的动力系统，伴随着大量的集群步兵开始轰击主壁垒，城市守军自知无望选择投降，这导致我们后续的援军也没有必要继续前往广袤空虚的西部原野了。"
 international_krt.9.a: "我们失去了最重要的工业枢纽。"
 international_krt.10: "西部战线的胜利"
 international_krt.10.t: "西部战线的胜利"
 international_krt.10.d: "毫无悬念，我们赢得了西部战争的胜利并守住了帝国重要的工业重镇，在毫无防备的移动城市遭遇袭击时，当地总督当机立断下令放弃一部分城区并迁移主核心城，及时撑到了我们的援军抵达，大量全副武装的火炮师给予了玻利瓦尔人迎头痛击，并夺回了全部失去的移动城市模块，帝国陆军要让所有胆敢质疑祖国实力的虫豸付出代价。"
 international_krt.10.a: "至少，工业区安全了。"
 international_krt.11: "偷袭成功"
 international_krt.11.t: "偷袭成功"
 international_krt.11.d: "今日黎明，在科里亚特境内传来了好消息，我们的军队长驱直入并攻陷了其西部最重要的工业城市，这能给我们带来难以想象的利益，实际上，这次行动过于顺利轻松，以至于军方许多将领都怀疑科里亚特实际上处于外强中干的状态，要不是一些理智的军官主导了局面，恐怕全面宣战的提议已经要出现在桌子上了。"
 international_krt.11.a: "我们要随时保持警惕"
 international_krt.12: "遭遇迎头痛击"
 international_krt.12.t: "遭遇迎头痛击"
 international_krt.12.d: "偷袭计划被证明是一个低级的错误，我们的军队早就被科里亚特密探监视到了，在军队跨过边境的同时，他们的移动城市就开始着手布置防御，随着我们的陆行舰扑了个空，战斗已经不可能迅速结束，大量科里亚特军队从四面八方支援而来，我们被迫放弃了寥寥几个沉重的工业模块，只能匆忙退回国境，可以称得上一无所获。"
 international_krt.12.a: "唉！"
 international_krt.13: "大胆的军事冒险？"
 international_krt.13.t: "大胆的军事冒险？"
 international_krt.13.d: "真有趣，我们在临近的土邦和荒野旅团得到了来自科里亚特的最新情况，似乎他们的首都刚刚经历了一场残酷的源石锅炉爆炸，强大的冲击波几乎消灭了整座城市，这场被科里亚特人称为大灾变的事件破坏力不亚于天灾降临，现在一些科里亚特南部不满于凯林登残酷统治的萨尔贡人秘密联系了我们，声称他们可以为我们提供科里亚特移动城市的具体位置。\n\n我们可以抓住这个机会再度发动袭击，虽然与科里亚特全面开战不是一个好主意，但可以用一些小手段来在科里亚特的南方地区取得一些优势，搬空他们位于南方的工业，军队已经准备好了，我们的指挥官对此信心满满，现在我们该如何决定？"
 international_krt.13.a: "撕毁和约，让科里亚特付出代价！"
 international_krt.13.b: "胡闹！我们承担不了全面战争的风险。"
 international_krt.14: "萨尔贡佬又回来了"
 international_krt.14.t: "萨尔贡佬又回来了"
 international_krt.14.d: "尊敬的紧急议会敬启。\n\n虽然很不愿意承认，但是我们南方的邻居于昨日撕毁了与我们的和平协定，他们的近卫部队开始批量跨国边境，萨尔贡的装甲巨兽正在横扫那些弱小的南方土邦，一部分吃里爬外的萨尔贡佬也背叛了我们，这导致我们的南方防线几乎是一瞬间便溃不成军。\n\n尽管南方地区在大灾变后处于一种各自为战的无指挥状态，但我们还是希望他们能尽可能守护住每一寸土地。"
 international_krt.14.a: "他们又怎么敢……！"
 international_krt.14.b: "够了！什么男的女的老人还是牲口？全都拉过去！"
 international_krt.15: "南方创痕"
 international_krt.15.t: "南方创痕"
 international_krt.15.d: "沉痛无比的消息从南方逃回来的皮洛萨人那里传来，他们战战兢兢的说出了糟糕的结果，土邦酋长们抵抗萨尔贡人的行动已经失败了，战斗持续了漫长无比的一周，尽管当地军队尽力依靠移动城市及其附近地区占据了有利地形，但是比勒陀利亚军队朝着城市主壁垒展开了不计损失的人海突击，成功掩护巨型工程桥架设到了城市壁垒上。\n\n守军曾试图修补被轰塌的壁垒，但他们还是淹没在了无数个声势浩大的“萨尔贡万岁”之下，越来越多的萨尔贡火炮加入战斗，成为了压垮帝国防线的最后一根稻草，我们在南方的惨败已经无可挽回，随着移动城市沦陷已成定局，当地专员巴尔特马尔在城市沦陷后丢掉了自己的职责，让不计其数的祖国财富流入南方..."
 international_krt.15.a: "祖国沉痛的一天。"
 international_krt.16: "皮洛萨人的胜利"
 international_krt.16.t: "皮洛萨人的胜利"
 international_krt.16.d: "万岁！从南方传来了令人振奋的好消息，在我们忠诚的专员巴尔特马尔的带领下，萨尔贡佬不知好歹的进攻已经被完全粉碎，我们的火炮轰鸣声响彻边境，用不间断的连续轰炸为步兵打开了防御局面，随着皮洛萨人悍勇的近卫阵线打穿了敌军羸弱不堪的防线，萨尔贡人溃不成军灰溜溜的滚回了他们的老家，这场边境战争终究再次以帝国的胜利告终。\n\n酣！畅！淋！漓！——巴尔特马尔在战报上笔记凌乱的落款。"
 international_krt.16.a: "为我们英勇的盟友欢呼！"
 international_krt.17: "大获全胜"
 international_krt.17.t: "大获全胜"
 international_krt.17.d: "真令人难以相信，情报可能完全低估了大灾变对科里亚特佬的影响，他们的动员速度简直如同古旧老板的破钟表同样缓慢，我们的军队几乎没有受到像样的抵抗就突破了上一次战争中无法突破的边境，像是一脚踹在了吱吱嘎嘎的破门轴上。\n\n我们的军队迅速在火炮的掩护下推进到了皮洛萨人的城市，在长达一周的轮番重炮轰炸和集群冲锋中，前线最新消息表明祖国的军队已经攻陷了敌军的边境聚集点，大片原本属于我们的领土已经被夺回，虽然我们不可能长期占据这里，但我们还是扫荡了不计其数的武器装备和战略资源，皮洛萨人只能对我们俯首称臣，现在只有一个词能形容我们的军事行动——大获成功！"
 international_krt.17.a: "祖国万岁！"
 international_krt.18: "突击行动失败"
 international_krt.18.t: "突击行动失败"
 international_krt.18.d: "虽然不得不承认，但是科里亚特军队的战力仍然超乎了我们的想象，原本以为战争会在短短几小时内结束，但是边境冲突很快变成了大规模的短兵相接，最终在我们的行动迟缓中演变为了全面的地区战争，科里亚特数百个南方土邦迅速动员，大量的火炮给我们的士兵带来了难以接受的损失，战斗的第一天就有上千名士兵伤亡，这都证明这次不成功的突袭是一次难以挽回的错误，沉重打击了军队的士气。\n\n在无望的偷袭持续一周后，我们只能在皮洛萨人的压力下被迫撤退，虽然这次不成功的军事试探没能给科里亚特佬狠狠一记下马威，但我们至少明白了一件事，在我国足够强大之前，最好不要轻易招惹科里亚特这头雄狮。"
 international_krt.18.a: "可恶！"

#1094决议相关文本
 KRT_1094: "1094决议"
 KRT_1094_desc: ""
 KRT_1094_decision_tt1: "在哥伦比亚战争期间，我国工业生产之匮乏，军队后勤能力的欠缺都是显而易见的，落后的基建设施也很难满足战争的需求。如果要彻底弥补这一缺陷，以应对未来可能爆发的全面冲突，就势必要对国内的陈旧制造业进行升级。皇帝陛下所提出的§B“圣骏堡工业区”§!是帝国近三年来最重要的工业项目，它旨在整合首都的旧工业区，并将数个工业区划链接起来，过去手工作坊的低效形式将被彻底消灭。然而令人沮丧的是我们对项目的前期准备并不够充足，包括§R帝国重工、亚索伯集团、萨尔德电子、帕尔克重工§!等多家企业都需要时间筹备材料和工业计划。\n帝国议会近期通过了1094决议，在皇帝的要求下重新规划了全年的国家预算，为了按时实现圣骏堡工业区的伟大工业计划，科里亚特必须全力以赴，全国范围内的动员已经开始，所有资源都要优先用于首都的发展事业，凯林登陛下誓要将中央-核心成打造成令西陆乃至全泰拉世界为之震撼的工业巨城，这一目标自20年前延续至今，而这个项目也必将反过来造福全国，前进！科里亚特的伟大青年们，为了更美好的帝国奉献自身的一份心力！"
 KRT_1094_decision_tt2: "§R决议规则§!：要完成1094决议项目需要在全国范围内筹集资金并征召人力投入到工业区的修建中，一方面需要保证工业区的§R建设进度§!，另一方面需要保证§R初始运作资金到位§!，缺少任何一方面的因素都无法令工业计划顺利结束。而时间拖得越久，我们的计划就越可能遭遇意料之外的困难……一旦超出预算额度，这样巨大的投资漏洞很可能导致我们脆弱的经济发生一场§R无可挽回的雪崩。§!"
