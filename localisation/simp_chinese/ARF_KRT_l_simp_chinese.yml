l_simp_chinese:

#国家领导人（似乎基本都是废稿？但是有新的还是写上去，旧的也保留）
 KRT_Kori_Yu: "克里·羽"
 KRT_Kori_Yu_desc: "克里·羽无疑是一位超一流的政治家。岁月与封藏未能磨钝她的棱角，一个契机便可展露她的锋芒。\n\n对帝国而言，大灾变是不幸的；但对于克里·羽而言，大灾变是一个千载难逢的机会。没人能想到这位名不见经传的少数派领袖竟会如此的雷令风行——旧政府崩淡的一瞬间，她便以雷霆之势掰倒了几乎所有的对手；一场又一场的周旋，一个又一个的计谋——当紧急政府成立时，她已成为无可争辩的保皇党领袖。\n\n“我不会谋权基位，我只忠诚于帝国最伟大的皇帝。”克里·羽如此回答那些怂恿她反叛的人。作为休伯特一世最忠诚的拥护者之一，克里·羽在其上台前就为休伯特一世清除了绝大多数障碍：清洗保皇党、压制旁系王宝室、重建政府机构、镇压共产主义者与共和派……当新皇继位时，经过克里·羽处理“大灾变”已经是强弩之末。\n\n与一般的政客不同，克里·羽最先考虑到的永远是皇帝的目标与利益。她了解这位无威之君，她亦深知陛下改革社会的理想——哪怕那是她所支持的旧时秩序,她也不会有半句怨言。\n\n“陛下缺少威信，我来塑造；陛下缺少根基,我来扎实。我不是没有主见的小丑，我只是为我所效忠的人而奋斗；我生而为陛下的侍从,如果可以，我希望能成为陛下的挚友。”克里·羽在她就任帝国首相的发言中如此说道。"
 KRT_Krrat_Verd_Kellyndon: "科里亚特·维尔德·凯林登一世"
 KRT_Krrat_Verd_Kellyndon_desc: "大科里亚特帝国的开国皇帝，至今在位70余年。在他的英明的领导下，科里亚特一度繁荣并在复杂多变的国际环境下站稳了脚跟。\n\n但如今久别沙场的老皇帝早已不复巅峰，凯林登一世对朝野上下的掌控力越发衰弱————无论繁荣还是死亡，它们往往就在一念之间......"
 KRT_Krrat_Verd_Hubery_II: "科里亚特·维尔德·休伯特一世"
 KRT_Krrat_Verd_Hubery_II_desc: "用“无威之君”一次来形容这为漂泊在外的王储毫不为过。\n\n休伯特幼时就与底层的人民以及感染者有过相当频繁的交集。在人民对政令的一次又一次的抱怨声中，感染者在铁骑下一声又一声的哀嚎中，本质善良的休伯特渐渐成为一个贵族阶层的同情者：他希望农民们能够拥有更幸福的生活，他希望人们能够接受感染者，实现真正的平等....\n\n宫廷内的明争暗斗让这位年轻的王子早早地离开了他生活的帝国，前往那些他所向往的神秘的国度。\n\n令人沮丧的是,不同于帝国那被贵族精心粉饰过的世界，其他国家的底层人民水深火热的生活更是深深震撼了涉世未深的休伯特。\n\n他抛弃了贵族的身份,而他的祖国也似乎遗忘了他。身处海外的他为了求生曾干过无数的工作：打字员、作家、雇佣兵、甚至是黑帮成员。数不清的试炼造就了这位论才华，休伯特毫不逊色于他的那些哥哥们；论计谋，休伯特早已是遥遥领先。\n\n“为什么要这么对他们？他们只是生病了啊！”\n\n休伯特从来没有忘记儿时对父皇说的那句天真无比的话—————因为那便是他愿为之奋斗一生的梦想：创造一个没有所谓偏见，没有歧视，没有是非感染者之分的，真正平等的世界。"
 KRT_Nobady: "大灾变"
 KRT_Nobady_desc: "§R都结束了？§!"
 KRT_emergency_meeting: "紧急会议"
 KRT_emergency_meeting_desc: "“大灾变”毁灭了一切：和平，稳定，秩序与枝繁叶茂的科里亚特王朝。灯火辉煌的宫殿陷入了黑暗，昔日平和的祖国父亲也发出叹息。皇帝驾崩，皇储伏法，王子丧命,政府崩溃！帝国曾经见证过辉煌，但现在的帝国已然是群龙无首，行将就木。\n\n国不可一日无君，家不可一日无主。一时间，群雄并起————野心家、共和派、革命者、旁系亲王......各方势力都想要将这顶看似唾手可得的王冠收入囊中，争霸帝国。\n\n终于,在从战乱中幸存的皇家卫队与中央驻军的帮助下,仍忠于科里亚特王朝的保皇党们艰难地夺回了首都的核心区域，紧急会议也由此召开。\n\n尽管参会人员鱼龙混杂，但他们的确是求同存异的————拯救摇摇欲坠的帝国，寻找流落在外的“最后的皇储”。"
 KRT_North_Army: "北方军总参谋部"
 KRT_North_Army_desc: ""

