 decision_1094_krt.1: "帝国经济危局"
 decision_1094_krt.1.t: "帝国经济危局"
 decision_1094_krt.1.d: "“还有多少面包和牛奶？”这句话成为了科里亚特人在1094年末说的最多的一句话。听起来真是糟糕，那意味着我们的经济已经完蛋了。\n繁重而漫长的修筑工作彻底拖垮了帝国，在首都的计划似乎成为了无底洞吞噬我们本就不富裕的国库。市场物价飙升，生活质量飞速下降，商店被抢购一空，政府的大门前排满了等待领取救济物资的长队，而工厂主和企业家们则在人民的怒视中扬长而去。银行资金链断裂则导致了一场前所未有的大灾难，工厂倒闭，企业关门，现在祖国各地都是一片萧态的景象，难以想象要从这样的糟糕形势下恢复过来需要付出多少努力。\n科里亚特宫一片浓云惨淡，凯林登脸色铁青，在收到报告的那一刹那失望的摇了摇头，他的工业计划彻底失败，圣骏堡工业区已经化为了泡影，经济部长支支吾吾的解释显得那样苍白无力，他花了很长的时间阐明了各种困难，然后表明现在最好的做法就是赶紧终止不可能的计划，最后皇帝指了指桌面上的报告，几乎耗尽了他的所有力气。"
 decision_1094_krt.1.a: "“中止计划吧。”"
