#国策
 KRT_The_false_peace_for_a_long_time: "长久的虚假和平"
 KRT_The_false_peace_for_a_long_time_desc: "自帝国从七次哥伦比亚战争和比勒陀利亚战争的泥潭中走出来后，和平已经再度持续了漫长的时间。凯林登陛下已经厌倦了这种倦闷无趣的西陆均衡，是时候一劳永逸消灭那些不安分的邻居了，让我们打开天窗说亮话吧，西陆皇帝之位归于科里亚特。"
 KRT_The_false_peace_for_a_long_time_tt: "§Y凯林登一世将自诩“西陆皇帝”，这将大大激怒哥伦比亚联邦，有可能会引发战争。§!"
 KRT_To_abolish_the_system_of_pure_gold: "废除赤金制"
 KRT_To_abolish_the_system_of_pure_gold_desc: "赤金已经在我们的国家使用了很长时间，但现在已经失去了作为货币的职能，源石锭正在取代赤金和至纯源石成为新一代货币。经济部长已经提出了货币改革方案，逐步改用源石锭作为银行的信用保障，这真是太好了，陛下一直都他妈受够了那群操蛋的铸币厂主在那里用各种借口推托抱怨！"
 KRT_To_abolish_the_system_of_pure_gold_tt: "§Y他们必须全都滚蛋！立刻马上！§!"
 KRT_The_pardon_power: "豁免权"
 KRT_The_pardon_power_desc: "贵族们用尽显谄媚的下作方式来表现自己的忠诚，并且寄希望于得到将自己置身于法律外的资格，不过陛下很喜欢这种方式，贵族们从来没有越格行为，自然也不需要被庸俗的法律所制约。"
 KRT_The_pardon_power_tt: "§Y违反法律所带来的惩罚将不再适用于贵族。§!"
 KRT_Second_class_citizenship: "《二等公民法》"
 KRT_Second_class_citizenship_desc: "陛下已经受够了无尽的游行和示威，如果那些人不明白自己的地位，还一厢情愿以为自己在国家很重要，那我们只能把这些写在法律条文里了，从现在开始，皇帝的话就是法律，他所规定的条例就是真理！贱民无权对任何事情抱怨，大科里亚特不需要任何反！对！声！现在还有哪个愚蠢的大脑袋没听明白？"
 KRT_Second_class_citizenship_tt: "§Y帝国将把反对皇帝者全部投入铁牢。§!"
 KRT_Executing_the_culprit: "处决祸首"
 KRT_Executing_the_culprit_desc: "造反的共和派祸首终于落网了，让·道尔那个狗杂种一直都在反对帝国，反对伟大永恒的皇帝陛下，当迈因元帅把这个狗几把操的东西拿住的时候。他手下的那帮狗崽子全都一窝蜂的四散逃命，看来这个只会蝇营狗苟的烂货也不过如此，皇帝下令把他当众烧死，这个混账就像被火烫死的母猫一样惨叫了几个小时才死去，这差不多就能震慑那些怀有二心的小人了。"
 KRT_Executing_the_culprit_tt: "§Y菲林人让·道尔，像是一只被烫死的母猫吊在了城头。§!"
 KRT_Still_bruised: "创伤未愈"
 KRT_Still_bruised_desc: "哥伦比亚人是我们不死不休的大敌，要么我们死，要么他们死，除此之外别无二法。但是谁也不是蠢货，都能看得出北方打的什么都不剩下，到处都是报废的残骸和陆行舰遗迹，孤星城里面的寡妇快要堆成山了！这种见鬼的情况到底还要持续多久？"
 KRT_Still_bruised_tt: "§Y皇帝责令安德烈所属的北方军立刻开始整顿帝国北方，每个士兵都要随时准备向哥伦比亚发起进攻。§!"
 KRT_Wealth: "财富集中"
 KRT_Wealth_desc: "财富不能放在个人的手里，尤其是贱民和毫无用处的庸俗份子手里，二等公民除了必须的食物之外不需要多余的额外财富，这些钱都必须投入到国家的建设事业中，尤其是凯林登陛下所筹划的伟大工程计划中来。"
 KRT_Wealth_tt: "§Y帝国将开始着手探讨进一步收回感染者与二等公民的储蓄权和财产，并详细且严格的规定这些数额。§!"
 KRT_Curb_appeal: "遏制感染者诉求"
 KRT_Curb_appeal_desc: "对于感染者问题，科里亚特的官方态度一贯十分明确，他们的定位是二等公民，大度的帝国不会采用野蛮的手法肃清这些威胁，也不会设置隔离区，他们唯一的道路就是按照政府提供的岗位进行劳作——工厂、矿场、或者任何劳动力缺失的岗位。当然，我们不会费力去考虑其他的问题。"
 KRT_Curb_appeal_tt: "§Y感染者和普通人不分彼此，都会在科里亚特得到“公平”且“安全”的工作岗位。§!"
 KRT_seventy_years: "七十年纪念日"
 KRT_seventy_years_desc: "一转眼，凯林登陛下已经迎来了他统治的第七十个年头，共和派叛乱已经被镇压，对外战争也取得空前胜利。帝国在西陆如同不可动摇的伟岸巨人。中央-核心城将举办盛大的庆典来祝贺我们永恒的陛下，人们可以走上街头，并在这个时刻尽情享受帝国的荣光。"
 KRT_seventy_years_tt: "§Y核心城将举办一场纪念仪式，来纪念令人瞩目的历史时刻。§!"
 KRT_Industrial_power: "工业强国之梦"
 KRT_Industrial_power_desc: "科里亚特的工业还不够强大，我们会在中央-核心城建造一座让整个西陆为之惊叹的工业区划，进而彰显帝国的绝对国力，我们已经将“圣骏堡”工业区列为1094决议的主要项目之一。"
 KRT_Industrial_power_tt: "§Y帝国将开始一项巨型工程，并以此开始在全国筹取工程资金。§!"
 KRT_Eternal_empire: "永恒的帝国"
 KRT_Eternal_empire_desc: "无需多言，帝国的新气象就此开幕了，皇帝站在核心城顶端，眼中是波澜万丈的地平线远端。"
 KRT_expected_to_accounting: "预算合计"
 KRT_expected_to_accounting_desc: "帝国迎来了新的开始，在帝国南方，来自比勒陀利亚的威胁已经消散，我们忠诚的土邦捍卫着每一寸土地的利益，在帝国北方，《埃帕尔——华雷兹协议》的签订意味着和平的到来，七次哥伦比亚战争的结束造就了崭新的北方大区，他们孱弱的军队无法抵抗我们的陆行舰和装甲巨兽，得益于强大的帝国北方军，边境安稳如山。\n\n天命所归，今天的大科里亚特是前所未有的繁荣昌盛，现在我们将在永恒凯林登陛下的指引下走向新途，工业的力量已经显现，局势稳定下来，首都中央-核心城一片繁荣，科里亚特有朝一日定能建设起属于西陆的世界之都，我们可以将建设国家的阶段推进到下一步了。"
 KRT_expected_to_accounting_tt: "§Y帝国将开始致力于动员国内的各大势力。§!"
 KRT_Wilder_noble: "维尔德贵族"
 KRT_Wilder_noble_desc: "大科里亚特的中坚力量一直都是贵族阶级，从百年来便是如此，当凯林登陛下带领他伟大的军队从中陆抵达此处，只看到当地混乱不堪的土酋和一无所有的荒漠，我们带来了财富，我们带来了技术，我们带来了这些西陆土著难以想象的文明，那他们不应该为了这些而尽心尽力感谢文明的开化者么？\n\n毫无疑问，是的，维尔德贵族因此诞生，我们不能让凯林登陛下忠心耿耿的的追随者寒心，所有乌萨斯军官都在帝国的维尔德大区获得了自己的领地乃至爵位，在乌萨斯帝国他们或许什么都不是，但在大科里亚特，情况与众不同了。\n\n贵族引领着祖国的方向，他们控制着祖国的陆军，是祖国的忠诚利刃，至于他们想干什么，如何对待领地上的人民。那是他们自己的事情，只要他们维护皇帝陛下的永恒统治不失偏颇，任何人在这里都能获得公正的待遇。"
 KRT_Wilder_noble_tt: "§Y帝国当然要奖赏贵族的忠诚。§!\n每月工业区建设速率§G+1.00%§!"
 KRT_Land_tax: "封地税金"
 KRT_Land_tax_desc: "贵族自然应当鼎力支持国家，陛下赐予他们封号，让他们的血脉因贵族之名而荣耀于世，可不是让他们在这种时候掉链子的，每个人都必须要为国家的奇迹工程奉上心力！"
 KRT_Land_tax_tt: "资金筹备程度§G+5.00%§!"
 KRT_Bureaucratic_supervision: "官僚监督"
 KRT_Bureaucratic_supervision_desc: "自觉是世界上最大的骗局，指望人依靠自我督促什么事情都办不成，这是社会运行的真理，政府所要提供的是一个绝对良好的运作环境，来整合所有的有效力量，用到正确的方向上，无疑采取监督措施是最好的手段。"
 KRT_Bureaucratic_supervision_tt: "矿石病死亡率将略微§R上升§!\n工业区建设进度§G+5.00%§!"
 KRT_The_outhern_native_states: "南方土邦"
 KRT_The_outhern_native_states_desc: "南科里亚特曾经是一片混乱的地区，帝国与比特陀利亚的萨尔贡佬进行了漫长的战争，这让南方变成了一汪令人吞咽不得的泥沼——萨尔贡人，科里亚特人，荒野绣锤，西陆旅团，乃至各种各样的奇怪人士堆积在那里，不过幸运的是，土酋们将那里管理的相当出色，至今也没出现什么动乱。\n\n曾经有人提议要不要将南方置于帝国直辖之下，并将那些林立的土邦派系一网扫清，这种错误的观点让凯林登陛下大为震怒，当年要不是这些土酋朋友的鼎力相助，他们早就饿死了，现在怎么能反过来恩将仇报？\n\n我们应该相信南方的朋友们，自大科里亚特建国以来，土邦就是帝国最可靠的盟友，更别提南方的赋税实际上供养了几乎全国的人口。\n\n荒野上一片和谐，这更加说明了陛下的伟大，试问其他国家有谁能做到这样呢？"
 KRT_The_outhern_native_states_tt: "§Y我们应该信任帝国南部的土邦盟友。§!\n矿石病感染率将略微§R上升§!\n每月资金筹备程度增长§G+1.00%§!"
 KRT_Tugongjin: "土邦贡金"
 KRT_Tugongjin_desc: "向土酋们征用必要的工程资金以保障计划顺利进行，他们的态度是至关重要的一环，他们没有任何理由拒绝，否则我们的小伙子就有事情可做了。"
 KRT_Tugongjin_tt: "资金筹备程度§G+5.00%§!"
 KRT_Safeguard_supply_plan: "保障供应计划"
 KRT_Safeguard_supply_plan_desc: "要建成工业区我们需要更多的原材料，由于哥伦比亚对我们的贸易封锁，帝国现在出现了大量的钢铁缺口，我们需要南方提供更多的铁矿石，还有任何从萨尔贡人的土地里挖出来的东西。"
 KRT_Safeguard_supply_plan_tt: "矿石病感染率将略微§R上升§!\n资金筹备程度§G+5.00%§!"
 KRT_Factory_owner: "工厂主"
 KRT_Factory_owner_desc: "工业，工业，工业。\n\n工业是文明进步的象征，也是泰拉世界向移动城市迈步的阶梯，中陆热火朝天的工业革命和发光发热的源石引擎为人们带来了希望和方向，这样一个绝妙的奇迹值得帝国将大量投资用于发展建设，只要我们的工厂能源源不断产出巨型的装甲巨兽和最新的陆行炮舰，试想那些愚蠢的哥伦比亚人或者萨尔贡人要怎么动摇大科里亚特的统治呢？\n\n工厂主们是帝国最尽心尽力的一群人了，他们每天都要处理来自工厂的诸多事项，不管是人力调配还是资源管理都要由他们亲自负责，以确保帝国的这架工业战车由源源不断的燃料，我们自然要奖赏他们的忠诚和建国以来所获得的成果。\n\n至于我们如何发展工业，那自然是通过牺牲那些二等公民的自由来满足绝大多数国民的消费，凯林登陛下在某次会议对那些喋喋不休为感染者说话的窝囊废议员如此咆哮道：\n\n“都给朕去工厂！”\n\n“不去的全剐了！”\n\n在陛下的强硬统治下，我们的国家定能繁荣昌盛，赞美工厂主们！大科里亚特万岁！为皇帝陛下欢呼！"
 KRT_Factory_owner_tt: "§Y哈！这是我们的好时代！§!\n矿石病感染率将略微§R上升§!\n每月工业区建设速率§G+1.00%§!"
 KRT_Assigned_manufacturer: "指派制造商"
 KRT_Assigned_manufacturer_desc: "亚索伯公司一直负责为我们提供工业方面的建材和移动城市规划指导，在一些工厂主的推荐和牵头下，皇帝会雇佣他们的一批有经验的工程师来建设伟大的首都新工业区。"
 KRT_Assigned_manufacturer_tt: "工业区建设进度§G+5.00%§!"
 KRT_Promised_property_right: "许诺产权"
 KRT_Promised_property_right_desc: "工厂主们宝贵的经营经验是帝国得以繁荣的重要因素，他们的投资也是筹建资金的主要来源，是时候回报他们的时候了，这是他们的好时代，自然应当让他们管理这些崭新的工厂，只需要为帝国按时缴纳税款即可。"
 KRT_Promised_property_right_tt: "工业区建设进度§G+5.00%§!"
 KRT_Noble_parliament: "贵族议会"
 KRT_Noble_parliament_desc: "议会是源自中陆的思想产物，其本质就是权利的开放化和广泛化，将讨论的资格不分身份不分血统的下放到每一个人，这是高卢人总结出来的“理想的治国方式”，这种可笑的产物让凯林登陛下感到恶心，他不止一次对所有人强调，高卢帝国的下场就是民主制度的下场，这不会有什么大区别的，就像是失败的哥伦比亚也被帝国揍的抬不起头。\n\n试想没有一个真正睿智，真正权威的领导者，国家的方向难道要让那些愚蠢的民众去用单调浅显且无知的言论去决定？这显然荒谬。\n\n然而可悲的是我们还不得不去考虑一下某些贱民的影响力，他们会带歪我们忠诚耿耿的人民，因此凯林登陛下想出了一个绝妙的主意，来建立一个由睿智者构成的议会。\n\n大科里亚特的方向绝不能被某些一厢情愿的民主分子带歪，有魅力非凡的维尔德贵族们加入讨论就足够了，给皇帝一些微不足道的建议，然后就这样。"
 KRT_Noble_parliament_tt: "§Y这是帝国进步的标志。§!\n每月资金筹备程度增长§G+1.00%§!"
 KRT_Stupid_argument: "愚蠢的争辩"
 KRT_Stupid_argument_desc: "贵族议会已经在提案上纠结了数天时间，有人对决议的具体指标抱有担忧，这些消息让凯林登陛下勃然大怒，这些质疑的声音都毫无意义，只有做了才能知道是否正确，那些人该被扔进铁牢了。"
 KRT_Stupid_argument_tt: "工业区建设进度§G+5.00%§!"
 KRT_Engineering_shinsei: "工程新施"
 KRT_Engineering_shinsei_desc: "老旧的城区无法支撑如此庞大的工厂，我们在首都的基础设施需要翻新了，旧城改造也将被提上日程，工程队将修建一条贯穿内外城区的铁路，用以高效的链接陆地港口和工业区划。"
 KRT_Engineering_shinsei_tt: "§g我们的移动城市发展度略微提高了。§!\n矿石病感染率将略微§R上升§!\n工业区建设进度§G+5.00%§!"
 KRT_Nothing_great_was_ever_practice: "践行伟业"
 KRT_Nothing_great_was_ever_practice_desc: "永恒，泰拉世界只有凯林登陛下的科里亚特能配得上这个词，我们的国家在永恒的统治下发光发热，我们的秩序能经得起时间的摧残屹立不倒，有一些人将我们的国家称之为野蛮的代表，那只不过是他们无法理解我们的进步，在永恒君权的统治下，这个帝国只能朝着更加美好的方向迈进。\n\n很快，我们就会着手对外拓展我们的势力范围，将整个西陆收入囊中，然后对那些自诩胜利者的中陆人展开复仇，让所有人屈从于永恒不变的凯林登陛下。\n\n我们正将整片大地塑造成一个永恒不变的整体，这是多么伟大的理想？可惜不是所有人都有这样的智慧能理解陛下的伟业。"
 KRT_Nothing_great_was_ever_practice_flag: "工业区建设完成"
 KRT_Nothing_great_was_ever_practice_tt: "§Y帝国即将迈向征服世界的下一步！§!"
 KRT_Mobilize_the_Pilosa_people: "调动皮洛萨人"
 KRT_Mobilize_the_Pilosa_people_desc: "是时间了，帝国已经做好准备，我们将开始动员南方土邦的军队，集结在边境地区并做好随时发起行动。或许不需要多长时间，比勒陀利亚就将处于凯林登陛下的统治之下。"
 KRT_Mobilize_the_Pilosa_people_tt: "§O我们将开始调度南方的土邦军队，可能会出现不满的声音。§!"
 KRT_Precursor_of_general_war: "总体战的前兆"
 KRT_Precursor_of_general_war_desc: "战争已经进入了一个新时代，源石工业的进步可以同时武装成千上万人踏上前线，这是古代难以想象的事情，战争不再是士兵之间的对决，往往也是两国国民的殊死相搏，这意味着每个人都将投入到战争中，为了胜利至死方休。"
 KRT_Precursor_of_general_war_tt: "§Y我们将在全国范围内动员成年人，并致力于消灭任何敌人。§!"
 KRT_Land_based_logistics_support: "陆基后勤保障"
 KRT_Land_based_logistics_support_desc: "后勤补给随着载具的发展愈发便捷，我们会拓展更多的安全航道，把满载食物和弹药的车辆开到前线营地，让祖国的士兵得以战无不胜。"
 KRT_Land_based_logistics_support_tt: "§O过度动员感染者修建荒野航道可能会出现意外，这有可能引爆新一轮的感染者反抗浪潮。§!"
 KRT_Land_based_logistics_support_a_tt: "§Y所有南方省份§!添加§Y1基础设施§!"
 KRT_Imperial_1095_military_exercise: "“帝国” 1095军演"
 KRT_Imperial_1095_military_exercise_desc: "科里亚特军队必须施加压力！很快来自首都的军队将于皮洛萨人共同展开联合军演，我们将在漫长的边界线上展示出帝国的武力，以此迫使萨尔贡人在外交举措上做出让步，如若不然，我方将以强硬姿态索取已有宣称的土地。"
 KRT_Imperial_1095_military_exercise_a_tt: "§Y来自首都的科里亚特国防军将与皮洛萨人在南方边境共同展开军事演习，以对比勒陀利亚和国内的萨尔贡人施加压力。§!"
 KRT_Imperial_1095_military_exercise_b_tt: "§R可能导致严重的边境冲突，如果我们失败了，那将严重影响我国在西陆的地位。§!"
 KRT_Nanfang_No.1_Operation_Plan: "南方一号作战计划"
 KRT_Nanfang_No.1_Operation_Plan_desc: "我不是在开玩笑，这是皇帝的命令。\n\n杀光他们，杀光萨尔贡佬。\n\n杀光一切村子里敢于抵抗帝国的人，直到眼前尸横遍野。"
 KRT_Nanfang_No.1_Operation_Plan_tt: "§R我们将开启南方战争，大科里亚特万岁！§!"
 KRT_Fireline_replenishment: "火线补给"
 KRT_Fireline_replenishment_desc: "萨尔贡人的作战方式相当独特，他们喜欢在土坡上构筑一个个小型的堡垒，在里面放置隐蔽性极强的火炮对我们驰骋的装甲部队发起袭击，对于这种小手段，最好的办法就是用连绵不绝的火线炸平那些小玩意儿。\n\n我们需要充足的火炮和弹药！现在就要！"
 KRT_Fireline_replenishment_tt: "§Y我们将在南方采取稳妥的战术，如果效果不佳很可能会导致战局恶化。§!"
 KRT_Front_pressure: "阵线前压"
 KRT_Front_pressure_desc: "别他妈管那些破事了！萨尔贡人的突击队！萨尔贡人的埋伏！萨尔贡人操蛋的驮兽骑兵！那些玩意儿他妈只会分散我们的注意力，然后把装甲巨兽毫无意义的浪费在没用的地方！按部就班的保守战术结束了，我们应该直插心脏，现在就奔向敌军首都，然后把那地方完全炸平！把人全都给我填上去，为了皇帝！"
 KRT_Front_pressure_tt: "§Y迈因元帅将被指派到前线督促发起不计代价的全面攻击，这样激进突击的手段有可能会出意外...§!"
 KRT_Beat_the_Southern_War_Drum: "敲响南方战鼓"
 KRT_Beat_the_Southern_War_Drum_desc: "所有人都必须按部就班，已经到了最终时刻，我们必须在光荣的一战中为帝国伟业献身，跟随军队的步伐坚定的前进，战无不胜的科里亚特很快将再次击碎萨尔贡佬不切实际的幻想！"
 KRT_Domestic_faction_rebalancing: "国内派系再平衡"
 KRT_Domestic_faction_rebalancing_desc: "国内的局势并不算安稳，皇储霍夫曼和安德烈两人的私下关系极为恶劣，尽管两位皇储目前情绪稳定，但陛下也不免担心他们的追随者私下互相攻讦，这绝不是他想看到的事情。\n\n作为永恒帝王，有必要抽出一些时间，将皇储们的小心思打压下去，帝国只有一个皇帝，不管过去现在还是未来，都将只有他一个。"
 KRT_Domestic_faction_rebalancing_tt: "§Y皇帝将开始着手解决皇储派系之间的严重分歧。§!"
 KRT_Appease_the_crown_prince_faction: "安抚皇储派系"
 KRT_Appease_the_crown_prince_faction_desc: "霍夫曼是一个心情平和的孩子，他不善于言辞，在许多时候沉默寡言，敛眉善目，这份豁达的胸襟支持着他走到今天，皇帝注意到许多土邦和中央贵族都对这个文质彬彬的皇储抱有好感，这样下去有可能形成一股力量庞大的派系，他不能继续坐视不理。"
 KRT_Appease_the_crown_prince_faction_tt: "§Y皇帝将开始改善与霍夫曼的关系，并借此安抚皇储派的不满情绪。§!"
 KRT_Give_Hoffman_a_chance: "给霍夫曼机会"
 KRT_Give_Hoffman_a_chance_desc: "作为皇储，霍夫曼长期在首都过着深居简出的日子，有人认为这是皇帝对皇储的猜疑和不信任所致，这是变相的软禁，现在不必有这些多余的顾虑了，皇帝会委派霍夫曼前往南方的皮洛萨人驻地，在那里成为总督专员，这已经是近乎于安德烈的实权。"
 KRT_Give_Hoffman_a_chance_tt: "§Y皇帝对霍夫曼的委派可能会让安德烈感到不安。§!"
 KRT_A_cold_look: "冷漠的目光"
 KRT_A_cold_look_desc: "一纸委派令换来的是皇储的冷眼相待，剩下的那点亲情早已经被岁月风干，最后的皇储也只不过是闲暇之余的谈资。"
 KRT_A_cold_look_tt: "§Y皇储派的威胁已经荡然无存，现今的霍夫曼只不过是一个远离中央的棋子。§!"
 KRT_Appease_the_Andres: "安抚安德烈派"
 KRT_Appease_the_Andres_desc: "安德烈，皇帝亲爱的五皇子，被公认为帝国的继承人之一，与北方军联系密切，虽说一些维尔德贵族对他厌恶至极，但并不妨碍安德烈派已经成为了帝国内一股不可小觑的皇储派系，皇帝现在准备整顿这股势力了。"
 KRT_Appease_the_Andres_tt: "§Y皇帝将开始提升对北方军的控制力，并让安德烈感到更受重视。§!"
 KRT_The_reward_of_several_wars: "数次战争的犒劳"
 KRT_The_reward_of_several_wars_desc: "七次哥伦比亚战争已经证明了北方军的功绩，他们在最危难的关头用勇气和鲜血捍卫了帝国，这都不是其他人所能相提并论的，如果没有牺牲的那一代人，就没有今天繁荣昌盛的大科里亚特。皇帝准备犒赏北方军，并正式授予安德烈一枚皇家勋章。"
 KRT_The_reward_of_several_wars_tt: "§Y皇帝将表彰北方军的功勋并授予安德烈荣誉，这会让霍夫曼感到不安。§!"
 KRT_No_more_tenderness: "温情不再"
 KRT_No_more_tenderness_desc: "一个勋章换来的是北方军的安定，换来的是士兵的忠诚，凯林登从来没有指望那个皇子能走到自己的面前和颜悦色，他深刻清楚这一点，永恒的皇帝是孤独的，永远都是。他的权利将一直牢固下去，与自己这颗冰冷的心一样。"
 KRT_No_more_tenderness_tt: "§Y皇帝确保了北方军的忠诚，安德烈派的威胁已经荡然无存。§!"
 KRT_Keep_the_emperor's_dignity: "保持皇帝的威严"
 KRT_Keep_the_emperor's_dignity_desc: "科里亚特只需要一个皇帝，只能是他凯林登，永恒的寿命并不需要继承人的存在，他的威严即是一切，而皇储们只能作为温情和生活的副产物而存在，如果他们想借机谋反，那必将得到最为残酷的惩戒。"
 KRT_Keep_the_emperor's_dignity_tt: "§Y永恒的大帝，朕既国家！§!"
 KRT_Mobilize_the_Northern_Army: "调动北方军"
 KRT_Mobilize_the_Northern_Army_desc: "北方军已经做好了准备，哥伦比亚人的威胁不能被无视，我们将伺机行动，最好能发动一次出其不意的袭击消灭敌军的有生力量，参谋长们该行动起来了。务必在战争打响前研究出绝佳的战争方案。"
 KRT_Mobilize_the_Northern_Army_tt: "§Y帝国将开始在北方军进行初步动员，皇帝对此志在必得。§!"
 KRT_Authorize_Andre: "给安德烈授权"
 KRT_Authorize_Andre_desc: "畏首畏尾不是安德烈的性子，他需要更多的权利，我们会开放所有的重炮使用权，对于哥伦比亚人的移动城市，我们的602mm重炮“大莎莉”会让他们大吃一惊的。"
 KRT_Authorize_Andre_tt: "§Y安德烈获得了所有重炮的使用权限。§!"
 KRT_Great_Northern_Fortress_Group: "大北方要塞群"
 KRT_Great_Northern_Fortress_Group_desc: "我们在北方边境的防御并不够出色，孤星城的工业不足以建成一道足以提供掩护的防线，既然如此，科里亚特的中央地带也应该投入到这一工程中去了。"
 KRT_Great_Northern_Fortress_Group_a_tt: "§Y帝国北方边境§!添加§Y74座陆地要塞。§!"
 KRT_Great_Northern_Fortress_Group_tt: "§g新建成的“圣骏堡”工业区也将被投入到生产中。§!"
 KRT_Provoke_border_conflict: "挑起边境冲突"
 KRT_Provoke_border_conflict_desc: "上一次战争的边界条款并不明确，双方仍然保留有很大的争议地区，我们可以事先挑起一场局部冲突，来试探哥伦比亚的边境力量，以决定下一步的计划。"
 KRT_Provoke_border_conflict_tt: "§O如果我们在边境冲突落入下风，北方军可能会慎重考虑全面入侵的计划。§!"
 KRT_Northern_No.2_Operation_Plan: "北方二号作战计划"
 KRT_Northern_No.2_Operation_Plan_desc: "立刻发起进攻，哥伦比亚的弱小已经暴露无遗，我们无需再准备预备方案，今日零时听到发动机的轰鸣，大军即可迈过边境，愿神明保佑北方军战无不胜！"
 KRT_Northern_No.2_Operation_Plan_tt: "§R我们将开启北方战争，怒焰将至。§!"
 KRT_Main_armored_division: "装甲主力师"
 KRT_Main_armored_division_desc: "我们的前方是一望无际的平原，缓慢的重型陆行舰和步兵在这里就是活靶子，火炮集群会在开阔地把我们全都炸上天，不能再这样下去，在阿列克谢将军的建议下，我们必须组建几支能够快速突进的野战装甲师，然后把哥伦比亚人该死的火炮阵地端掉！"
 KRT_Main_armored_division_tt: "§O如果装甲攻势被敌军迟滞，很可能会导致我们被拖入消耗战。§!"
 KRT_Absolute_firepower_advantage: "火力绝对优势"
 KRT_Absolute_firepower_advantage_desc: "比火力？来啊！那群脑子泡发的哥伦比亚鬼佬绝对不会想知道到底谁的火力更强！我们的重炮无穷无尽！用如地狱般的弹雨打烂他们可笑的陆行舰队，到那个时候就能看到对面的糟糕表情了，我们只需要固守北方防线，然后坐等敌人在炮战劣势中耗尽最后一滴血！"
 KRT_Absolute_firepower_advantage_tt: "§O我们将致力于将对手拉入堑壕战，一旦对方的血液流干，我们将毫无疑问的取得战争优势，当然也可能流干我们自己的血......§!"
 KRT_Tear_up_the_armistice: "撕毁停战协议"
 KRT_Tear_up_the_armistice_desc: "上一次的停战协议已经无效了！虽然在战争爆发之时说这个有些迟，但我们依然强硬的对国民宣告了战争的再次来临，现在决定西陆未来主宰的时候到了，哥伦比亚佬绝不可信任，我们要彻底打断他们的腿！让他们永世不得翻身！"
 KRT_Tear_up_the_armistice_tt: "§R科里亚特秩序将临，或西陆沦为血海§!"
 KRT_Let_Xilu_surrender: "让西陆臣服"
 KRT_Let_Xilu_surrender_desc: "萨尔贡人正在溃败！北方军也已经踏上了哥伦比亚南方诸州，科里亚特秩序已经近在眼前，很快，比勒陀利亚将被完全吞并，哥伦比亚将被肢解成数个依附于帝国的附属国，我们将统治西陆，然后将目光放在更远的地方，不论是乌萨斯还是中陆，凯林登陛下会将泰拉世界的所有民族种族统一在一面旗帜下，这是多么宏伟的愿景？"
 KRT_Let_Xilu_surrender_tt: "§R西陆已逝，它在帝国的铁蹄下奄奄一息，下一个目标在哪？§!"
 KRT_Fuck_BOOM: "爆炸案"
 KRT_Fuck_BOOM_desc: "事情愈发严峻了，随着皇子霍夫曼说服了首都的军队，得到了来自城防军几支部队的效忠，他已经掌控了整个中央城外城区，控制了几名重要的政界人士并宣布全城戒严。\n\n最近首都的气氛一直笼罩在白色恐怖中，尽管皇储派仅仅宣布是在陛下身体有恙之时执行必要的“整顿治安”，并谴责了安德烈的北方军擅自离开边境的僭越行为，但还是有许多人怀疑是否有必要进行如此大规模的封锁，市民们不满的声音已经浮现，整个首都乌烟瘴气。\n\n然而，能够主持大局的凯林登陛下依然没有出现，近期，一场针对哥伦比亚边境的重要军事会议即将在科里亚特大议会进行。"
 KRT_focus_no_choose: "§R无法被手动选择§!"
 KRT_Shock_tu: "激突之日"
 KRT_Shock_tu_desc: "恐怖袭击出现在科里亚特的荣耀首都，这简直是耻辱！\n\n幸运？亦或者不幸？\n\n幸运的是，那样恐怖的炸弹没有放在内城区的科里亚特宫，或者是中央锅炉等什么的致命地带，造成更难以挽回的破坏。\n\n不幸的是，科里亚特大议会已经作古，那座象征着帝国团结的地标建筑已经连着地基都灰飞烟灭，再也看不出丝毫曾经的雄伟壮丽，首都的重要军官，乃至贵族都被幕后黑手谋害在了里面！\n\n大议会的垮塌震惊了所有人，帝国建国以来首次遭遇这种灾难，数千人的遇难者家属在政府面前抗议，谴责安保公司的失误和检查不当造成现在的结果，游行示威频繁在首都出现，他们捧着遇难者的骨灰，从凯林登大街一路前进道勃兰特利茨亚广场，人们要求追查真凶，皇储派积极承诺一定会调查爆炸案的真相，这给惶恐不安的市民吃了一颗定心丸。\n\n我们希望生活在一个开明的时代\n\n也希望生活在一个安全的大道下。\n\n愿逝者安息。\n\n恐怖永不再现。"
 KRT_Outside_the_city: "外城区"
 KRT_Outside_the_city_desc: "安德烈谋反！\n\n战斗还是爆发了，北方军悍然进攻城市，安德烈皇子终究是令陛下蒙羞，帝国的精锐陆行舰在他的手中，而这个叛徒做了什么？轰击首都？这就是他所做的事情？北方军的职责本应是捍卫边疆，现在他们擅离职守，帝国在哥伦比亚的边界线要怎么办？\n\n首都的舆论喧嚣尘上，毫无疑问，安德烈才是造反派，中央的外城区市民们看清楚了到底谁才是那个叛徒，他们自发拿起武器，帮助城防军抵抗来自北方军的攻击，外城区的战斗不会持续太久，但只要能坚持下去，在路上的援军就能抵达首都。\n\n保卫祖国！保卫人民！保卫大科里亚特皇冠！"
 KRT_In_the_city: "内城区"
 KRT_In_the_city_desc: "霍夫曼谋反！\n\n真令人难以置信，战斗爆发了，皇储派的士兵打伤了卫兵，强行冲进了内城区，他的士兵试图翻越路障和隔离桥，直奔我们陛下所在的科里亚特宫。这个叛徒竟然在陛下身体抱恙时就按耐不住自己的野心，首都的人民还能坐视不理，任由这个暴君上台鱼肉百姓？\n\n内城区的居民自发拿起武器，他们看清楚了谁才是那个真正的叛徒，开始抵抗来自皇储派的压力，凯林登陛下万岁！我们要追随这位伟大君王直到这片大地的尽头，只要我们能坚持住，那么北方军很快就能突破外城区的防御，然后把霍夫曼这个狡诈的贱种吊死在城头！\n\n保卫皇帝！保卫首都！保卫大科里亚特的未来！"
 KRT_In_order_to_crown_prince: "为了皇储"
 KRT_In_order_to_crown_prince_desc: "都结束了。\n\n内城区和外城区全部相继沦陷，皇储派所掌控的装甲巨兽碾碎了一切挡路之敌，誓要把自己的痕迹加诸在科里亚特皇冠之上，而北方军也用最残酷的手段突破了来自外城的防御，首都一片狼藉，内战撕裂着往日的荣耀之都，巷战已经爆发，双方军队在内城区展开了血腥的绞杀战。\n\n为什么会这样？这场战争因何而起？\n\n当中央的市民看到如此恐怖的一幕，在惊惧中思考这个问题时，他们才深深的意识到，往日的和平是如何的可贵，以及君主制的虚假秩序到底有多么脆弱，简直如同浮华泡沫，一触即碎。\n\n时间一分一秒的过去了，战斗持续了漫长的一周，双方士兵杀红了眼，城市在地狱中灼烧，野兽磨牙吮血，凶手杀人如麻，街道上到处都是尸体——有些是倒下的士兵，有些是平民，有些是妇女，甚至有些只是十几岁的小女孩。\n\n我们只能默默祈祷，神明保佑，最终的胜利者能够放过首都的人民，这场战争已经有太多无辜者死去，当灾难走到尽头，不管哪一方胜利，大科里亚特都将迎来新生。"
 KRT_In_order_to_crown_prince_tt: "我们只能等待，并满怀希望。"
 KRT_state_of_emergency: "紧急状态"
 KRT_state_of_emergency_desc: "我们的国家进入了关键时刻，“大灾变”毁灭了一切：和平，稳定，秩序与枝繁叶茂的科里亚特王朝。灯火辉煌的宫殿陷入了黑暗，昔日平和的祖国父亲也发出叹息。\n\n当人们看向首都的残破，一无所有的荒芜和颓败，所想到的是百年前凯林登陛下所面对的情况，而今天的状态比那时还要糟糕严峻百倍，谁能拯救帝国，谁又会拯救帝国？\n\n当人民眼含热泪，当贵族们瘫坐在地，那些过往的荣光幻梦都已随风而逝，我们需要脚踏实地，开始重新思考祖国的未来，首要的事情就是先要成立一个领导全国的临时机构，以平稳度过这段空位期。"
 KRT_state_of_emergency_ttt: "由于§Y中央-核心城§!§R损坏严重§!且伴有§R极为危险§!的§R源石风暴§!，帝国仅剩的§C行政高层§!决定将临时政府§Y迁往§!最近的移动城市§Y维尔德堡§!。届时，§Y维尔德堡§!将成为我们新的§Y首都§!并§G增加§!§Y5§!£victory_points£。"
 KRT_state_of_emergency_tt: "§O中央临时政府§!将正式宣布帝国进入§R紧急状态§!，§g王朝派§!§O紧急会议§!将在§Y几天后§!正式§Y召开§!。"
 KRT_succession_crisis: "继承危机"
 KRT_succession_crisis_desc: "目前科里亚特陷入了严重的继承危机，凯林登陛下和两位皇子都已经在大灾变中不幸遇难，如果我们坐视不理，那么地方贵族很快就会因为皇位大打出手，我们绝不能任由那些贪婪的小人分裂国家，必须找到一位足以担任皇帝的继承人，让他带领大科里亚特从黑暗中探寻出新的道路。\n\n无论那条道路是怎样的，我们都相信光明和希望永存。"
 KRT_succession_crisis_tt: "§O紧急会议§!将着手处理§Y王位继承§!问题！\n\n预计§Y几周§!后，§O紧急会议§!将得出一个明确的方案—在此之前，我们必须§L谨慎§!地利用手头上的§Y资源§!，以此来应对即将通过的§Y决议§!。"
 KRT_the_blockade_news: "对外封锁消息"
 KRT_the_blockade_news_desc: "大灾变的消息无法隐瞒太久，它就如同一石激起千层浪在整个西陆引起波澜，但我们至少可以暂且延缓它的影响，让首都的衰弱尽可能不为太多人所知，尤其是那些对紧急议会抱有非议的人，直到我们重整旗鼓前，只让少数人得知首都的情况便已经足够。"
 KRT_the_blockade_news_tt: "§O紧急会议§!将试着全面封锁§R大灾变§!的消息以避免其在§Y全国§!§R高速蔓延§!......\n\n于此同时，来自§Y凯林登格勒§!的§g贵族部队§!也会来§G增援§!我们。"
 KRT_mobilization_of_the_national: "秘密动员全国"
 KRT_mobilization_of_the_national_desc: "克里·羽非常清楚一个问题，紧急议会不能坐以待毙，大灾变后首都对地方的控制力已经岌岌可危，在北方，哥伦比亚边境和动荡的北方军成为了一个大问题，在南方，皮罗萨人和当地土邦正在与共和派的叛乱做斗争，维尔德大区的贵族们互相之间勾心斗角，对于首都而言，我们必须着手解决这三个主要地区的问题，然后迅速重整军备，以助于紧急议会应付任何局势的变化。\n\n当然了，南北的紧张局势并不会随着紧急议会的行动而化解，如果情况有必要...我们也可以使出一点其他手段，最好能吓住那些尚且搞不明白状况的地方总督。"
 KRT_mobilization_of_the_national_tt: "我们的§Y信使§!将会分别被派往§4北方军地区§!与§L土邦地区§!\n\n同时帝国各地的§O政府机关§!将被§Y动员§!起来，我们则会获得大量£manpower_texticon£。"
 KRT_the_south: "向南看"
 KRT_the_south_desc: "皮诺萨人、南部土邦，奴隶主，荒野感染者，二等公民......\n\n虽然不得不承认，但是帝国南部长期以来都处于一个混乱的环境中，由于凯林登陛下对那些土邦盟友的高度信任，导致中央基本对那里的情况一无所知，现在的情况意味着我们必须搞清楚南部正在发生什么，然后派出信使进行沟通，要求那些土邦重新效忠大灾变后成立的紧急议会，不然的话他们就要受到来自首都的惩戒了。"
 KRT_the_south_tt: "我们的§Y信使§!将前往§L帝国南部§!与§O皮洛萨斯克专员§!进行交涉，尽管我们§R无法保证§!交涉的结果，但§R紧迫的现状§!迫使我们不得不这么做......"
 KRT_the_middle: "中央地带"
 KRT_the_middle_desc: "维尔德贵族作为帝国最古老的阶级，掌握着帝国核心区域绝大多数产业和财富，他们拥有的资源可以立即解决首都目前的窘境，令人遗憾的是我们暂时只能联系的上对凯林登陛下忠心耿耿的凯林登格勒前来支援，但这不代表其他贵族便不再有危险性，根据某些秘密消息和隐秘报告，那些贵族似乎在密谋将一个非法的新贵族拥立为科里亚特皇帝，这是在背叛科里亚特王朝和凯林登陛下的秩序！\n\n不能继续等下去了，我们必须派出信使，搞清楚那些贵族在做什么，然后在必要时刻要求他们向紧急议会效忠，直到决定出帝国新的皇帝为止！"
 KRT_the_middle_tt: "我们的§Y信使§!将前往§L维尔德大区§!向§Y凯林登格勒§!的§O维尔德贵族§!请求支援，尽管他们并不认可甚至反对§O紧急会议§!所做出的决议，但在§R内忧外患§!下，他们也没有选择......"
 KRT_local_aristocracy: "邀请地方贵族"
 KRT_local_aristocracy_desc: "凯林登格勒是距离中央-核心城最可靠的大型城市，经过紧急议会的商讨也是最适合作为首都的地点，我们没有理由不去邀请他们帮助首都撤离难民，更重要的是那座城市内部也驻扎着不少帝国的核心区陆军，如果紧急议会能控制凯林登格勒，也就意味着我们能重新拥有主动权，信使已经出发，并准备将首都的消息带给所有维尔德贵族，希望他们能清楚自己的职责，不要有任何非分之想。只有紧急议会才有资格决定帝国的未来，而不是他们。"
 KRT_local_aristocracy_tt: "§Y维尔德贵族领袖克里斯安§!将被邀请至§O紧急会议§!商讨下一步应对事宜。"
 KRT_muddle: "和稀泥"
 KRT_muddle_desc: "克里斯安真是疯了，他居然一次次不知廉耻的向紧急议会索要帝国皇位，甚至对克里·羽说出要在凯林登格勒加冕这种话来，他想要取代科里亚特王朝，背叛自己曾经向凯林登陛下宣誓效忠说出的誓言，帝国不需要这种叛徒！\n\n让人恨到牙痒痒的情况是......紧急议会还是缺乏一些手段，凯林登格勒的所有军队暂时全都听从克里思安一人，如果把他逼到狗急跳墙，他会毫不犹豫的消灭紧急议会，为了那种最糟糕的情况不会成为现实，我们不能让他意识到议会的真正意图，克里·羽绞尽脑汁敷衍拖延着他的计划，只要让这个一厢情愿的蠢蛋以为紧急议会是真的支持他的宣称，那他就不至于干下什么难以弥补的蠢事。\n\n大灾变以来牺牲的人实在是太多太多了，克里·羽不希望再有任何科里亚特人因为内部斗争而死去。"
 KRT_muddle_tt: "与§Y克里斯安§!的商讨基本达成了，在§g王朝派§!的争取下，§O紧急会议§!将有机会迁往§Y凯林登格勒§!并进行下一步计划。\n\n届时，§Y凯林登格勒§!将成为我们新的§Y首都§!并在§Y维尔德堡§!§R减少§!§Y5§!£victory_points£。"
 KRT_the_north: "向北看"
 KRT_the_north_desc: "北方一直以来都是帝国的作战前线之一，在七次哥伦比亚战争结束后，我们与这个北方邻居达成了一段安稳而不算漫长的和平，但这些随着大灾变的发生基本一去不复返，哥伦比亚边防军已经开始频繁骚扰北方军驻地，双方的武装冲突在边界线时有响起，如果我们不想失去那块领土，最好派出信使联系一下北方军现在的情况，并且让他们重归科里亚特旗帜下，向紧急议会效忠。"
 KRT_the_north_tt: "我们的§Y信使§!将前往§L哥伦比亚边境§!与§O北方军§!进行联络以保证帝国§Y北方边境§!的安全，无论他们如何回复，§O紧急会议§!都不会允许这么一支大军就这样§R脱离§!§Y中央§!的控制......"
 KRT_pardon: "赦免北方军"
 KRT_pardon_desc: "北方军是帝国最重要的作战枢纽之一，那里有无数帝国优秀的军人，最精锐的装备和保养多年的陆行舰，要不是安德烈那个胡来的混账将大批军队调回首都，我们本不应遭受大灾变这一亘古难见的灾难，现在失去了凯林登号陆行舰，他们有可能面对来自哥伦比亚的武装威胁。\n\n对于北方军士兵，首都不少居民要求清算他们。但现在显然不是时候，我们必须争取北方军的支持才能保证紧急议会的权威不会被动摇，因此暂时赦免北方军的提议已经被重视起来，阿列克谢将军和约瑟夫将军手中掌控有仅剩的北方军部队，克里·羽和科里亚特·迈因还在为具体的实施方案而争执，但派往北方军的信使已经出发了。"
 KRT_pardon_tt: "我们的§Y信使§!将与§O北方军§!的两位将军进行§C交涉§!。\n\n在§C交涉§!的过程中，我们可以采取§9温和§!与§t激进§!两种态度，前者更可能使§C交涉§!成功，后者则有更高的§R失败§!风险，但也可能迫使他们§t屈服§!！\n尽管无法判断两位将军的态度，但当§Y信使§!采取了§G合适§!的交涉口吻，两位将军便可能与§O紧急会议§!达成§Y共识§!甚至是完全§t屈服§!。前者会为我们提供大量的£stability_texticon£,后者更将额外提供大量的£manpower_texticon£与£unit_category_light_infantry_icon_small£！"
 KRT_the_northern_mess: "北方乱局"
 KRT_the_northern_mess_desc: "事情已经无可挽回，帝国北方的内战已经爆发，伴随对首都的恐惧和对阿列克谢的不信任，约瑟夫决定带领剩下支持安德烈皇储的士兵掀起叛乱，现在北方激战正酣，大量难民被迫南下，这无疑是给本就严峻的情况雪上加霜。我们只能努力恢复权威，并希望在新皇继位之时开始着手解决北方叛军。"
 KRT_the_northern_mess_tt: "一封来自§g北方边境§!的§R加急电报§!被放在了§Y克里·羽§!的办公桌上。\n\n这必将不会是一个好消息......"
 KRT_support_of_all: "争取土邦支持"
 KRT_support_of_all_desc: "金钱是收买贪婪者的最好方式，那些目光短浅的土邦酋长显然就是这种人，在金钱就是一切的规则下，我们也可以对皮罗萨人许诺财富，如果没有任何必要，相信凯林登陛下委派的南方专员也肯定不想与帝国在这个时候决裂，毕竟南方的比勒陀利亚人虎视眈眈，随时可能卷土重来，他们可不像是科里亚特能给予如此大的自治权。"
 KRT_support_of_all_tt: "§Y谨慎，还是大胆？§!我们的§Y信使§!已经前往§L土邦地区§!同当地统帅进行联系，§O紧急会议§!相信，一笔§Y钱财§!便可摆平那群§t贪婪的家伙§!。\n\n我们的§Y信使§!可以选择向§O土邦专员§!提供一笔不菲的钱财或者直接§R施压§!，前者能够保证§L土邦地区§!对我们的§Y忠诚§!并§G提升§!£stability_texticon£，而后者则可能使§Y信使§!付出§R生命的代价§!，不过一旦§O土邦专员§!愿意退让，我们将额外获得§G大量§!£pol_power£。"
 KRT_the_southern_rumours: "南方传闻"
 KRT_the_southern_rumours_desc: "稳定的假象没能持续多久，在长年的压榨和剥削中，帝国南方还是传来了坏消息，共和派在南方掀起了声势浩大的叛乱，这些徘徊在荒野上的野兽终于露出了磨砺已久的獠牙，他们要推翻我们的统治然后实践他们自己的小小打算，我们当然不想看到皮罗萨人在军事斗争中一败涂地，但在解决首都和继承问题前，我们还不能向南方派出援军。\n\n帝国内战已经爆发，镇压那些异想天开的共和分子！大科里亚特王朝永恒长存！"
 KRT_the_southern_rumours_tt: "一封来自§L土邦地区§!的§R加急电报§!被放在了§Y克里·羽§!的办公桌上。\n\n这必将不会是一个好消息......"
 KRT_the_last_of_the_prince: "最后的皇子"
 KRT_the_last_of_the_prince_desc: "君王归来之日已至！真是赞美神明！\n\n沿着霍夫曼留下的蛛丝马迹，科里亚特·迈因带领的调查队花费了几个月的时间，最终线索锁定了休伯特皇储的位置！他在几年的漂泊中饱受磨练，目前在叙拉古担任外交顾问，这个好消息大大鼓舞了本已绝望的紧急议会，只要科里亚特王朝一息尚存，首都的王朝派就还有存在的意义，克里·羽得知这个消息相当兴奋，当即下达了接回休伯特皇储的指令，信使已经出发，相信皇储本人得知这个消息后也不会放弃他在祖国应该继承的皇位。\n\n帝国最后的皇子即将回到科里亚特，他将继承凯林登陛下的遗产，然后重新按照他的愿景重塑我们的永恒帝国。"
 KRT_decision_last_child_of_emperor: "§Y我们找到了休伯特陛下§!"
 KRT_the_last_of_the_prince_tt: "§R帝国不可避免地分裂了......§!"
 KRT_kory_yu: "克里·羽方案"
 KRT_kory_yu_desc: "在皇储归来后，帝国的精英们...或者说它的残余部分已经集结在了克里·羽的周围，该如何评价这个在大灾变后政府内职位最高的王朝派呢？人们都说她对休伯特的无理由拥护达到了执着的地步，或许是源自年幼时的一次偶遇，也或许是休伯特陛下对感染者和底层人民的同情打动了她的内心，不论如何，这个女人从陛下继位以来就发誓绝对要将休伯特的科里亚特王朝守卫到底。\n\n目前，帝国的外部强敌环伺，南北两只盘踞的豺狼随时准备将这个支离破碎的国家撕成碎片，克里·羽不会坐视外敌逐渐蚕食祖国的边境，很快一份针对南北邻国的外交方案就会被提上日程，她要成为帝国最敏锐的话事人，将那些强敌的注意力暂时从科里亚特身上移开。"
 KRT_cobra_diplomatic: "眼镜蛇外交"
 KRT_cobra_diplomatic_desc: "眼镜蛇外交这个名字取自最初的萨尔贡眼镜蛇，在漫无边际的南陆沙海，斐迪亚人往往最恐惧的便是那些潜伏在黄沙下的眼镜蛇，因此赤脚商人们必须成群结队才敢踏入那些孤立于黄沙中的部落寻求交易，否则那些眼镜蛇就会毫不犹豫地发动攻击，蛇影窜绕，只袭一敌，鉴于帝国现在无力同时对抗两个敌人，克里·羽的外交原则也只有一个。\n\n分化敌人，然后集中力量威慑一处。"
 KRT_cobra_diplomatic_tt: "我们将从§C比勒陀利亚§!和§2哥伦比亚§!之间选择§Y一个国家§!作为我们的§O外交重心§!，一纸§C互不侵犯条约§!将保证我们后续的§Y对内计划§!。"
 KRT_give_in_to_colombia: "对哥伦比亚让步"
 KRT_give_in_to_colombia_desc: "克里·羽意识到，只要《埃帕尔-华雷兹条约》还继续存在，哥伦比亚就一日不会真正与科里亚特缓和局面，想要寻求对北方和解，她就必须对这个第七次哥伦比亚战争的不平等条约进行大刀阔斧的裁剪，通过对赔款和贸易条例的条目修改，我们可以跟哥伦比亚人重返谈判桌，并且用这个筹码要求他们与我们拟定一份可靠的互不侵犯条约，尽管我们不指望这个条约能长时间在两国之间存在，但充当这一时期的维系纽带就已经足够了，尽管对哥伦比亚佬让步会让人相当不爽。"
 KRT_border_talks: "重返边界谈判"
 KRT_border_talks_desc: "我们在边界问题上的谈判很简单，我们将开放领土的边界，然后允许哥伦比亚航道在我国境内自由通行，这能够创造出一个自由贸易区，不仅有助于缓和两国关系，而且有助于双方的经济发展，大灾变过后的科里亚特同样会需要来自哥伦比亚的货物进行重建工作。\n\n克里·羽相信，哥伦比亚不会拒绝这样的诱惑，边界谈判会是两国重返正常关系的开端。"
 KRT_sargon_negotiate_again: "萨尔贡再交涉"
 KRT_sargon_negotiate_again_desc: "萨尔贡人历来在南方地区频繁侵扰，比勒陀利亚一直没有放弃被科里亚特夺取的皮洛萨地区，南方大大小小的冲突以土邦战争的形式长期存在，虽然规模小而且并没有任何重型武器出现，但长期的动乱还是让南方的发展相当缓慢，如果我们不想要这个南方邻居在关键时刻破坏计划，最好现在就着手拉拢比勒陀利亚的关系。"
 KRT_the_necessary_sacrifice: "必要的牺牲"
 KRT_the_necessary_sacrifice_desc: "对于比勒陀利亚，我们可以暂时牺牲皮洛萨人的利益，在南方征收额外的农业税并作为一份和平贡金，这相当于用那些土邦的钱去搞外交，但这不是无底线的退让，他们如果不识好歹，那我们也有第二个选择......"
 KRT_main: "迈因方案"
 KRT_main_desc: "在我们开始下一步计划前，先要着手解决位于凯林登格勒的某些阴影，许多人对休伯特陛下继承的正当性还抱有怀疑，我们会用一些手段来让他们认识到现在的情况，当我们将几名密谋反对休伯特陛下的头目拿下，那些不知好歹的守旧派才能放弃他们不切实际的主张，迈因已经有了一个完整的内肃方案亟待实施。"
 KRT_the_winch_and_piano_wire: "绞盘和钢琴线"
 KRT_the_winch_and_piano_wire_desc: "在古代的中陆，频繁移动的工业民团不会使用像是断头台这样难以携带的重型器械去对犯人处以死刑，他们会用另一种更加高效简易的手段去迅速结束犯人的痛苦——用坚韧的钢琴线制成的简易绞杀盘，然后将犯人从高空抛下以迅速切断他们的头颅，直到这种方法被高卢帝国废除以后，不少荒野地区还有使用这种处刑方法的村落。\n\n对于那些帝国的叛徒，他们不知道人民所需要的是什么，也不在乎帝国的未来！这些仍旧活在过去，妄图守卫自己特权的腐败之徒全都应该被这种简易的刑具切割致死！"
 KRT_the_winch_and_piano_wire_tt: "§Y迈因元帅§!和他的§g近卫军§!将会对§Y帝国内部§!的§O不合作者§!进行§R清洗§!。"
 KRT_knives_and_sharp_spear: "匕首和尖矛"
 KRT_knives_and_sharp_spear_desc: "杀死一个人最好的方式就是用尖锐物捅进心脏，这是泰拉世界亘古不变的法则，荒野上强者会被匕首一击毙命，弱者会被数支尖矛周旋致死，哪怕是进入了工业时代，这些简单有效的兵器也仍然留有一席之地，而有些人似乎身处文明的虚伪面具就忘记了最原始的暴力手段是什么，我们会让他们重新体会死到临头的滋味，直面荒野上的血腥。"
 KRT_knives_and_sharp_spear_tt: "§Y迈因元帅§!和他的§g近卫军§!将会对§Y维尔德贵族§!的§O重要人物§!进行§R打击§!。"
 KRT_protection: "帝国保卫局"
 KRT_protection_desc: "我们是坚钢无惧风吹雨打，我们是飓风无畏前路山石。\n\n我们是赤脚旅者碾过荒漠，我们是白日雷鸣震撼人心。\n\n我们是永恒帝国忠诚的孩子，永远为大科里亚特奉上至高忠诚。\n\n当我们的身体在战斗中死去，请把我们葬入这祖国的故土之上。\n\n——帝国保卫局宣誓词。"
 KRT_gray_cattle: "灰色牲口"
 KRT_gray_cattle_desc: "有人说我们应该对他们保有同情——这些指的是那些无家可归的荒野游民，在首都被摧毁后，有许多无家可归的人整天无所事事徘徊在凯林登格勒的大街小巷，由于一时无法弥补首都被摧毁带来的巨大工业空缺，这些释放出来的劳动力已经给社会治安造成了严重的问题。\n\n他们不能再这么转悠下去了，我们将其从核心城救出来可不是为了让这群人来凯林登露营，帝国的重建需要更多的人力，迈因元帅想出了一个绝妙的方法，它来自于乌萨斯的一个惯用手段：将那些人分批编入军队和后勤人员，这样能够最大程度整合我们现在的力量以应对云波诡谲的局势。"
 KRT_gray_cattle_tt: "获得§Y5个§!步兵师£nato_unit_infantry_icon_small£与§Y3个§!机动步兵师£nato_unit_cavalry_icon_small£。"
 KRT_the_new_order: "新秩序"
 KRT_the_new_order_desc: "凯林登格勒必须迎来全新的秩序，迈因势必要为休伯特陛下扫清道路，对待城区内的平民，我们当然不会使用暴力手段，那是野蛮人才会使用的手段，虽然绝大多数人都对陛下能否继续延续以往的统治感到怀疑，但是我们会用自己的做法去证明休伯特陛下的思想绝对摒弃了过去的残酷，一系列临时法案将会废除某些人无耻的特权，这能让我们的人民感到安心，至于那些抗拒改变的人，帝国铁牢不会介意多出几个人。"
 KRT_the_new_order_tt: "§R新秩序已经降临§!，§Y休伯特陛下§!忠诚的军队正开往各个§O贵族叛乱地区§!—维尔德贵族首领的狗头被挂在§Y凯林登格勒§!示众，那些§t犯上作乱的混蛋§!也该付出代价了！\n\n§O维尔德叛乱分子§!所控制的§Y叛变地区§!将被§G收复§!。"
 KRT_the_capital_and_control: "第二中央"
 KRT_the_capital_and_control_desc: "内肃和整顿行动已经结束了，现在凯林登格勒已经被紧急议会完全控制，我们在休伯特陛下的授意下重新规定了城市的法律，确立了一些基本的条例，这或许会让被凯林登时代折磨到精神衰弱的人们感到欣慰，迈因相信这意味着科里亚特将会迎来更剧烈的改变，不过守旧派的力量还广泛的在帝国各地存在，控制这座城市只不过是休伯特陛下的起点，而不是使命的完结。"
 KRT_the_capital_and_control_tt: "§Y休伯特陛下§!将彻底控制整个§Y凯林登格勒§!！在§Y迈因元帅§!的§R打击§!下，不可一世的§O维尔德贵族§!尘埃落定......\n\n§G减轻§!§R大灾变§!带来的§Y影响§!。"
 KRT_exclusive: "卸除外国压力"
 KRT_exclusive_desc: "眼镜蛇外交已经执行完毕，我们卸除了来自一个方向的压力，现在终于能够集中所有力量对另一方向进行战略威慑，在让外部干扰因素消失后，我们也可以开始着手打击不承认休伯特陛下的叛军了。"
 KRT_exclusive_tt: "§C眼镜蛇外交§!能够§Y保证§!，在最近的§G一到两年内§!，不会出现对帝国有§R显著威胁§!的§Y外交事件§!，我们将有精力投入后续的§O对内计划§!。"
 KRT_march_to_the_country: "向全国进军"
 KRT_march_to_the_country_desc: "长归之日已至，大灾变已经结束了，但人祸还没有结束，对于休伯特而言，这个国家充满了凯林登留下的残影，那些沉浸在永恒帝国幻梦中的守旧派还没能认清自己的位置，他们想要继续保留特权，然后继续将大科里亚特的残酷统治继续延续下去。\n\n该结束了，都该结束了，真正忠诚于科里亚特人民的军队已经准备完毕，为了皇帝，为了真正的帝国，只要休伯特还存在一天，他就绝不允许凯林登秩序在这个国家重现，那些叛军是时候跟死去的凯林登一起打入历史的垃圾堆中了！\n\n灾难已去，未来的希望在废墟中孕育而出，帝国必将浴火重生！向全国进军，休伯特陛下万万岁！"
 KRT_march_to_the_country_tt: "§R秩序正在重塑，铁与血与征服即将登场......§!"
 KRT_Shoot_down_the_northern_and_Southern_Eagles: "击落南北雄鹰"
 KRT_Shoot_down_the_northern_and_Southern_Eagles_desc: "虽然紧急议会取得了阶段性的胜利，成功在大灾变的余烬中找到了休伯特皇储的蛛丝马迹，避免帝国在群龙无首中内耗灭亡的结局，但我们也要清楚目前仍然是一个极为不利的状况，危机远远没有结束。\n\n在南方，萨尔贡人和共和派分子竞相勾结，发起了帝国至今最为庞大的叛乱行动。他们摧毁矿场设施，释放矿奴，用各式各样来源未知的法杖和武器袭击我们的士兵，把南方省份搞得一团糟，到目前为止，数座城市沦陷已经让土邦的统治濒临崩溃。接下来不管他们要做什么，帝国都必须立刻阻止这些犯上作乱的叛贼，否则我们都将大祸临头。\n\n在北方，我们的情况也不见得好到哪里去，北方军已经出现了内讧，这个词已经不是很恰当了，北方军民分成了两派互相攻伐，其战争烈度已经可以用内战来形容了。那些本来用于防备北方之敌的武器都变成了射向我们自己人的夺命箭矢，问题是这根本就毫无意义，休伯特陛下是帝国唯一的主宰和现今的帝国继承人，他们还有什么理由为某些将军或者贵族之间的恩怨互相厮杀？\n\n鲜血染红科里亚特，每时每刻都有人正在倒下，先皇曾经称赞的南北雄鹰——土邦军队和北方军，他们都已然成为笑柄，这是自凯林登时代前所未有的困局，我们必须着手想办法走出这个艰难的时刻，紧密的团结在休伯特陛下的周围。"
 KRT_The_sword_points_to_the_Earth: "剑指土邦"
 KRT_The_sword_points_to_the_Earth_desc: "哈，真是天大的笑话，南方的土邦酋长曾经耀武扬威的跟帝国保证，他们已经把萨尔贡人全都处理的“服服帖帖”了，他们每年交给帝国的赋税和大量的源石矿产成为了帝国工业化的基石。那里多是一片宝地，但人们很少会想去南方定居生活，年轻人们甚至大多都瞧不起土邦地区来的乡巴佬，尽管那里是最大的产粮区和赋税区，但生活一直都相当赤贫，种族混杂，感染者问题也相当严重，只有工厂主经常到南方像是觅食的沙漠豺狗一样搜寻可以吞噬的人力。\n\n现在土邦酋长们终于为自己的贪婪付出了血的代价，愤怒的萨尔贡人大肆破坏，当地人惨遭屠杀，他们的矛盾经过二十年来的奴役发酵已经到了不死不休的程度，现在还要我们给南方处理叛乱问题。希望到时候大军抵达时，皮洛萨人，或者是其他土邦不会再对帝国生出任何小心思了...科里亚特万岁，碾碎那些南方叛军！帝国至高，帝国至上！"
 KRT_The_sword_points_to_the_Earth_tt: "§g国防军§!开始在§O土邦地区§!发起§Y特别军事行动§!！"
 KRT_Settle_the_mess_in_the_south: "摆平南方乱局"
 KRT_Settle_the_mess_in_the_south_desc: "南方的混乱总会结束的，近日随着迈因元帅率领的军队抵达南方，数万名士兵在黄沙中进军，帝国的旗帜在沙漠的夜月之下反射出杀气森森的冷光，我们开启了南方再征服的第一步，先夺回几个重要地区，尤其是城镇和重点村庄，然后一步步的压缩游击队...呃，萨尔贡人的活动空间，相信帝国新锐的装甲部队会在野战中胜利，控制几个主要的交通要道。然后我们就可以实施包围，部署炮击阵地展开下一步的攻坚作战了。\n\n现在的问题是，这场战争的规模到底有多大，萨尔贡人到底有多少参与到了叛乱中？要把他们全杀光还是重新奴役掉？每次想到这些令人头大的问题，军官们都幻想着有什么神民可以解决一系列的后续维稳，他们可不想在南方跟这些萨尔贡泥鳅在沙海里长期玩猫捉老鼠的无趣游戏。"
 KRT_Settle_the_mess_in_the_south_tt: "§帝国在§O土邦地区§!的军事行动取得了§Y一定§!的§G进展§!。"
 KRT_The_reenactment_of_the_War_of_1074: "1074战争的再现"
 KRT_The_reenactment_of_the_War_of_1074_desc: "1074年，凯林登皇帝亲自率军南征，在哥伦比亚战争进行到白热化阶段时，南方的萨尔贡人趁机造反，联合部分比勒陀利亚的军队进犯南疆，这场战争的结果是帝国一直以来的骄傲。皇帝的陆行舰队完成了一次漂亮的突袭，我们仅仅用了几千名精锐的士兵就打的比勒陀利亚人溃不成军，那场歼灭战直接让懦弱的萨尔贡人宣布臣服，比勒陀利亚投降并割让了一大块土地，在那个危机时刻为整个帝国赢来的丰硕的果实！\n\n凯林登陛下或许有许多苛刻的地方，有许多地方令人厌恶，但唯有维护帝国利益这方面的事情，他从不手软，如同一个屹立不倒的战神为人们带来胜利，士兵们在胜利日的狂热也无以复加，1074年的战争成为了至今祖国人民津津乐道的话题，少年少女们都对那场战争的传奇故事心向往之，如今南方战端再起，好像让人们乐观的看到了1074年的盛况就要重演了。\n\n萨尔贡人，还是趴着比较好，不管哪个时代都是如此。"
 KRT_The_reenactment_of_the_War_of_1074_tt:0"帝国在§O土邦地区§!的军事行动取得了§Y进一步§!的§G进展§!。"
 KRT_Remove_congestion: "剔除淤血"
 KRT_Remove_congestion_desc: "结束了，在血流不止且死伤惨重，长达一个多月的鏖战中，从计划到实施，我们闪电般的装甲部队飞驰在南方热土，攻下了游击队的老巢，随着萨哈比亚堡沦陷，土邦军队趁机配合，萨尔贡人在里外夹击下崩溃了，大批大批的跪倒在地请求原谅，这片土地迅速易帜。休伯特陛下所担心的兵力问题没有成为科里亚特军队失败的理由，他们用自己的素质证明了帝国中央军团仍然是泰拉世界最强大的军队之一！\n\n胜利，我们的士兵热泪盈眶，南方大规模的叛乱就此终结，他们都是祖国的荣誉本身，虽然零零星星的反抗和战斗还会持续一段时间，但是我们已然完成了为帝国而战的使命，接下来的任务也会轻松不少。\n\n现在我们的问题就是如何处理南方叛乱的头目，这些家伙不管从哪个方面对我们的威胁都太大了，如果赦免他们难免让休伯特陛下感到不满，但是如果审判他们或许会让南方的叛乱持续更久的时间，毕竟大部分萨尔贡人对他们的尊敬和敬仰几乎到了难以想象的程度，就像是某些狂热的十字教信徒般，不过迈因元帅会做出他的决定的。"
 KRT_Remove_congestion_ttt: "帝国在§O土邦地区§!的军事行动取得了§G决定性§!的§Y进展§!。"
 KRT_Remove_congestion_tt: "§R共产主义§!将§O不具影响力§!。"
 KRT_The_blade_of_conquest: "征北之刃"
 KRT_The_blade_of_conquest_desc: "结束了，在血流不止且死伤惨重，长达一个多月的鏖战中，从计划到实施，我们闪电般的装甲部队飞驰在南方热土，攻下了游击队的老巢，随着萨哈比亚堡沦陷，土邦军队趁机配合，萨尔贡人在里外夹击下崩溃了，大批大批的跪倒在地请求原谅，这片土地迅速易帜。休伯特陛下所担心的兵力问题没有成为科里亚特军队失败的理由，他们用自己的素质证明了帝国中央军团仍然是泰拉世界最强大的军队之一！\n\n胜利，我们的士兵热泪盈眶，南方大规模的叛乱就此终结，他们都是祖国的荣誉本身，虽然零零星星的反抗和战斗还会持续一段时间，但是我们已然完成了为帝国而战的使命，接下来的任务也会轻松不少。\n\n现在我们的问题就是如何处理南方叛乱的头目，这些家伙不管从哪个方面对我们的威胁都太大了，如果赦免他们难免让休伯特陛下感到不满，但是如果审判他们或许会让南方的叛乱持续更久的时间，毕竟大部分萨尔贡人对他们的尊敬和敬仰几乎到了难以想象的程度，就像是某些狂热的十字教信徒般，不过迈因元帅会做出他的决定的。"
 KRT_The_blade_of_conquest_tt: "§g国防军§!开始在§O北方地区§!发起§Y特别军事行动§!！"
 KRT_To_intervene_in_the_north: "介入北方事态"
 KRT_To_intervene_in_the_north_desc: "不出我们所料，约瑟夫·赫尔贝格和阿列克谢·斯图科夫这两个无耻至极的孬种根本不打算承认休伯特陛下的正统性，他们绑架了整个北方军来作为他们跟陛下谈判的筹码，居然堂而皇之要求继承他们在北方的利益，以及他们在军队中的某些权益不受中央干涉，这是帝国无法接受的事情，现在不是凯林登时代了。\n\n当然，北方军的战力在整个帝国无出其右，中央军区的军队也不一定能取得胜利，不少人都有这样的担忧，不过军区统帅部已经将战争方案提交给了皇帝，休伯特陛下显然不打算继续放纵北方军成为贵族腐败的温床，战争一触即发，我们完全可以利用北方军的内部矛盾和当地人民赢得先机，毕竟休伯特陛下是科里亚特目前唯一的正统继承人，北方军是叛军这一点在普罗大众看来毋庸置疑。\n\n那么无需多言，开战！"
 KRT_To_intervene_in_the_north_tt: "帝国在§O北方边境§!的军事行动取得了§G一定§!的§Y进展§!。"
 KRT_Republic_of_Texas: "拉拢孤星共和国"
 KRT_Republic_of_Texas_desc: "北方初期的装甲战和地面战持续了数天，在奥斯维因河上的强渡行动并不顺利，我们的两支装甲师成为了进攻尖刀，但北方军的陆行舰成为了难缠的高危目标，几座三联装405毫米炮台让数十公里范围内的目标都成为了精准炮击的靶子，在这样的轰击中我们损失惨重。\n\n对舰武器已经被装载到了坦克上，一种强大的，搭载有203毫米直射火炮的特殊坦克歼击车于昨日抵达了前线，它们可以抵近射击并在800米以内的距离贯穿陆行舰的装甲，数十辆这样快速突击的歼击车便可以摧毁陆行舰，不过我们与其在前线继续这样看不到头的消耗，还不如想法设法削弱北方军的力量。\n\n孤星共和国的几位首脑和将军在内战中表现出了观望的态度，我们完全可以拉拢他们重新加入中央一方，他们不会拒绝在这个关键时刻有利的谈判，不过我们可能也要出让更多的特权和自治权...但现在已经不是在意这个的时候，聪明的外交可以解决许多战场上解决不了的问题。"
 KRT_Republic_of_Texas_tt: "§Y孤星共和国§!将§G加入§!帝国的§R战争§!。"
 KRT_The_end_of_the_old_guard: "老将末路"
 KRT_The_end_of_the_old_guard_desc: "随着孤星共和国倒戈，战争的天平顷刻之间倒向了中央，科里亚特军队已经度过了奥斯维因河，我们的旗帜飘扬在高大的移动城市上空，坚定的士兵跟随着祖国母亲的吼声，解放着北方大大小小的城镇和村庄，更多的人民看清了谁才是为了他们利益着想的人，现在北方军只剩下投降一途。\n\n我们该考虑如何处置这些叛徒了，休伯特陛下的建议和前线军官的想法不可能相同，但是前线军官仍然可以行使一些私下权力，毕竟最后向陛下汇报的事情和实际情况不一定相同。赦免这些人可以最大程度的安抚北方军，让他们能更快的回归正轨，如果在北方军进行大扫荡的话...的确可以根除反对者和安德烈的政治势力，但是北方军也基本上被掏空了，这是一个艰难的抉择。"
 KRT_The_end_of_the_old_guard_tt: "帝国在§O北方边境§!的军事行动取得了§G决定性§!的§Y进展§!。"
 KRT_The_end_of_Fire_and_blood: "火与血的尽头"
 KRT_The_end_of_Fire_and_blood_desc: "在数个月的惨烈平定和战斗后，科里亚特终于重新安静下来，大灾变的伤痕还留在祖国大地上，从南到北一片萧条之态，这片废墟和瓦砾还需要漫长的时间去处理，我们的未来在何方？\n\n火焰熄灭，血液流干，剩下的只有一片一片绝望的躯壳在等待救赎。\n\n§R——亦或者新的毁灭。§!"
 KRT_The_end_of_Fire_and_blood_tt: "§R科里亚特内战§!的迎来了§Y最终阶段§!。"
 KRT_The_dust_has_long_since_fallen: "早已尘埃落幕"
 KRT_The_dust_has_long_since_fallen_desc: "南北捷报抵达首都，凯林登格勒进行了短暂的欢庆，帝国再次回到了皇帝陛下的手中，现在我们终于可以考虑如何处理大灾变留下的隐患...以及凯林登时代所种下的种种恶果了，休伯特一世遥望着祖国大地的地平线远端，眼中是新的道路和方向。\n\n帝国永恒，子民长存，希望永在，皇帝唯一。\n\n前进，科里亚特必将征服世界！"
 KRT_The_dust_has_long_since_fallen_tt: "§C新时代开始了！§!"
#精神
 KRT_Eternal_rule: "永恒统治"
 KRT_Eternal_rule_desc: "凯林登一世，科里亚特帝国宫廷没有人知道这位皇帝究竟执政了多久，又在中央核心城度过了多少磨人岁月，他的寿命无穷无尽，人们已经习惯了这样一位永恒的皇帝作为统治者，喜爱他的人将其奉若神明，而憎恶他的人将其视为最可怕的恶魔，作为泰拉世界的长生者，他的胆量和识人能力都被磨练到了恐怖的地步，相对的，没有人比他更加害怕失去权力，如果某天凯林登一世发现有人要密谋夺取他的皇位，§R他定将陷入连自己都无法想象的疯狂，然后让这个帝国血流成河。§!"
 KRT_Absolute_totalitarian_state: "绝对极权之国"
 KRT_Absolute_totalitarian_state_desc: "我们的绝大多数工厂和移动城市中的主要产业都被贵族把控，贵族们在这个国家拥有绝对的控制力，他们的爪牙和眼线也遍布每个角落，毫无疑问，在凯林登无穷无尽的统治下，贵族的权力已经被强化到了无可复加的地步，议会变成了贵族们肆意操纵的玩具，只不过是糊弄其他人的小把戏而已，在科里亚特，任何反抗贵族的行为都会瞬间灰飞烟灭，也不会有任何无法掌控的力量诞生。\n\n§R除非那位长生者死去，否则所有人都只能在长生者的铁腕统治下俯首称臣。§!"
 KRT_Absolute_totalitarian_state_tt: "无法训练部队、解散部队或编辑部队模板:§R是§!"
 KRT_Serious_corrupt_bureaucrats: "严重腐败的官僚"
 KRT_Serious_corrupt_bureaucrats_desc: "世界上没有什么比腐败行径更加令人痛恨，令人失望的是，我们的政府机构从上到下恰恰充满了这种无能和贪婪的官吏，他们费尽心机从帝国的一个个指令中牟利，从民用款项到军用开支，再到移动城市的日常维护，当地土帮酋长和贵族们互相包庇，帝国这些至关重要的款项经过一层层克扣盘剥，只有很少的一部分财富能够去到它本该去的地方，终有一天，这些寄生虫将令整个帝国追悔莫及，而这枚苦果只能由我们自己吞下。"
 KRT_A_second-class_citizen: "畸形公民制"
 KRT_A_second-class_citizen_desc: "所谓的“二等公民”是指感染者，罪犯，荒野流民，土邦奴隶，以及其他被视为下等人的天生残疾者，凯林登陛下对感染者的厌恶达到了一种近乎病态的情况，他不允许任何感染者在他的视野中出现，否则会将身边的侍卫立刻处死，久而久之，公民的概念已经被完全扭曲，对于帝国而言，有些人已经不再被法律保护，他们不过是为帝国劳作致死，讨口饭吃的下等人。"
 KRT_disaster_1: "大灾变"
 KRT_disaster_1_desc: "如今的科里亚特已不是用一句混乱就可形容的了。尽管最初爆发的只是皇室与政府高层的内乱，但战火很快就蔓延到了底层民众身上，接着是中央大区，再就是整个帝国......各路军阀政客肢解了帝国庞大的版图，科里亚特长久以来存在的诸多问题被无限放大；昔日艰苦但至少平静的生活已经变得可望不可及，睡一个安稳觉便是奢求——究竟有谁能告诉我们，帝国究竟还有哪里是安全的？"
 KRT_disaster_2: "大灾变"
 KRT_disaster_2_desc: "如今的科里亚特已不是用一句混乱就可形容的了。尽管最初爆发的只是皇室与政府高层的内乱，但战火很快就蔓延到了底层民众身上，接着是中央大区，再就是整个帝国......各路军阀政客肢解了帝国庞大的版图，科里亚特长久以来存在的诸多问题被无限放大；昔日艰苦但至少平静的生活已经变得可望不可及，睡一个安稳觉便是奢求——究竟有谁能告诉我们，帝国究竟还有哪里是安全的？"
 KRT_hobery_idea: "科里亚特·维尔德·休伯特一世"
 KRT_hobery_idea_desc: "随着新皇的登基，那些成天嚷嚷着让位和摄政的贵族们也不得不闭嘴了——皇帝的回归使紧急会议获得了其作为帝国唯一合法政府最好的证明。为了确保皇帝陛下的安全，紧急会议已经一众决定将其保护在帝国最坚固的要塞维尔德堡中，待到大灾变得到平定，皇帝自然会再次出现在他最忠诚的人民面前。"
 KRT_new_emperor_for_empire: "新皇登基"
 KRT_new_emperor_for_empire_desc: "伟大的休伯特陛下回到了他忠诚的科里亚特，一切终归平息，荣誉尽归休伯特一世！"
 KRT_incomplete_industry: "不完整的工业链"
 KRT_incomplete_industry_desc: "圣马丁的失陷使得我们难以继续维持原本庞大且完整的工业链，帝国变得更加困难了。"
 KRT_krrat_funds: "科里亚特资金"
 KRT_krrat_funds_desc: "来自科里亚特的资金可以丰富我们的国库，让我们能够将更多的精力投入到国家的建设中。"
 KRT_Airline_security: "科里亚特航线保障"
 KRT_Airline_security_desc: "帝国将会主动修建安全的贸易站并为我方舰队提供补给，这无疑将大大减轻我们对萨尔贡的贸易压力，哥伦比亚的陆行舰商队将不必绕过科里亚特，穿过遥远的西陆荒野抵达南陆，一条如此便利的航线将为我们带来极高的经济利益。\n\n§R如果哥伦比亚与科里亚特的关系破裂，这条便捷的航线将难以保持。§!"
 KRT_Maintain_trade_route: "《华雷兹-埃帕尔条约修正案》"
 KRT_Maintain_trade_route_desc: "尽管《条约》必将加大帝国的财政压力，但是对于国际政治而言，它亦是化解危机的良药。\n\n§R如果哥伦比亚与科里亚特的关系破裂，我们也不必再维持这条劳民伤财的航线了......§!"
 KRT_Sargon: "拉拢萨尔贡人"
 KRT_Sargon_desc: "一年土邦的全部农业税，足以让那群贪心的萨尔贡佬闭嘴。"
 KRT_Beat_the_Southern_War_Drum_ideas: "南方战鼓"
