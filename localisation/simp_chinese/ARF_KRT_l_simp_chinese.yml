 decision_1094_krt.3: "调整负责人"
 decision_1094_krt.3.t: "调整负责人"
 decision_1094_krt.3.d: " 凯林登陛下决定考察目前工业计划项目的负责人，目前有两个待选人，克里·羽在维尔德贵族皇朝派的影响力匪浅，她能大大推进初始资金的筹措工作；康斯坦丁·亚索伯也可以前往工地监督，并动用他的影响力在各个地区拉拢人手，这对我们的建筑进度大有帮助。\n工业部报告了当前的计划现状，侍从们一板一眼不敢发出任何声响打断皇帝的思绪，凯林登面无表情审阅着报告上的字眼，沉默良久后，对侍从下达了自己的指令。"
 decision_1094_krt.3.a: "克里·羽将成为项目主管，并主持工业计划的资金筹措。"
 decision_1094_krt.3.b: "康斯坦丁·亚索伯将成为项目主管，并推进项目的建设工作。"
 decision_1094_krt.3.tt.1: "效果：每月资金筹备程度增长§G+5.00%§!"
 decision_1094_krt.3.tt.2: "效果：每月工业区建设速率§G+5.00%§!"
 decision_1094_krt.4: "进度汇报"
 decision_1094_krt.4.t: "进度汇报"
 decision_1094_krt.4.d: "克里·羽带着不安的心情敲了三下大门，这个富丽堂皇的宫殿背后是帝国最具权威的皇帝陛下，她现在所思所想就是赶紧把这个项目进度报告给陛下，然后结束繁忙苦闷的监督工作。这也是亚索伯大人所想的事，他们两个人能在这件事情上达成一致可太难得了，她思索着与现在无关的事情，如果休伯特大人能在这里，他会如何处理国内的工业问题呢，克里·羽逐渐神游天外，直到皇帝的声音把她拉回现实。\n“走进来！”厚重的檀木大门背后传来了皇帝洪亮有力的声音，这个声音每次都能让无数臣民鞠躬致意，她自然也不例外。\n克里·羽聚精会神，在心里提醒自己绝对不能出任何岔子，做足了心理准备才推开大门走进了皇帝的寝宫，“陛下，我们的工程计划已经完成，忙碌了几个月的工人们已经高兴的准备回家了，您随时可以去检阅我们的成果。”\n凯林登一世那苍凉有力的目光在眼前的女人身上扫过，克里·羽不敢与其对视，两人之间的气氛稍有沉默，停顿了几秒钟后皇帝才满意的点了点头，先是一些例行的夸赞话，然后提到了帝国财阀们不遗余力的支持和援助，在这个长篇大论的过程中，克里·羽一直都心不在焉的听着，皇帝说完很多事，最后才用有点疲劳的声音嘶哑道：“很好，帝国应该奖励那些兢兢业业的工人，但是感染者不行，那些肮脏的臭虫只会听信异端邪说，妄图在帝国内制造恐慌和混乱！”\n“所有被查明是感染者的工人必须送入隔离区！不能容忍任何宽恕行径，那些人只会在首都扩散谣言，让人们恐惧，我们有义务杜绝感染者给帝国带来的种种威胁！”\n“但是陛下——”\n克里·羽震惊的抬起头，努力张嘴想要反驳一些事情，她这段日子相当清楚有多少工人成为了感染者，实际上这个数字几乎是全部，难道帝国要把这些用双手建成未来的辛勤付出者全都送进无人问津的隔离区？这未免也太过荒谬可笑，哪里还有什么奖赏可言，这样做会寒了多少人的心，谁在成为感染者以前不是帝国的子民呢？她已经不敢想这样做会有什么后果了，但皇帝的固执也超出了她的想象。\n“不用说了，克里·羽，还是说你其实对肮脏的感染者抱有同情？”凯林登一世的声音愈发阴森，他不想听见任何反驳的话语，尤其是出自贵族或其他议员的异议。克里·羽的心仿佛被无形的大手攥住了，从脚尖一路冷到了心里，她只好用顺从的态度去面对皇帝，在心里暗暗叹息，以免在这里就被凯林登视为“异见者”，那都不会有什么好下场的。"
 decision_1094_krt.4.a: "终于……工程结束了。"

#皇储决议事件
 decision_krt.3: "调查队正在行动"
 decision_krt.3.t: "调查队正在行动"
 decision_krt.3.d: "向伟大的紧急议会致敬：\n我们的调查小队已经按照你的指示出发了，迈因长官正在调动所有可用资源支持调查任务，我们的工作很可能会持续两周时间，由于城区内部情况复杂，期间暂时无法执行其他任务，相信休伯特皇储的线索很快就会水落石出。\n大科里亚特万岁！愿祖国从阴影中早日走出！\n——特别调查小队上级指挥官安德尔森。"
 decision_krt.3.a: "我们等待着调查队的好消息。"
 decision_krt.4: "幸存者"
 decision_krt.4.t: "幸存者"
 decision_krt.4.d: "“快！这里还有人活着！”\n嘈杂的喊叫引来了几名调查队员，拉尔森咬牙低下身子，用他已经严重磨损的手套去扣挖那些无比沉重的石砖，这对他来说风险性极大，大灾变过后，整座城市都被那些放射性的活性源石所侵染，这样大胆的行为很可能导致他最终羁患矿石病，谁都知道那样会带来不幸。\n“快点！我说这里他妈的有活人！你们都是死人吗？！”\n几个队员先是犹豫片刻，驻足在原地迟疑不前，他们怀疑那个地方还能否有任何幸存者存在，但是拉尔森歇斯里底的吼叫随后让他们个个不再迟疑，快步上前拿起工具帮忙，到了这个时候，谁还在乎他妈的矿石病会怎么样？\n挖掘持续到了深夜，拉尔森是正确的，探险队员从这个废墟中救出了一位沃尔珀女人，她的小腿已经被重约一吨的石板牢牢压在下面，她泣不成声，自己的两个孩子都在大灾变中遇难，尽管她用尽全力，但那些石板还是从身体的缝隙穿过，将她的两个孩子砸的血肉模糊，这让她的表情愈发感伤无力。队员们不得不动用电锯强行破除形状可怕的石板，并尽可能的无视她身下的那两具小小的尸体。\n“他们……他们都变的血淋淋的……面目全非，我让他们跑……但是，但是……”妇人掩面哭泣。\n“没事了夫人，已经没事了……”\n黎明将至，疲惫的拉尔森颤抖着走回营地，他的双手血迹斑斑，第二天，队员们听说了他不幸患上了矿石病的消息。他彻夜未眠，痛苦的低声呐喊回荡在营地之内。"
 decision_krt.4.a: "将生死置之度外，也就不会再恐惧。"
 decision_krt.4.tt: "开启下一城区"
 decision_krt.5: "酸液源石虫"
 decision_krt.5.t: "酸液源石虫"
 decision_krt.5.d: "调查队小心翼翼的穿过新乡区的田埂，这里的农耕区已经在大灾变可怖的爆炸中沦为废土，变成了一片蔓延着灼烧余烬的梦魇，初生的田苗也被极致高温烧死在了田野之间，安德尔森皱起眉头，他在一个拐角发现了不太明显的黑影，随后在调查队的低声惊呼中，一小簇明黄色的酸液从暗处喷射出来，安德尔森堪堪偏过头，才免于被这簇酸液击中面颊！\n后面跟随的弩手开火了，术士也迅速拔出武器开始反击，几个爆炸性的源石技艺在黑暗中爆炸，点亮了安德尔森的视野，他不自然的眨了眨酸涩的眼眶，踏着几只源石虫尸骨无存的残骸，看到了新乡区的可怕一幕……\n无数尸体如同林立的小山包，也像是夜空下照耀的细碎海沙，密密麻麻分布在新乡区那血红色的土壤中，他们层层叠叠镶嵌在土地中，上面盘踞着涌动的源石虫群，逐渐将那些血色浸染成更为深邃的颜色。死在这里的人能有多少？万人，数十万人？可能他们永远也无法统计出那个具体的数字，而他们这一刻所看见的震惊一幕也会逐渐在历史洪流中被抹去，变成无人知晓的几声感慨。\n悉悉索索，悉悉索索，原地只留下那些源石虫巢穴的涌动之声。\n“天啊，这……”不少调查队员忍不住惊叹，少许有抽泣声从队伍中溢出，安德尔森咬着牙，死死攥住自己的拳头，他两眼血红，一字一顿面朝所有调查队员咆哮着：“每个科里亚特人都应该记住这一天，记住大灾变的这一幕！记住这可耻的一天！没有什么能击败科里亚特人！只有我们自己创造的灾难！”\n安德尔森一声令下，数十名突击队员抄起武器冲了上去，在源石虫巢展开了一场血腥的屠杀，火光辉映，照亮了整片繁星闪烁的夜空。那些源石虫也全部被调查队化为相似的枯骨。"
 decision_krt.5.a: "我们已经没有什么能失去。"
 decision_krt.5.tt: "开启下一城区"
 decision_krt.6: "阶级遗毒？"
 decision_krt.6.t: "阶级遗毒？"
 decision_krt.6.d: "拉尔森垂头丧气的走在西兰区的街道上，没精打采的随便铲了几铁锹，他没有注意到这片荒无人烟的贵族居所有任何有用的补给品值得回收，这里的一切都毁灭的太彻底，一支硕大的广告牌砸在了路边的车上，上面是某个维多利亚苗条的明星所写下的广告词，为一瓶汐斯塔的名牌海产代言，看起来颇为滑稽。另外几名调查员则一脸轻松的讨论着今晚基地的热汤，真是闲适慵懒。\n突然，不太美妙的叫声打破了调查队的平静，“贱民！说你呢！快点来帮我！”这吓了所有人一跳，拉尔森皱起眉头，打量着不远处个子不是很高的金发女孩子在挣扎，她的腿被压在厚重的大理石柱下面了。尽管她的声音很清脆好听，但说的话可就不是那么一回事了。\n“你骂谁贱民？”几个调查员变了脸色，有人当即撸起袖子，生气的围了过去。\n这女孩怒意不减反增，似乎完全不惧怕周围这些凶神恶煞的调查队员，“就是你！还敢跟我讨价还价，知道我是谁吗？我是莉斯芬家族的长女，你们不要命了吗？快点过来帮我！不然我就把你们全都关进铁牢！”\n听到莉斯芬家族，在场的几名调查员脸色都稍稍变了变，有几个胆子不是很大的甚至向后退了几步。“这些贵族佬没一个是好东西。”愤愤不平的队员朝着拉尔森抱怨起来，有人声称见过莉斯芬家族曾经折磨无辜感染者的场景，他们不希望救这个不客气的贵族崽子。\n拉尔森皱起眉头，盯着女孩柔嫩的脸蛋思索片刻。很显然，这个贵族女孩平时可能少不了飞扬跋扈的行径，莉斯芬家族也基本上全都是不折不扣的混蛋，站在调查队员的角度来看，救她无疑是件令人不爽的事情，但他们此行的目的就是救援幸存者，那么现在……\n在调查队员们还在犹豫时，盯着金发女孩的亮蓝色眸子，拉尔森终于开口了："
 decision_krt.6.a: "“让这个贱人就这么烂在这儿吧！”"
 decision_krt.6.b: "“拉她出来。”"
 decision_krt.6.tt.1: "杀了她。"
 decision_krt.6.tt.2: "让善良之光闪烁，救下这个贵族女孩。"
 decision_krt.7: "死去的贵族女孩"
 decision_krt.7.t: "死去的贵族女孩"
 decision_krt.7.d: "望着调查队员讥讽的目光，莉莉丝不可置信的瞪大眼眸，她没想过这些人敢违背她的命令，要知道在中央-核心城这个让所有科里亚特人畏惧的西陆明珠，莉斯芬家族可是为数不多能在凯林登陛下面前说出话的维尔德贵族，现在这些人怎么就能这样理所应当的无视她？她现在该怎么办？恳求吗？\n当他们真的转身离去，莉莉丝才慌乱起来，意识到自己犯下了多么可怕的错误，她的身份地位，她的名望财富，她的贵族教育和知书达理在这一刻都没用了，她固执的在所有人面前要维护家族尊严，下场就是如此，她已经整整两天滴水未进，这让自己有种头晕目眩的感觉……如果他们不帮忙的话，她肯定会……她肯定会死的！\n“不，你们……我错了，你们快回来！我真的已经快——呜呜呜呜！”\n贵族女孩带着抽泣和悔恨的声音无人在意，莉莉丝无比后悔，她也有自己的梦想，她所爱的人和爱她的人，她想成为世界一流的钢琴家，让自己的旋律回响在整片大地上每一个人的脑海中，现在这些梦想都再无可能实现了，随着眼前的视野愈发昏暗，女孩发疯一般用拳头徒劳的砸在厚重的石柱上。直砸的血肉模糊看不出原本的样子。\n几天后，另一支调查队在这里发现了乌萨斯女孩干瘪的尸体，整个人已经开始腐败。\n她瞪大眼睛，从里面却只能看到灰霾，原本漂亮的脸蛋也满是恐惧，人们唏嘘着将她的眼睛合上，又为其整理了落满灰尘的淡金长发。将她从死亡之地拉了出来在地上拖行，就像是拖着破烂的米袋子。"
 decision_krt.7.a: "遇难者统计列表又要加一位了。"
 decision_krt.7.tt: "或许有些秘密与她永远被埋葬在这里了。"
 decision_krt.8: "莉莉丝"
 decision_krt.8.t: "莉莉丝"
 decision_krt.8.d: "在调查队员不情不愿地将她从这里救出来的这段时间，莉莉丝都从内而外的松了口气，她在说出那番不客气的言论后就陷入到了纠结当中，自己并不是没意识到现在她的处境有多糟糕，但她的贵族身份不允许她低三下四的向那些低等人求救,在任何时候都要保持维尔德贵族的威严和身份，这是莉莉丝在十八年的贵族教育中所学到的东西，就如同凯林登陛下所说，他们天生就注定统治那些二等人。\n但当这些调查队员眼里露出厌恶和轻蔑的表情后，莉莉丝其实就已经后悔了，如果他们真的扔下自己怎么办？如果他们打算对她做出可怕的事情怎么办？她的性格与那些哥哥们并不完全相似，她虽然也抱有家族中的偏激和傲气，但那不过是迎合附近的环境而已，很大程度都是刻意伪装出飞扬跋扈的一面以规避其他人的指责和异样的目光。在夜深人静之时，她经常会为自己在白天做下的某些事情而无地自容。这或许就是她性格与身份的矛盾。\n“咳。”被扶住的女孩脚踝上破了一层皮，血淋淋的，身上的那件华丽长裙也早就在大灾变中基本报废，只剩下几片肮脏的布匹和内衣还勉强挂在身上，莉莉丝红着脸咳嗽了几声，用几乎听不到的声音低低说，“谢谢你们。”\n拉尔森没什么好脸色，阴婺的瞥了她几眼，天知道自己是不是脑子多了点毛病还是少了点零件，他将一件临时的衣服甩给她，似乎大了一号，但也无所谓，反正现在没有更好的丝绸套在她身上了，莉莉丝尴尬的将其捏住，不知所措的站在原地发愣。她还没有试过多少件天鹅绒和上等绸缎制成的礼服以外的衣服。\n“穿上，大小姐，然后赶紧跟上我们，我们今天有既定任务，没时间伺候你。”拉尔森说完，自顾自朝着更远的地方走去，调查队员们不禁讽笑几声，朝着莉莉丝揶揄起来，“嘿嘿吼，大小姐，你们的好日子算是结束了，告诉我们，你叫什么？”\n“莉莉丝·贝尔德加·莉斯芬”莉莉丝不好意思的挠了挠头，她想起自己在学校自我介绍的笨拙摸样了，嘴角微微翘起，思绪也不禁渐渐飘远。\n“啧！”几个调查队员面面相觑。"
 decision_krt.8.a: "莉莉丝小姐，你暂时是一号幸存者了。"
 decision_krt.8.tt: "我们救下了这个贵族女孩。"
 decision_krt.9: "斯诺河上的金辉"
 decision_krt.9.t: "斯诺河上的金辉"
 decision_krt.9.d: "“唉，我以前很喜欢到这里来玩的。”弥塞尔怅然若失的嘀咕着，有点紧张的盯着六米高的狰狞黑色晶体指向天际，作为二等公民，他也被紧急会议征召到了拾荒者的队伍中，在目前的紧急状态中，所有人不管男女老少都要为首都奉献一份心力，这大概是整个中央核心城最团结的时候了。\n首都已经成为了活性源石肆意扩张的乐园，无数肆意扩散的源石深扎地下，移动城市内的居民很难想象有源石能生长到这个程度。那看起来就像是恶魔投射下来的两抹阴影，完全遮盖了头顶的日光，空气中也弥漫着无数看不见的源石粉尘，这片大地上最危险的物质，丝毫不掩饰的朝人类展现了其本身的可怖本质。\n“嘿！我们准备好了，现在出发！”\n“小伙子们全都注意了！不要碰到那些活性源石，做好防护！不然在这里突发急性矿石病可没人能救得了你！”\n“两人一队，找到物资后装进包裹，天黑前回到这里，小心源石生物，前进，为了科里亚特！”城防军的长官吹响了口哨，调查队佩戴了基本的防护装备，开始硬着头皮前进，如果不在废墟中找到有用的资源，那他们恐怕撑不到其他人发现这里的情况。\n弥塞尔微微思忖，这个谨小慎微的鲁珀随意朝队友搭起话茬：“找到东西后我们平分？”帕斯玛咧嘴一笑，让这个脸上长满癞子的萨弗拉老男人看起来有些滑稽：“好啊，我七你三？”\n“想得美。”弥塞尔撇了撇嘴，背起铁铲快速跟上了他的脚步，二等公民的食物分配本来就少的可怜，多一张嘴可真是要了命，以为他会妥协吗？\n天黑前，两人幸运的从商场废墟里找到了四箱完好的罐装面包，两人七三分，除此之外，他们还发现了一条还没倒塌的隧道，似乎直通内城区的部分街道，真是走运极了。"
 decision_krt.9.a: "再见啦，斯诺河。"
 decision_krt.9.tt: "开启下一城区"
 decision_krt.10: "火星"
 decision_krt.10.t: "火星"
 decision_krt.10.d: "新伦隔离桥，下午三点，缓慢拾荒前进的调查队终于集结在了桥梁外围，他们略带敬畏的望着凯林登陛下铸造起的巨型壁垒，感叹这道工程是多么壮观庞大。也难怪首都几十年来没有发生过任何暴动事件，这道墙要不是由于内部叛乱，根本无从攻破，城防炮就会消灭一切敢于挑战它的东西。\n安德尔森叹了口气，将地面上的弩弹捡起，低声说，“真的么？再往前会很严重？”他对面的工程师满脸苦笑的点了点头，然后继续说了下去，“内城区因为距离源石锅炉的爆炸位置最近，所以源石粉尘的浓度也格外的高。”他说完，又若有所指的看了看内城区上空那片不散的黑色阴霾。\n“如果调查队要进入城区，势必会遭受严峻的辐射，强度会是外城区的几十倍。”工程师的话让在场的队员全都浑身冒起鸡皮疙瘩，他们似乎能感觉到源石寄生在自己体内攀爬的情况了。\n拉尔森咽了咽口水，他倒是没什么好害怕的，反正自己是矿石病患者，再不济也就是更严重一点，成为了感染者，矿石病发展到什么程度其实大差不差，他揶揄道：“以前我一次都没进过内城区，这次还不赶紧大饱眼福？”\n帕斯玛的脸色苍白无光，他一点都不想进内城区，那源自一次不美好的经历，他只是靠近那道巨壁就被贵族侍从打了个半死，那番苦难导致他现在看到这面巨壁都有点腿脚哆嗦。\n“前进，我们该出发了。”安德尔森咬了咬牙，将自己的防护面具戴上，率先踏入了粉尘弥漫的内城区，这里是真正的死亡之地，也可能是泰拉世界目前最危险的地区之一了，不亚于天灾后创造出的贫瘠废土。"
 decision_krt.10.a: "他丢掉了弩弹，在地面撞出一缕微弱的火星。"
 decision_krt.10.tt: "开启下一城区"
 decision_krt.11: "英雄"
 decision_krt.11.t: "英雄"
 decision_krt.11.d: "“一队！火力压制！二队，给我绕到侧翼，找机会攻击它的弱点，所有人都不要暴露在电浆范围下！如果不想变成秃皮猴子！”安德尔森破口大骂，顺便给自己冒烟的劲弩再装填，他现在真希望一辆装甲车能给自己提供支援。\n“这他妈的够不够刺激，够不够激情！帕斯玛！把那玩意儿接住！”弥塞尔大喊几声，从街道上飞快跑过，中央区枪弹遍地，弩箭从他的头顶刮擦而过，而仅仅几秒后高温电浆就射在了原地，将那块街道打出了猩红色的熔岩深坑。\n帕斯玛屁滚尿流的从地上爬了起来，扶了扶自己头上的钢盔，刚才它挡住了一块致命的高速石子，救了他一条小命：“我知道！我知道啊！”\n电浆源石怪物，电浆怪，电浆巨兽——总之怎么称呼那东西都行，大灾变创造出的这种怪物出现在中央城区，严重影响到了调查队进展，在略作斟酌后，安德尔森决定派出歼击小队干掉这头婊子养的畜生。\n终于！在那怪物的第二口电浆从狰狞的口器中喷射出来前，帕斯玛就握住了那枚关键的源石炸弹，然后将他丢给了安德尔森：“队长！接着！”\n在失去了几名队员的生命后，安德尔森终于将炸弹扔到了那只该死源石虫的脚下，随着爆炸的火光将那只三米高的庞然大物点燃覆盖，阻挡道路的最后一个碍事鬼终于消散，然后呻吟哀嚎和惨叫声才终于盖过了怪物衰弱的嘶鸣。真是谢天谢地，都结束了。\n“嗨，队长你在写什么？”弥塞尔松了口气，带着满身的冷汗走向安德尔森，这次经历过后要是他还能活下来，他能吹一辈子。\n“这个。”安德尔森咬着笔，在一张带有灰白照片的本子上面写下几个名字，那是牺牲的调查队员，“他们都是英雄，不应该被我们遗忘。”"
 decision_krt.11.a: "大家都沉默下来，随后无言动身。"
 decision_krt.11.tt: "开启下一城区"
 decision_krt.12: "引爆"
 decision_krt.12.t: "引爆"
 decision_krt.12.d: "接近城市的核心区后，这里实际上已经是大灾变的中心地带，当那股势不可挡的源石爆炸摧毁一切之时，强大的电磁风暴同时破坏了数十公里范围内的电子器械，然后在这里创造了一个强大的干扰源，强劲的源石辐射令人忧心。\n“哈，凯林登那老东西绝对想不到我们这群下等人现在可以这样嘲讽他。”弥塞尔忍不住阴阳怪气，调侃着附近的废墟。\n源石粉尘的浓度已经高到可怕，空气中弥漫着腐败的黑色物质，有点像是浓汤的沉淀物或者是秋天的棉絮，如果不是他们全身都穿着防护服，皮肤暴露在这种源石环境下仅仅几秒就会黑化溃烂，要不然就是吸入粉尘然后被急性矿石病活活折磨致死，总之这里危机四伏，导致在黑色灰霾前进的每个人都在手里捏了一把冷汗。\n“通讯器已经失效了，队长。”拉尔森叹息几声，他们不能继续依靠电子设备了，现在从这里联系基地传来的都是杂音，防护面具让他闷热难耐，他只能依靠自己顽强的意志力才能在几近窒息的情况下继续前进，“我们得谈谈，这样下去会迷路的。”\n安德尔森抬起头，望了望头顶的灰霾说：“我们如果用火焰引爆这里的黑色气雾，你觉得能不能有人幸存？”\n“你疯了吧？”拉尔森质疑说，很显然无论从哪个方向来看这都堪称荒唐，在活性源石堆中间引爆它们，这还能活吗？\n不过在调查队内部的讨论下，安德尔森认为只要在合适的掩护下，他们能在源石爆炸中幸存，只要驱散核心区这些无孔不入的黑雾，相比继续前进就要安全的多，因此所有人都开始在附近加固掩体，出于对队长的绝对信任。"
 decision_krt.12.a: "开始挖吧。"
 decision_krt.12.tt: "开启下一城区"
 decision_krt.13: "灰霾逐梦之人"
 decision_krt.13.t: "灰霾逐梦之人"
 decision_krt.13.d: "爆炸很成功，在驱散了核心区的气雾和堵住道路的活性源石后，调查队伍终于站在了白夜别墅的门外，安德尔森若有所思，拉尔森面色疲惫，弥塞尔正在与帕斯玛拆下残破的大门，其他队员则开始警戒派出别墅周围的源石生物。\n“我们真的能在这里找到线索吗？”拉尔森忧心忡忡，这座老别墅看起来已经毁的不成样子，它的结构有六层，占地面积也有几个篮球场那么大，但他现在却在担心调查队能不能踩着腐化的地板走上二楼这个问题，“而且休伯特皇储的线索为什么会在这里？我们根本毫无根据啊！”\n安德尔森郑重面对着他解释说：“会在，也必须在这里，根据迈因长官的情报，霍夫曼曾经计划过刺杀休伯特皇储，他肯定会在这里留下些蛛丝马迹。”\n拉尔森苦笑几声，这个理由真是太没有说服力了，他忍不住反问：“那要是没有呢？我们怎么办？”\n“那就白来了？那些死去的人也都白死了？”\n安德尔森沉默，他确实没办法给出任何保证，如果霍夫曼那个混蛋真的做的天衣无缝，在计划完成后还将所有的痕迹全部消除的干干净净，那他们确实只能白来一趟，而且寻找休伯特皇储下落的行动也只能泡汤，但他们既然站在这里，不就是为了那个可能性而拼上性命的吗？\n“休伯特陛下真的能比凯林登陛下更看重我们？”拉尔森忍不住说，“如果他仍然把我们看成是下等人，那我们今天所做的事情真的是可笑之极。”\n安德尔森不言，据说休伯特皇储对所有人都一视同仁，他的想法与凯林登陛下和所有维尔德贵族都不甚相同，但谁知道呢？在真正即位前，所有的话都可能是敷衍之举，他们也只能心怀期待，他们都身处灰霾深处，若能尽力迎到光芒便已足矣。\n轰——！大门被炸了开来，露出了白夜别墅内的情况，队员们怀着忐忑不安的心情冲了进去，然后又是针对源石生物无穷无尽的战斗。"
 decision_krt.13.a: "我们都是灰霾逐梦之人。"
 decision_krt.13.tt: "开启下一城区"
 decision_krt.14: "地下区划？"
 decision_krt.14.t: "地下区划？"
 decision_krt.14.d: "“呃，莉莉丝小姐，能说一下什么叫秘密区划么？拉尔森有点无奈的擦着头上的冷汗，瞧着旁边满头大汗，帮着搬运工具的少女简单问道。实际上这个女孩倒是没有刚见面时那样刁蛮了，真是有够奇怪的。\n莉莉丝面有困扰，小声回答，“其实我也了解的不是很多，只知道这是家族在城市地基之下开凿的区域而已，专门用来建设一些用来娱乐的地方，我知道那里有一个大泳池，呃，可能还有地下赌场什么的。”\n调查队员们只能感慨几声富人的世界他们不懂，拉尔森不禁自嘲，“这帮贵族他妈成天都快玩出花来了，我们还在穷的从屁眼子里往外扣钱，真是有够操蛋的。”莉莉丝尴尬不已，听着这些粗鄙之语脸色微微发红。\n没过太长时间，调查队成功在这里开出了一个缺口，通过这个狭窄的隧道足足用了足足十分钟，正当他们怀疑这条路到底能不能走到尽头的时候，拉尔森揉了揉眼睛，不可置信的发现前方出现了一抹亮光。\n“神明在上啊！这简直就是地下宝藏！”所有人惊呼道，他们看到了巨大的地下镂空设施，这里的绝大部分结构还保持完好，连空气也不像是外面的核心区那样浑浊不堪，他们甚至还发现了一个军械库，如果回收这里的有用物资，那绝对会是巨大的帮助。\n莉莉丝吃力的捡起一把散落在地近卫剑刃，不好意思的挠了挠头：“抱歉哦，其实我也不熟悉这里的道路，所以我们可能要一起探索了。”\n拉尔森愉悦极了：“干的好啊，贵族小姐。”那么现在该如何处置这个巨大的地下区域呢？"
 decision_krt.14.a: "将这里有用的东西全部搬走用于补充我们的损失"
 decision_krt.14.b: "暂且封存这里吧"
 decision_krt.14.tt.1: "开启下一城区"
 decision_krt.14.tt.2: "我们没有移动中央-核心城的地下设施，它们在未来可能会有其他作用的\n开启下一城区"
 decision_krt.15: "科里亚特权杖？"
 decision_krt.15.t: "科里亚特权杖？"
 decision_krt.15.d: "权杖，自古以来皇帝的身份象征之一，所谓的科里亚特权杖其实是凯林登陛下委托几个有名的维多利亚工匠花重金打造的，上面镶嵌了十二枚来自整片大地最优质的红宝石，整体构造有些类似于莱塔尼亚权杖“游禽弦音”，但是凯林登陛下相当讨厌有人这么说，把私下讨论皇冠的人全都割了舌头，自此以后就再也没人敢讨论这件事情了。\n“为什么我们要来干这种事情啊？没了权杖再造一把不好吗？”拉尔森相当郁闷，他想狠狠的把提出找权杖的家伙来两拳。\n莉莉丝微微侧目，她忍不住吐槽道：“再造一根？你是不是以为像那种用来施术的权杖是随便找两个赤金什么的打成一根棍子就行了？”\n“不是吗？”拉尔森反问，这让莉莉丝相当无奈，她不想跟这个可能一点教育都没受过的大老粗解释复杂的源石技艺原理和实相物质的相关知识，但是他一遍遍用他那低级到令人抓狂的理解来侮辱她的智商，让少女现在相当想给他两拳，可惜她打不过这个大兵……\n“想开点吧，比如找到权杖后你们的上司没准会给你加薪？”为了不让拉尔森继续叨咕为什么权杖不能再造一支这种低级问题，莉莉丝及时岔开了话题。\n“哈，加薪？这个世界上原来有这个词汇？”拉尔森阴阳怪气，整个人的表情垮了下来。\n莉莉丝默默腹诽，穷人的世界她可能也不是很懂，只能默默辗转于科里亚特宫废墟，寄希望于那把权杖幸运的保存了下来。"
 decision_krt.15.a: "哈，太幸运了，他们在废墟的一角发现了权杖的残骸。"
 decision_krt.15.tt: "开启下一城区"
 decision_krt.16: "解脱？"
 decision_krt.16.t: "解脱？"
 decision_krt.16.d: "“哇哇哇，拉尔森救命哇！这里有一个怪人，呜噫噫噫！！”\n鬼哭狼嚎的贵族少女一溜烟躲在了拉尔森后面，莉莉丝吓坏了，她以为自己发现了什么幸存者，但是当兴冲冲的女孩跑到那个人面前，他回过头露出的却是可怕的源石晶体，数不清的活性源石遍布在他的身上，几乎没有一寸完好的皮肤可言，莉莉丝猜想如果去测试他的血液源石浓度，可能测试出来的反而可能是“源石血液浓度”这样子。\n调查队如临大敌，拉尔森心神巨震，源石化到了这个程度，为什么还能这样行动？这简直不可思议！任何源石侵蚀程度只要超过10%基本就会导致死亡了，这个人现在竟然在和源石共生！\n他咬牙拔出了腰间的铳弩，指着这个看起来不怎么好看的人形怪物：“站在那里，先生！否则我们就要开火了！”出乎意料的是那个怪物真的停下了，他竟然能口吐人言：“我，求求你们，给我一个解脱！”\n“痛苦……难以想象的……痛苦，我疼啊——！！”这怪物声嘶力竭的用沙哑的乌萨斯语吼叫着，将他身上的血红色活性源石如同活塞迸射般四处喷射。\n莉莉丝脸色惨白，调查队员们的冷汗浸湿了衣衫，这场面实在是太过诡异，他们纷纷等待着拉尔森的指令。"
 decision_krt.16.a: "“可恶，杀了这个怪物！”"
 decision_krt.16.b: "“别开火！它是一个不可思议的存在！”"
 decision_krt.16.tt.1: "我们将处决怪物"
 decision_krt.16.tt.2: "我们将试图制服怪物"
 decision_krt.17: "击杀"
 decision_krt.17.t: "击杀"
 decision_krt.17.d: "“可恶！杀了这个怪物！”\n随着一连串急促的开火，弩弹和源石技艺纷纷击中了这个扭曲蠕动的诡异生物，它彻底失去了人声，在嘶哑的无意义吼叫中倒了下去，随着第二轮和第三轮的补射击，拉尔森听见了它发出若有似无的呢喃。\n“谢谢……谢谢你们……”\n在火焰中，这个堕落的灵魂逐渐和血色源石一同焚为灰烬，莉莉丝跪倒在地，伤心的捂脸抽噎：“愿神明保佑你。”拉尔森站在她身边，无言的安慰着少女的内心，他们只是做了应该做的事情。"
 decision_krt.17.a: "这个可怜人迎来了解脱。"
 decision_krt.17.tt: "开启下一城区"
 decision_krt.18: "哀鸣"
 decision_krt.18.t: "哀鸣"
 decision_krt.18.d: "“啊啊啊啊！”\n电击，这种简单有效的源石技艺在瘫痪生物行动方面着实有效，拉尔森下令一部分术士上前用法术迟缓它的行动，一方面其他人则开始着手请求支援，至少搞来坚韧到足以将这东西困住的网或是什么别的，他们的努力没有白费，伴随着怪物的行动逐渐僵硬，几名队员合力把厚实的兽皮罩在了它的身上，然后打了几个死结。\n当然了，他们还需要其他容器，里面还在发出一声声不甘的吼叫，宛如什么大型野兽，拉尔森擦了擦脸上的冷汗：“这下我们的学者可能要大开眼界了，他们的源石生物理论估计要碎的稀巴烂，就算是源石虫也不可能源石化到这样彻底的地步。”\n莉莉丝莫名感到悲伤，小声嘀咕起来：“这样的话……我们就这样把它带回去？”\n“不行，太危险了，至少要等为它专门定制一个坚固的容器。”拉尔森急促说。\n莉莉丝抖了抖，低下头不再多说什么了，她只希望不会闹出什么乱子。"
 decision_krt.18.a: "即便是源石也要屈服于大科里亚特"
 decision_krt.18.tt: "我们制服了怪物，这可能在未来会有用的。\n开启下一城区"
 decision_krt.19: "终点站"
 decision_krt.19.t: "终点站"
 decision_krt.19.d: "安德尔森悸动不已，调查队埋着头在废墟上挖掘了几天时间，他们已经精疲力尽，在这期间，他们又亲手埋葬了数十名队友，好在这些牺牲没有白费，当拉尔森将那只被泥土覆盖的留声机放到他的手中，所有调查队员都围拢了过来！\n“拜托，老天给个面子，千万别出什么问题。”弥塞尔嘴里止不住的嘟哝着，把迄今为止所有的神明都赞美了一遍，工程师面色凝重的低下身子，将那个精巧的装置仔细检查，然后紧张的维修工作持续了几十分钟，这个小巧的留声机没有在大灾变中解体真是万幸！\n安德尔森则在怔怔的幻想，如果这个东西真的坏了，或者里面没有存在任何有价值的消息，那他们该怎么办？休伯特皇储无从寻找，帝国最大的可能性就是在维尔德贵族里挑选一个众望所归的人继承皇位，那样的话什么都不会改变，以往的生活又会回来，只不过是从一个绝境跳入另一个绝境而已，这未眠太令人沮丧，而站起来抵抗，他们又只能沦落到和那些荒野游击队相同的窘境。\n在他纠结万分的过程中，那留声机响了，霍夫曼和杀手的对话清晰的从中传出，刹那之间，调查队的欢呼声刺破了整片天。拉塞尔蹦到了弥塞尔的怀里，而帕斯玛则兴奋到原地蹦高。他们的探索和漫长的远征就此结束了！\n“哈哈哈！好啊！万岁！！”\n在欢呼中，安德尔森留下了释然的泪水，那些泪珠融化到了每个人心里。"
 decision_krt.19.a: "我们可以自豪的宣称，我们征服了大灾变！"
 decision_krt.19.tt: "调查结束"
 decision_krt.20: "鲜血结晶"
 decision_krt.20.t: "鲜血结晶"
 decision_krt.20.d: "首都的荒野之外，克里·羽彻夜未眠，调查队已经出发了整整数个月，他们奉命去搜查霍夫曼的旧豪宅以及旧议会废墟上可能出现的线索，那里位于在大灾变时损毁最为严重的中央城区，调查队全都是精挑细选的城防军精英士兵，还有一部分科里亚特皇室的亲信，安德尔森受命带队，这些人全都要冒着生命危险需要经受那里超额的源石辐射。只为了一个能找到休伯特皇储的希望。\n“你在把我们最精锐的士兵和干部送去白白牺牲，皇帝并不是非得休伯特一人，你要让我跟你说多少遍？”迈因忍不住指责克里·羽，他已经不止一次强调这种行动是在浪费时间，试想首都上百万人目前还处于缺衣少食的状态，还不如将这些人全都派到荒野去猎取食物，迈因声称克里·羽这么干的心态与初次参加舞会的少女心态没什么区别，而克里·羽对休伯特皇储的存在毫不怀疑，两人的争执几乎顶破了紧急议会的天花板。\n到了晚上，两人都妥协了，迈因退了一步，对克里·羽表明了自己的态度：“如果这次他们真的能找到什么线索，我才能听你的，不然紧急议会绝对不能任你胡来！”克里·羽犹豫片刻，既没有点头，也没有否定，只是呆呆的用忧郁万分的眼神望着中央城废墟的方向。\n终于，在黎明的第一缕晨光刺破黑暗的天空之前，调查队的旗帜出现在了营地的视野中，克里·羽激动的站起身与错愕的迈因相继走出营地，直到安德尔森疲惫而复杂的笑容出现在眼前，他的手里攥着一个残破的留声机。上面有源石技艺的保护，这让它在大灾变中幸运的保存了下来。\n“安德尔森，你……”克里·羽吃惊的捂住嘴，看到了安德尔森手臂上那块尖锐的黑色晶体，两行清澈的泪水忍不住从眼眶划下，在那样严酷的源石辐射中，谁都明白这意味着什么。\n“没事的，大人……”安德尔森平静无比，他稍稍闭了闭眼，“没事的，休伯特皇储的踪迹已经找到了，但请你们记住，里面是无数调查队员用生命带回来的成果。”"
 decision_krt.20.a: "即便是漆黑的源石也不能玷污高贵的灵魂。"
 decision_krt.20.tt: "我们在中央核心城的废墟发现了休伯特皇储的线索。"
 decision_krt.21: "贝尼托大街108号"
 decision_krt.21.t: "贝尼托大街108号"
 decision_krt.21.d: "“休伯特皇储在叙拉古，这一点已经是板上钉钉的事情了，那个留声机里面有提到霍夫曼曾经试图往叙拉古邮寄炸弹，这种低级的手段还真是令人不耻。”克里·羽冷哼几声，也要感谢霍夫曼留下了这个宝贵的线索，不然他们可能真的需要尝试捞遍整个泰拉世界，看看在哪个犄角旮旯能碰巧撞上皇储本人。\n迈因略微无奈，坏消息是叙拉古距离他们太远，从这里马不停蹄动身前往叙拉古还需要一段时间，而且霍夫曼邮寄炸弹是几个月前的事情，他们不能保证休伯特在受到袭击后还能继续留在那里，还有更糟糕的可能，迈因一直都在提醒克里·羽不要忘记这种可能，没准皇储已经不幸在炸弹之下蒙难了呢？\n每到这个时候克里·羽就会相当激动，风度尽失，用一只手狠狠拍着桌子，声音比之前足足升高了八度，“我说过多少次了，他不会那么轻易的死在这里，更不会以这种方式谢幕！埃里克斯也在他的身边，你在怀疑他的能力吗？”\n迈因被喊得脑子疼，只好耸了耸肩不想跟这个泼妇继续争吵，“好好好，我明白，那么这段时间紧急议会需要交给你来处理，我去叙拉古怎么样？”\n“你最好不要掉链子！”克里·羽咬牙切齿的警告道，盯着迈因手忙脚乱的溜出会议室。\n在前往叙拉古的道路上，迈因郁闷的跟一整支足足有500人的特别小队仔细核查手中的消息，按照目前他们掌握的线索，锁定几个需要优先核查的地点，皇储如果还活着，最有可能处在的位置是……"
 decision_krt.21.a: "——贝尼托大街108号。"
 decision_krt.21.tt: "§Y科里亚特·迈因将致力于远行并迎回皇储§!"
 decision_krt.21.ttt: "§C迈因元帅预计需要一个月的时间到达叙拉古§!"
 decision_krt.22: "辞别"
 decision_krt.22.t: "辞别"
 decision_krt.22.d: "科里亚特·维尔德·休伯特，几十年来帝国最为离经叛道的皇储，他曾经独自在仆人惊恐的眼神下顶撞过凯林登，那年他只有十九岁，他因为亲眼目睹了一批感染者孩童的惨死而对父亲心生怨恨，以至于他有勇气在科里亚特宫歇斯底里的大声吼叫：“为什么要那样对他们，他们只是生病了而已啊！”\n那时他满腔的愿望只有离开这个国家，离开科里亚特那个充满血腥和谋杀的恐怖之地，去好好感受一下外界的自由和温暖，当小休伯特与父亲提出这个想法的时候，凯林登一世相当的平静：“这片大地上，没有国家比科里亚特更为宽容，至少帝国给了那些二等人用劳动换取生活的机会，而那些外国人的手段要更加卑鄙无耻。”\n皇帝如此对错愕无比的休伯特说道，从那时起，休伯特的心中就有了那么一份期盼，他可以在科里亚特之外找到一个真正自由的国度，在那里，没有感染者和普通人的区分，没有上层阶级的压迫和底层人民的斗争。所有人都在同一个清晰的声音下为了美好的世界而奋斗，这个理想化的愿望从一开始就支撑休伯特的旅行进行到了现在。\n然而，等待皇储的却是一次次失望和现实脱变而来的瓢泼冷水——莱塔尼亚的感染者管理法案，乌萨斯的感染者奴隶制，维多利亚的感染者隔离区，哥伦比亚的残酷实验品；以及充斥着不公的叙拉古阴暗小巷，大大小小的国家都无一例外，仿佛感染者在这个世界真的找不到任何地方可以容身，休伯特曾听说远东对待感染者尚且宽容，但他太累了，已经没有那个精力再去远行一次，好好瞧一瞧远东的样子，他的脚步最终停留在了中陆的尽头，叙拉古的首都，然而他心中的理想之火不但没有被熄灭，反而烧灼的愈发旺盛。\n如果那个理想世界并不存在，那他就要亲自创造那样的国家！如果为感染者而战的人全都死在了集中营里，那他就要亲手拿起那些英雄的接力棒！\n当迈因率领的调查组最终在叙拉古找到了休伯特，这位皇储就知道，自己的机会终于来了，这是他梦想的起点，也是他改变科里亚特的唯一机会，他的帝国，以及他的人民。"
 decision_krt.22.a: "是时候辞别了。"
 decision_krt.22.tt: "休伯特陛下§Y回到了§!他忠诚的§Y科里亚特§!"
 decision_krt.23: "科里亚特召回休伯特"
 decision_krt.23.t: "科里亚特召回休伯特"
 decision_krt.23.d: "在休伯特提出离开的那天下午，他亲密无间的随从埃里克斯率先对西西里女士打了招呼，他从大使馆一路步行到她的办公室，这个科里亚特人总是给她留下相当明练精干的印象，埃里克斯首先是一番客套话，然后才说出休伯特要归国的原因，他即将继承科里亚特的皇位。\n西西里女士吃了一惊，他了解休伯特的身体情况，他是个豁达开朗的人，经常对自己就叙拉古的贸易现状谈天说地，总是一副平静理性由高兴的样子。讲起话来也轻声细语，是个谦谦有礼的忧郁绅士，由于身体有些虚弱怕冷，他坐着的时候也要经常随身携带一张毯子，经常让人联想到拉特兰历史上的一位乐善好施的枢机主教。\n她的表情随后有点怪异，心情又有点郁闷，她开始怀念和休伯特共度的那些日子，有许多难熬的夜晚都是他给了自己务实的建议，现在休伯特要回到那个遥远的西陆祖国，她也随之感慨万千。那里的斗争绝不比叙拉古要轻松半点，她希望这位善良的人能得到应有的回报。\n“好吧……皇储不打算与我亲自道别么？”西西里女士从容的站起身，整理了一下自己的衣襟，用不自然的口吻说道，随后埃里克斯指了指门外，她跟着走出去，看到休伯特正肃穆的端坐在那里，就如同这个孩子当初来到她的办公室门外那样，西西里女士一阵恍惚，好像时间又回到了那个时刻。他帮了叙拉古很多，她没有任何资格将其自私的留在这里。\n在良久沉默后，西西里女士将自己随身的佩剑解下，那是几百年前查士丁尼大帝南征时的宝剑，将其双手递给了休伯特，女士郑重的端详着他棱角分明的面孔：“相比较财富和爵位，或者一枚勋章，我想这个会对你更有意义。”\n“毕竟，我们是朋友，对么？”\n休伯特接过了配剑，神色无比复杂。"
 decision_krt.23.a: "“谢谢您，女士，愿神明永远保佑你。”"

