# ---------------- 事件：先帝遗诏 ----------------
yan_pw.1.t:0 "先帝遗诏"
yan_pw.1.d:0 "§W〔旁白〕§!：尘封的先帝遗诏自大内禁库深处请出，明黄封匣上的朱漆早已剥落成斑驳的龟裂纹。\n§M太傅§!：「……陛下，这确是老真龙驾崩前留下的亲笔手诏。」\n§Y真龙§!：「封存了这么多年，里头写了什么？」\n§M太傅§!：「遗诏上有两句话。老臣胆薄，今日在这偏殿里，只敢替陛下念出前半句。」\n§Y真龙§!：「念。」\n§M太傅§!：「『玉门未归，则朕之臣无颜面见九泉列祖……』」\n§Y真龙§!：「……那后半句呢？」\n§M太傅§!：「后半句牵扯当年太师旧案与天家秘辛，字字千钧，老臣不敢私诵。」\n§Y真龙§!：「先帝既将遗诏留到现在，等的便是后人替他把这口气吐出来。无妨，你已尽了臣子的本分。」\n§Y真龙§!：「剩下的后半句——『太师之冤未雪，则朕之嗣无光』，明日大朝会，朕当着满朝文武的面，自己念！」"
