#  · 文风与设定参照《登临意》：白描、短句、克制
#  · 专名照设定：山海众 / 岁 / 睚 / 界园 / 玉门 / 交河 / 末台 / 司岁台 / 巡防营
# ==============================================================================

# ---------------- 国名（cosmetic tag） ----------------
 YNW_sui_state: "岁国"
 YNW_sui_state_ADJ: "岁国"
 YNW_sui_state_DEF: "岁国"

# ---------------- 人物 ----------------
 YNW_Meng_En_Ya: "蒙恩-睚"
 YNW_Meng_En_Ya_desc: "司岁台最早的古卷拓本上只有八个字：有兽名「睚」，裁错春秋，剪宇怀腹。祂与「岁」同类，是那场狩猎里漏掉的一个。千年前祂逃离炎国时，把自己藏进一方不会流逝的天地——八千年为春，八千年为秋，雪永远不会停。祂管那地方叫界园。玉门城墙上至今留着一块千年不曾修补的爪痕，炎人把它当作文明的里程碑，祂把它当作伤疤。伤疤舔了一千年，就只剩下一个问题：为什么。界园的封印松动之后，祂没有去找重岳，也没有去取那把剑。祂去了西北都护府——那里有拜祂的人，有夜里自己走出营门的兵，有一整座愿意替祂把手伸进雪里的城。如今祂借一副人的形骸坐在交河的正堂上，说人类的官话，行人类的礼制，第一句话是个从人类那里学来的词：蒙恩。没有人能确认那件袍子里坐着的还是不是「人」。都护府的军民已经不在意这件事了。他们自称同袍。"

 YNW_the_blessed: "蒙恩"
 YNW_the_blessed_desc: "「为了愚弄人类，你吹云作雨，降下可笑的『祥瑞』。」祂记得这句话是谁说的，也记得自己当时没有回答。现在祂有了答案，而且打算让所有人都听见。"

# ---------------- 民族精神 ----------------
 YNW_bewitched_legions: "蛊惑"
 YNW_bewitched_legions_desc: "玉门卫的点名册一夜之间少了三百人。他们不是逃，是站在营门外，面朝西，一动不动。天亮时他们自己回了营，队列比昨日更齐，眼睛却在看别处——看着一个此刻还不存在的地方。军需官来报：他们的袍子都换了新里子，针脚一模一样。三百件。一夜之间。"

 YNW_sui_grace: "岁眷"
 YNW_sui_grace_desc: "「经历过那样的时代，为何还会在意自己鳞爪间的蝼蚁，和蝼蚁扑腾起的尘埃？」在祂的注视之下，西北的军民不再觉得冷，不再觉得饿，也不再觉得死是一件需要计较的事。他们把粮让出去，把命排成队列。工坊里的炉子凉了，因为人都站在雪里；雪里的人不觉得冷，所以没有人觉得这是问题。"

 YNW_sui_wrath: "岁怒"
 YNW_sui_wrath_desc: "末台的天亮之后，岁国的军队不再设粮台。辎重营的册子停在易帜那一日，此后无人再记：雪里行军的人不进食，不饮水，也不掉队。军官试着按旧例点验组织，发现队列在减员之后会自己补齐——不是补上，是剩下的人站得更密，密到看不出少过谁。兵部旧僚在降书上只写了一句：此军无粮道可断。"

# ---------------- 事件链：西北都护府异变 ----------------

# 1 夜火
 yan_upheaval.1.t: "戈壁上的夜火"
 yan_upheaval.1.d: "交河以西的戈壁，入冬之后不该有火。\n\n巡防营的哨探在三个夜里数出十七处。火堆围成环，环心立一块石，石上有血，血已经冻住了。\n\n司岁台玉门分署递上来一份册子：自秋分至今，都护府境内有名可考的祭坛四十九座，无名的不可计。祭文只有一句——「山海八荒，尽归其主」。\n\n常清认得这伙人。二十年前，他们在玉门动过一次手，不曾得手。\n\n如今他们又来了。这一次不抢剑，不杀人，也不进城。\n\n他们只是烧，只是拜，只是一夜一夜地往土里埋东西。"
 yan_upheaval.1.a: "遣巡防营焚坛捕众"
 yan_upheaval.1.b: "张榜禁巫，不加兵"
 yan_upheaval.1.c: "任其奉祀，边地人心不可强"

# 2 界园
 yan_upheaval.2.t: "界园"
 yan_upheaval.2.d: "末台以北三十里，有一座不该存在的园子。\n\n地图上量不到它。巡线的马进去就回不来——回来的从来是马，没有人。\n\n园里下雪。雪是夏天下的，也是千年前下的，也是此刻下的。八千年为春，八千年为秋，雪永远不会停。\n\n司岁台最早的古卷拓本上有一句话，常清小时候听师父念过：有兽名「睚」，裁错春秋，剪宇怀腹。她一直以为那是个比喻。\n\n昨夜，玉门城墙上那道千年前留下的爪痕在震。\n\n有人跪在墙根下，一跪到天亮。他不是信徒。他只是听见了。"
 yan_upheaval.2.a: "亲赴末台，以司岁台之法固封"
 yan_upheaval.2.b: "闭城三日，绝口，八百里加急报司岁台"
 yan_upheaval.2.c: "（那声音在唤一个名字。她听清了。）"

# 3 同袍
 yan_upheaval.3.t: "与子同袍"
 yan_upheaval.3.d: "玉门卫的点名册，一夜之间少了三百人。\n\n不是逃。他们站在营门外，面朝西，肩挨着肩，一动不动。军官喊了三个时辰的名字，没有人应。\n\n天亮时他们转身回营，各归各班，队列比昨日更齐。只是他们的眼睛在看别处——看着一个此刻还不存在的地方。\n\n军需官来报：他们的袍子都换了新里子，针脚一模一样。三百件，一夜之间。\n\n岂曰无衣，与子同袍。\n\n常清第一次觉得，这句话不是诗。"
 yan_upheaval.3.a: "号令所不及者，就地处决"
 yan_upheaval.3.b: "开营门，把他们一个一个接回来"
 yan_upheaval.3.c: "随他们去。她还要守玉门。"

# 4 蒙恩（终幕）
 yan_upheaval.4.t: "蒙恩"
 yan_upheaval.4.d: "末台的天亮了。亮得不像天亮。\n\n雪从地里升起来。\n\n园子的门开了——不是有人推它。是它终于不必再只是一座园子。\n\n常清在都护府的官署里写完最后一道文书，笔停在半空。她听见阶下甲叶相碰的一声，很轻，像有人把一件外衣放在地上。\n\n后来史官记：是岁，西北都护府易帜。不称都护，不称炎官。民自名其党曰「山海众」，以其所拜者为主。\n\n有兽名「睚」，裁错春秋，剪宇怀腹。祂终于有了一件人的形，一个人类的名字，和一种人类的坐姿。\n\n祂开口说的第一个词，是从人类那里学来的：蒙恩。"
 yan_upheaval.4.a: "（祂睁开了眼）"
 yan_upheaval.4.tt: "西北都护府易帜为「岁国」，脱离大炎管辖。\n执政党变为神秘主义政党「山海众」。\n国家领袖变为「蒙恩-睚」，其特质为「蒙恩」。\n岁国获得民族精神「§R岁眷§!」。\n雪中立起一百个「§R山海狂士§!」步兵师（16 步兵营，满编）。\n岁国获得民族精神「§R岁怒§!」：补给消耗 -90%、组织度 +50%、步兵师攻击 +30%。\n岁国向大炎宣战。\n大炎的岁兽苏醒度上升 15。"

# ---------------- 超事件：岁怒 ----------------
 yanse.1.t: "岁怒"
 yanse.1.d: "西北都护府易帜。自玉门以西，不再奉炎正朔。\n\n「山海众」奉蒙恩-睚为主，国号「岁」。\n\n边报送到百京时，谁也没有立刻落印。那上面写的每一个字都是军报的格式，合起来却不像是人写的。"
 yanse.1.a: "披甲。"

 YAN_super_event_sui_nu_title: "岁怒"
 YAN_super_event_sui_nu_quote: "你可还记得，那破开云霭的眼睛？\n——岁国既立，蒙恩-睚之言"
 YAN_super_event_sui_nu_close: "§T岂曰无衣？§!"
