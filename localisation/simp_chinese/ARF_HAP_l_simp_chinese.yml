#政党名称
 HAP_liberalism_party: "哈拉帕商贸联盟"
 HAP_conservatism_party: "哈拉帕国民会团"
 HAP_authoritarianism_party: "南方王公"
 HAP_despotism_party: "希瓦王朝"

#人物
 HAP_Chandra_Shiva: "旃陀罗·希瓦"
 HAP_Chandra_Shiva_desc: "一个人很难摆脱父母对其带来的影响，正如旃陀罗·希瓦的前半生，一直在追寻他的父亲，沙摩陀罗“海护王”的脚步。父亲征战四方，甚至击退了可怖的海嗣，因此赢得了“海护王”的帝号。旃陀罗也继续着父亲的征战，他平定了父亲未涉足过的南方，让南方王公们俯首称臣。父亲举全国之力发展工业，让帝国用短短四十年赶上了邻居炎国百年的工业化成果。旃陀罗继续着父亲的改革，将华提那城建设成了不逊于百京的巨型移动城市，让一座座小工厂在哈拉帕的乡村拔地而起。就这样，追寻着“海护王”的步伐，旃陀罗·希瓦走完了他人生的壮年。他还要活在死者的阴影下吗，答案是否。这个已经过了四十岁的皇帝，在他的后半生，将在历史上写下属于他的篇章。"
 HAP_Tahira_Daitiye: "塔希拉·达伊提耶"
 HAP_Indira_Kotovi: "因迪拉·科陀维"
 HAP_Narayana_Kubera: "纳拉亚那·库贝拉"

#国家精神
 HAP_Unstable_situation_in_the_south: "不稳定的南方局势"
 HAP_Unstable_situation_in_the_south_desc: "1082年，趁西方的炎国国内动荡之际，哈拉帕大军南下攻灭了最后几个不服从哈拉帕统治，而又依附于炎国的土邦，旃陀罗皇帝也得以宣称南征胜利。然而，南方最大的几个土邦都只是在名义上向华提那称臣，实际上在本地仍然保有极强的独立性。他们手握重兵，而拥有的财富甚至可以搅动远在伦蒂尼姆的证券交易所。当华提那城的中央政府展现出她的软弱一面时，南方的王公们绝不会放过这样的机会。"
 HAP_Agrarian_problem: "土地问题"
 HAP_Agrarian_problem_desc: "哈拉帕的资本主义发展进程，相较于其他大国来说，比较畸形。服务于战争和争霸的工业化，最直接的结果是极大的城乡不平衡。以华提那城为代表的巨型移动城市可以和泰拉的任何一个列强相匹敌，然而在哈拉帕广袤的农村，王公和地主仍然以最原始的方式压迫着那里的农民，虽然帝国政府已经尝试通过扶持小企业来改善乡村的情况，但是这种局面依旧没有改变。即使暂且抛开农民受到的苦难不谈，混乱的农村市场秩序和低效的小农生产方式，对于哈拉帕进一步的工业化已经是极大的阻碍了。也许，只有一场全方位的土地改革，才能解决这片大地罹患千年的顽疾。"
 HAP_Harappan_national_movement: "哈拉帕国民运动"
 HAP_Harappan_national_movement_desc: "国民运动是哈拉帕的资本主义发展到这一阶段的必然结果，新兴的资产阶级和工人、市民，不可能接受自己被排除在统治阶层外的现状，在这样的共同诉求下，国民会团诞生了。随后又出现了商贸同盟和平民党等更多政治派别。出于维护中央集权、压制地方势力的考虑，在海护王统治的末期，一些影响力较大的政治团体被吸纳入政府内部，在多个政府机构担任要职。但无论是资产阶级还是皇帝，每个人都清楚，国民运动的诉求不止于此，而国民运动的走向，也预示着哈拉帕未来的走向。"