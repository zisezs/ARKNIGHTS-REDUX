l_simp_chinese:
 LOADING_TIP_0: "每个乌萨斯人都应为他们的国家与皇帝感到骄傲。\n- 乌萨斯政府宣传口号"
 LOADING_TIP_1: "军旅生活教会我两件事。第一，信任你的战友；第二，提防你信赖的人。\n- 阿法纳西·伊戈里耶维奇·赫拉托夫\n乌萨斯"
 LOADING_TIP_2: "萨卡兹应该是自由的。\n- 《自由与斗争》第二章，《卡兹戴尔与近代雇佣兵史》节选"
 LOADING_TIP_3: "宁做一日鲁珀，不为百年佩洛。\n- 贝妮黛塔·那玻利尼\n叙拉古"
 LOADING_TIP_4: "龙门的市井，乌萨斯的郊区，维多利亚的古废墟……这个世界上有无数美景，只不过，很少有人去发现。\n- 莫斯提马\n拉特兰"
 LOADING_TIP_5: "命运变换无常，唯有胜者永存于世。\n- 远山\n萨米"
 LOADING_TIP_6: "是棋子，那就吃掉；是堡垒，那就攻陷；是王权，那就推翻。\n- ACE"
 LOADING_TIP_7: "风暴中，唯保守者屹立不倒。\n- 塞雷娅\n哥伦比亚"
 LOADING_TIP_8: "力量并非战斗的本质，实力并不意味着肆意妄为。\n- 塞雷娅\n哥伦比亚"
 LOADING_TIP_9: "真正的骑士不会追击失去战意的人，无论什么样的人，都应该给予他们重新选择的机会。\n- 玛嘉烈·临光\n卡西米尔"
 LOADING_TIP_10: "是命运扼住我们的咽喉，亦或是，我们将要对命运作绝地反击？\n- 索菲亚·皮埃罗芙娜·米哈伊洛娃\n乌萨斯"
 LOADING_TIP_11: "命运就像大地，谁都不能摆脱它的枷锁。\n- 远山\n萨米"
 LOADING_TIP_12: "敌尽则我进，我进则敌尽。\n- 白雪\n东国"
 LOADING_TIP_13: "要知道，各个紧密连环间的空隙是结构中最为脆弱的部分；而利刃总会刺向铠甲的缝隙，一旦被趁虚而入，辛苦铸就的一切，顷刻间就会崩塌殆尽。\n- 欣特莱雅\n卡西米尔"
 LOADING_TIP_14: "即使心脏被敌寇的利刃刺穿，国王的骑兵亦不解下手中长枪。\n- 格拉尼\n维多利亚"
 LOADING_TIP_15: "丢了一个钉子……死了一个国王。\n- 亚历山德莉娜·“维娜”·维多利亚\n维多利亚"
 LOADING_TIP_16: "极北吗？那是个冰冷又残酷的梦境，但是啊，就是在那样的地方，埋藏着我的梦想。为了让美梦成真，我愿意一切付出努力去获得它。\n- 麦哲伦\n哥伦比亚"
 LOADING_TIP_17: "若是现在不给她装上枷锁，就要有在未来为她戴上王冠的觉悟。\n- 恩希欧迪斯·希瓦艾什（评价阿米娅）\n谢拉格"
 LOADING_TIP_18: "他们相信五月的阳光会融化冻原上的冰雪，也相信着比冻原还硬的乌萨斯会在他们脚下改变。\n- 卡谢娜·菲奥莉特(黑蛇)\n乌萨斯"
 LOADING_TIP_19: "维多利亚的乱局中，军人没有告假的时间。\n- 丽塔·斯卡曼德罗斯\n维多利亚"
 LOADING_TIP_20: "“白狼”这个称呼，和阿斯兰称王的历史一样悠久\n- 丽塔·斯卡曼德罗斯\n维多利亚"
 LOADING_TIP_21: "在莱塔尼亚，感染者只是相对自由些，但也不是那么自由，离开了夕照区，我能住的地方很少，能吃饭的地方也很少，甚至能踏上的路……也很少，有，但是很少。\n- 威廉·车尔尼\n莱塔尼亚"
 LOADING_TIP_22: "你有没有听见孩子们的悲鸣？你有没有感受到城市在分崩离析？你不曾注意阴谋得逞者在狞笑。你是否想过……朋友不再是朋友，家园不再是家园。\n- 简·薇洛\n维多利亚"
 LOADING_TIP_23: "曾经有一场漫长的战争。当我终于划开敌军指挥部的舱门，却只来得及接过我濒死好友递给我的佩刀与怀表。敌人失去了指挥官，他的死为乌萨斯带来了片刻的胜利，而我，可悲地输掉了这场战争。\n- 阿法纳西·伊戈里耶维奇·赫拉托夫\n乌萨斯"
 LOADING_TIP_24: "伤痛当然可怕，但只要创造它们的人还在，医学又有什么意义？谁能拯救要被杀的人？泰拉需要的并不是医生。\n- 阿\n炎国"
 LOADING_TIP_25: "地上的文明与凶猛的恶兽无异。\n- 阿芙朵嘉·尼古拉耶芙娜·伊万诺娃\n乌萨斯"
 LOADING_TIP_26: "战斗人员与战争机器的用武之地……却也正是摧毁他们的地方。\n- 格雷伊\n玻利瓦尔"
 LOADING_TIP_27: "哥伦比亚的科技日新月异，作为科研人员，我几乎看得到那个值得期待的未来。梦想就在那里，而我，想要实现它。\n- 埃琳娜·乌比卡\n哥伦比亚"
 LOADING_TIP_28: "呵，那可是个好地方，女皇视臣民如子女，健康人视感染者如手足，人们的脸上洋溢着幸福——假？假就对了。等您能面不改色地听完这段话，再考虑去莱塔尼亚的事吧。\n- 乌提卡伯爵（评价莱塔尼亚）\n莱塔尼亚"
 LOADING_TIP_29: "不管是摆脱平民纠缠的礼仪，还是背后散布其他贵族谣言的礼仪，都需要一张厚脸皮，对我而言难度有点高，您还是另请高明吧。\n- 乌提卡伯爵\n莱塔尼亚"
 LOADING_TIP_30: "我在紧张的时候喜欢重复别人说过的话，因为对我，不，对乌提卡伯爵来说，那是争取思考时间最安全的方式。只要不说自己的话，就不用为说出口的东西负责。\n- 乌提卡伯爵\n莱塔尼亚"
 LOADING_TIP_31: "以前我常在那幻想地面上的生活有多幸福，后来我才明白，塔上的我被剥夺的只有自由，而大地上的更多人，他们除了自由，一无所有。\n- 乌提卡伯爵\n莱塔尼亚"
 LOADING_TIP_32: "我曾经被老爹丢进预备军，里面都是半大不小的孩子，有些人满腔热血胸怀抱负，但更多人其实根本没想那么多，日子不好过，大家都要找条出路，仅此而已。\n- 埃内斯托·萨拉斯\n玻利瓦尔"
 LOADING_TIP_33: "这场战斗并非因仇怨而起，大家只是立场各不相同罢了。\n- 艾泽尔·帕斯托莱\n拉特兰"
 LOADING_TIP_34: "谁要我的保护？我能保护谁？自那场动乱以来，我就一直在问自己……我看到人们心中的恶意在溢出，最终淹没整座城市。在那样的情况下，或许正义根本不值一提，不复存在。\n- 卓雅\n乌萨斯"
 LOADING_TIP_35: "阿斯兰王的史诗是被诗人传唱开的，而不是靠文字被人熟知的。\n- 海蒂·汤姆森\n维多利亚"
 LOADING_TIP_36: "卡西米尔的骑士竞技，那只不过是场庞大的商业游戏，它豢养着所有人……\n- 玛莉娅·临光\n卡西米尔"
 LOADING_TIP_37: "对于一个伊比利亚人，谈起“大海”这个词的心情是复杂的，它象征着恐怖和危险，也寄托着对于曾经那个时代的怀念。可就连伊比利亚的巨舰都在我的眼前沉没，我们……需要一点改变。\n- 乔迪·方塔纳罗萨\n伊比利亚"
 LOADING_TIP_38: "法官、律师、政客都需要一张证书才能骗取财富，但我们不需要。\n- 叙拉古黑帮名言"
 LOADING_TIP_39: "尚蜀风高，拨云弄月。"
 LOADING_TIP_40: "众人拾柴火焰高，咱们齐心协力，倒真能烧出个满天红霞来。\n- 乌有\n炎国"
 LOADING_TIP_41: "米诺斯是个浪漫的地方，终日可见哲人辩论、武者较量、伶人排演英雄的戏剧。\n- 埃拉托\n米诺斯"
 LOADING_TIP_42: "对英雄来说隐姓埋名才是最大的屈辱。\n- 埃拉托\n米诺斯"
 LOADING_TIP_43: "资本，就该是兼并和收购！\n- 碧翠克斯·施怀雅\n炎国"
 LOADING_TIP_44: "你要去龙门夜市的话，我可以带路。那里很热闹，就是不太安全。\n- 孑\n炎国"
 LOADING_TIP_45: "谢拉格，不能永远依靠耶拉冈德，更不能依靠其他国家。\n- 恩希欧迪斯·希瓦艾什\n谢拉格"
 LOADING_TIP_46: "感染者？只有城市里的人才会这么称呼自己。在那片广阔又危险的荒原上，无论是野兽还是我们，只要能活下来，就都是强者。\n- 夜半\n雷姆必拓"
 LOADING_TIP_47: "将被源石感染后的表现简单地定义为疾病，仅仅思考如何去“抑制”和“治疗”它，这是无知的人才会做的事\n- 诺希斯·埃德怀斯\n谢拉格"
 LOADING_TIP_48: "健康的人想在卡西米尔成为骑士很简单，只要去竞技场注册就可以。但想要成为真正的“骑士”，不管你是什么人，都会很难。非常难。\n- 查丝汀娜·瓦伦泰\n 卡西米尔"
 LOADING_TIP_49: "若是不流血就能取得胜利……不，忘了我说的吧。\n- 恩雅·希瓦艾什\n谢拉格"
 LOADING_TIP_50: "乌萨斯这个单词只会给我痛苦，我不想听，我一辈子都不想再听到。但它，是个巨人，发声振聋发聩。会被逼疯的，只有我。\n- 路易莎\n乌萨斯"
 LOADING_TIP_51: "对于军人来说，责任同时也意味着更多的争战，甚至是更多的错误。\n- 菲奥娜·杨\n维多利亚"
 LOADING_TIP_52: "如果公义需要更多暴力才能伸张，那还怎么能被称得上是公义？\n- 塔露拉·雅特利亚斯\n乌萨斯"
 LOADING_TIP_53: "理念？感染者在冻原上被当作锯末，在矿场里被当作废渣，在聚落被当作惩示，在城市被当作什么燃料。\n- 博卓卡斯替\n乌萨斯"
 LOADING_TIP_54: "要是我们把自己坚持的东西都一点一点抛干净，或者换成新的东西的话，那是不是到某个时候，我们就其实没再坚持什么了呢？\n- 阿丽娜\n乌萨斯"
 LOADING_TIP_55: "冻原上的感染者既不无知也不愚蠢。我们不抱幻想。所有的理念在被实践前都是幻想。\n- 博卓卡斯替\n乌萨斯"
 LOADING_TIP_56: "顺带一提,我们要追求公平也不需要什么原因。因为我们本来就该追求公平。如果这片大地不肯给，那我们就从它那拿回来。\n- 塔露拉·雅特利亚斯\n乌萨斯"
 LOADING_TIP_57: "你们不是害怕感染者造成什么危害。不。你这辈子连有威胁的感染者都没见过几个。你们只是想利用我们的命，只是想玩弄我们的性命！\n- 塔露拉·雅特利亚斯\n乌萨斯"
 LOADING_TIP_58: "你不是应该比我更清楚，卡西米尔需要真实的暴力，需要地覆天翻的战争？\n- 切斯柏\n 卡西米尔"
 LOADING_TIP_59: "伊比利亚的事情为什么总是那么糟糕。\n- 科西嘉一世（在四皇战争中得知伊比利亚因内乱无法给予支援后）\n高卢"
 LOADING_TIP_60: "天下之事，不难于立法，而难于法之必行；不难于听言，而难于言之必效。\n- 张太岳\n炎国"
 LOADING_TIP_61: "兄弟死于阵，子姓没于军，九族之内，十不一在，而存者创痍满身。\n- 宁崇薇\n炎国"
 LOADING_TIP_62: "我们一起在维多利亚点燃了一束万世不熄的火炬。\n- 安科茨男爵\n维多利亚"
 LOADING_TIP_63: "繁荣源自和平，和平源自力量。\n- 马克西姆·路德维希\n卡兹戴尔"
 LOADING_TIP_64: "政客被认为是只会夸夸其谈而不付出实践之人，而你们要求切实的行动，并且急切的需要在解决失业问题上的行动。\n- 安科茨男爵\n维多利亚"
 LOADING_TIP_65: "用旧有的手段，无法寻找到不同的路径。若新的叙拉古依然立足于暴力，那它也必将落入一样的结局。仅仅几个家族的覆灭，还远远不够。我们要改变的是“习惯”本身。\n- 莱昂图索·贝洛内\n叙拉古"
 LOADING_TIP_66: "一切都在国家之内，没有什么在国家之外，没有什么能反对国家。\n- 贝妮黛塔·那玻利尼\n叙拉古"
 LOADING_TIP_67: "在我眼前，躺在这城市里的和平生活和他的懒惰的人民；在我灵魂里，反复响着这神圣的字句。“我要给你们以晨星。”\n- 波尔卡·萨文科娃\n乌萨斯"
 LOADING_TIP_68: "人君之于天下，不能以独治也。独治之而刑繁矣，众治之而刑措矣。\n- 顾绛\n炎国"
 LOADING_TIP_69: "事情捅得越大，要开的会就越多，浪费的时间也越多。\n- 雷姆必拓谚语"