 KZM_Extreme_economic_liberalism: "极端经济自由主义"
 KZM_Extreme_economic_liberalism_desc: "真伟大啊海耶斯，昨天晚上想海耶斯想到哭了，然后迷迷糊糊睡着了，梦里面梦到海耶斯拿了十个ABC经济学奖，历史最佳经济学家再也没有争议。然后就笑醒了，特别开心。一个月所有的工资爸妈都不给全部买海耶斯的周边，海耶斯的辩论每场必看，特别喜欢海耶斯的动作，太帅了。以后等海耶斯年纪老大了我就飞去莱塔尼亚照顾海耶斯，当海耶斯的奴隶，等海耶斯年纪大去世了就跟着一起去，毕竟来到这片大地只为陪伴海耶斯，这个任务已经完成了，父母那边不管，没办法为了海耶斯已经尽力了，是这样的。这才是我这个合格的南莱塔尼亚学派应该做的事情啊，所有的南莱塔尼亚学派都应该像我这样，不然你们就不配叫是南莱塔尼亚学派，不配喜欢海耶斯！没有海耶斯的泰拉有什么意义？你们给我小心点，全泰拉有90亿南莱塔尼亚学派，一人一口就能吐死你们，海耶斯是泰拉最伟大的经济学家，你们永远不知道海耶斯付出了多少才走到了今天。海耶斯的传奇性，故事性，亲和力，颜值已经拉满了，就算海耶斯有99个错，你们这些不喜欢海耶斯的人就没有一点错吗，你们既然有错为什么还要黑海耶斯，你们凭什么不喜欢海耶斯！我喜欢海耶斯需要你们的同意吗？我从08年就喜欢海耶斯，喜欢他的霸气，海耶斯让我们在生活中不再自卑，就你的辩论水平还吊打海耶斯？我给你说，他的水平是全地球人最好的，你不要不信，我可是他的粉丝，他的实力你是不可能比得过的，因为他会新自由，还有，你是不是撅醒了，我也会撅的，只是因为我还未通往奴役之路，我可以吊打你的，但是我现在没有他的伟大著作，我可以用手机和你玩，我的ID是AAA海耶斯玩市场，这是我的海兵证我的实力也是很强的。"
 KZM_Prepare_for_Next_War: "整军备战"
 KZM_Prepare_for_Next_War_desc: "虽然第十次乌卡战争已经过去了数十年之久，对于“永久和平”的幻想在民众心中弥漫，但卡西米尔的高层们仍未对乌萨斯帝国掉以轻心。征战骑士团长久以来都在为下一场战争的来临做准备，而军事工业也在缓步重整之中。\n\n军团是士兵的旋律，\n军团是勇士的命运。\n军团是士兵的豪情，\n军团是奉献的祭品。\n我们，第一旅，\n英勇的队伍，\n将我们的生命献于祭台，\n献于祭台，献于祭台。"
 KZM_Kazimierz_Democratic_Revolution: "卡西米尔民主革命"
 KZM_Kazimierz_Democratic_Revolution_desc: "自奇廷卡斯克的点点蓝色极光，到如今屹立北方的民主共和国，乌萨斯已然改头换面，而慑服于其下的卡西米尔亦是如此。追随乌萨斯共和革命的脚步与其“指导”，前国民院议长与社会党党首伊格纳齐·达谢克于旧日余烬上建立起卡西米尔联邦共和国，并效仿乌萨斯同志们的理念发起了“卡西米尔民主革命”。\n\n这场“民主革命”虽听起来与乌萨斯民主革命者们理念或许并无不同，但面对卡西米尔的不同国情，达谢克采取了更为温和的政治手腕改造国家。他积极吸收了诸多旧政权与民间的进步派人士加入政府，并在许多方面选择同保守派和解而非强硬对抗。或许选择走上这条“非正统”的道路会令国内的激进派与乌萨斯盟友方面感到不满，但达谢克清楚：在战后废墟之中，唯有团结一致才能维护住脆弱的稳定。"
 KZM_Turbo_Lovers: "涡轮之爱"
 KZM_Turbo_Lovers_desc: "虽对乌萨斯红军所带来先卡西米尔共产党一步的“解放”有所不甘，但费利克斯·特奥茨基依然接受了作为苏维埃联盟“姊妹共和国”领导人的邀请。在他治下，一场席卷全社会的赤色革命正改变着卡西米尔的一切。唯物主义与社会主义的理论正逐渐取代旧日贵族们宣扬的所谓“骑士精神”，抑或商业联合会资本家们所崇尚的“创新”与“发展”。\n\n而面对旧联合领留下的烂摊子，特奥茨基也有着属于他的应对方案。乡村的土地改革打碎了封建枷锁；工厂中的工人们与霓虹灯下的职员们从此远离资本家的剥削；感染者群体头一回得到了彻底的平权待遇。尽管过于激进的变革与对部分反动旧势力的强硬镇压同样带来了诸多问题，但在党的引领与人民的奋进之中，人民共和国仍向着共产主义未来不断前行。"
 KZM_Greater_Hammer: "巨锤圣教"
 KZM_Greater_Hammer_desc: "第十一次乌卡战争无疑是一场惨痛的历史挫败，旧政府军队与红军的激烈交战致使卡西米尔经济大受创伤，而基础设施也遭到了严重破坏。但相较于那些眼中唯能看到经济凋敝与工业萎靡的悲观主义者，特奥茨基却在华屋秋墟之上瞥见了未来曙光。\n\n“得益”于战争对以商业联合会为代表的资本集团旗下产业的打击，向社会主义经济模式的改革进程一帆风顺，团结工联等民间工会也顺利被整合入国控工会体系之中。在有关生产关系的改革之外，特奥茨基也积极推动着去消费主义化与经济实体化的进程。一场再工业化浪潮正席卷共和国上下，而这一切必将重塑卡西米尔。"
 KZM_Ursus_Military_Occupation: "乌萨斯的军事占领"
 KZM_Ursus_Military_Occupation_desc: ""

 KZM_xp: "AI经验加成"
 KZM_War_With_Ursus: "第十一次乌卡战争-未经计划的攻势"

 #事件
 kzm.1.t: "四城对接"
 kzm.1.d: "就在今日，大骑士领卡瓦莱利亚基的四座城邦终于重连！民间恐慌悄然消融，而这也意味着第二十三届骑士竞技大赛能够正式开启。"
 kzm.1.a: "大喜事。"
 kzm.2.t: "民权运动兴起"
 kzm.2.d: "一些“国民权益运动”活动家的演讲在全国范围内得到关注。而就在此时，某些关于城乡收入差距、奴隶与感染者糟糕生活条件的文章也不择时机地上了头条。民众看起来对现行政策......不太满意，看呐，他们已经上街开始发表意见了。"
 kzm.2.a: "有必要做些让步......"
 kzm.2.b: "改革迫在眉睫！"
 kzm.2.c: "立即出动警察！"
 kzm.3.t: "民权抗议的终结"
 kzm.3.d: "我们的治安部门与煽动分子们激烈交换了好几个月意见，现在他们终于遭到粉碎，而街道也恢复了以往的平静。"
 kzm.3.a: "我不喜欢花语运动。"
 kzm.4.t: "商业联合会问题"
 kzm.4.d: "在民权运动的余波过后，现政府面前又多了一个新困局，那便是愈发难以抑制的商业联合会影响。它们无疑是对监正会政治权威的巨大威胁，现在应该怎么解决这个问题？"
 kzm.4.a: "还是维持现状吧。"
 kzm.4.b: "必须出重拳！"
 kzm.5.t: "开始军备重整"
 kzm.5.d: "面对愈发动荡的国际局势，卡西米尔政府已宣布了一些小型军备重整计划。民众方面对此政策意见不一，部分鹰派分子巴不得立刻打进圣骏堡，而一些人则为未来感到担忧。"
 kzm.5.a: "我们必须保护祖国。"
 kzm.6.t: "军事改革"
 kzm.6.d: "在乌萨斯巨熊的威胁下，卡西米尔现有的十个征战骑士团似乎已经不太够用了。为了在未来拥有更强大的国防能力，政府已经批准扩充组建一些非正规的“国土防卫旅”，并就现今的军事体系进行改革。"
 kzm.6.a: "“杀熊吃肉”的时机很快就要来了！"
 kzm.7.t: "政治危机！"
 kzm.7.d: "或是因为近期被递交到国民院的新法案不小心碰了利益集团蛋糕，或是因为政府在处理一些烫手山芋时过于失败，卡西米尔政界已一片混乱。无数阴影中的势力跃跃欲试，而就在此时......"
 kzm.7.a: "......征战骑士团接管了政府，并宣布启动永久战备状态。"
 kzm.7.b: "......征战骑士团接管了国家，并宣布发动“治愈”运动。"
 kzm.7.c: "......商业联合会颠覆了联合领。"
 kzm.8.t: "军事政变！"
 kzm.8.d: "目前的国家状态已经相当不妙。在政治危机的烈火之中，克莱门德·佐洛夫将军带领一批支持民族主义与复仇主义的征战骑士进军首都，而他甚至获得了银枪天马的支持！就这样，随着国民院与监正会逐一遭到接管，军政府成立了。新生的军政府大力鼓动民族主义与复仇主义狂热，并已宣布戒严与永久战备状态。"
 kzm.8.a: "是时候把那些蠢文官们赶下台了！"
 kzm.9.t: "国家复生"
 kzm.9.d: "目前的国家状态已经相当不妙。在政治危机的烈火之中，克莱门德·佐洛夫将军带领一批支持民族主义与复仇主义的征战骑士进军首都，而他甚至获得了银枪天马的支持！就这样，随着国民院被无限期暂停，新秩序已经确立。令人不解的是，佐洛夫将军并未解散文官政府或宣布戒严，而是宣布了一项属于他的“大计划”——暂停诸多旧政府机构的运作，并组建“无党派政治合作集团”。"
 kzm.9.a: "世界线收束。"
 kzm.10.t: "军政府经济政策"
 kzm.10.d: "在佐洛夫巩固权力后，他第一时间便开始对泛滥的消费主义与享乐主义进行打击，通过更加直接的经济干涉确保卡西米尔经济的再实体化。如今，随着与商业联合会关系缓和，一些关于新经济体制的畅想或许将适于卡西米尔。"
 kzm.10.a: "没有糖果，卡西米尔人照样能活。"
 kzm.10.b: "为KGCC干杯！"
 kzm.11.t: "赛博朋克[GetYear]"
 kzm.11.d: "目前的国家状态已经相当不妙。在愈发迫近的政治危机之下，商业联合会出人意料地拔得头筹，在其他势力做出应对前掌控了国民院与监正会。随着国民紧急状态委员会的权力稳固，商业联合会也就此走向台前，就此彻底控制了联合领。"
 kzm.11.a: "早上好！大骑士领！"
 kzm.12.t: "商业联合会经济政策"
 kzm.12.d: "在控制国家后，KGCC已经完成了从影子政府到一个真正政府的转型。现在，是时候选择一种经济理念了。"
 kzm.12.a: "商业联合会的大手将伸向每一处！"
 kzm.12.b: "太伟大了海耶斯，我们才不需要有形的大手。"
 kzm.13.t: "恰尔内的“离去”"
 kzm.13.d: "或许是受到本届特锦赛中的意外事件影响，KGCC发言人恰尔内不明不白地离职，而这一职位被交给了名不见经传的企业员工马克维茨。许多人不禁对此事表示怀疑，一些有关恰尔内事实上是被KGCC高层“流放”的传言开始传播。"
 kzm.13.a: "难说。"
 kzm.14.t: "马克维茨希望离职"
 kzm.14.d: "我想KGCC发言人在马克维茨心中大概是个危险职业，不然为什么他都坐稳位置了还想离职。"
 kzm.14.a: "好吧，让“大嘴”莫布接替这个职位......"
 kzm.14.b: "不！你不能走。"
 kzm.15.t: "监正会经济政策"
 kzm.15.d: "随着乌萨斯战熊的威胁愈近，监正会与国民院就经济改革一事达成一致，接下来便需要对齐颗粒度并选定改革方案了。"
 kzm.15.a: "我们需要“有机消费主义”。"
 kzm.15.b: "优先军事，干翻乌萨斯！"

 worldnews_kzm.1.t: "[Get_newspaper_header]四城大隔断的终结"
 worldnews_kzm.1.d: "数月之前，就在第二十四届卡西米尔骑士竞技特锦赛前夕，卡西米尔首都卡瓦莱利亚基曾遭受一场可怕的恐怖袭击。它瘫痪了移动城市的核心动力炉，致使“大骑士领”陷入混乱与恐慌之中。而就在今日，随着对接链检查完成，这座由四座城邦组成的宏伟之城顺利完成对接，再度展现在人们眼前。\n\n随着名为“四城大隔断”的危机就此结束，本届卡西米尔骑士竞技也宣告正式开始。骑士协会公布了本赛季各赛区的十二位发言人代表。他们将代表各大赞助商、骑士协会与国民院立场，负责赛事顺利进行。而在任命仪式上，十二位发言人第一次履行职能，联合宣布了国民院于五月末通过的议案：将对所有贡献卓越的违规骑士予以减刑。"
 worldnews_kzm.1.a: "终于可以松下口气了。"
 worldnews_kzm.2.t: "[Get_newspaper_header][GetYear]年公民权保障法案"
 worldnews_kzm.2.d: "卡西米尔近期蔓延不断的民权运动总算有了结果：监正会与国民院最终选择向抗议者们妥协，通过了所谓《[GetYear]年公民权保障法案》。这项法案解除了禁止感染者参与骑士竞技的规定，并在诸多方面上完善福利体系与公民权力。尽管大多数民权人士都对该法案相当满意，但一些声音却表示了质疑。\n\n国民院的强硬派议员们对于没能暴力镇压，而是通过谈判妥协解决问题大为愤慨；极少数激进民权人士则对法案中的部分条目心怀不满，认为其并未真正使感染者获得平等地位，而在这批激进派看来，未废除那最大污点——落后至极的奴隶制更意味着这项“公民权”法案的名不符实。\n\n虽充满争议，但公民权保障法案的通过仍很大程度上缓解了卡西米尔国内矛盾，并客观上促进了社会平等。或许卡西米尔感染者们的平权之梦终归难以实现，但他们至少已经争取来了一些东西。"
 worldnews_kzm.2.a: "我们人民。"
 worldnews_kzm.3.t: "[Get_newspaper_header][GetYear]年公民权保障法案"
 worldnews_kzm.3.d: "卡西米尔近期蔓延不断的民权运动总算有了结果：监正会与国民院最终选择向抗议者们妥协，通过了所谓《[GetYear]年公民权保障法案》，而这项法案的内容相当超乎人们预料。虽名为公民权保障法案，但其实际上涵盖了大量与民权运动诉求无关的社会改革：声名狼藉的奴隶制终遭废除；感染者权力得到保障；而曾数次受国民院否决的土地改革也随着本次公民权保障法案通过将得到施行。\n\n卡西米尔各地的民权人士高唱胜利歌谣，但国民院中的强硬派反应则截然相反，他们纷纷为这项法案能够顺利通过而感到疑惑甚至愤怒。一位议员在国民院公开表示对此事的不满，声称公民权保障法案将成为“卡西米尔历史上难以磨灭的烙印”，并直呼卡西米尔已成为如什基普塔尔般的“社会主义国家”。"
 worldnews_kzm.3.a: "旧矛盾或已消融，可新的矛盾接踵而来。"
 worldnews_kzm.4.t: "[Get_newspaper_header]卡西米尔的军事政变"
 worldnews_kzm.4.d: "在不断迫近的政治危机面前，卡西米尔征战骑士团的军人们显然已经忍无可忍。此等局势之下，克莱门德·佐洛夫，一位曾在第十次乌卡战争中功勋卓著的老将军选择联合起大多数支持民族主义与复仇主义的征战骑士进军大骑士领。在突袭并暂停国民院与监正会的职能后，他公开宣布启动全国戒严与军事战备状态。\n\n这位颇受卡西米尔民众尊敬的将领在演讲中宣称：“鉴于卡西米尔联合领的独立与稳定性正遭受重大威胁，非常时期必须使用非常手段保卫国家，特别是保卫卡西米尔免受别列卡维亚帝国主义等外部敌人的侵害。”\n\n佐洛夫的演讲在卡西米尔各地引起了一阵民族主义浪潮，但外部对此事褒贬不一。哥伦比亚方对于军政府的“专制统治”取代前文官政府表示了抨击，而乌萨斯帝国更是对佐洛夫的民族主义立场大加驳斥。随着政治动荡，一些外国企业已迁出卡西米尔，没人知道未来会发生什么。"
 worldnews_kzm.4.a: "投笔从戎。"
 worldnews_kzm.5.t: "[Get_newspaper_header]卡西米尔的军事政变"
 worldnews_kzm.5.d: "在不断迫近的政治危机面前，卡西米尔征战骑士团的军人们显然已经忍无可忍。此等局势之下，克莱门德·佐洛夫，一位曾在第十次乌卡战争中功勋卓著的老将军选择联合起大多数支持民族主义与复仇主义的征战骑士进军大骑士领。在突袭并暂停联合领中央机构监正会的职能后，这位将领向全国发表公开演讲，宣布了他的计划。\n\n演讲中，佐洛夫大力批判了旧政府的软弱无能，以及他们是如何致使卡西米尔到如今地步的。在演讲的最后，佐洛夫宣称他将发动一场名为“萨纳齐亚”，即拉特兰语中“治愈”的运动。为完成这场使政治体制取得道德治愈的伟大事业，他已支持组建“无党派政治合作集团”作为新的执政机构，但也保留了部分旧政府的民主机构。而佐洛夫将军相信，这场运动必将引领卡西米尔洗净一切脏污，走向民族精神的重生。"
 worldnews_kzm.5.a: "他们真能像其所说的那样完成“治愈”吗？"
 worldnews_kzm.6.t: "[Get_newspaper_header]卡西米尔商业联合会夺权"
 worldnews_kzm.6.d: "在不断迫近的政治危机面前，卡西米尔监正会与国民院等中央机构正不断丧失原本的力量。此等局势之下，大骑士长伊奥莱塔·罗素不得不引咎辞职。当政府陷入混乱，卡西米尔正向深渊滑落之时。商业联合会——这个长久以来被视作“影子政府”的商业组织却悄然掌控政府，并以组建“国民紧急状态委员会”维护国家秩序为名在事实上政变夺权。\n\n商业组织夺取政权或许对外界的人们来说有些不可思议，但考虑到其在政府与社会中强大而广泛的影响力，以及近些年对于政府官员的诸多收买贿赂，这一结果或许并非意料之外。"
 worldnews_kzm.6.a: "庞大的商人共和国。"
 worldnews_kzm.7.t: "[Get_newspaper_header]第二十四届卡西米尔骑士竞技特锦赛开幕"
 worldnews_kzm.7.d: "今日上午，第二十四届卡西米尔骑士竞技特别锦标赛开幕式在“大骑士领”卡瓦莱利亚基如期举行。诸多来自卡西米尔政府与民间机构的高级代表莅临开幕式，大会特邀宾客莅临盛会，各赛区发言人应邀出席。[KZM.GetLeader]主持开幕式并代表政府致辞。他在致辞中表示，骑士竞技以旷古烁今的方式继承了卡西米尔源远流长的骑士精神，续写了卡西米尔辉煌且不朽的史诗篇章。\n\n“我相信每一个卡西米尔人都乐于看到，公正、坚定、重视荣誉、追求卓越的骑士美德并没有在这个高速前行的时代中褪色。通过三年一度的骑士竞技赛事，我们向整片大地传递出一个清晰的信息，那就是坚韧团结的卡西米尔不会在任何挑战面前退缩。”在经久不息的掌声中，[KZM.GetLeader]宣布特别锦标赛正式开幕，并对参赛骑士致以崇高的祝福。"
 worldnews_kzm.7.a: "有趣。"
 worldnews_kzm.8.t: "[Get_newspaper_header]第二十四届卡西米尔骑士竞技特锦赛的落幕" #未启用
 worldnews_kzm.8.d: "在昨夜进行的卡西米尔骑士竞技特别锦标赛决赛上，耀骑士玛嘉烈·临光与血骑士狄开俄波利斯为全泰拉的骑士竞技爱好者们奉上了一场荡气回肠的大战。激烈的对抗甚至损坏了双方的武器，源石技艺的碰撞成了决定胜负的关键。最终，血骑士惜败于耀骑士之手，耀骑士玛嘉烈·临光荣获本次特锦赛冠军。这是耀骑士第二次在特锦赛上夺冠。\n\n比赛结束以后，两位骑士将不朽的骑士精神贯彻到了最后一刻：耀骑士搀起了力竭倒地的血骑士，二人互相扶持，一直行进到冠军墙。\n\n[KZM.GetLeader]盛赞两位参赛骑士的友爱精神，称昨夜是见证了崇高美德的一夜。“在捍卫荣誉的同时不忘尊重对手，这也是我们应当从骑士竞技中学到的美德之一。”"
 worldnews_kzm.8.a: "骑士精神的重振？"
 worldnews_kzm.9.t: "[Get_newspaper_header]第十一次乌卡战争"
 worldnews_kzm.9.d: "随着乌萨斯帝国与东达利亚对立政权的战端开启，卡瓦莱利亚基方面很快便作出反应。数十万征战骑士集结于乌卡边境，在帝国还未做好完整战略策划前便抢先发动攻势。坦克与装甲车驶过平原，向圣骏堡奔去；而前线的乌萨斯军也架起机关铳，做好了殊死防卫国土的准备。\n\n两国间的悬殊差距无疑使人们对卡西米尔之胜算感到担忧，而第十次乌卡战争的前车之鉴也无疑加深了这份印象。部分报导指出卡西米尔征战骑士团战果匮乏，推进吃力；某些看法则确信其能够在一场“闪电战”之后守住所夺成果并全身而退。无论外界对此事如何去看，北方的战争态势现已愈演愈烈。或许此战就将成为乌卡之间的最终之战，又或许只会如同先前的十次战争般以一方边境的小小推进收尾。"
 worldnews_kzm.9.a: "烈火燎原。"
 worldnews_kzm.10.t: "[Get_newspaper_header]骑士蒙羞"
 worldnews_kzm.10.d: "随着最后一位征战骑士放下武器，这场名为“第十一次乌卡战争”的北方大战就此落下帷幕。或许卡西米尔在战争初期的确取得了一些成果，但后续的败退与伤亡很快便将乐观情绪无情击碎。无数军人以革裹尸，多座边境城市连遭乌萨斯攻陷，卡西米尔人的战斗意志逐渐消散，而战线也止不住地后退。\n\n在一切的最后，随着“和平协议”签署，两国冲突似乎画上了句号。这则严苛的协议规定卡西米尔必须重新组建一个听命于乌萨斯方面的新政府，其内政、外交、军事皆受管控且允许乌萨斯驻军，并向乌方支付大量战争赔款。议和消息一出，即便是卡西米尔最为消极的投降派人士也为此感到难以置信。反条约抗议开始在城市中蔓延，或许一场足以推翻政府的广泛社会运动正迫在眉睫。"
 worldnews_kzm.10.a: "巨熊终胜。"
 worldnews_kzm.11.t: "[Get_newspaper_header]卡西米尔政府镇压民权抗议"
 worldnews_kzm.11.d: "卡西米尔近期再度崛起的民权运动已经持续数日，而它也似乎正向着最糟糕的方向前进。随着国民院匪夷所思地连续两次否决《[GetYear]年公民权保障法案》，卡瓦莱利亚基方面不得不选择以武力镇压来解决这场危机。\n\n如今，各大城市街头都已堕入动荡。手执盾牌警棍乃至荷铳实弹的警察正与民众对峙。抗议大军的领头者，卡西米尔国民权益与消除感染者歧视运动领导人切赫·瓦科夫丝卡向哥伦比亚呼吁调停这场“非民主的镇压”，并大力批评监正会此举无异于复辟天马王朝的专制统治。而政府所控制的媒体亦反驳她不过是“纳罗主义者的棋子”\n\n随着卡西米尔陷入不稳，乌萨斯方立即着手向边境增兵以戒备可能发生的联合领政治变局，而哥伦比亚方面亦对此事高度关注。但目前仍无法确定这场危机将以何种结局收尾。"
 worldnews_kzm.11.a: "大骑士领的烂摊子。"

