 #领导人
 KZM_Clement_Zoroff: "克莱门德·佐洛夫"
 KZM_Clement_Zoroff_military_junta_subtype_desc: "卡西米尔病了，它在贵族们的虚伪道义与商人们的急功近利之中已然病入膏肓。只剩躯壳的伟大民族精神正被名为所谓“创新”的恶意填满，代表荣光的旗帜如今沾满了阴谋的污渍。当年曾与战友们一同于第十次乌卡战争中挽救祖国的克莱门德·佐洛夫清楚，若再不出手制止这群无能政客，联合领必将堕入万劫不复的深渊。\n\n够了！一个声音在将军的内心深处嘶吼。他收拾行装，联络旧部，带领那些尚存爱国之心的征战骑士们跨越属于他的“卢比孔河”，在卡西米尔如一辆失控列车般坠入崖底之前终结了腐朽的贵族共和制。如今，一个崭新的，充斥复仇狂热的新政权于旧联合领的废墟之上崛起。\n\n历经岁月风霜的佐洛夫将军清楚，乌萨斯，抑或者说别列卡维亚帝国主义的扩张野心绝不会消逝。而在过去、现在、未来，它也将永远是卡西米尔的最大之敌。为维护祖国的独立与守护人民免受外敌侵害，他以一场充满着民族主义煽动的演讲开启了属于第二共和国的时代，并以征战骑士团之名启动了全国戒严与永久战备状态。许多旧日的民主机构纷纷遭到剔除，而国民院与监正会亦“关门大吉”。克莱门德·佐洛夫正屹立于名为权力的高塔之巅，而那些协助他登上塔顶的激进派征战骑士们则如扈从般簇拥着这位无冕之王。属于老将军的征程不会停歇，也将永无休止之日。"
 KZM_Clement_Zoroff_civilian_dictatorship_subtype_desc: "卡西米尔病了，它在贵族们的虚伪道义与商人们的急功近利之中已然病入膏肓。只剩躯壳的伟大民族精神正被名为所谓“创新”的恶意填满，代表荣光的旗帜如今沾满了阴谋的污渍。当年曾与战友们一同于第十次乌卡战争中挽救祖国的克莱门德·佐洛夫清楚，若再不出手制止这群无能政客，联合领必将堕入万劫不复的深渊。\n\n够了！一个声音在将军的内心深处嘶吼。他收拾行装，联络旧部，带领那些尚存爱国之心的征战骑士们跨越属于他的“卢比孔河”，在卡西米尔如一辆失控列车般坠入崖底之前终结了腐朽的贵族共和制。如今，一个崭新的，充满活力的新政权于旧联合领的废墟之上崛起。\n\n对心怀救国理想的佐洛夫将军而言，若想彻底医治卡西米尔的身上沉疴，一剂猛药必不可少，而“萨纳齐亚”便是佐洛夫扫清顽疾的靶向良药。这场名曰治愈的运动正在从上到下地塑造第二共和国的一切：旧日盘根错节，由无数政党、组织、政府机关与贵族骑士构建起的政治体系正被连根拔起。而通过佐洛夫将军高明的政治手腕与对反对派的巧取豪夺，由他所支持组建的无党派政治合作集团必将成为国家的唯一掌控者。不过，虽有着改变体制的雄心壮志，佐洛夫将军却并不想在后世留下个声名狼藉的暴君形象。他虽已将曾经执掌国家大权的监正会“无限期暂停”，但并未给予国民院同等待遇。一些旧时代的所谓民主得以保留，而曾经的反对党们虽被压制，但仍被准许活跃于政坛之中。尽管反对之声依旧存在，但克莱门德·佐洛夫已然巩固了他的新政权，而属于他的“治愈”之路也将继续向前。"
 KZM_Felix_Teutski: "费利克斯·特奥茨基"
 KZM_Felix_Teutski_REU_subject_desc: "费利克斯·特奥茨基，卡西米尔共产党无可争议的核心人物。这位人称“铁塑之人”的强硬领袖虽生于贵族家庭，但自年少时便展现出了与众不同的政治倾向。他在年仅十六岁时便参与了一些民间的马佐夫主义团体，而在后来又与在这些团体中的伙伴们一同加入卡西米尔共产党。凭借他忠实与公正的性格与对群众组织及内鬼排查工作的精通，特奥茨基很快便进入了党的高层，并在前任党主席不幸被资产阶级政府判处终身监禁后接任了这一职位。\n\n尽管从先辈手中接过了火炬，但特奥茨基与卡共所面对的局面仍处内外交困之中。内有党内国际派与民族派的矛盾，外有资产阶级政府与反动秘密结社的围追堵截和秘密渗透。不过虽说上任以来的局势一直不妙，但特奥茨基依然通过确立指导思想与数次党内整风勉强稳住党内，并借监正会与商业联合会间的矛盾躲过了一次次冲击。可这些手段虽能保全革命火种，但却无力使组织发展壮大。\n\n直到，那场名为“第十一次乌卡战争”的变局发生。\n\n一支来自乌萨斯东部的红军出人意料地统一了处于混乱之中的东达利亚，并向西进军，一路攻灭帝国，甚至在收回被卡西米尔资产阶级政府所侵占土地之时将前者全境解放。卡西米尔革命就以这种出乎特奥茨基意料的方式成功了，而卡共也在乌萨斯同志们的支持下建立了如今的卡西米尔人民共和国。可作为前政府所遗留代价的一部分，新生的人民共和国被迫向苏维埃联盟支付大量赔款，并在内政、外交、军事诸个方面处处受制于人。党内的民族派大呼不公，而国际派也对由乌萨斯同志所带来的“解放”怀有相当复杂的情绪。但至少，特奥茨基可以开始他对卡西米尔的社会主义改造任务了。旧时代的反动派分子将得到他们应有的结局，而那些心怀理想的进步人士们则会在党的引领下一同建设社会主义祖国。"
 KZM_Czech_Vacovska: "切赫·瓦科夫丝卡"
 KZM_Dreiswaf_Bogdanow: "德莱丝瓦夫·博格丹诺"
 KZM_Ioletta_Russell: "伊奥莱塔·罗素"
 KZM_Ioletta_Russell_desc: "在卡西米尔还未完全沉入消费主义狂热与政治内耗的泥潭之时，人们就已熟知“罗素”这个姓氏。伊奥莱塔·罗素出身传统骑士贵族，幼年便接受骑士教育，因而可贵地理解骑士之道不是舞台表演，亦非待价而沽的商品，而是代表着责任、坚守与牺牲的可贵精神。\n\n异于一些选择成为竞技骑士的同辈人，伊奥莱塔的荣誉并非来自赛场，而是于战争烈火之中锻造而成。1072年的第十次乌卡战争无疑是卡西米尔民族记忆中恢弘的一章，也是改变伊奥莱塔人生的一刻。那场战争之中，敌军锋锐如潮，八位征战骑士被迫在绝境中突围。最终，仅有伊奥莱塔与基里尔·临光共两人幸存，而在他们的坚持指挥下，三十名银枪天马部队得以从乌萨斯军的包围里被完整救出。此战不仅取得了辉煌胜利，也使尚且年轻的伊奥莱塔登上了骑士们心目中的高座，人们将她视作国家英雄，而征战骑士们尊称她为“大宗师”。\n\n战火平息之后，伊奥莱塔的视野并未停留在胜利的凯歌与丰碑上。她在战场上见过太多因制度缺陷与商业化浪潮而被遗忘的普通骑士，也看到越来越多“荣誉”沦为交易筹码、竞技场成为政治与资本角斗的舞台。她明白卡西米尔正在变得陌生——但若不保护硕果仅存的精神根基，一切都将如风中残灰般被时代吞没。因此，伊奥莱塔选择以自己的方式缓慢重塑传统。坐上大骑士长之位后，伊奥莱塔选择在军事与政治间维护脆弱的平衡。她并不赞成商业联合会过度插手军政，也反对以暴烈手段摧毁旧秩序。伊奥莱塔选择的道路，是同时推动稳健改革与维护文化传统，让那些仍相信骑士精神之人能够继续站在国家的中央，而不是被时代抛弃。如今，虽国内依然饱受明面上的社会分裂与阴影中的政治斗争困扰，但伊奥莱塔·罗素仍继续着她的道路。也许她能够继续平衡各方力量，引领联合领走向正轨；抑或在时代大潮的冲刷下无力前进，最终只得将权柄交予他人。"
 KZM_Ignacy_Daszek: "伊格纳齐·达谢克"
 KZM_Ignacy_Daszek_UFE_subject_desc: "当他受花语运动鼓舞初创社会党之时，尚且年轻的伊格纳齐或许做梦都想不到自己有朝一日竟能成为国民院的议长；而在他头一次坐上议长座位之时，已成为一位老成政治家的达谢克也绝无可能预料到如今的巨大变局。乌萨斯大革命战争最终以帝国覆灭，新共和国建立收尾。而试图干预这场战争以夺取领土的卡西米尔旧政府也在乌萨革命民主主义者的攻势下灰飞烟灭。乌萨斯军队踏过大骑士领街头，可令达谢克与市民们惊讶的是，他们竟不仅对民众秋毫无犯，还声称其带来的是“解放”而非“征服”。\n\n在乌萨斯人于卡瓦莱利亚基短暂施行的军事管制结束后，达谢克收到了令他更为惊讶的消息：随着乌卡和平协议正式签署，新的民主制卡西米尔新政府已经开始筹建。而就在此时，一封来自别列卡的信送到了前议长手中。令达谢克难以置信的是，乌萨斯人竟在信中邀请他担任新政府的国家领导人一职。伊格纳齐·达谢克陷入了两难抉择之中，但最终，他还是选择向乌萨斯人做出让步，决定屈从于别列卡方面。于是，随着达谢克将由他亲手创建的社会党再度重组，卡西米尔民主革命之路自此启程。这条追随乌萨斯革命的道路必将道阻且长，而达谢克也未必不会在这条路上背负诸如“叛国者”、“乌萨斯人的傀儡”等等骂名。但他必将锲而不舍，就如同往日一样。"
 KZM_Czarny: "恰尔内"
 KZM_Czarny_desc: "恰尔内——商业联合会卡瓦莱利亚基执行理事会常任委员、纪念赛特别监督官，亦是卡西米尔商业联合会的发言人之一。他代表了这个国家统治者与企业利益的聚合体，是一位游走于权力光影之间的大政治家。\n\n恰尔内的起点却远离都市繁华：他出生在一座无名村庄，自幼在父亲经营的小酒庄里长大。日复一日跟随父亲操持生计，在酒香与市井交谈之间，少年恰尔内早早谙熟了人情世故与经营之道。那段身处谷底的岁月，不仅磨炼出他敏锐的商业嗅觉与驾驭人心的手腕，更铸就了他作为先驱者坚韧的意志，以及那份渴望改变命运的果决。\n\n凭借才能与谋略，他迅速跻身卡西米尔的上流阶层，举家迁居首都卡瓦莱利亚基，开始享受奢靡无度的生活。然而，随着权力日益膨胀，恰尔内逐渐沉入水面之下的暗流。他变得老谋深算、冷酷无情，精于权术操弄与人心博弈。他在各处布下眼线，编织起一张笼罩舆论的无形网络。他动用秘密资金收买解说员莫布，使其化作商业联合会的喉舌；他将小职员马克维茨招揽麾下，成为棋局中一枚听话的棋子。\n\n当来自感染者群体的焰尾骑士意外赢得比赛并引发舆论风暴后，恰尔内为确保赛事走向不偏离财团掌控，暗中指使白金处理掉其他可能掀起波澜的感染者骑士。在他眼中，只要卡西米尔商业联合会这台庞大的机器持续运转，只要背后的贵族与财团利益得以满足，一切手段——无论多么阴暗——都是值得的。\n\n然而，在卡西米尔，控制与反噬往往是一体两面。随着赛事多次失控、民间抗议声浪渐起，恰尔内逐渐意识到：自己一步步攀上的云端天宫，实则悬于钢丝之上。稍有不慎，便会坠落深渊，摔得粉身碎骨。"
 KZM_Malkiewicz: "马克维茨"
 KZM_Malkiewicz_desc: "马克维茨的生涯轨迹好似这片大地权力结构嬗变的一则注脚。出身小商贩家庭的他，凭借对文书近乎烙印般的记忆力与雷厉风行的作风，被商业联合会选中，在整整十年间扮演着恰尔内最忠诚的传声筒与执行者：向临光家族递出“合作邀请”，在锦标赛后平息多家赞助商的怒火，手捧加密终端静候无胄盟的行动回报……直至那个改写一切的夜晚，恰尔内骤然失势，他在更衣室颤抖着接过那部仍在震动的内部电话。命运于此急转——昨日尚在斟酌字句的文员，今日已被数只权力的大手推至台前，黄袍加身，担任商业联合会的最高形象代表。\n\n骤然加身的权力外套沉重如铁。他试图留住自己的旧物，作为清醒的锚点，却终究在清洗区块的决议上签下姓名。窗外交替掠过霓虹残光与晨间霞色，映照着那个终于从传声筒蜕变为执笔者的身影。他正在学习，用另一种语法书写这座城市，甚至于整个联合领的未来。"
