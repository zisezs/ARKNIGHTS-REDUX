 #民族精神
 KZM_Society_of_the_Spectacle: "景观社会"
 KZM_Society_of_the_Spectacle_desc: "一位古高卢哲学家曾提出“景观社会”概念，即人们的消费主义狂热已不局限于实物商品，而是将受物化产生的各类“景观”作为消费对象。或许卡西米尔无法完美符合其设想，但联合领的一切都同书中所描绘的情景何其相似。\n\n广泛娱乐致使人们逐渐沦为“景观”控制的奴隶，在一场又一场骑士竞技节目中迷失自我。竞技骑士注册数量逐年增高，消费市场永远保持高涨热情，可每个人真正的灵魂——属于自我的创造力与主体性却逐渐消逝。曾因数场乌卡战争兴起的军工业缓缓衰落，而社会也在如钝刀割肉般丧失血性。"
 KZM_The_Legacy_of_Chivalry: "骑士精神的遗产"
 KZM_The_Legacy_of_Chivalry_desc: "卡西米尔联合领的人民们在古代便终结了王政，但这不意味着它在后世走向了民主共和之路。在天马王室被愤怒的骑士、扈从与平民推翻后，曾为国王效忠的骑士们踏入了王宫议事厅。他们在长桌旁达成妥协，建立了一个延续至现代的古老组织——监正会。在其联席会议协调治下，卡西米尔逐渐抛掉了君主时代的包袱。而随着骑士协会与国民院相继成立，延续至今的贵族共和制真正成型。\n\n骑士在这套制度中拥有崇高地位，直到今日仍是如此。贵族骑士们掌控巨大权力；征战骑士作为勇猛的士兵冲杀疆场；而最广泛的竞技骑士们也对国民经济至关重要。骑士构成了卡西米尔的一切，而骑士精神也受人们崇敬。可随着骑士竞技的愈发商业化，长期安宁养成的“和平病”，以及征战骑士中的普遍自满情绪，骑士精神正缓缓从卡西米尔人心中消退。或许有一日，它能够在烈火中被再度唤醒；又或许，关于骑士们的崇高精神将在某日最终消逝。"
 KZM_Kazimierz_Armed_forces: "卡西米尔征战骑士团"
 KZM_Kazimierz_Armed_forces_desc: "铁一般的双臂在阳光下摆动,\n\n他们双眼坚定自豪看向远方，\n\n他们身着灰衣，步铳铁光烁烁，\n\n步兵，这些灰衣步兵！"
 KZM_Kazimierz_People_Army: "卡西米尔人民军"
 KZM_Kazimierz_People_Army_desc: "越过山和岭，打敌人不留情；\n\n我们要走多少路，才能看到金色的麦田？\n\n工农们，拿起铳，和敌人坚决拼！\n\n前进，光荣的第一军！越过山河，向远方挺进！"
 KZM_Deep_State: "“深层政府”之影"
 KZM_Deep_State_desc: "理论上来说，作为一个民间经济组织的商业联合会不应当拥有这般强大的政治影响力。可令人不得不承认的是，它如今已成为了卡西米尔政治中举足轻重的部分。人们的经济活动与公共事务所需要的服务受其尽数垄断，甚至众多至关重要的基础产业也被外包给了商业联合会旗下企业。\n\n商业联合会在数十年的扩张中不断壮大，而如今甚至已成为了公众眼中的“深层政府”，拥有在暗地里操纵卡西米尔政治的强大力量。比这更糟糕的是，其野心似乎不至于操纵政治——而这一点已然众人皆知。与其关系不明不白的民间武装组织无胄盟长期进行暗杀破坏稳定，而许多政府要职人员也在接受商业联合会贿赂与其影响。或许没人知道他们的最终目的是什么，但名为“深层政府”的阴影始终笼罩于人们头上。"
 KZM_Omniscient_Eye: "全知之眼"
 KZM_Omniscient_Eye_desc: "从由扈从团改组而来的平庸商会，到卡西米尔政界不可忽视的力量，再到如今作为整个国家的主导，商业联合会无疑经历了许多。在政治危机的回响之中，商人们抓准时机，通过政治阴谋与金钱贿赂夺得政权。而在拿下监正会的大骑士长之位后，一场大清洗如飓风般扫过诸多政府机构，就此将旧时代的军事贵族们扫出权力之巅。\n\n一切已然尘埃落定，卡西米尔从旧日的贵族共和国转变为了寡头企业统治的商业国家。在这套新体制中，商业联合会中的金融与工业巨企们高居王座，而与其达成合作关系的小企业们则作为国王权杖之下的忠诚封邑或是仆从。经济进入了先前未有的高速增长，而曾经潜伏于表层之下的“金元帝国”也走向台前，成为了当世的无冕之王。"
 KZM_Kleptocracy: "窃盗统治"
 KZM_Kleptocracy_desc: "或许在外界看来，于表层掌控国民院与监正会的商业联合会发言人便是新卡西米尔的无冕之王。但若你对这个新兴的企业国度有着更深层次的了解，便会清楚那位似乎“大权独揽”的领导人也不过是一个拥有更大权力团体的发声筒罢了。而这个真正掌权的群体并非阴谋论中足以控制泰拉的秘密结社，而是商业联合会幕后的董事与投资商们——或者说，那些“窃取国家”的寡头。\n\n在商业联合会还是个“平常商业组织”的年代，一张由商人、企业与官僚编织的关系网便渗透进联合领的各处。而在这“影子政府”登上台前之后，它更是肆无忌惮地扩张，直至如今成为国家的附骨之疮。权钱交易与政商勾结已是社会常态，而更糟的是，政府部门不仅对此熟视无睹，反而一路大开绿灯。虽说贪腐作为“润滑剂”的确客观促进了新联合领的运转与发展，但若长久放任，它势必会在未来酿成大祸。"
 KZM_Yield_of_KGCC: "商业联合会的屈服"
 KZM_Yield_of_KGCC_desc: "数场大张旗鼓的反腐运动，几位政府中贪污官僚的落网，以及针对商业联合会背后高层的公开犯罪调查。以上的这一切或许无法真正消除商业联合会对国家政治的强烈影响，更难以将这个庞大的势力圈连根拔起，但它却能够成功挫败前者的扩张甚至夺权阴谋，并使其在政治上“认输”。\n\n那个曾经飞扬跋扈，大肆操纵政商关系的商业联合会已逐渐消停。或许这些自命不凡的商人总会明白，他们的“金元政治”终究无力撼动国本。而在不久以后，商业联合会也将最终转型为一个心甘情愿同政府合作的强力经济盟友，而非旧日妄图以下克上的可笑“影子政府”。"
 KZM_Civil_Rights_Dissent: "民权异议"
 KZM_Civil_Rights_Dissent_desc: "尽管国内的感染者问题并不尖锐，但这不代表卡西米尔社会有着高度稳定性与公平性。作为少数残存奴隶贸易的现代国家，联合领的许多法律已经严重落后于时代，而发展不均与豪强富商压迫也致使民众怒火积压。与移动城市的繁荣与高速发展不同，乡村地区长久以来处于欠发达境地。农民们难以使用上现代科技，而商业联合会的廉价收购则致农村贫困状况长久毫无改善。\n\n自1090年至1094年的四年间，乡村居民的年收入仅仅增长了可怜的55马克，而城市居民的则大步提升了六千有余。“剪刀差”不断以夸张的速度扩大；对感染者地位的争执从未停止；而奴隶制度也无疑是颗危险的定时炸弹。卡西米尔看似平稳的表面之下暗藏危机：虽说在稳定的当下似乎无人注意这些话题，可若时局有变，有关民权的小小争议或将成为变革之种。"
 KZM_Civil_Rights_Riot: "民权暴动"
 KZM_Civil_Rights_Riot_desc: "《公民权保障法案》被连续否决两次，而政府为此也不得不在民权运动中采取强硬立场。一切致使这场或许本可得到缓和的运动被激进化之潮淹没，如今已转化为一场极端的反政府暴乱。那个可耻的煽动者——前电工，如今哥伦比亚纳罗主义者眼中的“最美卡西米尔人”切赫·瓦科夫丝卡正孜孜不倦地输出着各类反政府言论，而诸多大城市的街头也陷入火海之中。\n\n防暴警察与高压水枪车在街道上与抗议人群紧张对峙，少数激进团体发起了对重要政府设施的“围攻”行动，而诸如民族激进党与共产党等激进党派也以不同的程度卷入冲突。如今局势已极端紧张，而某些非政府组织的暗中干涉更是致使其火上浇油。或许，这场政治运动将彻底改写联合领的历史。又或许，它将在最终正式宣告民粹主义者大梦的破产。"
 KZM_Civil_Rights_Dissent_Was_Suppressed: "被镇压的民权异议"
 KZM_Civil_Rights_Dissent_Was_Suppressed_desc: "结束了，曾经声势浩大，在卡西米尔国内有着强大影响的民权运动已经结束了。切赫·瓦科夫丝卡锒铛入狱，而众多小头目与他们的手下组织也被逐一粉碎。而为反制国民权益运动的愚行，有关感染者隔离与强化奴隶制的诸多法案也在愈发壮大的强硬派支持下得到通过。\n\n显然，随着民权之火终遭扑灭，卡西米尔的未来只会更加向威权主义倾斜。许多遭到镇压与言论禁锢的进步主义人士与遭到更深压迫的感染者正在逃离联合领，而被进一步固化的奴隶制也显然带来了更加严重的社会不公。但至少，那些肆无忌惮发表异议的家伙已被平定。"
 KZM_Civil_Rights_legislation_Low: "象征性公民权保障立法"
 KZM_Civil_Rights_legislation_Low_desc: "于声势浩大的民权运动面前，国民院诸位议员的各自主张最终汇聚为了三股浪潮——分别是强硬派所主张的武力镇压、以大骑士长为中心的温和派所支持的让步、以及议长达谢克提出的全面改革。而在最终，伊奥莱塔·罗素的中道提议得到了最多人支持。《公民权保障法案》得到通过，而骑士竞技也就此准许感染者的参与。\n\n瓦科夫丝卡与她的那帮民粹分子在此等让步之下总算消停，而联合领也在危机过后继续平稳航行。尽管奴隶制问题依旧未定，而那些在民权运动中以罢工寻求土地改革的农民也未能实现其诉求，但这项改革的确为卡西米尔社会带来了不少改变。"
 KZM_Civil_Rights_legislation_High: "全面公民权保障立法"
 KZM_Civil_Rights_legislation_High_desc: "于声势浩大的民权运动面前，国民院诸位议员的各自主张最终汇聚为了三股浪潮——分别是强硬派所主张的武力镇压、以大骑士长为中心的温和派所支持的让步、以及议长达谢克提出的全面改革。而在最终，达谢克被认为极具自由主义倾向，甚至过于偏袒抗议者的提议惊人地取得成功。一部激进的《公民权保障法案》在艰难获得超半数投票支持后得到通过，奴隶制就此遭到废除，感染者获得完全平等权力，而其中关于农业改革的条文更是令农民们欢欣鼓舞。\n\n虽说商业联合会高层与强硬派议员们对此事在震惊之后空余愤怒，但一切已然落定。而《公民权保障法案》也在不断落实之中，或许这意味着卡西米尔已经迈出了进步之路的第一个脚印。"
 KZM_National_martial_law: "全国戒严"
 KZM_National_martial_law_desc: "正如那则叙拉古史诗一般，腐朽的卡西米尔贵族共和制最终被一位强人终结。克莱门德·佐洛夫跨过了属于他的卢比孔河，并从旧日战友与最后一任大骑士长伊奥莱塔·罗素的手上夺下权柄，成为了新国家的独裁者。那些在通往权力之路上辅佐他的同僚——征战骑士团之内的民族主义与复仇主义者军官们纷纷在新政府中得到提携，但民间却对这新秩序充满恐慌乃至不满。\n\n面对如今卡西米尔所遭之危局，佐洛夫将军在上台后第一时间便签署政令，在全国各地启动无差别的戒严令。装甲车与征战骑士行过街头，而诸如国民权益运动、民族激进党与共产党等反政府分子都得到了强力镇压。很快，军政府便将彻底掌控这个国家，并消灭所有异议。"
 KZM_Permanent_state_of_combat_readiness: "永久战备状态"
 KZM_Permanent_state_of_combat_readiness_desc: "卡西米尔的最大敌人是谁？它并非可笑的民粹分子瓦科夫丝卡，也绝不会是激进分子特奥茨基与博格丹诺，即便“影子政府”商业联合会亦无法担当这个角色。卡西米尔真正的最大敌人远在天边，而又近在眼前，它便是别列卡维亚（即乌萨斯）帝国主义。\n\n千百年前，可耻的别列卡强盗，所谓“大帝”伊戈尔窃取了骏鹰皇冠，并将自己的别列卡维亚帝国视作能够代表大地上一切乌萨斯族的国家。然而，佐洛夫将军清楚，这帮野蛮人的骗局不会再持续多久了。为在未来击败窃据圣骏堡的别列卡维亚人，他已将全部军力动员并启动永久战备状态。如今，卡西米尔正如同一台机械巨兽全速运转。一切干柴烈火都被投入那熔炉之中，而克莱门德·佐洛夫与他祖国的目的仅有一个：§R向别列卡人复仇，讨回十次乌卡战争之中所牺牲英灵的血债§!。"
 KZM_Sanacja_idea: "“治愈”运动"
 KZM_Sanacja_idea_desc: "正如那则叙拉古史诗一般，腐朽的卡西米尔贵族共和制最终被一位强人终结。克莱门德·佐洛夫跨过了属于他的卢比孔河，并从旧日战友与最后一任大骑士长伊奥莱塔·罗素的手上夺下权柄。而在那场技惊四座的演讲之后，无党派政治合作集团正式接替了原属监正会的行政权力，获得了前无古人的强大政治力量。\n\n如今，一阵名为“萨纳齐亚”的飓风正自卡瓦莱利亚基而起席卷全国。虽说并不是所有人都喜欢佐洛夫将军融合了社会主义、法西斯主义、民族主义、法团主义与民粹主义的“特别”思想与这个同样“特殊”的独裁政府，但无可否认，“治愈”运动的确为曾如死水一般毫无活力的卡西米尔政治带来了不少变化。"
