 # 面板 · 音孔与调性
 LTN_law_tt_tax: "赋税音孔：高档国税多、民心掉；低档留成多、民心高。点击循环 0→4。\n★ 4 档：每区 +0.9% 建造速度；1 档及以下：每区 -1.1% 建造速度。"
 LTN_law_tt_levy: "兵役音孔：高档中央征兵多、选帝侯不满；低档私兵保留。点击循环 0→4。\n★ 4 档：每区 +0.9% 可征募人口；1 档及以下：每区 -1.1% 可征募人口。"
 LTN_law_tt_arts: "法术征用音孔：高档术师与法器被抽调到中央；低档本地产出繁荣。点击循环 0→4。\n★ 4 档：每区 +0.9% 研究速度；1 档及以下：每区 -1.1% 研究速度。"
 LTN_law_tt_tone: "调性拨片：宽容 = 允许旧俗（民心高，但乐章有偏差）；严苛 = 强制同轨（音准，但民心掉）。"
 LTN_law_v1_mood_txt: "民心 [?LTN_law_voice_1_mood]"
