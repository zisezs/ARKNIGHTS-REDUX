 # 面板 · 结算栏
 LTN_law_sum_head: "结算栏"
 LTN_law_sum_harmony: "和谐度　[?LTN_law_harmony|0]"
 LTN_law_sum_source: "民心合计　[?LTN_law_source]"
 LTN_law_sum_dev: "乐章偏差（宽容声部）　[?LTN_law_dev]"
 LTN_law_sum_cr: "共鸣 [?LTN_law_res_count]　/　冲突 [?LTN_law_conf_count]"
 LTN_law_sum_conf: "§Y共鸣§!：平民入塔学堂 + 抑制剂官费；金律法卫扩编 + 军乐制式。\n§R冲突§!：女皇之声扩权 遇上宽容声部过半；金律法卫扩编 遇上高赋税声部过半。"
 LTN_law_fc_stable: "〔稳〕"
 LTN_law_fc_risky: "〔险〕"
 LTN_law_fc_crash: "〔崩〕"
 LTN_law_cooldown_txt: "§Y余波未平（剩 [?LTN_law_cooldown] 天）§!"
 LTN_law_cost_hint: "征收合计：兵役 [?LTN_dial_pop_i|0]%　赋税 [?LTN_dial_build_i|0]%　法术 [?LTN_dial_res_i|0]%\n预演 25 政治点｜奏响 50 政治点并进入 90 天余波"
 LTN_law_btn_preview: "预 演"
 LTN_law_btn_preview_tt: "先听一遍：合奏会指出哪几条声部在走音。花 25 政治点，可反复。"
 LTN_law_btn_enact: "奏 响"
 LTN_law_btn_enact_tt: "当着全国的面颁布这一版乐章。版本号 +1，随即进入 90 天余波，期间不可再调。"
 LTN_law_btn_reset: "复 位"
 LTN_law_btn_reset_tt: "把音孔拨回中位、调性拨回宽容、撤下全部条款卡 —— 清空本轮草稿。"

 # 面板 · 条款卡
 LTN_law_cards_title: "三大篇章 · 条款卡（点击启用 / 停用）"
 LTN_law_card_pleb: "平民入高塔学堂"
 LTN_law_card_pleb_tt: "【法理】平民与贵族坐在同一个教室，是几百年争取来的资格。研究 +4%。与「抑制剂官费」共鸣。"
 LTN_law_card_herald: "女皇之声扩权"
 LTN_law_card_herald_tt: "【法理】女皇之声可传谕侯爵、接管案件。稳定 +4%。但若宽容声部过半，诸侯会集体抵制。"
 LTN_law_card_siracusa: "重新插入叙拉古声部"
 LTN_law_card_siracusa_tt: "【法理】把 969 年被剔除的第九声部重新插回去。需要先完成「译谱」。稳定 +5%、研究 +3%。"
 LTN_law_card_inhib: "抑制剂纳入官费"
 LTN_law_card_inhib_tt: "【生计】抑制剂纳入官费，感染者用药不再是私事。反渗透 +4%。与「平民入塔学堂」共鸣。"
 LTN_law_card_theatre: "放开剧院剧目"
 LTN_law_card_theatre_tt: "【生计】放开剧院剧目，不再指定配给。政治点 +2%。"
 LTN_law_card_guard: "金律法卫扩编"
 LTN_law_card_guard_tt: "【武备】金律法卫扩编。陆军攻击 +5%。与「军乐制式」共鸣；但高赋税声部过半会引发地方抗税。"
 LTN_law_card_band: "军乐制式"
 LTN_law_card_band_tt: "【武备】每团配乐团，士气高、机动低。防御 +5%。与「金律法卫扩编」共鸣。"

 # 面板 · 乐章史
 LTN_law_hist_title: "乐章史"
 LTN_law_hist_version: "当前演奏版本：第 [?LTN_law_version] 版"
 LTN_law_hist_body: "第 1 版　建国时的乐章，九声部齐全，法理、生计、武备三篇初定。\n第 2 版　969 年，巫王剔去叙拉古声部。失去一个声部之后，乐章不再稳定，各大区纷纷陷入混乱。\n第 3 版 起　由此往后，每一版都写在你的名下。\n\n上一版颁布时的读数：和谐度 [?LTN_law_hist_last_harmony|0]、民心合计 [?LTN_law_hist_last_source]、乐章偏差 [?LTN_law_hist_last_dev]。\n现在这一版的和谐度是 [?LTN_law_harmony|0]。\n\n每奏响一次，版本号 +1；改律次数越多，失范风险的基线越高。\n想把这一版留在庆典之前，就得提前排期——余波期内，调律台是关着的。"

