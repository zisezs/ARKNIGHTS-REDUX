 # 民族精神
 LTN_dyn_law_harmony: "金律的和谐"
 LTN_dyn_law_harmony_desc: "九个声部合不合得上，人民心里最清楚。乐章准，国本稳；乐章散，帝国也就开始散了。"
 LTN_dyn_law_dials: "金律 · 征收音孔"
 LTN_dyn_law_dials_desc: "九大区的三类征收音孔：兵役决定可征募人口，赋税决定建造速度，法术决定研究速度。每区拉满（4 档）+0.9%，压到最低（1 档及以下）-1.1%。"

 # 事件
 LTN_law.1.t: "《金律乐章》颁布"
 LTN_law.1.d: "以双塔之名，《金律乐章》第 [?LTN_law_version] 版，于今日颁布。九个大区的抄本正在送往各地的高塔。"
 LTN_law.1.a: "愿帝国的荣光更加耀眼。"
 LTN_law.2.t: "失范"
 LTN_law.2.d: "乐章不再稳定。某处大区已拒绝按新谱缴税，变调的旋律正沿着共鸣管线一路传向崔林特尔梅。"
 LTN_law.2.a: "记下这一笔。"
 LTN_law.2.b: "再听一遍，找出走音的那一条声部。"
