# 莱塔尼亚 ·「金律乐章 · 调律台」【生成物，真源 docs/gen_ltn_law.cjs】

 # 决议分类与入口
 LTN_law_decisions: "金律殿堂 · 调律台"
 LTN_law_decisions_desc: "《金律乐章》既是宪章、也是术式、也是一首每年要在女皇庆典上奏响的曲子。动一个音符，九个大区的法律、军制与法术都会跟着变。"
 LTN_law_dec_open: "召集群臣，调律"
 LTN_law_dec_open_desc: "展开当前版乐章：九条声部线、三大篇章的条款卡，与右栏的结算台。改完可以预演，也可以直接奏响。"
 LTN_law_dec_close: "合上总谱"
 LTN_law_dec_close_desc: "把总谱收起来。余波期内入口会变灰，等尘埃落定再开。"

