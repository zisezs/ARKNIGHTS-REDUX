l_simp_chinese:
#政党名称
 RNA_despotism_party: "拉纳王朝"

#人物
 RNA_Chandra_Rana_VI: "昌德拉·拉纳六世"
 RNA_Chandra_Rana_VI_desc: "自从拉纳家族在当时的中原王朝和恒河王朝支持下夺取王位，自昌德拉·拉纳已传承六世。令所有人意外的是，这个接受过现代教育的专制君主，在登基后立即宣布拉纳宗教国保持绝对中立，不倾向炎国和哈拉帕的任何一方。此举不能说不高明，为了拉拢这个外交中立的小国，步入现代社会的两大帝国只能腆着脸给拉纳宗教国送去一波又一波的援助。几十年过去，昌德拉·拉纳六世已经让这个山中小国的现代化有了起步的可能，如果他的统治和两个邻居的帝国都能稳固下去，那么拉纳国的现代化便指日可待。"

#国家精神
 RNA_Neutrality_between_empires: "帝国之间的中立"
 RNA_Neutrality_between_empires_desc: "在昌德拉·拉纳六世登基后不久，这位专制君主便利用自己的权力，将拉纳变为了一个绝对的中立国。任何鼓吹偏向炎国和哈拉帕帝国任何一方的言论都会被国王抹杀。昌德拉知道，中立才会让拉纳和他自己的位子永远稳定，而倒向任何一方，都会为这个小小的国家引来杀身之祸。"