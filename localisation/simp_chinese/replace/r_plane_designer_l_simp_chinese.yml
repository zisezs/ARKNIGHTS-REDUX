#微科幻空军配件（arf_* 新增）
 arf_originium_engine_1: "源石动力引擎 I"
 arf_originium_engine_1_desc: "以精炼源石驱动的紧凑动力核心，推力平稳、油耗可控，是新型机体的基础动力。"
 arf_originium_engine_2: "源石动力引擎 II"
 arf_originium_engine_2_desc: "强化源石回路与压气结构，推力大幅提升，代价是更高的造价与油耗。"
 arf_originium_twin_engine: "源石双联引擎"
 arf_originium_twin_engine_desc: "双组源石动力核心并列布置，为中型机体提供充沛推力。"
 arf_originium_heavy_engine: "源石四联重型引擎"
 arf_originium_heavy_engine_desc: "四组重型源石核心同步运转，足以把大型机体推上高空。"
 arf_arts_lance_light: "术法轻矛"
 arf_arts_lance_light_desc: "以术法导能管聚焦源石能量射出高穿深弹束，兼具对空与对地能力。"
 arf_arts_lance_heavy: "术法重矛"
 arf_arts_lance_heavy_desc: "加长导能管并强化源石回路，穿深与射程进一步提升。"
 arf_arts_beam_lance: "术法光矛"
 arf_arts_beam_lance_desc: "成熟形态的术法直射武器，可长时间持续聚焦，对舰与对空皆具威胁。"
 arf_aam_originium_1: "源石空空导弹 I"
 arf_aam_originium_1_desc: "以源石装药为战斗部的轻型空空导弹，显著提升制空能力。"
 arf_aam_originium_2: "源石空空导弹 II"
 arf_aam_originium_2_desc: "改进制导与战斗部，拦截效率再上台阶。"
 arf_agm_originium_1: "源石空地导弹 I"
 arf_agm_originium_1_desc: "面向地面目标的源石制导弹药，对装甲与工事杀伤惊人。"
 arf_agm_originium_2: "源石空地导弹 II"
 arf_agm_originium_2_desc: "更大战斗部与更精准的末端制导，可有效猎杀加固目标。"
 arf_asw_torpedo_originium: "源石反潜鱼雷"
 arf_asw_torpedo_originium_desc: "入水后由源石声呐自主寻的，是猎杀潜艇与布扫雷的利器。"
 arf_originium_bomb_bay: "源石炸弹舱"
 arf_originium_bomb_bay_desc: "大型机体专用的内埋弹舱，可挂载大量源石航空炸弹。"
 arf_originium_cannon_1: "源石机炮"
 arf_originium_cannon_1_desc: "以源石加速原理发射弹丸的航空机炮，射速与初速俱佳。"
 arf_originium_cannon_2: "源石机炮 II"
 arf_originium_cannon_2_desc: "加大口径并优化供弹机构，单次连射威力更强。"
 arf_drone_swarm_controller: "无人机蜂群控制舱"
 arf_drone_swarm_controller_desc: "舱内携带并投放多架小型攻击无人机，可自主编队突防。"
 arf_originium_radar: "源石相控阵雷达"
 arf_originium_radar_desc: "以源石晶体为收发阵元的机载雷达，探测距离与抗干扰能力极强。"
 arf_originium_datalink: "源石数据链"
 arf_originium_datalink_desc: "与友军共享战场态势的加密数据链，可显著提升编队协同效率。"
 arf_autonomous_pilot: "自主飞行核心"
 arf_autonomous_pilot_desc: "由源石算力驱动的无人驾驶核心，取消乘员后机动性与载荷均获提升。"
 arf_barrier_generator: "力场护盾发生器"
 arf_barrier_generator_desc: "在机身前向撑起力场，可偏折来袭弹片与轻武器火力。"
 arf_phase_shifter: "相位偏移装置"
 arf_phase_shifter_desc: "使机体短时间内部分相位偏移，规避来袭火力的同时提升机动。"
 arf_originium_fuel_cell: "源石燃料电池"
 arf_originium_fuel_cell_desc: "以高密度源石储能单元换取更远的航程，代价是机体防护略有削弱。"
