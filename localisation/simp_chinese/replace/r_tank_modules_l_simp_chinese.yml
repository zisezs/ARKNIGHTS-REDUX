 tank_medium_howitzer_1: "中型榴弹炮 I"
 tank_medium_howitzer_1_desc: "一门经改造后，适合安装在坦克上的中型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"
 tank_medium_howitzer_2: "中型榴弹炮 II"
 tank_medium_howitzer_2_desc: "一门经改造后，适合安装在坦克上的中型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"
 tank_medium_howitzer_3: "中型榴弹炮 III"
 tank_medium_howitzer_3_desc: "一门经改造后，适合安装在坦克上的中型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"

 tank_rocket_launcher_1: "火箭发射器 I"
 tank_rocket_launcher_1_desc: "一种用于发射非制导高爆火箭弹的多管发射器。高爆装药的火力使其对软目标具有出色的性能，但对于装甲目标，即使高爆火箭弹直接命中，也很难对其造成伤害。"
 tank_rocket_launcher_2: "火箭发射器 II"
 tank_rocket_launcher_2_desc: "虽然进行了准确性的升级，但是这种火箭发射器最主要的改进还是可以携带更多的弹药，以向敌人施加更加致命的打击。"
 tank_rocket_launcher_3: "火箭发射器 III"
 tank_rocket_launcher_3_desc: ""

 tank_heavy_howitzer_1: "重型榴弹炮 I"
 tank_heavy_howitzer_1_desc: "一门经改造后，适合安装在坦克上的重型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"
 tank_heavy_howitzer_2: "重型榴弹炮 II"
 tank_heavy_howitzer_2_desc: "一门经改造后，适合安装在坦克上的重型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"
 tank_heavy_howitzer_3: "重型榴弹炮 III"
 tank_heavy_howitzer_3_desc: "一门经改造后，适合安装在坦克上的重型野战榴弹炮。它的主要职能是对非装甲目标提供曲射火力支援，但必要时也可以进行直射射击。这门火炮携带的穿甲弹药很少，不适合反坦克作战。"

