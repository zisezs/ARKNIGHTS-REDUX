 light_tank_chassis: "轻型坦克"
 light_tank_chassis_desc: "一款小巧紧凑的底盘，非常适合用于执行侦察和火力支援等任务的轻型车辆。其有限的负载能力使得其不适合携带重型装甲或大型火炮。"
 light_tank_chassis_0: "早期轻型坦克底盘"
 light_tank_chassis_1: "轻型坦克底盘 I型"
 light_tank_chassis_1_desc: "技术进步使一战之后的设计显得较为过时了。现代战场需要一个全新的、简洁的并结合了冶金进步和内部布局进步的设计。"
 light_tank_chassis_2: "轻型坦克底盘 II型"
 light_tank_chassis_2_desc: "一款根据之前的轻型坦克设计经验来进行的进一步迭代的轻型底盘，该底盘具有更好的可靠性和维护性。"
 light_tank_chassis_3: "轻型坦克底盘 III型"
 light_tank_chassis_3_desc: "随着中型坦克越来越多地在战斗中占据主要位置，轻型坦克在很大程度上被降级为辅助车辆。这款底盘就是将辅助轻型坦克的定位考虑进去加以改进的结果。"
 light_tank_chassis_4: "轻型坦克底盘 IV型"
 light_tank_chassis_4_desc: ""

 medium_tank_chassis: "主战坦克"
 medium_tank_chassis_desc: "一款平衡的主战底盘，为制造各种作战车辆提供了很大的灵活性。"
 medium_tank_chassis_0: "早期主战坦克底盘"
 medium_tank_chassis_1: "主战坦克底盘 I型"
 medium_tank_chassis_1_desc: "虽然轻型坦克再过去一段时间内已经成为机械化部队的支柱，但很明显它的增长潜力以濒临耗尽。在不远的未来，我们将会需要一款更大的但仍然保持着卓越机动性的战车。"
 medium_tank_chassis_2: "主战坦克底盘 II型"
 medium_tank_chassis_2_desc: "基于上一代主战坦克的设计经验，显然我们需要一款具有更大承载能力的坦克底盘，才能保证它们的战斗力。"
 medium_tank_chassis_3: "主战坦克底盘 III型"
 medium_tank_chassis_3_desc: "武器系统重量的快速上升以及坦克对装甲厚度越来越依赖，使得我们急需一款更大的底盘，这将使我们的主战坦克的尺寸更接近于早期的重型坦克。"
 medium_tank_chassis_4: "主战坦克底盘 IV型"
 medium_tank_chassis_4_desc: ""

 heavy_tank_chassis: "重型坦克"
 heavy_tank_chassis_desc: "一款可以携带厚重装甲或重型火炮或者两者兼备的大型底盘。"
 heavy_tank_chassis_0: "早期重型坦克底盘"
 heavy_tank_chassis_1: "重型坦克底盘 I型"
 heavy_tank_chassis_1_desc: "世界大战的经验表明，一款用于突破敌军战壕，为轻型部队开辟突破口的重型战车是十分需要的。这样的战车必须全副武装，装甲精良，为此牺牲一些速度是可以接受的。"
 heavy_tank_chassis_2: "重型坦克底盘 II型"
 heavy_tank_chassis_2_desc: "虽然战争的性质发生了变化，但具有厚重装甲的重型战车仍然有机会突破敌人的防线，或者用于加强防御以抵御敌人的攻击。"
 heavy_tank_chassis_3: "重型坦克底盘 III型"
 heavy_tank_chassis_3_desc: "火炮与装甲的竞赛终于把老车体逼到了极限：Ⅱ型的战斗室已经塞不下更大口径的主炮，只能另起一副更宽、更长的底盘，把省下的重量还给火力与防护。"
 heavy_tank_chassis_4: "重型坦克底盘 IV型"
 heavy_tank_chassis_4_desc: "到战争末期，重型坦克与其说是一种车辆，不如说是一座缓慢移动的堡垒。这副底盘把防护放在第一位，指望它顶住敌人反坦克火力的正面轰击。"

 sp_artillery_chassis: "自行火炮"
 sp_artillery_chassis_desc: "一款平衡良好的战车，主要用于为前进的步兵提供火力支援。"
 sp_artillery_chassis_0: "早期自行火炮"
 sp_artillery_chassis_1: "自行火炮 I型"
 sp_artillery_chassis_2: "自行火炮 II型"
 sp_artillery_chassis_3: "自行火炮 III型"
 sp_artillery_chassis_4: "自行火炮 IV型"

 sp_aa_chassis: "自行防空炮"
 sp_aa_chassis_desc: "一款平衡良好的战车，携带着防空炮以抵御敌人的飞机。"
 sp_aa_chassis_0: "早期自行防空炮"
 sp_aa_chassis_1: "自行防空炮 I型"
 sp_aa_chassis_2: "自行防空炮 II型"
 sp_aa_chassis_3: "自行防空炮 III型"
 sp_aa_chassis_4: "自行防空炮 IV型"

 landship_chassis: "陆行舰"
 landship_chassis_desc: ""
 landship_chassis_0: "早期陆行舰模块"
 landship_chassis_0_desc: "四皇会战后时代的陆行舰的改进版本，虽然坦克的出现使得陆行舰的一部分职能被取代，但陆行舰厚重的装甲和高杀伤力仍在战场上不可或缺。"
 landship_chassis_1: "陆行舰模块 I型"
 landship_chassis_2: "陆行舰模块 II型"
 landship_chassis_3: "陆行舰模块 III型"

 armortech_1: "基础装甲保护"
 armortech_1_desc: "一战期间的坦克只需要与敌人的轻武器抗衡。因此，他们使用了相当薄的装甲。但新一代的反坦克武器让战场成为对来说坦克更危险的地方，所以其需要更重的装甲。"
 armortech_2: "改进装甲保护"
 armortech_2_desc: "随着越来越先进的反坦克武器在世界各地投入使用，下一代坦克将会需要更好的防护。"
 armortech_3: "先进装甲保护"
 armortech_3_desc: "虽然反坦克武器的配置可能越来越接近极限，但现代坦克携带的更先进的武器使得我们仍然需要防护等级更高的装甲。"
 armortech_4: "现代装甲保护"
 armortech_4_desc: "在战争期间，坦克面临的威胁成倍增加，从敌方坦克、穿甲炮、专用的自行穿甲炮，到甚至可以手持发射锥形弹头并击穿重型坦克装甲的现代步兵反坦克武器。我们必须开发新的保护方法，让我们的坦克在面对这些威胁时能够存活下来。"
 armor_tech_1_tt: "启用5到9级的装甲升级选项"
 armor_tech_2_tt: "启用10到14级的装甲升级选项"
 armor_tech_3_tt: "启用15到17级的装甲升级选项"
 armor_tech_4_tt: "启用18到20级的装甲升级选项"

 enginetech_1: "基础引擎"
 enginetech_1_desc: "四皇会战时期的坦克是移动缓慢而笨拙的装甲巨兽。然而，如今的坦克极其依赖速度和机动性来取得胜利。"
 enginetech_2: "改进型引擎"
 enginetech_2_desc: "装有更大火炮和更厚装甲的新一代坦克需要更强力的引擎来驱动。"
 enginetech_3: "先进引擎"
 enginetech_3_desc: "机动化作战是一种需要指挥官迅速决断、士兵迅速机动、补给迅速运输的作战形式。如果我们的坦克想要装备最新的武器，同时还想要安装足够在战场上生存的装甲，它们就需要更强大的引擎以跟上摩托化步兵的步伐。"
 enginetech_4: "现代引擎"
 enginetech_4_desc: "现代战争为坦克新增了许多必需的装备，这显著增加了坦克的重量。为了让这些庞然巨物动起来，我们必须拥有动力强大的引擎。"
 engine_tech_1_tt: "启用5到9级的引擎升级选项"
 engine_tech_2_tt: "启用10到14级的引擎升级选项"
 engine_tech_3_tt: "启用15级到17级的引擎升级选项"
 engine_tech_4_tt: "启用18到20级的引擎升级选项"


#微科幻装甲配件（arf_* 新增）
 tank_originium_engine: "源石动力引擎"
 tank_originium_engine_desc: "以精炼源石为燃料的紧凑动力核心，输出稳定而充沛，代价是维护格外复杂。"
 tank_originium_pulse_engine: "源石脉冲引擎"
 tank_originium_pulse_engine_desc: "在源石动力基础上引入脉冲稳流结构，瞬时功率大幅提升，足以驱动重型车体高速机动。"
 tank_originium_plating: "源石结晶装甲"
 tank_originium_plating_desc: "以层压工艺将源石结晶嵌入钢基体，硬度与韧性兼顾，可有效抵御穿甲弹丸。"
 tank_resonance_armor: "源石共振装甲"
 tank_resonance_armor_desc: "多层结晶基元在受击时同频共振，把冲击能量向全车分散，显著降低致命穿透概率。"
 tank_hover_suspension: "反重力悬浮悬挂"
 tank_hover_suspension_desc: "以反重力发生装置取代履带与负重轮，越过泥沼、弹坑与废墟时几乎不受阻碍。"
 tank_unmanned_turret: "遥控无人炮塔"
 tank_unmanned_turret_desc: "取消乘员舱，炮塔由车内火控终端遥控，体积更小、正面投影更低。"
 tank_arts_command_turret: "术法指挥炮塔"
 tank_arts_command_turret_desc: "集成术法天线与指挥终端的重型炮塔，可为同编队单位提供术法协同增益。"
 tank_arts_lance_1: "术法聚焦炮 I"
 tank_arts_lance_1_desc: "以术法导能管聚焦源石能量射出高穿深弹束，对装甲目标威胁极大。"
 tank_arts_lance_2: "术法聚焦炮 II"
 tank_arts_lance_2_desc: "加长导能管并强化源石回路，穿甲能力与射程进一步提升。"
 tank_arts_lance_3: "术法聚焦炮 III"
 tank_arts_lance_3_desc: "成熟形态的术法聚焦炮，足以在正面交战中撕开重装甲。"
 tank_originium_howitzer_1: "源石榴弹炮"
 tank_originium_howitzer_1_desc: "以源石装药抛射高爆弹丸，对步兵与工事等软目标杀伤惊人。"
 tank_originium_howitzer_2: "源石榴弹炮 II"
 tank_originium_howitzer_2_desc: "改进装药与俯仰机构，射程与破坏力再上台阶。"
 tank_originium_shield: "源石力场护盾"
 tank_originium_shield_desc: "车载源石发生装置撑起覆盖面，可偏折来袭破片与轻武器火力。"
 tank_arts_resonator: "术法谐振器"
 tank_arts_resonator_desc: "与术师单位同频的谐振装置，可将术法余波导入火控系统，提升命中精度。"
 tank_drone_bay: "无人机坞"
 tank_drone_bay_desc: "车尾搭载小型侦察无人机，可前出勘察并以微型弹头支援突击。"
 tank_crystal_collector: "源石结晶收集器"
 tank_crystal_collector_desc: "利用车载结晶吸附结构收集并储存源石燃料，大幅延长作战半径。"
 tank_infected_suppressor: "感染抑制装置"
 tank_infected_suppressor_desc: "以过滤与净化为核心的乘员防护模块，隔绝源石粉尘的侵蚀。"
 tank_stealth_coating: "光学隐身涂层"
 tank_stealth_coating_desc: "以折射涂层与热信号抑制降低被观测概率，便于隐蔽机动与伏击。"
 additional_arts_caster: "附加术法施术单元"
 additional_arts_caster_desc: "在车体加装小型施术装置，为战车提供额外的术法直射火力。"
 additional_originium_launcher: "附加源石发射器"
 additional_originium_launcher_desc: "外挂式源石发射巢，可对步兵与轻型目标实施覆盖射击。"
