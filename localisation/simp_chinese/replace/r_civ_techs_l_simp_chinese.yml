l_simp_chinese:

 LRD_CIV_TITLE_RADAR: "雷达技术"
 MSA_radar: "MSA机械扫描雷达"
 MSA_radar_desc: "通过机械转动天线来改变波束指向，进行扫描和跟踪。技术成熟、成本低，但扫描速度慢，功能单一，难以同时应对多个高速目标。"
 PESA_radar: "PESA无源相控阵雷达"
 PESA_radar_desc: "采用电子方式控制天线阵列中移相器的相位，快速改变波束指向。扫描速度快，可跟踪多目标，但存在一定的功率损耗和效率问题。"
 AESA_radar: "AESA有源相控阵雷达"
 AESA_radar_desc: "每个天线单元都配备独立的收发（T/R）组件，可灵活控制波束。可靠性高、功能多样、抗干扰强，是现代先进雷达的主流技术。"
 GaN_radar: "氮化镓升级有源相控阵雷达"
 GaN_radar_desc: "采用氮化镓（GaN）半导体材料制造T/R组件。相比传统砷化镓，其功率、效率和耐热性更高，能显著提升雷达的探测距离和性能。"
 DAR_radar: "DAR数字相控阵雷达"
 DAR_radar_desc: "在每个天线单元后直接进行信号的数字化处理，实现了“软件定义雷达”。波束控制更灵活，可同时执行多种任务，抗干扰能力极强。"
 GaO_radar: "氧化镓升级有源相控阵雷达"
 GaO_radar_desc: "采用第四代半导体氧化镓（Ga₂O₃）材料，理论上拥有更高功率、更优效率和更低成本的潜力，是未来高性能雷达的关键发展方向。"
 MR_super_surface_radar: "MR超表面雷达"
 MR_super_surface_radar_desc: "利用超表面（Metasurface）这种二维人工材料来调控电磁波，结构更轻薄、成本更低。在雷达成像、小型化和隐身等领域潜力巨大。"
 QR_quantum_radar: "QR量子雷达"
 QR_quantum_radar_desc: "利用量子纠缠等量子现象进行目标探测。理论上能突破传统雷达的性能极限，具备极高的灵敏度和抗干扰、反隐身能力"

 LRD_CIV_TITLE_SHENGCHAN: "生产技术"
 LRD_tech_shengchan_1: "数字化机床"
 LRD_tech_shengchan_1_desc: "计算机数控（CNC）机床在制造业的普及率大幅提升，显著提高了加工精度和复杂零件生产能力，为工业自动化奠定更坚实基础。"
 LRD_tech_shengchan_0: "多层厂房"
 LRD_tech_shengchan_0_desc: "优化土地利用，通过多层厂房的建设集成生产过程，提升单位面积产出效率，在高价值、空间密集型产业效益尤为突出。"
 LRD_tech_shengchan_2: "工业机器人"
 LRD_tech_shengchan_2_desc: "可编程机器人广泛应用于装配、焊接、搬运等环节，实现关键工序自动化，提升生产速度与一致性，降低人力依赖。"
 LRD_tech_shengchan_3: "3D喷射打印"
 LRD_tech_shengchan_3_desc: "增材制造技术突破材料限制，实现复杂结构原型快速制造和小批量定制化生产，缩短研发周期，降低模具成本。"
 LRD_tech_shengchan_4: "AI辅助设计"
 LRD_tech_shengchan_4_desc: "人工智能深度融入产品设计流程，优化结构、材料选择与性能仿真，极大提升设计效率和创新潜力，引领设计效率革命。"
 LRD_tech_shengchan_5: "集成化机床"
 LRD_tech_shengchan_5_desc: "融合多种加工工艺（增材与减材等）于一体的智能机床出现，实现“一站式”加工，减少工序流转，提升复杂零件整体制造效率。"
 LRD_tech_shengchan_6: "客制化生产线"
 LRD_tech_shengchan_6_desc: "基于模块化设计和柔性自动化，生产线可快速、低成本地重组以适应小批量、多品种的个性化订单需求，实现大规模定制化。"
 LRD_tech_shengchan_7: "云上工业"
 LRD_tech_shengchan_7_desc: "工业数据、软件（MES/PLM等）及算力大规模迁移至云端，实现跨企业、跨地域的资源协同、远程监控与优化，形成工业互联网中枢。"
 LRD_tech_shengchan_8: "信息集成处理"
 LRD_tech_shengchan_8_desc: "打通“云-边-端”数据流，实现设计、生产、供应链、销售等全环节信息的实时汇聚、智能分析与闭环反馈，驱动决策智能化。"
 LRD_tech_shengchan_9: "无人化生产"
 LRD_tech_shengchan_9_desc: "高度自主化的“黑灯工厂”模式在部分行业成为现实，机器人、AGV、AI系统协同完成绝大部分生产任务，人力主要承担监控、维护与优化职责。"
 LRD_tech_shengchan_10: "黑灯工业区"
 LRD_tech_shengchan_10_desc: "区域性无人化生产集群形成，实现能源、物流、维护的高度自优化和24小时不间断运行，显著提升区域制造韧性与效率标杆。"
 LRD_tech_shengchan_11: "工业5.0"
 LRD_tech_shengchan_11_desc: "人机协作达到新高度，AI与人类智慧深度结合，聚焦可持续性、社会价值与高度韧性。系统具备自感知、自决策、自优化、自组织的闭环能力，全面重塑工业形态。"

 LRD_CIV_TITLE_GONGYE: "工业规划"
 LRD_tech_gongye_0: "生产运作管理"
 LRD_tech_gongye_0_desc: "现代生产管理理论与方法（如TQM、精益思想）的深入应用，系统化优化生产流程、资源配置与质量控制，显著提升基础管理效率与成本控制能力。"
 LRD_tech_gongye_1: "工业园区规划"
 LRD_tech_gongye_1_desc: "科学规划产业集群布局，优化基础设施（能源、交通、通信）共享，促进企业间协同效应，降低区域整体运营成本，提升招商引资吸引力。"
 LRD_tech_gongye_2: "工业物流学"
 LRD_tech_gongye_2_desc: "系统性优化原材料输入、在制品流转与成品输出的全链条物流，应用自动化仓储与运输技术，大幅降低库存水平，缩短交货周期，提升供应链响应速度。"
 LRD_tech_gongye_3: "准时化生产"
 LRD_tech_gongye_3_desc: " 精益生产的核心实践实现规模化应用，通过精确的需求拉动、极低的库存缓冲与快速换型，实现生产与供应链的高效同步，显著降低浪费与运营资本占用。"
 LRD_tech_gongye_4: "集成生产信息系统"
 LRD_tech_gongye_4_desc: "MES（制造执行系统）、ERP（企业资源计划）、SCM（供应链管理）等核心系统深度集成，打破信息孤岛，实现生产现场到管理层的实时数据贯通与透明化管理。"
 LRD_tech_gongye_5: "数字化生产"
 LRD_tech_gongye_5_desc: "基于数字孪生技术构建虚拟生产线，实现生产流程的仿真、预测与持续优化。数据驱动决策成为常态，大幅提升生产计划准确性与设备利用效率。"
 LRD_tech_gongye_6: "AR现实增强"
 LRD_tech_gongye_6_desc: "AR技术广泛应用于设备维护（远程专家指导）、装配作业（可视化指引）、人员培训与质量控制，显著提升操作准确性、效率与安全性，降低培训成本。"
 LRD_tech_gongye_7: "AI辅助决策"
 LRD_tech_gongye_7_desc: "AI算法深度融入生产调度、质量控制、能源管理、供应链优化等核心决策环节，提供实时预测、诊断与优化建议，大幅提升管理决策的科学性与前瞻性。"
 LRD_tech_gongye_8: "一小时工业区"
 LRD_tech_gongye_8_desc: "基于超高速物流（无人机/AGV）、分布式微型仓储、AI实时调度与区域协同制造网络，实现园区内原材料、零部件与成品的“一小时极速响应与交付”，重塑供应链韧性。"
 LRD_tech_gongye_9: "AI自主决策"
 LRD_tech_gongye_9_desc: "在预设规则和安全框架内，AI系统获得关键生产环节（如动态排产、异常处理、能效优化）的自主决策权，实现复杂系统的高效、自适应运行，大幅减少人工干预延迟。"
 LRD_tech_gongye_10: "全自动工厂"
 LRD_tech_gongye_10_desc: "关灯运行”成为普遍模式。AI自主决策中枢驱动高度集成的机器人集群、柔性生产线、智能物流系统，实现从订单接收到产品交付的端到端无人化、自适应、高弹性生产。"

 LRD_CIV_TITLE_JISUANJI: "计算机科学"
 LRD_tech_jisuanji_0: "芯片构型设计"
 LRD_tech_jisuanji_0_desc: "异构集成（Chiplet）与存算一体架构突破，实现算力模块化堆叠，显著提升芯片定制化能力与能效比，支撑AI与边缘计算需求爆发。  "
 LRD_tech_jisuanji_1: "基础光刻机"
 LRD_tech_jisuanji_1_desc: "深紫外光刻（DUV）多重曝光技术成熟，支撑7nm芯片量产，降低先进制程门槛，推动全球半导体产能扩张。"
 LRD_tech_jisuanji_2: "基础制程芯片"
 LRD_tech_jisuanji_2_desc: " 7nm-5nm芯片成本下探至消费级市场，高性能移动设备与入门级AI硬件全面普及，物联网终端算力革命启动。"
 LRD_tech_jisuanji_3: "先进光刻机"
 LRD_tech_jisuanji_3_desc: "高数值孔径极紫外光刻（High-NA EUV）实现商用，突破光学衍射极限，支撑2nm以下制程研发，芯片晶体管密度提升50%。"
 LRD_tech_jisuanji_4: "先进制程芯片"
 LRD_tech_jisuanji_4_desc: "2nm-1.4nm芯片规模化量产，3D堆叠与背面供电技术成熟，计算单元密度与能效比达硅基物理极限的90%，量子隧穿效应成为主要挑战。"
 LRD_tech_jisuanji_5: "临界芯片"
 LRD_tech_jisuanji_5_desc: "突破硅基限制，采用二维材料（MoS₂/石墨烯）、碳纳米管晶体管或光子互连技术，实现亚1nm等效制程，功耗降低40%，为经典-量子混合架构铺路。"
 LRD_tech_jisuanji_6: "量子芯片"
 LRD_tech_jisuanji_6_desc: "千级量子比特（Qubit）芯片实现99.9%保真度，量子纠错编码实用化，专用量子处理器（QPU）在金融建模与药物研发领域商用。"
 LRD_tech_jisuanji_7: "超导量子计算机"
 LRD_tech_jisuanji_7_desc: "万级Qubit超导量子系统工程化落地，低温控制系统与容错架构突破，为工业AI提供指数级算力跃迁，破解传统优化算法瓶颈。"
 LRD_tech_jisuanji_8: "量子个人终端"
 LRD_tech_jisuanji_8_desc: "集成微型低温QPU（100-200 Qubits）的移动设备问世，支持本地化量子加密、实时病理分析及个性化AI训练，重塑隐私与算力边界。"
 LRD_tech_jisuanji_9: "先进计算终端"
 LRD_tech_jisuanji_9_desc: "经典“（临界芯片）+量子（QPU）+神经形态”三维计算架构终端普及，支持无延迟脑机接口交互与全息环境模拟，人类-数字世界屏障瓦解。"
 LRD_tech_jisuanji_10: "自适应AI管理"
 LRD_tech_jisuanji_10_desc: "基于混合算力网络的全域AI协调中枢，具备“”自重构硬件架构“与”跨平台冲突预消解“能力。以近乎绝对理性的优化逻辑动态调配全球计算资源，同步保障系统效率（Efficiency）、鲁棒性（Robustness）与伦理合规性（Ethical Compliance）。"

 LRD_CIV_TITLE_TUMU: "土木工程"
 LRD_tech_tumu_0: "压力容器"
 LRD_tech_tumu_0_desc: "核电站/化工厂压力容器模块化设计规范统一，提升极限承压能力，降低事故率，推动高危基建安全革命。"
 LRD_tech_tumu_1: "智能建筑"
 LRD_tech_tumu_1_desc: "BIM（建筑信息模型）+物联网传感器普及，实现楼宇能耗动态监控与自适应照明/温控，提升运营能效。"
 LRD_tech_tumu_2: "预制模块"
 LRD_tech_tumu_2_desc: "建筑结构体（墙板/梁柱）工厂预制率超半数以上，工地装配周期缩短，扬尘污染降低。"
 LRD_tech_tumu_3: "建筑分包"
 LRD_tech_tumu_3_desc: "基于智能合约的工程分包平台普及，自动结算进度款与质量罚金，项目纠纷全面消失，打造完成全透明供应链。"
 LRD_tech_tumu_4: "新能源运输"
 LRD_tech_tumu_4_desc: "氢燃料电池重卡与电动无人矿车全面推广，工地物流碳排放降低，特殊地形物资运输效率极大提升。"
 LRD_tech_tumu_5: "近未来建筑学"
 LRD_tech_tumu_5_desc: "抗灾设计（地震/洪水/台风）与生态修复功能融合，建筑自维持能力（能源/水循环）覆盖基础需求。"
 LRD_tech_tumu_6: "新型预制材料"
 LRD_tech_tumu_6_desc: "自修复混凝土（微生物矿化）、碳纤维增强石膏板量产，建筑寿命延长至150年，维护成本降低55%。"
 LRD_tech_tumu_7: "AI辅助工程计算"
 LRD_tech_tumu_7_desc: "基于超导量子计算机的AI结构仿真系统，实时优化设计冗余度，降低材料浪费且提升极端工况安全性。"
 LRD_tech_tumu_8: "近未来建筑材料"
 LRD_tech_tumu_8_desc: "气凝胶保温墙板、光伏智能玻璃普及，建筑能源完全自给。"
 LRD_tech_tumu_9: "建材喷射打印"
 LRD_tech_tumu_9_desc: "超大型3D打印机器人实现现场浇筑-塑形一体化作业，复杂曲面结构（双曲拱顶/拓扑优化梁）施工效率极大提升。"
 LRD_tech_tumu_10: "无人调度中心"
 LRD_tech_tumu_10_desc: "中央AI指挥系统动态协调无人机群、机械臂阵列与自动驾驶工程车，工地人机配比优化至1：100。"
 LRD_tech_tumu_11: "无人工地"
 LRD_tech_tumu_11_desc: "全场景无人化建造闭环：AI设计→打印机器人施工→无人机质检→区块链交付，人力仅负责远程维护，重大事故趋近于零。"

 LRD_CIV_TITLE_SHIYOU: "石油化工"
 LRD_tech_shiyou_a: "燃料贮存"
 LRD_tech_shiyou_a_desc: "深度整合土木工程压力容器技术成果，建立新一代高危燃料贮存标准体系，全面强化极端环境下储运设施的结构完整性与事故防控能力，为全球能源供应链奠定安全基石。"
 LRD_tech_shiyou_1: "控压钻井技术"
 LRD_tech_shiyou_1_desc: "突破复杂地质构造动态压力控制瓶颈，实现钻井过程实时精准调控，大幅降低深部地层钻探风险，显著拓展可开发油气资源边界。"
 LRD_tech_shiyou_2: "纳米驱油"
 LRD_tech_shiyou_2_desc: "开创性应用功能性纳米材料改造驱油体系，有效破解传统技术无法动用的微观剩余油赋存难题，激活老油田开采潜力，推动采收率范式跃迁。"
 LRD_tech_shiyou_3: "碳封存协同"
 LRD_tech_shiyou_3_desc: "建油田二氧化碳捕集-驱油-封存一体化技术链条，将减排行动转化为油气增产核心驱动力，实现环境效益与资源开发深度协同。"
 LRD_tech_shiyou_4: "原位催化改质"
 LRD_tech_shiyou_4_desc: "开发地下原位催化转化工艺，突破性解决超稠油流动性制约，推动劣质重油资源高效升级为可经济开采的轻质组分，重塑资源价值评估体系。"
 LRD_tech_shiyou_5: "深海勘探革命"
 LRD_tech_shiyou_5_desc: "融合自主机器人集群与智能传感网络，建立全海域资源勘探能力，系统性解锁极地、超深水等极端环境油气资源，开启海洋能源开发新纪元。"
 LRD_tech_shiyou_6: "数字孪生油田"
 LRD_tech_shiyou_6_desc: "基于工业级人工智能决策架构，构建覆盖地质-工程-生产全链路的虚拟油田系统，实现开发策略动态优化与风险超前预判，重塑生产管理模式。"
 LRD_tech_shiyou_7: "绿色氢能炼化"
 LRD_tech_shiyou_7_desc: "以绿电制氢为核心重构炼化能源结构，彻底剥离化石能源依赖，建立零碳炼厂技术标准，引领石化工业深度脱碳转型。"
 LRD_tech_shiyou_8: "甲烷零逃逸"
 LRD_tech_shiyou_8_desc: "部署空天地一体化监测网络，实现甲烷排放源精准定位与即时封堵，根治油气行业强效温室气体泄漏顽疾，消除气候影响关键痛点。"
 LRD_tech_shiyou_9: "分子级炼油"
 LRD_tech_shiyou_9_desc: "革新原油转化路径，通过分子识别与定向裂解技术精准调控产物分布，推动炼厂从燃料生产向高值化学品制造的战略转型。"
 LRD_tech_shiyou_10: "生物基质替代"
 LRD_tech_shiyou_10_desc: "利用合成生物学技术定制开发生物基烃类材料，建立可持续航空燃料与特种化学品生产体系，逐步替代传统石油基产品。"
 LRD_tech_shiyou_11: "CCUS产业化"
 LRD_tech_shiyou_11_desc: "集成碳捕集、运输与地质封存技术链条，形成规模化负排放服务能力，推动石油工业转型为碳中和时代核心碳管理基础设施运营商。"

 LRD_CIV_TITLE_BIO: "生命科学"
 LRD_tech_bio_0: "基础分子生物学"
 LRD_tech_bio_0_desc: "新一代基因测序技术成本呈数量级下降，推动基因组学进入大数据时代。 同时，CRISPR基因编辑原理的发现与蛋白质工程技术的进步，使得对生命蓝图的“读取”与“改写”能力取得了里程碑式的突破。这为系统生物学、精准医疗等应用领域奠定了坚实的数据与方法论基石，宣告了从描述生命到编程生命的时代转折。"
 LRD_tech_bio_1: "现代分子生物学"
 LRD_tech_bio_1_desc: "分子生物学是在分子水平上研究生命现象的科学，主要探索DNA、RNA和蛋白质等生物大分子的结构、功能及其相互作用，揭示了遗传信息传递的核心机制。现代分子生物学允许人类对生物体进行基因水平的编辑和改造，是生物技术、生物工程、疾病治疗等领域的研究基础。"
 LRD_tech_bio_2: "高通量组学测序"
 LRD_tech_bio_2_desc: "分子生物学是在分子水平上研究生命现象的科学，主要探索DNA、RNA和蛋白质等生物大分子的结构、功能及其相互作用，揭示了遗传信息传递的核心机制。现代分子生物学允许人类对生物体进行基因水平的编辑和改造，是生物技术、生物工程、疾病治疗等领域的研究基础。"
 LRD_tech_bio_3: "蛋白质从头设计"
 LRD_tech_bio_3_desc: "自然界已有的天然蛋白质经过了漫长时间的进化方能形成，其性质和功能通常是为了维持生物体的生命活动，却无法满足日益增长的工业生产和医药诊疗需求。蛋白质从头设计不依赖自然界已有的蛋白质模板，完全从工程原理出发，通过计算和人工智能方法设计具有特定结构和功能的全新蛋白质，以满足医药、材料科学等领域的特定需求。"
 LRD_tech_bio_4: "计算生物学"
 LRD_tech_bio_4_desc: "计算生物学是指开发和应用数据分析及理论方法、数学建模和计算机仿真等技术，用于生物学、行为学和社会群体系统研究的一门新兴学科。涉及包括生物学、数学、统计学、计算机科学、物理学、化学等多个学科和领域，正引领生命科学研究从定性描述向定量预测转变，创造新的研究范式，提高生命科学研究效率。"
 LRD_tech_bio_5: "高精度基因编辑"
 LRD_tech_bio_5_desc: "基因编辑技术在科研、医学和农业等领域已经得到了广泛应用，但基因编辑技术的脱靶风险、效率问题和递送难题不容忽视，制约了基因编辑技术的进一步发展。高精度基因编辑技术允许操作者在生物体基因组中实现大范围、高精度、可逆编辑，显著降低了基因编辑的脱靶风险，对于精准医学、农业育种和生命科学基础研究提供了新的有力工具。"
 LRD_tech_bio_6: "系统生物学"
 LRD_tech_bio_6_desc: "系统生物学是利用高通量实验技术和计算建模方法，系统地研究生物体内所有组成部分及其相互作用网络，从而在整体层面定量地理解生物系统的结构、功能和行为规律的科学。系统生物学超越了传统的还原论方法，而是将生物体视为一个由众多相互作用的分子（如基因、蛋白质、代谢物）组成的复杂网络或系统，从而得以在全局层面认识生命、改造生命。"
 LRD_tech_bio_7: "DNA生物计算机"
 LRD_tech_bio_7_desc: "DNA生物计算机是一种基于DNA分子进行信息存储和计算的生物信息处理器。与传统计算机不同，DNA计算机利用DNA的碱基序列编码信息，通过控制DNA分子的合成、裂解和相互作用，实现信息的存储、传输和处理。我们开发的DNA生物计算机具有信息存贮量大、运算速度快、耗能低等优势，将在密码破译、疑难病症防治以及航空航天等领域展现出独特优势。"
 LRD_tech_bio_8: "定量生物学"
 LRD_tech_bio_8_desc: "定量生物学是生命科学在近年的飞速发展中，与数学、物理学、化学、信息科学、工学等定量学科交叉、融合后正在产生的一门新学科。它利用定量的方法和工具，有机地结合理论、计算和实验来提出和解决关键生物学问题。定量生物学研究使得我们有能力对生物学过程进行定量分析和数学建模，进而推动生物学基础研究和生物医药领域的发展。"
 LRD_tech_bio_9: "量子生物学"
 LRD_tech_bio_9_desc: "量子生物学是利用量子理论来研究生命科学的一门学科，包含利用量子力学研究生物过程和分子动态结构。量子力学适用于生物学最微观的层面，量子隧穿、叠加态、纠缠等效应在一些生物化学反应中可能发挥着作用。如今，我们已经初步建立了量子生物学的理论基础与研究范式，将为我们深入理解生命、改造生命奠定坚实的研究基础。"
 LRD_tech_bio_10: "人工合成生命"
 LRD_tech_bio_10_desc: "人工合成生命旨在通过模拟和创造生命系统的行为、特征和过程来理解生命的本质。这一领域不仅仅关注生物学上已知的生命形式，而是尝试创建能够模仿或实现生命过程的人工系统。人造生命，是几代科学家孜孜不倦的追求，如今我们终于掌握了造物主的权柄。人工合成生命的研究有助于深入理解生命的本质和起源，揭示生命的基本规律，并在医药、工业、环保等方面提供新的生命科学助力。"
 LRD_tech_bio_11: "数字化生命体"
 LRD_tech_bio_11_desc: "过去，能够自主进化和自我复制的计算机程序被视为数字生命。而今天，数字化生命体的横空出世则标志着数字生命的发展进入了新阶段。通过多层次多维度手段表征生命体以获取生命活动的各项参数，进而通过计算机和数学方法在数字化环境中构建并运行具有生命特征的人工系统。数字化生命体的突破，标志着生命科学领域从此进入自由王国，为生命健康应用与生命起源研究提供研究基础。"

 LRD_CIV_TITLE_BIOTECH: "生物技术"
 LRD_tech_biotech_1: "现代医药产业"
 LRD_tech_biotech_1_desc: "现代医药产业是将现代技术与新药研发、生产，以及诊断治疗等相结合形成的产业，包括化学原料药、化学制剂、中药（饮片、中成药）、生物制药、医疗器械等细分领域。现代医药产业是典型的“朝阳产业”，基于技术进步与需求增长的背景，已经成为新一轮科技革命与产业变革中创新最为活跃、发展最为迅猛的新兴产业领域之一。"
 LRD_tech_biotech_2: "现代农业育种"
 LRD_tech_biotech_2_desc: "现代农业育种是现代农业生物技术育种的统称，主要包括利用转基因、基因编辑、全基因组选择、合成生物等技术，对动植物开展高效、精准、定向遗传改良和品种培育。转基因技术是生物育种的重要方面，也是迄今为止全球发展速度最快、应用范围最广、产业影响最大的现代生物技术。"
 LRD_tech_biotech_3: "AI辅助药物研发"
 LRD_tech_biotech_3_desc: "AI辅助药物研发是指将人工智能技术应用于药物研发的各个环节，以提高研发效率、降低成本、提高成功率和创新性。AI能够从海量的数据中发现潜在的药物靶点，生成与优化药物分子结构，预测药效和不良反应，辅助临床试验设计等，AI在新药研发中的应用有望大幅缩减药物研发的周期与成本，提高其效率和成功率。"
 LRD_tech_biotech_4: "商用人工合成淀粉"
 LRD_tech_biotech_4_desc: "人工合成淀粉是指不依赖植物光合作用，以二氧化碳、电解产生的氢气为原料，通过化学催化与生物催化相结合的方法，将二氧化碳转化为淀粉的技术。近年来，通过酶改造、新能源制氢等方式，对人工合成淀粉全流程进行优化，最终实现了技术的商用化。商用人工合成淀粉将为解决粮食问题与碳中和问题，提供新的解决方案，为人类充分利用自然资源、“巧夺天工”的过程中奠定了技术基础。"
 LRD_tech_biotech_5: "器官3D打印"
 LRD_tech_biotech_5_desc: "器官3D打印结合了3D打印原理和生物工程技术。使用活细胞、生长因子和生物相容性材料作为“生物墨水”，通过3D打印逐层叠加，构建出三维的组织结构，最终形成具备实际功能的复杂器官。器官3D打印技术能够解决过去亟需解决的器官移植缺口，基于患者自身细胞打印的器官也能够有效减少免疫排斥反应，大幅改善器官移植患者的生存质量。"
 LRD_tech_biotech_6: "数字孪生农场"
 LRD_tech_biotech_6_desc: "数字孪生农业是运用数字孪生、区块链、物联网和大数据等技术手段，对智慧农业理念进行创新应用的现代农业新模式。通过对农产品全生长周期、全产业链进行多维度的实时监控、可信记录和智能分析，建立各要素的数字模型和要素间的紧密联系，赋能农业产业智能决策、精准调控和可信溯源的能力，为数字技术时代的农业发展提速增效。"
 LRD_tech_biotech_7: "下一代工程细胞底盘"
 LRD_tech_biotech_7_desc: "下一代工程细胞底盘是指基于合成生物学和基因编辑技术开发的、具有高度可编程性和功能扩展性的新型生物制造载体。其核心特点是通过系统化改造提升细胞工厂的代谢效率和产物多样性，尤其在极端环境适应性和工业化生产稳定性方面实现突破。下一代工程细胞底盘的出现将大大降低大规模生物化工生产的成本，提高生产效率。"
 LRD_tech_biotech_8: "个性化肿瘤治疗"
 LRD_tech_biotech_8_desc: "即使是同一种肿瘤，其发病机制、基因突变位点、耐药性等也存在着巨大的差异。传统肿瘤治疗手段不仅无法实现肿瘤的有效治疗，还会带来毒副作用强、医疗资源浪费等问题。通过多组学手段对肿瘤进行精准分型，在AI辅助下制订个性化诊疗方案并开发特异性治疗药物，将大大提升肿瘤的治疗效率，降低肿瘤复发和转移等问题，提高患者的生活质量，延长患者寿命。"
 LRD_tech_biotech_9: "未来农业育种"
 LRD_tech_biotech_9_desc: "未来农业育种是建立在生物学、工程学、人工智能等多学科技术基础上产生的面向未来的农业育种技术。基于作物的组学数据进行精准建模，使用高精度基因编辑技术和定量生物学手段定向改良作物性状，通过自动化机器人和智能培养设备提高育种，缩短传代时间。通过未来农业育种技术，以更高效率、更低成本快速培育出优质、高产、抗逆、适应性强的农作物品种。"
 LRD_tech_biotech_10: "医用纳米机器人"
 LRD_tech_biotech_10_desc: "医用纳米机器人是运用分子纳米技术制造的微型智能装置，其尺寸在1-100纳米范围内，能够在人体内执行细胞级操作，包括靶向治疗、疾病诊断和组织修复等任务。这类机器人通过仿生学原理设计，可集成传感、导航和诊疗功能于一体，属于生物物理学与医学交叉领域的前沿技术。"
 LRD_tech_biotech_11: "脑机接口联网"
 LRD_tech_biotech_11_desc: "脑机接口联网是在脑机接口技术广泛成熟的基础上，将人脑与互联网乃至其他人脑等外部网络系统连接起来，实现大脑与网络、大脑与大脑之间的信息交互共享。通过脑机接口联网，个人可以自由调用互联网及联网设备，甚至与其他人进行意识交流。脑机接口联网为瘫痪和渐冻症患者的康复生活提供新的助力，也为人机融合、个性化教育等带来重要的技术基础，在医疗、军事、娱乐、教育、工业生产等领域具有广阔前景。"

 LRD_CIV_TITLE_ENERGY: "能源学"
 LRD_tech_energy_1: "源网荷储一体化建设"
 LRD_tech_energy_1_desc: "破除发电-输电-用电传统壁垒，构建动态响应能源网络雏形，初步实现负荷侧可中断资源调度与分布式储能协同。"
 LRD_tech_energy_2: "分布式发电"
 LRD_tech_energy_2_desc: "屋顶光伏、小型风电等分散式电源广泛接入配电网，推动能源生产消费模式去中心化转型。"
 LRD_tech_energy_3: "超临界布雷顿系统"
 LRD_tech_energy_3_desc: "构建超临界CO₂工质布雷顿循环通用平台，实现核能高温热源、氢燃烧热源、光热储能的统一高效转换，发电效率突破70%物理极值。"
 LRD_tech_energy_4: "智能微电网"
 LRD_tech_energy_4_desc: "区域能源互联网自治运行，多类型电源-储能-负荷智能博弈决策，离网生存能力达周级。"
 LRD_tech_energy_5: "无人调度电网"
 LRD_tech_energy_5_desc: "全域能源流自组织运行，人类角色退化为战略监管，系统具备抗多重故障自愈能力。"
 LRD_tech_energy_chuneng: "电化学储能技术"
 LRD_tech_energy_chuneng_desc: "锂离子电池技术成本迎来拐点，能量密度与循环寿命实现双重突破，使其从消费电子领域正式迈向电网级储能应用。首批磷酸铁锂储能电站示范项目成功投运，验证其在频率调节、削峰填谷、可再生能源平滑输出等场景的商业价值，为电网提供了关键的物理载体和灵活调节能力，开启了电力系统从“刚性”到“柔性”的革命。"
 LRD_tech_energy_A0: "F型燃机"
 LRD_tech_energy_A0_desc: "1500℃级燃烧温度燃机普及，燃气发电效率突破40%门槛。"
 LRD_tech_energy_A1: "H级重型燃机"
 LRD_tech_energy_A1_desc: "1700℃级燃机搭配空气冷却叶片，联合循环效率突破62%。"
 LRD_tech_energy_A2: "联合循环发电"
 LRD_tech_energy_A2_desc: "多级余热深度回收系统实现能源梯级利用极限。"
 LRD_tech_energy_A3: "氢燃机"
 LRD_tech_energy_A3_desc: "100%绿氢燃烧技术攻克回火难题，火电深度脱碳路径贯通。"
 LRD_tech_energy_B0: "AP1000核电"
 LRD_tech_energy_B0_desc: "非能动安全系统实现第三代核电商用，大幅提升核电站固有安全性。"
 LRD_tech_energy_B1: "第四代核电厂"
 LRD_tech_energy_B1_desc: "钠冷快堆/高温气冷堆实现商运，核燃料利用率提升百倍。"
 LRD_tech_energy_B2: "次临界反应堆"
 LRD_tech_energy_B2_desc: "加速器驱动次临界系统（ADS）验证核废料嬗变技术。"
 LRD_tech_energy_B3: "钍基熔盐堆"
 LRD_tech_energy_B3_desc: "液态燃料反应堆示范运行，开启钍资源核能利用纪元。"
 LRD_tech_energy_C0: "钙钛矿电池"
 LRD_tech_energy_C0_desc: "溶液法量产高效柔性光伏组件，度电成本逼近传统能源。"
 LRD_tech_energy_C1: "26MW海上风电机组"
 LRD_tech_energy_C1_desc: "超大型直驱风机集群化部署，深远海风资源规模化开发。"
 LRD_tech_energy_C2: "深海风电场"
 LRD_tech_energy_C2_desc: "超大型直驱风机集群化部署，深远海风资源规模化开发。"
 LRD_tech_energy_C3: "绿氢制备技术"
 LRD_tech_energy_C3_desc: "波动性电源耦合质子交换膜电解槽，制氢综合效率超75%。"