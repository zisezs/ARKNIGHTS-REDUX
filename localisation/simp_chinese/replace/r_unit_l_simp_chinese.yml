#步兵
 infantry: "步兵"
 infantry_desc: "刀俎上的鱼肉。"
 militia: "民兵"
 mountaineers: "山地步兵"
 mountaineers_desc: "山区作战使部队面临众多潜在危险，总有猝不及防的情况发生。为士兵们提供这种环境的针对性训练，可以把风险降到最低。"
 paratrooper: "空降步兵"
 paratrooper_desc: "空降伞兵已经加入了军队序列，现在我们可以强势切入敌方防线，或是在以前无法抵达的地方部署关键部队，这意味着新的战术机会。"
 marine: "两栖步兵"
 marine_desc: "这种配有两栖作战装备的专业部队日益成为军队不可或缺的力量。我们的两栖步兵装备特制的登陆艇并接受专业训练，装具简陋和训练不足已是过去时。"
 special_warfare: "特战步兵"
 special_warfare_desc: ""
 motorized: "摩托化步兵"
 motorized_desc: "摩托化步兵载具，如卡车、摩托车等。"
 mechanized: "机械化步兵"
 mechanized_desc: "有轻型装甲的步兵载具。"

#空中突击
 air_assault: "空中突击步兵"
 air_assault_desc: "乘坐直升机的步兵，通过立体机动来出现在敌人意想不到的地方。"

#机动骑兵
 motorized_cavalry: "机动骑兵"
 motorized_cavalry_desc: "骑摩托车的步兵，更贵，更快。"

#支援连

 engineer: "工兵连"
 engineer_desc: "构建工事和排除障碍的专业能力使得工程兵在战场上至关重要。培养工程部队全面的技能，这让我们可以把它部署到任何需要它应对的情况和环境。"
 field_hospital: "野战医院"
 field_hospital_desc: "在战场上为伤兵提供紧急医疗处理。"
 logistics_company: "后勤连"
 logistics_company_desc: "处理部队物资的规划、请领和分发。"
 military_police: "宪兵队"
 military_police_desc: "维持军纪并镇压占领区的抵抗。"
 signal_company: "通信连"
 signal_company_desc: "负责部队的本地通信。"
 maintenance_company: "维修连"
 maintenance_company_desc: "负责部队装备的维护保养。"
 recon: "骑兵侦察分队"
 recon_desc: "在主力行进前派出小股斥候以获得敌人位置和数目的情报。"
 mot_recon: "摩托化侦察连"
 mot_recon_desc: "利用轻型卡车和摩托车，侦察连可以在更远的范围内活动并覆盖更广的区域以保护部队的侧翼。"
 light_tank_recon: "装甲侦察连"
 light_tank_recon_desc: "在侦察单位中使用轻型坦克，我们能够利用开火来实现一些火力侦察的目的，从而更好的了解我们面对的是什么。"
 helicopter_recon: "直升机侦察连"
 helicopter_recon_desc: "经过专门训练的炮兵观察员乘坐直升机，无论地形如何都能快速侦察特定区域，并在需要时引导精确打击。"
 firepower: "火力连"
 firepower_desc: "配备重机枪、轻型迫击炮及各类重型火器的连队，为步兵作战提供火力支援。"

 firepower_support: "团属火力连"
