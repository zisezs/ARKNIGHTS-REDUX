l_simp_chinese:
 STAT_ARMY_RECON_MOD_VALUE: " $VALUE|=+1$" #修复了原版侦察buff的显示

 STAT_ARMY_FUEL_CONSUMPTION: "液化源石使用： "
 STAT_ARMY_FUEL_CONSUMPTION_DESC: "单位每日使用的液化源石。"
 STAT_NAVY_RANGE_DESC: "一艘舰艇的航程代表她在所装载的液化源石和食物等的限制下，能够从最近的海军基地航行的距离。"
 STAT_ARMY_FUEL_CAPACITY: "液化源石容量： "
 STAT_ARMY_FUEL_CAPACITY_DESC: "这个单位可以储存燃料的量。更高的液化源石容量意味着在缺乏燃料供应的时候，该单位拥有更长的自持力。"
 STAT_COMMON_FUEL_CONSUMPTION: "液化源石使用： "
 STAT_COMMON_FUEL_CONSUMPTION_DESC: "这个单位在行动时使用的液化源石量。空军和海军单位在执行任务或训练期间会消耗液化源石。拥有液化源石消耗的陆军单位在闲置时也会消耗液化源石，但是战斗、移动或训练将进一步增加液化源石消耗。"
 STAT_COMMON_FUEL_CONSUMPTION_FACTOR: "液化源石使用： "
 STAT_COMMON_FUEL_CONSUMPTION_FACTOR_DESC: "这个单位在行动时使用的液化源石量。空军和海军单位在执行任务或训练期间会消耗液化源石。拥有液化源石消耗的陆军单位在闲置时也会消耗液化源石，但是战斗、移动或训练将进一步增加液化源石消耗。"