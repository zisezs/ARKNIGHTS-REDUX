 mechanized_equipment: "机械化装备"
 mechanized_equipment_desc: "机械化"
 mechanized_equipment_1: "机械化装备 I型"
 mechanized_equipment_1_desc: "机械化步兵是装备有装甲运兵车和步兵战车用于运输和战斗的步兵部队。机械化步兵与摩托化步兵的区别在于这些装甲车辆比起摩托化步兵的软面皮轮车辆（卡车或吉普等）一定程度上为步兵提供了免于敌方火力的保护。"
 mechanized_equipment_2: "机械化装备 II型"
 mechanized_equipment_2_desc: "在原有的基础上加装了更加厚实的装甲的同时更换了更加先进的引擎，使得步兵能够安全快速抵达前线。"
 mechanized_equipment_3: "机械化装备 III型"
 mechanized_equipment_3_desc: "配备了更加厚实的武器装备，使得步兵能在运输途中偶遇敌军的情况下突出重围"
 mechanized_equipment_4: "机械化装备 IV型"
 mechanized_equipment_4_desc: "将武器、装甲和引擎进一步升级，提高步兵运输时的保障"

