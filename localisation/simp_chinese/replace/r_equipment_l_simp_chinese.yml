 motorized_equipment: "卡车"
 motorized_equipment_0: "早期运输卡车"
 motorized_equipment_0_desc: ""
 motorized_equipment_1: "运输卡车 I型"
 motorized_equipment_1_desc: "摩托化是陆军机械化的第一步。民用卡车可以很容易地被用来运输士兵、牵引火炮以及输送装备和补给。这极大地提高了步兵的战略机动能力，使其不再依赖于步行。"
 motorized_equipment_2: "运输卡车 II型"
 motorized_equipment_2_desc: ""
