l_simp_chinese:
 air_engines: "飞行器引擎"
 AIR_ENGINES_SPECIAL: "研发飞机引擎是研发飞机的一个基本先决条件。在研究飞机之前，必须先完成这项研究。"
 air_engines_desc: ""
 jet_engines: "喷气引擎"
 JET_ENGINES_SPECIAL: "研发喷气引擎是研发喷气动力飞机的一个基本先决条件。在研究高级飞机之前，必须先完成这项研究。"
 jet_engines_desc: "推动力科技的一次突破。喷气引擎将打开研究新一代飞机的大门。"

 EQUIPMENT_ANTI_TANK: "穿甲炮"

 tank_at_upgrade: "穿甲武器"
 tank_at_upgrade_desc: "确保我们的自行穿甲炮能干掉敌人最新的坦克。"

 guided_missile_equipment: "制导导弹"
 guided_missile_equipment_1: "基础制导导弹"
 guided_missile_equipment_1_short: "制导导弹 I型"
 guided_missile_equipment_1_desc: "无人飞行导弹，使用液化源石燃料作为推进剂，采用简易制导装置作为引导装置，可以进行相对精确的远距离打击。"
 guided_missile_equipment_2: "改良型制导导弹"
 guided_missile_equipment_2_short: "制导导弹 II型"
 guided_missile_equipment_2_desc: "更好的无人飞行导弹，使用固体源石燃料作为推进剂，采用复合制导装置作为引导装置，可以进行比较精确远距离打击。"
 guided_missile_equipment_3: "先进型制导导弹"
 guided_missile_equipment_3_short: "制导导弹 III型"
 guided_missile_equipment_3_desc: "最好的无人飞行导弹，使用高能固体源石燃料作为推进剂，优化了弹体结构，使用高性能复合制导装置进行制导，可以进行精确的远距离打击。"

 train_equipment: "运输陆行舰"
 train_equipment_desc: "这种民用陆行舰本用于大宗商品货物运输，如今被征用于运输前线的补给。"
 train_equipment_1: "运输陆行舰模块"
 train_equipment_1_desc: "这种民用陆行舰本用于大宗商品货物运输，如今被征用于运输前线的补给，但因其民用构造而极易受到破坏。"
 train_equipment_2: "简化运输陆行舰"
 train_equipment_2_desc: "与常规的民用陆行舰作用相同，为了减少造价而省略了许多不必要的功能，虽然一样脆弱，但至少更容易更换。"
 train_equipment_3: "装甲运输陆行舰"
 train_equipment_3_desc: "与常规陆行舰相比增加了装甲，不易受到敌军破坏，运载量不变，但生产成本更高。"
 railway_gun_equipment_1: "攻城陆行舰模块"
 railway_gun_equipment_1_desc: "配备了巨炮的陆行舰，可以用于对城市的炮击。"

