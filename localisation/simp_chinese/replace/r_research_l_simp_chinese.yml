 basic_fortification_tech: "基础防御工事"
 basic_fortification_tech_desc: "通过使用更坚固的材料和金属加固结构，我们可以建造更大的防御工事，而不必担心它们坍塌。"
 land_fort_tech_1: "改良陆上要塞"
 land_fort_tech_1_desc: "通过更好地利用我们防御工事周围的土地，并引入新技术，我们可以加强我们现有的防御工事，并进一步扩大它们。"
 land_fort_tech_2: "先进陆上要塞"
 land_fort_tech_2_desc: "通过吸取过去的教训，不仅加固工事本身，而且可以加固其基础，我们将能够建造更大的防御工事，足以抵挡最有经验的敌人。"
 coastal_fort_tech_1: "改良海岸要塞"
 coastal_fort_tech_1_desc: "通过更好地利用沿海防御工事周围的土地，并引入新技术，我们可以加强现有工事，并进一步扩大它们。"
 coastal_fort_tech_2: "先进海岸要塞"
 coastal_fort_tech_2_desc: "通过将我们的掩体和防御工事建在悬崖和山丘中，我们可以建造更大的工事，足以抵御最强大的海上入侵力量。"
 sp_rockets_improved_guidance: "改进型制导系统"
 sp_rockets_improved_guidance_desc: "更好的火箭制导系统将使我们的飞行炸弹能够飞得更远，成为敌人更大的威胁。通过改进小型火箭的制导系统，我们的火箭炮兵将能够更好地提高瞄准精度。"
 sp_rockets_rocket_bomber: "$rocket_propelled_bombs$"
 sp_rockets_rocket_bomber_desc: "$rocket_propelled_bombs_desc$"
 sp_rockets_improved_rocket_bomber: "$improved_rocket_propelled_bombs$"
 sp_rockets_improved_rocket_bomber_desc: "$improved_rocket_propelled_bombs_desc$"
 sp_armored_advanced_flamethrower_tech: "先进型喷火器"
 sp_armored_advanced_flamethrower_tech_desc: "$advanced_flamethrower_desc$"
 sp_armored_lc_high_impact_obliterator_cannon_tech: "高冲击毁灭者加农炮"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc: "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech: "海军引擎改造"
 sp_armored_lc_naval_engine_conversion_tech_desc: "利用海军工程技术，如强化的曲轴、高扭矩变速器和专用冷却系统，可以增强陆地巡洋舰引擎的功率输出和耐久性，使其更好地管理巨大的重量和压力。"
 sp_armored_lc_transmission_improvements_tech: "改良通讯"
 sp_armored_lc_transmission_improvements_tech_desc: "精炼的齿轮比、离合器机制和扭矩转换器可以创建更高效的传动装置，能够处理陆地巡洋舰的极端动力和重量，改善整体机动性并减少机械压力。"
 sp_armored_lc_specialized_field_manuals_tech: "专业战场手册"
 sp_armored_lc_specialized_field_manuals_tech_desc: "开发专门为陆地巡洋舰乘员量身定制的详细培训手册，涵盖独特的操作程序、维护规范和复杂的战场战术，确保有效指挥这些巨型战争机器。"
 sp_armored_lc_weapon_fire_control_tech: "武器火力控制系统"
 sp_armored_lc_weapon_fire_control_tech_desc: "采用先进的瞄准光学设备、测距仪和陀螺稳定器，可以提高武器精度和火力协调，确保火炮能有效击中目标，尽管其后坐力巨大且机动性缓慢。"
 sp_armored_engineer_tech: "装甲工兵连"
 sp_armored_engineer_tech_desc: "将工程技术与装甲防护相结合，装甲工兵单位专门用于在重火力下清除障碍并支援前线推进。"
 sp_armored_maintenance_tech: "装甲维修连"
 sp_armored_maintenance_tech_desc: "使用装甲抢修车使我们的维修人员能够回收和修复各种设备，确保战场上的最大限度的作战准备。"
 sp_armored_signal_tech: "装甲通信连"
 sp_armored_signal_tech_desc: "为我们的部队配备指挥车辆，确保在装甲保护下的战场通信和协调的安全性和可靠性。"
 sp_armored_motorized_military_police_tech: "摩托化宪兵"
 sp_armored_motorized_military_police_tech_desc: "这些部队配备了军用摩托车，负责在后方维持秩序，护送车队并进行巡逻。它们的速度和机动性使其能够迅速响应干扰，必要时还可在活跃战区进行侦察。"
 sp_cluster_shells: "集束弹"
 sp_cluster_shells_desc: "集束弹大范围散射多枚子弹药，最大限度地破坏敌人的部队和装备"
 sp_artillery_rocket_assisted_projectiles_tech: "火箭助推弹"
 sp_artillery_rocket_assisted_projectiles_tech_desc: "为超重型榴弹炮设计的增强型弹药，利用火箭推进来扩大射程并加强冲击力。"
 sp_artillery_purpose_built_gun_motor_carriages_tech: "专用火炮运载车"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc: "专为运输和支援超重型榴弹炮设计的专用车辆，确保机动性和战场部署的便利性。"
 sp_multi_product_supply_ships: "多功能补给舰"
 sp_multi_product_supply_ships_desc: "使用新生产的补给舰，我们可以确保在两舰之间更平稳地转移燃料、弹药和食品补给。"
 sp_standard_tenshioned_replenishment_alongside_method: "标准横向补给系统"
 sp_standard_tenshioned_replenishment_alongside_method_desc: "标准横向补给系统是进一步确保我们远洋海军行动得到稳定补给的进一步发展"
 sp_aip_engine_improved_tech: "无氧推进-柴油组合引擎"
 sp_aip_engine_improved_tech_desc: "进一步改良无氧推进技术后，我们在引擎性能和材料消耗方面都看到了改进。"
 sp_aip_engine_advanced_tech: "高速沃尔特引擎"
 sp_aip_engine_advanced_tech_desc: "我们对独立空气推进系统的经验和理解使我们得以开发出最先进的引擎。安静、快速且致命。"
 sp_refined_pykrete: "改良的派克瑞特"
 sp_refined_pykrete_desc: "进一步改良派克瑞特之后，我们现在能够为冰航母上的飞机提供更好的隔热和保护。"
 sp_ice_composite_runawayas: "冰复合材料跑道"
 sp_ice_composite_runawayas_desc: "随着冰复合材料的持续发展，我们正在寻找最佳材料和施工技术，为我们的航母和飞机提供保护。"
 heavy_battleship2: "超重型战列舰II型"
 heavy_battleship2_desc: "在我们早期超重型设计基础上的改进型号，拥有更强大的武器和改进的火控系统。"
 sp_shock_hardening_techniques: "冲击硬化技术"
 sp_shock_hardening_techniques_desc: "通过使用各种冲击硬化技术，并对我们的组件使用应力均衡器，我们降低了过早爆炸的概率，使我们的弹药更可靠、更有效。"
 sp_variable_time_fuze_shells: "可变时引信炮弹"
 sp_variable_time_fuze_shells_desc: "凭借应用可变时引信炮弹——我们可以让野战炮兵对敌人造成了毁灭性打击。炮弹在到达地面之前爆炸，从而创造了更大的杀伤区。"
 sp_helicopter_transport_pods_tech: "直升机运输连"
 sp_helicopter_transport_pods_tech_desc: "装备有运输吊舱或在机身下方用缆绳牵引货物的直升机可以快速运送物资和设备，不受地形限制。陷入泥泞将成为过去！"
 sp_helicopter_artillery_observers_tech: "直升机侦察连"
 sp_helicopter_artillery_observers_tech_desc: "直升机能够无视实际地形获得战场的良好视野，因此非常适合担任前线侦察，为炮兵单位提供准确反馈。"
 sp_helicopter_med_evac_tech: "直升机急救连"
 sp_helicopter_med_evac_tech_desc: "伤员来了！伤员来了！直升机可以比平常的救护车更快地撤离伤员。"
 sp_rockets_dual_chamber_rocket_engine_1: "双燃烧室火箭引擎"
 sp_rockets_dual_chamber_rocket_engine_1_desc: "通过在引擎中添加第二个燃烧室，我们可以提高火箭引擎的飞行时间和效能。"
 sp_rockets_dual_chamber_rocket_engine_2: "先进双燃烧室火箭引擎"
 sp_rockets_dual_chamber_rocket_engine_2_desc: "对双燃烧室引擎的进一步改进可能会在原本设计的基础上带来更大的效能提升。"
 reinforced_wings_mothership: "强化空天母舰的航空联队"
 reinforced_wings_mothership_desc: "没有空天母舰的战斗机在空中基本上就会陷入困境，严重限制了它们的作战效能。加强空天母舰的航空联队，是提高整支部队生存能力的最具成本效益的策略。"
 miniature_fighters: "小型战斗机"
 miniature_fighters_desc: "通过使用更小型的战斗机，我们将能够在不牺牲太多火力的情况下，携带更多战斗机投入战斗，同时减少空天母舰的负载重量。"
 aerial_hangars: "空中机库"
 aerial_hangars_desc: "附加在空天母舰上的空中机库使我们能够在这个飞行器的顶部装载更多的小型战斗机，从而增强火力并扩大作战半径。"
 mothership: "空天母舰"
transport_planes_cat: "运输机"

#工业与电子（民用页）
 civ_folder: "工业与电子"
 civ_folder_desc: "工业、生产、建设、源石化工、能源动力、生物与电子技术。"
 biological: "生物科学"
 biological_technology: "生物技术"

#生物科学
 arf_bio_1: "基础微生物学"
 arf_bio_1_desc: "对源石环境下的微生物群落展开系统研究，是一切现代生物科技的基础。"
 arf_bio_2: "现代微生物学"
 arf_bio_2_desc: "改良培养与观测手段，使我们得以解析更复杂的微生物代谢路径。"
 arf_bio_3: "高通量组学测序"
 arf_bio_3_desc: "并行测序技术大幅加快了基因与蛋白信息的采集速度，让研究不再受限于单点观测。"
 arf_bio_4: "人工蛋白合成"
 arf_bio_4_desc: "从零构建蛋白质，为医药与材料领域打开新的可能。"
 arf_bio_5: "计算生物学"
 arf_bio_5_desc: "以算力模拟生命过程，让实验设计从反复试错转向事前预测。"
 arf_bio_6: "高精度基因编辑"
 arf_bio_6_desc: "精确改写遗传信息，使定向育种与靶向治疗成为现实。"
 arf_bio_7: "系统生物学"
 arf_bio_7_desc: "把细胞视为整体网络，理解各组分之间的协同与反馈关系。"
 arf_bio_8: "定量生物学"
 arf_bio_8_desc: "用严谨的数学建模描述生命现象，让生物学真正走向精确科学。"

#生物技术
 arf_biotech_1: "现代医药工业"
 arf_biotech_1_desc: "规模化生产药物与疫苗，显著提升军民医疗水平与伤员存活率。"
 arf_biotech_2: "现代农业育种"
 arf_biotech_2_desc: "以生物技术改良作物，提高粮食产量与抗逆性，稳定后方供给。"
 arf_biotech_3: "AI辅助药物设计"
 arf_biotech_3_desc: "借助人工智能筛选候选分子，大幅缩短新药研发周期。"
 arf_biotech_4: "合成淀粉与生物制造"
 arf_biotech_4_desc: "以工业生物制造替代传统种植，为基础物资提供稳定而高效的来源。"
 arf_biotech_5: "器官3D打印"
 arf_biotech_5_desc: "按需打印组织与器官，缓解移植资源短缺，让更多伤者重回战场。"
 arf_biotech_6: "脑机接口"
 arf_biotech_6_desc: "打通神经与机械之间的通路，开启人机协同的全新纪元。"

