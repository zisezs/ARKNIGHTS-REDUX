 INDUSTRY_TITLE_CONSTRUCTION: "建设"
##生产
 basic_machine_tools: "基础机床"
 basic_machine_tools_desc: "种类繁多的新型铣床均可用于军工生产：这包含任何车间都可见的小型多用途型号到技术尖端的大型先进型号铣床。"
 numerical_control_machine_tools: "数控机床"
 improved_machine_tools_desc: "使用伺服装置的自动化机床之可行性曾被探讨过。将这些想法付诸实践则可利用自动化领域的其他进步成果，例如计算机。"
 assembly_line_production: "流水线生产"
 assembly_line_production_desc: "已在各个工业领域应用的动力流水线能促成前所未有的大规模生产，并能以此改变战争的进程。"
 robot_arm_assembly_line: "机械臂流水线"
 assembly_line_production_desc: ""
 flexible_line_1: "柔性生产线 I"
 flexible_line_1_desc: "流水线作为机器，无论如何运转流畅亦靠人工来操作。利用这点即可于工业生产中见机而行来进行调整。"
 flexible_line_2: "柔性生产线 II"
 flexible_line_3: "柔性生产线 III"
 flexible_line_4: "柔性生产线 IV"
 streamlined_line_1: "一体化生产线 I"
 streamlined_line_1_desc: "流水线的标准化和刚性结构是确保其效率和安全性的关键。这些方面应是我国工业生产发展的重点。"
 streamlined_line_2: "一体化生产线 II"
 streamlined_line_3: "一体化生产线 III"
 streamlined_line_4: "一体化生产线 IV"
##工业
 agglomerative_industrial_chain_1: "集聚化产业链 I"
 agglomerative_industrial_chain_1_desc: "把工业生产集中在少数关键地点将显著提高效率。"
 agglomerative_industrial_chain_2: "集聚化产业链 II"
 agglomerative_industrial_chain_2_desc: "进一步集中工业生产将有助于拉低成本。"
 agglomerative_industrial_chain_3: "集聚化产业链 III"
 agglomerative_industrial_chain_3_desc: "配套基础设施的开销也因为更集中的工业而降低。"
 advanced_agglomerative_industrial_chain_1: "先进集聚化产业链 I"
 advanced_agglomerative_industrial_chain_1_desc: "让工业生产的关键部分彼此靠近将增大这些地区的影响。"
 advanced_agglomerative_industrial_chain_2: "先进集聚化产业链 II"
 advanced_agglomerative_industrial_chain_2_desc: "主要工业园区现已连接工业生产的许多方面，运输与人力成本因此最小化。"
 advanced_agglomerative_industrial_chain_3: "先进集聚化产业链 III"
 advanced_agglomerative_industrial_chain_4: "先进集聚化产业链 IV"
 decentralized_industrial_chain_1: "分散化产业链 I"
 decentralized_industrial_chain_1_desc: "通过分散工业，我方能确保敌人在战时将难以瞄准它。"
 decentralized_industrial_chain_2: "分散化产业链 II"
 decentralized_industrial_chain_2_desc: "进一步分散工业将使针对某一特定部分的袭击更困难。"
 decentralized_industrial_chain_3: "分散化产业链 III"
 decentralized_industrial_chain_3_desc: "把工厂伪装成其他作业来运转将避免遭受直接攻击的风险。"
 advanced_decentralized_industrial_chain_1: "先进分散化产业链 I"
 advanced_decentralized_industrial_chain_1_desc: "伪装并分散工厂将创造一个极度难以完全被干扰的网络。"
 advanced_decentralized_industrial_chain_2: "先进分散化产业链 II"
 advanced_decentralized_industrial_chain_2_desc: "不仅让工厂，也让基础设施秘密运作的话，想通过空袭摧毁我方工业便更加困难。"
 advanced_decentralized_industrial_chain_3: "先进分散化产业链 III"
 advanced_decentralized_industrial_chain_4: "先进分散化产业链 IV"
##建设
 construction_1: "建筑技术 I"
 construction_1_desc: "改良的建筑技术与建材将提高我方建造军民建筑的速度。"
 construction_2: "建筑技术 II"
 construction_2_desc: "将工具与装备现代化有助于进一步提高建筑效率。"
 construction_3: "建筑技术 III"
 construction_3_desc: "引入现代化车辆及建筑领域上的进步经验将极大加快修理速度。"
 advanced_construction_1: "先进建筑技术 I"
 advanced_construction_1_desc: "更高程度的机械化与更好的工序能进一步提高建筑速度。"
 advanced_construction_2: "先进建筑技术 II"
 advanced_construction_2_desc: "高效建设的未来将需要对单个项目进行更长久的规划，并尽可能采用标准化解决方案。"
 advanced_construction_3: "先进建筑技术 III"
 advanced_construction_3_desc: ""
 advanced_construction_4: "先进建筑技术 IV"
 advanced_construction_4_desc: ""
 excavation_1: "挖掘技术 I"
 excavation_1_desc: "基于挖掘技术的进步，在过去不可企及的地点开采资源变得可能。"
 excavation_2: "挖掘技术 II"
 excavation_2_desc: "新技术可以帮助我们更有效地收集资源。我们不再在开采时污染资源，从而提高了产量。"
 excavation_3: "挖掘技术 III"
 excavation_3_desc: "地质学进步有助于资源勘探。我方现在能集中开发更有可能发现大量自然资源的地点。"
 advanced_excavation_1: "先进挖掘技术 I"
 advanced_excavation_1_desc: "关键程序上的自动化以及机械学领域上的进展让所有资源采集点的效率都提升了。"
 advanced_excavation_2: "先进挖掘技术 II"
 advanced_excavation_2_desc: "在露天开采等领域上的进展让现有资源采集点的产出进一步增长。"
 advanced_excavation_3: "先进挖掘技术 III"
 advanced_excavation_3_desc: ""
 advanced_excavation_4: "先进挖掘技术 IV"
 advanced_excavation_4_desc: ""
##源石
 fuel_silos: "源石合成与储存技术"
 fuel_silos_desc: "我们通过研究改进了精炼源石的技术，现在我们能够从源石粗矿中提取液化源石。然而大量储存液化源石需要一套复杂的容器、管道和阀门以确保其既安全又方便使用。"
 fuel_refining_1: "源石精炼 I"
 fuel_refining_1_desc: "精炼技术的进步使得从源石粗矿中提炼液化源石的效率更高了。"
 fuel_refining_2: "源石精炼 II"
 fuel_refining_2_desc: "更好地规划提炼厂布局可以减少液化源石的浪费。"
 fuel_refining_3: "源石精炼 III"
 fuel_refining_3_desc: "改进的回收方法允许从副产品中提炼液化源石。"
 advanced_fuel_refining_1: "先进源石精炼 I"
 advanced_fuel_refining_1_desc: "精炼技术的新发展允许从新的来源精炼液化源石。"
 advanced_fuel_refining_2: "先进源石精炼 II"
 advanced_fuel_refining_2_desc: "在提炼厂的建设中采用新方法和改进的布局，在减少浪费的同时大大提高了产量。"
 advanced_fuel_refining_3: "先进源石精炼 III"
 advanced_fuel_refining_3_desc: ""
 advanced_fuel_refining_4: "先进源石精炼 IV"
 advanced_fuel_refining_4_desc: ""
 oil_processing_1: "源石加工 I"
 oil_processing_1_desc: "合成蒸馏和精炼源石产品的工厂网络是确保我国燃料供应的下一个步骤。"
 oil_processing_2: "源石加工 II"
 oil_processing_2_desc: "将先前的蒸馏实验方法转移到大规模的操作将使我们能够更好地适应现有的材料和需求。"
 oil_processing_3: "源石加工 III"
 oil_processing_3_desc: "像加氢处理这样的新实验纯化技术可以用于源石生产，以大大改善最终产品。"
 advanced_oil_processing_1: "先进源石加工 I"
 advanced_oil_processing_1_desc: "我们的炼油厂可以通过加氢裂化，烷基化，硫醇氧化和异构化等先进的源石加工方法进一步改善。"
 advanced_oil_processing_2: "先进源石加工 II"
