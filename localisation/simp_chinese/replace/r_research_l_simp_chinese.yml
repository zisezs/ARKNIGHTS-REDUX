 special_forces_doctrine: "特种部队学说"
 special_forces_doctrine_folder: "特种部队学说"
 special_forces_doctrine_folder_desc: "我们特种部队的训练方式。"
 MOUNTAINEERS_DOCTRINE_LABEL: "山地步兵"
 MARINES_DOCTRINE_LABEL: "海军陆战队"
 PARATROOPERS_DOCTRINE_LABEL: "空降兵"
 MOUNTAINEERS_DOCTRINE_DESC: "着重军事关注于习惯恶劣地形的兵团将使我们在机动和拒止对手方面具有优势。"
 MARINES_DOCTRINE_DESC: "一支强大的海军陆战队会让敌军对海岸线四处提心吊胆。我们的精锐海军陆战队擅长在恶劣的环境和最猛烈的炮火下作战。"
 PARATROOPERS_DOCTRINE_DESC: "空降突击是战争的未来。重视空降兵能给我们带来空中力量和地面攻击的完美协同。"
 special_forces_mountaineers: "重视山地步兵"
 special_forces_mountaineers_desc: "恶劣的环境和激烈的冲突吸引着最坚韧的士兵加入我们的精锐部队。将他们的首要地位奉为我们的学说哲学，确保我们将继续从招聘最优秀的人才中受益。"
 special_forces_paratroopers: "重视空降兵"
 special_forces_paratroopers_desc: "没有什么比看到一千架满载部队、遮天蔽日的运输机更恐怖。我们的学说理论必须利用空降兵给敌人施加恐惧和震撼。"
 special_forces_marines: "重视海军陆战队"
 special_forces_marines_desc: "海军陆战队生来就是为了在他人望而却步处战斗。无论是国内海岸或是国外气候，这些专家擅长渗透和两栖作战。我们的军事学说应该以涉及广泛、精巧灵活的理论为核心。"
 ski_troops: "寒冷天气专家"
 ski_troops_desc: "寒冷天气专家对我们的战场战术至关重要。通过在军事章程中正式承认这些专家，我们就可以划出资源和训练来进一步提升他们。"
 special_forces_recon: "战场情报"
 special_forces_recon_desc: "我们的精锐军团受益于首屈一指的反制情报和战场感知。额外的培训肯定会使我们进一步受益。"
 gwtank: "一战坦克"
 basic_light_tank: "轻型坦克 I型"
 armored_car1: "$gw_armored_car_equipment$"
 armored_car2: "$armored_car_equipment_1$"
 armored_car3: "$armored_car_equipment_2$"
 mountaineers_combat_1: "守住防线"
 mountaineers_combat_1_desc: "我们的精锐部队必须集中力量坚守擅长的地区。将伏击战术和改进的兵团组织相结合，可以确保我们的特种部队对入侵部队具有显著的纵深防御能力。"
 mountaineers_combat_2: "山地火炮"
 mountaineers_combat_2_desc: "山地炮兵团是专门为我们的精锐师提供快速远程支援而设计的部队，他们在困难的地形上训练和作战。他们的存在大大提高了我们特种部队的作战能力。"
 mountaineers_combat_3: "协同作战训练"
 mountaineers_combat_3_desc: "虽然我们的精锐军团在高度独立的基础上运作，但通过在训练方案中增加对协同作战行动的关注，可以提高他们在战场上的效能。"
 mountaineers_keystone_1: "武装力量骨干"
 mountaineers_keystone_1_desc: "我们精英特种部队的成功要求我们以他们的存在为中心重新调整我们的军事理论。"
 mountaineers_keystone_2: "共享教官"
 mountaineers_keystone_2_desc: "如果不把我们山地部队已经掌握的这些知识运用到我们特种部队的其他分支中，那简直愚蠢至极。我们将实行教官轮岗计划，以期提高我们的整个机构的知识。"
 paras_dispersed_drop: "侦查破袭"
 paras_dispersed_drop_desc: "我们的行动性质要求我们的空降部队精通高度分散的空投，以期在敌人意识到我们的存在之前进行重大破坏。"
 paras_combat_drop: "战斗穿插"
 paras_combat_drop_desc: "直接强行介入战术虽然危险，但在此方面训练我们的精英部队可以结合常规突击带来显著的战斗优势。"
 SF_PARAS_combat_effect_tt: "我们§H伞降§!地区内的敌军师§H组织度§!将降低。\n\n$PARA_EFFECT_TIMER$"
 SF_PARAS_sabotage_effect_tt: "我方§H伞降§!到敌方控制的地区内的§H军用工厂§!、§H民用工厂§!和§H基础设施§!将受到损伤。\n\n$PARA_EFFECT_TIMER$"
 PARA_EFFECT_TIMER: "该效果每§H30§!天在每个地区施加一次。"
 paras_airborne_light_armor: "空降装甲"
 paras_airborne_light_armor_desc: "一些轻型坦克可以借助重型滑翔机进行空投。这种新颖的战斗插入方法可能有些名不见经传，但可以为我们提供新的机会。"
 paras_bonus_2: "战略空运部队"
 paras_bonus_2_desc: "建立一个专司空运管理的机构意味着我们可以依照特定空降介入目的针对性地调整我们的货机。"
 paras_combat_1: "空降通讯"
 paras_combat_1_desc: "我们后方部队的完美通讯线路无与伦比。训练通讯连的空中穿插本领，这样我们即使在最恶劣的条件下也能保有这些关键的通信能力。"
 paras_combat_2: "空降医疗分队"
 paras_combat_2_desc: "我们的空降行动规模已经扩大到甚至连基本的医疗设备也必须为空降行动做好准备的程度。"
 paras_bonus_1: "增强导航训练"
 paras_bonus_1_desc: "即使最好的投送也有可能偏航。我们必须确保部队在临时导航方面得到良好的训练。"
 paras_keystone_1: "精益求精"
 paras_keystone_1_desc: "只有那些久经沙场的老兵才应该被考虑加入我们的空降营。虽然这可能会减少我们招兵的来源，但在战场上肯定大有裨益。"
 paras_keystone_2: "武装力量骨干"
 paras_keystone_2_desc: "今后，我们的武装力量将以空降部队的技能和训练为基础。当我们来临时必将天昏地暗，敌人必闻风丧胆。"
