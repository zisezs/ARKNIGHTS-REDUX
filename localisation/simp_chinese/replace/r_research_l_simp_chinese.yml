 arts_weapons: "法术武器"
 arts_weapons_improvement_1: "术士装备改进 I"
 arts_weapons_improvement_1_desc: "对施术方式规定了标准格式，便于术士的施术，同时也能增强法术效果。"
 arts_weapons_improvement_2: "术士装备改进 II"
 arts_weapons_improvement_2_desc: "将法术进行数字化，并据此对法杖进行改进，提高施术效率。"
 arts_weapons_improvement_3: "术士装备改进 III"
 arts_weapons_improvement_3_desc: "利用源石的晶体结构，提高源石与法术回路的融合度，从而使术士能够更轻松地使用法术。"
 arts_weapons_improvement_4: "术士装备改进 IV"
 arts_weapons_improvement_4_desc: "将从前已有的施术方式进行反向编译，使其适应新装备并且发挥更大用途。"
 arts_weapons_improvement_5: "术士装备改进 V"
 arts_weapons_improvement_5_desc: "将法术回路进行压缩，在法杖内打造复合回路，提高法杖的性能和便携度。"
 arts_weapons_improvement_6: "术士装备改进 VI"
