 night_vision_1: "夜视仪 I"
 night_vision_1_desc: "敌不见我，我可见敌是夜战的关键。红外线科技上的发明让我军得以列装夜视装备到部队，虽然数量有限。"
 night_vision_2: "夜视仪 II"
 night_vision_2_desc: "早期红外瞄准镜虽意图供狙击手使用，但视野范围有限。随着便携性与视野范围同步改善，夜视装置将供更多部队夜战使用。"
 night_vision_3: "夜视仪 III"
 night_vision_3_desc: ""
 night_vision_4: "夜视仪 IV"
 night_vision_4_desc: ""

 motorized_cavalry_1: "机动骑兵 I"
 motorized_cavalry_1_desc: "我军急需一种廉价而机动性强的兵种，于是机动骑兵应运而生。"
 motorized_cavalry_2: "机动骑兵 II"
 motorized_cavalry_2_desc: "与原来的普通摩托不同，经过改良后的摩托能够装载轻型武器，提供火力支援。"
 motorized_cavalry_3: "机动骑兵 III"
 motorized_cavalry_3_desc: "在原有的基础上升级了引擎，更快更强。"
 motorized_cavalry_4: "机动骑兵 IV"
 motorized_cavalry_4_desc: ""

 paratroopers_1: "空降兵 I"
 paratroopers_1_desc: "将空降部队引入陆军后，我方能强行打开突破口并在过去无法进入的地区部署关键点部队，这带来新的战术机遇。"
 paratroopers_2: "空降兵 II"
 paratroopers_2_desc: "寥寥数名空降兵组成的小型行动组到大型空降师的转变为大规模空降行动铺平了道路。曾让人耳目一新的空降部队现已在战场上数见不鲜。"
 paratroopers_3: "空降兵 III"
 paratroopers_3_desc: "学习根据天气变化来调整空降行动、将诸如伞兵靴之类的必须装备标准化以及更长期的特别训练将使危险的空降任务中的混乱与风险降到最低点。"
 paratroopers_4: "空降兵 IV"
 paratroopers_4_desc: ""

 air_assault_1: "空中突击部队 I"
 air_assault_1_desc: "有别于传统的部队，借助拥有极强的机动性和战斗力的直升机，空输部队能够发挥出更强的威力。"
 air_assault_2: "空中突击部队 II"
 air_assault_2_desc: "通过我们对直升机某些部分的改良，我们可以让机载成员更快捷的进出直升机，使得我们在恶劣地区执行任务的效率提升。"
 air_assault_3: "空中突击部队 III"
 air_assault_3_desc: "紧凑而轻便的新式武器装备提升了我军空输部队的机动性，能让他们在执行任务的时候携带更多的装备。"
 air_assault_4: "空中突击部队 IV"
 air_assault_4_desc: ""

 mountaineers_1: "山地步兵 I"
 mountaineers_1_desc: "在山脉上战斗会使部队暴露在许多致命风险下，然而有时这无可避免。士兵将接受山地特种训练以将风险最小化。"
 mountaineers_2: "山地步兵 II"
 mountaineers_2_desc: "我方部队接受训练后不仅能保存自己，甚至能灵活利用山脉地形创造优势。利用轻量型装备与骡马运输，山地部队在山脉地形中将有比其他步兵更优秀的机动性。"
 mountaineers_3: "山地步兵 III"
 mountaineers_3_desc: "在高海拔低气温的艰苦山地环境执行任务，我军山地部队必须接受非比寻常的训练并拥有坚定纪律。"
 mountaineers_4: "山地步兵 IV"
 mountaineers_4_desc: ""

#支援部队
 recon_tech: "侦察连"
 tech_recon: "侦察连 I"
 tech_recon_desc: "在大部队行动前预先派遣小股侦察兵将使我方获得要面对敌军之所在及数量的情报。"
 tech_recon2: "侦察连 II"
 tech_recon2_desc: "侦查任务往往危机四伏伤亡重大。让侦查队做好频繁转移、撤退的准备，并提供工具以清理敌军布置的障碍物都将提高他们的生还几率。"
 tech_recon3: "侦察连 III"
 tech_recon3_desc: "无线电技术的发展改变了侦查任务的执行方式，使得迅速传递情报变为可能。"
 tech_recon4: "侦察连 IV"
 tech_recon4_desc: "结合了谍报，游击行动与别动队训练的深度侦查作战行动将有助于我方的战术抉择并让我方能随机应变调整决策。"
 tech_recon5: "侦察连 V"
 tech_recon5_desc: "为侦察小组配发轻质且高机动性的侦察用载具可以帮助他们移动得更快，也更容易逃离可能会在行动期间产生的致命情况。"

 tech_engineers: "工兵连 I"
 tech_engineers_desc: "构筑工事及清理障碍的能力使工兵在战场上至关重要。让工兵扮演全能的战场角色将使我方能在各种各样需要他们的环境中部署他们。"
 tech_engineers2: "工兵连 II"
 tech_engineers2_desc: "拥有了现代化装备和高爆炸药后，我方工兵将走出传统角色，在陆上与海洋利用创造力打敌人措手不及。"
 tech_engineers3: "工兵连 III"
 tech_engineers3_desc: "军事工程项目的规模正逐步扩大。先进的基础设施支援将使过去因需求大量补给而无法在战场上实行的作业变为现实。"
 tech_engineers4: "工兵连 IV"
 tech_engineers4_desc: "保持机动的同时还能构筑补给系统和过去被视作“永久性”的防御工事，未来的工兵将确保我军士兵无论在何处遭敌攻击都能作好万全准备。"
 tech_engineers5: "工兵连 V"
 tech_engineers5_desc: "我们的战斗工兵除了给部队提供后勤保障外，他们还可以学习掌握反机动技术，比如摧毁桥梁、封锁道路、还有为友军的支援机建造简易机场。"

 hospital_tech: "野战医院"
 tech_field_hospital: "野战医院 I"
 tech_field_hospital_desc: "“伤亡者”并不应完全指代“烈士”。确保这点的第一步是对撤到后方的伤员进行第一时间急救。"
 tech_field_hospital2: "野战医院 II"
 tech_field_hospital2_desc: "通过设立战地医院并将医疗救助拓展至急需处，众多无谓的阵亡与永久伤残将得以避免。"
 tech_field_hospital3: "野战医院 III"
 tech_field_hospital3_desc: "外科手术是战场最常见的急救措施之一。手术器械和工具必须足够贴近前线，亦应保证随军医疗单位中有熟练的外科医师。"
 tech_field_hospital4: "野战医院 IV"
 tech_field_hospital4_desc: "尽管战场医疗已获得诸多改进和长足进步，但仍未建立好理论体系。活用积累下的经验，我方能更清楚地诠释这些单位的职责，并将各类创新手段变成固定程序。"
 tech_field_hospital5: "野战医院 V"
 tech_field_hospital5_desc: "在人命关天的前线必须配备好更加先进的手术器械和药物，保证尽可能救下每一位可以救治的伤员。"

 logistics_tech: "后勤连"
 tech_logistics_company: "后勤连 I"
 tech_logistics_company_desc: "全军上下的专业后勤军官将保证后勤网络的浪费降至最低。"
 tech_logistics_company2: "后勤连 II"
 tech_logistics_company2_desc: "针对新的战争环境来调整我方风险评估会提高我方后勤支援的安全性。"
 tech_logistics_company3: "后勤连 III"
 tech_logistics_company3_desc: "对部队补给需求进行持续性统计评估将有助于我方资源使用效率的最大化。"
 tech_logistics_company4: "后勤连 IV"
 tech_logistics_company4_desc: "对补给进行标准化分类将使混乱最小化并使规划过程更高效。"
 tech_logistics_company5: "后勤连 V"
 tech_logistics_company5_desc: "允许我们的后勤连与军事工程师合作，一同规划建设桥梁与道路，令物资能直接运送到前线。"

 tech_military_police: "宪兵队 I"
 tech_military_police_desc: "一般士兵也许可以短暂管理占领区，但他们首要且最重要的角色是战士。将宪兵整合入我军将保证我方有余力应对抵抗势力并针对破坏行动展开调查。"
 tech_military_police2: "宪兵队 II"
 tech_military_police2_desc: "通过在占领区履行诸如交通管理和维持公共秩序类的一般警察职责，我方宪兵将使滋生反抗军运动的混乱与无序最小化。"
 tech_military_police3: "宪兵队 III"
 tech_military_police3_desc: "通过与占领前发展的线人、建立的当地间谍网进行合作，我方宪兵能在抵抗势力可能产生的区域先行作好准备。"
 tech_military_police4: "宪兵队 IV"
 tech_military_police4_desc: "对妥善维持占领区治安来说，回归常态与拔除反抗同等重要。我方宪兵必须保证这个过程尽早展开以确保军民安全。"
 tech_military_police5: "宪兵队 V"
 tech_military_police5_desc: "决定每一位宪兵是否称职，关键在于能不能有效结束抵抗组织。为我们的宪兵配备最新的武器装备，将大大提高他们在实际工作中的效率。"

 tech_signal_company: "通信连 I"
 tech_signal_company_desc: "建立并维持战场通讯永远需要专业技能。新型通讯、侦测技术在一战中出现了，这个领域在未来还有新的可能性。"
 tech_signal_company2: "通信连 II"
 tech_signal_company2_desc: "专精于跨军种通讯的通讯连可以保证地面部队能与海空协同并让行动的规划变得更迅速。"
 tech_signal_company3: "通信连 III"
 tech_signal_company3_desc: "逐步完善的便携通讯科技在单兵携带的背包形式下更加可行。由此得到改善的通讯连机动力应被利用。"
 tech_signal_company4: "通信连 IV"
 tech_signal_company4_desc: "我方通讯技术兵们在运用通讯装备上有着无可比拟的实地经验。让他们参与新型通讯科技的研究将活用他们的技能。"
 tech_signal_company5: "通信连 V"
 tech_signal_company5_desc: "让通讯连学习简易的传输加密技术可以加快沟通速度且不需要架设中继站，同时还能进一步推动加密技术的研究。"

 tech_maintenance_company: "维修连 I"
 tech_maintenance_company_desc: "维护、修理及检修对于保持装备安全可靠以供使用至关重要。派专门的连队负责将保证此方面得到合适的关注。"
 tech_maintenance_company2: "维修连 II"
 tech_maintenance_company2_desc: "例行维护程序将降低装备故障的风险并警示士兵在装备损坏前就更换。"
 tech_maintenance_company3: "维修连 III"
 tech_maintenance_company3_desc: "确保士兵在战场上总有基本素材进行常规修理可以避免装备在已知损坏的情况下被持续使用。"
 tech_maintenance_company4: "维修连 IV"
 tech_maintenance_company4_desc: "以前战争中的主动冗余设计经验可以更新运用到更现代化的装备上以降低维护难度。"
 tech_maintenance_company5: "维修连 V"
 tech_maintenance_company5_desc: "给维修连的士兵进行系统化的维修教学，有助于他们在进行复杂修理工作时节约时间。"

#装甲
 ARMOUR_TITLE: "装甲部队"
 ARMOUR_TITLE_HEAVY: "重型"
 ARMOUR_TITLE_MEDIUM: "中型"
 ARMOUR_TITLE_LIGHT: "轻型"

#火炮
 interwar_artillery: "战间期型火炮"
 interwar_artillery_desc: "在发展各种火炮过程中积累的经验可被交叉应用到其他种类。"
 artillery1: "火炮 I型"
 artillery1_desc: "使用更新型的材料与机械装置后，一战遗留的榴弹炮与野战炮可扩膛并升级以适应当前的战争。"
 artillery2: "改良火炮升级 I"
 artillery2_desc: "升级旧火炮必有其极限。设计急需的新式火炮时，利用好新型的液压反冲装置与长炮管。"
 artillery3: "改良火炮升级 II"
 artillery3_desc: "火炮设计时可以添加炮口制动器以利于更重型的火炮搭载于较轻型的载具上。"
 artillery4: "火炮 IV型"
 artillery4_desc: "发展可拆卸运输的轻量化火炮可以将火炮支援延伸到过去无可企及的地方。"
 artillery5: "先进火炮升级"
 artillery5_desc: "炮身设计更低矮的火炮将难以被瞄准。"
 rocket_artillery2: "火箭炮升级 I"
 rocket_artillery2_desc: "发射复数火箭弹的自行火炮可以快速制造大规模杀伤的同时保持机动以回避反击火力。"
 rocket_artillery3: "火箭炮升级 II"
 rocket_artillery3_desc: "牺牲一定射程后，更重型的火箭就能装载在更重型的载具上。透过小组行动，这些火炮单位可以合作一致进行快速的弹药装填与地点转移。"
 rocket_artillery4: "火箭炮 III型"
 rocket_artillery4_desc: "自旋稳定火箭将提高火箭炮射程。"
 antiair1: "防空炮升级"
 antiair1_desc: "附带更快速的装填装置后，使用大型弹药的防空炮就能保证必要的射速。"
 antiair2: "防空炮 II型"
 antiair2_desc: "防空炮需要更大型的弹药与更长的炮管以攻击高空飞行器。"
 antiair3: "改良防空炮升级 I"
 antiair3_desc: "将炮弹进行改良，在内部填充大量破片，提高飞行器被击中的概率。"
 antiair4: "改良防空炮升级 II"
 antiair4_desc: "结合现代化的雷达、计算机及自动装填系统将成为防空炮对高速飞行器进行及时应对的关键。"
 antiair5: "防空炮 V型"
 antiair5_desc: "地空导弹将是未来防空战斗的走向。设计地空导弹的机动平台是我们的下一步任务。"
 antitank1: "穿甲炮升级"
 antitank1_desc: "高效穿甲武器的重要性在一战中确立。引入新一代穿甲武器应对新型坦克是必要的。"
 antitank2: "穿甲炮 II型"
 antitank2_desc: "目前为止大多数穿甲炮属于轻型。为了对抗拥有倾斜装甲且以往更重型的坦克和陆行舰便需要更大型的穿甲炮。"
 antitank3: "改良穿甲炮升级 I"
 antitank3_desc: "使用空心装药的破甲弹（HEAT）可被用于穿甲炮以弥补不足的炮口初速。"
 antitank4: "改良穿甲炮升级 II"
 antitank4_desc: "使用脱壳穿甲弹（APDS）的新型多用途穿甲炮可以穿透几乎所有战车的装甲。"
 antitank5: "穿甲炮 V型"
 antitank5_desc: "结合多种新型弹药技术及高初速火炮，我军已准备好应对敌方新开发的任何装甲单位。"
 arts1: "法术炮升级"
 arts1_desc: "运用法术聚能线圈，提高法术产生效率。"
 arts2: "法术炮 II型"
 arts2_desc: ""
 arts3: "改良法术炮升级 I"
 arts3_desc: "通过对法术炮的改进，增加法术炮的功率，提高能量输出。"
 arts4: "改良法术升级 II"
 arts4_desc: "对法术炮用于聚能的的球面法术发生器进行升级，加强杀伤力和穿透力。"
 arts5: "法术炮 V型"
 arts5_desc: ""
 artillery_improvement_1: "火炮升级 I"
 artillery_improvement_2: "火炮升级 II"
 artillery_improvement_3: "火炮升级 III"
 artillery_improvement_4: "火炮升级 IV"
 antitank_improvement_1: "穿甲炮升级 I"
 antitank_improvement_2: "穿甲炮升级 II"
 antitank_improvement_3: "穿甲炮升级 III"
 antitank_improvement_4: "穿甲炮升级 IV"
 rocket_artillery_improvement_1: "火箭炮升级 I"
 rocket_artillery_improvement_2: "火箭炮升级 II"
 rocket_artillery_improvement_3: "火箭炮升级 III"
 rocket_artillery_improvement_4: "火箭炮升级 IV"
 antiair_improvement_1: "防空炮升级 I"
 antiair_improvement_2: "防空炮升级 II"
 antiair_improvement_3: "防空炮升级 III"
 antiair_improvement_4: "防空炮升级 IV"

 mountain_gun: "山地火炮"
 mountain_gun_desc: "为适应印度北部的山地而设计的一种可以拆解放到驴背上移动到需要的地方的火炮。"

#工程学
 punched_card_computer: "穿孔式计算机"
 punched_card_computer_desc: "通过打孔器给卡片进行打孔，以此来将代码转录入卡片并交给计算机运行。"
 vacuum_tube_computer: "真空管计算机"
 vacuum_tube_computer_desc: "采用真空的电子管作为基础元件制造的计算机，系统十分原始，但至少可以执行简单的程序。"
 crystal_electronic_unit: "晶体电子单元"
 crystal_electronic_unit_desc: "也被称为晶体管，随着源石科技的发展，这种元件成为了计算机等各类电子设备中不可缺少的东西。"
 transistor_computer: "晶体管计算机"
 transistor_computer_desc: "采用晶体管等半导体器件，运用高级语言编程。由于采用晶体管代替电子管，所以很轻，且运算速度比较快。"
 integrated_circuit_computer_1: "集成电路计算机 I"
 integrated_circuit_computer_1_desc: "经过集成电路的发展，计算机的体积得到了缩小，并且性能也进一步提高，可靠性更高。"
 integrated_circuit_computer_2: "集成电路计算机 II"
 integrated_circuit_computer_2_desc: "在更大规模的集成电路研发出来后，计算机的算力增强。"
 integrated_circuit_computer_3: "集成电路计算机 III"
 integrated_circuit_computer_3_desc: "在电路得到进一步的集成后，计算机变得更加便携，算力也强于以往。"
 integrated_circuit_computer_4: "集成电路计算机 IV"
 integrated_circuit_computer_4_desc: "在电路得到进一步的集成后，计算机变得更加便携，算力也强于以往。"
 weak_ai: "弱人工智能"
 weak_ai_desc: "经过一段时间的研发，我们得到了能够表现出智能行为的人工智能，虽然他们并不能自主地推理和解决问题。"
 strong_ai: "强人工智能"
 strong_ai_desc: "经过我们的努力，我们终于能够制造出能够独立思考并解决问题的人工智能，他们将在人身边的各个领域发挥作用。"

 basic_smart_robotarm: "基础机械臂"
 basic_smart_robotarm_desc: "在工厂里配备这些简单的机械臂可以增加生产线的产出效率。"
 improved_smart_robotarm: "改进机械臂"
 improved_smart_robotarm_desc: "进一步改进的机械臂，生产效率更高。"
 advanced_smart_robotarm: "先进机械臂"
 advanced_smart_robotarm_desc: "进一步改进的机械臂，生产效率更高，更稳定。"
 bionic_limbs: "仿生义肢"
 bionic_limbs_desc: "结合了生物科技和机械臂技术研发而成，从此在战场上失去四肢的士兵们能够再次战斗，一部分以前无法征召的残障人士也能走上前线。"

 radio: "无线电"
 radio_desc: "应用业余无线电爱好者的发明并扩大FM无线电的使用可以减少干扰并让无线电技术拓展新用途。"
 radio_detection: "无线电侦测"
 radio_detection_desc: "雷达，或者“无线电侦测及定距”手段，将利用无线电波侦测物体。此研究高度机密化，设想一下这些发明将能对定位部队带来何等的影响。"
 pulse_doppler_radar: "脉冲多普勒雷达"
 pulse_doppler_radar_desc: "脉冲多普勒雷达，是一种利用多普勒效应来探测运动目标的位置和相对运动速度的雷达。"
 monopulse_radar: "单脉冲雷达"
 monopulse_radar_desc: "单脉冲雷达可测出目标的高低角和方位角，从各波束接收的信号之和，可测出目标的距离，从而实现对目标的测量和跟踪。"
 over_the_horizon_radar: "超视距雷达"
 over_the_horizon_radar_desc: "超视距雷达不受地球曲率的限制，天波传播可以用于在洲际距离上超越地平线，使雷达系统能够发现非常远的目标，通常长达数千公里。"
 passive_phased_array_radar: "无源相控阵雷达"
 passive_phased_array_radar_desc: "相控阵雷达通过相位控制电子对阵列雷达进行扫描，利用大量的个别控制的小型的天线进行单元排列，形成不同的相位波束，相比其他的雷达是具有强大生命力和灵活性。"
 active_phased_array_radar: "有源相控阵雷达"
 active_phased_array_radar_desc: "相控阵雷达通过相位控制电子对阵列雷达进行扫描，利用大量的个别控制的小型的天线进行单元排列，形成不同的相位波束，相比其他的雷达是具有强大生命力和灵活性。"
 anti_jamming_radar: "抗干扰雷达"
 anti_jamming_radar_desc: "通过雷达频段向微波波段扩展以及雷达工作频率的跳变等措施来增强雷达的抗干扰能力。"

 basic_fire_control_system: "初级火控系统"
 basic_fire_control_system_desc: "舰船上的全部火炮都将由中控系统控制，从而确保更加密集的炮火群以及更高的精准度。"
 improved_fire_control_system: "改进型火控系统"
 improved_fire_control_system_desc: "通过输入目标的航行速度以及距离，一台计算器可以准确地预测下一次火力齐射就绪时目标的准确位置。"
 advanced_fire_control_system: "先进火控系统"
 advanced_fire_control_system_desc: "先进的计算机可以跟踪多个目标，并加入周边天气状况与海况等变量，以进行极其精准的弹道计算。"

 basic_encryption: "加密 - 多表置换密码"
 basic_encryption_desc: "通讯的新手段必带来新的遭拦截风险。加密机将用作高速复杂的加密。"
 improved_encryption: "加密 - 循环置换"
 improved_encryption_desc: "加密机在随机化上的限制将被用于破译密码。提高加密机的随机性后，这类破译手段将更难得手。"
 advanced_encryption: "加密 - 脉冲编码调制"
 advanced_encryption_desc: "科研进步及经验积累让我方通讯时有了更多保障数据流流量安全的手段。"
 basic_decryption: "解密 - 频率分析"
 basic_decryption_desc: "密码解密学变得更具有高等数学性质。"
 improved_decryption: "解密 - 旁路攻击"
 improved_decryption_desc: "更复杂的计算机将带来新的密码分析学应用手段，例如和最新破译手段结合，用以破解新式暗号的差分攻击。"
 advanced_decryption: "解密 - 自动推演"
 advanced_decryption_desc: "逐步改良并推动我国密码分析学发展至此的计算机计算能力恐将于未来创造几乎无懈可击的加密法。若要预防，我方必须作好准备积极获取与这项科技相关的机密信息。"

 experimental_rockets: "实验火箭"
 experimental_rockets_desc: "靠提高液体燃料火箭可靠性与航程来推动火箭学科研进步，我方已掌握足够知识用以建设可供更先进型号火箭使用的发射基地。"

 rocket_engines: "火箭引擎"
 rocket_engines_desc: "我们积攒的火箭推进技术知识已足以制造拥有无可比拟速度的飞弹与喷气式飞行器。"
 improved_rocket_engines: "改良火箭引擎"
 improved_rocket_engines_desc: "第一批长程弹道导弹已被制造并拥有前所未有的精确度。敌方城市，乃至太空都不再遥不可及。"
 advanced_rocket_engines: "先进火箭引擎"
 advanced_rocket_engines_desc: "火箭学的未来发展开启了新可能性，例如射程愈发遥不可及，杀伤力愈发无法估量的洲际导弹。"

 atomic_research: "源石核理论研究"
 atomic_research_desc: "核裂变中，源石原子分裂将释放大量能量并具有不可估量的毁灭性。"
 nukes: "源石裂变炸弹"
 nukes_desc: "旨在制造源石裂变炸弹（又被称为核弹）的工程项目是一国能进行的最艰巨而最隐秘的任务之一。但一旦成功，便可能改变战争进程乃至未来世界走向。"

 rocket_interceptor: "火箭动力截击机"
 rocket_interceptor_desc: "参考了滑翔机设计的喷气式截击机能在短时间内以超越任何其他飞行器的速度飞行。虽然冒着急剧燃料消耗的风险，其起飞拦截之迅捷将出乎任何敌机意料。"
 rocket_interceptor_2: "火箭动力截击机 II型"
 rocket_interceptor_2_desc: "虽然仍被认为操作风险巨大，喷气式战机现已由自动驾驶辅助并由其他飞机牵引以在燃料有限的限制下将极速优势发挥至极致。"
 rocket_interceptor_3: "火箭动力截击机 III型"
 rocket_interceptor_3_desc: "崭新的降落技术及更安全的燃料系统大幅提高喷气式截击机成功执行任务及生还的几率，并将这些尖端载具从前还停留在理论上的潜力发挥了出来。"

