 rubber_processing_1: "有机材料加工 I"
 rubber_processing_1_desc: "我们对天然橡胶的依赖需要通过合成橡胶的工业加工来减少。"
 rubber_processing_2: "有机材料加工 II"
 rubber_processing_2_desc: "通过新工艺加速脱氢反应，可以大规模生产合成橡胶。"
 rubber_processing_3: "有机材料加工 III"
 rubber_processing_3_desc: "通过应用具有改进工艺的通用合成橡胶配方如十二烷基硫醇聚合改性剂将使我们能够扩大合成橡胶生产。"
 advanced_rubber_processing_1: "先进有机材料加工 I"
 advanced_rubber_processing_1_desc: "转向更优化的聚合工艺将带来更低的成本和更高的产量。"
 advanced_rubber_processing_2: "先进有机材料加工 II"
