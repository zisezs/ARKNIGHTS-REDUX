#生产科技描述补全
 flexible_line_2_desc: "模块化的工装夹具让产线得以快速重构，在不大幅停工的前提下完成产品切换。"
 flexible_line_3_desc: "经过专门训练的多面手工人与可互换部件相结合，使产线在转产后几乎立刻恢复满负荷运转。"
 flexible_line_4_desc: "高度柔性化的制造体系能根据前线需求随时转产，效率损失被压缩到极低水平。"
 streamlined_line_2_desc: "统一零部件规格并优化工位排布，能够在保证质量的同时进一步加快生产节拍。"
 streamlined_line_3_desc: "专用工装与连续作业的产线设计把各道工序紧密咬合，制造效率再上新台阶。"
 streamlined_line_4_desc: "极致标准化的全自动产线几乎不需要人工干预，即可源源不断地输出精良装备。"
 numerical_control_machine_tools_desc: "以指令自动控制刀具走位，机床便能精确而稳定地加工复杂部件，在减少误差的同时提升产能。"
 robot_arm_assembly_line_desc: "机械臂不知疲倦也不会出错，最适合承担流水线上的重复劳动，把人力解放到更关键的岗位。"
 advanced_agglomerative_industrial_chain_3_desc: "成熟的工业集群把上下游企业与配套设施整合为一体，规模效应在每个环节持续累积。"
 advanced_agglomerative_industrial_chain_4_desc: "超级工业带将全国产能汇聚于一处，其磅礴的产出足以支撑任何规模的战争。"
 advanced_decentralized_industrial_chain_3_desc: "分布式生产网络把制造环节拆解到无数节点上，单个节点受损几乎不影响整体供应。"
 advanced_decentralized_industrial_chain_4_desc: "彻底分散、隐蔽且彼此冗余的工业体系令敌人无从打击，我方战时生产将永不中断。"