l_simp_chinese:
 reu_egg.1.t: "时间，原来在前进？！"
 reu_egg.1.d: "苏维埃宫的办公室里，塔露拉作为苏维埃社会主义共和国联盟的领袖处理完最后一份公文，倍感疲累，于是便伏在桌上沉沉睡去。\n\n再睁眼时，熟悉的宁静消失了，取而代之的是远处稀稀拉拉的枪声和风卷过破窗的呼啸。塔露拉环顾四周，早就重刷过的墙壁现在一点没刷，保留着帝国时代的模样，窗外的玻璃大部分碎了，墙角还堆着一些弓弩箭矢的冷兵器——难道是枪械这些热兵器不好用吗？！\n\n还要，塔露拉不禁吐槽，这里哪里还有半分苏维埃宫规整肃穆的样子？分明是才被攻占不久的废墟。\n\n她错愕着，但没等她惊讶完，门就被猛地推开。她抬头一看，进来的士兵居然还是旧游击队的军装，臂章还是早年整合运动最原始的黑底白纹款——蒙面那套款式她记得早就被改组后的红军制服替换了十几年了。\n\n士兵敬了个不甚标准的礼，朗声说：「……塔露拉女士，九和雷德干事叫您现在去新的整合运动司令部那里。」\n\n塔露拉彻底懵了。女士？整合运动？干事？这些称呼进历史档案的年份她都记不清了，如今党内大家都称同志，地方都称书记或者干部了，军队里更有明确的党员职级，怎么会突然冒出这些旧社会和游击队时期的旧称呼？\n\n于是她站起身，当即吩咐：「先别管这个，去叫阿丽娜同志过来。」\n\n士兵愣住了，脸涨红了，过了片刻才支支吾吾地反问：「额……塔露拉女士，阿……阿丽娜？那是谁啊？咱们队伍里没听过这个名字。」\n\n「那康拉德·克内希同志呢？」塔露拉眉头再一皱眉。\n\n士兵更茫然了，摇着头表示更是从没听过。\n\n「叶莲娜参谋长？博卓卡斯替元帅？」她试探性地把语速快了几分。\n\n士兵的眼神彻底变了，塔露拉感觉他应该是在看一个说胡话的人，却不敢完全失礼，憋了半天才小声说：「霜星大姐和爱国者将军……不是早就牺牲在切尔诺伯格了吗？塔露拉女士您……您怎么了？」\n\n「荒唐！」塔露拉猛地拍了下桌子，心头不免涌出一股荒诞感，「今年是哪一年啊？」\n\n「今、今年是泰拉1101年啊。」士兵被吓得一缩脖子。\n\n1101年？\n\n塔露拉脑子转得飞快。1101年，那个时候明明是东达利亚苏维埃共和国厉兵秣马、准备打乌萨斯帝国的时期，她那时根本还没进圣骏堡吧！\n\n「那去把你们政委叫来。」她深吸一口气，最后一次试图理清状况。\n\n「政……政委？」士兵彻底懵了，「那是什么官啊？咱们整合运动里没有这个职位啊。」\n\n塔露拉终于意识到事情远比她想的更严重离谱。她于是不再多问，抓起手边的长剑便往门外走——她倒要看看，这个世界的之前到底发生了啥？"
 reu_egg.1.a: "不是，我特么穿越了？"
