# ---- 领袖（create_country_leader 当场生成，20 股共用一名）----
 SHZ_leader:0 "山海众魁首"
 SHZ_leader_desc:0 "没有人知道这个名字是谁先叫出来的。每司那股人都有自己的坛口、自己的暗号、自己那面旗，只有一件事是一样的：他们都在等同一个东西醒过来。"

# ---- 事件 ----
 yan_shz.1.t:0 "肃廊宣政司：乱民踞仓"
 yan_shz.1.d:0 "「肃廊宣政司急报，乱民踞仓。」\n\n奏报写得一如既往地干净：某日某时，乱党若干，烧了某某仓，杀了几名看守，随后退入山中。数目是估的，名字是猜的，只有火是真的。\n\n仓墙上留着新刷的字，八个：「山海八荒，尽归其主」。刷字的人笔画歪斜，但一笔一笔，写得很认真。"
 yan_shz.1.a:0 "责令宣政使，限期清剿"
 yan_shz.1.b:0 "调禁军南下，雷霆扫穴"

 yan_shz.2.t:0 "万原宣政司：妖言惑众"
 yan_shz.2.d:0 "「万原宣政司急报，妖言惑众。」\n\n先是镇上的香火旺得不正常，接着是夜里有人在庙后墙写字，再接着，官仓的封条被人从里头撕开了。差役赶到时，只抓到两个不肯跑的——他们说，祂的眼睛已经睁开了。\n\n口供录了三页，三页里没有一句提到粮价、税赋、冤屈。审案的人后来写道：这几个人不像要造反的，像是终于等到什么的人。"
 yan_shz.2.a:0 "责令宣政使，限期清剿"
 yan_shz.2.b:0 "调禁军南下，雷霆扫穴"

 yan_shz.3.t:0 "桓江宣政司：驿道断了"
 yan_shz.3.d:0 "「桓江宣政司急报，驿道断了。」\n\n驿马没到。第二天也没到。第三天，信使的尸首在三十里外的沟里被找到——文书一张不少，匣子上的封蜡都没动过。\n\n钦天监的人来看过现场，只说了一句：这是荒漠里的老手，只杀替朝廷跑腿的人，不碰行商。"
 yan_shz.3.a:0 "责令宣政使，限期清剿"
 yan_shz.3.b:0 "调禁军南下，雷霆扫穴"

 yan_shz.4.t:0 "理塘宣政司：营啸"
 yan_shz.4.d:0 "「理塘宣政司急报，营啸。」\n\n二更天，营里有人喊了一声，接着整营的人都醒了。天亮时，营官的头挂在旗杆上，旗还是那面旗，只是底下站着的人换了。\n\n带头的把总据说只说了两句话。第一句是「饷银三个月没发」，第二句是「山海众管饭」。"
 yan_shz.4.a:0 "责令宣政使，限期清剿"
 yan_shz.4.b:0 "调禁军南下，雷霆扫穴"

