 yan_shz.20.t:0 "大炎急报：乱民起事"
 yan_shz.20.d:0 "「大炎急报，乱民起事。」\n\n奏报从三个宣政司同时送到，说的却是同一天的事：仓被烧了，庙里有人在写字，驿道上没了人。谁也说不清是哪一处先起的头。\n\n钦天监的老监正翻了一夜的旧档，天亮时只回了一句话：他们从来就没散过。近百年来，流寇、水匪、盗匪、亡命之徒，都往那面旗下躲过雨——「巨兽」两个字，成了遮掩这一切的阴影。"
 yan_shz.20.a:0 "责令宣政使，限期清剿"
 yan_shz.20.b:0 "调禁军南下，雷霆扫穴"

 yan_shz.22.t:0 "动员乡勇"
 yan_shz.22.d:0 "旨意下到京畿各乡：良家子愿执兵器者，编为一队，自佩弓刀，官给口粮。\n\n按例，玉门那一纸改制之后，武行就该一个个从行伍里退出去——退到镖局，退到铸剑坊，退到城根底下教拳。如今叛旗又竖起来了，朝廷才发现，肯立刻拿起刀的还是这批人。\n\n五营乡勇就在首都编成。甲械不齐，操演也生，但守乡里不肯退的那点气性，是营兵里已经找不着的东西。"
 yan_shz.22.a:0 "编练成军，就地驻防"
 YAN_shz_militia_tt:0 "首都编成 5 支四步「乡勇」——自带五成甲械、未经战阵；编制锁死，不能改模板，也不能补成别的兵种"

 yan_shz.21.t:0 "大炎腹地：山海众大起事"
 yan_shz.21.d:0 "本月，大炎十九宣政司里已有地方挂出别色旗，旗上八个字：山海八荒，尽归其主。\n\n乱民不攻大城、不据关隘，只烧仓、断道、杀信使，逼得朝廷的文书在自家境内绕路走。司岁台在奏报里只写了一句话：这不是匪患，是信仰。\n\n京师没有下罪己诏——朝廷甚至没有承认这是一场叛乱。所有发往各州的文书里，它都只是「匪患」。"
 yan_shz.21.a:0 "天下震动"
