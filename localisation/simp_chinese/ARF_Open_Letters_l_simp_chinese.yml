 open_letter.1.t: "塔露拉致特蕾西娅的公开信"
 open_letter.1.d: "致卡兹戴尔巴别塔政府议长、萨卡兹魔王特蕾西娅同志：\n首先，我仍愿称你一声同志——因为我们都曾向腐朽的旧秩序宣战，都曾为被压迫者的解放而战。但正因为我们同处革命的阵营，路线的分歧才更不能含糊，更不能用“各有国情”的托词掩盖原则的界限。\n我听闻你和巴别塔先前强调“萨卡兹族群的解放”，将族群的存续视作第一要义。可历史与阶级的真理告诉我们：一切族群压迫的本质，都是阶级压迫。旧卡兹戴尔的王公贵族奴役萨卡兹农奴，维多利亚的工厂主把萨卡兹工人当作消耗品，莱塔尼亚的封建主将萨卡兹人视作蛮族——他们针对的从来不是“萨卡兹”这个族群本身，而是最底层、最无力反抗的无产者。当你把族群矛盾凌驾于阶级矛盾之上，当你允许旧贵族、旧商人以“萨卡兹同胞”的身份继续占有生产资料、居于统治地位，你就是在模糊剥削的根源，就是在向资产阶级妥协。这样的“解放”，不过是换了一面旗帜，换了一批统治者，底层的萨卡兹工农，依旧在被剥削。\n源石首先是生产资料，是这个世界资本用以榨取剩余价值的核心工具。在乌萨斯，我们已经将源石产业收归国有，将源石技术普及给每一个工人、每一个农庄；我们的感染者首先是阶级兄弟，是劳动者，其次才是病人。而你们巴别塔呢？最顶尖的源石科研被少数精英学者垄断，最先进的医疗资源集中在巴别塔本部，荒原上的普通萨卡兹民众依旧要靠赤脚医生与土方子对抗矿石病。你们的治疗恐怕还保留着精英主义的温情脉脉。\n七年前，你与军事委员会妥协并允许他们发动新的帝国主义战争从而换来了短暂的和平；内战结束后你又与旧势力搞出了和解，可革命是决裂的艺术。你以为靠建设、靠医治、靠慈悲和温柔就能换来敌人的尊重吗？军事委员会在你治下发展了二百年不也最终威胁到了你的统治吗？从我的经验来看，我只知道乌萨斯帝国的贵族、维多利亚的资产阶级，他们不会因为你的善意就放下屠刀。乌萨斯的经验已经证明：只有无产阶级的铁拳，实现彻底的革命，才能真正砸碎枷锁。奉行更大的姑息与调和，只会给革命留下复辟的隐患。\n我真诚地希望你能站到无产阶级国际主义的旗帜下来，放弃以萨卡兹族群利益为先的狭隘路线，放弃对剥削阶级的妥协。否则，我们今日的笔墨之争，他日或许会成为道路的分野。\n苏维埃社会主义共和国联盟中央委员会主席\n工农红军总司令"
 open_letter.1.a: "署名塔露拉·雅特利亚斯"
 open_letter.2.t: "特蕾西娅致塔露拉的公开信"
 open_letter.2.d: "致苏维埃社会主义共和国联盟中央委员会主席、工农红军总司令塔露拉同志：\n感谢你的来信。我尊重乌萨斯人民在冻土上走出的革命道路，也尊重你和红军为乌萨斯劳动者赢得的一切。但我也请你尊重萨卡兹用数百年血泪走出来的生存之道。\n如果一切族群压迫本质都只能用阶级压迫去解释的话，那么你见过从降生之日起整体就被歧视和追杀，连姓名都不配留在世上的民族吗？他们又算什么？在维多利亚的集中营里，贵族和患有源石病工人甚至都会一起向萨卡兹奴工扔石块；在旧乌萨斯的矿坑里，乌萨斯的监工和村民都会骂我们怪物；在莱塔尼亚的各大城邦外，哪怕是最贫穷的卡普里尼农夫，也会朝萨卡兹流浪者吐口水。我看见，在阶级的沟壑之上的是族群的高墙；纵观萨卡兹的历史，受到剥削的苦难大部分时间都小于面临灭族的危机。如果只谈阶级解放却不谈文明存续，就是对萨卡兹百年苦难的彻底无视。\n你说我向旧阶层妥协，但时至今日，古卡兹戴尔城的遗迹里还堆满了同族相残的尸骨。要彻底清算王庭旧贵族很容易，驱逐反对者也很容易，我下一道命令就够了。可然后呢？立刻消灭了萨卡兹几乎所有的精英，最后留下更深的仇恨，留下更加分裂的卡兹戴尔，继续让我们的民族在流血与内耗里沉沦？我选择革命的目的从来不是为了报复谁，而是让所有人都能活下去——当然，也秉持着你说的国际主义精神，让其他人也能活下去。\n你说巴别塔垄断科学，可你真的了解矿石病吗？它不是普通的职业病，是刻在萨卡兹种族血脉里的诅咒，是整个泰拉借以此来憎恨我们的理由。我必须要正名，巴别塔的研究，从不只是为了治病。我们是要实现更进一步的证明源石不是灾祸，萨卡兹也从来不是魔族佬和怪物；我们是要让每一个生下来就带着源石结晶的孩子，都能堂堂正正地走在阳光下。现在，我们的医士走遍每一片荒原免费救治，我们的工坊给每一个流浪者工作，我们的学校给每一个萨卡兹孩子上课，这都是他们本该拥有的最基本的生存权利。\n你信仰革命的不断向前。我尚且信仰人心还有温度。乌萨斯的冻土适合你们红军驰骋，可今天的卡兹戴尔更需要的是建立一个新世界。一味的暴力能打碎一个旧世界，可最终恢复不起一个充满温度的新世界。如果革命的终点是萨卡兹还有更多泰拉种族人民的死亡、更多的仇恨、更多的分裂，那这样的革命，和我们推翻的旧秩序，又有什么两样？\n巴别塔永远欢迎真正的同志，永远愿意和所有反抗压迫的力量并肩作战。但萨卡兹人的解放，只能由萨卡兹人自己决定；卡兹戴尔的道路，只能由卡兹戴尔人民自己选择。\n卡兹戴尔巴别塔政府巴别塔议长\n萨卡兹魔王"
 open_letter.2.a: "署名：特蕾西娅"
 open_letter.3.t: "卡兹戴尔人民军北部军区急报"
 open_letter.3.d: "卡兹戴尔人民军军事委员会、巴别塔议院、巴别塔外交部、罗德岛部钧鉴：\n今凌晨四时，苏方东达利亚方面军忽以火炮向我边境城市实施轰击，彻夜炮声不绝，我部驻地附近居民损失奇重。同时，苏方复以步坦协同之态势，向我人民军巡逻队防地发起进攻。我方始终以镇静克制之态度应对，暂未听取炮兵副司令维什戴尔建议而加以还击一炮，冀望以隐忍保全两国和平。\n然至今日八时许，苏方对我军全境发动大规模进攻，更以集中其装甲集团军，大举越过国界，铁蹄踏我疆土。我等为维护主权、保卫萨卡兹民族存续，断不能再予容忍。时至今日，乌卡两国之和平确已完全绝望，当复行卫国战争之旧事。牺牲已到最后关头，御侮救亡，义无反顾。\n兹郑重声明：乌卡两国之友谊既为苏方主动破毁，国际社会主义革命之前途将更为苏修暴行而灰暗，而我辈祖先惨淡经营之国土，又复为苏修帝国主义之铁骑所践踏。我北部军区已严令所部全线据险抵抗，更望中央明告全国——卡兹戴尔不得不以英勇自卫之决心，于二百余年后复展开此神圣庄严之卫国战争。"
 open_letter.3.a: "卡兹戴尔人民军北部军区司令员 哀珐尼尔"
