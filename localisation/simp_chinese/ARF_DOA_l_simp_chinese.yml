#政党名称
 DOA_conservatism_party: "奥特亚罗瓦殖民顾问团"
 DOA_authoritarianism_party: "维多利亚殖民当局"

#人物
 DOA_Elena_Portelli: "埃琳娜·波特利"
 DOA_Elena_Portelli_desc: "埃琳娜·波特利刚到马利亚克特时，奥特亚罗瓦还是一个不起眼的殖民地，这里能够维持稳定的原因仅仅是因为太穷，殖民者和原住民根本没东西可以争。对她来说，唯一的慰藉就是她的老同学，凯瑟琳·巴恩斯，在这里统领着一支小小的殖民军队。对奥特亚罗瓦来说，幸运的是，新任总督埃琳娜没有就此放弃，她与凯瑟琳达成共识，在过去二十多年中将这里建设成了一个不怎么富裕，但是社会稳定的殖民领，并且将殖民政府从简单的委任政府改组为一个接纳了殖民者和本地精英的顾问团。奥特亚罗瓦的人们相信着埃琳娜，认为在这位已经白发苍苍的老妇人治下，至少他们的日子还能过下去。"
 DOA_Katherine_Barnes: "凯瑟琳·巴恩斯"
 DOA_Katherine_Barnes_desc: ""

#国家精神
 southern_haven: "南方的避风港"
 southern_haven_desc: "老总督在伦蒂尼姆金融潮中因为股票暴跌选择自我了断后，新走马上任的总督埃琳娜·波特利和当地殖民军总司令凯瑟琳·巴恩斯不约而同地意识到，奥特亚罗瓦要靠自己活下去了。作为高中和大学同学，埃琳娜和凯瑟琳互相知根知底，两人一拍即合，很快为奥特亚罗瓦确定下了未来的出路：避风港。相比于貌合神离的雷姆必拓和深陷泥潭的美拉尼西亚，稳定便是奥特亚罗瓦最大的优势。埃琳娜利用自己民族学专业的知识，很快为奥特亚罗瓦的民族融合和国族构建规划好了路线，在一代人的时间里，通过鼓励文化融合和对原住民的优惠措施，将殖民者和原住民统一在一个新的奥特亚罗瓦旗帜下。凯瑟琳则利用自己有限的人脉，将奥特亚罗瓦打造成了一个没强大到能够扩张领土，但也能够保全自己的殖民领。她们成功了，奥特亚罗瓦成为了维多利亚在南陆最稳定的桥头堡和避风港。不过麻烦也接踵而至：随着这里的人民越来越认同“奥特亚罗瓦”而非“维多利亚”，那么她的未来还和维多利亚有关系吗？"