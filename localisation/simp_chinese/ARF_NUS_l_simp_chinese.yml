l_simp_chinese:
#政党名称
 NUS_despotism_party: "夏笺特拉王朝"

#人物
 NUS_Paramisova: "帕拉弥索瓦"
 NUS_Paramisova_desc: "在1041年，高卢的殖民军向努珊西亚发起了又一场战争，那场战争将旧都珊湖拉变成了一片火海，帕拉弥索瓦便是在那个时候逃出来的。他的父亲和哥哥都在战斗中不知所踪，被迫加冕为努珊西亚王的他强忍悲痛和愤怒，与高卢签订了和谈条约。随后，他将都城迁至距离吕宋边境更远的南方城市伊格，并启动了努珊西亚的现代化改革。努珊西亚的民族意识开始觉醒，民众开始逐渐从战争的伤痛中恢复过来，而珊湖拉也从废墟中重生。当时间走过了五十年，从青年步入老年的国王依然坚持着一个习惯，自从他将都城迁至伊格，他每有机会就会登上王宫的露台，望着东方的方向。那里是努珊西亚百年来被列强割下的肢体所在，他在死前一定要看到努珊西亚的耻辱被洗刷殆尽。"
 NUS_saviour_of_death: "危命之救主"

#国家精神
 NUS_Disobedient_chiefdoms: "不服从的酋邦"
 NUS_Disobedient_chiefdoms_desc: "努珊西亚并不是一个中央集权的王国，国王仅仅控制着几片王室领地，而其他的地区只是在名义上服从王室的领导。但这样的情况在帕拉弥索瓦的改革后发生了改变，由中央派出的官员开始对地方进行管理，这当然引起了当地部族首领的不满。虽然南方的首领在外敌面前与国王达成了一致，但更深处的内陆，这种不满正在升级。"
 NUS_Road_to_Nusansia_modernity: "努珊西亚的现代化之路"
 NUS_Road_to_Nusansia_modernity_desc: "即使是放在比较落后的东陆南洋地区，努珊西亚的发展水平也是最低的。她的位置距离东方的工业革命中心过于偏远，而历史上又屡次遭受外敌的入侵，多重因素导致努珊西亚在新世纪的大门前，依然是一个采用纯手工生产模式的农业国。王国上下都意识到了这一点，然而即使做好了变革的心理准备，变革之路注定坎坷。"