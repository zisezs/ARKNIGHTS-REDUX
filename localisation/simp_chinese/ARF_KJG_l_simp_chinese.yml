 #事件
 kjg.1.t: "三个现代化"
 kjg.1.d: "希瓦艾什家族家主与喀兰贸易总裁兼董事长——充满争议的改革家恩希欧迪斯·希瓦艾什于近日公布了他的“三个现代化”计划，宣布将于未来完成谢拉格的工业、科教与治理体系现代化。"
 kjg.1.a: "愿他能够成功？"
 kjg.2.t: "现代化计划的成果"
 kjg.2.d: "看起来恩希欧迪斯的现代化计划真的做出了不少成果。一座座工厂拔地而起，一条条铁路与公路贯通谷地。虽其也在事实上造成了环境污染与社会脱节问题，但益处依然堪称显著。"
 kjg.2.a: "听上去不错。"
 kjg.3.t: "雪山事变"
 kjg.3.d: "在雪山大典上，三大家族的矛盾已经变得彻底不可调和！双方发生了诸多或大或小的冲突，但还是尽可能地保持了克制。那么，最终的局面倒向了哪一方呢？"
 kjg.3.a: "改革派！"
 kjg.3.b: "保守派！"
 kjg.4.t: "改革派胜利"
 kjg.4.d: "圣猎已然落幕，现在改革派已经事实上通过政变控制了国家，而恩希欧迪斯也将对他的政治路线做出决断。"
 kjg.4.a: "集中权力于恩希欧迪斯一人。"
 kjg.4.b: "设立临时政府，准备大选。"
 kjg.4.c: "还政于圣女。"
 kjg.5.t: "保守派胜利"
 kjg.5.d: "看起来恩希欧迪斯最终还是棋差一着，未能撼动制度根基。那么，现在保守派们是应当将权力真正交予圣女还是仅仅将圣女视作一个名义元首呢？"
 kjg.5.a: "圣女万岁！"
 kjg.5.b: "三族议会万岁！"
 kjg.6.t: "雪境的未来"
 kjg.6.d: "无论在雪山事变中胜出的是改革派还是保守派，谢拉格继续因循守旧，闭关锁国的日子都已经结束了。为应对即将来到的风暴，我们必须自强不息。"
 kjg.6.a: "为了谢拉格！"

 worldnews_kjg.1.t: "[Get_newspaper_header]谢拉格的共和主义政变"
 worldnews_kjg.1.d: "今日早些时候，谢拉格新政府对外发布了一则重磅新闻，并宣称“谢拉格已经进入了新的时代”。据悉，谢拉格三大家族之一的希瓦艾什家族于1097年雪山大典之际发动了一场政变，并将三大家族的行政权力尽数独揽于恩希欧迪斯一人。\n\n在解散了该国的传统中央权力机构三族议会后，恩希欧迪斯·希瓦艾什宣布新生的谢拉格共和国全国进入紧急状态，并开始大举逮捕反对派与异见者。许多民主国家对谢拉格新政府表示谴责，但哥伦比亚竟出人意料地态度模棱两可。\n\n毫无疑问，谢拉格已然被绑定在了加速变革的道路上。从希瓦艾什家族以往在其领地创造的高速经济增长来看，由该家族领袖领导的新政府也许能为共和国带来一段不短的繁荣时期。但这之后会发生什么就很耐人寻味了。"
 worldnews_kjg.1.a: "团结于旗帜之下！"
 worldnews_kjg.1.b: "永恒的银色黎明。"
 worldnews_kjg.2.t: "[Get_newspaper_header]谢拉格宣布民主化改革"
 worldnews_kjg.2.d: "今日早些时候，谢拉格代理总统恩希欧迪斯·希瓦艾什向外界发表了谢拉格新国体的确立。随着近期谢拉格雪山大典中发生的政变，以及喀兰地区古老权力机构三族议会遭到解散，恩希欧迪斯掌握了这个山中小国的绝对权力。可他并未像部分观察家的预测般成为谢拉格的独裁者，而是召开制宪会议，开启了将谢拉格民主化的进程。\n\n如今，由代理总统及谢拉格各党派人士组成的看守政府统治着这个新近建立的共和国。新政府赦免了一系列在过去因异议被捕的政治犯，并宣布在局势稳定后便会立即举行大选。从谢拉格的民意状况来看，若大选顺利举行，恩希欧迪斯显然将于选举中获胜并正式就任总统。"
 worldnews_kjg.2.a: "雪境人民终自由。"
 worldnews_kjg.2.b: "真是不可思议。"
 worldnews_kjg.3.t: "[Get_newspaper_header]谢拉格的变革"
 worldnews_kjg.3.d: "今日早些时候，谢拉格政府向外宣布了1097年三族会议的圆满成束。在作为蔓珠院代表的圣女见证下，长久以来矛盾重重的三大家族在这场会议中最终久违地达成和解。三族中希瓦艾什家族代表恩希欧迪斯·希瓦艾什宣布将在不久后同佩尔罗契与布朗陶家族联合施行一系列大刀阔斧的政治改革，包括重组三族议会、建立真正统一的行政体系等等。\n\n维多利亚诸公爵对此发表了不同看法，开斯特公爵方面对谢拉格的改革表示达了赞誉，而其余公爵的发言人则为谢拉格三族之间能够和谐共处而感庆幸。\n\n毫无疑问，谢拉格走向开放的道路已经明朗。也许改革派主导的新政府真的能够让谢拉格变成一个在国际舞台上占据一席之地的现代国家，以全新的面貌为泰拉大地所知。"
 worldnews_kjg.3.a: "愿团结永存！"
 worldnews_kjg.3.b: "一块只属于昨日与明日的土地。"
 worldnews_kjg.4.t: "[Get_newspaper_header]谢拉格雪山大典上的乱局"
 worldnews_kjg.4.d: "长久以来，人们对谢拉格的印象仅有皑皑雪山与严重的技术落后。可在如今，关于1097年雪山大典的报道却使人们开始关心起这个小国的内部冲突。这场雪山大典不同于谢拉格人过往印象中的按部就班，而是充斥着火药味。\n\n先是谢拉格三大家族冲突的总爆发——保守派的佩尔罗契家族要求接管希瓦艾什家族所控领地，后是对宗教机构蔓珠院领导者大长老的未遂刺杀企图。似乎一切都在向着崩溃边缘狂飙猛进，但雪山大典最终还是以一场极其尴尬的三族会议作为收尾。\n\n冲突不断的三大家族似乎在最终达成了些许妥协，共同推举谢拉格国教耶拉冈德教的名誉宗教领袖圣女为国家元首。谢拉格的内部冲突或将就此消融？抑或者说，这不过是又一场新权力斗争的起点？"
 worldnews_kjg.4.a: "至少我们避免了一场内战……"
 worldnews_kjg.4.b: "这对他们来说或许是件好事。"
 worldnews_kjg.5.t: "[Get_newspaper_header]谢拉格的未遂政变"
 worldnews_kjg.5.d: "少有新闻的雪山小国谢拉格出了件大事，该国三大家族之一的希瓦艾什家族于雪山大典之际试图发动政变。该家族领袖恩希欧迪斯·希瓦艾什似乎已近于成功，可他在最后关头却因所掌控军事力量的极端差距功亏一篑，这场被称作“雪山事变”的政治斗争最终以谢拉格国内为阿克托斯·佩尔罗契为代表的保守派胜利告终。\n\n阿克托斯为该国宗教领导机构蔓珠院领导者大长老之死表达了哀悼，同时也不留情地批评希瓦艾什家族改革政策带来的“恶果”。对希瓦艾什家族领地的接收工作正在顺利进行，关于该家族领袖兼任总裁的垄断性国有企业喀兰贸易之处理也被纳入日程。谢拉格人的革新之梦就此破碎，而希瓦艾什家族作为政治斗争的失败者也显然不会好过。"
 worldnews_kjg.5.a: "滚出去！可恶的维多利亚帝国主义者。"
 worldnews_kjg.5.b: "看起来雪境不会有多大变化。"

 #工业企业
 KJG_Karlan_Trade_industrial_concern: "喀兰贸易"
 KJG_Karlan_Trade_industrial_concern_desc: "喀兰贸易成立之前，谢拉格是石器时代。恩希欧迪斯还没归国的时候，谢拉格一半以上的人口每天衣不蔽体，而主要的充饥手段就是吃草根树皮，或者用木渣混合泥土吞进腹中增加饱腹感。每天都有人在饥寒交迫中离去，即使如此每个人还会被严密地监控，每个人都忍受着极端的恐怖。大量的难民不顾一切地逃向，然而迎接他们的是机关铳的子弹。保守派吹嘘的手工业生产能力几乎完全是虚假的，实际情况是谢拉格大量工坊使用的甚至是耶拉冈德时期的工具，消费品生产能力几乎等于没有。日常的生活用品必须排长队且用高价才能买到。文化界更是一片荒芜，数以万计的画家音乐家作家科学家遭受宗教迫害，而普通的谢拉格人更是连基本的受教育权都没有。在旧谢拉格，超过一半的人口都有被监禁和关押的经历，谢拉格人无时无刻不处在痛苦的煎熬中。"

