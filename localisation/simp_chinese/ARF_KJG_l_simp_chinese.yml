 #民族精神
 KJG_Stagnation_State_4: "停滞之地"
 KJG_Stagnation_State_4_desc: "如果要形容谢拉格在过去千百年中所经历的一切，用“停滞”一词即可表述。雪境拥有悠久的过去，可她的漫长历史中似乎极少有革新。三大家族与蔓珠院所组成的封建神权制政府久期统治着国家，旧秩序似乎将延续万年。\n\n但在1065年，奥拉维尔·希瓦艾什于维多利亚学成归国，开启了延续至今的改革进程。这位来自三大家族中希瓦艾什的雄主希望通过仿照维多利亚在过去的发展历程使谢拉格现代化，他于国内兴建了许多工厂学校。也尝试同外国接触，获取现代化进程中最急需的科学技术。虽然他已离开人世十年有余年，但其子恩希欧迪斯仍在延续现代化的进程。在两代人的奋斗之下，如今的谢拉格已然拥有蹒跚起步的工业与微弱的科研能力，也许雪境的现代化将不再是梦。"
 KJG_Stagnation_State_3: "缓步前行"
 KJG_Stagnation_State_3_desc: ""
 KJG_Stagnation_State_2: "昂扬向前"
 KJG_Stagnation_State_2_desc: ""
 KJG_Stagnation_State_1: "敢于梦想"
 KJG_Stagnation_State_1_desc: ""
 KJG_Cut_off_from_the_world: "与世隔绝"
 KJG_Cut_off_from_the_world_desc: "自第一批先民在雪山神的引导下建立文明，谢拉格便是片孤立于世的土地。耶拉冈德的庇护使谢拉格人能够远离天灾与动荡，但也导致了严重的固步自封。数千年封闭致使雪境的一切尽落后于外界，从科技、思想到国防力量，谢拉格在如今这个属于强权们的时代显得如此弱小。\n\n在数十年之前，希瓦艾什家族的前领导人奥拉维尔便意识到了这点，终身投入雪境的开放与现代化之路。尽管他的事业最终在那场事故中休止，但今日的希瓦艾什家族领袖恩希欧迪斯继承了父亲的梦想，继续引领谢拉格走向开放。也许终有一日，谢拉格将能够彻底摆脱过往的封闭落后。抑或属于改革者的大梦终醒，雪境的一切又将回到1065之前。"
 KJG_Karlan_Trade: "喀兰贸易的影响"
 KJG_Karlan_Trade_desc: "1090年，谢拉格三大家族中拥护改革的希瓦艾什家族新家主恩希欧迪斯创立了喀兰贸易这一重要的国有贸易企业。依靠希瓦艾什家族在过去建设的工商业为基，这个新兴的国有企业很快便扩张到了堪称垄断的惊人地位。\n\n喀兰贸易的影响力正逐渐渗透整个谢拉格。其虽作为贸易公司，可却事实上同时涉足了教育、工业、农业、科技、建设等等与国家发展息息相关的领域。毫无疑问，在近几年的惊人扩展中，喀兰贸易已经成为了谢拉格经济支柱。而其总裁兼董事长恩希欧迪斯所带领的改革派势力也借此不断扩展，这或将撼动雪境的稳定现状。"
 KJG_Kjeragandr: "耶拉冈德信仰"
 KJG_Kjeragandr_desc: "若谈起谢拉格的古代历史，雪山神耶拉冈德绝对是个无法被绕开的话题。不为夸张地说，谢拉格的历史叙述完全无法离开耶拉冈德。谢拉格人的祖先为躲避可怖的天灾逃上了严酷的雪山，于这艰难环境中顽强求生。善良慈悲的雪山之神耶拉冈德于先民们最为危险的时刻伸出援手，祂为我们的祖先创造了无比宜居的环境，释放风雪冰冻天灾，于神山纪元为人们打造了一个无比的生息环境。\n\n在这一切之后，祂陷入漫长休眠之中，并将本应属于人的权力重新交还于人。祂所选定的三个部族掌控世俗权力，但人们的精神世界仍由蔓珠院长老与僧侣主宰，直至今日。对耶拉冈德的信仰无疑是谢拉格身份认同的重要一环，对祂的崇拜亦可凝聚人心。但相对的，一但这信仰消失，雪境将面临一场§R精神层面的浩劫§!。"
 KJG_Tri_Clan_Council: "三族议会"
 KJG_Tri_Clan_Council_desc: "于神话中的神山时代之末，雪山之神耶拉冈德在祂陷入沉眠前召集了最为勇敢且赤诚的三个部族，将统治雪境的世俗权力交予他们。这三个部族的名字分别是佩尔罗契、希瓦艾什与布朗陶，即如今谢拉格的三大家族。\n\n毫无疑问，三大家族拥有凌驾于国家整体之上的强大自主权，所辖领地不亚于独立王国。而为确保三大家族之间能够顺利沟通协商，三族议会应运而生。作为谢拉格世俗事务的总领者，三族议会与蔓珠院共享权力，统治着雪境。可这一机构虽名为“议会”，却并未有常设机关与对其权力的严谨规定，不过是贵族领袖之间的一种原始协商机制。\n\n很显然，三族议会并无能力统合雪境的政治力量，整个国家因此处于严重的政治分裂之中。若想让谢拉格的政治制度真正走向现代，无疑需要一场对三族议会的全面改革。"
 KJG_Military_decentralized: "过时的部族军队"
 KJG_Military_decentralized_desc: "一个悲观的事实是，谢拉格根本上没有，且从未有过真正意义上的正规军。自神山时代以来，三族都以自己的力量培养训练属于本家族的私兵，相互之间仅在应对叛乱、进行围猎抑或其他军事行动时才能够短暂拥有统一指挥。\n\n虽然在奥拉维尔·希瓦艾什的改革中，谢拉格拥有了一支名义上效忠于国家的“新军”，甚至还获得了数量有限的空中部队，但军事分裂这一事实从未改变。这种分散化军事体系虽能使三大家族更加灵活地调动武装力量组织防卫，但也无疑是军事改革的严重阻碍。"
