 # ==========================================================================
 # 卡西米尔 (KZM) · 复国骑士团 —— 顾问与将领文案
 # 真源：common/characters/KZM_restoration.txt、common/characters/KZM.txt（罗素/莫布的 advisor 块）、
 #       common/unit_leader/KZM_restoration_general_traits.txt、
 #       common/country_leader/KZM_restoration_advisor_traits.txt
 # 特质数值由引擎自动列出，_desc 里不重复写百分比
 # ==========================================================================

 # ---------------------------- 将领头衔（unit_leader 库） ----------------------------
 KZM_trait_radiant_knight:0 "耀阳颔首"
 KZM_trait_radiant_knight_desc:0 "第二十四届卡西米尔骑士特别锦标赛的冠军，卡西米尔历史上第一个非感染者出身的耀骑士——直到她的身份被公开之前，人们一直以为她是感染者。\n\n她点头的时候，太阳像是跟着一起落在那面旗上。看台上的人这才想起来，骑士本来是可以让人心安的。"
 KZM_trait_drillmaster:0 "银枪遗范"
 KZM_trait_drillmaster_desc:0 "临光家的姑妈，曾经是卡西米尔最有名的竞技骑士。她把两个侄女从摔倒练到不会摔倒，也把一整套银枪天马的老规矩拆成了新手能听懂的话。\n\n她训人从不喊口号，只把对手的位置指给你看。"
 KZM_trait_last_keshig:0 "最后的怯薛"
 KZM_trait_last_keshig_desc:0 "草原上的规矩：主子没有死尽，护卫就不算解散。逐魇骑士把这条规矩从北方一路带进了卡西米尔，然后在天马王室倒台之后，发现自己成了唯一还守着它的人。\n\n他不效忠政府，也不效忠资本。他效忠的是那个已经没有人记得的约定。"
 KZM_trait_unbroken_shield:0 "不碎之盾"
 KZM_trait_unbroken_shield_desc:0 "她还太年轻，荣誉却来得比谁都实在。她学会的第一件事不是出剑，而是站在别人前面把剑横下来。\n\n四十六面盾牌都回来了——她不肯让第四十七面留在那儿。"
 KZM_trait_red_pine_blaze:0 "红松燎原"
 KZM_trait_red_pine_blaze_desc:0 "红松骑士团是卡西米尔第一支感染者骑士团，队长是个说话比冲阵还快的人。她打谁都像在点火，烧到自己也不停。\n\n她说过：既然规则不给我们位置，那我们就把规则烧出一个位置。"
 KZM_trait_ashlock_stone:0 "灰毫磐石"
 KZM_trait_ashlock_stone_desc:0 "红松骑士团里最安静的那一个。别人往前冲的时候，她负责让身后的人还能站着。\n\n她把阵地守得像一份账：进出多少，一目了然。"
 KZM_trait_fartooth_longshot:0 "远牙破的"
 KZM_trait_fartooth_longshot_desc:0 "独立骑士，封号在选拔阶段就拿到了，比她的年纪更让人意外。她习惯在所有人的视野之外做事——看台上看不到她，胜负却先在她那一枪上定了。"
 KZM_trait_wildmane_ride:0 "野鬃裂阵"
 KZM_trait_wildmane_ride_desc:0 "红松骑士团里跑得最快的一个。她不懂什么叫保持队形，只懂一件事：既然已经出发了，那就不要停下来。\n\n补给线最恨她，敌军的战线更恨她。"
 KZM_trait_fourth_rank_knight:0 "四级骑士"
 KZM_trait_fourth_rank_knight_desc:0 "最早作为奴隶被贩卖到卡西米尔，手臂上打过码。她从竞技场的最低一级一路爬到能被人记住的名字，靠的不是勇气，是每一次都能活着下场。\n\n「四级骑士」在她这里不是封号，是一份履历。"
 KZM_trait_woods_arrow:0 "守林伏矢"
 KZM_trait_woods_arrow_desc:0 "家乡被毁掉之后，她走进了林子，从此认得每一条能躲开哨卡的路。她不参加正面，她负责让正面的人少一半。\n\n山里人管这叫打猎，军队里管这叫麻烦。"
 KZM_trait_blood_oath:0 "血誓骑士"
 KZM_trait_blood_oath_desc:0 "第一个靠锦标赛为感染者挣出权益的骑士。他每赢一场，卡西米尔就有一道条文不得不改；他每流一次血，就有人多活一年。\n\n他不演讲。他上场。"

 # ---------------------------- 顾问头衔（country_leader 库） ----------------------------
 KZM_adv_radiant_call:0 "耀骑士的号召"
 KZM_adv_radiant_call_desc:0 "她不要官职，也不需要头衔。她站在哪儿，哪儿就是队伍的头。"
 KZM_adv_whislash_chief:0 "教官席"
 KZM_adv_whislash_chief_desc:0 "她把遣散的老兵重新按班排好，第一件事不是发枪，是教他们怎么在失去指挥官之后继续前进。"
 KZM_adv_grand_master:0 "大宗师"
 KZM_adv_grand_master_desc:0 "监正会里资历最深的那面旗。她迟迟不肯表态，一旦表了态，整个征战骑士阶层就一起转了方向。"
 KZM_adv_azure_gold:0 "青金大位"
 KZM_adv_azure_gold_desc:0 "无胄盟的段位制里，青金之上只有白金。他轻浮、残忍、极有城府，并且清楚地知道：杀骑士这门生意，得有一个更好的买家。"
 KZM_adv_sweep_squad:0 "清扫小队"
 KZM_adv_sweep_squad_desc:0 "她带的那支队伍把与无胄盟有关的董事会成员清了个干净。如今她把同一套流程反过来用——先清名单，再清人。"
 KZM_adv_candle_theory:0 "烛照散华"
 KZM_adv_candle_theory_desc:0 "她把烛骑士那套源石技艺拆成了参谋能用的东西：照明、遮蔽、诱敌、撤退，全都被算进了时间表。"
 KZM_adv_proviso:0 "正当程序"
 KZM_adv_proviso_desc:0 "前长缰律所的律师。她能在现行条文里替起义找到合法依据——这比找到武器更难，也更值钱。"
 KZM_adv_carol_treasure:0 "骑士宝藏"
 KZM_adv_carol_treasure_desc:0 "滴水村村长，替一整个家族守着埋藏清单的人。她知道哪座陵墓里有金银，更知道哪条山路运得动。"
 KZM_adv_mob_voice:0 "解说员的另一副嗓子"
 KZM_adv_mob_voice_desc:0 "他在特锦赛的麦克风前喊了半辈子，如今把同一副嗓子用来喊别的东西。一百七十二家媒体都欠他一次转播。"
 KZM_adv_zoroff_blueprint:0 "第二共和国的蓝图"
 KZM_adv_zoroff_blueprint_desc:0 "他见过一个国家怎样从废墟里被重新设计出来，也见过设计稿被谁撕掉。这一次他不再等人邀请。"

 # ---------------------------- 角色 ----------------------------
 KZM_Margaret_Nearl:0 "玛嘉烈·临光"
 KZM_Margaret_Nearl_desc:0 "耀骑士。第二十四届特锦赛的冠军，也是第一个让卡西米尔人重新想起「骑士」两个字该怎么写的人。\n\n她说过：如果所有人的目光已经从荣耀上移开，那就去他们最关注的地方，告诉所有人——骑士仍在。后来她又补了一句：所谓骑士，即是照亮整片大地的崇高者。\n\n叔叔说她天真。她承认，但她说天真不是不看清苦难，而是看清之后仍然发起冲锋。"
 KZM_Maria_Nearl:0 "玛莉娅·临光"
 KZM_Maria_Nearl_desc:0 "瑕光，临光家的小侄女。她入行时只有一句话：就想成为光，就想驱散苦暗。\n\n她赢过一场不该赢的比赛，也输过一场不该输的。她把输的那场记了三年，因为那一场的对手教会她：闭上眼就睁不开了。"
 KZM_Whislash:0 "鞭刃"
 KZM_Whislash_desc:0 "临光与瑕光的姑妈，曾经卡西米尔最有名的竞技骑士。她退役之后没有离开赛场，只是换了一个位置——从被看着的人，变成看着别人的人。\n\n她训话很短：看清苦难再发起冲锋，才是真正的骑士必须具备的素养。"
 KZM_Flametail:0 "焰尾"
 KZM_Flametail_desc:0 "红松骑士团队长，真名索娜。四支感染者骑士里最不安分的那一个，说话比冲阵还快，冲阵比说话还快。\n\n红松骑士团在卡瓦莱利亚基制造过全城大停电，试图再现当年的「四城大隔断」。她不后悔，只是说：既然浪涛吵闹，那就去令大海平静。"
 KZM_Ashlock:0 "灰毫"
 KZM_Ashlock_desc:0 "真名格蕾纳蒂·卡利斯卡，红松骑士团里最安静的人。她把守阵地当成记账——进出多少，一目了然。\n\n她赢过「锈铜骑士」，把那位以狂野进攻闻名的选手送进了医院，然后在采访里只说了一句：他冲得太早了。"
 KZM_Fartooth:0 "远牙"
 KZM_Fartooth_desc:0 "真名查丝汀娜，独立骑士，封号「远牙骑士」，在第二十四届特锦赛的选拔阶段就拿到了称号。红松骑士团里唯一习惯站在所有人视野之外的那一个。\n\n她的道理很简单：看台上看不到我，可胜负在我那一枪上就已经定了。"
 KZM_WildMane:0 "野鬃"
 KZM_WildMane_desc:0 "真名艾沃娜·克鲁科夫斯卡，红松骑士团里跑得最快的一个。她不懂保持队形，只懂既然出发了就别停下来。\n\n补给兵站的人最恨她，因为她每次回来都要带走双份。"
 KZM_Gravel:0 "砾"
 KZM_Gravel_desc:0 "最早作为奴隶被贩卖到卡西米尔，手臂上打过码。她从竞技骑士的最低一级一路爬到「四级骑士」这个被人记住的位置，靠的不是勇气，是每一次都能活着下场。\n\n她喜欢恶作剧，也喜欢认真做事的人。她只说过一次实话：我想看看，一个不把人标价的国家长什么样。"
 KZM_Meteor:0 "流星"
 KZM_Meteor_desc:0 "前卡西米尔守林人。家乡被毁掉之后她走进了林子，从此认得每一条能躲开哨卡的路。\n\n山里人管这叫打猎，军队里管这叫麻烦。她两者都不反驳，只是把箭头磨得更准。"
 KZM_Blood_Knight:0 "血骑士"
 KZM_Blood_Knight_desc:0 "狄开俄波利斯，感染者骑士里第一个靠锦标赛打出名堂的人。他每赢一场，卡西米尔就有一道条文不得不改；他每流一次血，就有人多活一年。\n\n他不演讲。他上场。"
 KZM_Tola:0 "逐魇骑士拓拉"
 KZM_Tola_desc:0 "「最后的怯薛」。草原规矩里，主子没有死尽，护卫就不算解散——天马王室倒台几十年之后，他还在守这条约定。\n\n有人问他效忠哪个党，他说他不效忠任何在长桌上签字的东西。他效忠的是那个已经没有人记得的约定。"
 KZM_Roy:0 "罗伊"
 KZM_Roy_desc:0 "无胄盟青金大位。轻浮、残忍，且极有城府——他在任上带出了清扫小队，也带出了一整套「让骑士消失得合乎程序」的做法。\n\n他清楚这门生意最赚钱的地方不是杀骑士，是卖「骑士会死」这个可能性。"
 KZM_Monique:0 "莫妮克"
 KZM_Monique_desc:0 "无胄盟第三小队的领导者。她那一队把与组织有关的全部董事会成员清了个干净，用的都是同一份流程表。\n\n如今她把那份流程表翻了过来。"
 KZM_Proviso:0 "但书"
 KZM_Proviso_desc:0 "真名黛丝特，原长缰律所律师。她能在现行条文里替一件不该被允许的事找到合法依据——这比找到武器更难，也更值钱。\n\n她的口头禅是：先别谈理想，先把条款念完。"
 KZM_Carol:0 "可萝尔"
 KZM_Carol_desc:0 "现任滴水村村长，掌握着卡西米尔骑士遗产宝藏的秘密。村子小，没有移动城市经过，因此既管不着也顾不上。\n\n她替一整个家族守着埋藏清单，也顺便替一批活人守着行踪。她的规矩只有两条：进门前把剑留下，吃饭时不问名字。"
 KZM_Viviana_Droste:0 "薇薇安娜·德罗斯特"
 KZM_Viviana_Droste_desc:0 "烛骑士。散华骑士团的成员大多模仿她，用蜡烛释放烛火源石技艺——他们学到的是姿态，她留下的是算法。\n\n她把「光」拆成了可计算的东西：什么时候该亮、亮多久、灭了以后往哪儿退。"

 # ---------------------------- 国策招募提示 ----------------------------
 KZM_the_long_night_recruit_tt:0 "§Y玛嘉烈·临光§!（耀骑士）入池：可任二把手，并作为元帅统军。"
 KZM_silver_lance_veterans_recruit_tt:0 "§Y鞭刃§!入池：可任陆军部长，并作为元帅统军。"
 KZM_not_one_shield_left_recruit_tt:0 "§Y玛莉娅·临光§!（瑕光）入池：军长。"
 KZM_hundred_li_campfires_recruit_tt:0 "§Y但书§!入池：可任政治顾问；§Y焰尾§!入池：军长。"
 KZM_let_them_all_stand_recruit_tt:0 "§Y血骑士§!入池：军长。§Y「大嘴」莫布§!的政治顾问位同时开放。"
 KZM_knightly_cellars_recruit_tt:0 "§Y砾§!入池：军长。"
 KZM_false_banners_recruit_tt:0 "§Y罗伊§!（无胄盟青金大位）入池：可任军事参谋。"
 KZM_pegasus_charge_manual_recruit_tt:0 "§Y薇薇安娜·德罗斯特§!（烛骑士）入池：可任军事理论家，并作为军长统军。"
 KZM_muster_in_the_woods_recruit_tt:0 "§Y莫妮克§!入池：可任军事参谋；§Y野鬃§!入池：军长。"
 KZM_tournament_circuit_recruit_tt:0 "§Y灰毫§!与§Y远牙§!入池：军长。"
 KZM_road_to_the_north_recruit_tt:0 "§Y可萝尔§!入池：可任政治顾问；§Y流星§!入池：军长。"
 KZM_polar_dawn_recruit_tt:0 "§Y逐魇骑士拓拉§!入池：元帅。"
 KZM_shadow_of_the_adeptus_recruit_tt:0 "§Y伊奥莱塔·罗素§!（大骑士长）的军事参谋位同时开放——她仍在池里，只是要等监正会倒向这边才肯进政府。"
 KZM_unspoken_fury_recruit_tt:0 "§Y克莱门德·佐洛夫§!的政治顾问位同时开放：第二共和国的蓝图，这一次他不再等人邀请。"
 KZM_Mob_desc:0 "第二十四届卡西米尔骑士特别锦标赛的解说员。他在麦克风前喊了半辈子，喊到观众以为他比骑士更懂这场比赛。\n\n商业联合会把他捧成明星，是因为需要一个人替他们把「比赛」两个字说得比「战争」更好听。他照做了，做得极好，好到没人去数他一年里改了几次口径。\n\n如今他把同一副嗓子用来喊别的东西。一百七十二家媒体都欠他一次转播，他现在来收账。"
