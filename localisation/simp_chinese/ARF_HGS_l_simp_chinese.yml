#国家精神
 corporate_state: "企业国家"
 corporate_state_desc: "南东国官方的体制不过是她的皮囊，这个国家真正的主人是那些有着炎国撑腰的富商巨贾们。通过炎国的军事存在和经济渗透，来自炎国的资本家将南东国变为了他们的游乐场。他们通过东国咨政院，协调利益分配，决定南东国未来的发展方向，然后将这一带有强制色彩的“建议“，报送给光元家，等待那个软弱的傀儡在炎国军官的注视下签下他的名字，然后炎国资本的欲望便将化为裁决这片土地上千万人民生死的意志。"
 reconstruction_plan: "南东国重建计划"
 reconstruction_plan_desc: "在东国内战结束后，由炎国牵头，吸收了来自檀国和安南的象征性投资，设立了一个地区性的重建基金。这个计划对当时百废待兴的东国来说无疑是一个好消息，然而炎国的经济入侵也成为了事实。高楼重新在南东国的废墟上拔地而起，但每一座大厦的根系都由南方的庞大帝国供养。对于东国来说，唯一的好消息就是，炎国人搞建设的水平确实高。"
 HGS_military_advisory_group: "炎国武备咨访团"
 HGS_military_advisory_group_desc: "东国内战中，南方军队的训练和战术都远远落后于具有军事传统的北军，因而在战后，如何提高东国军队战斗力便成为了炎国和光元家的共识。由炎国兵部直属的一支顾问团驻扎在元京，抛开他们监视光元家、保护炎国利益的实际目的不谈，这支军事顾问团对南东国军队的现代化发挥了关键作用。"