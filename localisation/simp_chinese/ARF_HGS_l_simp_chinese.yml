#人物
 HGS_Kougen_Takaharu: "光元尊治"
 HGS_Kougen_Takaharu_desc: "尊治有一颗成为枭雄的心，但命运似乎并不眷爱他这一方。东国在他的统治下击败了不可一世的乌萨斯帝国，然而他帐下一对兄妹武将的矛盾，最终又将这个脆弱的国家再次撕碎。尊治和他的臣属击溃了来势汹汹的北军，然而代价是另一个帝国的触手将国家牢牢束缚。尊治将一切都看在眼里，但他无力阻止这次的浪潮。毕竟，破山中敌易，破金中敌难。"
 
