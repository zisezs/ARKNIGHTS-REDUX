#国家领袖
 U1A_Svetlana_Ulyanova: "斯韦特兰纳·乌里扬诺娃·卜捷里娜"

#党派名称
 U1A_despotism_party: "第一集团军总参谋部"

#民族精神
 Ursus_army_group_slave_economy: "奴役经济"
 Ursus_army_group_slave_economy_desc: "\n\n\n\n\n\n£GFX_Ursus_army_group_slave_economy_art£\n\n\n\n\n\n\n\n“选择权在你们手上，你们可以自由地选择累死在矿洞里还是在工厂里，成为感染者也行。”\n\n§R“不用害怕感染者，你们迟早会变成他们的。”§!"
 Ursus_army_group_permanent_martial_law: "永久军事管制区"
 Ursus_army_group_permanent_martial_law_desc: "\n\n\n\n\n\n£GFX_Ursus_army_group_permanent_martial_law_art£\n\n\n\n\n\n\n\n总司令就是这里的皇帝...我的意思是陛下不在的时候——无论如何，集团军辖区的一切政府机构、一切设施、一切聚居点都是为了战争服务，军营就该有军营的样子，别把这里当成一般的移动城市！"
 Ursus_army_group_scorched_means: "为战争不择手段"
 Ursus_army_group_scorched_means_desc: "\n\n\n\n\n\n£GFX_Ursus_army_group_scorched_means_art£\n\n\n\n\n\n\n\n平民的死活和我们有什么干系？我们只不过在履行圣骏堡的命令而已！\n\n听好了——贵族、平民、工厂主......你们都是陛下的奴仆，必须为陛下和国家献出一切，懂了吗！"
 Ursus_army_group_scorched_means_offsite_tt: "地图外军用工厂：§G+5§!"
 Ursus_army_group_st_hulst_surveillance: "来自圣骏堡的监视"
 Ursus_army_group_st_hulst_surveillance_desc: "\n\n\n\n\n\n£GFX_Ursus_army_group_st_hulst_surveillance_art£\n\n\n\n\n\n\n\n你们是乌萨斯帝国的支柱与根基，但对陛下而言，你们是随时可能掀起新一轮大叛乱的帝国头号敌人...嗯，或者说是""皇帝头号敌人""。\n\n“皇帝的利刃”正在看着你！"

#人物介绍
 U1A_Svetlana_Ulyanova_desc: "一〇五七年生于卜捷里宁家族，父亲是乌里扬诺夫伯爵。两个儿子：长子阿纳托利·斯维特拉诺夫·卜捷里宁已是少将，次子雅罗米尔在第一集团军第十三机械化师第三十二连任上尉。\n\n一〇七五年毕业，二十二岁进入第一集团军服役，从基层军官做起，一路被提拔到中将。一〇八二年一月，还不是元帅的她与第四集团军总司令安德里安·库兹涅佐夫一同前往圣骏堡向陛下述职——那趟行程留下的丑闻，本已足够让她与总司令之位无缘。\n\n但机会总是留给有准备的人。一〇八四年五月，米哈伊尔公爵的政治丑闻与婚外情同时爆雷，国家杜马与参谋部施压，他最终引咎辞职并接受帝国办公室调查。一〇八六年，斯韦特兰纳凭借第一集团军内部庞大的人脉与最重要的军功被推上总司令之位；一〇八七年，她前往圣骏堡接受费奥多尔陛下册封。\n\n成为元帅之后，她小心地护着那个可怜的孩子阿纳托利。"

#领袖特质
 U1A_trait_silent_politician: "沉默的政治家"
 U1A_trait_silent_politician_desc: "「总司令还是一位政治家，这是能维持第 1 集团军中立的原因之一。」"
 U1A_trait_army_discipline: "第一集团军纪律"
 U1A_trait_army_discipline_desc: "营区里没有闲人：哨位、工事、队列，一切按操典。"
 U1A_trait_border_shield: "乌-卡边境之盾"
 U1A_trait_border_shield_desc: "乌萨斯与卡西米尔边境的每一段冻土，她都走过。"
 U1A_trait_hushed_mother_son: "嘘声母子问题"
 U1A_trait_hushed_mother_son_desc: "「第 1 集团军内部是不允许讨论阿纳托利是私生子的。」"
