 #民族精神
 ILR_crown_alone: "皇冠孤悬"
 ILR_crown_alone_desc: "三年以前，受人敬爱的老国王亚历山大一世不幸撒手人寰，可幼主彼特二世却尚未成年。风雨飘摇之中，帕夫莱亲王与他所组织的“临时摄政委员会”顺理成章地接过国政大权，并着手推动了一系列开明改革，试图以此复现奥布雷诺威切在先王治下的辉煌，可惜收效甚微。\n\n如今，无论是焦头烂额的帕夫莱亲王，还是困于深宫的彼特二世，甚至是蠢蠢欲动的军官集团，他们都意识到了一件事：变革之风正在吹向奥布雷诺威切，而抓住机遇者便可扶摇直上，成为这个国家乃至赫穆斯的新主人。"
 ILR_revival: "卧薪尝胆"
 ILR_revival_desc: "第二次赫穆斯战争落幕后，我们不幸惨败给了阿斯帕鲁克帝国。他们飞扬跋扈地来到希基迪纳姆，摧毁了我们所珍视的一切，再将耻辱与枷锁加诸于奥布雷诺威切的冠冕之上。依据和平协定，我们的南部领土被阿斯帕鲁克尽数吞并，部队规模与军备开支同样遭到严苛限制，国难就此降临。\n\n帕夫莱亲王坚信，奥布雷诺威切终将重新崛起、雪尽前耻。但在新一场战争降临赫穆斯之前，我们必须谨慎、谨慎、再谨慎，将獠牙与刀枪藏于暗处，决不能被虎视眈眈的敌人所察觉。\n\n现如今，我国的军备重整计划§Y稍有起色§!。"