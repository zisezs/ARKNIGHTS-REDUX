# ==============================================================================
# 索科洛夫（REU_Sokolov）—— 将领角色 / 原创将领特质 / 「柳德米拉特训」决议
#  特质定义：common/unit_leader/REU_traits.txt
#  决议定义：common/decisions/REU_Sokolov_Training_Decisions.txt
# ==============================================================================

#人物
 REU_Sokolov: "索科洛夫"
 REU_Sokolov_desc: "「弑君者」柳德米拉身边待得最久的那个人。从冻原上的游击队到情报局的走廊，他一直站在她身后半步的位置：话不多，记性好，肩上永远扛着那面挡过子弹的盾。"

#将领特质（初始）
 REU_guerrilla_pillar: "游击队支柱"
 REU_guerrilla_pillar_desc: "§L东达利亚冻原上活下来的老兵。缴获物一律归公，损耗压到最低。§!"
 REU_crownslayer_confidant: "弑君者的心腹"
 REU_crownslayer_confidant_desc: "§L柳德米拉亲手带出来的人。跟着她，他学会了把补给账算到最后一个人才摊开。§!"

#将领特质（柳德米拉特训·四课）
 REU_scout_adept: "侦察好手"
 REU_scout_adept_desc: "§L柳德米拉的第一课：先找到敌人，再决定打不打。§!"
 REU_silent_steps: "夜行无声"
 REU_silent_steps_desc: "§L柳德米拉的第二课：夜里行军，脚步声只留在自己耳朵里。§!"
 REU_intel_scent: "情报嗅觉"
 REU_intel_scent_desc: "§L柳德米拉的第三课：从一叠废纸和几句闲话里，读出敌人下一步的方向。§!"
 REU_dagger_and_shield: "匕首与盾"
 REU_dagger_and_shield_desc: "§L柳德米拉的第四课：盾护住身后的人，匕首留给前面的人。§!"

#决议——柳德米拉小姐对索科洛夫进行特训！
 REU_Sokolov_Training_Category: "柳德米拉小姐对索科洛夫进行特训！"
 REU_Sokolov_Training_Category_desc: "四节特训课，柳德米拉亲自带她带得最久的那个兵。每节课都要花政治点数，也得由索科洛夫自己扛下来。\n\n§Y索科洛夫在军中时，本页决议才会出现。§!"

 REU_sokolov_training_scout: "第一课·侦察好手"
 REU_sokolov_training_scout_desc: "地图摊在桌上，柳德米拉让他从脚印、炊烟和换防的时间差里，一个一个数出敌人现在在哪。\n\n§R启用条件：§!花费 §Y50§! 政治点数，且索科洛夫尚未掌握这一课。"
 REU_sokolov_training_scout_tt: "索科洛夫获得特质：§Y侦察好手§!（侦查 §G+20%§!，计划技能 §G+1§!）。"

 REU_sokolov_training_night: "第二课·夜行无声"
 REU_sokolov_training_night_desc: "入夜后带着队伍在废墟间走了一整夜。柳德米拉只提了一个要求：脚步声只留在自己耳朵里。\n\n§R启用条件：§!花费 §Y75§! 政治点数，且索科洛夫尚未掌握这一课。"
 REU_sokolov_training_night_tt: "索科洛夫获得特质：§Y夜行无声§!（陆战夜战攻击 §G+15%§!，损耗 §G-10%§!，防御技能 §G+1§!）。"

 REU_sokolov_training_intel: "第三课·情报嗅觉"
 REU_sokolov_training_intel_desc: "一叠报废的调令、几句多余的寒暄。柳德米拉让他把这些零碎拼成敌人的下一处落脚点。\n\n§R启用条件：§!花费 §Y100§! 政治点数，且索科洛夫尚未掌握这一课。"
 REU_sokolov_training_intel_tt: "索科洛夫获得特质：§Y情报嗅觉§!（计划加成上限 §G+15%§!，非战斗补给耗尽惩罚 §G-10%§!，计划技能 §G+1§!）。"

 REU_sokolov_training_blade: "第四课·匕首与盾"
 REU_sokolov_training_blade_desc: "最后一课在训练场上。盾护住身后的人，匕首留给前面的人——柳德米拉说，这两件事在他这里本来就是一回事。\n\n§R启用条件：§!花费 §Y125§! 政治点数，且索科洛夫尚未掌握这一课。"
 REU_sokolov_training_blade_tt: "索科洛夫获得特质：§Y匕首与盾§!（进攻 §G+10%§!，防御 §G+10%§!，攻击与防御技能各 §G+1§!）。"
