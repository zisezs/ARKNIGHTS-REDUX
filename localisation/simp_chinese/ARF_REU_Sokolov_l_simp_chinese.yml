# ==============================================================================
# 索科洛夫（REU_Sokolov）—— 将领角色 / 原创将领特质 / 「柳德米拉特训」决议
#  特质定义：common/unit_leader/REU_traits.txt
#  决议定义：common/decisions/REU_Sokolov_Training_Decisions.txt
# ==============================================================================

#人物
 REU_Sokolov: "索科洛夫"
 REU_Sokolov_desc: "「弑君者」柳德米拉身边待得最久的那个人。从冻原上的游击队到情报局的走廊，他一直站在她身后半步的位置：话不多，记性好，肩上永远扛着那面挡过子弹的盾。"

#将领特质（初始）
 REU_guerrilla_pillar: "游击队支柱"
 REU_guerrilla_pillar_desc: "§L东达利亚冻原上活下来的老兵。缴获物一律归公，损耗压到最低。§!"
 REU_crownslayer_confidant: "弑君者的心腹"
 REU_crownslayer_confidant_desc: "§L柳德米拉亲手带出来的人。跟着她，他学会了把补给账算到最后一个人才摊开。§!"

#将领特质（柳德米拉特训·四课「掌握」徽记 —— Lv1 开课时授予，各给一点离散技能点；
#  四课的百分比加成随等级成长，写在角色级动态修正符 REU_sokolov_training_dm 里）
 REU_scout_adept: "侦察好手"
 REU_scout_adept_desc: "§L柳德米拉的第一课。先找到敌人，再决定打不打——从脚印、炊烟与换防的时间差里，他学会了数出对手的位置。§!"
 REU_night_adept: "夜行无声"
 REU_night_adept_desc: "§L柳德米拉的第二课。夜里行军，脚步声只留在自己耳朵里。§!"
 REU_intel_adept: "情报嗅觉"
 REU_intel_adept_desc: "§L柳德米拉的第三课。从一叠废纸和几句闲话里，读出敌人下一步的方向。§!"
 REU_blade_adept: "匕首与盾"
 REU_blade_adept_desc: "§L柳德米拉的第四课。盾护住身后的人，匕首留给前面的人。§!"

#决议栏入口——打开 / 收起「索科洛夫的特训」加点面板
 REU_sokolov_training_open: "打开特训面板"
 REU_sokolov_training_open_desc: "柳德米拉把索科洛夫带到训练场上。§Y打开加点面板，逐级打磨四门课。§!\n\n每门课共 §Y10§! 级：主属性自 §G11%§! 起、每级 §G+1%§!，副属性自 §G5%§! 起、每级 §G±1%§!；升一级花政治点数，越往后面越贵。"
 REU_sokolov_training_close: "收起特训面板"
 REU_sokolov_training_close_desc: "先把面板收起来。进度不会丢，随时可以再打开接着练。"

#训练决议（与面板 ＋ 钮同一套核心，进度互通；费用见决议上的政治点数）
 REU_sokolov_train_scout: "特训 · 侦察好手"
 REU_sokolov_train_scout_desc: "§Y侦察好手§! 当前 Lv.[?REU_sok_scout_lv|0] / 10。\n训练一次：侦查 §G+1%§!、计划速度 §G+1%§!。"
 REU_sokolov_train_night: "特训 · 夜行无声"
 REU_sokolov_train_night_desc: "§Y夜行无声§! 当前 Lv.[?REU_sok_night_lv|0] / 10。\n训练一次：夜战攻击 §G+1%§!、损耗 §G-1%§!。"
 REU_sokolov_train_intel: "特训 · 情报嗅觉"
 REU_sokolov_train_intel_desc: "§Y情报嗅觉§! 当前 Lv.[?REU_sok_intel_lv|0] / 10。\n训练一次：计划上限 §G+1%§!、断补惩罚 §G-1%§!。"
 REU_sokolov_train_blade: "特训 · 匕首与盾"
 REU_sokolov_train_blade_desc: "§Y匕首与盾§! 当前 Lv.[?REU_sok_blade_lv|0] / 10。\n训练一次：进攻 §G+1%§!、防御 §G+1%§!。"

#结业徽记（四课全满时由核心效果自动授予）
 REU_sokolov_graduate: "特训 · 结业"
 REU_sokolov_graduate_desc: "§L四门课全部练到了满级。柳德米拉带过不少人，把每一课都磨到底的，只有他一个。§!"

#洗点决议（退款 = 累计已投入政治点数的 70%）
 REU_sokolov_respec_scout: "洗点 · 侦察好手"
 REU_sokolov_respec_scout_desc: "把「侦察好手」清零重练，退还已投入政治点数的 §G70%§!——地图上的那点本事，换种练法也行。"
 REU_sokolov_respec_night: "洗点 · 夜行无声"
 REU_sokolov_respec_night_desc: "把「夜行无声」清零重练，退还已投入政治点数的 §G70%§!。"
 REU_sokolov_respec_intel: "洗点 · 情报嗅觉"
 REU_sokolov_respec_intel_desc: "把「情报嗅觉」清零重练，退还已投入政治点数的 §G70%§!。"
 REU_sokolov_respec_blade: "洗点 · 匕首与盾"
 REU_sokolov_respec_blade_desc: "把「匕首与盾」清零重练，退还已投入政治点数的 §G70%§!。"
 REU_Sokolov_Training_Category: "将领特训"
 REU_Sokolov_Training_Category_desc: "柳德米拉把训练场向她的心腹们敞开。§Y花名册里任一名将领在军中时，本页决议才会出现。§!"

#受训对象切换（面板与训练决议都作用于「当前受训对象」）
 REU_sokolov_target_sokolov: "受训对象：索科洛夫"
 REU_sokolov_target_sokolov_desc: "把训练对象指回索科洛夫——柳德米拉身边待得最久的那个人。"
 REU_sokolov_target_yelena: "受训对象：叶莲娜「霜星」"
 REU_sokolov_target_yelena_desc: "让霜星也来领一份，把她的那份经验磨成能带兵的东西。"
 REU_sokolov_target_alina: "受训对象：阿丽娜"
 REU_sokolov_target_alina_desc: "把阿丽娜编进特训序列。"
 REU_sokolov_target_mudrock: "受训对象：泥岩「波希墨丝」"
 REU_sokolov_target_mudrock_desc: "连泥岩也来磨一遍——她大概会嫌无聊，但有用。"

#加点面板（独立浮动窗口）
 REU_sok_panel_title: "索科洛夫的特训"
 REU_sok_panel_pp: "政治点数 §Y[?political_power|0]§!"
 REU_sok_panel_footer: "§T每门 10 级：主属性每级 §G+1%§!（满 §G20%§!），副属性每级 §G±1%§!（满 §G14%§!）。点右侧 ＋ 花政治点数升级。§!"
 REU_sok_max_label: "§G已满级§!"
 REU_sok_scout_name: "侦察好手"
 REU_sok_night_name: "夜行无声"
 REU_sok_intel_name: "情报嗅觉"
 REU_sok_blade_name: "匕首与盾"

#专精分叉（Lv5 二选一；分支加成由分支特质承载）
 REU_sok_br_scout_a: "鹰眼"
 REU_sok_br_scout_a_desc: "§L先于对手看见战场：侦查再拔高一档。§!"
 REU_sokolov_branch_scout_a: "专精 · 鹰眼"
 REU_sokolov_branch_scout_a_desc: "§Y侦察好手§! 的专精方向：侦查再 §G+5%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_scout_b: "棋手"
 REU_sok_br_scout_b_desc: "§L把每一次协同都算在前面：计划成形得更快。§!"
 REU_sokolov_branch_scout_b: "专精 · 棋手"
 REU_sokolov_branch_scout_b_desc: "§Y侦察好手§! 的专精方向：计划速度再 §G+8%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_night_a: "夜枭"
 REU_sok_br_night_a_desc: "§L越是黑，越是他熟悉的时辰。§!"
 REU_sokolov_branch_night_a: "专精 · 夜枭"
 REU_sokolov_branch_night_a_desc: "§Y夜行无声§! 的专精方向：夜战攻击再 §G+5%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_night_b: "影卫"
 REU_sok_br_night_b_desc: "§L把队伍完整地带回来，本身就是一种胜利。§!"
 REU_sokolov_branch_night_b: "专精 · 影卫"
 REU_sokolov_branch_night_b_desc: "§Y夜行无声§! 的专精方向：损耗再 §G-5%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_intel_a: "耳目"
 REU_sok_br_intel_a_desc: "§L眼线铺得更开，计划的上限也更高。§!"
 REU_sokolov_branch_intel_a: "专精 · 耳目"
 REU_sokolov_branch_intel_a_desc: "§Y情报嗅觉§! 的专精方向：计划上限再 §G+5%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_intel_b: "参谋"
 REU_sok_br_intel_b_desc: "§L从碎片里拼出的判断，越来越快。§!"
 REU_sokolov_branch_intel_b: "专精 · 参谋"
 REU_sokolov_branch_intel_b_desc: "§Y情报嗅觉§! 的专精方向：计划速度再 §G+8%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_blade_a: "匕首"
 REU_sok_br_blade_a_desc: "§L留给前面那一下，磨得更利。§!"
 REU_sokolov_branch_blade_a: "专精 · 匕首"
 REU_sokolov_branch_blade_a_desc: "§Y匕首与盾§! 的专精方向：进攻再 §G+8%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"
 REU_sok_br_blade_b: "盾墙"
 REU_sok_br_blade_b_desc: "§L护住身后的人，站得更稳。§!"
 REU_sokolov_branch_blade_b: "专精 · 盾墙"
 REU_sokolov_branch_blade_b_desc: "§Y匕首与盾§! 的专精方向：防御再 §G+8%§!。\n§T二选一，选定后另一支不再可选（洗点可重选）。§!"

