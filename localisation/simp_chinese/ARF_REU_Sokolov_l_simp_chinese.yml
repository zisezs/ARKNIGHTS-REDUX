# ==============================================================================
# 索科洛夫（REU_Sokolov）—— 将领角色 / 原创将领特质 / 「柳德米拉特训」决议
#  特质定义：common/unit_leader/REU_traits.txt
#  决议定义：common/decisions/REU_Sokolov_Training_Decisions.txt
# ==============================================================================

#人物
 REU_Sokolov: "索科洛夫"
 REU_Sokolov_desc: "「弑君者」柳德米拉身边待得最久的那个人。从冻原上的游击队到情报局的走廊，他一直站在她身后半步的位置：话不多，记性好，肩上永远扛着那面挡过子弹的盾。"

#将领特质（初始）
 REU_guerrilla_pillar: "游击队支柱"
 REU_guerrilla_pillar_desc: "§L东达利亚冻原上活下来的老兵。缴获物一律归公，损耗压到最低。§!"
 REU_crownslayer_confidant: "弑君者的心腹"
 REU_crownslayer_confidant_desc: "§L柳德米拉亲手带出来的人。跟着她，他学会了把补给账算到最后一个人才摊开。§!"

#将领特质（柳德米拉特训·四课「掌握」徽记 —— Lv1 开课时授予，各给一点离散技能点；
#  四课的百分比加成随等级成长，写在角色级动态修正符 REU_sokolov_training_dm 里）
 REU_scout_adept: "侦察好手"
 REU_scout_adept_desc: "§L柳德米拉的第一课。先找到敌人，再决定打不打——从脚印、炊烟与换防的时间差里，他学会了数出对手的位置。§!"
 REU_night_adept: "夜行无声"
 REU_night_adept_desc: "§L柳德米拉的第二课。夜里行军，脚步声只留在自己耳朵里。§!"
 REU_intel_adept: "情报嗅觉"
 REU_intel_adept_desc: "§L柳德米拉的第三课。从一叠废纸和几句闲话里，读出敌人下一步的方向。§!"
 REU_blade_adept: "匕首与盾"
 REU_blade_adept_desc: "§L柳德米拉的第四课。盾护住身后的人，匕首留给前面的人。§!"

#决议栏入口——打开 / 收起「索科洛夫的特训」加点面板
 REU_sokolov_training_open: "打开特训面板"
 REU_sokolov_training_open_desc: "柳德米拉把索科洛夫带到训练场上。§Y打开加点面板，逐级打磨四门课。§!\n\n每门课共 §Y10§! 级：主属性自 §G11%§! 起、每级 §G+1%§!，副属性自 §G5%§! 起、每级 §G±1%§!；升一级花政治点数，越往后面越贵。"
 REU_sokolov_training_close: "收起特训面板"
 REU_sokolov_training_close_desc: "先把面板收起来。进度不会丢，随时可以再打开接着练。"

#训练决议（与面板 ＋ 钮同一套核心，进度互通；费用见决议上的政治点数）
 REU_sokolov_train_scout: "特训 · 侦察好手"
 REU_sokolov_train_scout_desc: "§Y侦察好手§! 当前 Lv.[?REU_sok_scout_lv|0] / 10。\n训练一次：侦查 §G+1%§!、计划速度 §G+1%§!。"
 REU_sokolov_train_night: "特训 · 夜行无声"
 REU_sokolov_train_night_desc: "§Y夜行无声§! 当前 Lv.[?REU_sok_night_lv|0] / 10。\n训练一次：夜战攻击 §G+1%§!、损耗 §G-1%§!。"
 REU_sokolov_train_intel: "特训 · 情报嗅觉"
 REU_sokolov_train_intel_desc: "§Y情报嗅觉§! 当前 Lv.[?REU_sok_intel_lv|0] / 10。\n训练一次：计划上限 §G+1%§!、断补惩罚 §G-1%§!。"
 REU_sokolov_train_blade: "特训 · 匕首与盾"
 REU_sokolov_train_blade_desc: "§Y匕首与盾§! 当前 Lv.[?REU_sok_blade_lv|0] / 10。\n训练一次：进攻 §G+1%§!、防御 §G+1%§!。"
 REU_Sokolov_Training_Category: "索科洛夫的特训"
 REU_Sokolov_Training_Category_desc: "柳德米拉亲自带她带得最久的那个兵。§Y索科洛夫在军中时，本页决议才会出现。§!"

#加点面板（独立浮动窗口）
 REU_sok_panel_title: "索科洛夫的特训"
 REU_sok_panel_pp: "政治点数 §Y[?political_power|0]§!"
 REU_sok_panel_footer: "§T每门 10 级：主属性每级 §G+1%§!（满 §G20%§!）、副属性每级 §G±1%§!（满 §G14%§!）。点击每行右侧的 ＋ 花政治点数升级。§!"
 REU_sok_max_label: "§G已满级§!"
 REU_sok_scout_name: "侦察好手"
 REU_sok_night_name: "夜行无声"
 REU_sok_intel_name: "情报嗅觉"
 REU_sok_blade_name: "匕首与盾"
