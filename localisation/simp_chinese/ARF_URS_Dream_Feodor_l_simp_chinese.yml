l_simp_chinese:
 # ==========================================================================
 # 乌萨斯帝国 ·「费奥多尔初步改革」小游戏 + 「乌萨斯之梦」叙事事件组
 # --------------------------------------------------------------------------
 # 本文件覆盖：
 #   · 决议分类 URS_dr_reform_decisions 的面板（scripted_gui 用）
 #   · 17 条改革决议
 #   · events/URS_dream.txt 的 12 组事件
 # 国策名 / 民族精神名 在 ARF_URS_Dream_l_simp_chinese.yml。
 #
 # 编码：UTF-8 带 BOM、LF 行尾（与同目录其它 yml 一致）。
 # ==========================================================================

 # ---------------- 面板（URS_dr_reform_window） ----------------
 URS_dr_reform_title_text:0 "费奥多尔的初步改革"
 URS_dr_reform_chips_text:0 "改革筹码：[?URS_rf_chips|0]　（50 政治点 = 1 筹码）"
 URS_dr_reform_hint_text:0 "四条改革线按各自的效率每周推进，效率越高推进越快；\n反对派会按固定节奏出手，拖慢进度并恶化效率。\n用筹码遏制他们、买通关系、或者直接把人换掉。"

 URS_dr_reform_row0_name_text:0 "国家"
 URS_dr_reform_row1_name_text:0 "军队"
 URS_dr_reform_row2_name_text:0 "群众"
 URS_dr_reform_row3_name_text:0 "资源"

 URS_dr_reform_row0_pct_text:0 "[URS_dr_reform_pct_state_loc]"
 URS_dr_reform_row1_pct_text:0 "[URS_dr_reform_pct_army_loc]"
 URS_dr_reform_row2_pct_text:0 "[URS_dr_reform_pct_people_loc]"
 URS_dr_reform_row3_pct_text:0 "[URS_dr_reform_pct_resource_loc]"

 URS_dr_reform_row0_pctnum:0 "[?URS_rf_p_state|0] / 100"
 URS_dr_reform_row1_pctnum:0 "[?URS_rf_p_army|0] / 100"
 URS_dr_reform_row2_pctnum:0 "[?URS_rf_p_people|0] / 100"
 URS_dr_reform_row3_pctnum:0 "[?URS_rf_p_resource|0] / 100"
 URS_dr_reform_done:0 "§G已完成§!"

 URS_dr_reform_row0_eff_text:0 "效率：[URS_dr_reform_eff_state_loc]（[?URS_rf_e_state|0]）"
 URS_dr_reform_row1_eff_text:0 "效率：[URS_dr_reform_eff_army_loc]（[?URS_rf_e_army|0]）"
 URS_dr_reform_row2_eff_text:0 "效率：[URS_dr_reform_eff_people_loc]（[?URS_rf_e_people|0]）"
 URS_dr_reform_row3_eff_text:0 "效率：[URS_dr_reform_eff_resource_loc]（[?URS_rf_e_resource|0]）"

 URS_dr_reform_eff_1:0 "§R差§!"
 URS_dr_reform_eff_2:0 "§Y均衡§!"
 URS_dr_reform_eff_3:0 "§G良好§!"
 URS_dr_reform_eff_4:0 "§G高效§!"

 # ---------------- 决议分类说明（分类 id + _desc） ----------------
 URS_dr_reform_decisions_desc:0 "费奥多尔拿出了那份被维特签上名字的病历。\n\n改革分国家、军队、群众、资源四块，每一块推进到 100 才算做完。进度自己会往前走，走得快不快取决于那一块当前的效率——差、均衡、良好、高效，每周分别是 §Y3 / 5 / 6 / 8§! 点。\n\n没有人打算让你顺顺当当地做完。旧贵族、军事贵族、领地主和资产官僚各有各的算盘，每隔一段时间就会出手一次：扣进度、恶化效率。你可以用§Y改革筹码§!去遏制他们、改善自己的效率，或者干脆换掉一批人。\n\n筹码只有一个来源：政治点数，§Y50 点换 1 点§!。"

 # ---------------- 变量 / 效果 tooltip ----------------
 URS_rf_chips_tt:0 "改革筹码"
 URS_rf_p_state_tt:0 "国家改革进度"
 URS_rf_e_state_tt:0 "国家改革效率"
 URS_rf_e_army_tt:0 "军队改革效率"
 URS_rf_e_people_tt:0 "群众改革效率"
 URS_rf_e_resource_tt:0 "资源改革效率"
 URS_rf_opp_delay_tt:0 "该反对派本轮行动后的蛰伏时间 +4 周（一次性）"
 URS_rf_opp_perm_tt:0 "该反对派往后每一轮的蛰伏时间永久 +4 周"

 # ---------------- 决议 ----------------
 URS_rf_exchange:0 "政治点数兑换筹码"
 URS_rf_exchange_desc:0 "改革要钱，要人，更要人肯听话。\n\n帝国什么都缺，唯独不缺想从中分一杯羹的人——只要你付得起价钱。"

 URS_rf_contain_noble:0 "遏制旧贵族"
 URS_rf_contain_noble_desc:0 "给他们体面、给他们头衔、给他们一个足够体面的理由暂时闭嘴。\n\n旧贵族的能量来自关系网。掐断几根线，他们就得花一整个季度重新接起来。\n\n§Y本轮结束后，旧贵族的蛰伏时间 +4 周。§!"

 URS_rf_contain_mil:0 "遏制军事贵族"
 URS_rf_contain_mil_desc:0 "军功贵族的本钱是军中的位置与旧部。\n\n调防、轮换、把几个人的名字从名单上划掉——他们会明白这是什么意思。\n\n§Y本轮结束后，军事贵族的蛰伏时间 +4 周。§!"

 URS_rf_contain_land:0 "遏制领地主"
 URS_rf_contain_land_desc:0 "地主们不靠首都活着，他们靠土地。\n\n把税吏派下去，把丈量的尺子带下去，把他们的秋收算清楚——比派一个团更让他们紧张。\n\n§Y本轮结束后，领地主的蛰伏时间 +4 周。§!"

 URS_rf_contain_bur:0 "遏制资产官僚"
 URS_rf_contain_bur_desc:0 "他们既管着公文，也管着账本。\n\n查两本账，封一间办公室，剩下的人自然会重新学着按时交报告。\n\n§Y本轮结束后，资产官僚的蛰伏时间 +4 周。§!"

 URS_rf_boost_state:0 "获取更多行政资源"
 URS_rf_boost_state_desc:0 "再多要一间办公室、一批文书、一支能下乡的稽查队。\n\n国家这条线上的效率因此提高。"

 URS_rf_boost_army:0 "收买基层将领"
 URS_rf_boost_army_desc:0 "元帅们争的是议席，团长们争的是补给。\n\n把后者喂饱，前者的话就没人执行。军队这条线上的效率因此提高。"

 URS_rf_boost_people:0 "改善土地管理"
 URS_rf_boost_people_desc:0 "重新丈量、重新登记、重新定租。\n\n农民不关心谁在圣骏堡开会，他们只关心今年的租子按哪把尺子算。群众这条线上的效率因此提高。"

 URS_rf_boost_resource:0 "减少各部门拨款"
 URS_rf_boost_resource_desc:0 "砍掉重复的、停掉无人认领的、把三份报告合并成一份。\n\n省下来的每一分都是资源线上的一点效率。"

 URS_rf_purge_officials:0 "更替一批政府官员"
 URS_rf_purge_officials_desc:0 "不是抓几个人给人看，是把整层人换掉，连椅子一起换。\n\n代价很大，但从此往后旧贵族每次想动手，都要先重新铺一遍关系网。"

 URS_rf_purge_generals:0 "替换高级将领"
 URS_rf_purge_generals_desc:0 "把将军们从终身职位上请下来，换成愿意听中央的人。\n\n军队会安静很长时间——安静得让你不安。"

 URS_rf_purge_landlords:0 "完善领地主与中央的关系"
 URS_rf_purge_landlords_desc:0 "不是收走他们的地，是把他们的地契和中央的档案绑在一起。\n\n从今往后，他们的收成、人口、田界，都要在圣骏堡有一份。地主的每一次盘算都会慢上一步。"

 URS_rf_purge_bureaucrats:0 "贪污罪证"
 URS_rf_purge_bureaucrats_desc:0 "账本自己会说话，只要有人愿意翻。\n\n把罪证收进抽屉里——不必用，只要他们知道抽屉在谁手上，资产官僚每一次伸手都会先犹豫。"

 URS_rf_opp_noble:0 "旧贵族行动中"
 URS_rf_opp_noble_desc:0 "旧贵族正在行动。\n\n请愿、联名、在圣骏堡的沙龙里传播某些恰到好处的流言。\n\n§Y35 天后结算§!：概率恶化国家改革进度，并拉低国家改革效率。"

 URS_rf_opp_mil:0 "军事贵族行动中"
 URS_rf_opp_mil_desc:0 "军事贵族正在行动。\n\n军需被拖延、演习被取消、某些命令在传到之前就变了意思。\n\n§Y35 天后结算§!：概率恶化军队改革进度，并拉低军队改革效率。"

 URS_rf_opp_land:0 "领地主行动中"
 URS_rf_opp_land_desc:0 "领地主正在行动。\n\n粮价、脚价、佃租，每一项都能让中央的法令在乡下变成一张废纸。\n\n§Y35 天后结算§!：概率恶化群众改革进度，并拉低群众改革效率。"

 URS_rf_opp_bur:0 "资产官僚行动中"
 URS_rf_opp_bur_desc:0 "资产官僚正在行动。\n\n公文被压在抽屉最底下，账目被重新抄了一遍，需要的东西永远差两天到。\n\n§Y35 天后结算§!：概率恶化资源改革进度，并拉低资源改革效率。"

 # ==========================================================================
 # 事件（events/URS_dream.txt）
 # ==========================================================================

 # ---- urs_dream.2 乌萨斯之腐 ----
 urs_dream.2.t:0 "乌萨斯之腐"
 urs_dream.2.d:0 "腐败并不是乌萨斯最近才出现的问题。\n\n它已经存在了太久，以至于许多人甚至已经忘记，一个正常运转的国家本该是什么样子。\n\n当规则只对没有权力的人有效，当职位可以被交易，当一份报告可以因为一个签名而改变真相——腐败就不再是一种罪行，而会变成制度的一部分。\n\n我们必须对其一场手术"
 urs_dream.2.a:0 "病人的名字：“乌萨斯”"

 # ---- urs_dream.3 阴影下的人群 ----
 urs_dream.3.t:0 "阴影下的人群"
 urs_dream.3.d:0 "如果执行命令的人已经不再相信命令，如果地方官员把帝国的权力当成个人的财富，那么再完善的制度也只不过是一张废纸。\n\n我们无法让所有人同时改变。\n\n因此，一切改革都必须从最直接的地方开始。"
 urs_dream.3.a:0 "官员。"

 # ---- urs_dream.4 生锈的齿轮 ----
 urs_dream.4.t:0 "生锈的齿轮"
 urs_dream.4.d:0 "清理几个贪腐的官员，并不能让整个帝国恢复运转\n\n如果制度本身仍然低效，那么今天倒下的官员，明天还会被另一个人取代。\n\n一个真正的问题从来不是“谁在腐败”，而是：\n\n为什么腐败如此容易生存？\n\n当我们处理完人之后，接下来必须"
 urs_dream.4.a:0 "处理制度。"

 # ---- urs_dream.5 层层叠叠的纸 ----
 urs_dream.5.t:0 "层层叠叠的纸"
 urs_dream.5.d:0 "维特将最后一份地方报告放在桌上。\n\n一份、两份、十份、数百份。\n\n桌面已经被纸张彻底覆盖。\n\n每一份报告都声称当地一切正常。\n\n粮食充足，工厂运转，治安稳定，税收按时上缴。\n\n可当这些数字真正被交叉核对时，结果却完全不同。\n\n有些工厂根本没有按照报告中的产量运作。\n\n某些地区的粮食已经不足以维持正常配给。\n\n而那些本该反映问题的报告，却在经过一层又一层的审批后，变成了同一个答案：\n\n“一切正常。”\n\n维特与身旁的费奥多尔沉默了许久。\n\n帝国真正的问题，也许并不在于没有人发现问题。\n\n而在于——\n\n没有人愿意让问题抵达宫门。"
 urs_dream.5.a:0 "「那么，就让它抵达宫门。」"

 # ---- urs_dream.6 谁在替帝国说话 ----
 urs_dream.6.t:0 "谁在替帝国说话"
 urs_dream.6.d:0 "监察名单越来越长。\n\n一个地方官员的问题，很快牵出了他的上级。\n\n上级又指向更上级。\n\n而那个更上级，则拿出一叠盖满印章的文件，证明自己的决定完全符合帝国规定。\n\n每个人都有文件。\n\n每个人都有理由。\n\n每个人都声称自己只是在执行命令。\n\n维特翻到最后一页时，忽然停了下来。\n\n那里写着一句已经被重复过无数次的话：\n\n“本部门对此事并不知情。”\n\n他放下文件。\n\n如果所有人都只是执行命令，\n\n那么究竟是谁，在替乌萨斯做决定？"
 urs_dream.6.a:0 "「继续查。」"
 urs_dream.6.b:0 "「那就让他们继续解释。」"

 # ---- urs_dream.7 齿轮重新转动 ----
 urs_dream.7.t:0 "齿轮重新转动"
 urs_dream.7.d:0 "第一次人民会议持续到了深夜。\n\n桌面上不再是那些地方官员的名字。\n\n取而代之的是流程图、机构图、预算表以及无数份被重新翻出来的旧法令。\n\n有人提出撤销机构。\n\n有人主张合并部门。\n\n还有人认为应该彻底废除一些沿用了数十年的制度。\n\n没有人知道这样做最终会带来什么。\n\n但所有人都明白一件事：\n\n继续维持现状，只会让问题越来越严重。\n\n费奥多尔看向窗外。\n\n夜色中的乌萨斯依旧庞大。\n\n但这一次，一些停滞许久的机器，终于开始缓慢地重新运转。\n\n或许改革并不能让它立刻变得强大。\n\n但至少，它开始向前走了。"
 urs_dream.7.a:0 "「让齿轮转起来。」"

 # ---- urs_dream.8 给帝国上油 ----
 urs_dream.8.t:0 "给帝国上油"
 urs_dream.8.d:0 "改革稍微有了成效。\n\n几个地方部门重新建立了与中央的直接联系，长期无人处理的行政申请开始得到回复，一些积压数年的文件终于被送到了应该去的地方。\n\n维特站在档案室里，看着一名年轻官员抱着厚重的文件走过走廊。\n\n“以前这些文件要多久才能送到？”\n\n“三个月，阁下。”\n\n“现在呢？”\n\n“大约两周。”\n\n维特沉默了一会儿。\n\n两周仍然太久。\n\n但对于一个已经停滞多年的机器而言，这已经是一个开始。\n\n桌上摆着一份新的改革报告。\n\n上面没有宏大的口号，也没有关于帝国未来的赞美。\n\n只有一行简单的批注：\n\n“先让它转起来。”\n\n一滴润滑油，落在生锈的齿轮之间。\n\n然后，机器开始转动。"
 urs_dream.8.a:0 "「很好，让它继续转下去。」"

 # ---- urs_dream.9 剑上的裂痕 ----
 urs_dream.9.t:0 "剑上的裂痕"
 urs_dream.9.d:0 "乌萨斯帝国军事委员会内部报告\n\n这份报告原本只是一份关于军队改革的例行汇总。\n\n可当来自各军区的材料被摆在同一张桌上时，所有人都陷入了沉默。\n\n有些部队缺少装备，却依旧被要求完成同样的训练指标。\n\n有些军官已经数年没有离开自己的办公室，却依然能够决定成千上万名士兵的命运。\n\n有些命令在下达之前便已经被军区内部重新解释。\n\n更令人不安的是，军队高层之间正在出现越来越明显的分歧。\n\n有人要求扩大军权。\n\n有人要求整顿军纪。\n\n有人要求改革指挥体系。\n\n也有人认为，乌萨斯根本不需要改革。\n\n他们认为，过去的一切就已经足够。\n\n维特将最后一份文件合上。\n\n“军队的问题，比我们预想的还要严重。”\n\n屋内没有人回答。\n\n墙上悬挂着乌萨斯的军刀。\n\n可那柄剑的内部，似乎已经出现了一道看不见的裂痕。"
 urs_dream.9.a:0 "「那么，就把这道裂痕找出来。」"

 # ---- urs_dream.10 九军七旗 ----
 urs_dream.10.t:0 "九军七旗"
 urs_dream.10.d:0 "军事委员会的会议室里，摆着一张已经有些年头的乌萨斯军区地图。\n\n地图上标记着九个军区，旁边则是一面面代表不同部队传统的军旗。\n\n由于大叛乱的影响，两大集团军已经被划去痕迹。\n\n现在还剩下七面旗帜。\n\n不同军区以不同的方式完成重组。有人保留了旧日的番号，有人继承了旧军官集团的传统，还有一些部队甚至形成了自己的训练体系与指挥习惯。\n\n他们都宣称自己服从帝国。\n\n他们也确实会服从帝国。\n\n只是在他们看来，帝国的命令仍然应该经过自己的解释。\n\n一名将军站在地图前，用手指敲了敲其中一个军区。\n\n“他们不是叛军。”\n\n另一名军官回答：\n\n“当然不是。”\n\n“那他们是什么？”\n\n屋内安静了很久。\n\n没有人回答。\n\n因为所有人都知道答案。\n\n他们是乌萨斯的军队。\n\n只是已经不再是一支拥有同一个声音的军队。\n\n九支军团后\n\n七面旗帜。\n\n而在那七面旗帜之下，仍然存在着大叛乱留下的阴影。"
 urs_dream.10.a:0 "「一支军队，只能有一个声音。」"

 # ---- urs_dream.11 空椅子 ----
 urs_dream.11.t:0 "空椅子"
 urs_dream.11.d:0 "帝国军事议会，第██次例会。\n\n会议开始前，书记官再次确认了出席名单。\n\n两名元帅。\n\n五个缺席。\n\n这已经不是第一次了。\n\n也不会是最后一次。\n\n书记官甚至不再尝试询问那五个集团军是否会派出代表。\n\n因为答案早已众所周知。\n\n“没有必要。”\n\n这是他们给出的理由。\n\n对那些集团军而言，他们有自己的指挥体系、自己的军官团、自己的作战传统，也有足够强大的力量保障自己的利益。\n\n他们承认皇帝。\n\n他们承认所谓的乌萨斯。\n\n一名元帅看着会议桌上那五把空椅子。\n\n“他们甚至懒得派人来。”\n\n另一人没有回答。\n\n因为事实比任何回答都更加清楚。\n\n会议继续进行。\n\n五把空椅子依旧安静地摆在那里。"
 urs_dream.11.a:0 "「毫无忠诚……」"

 # ---- urs_dream.12 无人同路 ----
 urs_dream.12.t:0 "无人同路"
 urs_dream.12.d:0 "夜已经很深了。\n费奥多尔独自站在会议室里。\n\n长桌上还摆着今天的文件。\n\n一份来自地方行政机构。\n一份来自各个集团军。\n一份来自工业部门。\n还有一份来自内卫。\n\n它们彼此之间几乎没有任何共同点。\n\n有人要求更多权力。\n有人要求保持现状。\n有人要求改革。\n而有人甚至没有提出任何意见。\n\n费奥多尔一页一页地翻过去。\n\n到最后，他停了下来。\n这些人都在为乌萨斯做事。\n可他们眼中的“乌萨斯”，似乎并不是同一个乌萨斯。\n\n一名侍从站在门口，轻声问道：\n“陛下，明天的会议是否照常举行？”\n\n屋内沉默了很久。\n\n费奥多尔看向窗外。\n皇宫之外，是属于整个帝国的黑夜。\n\n他忽然意识到，也许改革最困难的部分，并不是找到乌萨斯究竟出了什么问题。\n\n而是当所有人都告诉你，他们正在为了乌萨斯而行动时，你必须决定，到底该相信谁。\n\n他没有回答。\n\n会议室里的椅子一把接一把地空着。\n\n而那张属于帝国的长桌，第一次显得如此漫长。"
 urs_dream.12.a:0 "「既然无人同行，那就由我们自己走下去。」"
