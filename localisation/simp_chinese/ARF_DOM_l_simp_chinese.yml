#人物
 DOM_Andrew_Pitford: "安德鲁·匹特福德"
 DOM_Andrew_Pitford_desc: "安德鲁·匹特福德是一名参加了四皇会战中维多利亚一方几乎所有关键战役的将军，但是没有人知道为什么他在战后会被丢来这块没有前途的殖民地。乐观主义者说，将军是来平定这里棘手的局势的，悲观主义者说，将军是在战后因冲撞最高指挥部而被贬谪到这里。对维多利亚本土局势一无所知的人则说，将军可能是主动来这里的，毕竟他来这以后，把克莱顿梭城建设成了一座坚不可摧的堡垒，然后养了一支不同于那些贼配军的私兵，还靠着和自由党的关系，通过贸易赚得盆满钵满，搞不好他想拥兵自重……"
