#国家精神
 broken_land: "破碎之地"
 broken_land_desc: "美拉尼西亚自治领本身就是不该存在的产物，在雷姆必拓独立之前，她属于广大的维多利亚南方殖民领的一部分。在围栏事件后，原有的殖民政府驻地和雷姆必拓联邦一起迁走，剩下的狭长殖民地被分割为美拉尼西亚和奥特亚罗瓦。相比于奥特亚罗瓦的平静局势，美拉尼西亚管辖着抵抗最强烈的什基普塔尔和尤里卡地区，并且还受到奥布雷诺威切和阿斯帕鲁克的持续渗透。重压之下，尤里卡独立战争成为了摧毁美拉尼西亚的第一块多米诺骨牌，整个殖民地随即分崩离析。在战争过去的数十年后，和平依然没有降临这块土地，来自西方的左翼游击队持续骚扰着移动城市外围的资源点，移动城市中充斥着犯罪和腐败，山林中的匪盗层出不穷，最坏的是，美拉尼西亚几乎没有人信任克莱顿梭的殖民政府。"
	thieves_army: "“贼配军”"
	thieves_army_desc: "“贼配军”是来到当地的炎国外交使团对美拉尼西亚征兵政策的评价。由于当地人极度抗拒加入殖民军队，无计可施的殖民政府只得将活跃在野外的各支土匪部队诏安，给他们发一点象征性的饷银，然后让他们在掠夺过路商旅的时候顺便收路桥费，保卫盗匪营地的时候顺便巡查一下边境。事实上，这项制度的效果比想象中好很多，殖民政府获得了兵员补充，盗匪们得到了安全保障，大部分土匪团接受诏安后的社会秩序还好了不少，在维多利亚本土由于政治混乱而无法提供标准补给和装备以后，这些只需要廉价刀剑和弓弩就能装备起来的土匪军，更是成为了殖民政府的宠儿。"