#人物
 VWI_Anfilis_Windermere: "安费莉丝·温德米尔"
 VWI_Anfilis_Windermere_desc: "安费莉丝·温德米尔，八大公爵之一，维多利亚三大边防集团军的总司令，“选帝侯的大敌”，“银剑”，“帝国栋梁”。没有人能怀疑温德米尔公爵的忠诚，即使是国王本人也不行。作为伦蒂尼姆被萨卡兹占领后第一个提出联合进军的公爵，温德米尔公爵对维多利亚的忠诚和对萨卡兹人的敌视，人们有目共睹。即使所有观察家都认为联合进军是一次注定失败的作秀，温德米尔公爵仍然依照最坏的打算——只有她一人的部队抵达伦蒂尼姆城下——完成了战略规划，对边防集团军进行了总动员，准备独自对抗卡兹戴尔军事委员会。但她终究还是没有预测到更坏的结局，温德米尔边防集团军在进军伦蒂尼姆的途中被其他公爵的部队拦下，还没有进入打击阵位便被迫撤退。\n\n第一次联合进军的失败让温德米尔公爵认清了一个事实，除了她，没有一个公爵真正忠于维多利亚，他们乐见于自己宣誓效忠了一辈子的祖国坠入地狱，只为了分食帝国的尸体。维多利亚事实上分裂后，温德米尔公爵开始召集忠于她的部队，建立救国政府，寻求维多利亚人民和政客的支持。她对帝国的忠诚让她不愿意成为撕下遮羞布、掀起内战的那个人，更何况，魔族仍然盘踞在帝国的心脏，将他们驱赶出去，仍然是安费莉丝·温德米尔的首要责任。\n\n无论是记者、外国使节，还是公爵府与参谋部的幕僚，都或隐晦或直接的评价过温德米尔公爵，她拥有着远超其他公爵和政客的人性：对祖国的忠诚，对下属的尽责，对家人的亲情。安费莉丝·温德米尔将这一切都当作是自己应尽的义务和命运对自己的奖赏，但她选择性忽略的，还有那些人评价的后半部分：这种人性，可能会将她彻底葬送。"
 VWI_Delphine_Windermere: "戴菲恩·温德米尔"
 VWI_Delphine_Windermere_desc: "戴菲恩·温德米尔知道，自己总有一天要接过母亲肩上的重担，但她没有预料到，或者从来不敢预料，这一天会到来得那么早。戴菲恩·温德米尔在丽茵卡登的深闺中长大，在那座堡垒城市度过了继承者们罕有的童年时光。前任温德米尔公爵并非不想让自己的女儿继承爵位，但从事后来看，这位心软的母亲确实对戴菲恩疏于教育：除去对戴菲恩进行了以防身为目的的必要战斗训练，这名未来的温德米尔公爵缺乏艺术、礼仪、修辞等一系列贵族应有的涵养，她似乎是被当作一个市民的女儿养大的。\n\n或许是血脉与命运作祟，戴菲恩·温德米尔最终还是牵扯到了政治当中。她选择在公爵领内的军事学院完成学业，或者说，训练。而在她理应前往帝国的首都，伦蒂尼姆，接受参谋培训时，萨卡兹的入侵发生了。戴菲恩的父亲在从伦蒂尼姆返回后，很快蹊跷地离世，她随即接到母亲的指示，原地转为情报人员，以军校生和平民的身份为掩护，探查入侵者的动向，以及完成寻找帝国正统继承人的政治任务。在一个被称为“格拉斯哥帮”的街头帮派中，她阴差阳错地完成了任务，找到了流落民间的维娜·维多利亚，并且在卡兹戴尔的反对派支援下，助其逃出重围"
 VWI_Delphine_Windermere_royal_desc: "戴菲恩·温德米尔知道，自己总有一天要接过母亲肩上的重担，但她没有预料到，或者从来不敢预料，这一天会到来得那么早。戴菲恩·温德米尔在丽茵卡登的深闺中长大，在那座堡垒城市度过了继承者们罕有的童年时光。前任温德米尔公爵并非不想让自己的女儿继承爵位，但从事后来看，这位心软的母亲确实对戴菲恩疏于教育：除去对戴菲恩进行了以防身为目的的必要战斗训练，这名未来的温德米尔公爵缺乏艺术、礼仪、修辞等一系列贵族应有的涵养，她似乎是被当作一个市民的女儿养大的。\n\n或许是血脉与命运作祟，戴菲恩·温德米尔最终还是牵扯到了政治当中。她选择在公爵领内的军事学院完成学业，或者说，训练。而在她理应前往帝国的首都，伦蒂尼姆，接受参谋培训时，萨卡兹的入侵发生了。戴菲恩的父亲在从伦蒂尼姆返回后，很快蹊跷地离世，她随即接到母亲的指示，原地转为情报人员，以军校生和平民的身份为掩护，探查入侵者的动向，以及完成寻找帝国正统继承人的政治任务。在一个被称为“格拉斯哥帮”的街头帮派中，她阴差阳错地完成了任务，找到了流落民间的维娜·维多利亚，并且在卡兹戴尔的反对派支援下，助其逃出重围。\n\n然而，戴菲恩的母亲，前任温德米尔公爵，安费莉丝·温德米尔，于此次解救行动中暴露了指挥部位置，在敌军的炮火打击中不幸牺牲。戴菲恩没有迎来为母亲哀悼的闲暇，她在前线紧急宣称继承温德米尔公爵之位，并且得到了刚被救出的维娜·维多利亚的正式册封。戴菲恩·温德米尔，如今被称为温德米尔公爵，继承了安费莉丝·温德米尔的全部资产、土地、军队和意志，无论她的政治水平和指挥才干能否服众，她都是带领边防集团军驱逐萨卡兹、戡平叛乱势力的唯一领袖。当责任真正落下，昔日的公爵之女选择加入这一场游戏，以王与人民的名义。"
 VWI_Delphine_Windermere_republic_desc: "戴菲恩·温德米尔知道，自己总有一天要接过母亲肩上的重担，但她没有预料到，或者从来不敢预料，这一天会到来得那么早。戴菲恩·温德米尔在丽茵卡登的深闺中长大，在那座堡垒城市度过了继承者们罕有的童年时光。前任温德米尔公爵并非不想让自己的女儿继承爵位，但从事后来看，这位心软的母亲确实对戴菲恩疏于教育：除去对戴菲恩进行了以防身为目的的必要战斗训练，这名未来的温德米尔公爵缺乏艺术、礼仪、修辞等一系列贵族应有的涵养，她似乎是被当作一个市民的女儿养大的。\n\n或许是血脉与命运作祟，戴菲恩·温德米尔最终还是牵扯到了政治当中。她选择在公爵领内的军事学院完成学业，或者说，训练。而在她理应前往帝国的首都，伦蒂尼姆，接受参谋培训时，萨卡兹的入侵发生了。戴菲恩的父亲在从伦蒂尼姆返回后，很快蹊跷地离世，她随即接到母亲的指示，原地转为情报人员，以军校生和平民的身份为掩护，探查入侵者的动向，以及完成寻找帝国正统继承人的政治任务。在一个被称为“格拉斯哥帮”的街头帮派中，她阴差阳错地完成了任务，找到了流落民间的维娜·维多利亚，并且在卡兹戴尔的反对派支援下，助其逃出重围。\n\n令戴菲恩始料未及的是，在记忆中骁勇善战的母亲于此时犯下了致命的失误，指挥部坐标的暴露招致了来自伦蒂尼姆城内的炮击，温德米尔公爵在强撑到看到女儿最后一眼后停止了呼吸。而维娜·维多利亚的背叛更是雪上加霜，那个曾与她并肩作战的帮派女孩，在利益的驱使和血脉的亲近感下，选择了她的姑姑，开斯特的玛丽·开斯特·维多利亚公爵。戴菲恩无意否认父母的牺牲，但她意识到，这场游戏是时候终止了。戴菲恩·温德米尔在完成对边防集团军和临时救国政府的掌控后，宣布废除温德米尔公爵头衔，不再向维多利亚王室效忠，她宣告成立“新典范军”，自称“护国公”，对维多利亚所有贵族势力和分裂分子宣战。戴菲恩·温德米尔本就没有被当作一个贵族培养成人，她一直是一名士兵，一个平民，一个女儿。如今，她将对这个吞噬了无数士兵、无数平民、无数儿子和女儿的体制本身发动华丽的叛乱。"
