 event_vwi.3.t: "不算阴谋论的阴谋论"
 event_vwi.3.d: "一发炮弹险些命中旋翼机的机体，轮番的闪避机动让乘客们来回颠倒、苦不堪言。这架温德米尔边防军旋翼机载着一批逃离伦蒂尼姆的政客与企业家，而他们中的大多数既没有乘坐飞行器的经验，也对极限冒险毫无兴趣可言。然而，有一个人却是例外——\n\n“——真牛逼！”威廉·贝内里奇议员紧抓着客舱的扶手，朝着云层之下渐渐远去的伦蒂尼姆城大喊道，“我靠，这可比待在办公室打字刺激多了！”\n\n瑞克·布莱斯特恩则神情自若，还亲昵地拍了拍身旁抖得像筛糠般的外交部长塞西尔，安抚道：“放轻松，朋友。这一型旋翼机是我亲自监督研发的，我对她的水平心中有数。就眼下这点儿小打小闹，恐怕连一根螺丝钉也撼动不了，哈哈。”他自信地笑笑，“相信我，我们肯定会安然抵达温德米尔机场的。”\n\n“所以到底是谁在攻击我们！那帮疯子萨卡兹人吗？”塞西尔的神情有些狂乱。\n\n此前一直保持沉默的萨卡兹族官员达兹戴利却在此刻发话道：“不，看上去不像。”\n\n“何以见得啊？”\n\n“部长，萨卡兹人讲究战斗的艺术。”达兹戴利说，“要想击落一架机动敏捷的飞行器，对方决不会和猪猡一样胡乱蛮射炮弹。若要我说的话，他们会更倾向于以源石技艺一击结束战斗，毫不拖泥带水。”\n\n引擎噪音、喧哗喊声与不时传来的炮弹呼啸让机舱之内吵闹不堪，塞西尔只能大声发问道：“老兄，那你觉得攻击者是谁？”\n\n达兹戴利闭上眼思考片刻，沉吟道：“部长阁下，以下是我的看法：除温德米尔女士外，任何公爵都有可能是攻击者。就目前情况而言，他们可以毫不心软地击落这架飞机，然后把一切责任都推到伦蒂尼姆的卡兹戴尔驻军头上。”\n\n机舱内忽然陷入一片死寂，只有旋翼引擎仍在孜孜不倦地发出嗡嗡声。最后，还是贝内里奇议员率先开口：“喂，发生什么了？大块头刚才说了什么？”\n\n“你最好不要知道，多笑一会儿吧。”塞西尔瘫在椅子上挖苦道，“但愿我们的达兹戴利先生所言为虚。”\n\n“但愿我所言为虚，毕竟——”达兹戴利低声应和，“倘若我的上述猜测无误，这架飞机上的所有人都将沦为诸公爵之争的棋子与筹码。”\n\n听到这番话，一旁的布莱斯特恩忽然露出浅笑："
 event_vwi.3.a: "“终于有人愿意承认实情了，哈哈。”"
 event_vwi.4.t: "收拾局面"
 event_vwi.4.d: "朱诺·斯蒂芬森快步走进会议室，手上攥着那封来自安费莉丝·温德米尔的介绍信。她敲了敲橡木桌面，震得上面的军旗座台微微一晃，“好了各位，我是你们的新上司，自我介绍就免了。总之，欢迎参加边防军战时经济委员会的第一次例会。”\n\n她扫视着底下清一色穿着军装的与会者，眉头紧锁，脸上明显挂着不满——当初温德米尔公爵请她来主持后方经济工作，可没提过眼下边防军司令部里能用的全是军人。虽然公爵正拼命从伦蒂尼姆往回抽调经济顾问，但在他们到任之前，她唯一能指望的，恐怕就是眼前这帮阿兵哥了。\n\n她闭眼思索片刻，开口道：“让我先摸摸底。除了我，在座的诸位还有谁念过经济专业——或者干过与之沾边的活儿？”\n\n底下的人面面相觑，好一会儿才有个军官站了起来，“我，长官。”\n\n“说说情况。”朱诺眯起眼，用目光把他从头到脚刮了一遍。\n\n“报告长官！我干过推销公司的地区经理！”他敬了个礼。\n\n底下顿时哄堂大笑，那家伙身旁的两三个士兵正笑着猛捶他的肩膀。朱诺则把眼睛眯成了两条细缝，“妈的，你还挺自豪。”\n\n“报告长官，是的！”军官一脸严肃，“还有长官，我不叫‘妈的’，我姓费舍尔！”\n\n笑声和口哨声更响了。朱诺暗骂一句，又敲了敲桌子：“各位大朋友，看来非得给你们点颜色瞧瞧了。”她指向那个军官，“你，费舍尔，现在我任命你当经委会统计处长——甭问这是个什么玩意儿，就当是我自己瞎编的部门——而你的职责，就是给我钉死那台传真机，把它吐出来的所有数字都整成统计报表。饼图、柱图、爱什么图都行，但只要我看不懂你整了啥，你他妈就等着明天滚蛋。明白？”\n\n“是，长官！”费舍尔挺胸立正。\n\n“这还差不多。”朱诺扯了扯嘴角，目光扫过会议室里其他人，“放心，人人有份，费舍尔处长可不会孤单的。”"
 event_vwi.4.a: "总算步入正轨了。"
 event_vwi.5.t: "亲自出马"
 event_vwi.5.d: "“我们拒绝工作，除非厂方停止拖欠工资！”\n\n“八小时工作，八小时睡眠，八小时属于工人自己！”\n\n“让那些口号都见鬼去吧，我们只需要面包！”\n\n卡希尔政务官无奈地看着演讲台下义愤填膺的人潮，凑近话筒说道：“先生们、女士们，保持冷静！请你们先回到厂房上工，政府日后一定会考虑你们的诉求——”\n\n台下传来阵阵嘘声，番茄、西瓜和臭鸡蛋如狂风骤雨般袭来，其间还夹杂着几个年轻人的臭骂：“滚你的，老东西！别拿花言巧语来骗我们！”\n\n卡希尔涨红了脸，大怒道：“你们别太得寸进尺！给我搞明白，这是一场非法集会，我现在就可以把你们统统逮捕！要么给我回去工作，要么就等着被关进监狱！”\n\n人潮之中，一个女工挥着拳头喊道：“你以为我们会怕这些吗？我看监狱的环境还比那座破工厂好得多哩！”\n\n“没错，没错！”无数声音附和道。蔬菜与水果再次飞向卡希尔，险些正中他的脑袋。\n\n正当卡希尔躲在演讲台后面不知所措时，一个冰冷的声音却突然响起：“闪开，我来。”\n\n卡希尔抬起头，一个身着军装的高个子女人映入眼帘。他马上兴高采烈地站起身：“啊，尊敬的温德米尔公爵，有您救场实在是太——”\n\n“别碍我的事。”她一把拉开卡希尔，抓起了话筒，“如诸位所见，我就是安费莉丝·温德米尔。我知道你们现在急火攻心，但请听我一言！”\n\n番茄攻势停止了，台下的人群瞬间鸦雀无声。\n\n“我在此承诺，只要各位放弃罢工，重回岗位，我将即刻下令恢复十四小时工作制，并确保各位在本周内领到一切应得的薪水！”公爵话音刚落，台下便响起阵阵欢呼与掌声。\n\n“但若各位决意与我相抗，边防军的将士们随时奉陪。”她冷冷补充道。\n\n人潮再次陷入死寂。很快，第一个工人拖着步伐离开了人潮。紧接着，第二个、第三个，越来越多的工人成群结队地返回工厂。最后，由抗议者聚成的人山人海竟如蒸发般消失不见，仅留下遍地的狼藉。\n\n“政务官，我不希望下一次事态还得轮到我亲自解决。”温德米尔面无表情道。"
 event_vwi.5.a: "然后，她便头也不回地走了。"
 event_vwi.6.t: "劳动与自由"
 event_vwi.6.d: "“对六。”哈利不紧不慢地打出两张扑克牌，他那轻松惬意的表情使约翰逊不禁怀疑自己到底是不是已经离开了这个垃圾地方——那条件甚至不如废品回收站的可耻监狱。\n\n“对七。”约翰逊也打出了他的手牌。“哈利，你难道不觉得在这里的生活相当糟糕，也不想争取减刑早日出去吗？”\n\n“这就是你肤浅了。”哈利依旧挂着那诡异的笑容。“监狱可是最好的大学！而且，我已经进这大学深造好多次了！对了……”哈利悄然收起他的手牌。“小约翰，你是怎么进来的？我前七个室友‘自我介绍’得都比你要早，你难道就不爱说话吗？让我猜猜：是偷了富太太的耳坠子，被警察认为支持了塔拉共和军，还是惹怒了你老家的贵族？”\n\n“都不是。”约翰逊耸耸肩。“坦白来说，我进来的缘故有点丢人——主要是因为喝醉之后不小心把酒吧老板的笔记本终端当解手池了，然后……你知道的。”\n\n“其实你算好的了！我的第三任室友是因为强暴羽兽进来的，当初他说出这句话时，全食堂一半的人都吐了；还有第五任，他更离谱。你知道他干了什么吗？该死的，这家伙专偷人家内衣，还男女来者不拒，搞得我睡觉都不安生。”哈利不知从哪里掏出根狗尾巴草，假装香烟“抽”了起来。“至于你大哥我吗，可是本市的‘走私大王’。当然，有些家伙也管我叫‘进狱大王’。哈！我这次进来之前可是每月都能搞到不下五单大生意的！”\n\n“兄弟，你能别吹了吗。”约翰逊试图捂住耳朵，可他总是难以同时控制住上下两对。“大家都清楚，哈利·巴克南不过是个屡次犯罪，又屡次被抓的小贼，别再提这些嫁接到你身上的他人事迹了。——另外，如果能顺利加入劳动团的话，我应该很快就能离开这鬼地方，也不用再听你吹丰蹄了。”\n\n“劳动团？”听到这个词，哈利眼中好似闪现一丝火花。“那是什么东西？听你的意思，难不成加入它就能离开这地方，继续我的走私事业？”\n\n“哈！你连这都没听说吗？肯定是天天打牌导致的。简单来说，只要你愿意干各种脏活累活就能加入它，只要干活足够勤快就能减刑。当然……听说这团好像还分自愿和非自愿两种，当然是否属实，这我可不清楚。”约翰逊望了眼铁窗之外的乡村风景，自由好似远在天边，而又近在眼前。"
 event_vwi.6.a: "“等会，你不是说你对减刑没兴趣吗？”"
 event_vwi.7.t: "墙上的又一块砖"
 event_vwi.7.d: "肉类、蔬菜、粮食、糖油，甚至是奶酪和纸，这些竟然全都要限额？他在领那些玩意的时候可没注意到这点。布莱尔心中充满了诧异，其中甚至掺杂着一丝恐惧。翻着那些花花绿绿的的配给券，他不禁庆幸在配给制施行前屯了那么多东西。要知道，当初邻居看到他和父亲一同将一箱又一箱的面粉和罐头冷冻食品抬进屋子时还在笑他“担忧不可能发生的事”。可现在呢？或许当下发生的事情已经证明了未雨绸缪的正确性，布莱尔如是所想。\n\n“这下算是老调再谈了。”父亲黑色幽默道：“世界大战的时候就这一套，过了这么久也没有变化。还是在报纸和广播上宣传，还是这些印刷比你吃的东西还要精美的券儿，甚至巧克力和杜松子酒配额也还是那个鬼样子，而且依然搞得人没有香蕉可吃。新瓶装旧酒啊！几十年都不带变。”\n\n“也不能完全这样说。”布莱尔起身，将那叠配给券收入抽屉。“至少现在不像当年那样要跟高卢打，不过倒是要和奇士辈出的魔族佬干仗。关键还是在于他们不过是支孤立的远征军，要是真能团结起来，也不是没有机会一招制敌。而且就我们的状况来看……吃的东西虽然限额，但至少还能填饱肚子。而且咱们后院也不是种了土豆和胡萝卜吗？应该也不至于。”\n\n“现在还一切正常，可往后呢？”父亲倒了杯水。“布拉，你还记得那盘‘推演’吗？诸公爵们或许能够做到重新团结，再来一次联合进军赶走魔族，这个有没有可能？当然是有可能的。不过，我提这事并不是为了说占领军的问题，而是要考虑一个玻利瓦尔作家很爱谈的话题：也就是在尘埃落定之后，事情又会走向何方。而那个人们最不愿提及的话题——内战，究竟会不会成真。”\n\n“爸，真的别谈这些沉重的话题了，卡特听到的话晚上做噩梦怎么办？而且就不止卡特，我们谈这些话也不过是内耗而已。政治是交给大人物去想的事情，我们还是先考虑晚饭吃点儿什么吧。”布莱尔起身，转头离开了客厅。或许老人家有点兴趣爱好本身不是问题，但在当今这个危机之秋，天天去谈时事还是太令人头疼了。"
 event_vwi.7.a: "望着儿子离去的背影，老布莱尔也叹了口气。"
 event_vwi.8.t: "在我生命之中"
 event_vwi.8.d: "“我们来看下一条新闻：为稳定如今动荡时期的经济形势，政府已向社会各界宣布决定发行临时货币。对于此事，民间和学术界也算是各有说法，让我们来连线下弗雷德教授，听听他的意见……”\n\n“他们可算是换了种法子应对危机。”老布莱尔舀起一勺麦片，以他一贯的语气“点评”晨间新闻。自从来到丽茵卡登以来，祖孙四人总是喜欢在吃早饭的同时看着远处电视，而大多数时候在播放的频道都是新闻。\n\n“临时货币？”听到这个词，卡特原本耷拉的耳朵忽然竖了起来。“好像上周的历史课上，老师就提到四皇会战那时候，我们国家在高卢的占领区发行了不少临时货币。可现在也没有发生对外战争啊，为什么要这么做？”\n\n“看起来的确是这样。”老布莱尔笑了笑。“但是就如今诸公爵，还有首都那帮占领军间的紧张对峙来看，咱们的维多利亚帝国也算是处于半内战状态了。提到这个，我倒是想起了一句炎国的古话——大概意思就是说一个国家的统一即便长久也会面临分裂，而分裂也不会特别持久，其总有一天会再度统一。我不清楚这句话说得到底对不对，但就从如今的局势来看，它前面的那部分倒是在距炎国有半个泰拉那么远的地方应验了。”\n\n“讲到这件事，我倒是想到了伦蒂尼姆金融潮以前的日子。”老布莱尔的老伴蒂娜说道。“那个时候，维多利亚是泰拉经济发展最快，技术最先进的国家。当年的人都对未来充满信心，大家茶余饭后总是喜欢谈论科学。可现在呢？经济已经停滞了多久？如果说从今日开始重建，又要花上多少年才能回到危机之前？哎，老头子，我快染上和你一样的‘忧天综合征’了。”蒂娜又叹了口气。\n\n“或许吧。”小布莱尔试图缓和话题。“我今天找到了瓶白胡椒，做沙拉的时候往里面放了一点，大家感觉怎么样？尝起来会更鲜吗？”"
 event_vwi.8.a: "人们总说，心里愁的人吃东西也难品出好滋味。"
 event_vwi.9.t: "为国劳动"
 event_vwi.9.d: "炙热的太阳穿越云层灼烧大地，也炙烤着格兰特的皮肤、肉体乃至心灵。坦白来说，作为一个并没有什么意识形态信仰或者爱国主义情怀的普通大学生，他本来大概会一辈子与志愿劳动无缘。可禁不住学分的诱惑，格兰特还是克服自己去申报加入了这支“青年工程志愿队”。过去一周，他同志愿队的同龄人们一起在田间耕作、车间轮班。在建筑工地搬砖，到山丘上挖坑植树。而今天，他的任务则是铺设铁轨枕木。\n\n“那个卡车司机真是个外行。”扛起一根木头，格兰特一步一个脚印地走向前方。“他怕不是和咱们一样也是志愿来开卡车的，不然也不能干出把货卸到离工地有百米多远的地方。”\n\n“都是这个样子的，习惯了就好。”一个素未谋面的小个子走到了格兰特右面。“我以前听说过这样一个笑话，可谓是一针见血了。你知道它讲了什么吗？‘我们维多利亚人的最大特质就是善于自我欺骗。公爵们假装国家还没散架；经济学家们假装GDP还在增长；将军们假装军队还能保卫国家。’要我说，这句话有时候放志愿队里也能行。想想营地里那个天天晚上唱摇滚的哥们儿，仔细去看的话，他其实一直都在假装自己正在工作。”\n\n“哈！这话说得可犀利啊。”用胳膊拭去脑门上的汗水，格兰特的脸上久违有了笑容。“对了，老兄，你是为啥要来志愿队？和我一样也是为了大学学分吗？”\n\n“不，不是。”在格兰特的视线之外，小个子眼中显露出一丝忧伤。“暂时还是别提这个了吧，反正我只是为免费的食宿来的，没什么。”\n\n“好吧，要是有什么难言之隐，我们还是不谈了。”恍惚之间，格兰特意识到自己似乎触及到了些不太好的话题。“我们还是继续聊笑话吧——你以前又听说过哪些笑话？要不这回我讲一个吧。‘汤米和约翰比赛谁能把身子探出窗外最远，然后汤米就住院了。猜猜最后的赢家是谁？’”\n\n“哈！这个笑话我也听过。赢家是汤米，因为他探过头了。”小个子咯咯地笑了起来。"
 event_vwi.9.a: "或许不完全是坏事。"
 event_vwi.10.t: "当你四十六岁时"
 event_vwi.10.d: "“你才进部队几年？还管上当年在美拉尼西亚的战斗英雄了！这（维多利亚粗口）几个意思！？”望着那老兵油子的咆哮，宪兵埃琳纳不为所动。她只是默默看着面前之人的眼睛，等待着他自己消停下来。\n\n“中尉先生，您的资历再深，也不能这样干啊！”在笔记本上记下又一行字，望着地上的烟灰，埃琳纳叹了口气。她指向墙上的标识，试图再一次说服这位高傲的中尉：“如果您不爱看标识的话，我可以在这里告诉您：军营里是不许抽烟的，就算是将军元帅来了也一样。这是条军中铁例，没人可以违反。”\n\n“是啊！”一个声音从埃琳纳的身后传来，她转头寻找声音的来源，只见一位看上去似乎比那中尉年纪还要大的老兵掀开门帘，走进营房来。\n\n“柯尔！”他以近乎命令的口吻训斥道：“军中不是没有地方可供你抽烟，但在这营里抽就不是一般的过分了。你瞧瞧——这门、窗、天花板，甚至床单被褥，都是易燃的东西。要是有一个火星子点燃了什么，到时候谁来负责？这位宪兵女士这么好声好气地劝你不听，非得等我来才愿意丢掉那破烟头！？今天不听人家的劝，要是明天你就要上战场也不听长官的命令怎么办？现在、立刻、马上，把它给掐了！”\n\n“对不起！连长！我只是一时糊涂！”听着那位长官的训斥，中尉冷汗直流，立即将烟头按入烟灰缸中熄灭。在二人之间的埃琳纳看到这场面已经呆若木鸡，只是好似个天真的小女孩一样站在那里，拿着写满她所见到糟事儿的笔记本，甚至都没意识到那位柯尔中尉已经夹着尾巴逃走的事实。\n\n“小姑娘，我这几天一直注意着你。”当听到连长这句话时，埃琳纳才算是从呆滞中惊醒。“你确实很热心，这让我想起了我的远房表妹。但这群跟兵痞只有一线之隔的害群之马确实很难搞，下次就应该强硬点，甚至直接拿军法来吓住他们。”\n\n“或许吧，长官。”埃琳纳转身过来，同这位被称为连长的男人擦肩而过，继续在笔记本上记着什么。"
 event_vwi.10.a: "这里就没人在乎纪律吗？"
 event_vwi.11.t: "622日"
 event_vwi.11.d: "“哈克尔！别继续躺在床上了！”声音从窗外传来，少年慵懒地放下平板终端，离开了舒适的被窝。\n\n“瞧瞧你这一天天的……”母亲推门进入了他的房间。“不是在钻研那些稀奇古怪的玩意，就是和只大肥猫似的瘫在床上！这么下去你迟早得退化成菲林兽亲一个样，万幸我们还有你的詹金斯叔叔——他帮你谋了份差事。”\n\n“什么？”哈克尔还未说完整句话，一纸推荐信便被塞到了他手上。而母亲则继续说道：“哈克尔，你都毕业快两年了，也已经在家里捣鼓那些哥伦比亚人写的怪书快有两年了。真的不能这样下去，不然迟早要……”\n\n哈克尔快忘了这是母亲第多少次语重心长地劝他了，反正在无数次“磨砺”下，他已经练就了将他人话语视为无物的强大本领。少年拆开推荐信，打量着其中文字，他那位成功人士叔叔似乎贴心地附上了份向他说明用的纸条。“……‘仅在半个街区以外’、‘国营工厂工作’、‘食宿全包’？”读阅着纸条与推荐信上的内容，他的心中不禁闪耀出一束火花。而正是顺着这束火花的指引，他来到了那栋新建的政府办公厅。\n\n“呃……我来申请工作，女士。——是我叔叔詹金斯推荐的。”当队终于排到他时，哈克尔谨慎地对那位前台文员小姐说道。\n\n他将推荐信递给那位女士，而后者则叫来了一位谢顶严重的瘦削中年官员，那男人随即戴着哈克尔去了会客室。\n\n中年官员不知从何处掏出一个写字板及一支铅笔，并向哈克尔提出问题：\n\n“你有工作经验吗？”\n\n“唔……熟读幻想小说并擅长仿写算不算？”\n\n“你有犯罪前科吗？”\n\n“没有，一直是守法好公民。”\n\n“对工业技术有了解吗？”\n\n“我是读外语专业的。”\n\n中年官员一直在写字板上写写画画，而其眼镜则折射着窗外透进来的阳光。哈克尔望着他，心中充满忐忑不安。直到那官员露出一丝笑容，并说道："
 event_vwi.11.a: "“恭喜你被录取了，以文员的身份去工厂报道吧！”"
 event_vwi.12.t: "片刻小憩"
 event_vwi.12.d: "“我早就应该告诉你这一点：炮兵迟早是要过时的，坦克才是未来！而火炮？它们的真正职责在于支援而非作为主力的进攻矛头……”\n\n望着战友们的高谈阔论，无名的小宪兵埃琳纳不禁在内心深处将自己看作了如“引火者”般的角色。或许她就应该谈些人们喜闻乐见的话题，而非有关军事战术的？她脱下军靴，坐在整齐的床铺上，望着人们的争论。\n\n“这根本就是胡说！”另一个声音响起，反驳道先前那位“坦克主义者”的论调：“你这根本就是纸上谈兵，也不考虑考虑现实状况。仔细想想！在金融潮摧残后的这么多年，我们如今的工业能力真足够搞妮特纳你最爱的（维多利亚粗口）‘钢铁洪流’吗？稍有理性的人都明白，以火力洗礼敌人才是王道！”\n\n“你们都消停一会！”一位路过的男兵打断了争论：“火炮和坦克都是只有娘们才会在意的劣质兵器，我看它们遇上高速战舰都得趴窝。”\n\n“你又是哪位？”在一段时间的沉默后，人们异口同声。\n\n看着争论愈发激烈，埃琳纳只觉得自己待在这里大概只会愈发危险。趁着人们的争论，她悄然又穿上靴子，披上外套，离开了好似火药桶般易燃易爆的宿舍。“好吧！亏我还是个管纪律的宪兵，竟然连这种事情都抑制不住。”回望那疯狂的宿舍，埃琳纳内心五味杂陈。而她只是默默找了个台阶，坐下来翻看笔记本。\n\n翻开那笔记本的第一页，她不禁回想起了最初参军时的日子，以及自己在罗切斯特的故乡。“天哪，那都是多久以前的事情了？”模糊的记忆使她感到一丝伤感，而她也回想起了更多以往的事情：从幼时所见的伦蒂尼姆天际线、家乡的农田，甚至到这群没溜的战友……她正思考着无数事物。"
 event_vwi.12.a: "如同这个国家的千万新生代一样，她也尚处在迷茫之中。"
 event_vwi.13.t: "理论、战术及技巧"
 event_vwi.13.d: "“自完成射表修订以来，我们炮兵部队的命中率、杀伤性与机动性都大有改进，特别是其与步兵、坦克等其他兵种的协调能力……”\n\n望着台上那位汇报工作的秘书，乔什·钱德勒将军的喜悦于他面孔之上显露无遗。“你知道吗？很多时候，我最喜欢的就是这种在工作结束后验收成果的时刻。它总是让人感到……无比的满足。”钱德勒悄悄凑近坐在他右侧的哈珀·卡利登将军，面带春风地说道。\n\n“的确如此。”卡利登以手托腮，做出一个“思考者”般的动作。“但你要清楚：军事改革不是一蹴而就的，我们的路还长着呢。就比如说前几天司令部的会议——你还记得吗？”\n\n“当然啦。”钱德勒调整了下坐姿。“那场会议？我印象最深刻的就是人们关于军事学说的讨论，没记错的话，主要受到支持的两派应该是‘专注突破’和‘专注隐匿’。所以说，卡利登将军您提到这场会议是想讲什么呢？难不成是关于这两种学说的？”\n\n“正是。”卡利登言简意赅。“我想问的，是阁下对它们的看法。”\n\n“好吧，以我个人的角度来说，这两套学说自然是各有其优缺点，不能一概而论。专注突破的确听上去不错，但专注隐蔽也有其不可替代的优点，比如能够减轻我军在战事中的损失之类……”钱德勒侃侃而谈，却从未提及他事实上倾向于哪方的观点。\n\n“就我来看，还得是突破能力对于全面战略的意义更大。”卡利登没有等到乔什耗尽他的话匣子，便打断了那长篇大论。“战争的形态岁岁年年都在改变，但唯独不变的一点是：光凭防御永远无法取得彻底胜利，唯有推进和机动才是未来。”\n\n“您的确说得对。”乔什·钱德勒象征性地鼓了鼓掌。“在下也相当支持突破战略，但这事实上并不妨碍我依旧认为专注于阵地隐匿也有其好处……”"
 event_vwi.13.a: "军事上的中道主义？"
 event_vwi.14.t: "烈阳、铳弹，乃至更多混乱"
 event_vwi.14.d: "坐在远离人群的树荫下，埃琳纳不禁感叹她可算又有了点休息时间。坦白来说，最近几天被调过来监督这帮民兵纪律的日常工作虽难被称为“灾难”抑或更为糟糕的什么形容词，但至少也能以“一团乱麻”来形容。\n\n让埃琳纳来说，这帮民兵简直对纪律一词的了解大概仅限于其拼写，好吧——如果不算上那几位文盲的话。她还在原本部队时的战友们虽说难以达到古拉刻代蒙人一般的军纪，而且同样有一些“我行我素”分子……但至少，他们的数量没有如这里一般夸张。翻开笔记本中最近几天的内容，埃琳纳只感到不堪回首。\n\n某位担任工兵的仁兄不知为何一直试图拿锤子砸开空炮弹；一个看起来很神经质的“业余参谋”大谈通过披甲驮兽与机关铳兵组建她心目中的“低配版坦克”……至于那些穿着半点军人样都没，反倒是像出门聚餐的哥伦比亚人的家伙，埃琳纳对此更是无以形容。\n\n“这地方绝对难找到一个正经人……”合上笔记本，她轻声嘟囔道。\n\n“哈哈，的确如此啊！”出乎埃琳纳意料的是，她的窃窃私语竟然有人听到，还得到了回答。而更叫她吃惊的是，这声音似乎还出自位年轻男性，甚至还大有可能是和她同属宪兵部队的同僚。\n\n“呃……请问？”埃琳纳缓缓站起，打量着四方，试图找到那声音的来处。可在找到之前，一只温暖的手便触碰到了她肩膀。埃琳纳恍然转身，身前之人的面孔她虽难称之为熟悉，但也算是有着不少印象。“安德鲁？没想到你也发现了这处好地方。”她笑了笑，轻轻从地上捡起一颗野果。\n\n“感谢你记得我的名字。”那年轻的士兵回以一个微笑。“我们上一次碰见怕不是还在刚入伍的时候——我还记得那时候是我在食堂让给你了个位置。”\n\n“可以，这的确很有我们国家传统的绅士风度。”埃琳纳重新披上外套，在顺眼看了下不远处的钟楼，那指针的位置正暗示着她接下来应当去做些什么。“——看上去休息时间应该快要结束啦，我们是不是也应该做好集结准备了？”"
 event_vwi.14.a: "“也许吧。”"

 event_vwi.10001.t: "不得暂歇"
 event_vwi.10001.d: "“变形者集群目前已经在持续火力压制下撤退，我们现在拥有一个短暂的窗口，可以让我们与诺伯特区对接。但是诺伯特区在设计时没有与陆行舰对接的需求，所以要派遣工程部队建造一个临时泊位。”哈珀·卡利登念完报告，抬眼看了看伫立在舰桥前的温德米尔公爵，自从收到戴菲恩的明码通讯以来，公爵就没有休息过。\n\n“阁下，营救行动到这一阶段已经算是成功了……我想您应该去休息片刻。这不是参谋报告，只是……我作为下属的建议。”\n\n“告诉我，参谋部计划用哪艘陆行舰去接收难民。”温德米尔公爵冰冷而威严的声音传进耳朵里，哈珀·卡利登没有看到她转过身来，也看不到她的表情。\n\n“呃，马尔科姆号和科德灵顿号，先后对接，将难民撤离至最近的定居点……”\n\n“否决。让旗舰去。”哈珀·卡利登以为自己听错了，一分钟后，没有得到回应的温德米尔公爵扭头看向她，坚定的眼神让她确认公爵没有开玩笑。\n\n“那两艘比装甲车大不了多少的驱逐陆行舰能装得下几万难民吗。只有‘全能’号做得到这一点。”\n\n警报不合时宜地突然响彻舰桥，防空人员喊叫着通报“不明飞行物”来袭。而哈珀·卡利登能够直接从舰桥的落地窗看到，那根本不是什么不明飞行物。数枚被诡异的红光环绕着的“炮弹”，正沿着变幻莫测的路线，朝舰桥飞来。“全能”号上的高射炮已经开火，但近炸引信的烟尘被红光甩在身后。\n\n制导火箭的技术明明还不够成熟，萨卡兹是如何掌握这种技术的——除非用上法术。红光已经近在咫尺，哈珀·卡利登甚至可以看到，那只是几个绑着推进器的高爆炸弹。她冲上前去，在军官学校受过的教育，告诉她此时要尽力保护长官的安全。而安费莉丝·温德米尔，只是回身将哈珀·卡利登一把推开。\n\n舰桥发生了剧烈的爆炸，连站在城墙上遥望舰队的格拉斯哥帮与难民都能听到那声巨响。哈珀·卡利登在耳鸣中艰难地站起来。她看到温德米尔公爵面朝下倒在灰烬中，一块巨大的钢板直插在她的腰上。她踉跄地跑过去，抓住了公爵的手。"
 event_vwi.10001.a: "那只手完全失去了力量。"
 event_vwi.10001.b: "那只手勉强地握住了她。"
 event_vwi.10002.t: "后继之人"
 event_vwi.10002.d: "“让我进去！”把守在舰桥入口的军官堵在戴菲恩面前，刚才他的胃被戴菲恩砸了一拳，幸好他穿着战术背心，避免了把午饭呕在戴菲恩脸上。推进之王和罗德岛的那个小兔子站在戴菲恩身后，装模做样地拉住她的手。谁都看得出来她们不是真的在拉人。\n\n“小姐，这是代理参谋长钱德勒将军的命令……”参谋部本来打算秘不发丧，毕竟除了舰桥里的人和几个高级将领，没有人知道具体的伤亡情况。如果温德米尔公爵的死讯传开来，无论是对军队士气还是控制区内的稳定，都没有什么好处，对她唯一的继承人也是。只是他们都没想到，戴菲恩会在看到爆炸后，直接用尽一切手段奔向冒着浓烟的“全能”号。\n\n“我是公爵还是你是公爵？别再叫我‘小姐’！”戴菲恩甩开推进之王的手，一步上前，指着军官的鼻子，“我命令你，给我把门打开。”\n\n军官的背后冒出一层冷汗。在他的印象中，戴菲恩还是在丽茵卡登的那个稚气未退的少女，他不知道伦蒂尼姆给戴菲恩带来了什么。但是理智提醒他，不去违抗这条命令是正确的，毕竟在法理上，眼前的女孩已经不再是公爵的继承人，而是公爵本人。\n\n军官侧身让道，舰桥的铁门也被里面的士兵推开——自动门的电路同样在爆炸中受损。几个医生在舰桥中央做着徒劳的抢救，尽管安费莉丝·温德米尔在几分钟前已经宣告死亡。戴菲恩缓步向前，看到她走进舰桥，医生们不自觉地停止了手上的动作，好像抢救的表演性质还不够浓似的。\n\n“我的母亲……她的死因是什么。”戴菲恩的语气诡异的平静，尽管在这种情况下任何表现都是正常的。\n\n“一开始，我们以为是腰腹部的伤口导致的失血过多……”一个年轻医生张开口，说到一半，他抬头看了看戴菲恩和其他同事的眼神，之后鼓起勇气继续说下去，“但是仔细检查后我们发现，爆炸的冲击力……扭断了她的颈椎。公爵大人一开始就没有生还可能。”\n\n“谢谢你，医生。”戴菲恩点了点头，然后沉默。舰桥内没人敢发出声音，从戴菲恩抽动的嘴角，每个人都知道她还有话要说。不知道过了多久，医生们因心肺复苏造成的手臂酸痛开始消退时，戴菲恩的声带才重新振动。"
 event_vwi.10002.a: "“我能抱抱她吗？”"
 event_vwi.10003.t: "回到丽茵卡登"
 event_vwi.10003.d: "戴菲恩从未像今日一样感到自己的无能和无助。她亲眼目睹了母亲的旗舰被击中舰桥，那里是母亲最常待的地方，远多于藏在层层装甲后的舰长室。她乘坐罗德岛的直升机在“全能”号上降落，而像只无头苍蝇的她甚至找不到舰上的医院在哪。\n\n她知道自己总有一天要接过责任，但她不希望那一天来得那么早。所幸，舰上人员告诉她去医务舱找温德米尔公爵，而不是去停尸房，所以她还可以把希望寄托在医疗人员的双手上。\n\n哈珀·卡利登站在医务舱入口，头上裹着绷带。对瓦伊凡来说，长着一对角非常影响头部包扎，但是连角也一起包起来着实有些过分。她可以看出来，正在记录她口述部署的那名军官，正在憋笑。\n\n“卡利登将军！”一个少女的声音叫住了哈珀·卡利登，她扭头看向走廊另一端，公爵的女儿居然已经登船，她迅速地回了个军礼。\n\n不过戴菲恩似乎没有回礼的心思，她喘着粗气跑到哈珀·卡利登跟前，“我的母亲……温德米尔公爵……她怎么样？”\n\n“爆炸时，我就在她身边。我们把她送过来时，她的意识是清醒的。但是伤口有些严重……”哈珀·卡利登侧身引着戴菲恩走进医务舱，“我想医生们不会让你再往深处走。”\n\n戴菲恩没有回应，她当然知道手术是怎么进行的——她以为自己知道。医务舱里躺满了哀嚎的伤员，舰桥的爆炸显然不可能只伤到一人，但戴菲恩在伦蒂尼姆见到过更惨的景象。她以为自己能忍受。\n\n陆行舰上的急救室并不像医院，是全面封闭的，墙上留着一扇玻璃窗，以便在外面忙活的医疗兵看到里面的情况，至少让家属探视不是这个设计的初衷。戴菲恩看到温德米尔公爵腰上那个可怕的撕裂伤，以及氧气面罩后那一张苍白的脸。战地医疗当然不可能使用安全的麻醉剂，而戴菲恩知道，自己的母亲肯定会拒绝使用吗啡。\n\n侧着脸躺在手术台上的温德米尔公爵似乎是看到了玻璃后方的那张脸，剧烈咳嗽起来，几个护士瞬间手忙脚乱，而戴菲恩也识趣地蹲下，从窗后消失。她知道自己的担心是徒劳甚至是有害的，但她无法控制自己的脚步，更加无法控制自己的泪腺。\n\n一个护士从急救室里走出来，没等戴菲恩开口，她便平静地说道，“公爵大人坚持要我把这句话告诉你。噢，请放心，这不是什么遗言。”"
 event_vwi.10003.a: "“‘我们现在可以回家了。’”"
 event_vwi.10004.t: "有罪推定"
 event_vwi.10004.d: "温德米尔集团军的主力陆行舰队正在全速向东行进。距离推进之王以及格拉斯哥帮的其他人不辞而别，已经过去了数日，与他们一同消失的还有“灰礼帽”特别战术行动组和罗德岛制药的全部人员。即使是普通的士兵，都能猜到发生了什么。\n\n丽塔·斯卡曼德罗斯小心翼翼地叩响舰长室的门，戴菲恩·温德米尔已经把自己锁在这个古典主义装潢的屋子里好几天了。她在作战会议等需要她出席的场合会短暂离开，至少证明这个女孩没有因为母亲去世和好友背叛的双重打击一蹶不振，但也仅此而已。\n\n“请进。”戴菲恩平静得诡异的声音传来，丽塔轻轻推开了房门。温德米尔公爵的纹章摔碎在地上，而戴菲恩却像没事人一样，调配着她的下午茶。\n\n“阁下，我们在救助难民的过程中发现了一样东西。您可能会对它感兴趣。”丽塔一边说着，一边警惕地看着戴菲恩的眼睛，在确认对方的眼神是真的感兴趣后，丽塔从背后拿出了那个黑匣子。\n\n“典范军的军事识别码，一个难民交给我们的。您应该知道这支部队的事迹，阁下。”\n\n“当然，斯卡曼德罗斯将军。一支传奇部队，你们第二集团军曾经的王牌。”戴菲恩的脸上浮现出微笑，这是丽塔这些日子里第一次看见戴菲恩出现情感波动，“比起在与高卢的战争中的英勇事迹，他们在处死老国王的那段时间更出名。唯一一支响应革命的部队，也因此大公爵们被撤销番号，对吗？”\n\n“是的，这也是这个黑匣子珍贵的原因。典范军的所有识别码都被销毁了，但这个黑匣子却因为被遗忘在战场上，反而留存到了今天。”\n\n“斯卡曼德罗斯将军，你的确给了我所需要的。”戴菲恩站起身，走上前接过黑匣子，“我这些天一直在思考，王室和贵族的存在有什么意义？”\n\n“我的母亲以生命为代价拯救了王室，贵族的身份给我带来的不是享乐，而是更多的麻烦。我本人尚且如此，你知道我在伦蒂尼姆城里看到了什么吗。”丽塔不自觉地点头，虽然她身上同样流淌着贵族的血液，但作为军人，她清楚人与人之间的血液没有什么不同。\n\n“典范军的名义，来得正是时候。”戴菲恩的嘴角从微笑变成大笑，甚至看起来有些癫狂，“传我的命令，边防集团军、第一集团军和第二集团军之后统一将部队名称改为新典范军，把这个军事识别码复制并下发。持有反对意见的人都给我关起来。”\n\n“贵族犯下的罪已经够多了。包括我自己。”"
 event_vwi.10004.a: "我为了不让你们这样的人继续玩弄他们的生命，站在这里。"
 event_vwi.10005.t: "天意之囚"
 event_vwi.10005.d: "戴菲恩抬脚跨出熟悉的浴缸，熟练地披上放在手边的浴袍。母亲对她的宠溺居然成了未雨绸缪，温德米尔公爵从丽茵卡登为戴菲恩带来的个人用品和家具，如今成为了“全能”号舰长室里全新的装潢。\n\n根据安费莉丝·温德米尔公爵的遗嘱，她唯一的女儿，戴菲恩·温德米尔，将继承她全部的遗产和贵族头衔。但政治影响力和在军队中的威望并不能写在遗嘱中。丽塔·斯卡曼德罗斯、乔什·钱德勒、哈珀·卡利登……总参谋部的将军们倒是重申了对戴菲恩继承人地位的支持，但对于那些地方贵族来说，情况就不一样了。\n\n一阵敲门声响起，戴菲恩很惊讶在晚上的这个时间还有人拜访。她简单将头发裹起，然后拉开了舰长室的门。推进之王抱着用破布裹着的诸王之息，站在门口。\n\n“维娜……抱歉，我应该整理得更好一些……”戴菲恩的脸瞬间红了，她小跑着躲到屏风后，换上正装。戴菲恩对推进之王的情感如今是一个复杂的状态，推进之王是她的朋友和战友，但维娜·维多利亚，是她法理上的君主。\n\n“我要把诸王之息交给开斯特公爵了。”仿佛是预料到戴菲恩之后会震惊地探出脑袋，维娜紧接着说道，“她的旗舰上安装有对抗源石潮的武器，而诸王之息是它的启动密钥。”\n\n“噢，没问题的，不就是根破铁条吗，像你说的。”戴菲恩嘴上不在意，但心里仍有些恍惚。她知道这把剑是牺牲了多少东西得来的。\n\n“公爵领的情况怎么样。”推进之王唐突地转向下一个话题，这令戴菲恩有些摸不着头脑。\n\n“曼宁子爵今天发来急报，冯提尔侯爵已经率领他的领地宣布自立，得到了当地民兵和驻军的响应。由于他们的领地挨着，曼宁子爵希望我派人去救她。”戴菲恩叹了口气，走到维娜面前的沙发上坐下，“这种事情在领地内部肯定还会发生……你为什么站着？”\n\n“我和那个‘灰礼帽’约定，明天让他把诸王之息带走。所以我要在今晚，让这根破铁条最后一次履行它在礼仪上的责任。”维娜·维多利亚微笑着，拿去了裹在诸王之息上面的破布，露出了剑身上的寒芒，“我们都是命运的囚徒，戴菲恩。”\n\n戴菲恩·温德米尔意识到了推进之王要干什么。她面色沉重地整理了身上的披风，然后走到维娜面前，单膝跪地，低下头颅。她感觉到诸王之息寒冷的气息出现在她的肩头。"
 event_vwi.10005.a: "“戴菲恩·温德米尔，以维多利亚女王的名义，朕正式册封你为温德米尔公爵……”"
 event_vwi.10006.t: "自愿原则"
 event_vwi.10006.d: "“阁下，我本来准备了一份慰问信，准备亲自宣读。不过我认真想了想，我还是以‘戴菲恩的朋友’这一层身份来探望您比较好。”推进之王与格拉斯哥帮的其他几个人挤在病房的长椅上，这张椅子也是临时搬进来的。虽然坐着不是很舒服，但推进之王的脸上依然保持着礼貌的微笑。\n\n“维娜殿下，你我都是聪明人，客套话就免了吧。”温德米尔公爵的脸色依然苍白，但锐利的眼神让人感到些许宽慰，边疆的银剑还没到倒下的时候。\n\n“你清楚站在我们这一方意味着什么。开斯特公爵和她背后的王族旁支必然会中断对你们的支持，塔拉人和共和主义者对你们的恨意也只会增不会减。”公爵握住了坐在病床边的戴菲恩的手，眼神未从推进之王的脸上移走，“而我也并不是什么无私之人。我会要求你公开露面，为我们组建的临时政府提供合法性。你的自由将会受到约束，不仅仅是为你的安全，同时也是对你所代表的政治影响力的限制。”\n\n“我完全清楚，公爵阁下。不如说，您至少愿意开诚布公地说出这些话，已经胜过其他贵族太多。”推进之王依旧微笑着，她从小到大接受的教育就是为了这种场景预设的。\n\n“戴菲恩建议我这么做的。她告诉我，你不喜欢隐瞒。”温德米尔公爵笑笑，“你在伦蒂尼姆城里也应该听到过各种传言。我们的确是某种形式的‘军政府’，在平定局势时的手段并不怎么光彩。但是请你相信，我结束维多利亚混乱局面的心愿，绝对是真实的。”\n\n“您的爱国热情我从未怀疑。只是我还有个请求。”推进之王看了看身边坐着的战友，“我的朋友们并不是王室，至少她们的行动没必要受到限制。”\n\n“没问题。即使您不主动提出，我也不会监视她们。看在戴菲恩的份上。”温德米尔公爵郑重地点头。"
 event_vwi.10006.a: "“那接下来讨论一下加冕仪式的问题吧。”"
 event_vwi.10007.t: "家庭教育"
 event_vwi.10007.d: "自从医生确认温德米尔公爵可以离开病房起，“全能”号的战情室就恢复了往日的繁忙。戴菲恩坐在母亲的办公桌旁，看到一个又一个电话从不同的座机打进来，她见过和没见过的军官来到母亲面前言语几句便转身离开。维娜的不辞而别造成了巨大的政治涟漪，临时文官政府对合法性本人的离去感到失望，几个不安分的地方贵族借机向温德米尔公爵要价，即使是最忠于公爵的集团军内部，军官和士兵们的士气也遭受了打击。\n\n“戴菲恩。”母亲的呼唤将戴菲恩的思绪拉回现实，她抬头看见参谋们正在依次离开舱室，原来是到午餐时间了，只有几个负责监视和监听的技术人员需要留守。怪不得母亲有时间和自己说话。\n\n“你会恨我吗？”\n\n母亲紧接而来的提问让戴菲恩感到一阵晕眩，她从来没想象过这样的对话发生在自己身上，所以嘴边不存在任何预设回答。\n\n看到戴菲恩呆在原地，安费莉丝·温德米尔叹了口气，接着说道，“事到如今，你还觉得我把你送去伦蒂尼姆，就是为了让你和公主交朋友吗。你是个敏锐的孩子，你不可能真的只想这么多。”\n\n“无论你是否愿意，当你获得了一个身份，这片大地就会将你塑造成符合这个身份的模样。”安费莉丝·温德米尔环视着这间装满显示屏和监控设备的战情室，苦笑一声，“和其他公爵一样，我也有野心。当你从我手中接过温德米尔公爵的使命，我的孩子，你也会的。”\n\n“政治就是如此卑劣。但同时它也是高尚的。如果成功笼络到王室的支持，我可以利用军事和政治上的双重优势，赶跑萨卡兹，平定另外几个拥兵自重的大公爵，结束维多利亚的分裂状态，挽救数千万人的生命。”\n\n“代价就是，我的野心会让我变成一个独裁者，并且无数人会在这一征途中倒下。”\n\n温德米尔公爵站起身来，下意识扶了一下腰上的伤口，显然那里还没有完全恢复，“我本来不想太早告诉你这些东西，但是维多利亚已经变成了今天这个模样，我觉得，你还是尽早知道这片大地的肮脏为妙。趁着你还在我身边的日子。”"
 event_vwi.10007.a: "“现在，和妈妈去吃午饭吧。”"
 event_vwi.10008.t: "必要手续"
 event_vwi.10008.d: "亚历山德莉娜·维娜·维多利亚的加冕仪式在“全能”号的甲板上举行，在那场袭击中被损毁的舰桥已经完成了初步修复，但被爆炸染黑的部分仍然来不及重新上漆，因此一面巨大的维多利亚国旗从舰桥顶端垂下，完全遮住了那个丑陋的伤疤。\n\n没有游行，没有唱诗班，没有神职人员，没有王座，没有王冠、宝球和权杖，那些代表王室权力的珍品全都在伦蒂尼姆的硝烟中散佚，仪仗队、唱诗班以及其他带不走的东西则留在了那座混乱的城市。鸣响礼炮是为数不多能够执行的流程，62发礼炮从野战炮中发出，这本来不是它们被设计的目的。音乐则是从最近的大城市，伯尔米努姆临时征用了几套音响设备，播放由维娜本人挑选的几首古典音乐的数字版，她挑选的摇滚乐则全部被否决了。除此之外，这里只有一整支肃穆的军队，和一个国王。\n\n维娜穿过挂着装饰的舰炮组成的直道，两侧是穿着野战服装的持枪士兵组成的“仪仗队”。每一个细节都在提醒维娜，这片大地正笼罩在战争的阴云下。\n\n当维娜走到那个临时搭起来的高台上，剩下的流程便简单得多了。她只需要面向台下的军队和公民代表宣读百年来未曾变动的誓言，随后便可以在那个随便找来当王座的椅子上坐下，等待贵族的代表下跪并亲吻她的右手。\n\n戴菲恩·温德米尔，新一代温德米尔公爵，第一个走到王座之前。她单膝下跪，高声对维娜宣誓效忠，然后上前亲吻了女王的右手。\n\n“这个流程还要多久？”维娜低声对戴菲恩说，反正城际电视直播的麦克风不允许放那么近，也没有人在战争时分闲着没事读她们的唇语。\n\n“你再忍忍。我后面还有好几个人。”"
 event_vwi.10008.a: "这甚至还是简化了的流程。"
 event_vwi.10009.t: "必要手续"
