 VWI_parliamentary_dominant: "议会主导"
 VWI_presidential_system: "总统制"
 VWI_Avalon_stands_above_the_earth: "阿瓦隆立于大地之上"
 VWI_Lord_Protector_Delphine: "护国公戴菲恩"
 VWI_expand_the_powers_of_police: "扩大警察职权"
 VWI_focus_on_war_deployment: "专注战争部署"
 VWI_respond_to_public_concerns: "回应民众关切"
 VWI_promote_the_spirit_of_democracy: "宣传民主精神"
 VWI_promote_leader_worship: "鼓吹领袖崇拜"
 VWI_keep_calm_and_carry_on: "保持冷静，继续前进"
 VWI_continue_the_rationing_system: "继续配给制度"
 VWI_strengthen_rear_control: "加强后方管制"
 VWI_form_civilian_government: "组建文官政府"
 VWI_preparation_of_new_local_council: "筹备新地方议会"
 VWI_unified_management_of_military_factories: "军工厂统一管理"
 VWI_proportion_of_military_representatives: "军队代表比例"
 VWI_all_seats_are_open: "开放所有席位"
 VWI_compensation_for_private_enterprises: "补偿民间企业"
 VWI_proclaim_the_Provisional_Government: "宣称临时政府"
 VWI_restoration_of_the_domestic_market: "恢复国内市场"
 VWI_the_silver_sword_stands: "银剑屹立不倒"
 VWI_Siege_returns: "推进之王归来"
 VWI_eliminate_hostile_guerrillas: "清剿敌对游击队"
 VWI_general_Staff_program: "总参谋部计划"
 VWI_recognition_of_trade_union_status: "承认工会地位"
 VWI_control_of_trade_unions: "控制工会"
 VWI_alleviate_war_weariness: "缓解厌战情绪"
