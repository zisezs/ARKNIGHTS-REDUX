#民族精神
 VWI_military_debuff_idea: "指挥链路混乱"
 VWI_military_debuff_idea_desc: "第一次联合进军的失败，对维多利亚的军队来说是毁灭性的。在萨卡兹入侵后直接听命于公爵议会的部队如今失去了指挥，只能向距离最近的公爵寻求庇护，而温德米尔公爵麾下的边防集团军虽然保持了指挥体系的基本完整，然而在短时间内接收了一大批投奔的部队后，指挥链路也陷入了严重的混乱之中，无法有效执行任何作战计划。"
 VWI_politics_debuff_idea: "王冠蒙尘"
 VWI_politics_debuff_idea_desc: "阿斯兰王室的最正统继承人，亚历山德莉娜·维娜·维多利亚，目前下落不明。而联合进军失败后的维多利亚再次分裂，社会的不安和混乱局面只会不断加剧。当务之急是寻找到失踪的公主殿下，让维多利亚看在公主殿下的份上，平静下来。"
 VWI_economy_debuff_idea: "经济隔断"
 VWI_economy_debuff_idea_desc: "维多利亚当前已经实质上进入分裂状态，各大公爵以邻为壑，拒绝一切商贸往来，维多利亚的产业链在一夜之间便不复存在，经济陷入完全的瘫痪。温德米尔边防集团军控制的区域内，除伯尔米努姆-科文提亚这一座工业移动城市集群可以维持自身运转之外，其他的城市和乡村都面临严重的产品短缺，经济秩序已经处于崩溃的边缘。"
 VWI_military_buff_dynamic_modifier: "边疆银剑"
 VWI_military_buff_dynamic_modifier_desc: "温德米尔边防集团军是面对莱塔尼亚势力圈的第一线，目的是提防前盟友的突然袭击，只不过边防集团军眼前最紧迫的任务是让破碎的国家重归一统。由于面对的是莱塔尼亚数量众多、密度极大的法术防御塔，温德米尔边防集团军的战术和编制都围绕火炮进行设计，寻求通过压倒性的凶猛火力，摧毁敌人的防御，伺机突破敌军防线或建立不可逾越的防线。"
 VWI_military_buff_idea: "$VWI_military_buff_dynamic_modifier$"
 VWI_politics_buff_dynamic_modifier: "救国政府"
 VWI_politics_buff_dynamic_modifier_desc: "“无论其他的公爵或军阀如何粉饰自身，也改变不了他们在国家危难关头争权夺利的国贼本色，只有温德米尔公爵组建的救国政府是真正为维多利亚而战的政府。”\n\n无论这一政治宣传是否属实，丽茵卡登目前确实聚集起了一众政客和野心家，以及不计其数的相信宣传口号的平民，共同将维多利亚的命运放置在温德米尔的战车之上。"
 VWI_politics_buff_idea: "$VWI_politics_buff_dynamic_modifier$"
 VWI_economy_buff_dynamic_modifier: "经济紧急状态"
 VWI_economy_buff_dynamic_modifier_desc: "通过宣布经济进入紧急状态，国家分裂导致的经济混乱得到了有效控制，同时丽茵卡登城内的决策者也可以更加顺利地推行其经济政策和计划，不受到任何地方议会或企业所阻挠。毕竟，没有人愿意为了眼前的一点蝇头小利，选择增大自己在内战中死亡的概率。"
 VWI_economy_buff_idea: "$VWI_economy_buff_dynamic_modifier$"
