#国策
 VWI_the_bell_rings: "钟声响起"
 VWI_consolidate_situation_front: "巩固前线形势"
 VWI_consolidate_situation_front_desc: "随着维多利亚帝国沦为一盘散沙，我们必须做好最坏的打算。在接下来的数周内，我们将重整伦蒂尼姆边境的防务，修缮碉堡、挖掘战壕、派遣驻军，并把各个离散且混乱的区域性指挥机构重新整合至边防集团军司令部的领导之下。"
 VWI_Aslan_reappears_world: "阿斯兰重现世间"
 VWI_Aslan_reappears_world_desc: "毫无疑问，亚历山德莉娜·维娜·维多利亚是帝国无可争议的继承人。但仅凭她一人就想要恢复整个维多利亚的稳定，在如今的局面下显然是不可能的。同样的，我们也需要一位“阿斯兰”，来帮助我们在这庞大而分崩离析的帝国中获得比其他公爵们更多的支持。"
 VWI_stabilize_situation_rear: "稳定后方局面"
 VWI_stabilize_situation_rear_desc: "维多利亚内战的阴云正步步逼近，公爵领边陲的局势也日益紧张。在这种情况下，确保后方的秩序便尤为重要。也就是说，边防军政府不能仅仅专注于军队的重组工作，更要着手扩编各地的政务管理机构。"
 VWI_small_characters_chessboard: "棋盘上的小角色"
 VWI_small_characters_chessboard_desc: "在可预见的全面战争中，目前被大多数人所轻视的小公爵与地方军阀将会发挥重要作用。他们既可以被用作主动进攻时的马前卒，也可以在被动防御中充当炮灰。既然拉拢他们百利而无一害，我们又何乐而不为呢？"
 VWI_infantry_division_expansion: "步兵师扩编"
 VWI_infantry_division_expansion_desc: "在目前的非常情况下，我们必须向征兵机构调拨更多行政经费，大规模地招募士兵、扩编部队。"
 VWI_concentrated_use_of_artillery: "炮兵集中运用"
 VWI_restore_operation_military_industrial_complex: "恢复军工企业运转"
 VWI_keep_distance_Rhode_Island: "与罗德岛保持距离"
 VWI_keep_distance_Rhode_Island_desc: "尽管罗德岛作为一家“制药公司”，展现出了一流的素质和专业能力，在第一次联合进军期间也给我们提供了许多助力，但我们仍要注意它作为外来势力的本质。或许与其只进行有限度的接触才是正确的决定。"
 VWI_enable_Delphine: "启用戴菲恩"
 VWI_enable_Delphine_desc: "戴菲恩曾在诺伯特和伦蒂尼姆开展过情报工作，得到了一定的历练。同时，她与曾在伦蒂尼姆帮助过我们的罗德岛制药也有所联系。而更重要的是，她是温德米尔公爵的唯一子女。从各个方面来说，都是时候让她也正式进入到我们的队伍中来了。"
 VWI_provisional_Military_Control_Council: "临时军管委员会"
 VWI_provisional_Military_Control_Council_desc: "当维多利亚陷入箭弩拔张的准内战状态时，和平时期的文官制度便失去了其效用。为了确保公爵领各地的基本秩序，我们必须将管理权暂时委任给边防军的将领们，并成立一个临时军事管制委员会来统领大局。若拒绝这么做，东盎格兰必将滑入无序的深渊。"
 VWI_maintain_production_of_essential_goods: "维持必需品生产"
 VWI_maintain_production_of_essential_goods_desc: "紧握在手中的食物与日用品，是民众对温德米尔公爵大人的信任底线。假若温德米尔公爵大人失去弥足珍贵的公信力，边防军政府便会在可预见的未来之内濒临垮台。因此，无论工业产能有多么紧张，我们都应确保生活必需品的足量生产。这样一来，它们才有可能被按时按量地分发给有需要者。"
 VWI_full_mobilization_of_industry: "工业全面动员"
 VWI_full_mobilization_of_industry_desc: "三班轮作、昼夜不停，我们必须将每座工厂所提供的产能利用到极致，维多利亚帝国的全体公民都必须胸怀爱国之心超额工作，让边防军政府的军工机器进入全功率运转状态。只有如此，边防军政府才能在即将到来的乱世中生存下去。"
 VWI_artillery_support_theory: "炮兵支援理论"
 VWI_maintain_authority_academy: "大炮兵主义"
 VWI_transfer_Lentinium_politicians: "转移伦蒂尼姆政客"
 VWI_transfer_Lentinium_politicians_desc: "在伦蒂尼姆失去秩序后，绝大部分的政府人员都被困在了城中。换句话说，在其他公爵还没关注到他们前，只要我们能将他们从混乱中带离，他们也能够成为我们的助力之一。"
 VWI_expansion_research_institutes: "研究机构扩张"
 VWI_expansion_research_institutes_desc: "在维持军力优势的同时，我们也必须确保边防军的军工科技水平领先于其他军阀集团。正是考虑到了这一点，温德米尔公爵才决定为现有科研机构提供充足的行政拨款，并面向全国扩招更多科研人员。毕竟，崭新的科学技术同样可以引领我们走向胜利。"
 VWI_issuance_temporary_currency: "发行临时货币"
 VWI_issuance_temporary_currency_desc: "在如今的危急时刻，帝国旧有的货币——也就是维多利亚镑，已经彻底失去了其信用。为了确保基本经济秩序，我们必须发行由边防军政府担保的临时货币。回收旧币、印刷新币、再争取金融界的认可，这会是一项艰难的工程。但如果我们想要让资本主义市场机制恢复运作，就没有其他选择可言。"
 VWI_distribution_ration_vouchers: "发放配给券"
 VWI_distribution_ration_vouchers_desc: "发放配给券是下下之策，却是我们在非常时期的最佳选择。它可以保证每一位公民都能领取基础的吃穿用度，也能为军工生产线节省足够多的冗余资源。虽然财政统制政策在长期看来确实是低效而笨拙的，但考虑到帝国内战已经一触即发，还是让自由主义学者和他们的那套经济理论都见鬼去吧。"
 VWI_investment_less_developed_regions: "欠发达地区投资"
 VWI_investment_less_developed_regions_desc: "在并不遥远的过去，东盎格兰的一部分偏远地区从未得到伦蒂尼姆的青睐，故而长期没有显著发展。但在眼下的紧要关头，每一寸土地都显得弥足珍贵，而这些欠发达地区同样应该得到高效的利用。我们将向那些地块输送大笔投资，修缮基建、兴建工厂，改善当地的经济状况。"
 VWI_construction_military_facilities: "军用设施建设"
 VWI_construction_military_facilities_desc: "经过维多利亚帝国政府多年以来的绥靖与忽视，东盎格兰地区的大批军用设施已经年久失修，或是完全无法重新投入使用。但如今的局势却击碎了光荣和平的迷梦，而我们必须为大规模军事冲突做好准备。这项工程的第一步，便是批量修缮与建设边防军政府辖地内的军用设施。"
 VWI_regrouping_Sarkaz_soldiers: "整编萨卡兹士兵"
 VWI_make_shooting_table: "制订射表"
 VWI_Armstrong_Whitworth_Group: "约瑟夫-米切尔集团"
 VWI_refugee_relief_act: "难民救济法案"
 VWI_refugee_relief_act_desc: "在帝国四分五裂之后，无数的丢掉了工作的人们随之涌上街头，成为了迫在眉睫的社会问题之一。我们稳定民心所要做的第一件事，就是保障好他们的基本生活。"
 VWI_asset_protection_act: "资产保护法案"
 VWI_asset_protection_act_desc: "维多利亚的精英阶层一直是帝国的栋梁，但在混乱蔓延开来后，无数的企业主和中产阶级开始担心他们的财富被付之一炬。如需确保他们对我们的支持，就必须保护好他们视若生命的财产。"
 VWI_fight_black_market: "打击黑市"
 VWI_fight_black_market_desc: "无论是囤货居奇还是走私变卖，任何非官方交易行为都会对我们本就脆弱的经济体系造成严重打击。我们必须成立专门专业的管理队伍，对一切形式的地下黑市展开彻底清除。那些投机商们终将意识到一件事——发国难财只会赚取射入胸膛的子弹。"
 VWI_improve_transportation_network: "完善运输网络"
 VWI_securing_industrial_electricity: "确保工业用电"
 VWI_securing_industrial_electricity_desc: "在维多利亚帝国陷入混乱后，原有的输电网络已经变成了一团乱麻。短路、跳闸和间歇性断电时刻威胁着工厂的持续运作。为了更为长远的利益，我们必须暂时牺牲民用输电，优先确保工业——尤其是军事工业的稳定用电。"
 VWI_position_infiltration_team: "阵地渗透小组"
 VWI_breakthrough_ability_training: "突破能力训练"
 VWI_hidden_position: "阵地隐匿"
 VWI_asymmetric_air_control: "非对称制空"
 VWI_respect_workers_demands: "尊重工人诉求"
 VWI_respect_workers_demands_desc: "一旦温德米尔公爵失去了工人群体的支持，武器生产线将会立即停摆，消费品供给也会捉襟见肘，而罢工与抗议的浪潮将在短时间内摧毁边防军赖以维系的群众基础。因此，无论我们是否情愿，边防军政府必须尊重无产阶级的诉求。无论是提高津贴还是改善安全标准，只有确保他们的权益，才能确保内战的胜利。"
 VWI_prisoner_Labor_Corps: "囚犯劳动团"
 VWI_prisoner_Labor_Corps_desc: "考虑到日渐紧张的局势，我们必须杜绝一切对物资的浪费——包括供养监狱里的人渣和败类。从现在开始，囚犯们将被批量编入劳动改造营，组装武器、挖掘工事、开采矿物，成为免费且优秀的劳动力。这既是为了他们好，也是为了我们好。"
 VWI_agricultural_microcredit: "农业小额贷"
 VWI_agricultural_microcredit_desc: "维多利亚全境陷入混乱后，农业生产遭到了惨重的打击。一部分农民的储粮与种子遭到军队强征，另一部分农民的土地更是直接被地方政府所剥夺。为了改善这种情况，我们应该尽快授权银行设置农业专项小额贷款，确保农民们能挺过这段青黄不接的艰难时期。"
 VWI_expanding_light_weapons_production_capacity: "扩大轻武器产能"
 VWI_expanding_light_weapons_production_capacity_desc: "坦克、飞机、大炮与高速陆行战舰都可以将我们引向军事上的辉煌，但前线的普通士兵和他们手中的一杆杆步枪才是温德米尔公爵的致胜基石。在接下来的一段时间内，我们将把军工产能更多地向轻武器领域倾斜，确保每一位步兵都能领到他们的武器。"
 VWI_focus_on_artillery_production: "专注火炮生产"
 VWI_focus_on_artillery_production_desc: "古人曾言，胜利之神会站在火炮更多的一方。作为超视距支援火力的主要投送单位，火炮在现代战争中的重要性已经被一再证明。相较于昂贵的尖端军备或是无用的轻武器，我们的军工产能更有必要向火炮制造领域倾斜。"
 VWI_draw_military_cantonment_system: "加强宪兵部队"
 VWI_storm_troopers: "风暴突击队"
 VWI_storm_Commando_Expansion: "适应性陆军"
 VWI_rebuild_Steam_Knight: "重建蒸汽骑士"
 VWI_Windermere_Declaration: "温德米尔宣言"
 VWI_Windermere_Declaration_desc: "在温德米尔公爵的领导下，我们已经初步站稳脚跟。为了向整个维多利亚传达我们的理想，为了完成我们光荣而艰巨的事业，是时候向整个帝国发出属于我们的声音了！让那些虚与委蛇，平庸无能，野心勃勃的公爵们看看，我们会如何重塑维多利亚的荣光。"
 VWI_relaxation_work_restrictions_infected_people: "放松感染者工作限制"
 VWI_relaxation_work_restrictions_infected_people_desc: "在如今的非常情况下，歧视与隔离少数感染者不但无法博取多数正常人的支持，还会浪费宝贵的劳动力资源。尽管边防军政府始终无法压制社会各界的反对声浪，但只要经由合理的人事安排和科学的健康检查，感染者群体仍可深度参与生产环节。"
 VWI_volunteer_engineering_teams_formed: "组建志愿工程队"
 VWI_volunteer_engineering_teams_formed_desc: "有些人可能不擅劳动，但他们在国难当头之际仍需挺身而出。学生、妇女、教士、公务员以及退休工人即将被编组为志愿工作队，填补流水线上的空缺岗位。尽管他们在技巧和经验上的生疏将会降低产品的可靠性，但我们已经别无他法。"
 VWI_increase_support_military_enterprises: "加大对军工企业支持"
 VWI_increase_support_military_enterprises_desc: "从技术方面上来讲，我们需要军工企业贡献先进武器的批量制造经验；从人员角度上来说，我们也需要军工企业提供大批熟练的技术工人。考虑到这两点，边防军政府必须尽可能地拉拢和控制辖区内的军工企业。拉高财政拨款、提供行政便利、开设官方通道，我们将让这些军事资本家们为温德米尔公爵和维多利亚帝国的事业服务。"
 VWI_Operation_Return_of_Avalon: "行动：阿瓦隆复归"
 VWI_work_for_people_with_Victoria: "为了人民与维多利亚工作！"
 VWI_work_for_people_with_Victoria_desc: "毫无疑问的是，在这场战争之中，我们才真正代表着维多利亚和她骄傲的民众。一旦想起我们的辉煌，哪怕是一个普通工人都会骄傲地挺起胸膛，并更加努力地挥舞锤镐。不要放弃，公民们！我们绝不停歇，直至最后的胜利！"
 VWI_improve_resource_production_processes: "改进资源生产流程"
 VWI_improve_resource_production_processes_desc: "在目前的紧张情况下，原本的资源生产流程已经严重脱节于现实，其可操作性和实际效率也都令人感到失望。为了填饱军工生产线的辘辘饥肠，我们必须对相关规格标准展开大刀阔斧的优化改进乃至重构升级。"
 VWI_the_second_march_Lentinium: "向伦蒂尼姆的二次进军"
 VWI_we_will_meet_again: "我们将会重逢"
 VWI_forming_new_model_army: "组建新典范军"
