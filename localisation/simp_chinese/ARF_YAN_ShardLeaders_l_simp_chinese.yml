l_simp_chinese:

# ==============================================================================
#  大炎（YAN）· 岁家十二领袖
#   · 国家领袖特质（common/country_leader/YAN_shard_leader_traits.txt）名称与说明
#   · 十二人的领导人简介（country_leader 的 desc，键 = <角色id>_leader_desc）
#   · 与将领特质同名不同库：YAN_sui_*（unit_leader）是一线的军事特质，
#     YAN_cl_*（country_leader）是元首位上的执政特质，两套各自生效。
# ==============================================================================

# ---------------- 重岳 ----------------
 YAN_cl_zhongyue:0 "玉门为屏"
 YAN_cl_zhongyue_desc:0 "玉门百年的守势，如今压在整个大炎身上。"
 YAN_gen_zhongyue_leader_desc:0 "做了百年的玉门守将。剑里封着「朔」与一缕残魂，军中只说那是镇岁的东西；他从不拿这件事谈条件。"

# ---------------- 望 ----------------
 YAN_cl_wang:0 "落子无悔"
 YAN_cl_wang_desc:0 "他算的从来不是眼前这一步。"
 YAN_gen_wang_leader_desc:0 "一百二十年前入岁陵，六十年前才从古寺里走出来。他把自己裂成一百八十一枚黑子散在各地，只等一个时机。"

# ---------------- 令 ----------------
 YAN_cl_ling:0 "尚蜀有主"
 YAN_cl_ling_desc:0 "尚蜀的山头认她，朝堂也认她。"
 YAN_gen_ling_leader_desc:0 "诗人，也是酒客。与重岳各自戍北百年；尚蜀那回她掷出一只酒盏退了天灾，后来用自己的梦困住了岁。"

# ---------------- 均 ----------------
 YAN_cl_jun:0 "律不循私"
 YAN_cl_jun_desc:0 "律条怎么写，她就怎么断。"
 YAN_gen_jun_leader_desc:0 "《炎律》的修订者，与谌彻辩过何谓公正。书刀曾在她手里，后来交给了陈晖洁。"

# ---------------- 颉 ----------------
 YAN_cl_jie:0 "笔削不欺"
 YAN_cl_jie_desc:0 "史笔如刀，刀下不留虚言。"
 YAN_gen_jie_leader_desc:0 "司史阁的史官，笔削之间不留虚言。她替望挡下过一次死，余下的生机散在界园，被左乐等人带了回来。"

# ---------------- 黍 ----------------
 YAN_cl_shu:0 "农不失时"
 YAN_cl_shu_desc:0 "农时不等人，她也不等。"
 YAN_gen_shu_leader_desc:0 "在大荒城躬耕千年，田地底下压着的东西比庄稼更难伺候。她用自己换过一次干净的水土。"

# ---------------- 绩 ----------------
 YAN_cl_ji:0 "账无不平"
 YAN_cl_ji_desc:0 "天下的账，他一笔一笔算平。"
 YAN_gen_ji_leader_desc:0 "商人，也是织造者。「纺因织果，裁虚为实」——他与望合谋织过一幅山河百景，账目从不落下一笔。"

# ---------------- 易 ----------------
 YAN_cl_yi:0 "博物多识"
 YAN_cl_yi_desc:0 "园子、机关、石头，他都认得。"
 YAN_gen_yi_leader_desc:0 "界园的主人。园子、机关与镇岁的那根钉子都出自他手；闲下来的爱好是收石头。"

# ---------------- 年 ----------------
 YAN_cl_nian:0 "洪炉百炼"
 YAN_cl_nian_desc:0 "炉火不熄，军械不断。"
 YAN_gen_nian_leader_desc:0 "铸匠。十二楼五城从她的洪炉里出来，去了罗德岛也照旧打铁。唯一怕的东西是爆竹。"

# ---------------- 方 ----------------
 YAN_cl_fang:0 "分毫必称"
 YAN_cl_fang_desc:0 "药按钱分，伤按轻重。"
 YAN_gen_fang_leader_desc:0 "医者。在萨尔贡收过徒，随身带一杆戥秤。巨兽的伤他也敢碰；药按钱分，伤按轻重。"

# ---------------- 夕 ----------------
 YAN_cl_xi:0 "画里江山"
 YAN_cl_xi_desc:0 "画里另有一片江山。"
 YAN_gen_xi_leader_desc:0 "画画的。她的画里另有一片天地，十二幅各藏去处。后来她随年去了罗德岛。"

# ---------------- 余 ----------------
 YAN_cl_yu:0 "桌无虚席"
 YAN_cl_yu_desc:0 "先让人吃饱，再谈别的。"
 YAN_gen_yu_leader_desc:0 "厨子。望走后他到了百灶，在城里开了间余味居。一碗汤能把人从死局里捞回来。"
