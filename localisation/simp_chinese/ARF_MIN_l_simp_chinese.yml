 MIN_Camon_Fieredia: "克蒙·腓拉埃迪亚"
 MIN_Camon_Fieredia_desc: "雅赛努斯的将军，战神山派的领袖，在与萨尔贡的冲突中立下赫赫战功的克蒙·腓拉埃迪亚，如今正面临内外势力的为难。雅赛努斯内部的激进派对他代表的战神山派愈发不满，而其他几个城邦也对他的盟主地位颇有微词。克蒙需要在钢丝上行走，他只能祈祷，腓拉埃迪亚家族的名誉能赐予他不会摔落的能力。"
