#民族精神
 MIN_Akrotti_Treaty: "《阿克罗蒂条约》"
 MIN_Akrotti_Treaty_desc: "多年以前，安纳托利亚帝国治下的几个边境部落与北边的米诺斯邦联爆发了边境冲突，这场规模不大但惨烈的冲突最终以安纳托利亚帝国代表手下的部落与米诺斯邦联签署《安纳托利亚-米诺斯互不侵犯条约》（又称《阿克罗蒂条约》）告终。这个条约最令人哭笑不得的是，此前被卷入冲突的边境部落与帕拉斯领导的边境村庄联盟，都无法代表安纳托利亚与米诺斯邦联的官方态度，如果两国任意一方的外交政策发生转变，那么这个建立在脆弱地基上的条约面临的结局只有被无情地撕毁。"
 MIN_polis_system_Jasenus: "城邦制度"
 MIN_polis_system_Jasenus_desc: "在十二英雄带领米诺斯人民赶走了萨尔贡侵略者之后，十二英雄的后人建立起了十二个城邦，在时间的洗礼下，十二个城邦又逐渐团结在四个主要城邦周围，形成了邦联的四个主要派系。四个派系每隔一段时间会举行会议，选举产生下一任的同盟领袖。尽管如此，同盟的领袖仅仅拥有在战时指挥联军和代表米诺斯进行外交活动的权力，国内政治的各个领域，仍然属于各城邦自己的事务。"
 MIN_polis_system_Jasenus_tt: "\n当前执政派系：雅赛努斯\n雅赛努斯，智慧之城，该派领导人将用雅赛努斯的知识和文化造福米诺斯邦联。\n研究速度：§G+2.00%§!"
 MIN_polis_system: "城邦政治体制"
 MIN_polis_system_Athenius_desc: "自古以来，米诺斯便有城邦政治的传统。而在十二英雄带领米诺斯人民赶走萨尔贡侵略者后，众多曾于萨尔贡帝国统治下被压制的城邦于“复兴运动”中重振。时间洗礼之下，众城又逐渐团结在四个在古代便有着强大影响力的主要城邦周围，形成了邦联的四个主要派系——即雅赛努斯派、科林尼亚派、拉刻代蒙派、厄菲索斯派。\n\n四个派系每隔一段时间会举行会议，选举产生下一任的邦联领袖。尽管名义上作为国家元首，邦联领袖仅仅拥有在战时指挥联军和代表米诺斯进行外交活动的权力，国内政治的各个领域仍受控于各城邦自身。\n\n当前执政派系：§o雅赛努斯§!\n雅赛努斯，智慧之城，该派领导人将用雅赛努斯的知识和文化造福米诺斯，为我们带来§Y科研速度§!加成。"
 MIN_Hero_Worship: "英雄崇拜"
 MIN_Hero_Worship_desc: "在米诺斯人心中，“英雄”一词有着外人难以理解的重大意义。从古代城邦的伟大建设者与守卫者，到反抗萨尔贡侵略的勇士，再到独立战争中为祖国血战到底的十二英雄——这个词汇不仅象征着无数民族历史上的伟大人物，也代表着米诺斯人的高尚精神与民族品格。\n\n无可质疑，英雄崇拜在千百年前便已成为米诺斯传统文化的重要一环，并逐渐演变为了本民族的特有信仰。在古代，人们为英雄谱写赞歌、戏剧与建造雕像，许多城邦甚至会为本城的英雄建造神殿。而在今天的米诺斯，流行小说与电影中总是少不了英雄身影，甚至有关英雄史诗的文化衫也总是更为畅销。相信在未来，米诺斯人仍将在众英雄的旗帜下团结一致，反抗一切侵略。"
 MIN_MegaleIdea: "伟大理想"
 MIN_MegaleIdea_desc: "自1042年独立战争以来，有关追回传统文化与民族应有地位的运动一直牵动着每个米诺斯人的精神。这场运动在有时被称为“复兴”，而有时则被称为更为人所知的“伟大理想”。尽管于萨尔贡殖民时期遭遇了可怖的文化毁灭，但米诺斯的祭司与知识分子们仍在以他们的力量促使传统文化复生。\n\n除去文化上“复兴”，领土收复主义也是“伟大理想”的重要部分。收回阿加门帝国古都马克西米安波利斯的呼声一直相当之大，反萨尔贡民族主义情绪亦广泛存在于社会。在另一方面，萨尔贡人对米诺斯土地的觊觎也从未结束。与萨尔贡边境王酋与赫迪夫的小型边境冲突时常发生。尽管如今局势仍较为稳定，但若冲突激化，全面战争或将不再停留于假想层面。"
 MIN_emerging_economy: "新兴经济"
 MIN_emerging_economy_desc: "得益于优良的自然条件，米诺斯历来拥有发达的农业。但匹夫无罪，怀璧其罪，优秀的农业基础也成为了当年招来萨尔贡入侵的重要原因之一。在萨尔贡殖民的一百二十五年间，帕夏长期进行惨无人道的剥削甚至文化灭绝政策，但仍为沙尔-阿加德的利益大力发展工商业。\n\n而在米诺斯重获独立后，众多萨尔贡工业设施归于国家或本地商人所有，为新生的米诺斯经济注入了不少活力。受制于政治与地理，目前工业格局或许较为分散，但其质量仍不容小觑。尽管近几十年的发展带来了少许债务，但相信在旅游业快速发展之下，它们很快便能得到抑制……"
