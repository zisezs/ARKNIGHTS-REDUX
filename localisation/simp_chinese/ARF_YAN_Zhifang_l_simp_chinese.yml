 # ==============================================================================
 #  大炎 · 兵部·职方司（外交与义从决议组）
 #  决议：common/decisions/YAN_Zhifang_Decisions.txt
 #  读数：common/scripted_localisation/YAN_zf_read_scripted_localisation.txt
 # ==============================================================================

 YAN_Zhifang_Affairs:0 "兵部·职方司"
 YAN_Zhifang_Affairs_desc:0 "职方司掌天下图籍、边备与蕃部兵事。四方的战报每天送到这里，堆成一座小山——谁在打、打到哪一步、谁向朝廷开过口，都要在这一间屋里说清楚。"

 # ── 框架 ──────────────────────────────────────────────────────

 YAN_zf_open_registry:0 "职方司置义从籍"
 YAN_zf_open_registry_desc:0 "朝廷从来没有一条律例许人私自出国打仗。边患年年有，出塞的却只能算逃户。\n\n翰林翻出旧档：前朝有「义从」之名，凡自愿赴人之难者，入册于兵部，官为具粮，亡则恤其家。这条旧例被压在纸堆里几百年，如今正好取出来用——把它写成新章程，从此愿去的人有名分，朝廷也有账可查。\n\n名册摆在职方司，写不写自己的名字，各人自便。"
 YAN_zf_open_tt:0 "§Y职方司开门§!：义从之籍自此可立，衙门内的其余条目一并可办。§G勘战册、募义从三档、漕输军械、召回、叙功、恤家§!与§Y八条方向§!解锁。"

 YAN_zf_war_register:0 "勘战册"
 YAN_zf_war_register_desc:0 "义从不是拉夫，得先让人知道该往哪里去。\n\n职方司的主事每天把各路驿传与边镇的塘报归拢一遍：哪一国正在交战、战线推到哪条河、我方名册上的人已经走出去几路。誊成一份短册，送上政事堂。\n\n这份册子什么也不决定，只是把话说清楚。"

 YAN_zf_levy_militia:0 "募义从·乡勇"
 YAN_zf_levy_militia_desc:0 "招贴只贴在三处：城门口、驿站口、各学堂的后墙。上面没有军饷数目，只有一句「愿行者，来」。\n\n来的多是没分着田的后生、铺子倒了的伙计、还有几个把家产捐去修河堤反被申饬的举人。书吏按姓名、年貌、籍贯录成一册，谓之「乡勇」——不入兵籍，不给军号，只许他们以私人之名出境。\n\n名字录满那一天，职方司案上就多了一本册子，户部案上也多了一笔吃粮的账。"

 YAN_zf_levy_picketers:0 "募义从·锐士"
 YAN_zf_levy_picketers_desc:0 "愿去的人一多，就不能再当散客待了。有司在城外辟了三座院落，编队、给械、按期操演，去得早的人回来讲战况，讲得最细的留下当教习。\n\n营中还多出一间库房，专门收那些飞得起来的机器——有人把一辈子花在天上，如今只想把这几架飞机开到别人的战场上去，飞回来算赚，飞不回来也认。\n\n自此册上之人有了另外一个称呼：锐士。"

 YAN_zf_levy_division:0 "编炎字义从师"
 YAN_zf_levy_division_desc:0 "到这一步，散着去已经不够体面了。\n\n政事堂议了三日，最后赐下一个「炎」字为号，编成整师：九团步队、两队炮、随军的匠人与医士一并算在编制之内。旗子是尚服司连夜赶出来的，黄色，边缘绣火。\n\n立起旗号的意思很直白——这些人走到哪里，哪里就有人替大炎看着；他们若战死，名单要刻在太庙外的石碑上，不能只写「失踪」。"

 YAN_zf_arms_convoy:0 "漕输军械"
 YAN_zf_arms_convoy_desc:0 "人可以不派，枪不能不卖。\n\n兵部与工部的算盘打得清楚：库房里积压的步枪放在自己库里只能生锈，装船发出去，既不折自家编制，又能让某一条战线多撑半年。漕船按季走一趟，凡此刻真在交战的方向都有一份。\n\n至于这些枪最后打在谁身上，职方司不做声，问就是商货。"
 YAN_zf_arms_convoy_tt:0 "即日起程，§G三十天§!后到；此后连头带尾约§G一季§!才能再走一趟。沿途每一路正在交战的重点方向各得一批，我方库房同步扣减。"
 YAN_zf_arms_convoy_done_tt:0 "正在交战的方向各得§Y3000§!支步枪；大炎库房同步扣减同等数目。"

 YAN_zf_recall_volunteers:0 "召回义从"
 YAN_zf_recall_volunteers_desc:0 "战火烧到自家门口时，朝廷才想起册子上还有几千人在别人的国土上。\n\n召回的诏书写得极短：凡在大炎以外各战场从军者，限两个月内归国，愿留者听其自便，官府不追。至于那些已经成建制送出去、如今挂在别国军籍上的队伍，诏书里没有一句能把那些名字收回来——那是别人家的兵了。\n\n港口等着，火车等着，回来的少了一大半。"
 YAN_zf_recall_tt:0 "两个月后§Y清点归国§!：外交途径派出的原版志愿军届时被强制撤回，回国人力 §G+20000§!，稳定 §R-3%§!。已经成建制捐给他国的「炎字义从」不在此列。"

 YAN_zf_merit:0 "义从叙功"
 YAN_zf_merit_desc:0 "从外国战场回来的人，讲的都不是同一件事。有人讲雪，有人讲铁路，有人讲一个连被打光以后只剩他自己抱着电台走了十一日。军政司把这些话录下来，抄成操典的补编，又按功次定赏——官阶不轻授，银钱与粮差不含糊。\n\n朝廷第一次发现，这场替别人打的仗，居然也给自己练出了一批会打仗的人。"

 YAN_zf_relief:0 "恤义从之家"
 YAN_zf_relief_desc:0 "抚恤的银子按例从藩库出，可真正难办的是那些活着回不来的名字。\n\n有司最终定下三条：无子的按例给田三年不征，有子愿入学者官为备束脩，妻母愿往子女所在之国依附者，官府给一张过境的文牒。碑上刻名字那一件事，是工部一个主事自己出钱办的，朝廷后来只是认了账。\n\n这本册子送到御前，御批只有四个字：俱依议行。"

 # ── 义从籍三档（民族精神）────────────────────────────────────

 YAN_Yicong_Levy_1:0 "义从在籍·乡勇"
 YAN_Yicong_Levy_1_desc:0 "名册立起来了：自愿出境赴战者入册，官为具粮，亡则恤其家。§H派遣志愿军的规模上限提高、开口的门槛降低、由此累积的世界紧张度更少§!；这些人在别人的战线上替我们练出一批打过仗的军官。"

 YAN_Yicong_Levy_2:0 "义从在籍·锐士"
 YAN_Yicong_Levy_2_desc:0 "散的客人成了队。城外三座院落按期操演，去得早的人回来讲战况，讲得最细的留下当教习；库房里还多出一排能飞起来的机器。§H可派志愿军的规模再进一步，并首次拥有航空志愿队额度§!。"

 YAN_Yicong_Levy_3:0 "炎字义从成军"
 YAN_Yicong_Levy_3_desc:0 "政事堂议了三日，赐下一个「炎」字为号，旗子尚服司连夜赶出来，黄色，边缘绣火。自此走出去的不是散勇，是一整面旗号——§H派遣志愿军的额度放到最大，航空志愿队成建制，战场经验折算最快§!；若这面旗在外国折损，名单要刻在太庙外的石碑上。"

 # ── 八条方向 ──────────────────────────────────────────────────

 YAN_zf_aid_HGS:0 "义从东渡·援东国光元府"
 YAN_zf_aid_HGS_desc:0 "海对岸那场内战，本来只写在边镇的塘报里。光严的兵一路南下，光元朝廷的求援文书便一封紧似一封地送到上京——他们是朝贡之国，这一层名分在太平年间不值钱，在打仗时却要人命去换。\n\n政事堂议到深夜，最后不称出兵，只称义从。船从桓江口走，人不多，枪不少。朝廷对外只讲一句话：民间自愿，官不禁。"
 YAN_zf_aid_HGS_tt:0 "§Y东国光元政府§!首都境内编成 §G4§! 支满编「炎字义从」师（九团步队、两队炮、工兵炮兵辎重齐全），另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y150§!、人力 §R-40000§!、库房步枪 §R-8000§!；§G六十天§!后到，陆军经验 §G+25§!。同时对光元府的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_DKK:0 "义从渡江·援檀国"
 YAN_zf_aid_DKK_desc:0 "檀国在半岛上，江水不宽，可一旦让某一方把江南岸全占了，大炎的东岸就要日夜盯着一条自己不想看的边境。\n\n职方司的案头摆着两份东西：一份是檀国的告急，一份是自家边镇的粮台账。前者写着亡国在即，后者写着还能匀出几个团。于是渡江的义从编队比东渡的那一路更急，连旗号都省了。\n\n朝廷给的说法是：江对岸有同胞侨民数万，不能不接。"
 YAN_zf_aid_DKK_tt:0 "§Y檀国§!首都境内编成 §G4§! 支满编「炎字义从」师，另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y140§!、人力 §R-36000§!、库房步枪 §R-8000§!；§G六十天§!后到，陆军经验 §G+25§!。檀国方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_ANA:0 "义从南行·援安南"
 YAN_zf_aid_ANA_desc:0 "安南那一场起事，最先递到上京的不是战报，而是几封商人的信：南疆三省的米、锡与药材全从那条路来，路一断，价钱先动。\n\n朝廷对内的说法是字小恤邻——藩王被自家叛臣围在城里，天朝不出面说不过去；对外的说法更简单：安南朝廷是大炎承认的那一个。义从走南边陆路，翻几道岭就到，比派一支官军便宜一百倍。\n\n至于山那边那些举着新旗的人，公文里一概称「匪」。"
 YAN_zf_aid_ANA_tt:0 "§Y安南§!首都境内编成 §G4§! 支满编「炎字义从」师，另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y130§!、人力 §R-32000§!、库房步枪 §R-8000§!；§G五十六天§!后到，陆军经验 §G+25§!。安南方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_MIN:0 "义从浮海·援米诺斯"
 YAN_zf_aid_MIN_desc:0 "米诺斯邦联是一片没有战略纵深的地方——海就是它的边境，船就是它的城墙。这样的国家打不起持久战，却能替别人把一条航道守上很久。\n\n出发的这批人有一半是船工与水手，报名的地方不在城门，在码头。册子上他们的籍贯写着十几个不同的省，只有一栏共同：愿往。\n\n朝廷拨了两条护航的船，钱从南库的商税里出，礼部把这件事写成了「存恤远人」。"
 YAN_zf_aid_MIN_tt:0 "§Y米诺斯邦联§!境内编成 §G2§! 支满编「炎字义从」师，另捐 §G4000§! 支步枪与 §G400§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y120§!、人力 §R-20000§!、库房步枪 §R-4000§!；§G九十天§!后到（海路远），陆军经验 §G+20§!。米诺斯方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_KAC:0 "义从西行·赤旗（援卡兹戴尔红军）"
 YAN_zf_aid_KAC_desc:0 "卡兹戴尔那片地方如今插着三面旗，其中一面是红的。上京里读那些传单的人很多，看懂的不多；可有一件事谁都看得懂：那面旗底下的人是靠自己在打，没有人替他们出兵，也没有人肯替他们出兵。\n\n于是义从中有一路不去朝廷，不去藩王，只往红旗下那几座城去。礼部在公文里避开了所有主义字眼，只写「西土有乱民，愿往者不禁」。\n\n报名的人里，有一半连卡兹戴尔在地图哪一格都指不出来。"
 YAN_zf_aid_KAC_tt:0 "§Y卡兹戴尔红军§!首都境内编成 §G4§! 支满编「炎字义从」师，另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y160§!、人力 §R-40000§!、库房步枪 §R-8000§!；§G一百二十天§!后到（路程最远之一），陆军经验 §G+30§!。红军方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_SRC:0 "义从西游·七丘（援叙拉古）"
 YAN_zf_aid_SRC_desc:0 "叙拉古的乱不是外敌打进去的，是自己人拆开的——几座家族的城市把联邦的账本、公路与港口一块块搬走。这样的内战最容易拖，也最容易让旁观者觉得自己该做点什么。\n\n大炎做的很少：两队义从，一批枪，一封措辞极其平淡的国书，大意是天朝认那位还在首都办公的政府。职方司在册子后面加了一行小字——「此路不通商，只通人」。\n\n走海路，绕过三条战线，运气好时五十天可到。"
 YAN_zf_aid_SRC_tt:0 "§Y叙拉古§!境内编成 §G2§! 支满编「炎字义从」师，另捐 §G4000§! 支步枪与 §G400§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y120§!、人力 §R-24000§!、库房步枪 §R-4000§!；§G一百零五天§!后到，陆军经验 §G+20§!。叙拉古方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_LTN:0 "义从绝域·莱塔尼亚"
 YAN_zf_aid_LTN_desc:0 "高卢的兵动起来，第一个被压到的是莱塔尼亚。这一仗离大炎极远，远到朝堂上没有人说得清那条边境线在哪，可西馆通译的邸报把话讲得很白：若莱塔尼亚塌了，西边的战祸就没有人能挡住了。\n\n出发的义从带了大炎最好的炮，也带了一整套炮兵操典的抄本。兵部要他们记住一句话——这些人不是去替别人守城的，是去把一场火按在自己看不见的地方。\n\n路程最长的一路，走的都是慢船与铁路。"
 YAN_zf_aid_LTN_tt:0 "§Y莱塔尼亚联合帝国§!首都境内编成 §G4§! 支满编「炎字义从」师（含两队炮），另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y150§!、人力 §R-36000§!、库房步枪 §R-8000§!；§G一百二十天§!后到，陆军经验 §G+30§!。莱塔尼亚方向的§Y志愿军派遣许可§!开启。"

 YAN_zf_aid_KZM:0 "义从北道·援卡西米尔"
 YAN_zf_aid_KZM_desc:0 "北边那位宿敌，从冰原一路压下来时，谁都没有觉得它会在哪一步停下。如今它对面站着的是卡西米尔——草原、骑兵、和一座被烧过很多次的城。\n\n朝廷没有对卡西米尔的朝贡义务，也没有一兵一卒可以名正言顺地开出国境。剩下的只有一件事可以做：把愿意去的人送过去，把库房里的枪卖过去，并且把话说得极轻——民间自愿，官不禁。\n\n宿敌的敌人，这一次算是朋友。"
 YAN_zf_aid_KZM_tt:0 "§Y卡西米尔§!首都境内编成 §G4§! 支满编「炎字义从」师，另捐 §G8000§! 支步枪与 §G800§! 件支援装备；其国稳定与战争支持各 §G+5%§!。\n我方支出：政治点 §Y150§!、人力 §R-40000§!、库房步枪 §R-8000§!；§G七十天§!后到，陆军经验 §G+30§!。卡西米尔方向的§Y志愿军派遣许可§!开启。"

 # ── 勘战册读数（scripted_localisation）────────────────────────

 YAN_zf_rb_caos:0 "§Y天下鼎沸§!：同时在交战的国家已在二十以上，职方司的战报堆满了半间屋子。"
 YAN_zf_rb_many:0 "§Y四方不宁§!：交战国十余处，各路塘报一天几份，主事已经添了人手。"
 YAN_zf_rb_some:0 "§Y数处用兵§!：正在交战的国家三五处，册子尚算干净。"
 YAN_zf_rb_few:0 "§Y偶有烽烟§!：只有一两国在打，勘战册薄得能看见底。"
 YAN_zf_rb_none:0 "§Y海内暂无战事§!：这一日册子上一个名字也没有。"

 YAN_zf_rh_wide:0 "§R我朝着眼的路数同时开了多处§!——每一条都有人可以去。"
 YAN_zf_rh_several:0 "§Y眼着的路数有数条在打§!，义从该往哪几处走，职方司心里有数。"
 YAN_zf_rh_one:0 "§Y眼下只有一条路数在打§!，册子薄，能做的事也少。"
 YAN_zf_rh_quiet:0 "八条方向此刻§G都没有战事§!，各条遣义从的条目因此灰着。"

 YAN_zf_rs_everywhere:0 "§Y义从已遍布数国§!，名册上按路数排开，得另立一册才能写完。"
 YAN_zf_rs_many:0 "已遣§Y数路§!义从，回来的名单比走时的短。"
 YAN_zf_rs_some:0 "已遣§Y一两路§!义从，人刚走出去，战报还没回来。"
 YAN_zf_rs_none:0 "尚未遣出一路义从——名册是空的。"

 YAN_zf_rl_division:0 "义从籍§Y已立「炎」字旗号§!，可整师成建制地送出去。"
 YAN_zf_rl_picketers:0 "义从籍§Y第二档·锐士§!，已有成队编练与航空志愿队。"
 YAN_zf_rl_militia:0 "义从籍§Y第一档·乡勇§!，只登记散往各处的愿往之人。"
 YAN_zf_rl_empty:0 "§R义从籍尚未开档§!，先募人入册，额度才提得上来。"
