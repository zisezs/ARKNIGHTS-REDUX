#人物
 CAM_Suryavarman_II: "苏耶跋摩二世"
 CAM_Suryavarman_II_desc: "苏耶跋摩二世原名诺娑瓦·摩尼万，他并非其父亲选中的第一继承人，但随着他在军中崭露头角，原来的太子选择将继承权让给他以求自保。其父于征战阿育陀耶途中遇刺身亡后，诺娑瓦·摩尼万于军阵中完成了他的加冕仪式，为苏耶跋摩二世。在其作为甘武者国王的七十多年间，他率军彻底攻灭了阿育陀耶王国，从周边的满贾帕希和努珊西亚掠夺了大片领土，还在陆战中击败了当时不可一世的伊比利亚帝国，迫使其放弃在南洋地区进一步北进的企图。1074年，苏耶跋摩二世从内战中的满贾帕希王国夺取了大片土地后，他在大吴哥府正式宣布，自己加冕为甘武者帝国皇帝，豪言帝国和他将与天地同寿。但万事万物，尤有竟时。如今，苏耶跋摩二世的年龄已超过百岁，他逐渐衰弱的身体机能告诉他，他并不是一个长生种。苏耶跋摩二世和忠诚的大臣们都已经做好了准备，这位征战一生的老人终于开始害怕，害怕那个未知却注定的日期的到来。"
 CAM_conqueror: "征服王"
 CAM_Jayavarman_VII: "阇耶跋摩七世"
 CAM_Jayavarman_VII_desc: "阇耶跋摩七世，原名诺娑瓦·信诃努珂，在她的父亲和叔叔都被她的爷爷熬死以后，作为嫡孙女的信诃努珂成为了甘武者王朝的第一继承人，而苏耶跋摩二世也有意将其当作接班人培养，等到信诃努珂一成年就将她送入军队。然而，或许是叛逆心理作祟，抑或是信诃努珂对于甘武者穷兵黩武国策的反思，她违逆了祖父的安排，选择前往炎国求学，之后更是去到了遥远的中陆。苏耶跋摩二世起初对此极为恼怒，老皇帝一开始如赌气般宣扬要剥夺信诃努珂的继承权，然而当信诃努珂在数年后归来，苏耶跋摩二世与大臣们无不对信诃努珂渊博的学识与对国事独到的见解感到惊喜。信诃努珂很快得到了原谅，并且在老皇帝的支持下，开始试行改革，例如将地方行政机构改革为参考炎国的行省，推广中陆新型的生产组织方式。信诃努珂的改革得到了苏耶跋摩二世的默许，人们也猜测，这是甘武者帝国转变其军国主义国策的信号，而随着苏耶跋摩二世魂归西天，加冕为阇耶跋摩七世的诺娑瓦·信诃努珂，她的改革将不再有任何阻碍。"
 CAM_ambitious_little_master: "雄心勃勃的少主"

#国家精神
 CAM_Cambodia_militarism: "甘武者军国主义"
 CAM_Cambodia_militarism_desc: "不同于现代意义上人们所说的军国主义，尚未完全步入现代社会的甘武者帝国，更多地表现为一种古典的军国主义，即整个国家都是高效的战争机器，从统治阶层到平民，每个人都渴望着战争，尚武精神充斥在社会的方方面面。战争是统治者最崇尚的攫取利益的方式，也是平民百姓为数不多的上升渠道。如果要说这种军国主义和现代的军国主义有什么共通性，那么其中最重要的一点便是，这样的体制终有一日，会将整个国家的未来燃烧殆尽。"
 CAM_Isolated_empire: "被孤立的帝国"
 CAM_Isolated_empire_desc: "哈拉帕帝国的文化影响着甘武者社会的方方面面，但甘武者的经济却更多地受到先发的大炎帝国的影响。按理来说，这样的处境对于甘武者来说是一个优势，她本应借助这个优势，游离在两大东陆列强之间，借机谋取利益。但由于苏耶跋摩二世在1074年介入了炎国和哈拉帕关于满贾帕希王国的博弈，并且公然称帝，如此行为招致了两大帝国的一致不满，后果便是，不被认可的甘武者帝国在百京和华提那城心照不宣的默契下，逐渐丢失着她原有的经济地位。"