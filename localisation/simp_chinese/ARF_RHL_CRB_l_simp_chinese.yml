# ══════════════════ 修正 / 精神 / 政体 ══════════════════
 RHL_dyn_crb: "企业渗透 · 哥伦比亚"
 RHL_crb_annexed_idea: "完全并购：哥伦比亚联邦"
 corporate_technocracy: "企业技术官僚"
 corporate_technocracy_subtype: "企业技术官僚"
 RHL_corporate_technocracy_party: "总辖厅"
 RHL_corporate_technocracy_party_long: "莱茵生命总辖厅"

# ══════════════════ 事件 ══════════════════
 rhl_crb.1.t: "手术开始：切开心包"
 rhl_crb.1.d: "福拉尔街的清晨和往常一样喧闹，直到《科技评论》的头版刊出那行小字：莱茵生命宣布全面参股联邦储备银行。\n\n交易厅里安静了三秒，随后是山呼海啸的电话铃。财政部的接线员被告知「此事无需向特区通报」——公关部的措辞无懈可击：这是投资，不是收购。\n\n小贾斯汀在电话里轻声说：「手术开始。先切开心包。」"
 rhl_crb.1.a: "温和控股：让联邦的银行家们自己递上股权。"
 rhl_crb.1.b: "恶意收购：用支票把犹豫的人直接挤出董事会。"
 rhl_crb.2.t: "金融动脉已接驳"
 rhl_crb.2.d: "储备银行的季度报表第一次以特里蒙的会计准则出具。财政部长在闭门会议上没有表示异议——他的竞选资金账目，如今也由我们「义务审计」。\n\n哥伦比亚的血液，正在按照我们的心率流动。"
 rhl_crb.2.a: "控制度 14/98。下一刀，喉舌。"

 rhl_crb.3.t: "手术开始：置换喉舌"
 rhl_crb.3.d: "三家电台、七家报社、两个影像集团——收购协议在四十八小时内全部签署。主编们的辞呈写得体面又仓促，仿佛早就在等这封信。\n\n新编辑方针只有一条：如实报道。只不过，由我们来定义什么是「如实」。"
 rhl_crb.3.a: "把镜头对准边境的威胁，唤起联邦的危机感。"
 rhl_crb.3.b: "把版面留给繁荣的财报，让乐观替我们铺路。"
 rhl_crb.4.t: "喉舌已置换"
 rhl_crb.4.d: "晚间新闻的最后一分钟，主播微笑着念出了我们提供的稿子。没有一句谎言——只有恰到好处的沉默。\n\n从今晚起，哥伦比亚人看到的哥伦比亚，是特里蒙希望他们看到的模样。"
 rhl_crb.4.a: "控制度 28/98。病人感觉如何？——非常好。"

 rhl_crb.5.t: "手术开始：清扫病灶"
 rhl_crb.5.d: "收治区的高墙上刷上了新标语：「莱茵生命感染者关怀体系」。墙还是那道墙，但门口多了免费发放的抑制剂，和一份终于付得起的保险合同。\n\n登记处的队伍排到了街区尽头。志愿者数着人头——每一个名字，都是一台崭新的机器上的新齿轮。"
 rhl_crb.5.a: "放宽收治标准：让更多感染者「自愿」登记。"
 rhl_crb.5.b: "与各州救助署签约：把整个收治体系外包给莱茵。"
 rhl_crb.6.t: "病灶已清扫"
 rhl_crb.6.d: "旧联邦的收治区档案被批量销毁，取而代之的是莱茵生命健康档案系统的蓝色封面。\n\n感染者在协议上按下手印时是感激的。他们不知道，按手印的那台终端，直连特里蒙的劳工调度中心。"
 rhl_crb.6.a: "控制度 42/98。循环系统运转正常。"

 rhl_crb.7.t: "手术开始：接驳心脏"
 rhl_crb.7.d: "调度中心的大屏上，联邦电网的脉络亮成了青色。能量科的工程师们平静地拉下了十七个州际开关——三秒后重新合闸。只是这三秒，让所有变电站都记住了谁才是真正的主控。\n\n并网协议签署。哥伦比亚的心脏，从今晚起按特里蒙的节律跳动。"
 rhl_crb.7.a: "优先保障工业区的电力配额。"
 rhl_crb.7.b: "优先注入特里蒙的能源储备井。"
 rhl_crb.8.t: "心脏已接驳"
 rhl_crb.8.d: "移动城市的灯光在夜里明明灭灭，那是我们调价信号在测试城市的耐受度。没有人抗议——电费单上的优惠小字写得非常诚恳。\n\n能源即权力。而现在，电闸在我们手里。"
 rhl_crb.8.a: "控制度 56/98。心跳稳定，由我们起搏。"

 rhl_crb.9.t: "手术开始：植入支架"
 rhl_crb.9.d: "国防部的年度采购清单泄露给了《科技评论》——我们的人放在编辑部桌上的那份。动力甲、自律机甲、递质导航套件：三个标段，全部指向莱茵生命。\n\n上校在电话里沉默良久，最后说：「报告写好看点。」——他明白了。军队采购的每一件装备，都将成为我们植入这个国家的一枚支架。"
 rhl_crb.9.a: "把重心放在装备换装上：让部队离不开莱茵的弹药。"
 rhl_crb.9.b: "把重心放在维保合同上：让装备的寿命由特里蒙决定。"
 rhl_crb.10.t: "支架已植入"
 rhl_crb.10.d: "联邦陆军的演习场上，新装备的涂装还没干透。参谋们惊叹于后勤效率——他们不知道，每一台机甲的远程锁死密钥，都存放在特里蒙防卫科的保险库里。\n\n军队还是那支军队。只是它的主动脉，已经接在我们的泵上。"
 rhl_crb.10.a: "控制度 70/98。肌肉不再听从旧大脑。"

 rhl_crb.11.t: "手术开始：麻痹神经"
 rhl_crb.11.d: "进步大厦的走廊里，我们的 lobbyists 与议员的秘书们谈笑风生。联合议会的八百个席位里，四百二十七个议员的竞选资金——如今由同一个财务团队打理。\n\n《紧急状态法》的修订草案在深夜二读通过，全文只有我们的人逐字看过。大法官的书记员在扉页盖了章。"
 rhl_crb.11.a: "买下规则的解释权。"
 rhl_crb.11.b: "买下投票的计票权。"
 rhl_crb.12.t: "神经已麻痹"
 rhl_crb.12.d: "议会以 701 比 99 通过了《企业授权法案》。反对派的演讲被安排在午夜直播时段，收视率统计由我们的电台出具。\n\n从法理上讲，哥伦比亚仍然是一个自由国家。从实践上讲，它的每一根神经都听不见大脑了。"
 rhl_crb.12.a: "控制度 84/98。还剩最后一根脊髓。"

 rhl_crb.13.t: "手术开始：截断反射"
 rhl_crb.13.d: "国防部的晋升名单在参谋学院公布。落选的三位中将当晚收到了特里蒙寄来的退役安置方案——条件优厚得无法拒绝，措辞礼貌得无法误解。\n\n布莱克的老部下们一个个在文件上签字。军队的反射弧，正在被一根一根剪断。"
 rhl_crb.13.a: "用晋升和教席拴住下一代军官。"
 rhl_crb.13.b: "用退役金和股权买断老一代将领。"
 rhl_crb.14.t: "反射已截断"
 rhl_crb.14.d: "参谋部的晨会上，作战地图被换成了《莱茵生命合并案》的资产评估图。没有人提出异议——提出异议的人，上周刚刚「自愿退役」。\n\n塞雷娅在总辖厅的窗前放下报告：「手术完成。可以进入麻醉期了。」"
 rhl_crb.14.a: "控制度 98/98。病人已完全就绪。"

 rhl_crb.15.t: "哥伦比亚的「医疗性重组」"
 rhl_crb.15.d: "今日，莱茵生命总辖厅发布公告：鉴于哥伦比亚联邦「长期的结构性功能衰竭」，经联合议会授权（该议会已于上周完成改组），莱茵生命将对联邦实施全面「医疗性重组」。\n\n公告的末尾附有一份体检报告：联邦的一切生命体征，自今日起由特里蒙监测。\n\n各国使馆灯火通明。但所有人都读得懂这份公告背后的手术刀。"
 rhl_crb.15.a: "（莱茵生命）麻醉剂已经注入。数到三。"
 rhl_crb.15.b: "注视手术台。我们已经无力阻止什么了。"
 rhl_crb.16.t: "莱茵生命合众国：手术完成"
 rhl_crb.16.d: "今日正午，莱茵生命总辖厅正式接管哥伦比亚联邦全部政府职能。联邦总统府降下了旧旗，联合议会大厦的门牌换成了「莱茵生命哥伦比亚事业部」。\n\n塞雷娅在广播中只说了一句话：「真正的先驱者，应当为全人类开道。从今天起，莱茵生命就是哥伦比亚。」\n\n货币未变，法律未废，街道照常拥挤。只是每一个路口的信号灯，都由特里蒙控制。而从今天起，这支手术刀，也可以指向地平线以外的任何地方。"
 rhl_crb.16.a: "（莱茵生命）从今天起，莱茵生命就是哥伦比亚。"
 rhl_crb.16.b: "地平线以外的地方，最好离手术刀远一点。"
 RHL_crb_decision_release: "归还 · 释放哥伦比亚共和国"
 RHL_crb_decision_release_desc: "手术已经结束，但病历上还需要一个活着的病人。在原联邦领土上划出一州，重建「哥伦比亚共和国」——旗帜、宪法、总统一应俱全，只是每一份公文都要抄送特里蒙备案。\n§Y在 1074 州释放哥伦比亚共和国为莱茵生命的傀儡，无消耗。§!"
