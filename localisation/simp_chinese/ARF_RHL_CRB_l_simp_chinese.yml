# ══════════════════ 决议分类 ══════════════════
 RHL_crb_decisions: "莱茵生命 · 对哥伦比亚内科手术"

# ══════════════════ 决议 ══════════════════
 RHL_crb_decision_finance: "内科手术 · 切开心包：金融动脉"
 RHL_crb_decision_finance_desc: "福拉尔街的钟声依旧准时，但报价单上的字迹已经换了主人。收购联邦国债、参股储备银行、包抄结算通道——当哥伦比亚的每一笔信贷都要经过特里蒙的账房，止血钳就已经握在我们手里。\n§Y控制度 +14，工厂份额 +2%，获得 2 座离场民用工厂。§!"

 RHL_crb_decision_media: "内科手术 · 置换喉舌：媒体集团"
 RHL_crb_decision_media_desc: "《科技评论》《进步之声》还有那些夜里才响起的电台——收购，换主编，换排版，换措辞。不必说谎，只要决定他们看见什么。当舆论开始为「合并」这两个字预热，手术台上的病人甚至不会觉得疼。\n§Y控制度 +14，工厂份额 +2%，获得 2 座离场民用工厂。§!"

 RHL_crb_decision_treatment: "内科手术 · 清扫病灶：收治区改组"
 RHL_crb_decision_treatment_desc: "收治区的高墙是旧联邦最沉默的器官。把它改组为「莱茵生命感染者关怀体系」——同样的墙，同样的床位，不同的名字，和一份终于付得起的保险合同。病人会感激我们，而劳动力登记册上会多出整整七个州的名字。\n§Y控制度 +14，工厂份额 +2%，获得 3 座离场民用工厂。§!"

 RHL_crb_decision_energy: "内科手术 · 接驳心脏：能源命脉"
 RHL_crb_decision_energy_desc: "能量科的电闸一路铺到移动城市的每一根主动脉。并网、调价、检修权——当联邦的电网开始跟随特里蒙的调度表呼吸，这个国家的心跳就由我们来定节律。\n§Y控制度 +14，工厂份额 +2%，获得 3 座离场民用工厂与 500 燃料。§!"

 RHL_crb_decision_defense: "内科手术 · 植入支架：国防订单"
 RHL_crb_decision_defense_desc: "国防部的订单从来不是生意，是支架。递质、动力甲、自律机甲——把哥伦比亚军队的血管一根一根接进莱茵的生产线。他们以为自己在采购，其实是在移植。\n§Y控制度 +14，工厂份额 +2%，获得 3 座离场军用工厂与 25 陆军经验。§!"

 RHL_crb_decision_parliament: "内科手术 · 麻痹神经：议会与官僚"
 RHL_crb_decision_parliament_desc: "联合议会八百个席位，进步大厦的走廊里走着我们的人：议员代理、司长秘书、大法官的书记员。不需要政变——只需要每一次表决之前，有人先递上那份装满钱的手提箱。\n§Y控制度 +14，工厂份额 +2%，获得 2 座离场民用工厂与 1 座离场办公园区。§!"

 RHL_crb_decision_command: "内科手术 · 截断反射：军方高层"
 RHL_crb_decision_command_desc: "最后一段脊髓在国防部。晋升令、退役安置、参谋学院的教席——让将军们明白，忠诚的回报由特里蒙签发。当参谋部的沙盘开始按我们的日程推演，哥伦比亚的手就再也握不住枪了。\n§Y控制度 +14，工厂份额 +2%，获得 2 座离场军用工厂与 50 陆军经验。§!"

 RHL_crb_decision_annex: "内科手术 · 终章：全身麻醉"
 RHL_crb_decision_annex_desc: "麻醉剂已经注入每一根动脉、每一根神经。签下这份《医疗性重组协议》，哥伦比亚联邦将作为莱茵生命的一个事业部继续存在——账面上，它从未消失。\n§R完全吞并哥伦比亚：获得其全部领土、核心与部队。政体转为「企业技术官僚」，获得正当化战争目标的能力。§!"

