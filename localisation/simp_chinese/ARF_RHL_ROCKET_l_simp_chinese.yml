 RHL_rocket_mission_line_4: "目标 散于星辰 · 需 [?ROOT.RHL_r_dv_req|0]"
 RHL_rocket_mix_m1: "略偏燃料"
 RHL_rocket_mix_m2: "严重偏燃料"
 RHL_rocket_mix_p1: "略偏氧化剂"
 RHL_rocket_mix_p2: "严重偏氧化剂"
 RHL_rocket_mix_z: "理想配比"
 RHL_rocket_outcome_disaster: "灾难性失败"
 RHL_rocket_outcome_disaster_desc: "火箭在发射台上炸成一团火球。"
 RHL_rocket_outcome_failure: "发射失败"
 RHL_rocket_outcome_failure_desc: "一级推进装置在上升段失效。"
 RHL_rocket_outcome_partial: "部分成功"
 RHL_rocket_outcome_partial_desc: "火箭越过部分目标，但未能抵达预定高度。"
 RHL_rocket_outcome_perfect: "完美成功"
 RHL_rocket_outcome_perfect_desc: "一次教科书式的发射，冗余充足。"
 RHL_rocket_outcome_success: "发射成功"
 RHL_rocket_outcome_success_desc: "载荷准确抵达预定轨道。"
 RHL_rocket_panel_title: "地平弧光计划 · 万星园设计局"
 RHL_rocket_production_drain: "万星园工程占用"
 RHL_rocket_production_drain_desc: "一个发射窗口要占掉若干条产线：备件、试车台、运输专用件，还有为了保险多造的那一枚。"
 RHL_rocket_program: "「地平弧光」计划"
 RHL_rocket_program_desc: "「弧光一号」从来都只是一个用来欺骗军方的幌子。真正要造的东西，得从一台能飞的火箭开始。"
 RHL_rocket_prop_h2o2: "四号 过氧化氢/煤油"
 RHL_rocket_prop_h2o2_tt: "高浓度过氧化氢，密度最大，也最容易在自己肚子里分解。\n结构科要求这一段贮箱单独做隔热层，理由写得很长。\n比冲基准 0.96× · 密度 1.15 t/m³ · 氧化剂富余比 7.00 · 可贮存 · 燃烧最不稳"
 RHL_rocket_prop_loxeth: "一号 液氧/乙醇"
 RHL_rocket_prop_loxeth_tt: "特莱顿第三化工供的低温液体。\n比冲基准 1.00× · 密度 0.95 t/m³ · 氧化剂富余比 1.30 · 不可贮存（加注后必须尽快打出去）· 燃烧稳定"
 RHL_rocket_prop_loxkero: "二号 液氧/煤油"
 RHL_rocket_prop_loxkero_tt: "同样要低温，但密度更高，同样的贮箱能多灌一成。\n商务科算过：煤油便宜到可以浪费。\n比冲基准 1.08× · 密度 1.02 t/m³ · 氧化剂富余比 2.60 · 不可贮存 · 燃烧中等不稳"
 RHL_rocket_prop_nitric: "三号 硝酸/苯胺"
 RHL_rocket_prop_nitric_tt: "常温存放，随取随用，代价是有毒且比冲更低。\n它让发射窗口第一次可以由人决定，而不是由天气决定。\n比冲基准 0.92× · 密度 1.28 t/m³ · 氧化剂富余比 3.00 · 可贮存 · 燃烧稳定"
 RHL_rocket_row_1: "第 1 级"
 RHL_rocket_row_2: "第 2 级"
 RHL_rocket_row_3: "第 3 级"
 RHL_rocket_slot_body: "舱段"
 RHL_rocket_slot_engine: "推进装置"
 RHL_rocket_slot_fuel: "推进剂"
 RHL_rocket_stage_n: "第 %d 级"
 RHL_rocket_stages_1: "1 级"
 RHL_rocket_stages_2: "2 级"
 RHL_rocket_stages_3: "3 级"
 RHL_rocket_stat_dv: "总 Δv [?ROOT.RHL_r_dv_total|0] m/s"
 RHL_rocket_stat_dv_req: "需要 [?ROOT.RHL_r_dv_req|0] m/s"
 RHL_rocket_stat_log: "运行日志"
 RHL_rocket_stat_mass: "起飞质量 [?ROOT.RHL_r_launch_mass|2] t"
 RHL_rocket_stat_payload: "载荷 [?ROOT.RHL_r_payload|2] t"
 RHL_rocket_stat_reliability: "全箭可靠性 [?ROOT.RHL_r_rel_pct|0]%"
 RHL_rocket_stat_stages: "级数 [?ROOT.RHL_r_n_stages] / 3"
 RHL_rocket_stat_twr: "起飞推重比 [?ROOT.RHL_r_twr|2]"
 RHL_rocket_stat_valid: "校验"
 RHL_rocket_status_idle: "校验 · 尚未校验"
 RHL_rocket_status_ok: "校验 · 通过"
 RHL_rocket_tab_body: "结构"
 RHL_rocket_tab_engine: "推进装置"
 RHL_rocket_tab_prop: "推进剂"
 RHL_rocket_warn_invcone: "倒置锥：上级直径大于下级，全箭可靠性 −5%。"
 RHL_spirit_rocket_perfection_1: "试验规程"
 RHL_spirit_rocket_perfection_1_desc: "一次教科书式的飞行之后，试车、装箭、加注的流程被逐条改写成规程；此后任何人都得照规程来。"
 RHL_spirit_rocket_perfection_2: "精密构件"
 RHL_spirit_rocket_perfection_2_desc: "公差从「能用」收紧到「能互换」。车间一开始骂娘，后来发现返工少了。"
 RHL_spirit_rocket_perfection_3: "万星园标准"
 RHL_spirit_rocket_perfection_3_desc: "莱茵生命开始对外出售「按万星园标准制造」这件事本身：别家的零部件也要过我们的检验台。"
 RHL_spirit_rocket_program_1: "「弧光一号」"
 RHL_spirit_rocket_program_1_desc: "军方要的是超级武器，我们给的是它的图纸。真正的那一份，锁在总辖构件科的抽屉里，正在等一枚能飞的火箭。"
 RHL_spirit_rocket_program_2: "总辖构件科"
 RHL_spirit_rocket_program_2_desc: "专为一个项目设立的科室，集合了几乎全部主任的智慧。它造的东西有一个真名，叫万星园。"
 RHL_spirit_rocket_program_3: "万星园"
 RHL_spirit_rocket_program_3_desc: "服务舱、观测廊桥、生态区、星象间——一座藏在垃圾场里的环形巨构。它起飞三分钟之后，聚焦发生器的试飞版本就不再是秘密了。"
 rhl_rocket.50.a: "星辰可及。"
 rhl_rocket.50.d: "特里蒙城外，那座谁也说不清用途的能量井边上，圈出了一块新的围界。\n总辖构件科挂牌的第一天，娜斯提把一沓总装图摊在长条桌上，四个角用螺栓压住——风从垃圾场那边一直吹进来。"
 rhl_rocket.50.t: "「地平弧光」计划立项"
 rhl_rocket.51.a: "彻查原因。"
 rhl_rocket.51.d: "点火的那一刻，箭还站在台上。\n冲击波把塔架拧成了麻花，碎片最远落在两公里外的荒地上。军方的人第二天就到了，他们带着笔记本，不带同情。"
 rhl_rocket.51.t: "发射台灾难"
 rhl_rocket.52.a: "再来一次。"
 rhl_rocket.52.d: "一级推进装置在最大动压段熄灭。\n「推进装置的效能有问题。」娜斯提只说了这一句，就把整台机器拖回车间，重新烧了一遍。"
 rhl_rocket.52.t: "上升段失败"
 rhl_rocket.53.a: "已是进步。"
 rhl_rocket.53.d: "箭越过了预定的最高点，但没有抵达环绕速度。\n载荷完好，遥感记录仪完好。差的那一部分，回到纸上已经能算出来——6152.31 米，这就是泰拉天空的高度。"
 rhl_rocket.53.t: "部分成功"
 rhl_rocket.54.a: "星辰大海。"
 rhl_rocket.54.d: "载荷准确抵达预定的那条线。\n地面站收到回传的时候，特里蒙正在落灰，没有人注意到。七百五十三种生命在天上活了下来。"
 rhl_rocket.54.t: "发射成功"
 rhl_rocket.55.a: "无可挑剔。"
 rhl_rocket.55.d: "从二级脱离到入轨，每一项都落在预计值的正中间。\n工程师们把这次的遥测打印出来，贴在了车间门上，纸的边角被后来的人摸得发白。"
 rhl_rocket.55.t: "完美成功"
 rhl_rocket.56.a: "继续。"
 rhl_rocket.56.d: "累计的成功让这件事不再像一个试验项目。\n理事会第一次按「工程」而不是按「科考」给它排预算，也第一次没有人再问：造这个到底要干什么。"
 rhl_rocket.56.t: "计划升档"
 rhl_rocket.57.a: "复核完毕。"
 rhl_rocket.57.d: "连着几次失败之后，设计局把全部图纸重新过了一遍：每一条焊缝、每一个阀门、每一次「大概没问题」。\n下一次发射的可靠性提高 15%，占用产能的窗口立即解除。"
 rhl_rocket.57.t: "工程复核"
 rhl_rocket.58.a: "就这么办。"
 rhl_rocket.58.d: "五次失败把十科绑到了同一张桌子上。能量科把整座能量井的配额划了过来，结构科把最好的台架让了出来。\n下一次发射按成功档结算，且不扣政治点。"
 rhl_rocket.58.t: "举科攻关"
 rhl_rocket.59.a: "明白了。"
 rhl_rocket.59.d: "§Y目标§!\n亲手拼一枚火箭，把载荷送过星荚。\n\n§Y第一步 · 选零件§!\n在左侧【零件库】点一个零件（舱段 / 推进装置 / 推进剂），它就成了当前选中项，右侧数字立刻跟着变。鼠标停在零件上可以看到它的真实参数。\n\n§Y第二步 · 装到槽位§!\n在中间【装配台】点对应那一个槽位即可装上，再点一次卸下。\n每级 3 个槽：舱段 / 推进装置 / 推进剂（每级固定 1 台同型推进装置，混合比锁在理想配比）。\n底部【1 级】【2 级】【3 级】决定用几级：级数越多 Δv 越大，可靠性越低。\n\n§Y第三步 · 看右侧数据§!\n· 总 Δv：能飞多远，必须 ≥ 面板底部那行写明的「需」值\n· 起飞推重比：必须 ≥ 1.00，否则离不了地（发射台灾难）\n· 全箭可靠性：这次发射有多大概率成功\n· 载荷越重，Δv 越低；目标越高，需要越多\n\n§Y第四步 · 校验 → 发射§!\n点【校验设计】，右侧校验行会说明通过还是卡在哪一项；【发 射】只看当前设计过不过关，不必先点校验。\n每次发射花 100 政治点，并且占用 30 天工业产能 —— 这 30 天里发射键是灰的，但装配台照常可以改、可以试算。\n\n§Y偷懒：自动设计§!\n拿不准怎么配，就定好【目标】和【载荷】后点【自动设计】：它在当前已经解锁的零件里从小到大试，第一枚能过关的就装上装配台，不花政治点也不发射。装完之后每一格都还能自己改。\n目标高过当前零件的能力时，它会给出这一档 Δv 最大的一枚，校验行直说还差多少。\n\n§Y结果与成长§!\n分五档：灾难 / 失败 / 部分成功 / 成功 / 完美。\n第一次成功与第一次失败各有一次大事件，并附带短期强力加成或削弱。\n累计成功 3 次、6 次各升一档计划精神；累计 1 / 2 / 3 / 5 次成功分别解锁更强的零件（未解锁的按钮点不动）。\n连续失败 3 次给一次可靠性复核，连续失败 5 次给一次按成功结算的保底。"
 rhl_rocket.59.t: "万星园设计局 · 使用说明"
 rhl_rocket.60.a: "天空将要被打开。"
 rhl_rocket.60.d: "「汇聚的光芒舍弃大地，向更高空刺去。」\n遥测曲线在这一分钟全部越过了红线，然后安静下来。阻隔层在 6972 米处被撕开一道口子，只有一瞬间——足够让一枚载荷、一台记录仪，看见真实的双月。\n一百二十年来，各国学界都说那扇门不可能推开。今天它被推开了一条缝。\n「如若此后百年千年，来人漫步于繁星身侧，人们便要赞颂她的名。」"
 rhl_rocket.60.t: "虚假的天空被扯碎"
 rhl_rocket.61.a: "把图纸全部留下。"
 rhl_rocket.61.d: "「隔热层！速度太快，破损率 60%！」\n电子音在尖峰上重复了四遍，没有人回答它。箭带着剩下的全部推进剂，沿一条没有人想看到的曲线落了回去，砸出深坑，砸碎了岩石。\n打捞队在天亮前找到了黑匣子。里面记录的最高高度是 3454.7 米——泰拉天空的高度是 6152.31 米。\n军方的人又带来了笔记本。"
 rhl_rocket.61.t: "而且注定坠落"
