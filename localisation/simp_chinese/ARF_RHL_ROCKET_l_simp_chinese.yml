l_simp_chinese:

# ══ 「地平弧光」计划 · 万星园设计局 本地化 ══ 【由 docs/gen_rhl_rocket.cjs 生成，勿手改】
 RHL_decision_open_rocket_console: "开启万星园设计局"
 RHL_decision_open_rocket_console_desc: "重新打开总装控制台。清单没有变：舱段、推进装置、推进剂、目标高度，以及上一次发射究竟落回了哪里。"
 RHL_decision_rocket_manual: "万星园设计局 · 使用说明"
 RHL_decision_rocket_manual_desc: "分步讲清怎么拼一枚火箭、右侧每个数字是什么意思、发射一次要花掉什么，以及连着失败几次会有什么补偿。鼠标停在零件上能看到它的真实参数。"
 RHL_decision_startrack_charter: "「弧光一号」立项"
 RHL_decision_startrack_charter_desc: "「国防部需要一件能挽回玻利瓦尔颜面的东西。」\n克丽斯腾递上「地平弧光计划」与「弧光一号」，军方砸进去的钱没人算得清，莱茵生命换来了核心技术顾问的身份。图纸上真正的载荷从来没有画过：那要先有一枚能把东西送上去的火箭。立项要押上五十点政治资本。\n只是签字之前还有一道硬杠——这座城的研究所得先做完二十五项课题，别人才会相信我们要把火箭送上去。"
 RHL_mission_0: "低空试飞"
 RHL_mission_1: "高空弹道"
 RHL_mission_2: "叩击星荚"
 RHL_mission_3: "突破星荚"
 RHL_mission_4: "散于星辰"
 RHL_pay_bio: "生态舱段"
 RHL_pay_bio_tt: "缪尔赛思在万星园里复刻了一座生态园，七百五十三种。\n突破阻隔层后的极短时间内，其中的植物死亡率已经超过百分之九十——她们还是把它送上去。\n质量 0.60 t"
 RHL_pay_heavy: "服务舱段"
 RHL_pay_heavy_tt: "洛肯研制的维生休眠舱装在这一段里，连同重力相关的源石技艺模块与阻尼器。\n质量 1.50 t · 需目标为近地轨道或更高"
 RHL_pay_lab: "观测廊桥"
 RHL_pay_lab_tt: "万星园的环形走廊就是观测廊桥：外源动力的极速衰减、基础空气动力学的突变，全部记录在这里。\n质量 1.00 t · 需目标为近地轨道或更高"
 RHL_pay_sounding: "遥感记录仪"
 RHL_pay_sounding_tt: "「遥感记录仪。它会实时反馈舱内的全部数据。」\n最轻的载荷，也是唯一一台掉下来还能读出东西的机器——黑匣子就是它的下游。\n质量 0.30 t · 低空任务即可携带"
 RHL_rocket_body_l1: "L-1 重型舱段"
 RHL_rocket_body_l1_tt: "环形巨构的一段弧。\n直径 2.40 米，能把生态区真正装进去——代价是每一米直径都要用可靠性去换。\n干重 3.00 t · 贮箱容积 34.0 m³ · 开局可得"
 RHL_rocket_body_m1: "M-1 标准舱段"
 RHL_rocket_body_m1_tt: "总辖构件科的标准件。\n所有次级舱室、挂载装置、外接能源通路都按这个直径开模，换它等于换掉一整条产线的夹具。\n干重 1.60 t · 贮箱容积 16.0 m³ · 开局可得"
 RHL_rocket_body_m2: "M-2 加长舱段"
 RHL_rocket_body_m2_tt: "把标准直径拉长到 13.5 米，多出来的长度全部给了推进剂。\n二级脱离程序就是照这一段的尺寸排的。\n干重 2.30 t · 贮箱容积 25.0 m³ · 需累计成功 2 次"
 RHL_rocket_body_s1: "S-1 轻型舱段"
 RHL_rocket_body_s1_tt: "「够飞就行。」\n娜斯提留下的第一份总装图只有一页，直径 1.40 米、长 6.0 米。它就是「弧光一号」里聚焦发生器试飞版本用的那一段。\n干重 0.90 t · 贮箱容积 8.0 m³ · 开局可得"
 RHL_rocket_boost_research_1: "遥感记录仪回馈 I"
 RHL_rocket_boost_research_1_desc: "一次飞行带回的遥测，比十次地面试车更值钱。传感器记录下的每一条曲线都分给了十科。"
 RHL_rocket_boost_research_2: "遥感记录仪回馈 II"
 RHL_rocket_boost_research_2_desc: "载荷在预定的高度开始回传。那些数字不属于任何一个科室，于是所有科室都在读。"
 RHL_rocket_btn_auto: "自动设计"
 RHL_rocket_btn_auto_tt: "§Y自动设计§!\n先定好【目标】和【载荷】，再点这里：设计局会在§G当前已经解锁§!的零件里，从小到大试出第一枚能过关的箭，直接装到装配台上。\n不花政治点，也不发射 —— 装完之后你仍然可以一格一格自己改。\n目标定得太高而现有零件够不着时，它会给出这一档能拼出的 Δv 最大的一枚，校验行会直说还差多少。"
 RHL_rocket_btn_close: "关闭"
 RHL_rocket_btn_engminus: "减少台数"
 RHL_rocket_btn_engplus: "增加台数"
 RHL_rocket_btn_help: "说明"
 RHL_rocket_btn_launch: "发 射"
 RHL_rocket_btn_mission_next: "下一个目标"
 RHL_rocket_btn_mission_prev: "上一个目标"
 RHL_rocket_btn_reset: "重置"
 RHL_rocket_btn_validate: "校验设计"
 RHL_rocket_engine_a1: "A-1 化学推进器"
 RHL_rocket_engine_a1_tt: "最老实的一台：烧乙醇，靠化学键把东西推上去。\n它是唯一一台不需要任何前置研究就能点着的机器。\n推力 200 kN · 真空比冲 240 s · 自重 0.45 t · 可靠性 78% · 单级至多 1 台"
 RHL_rocket_engine_a2: "A-2 高压化学机"
 RHL_rocket_engine_a2_tt: "把燃烧室压力再抬一档，比冲换来了 25 秒。\n工程科为了这台机器重做了全部阀门。\n推力 245 kN · 真空比冲 265 s · 自重 0.55 t · 可靠性 82% · 单级至多 1 台"
 RHL_rocket_engine_b1: "B-1 自燃推进器"
 RHL_rocket_engine_b1_tt: "硝酸与苯胺一碰就着，不需要点火器。\n它因此成了唯一敢在高空重新起动的机器，也因此有毒到必须整段密封。\n推力 300 kN · 真空比冲 230 s · 自重 0.60 t · 可靠性 86% · 单级至多 1 台 · 需累计成功 1 次"
 RHL_rocket_engine_c1: "C-1 三机并联组"
 RHL_rocket_engine_c1_tt: "三台并排点火，推力直接翻倍——重量也一起翻。\n「推进装置的效能有问题」这句话，就是在这台机器上第一次说出口的。\n推力 590 kN · 真空比冲 250 s · 自重 1.30 t · 可靠性 74% · 单级至多 2 台"
 RHL_rocket_engine_d1: "D-1 源石热力机"
 RHL_rocket_engine_d1_tt: "用源石加热工质，绕开了燃烧室。\n源石技艺应用科不肯承认这台机器是她们画的，因为它的功率损耗曲线完全不像话。\n推力 320 kN · 真空比冲 285 s · 自重 0.58 t · 可靠性 80% · 单级至多 3 台 · 需累计成功 3 次"
 RHL_rocket_engine_e1: "E-1 外源动力机"
 RHL_rocket_engine_e1_tt: "「不依赖你们所熟知的源石能源。」\n能量从特里蒙地下的能量井引来，经导能电缆直接灌进喷管——一座石棺撑不住，那就多接几座。\n推力 420 kN · 真空比冲 310 s · 自重 0.62 t · 可靠性 83% · 单级至多 3 台 · 需累计成功 5 次"
 RHL_rocket_entry_button_tt: "万星园设计局"
 RHL_rocket_err_dv: "校验 · Δv 不足"
 RHL_rocket_err_engine: "校验 · 推进装置超单级上限"
 RHL_rocket_err_mixture: "校验 · 混合比偏离过大"
 RHL_rocket_err_tank: "校验 · 贮箱容积不足"
 RHL_rocket_err_twr: "校验 · 推重比不足"
 RHL_rocket_idea_first_fall: "注定坠落"
 RHL_rocket_idea_first_fall_desc: "「我们会在一分钟后砸进地面。」\n打捞队在天亮前找到了黑匣子。军方的人带走了副本，理事会连续开了三天，而设计局的灯没有关过。"
 RHL_rocket_idea_first_light: "天空被扯碎"
 RHL_rocket_idea_first_light_desc: "「虚假的天空终于被扯碎。亘古的双月露出真容。」\n一百二十年来第一次，有人从阻隔层之上看见了真实。整个哥伦比亚都在重放那一段遥测，而十科已经开始算下一次要带多少东西上去。"
