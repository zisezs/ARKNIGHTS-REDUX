 RHL_rocket_label_mixture: "混合比"
 RHL_rocket_label_payload: "载荷"
 RHL_rocket_label_stages: "级数"
 RHL_rocket_last_1: "累计成功 [?ROOT.RHL_rocket_successes|0] 次 · 上次 灾难性失败"
