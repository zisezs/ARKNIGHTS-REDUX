 VOL_characters_1: "阿尔贝特一世"
 VOL_characters_1_desc: "阿尔贝特一世既是黑女王的表兄，也是瓦隆王国的君主。他生性内敛、优柔寡断，向来不善治国理政，却对文学与艺术有着独特的喜好。在双子女王接管帝国后，阿尔贝特被黑女王派往瓦隆地区取代旧总督，并牵头组建一个附庸政权，“瓦隆国君”的身份由此而来。\n不同于白女王对七城地区的种种怀柔与扶持，黑女王只为瓦隆王国设定了两大目标——最大化莱塔尼亚的宗主利益，最小化当地民族的抵抗声势。因此，她故意选择阿尔贝特这位无能的纨绔子弟充当傀儡，并遣送布朗史维希家族的康拉德伯爵组织本土顾问团，彻底巩固了帝国对瓦隆的全权统治。\n作为王座上的虚君，阿尔贝特一世对朝政国务不理不问。他将国家大权交予数位亲信与顾问，而自己则整日吟诗谱曲、寻欢作乐。诚然，阿尔贝特是一位文艺大师——他的诗篇在沃伦姆德广为传唱，他的乐章于黄金大厅回响不绝。只可惜，这份天资却从未造福过瓦隆民众。\n如今，瓦隆大地阴云密布，民愤四起。莱塔尼亚观察团在阿尔贝特的默许下大肆掠夺，而他本人却躲入深宫之中，幻想自已是童话故事中的浪漫君王。§R也许，曙光终有一天会刺破阴云，而他的罪行也将在彼时得到清算。§!"
