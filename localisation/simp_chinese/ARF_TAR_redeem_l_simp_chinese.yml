# ── 战争带：终幕事件（ns TAR_rp） ──
 TAR_rp.20.t: "把首都写在哪个名字上"
 TAR_rp.20.d: "地图上的名字是要人念的。三座城三种念法：一座是我们抢来的，一座是我们埋人的，一座是我们出生的。选一个写进公文抬头——另外两个从此只在脚注里出现。"
 TAR_rp.20.a: "「那就把椅子搬到他们的心脏里去。」"
 TAR_rp.20.b: "「回纳斯尔沙。我们的坟在那里，坟旁边才好盖市政厅。」"
 TAR_rp.20.c: "「哪儿也不去。就从烧过的地方开始，让人自己走过来。」"
 TAR_rp.20_notyet_tt: "（那座城现在还不在我们手里：首都暂不迁移，只记下这个意愿。）"
 TAR_rp.20_a_tt: "名分 §G+10%§!、威慑 §G+10%§!、稳定度 §R−5%§!。"
 TAR_rp.20_c_tt: "军工 §G+15%§!、占领负担 §G−10%§!、稳定度 §G+5%§!。"
 TAR_rp.21.t: "冠冕、账本、桌子"
 TAR_rp.21.d: "三样东西不能由同一个人拿——这是我们从六百年的口传里唯一确定下来的制度教训。所以现在要问的只有一句：谁拿哪一样。"
 TAR_rp.21.a: "「她本来就是台前那个人。让所有人看清她的脸，从此没有人能再冒充她。」"
 TAR_rp.21.b: "「军队不需要知道谁在写字，只需要知道谁在发饷。」"
 TAR_rp.21.c: "「三个人，三样东西，互相都缺一条腿。这就是我们想要的王制。」"
 TAR_rp.21_a_tt: "国家领袖换成 §YTAR_Eblana_Dublinn§!（独裁）；威慑 §G+15%§!、战争支持度 §G+10%§!。"
 TAR_rp.21_c_tt: "谈判席 §G+20%§!、正统性 §G+10%§!、稳定度 §G+8%§!；不换领袖。"
