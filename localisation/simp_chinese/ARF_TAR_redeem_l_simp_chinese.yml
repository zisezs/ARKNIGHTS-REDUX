 TAR_rd_redeem_category_desc: "灰烬里的六件事：立名、清算、封锁、火账、赤铁、归乡。"
 TAR_rd_start_decision: "把名字还给我们"
 TAR_rd_start_decision_desc: "塔拉在地图上从未被标注过。这条决议不宣战、不结盟，它只做一件事：让「塔拉」成为一个可以被写进公文的名词。"
