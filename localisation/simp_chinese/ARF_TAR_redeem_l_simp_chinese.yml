 TAR_rd_ghost_company_tt: "死者已被编入序列：解锁营级支援连 §Y鬼魂部队§!（夜间机动 §G+25%§!、组织度 §G+15%§!、不消耗补给）。在编制界面自行挂到任意师上。"

# ── 战争带「赤铁之路」：效果明细（custom_effect_tooltip） ──
 TAR_rd_war_ultimatum_tt: "按§Y开斯特→威灵顿→温德米尔→维多利亚§!的顺序，给第一个还能被宣战的对象造一个战争目标（全面吞并，180 天内有效）。场上一个都不剩时只落 log，不报错。"
 TAR_rd_war_bloodledger_tt: "§Y名册先造好§!：法案【死火复生】（可征募人口 100%、人口增长归零、工厂与船坞产出 −40%、动员速度 +1000%、政治点数消耗归零、补给消耗 −30%、解锁营级兵种§Y「死火行尸」§!）本就没有门槛，100 政治点随时可立；这一格只是把那本册子先摆到桌上，并 §G政治点数 +30§!。"
 TAR_rd_war_bell_tt: "摘掉民族精神§Y「熄火钟之下」§!（稳定 −10%、抵抗度 +15%、补给消耗 +10% 一并消失），战争支持度 §G+5%§!。"
 TAR_rd_war_mobilize_tt: "§G人力 +60,000§!；随机一个核心省 §G+1 座军用工厂§!（立即建成）。番号表发到手里，从今天起按连排点名。"
 TAR_rd_war_thread_tt: "若维多利亚尚未分裂：六小时后开斯特、温德米尔、高多汀、威灵顿等十九省各归其主（走的是原版那套 event_vic.3 划地脚本）。已经分裂则这一格不给任何东西——它只在还有"一个维多利亚"可拆的时候存在。"
 TAR_rd_war_firstshot_tt: "对§Y接壤的、还能宣战的第一个§!维多利亚继承国§R宣战（全面吞并）§!；一个都不接壤时退而对开斯特宣战。双方任一方是附庸时引擎会拒绝，此时只落 log。§G战争支持度 +5%§!。"
 TAR_rd_war_declare_tt: "对这一线的靶子§R宣战（全面吞并）§!。附庸不能自主宣战，也不能被第三国宣战——所以两侧都要 is_subject = no 守卫；无法宣战时只落变量与旗标。"
 TAR_rd_war_field_tt: "§G陆军经验 +40§!，并给赤铁之誓容器记一笔经验账。会战的战果不在地图上，在我们活下来的军官名单上。"
 TAR_rd_war_siege_tt: "把「我们脚下、别人名下」的省全部转成我方核心，并在新拿到的一处核心省 §G要塞 +2 级§!（立即建成）。"
 TAR_rd_war_terms_tt: "对所有§Y正在与我们交战、且投降进度已过半或已投降§!的维多利亚继承国：降为§Y维多利亚保护领§!（不停战——和平由和平会议收尾，避免一并清零对方名下所有战争），随后把占领省转核心。没打服的这一格只转核心。"
 TAR_rd_war_done_tt: "该线收束：附庸即吞并、占领省转核心，并把§Y一顶帽子§!记进计数器（TAR_rd_dip_hats）。终幕三档读的就是这个数。"
 TAR_rd_war_vca_case_tt: "§G政治点数 +25§!，并解锁对开斯特情报网的读取：后续对开斯特作战的每一格都多一档参谋部。"
 TAR_rd_war_tar_seat_tt: "给威灵顿公爵领挂上§Y「铁公爵的回函」§!好感修正（+30，随时间衰减）。这一步不换领土，只把下一次谈话的地点定在他的船上。"
 TAR_rd_war_tar_backbone_tt: "对威灵顿 §G情报 +60§!、§G陆军经验 +40§!。这一格不开枪：它只是让全队都看见他们的队长同时领着两份饷。"
 TAR_rd_war_tar_terms_tt: "签约：把「我们脚下、他名下」的省转成我方核心，§G政治点数 +40§!。此后他递出的每一份公文都要经我们的手。"
 TAR_rd_war_tar_puppet_tt: "§Y威灵顿公爵领成为深池的傀儡国§!（不开战）。收网前先抄它的阵营成员与交战国名单、并把阵营领袖位让给别的成员——否则领袖被附庸会让阵营就地解散、全图一起停战。它若不存在或我们自己是附庸，这一格只转核心。"
 TAR_rd_war_tar_garrisons_tt: "接收清单：原属威灵顿、现由我方控制的省各 §G要塞 +2 级§!；仓库清点入库 §G步兵装备 +8,000§!、§G人力 +25,000§!。"
 TAR_rd_war_tar_done_tt: "威灵顿公爵领若存在：先停战 → 塔拉诸省转我方核心 → §Y全体顾问与将领转籍§! → 吞并（带部队）。零领土名分时只转人。另 §G政治点数 +60§!、§G稳定度 +5%§!。"
 TAR_rd_war_mourn_tt: "§G政治点数 +20§!、名分 +10%、威慑 −5%。花圈不是善意，是让对面军官看清我们比他们的朝廷更记得他们的人。"
 TAR_rd_war_wki_field_tt: "缴获入库：§G步兵装备 +6,000§!。陆行舰的图纸人人有一份，操作它的人只有一份。"
 TAR_rd_war_go_chair_tt: "与高多汀缔结§Y军事通行权§!——下一格对它宣战时，这条线就是我们的后方。"
 TAR_rd_war_go_field_tt: "§G陆军经验 +50§!。条款读一遍就够：谁付饷、谁指挥、谁负责。"
 TAR_rd_war_go_siege_tt: "§G稳定度 +5%§!。暮辉河岸那一夜的静默被我们记成了公文，公文需要有人签字。"
 TAR_rd_war_go_terms_tt: "第一集团军、第二集团军、皇家海军、瓦拉几亚半岛集团军：凡仍独立者一律降为§Y维多利亚保护领§!；可征募人力 §G+120,000§!。"
 TAR_rd_war_lines_done_tt: "§G政治点数 +60§!。场上已没有一个能以「维多利亚」名义签字的政权——剩下的清单必须由我们来写抬头。"
 TAR_rd_war_lords_tt: "亚伯科恩／法夫／阿什沃思／克雷加文／文森特／自救军名下、现由我方控制的省：转为我方核心，并挂上§R「塔拉驻军负担」§!（人力 −25%、地方工厂 −10%）。§R政治点数 −40§!。"
 TAR_rd_war_garrison_tt: "塔拉驻军与蒂格洛瓦军团：停战 → 降为§Y维多利亚同盟领§!，并把「我们脚下、它们名下」的省转成我方核心。"
 TAR_rd_war_red_tt: "曼彻斯特公社与盖尔兰独立派各降为§Y维多利亚同盟领§!（最松的一档自治）；我方控制的 631／620／623 三省各 §G+2 民用工厂§!。"
 TAR_rd_war_navy_tt: "皇家海军若仍独立：停战 → 降为§Y维多利亚同盟领§!；另 §G首都省船坞 +1 级§!、§G海军经验 +25§!。已是附庸的留给下一格吞。"
 TAR_rd_war_fold_tt: "上述六家凡已是我方附庸者立即吞并，占领省转核心，帽子计数 §G+1§!。"
 TAR_rd_war_garrison_done_tt: "停战 → 吞并已是附庸者 → §G摘掉所有省份上的「塔拉驻军负担」§!，帽子计数 §G+1§!。"
 TAR_rd_war_red_fold_tt: "吞并已是我方附庸的曼彻斯特公社与盖尔兰独立派；我方控制的 631／620／623 三省各 §G+1 座民用工厂§!，帽子计数 §G+1§!。"
 TAR_rd_war_navy_fold_tt: "吞并已是我方附庸的皇家海军；§G首都省船坞 +2 级§!、§G海军经验 +30§!，帽子计数 §G+1§!。我们从来没有海军，我们只有一座收留过它的港。"
 TAR_rd_war_meet_none_tt: "（场上没有可战的伦蒂尼姆占领者：这一格只把已占领地转成了核心。）"
 TAR_rd_war_meet_tt: "向§R控制伦蒂尼姆（434 省）的国家宣战§!（全面吞并）。若那座城已在手里、或占领者是无法被宣战的附庸，本格只把已占领地转成核心。"
 TAR_rd_war_besiege_tt: "围城工事：转核心＋§G要塞 +2 级§!（与前三线同一套围城脚本）。占领负担 +15%、威慑 +10%。"
 TAR_rd_war_cistern_tt: "434 省（伦蒂尼姆）若还不在我们手里：§R打坏它的工厂与铁路各 2 点损伤§!（会自愈，但要花钱花时间）。围城方也要喝水：§R政治点数 −20§!。军工 +10%。"
 TAR_rd_war_breach_tt: "城真在我们手里才算破：434 §Y转核心§!＋§G要塞 +2 级§!、§G政治点数 +80§!、§G稳定度 +5%§!、§G战争支持度 +10%§!，并置破城旗标。城不在手里时只转核心，日志留一行痕。"
 TAR_rd_war_harbor_tt: "§Y加斯特里尔号入港§!：首都省 §G船坞 +2 级§!、§G海军经验 +30§!、§G政治点数 +30§!、军工 +15%；港口省 3081 若在我手里则 §G转核心＋海军基地 +2 级§!。"
 TAR_rd_war_sword_tt: "凡仍存在的维多利亚宣称国：已是我方附庸者§R立即吞并§!，仍独立者§R一律宣战§!（全面吞并）。国号改为§Y塔拉尼亚§!，占领省转核心。"
 TAR_rd_war_table_tt: "仍独立且未与我交战的 18 家全部降为§Y维多利亚保护领§!；国号改为§Y塔拉尼亚§!，占领省转核心。"
 TAR_rd_war_common_tt: "建立阵营§Y「塔拉尼亚共同体」§!（模板：保卫民主），并把仍独立、未交战、无阵营的维多利亚国家全部拉入；国号改为§Y塔拉尼亚§!。"
 TAR_rd_war_cap_tt: "弹出抉择：把首都写在§Y伦蒂尼姆（434）§!／§Y纳斯尔沙（593）§!／§Y小丘郡（621，现都）§!哪一个名字上——三档永久修正。前两者必须真握在手里才迁得动。"
 TAR_rd_war_settle_tt: "弹出抉择：冠冕、账本、桌子三样东西分别交给谁——§R这一步会真的换掉国家领袖与执政党§!。"
 TAR_rd_war_done_final_tt: "获得民族精神§Y「一个名字，许多人」§!：稳定 §G+15%§!、政治点数 §G+20%§!、抵抗度 §G−20%§!、可征募人力 §G+10%§!、工厂产能 §G+5%§!、自治度增长 §G+20%§!。"

