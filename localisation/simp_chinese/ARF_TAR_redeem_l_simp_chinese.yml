l_simp_chinese:

# ── 容器与精神 ──
 TAR_redeem_politics: "灰烬之冠"
 TAR_redeem_politics_desc: "复国不是一次决议，是三本账：谁有资格说话、谁在替谁流血、谁负责让明天有饭吃。"
 TAR_redeem_economy: "火的账本"
 TAR_redeem_economy_desc: "火要有人添，账要有人平。这本记的是我们到底欠了多少，又能还上多少。"
 TAR_redeem_military: "赤铁之誓"
 TAR_redeem_military_desc: "一把剑如果同时听两个人说话，它就谁的话都不听。这本记的是剑的归属。"
 TAR_redeem_diplomacy: "赤铁之路"
 TAR_redeem_diplomacy_desc: "四条线各自要一个结局：谁替这片土地签公文、谁指挥、谁负责发饷。三样东西不能由同一个人拿。"
 TAR_extinguished_bell: "熄火钟之下"
 TAR_extinguished_bell_desc: "晚九点一过，矿场与工厂以外禁止一切灯火。这道命令原本管的是偷猎的人，如今管的是所有人。"
 TAR_debt_of_blood: "血税之账"
 TAR_debt_of_blood_desc: "维多利亚人征税以金币，我们征税以血。账本上每一行都是一个不肯归乡的名字。"
 TAR_two_embers: "两位火星"
 TAR_two_embers_desc: "「领袖」是一个可以由影子承担的职位。两个人共用一面旗，旗就不会被任何人独占。"
 TAR_ghost_legions: "亡者军团"
 TAR_ghost_legions_desc: "死者仍在行军。他们不吃饭、不睡觉、不投降——也不肯安息。"
 TAR_crowned_ember_spirit: "加冕的余烬"
 TAR_crowned_ember_spirit_desc: "新铸的王冠比旧的更烫。戴它的人从此不能摘下，也不能解释。"
 TAR_two_dragons_regency_spirit: "两位红龙的摄政"
 TAR_two_dragons_regency_spirit_desc: "一人坐在台前，一人站在影里。她们第一次同时点头，也第一次开始争夺谁先点头。"
 TAR_lantern_spirit: "给塔拉一盏灯"
 TAR_lantern_spirit_desc: "火被交还给死者，剩下的那点被装进一盏灯，由活着的人端在手里走回家。"
 TAR_victoria_won_spirit: "一个名字，许多人"
 TAR_victoria_won_spirit_desc: "姓氏的条文改了：不再由血脉签发，改由这片土地收留谁、谁就姓它。第一条这样的律法总是最贵的。"

# ── 国策 ──
 TAR_rd_ashen_crown: "灰烬之冠"
 TAR_rd_ashen_crown_desc: "王冠被熔掉，王座被烧掉，站在灰前面的人仍然要回答一个问题：塔拉由谁做主。这一格不是起点，是账单的抬头。"
 TAR_rd_name_of_tierra: "把名字还给我们"
 TAR_rd_name_of_tierra_desc: "塔拉在地图上从未被标注过。一个不被标注的地方要成为国家，靠的不是边界，是有人肯在酒桌上说出它的名字。"
 TAR_rd_second_ember: "第二枚火星"
 TAR_rd_second_ember_desc: "「领袖」是一个可以由影子承担的公开职位。既然名分可以被扮演，那就由我们自己把它写成制度。"
 TAR_rd_one_dragon: "只有一条红龙"
 TAR_rd_one_dragon_desc: "在大多数维多利亚人眼里，活着的德拉克只有一条。那我们就让他们只看见一条。"
 TAR_rd_relics_returned: "珍宝归位"
 TAR_rd_relics_returned_desc: "盖尔王的六件珍宝被放回原处。它们会自己选择停在谁的手边——也会自己走掉。"
 TAR_rd_gael_song: "新的盖尔王传说"
 TAR_rd_gael_song_desc: "数百年来，这是第一个塔拉人可以自豪地讲给别人听的盖尔王传说。讲的人换了，传说才真的换了。"
 TAR_rd_burning_dossiers: "烧掉档案"
 TAR_rd_burning_dossiers_desc: "无档案、无体检、无纳税记录——他们管这叫「不存在」。那就让它继续不存在。"
 TAR_rd_counted_and_taxed: "被登记的人"
 TAR_rd_counted_and_taxed_desc: "原来你们也在册子上。既然要交税，那就顺便要求被当作人来记账。"
 TAR_rd_crown_of_ashes_gate: "灰烬之门"
 TAR_rd_crown_of_ashes_gate_desc: "旗立起来了，名字回来了。从这里开始，问题不再是「塔拉是否存在」，而是「塔拉要成为什么」。"
 TAR_rd_dance_partner: "舞伴，不是木偶"
 TAR_rd_dance_partner_desc: "「谁都可以是牵线木偶，只有你不是。」她说这话的时候，手里还攥着那根线。"
 TAR_rd_empty_coffin: "棺中只有那杆枪"
 TAR_rd_empty_coffin_desc: "空棺要有一个官方说法。神迹、退位，或者死亡——三样都能用，三样都要还债。"
 TAR_rd_she_does_not_know: "她还不知道"
 TAR_rd_she_does_not_know_desc: "隐瞒不是谎言，是把真话一直留着。留得越久，利息越高。"
 TAR_rd_we_tell_her: "我们一起说出来"
 TAR_rd_we_tell_her_desc: "那条线就是姐姐和我。要剪断它，得两个人一起点头。"
 TAR_rd_wake_of_exiled: "替放逐王还火"
 TAR_rd_wake_of_exiled_desc: "守灵人六百年不肯承认，正是他们的先祖把拉布雷德送上绝路。承认之后，他们才肯为红龙开一次葬。"
 TAR_rd_regency_of_embers: "余烬摄政"
 TAR_rd_regency_of_embers_desc: "她亲自无限期推迟了加冕。空着的那把椅子，反而比任何王冠都更像一个国家。"
 TAR_rd_dukes_patience: "二十年的围谈"
 TAR_rd_dukes_patience_desc: "只要威灵顿还没把领地整个搬上移动城市开走，开斯特就会一直谈下去。我们要的从来不是条约，是时间。"
 TAR_rd_oakwood_harbour: "橡林郡的靠岸权"
 TAR_rd_oakwood_harbour_desc: "七年巡游之后，那条船终于又靠了岸。港口的灯亮着，比任何宣言都更像承认。"
 TAR_rd_medicine_company: "那家医疗公司"
 TAR_rd_medicine_company_desc: "一家医药公司，一群很好的人。他们的船停在城外，不问旗帜，只问还有多少人能救。"
 TAR_rd_no_debts: "不欠理想主义者"
 TAR_rd_no_debts_desc: "深池的背后并不、也不该有任何势力。这句话要说两遍：一遍给外人，一遍给自己。"
 TAR_rd_templates_and_borders: "出入境申请模板"
 TAR_rd_templates_and_borders_desc: "公文里从头到尾没有否认那句「皇帝的冠冕之一」，却已经附上了入境表格。法理的暧昧，就是这么被实务磨平的。"
 TAR_rd_tide_is_coming: "洪潮"
 TAR_rd_tide_is_coming_desc: "「当洪潮倾覆，死如夜般随行。」她只留下半句话，剩下半句要整个塔拉自己去猜。"
 TAR_rd_law_and_lynch: "广场上的私刑"
 TAR_rd_law_and_lynch_desc: "光复后的第一桩罪，是有人当街打死了一个什么也没做的人。我们该给它一个名字：不是正义，是饥荒。"
 TAR_rd_hero_unmasked: "英雄当众拆穿自己"
 TAR_rd_hero_unmasked_desc: "「库林不是英雄，他只是一个沽名钓誉的骗子。」雕像还立在广场上，说话的人已经倒在自己人手里。"
 TAR_rd_six_steps: "还火六步"
 TAR_rd_six_steps_desc: "致辞、点柴、亲眼确认、把烛投进火里、对火说话、守到火熄。复仇一旦被写成规程，就不再是复仇了。"
 TAR_rd_watchers_return: "守灵人入城"
 TAR_rd_watchers_return_desc: "「守灵人不和生者团结。」——直到他们替一条红龙开了六百年来的第一次葬。"
 TAR_rd_ghost_disband: "让死者退场"
 TAR_rd_ghost_disband_desc: "日升之后，塔拉的土地上再也没有死者徘徊。这句话既是承诺，也是账单：我们从此要靠自己数人头。"
 TAR_rd_crowned_ember: "加冕的余烬"
 TAR_rd_crowned_ember_desc: "她把王冠重新铸了一枚，比旧的更烫。塔拉从此只有一位红龙，也只有一个不肯说出口的谎。"
 TAR_rd_two_dragons_regency: "两位红龙的摄政"
 TAR_rd_two_dragons_regency_desc: "一人坐在台前，一人站在影里。她们第一次同时点头，也第一次开始争夺谁先点头。"
 TAR_rd_lantern_for_tierra: "给塔拉一盏灯"
 TAR_rd_lantern_for_tierra_desc: "火被交还给死者，剩下的那点被装进一盏灯，由活着的人端在手里走回家。"
 TAR_rd_bread_and_fire: "老爷们，我们要面包"
 TAR_rd_bread_and_fire_desc: "红龙能烧断锁链，烧不熟麦子。光复后的第一份公文不是宣言，是一张配给表。"
 TAR_rd_blood_and_ledger: "征税以血"
 TAR_rd_blood_and_ledger_desc: "维多利亚人征税以金币，我们征税以血。区别只在于：谁把它写进账本。"
 TAR_rd_fire_account: "立一本火的账"
 TAR_rd_fire_account_desc: "火可以分出去，也会在原野、遗迹和人心里自己增殖。既然会增殖，就得有人每日清点。"
 TAR_rd_creditor_dragon: "放高利贷的人"
 TAR_rd_creditor_dragon_desc: "「简直就像在放高利贷。」她说这话时并不羞愧——羞愧是留给不需要还钱的人的。"
 TAR_rd_gathering_tainted: "把沾染者聚集起来"
 TAR_rd_gathering_tainted_desc: "「已被沾染者不会回归。」那就把他们聚在一处——别再让火焰沾染任何人，包括我们自己。"
 TAR_rd_burial_not_wire: "葬礼而不是铁丝网"
 TAR_rd_burial_not_wire_desc: "铁丝网拦不住悲伤，悲伤才是燃料。花六十天办一场葬礼，比修一圈哨塔便宜。"
 TAR_rd_living_flame: "以生命之火替换死火"
 TAR_rd_living_flame_desc: "要灭掉一种火，只能拿另一种火去换。至于换的人付出什么，文本没有写——它只写了「一个奇迹」。"
 TAR_rd_fog_is_army: "雾是一支军队"
 TAR_rd_fog_is_army_desc: "黑雾不是天气。它不进城，也不让人出城，还会挑人吞掉——这是一支有纪律的军队。"
 TAR_rd_bell_reading: "熄火钟的两种读法"
 TAR_rd_bell_reading_desc: "同一口钟：在维多利亚人嘴里是压制塔拉的工具，在我们嘴里是保护邻人的宵禁。谁敲，谁就赢了一半。"
 TAR_rd_bell_stays: "钟继续敲"
 TAR_rd_bell_stays_desc: "城里确实还藏着没有落网的人。灯留到九点，也许就够他们走完一条街。"
 TAR_rd_bells_for_drinking: "零点之后再无宵禁"
 TAR_rd_bells_for_drinking_desc: "没了宵禁，大家想喝到几点都行。第二天早上，酒馆门口少了两个人——这就是自由的报价。"
 TAR_rd_smugglers_passage: "出城之后有人接应"
 TAR_rd_smugglers_passage_desc: "封锁把粮价抬上去，也把走私者抬成了英雄。我们迟早要决定：这条线算产业，还是算罪。"
 TAR_rd_blockade_bill: "封锁解除的账单"
 TAR_rd_blockade_bill_desc: "解除封锁不是胜利，是重新欠债的开始：商贸一恢复，塔拉第一次要以物价而不是以血来算账。"
 TAR_rd_rations_licences: "经营许可"
 TAR_rd_rations_licences_desc: "一张许可能决定一条街吃不吃得上饭。签发它的人，比挥剑的人更先被恨。"
 TAR_rd_harvest_plots: "南部地块进入收获期"
 TAR_rd_harvest_plots_desc: "熟练的农业工人都不在了，剩下的人照着旧历法种地，居然也种出了东西。"
 TAR_rd_inflated_yield: "按往年正常产量报"
 TAR_rd_inflated_yield_desc: "数字好看，人心就稳——稳到下一次真饿的时候，没人再肯相信任何数字。"
 TAR_rd_honest_yield: "把真实数字写上去"
 TAR_rd_honest_yield_desc: "真实的产量很难看。难看的东西写下来，才有机会被改掉。"
 TAR_rd_metal_for_dragon: "为雕像献出碗盆"
 TAR_rd_metal_for_dragon_desc: "砍刀、斧头、碗盆、假腿——全城把铁交给一条龙。铁匠自己也不明白，为什么交完更冷了。"
 TAR_rd_melt_statue: "把脊椎铸回刀斧"
 TAR_rd_melt_statue_desc: "「让雕像把生活还给所有人。」他没能说完这句话，但这句话被记住了。"
 TAR_rd_talach_classes: "塔拉语班"
 TAR_rd_talach_classes_desc: "一门语言几近失传，如今有人开班收钱教它。收钱这件事，本身就是复国的证据。"
 TAR_rd_one_tongue_only: "只留一种舌头"
 TAR_rd_one_tongue_only_desc: "「从小说着塔拉语的就是塔拉人吗？」——要建一个国家，总得先决定谁不配说话。"
 TAR_rd_both_tongues: "双语并许"
 TAR_rd_both_tongues_desc: "维多利亚语的诗歌与塔拉语的传说可以同时被允许。她念完两行，台下没有人鼓掌，也没有人走。"
 TAR_rd_couriers_heralds: "送信人与天灾信使"
 TAR_rd_couriers_heralds_desc: "游牧人替塔拉递信、预警天灾，递了一千年；新职位更高效，也更不认识路。"
 TAR_rd_theatre_reopened: "塔拉人自己的剧院重开"
 TAR_rd_theatre_reopened_desc: "八年前那场首演之后，戏班散在荒野里。如今台上又演盖尔王，只是结尾不再往观众身上泼水。"
 TAR_rd_five_may_beacons: "五朔节点火"
 TAR_rd_five_may_beacons_desc: "春季结束那天，全塔拉熄灭家火、聚在一处重新点起。火种从橡林郡出发，走到哪儿，哪儿就算回到了国境里。"
 TAR_rd_army_of_embers: "余烬之军"
 TAR_rd_army_of_embers_desc: "深池从来不是军队，是一堆愿意为一句口号去死的普通人。要把他们编成军团，先得给他们番号。"
 TAR_rd_codes_in_dark: "代号制"
 TAR_rd_codes_in_dark_desc: "领袖—谋臣—六头领—士兵，人人只有一个战争代号。死了不疼，可也没人会为一个代号殉国。"
 TAR_rd_names_restored: "把名字发还给活人"
 TAR_rd_names_restored_desc: "她把花环和绳结摆在无名者面前，说：从今天起，你们要有名字，也要有人记得。"
 TAR_rd_names_confiscated: "姓名入库"
 TAR_rd_names_confiscated_desc: "「帮助过国家的鬼魂，也仍然是鬼魂。」档案室比祠堂省地方，也更冷。"
 TAR_rd_six_chiefs: "六头领的位子"
 TAR_rd_six_chiefs_desc: "强盗、纵火家、会计、毒药学者、囚犯、雄辩家——六个空位，六份功劳簿。谁坐上去，谁就先被监视。"
 TAR_rd_question_sword: "审问每一把剑"
 TAR_rd_question_sword_desc: "「你在战争面前追寻道德上的完美？」——她不回答，只是把每一把剑都摆到灯下看一遍。"
 TAR_rd_no_more_banquets: "不会再有宴会"
 TAR_rd_no_more_banquets_desc: "庆功宴是塔拉死得最齐的地方。从今天起，长桌上只放地图和面包。"
 TAR_rd_crimson_oath: "赤铁的两种忠诚"
 TAR_rd_crimson_oath_desc: "同一支队伍，一头拴着塔拉，一头拴着那位塔拉出身的公爵。这不是背叛，这是制度——最锋利的那种漏洞。"
 TAR_rd_oath_revealed: "公开那重身份"
 TAR_rd_oath_revealed_desc: "把双重效忠摊在桌面上，等于承认自己一直靠它活着。塔拉人或许会原谅，军队不会。"
 TAR_rd_oath_buried: "把它埋住"
 TAR_rd_oath_buried_desc: "「今晚没有任何事发生。」她把这句话重复了三遍，第三遍时连自己都快信了。"
 TAR_rd_purge_dual: "清洗双重效忠者"
 TAR_rd_purge_dual_desc: "先杀最忠诚的那一个，剩下的人就会开始认真考虑忠诚的价格。"
 TAR_rd_second_purge: "二次整肃"
 TAR_rd_second_purge_desc: "第一次整肃换来安静，第二次换来效率，第三次就只剩下还能签字的人。"
 TAR_rd_crimson_reunified: "赤铁归一"
 TAR_rd_crimson_reunified_desc: "一面旗，一个番号，一份不再需要向两边解释的名册。代价是：从此再没有第二个能替我们说话的人。"
 TAR_rd_ghost_march: "让死者继续行军"
 TAR_rd_ghost_march_desc: "一整支驻军无一具尸体留在原地——他们还在走。塔拉的敌人第一次发现，杀死塔拉人并不能减少塔拉人。"
 TAR_rd_dead_train: "亡者的辎重"
 TAR_rd_dead_train_desc: "死者不吃饭，也不睡觉。后勤官算完这笔账之后，整整一天没有说话。"
 TAR_rd_dead_fire_guns: "以死火为炮"
 TAR_rd_dead_fire_guns_desc: "紫火不炸城墙，它炸人心。凡是烧过的地方，第二年草也不长。"
 TAR_rd_dread_tactics: "恐惧战术"
 TAR_rd_dread_tactics_desc: "「我要摧毁的不是这一群人，我要摧毁的是他们的勇气。」这句话是敌人说的，我们只是学会了。"
 TAR_rd_iron_discipline: "铁纪"
 TAR_rd_iron_discipline_desc: "先杀哨所、后夺市政厅，然后不许碰任何一间民房。军纪是唯一能让占领变成治理的东西。"
 TAR_rd_lantern_drill: "提灯操典"
 TAR_rd_lantern_drill_desc: "把恐怖收进规程：几点熄灯、几点举火、谁的名字该被念出来。操典念完，士兵第一次觉得自己是活人。"
 TAR_rd_silverstone_logistics: "银石崖的后勤"
 TAR_rd_silverstone_logistics_desc: "那场仗是在一条战舰上打完的，可真正决定它的，是山崖下那几辆还能动的粮车。"
 TAR_rd_gastriels_refit: "加斯特里尔号整修"
 TAR_rd_gastriels_refit_desc: "传说里那艘死在王城脚下的船，如今在塔拉人手里换了龙骨。船名没改——改了就没法用它讲故事。"
 TAR_rd_coastal_raids: "海岸破袭"
 TAR_rd_coastal_raids_desc: "我们造不出舰队，但可以让他们每一段海岸都要派人守着。守到第十年，他们就会先谈。"
 TAR_rd_supply_web: "补给节点网"
 TAR_rd_supply_web_desc: "牧道、商队、信使、天灾预警——游牧人一千年的老本行，第一次被画进军用地图。"
 TAR_rd_winter_stores: "冬储"
 TAR_rd_winter_stores_desc: "塔拉的冬天会死人，这一点敌人也知道。所以粮仓修得比弹药库早。"
 TAR_rd_army_of_return: "归乡之军"
 TAR_rd_army_of_return_desc: "从石高原野一路走回来的人，最后编成了一个番号：归乡。它不是师团的名字，是户籍的名字。"
 TAR_rd_war_banner: "把旗子挂出去"
 TAR_rd_war_banner_desc: "「以塔拉人的名义向维多利亚宣战」——这句话一直有人愿意说，缺的只是把它写进公文的纸。今天我们不再请求被看见，我们开始要求。"
 TAR_rd_war_ultimatum: "最后一份通牒"
 TAR_rd_war_ultimatum_desc: "通牒不是威胁，是把威胁写成日期。我们给了三天，第三天夜里对面回电：不许。很好——那就不是我们的信写坏了。"
 TAR_rd_war_bloodledger: "血的账本"
 TAR_rd_war_bloodledger_desc: "维多利亚人征税以金币，我们征税以血。既然要收血税，就得先把名册造完——谁活着、谁死了、谁还欠一次。"
 TAR_rd_war_bell: "把熄火钟改作进军的钟"
 TAR_rd_war_bell_desc: "这道命令原本管的是偷猎的人，后来管的是所有人。今晚它只管一件事：钟响之后，哪几路车可以出城。"
 TAR_rd_war_mobilize: "总动员令"
 TAR_rd_war_mobilize_desc: "深池从来不是军队，是一堆愿意为一句口号去死的普通人。动员令做的事只有一件：把口号换成番号，把番号发到手里。"
 TAR_rd_war_thread: "把引线递回谈判桌"
 TAR_rd_war_thread_desc: "他们唯一一次真正站在了一起，然后各自收兵。我们不需要打败谁，只需要在恰当的时候递上一句恰当的话——这句话我们已经练了六十年。"
 TAR_rd_war_firstshot: "第一份宣战书"
 TAR_rd_war_firstshot_desc: "第一枪不该由最恨我们的那一家开。所以我们自己挑一个对手、自己挑一个日子——从此这场战争的时间表在我们手里。"
 TAR_rd_war_vca_case: "菲舍尔的案卷"
 TAR_rd_war_vca_case_desc: "他追捕我们的方式很体面：不发通缉令，只发请柬。把请柬的存根按日期排好，就是一份开斯特情报网的编制表。"
 TAR_rd_war_vca_declare: "血债要当面清"
 TAR_rd_war_vca_declare_desc: "十七区那一夜，军官的名字我们一个一个记着。她可以把那称作合作，我们把它称作账——账是要清的，而且要在场清。"
 TAR_rd_war_vca_field: "十七区会战"
 TAR_rd_war_vca_field_desc: "他们的优势是名单，我们的优势是地形：每一条我们走过十年的运粮道，都是他们地图上的空白。"
 TAR_rd_war_vca_siege: "都内加隆的围墙"
 TAR_rd_war_vca_siege_desc: "北边的城墙是维多利亚修的，用来挡住他们自己人。我们不需要攻破它，只需要让城里的人相信：墙外已经有别的政府。"
 TAR_rd_war_vca_terms: "摘下那顶帽子"
 TAR_rd_war_vca_terms_desc: "代号即职务，职务即可替换。她交出监听站、通行许可底档和那句「我只为部分的维多利亚服务」——我们照原样收下整套东西。"
 TAR_rd_war_vca_done: "把开斯特收进柜子里"
 TAR_rd_war_vca_done_desc: "第一条线收束。从此北边没有人再替我们数人头——但也没有人替我们守北边，那得我们自己守。"
 TAR_rd_war_tar_seat: "加斯特里尔号上的座位"
 TAR_rd_war_tar_seat_desc: "他用七年把动荡遏制在自己领地之内，代价是不肯替我们说话。这次我们去谈的不是同盟，是那张桌子还剩几个位子。"
 TAR_rd_war_tar_backbone: "近卫队想起自己是谁的军队"
 TAR_rd_war_tar_backbone_desc: "赤铁近卫队的队长同时是领袖的近侍——他领两份饷，我们不去戳穿，只是让全队都看见这件事。一支不必向任何人解释的军队，已经开始换主人了。"
 TAR_rd_war_tar_terms: "公爵要的是一个结局"
 TAR_rd_war_tar_terms_desc: "他把七十年不肯说出口的那句话先讲了：公爵领要的是一个结局，不是两场战争。手杖横在膝上，他没有起身——他不是起不来，是不愿给这场谈话添上臣服的形状。"
 TAR_rd_war_tar_puppet: "把公爵领挂上我们的旗"
 TAR_rd_war_tar_puppet_desc: "不打。他名下那些省本来就一半挂着塔拉的旗；我们只是让外交部的抬头改一行字，从此他递出的每份公文都要经我们的手。"
 TAR_rd_war_tar_garrisons: "接收要塞、仓库与花名册"
 TAR_rd_war_tar_garrisons_desc: "傀儡国最容易死在账上：口令、库存、值夜表。我们派去的人不带旗子，带的是清点单——三样都签了字，这一线才算真的没有枪声。"
 TAR_rd_war_tar_done: "公爵领就此结束"
 TAR_rd_war_tar_done_desc: "不是两支塔拉对等合并：一个政权结束，它的人才、番号与档案全部转籍。从今往后，"铁公爵"是一个地名的一部分。"
 TAR_rd_war_wki_mourn: "替安费莉丝发丧"
 TAR_rd_war_wki_mourn_desc: "她死在自己的要塞里，凶手被写成「莱塔尼亚人的阴谋」。我们不去查那桩案子，我们只是把花圈抬到她的军官面前。"
 TAR_rd_war_wki_declare: "冯提尔的旧账"
 TAR_rd_war_wki_declare_desc: "撑腰那次政变的人现在还领着一份军饷。我们不需要说服这支军队，只需要让它的军官先算清自己欠谁。"
 TAR_rd_war_wki_field: "全能号与荣光号"
 TAR_rd_war_wki_field_desc: "陆行舰的图纸人人都有一份，唯一没有的是操作它的人。所以我们打的不是船，是船上那三百个还没被挖走的技师。"
 TAR_rd_war_wki_siege: "诺伯特区"
 TAR_rd_war_wki_siege_desc: "他们把那一区当作盾牌抛出来，就像抛掉一份不好归档的报告。我们把它接住，接住的就是一个名分。"
 TAR_rd_war_wki_terms: "加拉瓦铁盾的口令"
 TAR_rd_war_wki_terms_desc: "一座会移动的要塞，一份不需要忠诚的城防。谁拿到控制口令，谁就拿到北境二十年不用说话的权利。"
 TAR_rd_war_wki_done: "收起温德米尔的旗"
 TAR_rd_war_wki_done_desc: "边防集团军不会为任何人守边——除了那个能按时发饷、并且把番号原样留下的人。这次是我们。"
 TAR_rd_war_go_chair: "肖恩的椅子"
 TAR_rd_war_go_chair_desc: "他要的从来不是王座，是王座旁边一把能坐的椅子。椅子便宜，而且坐上去的人不会怀疑椅子是别人搬来的。"
 TAR_rd_war_go_declare: "把边界线往回画一格"
 TAR_rd_war_go_declare_desc: "边境领之所以是边境领，因为地图上那条线画在它中间。我们不动那条线，我们只是让线两边的人先认同一个名。"
 TAR_rd_war_go_field: "典范军条款"
 TAR_rd_war_go_field_desc: "那支军队至今相信自己才是维多利亚的军队。所以我们不劝它投降，我们只让它读一份条款：谁付饷，谁指挥，谁负责。"
 TAR_rd_war_go_siege: "暮辉河岸"
 TAR_rd_war_go_siege_desc: "那一夜全体静默，不是因为虔诚，是因为所有人都听见了对岸在换防。我们只要在那份静默里说一句人话。"
 TAR_rd_war_go_terms: "复员令"
 TAR_rd_war_go_terms_desc: "一支没有统帅的军队只是一群带着武器的手艺人。我们给他们发路费、发证书、发一块地——然后请他们把枪留下。"
 TAR_rd_war_go_done: "收高多汀的边"
 TAR_rd_war_go_done_desc: "边境领的税卡换了一面旗，商队却照旧排队。一条线真正的归属，从来是由排队的人决定的。"
 TAR_rd_war_lines_done: "维多利亚已无完整之国"
 TAR_rd_war_lines_done_desc: "四条线各自收束的那天，没有人宣布战争结束——只是再也没有一个能代表"维多利亚"签字的人了。剩下的是一堆地契、番号，和一份必须有人写的清单。"
 TAR_rd_war_lords_summons: "六张地契开庭"
 TAR_rd_war_lords_summons_desc: "伯爵领、子爵领、男爵领——他们的地契比我们的历史还长。所以我们不革命，我们开庭：把每一份地契按同一部律法读一遍。"
 TAR_rd_war_garrison_summons: "给驻军一份换防表"
 TAR_rd_war_garrison_summons_desc: "塔拉驻军、城防军、封锁队——他们中的大多数只是没被换防的普通人。我们不审他们，我们给他们写一张回家的日期。"
 TAR_rd_war_red_summons: "公社与盖尔兰的钟"
 TAR_rd_war_red_summons_desc: "公社不认王冠也不认红龙，只认车间的下班钟；独立派要的则是同一个词的另一份读法。两种都不好用，但两种都能被安排。"
 TAR_rd_war_navy_summons: "给皇家海军一个港口"
 TAR_rd_war_navy_summons_desc: "他们不缺旗，缺的是能加煤的码头。所以我们不谈忠诚，只谈泊位：我们的港口对任何一面愿意升起的旗开放。"
 TAR_rd_war_lords_fold: "把这些名字折进地图"
 TAR_rd_war_lords_fold_desc: "十九个省、五个性、三种口音。折起来占不了多少地方，展开来却够一支军队迷路——这就是我们为什么要亲手折它。"
 TAR_rd_war_garrison_fold: "收钥匙"
 TAR_rd_war_garrison_fold_desc: "换防表签完，钥匙就归写表的人。从此塔拉的路口由塔拉人值夜——哪怕这批人昨天还站在对面。"
 TAR_rd_war_red_fold: "让两种读法并排写"
 TAR_rd_war_red_fold_desc: "承认独立派，也承认公社——不是为了它们，是为了让后来的人无法再说"塔拉人只会分裂"。这句话我们说了太多年，该让它变成别人的了。"
 TAR_rd_war_navy_fold: "海上的那一面旗改掉"
 TAR_rd_war_navy_fold_desc: "我们从来没有海军，我们只有一座愿意收留它的港。这两件事在地图上看起来是一样的。"
 TAR_rd_war_meet_walls: "会师城下"
 TAR_rd_war_meet_walls_desc: "谁先进城，谁就替所有人决定「维多利亚」是什么意思。这一格没有退路：我们烧掉它，或者被它烧掉。"
 TAR_rd_war_besiege: "围城"
 TAR_rd_war_besiege_desc: "围而不打是一种耐心，也是一种奢侈：我们耗不起，对面同样耗不起。区别只在于谁先让城里的人知道外面的粮价。"
 TAR_rd_war_cistern: "断水断粮"
 TAR_rd_war_cistern_desc: "一座两百万人的城每天要喝掉一条河。我们不去数它有多少门炮，我们去数它的水门、磨坊和铁路转车盘。"
 TAR_rd_war_breach: "破城"
 TAR_rd_war_breach_desc: "缺口是工兵用三十六个小时换的。进去之后第一件事不是升旗，是找报社、医院和通讯基站——谁先开口，谁就赢了这座城。"
 TAR_rd_war_harbor: "「下一次停靠，在伦蒂尼姆的港口」"
 TAR_rd_war_harbor_desc: "她说这句话的时候还在别人的船上。如今那条船真的靠了岸，岸上没有人再来接舷——因为接舷的人已经换了旗。"
 TAR_rd_war_final_sword: "用剑写完的地图"
 TAR_rd_war_final_sword_desc: "谈判要一纸一纸地签，剑只需要一次。我们清楚代价：从今天起，地图上每一道边界线都是我们自己的坟。"
 TAR_rd_war_final_table: "一纸一纸签回来的地图"
 TAR_rd_war_final_table_desc: "城已经破了，剩下的只是要不要再死人。每一顶帽子都保住了自己的檐角，从此在同一张桌子上摘帽——慢、脏、要付钱。"
 TAR_rd_war_final_commonwealth: "塔拉尼亚共同体"
 TAR_rd_war_final_commonwealth_desc: "不是一个国家，是一份共同防务的章程：谁被打，谁就被全体看见。我们把名字让出去，换别人把军队让出来。"
 TAR_rd_war_capital: "把首都写在哪个名字上"
 TAR_rd_war_capital_desc: "伦蒂尼姆是敌人的心脏，纳斯尔沙是我们埋人的地方，小丘郡是我们出生的地方。选一个写进公文抬头——另外两个从此只在脚注里出现。"
 TAR_rd_war_crown_settle: "谁坐在哪"
 TAR_rd_war_crown_settle_desc: "冠冕、账本、还有那张桌子——三样东西不能由同一个人拿。我们终于有资格把这句话写成制度，也终于有人开始讨厌这个制度。"
 TAR_rd_war_victoria_done: "一个名字，许多人"
 TAR_rd_war_victoria_done_desc: "「只有维多利亚的君王和他们的第一继承人才有资格以维多利亚为姓氏。」今天我们投票改了这一条：谁被这片土地收留，谁就姓它。"

