# ══════════════════ 事件 ══════════════════
 rhlco.1.t: "与罗德岛谈判"
 rhlco.1.d: "谈判桌摆在特里蒙总部顶层。罗德岛的名单上有三个名字：安东尼、伊芙利特，以及一位已经很多年没有出现在新闻里的前莱茵生命总辖代理。赫默作为中间人坐在两侧之间。桌上放着三份文件——合作的、对抗的，和一笔纯粹的生意。"
 rhlco.1.a: "签合作备忘录"
 rhlco.1.b: "宣布罗德岛为敌对组织"
 rhlco.1.c: "只谈生意，不谈立场"
 rhlco.2.t: "深海恐惧"
 rhlco.2.d: "使者的回函送到了特里蒙。信纸的材质不属于任何已知陆地文明，译文只有一句话，剩下的部分是无法归类的潮汐般的数据流。编译员把报告放到桌上时手还在抖。现在，哥伦比亚要决定让多少人知道海的那边有什么。"
 rhlco.2.a: "公开数据：国民有权知道"
 rhlco.2.b: "封锁消息：恐慌比深海更危险"
