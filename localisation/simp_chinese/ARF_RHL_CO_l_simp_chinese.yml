 RHL_co_pacify: "莱茵生命·安抚民众"

# ══════════════════ 决议 · 企业文化 ══════════════════
 RHL_co_cul_council: "召开十科合议"
 RHL_co_cul_council_desc: "十科主任齐聚合议厅，为国家的下一步争吵、妥协、达成共识。会后照例有一份谁都不完全满意的纪要。\n\n「帕尔维斯端着茶杯坐在角落，等着看谁会先拍桌子。」"
 RHL_co_cul_superman: "帕尔维斯的超人计划"
 RHL_co_cul_superman_desc: "结构科主任帕尔维斯提出「超人计划」，以嵌合实验推动科研跃进。伦理委员会的反对票被记入档案，然后归档。\n\n「科学属于超人。庸众不配染指。」"
 RHL_co_cul_stock: "员工配股计划"
 RHL_co_cul_stock_desc: "向莱茵生命全体员工配发股份，让他们成为「企业国家」的股东。工资可能拖欠，分红不会。\n\n「哥伦比亚的选民，现在叫股东。」"
 RHL_co_cul_ethics: "赫默伦理审查"
 RHL_co_cul_ethics_desc: "赫默发起《特里蒙科学伦理联合宣言》，要求所有实验接受伦理审查。审查通过率很高——因为不合格的实验从不上报。\n\n「科学是真切地看向每一个人。」"
 RHL_co_cul_poach: "小贾斯汀的人才收购"
 RHL_co_cul_poach_desc: "商务科主任小贾斯汀用「无法拒绝的合同」从竞争对手挖走顶尖研究员。合同附带的竞业条款只约束对方。\n\n「我帮助疯子们成功。」"
 RHL_co_cul_orphanage: "雅拉的孤儿院扩编"
 RHL_co_cul_orphanage_desc: "人力资源科主任雅拉扩建塞勒涅孤儿院，培养新一代「哥伦比亚的孩子」。课程表上有一门课不对外公开。\n\n「我们这些无处可去的孤儿，都能成为哥伦比亚的孩子。」"

# ══════════════════ 决议 · 展会 ══════════════════
 RHL_co_expo_sky_life: "举办天空生活展会"
 RHL_co_expo_sky_life_desc: "在螺旋桨天堂举办天空生活展会，向全世界展示哥伦比亚的天空热。门票在开售当天售罄，黄牛价翻了四倍。\n\n「握住门票，我们就握住了打开未来大门的钥匙。」"
 RHL_co_expo_propeller: "螺旋桨天堂重建"
 RHL_co_expo_propeller_desc: "重建坠毁的螺旋桨天堂，让它重新升上哥伦比亚的天空。上一次坠落摔碎了十座平台，这一次，园区自己决定航向。\n\n「我才是『螺旋桨天堂』的总长官。」——高登"
 RHL_co_expo_wanxingyuan: "万星园巡礼"
 RHL_co_expo_wanxingyuan_desc: "在全国巡回展出万星园的残骸与技术遗产，纪念克丽斯腾的壮举。观众在最里面那面墙前停留得最久——墙上是双月的照片。\n\n「那么，晚安，泰拉的诸位。晚安，宇宙。」"
 RHL_co_expo_tree_open: "莱茵「树」开放日"
 RHL_co_expo_tree_open_desc: "向公众开放莱茵「树」，让每一个哥伦比亚人都能亲眼看到天空中的奇迹。参观动线经过三道安检，没有人介意。\n\n「一棵飞天的树。人们不需要理解它。」"
 RHL_co_expo_skyloan: "天空贷发行"
 RHL_co_expo_skyloan_desc: "向全国发行「天空贷」，让每一个哥伦比亚人都能投资天空事业。偿付期一百八十天——到期那天，账单比天空先落地。\n\n「我像颗掉进洗衣机里的洋葱。」"
 RHL_co_expo_oxygen: "天空氧气瓶配给"
 RHL_co_expo_oxygen_desc: "向全国配发「天空氧气瓶」，让每一个哥伦比亚人感受天空的味道。瓶身上印着莱茵生命的标志和一行小字：内容物为压缩空气。\n\n「比烈酒更烈，比软饮更软。」"

# ══════════════════ 决议 · 外交 ══════════════════
 RHL_co_dip_rhodes: "与罗德岛谈判"
 RHL_co_dip_rhodes_desc: "与罗德岛就安东尼、伊芙利特、塞雷娅等事宜进行谈判。谈判桌上摆着三份文件，每一份的厚度都不一样。\n\n「安东尼并不是『一条线索』，而是一个活生生的人。」——赫默"
 RHL_co_dip_hunt_rhodes: "追捕罗德岛"
 RHL_co_dip_hunt_rhodes_desc: "谈判破裂了。罗德岛的航道、补给点与隐藏据点被逐一标注在地图上。猎犬已经松开了绳子。"
 RHL_co_dip_purge_maylander: "梅兰德清算"
 RHL_co_dip_purge_maylander_desc: "对梅兰德基金会进行清算，清除其在政府、军队、媒体中的影响力。他们的准则写得很干净：重大偏差，立即停止——这一次的偏差是他们自己。\n\n「梅兰德不会容许任何人触碰不应触碰的信息。」"
 RHL_co_dip_victoria: "维多利亚复仇宣传"
 RHL_co_dip_victoria_desc: "利用维多利亚碎片大厦的威胁，煽动全国对维多利亚的仇恨。宣传海报上，碎片大厦的影子盖住了整片开拓区。\n\n「没有任何阴谋能阻止大地西边的灯火与孤星永恒闪耀。」"
 RHL_co_dip_leithanien: "莱塔尼亚技术引进"
 RHL_co_dip_leithanien_desc: "与莱塔尼亚高塔术师达成技术交流协议，引进巫术与源石技艺。海关报关单上，金律法卫的军用装置写的是教学器材。\n\n「莱塔尼亚是哥伦比亚的老师。」"
 RHL_co_dip_laterano: "拉特兰天空峰会"
 RHL_co_dip_laterano_desc: "在拉特兰举办天空峰会，邀请各国代表共商天空开发公约。万星园的升空记录摆在每一张桌上——撕开天空的事，从此不只是哥伦比亚的内政。\n\n「如果孕育哥伦比亚下个时代的土壤就是天空，那么我想……它未必容不下一棵飞天的树。」"
 RHL_co_dip_aegir: "阿戈尔接触"
 RHL_co_dip_aegir_desc: "向深海派遣使者，尝试与阿戈尔文明建立联系。回函无法破译，但回声可以被编成数据。\n\n「大静谧之后，阿戈尔也无法继续保持沉默了。」"

# ══════════════════ 决议 · 安抚民众 ══════════════════
 RHL_co_pac_medical: "感染者医疗补贴"
 RHL_co_pac_medical_desc: "向感染者提供医疗补贴，缓解收治区的压力。五百六十九页的合同被简化成一张卡片，卡片背面是下期保费。\n\n「科学是真切地看向每一个人。」"
 RHL_co_pac_pioneers: "拓荒者安置法案"
 RHL_co_pac_pioneers_desc: "通过拓荒者安置法案，为拓荒者提供土地、住房与公民身份。开垦过的土地归开垦的人——前提是他先把合同续上。\n\n「拓荒者是哥伦比亚的血液。」"
 RHL_co_pac_media: "媒体管控"
 RHL_co_pac_media_desc: "加强对媒体的管控，确保所有报道都符合莱茵生命的叙事。特里蒙从此只剩两种新闻：莱茵生命做成了什么，以及莱茵生命将要做什么。\n\n「媒体是莱茵的喉舌。」"
 RHL_co_pac_cool_down: "天空热降温"
 RHL_co_pac_cool_down_desc: "主动为天空热降温，避免经济泡沫破裂。福拉尔街的交易员第一次听说「天空」二字不再等于上涨。\n\n「天堂代表扶摇直上的狂热野心，而螺旋桨的意思也很明确——绝不能停下来。」"
 RHL_co_pac_beast_applause: "兽主的喝彩"
 RHL_co_pac_beast_applause_desc: "为兽主鸭爵献上一场盛大的奇观表演，换取它的默许。表演曲目单上没有第二个观众的名字。\n\n「你们建了树，建了环，建了天堂。很好。但下次，能不能让坠落更好看一点？」"
 RHL_co_pac_amnesty: "大赦天下"
 RHL_co_pac_amnesty_desc: "莱茵生命合众国成立一周年，大赦天下，释放轻罪犯与政治犯。释放名单由法务科拟定，名单之外的照旧。\n\n「哥伦比亚不会亏待好人。」"

