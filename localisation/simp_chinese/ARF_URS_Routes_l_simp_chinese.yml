# 乌萨斯 · 三路线（选国家界面路线卡片专用）
 URS_Route_Holy_Fool:0 "圣愚的邪魔之国"
 URS_Route_Holy_Fool_desc:0 "他们叫他圣愚，因为他赤脚走过乌萨斯的雪，对皇帝画像吐唾沫；他们叫它邪魔之国，因为北方的裂口在梦里低语。这条路线把国家交给疯癫、神谕和内卫的黑档案：国策表面是“净化信仰”“封圣”“清洗宫廷”，暗线却是与北原邪魔立约、让不可名状之物渗入军政。玩家可以镇压圣愚、利用圣愚，或让皇帝本人成为下一个圣愚。事件只给审讯记录、涂改的圣像、失踪的村庄。真相从不被说尽：圣愚是邪魔的容器，还是唯一清醒的乌萨斯人？"
 URS_Route_Winter_Spring:0 "冬将军的春天"
 URS_Route_Winter_Spring_desc:0 "冬将军不是一个人，而是一套让乌萨斯活过冬天的制度：配给、征召、流放、沉默。这条路线试图解冻。复员、特赦、有限开放、与邻国缓和——国策树看起来像春天。但冰雪下埋着旧账：归乡者、被平反的冤魂、分裂的军官团、觉醒的边疆。玩家可走真解冻、假改革，或让冬将军亲自发动政变。事件在泥泞、融雪和葬礼间展开。春天可能到来，也可能只是下一场冬季攻势前的假象。没有一条路能同时保住帝国和春天。"
 URS_Route_Ursus_Thirst:0 "乌萨斯的渴求"
 URS_Route_Ursus_Thirst_desc:0 "乌萨斯渴求不冻港、缓冲带、粮仓和复仇。这条路线把国家变成一台向外的机器：收复边疆、南下暖海、整合傀儡、总动员。表面国策是恢复帝国荣光，暗线是每一次扩张都在掏空核心——边疆起义、军工寡头、人口枯竭、皇帝缺席。玩家可选皇帝式征服、军部独裁扩张，或革命式输出。事件包括最后通牒、边境公投、冬将军的幽灵。最终，乌萨斯可能得到世界，却发现渴求从未被满足；因为真正缺的不是土地，而是一个不必再靠严寒团结的理由。"
