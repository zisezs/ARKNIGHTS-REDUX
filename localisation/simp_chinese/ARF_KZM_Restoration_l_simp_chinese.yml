 KZM_muster_in_the_woods_tt:0 "§G+4§! 座地图外军用工厂、§G+2§! 座地图外民用工厂；\n§Y未照耀的荣光§!：增援速度 §G+6%§!、陆军防御 §G+6%§!"
 KZM_the_last_charge_tt:0 "§G+45§! 陆军经验、§G+8%§! 战争支持度；\n§Y未照耀的荣光§!：突破 §G+8%§!、陆军经验获取 §G+6%§!、陆军攻击 §G+6%§!"
 KZM_unshone_glory_tt:0 "§G+6§! 座地图外军用工厂；§Y整军备战§! 若仍在生效则被移除；\n§Y未照耀的荣光§! 满档：陆军攻击 §G+24%§! / 陆军防御 §G+18%§! / 突破 §G+24%§! / 增援速度 §G+24%§! / 陆军经验获取 §G+24%§! / 工厂最高效率 §G+18%§!"
 KZM_tt_polar_dawn:0 "§R大起义§!：\n· 脱离乌萨斯帝国的附庸身份\n· 执政党换为§Y卡西米尔复国骑士团§!（特殊意识形态）\n· 国家领袖换为§Y玛恩纳·临光§!，特质§Y黄金天马§!（陆军突破 §G+50%§! / 陆军防御 §R-20%§!）\n· 国名改为§Y卡西米尔复国骑士团§!\n· 所有本国核心州的控制权即刻回到卡西米尔手中\n· 先以§Y白和§!退出全部在打的战争，把战线清空\n· 对§R乌萨斯帝国§!宣战（只收复卡西米尔本土核心州）\n· 拉出 §G14§! 个师，含 §G2§! 个银枪天马装甲师\n· 解除§Y乌萨斯的军事占领§!与§Y「深层政府」之影§!，§G+15%§! 稳定度、§G+20%§! 战争支持度"

 # ---------------------------- 民族精神 / 地区特性 ----------------------------
 KZM_dyn_unspoken_fury:0 "未声张的怒火"
 KZM_dyn_unspoken_fury_desc:0 "它没有宣言、没有番号、没有在国民院被念出来过一次。它只是从遣散纸、账簿、地窖、空位子和百里篝火里，一寸一寸把这个国家挤到了一起。\n\n数值随左侧分支的每一格国策原地成长，满档为：\n§Y可征召人力§! §G+24%§!\n§Y战争支持度§! §G+24%§!\n§Y稳定度§! §G+18%§!\n§Y陆军组织度§! §G+18%§!\n§Y敌占区抵抗增长§! §G+24%§!\n§Y工厂产能§! §G+24%§!"
 KZM_dyn_unshone_glory:0 "未照耀的荣光"
 KZM_dyn_unshone_glory_desc:0 "荣光没有被照亮，不等于没有发光。它藏在地窖、夜班报表、一页操典和雾天里自己站齐的队伍中，等着早上。\n\n数值随右侧分支的每一格国策原地成长，满档为：\n§Y陆军攻击§! §G+24%§!\n§Y陆军防御§! §G+18%§!\n§Y突破§! §G+24%§!\n§Y增援速度§! §G+24%§!\n§Y陆军经验获取§! §G+24%§!\n§Y工厂最高效率§! §G+18%§!"
 KZM_dyn_reso_bastion:0 "复国骑士团根据地"
 KZM_dyn_reso_bastion_desc:0 "一间地窖、一只不卖的空箱子、一条能躲开哨卡的小路。这里名义上仍在联合领的管辖之内，实际上已经换了一把锁。\n\n§Y本地可用工厂§! §G+15%§!\n§Y本地可征召人力§! §G+20%§!\n§Y本地建筑槽位§! §G+20%§!\n§Y抵抗度增长§! §G+15%§!\n\n全境有 §G7§! 个以上州挂上此特性时，骑士团将能腾出大量§Y地图外军用工厂§!；§G11§! 个与 §G17§! 个时另有两档追加。"

 # ---------------------------- 决议 ----------------------------
 KZM_restoration_decisions:0 "暗桩与地窖"
 KZM_restoration_decisions_desc:0 "复国骑士团在卡西米尔各片区的联络与铺桩作业。"
 KZM_resto_dec_heartland:0 "首都圈的暗桩"
 KZM_resto_dec_heartland_desc:0 "卡瓦莱利亚基不需要藏人，它太亮了，亮到没有人会仔细看谁在街上走。在首都与其三块腹地中选定 §G2§! 个州建立复国骑士团根据地。"
 KZM_resto_dec_arena:0 "巡回线的暗桩"
 KZM_resto_dec_arena_desc:0 "器材车、随队扈从、医疗帐篷、兑奖处——这条每年在诸城之间来回一趟的线路，运什么、卸什么、谁在哪个站台下来，从来没有人查过。在特锦赛诸城中选定 §G2§! 个州建立复国骑士团根据地。"
 KZM_resto_dec_highlands:0 "北部之路的暗桩"
 KZM_resto_dec_highlands_desc:0 "收税的人懒得爬这段山路，驻军的人嫌夜里冷。进门前把剑留下，吃饭时不问名字。在南部山地与村落中选定 §G2§! 个州建立复国骑士团根据地。"
 KZM_resto_dec_lakes:0 "湖区与林间的暗桩"
 KZM_resto_dec_lakes_desc:0 "地图上有两种空白：一种没人住，一种没人管。后一种可以藏下一支军队。在湖区与林间选定 §G2§! 个州建立复国骑士团根据地。"
 KZM_resto_dec_link_up:0 "四处串联"
 KZM_resto_dec_link_up_desc:0 "桩子一旦连成线，就不再是桩子了。从四大片区中任选一处尚未挂上特性的州，补上一个复国骑士团根据地。§G30§! 天完成，§G90§! 天后可再来一次。\n\n全境已建成的根据地州数：§Y[?ROOT.KZM_bastion_num|0]§!。"

 # ---------------------------- 事件 ----------------------------
 kzm_resto.1.t:0 "临光家的灯亮到天明"
 kzm_resto.1.d:0 "来人没有名片，也没有报上封号。他把一张折了三次的纸放在桌上，说这是一份仓储公司的开业申请，经营范围写「竞技器材保管与保养」。\n\n玛恩纳看了一眼签名栏。那里空着。\n\n「名字还没定。」对方说。\n\n「那就先不写。」他把纸推回去，「人先定下来。名字会有的——等它有用的那天。」\n\n窗外，卡瓦莱利亚基的灯还亮着。这座城市从来不需要为黑暗做打算，因为它忘了黑暗长什么样。现在有人替它记起来了。"
 kzm_resto.1.a:0 "「不畏苦暗。」"
 kzm_resto.2.t:0 "货架第三层的空箱子"
 kzm_resto.2.d:0 "箱子是空的，这一点很重要。免税商店的店员每天清点，看见它，跳过它，因为一只不卖的东西没有记进流水的必要。\n\n第二周，箱子里多了一卷胶带；第三周，多了一本没人订的《四城竞技报》；第四周，报纸底下压着一张写有地址的纸片，地址在另一座城。\n\n首都的关节一个接一个被摸清楚了。占领军检查一切有招牌的地方。"
 kzm_resto.2.a:0 "继续。"
 kzm_resto.3.t:0 "登记为器材"
 kzm_resto.3.d:0 "巡回线的登记表上有一栏叫「随队器材」，历来填的是长枪、护具、烛火罐和备用线圈。今年这一栏里多了二十几个名字——登记员照例没有抬头，因为比赛季开始前后的站台永远是最忙的。\n\n器材车卸货时从不点人数。这是这个行业三年来养成的习惯，如今成了一条不成文的规矩。\n\n有骑士团的人说，那批人连盾牌都擦得比我们的亮。"
 kzm_resto.3.a:0 "继续。"
 kzm_resto.4.t:0 "滴水村的规矩"
 kzm_resto.4.d:0 "可萝尔把客人领进谷仓，路上只交代了一条：进门前把剑留下。\n\n「宝藏的事，你们在外面已经传了三十年。」她说，「那是我爷爷的爷爷埋的，我不打算在今天聊它。今天聊的是你们要在村里住多久。」\n\n「要看北边的路什么时候能走。」\n\n「那就等路能走的那天。」她把门关上，「吃饭时不问名字。这是第二条。」"
 kzm_resto.4.a:0 "把剑留在门口。"
 kzm_resto.5.t:0 "没人画进地图的那片林子"
 kzm_resto.5.d:0 "猎户认得每一条能绕开哨卡的小路，但他不领路，他只告诉你走到哪棵倒下的树该往左。问他要钱，他会生气；给他一箱酒精，他会问你还有几箱。\n\n湖上有人划船送货，林边有人替马掌钉铁。这些人不问谁是骑士，只问你是不是从南边来、饿不饿。\n\n四片地方的桩子，到今天算是连成了一张网。网眼还很稀，但已经能挂住东西了。"
 kzm_resto.5.a:0 "把网收紧。"
 kzm_resto.6.t:0 "地窖比账簿诚实"
 kzm_resto.6.d:0 "当根据地的数目超过六个，事情就起了变化：物资不再需要往城里运，城里的东西开始往外运。\n\n免税商店的二楼、梅什科的工地、三家酒窖的地下通道，陆续被改成了能开工的样子。它们不在任何一州的建筑表上，因为根本没有一州的表敢收它们。\n\n复国骑士团现在有了一批§Y地图外的军用工厂§!。"
 kzm_resto.6.a:0 "不入账的东西，也就没有人能征用。"
 kzm_resto.7.t:0 "整条巡回线在开工"
 kzm_resto.7.d:0 "十一个州挂上了同一枚暗记。巡回线的器材车不再拉器材，湖上的船不再只送面粉，山村的谷仓里开始传出锤击声。\n\n占领军终于开始查了——他们查有招牌的地方，查有登记的车队，查有编号的旗帜。而这一切都没有编号。"
 kzm_resto.7.a:0 "让他们查。"
 kzm_resto.8.t:0 "一支不在册的军队"
 kzm_resto.8.d:0 "十七个州。这已经不是网，是一张地图——只是画在另一种纸上，由另一批人保管。\n\n玛恩纳第一次在众人面前把那份名单摊开，从头念到尾。念了很久，没有人插话。\n\n念完他说：够了。可以开始准备怎么死了——也准备怎么赢。"
 kzm_resto.8.a:0 "「天要亮了。」"
 kzm_resto.20.t:0 "极夜天曦"
 kzm_resto.20.d:0 "北方的军团在往内陆抽调。驻军的补给队列第一次变短，卡瓦莱利亚基的哨卡在换班时少了一个人。\n\n那天清晨，库房后门打开，外面已经站满了人。他们不是军队——没有番号、没有统一制服、有一半人连像样的护具都没有。他们只是把各自藏了三年的东西带了回来：遣散纸、盾牌、账簿、工具、一把不知道从哪儿弄来的骑枪。\n\n玛恩纳·临光站到最前面。他没有拔剑，先把手里那封压了多年的辞职信撕成两半。\n\n「临光家的人是不是骑士，不是你们说了算的。」\n\n「卡西米尔复国骑士团」——这个名字第一次被人当众念出来，是在第十二次乌卡战争开始前的四十分钟。"
 kzm_resto.20.a:0 "「让所有人都站起来。」"

 # ---------------------------- 意识形态 / 政党 / 领袖 ----------------------------
 knight_restoration_subtype:0 "复国骑士团"
 knight_restoration_subtype_desc:0 "既不是监正会的贵族共和，也不是商业联合会的重商主义。它是一个由遣散的老兵、不入账的商人、无番号的竞技骑士和山里村民临时共用的名字——在被正式承认之前，它只写在一张不归档的纸上。\n\n它的全部纲领只有一句：把「骑士」这个封号，从他们那里夺回来。"
 KZM_Golden_Pegasus:0 "黄金天马"
 KZM_Golden_Pegasus_desc:0 "人们说，他的瞳孔里仿佛流淌着黄金。这个封号他推辞了半辈子——他拒绝成为竞技骑士，拒绝家族给他安排的位置，甚至拒绝在文件上以骑士的身份署名。\n\n最后是他自己把它捡回来的，为了把它重新变成一件有用的东西。\n\n§Y陆军突破§! §G+50%§!\n§Y陆军防御§! §R-20%§!\n§Y战争支持度§! §G+10%§!\n§Y政治点数获取§! §R-10%§!"
 KZM_Mlynar_Nearl:0 "玛恩纳·临光"
 KZM_Mlynar_Nearl_desc:0 "临光家族的长子之弟、战争英雄的兄弟、耀骑士与瑕光的叔叔。他在一家公司做了十年一般职员，几乎没有因私事请过一天假；公司想给他授勋，他回了一句「卡西米尔无权为我授勋」。\n\n他不是没有剑，他是不再相信那把剑该为谁出鞘。「想在规则中战胜规则的主人？痴人说梦。」他说过很多次这样的话，也正因为这样说过，才没人想到第一个把辞职信撕掉的人会是他。\n\n「我从很久以前就在想一件事——我们在痛苦什么。」\n\n十多年后，他终于找到了答案，也找到了自己。"
 Kazimierz_Restoration_Knights:0 "卡西米尔复国骑士团"
 Kazimierz_Restoration_Knights_ADJ:0 "卡西米尔复国骑士团"
 Kazimierz_Restoration_Knights_DEF:0 "卡西米尔复国骑士团"
