 # ==========================================================================
 # 卡西米尔 (KZM) · 第十二次乌卡战争 / 复国骑士团 —— 战时国策树文案
 # 真源：common/national_focus/KZM.txt、common/decisions/KZM_Restoration_Decisions.txt、
 #       events/KZM_restoration.txt、common/dynamic_modifiers/KZM_restoration_dynamic_modifiers.txt
 # 机械效果一律写在 _tt 键里，_desc 只写叙事
 # ==========================================================================

 # ---------------------------- 国策名与描述 ----------------------------
 KZM_the_long_night:0 "长夜临光"
 KZM_the_long_night_desc:0 "和约签订那天没有一个人说话。乌萨斯的使节在监正会的长桌上坐下，把纸推到对面，笔尖压过的地方留下一个墨点。银枪天马的旗帜被收进库房，编号写在纸片上——人们这才知道，一面旗原来是可以有编号的。\n\n那一夜卡瓦莱利亚基的灯照旧亮着，通明得像什么也没有发生。只有一个人把辞职信压进了抽屉最底层，然后走进雨里。临光家的灯亮到天明。\n\n长夜开始了。而长夜里最先醒来的，从来不是睡着的人。"
 KZM_silver_lance_veterans:0 "银枪的旧部"
 KZM_silver_lance_veterans_desc:0 "《征战骑士法》写得明白：入国家军伍的骑士，贵族权益一律冻结到军役结束。战败之后连「冻结」都省了——番号撤销，名册封存，老兵们领到一张遣散纸，回到原来的岗位上继续排队打卡。\n\n玛恩纳一家一家地敲门。他不劝任何人重新拔剑，只问一句：你那张纸，还留着吗。\n\n大多数人把纸翻出来看了一眼，又放了回去。也有几个人那天晚上送他到巷口，谁都没有说话。"
 KZM_patriotic_shareholders:0 "金盏花与马克"
 KZM_patriotic_shareholders_desc:0 "商业联合会里不全是卖国的人，只是他们把账算得比谁都清楚：占领军要抽税、要征用、要按他们的规矩重开市场，一笔一笔都写在董事会上。有人算完这笔账，得出的结论是——再忍三年，卡西米尔就没有能自己开张的铺子了。\n\n于是有了金盏花。那是一种不值钱的花，插在瓶子里就能摆满整张长桌，也是几家商会暗号里「今晚可以说话」的意思。\n\n钱还是那些钱，只是从此不再只往一个方向流。"
 KZM_not_one_shield_left:0 "没有一面被丢下"
 KZM_not_one_shield_left_desc:0 "很多年前，有四十六面印着各自家族纹章的骑士盾牌，从乌萨斯人的包围圈里一路带回了卡西米尔的土地，没有一面被丢下。那一年人们还在说，银枪没有折。\n\n如今说起这件事的老兵已经不多，说得响的更少。玛恩纳把这段旧事抄在一张纸的正面，背面写了一个地址，然后把它交给了第一个愿意伸手的人。\n\n老骑士们要的不是抚恤。他们要的是有人还记得，那四十六面盾牌曾经是怎么带回来的。"
 KZM_cellars_and_ledgers:0 "地窖与账簿"
 KZM_cellars_and_ledgers_desc:0 "卡西米尔的商人从不销毁账簿，他们只是把某些页码挪到别的本子上。搬货单、仓储清点、免税商店的进货流水——这些纸堆在一起，就是一份谁也不敢公开宣读的物资清单。\n\n地窖里堆着的是面粉、麻布、酒精、备用线圈，还有几箱没人认领的旧军械。账房先生说，这些都不算库存，因为它们从来没有卖出去过。\n\n不入账的东西，也就没有人能征用。"
 KZM_shadow_of_the_adeptus:0 "监正会的影子"
 KZM_shadow_of_the_adeptus_desc:0 "监正会从来没有正式反对过和约，它只是在那天把会议推迟了三次，然后照常开会。长桌上少了几个人，那些位子空着，但没人撤走——按老规矩，空位子是要留给人回来的。\n\n大骑士长不表态，就是一种表态。往下的人便学会了在散会之后不走，绕到库房后门外那条短街上说话，说完各自回家。\n\n一个机构开始有影子的时候，说明它已经不打算只活在自己的文件里了。"
 KZM_hundred_li_campfires:0 "百里篝火"
 KZM_hundred_li_campfires_desc:0 "难民和穷人们在城外搭起了连绵百里的营地，夜里的篝火照亮无家可归者的面孔。城市里的人从移动平台的窗子里往下看，说那景色颇为壮观，像一场没人退场的庆典。\n\n篝火堆边上传过一种烤得发硬的面饼，掰开要两个人一起用力。人们起初聊的是收成、税金和进城的路条，后来聊起了别的：谁的父亲是哪一场的兵，谁的手上还有条形码。\n\n卡西米尔的怒火不是被点着的，是它本来就在那儿烧，只是终于有人肯低头看一眼。"
 KZM_let_them_all_stand:0 "让所有人都站起来"
 KZM_let_them_all_stand_desc:0 "「让所有人都站起来。」这句话在滴水村的一间谷仓里被说过一次，说话的人不是骑士，也不是股东，是一个连名字都没被记下来的女人。她说这话的时候没有提高声音，因为谷仓里太挤，安静下来才听得见。\n\n那天散得很快，没有盟誓，没有旗号。人们只是各自回家，第二天照常进城做工，只是走的路和以前不太一样了。\n\n要打破的不是制定规则的人，是规则本身。"
 KZM_unspoken_fury:0 "未声张的怒火"
 KZM_unspoken_fury_desc:0 "卡西米尔的怒火从来没有被宣告过。它没有文件、没有番号、没有在国民院被念出来过一次；它只是从遣散纸、账簿、地窖、空位子和百里篝火里，一寸一寸把这个人多的国家挤到了一起。\n\n玛恩纳说他不相信口号，只相信人数。人数现在已经够了，只是还没有人喊出那个字。\n\n等它喊出来的那天，人们会发现自己早就站好了。"
 KZM_capital_cells:0 "大骑士领的暗桩"
 KZM_capital_cells_desc:0 "卡瓦莱利亚基是一座不需要藏人的城市——它太亮了，亮到没有人会仔细看谁在街上走。免税商店、竞技场通道、梅什科的工地、蓝耳酒窖的送货车，每一处都是人流的关节，每一处都可以是接头点。\n\n暗桩就设在这些关节上。它们不挂招牌，只在货架第三层留一只不卖的空箱子。\n\n首都不是占领军的后方，首都是所有人的前台。前台是可以换锁的。"
 KZM_tournament_circuit:0 "特锦赛的巡回线"
 KZM_tournament_circuit_desc:0 "骑士特别锦标赛养活了一条完整的巡回线：器材车、随队扈从、医疗帐篷、博彩兑奖处、一百七十二家媒体的记者。这条线每年在卡西米尔的诸城之间来回一趟，运什么、卸什么、谁在哪个站台下来，从来没有人查过。\n\n查不到，因为大家都以为那是比赛。\n\n如今巡回线上多了一批不比赛的骑士，他们带着自己的盾牌，登记为器材。"
 KZM_road_to_the_north:0 "通往北部的必经之路"
 KZM_road_to_the_north_desc:0 "滴水村在山区，是从南边进卡西米尔北部的必经之路。村子小，没有移动城市经过，因此既管不着也顾不上——收税的人懒得爬这段山路，驻军的人嫌夜里冷。\n\n村长可萝尔替一整个家族保守着宝藏的秘密，也顺便替一批活人保守着行踪。她说村里只有一条规矩：进门前把剑留下，吃饭时不问名字。\n\n法律管不到的地方，反倒成了最讲规矩的地方。"
 KZM_lakes_and_woods:0 "湖区与林间"
 KZM_lakes_and_woods_desc:0 "湖区与林间是移动城市较少经过的地方。莱塔尼亚式的商业街修在茨沃涅克，修不进这些村子；斯沃玛的连锁超市开到镇口，货却进不了林子深处。\n\n这些地方有自己的一套：湖上有人划船送货，林边有人替马掌钉铁，猎户认得每一条能躲开哨卡的小路。他们不问谁是骑士，只问你是不是从南边来、饿不饿。\n\n一个国家的地图上有两种空白：一种没人住，一种没人管。后一种可以藏下一支军队。"
 KZM_knightly_cellars:0 "骑士团的地窖"
 KZM_knightly_cellars_desc:0 "《征战骑士法》禁止贵族私募军队。于是复国骑士团不承认自己是军队，它登记为一家仓储公司，注册地在免税商店的二楼，经营范围写着「竞技器材保管与保养」。\n\n地窖里那些器材需要经常保养，保养需要工具、零件、图纸，还需要一批人反复进出而不被认为是在训练。这些条件都满足了，只差一个名字。\n\n名字后来有了——在一张不入账的清单最下面，有人用炭笔写了三个字。"
 KZM_night_shift_at_glorious:0 "辉煌盾的夜班"
 KZM_night_shift_at_glorious_desc:0 "辉煌盾工业公司出产军工产品，也出产越野车载具。它的白班按合同走，夜班按别的东西走——夜班的产量从来对不上报表，因为报表上那一栏叫「试制损耗」。\n\n厂里的人管这叫加班费。领的人不花钱，只换成一箱一箱不发往客户的箱子。\n\n一台机器转一夜能出多少件，工头心里有数；他没说，因为他也想看看那些箱子最后运到哪儿。"
 KZM_retired_officer_lectures:0 "退役军官的讲习所"
 KZM_retired_officer_lectures_desc:0 "讲习所开在一家骑士竞技酒吧里，招牌是「战术复盘」——这行当在卡西米尔合法，因为人人都以为它和赌马是一回事。晚上人少的时候，黑板上写的就不是赔率了。\n\n来讲课的都是被遣散过的人。他们讲怎么在夜里集合，讲怎么让一个连在失去团长之后还继续前进，讲怎么把一次冲锋的时机算到秒。\n\n讲到最后一句总是同一句：看清苦难再发起冲锋，才是真正的骑士必须具备的素养。"
 KZM_pegasus_charge_manual:0 "天马冲锋操典"
 KZM_pegasus_charge_manual_desc:0 "银枪天马的操典从来没有印出来过。它散落在几十个人的脑子里，每个人记得的段落都不一样，凑在一起反倒比任何一本手册都完整。\n\n新抄的这本只有一页：什么时候该快，什么时候该把人让开。写得极短，因为冲锋这件事，能教的部分本来就不多。\n\n「如果觉得浪涛吵闹，就去令大海平静。」"
 KZM_false_banners:0 "假番号"
 KZM_false_banners_desc:0 "骑士团要有一个不存在的番号，这件事在卡西米尔出奇地容易——这里本来就有八支大骑士团、六十四支骑士团，名字一个比一个响亮，注销的比新建的少。\n\n于是一支从未参赛的队伍，被登记成了某支历史悠久的骑士团的分遣队。它的成员名单上写着职业：器材搬运、随队医疗、博彩兑奖员。\n\n番号是假的，人是真的。等真到上阵那天，没有人会去查那张表。"
 KZM_muster_in_the_woods:0 "林间的集结"
 KZM_muster_in_the_woods_desc:0 "林间地带来回运了三年的东西，终于开始往一个方向去了。补给点、修械棚、马料库、几处能过炮车的林道，全都不在任何地图上——因为画地图的人从没打算进这片林子。\n\n第一次整队集合是在一个雾天。没有人喊口令，队伍是自己站齐的。\n\n那天来的人比计划多了两百个，谁也没让他们走。"
 KZM_the_last_charge:0 "最后一次冲锋"
 KZM_the_last_charge_desc:0 "玛恩纳在队列前站了很久，久到有人以为他不会说话了。他说的第一句话不是关于荣耀，也不是关于复仇。\n\n他说：我从很久以前就在想一件事——我们到底在痛苦什么。想明白的那天，我就知道这一天会来。\n\n「临光家的人是不是骑士，不是你们说了算的。」\n\n这是他最后一次以普通职员的身份说话。下一次开口，就是号令。"
 KZM_unshone_glory:0 "未照耀的荣光"
 KZM_unshone_glory_desc:0 "卡西米尔的荣光已经很久没有被照亮过了。它不挂在冠军墙上——冠军墙展厅的地下那道门，如今只有卷宗管理员凭钥匙才开得了；它也不在赛场上，赛场有别的灯。\n\n它在地窖里、在夜班的报表上、在一页只写了两个问题的操典里、在雾天自己站齐的队伍中。\n\n没有被照耀，不等于没有发光。这只是还没到早上。"
 KZM_polar_dawn:0 "极夜天曦"
 KZM_polar_dawn_desc:0 "乌萨斯的统一战争打响了。北方的军团开始往内陆抽调，驻军的补给队列第一次变短，卡瓦莱利亚基的哨卡在换班时少了一个人。\n\n天要亮了。在极夜尽头亮起来的那种光，不是温柔的光——它是把整片雪原一起点燃的那种。\n\n玛恩纳·临光把那封压了多年的辞职信从抽屉里拿了出来，看也没看，撕成两半。他推开库房后门，外面已经站满了人。\n\n「不畏苦暗。」"

