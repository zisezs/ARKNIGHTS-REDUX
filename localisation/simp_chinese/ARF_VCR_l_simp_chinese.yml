 #国家精神
 VCR_The_rule_of_innovation: "未敢奢想的革新之治"
 VCR_The_rule_of_innovation_desc: "克雷加文子爵治下封地是一片属于感染者与难民的乐土。尽管他的两位盟友——开斯特公爵与法夫公爵曾对此多次提出批评意见，但克雷加文依旧我行我素、倾力推动针对境内感染者的收容项目。不仅如此，他的接纳政策与配给改革也显著改善了难民生活环境。毫无疑问，这虽为克雷加文赢来了前所未有的光辉口碑，却也招致了来自其他公爵的冷眼相待。"