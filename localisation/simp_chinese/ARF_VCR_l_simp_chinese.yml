 #人物
 VCR_Harold_Craigavon: "哈洛德·克雷加文"
 VCR_Harold_Craigavon_desc: "克雷加文子爵世代效忠阿斯兰皇族，哈洛德·克雷加文也不例外，但他所抱持的理念却与父辈们不尽相同。在表面上，他恪守贵族礼仪、堪称子爵模范；可内心中，他却早已厌倦了逢场作戏——正如子爵亲口所言，“勋章不过是镀金的枷锁”。帝国陷入动乱后，他对麾下士兵平等相待，要求将物资优先运往伤兵营。这些努力虽因上级阻挠而功败垂成，却已立住了他身为革新派贵族的形象。\n而在他奉“灰礼帽”命令向塔拉叛党传递假情报之际，他亲眼目睹了深池组织救助难民的场面。这一刻，克雷加文对自身的定位与使命萌生了深刻怀疑。回到封地后，他积极联络民主派人士，并奉行高度开明的社会政策，希望有朝一日可为维多利亚带来些许改变——§R假若他能继续隐瞒自己的感染者身份。§!"
