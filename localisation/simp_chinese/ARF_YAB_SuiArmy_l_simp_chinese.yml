# ---------------- 事件：岁相显化（安北都护府本面） ----------------
 sui_yab.1.t: "岁相显化"
 sui_yab.1.d: "入冬之后，安北的雪就没有停过。\n\n先是祭坛。再是营门外站着的兵。再后来，是雪原尽头那道横贯天地的影——像鳞，像脊，像某种不该被看见的东西终于不再掩藏。\n\n都护的印信还压在案头，帐外的军已经不听点了。他们卸下炎军的号衣，在雪里重新列阵，自称「岁军」。\n\n有人在阵前跪了一夜。天亮时他站起来，面朝南方——朝大炎的方向。\n\n祂要的从来不只是安北。"
 sui_yab.1.a: "（雪原尽头，祂睁开了眼）"
 sui_yab.1.tt: "安北都护府易帜为「§R岁军§!」，脱离大炎管辖。\n岁军获得三十个「§R岁军§!」步兵师（16 步兵营，满编）。\n岁军向大炎宣战。"

# ---------------- 新闻超事件：岁相显化-都护府叛乱 ----------------
 sui_yab.2.t: "岁相显化-都护府叛乱"
 sui_yab.2.d: "安北都护府易帜。\n\n都护府的军帐一夜之间换了旗。旗上无字，只有一道横贯天地的影，像某种庞大之物的脊背。\n\n哨探说，雪原上列起了新的军阵。阵中没有喧哗，没有人说话，队列从雪里一直排进雪里。\n\n他们自称为「岁军」。\n\n边报送到百京时，炉上的茶还没有凉。"
 sui_yab.2.a: "急报百京。"
