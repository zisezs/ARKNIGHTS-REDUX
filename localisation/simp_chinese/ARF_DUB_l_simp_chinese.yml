# ── 决议：饮火（解锁【死火复生】） ──
 TAR_rd_dead_fire: "饮火"
 TAR_rd_dead_fire_desc: "柴堆边上的规矩是：先把自己的火分出去，再谈收回来。\n领袖愿意分的那一份，和普通人愿意接的那一份，不是同一种东西。这三十天里没有人签任何文件——名册只是被翻到了最后一页。"
 TAR_rd_dead_fire_start_tt: "§Y紫火开始烧名册§!：这三十天里§R稳定 -15.00%§!、§R政治点数获取 -20.00%§!、§G战争支持度 +10.00%§!。到期后§Y直接把【死火复生】立上§!，省掉一百点立法费。"
 TAR_rd_dead_fire_tt: "§Y【死火复生】立即生效§!（政治页·动员法律）：可征募人口 100%、人口增长归零、工厂与船坞产出 −40%、动员速度 +1000%、政治点数消耗归零、补给消耗 −30%、解锁营级兵种「死火行尸」。\n§R人力 -40000§!、§R稳定 -10.00%§!、§G战争支持度 +10.00%§!。若已经立过法，这一格只补仪式的代价。"
 TAR_rd_relic_recall_oath_tt: "§Y「校官」被解除职务§!——如果他此刻正挂在我们的顾问席上。他效忠两面旗，如今两面旗都要他给出一个说法。"
 TAR_rd_proclaim_holy_tara_tt: "§Y塔拉诸省转为我们的核心§!：凡我们控制、且带塔拉州标志的省份，落款一改即成故土。维多利亚保留宣称，日后要从我们手里夺回去。"

# ── 专属兵种：死火行尸（营级） ──
 dub_dead_fire_walker: "§Y死火行尸§!"
 dub_dead_fire_walker_tech: "死火行尸"
 dub_dead_fire_walker_tech_desc: "一营一千人不需要一千支铳——一支传下去，前一个人倒下的位置就站上来一个。\n编制面板与普通步兵营完全一致，区别只在三处：装备只要一件、人力要十倍、训练三十天。\n换句话说：我们不再缺枪，我们缺的是能倒下去第二次的名字。"

# ── 决议：加入双塔协定 ──
 TAR_rd_join_twin_towers: "加入双塔协定"
 TAR_rd_join_twin_towers_desc: "仗打完了，名分却还要人替我们看着。双塔协定是莱塔尼亚人搭的台子，如今台上站着的是我们——把自家那面旗收进库房，换一张坐得下的椅子。"
 TAR_rd_join_twin_towers_tt: §Y解散我们自己当家的阵营§!（走「共同体」终幕时立下的塔拉尼亚共同体），转而§Y加入双塔协定§!。莱塔尼亚还在当家就由它把我们拉进去；当家换了人或阵营已散，就照同一份章程重立门户、由我们坐主位。§G战争支持度 +5.00%§!、§G政治点数 +30§!。
