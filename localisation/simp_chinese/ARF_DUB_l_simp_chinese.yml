# ── 决议：饮火（解锁【死火复生】） ──
 TAR_rd_dead_fire: "饮火"
 TAR_rd_dead_fire_desc: "柴堆边上的规矩是：先把自己的火分出去，再谈收回来。\n领袖愿意分的那一份，和普通人愿意接的那一份，不是同一种东西。这三十天里没有人签任何文件——名册只是被翻到了最后一页。"
 TAR_rd_dead_fire_start_tt: "§Y紫火开始烧名册§!：这三十天里§R稳定 -15.00%§!、§R政治点数获取 -20.00%§!、§G战争支持度 +10.00%§!。到期后§Y直接把【死火复生】立上§!，省掉一百点立法费。"
 TAR_rd_dead_fire_tt: "§Y【死火复生】立即生效§!（政治页·动员法律）：可征募人口 100%、人口增长归零、工厂与船坞产出 −40%、动员速度 +1000%、政治点数消耗归零、补给消耗 −30%、解锁营级兵种「死火行尸」。\n§R人力 -40000§!、§R稳定 -10.00%§!、§G战争支持度 +10.00%§!。若已经立过法，这一格只补仪式的代价。"
 TAR_rd_relic_recall_oath_tt: "§Y「校官」被解除职务§!——如果他此刻正挂在我们的顾问席上。他效忠两面旗，如今两面旗都要他给出一个说法。"
 TAR_rd_proclaim_holy_tara_tt: "§Y塔拉诸省转为我们的核心§!：凡我们控制、且带塔拉州标志的省份，落款一改即成故土。维多利亚保留宣称，日后要从我们手里夺回去。"

# ── 专属兵种：死火行尸（营级） ──
 dub_dead_fire_walker: "§Y死火行尸§!"
 dub_dead_fire_walker_tech: "死火行尸"
 dub_dead_fire_walker_tech_desc: "一营一千人不需要一千支铳——一支传下去，前一个人倒下的位置就站上来一个。\n编制面板与普通步兵营完全一致，区别只在三处：装备只要一件、人力要十倍、训练三十天。\n换句话说：我们不再缺枪，我们缺的是能倒下去第二次的名字。"

# ── 决议：加入双塔协定 ──
 TAR_rd_join_twin_towers: "加入双塔协定"
 TAR_rd_join_twin_towers_desc: "。"
 TAR_rd_join_twin_towers_tt: "§Y解散我们自己当家的阵营§!（走「共同体」终幕时立下的塔拉尼亚共同体），转而§Y加入双塔协定§!。莱塔尼亚还在当家就由它把我们拉进去；当家换了人或阵营已散，就照同一份章程重立门户、由我们坐主位。§G战争支持度 +5.00%§!、§G政治点数 +30§!。"
DUB_s1_song_of_dublinn: "深池之诗"
DUB_s1_song_of_dublinn_desc: "自从爱布拉娜躲入塔拉的隐秘之处活动以来已经四年有余。维多利亚依然掌控着塔拉的核心地区。而领袖却并不对此感到迷茫——至少在小丘郡，深池已经彻底成为了维多利亚帝国内的塔拉地下王国。"
DUB_s1_burning_dead_fire: "燃烧的死火"
DUB_s1_burning_dead_fire_desc: "塔拉上一次的起义伴随着高卢覆灭也失败了。那次起义的领袖们被枪决，尸体没有还给家里，连名字都从报纸上被抹掉。可维多利亚人不知道的是：火种之所以叫火种，是因为它隐藏在土里。这一次，领袖会告诉他们如何只烧那些该烧的东西。"
DUB_s1_in_the_shadows: "在阴影中"
DUB_s1_in_the_shadows_desc: "深池有一份在阴影中收集的名单，那些名单上的人一个个都会在某个早晨离奇地消失，但维多利亚的报纸只会写「意外」两个字。"
DUB_s1_reeds_of_the_wild: "在小丘的荒野芦苇……"
DUB_s1_reeds_of_the_wild_desc: "小丘郡的芦苇和沼泽是塔拉最为经典的地区。外地人在这里走不出三里路，本地人却能在同一片林子里过完整个冬天。这就是塔拉的幻影，也是塔拉的希望。"
DUB_s1_open_the_garrison: "打开驻军仓库"
DUB_s1_open_the_garrison_desc: "维多利亚的驻军和警察一般把枪锁在仓库里，钥匙会挂在值夜人的腰上。我们不必打赢一场战斗——只要让某个早晨点名时少两个兵、枪架上少十二条枪，剩下的日子他们就会开始怀疑自己的哨兵。"
DUB_s1_free_column: "深池自由纵队"
DUB_s1_free_column_desc: "自由纵队实际上没有多少人，但他们可以在黎明前集结，打一场二十分钟的仗，然后在中午以前全部撤回各自的村子——维多利亚佬可以占领塔拉的每一座城，却始终无法抓到不存在的军队——除非他们想在塔拉作下更多的恶，那很好，领袖在日后会全部清算的。"
DUB_s1_streets_of_nasr: "在纳斯尔沙的大街小巷……"
DUB_s1_streets_of_nasr_desc: "电线杆、邮局、酒馆后门、电车时刻表——每个路口都有深池在隐秘的活动。只为革命，只为……塔拉的独立"
DUB_s1_march_of_the_dead: "亡者的行军"
DUB_s1_march_of_the_dead_desc: "爱布拉娜最引以为傲的是她的亡灵源石技艺，亡者不屈的灵魂在紫色的火焰中重新燃起，为深池和塔拉的独立而进行着永恒的行军"
DUB_s1_potatoes_and_guns: "土豆和武器"
DUB_s1_potatoes_and_guns_desc: "塔拉的农民看似不问政治，却因为众所周知的缘故而对维多利亚佬格外愤恨。很多时候，他们会把土豆和武器装在一起，然后送到我们的驻地。"
DUB_s1_moran_did_you_see: "莫兰，你看见了吗?"
DUB_s1_moran_did_you_see_desc: "莫兰在河谷里唱歌，第二天山那边的孩子就会唱，第三天驻军的营房里也有人吹口哨。"
DUB_s1_littlehill_incident: "小丘郡事件"
DUB_s1_littlehill_incident_desc: "那天早上我们打死了十几个警察和暗探，中午维多利亚驻军就直接向广场上的人群开枪，晚上维多利亚的海军又动用重炮向小丘郡开火。从此小丘郡再没人相信「中立」这个词。"
DUB_s1_poetry_society: "星与火的诗社"
DUB_s1_poetry_society_desc: "一个民族若只记得自己的苦难，就永远只能做苦难的注脚。诗社排的戏永远会让人想到塔拉从前的样子——驮兽、芦苇、乡村。领袖的妹妹亲自帮忙，然后把那些维多利亚人的门票钱换成了步枪。"
DUB_s1_smuggled_aid: "走私的援助"
DUB_s1_smuggled_aid_desc: "那些莱塔尼亚和哥伦比亚塔拉人送回来的船只一般只停在离岸数里的地方，再由校官带着塔拉的渔民用小艇一箱一箱驳回来，箱子上写的是「农机配件」。港口的税吏当然清楚得很，可他家人也早已是深池的成员。"
DUB_s1_letter_from_iron_duke: "铁公爵的来信……"
DUB_s1_letter_from_iron_duke_desc: "联合进军失败了，但塔拉终于获得了转机。信封如约送到领袖手上，它的火漆完好，落款是威灵顿公爵。"
DUB_s1.1.t: "塔拉，翡翠之地"
DUB_s1.1.d: "在漫长的历史中，塔拉王国与维多利亚王国曾是德拉克王朝的一对双生姊妹。直到阿斯兰人征服了维多利亚，也随手摘下了塔拉的王冠。此后，塔拉的德拉克家族开始极其吊诡地人口凋零，最后连姓氏都只剩下墓碑上的几行字。\n\n维多利亚人对塔拉的歧视是不言而喻的。因而塔拉人民便已在漫长的历史中多次反抗。可每一次反抗都以失败收场，而每一次失败换来的，都是维多利亚殖民者更粗的大棒、更密的驻军、更重的税、更彻底的禁令。古塔拉王国的疆界最终成为了今天的维多利亚属塔拉总督府。源石革命后，塔拉人也随着维多利亚殖民的浪潮走向泰拉各地，然而饥荒无疑再一次撕下了维多利亚佬温情脉脉的遮羞布——在这个维多利亚帝国中，塔拉人或许不是底层，但依旧是二等公民。\n\n于是，爱布拉娜·都柏林，红龙最后的末裔，已经把深池组织了起来，她深知维多利亚人的种种罪恶，也习惯于利用权术去实现她本人的目的。最终，她向她的谋臣与下属许诺了一个塔拉独立的未来。\n\n其实近年来，塔拉一直是威灵顿公爵的势力范围。这位出身塔拉殖民者家庭而和所谓的维多利亚正统贵族圈格格不入的铁公爵渐渐对塔拉生出了亲近，默许了与爱布拉娜的政治合作。而领袖本人善于谋划、目光敏锐——若时机到来，她与威灵顿之间那点独特的政治默契，便足以点燃整片翡翠之地。"
DUB_s1.1.a: "“翡翠之地终归要还给塔拉人——只是早晚的事。”"
DUB_s1.2.t: "以这团火"
DUB_s1.2.d: "深池的集会开在塔拉腹地的一处山谷里，出于众所周知的保密原则，每人只许独自前来。\n\n这种集会一般照例是“领袖”主持，这些年来一直是这样。塔拉人其实已经这么过了六年，深池这个名字在塔拉其实已经不是秘密了，从塔拉集市上的传闻一直到守灵人坟前的低语，完全对此装傻的恐怕现在只有已经被威灵顿收买的总督府了。\n\n“领袖”讲完最后一段，向后退了一步，退到火堆照不到的地方。然后，没有人看见，其实从她身后更深的暗处，走出来了另一个人。\n\n山谷里没有人立刻反应过来。\n\n那个人抬起手，在指尖上浮起一点紫色的火。离她最近的人不禁往后退了半步：那紫色火焰没有热量。\n\n她少有的决定在大众面前展示了自己的源石技艺。\n\n“塔拉人们，以这团火，我向你们许诺一个没有维多利亚人的未来。”\n\n于是迎来的是无数塔拉人的欢呼和怒吼。爱布拉娜得意地看见她变的死人也张着嘴——它们知道该在什么时候张嘴。\n\n最后，人群散去，火堆中也只剩暗红的炭。\n\n“来了多少人？”她问。\n\n“四千多。”维多利亚军官兼深池干事阿赫茉妮漫不经心地从边上的台子上跳下来，然后淡定地说，“还能再凑些。”\n\n“还不够。”她淡淡地微笑了一下，“死人打仗不要口粮，但听我讲话还是活人好，下次再找更多的人来。”\n\n她把手收回袖子里，看着炭火，突然想到了自己的常务替身。“拉芙希妮呢？”\n\n“……不知道。”\n\n“哦，那就别担心，她会回来的。”爱布拉娜捻起自己的法杖玩，“她其实只是又去帮我做了些……有利于我们深池的事情。”\n\n山谷那头，有人点起了第一支火把。"
DUB_s1.2.a: "“她说的每一句都是真的。只是不全。”"
DUB_s1.3.t: "公爵的来信"
DUB_s1.3.d: "致爱布拉娜·都柏林陛下：\n\n我，威灵顿公爵，亚瑟·威尔斯利，忝列维多利亚、莱塔尼亚、乌萨斯三国荣誉元帅，本为塔拉子民。今以残躯之名致信红龙陛下，愿率麾下效忠于陛下，共赴塔拉独立之业。\n\n臣观今日之维多利亚，朝堂愚钝，门阀腐朽。阿斯兰王朝以殖民枷锁缚塔拉之身，贵族以权术私斗耗一国之基。大厦将倾而肉食者犹自酣醉，生民流离而居高位者不闻不问。臣半生戎马，为帝国开疆拓土，到头来所见，无非一地鸡毛。\n\n臣身流塔拉之血，终不忍见故土百年沉沦、族人世代流亡他乡。故此前联合进军之际，已以手中兵权为凭，以武力胁迫开斯特公爵答应塔拉独立一事。\n\n今臣年岁已高，功名利禄皆视为过眼云烟。唯剩一桩残愿：有生之年，得见塔拉挣脱维多利亚桎梏，得见流离塔拉人民重归祖国。臣愿以毕生军略、麾下将士与人脉尽付深池，期冀与陛下并肩争塔拉之自由独立。\n\n臣亦不必讳言：纵使身负三国元帅之荣，执掌帝国半壁军队数十载。在维多利亚贵族眼中，臣终是塔拉出身之异类，排挤与偏见犹未断绝。这般腐朽的帝国，这般虚伪的贵族，臣早已视若敝履，不屑与之为伍。\n\n维多利亚帝国已不值得臣尽忠，而作为塔拉再次击倒这个腐朽的帝国，便是臣如今之目的。\n\n静候陛下回音。\n\n维多利亚、莱塔尼亚、乌萨斯三国荣誉元帅"
DUB_s1.3.a: "塔拉 威灵顿公爵亚瑟·威尔斯利  谨上"
DUB_s1.4.t: "铁公爵的遗产"
DUB_s1.4.d: "开斯特的远征以一份白和收场。枪声停下的第二天，威灵顿公爵领的边界就从地图上被抹掉了。\n\n那位铁公爵把塔拉当作自己的势力范围经营了半辈子，这一次却连一纸条件都没能留下。他的人、他的兵、他仓库里的枪，连同他在这片土地上留下的那些名字，一并交到了领袖手上。\n\n小丘郡的旧议会厅重新点了灯。爱布拉娜·都柏林走进去的时候没有停下脚步，也没有坐下——她只是站在长桌的一端，念了一个新的名字。\n\n塔拉王国临时政府。"
DUB_s1.4.a: "“临时。这个词只是留给维多利亚人看的。”"
