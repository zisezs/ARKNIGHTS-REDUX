# ── 人力法案【死火复生】 ──
DUB_dead_fire_risen: "死火复生"
DUB_dead_fire_risen_desc: "塔拉旧誓里有一句：除非有朝一日，红龙的火焰能令死去的战士从熔炉中复生。\n如今这句话有了执行方案。名册上不再有不合格的人——十六岁的、六十岁的、昨天已经下葬的。\n代价也照旧誓写明白：老去的迟迟不死，新生的频频夭折；炉子烧的是血，血不是煤。\n至于好处：番号一喊，队列自己长出来；签字不再花人心；而辎重车队也不必再为他们多跑一趟——尸体不吃饭，也不喝水。"

# ── 顾问与将领：显示名 ──
# 原作只给代号的人，代号加引号；有本名的不加。
DUB_Executive_Officer: "「校官」"
DUB_Nemesis: "涅梅丝"
DUB_Serious_Watchman: "「严肃的守灵人」"
DUB_Moran: "莫兰"
DUB_Singer: "「歌唱家」"
DUB_Bridget: "布莉吉"
DUB_Emma: "艾玛"
DUB_Vane: "维恩"
DUB_Robber: "「强盗」"
DUB_Arsoner: "「纵火家」"
DUB_Accountant: "「会计」"
DUB_Poison_Scholar: "「毒药学者」"
DUB_Prisoner: "「囚犯」"
DUB_Orator: "「雄辩家」"

# ── 顾问与将领：履历 ──
DUB_Executive_Officer_desc: "他同时领两份饷：一份来自赤铁近卫队，一份来自深池。他从不掩饰这件事，甚至认为这才是塔拉该有的样子——贵族的军队替贵族打仗，而他要的是一支不必向任何人解释的军队。\n他的操典里没有「撤退」，因为撤退需要有人留下来挡；他亲自留下来挡过一次，此后校官这个代号在纳斯尔纱比任何姓氏都好用。"
DUB_Nemesis_desc: "守灵人里最先离群的一个。她处理死亡的方式是把它登记造册：谁死的、为什么死、还剩多少人等着死。\n如今城里那些还没死透的人都归她安置。她给自己定的规矩比给别人的更严——因为私痛必须最先被制度处理掉。"
DUB_Serious_Watchman_desc: "守灵人的话事人。他说句子像敲钉子：一句一钉，钉完就散。\n他不主张复仇，只主张规程——把复仇写成规程，是这一代人唯一能留给下一代的礼物。"
DUB_Moran_desc: "卡迈河谷的吟游诗人，夜盲，走路要有人牵。整支深池只有他还肯填词，因为只有他记得旧调子怎么唱。\n他唱歌不喊口号，只把死者的名字一个一个念完——据说这比任何宣言都更难让人睡着。"
DUB_Singer_desc: "作家。他替深池写宣言，也替威灵顿写战报，两边都以为他是自己人。\n他手上有一份无处递交的报告书，写的是谁下的令、谁背的锅。他说等仗打完了再公开，然后又补一句：等仗打完，我大概也写完了。"
DUB_Bridget_desc: "游牧人。她的营生是把消息从一座城带到另一座城，顺便告诉人今晚的风往哪边吹、天灾什么时候到。\n她不识字，但认得所有能过车的路口。深池的军火走她的路线，难民的口粮也走她的路线——她坚持认为这两件事不该分开记账。"
DUB_Emma_desc: "粮店老板，被宵禁和配给一步步逼成走私链的最末一环。她先学会讨好，再学会说呓语，最后学会一种很安静的恨。\n现在全城的口粮从她的账本上过。她最常说的一句话是：别问我够不够，问他们烧掉多少。"
DUB_Vane_desc: "流民记账人，絮叨，逢人先道歉。他记的名字比户籍官多得多——因为户籍官只记活着且有房产的人。\n他说名册就是弹药。这话他从不当着领袖的面说，但每次征兵令下来，多出来的那几千人都是从他的本子里翻出来的。"
DUB_Robber_desc: "六头领之一，管缴获。他不抢平民的粮，只抢军械库、弹药车和运粮队。\n他的账很简单：我们缺什么，对面就有什么，那就去拿。深池的第一门炮、第一辆卡车、第一箱无线电，都是他搬回来的。"
DUB_Arsoner_desc: "六头领之一，管火。他相信火焰净化这个国家数百年来积淀的污浊，并且不打算把这句话解释成比喻。\n他烧过猎场看守的棚屋，也烧过自己人的逃兵。他唯一不肯烧的是粮仓——这条是他自己定的，没跟任何人商量。"
DUB_Accountant_desc: "六头领之一，管账。火的账本由他记：借出去多少、烧掉多少、谁欠谁。\n他比谁都清楚这场火是靠什么烧起来的——不是仇恨，是谷物、煤和运费。所以他最反对速胜，也最支持把每一分血税都记在明处。"
DUB_Poison_Scholar_desc: "六头领之一，管那一份从不摆上桌的。她研究怎么让一个人慢慢不能做事，而不是怎么让他立刻死。\n她说毒与药的分界只在剂量与对象；开斯特的情报网在她眼里不过是同一门学问的粗劣版本。"
DUB_Prisoner_desc: "六头领之一，因为他真的蹲过。第二集团军的牢房、矿场的工棚、移动城市的下舱，他都住过一遍，也每一处都走出去过。\n地下网是他一个人缝起来的：谁在哪个哨所当值、哪条锁链该在几点松。他不擅长打仗，他擅长让人从被认为不可能死的地方回来。"
DUB_Orator_desc: "六头领之一，管说话。他的宣言不写给对手看，写给附近五六座城市看——先让沉默的人知道自己不是一个人，再谈别的。\n他坚持深池必须有一句人话可懂的目标，否则烧完就只剩下灰。"

