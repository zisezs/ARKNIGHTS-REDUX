DUB_unification: "维多利亚统一大业"
DUB_declare_victoria_reunified: "宣布维多利亚重新统一"
DUB_declare_victoria_reunified_desc: "维多利亚已经在风暴里撕成了碎片。公爵们的军队彼此消耗，帝国的王座空悬无人。既然再没有一个维多利亚人能够站出来主张这片土地，那么由深池来结束这场分裂，便是唯一剩下的答案。"
 DUB_tara_spark: "塔拉的星火"
 DUB_tara_spark_desc: "四皇会战后，塔拉大起义失败，维多利亚的监视一年比一年紧。然而大饥荒与强制奴化教育推行下来，殖民者惊恐地发现，新一代塔拉人在风暴里长成了——深池就是这样再兴的。如今，在同为塔拉人的威灵顿公爵的刻意庇护下，全体塔拉人都把深池看作反抗维多利亚的星火。"
 DUB_tara_spark_victoria: "塔拉的星火"
 DUB_tara_spark_victoria_tt: "对所有维多利亚系势力攻击修正/防御修正：5%"
DUB_s1_army_dm: "死火之军"
DUB_s1_army_dm_desc: "领袖的源石技艺让地下的亡者一批批站起来，替深池填满队列——多到没人想过去数。除去她亲手造出来的那些东西，深池队伍里当然还有活人，可这些人并不能算作能与维多利亚正面抗争的武装。这一点，领袖比谁都清楚。"
DUB_s1_economy_dm: "游击队经济"
DUB_s1_economy_dm_desc: "深池说到底只是一支塔拉腹地的游击队，全靠领袖一人指挥才勉强连成一片。至于经济——就目前来看，深池基本没什么经济可言。"
 DUB_s1_leader_dm: "领袖席"
 DUB_s1_leader_dm_desc: "爱布拉娜学会了沃里克伯爵的权谋与手腕，也一并学会了不择手段与高高在上。反抗维多利亚无疑是正义的，可她偶尔会露出不那么正义的阴暗面；不少深池成员名义上忠于她，真正忠于的却是塔拉。领袖席看上去稳如磐石，只是那底下的东西并不那么见得光。"
