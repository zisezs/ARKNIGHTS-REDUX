 YYZ_authoritarianism_party: "中原开拓团"
 YYZ_despotism_party: "幽州都护"
 YYZ_fascism_party: "宾州珠申"

#国名
 YYZ_civil_war: "大朔朝廷"

#人物
 YYZ_Zhang_Shougui: "张守珪"
 YYZ_Zhang_Shougui_desc: "幽州的战略位置，是炎国最不重要的一个都护府，她不需要直面邪魔，也不需要警惕西方的乌萨斯威胁。但幽州却是炎国几个都护府中拥兵最多，经营最富庶的都护府。这一切的一切，都是张守珪的功劳。张守珪是重臣魏甫的亲信，也是当朝皇上最信任的将军。出身草莽的他被魏甫看中，破格录入大炎军中，而他也没有辜负魏甫的器重，一路摸爬滚打当上了将军，在魏甫与姚元之的争斗中，张守珪作为魏甫派系的成员，被任命为幽州都护，以提升魏甫在军中的影响，而嗅觉敏锐的张守珪没有放过这个机会，他倚仗着魏甫的势力和自己的长袖善舞，让国家财政和商人们将资源送到幽州，将幽州从荒原变成了一片沃土，并且供养出了一支忠诚善战的大军。张守珪的野心不止于此，但是现在，自己在朝中有保护人，而皇上本人也十分信任他这个粗野但忠诚的武人，自己的小小野心，就暂时抛在脑后吧。"
 YYZ_Youzhou_king: "幽州王"
 YYZ_Xinrongkeluo_Yilha: "新容珂罗·依尔哈"
 YYZ_Li_Kaishan: "李开山"

#民族精神
 YYZ_Zhangs_rule: "张氏之治"
 YYZ_Zhangs_rule_desc: "幽州可能是炎国官场中裙带关系最典型的地区，幽州都护本人便是依靠朝中重臣所登台，而张守珪又将幽州的几个关键职位交给了他的儿子和亲信。不过抛开这些关系户怎么来的不谈，他们的手段，倒是很高效。"
 YYZ_rush_to_Youzhou: "闯幽州"
 YYZ_rush_to_Youzhou_desc: "当张守珪来到幽州赴任时，他看到当时的这片土地还十分荒芜，但地理学家们告诉他，这片土地的开发潜力极大，这里唯一缺乏的资源便是，人。张守珪立刻向朝廷建议，由官府牵头组建一支民间开拓团，吸引炎国的社会资本和劳动力来到幽州。十多年过去了，这支开拓团已经变成了一个不可忽视的力量，它代表着商贾、地主、工厂主，代表着幽州这块新生的土地上，资本的力量。"
 YYZ_Zhushen_tribe: "珠申部族"
 YYZ_Zhushen_tribe_desc: "珠申人是生活在幽州境内的一支黎博利少数民族，他们过着渔猎生活，同时驯养着一种行动迅捷的蹄兽。旧时，炎国政府对于珠申人的管理极为松散，只有面临灾荒时才会提高救助，但张守珪改变了这一切。张守珪意识到，驾驭着蹄兽的珠申人能够训练为高机动性的骑兵，而不需要昂贵的机车或装甲车，而骁勇善战的珠申人也极为淳朴，只需要付给他们报酬，他们就是忠诚的佣兵。在张守珪的支持下，珠申人的社区迅速迈入现代，他们拥有了简单的机械，更高效的渔猎工具，建立起了现代的集落。不过张守珪没有意识到的是，一些现代的思想，也随着现代的工具，走进了珠申人的脑子里。"