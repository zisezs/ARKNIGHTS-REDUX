 #国家精神
 BRT_Retreat_from_the_Empire: "从帝国后退"
 BRT_Retreat_from_the_Empire_desc: "维多利亚帝国陷入动乱，高卢复国主义在北疆二度兴起。最初，镇守北疆的公爵与司令以为这些举着高卢旗帜的叛军不过是一群散兵游勇。但在日渐艰难的困兽之斗中，他们渐渐意识到一个可怖的事实：在无数叛军背后，还存在着一位权力滔天的幕后领袖。此人稳步执行着自己的计划，试图将维多利亚帝国的北方全境都纳入囊中。更令戍边者们感到绝望的是，单凭他们的微薄之力，绝无可能粉碎他的野心。"
 BRT_Collapse_of_military_control: "濒临崩溃的军事管制"
 BRT_Collapse_of_military_control_desc: " 在失去与伦蒂尼姆的有效联系后，布列塔尼边防军司令部当即成立了一个军管政府，旨在抵御高卢复国主义运动乃至其他叛党组织的反扑。最开始，边防军的领袖们踌躇满志，自认为已经准备好应对任何突发状况。但随着时间推移，本土供应链中断造成的物资匮乏日渐明显，高卢抵抗力量的一次次攻势也越发猛烈。眼下，布列塔尼军区的社会秩序已经濒临崩溃，原有的军管格局也难以继续维系，一场巨大的危机已在地平线上浮现。"