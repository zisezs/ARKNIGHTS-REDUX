 SRC_eco_dec_mobile_city: "移动城市建造"
 SRC_eco_dec_mobile_city_desc: "一期一期往下盖：地基、轨道、变电站与新区。建造期间占用产能，竣工后为首都增加基础设施、民用工厂与工厂槽位。工程最多排三期——第三期的图纸上，造价员坚持保留了那座小剧院。"
 SRC_eco_tt_mobile_city_left: "剩余工程期数 §Y<3§!（本决议最多 3 期）"
 SRC_eco_tt_mobile_city_going: "工程开工：建造期占用产能，180 天后竣工"
 SRC_eco_tt_mobile_city_done: "一期移动城市竣工：首都获得 §G+2§! 基础设施、§G+2§! 座民用工厂与 §G+2§! 个工厂槽位，稳定度 §G+5%§!"

 SRC_eco_dec_transport: "运输保障"
 SRC_eco_dec_transport_desc: "伊雷妮的调度表：卡车班次、码头泊位与陆行舰接驳时刻。执行期间补给消耗降低，收尾时把两条干线铺硬。"
 SRC_eco_tt_transport_going: "调度表上墙：执行期补给消耗 §G-15%§!，60 天后结算两座非首都州 §G+2§! 基础设施"

 SRC_eco_dec_wolf_pact: "狼群商约"
 SRC_eco_dec_wolf_pact_desc: "荒野归狼群，城市归合同。按吨位付费的护航，让商路在夜里也照样通车——账本上那一栏写的是“安保”，没有人追问细节。"
 SRC_eco_tt_wolf_pact_going: "护航队上路：执行期消费品需求 §R+3%§!，70 天后结算"
 SRC_eco_tt_wolf_pact_done: "商约到期结算：政治点 §G+130§!、可征兵人口 §G+40,000§!、稳定度 §G+3%§!"

#========================= 事件 =========================

 src_federal_news.4.t: "叙拉古黄金时代"
 src_federal_news.4.d: "叙拉古的三条产业主线今日合流：传统产业、移动城市工业与商业联合会同时公布了自己的年度报告。\n\n灰厅的观察员们注意到，圆桌前每一个席位面前都多了一本必须按月报账的册子；而新沃尔西尼港的吊车，据说仍旧亮着灯。卡西米尔的商会代表拒绝置评，其驻本港的促销台已在昨日撤除。"
 src_federal_news.4.a: "“新的一天已经来了。”"
 src_federal_news.4.b: "叙拉古人的餐桌上又多了一道菜。"

 src_federal.10.t: "在灰厅宣读产业宪章"
 src_federal.10.d: "三条产业主线合流之后，莱昂图索手里剩下最后一个问题：这份秩序要以什么面目示人。\n\n德米特里建议宣读，乔万娜建议宴饮，伊雷妮建议检阅码头。拉维妮娅什么也没说——她只是在法槌下面垫了一张新的税则表。"
 src_federal.10.a: "在灰厅宣读产业宪章"
 src_federal.10.b: "全城宴饮三日"
 src_federal.10.c: "检阅港口与船坞"
 SRC_eco_tt_10a: "宪章写进了判例：此后每一条税则都能被引用，也能被起诉"
 SRC_eco_tt_10b: "厨师工会第一次出现在市政公报的致谢名单里"
 SRC_eco_tt_10c: "护航费标准表贴上了码头，字迹潦草，没人质疑"

