############################################################
# 叙拉古 (SRC) · 产业国策树（共享国策簇）
# 国策 / 四个成长型民族精神 / 三条产业决议 / 终局事件
# 定义：common/national_focus/SRC_economy_shared.txt
#      common/dynamic_modifiers/SRC_eco_dynamic_modifiers.txt
# 图标清单见 docs/SRC_经济树图标表.md
############################################################

#========================= 国策：名称与描述 =========================

# ---- 总起 ----
 SRC_eco_grey_hall_plan: "灰厅产业协调"
 SRC_eco_grey_hall_plan_desc: "“由十二家族组成的灰厅决断着叙拉古的重大事务。”莱昂图索没有去掀那张圆桌，他只是把一份产业账本放了上去：港口、酒庄、林地、渔场、车队与剧院，每一格都写着名字和数字。灰厅第一次发现，这座没有家族的城市是带着自己的报价坐进来的——不同意的人，可以自行把那一串数字看完再说话。"

# ---- 分支一 · 传统根基 ----
 SRC_eco_family_census: "十二家族产业普查"
 SRC_eco_family_census_desc: "德米特里说：“叙拉古的大部分产业都掌握在各大家族手中。”那就先数清楚。普查队走进萨卢佐的酒窖、贝洛内的车队、威尼斯的载具厂，把每一台机器、每一份合同、每一个挂靠的名字登记造册。老账房的算盘打了一整夜，天亮时他抬起头：原来这个国家真正在运转的东西，比家族嘴上说的多，也比家族账上写的干净。"
 SRC_eco_forestry_fishery: "东部林渔联合体"
 SRC_eco_forestry_fishery_desc: "叙拉古东部的山林与湖面常年被家族按段落划分——这片林子归谁，那片湖归谁，谁都不能过界。联合体把林区与渔场合成一张排班表：轮伐、轮捕、共用便道与公共冰窖。第一次结账那天，两个从不走动的村长发现在同一张纸上签字，比互相防着要省力得多。"
 SRC_eco_saluzzo_wine: "萨卢佐葡萄酒"
 SRC_eco_saluzzo_wine_desc: "萨卢佐家族酿造的葡萄酒享誉全叙拉古，也曾经是全叙拉古最体面的封口费。市政厅把这款酒列入法定产区名录：产地、年份、产量、税则，逐项公开。老庄主看着自家标签上多出来的那行小字沉默了很久，最后只说了一句——“写得比我父亲的遗嘱还细。”"
 SRC_eco_musical_revival: "歌舞剧复兴"
 SRC_eco_musical_revival_desc: "无论是在小酒馆里还是在剧院里都有丰富的演出。乔万娜的剧团重新开张，白日剧团的灯光又一次亮起，卖馄饨的老板娘在第二幕唱错了词，全场没有一个人笑。叙拉古人从来不为宏大叙事鼓掌，他们只为“这一天确实过得不坏”鼓掌。"
 SRC_eco_pizza_nation: "披萨之国"
 SRC_eco_pizza_nation_desc: "作为核心圈最注意饮食的国家，叙拉古人对“做饭”这件事讲究颇多：面粉要过三遍筛，炉温要用手背试，番茄必须在天亮前摘下。市政厅干脆把讲究写进规章——面食联保、灶籍登记、街区名厨认证。城市里最贵的广告位，从此留给了面包炉，而不是铳。"
 SRC_eco_catering_network: "餐饮服务网络"
 SRC_eco_catering_network_desc: "伊雷妮把送鱼的路线、送面团的路线和送人的路线并成了一张网：冷链车与卡车共用班次，深夜的餐馆与清晨的码头同时开工。叙拉古拥有发达的服务业，而这门服务业真正的产品不是食物，是“什么时候都能吃上一口热的”那种确定感。"
 SRC_eco_trad_golden_age: "传统产业的黄金时代"
 SRC_eco_trad_golden_age_desc: "“叙拉古不需要未来。”说这话的人坐在自家酒窖里，身边是他父亲的橡木桶。可传统本身就是叙拉古的未来：林子里的树、湖里的鱼、炉子里的面饼、剧院的第二幕，全都还在生长。灰厅的圆桌上第一次摆出一份不附带武器的产业报告，而它比任何一份宣战书都长。"

# ---- 分支二 · 新工业 ----
 SRC_eco_urban_act: "新都市管理法·产业修订案"
 SRC_eco_urban_act_desc: "新沃尔西尼不存在家族，也不该只有一部管得住人的法。莱昂图索在法案后面续了一整章：厂房、泊位、冷库、剧院执照、摊位税与合伙合同的备案格式。起草那晚有人在旁听席上笑——“原来你们也会为一张营业执照熬夜。”法警没有抬头，他只是把第三十七稿又改了一行。"
 SRC_eco_columbia_mobile_tech: "哥伦比亚移动城市技术"
 SRC_eco_columbia_mobile_tech_desc: "叙拉古得到了建造移动城市的技术——更准确地说，是哥伦比亚愿意卖、而沙雷愿意垫资的那一部分。图纸进关那天，海关按新法案给每一箱设备贴上标签：所有者、用途、税率、违约条款。沙雷的代表把条件书读了三遍，然后开始计算违约金，就像他过去计算酒桶容积一样认真。"
 SRC_eco_volsinii_port: "新沃尔西尼港扩建"
 SRC_eco_volsinii_port_desc: "新沃尔西尼港是叙拉古的货运枢纽，也是这个国家未来的心脏。码头向外推了三段，泊位浚深，吊车的灯彻夜不灭。据说最老的水手们特意在岸上等着，想看看“灯火不灭”这句话到底能亮多久——三个月后他们放弃了，改成抱怨亮得太早，吵得睡不着。"
 SRC_eco_secondary_core: "次级核心区工业"
 SRC_eco_secondary_core_desc: "次级核心区的分离程序曾让新城市陷入混乱：电网切给谁、水源归哪个区、机器装了又拆。市政厅的答案是不再区分“核心”与“次级”——标准化的车间、备件厂与变电站同时铺向每一区。第一台在新区下线的陆行舰减速箱被刷上了新城的城徽，而它的说明书里第一次没有“请运回旧区修理”这一行。"
 SRC_eco_transport_authority: "运输保障署"
 SRC_eco_transport_authority_desc: "伊雷妮领导的运输保障署最初只有七辆车和一本手写排班表。如今它管着卡车、码头班次与陆行舰接驳时刻，也管着一件事：谁在半夜两点还在路上。署里的墙上贴着一句谁都能背的话——把货送到，把人送回来。"
 SRC_eco_mobile_shipyard: "移动城市造船厂"
 SRC_eco_mobile_shipyard_desc: "叙拉古决定建造自己的移动城市，而不是再买一座。船坞里同时躺着三副骨架：一副运货、一副载工坊、第三副按法案要求“预留一座小型剧院的地基”。工程师说这是全泰拉最没必要的舱室，造价员说这是全泰拉最好卖的一间。"
 SRC_eco_new_industrial_era: "新沃尔西尼产业新时代"
 SRC_eco_new_industrial_era_desc: "“新的一天已经来了。”莱昂图索在竣工的第三座船坞前说了这句话，然后立刻被拉去签第九份合同。没有人记得他那天还说了别的什么——大家只记得散场时码头的灯全亮了，而灯下的摊贩比庆典上的人更多。"

# ---- 分支三 · 商业与秩序 ----
 SRC_eco_guns_order: "铳与秩序"
 SRC_eco_guns_order_desc: "“这将成为这座城市全新的‘铳与秩序’，莱昂图索。”德米特里伸出手。铳，代表最终的暴力归城市；秩序，代表合同对所有人有效——包括家族，包括外来资本，也包括狼群。签字那晚桌上没有酒，只有一叠税则和一份护航费标准表。"
 SRC_eco_bellone_merge: "贝洛内企业整合"
 SRC_eco_bellone_merge_desc: "德米特里说：“贝洛内会进入这座城市，以我的方式，按你的规则。”于是安保、车队、仓储与夜班码头全部注册成了公司：按章纳税，按约赔偿。老派打手第一次拿到工资单，翻到背面看见“加班”一栏，问这是什么意思——没有人回答他，他们都在忙着算这个月又省下了多少子弹钱。"
 SRC_eco_tariff_charter: "关税与特许经营"
 SRC_eco_tariff_charter_desc: "新沃尔西尼欢迎任何想要本分做生意的公司。特许经营状要申请，货架陈列要备案，违约金不再是口头威胁而是一串算得出来的数字。卡西米尔的商人骂骂咧咧地排队领表，队伍里有人小声说：原来规矩也是一种关税。"
 SRC_eco_anti_kazimierz: "反卡西米尔商业联合会"
 SRC_eco_anti_kazimierz_desc: "“公平竞争——这是我们来这里的原因。”叙拉古的酒庄、渔场与车队第一次坐到了同一侧：本地采购优先、共用仓储、违约黑名单互通。资本没有国界，但有账本；而十二家族的账本，第一次合起来比对方更厚。"
 SRC_eco_golden_plains: "黄金平原反制"
 SRC_eco_golden_plains_desc: "货架陈列协议、高额违约金、本地酒庄被悄悄收购——我们受够了。沙雷的“黄金平原”酒业在叙拉古门口摆了三年的促销台，被一份产地保护令请了回去。撤场那天他们的货柜车堵在海关口，排在后面的叙拉古司机摇下车窗，客客气气地问需不需要帮忙——按吨位收费。"
 SRC_eco_logistics_monopoly: "物流垄断"
 SRC_eco_logistics_monopoly_desc: "陆行舰往来于移动城市之间，而它们都必须在新沃尔西尼停靠。这不是巧合，是一张由港务、车队与仓储三方共签的时刻表。城市之间不再靠血缘通行，也不再靠拳头定价——现在它们靠排班表。而排班表在谁手里，谁就是这条路上最讲道理的人。"
 SRC_eco_trade_hegemony: "叙拉古商业霸权"
 SRC_eco_trade_hegemony_desc: "“这难道不是新游戏最有趣的变量吗？”莱昂图索在联合会的年度结算上看到了答案：本港的报价单，已经开始被别人抄着定价。灰厅的圆桌上家族席位一个没少，只是每个席位面前都多了一本必须按月报账的册子。"

# ---- 终局 ----
 SRC_eco_golden_age: "叙拉古黄金时代"
 SRC_eco_golden_age_desc: "“我们生活在一个名为家族的牢笼之中……但我们的力量就是我们创造的生活本身。”黄金时代不是黄金做的：它是天亮前摘下的番茄，是三副同坞的船骨，是第九份没完没了的合同，是剧院第二幕那次没有人笑的唱错词。新沃尔西尼仍然存在，仍然不接待家族——只是现在，整个叙拉古都在按它的规矩做生意。"

#========================= 精神：名称与描述 =========================

 SRC_dyn_golden_age: "叙拉古黄金时代"
 SRC_dyn_golden_age_desc: "从灰厅的那份产业账本开始，三条主线各自成形，最终汇成这个国家自己的经济秩序。它不是一次性发放的奖励——每完成一格产业国策，它就会在政治栏里原地变强：萌芽、发展，直到鼎盛。§Y“戏剧与美食是叙拉古最突出的两个文化要素。”§!"
 SRC_dyn_traditional_golden: "传统产业的黄金时代"
 SRC_dyn_traditional_golden_desc: "林业、渔业、餐饮、葡萄酒与歌舞剧——叙拉古最稳定的根基。传统并不拒绝未来，它只是拒绝被写成别人的账。§R代价是：一门心思回望的人，偶尔会漏掉下一班列车。§!"
 SRC_dyn_new_industry: "新沃尔西尼产业新时代"
 SRC_dyn_new_industry_desc: "移动城市、船坞、港口与运输网。新城市不能只靠家族和理想活下去，它需要混凝土、变电站和一张永远有人在改的排班表。"
 SRC_dyn_trade_hegemony: "叙拉古商业霸权"
 SRC_dyn_trade_hegemony_desc: "关税、特许、护航与联合采购。当本港的报价单开始被别人抄着定价，这座城市的铳与秩序就终于有了第二层含义。"

