#国家精神
 military_first: "尚武先军"
 military_first_desc: "北东国的经济远不如南方发达，这里没有富饶的耕地，没有发达的商业，恶劣的外交环境也难以吸引外国投资。因此，统治者们达成了共识，为了完成东国的统一大业，一切建设都需要为军事让步，一切建设都要以军事为重。在如此思想的指导下，手握海量步卒的新绘藩和掌握东国唯一的陆行舰队的盛田藩成为了国家豢养出的庞然大物，以东方重工为代表的军工复合体渗透到了北东国经济的每个角落。而这样做的代价，就是北东国的民生经济水平，低到了一个工业化国家不该有的水平。"
 Morita_Niie_balance_1: "新绘-盛田矛盾：中立"
 Morita_Niie_balance_1_desc: "新绘藩和盛田藩是控制着北东国最大的两个家族，其中，新绘藩的家主是在内战中从南方叛逃的吉田阴子，手中掌握规模庞大的陆军部队和东方重工这一军工巨头，而盛田藩在军队数量上虽略逊一筹，但其掌握着北东国唯一的陆行舰队和附属装甲部队，并且拥有东国最精锐的忍者部队，天璋组的效忠。虽然两家名义上共同从属于光严帐下，但矛盾时有发生，而若是北东国的决策中刻意偏向哪一方，则有可能导向一个大家都不想看到的结果。"
