#人物
 NHS_Kougon_Kazuhito: "光严量仁"
 NHS_Kougon_Kazuhito_desc: "光严量仁并不是挑起内战的祸首，但当北方的几大家族拥立他成为领袖时，这个有野心的华族选择了接受。然而，北军的进攻在炎国介入后陷入停滞，最终变为了《玉门条约》上屈辱的和谈结果。欲戴玉冠，必承其重，和谈后，几名华族领袖立即将矛头指向了量仁，走投无路的量仁只能依靠尚未表态的剩下两个家族，在得到他们的支持后，成功躲过了政变的威胁，并且将政变者发配到更北方的土地。但在粉碎了政变之后，新的威胁又从吞并了剩余几大家族势力的吉田家和岛津家中产生。量仁本就生性多疑，而吉田和岛津也不像忠心耿耿的样子，一次新的政变在等待着量仁，不是他先出手，就是他先退出。"
