#国家领袖
 NAX_Vasily_Wiazemsky: "瓦西里·维亚泽姆斯基"
 NAX_Vasily_Wiazemsky_desc: "作为一名拥有皇室血统的旧贵族，瓦西里·维亚泽姆斯基是个很有野心的独裁者，他曾经跟随先皇征战四方，立下赫赫战功，因此也屡次受到先皇封赏，但其内心中一直有着脱离乌萨斯的抱负，妄想取代乌萨斯成立一个崭新的帝国。\n\n边境摩擦不断，倘若在这个时候向周边渗透大抵是不会被发现的，对于维亚泽姆斯基来说，或许这是新的机会……于是，大公在新阿列克谢耶夫斯克——自己曾经的封地，联合末落的贵族们组建了贵族政权，并和在大叛乱中被打散流落到这里的第五集团军残部达成了暂时合作。\n\n但当地的乌萨斯帝国第五集团军残部已经推选亚历山大·高尔察克——这一同样企图夺得全乌萨斯政权的野心家。这意味着，除了面对乌萨斯东部其他地区的军阀及帝国内卫的不时监视，维亚泽姆斯基大公仍要面对内部这些不满的军人。不过至少，大公能在新阿列克谢立足，便有了觊觎乌萨斯帝国皇帝之位的立足点……\n\n因此，瓦西里·维亚泽姆斯基大公使终期盼着，终有一日，他将抓住大叛乱的机会，夺得作为乌萨斯皇帝的天命，坐到乌萨斯帝国那唯一的王位之上——正如他所崇拜的先皇。"
 NAX_Aleksandr_Kolchak: "亚历山大·高尔察克"
 NAX_Aleksandr_Kolchak_desc: "亚历山大·高尔察克祖籍奥布雷诺威切，出生于圣骏堡的贵族家庭。自军校毕业后陆续参加了与东国的血峰战役等，战功卓著，被晋升为上将。高尔察克将军以擅长指挥陆行舰部队而闻名。\n\n在大叛乱中，高尔察克上将的第五集团军参与了帝国军队镇压地方暴动的数次行动。但战后这支部队损失惨重，不得已退入了维亚泽姆斯基大公的封地——新阿列克谢耶夫斯克。并与大公为首的当地贵族集团达成合作。即使维亚泽姆斯基大公收买一些中下层军官，试图用各种方式掌控这支部队，但不甘被“流放”在新阿列克谢这一狭小地区的乌萨斯军人依然支持高尔察克上将作为他们的领袖。\n\n随着乌萨斯帝国江河日下，帝国对地方的控制力变得越来越衰弱。握着手里这支第五集团军残军部队的高尔察克上将发觉了难得的机会。他如此蔑视着当地的贵族集团，视其为绊脚石。无论如何，拥有野心的他从来不甘于在这一地区当个地头蛇，而是期待着终有一日，他将彻底夺取新阿列克谢政权，并抓住下一次大叛乱的机会，用他的陆行舰及重型战车的钢铁洪流将东部的军阀们全部碾碎，并最终攻入圣骏堡，把那懦弱的皇帝扯下王座，成为全乌萨斯的最高执政。"

