#人物
 MAJ_Sathed_Varmodan_IX: "赛台得·跋摩丹九世"
 MAJ_Sathed_Varmodan_IX_desc: "赛台得·跋摩丹九世，第二满贾帕希王国的第二个国王，他的母亲是那场毁灭了满贾帕希的内战的罪魁祸首之一，斯律·吉坦迦公主，也是女王。在母亲几年前因战争的后遗症去世后，国家的重担就落到了这个从炎国留学归来的王子身上。在战后，吉坦迦女王模仿炎国，建立了二元君主制的制度，但这套生搬硬套的体制在满贾帕希完全失败，缺乏教育的百姓根本无法理解，而重建工作也一直受其掣肘，无奈的女王之后宣布重新独裁，二元君主制名存实亡。但赛台得·跋摩丹九世有在炎国留学的经历，他认为，这套来自炎国的制度是让国家重新复兴的关键，因此年轻的国王一直谋划着重启这套体制，不过在此之前，国内的烂摊子还需要他来收拾。赛台得·跋摩丹九世，在等待着时机。"
 MAJ_Cheng_Ziren: "成梓壬"
 MAJ_Gacha_Suatu: "加查·苏阿图"

#国家精神
 MAJ_Aftermath_of_the_1073_War: "1073战争的余波"
 MAJ_Aftermath_of_the_1073_War_desc: "二十多年前，不可一世的满贾帕希王国倒在了王子们争夺王位的战争中，旧都嘉凯尔达毁灭在战争之中，无法忍受战乱的商人们在东部宣布独立，甘武者王国乘虚而入，占领了满贾帕希的大片土地。最终，斯律·吉坦迦女王在炎国的支持下成为了这片焦土的新主人。在近五年的混战中，满贾帕希王国除了贫穷、饥饿与死亡，什么都没得到。"
 MAJ_Economic_penetration_of_Yan: "炎国的经济渗透"
 MAJ_Economic_penetration_of_Yan_desc: "炎国的经济渗透很早便进入了满贾帕希，但在斯律·吉坦迦公主向炎国求援之后，《绰武兰书》的签署彻底将满贾帕希放在了炎国的商品橱窗里。开放移民和投资的后果，是大批的炎国商人来到他们口中的“南洋国”，将这里的财富装进他们的口袋。诚然，炎国的投资对于满贾帕希王国的战后重建和现代化至关重要，但当满贾帕希的百姓看到这些说着异国语言的家伙，在他们的土地上过着与他们截然不同的生活时，仇恨的种子便在这片大地上种下。"
 MAJ_liberalism_party: "梓兴公司"
