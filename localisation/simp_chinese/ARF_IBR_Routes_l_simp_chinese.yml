# 伊比利亚 · 三路线（选国家界面路线卡片专用）
 IBR_Route_Eternal_Refuge:0 "永恒庇护"
 IBR_Route_Eternal_Refuge_desc:0 "“这些吗？老师曾经告诉我，越是危急的时候，我们就越需要带好‘审判官的口粮’。看，这是手炮的补充单元，这是应急药剂，还有这个，密封信件的小罐......”\n\n“人们只会记住审判官的提灯与剑，但这些东西，才是支持我们的‘口粮’。伊比利亚如今拥有的一切都弥足珍贵——它们是我绝不会舍弃的责任。”"
 IBR_Route_Crown_Bestowed:0 "君权我授"
 IBR_Route_Crown_Bestowed_desc:0 "“她看着簇拥在她身边的拥护者们，他们称她为伊比利亚最高尚之人，在此之前这个称号在他们口中属于审判庭的圣徒。\n\n我似乎明白了她在担心什么。在依旧动荡的伊比利亚，她需要是“贵族德·托莱多”，她需要给“遭受背叛”的伊比利亚人一个选择。或许只有大部分伊比利亚人都能信仰自身时，她才会选择不再欺骗。”"
 IBR_Route_Kill_The_Sea:0 "杀死大海"
 IBR_Route_Kill_The_Sea_desc:0 "“大海溺毙麦种，杀死大海，杀死大海！”"
