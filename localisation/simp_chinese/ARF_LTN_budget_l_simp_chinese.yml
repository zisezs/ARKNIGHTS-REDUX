l_simp_chinese:

# ============================================================================
# 莱塔尼亚 (LTN) ·「联合帝国预算计划」政治带本地化
#   对应 common/national_focus/LTN_political.txt 政治段 / events/LTN_budget.txt
#   / common/ideas/LTN budget_ideas.txt / common/decisions/LTN_budget_decisions.txt
#   / common/dynamic_modifiers/LTN_budget_dynamic_modifiers.txt
# 仪表读数写法：忠诚度/密谋度/预算优势是 0~100 的整数变量，一律打「现值 + 满值」，
#   不用 $RIGHT$ 百分比格式（那套只给 5% 档的精神变量用）。
# ============================================================================

# ---- 一、26 格国策 ----
 LTN_new_year: "新的一年"
 LTN_new_year_desc: "新年第一项御前事务不是加冕礼，而是账目。伊维格娜德把双塔的文书房腾出来，堆满九大区报上来的收支。预算案能不能通过，从今年起要按票来算。"

 LTN_tell_the_ministers: "告诉大臣，理清现状"
 LTN_tell_the_ministers_desc: "帝国的钱在哪里、诸侯的钱在哪里、谁替谁说话，大臣们说得出来，却没人愿意第一个说。审计要花钱，也要有人挨一句真话。"

 LTN_elector_loyalty_problem: "选帝侯的忠诚难题"
 LTN_elector_loyalty_problem_desc: "九大区各有政府、法律与军队，双塔的政令出了崔林特尔梅就要重新谈一次。先有诸侯，再有皇帝——这句俗语没人当众说，也没人否认。"

 LTN_open_budget_plan: "开启联合帝国预算计划"
 LTN_open_budget_plan_desc: "用政府的宏观调控稳住物价，用扶持政策把中小工坊拉到手边。这不是为了今年好看，是为了女皇陛下后面所有的改革都有一份能用的账。"

 LTN_break_the_silence: "打破不该的沉默"
 LTN_break_the_silence_desc: "议事厅里安静得太久了。把诸侯的忠诚摊在桌面上称一称，称出来的数字不好看，但至少第一次有人愿意报数。"

 LTN_the_count_is_right: "施瓦结里伯爵是对的"
 LTN_the_count_is_right_desc: "伯爵说：金律乐章是不容改变的。这话难听，却稳。既然改不动乐章，那就顺着它，让官僚体系替双塔把预算案推过去。"

 LTN_voice_on_tour: "让女皇之声巡演"
 LTN_voice_on_tour_desc: "女皇之声不该只在首都唱。让她们去九大区走一遍，台上唱的是新金律，台下听的是诸侯的心思。每座城市都会留下一些回声。"

 LTN_hush_the_liberals: "要求自由党嘘声"
 LTN_hush_the_liberals_desc: "那帮所谓倡导自由的废物们凭什么和我们抗衡？金律乐章是不容改变的。嘘声不是解决，但嘘声很省事，双子女皇并没有替他们把话守住。"

 LTN_white_empress_plan: "白女皇计划"
 LTN_white_empress_plan_desc: "巡演回来了，莉泽洛特·伊维格娜德知道自己在做什么。她要用一切能用的手段，逼选帝侯一步一步把权力交出来，一次交一个声部。"

 LTN_open_imperial_diet: "开启帝国会议"
 LTN_open_imperial_diet_desc: "预算案终于被抬进共鸣厅。没有人支持它到可以被忽略的地步，也没有人反对它到可以撤销的地步，剩下的只是谁先开口。"

 LTN_fair_competition: "公平竞争"
 LTN_fair_competition_desc: "是时候打破一部分体制来在联合帝国议会里办事了。白女皇决定和中左翼议员合作推行预算，让小提琴派替她数票。"

 LTN_useful_bureaucracy: "趁手的官僚"
 LTN_useful_bureaucracy_desc: "官僚体系是值得信任的，这是不容置疑的。新一年白女皇仍然会加强与官僚体系和保守党的合作，直到下一个五年。"

 LTN_open_final_vote: "开启最终投票"
 LTN_open_final_vote_desc: "不管怎么说，今年的预算案都会进行。现在让我们静等投票结果，让票箱替双塔说出那句不好听的话。"

 LTN_narrow_passage: "艰难通过"
 LTN_narrow_passage_desc: "自由党和小提琴们拉响了激昂的变奏，保守党联合大提琴们低声嗡鸣着反对。当最后一票落入票箱，共鸣厅里回荡起一个清晰的和弦——微弱多数。"

 LTN_budget_defeat: "联合帝国预算案失败"
 LTN_budget_defeat_desc: "施彤领选帝侯沃尔纳·冯·霍赫贝格先发出一封公开信，措辞克制却意味深长：帝国的意志从来不是某个人的意志。计划流产，保守派推出一个温和法案。"

 LTN_hlinmarts_plan: "赫琳玛特计划"
 LTN_hlinmarts_plan_desc: "他们口口声声为了金律乐章、为了传统，对泰拉将来的变化视而不见。黑女皇把话说得很短：给她一百天。真正的纸牌屋从这一格开始。"

 LTN_lambs_and_goats_return: "白色羊羔和山羊凯旋而归"
 LTN_lambs_and_goats_return_desc: "让我们向女皇陛下致敬。她击败了选帝侯和巫王残党的阴谋，判断者的领头羊一律处死作为警告——但仁慈也要适度地释放出来。"

 LTN_where_is_your_other_half: "白羊，你的另一半呢"
 LTN_where_is_your_other_half_desc: "下议院的议员们不谈谋反，也不谈丑陋的哥伦比亚人，只用沉默和繁复的礼节告诉这位女皇：你战胜了巫王，可否决权仍在诸侯手里。这些事交给黑女皇。"

 LTN_silent_her_and_crown: "沉默的她和冠冕"
 LTN_silent_her_and_crown_desc: "施彤领的演奏和下议院的改革从不属于高塔。薇薇安娜查清了父亲之死的真相，可她也因此失去了自己的亲人。冠冕留在首都，四支近卫队也留在首都。"

 LTN_victory_of_eternal_festival: "永恒盛典的胜利"
 LTN_victory_of_eternal_festival_desc: "一切已经解决，是时候做出改变了。镇压与仁慈并行，典礼与处决同日。高卢旧地的城市在四皇会战的废墟上第一次认真考虑归属问题。"

 LTN_imperial_overture: "帝国序曲再次奏响"
 LTN_imperial_overture_desc: "白女皇站在双子塔的顶端，手里握着新金律乐章的初稿——一部取消选帝侯否决权、把权力收归女皇一人的法典。它还缺一份新的权威。"

 LTN_ludwig_purge: "路德维格大学的整肃"
 LTN_ludwig_purge_desc: "大学是高塔的摇篮，也是异见的温床。涉尘世之音研究的学者宣誓效忠新金律，言论部分开放以继续科研。弗莱蒙特肯定要走了。"

 LTN_round_table_law: "圆桌上的金律"
 LTN_round_table_law_desc: "伊维格娜德做了一件所有莱塔尼亚皇帝都没做过的事：她把九位选帝侯请到了同一张桌子前。法案最后表决要十四天，期间没有人愿意先离席。"

 LTN_serious_research: "严肃和认真的科研"
 LTN_serious_research_desc: "莱塔尼亚人几乎天赐般地对源石技艺与艺术鉴赏超越他族的敏感。他们对文化的热爱是克制而冷静的——比起雄辩，他们更赞赏用艺术表达冷峻的激情。"

 LTN_dream_comes_true: "梦想成真"
 LTN_dream_comes_true_desc: "莱塔尼亚联合帝国，多么美丽的名字。联邦实体化与开放的思想让白羊和山羊超越了巫王，经济欣欣向荣。让我们赞美两位，议会也在等下一部法案。"

 LTN_laurel_of_victory: "万岁，胜利者的桂冠"
 LTN_laurel_of_victory_desc: "桂冠只给活人。双子并肩站在共鸣厅的阳台上，台下的人第一次不必分辨哪一位在说话。高塔的守护者这个称号，是文书房先写出来的。"

# ---- 二、效果说明（custom_effect_tooltip） ----
 LTN_loyal_viol_tt: "§Y小提琴派诸侯忠诚度§!（现值 §G[?LTN_loyal_viol|0]§!，满值 100）"
 LTN_loyal_cello_tt: "§Y大提琴派诸侯忠诚度§!（现值 §G[?LTN_loyal_cello|0]§!，满值 100）"
 LTN_loyal_both_tt: "§Y两派诸侯忠诚度§!同时变动（小提琴派现值 §G[?LTN_loyal_viol|0]§!，大提琴派现值 §G[?LTN_loyal_cello|0]§!）"
 LTN_conspiracy_tt: "§Y选帝侯密谋度§!（现值 §R[?LTN_conspiracy|0]§!，越过 75 会触发诸侯联手抵制）"
 LTN_budget_sup_tt: "§Y预算案通过优势§!（现值 §G[?LTN_budget_sup|0]§!，表决需 50）"
 LTN_budget_economy_tt: "预算计划本身：政府宏观调控稳住物价，扶持中小工坊——§Y企业产出 +15%§!、§R消费品需求 +10%§!（见本年度预算案精神）"
 LTN_tour_intel_tt: "巡演路线上的每座城市都留下一份听风记录：§Y全国情报获取增强§!，窃听器装在选帝侯的迎宾厅里。"
 LTN_liberals_unrest_tt: "部分自由党议员对预算案公开不满；§R双子女皇没有替他们把权利守住§!这一句会被反复引用。"
 LTN_diet_blocs_tt: "中忠诚的大区稳定度 §G+5%§!，小忠诚的大区稳定度 §R-5%§!——按两派忠诚度孰高孰低结算。"
 LTN_viol_bloc_tt: "小提琴派大区在议会里替预算案说话：§G通过优势 +15§!，§Y小提琴派忠诚度 +10§!。"
 LTN_cello_bloc_tt: "大提琴派大区与官僚体系绑在一起：§G通过优势 +10§!，§Y大提琴派忠诚度 +10§!，建造速度 +5%。"
 LTN_budget_act_passed_tt: "本年度预算案生效：§R消费品需求 +10%§!、§Y企业产出 +15%§!、§G建造速度 +20%（为期 180 天）§!、§G全国稳定度 +15%§!。"
 LTN_coup_100_tt: "§R百日夺权与集权计划开始计时§!：一百天后双塔要给出交代，届时按密谋度与忠诚度结算。"
 LTN_black_moment_start_tt: "§R黑清算时刻开始倒计时：100 天§!。在倒计时结束前拉拢满三位选帝侯（帝国宫廷页签）可解除此效果。"
 LTN_coopt_tt: "已拉拢选帝侯数：§G[?LTN_coopt_count|0]§! / 3（帝国宫廷页签继续拉拢）"
 LTN_shetling_note_tt: "§R施彤领大区忠诚度 -10§!：薇薇安娜带回的是真相，不是谢意。四支女皇之声近卫队进驻首都。"
 LTN_gaul_submission_tt: "高卢旧地的顺从度大范围上升——此处只落在国内：§G战争支持度 +10%§!、陆军经验 +60、两派诸侯忠诚度各 +10。"
 LTN_new_law_draft_tt: "新金律乐章初稿成形：取消选帝侯否决权。法案要过帝国议会过半，上议院支持须越过 34——这一步靠事件结算。"
 LTN_academy_purge_tt: "§Y统一思想§!与§Y新风尚§!同时生效：科研速度净 +5%，代价是学术界的长期潜力。巫妖一族大量离开莱塔尼亚。"
 LTN_round_table_14_tt: "§b联邦化法案的表决耗时 14 天§!，期间§Y全部大区忠诚度 +15§!、陆军经验 +325。"
 LTN_final_debate_req_tt: "最终辩论的门槛：打赢四皇会战级别的外战——对高卢作战，或正在作战且投降界限尚未越过四分之一。"
 LTN_final_debate_win_tt: "§G战果给了辩词§!：辩论按胜利者的口径记录，预算案优势额外 +15。"
 LTN_lower_house_tt: "议会会等待新的法案：下议院权威加强，议长由事件选举产生。§G政治点数 +325§!。"
 LTN_guardian_of_the_tower_tt: "双子同时获得§Y高塔的守护者§!：稳定度 +10%、战争支持度 +10%、抗_drift_ +15%。"
 LTN_tour_watched_tt: "巡演随行名单里有一串不属于乐团的名字：窃听器与听风记录布下。"
 LTN_veto_abolished_tt: "§G选帝侯的否决权被写入废止条款§!——按黑女皇的说法，金律乐章有且仅有一次变动，那是赫尔昏佐伦做到的事。"
 LTN_ct_lich_tt: "§R巫妖离境为期 100 天§!：高塔里再无巫妖的痕迹，此后改为 60 天。"
 LTN_budget_vars_headline: "§b诸侯的账§!"
 LTN_budget_vars_viol: "§b小提琴派诸侯忠诚度§!：§G[?LTN_loyal_viol|0]§! / 100\n"
 LTN_budget_vars_cello: "§b大提琴派诸侯忠诚度§!：§G[?LTN_loyal_cello|0]§! / 100\n"
 LTN_budget_vars_consp: "§b选帝侯密谋度§!：§R[?LTN_conspiracy|0]§! / 100\n"
 LTN_budget_vars_sup: "§b预算案通过优势§!：§Y[?LTN_budget_sup|0]§! / 100\n"
 LTN_budget_vars_coopt: "§b已拉拢选帝侯§!：§G[?LTN_coopt_count|0]§! / 3\n"

# ---- 三、精神与仪表 ----
 LTN_dyn_elector_bloc: "诸侯的效忠"
 LTN_dyn_elector_bloc_desc: "九大区的忠诚不是宣言，是数字。它同时决定稳定、抗分裂、政治点数的来路，以及双塔要买多少账。"

 LTN_budget_act_passed: "本年度预算案"
 LTN_budget_act_passed_desc: "预算案以微弱多数通过。拨款写进了金律乐章的附页，每一个声部都知道钱从哪里出。"

 LTN_budget_act_mild: "温和拨款案"
 LTN_budget_act_mild_desc: "保守派推出的替代法案。数字很小，措辞很稳，没有人受伤，也没有人得到他真正想要的东西。"

 LTN_budget_construction_fund: "预算拨款的工地"
 LTN_budget_construction_fund_desc: "钱先到的是脚手架。为期一百八十天的建造速度红利，到期自动收束。"

 LTN_leithanien_officer_corps: "莱式军官团"
 LTN_leithanien_officer_corps_desc: "永恒盛典之后，参谋职务不再按大区分配。军官团的名字来自莱塔尼亚，进攻也是。"

 LTN_unified_thought: "统一思想"
 LTN_unified_thought_desc: "宣誓效忠新金律的学者仍然是学者。研究条件被重新排了一遍，效率因此上升。"

 LTN_new_zeitgeist: "新风尚"
 LTN_new_zeitgeist_desc: "言论自由部分开放，以继续科研。这是用长期潜力换来的短期成绩，账目上写得清清楚楚。"

 LTN_lich_farewell: "巫妖的告别"
 LTN_lich_farewell_desc: "弗莱蒙特收回了他的命结，带着族裔回卡兹戴尔。从此以后，莱塔尼亚的高塔里再无巫妖的痕迹。"

 LTN_black_moment: "黑清算时刻"
 LTN_black_moment_desc: "白女皇的行政效率被下议院拖住。改革类事务一律多费等几天，倒计时结束后按拉拢成果结算。"

 LTN_guardian_of_the_tower: "高塔的守护者"
 LTN_guardian_of_the_tower_desc: "两位女皇共用一个称号。洁白的裙摆与深黑的剑刃第一次站在同一侧阳台的栏杆前。"

# ---- 四、事件（events/LTN_budget.txt，命名空间 LTN_budget） ----
 LTN_budget.1.t: "大臣们的账本"
 LTN_budget.1.d: "文书房从清晨排到夜里。九大区各送来一份收支，格式互不相同，有四份连签名的人都不认得现任管账的是谁。\n\n§Y审计要动政治资本，但只有审计过的数字才能在帝国议会上被引用。§!\n$LTN_budget_vars_viol$$LTN_budget_vars_cello$$LTN_budget_vars_consp$$LTN_budget_vars_sup$"
 LTN_budget.1.oa: "逐项清点，一份都不许含糊"
 LTN_budget.1.ob: "只查诸侯的账"
 LTN_budget.1.oc: "交给官僚体系去核"

 LTN_budget.2.t: "巡演启程"
 LTN_budget.2.d: "女皇之声的车队出了崔林特尔梅的城门。节目单上写的是新编乐章，随行名单里却有一串不属于乐团的名字。"
 LTN_budget.2.oa: "按既定路线唱完九座城"
 LTN_budget.2.ob: "把小提琴派的大区排在前面"
 LTN_budget.2.oc: "车队只是幌子，人手才是目的"

 LTN_budget.3.t: "巡演归来"
 LTN_budget.3.d: "车队回来时比出发时安静。听风记录堆在双塔的文书房，每一页都记着同一段掌声——以及掌声里那些不肯拍手的人。"
 LTN_budget.3.oa: "让她们休息，把记录送进我的书房"
 LTN_budget.3.ob: "在庆宴上公开一部分记录"

 LTN_budget.4.t: "帝国会议的争吵"
 LTN_budget.4.d: "共鸣厅里同时响着三种调子：自由党的变奏、保守党的低鸣、还有一群只关心自己大区拨款的选帝侯。没有人说得动别人，所有人都在等一个台阶。"
 LTN_budget.4.oa: "先让数字说话"
 LTN_budget.4.ob: "先安抚大提琴派"
 LTN_budget.4.oc: "把拨款明细买下来"

 LTN_budget.5.t: "金律共鸣厅的表决"
 LTN_budget.5.d: "唱票从最高的一枚音符开始。金律乐章的共鸣厅里，每一个声部都要被听见——包括那些没人想听见的。\n$LTN_budget_vars_sup$$LTN_budget_vars_viol$$LTN_budget_vars_cello$"
 LTN_budget.5.oa: "和弦落定：微弱多数"
 LTN_budget.5.ob: "和弦散了：今年不通过"

 LTN_budget.6.t: "施彤领的公开信"
 LTN_budget.6.d: "沃尔纳·冯·霍赫贝格的信写得极克制：「莱塔尼亚的本质是各大区的联合，帝国的意志从来不是某个人的意志。」信末没有署名日期，只有家族纹章。"
 LTN_budget.6.oa: "把信裱起来，挂进议事厅"
 LTN_budget.6.ob: "查一下是谁把这封信送进了每一份报纸"

 LTN_budget.7.t: "诸侯的抵制"
 LTN_budget.7.d: "九份抄本同时被人取走。选帝侯们不会喜欢双塔的说辞——他们畏惧的从来不是巫王这个名号，而是有人把权力与利益从他们手里分走。\n$LTN_budget_vars_consp$$LTN_budget_vars_viol$$LTN_budget_vars_cello$"
 LTN_budget.7.oa: "用政治点把票买回来"
 LTN_budget.7.ob: "让金律法卫去施彤领走一趟"
 LTN_budget.7.oc: "先在拨款上让一步"

 LTN_budget.8.t: "巫妖的告别"
 LTN_budget.8.d: "弗莱蒙特把契书摊在路德维格大学的石桌上，骂人的话还是那么刻薄，声音却比平时低。他要收回自己的命结，带族裔回卡兹戴尔。"
 LTN_budget.8.oa: "按礼数送他们出城"
 LTN_budget.8.ob: "把他们留下的东西先封存起来"

 LTN_budget.9.t: "清算时刻的账单"
 LTN_budget.9.d: "一百天到了。拉拢的名单没能凑够三家，下议院于是把礼节做得更足、把批文压得更久。行政效率的损耗，如今写在每一份改革文书的抬头。\n$LTN_budget_vars_coopt$"
 LTN_budget.9.oa: "承认这一年白女皇办不动事"

 LTN_budget.10.t: "新乐章修订法案最后表决"
 LTN_budget.10.d: "圆桌只有一张，座位按大区排开。改一个音符就会动摇政权——金律乐章自诞生以来只变动过一次，那是赫尔昏佐伦以一人之力做到的事。"
 LTN_budget.10.oa: "删掉否决权那一段"
 LTN_budget.10.ob: "只补条款，不动声部"

 LTN_budget.11.t: "最终辩论"
 LTN_budget.11.d: "各处都能见到讨论音乐、哲学和源石技艺的居民，各处都能看到露天的演奏。要在这场辩论里压住全场，靠的从来不是嗓门——是外面的战报。"
 LTN_budget.11.oa: "以胜者的口径记录这场辩论"
 LTN_budget.11.ob: "战报还没来，先把话讲完"

 LTN_budget.12.t: "下议院议长选举"
 LTN_budget.12.d: "新金律把权力收归女皇，下议院却因此需要一位真正能主持的人。选举在旧都乐章被抹去的那座厅里进行，礼宾官坚持按九个大区排序入场。"
 LTN_budget.12.oa: "让议员自己选"
 LTN_budget.12.ob: "由双塔指定，形式上补一次选举"

 LTN_budget.13.t: "密探在行动"
 LTN_budget.13.d: "巫王的信徒摘下面具，就是某位伯爵，或者某位选帝侯的继承人。金律法卫不能公开查案——怕民众恐慌——所以名单由暗处的人送到双塔桌上。\n$LTN_budget_vars_consp$"
 LTN_budget.13.oa: "照名单抓人，钱从预算案里出"
 LTN_budget.13.ob: "只抓最大的一张网"

 LTN_budget.14.t: "边境的军报"
 LTN_budget.14.d: "高卢的复国主义者需要一个理由，双塔也需要。四皇会战的旧账还挂在施彤领上空的源石风暴里，而新的权威正好要从边境线上取回来。"
 LTN_budget.14.oa: "把军官团派到边境去"
 LTN_budget.14.ob: "先在国内把话说圆"

 LTN_budget.15.t: "一百天之后：判断者的名册"
 LTN_budget.15.d: "名册摊开在双塔的文书房，每一行后面都跟着一个家族、一支私兵和一份抄本。黑女皇只问了一句：怎么处置。\n$LTN_budget_vars_consp$$LTN_budget_vars_viol$$LTN_budget_vars_cello$"
 LTN_budget.15.oa: "领头羊全部处死，作为警告"
 LTN_budget.15.ob: "流放，留下家族但撤掉抄本"
 LTN_budget.15.oc: "释放仁慈，让他们自己跪上来"

# ---- 五、决议 ----
 LTN_dec_elector_in_action: "选帝侯在行动"
 LTN_dec_elector_in_action_desc: "预算机器要有人盯着。点一次，诸侯就在拨款单上签一次字；签字是要成本的，忠诚度会被压下去，密谋度会抬头。"
 LTN_dec_elector_in_action_prompt: "拨款单已经送到各大区，双塔要定期催办。"

 LTN_dec_coopt_elector: "拉拢一位选帝侯"
 LTN_dec_coopt_elector_desc: "黑清算时刻的解药。一场私下会面、一份体面的拨款、一次不写在会议记录上的让步——三家就够了。"
 LTN_dec_coopt_elector_prompt: "选一位还愿意开口的选帝侯。"

