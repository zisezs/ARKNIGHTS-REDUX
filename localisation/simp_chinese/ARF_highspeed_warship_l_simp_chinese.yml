 # ===== 高速战舰工程（决议） =====
 ARF_highspeed_warship_category: "高速战舰工程"
 ARF_dreadnought_project: "建造高速战舰-无畏舰"
 ARF_dreadnought_project_desc: "船坞并不总是靠海。把一整座造船厂搬进内陆，再让它沿着铁轨自己开过去——这是只有疯子才会批准的预算，也是只有疯子才敢接的工程。\n\n代价不再是一个写死的数字：它在【高速战舰设计局】里按你选的配件结算。装得越满，要的军工厂越多。\n\n§Y当前方案§!：无畏舰将占用 §Y[?arf_ws_dr_cost]§! 座军工厂，工期 §Y365§! 天。等它驶下最后一段铁轨时，不会再有人讨论代价。"
 ARF_assault_ship_project: "建造高速战舰-突击舰"
 ARF_assault_ship_project_desc: "如果无畏舰是用来被记住的，突击舰就是用来先到的。\n\n§Y当前方案§!：突击舰将占用 §Y[?arf_ws_as_cost]§! 座军工厂，工期 §Y365§! 天。配件清单在【高速战舰设计局】里改。"
 ARF_gunboat_project: "建造高速战舰-炮舰"
 ARF_gunboat_project_desc: "不是每一仗都需要奇迹。几门足够重的炮，一条足够快的履带——剩下的交给前线的士兵。\n\n§Y当前方案§!：炮舰将占用 §Y[?arf_ws_gb_cost]§! 座军工厂，工期 §Y90§! 天。这是四个舰种里最便宜的一型，配件清单在【高速战舰设计局】里改。"
 ARF_auxiliary_ship_project: "建造高速战舰-辅助舰"
 ARF_auxiliary_ship_project_desc: "它不开火，也不冲锋。它修好别人烧坏的引擎，把伤员从火线上拖回来，让打光的部队重新站起来。\n\n§Y当前方案§!：辅助舰将占用 §Y[?arf_ws_ax_cost]§! 座军工厂，工期 §Y365§! 天。买的是一个师能多撑三天的机会。"

 # ===== 建造中的民族精神 =====
 arf_dreadnought_under_construction: "正在建造无畏舰"
 arf_dreadnought_under_construction_desc: "二十座军工厂的生产线被整体改写：铆钉、装甲板与主炮塔沿着铁轨排队等待装配。在这艘船驶下最后一段轨道之前，工厂里的其他订单只能先等一等。"
 arf_assault_ship_under_construction: "正在建造突击舰"
 arf_assault_ship_under_construction_desc: "八座工厂围绕一台更大的引擎重新排布。它不需要成为最强的那一艘，只需要比别人先到。"
 arf_gunboat_under_construction: "正在建造炮舰"
 arf_gunboat_under_construction_desc: "四座工厂，三个月。炮管与履带在同一条流水线上拧在一起。前线的士兵并不关心这艘船叫什么名字，只关心它什么时候到。"
 arf_auxiliary_ship_under_construction: "正在建造辅助舰"
 arf_auxiliary_ship_under_construction_desc: "四座工厂在为那些不会开火的东西让路：吊臂、备件、担架和永远修不完的引擎。它自己不上战列线，但没有它，战列线撑不过第三天。"