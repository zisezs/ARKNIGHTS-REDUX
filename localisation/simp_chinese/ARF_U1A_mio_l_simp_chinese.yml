l_simp_chinese:

# ===== 乌萨斯集团军 · 军工企业（U1A / U2A / UFA 共用）=====

# 1 集团军单兵武器生产商
 URS_AG_infantry_organization: "集团军单兵武器生产商"
 URS_AG_mio_initial_infantry: "集团军制式枪械"
 URS_AG_mio_initial_infantry_desc: "集团军的枪不该是某个厂的私产，而该是同一张图纸上的东西——枪管、枪机、弹匣，任何一支都能换到任何一支上。"
 URS_AG_trait_infantry_line: "战时步枪流水线"
 URS_AG_trait_infantry_line_desc: "三班倒，机器不停，人换班。"
 URS_AG_trait_infantry_simplified: "配给式简化工艺"
 URS_AG_trait_infantry_simplified_desc: "把公差放宽一点，把工序砍掉两道——换来的是每个月多出几万支枪。"
 URS_AG_trait_infantry_ammo: "弹药统配定额"
 URS_AG_trait_infantry_ammo_desc: "每个师按基数配满，不按需，不按申请。"

# 2 集团军火炮生产商
 URS_AG_artillery_organization: "集团军火炮生产商"
 URS_AG_mio_initial_artillery: "集团军炮群制式化"
 URS_AG_mio_initial_artillery_desc: "炮是消耗品。打得准是其次，打得久、补得上才是根本。"
 URS_AG_trait_artillery_traction: "骡马与牵引具标准化"
 URS_AG_trait_artillery_traction_desc: "炮架、前车、挽具、弹药车，全部统一规格，坏哪件换哪件。"
 URS_AG_trait_artillery_line: "炮闩总装流水线"
 URS_AG_trait_artillery_line_desc: "分段总装，工位有人就出炮。"
 URS_AG_trait_artillery_ammo: "急速射弹药基数"
 URS_AG_trait_artillery_ammo_desc: "炮组按消耗量打，不必省着用。"

# 3 集团军坦克生产商
 URS_AG_tank_organization: "集团军坦克生产商"
 URS_AG_mio_initial_tank: "集团军装甲定额"
 URS_AG_mio_initial_tank_desc: "集团的装甲不是王牌，是消耗品——产线能开多久，前线就能顶多久。"
 URS_AG_trait_tank_standard: "标准化底盘"
 URS_AG_trait_tank_standard_desc: "一套底盘喂三条产线，零件只备一份。"
 URS_AG_trait_tank_mobilization: "总动员产线"
 URS_AG_trait_tank_mobilization_desc: "拖拉机厂、机车厂，全部改产。"
 URS_AG_trait_tank_maintenance: "战损整备"
 URS_AG_trait_tank_maintenance_desc: "打得烂不要紧，修得快、开得回来就行。"

# 4 集团军装甲车辆生产商
 URS_AG_armored_car_organization: "集团军装甲车辆生产商"
 URS_AG_mio_initial_armored_car: "集团军轮式装甲"
 URS_AG_mio_initial_armored_car_desc: "装甲车不必精巧，能载着一个班穿过街区就够了。"
 URS_AG_trait_ac_standard: "民用卡车底盘"
 URS_AG_trait_ac_standard_desc: "民用总装线直接征用，钢板焊上去就是装甲车。"
 URS_AG_trait_ac_mobilization: "巡逻编成量产"
 URS_AG_trait_ac_mobilization_desc: "一队一队地交车，直接编进巡逻队。"
 URS_AG_trait_ac_support: "装甲运兵改装"
 URS_AG_trait_ac_support_desc: "集团的兵，得坐着车进城。"

# 5 集团军博尔京航空生产商
 URS_AG_aircraft_organization: "集团军博尔京航空生产商"
 URS_AG_mio_initial_aircraft: "集团军航空定额"
 URS_AG_mio_initial_aircraft_desc: "会飞的都从这里出去——不必是王牌，只要够多。"
 URS_AG_trait_air_factory: "扩大厂房"
 URS_AG_trait_air_factory_desc: "飞机是流水线上攒出来的，不是工匠敲出来的。"
 URS_AG_trait_air_simplified: "木架帆布简化工艺"
 URS_AG_trait_air_simplified_desc: "够飞、够快、够便宜。"
 URS_AG_trait_air_attrition: "消耗性编队"
 URS_AG_trait_air_attrition_desc: "机队是损失表上的数字，不是阅兵式上的方阵。"
