 YAN_civil_war: "大炎帝国尚蜀西狩行营"

#人物
 YAN_Wei_Zunli: "魏遵礼"
 YAN_Wei_Zunli_desc: "魏遵礼，炎朝第七位皇帝，相比于他征战四方、将北境收入囊中的曾祖父，和大力改革，将炎国的政治带入现代的祖母，他的光芒似乎并不似先祖们那么耀眼。在对禁城内的政治稍有了解的人都知道，魏遵礼得位不正。当女帝，他的祖母，因为一次失败毒杀的并发症驾崩后，魏遵礼杀死了争夺皇位的魏重茂和太保韦温，支持他的父亲魏旦登上了皇位。魏旦在政变的三年后去世，魏遵礼又杀死了意图谋反的魏晋，最终成为了大炎的新皇。\n\n魏遵礼清楚，自己登基的路途中，杀死了太多人，因此他在登基的第一年便前往封禅。在炎国媒体的全程直播下，魏遵礼获得了封禅仪式的认可，这位皇帝终于得到了他应有的威望与权力。在他与内阁的治理下，炎国延续着自源石工业革命以来持续的经济腾飞，并且成功在西陆的几次经济危机之外独善其身。然而，炎国的百姓更多地将这一切的功劳归功于他的两位重臣，魏甫和姚元之身上，皇帝似乎变成了不重要的花瓶。魏遵礼对此非常不满意，这位即将步入老年的皇帝需要重申天子的威严，他等待着一个机会。"
 Yan_the_emperor: "天子"
 YAN_Sun_Zaizhi: "孙载之"
 YAN_Li_Shouting: "李守廷"

#国家精神
 YAN_Mandate_of_heaven: "天命"
 YAN_Mandate_of_heaven_desc: "大炎皇朝，受命于天，既寿永昌。先帝率领的起义军在百年前推翻了梦魇可汗后裔建立的大乾帝国，并在经过封禅仪式的认可后，加冕为炎夏天子。炎朝国祚必将永延，万万年！\n\n§R如果封禅的真相能够继续掩藏下去的话……§!"
 YAN_Crossroad: "十字路口"
 YAN_Crossroad_desc: "当泰拉进入工业时代，天朝是东陆毫无疑问的领路者，但随着源石工业而来的，还有不断膨胀的商贾群体，排出浓烟和废水的工厂，越来越多的矿石病感染者……资本主义的不断扩张再一次将帝国带到了历史的十字路口。前朝的几次改革已经让炎国不至于在新的时代居于人后，但未来将行向何处？是继续顺应历史的潮流，为大地带来新的变革，抑或是坚信一个信条——帝国便是历史本身？"
 YAN_Legacy_of_the_female_emperor_reforms: "女帝改革的遗产"
 YAN_Legacy_of_the_female_emperor_reforms_desc: "当炎国迈入工业时代，几乎所有炎国的统治阶级都意识到，旧有的帝国体制已经无法适应飞速变化的时代。因此，在当时监国的皇后，也是后来的女帝徐凌空的支持下，这片土地上有史以来最大的一次变革拉开了帷幕。一个新的机构，内阁，被设置于三省之上，统辖朝政，内阁的日常政务可不经皇帝，自主决断；尚书省在改革原有六部的基础上增设文、农、惠、城、巡、术六部，以应对工业社会的全新问题；内廷的宦官权力被大幅削弱，并由之后的女帝本人立下祖训，断绝了宦官干政的可能。但随着改革的核心人物王临岳和支持改革的女帝相继离世，炎国的改革也陷入了停滞。不过对于炎国来说，如今的这一体制，已经足够让她在泰拉大地上站稳脚跟。"
 YAN_Sui_signs: "岁相"
 YAN_Sui_signs_desc: "神明，是早在泰拉诸王朝崛起之前就已存在于大地上的神秘存在，过去曾有不止一匹存在于炎夏境内。祂们掌握着极其强大的力量。祖龙在倾尽国力，且有其中最古老强大的一员助战的情况下也未能将其完全消灭，仅仅是在诛杀几匹后将其余驱逐出八荒。最后留在这片土地上的，最古老强大的“神”在被迫屈服于人类之后，将自身分化为十二片碎片，每一位都掌握着不同的力量和权能，隐藏在这片大地上。其中有些隐匿于江湖，有些高居于庙堂，有些则继承了本体的意志，试图向大炎发起复仇。\n\n§0到那时，大炎的都城将在鱼死网破的争斗中化为废墟§!。"