 YAN_Miracle_Affairs:0 "工部营造司"
 YAN_miracle_terminal:0 "奇迹工程"
 YAN_miracle_terminal_desc:0 "工部营造司呈上玄枢终端的印信。龙脊、镇岳、观星、水脉、熔炉、凌霄六项巨构的图样、物料与工匠，皆已接入这一方铜盘。\n\n§Y点击开启【大炎奇迹工程建设终端】§!"
 YAN_Miracle_Completed:0 "六大奇迹 · 天下大治"
 YAN_Miracle_Completed_desc:0 "龙脊镇北，司岁安民，天枢测天，玉带通衢，九鼎兴工，凌霄接天。六项巨构悉数落成，史官已将其载入大炎国史。"
 yan_mir_wonder_wall:0 "龙脊移动壁垒 · 竣工"
 yan_mir_wonder_wall_desc:0 "「奉天承运，筑脊于北，护我大炎万民不受风雪之苦。」\n\n陆军核心防御 +10% · 陆军防御 +5%。"
 yan_mir_wonder_sisui:0 "司岁镇岳台 · 竣工"
 yan_mir_wonder_sisui_desc:0 "「岁兽不安，四时失序。筑台以镇之，使风调雨顺，国泰民安。」\n\n稳定度 +8% · 研究速度 +5%。"
 yan_mir_wonder_observatory:0 "天枢观星阁 · 竣工"
 yan_mir_wonder_observatory_desc:0 "「仰观天文，俯察地理。建阁以通天意，使农桑不误、天时可测。」\n\n研究速度 +8% · 解密 +10%。"
 yan_mir_wonder_canal:0 "玉带南北水脉 · 竣工"
 yan_mir_wonder_canal_desc:0 "「南粮北调，国脉所系。开河以通舟楫，使天下物阜民丰。」\n\n建造速度 +10% · 补给消耗 -10%。"
 yan_mir_wonder_furnace:0 "九鼎源石熔炉 · 竣工"
 yan_mir_wonder_furnace_desc:0 "「鼎火不熄，国器永固。聚天下巧匠，熔源石以兴百工。」\n\n工厂产出 +7% · 工厂效率增长 +10%。"
 yan_mir_wonder_palace:0 "凌霄浮空宫阙 · 竣工"
 yan_mir_wonder_palace_desc:0 "「朕欲凌霄而观万民。筑宫于云，使大炎之威上达于天。」\n\n政治力量 +15% · 战争支持 +10%。"
 yan_mir_workload:0 "营造用工"
 yan_mir_workload_desc:0 "六项巨构同时开工，民用工厂被大批征作营造工坊。工厂越是被抽走，市面上的消费品就越紧。"
 yan_mir_edict_wb_dm:0 "万邦来朝"
 yan_mir_edict_wb_dm_desc:0 "四方商贾云集上京，税赋丰盈。"
 yan_mir_edict_xx_dm:0 "休养生息"
 yan_mir_edict_xx_dm_desc:0 "减免徭役，犒赏工匠，民心归附。"
 yan_mir.1.t:0 "北境暴风雪"
 yan_mir.1.d:0 "北境突降罕见暴风雪，雪深三尺，龙脊壁垒工地寸步难行。监工请示：是否暂停施工、发放御寒衣物？\n\n§Y钦天监急报§!"
 yan_mir.1.a:0 "发放御寒衣物，坚持施工\n§T政治点数 -60 · 保持进度§!"
 yan_mir.1.b:0 "暂停三日，避雪休整\n§T所有在建工程进度 -2%§!"
 yan_mir.2.t:0 "岁兽异动"
 yan_mir.2.d:0 "雍州地动，岁兽渊口传来低吼。司岁台监造请求增拨火炮与燃料，加固镇压法阵。\n\n§Y司岁台急报§!"
 yan_mir.2.a:0 "增拨物资加固法阵\n§T火炮 -200 · 燃料 -100 · 指挥点数 +25§!"
 yan_mir.2.b:0 "置之不理，静观其变\n§T稳定度 -3% · 指挥点数 -10§!"
 yan_mir.3.t:0 "工匠请愿"
 yan_mir.3.d:0 "连日赶工，工匠疲惫。数百工匠联名请愿，请求发放犒赏、休沐一日。\n\n§Y工部呈文§!"
 yan_mir.3.a:0 "发放犒赏银\n§T政治点数 -80 · 稳定度 +5%§!"
 yan_mir.3.b:0 "严词驳回，继续赶工\n§T进度 +10%（三月） · 稳定度 -6%§!"
 yan_mir.4.t:0 "西域商队"
 yan_mir.4.d:0 "一支西域商队抵达上京，带来大量支援装备与步兵装备，愿以平价出售，另求购燃料。\n\n§Y市舶司喜报§!"
 yan_mir.4.a:0 "购入装备\n§T政治点数 -70 · 支援装备 +600 · 步兵装备 +400§!"
 yan_mir.4.b:0 "出售燃料换银\n§T燃料 -300 · 政治点数 +120§!"
 yan_mir.5.t:0 "发现富矿脉"
 yan_mir.5.d:0 "荒漠矿工掘进三百丈，发现一条前所未有的富源石矿脉，矿石熠熠生辉！\n\n§Y荒漠矿场捷报§!"
 yan_mir.5.a:0 "全力开采\n§T燃料 +400 · 政治点数 -30§!"
 yan_mir.5.b:0 "封存待后\n§T指挥点数 +30§!"
 yan_mir.6.t:0 "天现祥瑞"
 yan_mir.6.d:0 "夜有五色云现于上京之上，钦天监解为「天佑大炎，工程必成」之兆，万民欢腾。\n\n§Y钦天监贺表§!"
 yan_mir.6.a:0 "大赦犒赏，与民同乐\n§T政治点数 -50 · 稳定度 +6% · 指挥点数 +20§!"
 yan_mir.6.b:0 "低调处置，继续督工\n§T指挥点数 +10§!"
 yan_mir.7.t:0 "贪墨案发"
 yan_mir.7.d:0 "都察院查获工部郎中贪墨工程银两三千，证据确凿。请圣裁。\n\n§Y都察院密折§!"
 yan_mir.7.a:0 "严惩不贷，抄没家产\n§T政治点数 +150 · 稳定度 +3%§!"
 yan_mir.7.b:0 "罚俸留用，戴罪立功\n§T政治点数 +40 · 指挥点数 -15§!"
 yan_mir.8.t:0 "万国使节来观"
 yan_mir.8.d:0 "哥伦比亚、维多利亚等国使节欲参观奇迹工程，一展大炎国威。接待规格请示。\n\n§Y鸿胪寺通报§!"
 yan_mir.8.a:0 "隆重接待，彰显国威\n§T政治点数 -90 · 指挥点数 +50§!"
 yan_mir.8.b:0 "谢绝参观，闭门营造\n§T进度 +5%（三月） · 稳定度 +2%§!"
 yan_mir.99.t:0 "六大奇迹 · 全部告成"
 yan_mir.99.d:0 "历时数载，六项巨构悉数竣工。龙脊镇北，司岁安民，天枢测天，玉带通衢，九鼎兴工，凌霄接天。\n\n史官在起居注的最后写下八个字：\n\n§Y「一民播种之处，万民收获之所。」§!"
 yan_mir.99.a:0 "昭告天下，大炎自此无岁。"
