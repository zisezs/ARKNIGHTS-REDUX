 YAN_MIR_DESC_WALL:0 "绵延万里的可移动城防巨构。以机关术驱动城段，雪原之上缓缓游曳，抵御北境荒兽与风雪。城砖皆由太行青石烧制，缝隙以源石活化胶填合。"
