 YAN_MIR_CHRON_RULES:0 "§Y营造须知§!\n\n一、六项工程各自占用民用工厂（营造工坊），同一座工厂不能两处用。占用越多，消费品需求越高。\n二、工程每月推进一次，同时扣除政治点数、燃料与装备。任一物料不足，该工程当月停摆。\n三、稳定度影响工匠效率；冬季与暴风雪会拖慢工期。\n四、每项工程竣工后永久获得对应国家修正与国威。六项全部竣工，天下大治。"
