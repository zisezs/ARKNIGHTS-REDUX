#人物
 UFT_Balan_Falco: "巴兰·法尔科"
 UFT_Balan_Falco_desc: "当什基普塔尔革命的领袖伊拉尔·舍马尔宣布退休时，人们先是惊讶于这位传奇人物的急流勇退，然后是惊讶于他指定的接班人——巴兰·法尔科，一个游离于什基普塔尔权力中心之外的年轻人，在接替领袖成为共和国的总统之前，他只是社会党内负责党务的副书记。现在人们已经无法得知舍马尔是怎么想的了，这一切的答案都随着领袖的去世一起被带入坟墓。什基普塔尔的人们只知道，巴兰·法尔科似乎是个好人，但是仅限于是个好人。他从不惹怒任何人，与社会党党内党外的各派都保持着良好的关系，也在危险的地缘局势中保持着国家的安全。但法尔科的内政手段却堪称一塌糊涂，在几次失败的经济改革后，这位领导人也将经济事务全权交给专业人士，只去做他擅长的人事管理。不管怎么说，巴兰·法尔科不算是一个坏领导，但是什基普塔尔的平民和政治家们也都认为，这个国家可能会有一个更好的人选。"
