#国家精神
 southern_revolutionary_bastion: "南方革命的堡垒"
 southern_revolutionary_bastion_desc: "当围栏事件的影响传至美拉尼西亚，表面上不可一世的维多利亚殖民帝国开始崩塌，而什基普塔尔人民便是抓住了这次机会。诞生自花语运动中的左翼思潮武装了我们的头脑，而经由伊比利亚走私而来的武器武装了我们的身体。终于，在四十多年前的尤里卡战争之中，什基普塔尔人民击败了维多利亚的委任政府，重新获得了独立。之后，在伊拉尔·舍马尔的带领下，我们将这个国家建设成了一个人人平等的共和国，不再有王公贵族和公司企业的压迫，如果谁要将侵略者和压迫者带回这片土地，那么什基普塔尔将与他们战至最后一滴血。"
	failed_six_year_plan: "失败的六年计划"
	failed_six_year_plan_desc: "在巴兰·法尔科上任后不久，远方的伦蒂尼姆爆发了严重的金融危机，随之而来的经济下行严重影响了依赖出口的什基普塔尔经济。在左翼意识形态的指导下，当时的政府选择加快与中陆资本主义大国的脱钩进程。然而过于决绝的脱钩导致什基普塔尔错过了中陆国家在金融潮过后的复苏，并且进一步加重了国内的经济危机。无可奈何的社会党政府只好采取共产党的建议，加强对国民经济的计划控制，但几次束手束脚的六年计划最终也是以失败收场，什基普塔尔的工业化迟迟未见进展，而逐渐恢复元气的农业和矿业则试图在已然洗牌了的国际市场寻找一片喘息之地。联合政府内的民主社会同盟和共产党都已经对此表达了自己的不满，而什基普塔尔的人民则在思考一个更严重的问题：为什么社会共和国内还会有失业和饥荒？"