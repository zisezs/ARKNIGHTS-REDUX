l_simp_chinese:

# ===== 伊比利亚军事国策簇（生成器 docs/gen_ibr_military.cjs，勿手改） =====
 IBR_mil_root: "锈蚀的黄金与发潮的火药"
 IBR_mil_root_desc: "武库里躺着三代枪铳：地窖中的金子在发绿，火药在每一个雨季结块。点卯册漂亮得很，能真正推上炮闩的人却少得多——挂上这块牌子，就是承认这一点。"
 IBR_mil_lessons_1: "清点弃城之夜的名册"
 IBR_mil_lessons_1_desc: "哪几艘船没有回来，哪几个连队在天亮前离开了滩头——惩戒军的名册五十年来始终不肯写清。如今每一页被重新抄录：死者、失踪者，以及那些活着回来却不敢报出番号的人。只有承认自己丢掉了多少的国家，才配问自己学到了什么。"
 IBR_mil_lessons_2: "开放海图与战时档案"
 IBR_mil_lessons_2_desc: "审判庭第一次把那一年的电令、海图与迟到的钟点摊在同一张长桌上。不审判任何人，只追问每一个小时。"
 IBR_mil_lessons_3: "岸防炮台校射演练"
 IBR_mil_lessons_3_desc: "菲尼斯特雷角的炮手重新用丈量法标定射程。发潮火药的教训被写进药库的通风图——一场灾难只有变成条款，才算没有白来。"
 IBR_mil_lessons_4: "灯塔瞭望链"
 IBR_mil_lessons_4_desc: "从特纳里夫到盐风城，望楼、警钟与灯塔被连成一条线。敌影还没抵达锚地，信号簿已经放在大审判官的案头。"
 IBR_mil_lessons_5: "参谋轮习于灯塔之下"
 IBR_mil_lessons_5_desc: "惩戒军第一次让年轻军官跟着老军需官走完整条海岸线。图纸上的错误不会杀人，没有人核对的图纸才会。"
 IBR_mil_lessons_6: "表彰从深海归来的人"
 IBR_mil_lessons_6_desc: "抱着断桅漂回来的水手、把伤兵背出盐滩的民夫，被一个一个念出名字。仪式上没有讲神迹，只念人名——伊比利亚欠他们一句话：回来了就好。"
 IBR_mil_lessons_7: "重组锈蚀的龙骨"
 IBR_mil_lessons_7_desc: "旧港里那些被官方放弃的舰体重新拖上船台。能修的修，不能修的拆成零件。一支舰队完全可以从一份残骸清单开始重建。"
 IBR_mil_lessons_8: "深海战例讲习所"
 IBR_mil_lessons_8_desc: "每一次登陆、每一次溃退、每一座灯塔熄灭的夜晚都被写成教范。学员要背的第一课是：我们的敌人从不重犯同一个错误，所以我们必须记住自己的。"
 IBR_mil_lessons_9: "把那一夜写进操典"
 IBR_mil_lessons_9_desc: "耻辱不再被从册子上撕掉，而是装订进每一本操典的第一页。从此惩戒军在新兵入营那天先读阵亡名册，再读射击要领。"
 IBR_mil_shield_1: "教区征发令"
 IBR_mil_shield_1_desc: "以教区为单位征发青壮，名册存在灯塔之下，粮饷随人而走。审判庭第一次发现：虔诚是可以折算成行军里数的。"
 IBR_mil_shield_2: "山地火枪营"
 IBR_mil_shield_2_desc: "从内陆山道编练的轻步兵营，熟悉每一条盐碱小路与退潮后的滩涂。他们不打阵地战，只把敌人引进自己走过的地形。"
 IBR_mil_shield_3: "要塞炮术学校"
 IBR_mil_shield_3_desc: "海岸炮台的瞄准手不再依赖老师傅的手感。几何与算学被搬上炮位——至高之术第一次用在弹道上。"
 IBR_mil_shield_4: "军械自给作坊"
 IBR_mil_shield_4_desc: "细剑、提灯法杖与盾面的产量被拆给每一座村镇定额。一支部队能撑多久，从此取决于它背后有多少间亮着灯的锻炉。"
 IBR_mil_shield_5: "督练区制度"
 IBR_mil_shield_5_desc: "全国划为若干督练区，各设督办，训练与军法归于一处。惩戒军不再是各地自生自灭的残部，而是一张有编号的网。"
 IBR_mil_shield_6: "高原骑兵团巡边"
 IBR_mil_shield_6_desc: "在高原与盐滩之间，骑兵团昼夜巡边。他们的职责不是决战，而是让任何越过海岸的东西都在天亮前被报出位置。"
 IBR_mil_shield_7: "伤兵与抚恤行会"
 IBR_mil_shield_7_desc: "修院、行会与渔村共同收养伤残者。老兵的木腿在码头上不再被视作神罚，而是国家开出的一张收据。"
 IBR_mil_shield_8: "常备师团定额"
 IBR_mil_shield_8_desc: "每一座灯塔对应一支驻军，每一支驻军有法定的编制与粮饷。纸上点得清的军队，才打得起长期的仗。"
 IBR_mil_shield_9: "惩戒军团重生"
 IBR_mil_shield_9_desc: "空额名册在文书上被划掉，缺额的连队重新领到了番号与粮饷。它不属于某个家族、某位圣徒，而属于每一个站在海岸线上的人——惩戒军不再是赎罪的囚徒，它本身就是伊比利亚。"
 IBR_mil_navy_1: "打捞港内沉船"
 IBR_mil_navy_1_desc: "五十年的港口成了一座铁的坟场。潜水钟与捞船索第一次下水——有些船不必再航，但它应该被拖出航道。"
 IBR_mil_navy_2: "航海兄弟会招募"
 IBR_mil_navy_2_desc: "水手行会重新立案：老水手带学徒，领航员按股份分红，溺亡者的遗孤领取年金。海图上的暗礁从此有人愿意世代看守。"
 IBR_mil_navy_3: "海图局与水文测量"
 IBR_mil_navy_3_desc: "每一处水深、每一道回流被记进属于本国的册子。第一次，伊比利亚的海岸线由伊比利亚人自己绘制。"
 IBR_mil_navy_4: "快炮艇夜袭队"
 IBR_mil_navy_4_desc: "小吨位、低干舷、装着抛射管的艇只在夜里接近，开火，然后消失在灯影之外。海嗣开始害怕黑暗，就像人类一样。"
 IBR_mil_navy_5: "船台与索具场扩建"
 IBR_mil_navy_5_desc: "新船台打桩，缆绳与帆布按季出产。舰队不是在下水那天才存在的，它存在于每一根被搓出来的缆绳里。"
 IBR_mil_navy_6: "银船队护航编组"
 IBR_mil_navy_6_desc: "商船不再单独出港：每支船队配护航舰，航线、会合点与失散后的集合灯塔全部写死在簿子上。"
 IBR_mil_navy_7: "三桅旗舰下水"
 IBR_mil_navy_7_desc: "龙骨铺了三年，舷侧排出八十门炮。老人们在码头上找它船身上有没有旧黄金舰队的疤痕——当然没有，但挂的是同一面旗。"
 IBR_mil_navy_8: "水手长期服役令"
 IBR_mil_navy_8_desc: "服役年限与退伍年金一并立法。一支舰队最贵的部件从来不是火炮，而是那些认得每一个绳结的人。"
 IBR_mil_navy_9: "重铸无敌舰队"
 IBR_mil_navy_9_desc: "再也没有人说“无敌舰队会归来”。舰队的名字写在新的册子上，舷号从第一号开始——伊比利亚的海军第一次有了属于自己的纪元。"
 IBR_mil_final: "永恒征服"
 IBR_mil_final_desc: "一支学会了如何活下去的军队，第一件事就是打听别的海面上天气如何。灯塔的光链已经环抱海岸，而海图之外仍有海岸——征服不是某个国策的名字，而是这台机器运转的方向。"

 # ---- 升级型民族精神（分级） ----
 IBR_reclaimed_sea_heritage_1: "收回的海洋遗产 Ⅰ"
 IBR_reclaimed_sea_heritage_1_desc: "旧海图从审判庭的档案柜里被重新取出，那些沉在港口的名字第一次被逐一念出。遗产不再是耻辱的注脚，而是一份待领的清单。"
 IBR_reclaimed_sea_heritage_2: "收回的海洋遗产 Ⅱ"
 IBR_reclaimed_sea_heritage_2_desc: "打捞索与潜水钟把第一批准龙骨拖上船台。学会数清自己丢掉了什么的国家，才有资格谈如何把它拿回来。"
 IBR_reclaimed_sea_heritage_3: "收回的海洋遗产 Ⅲ"
 IBR_reclaimed_sea_heritage_3_desc: "航海学校重新开课，老领航员把深海的暗礁一道道标回新版海图。伊比利亚的海岸线，重新由伊比利亚人自己丈量。"
 IBR_reclaimed_sea_heritage_4: "收回的海洋遗产 Ⅳ"
 IBR_reclaimed_sea_heritage_4_desc: "残骸清单变成了建造清单。舰炮与桅杆同时上马，港口的灯一盏盏亮回大静谧之前的样子。"
 IBR_reclaimed_sea_heritage_5: "收回的海洋遗产 Ⅴ"
 IBR_reclaimed_sea_heritage_5_desc: "收回的不只是船与炮，还有那套让它们出海的本事。海战伤害、舰队列组织度与经验获取，一并站上了两成的台阶。"
 IBR_shield_of_the_south_1: "惩戒军团重生 Ⅰ"
 IBR_shield_of_the_south_1_desc: "教区征发令贴到每一座村镇，名册存在灯塔之下。纸面的番号第一次填进了活人。"
 IBR_shield_of_the_south_2: "惩戒军团重生 Ⅱ"
 IBR_shield_of_the_south_2_desc: "山地火枪营成军，把敌人引进自己走过的盐碱小路。惩戒军开始有了自己的打法，而不只是勇气。"
 IBR_shield_of_the_south_3: "惩戒军团重生 Ⅲ"
 IBR_shield_of_the_south_3_desc: "要塞炮术学校把几何搬上炮位，督练区把训练与军法并成一张网。这支军队从散兵游勇长出了骨架。"
 IBR_shield_of_the_south_4: "惩戒军团重生 Ⅳ"
 IBR_shield_of_the_south_4_desc: "常备师团有了法定编制与粮饷，伤兵行会给归来者开出一张张收据。军队学会了打长期的仗，也学会了照料自己。"
 IBR_shield_of_the_south_5: "惩戒军团重生 Ⅴ"
 IBR_shield_of_the_south_5_desc: "空额名册被划掉，缺额连队重新领到番号。它不再属于某位圣徒或某个家族——它本身就是伊比利亚。"
 IBR_armada_reforged_1: "重铸的无敌舰队 Ⅰ"
 IBR_armada_reforged_1_desc: "打捞港内沉船，把五十年的铁坟场重新拖出航道。舰队从一份残骸清单开始呼吸。"
 IBR_armada_reforged_2: "重铸的无敌舰队 Ⅱ"
 IBR_armada_reforged_2_desc: "航海兄弟会重新立案，老水手带学徒，遗孤领年金。暗礁从此有人世代看守。"
 IBR_armada_reforged_3: "重铸的无敌舰队 Ⅲ"
 IBR_armada_reforged_3_desc: "海图局量遍每一处水深与每一道回流。舰队第一次在属于本国的海图上操演战列线。"
 IBR_armada_reforged_4: "重铸的无敌舰队 Ⅳ"
 IBR_armada_reforged_4_desc: "快炮艇在夜里接近、开火、隐入灯影；船台与索具场昼夜扩建。深海开始害怕黑暗，就像人类一样。"
 IBR_armada_reforged_5: "重铸的无敌舰队 Ⅴ"
 IBR_armada_reforged_5_desc: "三桅旗舰下水，银船队有了护航编组。造船被做得足够便宜——这才是一支舰队的真正前提，而它是逐格付账。"
 IBR_sun_over_the_south_1: "永恒征服 Ⅰ"
 IBR_sun_over_the_south_1_desc: "一条战线的收尾向它交出四分之一：军队学会活下去之后，第一件事便是打听别的海面。"
 IBR_sun_over_the_south_2: "永恒征服 Ⅱ"
 IBR_sun_over_the_south_2_desc: "两条战线的收尾各推一级。战争支持度不再需要被论证，它自己会顺着海图蔓延。"
 IBR_sun_over_the_south_3: "永恒征服 Ⅲ"
 IBR_sun_over_the_south_3_desc: "三条战线的收尾各推一级。灯塔的光链环抱海岸，而海图之外仍有海岸。"
 IBR_sun_over_the_south_4: "永恒征服 Ⅳ"
 IBR_sun_over_the_south_4_desc: "终幕格交出最后一份。征服不再是一个国策的名字，而是这台机器运转的方向。"

 IBR_hollow_roster: "名册上的惩戒军"
 IBR_hollow_roster_desc: "纸面上有七个连队，海岸上只剩一个营。缺额的粮饷被军需官抄走，训练册上的名字从未摸过枪管。乙线的每一格都在把它的数字往零上推，直到收尾【惩戒军团重生】把这个名字从文书上划掉。"

 IBR_mil_root_tt: "挂上民族精神【名册上的惩戒军】：一支只存在于纸面上的军队。它的每一个数字都会在乙线的九道法令下向零靠拢，直到乙线收尾【惩戒军团重生】把它从文书上划掉。"
 IBR_mil_lessons_1_tt: "摘除民族精神【失落的海洋遗产】，改挂升级型民族精神【收回的海洋遗产】。甲线推进即升级：Ⅰ→Ⅴ，每级都会同时抬高海战伤害、舰队列组织度、陆军攻防与经验获取。"
 IBR_mil_capstone_tt: "收尾格把本线的升级型民族精神再推一级（已满级则不再叠加），同时向终幕精神【永恒征服】交出四分之一。"
 IBR_mil_final_tt: "【永恒征服】共四档来源：三条线的收尾格各推一级，本格交出最后一级。只走一条线也能挂上它，但只有三线齐备才推得到满值。"

