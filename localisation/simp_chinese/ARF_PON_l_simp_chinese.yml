#人物
 PON_Marianne_Temeru: "玛丽安·特梅卢"
 PON_Marianne_Temeru_desc: "当林贡斯被彻底毁灭的消息传到当时还是个小女孩的玛丽安耳中，身在高卢波利尔尼亚殖民地的亲戚家的她为此大哭了一场。这倒不是因为她敬爱在战争中死去的科西嘉一世和高卢皇后，而是她的父母都是林贡斯公社的成员。所以当流亡到这里的高卢自由主义者组织起“自由高卢”，并且邀请她参与高卢复国大业时，玛丽安·特梅卢毫不犹豫地拒绝了。过了几年，维多利亚的美拉尼西亚殖民领在围栏事件和尤里卡战争后分崩离析，秩序崩溃的混乱很快蔓延到了波利尔尼亚。这时，又一支队伍敲响了特梅卢家的大门，他们声称自己是受新生的什基普塔尔社会共和国支持的游击队，要将革命的火种播撒至波利尔尼亚，玛丽安·特梅卢毫不犹豫地同意了。在之后的混战中，玛丽安的军事天赋和内政天赋逐渐展现出来，她不断得到提拔，最终成为了人民阵线的高层领导之一。在一次对维多利亚殖民军的失败军事行动中，人民阵线的几位领袖不幸阵亡，而玛丽安便临危受命接过了领袖的职责。在分析地缘局势后，她果断与维多利亚殖民军签订了暂时的停火协议，将进攻重心放在自由高卢方面，并且取得了成效。玛丽安·特梅卢对那些流亡者口中的帝国荣耀没有一点感觉，她关心的只是最多数人的幸福与未来。"
 PON_Gagana_Doneruma: "伽伽那·多内鲁马"
 PON_Laurent_Emmaneland: "无法确定"

 #民族精神
 PON_Fire_to_revolution: "革命热情"
 PON_Fire_to_revolution_desc: "波利尔尼亚在历史上先是被伊比利亚统治，随后又被转手给高卢和维多利亚，这里的人民在统治者的剥削压迫下度过了无数个日月，如今我们终于得到了反抗的机会。波利尔尼亚从农民到工匠，都投入到了这场最后的斗争之中。"
 PON_Which_road_to_go: "道行何方"
 PON_Which_road_to_go_desc: "终于，我们勇敢的迈过了第一步，不是依靠§C西方§!的救世主，也不是依靠§Y东方§!的神仙皇帝，唯独依靠我们§t自己§!。可是，在那之后，我们道行何方？"
 PON_The_final_struggle: "最后的斗争"
 PON_The_final_struggle_desc: "最先过来的是那群伊比利亚人，他们承诺将所谓的文明礼赠我们，却只带来了沉重的镣铐与枷锁。紧随而至的，是自诩解放者的高卢人，以及号称仲裁者的维多利亚人。他们头戴耀眼的冠冕，却踩在我们的尸体上争权夺利、相互厮杀，亘古不变；宛如漫漫长夜，又似黯淡挽歌。\n然而，这一切该结束了。\n即便天崩地裂，\n哪怕§R血流§!成§4河§!，\n纵使§O星火§!将§g熄§!，\n如若我们§t团结起来§!，\n§H波利尔尼亚族定将挣脱枷锁！§!"

