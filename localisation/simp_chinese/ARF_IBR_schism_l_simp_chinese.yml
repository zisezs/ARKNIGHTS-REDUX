l_simp_chinese:

  ##################################
  ## 伊比利亚 限时决议：终结分裂！ ##
  ##################################

  IBR_end_the_schism:0 "终结分裂！"
  IBR_end_the_schism_desc:0 "【永恒灯塔】已立，半岛却仍被数面旗帜割裂。在 150 天内抹除天环骑士团与审判之剑军团，宣布伊比利亚再无第二把剑。\n逾期未果，深海猎人将登陆伊比利亚，三十日后由阿戈尔军事管制区接管全境。"
  IBR_end_the_schism_tt:0 "§R天环骑士团与审判之剑军团均须不复存在。§!\n二者皆为伊比利亚的割据势力，须彻底消灭其国家存在。"

  IBR_schism_ended:0 "分裂终结"
  IBR_schism_ended_desc:0 "半岛上只剩下一种旗帜、一种律法、一盏灯塔。地方豪强与残军被逐整编，征兵册第一次写满了同一个国名。"

  ibr.200.t: "阿戈尔军事管制区"
  ibr.200.d: "登陆后的第三十日，阿戈尔的军事管制条例贴满了每一座灯塔：伊比利亚半岛、天环骑士团与审判之剑军团的控制区，以及深海教会残党盘踞的荒岛，一并划入阿戈尔军事管制区。审判庭的提灯被逐一熄灭，取而代之的是深蓝色的管制旗。"
  ibr.200.a: "……"

  worldnews_ibr.9.t: "伊比利亚宣告统一"
  worldnews_ibr.9.d: "伊比利亚宣布境内再无割据势力，天环骑士团与审判之剑军团的旗帜被当众焚毁。审判庭称这是「灯塔之下，唯一的律法」。"
  worldnews_ibr.9.a: "分裂已终"

  worldnews_ibr.10.t: "阿戈尔军事管制区成立"
  worldnews_ibr.10.d: "深海猎人在伊比利亚半岛建立阿戈尔军事管制区，原伊比利亚全境、天环骑士团、审判之剑军团与深海教会残党的控制区均被接管。各国使馆收到了同一份照会：此后一切交涉，请递交给管制区。"
  worldnews_ibr.10.a: "海洋接管了陆地"

  ##################################
  ## 阿戈尔军事管制区（AGM）      ##
  ##################################

  AGM:0 "阿戈尔军事管制区"
  AGM_ADJ:0 "阿戈尔军事管制区"
  AGM_DEF:0 "阿戈尔军事管制区"

  AGM_military_administration:0 "深海军事管制"
  AGM_military_administration_desc:0 "行政、征兵与补给均由军事管制委员会一手统辖：命令从舰上下达，经灯塔中转，直达每一座村镇。效率极高，也绝无申辩的余地。"
