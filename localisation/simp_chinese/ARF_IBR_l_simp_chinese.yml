#民族精神
 IBR_aftermath_of_Profound_Silence: "大静谧的余波"
 IBR_aftermath_of_Profound_Silence_desc: "五十多年前，来自深海的神秘威胁毁灭了伊比利亚引以为傲的黄金舰队，本土与殖民地的联系被粗暴地中断，依赖剥削殖民地的伊比利亚经济瞬间崩溃，随之引发的金融潮让这个辉煌的帝国一蹶不振，在国家机器彻底崩塌后，从海洋中爬上岸的怪物将伊比利亚的南方啃食殆尽，留下一地废墟后又消失在深海之中。即使在这场天灾与人祸发生的五十多年后，伊比利亚仍然堕落在“大静谧”的恐惧中，灯塔再也没有亮起，舰队再也不会归来，伊比利亚再也没有资格拥有明天……"
 IBR_aftermath_of_Profound_Silence_faded: "大静谧的余波（渐弱）"
 IBR_aftermath_of_Profound_Silence_faded_desc: "伊比利亚之眼重新亮起的那一夜，无数人在灯塔下痛哭失声。大静谧的阴影依旧盘踞在盐碱的土地上，但至少，人们再次知道了黑夜中该望向哪里。"
 IBR_threat_of_deep_sea_church: "深海教会的威胁"
 IBR_threat_of_deep_sea_church_desc: "海嗣，伊比利亚人对它们并不了解，人们只知道它们是“大静谧”的罪魁祸首。但对于深海教会的成员们来说，海嗣是更高级的生命形式，也是人类最终的归宿。尽管审判庭对这种邪教信仰的追猎从未停止，但杀死一种思想，似乎是不可能的事。"
 IBR_threat_of_deep_sea_church_surge: "深海教会的威胁（愈演愈烈）"
 IBR_threat_of_deep_sea_church_surge_desc: "传教士的队伍越走越远，深夜的祭坛越搭越多。有人开始梦见潮水的声音，有人在饭桌上平静地说起“海的那一边”。审判庭的镇压越严厉，深渊的信徒就越虔诚——思想的瘟疫，正在沿着海岸线蔓延。"
 IBR_unauthorized_government: "不正统的政府"
 IBR_unauthorized_government_desc: "审判庭改组自伊比利亚国教会，一个拉特兰正教的分支。虽然审判庭掌控着这个国家的方方面面，但在名义上，伊比利亚仍然属于国王，尽管大静谧时代的王室早已逃得无影无踪，但一位卡斯蒂利亚王朝的旁系贵族，已经自封卡洛斯九世，并且在保皇派的护送下悄悄返回国内，准备从审判庭手上夺取“本应属于他”的东西。"
 IBR_inquisition_iron_curtain: "审判庭的铁幕"
 IBR_inquisition_iron_curtain_desc: "以提灯与长剑代替铳械，以戒律代替律法，以忏悔代替言论。审判庭的巡行审判官走过每一座村庄，边界上盘查着每一封海外的来信。这片土地信仰的纯度得到了保证，代价是思想的盐碱化——任何涉及拉特兰或阿戈尔的研究，都会让学者站上火刑柱。"
 IBR_lost_maritime_heritage: "失落的海洋遗产"
 IBR_lost_maritime_heritage_desc: "成千上万的港口归于寂静，布雷奥甘设计的“愚人号”化作深海中的传说。曾经横行大洋的两栖舰队只剩锈蚀的龙骨，灯塔的能源体系随阿戈尔工程师的流亡而失传。伊比利亚的工匠们仍会造船——用黄金时代传下的手法，造一艘在浅海打鱼的渔船。"
 IBR_legacy_of_supreme_swordsmanship: "至高剑术的遗风"
 IBR_legacy_of_supreme_swordsmanship_desc: "“至高之术”——基于几何与算学的决斗剑法，是伊比利亚最后的骄傲。大静谧毁掉了舰队与枪炮，却夺不走刻在这片土地骨血里的剑。审判庭鼓励每个平民习剑自卫，于是盐碱地上的孩子们挥剑如同挥舞祈祷的手掌。"
 IBR_holy_see_idea: "审判庭圣座"
 IBR_holy_see_idea_desc: "伊比利亚不再是流亡王室的行省，也不再是无主的神弃之地。圣徒卡门加冕为圣座，政教合一，提灯即是王权。伊比利亚有了自己的神，也就有了自己的国。"
 IBR_independent_church: "独立教会"
 IBR_independent_church_desc: "审判庭正式宣告与拉特兰母会断绝共融：伊比利亚的教会只对伊比利亚负责。这既是宣告，也是赌注——从今往后，审判庭再无可退之处。"
 IBR_aftermath_mended: "余波渐息"
 IBR_aftermath_mended_desc: "一座座灯塔重新亮起，航道重新标定，荒田重新翻耕。大静谧的余波仍在，但伊比利亚已经学会了在余波中站稳。"
 IBR_beacon_network: "灯塔长明"
 IBR_beacon_network_desc: "从上加泰罗尼亚到特拉法尔加角，灯塔的光链重新环抱海岸。黑夜仍在，但伊比利亚的黑夜里，从此有了人间的灯火。"
 IBR_church_crushed: "教患已绝"
 IBR_church_crushed_desc: "深海教会的祭坛被一一捣毁，经卷在广场上烧成灰烬。人们说，海风里再没有那句熟悉的低语——至少，现在没有了。"
 IBR_purge_scholar_drain: "学者流失"
 IBR_purge_scholar_drain_desc: "肃清的浪潮波及无辜：归国的阿戈尔学者或被驱逐，或被吓走。他们的行李箱里装着未讲完的课与未完成的图纸——伊比利亚的明天，随他们一起上了船。"
 IBR_reform_unrest: "改革阵痛"
 IBR_reform_unrest_desc: "禁令解除了，被压抑了半个世纪的诉求、怨恨与狂热同时涌上街头。改革阵痛是新生必经的分娩——至少改革派如此安慰自己。"
 IBR_lighthouse_works: "灯塔修复工程"
 IBR_lighthouse_works_desc: "修复工程消耗着宝贵的物资与人力：石料、透镜、燃油与工匠的工钱。灯火亮起之前，国库先暗了下去。"
 IBR_golden_age_1: "黄金时代终将归来 Ⅰ"
 IBR_golden_age_1_desc: "复苏的星火已然点起：商路重新呼吸，学者踏浪而归。归乡人带来的一句话正在街头巷尾流传——黄金时代，终将归来。"
 IBR_golden_age_2: "黄金时代终将归来 Ⅱ"
 IBR_golden_age_2_desc: "排盐渠里淌回了活水，朗姆酒的香气重新飘满港口，铸币厂的锤声昼夜不息。废墟上的每一盏灯火，都在为同一个誓言作证。"
 IBR_golden_age_3: "黄金时代终将归来 Ⅲ"
 IBR_golden_age_3_desc: "工程队的桩机碾过盐滩，军工厂的烟囱刺破海雾。伊比利亚人重新学会了骄傲——不是黄金时代给予的骄傲，而是亲手把它夺回来的骄傲。"
 IBR_golden_age_4: "黄金时代终将归来 Ⅳ"
 IBR_golden_age_4_desc: "“给还没有沉没的国家。”布雷奥甘在图纸末页写道。如今这个国家站了起来：田野、工厂、港口与学堂都在说同一句话——黄金时代没有离去，它只是在等我们抬头。"
 IBR_inquisition_fire_1: "审判之火重燃 Ⅰ"
 IBR_inquisition_fire_1_desc:0 "审判庭的烛台重新点亮。悔罪者放下经卷，重新握住剑柄——火还很小，但已经烧起来了。"
 IBR_inquisition_fire_2: "审判之火重燃 Ⅱ"
 IBR_inquisition_fire_2_desc:0 "军法官进驻各团。迟疑者受鞭，怯战者受火——一支军队的纪律，就是这样烧出来的。"
 IBR_inquisition_fire_3: "审判之火重燃 Ⅲ"
 IBR_inquisition_fire_3_desc:0 "至高剑术学院重新开课。老审判官把六十年前的剑谱摊在桌上，一个动作一个动作地喂给新兵。"
 IBR_inquisition_fire_4: "审判之火重燃 Ⅳ"
 IBR_inquisition_fire_4_desc:0 "火已燎原。惩戒军不再是一群持剑的修士，而是一台上好了油的战争机器——审判庭只欠它一个方向。"
 IBR_deep_fleet_1: "大深海舰队 Ⅰ"
 IBR_deep_fleet_1_desc:0 "锈帆先动起来再说。渔船、缉私艇、搁浅了二十年的炮舰——能浮的，全编进海岸警备队。"
 IBR_deep_fleet_2: "大深海舰队 Ⅱ"
 IBR_deep_fleet_2_desc:0 "旧海军的名册从教堂地窖里翻了出来，幸存的老水兵逐个应征归队。舰队头一回有了像样的军官团。"
 IBR_deep_fleet_3: "大深海舰队 Ⅲ"
 IBR_deep_fleet_3_desc:0 "重巡的炮闩上了油，炮塔铸件昼夜赶工。舰队开始敢出防波堤，在近海操练战列线。"
 IBR_deep_fleet_4: "大深海舰队 Ⅳ"
 IBR_deep_fleet_4_desc:0 "潜艇部队趁夜出港。海底向来是深海的领地——从今晚起，潜伏在海底的不再只有祂的东西。"
 IBR_deep_fleet_5: "大深海舰队 Ⅴ"
 IBR_deep_fleet_5_desc:0 "大舰队成军。战列舰的影子铺在防波堤外，灯塔的光链一路引到远海——五十年了，伊比利亚的海军头一次向外看海。"

#内阁与将领
 IBR_Lumen: "流明"
 IBR_Lumen_desc: "乔迪·方塔纳罗萨，格兰法洛礼拜堂的护工。他自称布雷奥甘的后人，怀里揣着一把来历不明的旧钥匙，从记事起就在擦拭灯塔的镜片，人们都叫他流明。当伊比利亚之眼重新亮起时，站在灯室里的正是他——一个不知道自己有多勇敢的普通人。"
 IBR_Lumen_second_in_command_desc: "让这个擦了半辈子镜片的护工站在圣徒身边听政，审判庭的长老们气得胡子发抖。但卡门圣徒说：灯塔点亮过一次的人，不会再怕黑夜。"
 IBR_Irene: "艾丽妮"
 IBR_Irene_desc: "前审判官，至高之术的好手。她曾以提灯与手炮为业，直到一次巡行审判让她看清了火刑柱下的无辜者。她交回了徽章，却没有交回职责——如今她以另一种方式守护这片土地。"
 IBR_Irene_political_advisor_desc: "艾丽妮的剑鞘里装着两样东西：一柄细剑，和一份她想亲手交给圣徒的《审务改革书》。"
 IBR_Matthias: "马提亚斯"
 IBR_Matthias_desc: "继任大审判官之位的老兵，达里奥的旧部。他的提灯比任何人的都沉——里面装的是达里奥战死那夜的火种。马提亚斯不苟言笑，信条只有一句：审判官的义务，是站在人民与深渊之间。"
 IBR_Matthias_army_chief_desc: "马提亚斯接掌全军政务后做的第一件事，是给每个连队配发提灯与磨刀石。他说：武器会生锈，意志也会。"
 IBR_Juana: "胡安娜"
 IBR_Juana_desc: "私掠船团的女主人，旧王室的私掠许可在她手里是活下去的本钱。大静谧让她失去了船队的大部分兄弟，却没能让她的刀生锈。如今她在旧港招募亡命之徒，等待风向改变的那一天。"
 IBR_Juana_navy_chief_desc: "让海盗统领重建伊比利亚的舰队，听起来像个笑话。但胡安娜说：笑话总比沉船强——至少她知道每一片海域的暗礁在哪里。"
 IBR_Vega: "维加"
 IBR_Vega_desc: "灯塔信号观测长，伊比利亚之眼重启后的第一代信号官。他和他的学徒们守着一台老式信号机，把风暴、船讯与海鸣编成旗语，传向每一座还在运转的瞭望塔。"
 IBR_Vega_air_chief_desc: "维加没见过几架飞机，但他见过的风暴比任何飞行员都多。他说：观测即先手——看不见的敌人，才是最危险的敌人。"
 IBR_Mendoza: "罗德里戈·门多萨"
 IBR_Mendoza_desc: "旧王室的边防军宿将，如今已年过花甲。大静谧后他既未追随审判庭，也未落草为寇，而是带着残部在山口设卡护商，被人们称作“收税最公道的强盗”。佩尔多尼的政客们都需要这位老人，因为只有他还记得大伊比利亚军队操典的全文。"
 IBR_Mendoza_high_command_desc: "门多萨把落满灰尘的旧操典搬进了统帅部。他说：军队可以换代，但脊梁不能弯。"
 IBR_Thorns: "棘刺"
 IBR_Thorns_desc: "盐风城出身的剑术奇才，至高之术的当代翘楚。他在海外游历多年后回到故土，腰间的细剑依然锋利如初。有人问他为何归来，他说：剑术的根在这里，人也一样。"
 IBR_Obregon: "奥夫雷贡"
 IBR_Obregon_desc: "海岸大阵的统帅，惩戒军中资历最老的军官之一。他守了半辈子海岸线，背上的伤疤像一张地图——每一道都是海嗣留下的。他常说：海不会原谅我们，我们也不该原谅海。"
 IBR_Francisca_Luna: "弗朗西斯卡·卢娜"
 IBR_Francisca_Luna_desc: "盐风城的救济修女，在贫民窟里开粥棚、办识字班。审判庭的档案里她有两份记录：一份写着“慈善模范”，另一份写着“包庇信徒，着即查办”。两份都是真的。"
 IBR_Francisca_Luna_political_advisor_desc: "弗朗西斯卡修女的粥棚救济过落难的审判官，也救济过走投无路的邪教徒。她说：锅里见真章——怜悯不问出身。"

#特质
 IBR_eternal_saint: "不朽的圣徒"
 IBR_exiled_king: "归国的僭主"
 IBR_constitutional_reformer: "立宪的先驱"
 IBR_sword_party_banner: "长剑党的旗手"
 IBR_lantern_keeper: "灯塔的守夜人"
 IBR_voice_of_mercy: "慈悲的执裁官"
 IBR_iron_inquisitor_chief: "铁腕的大审判官"
 IBR_corsair_queen: "私掠船团的女主人"
 IBR_beacon_observer: "灯塔信号观测长"
 IBR_old_crown_veteran: "旧王室的宿将"
 IBR_supreme_sword: "至高之术的剑客"
 IBR_supreme_sword_desc: "此人精研至高之术，出剑如算学般精确。"
 IBR_inquisitor_training: "审判官的淬炼"
 IBR_inquisitor_training_desc: "提灯、长剑与手炮，审判官的训练从未松懈。"
 IBR_lantern_watcher: "提灯的守望"
 IBR_lantern_watcher_desc: "在无光的夜里，此人仍能洞察敌踪。"

#国策
 IBR_crossroads: "大静谧后的十字路口"
 IBR_crossroads_desc: "五十年的沉沦之后，伊比利亚又一次站在了十字路口：是继续在忏悔中自我囚禁，还是抬起头，重新面对海洋？"
 IBR_salt_land_reclamation: "盐碱地的治理"
 IBR_salt_land_reclamation_desc: "排盐渠、防波堤与耐盐作物——治理盐碱地的工程浩大得令人绝望，但每一亩重新长出庄稼的田地，都在为伊比利亚续命。"
 IBR_rebuild_fishing_ports: "盐港渔火"
 IBR_rebuild_fishing_ports_desc: "渔港是海岸城市的命脉。重立的吊架、补网的妇女与重新出港的渔船，让咸腥的海风里终于有了人间烟火气。"
 IBR_doblon_credit: "恢复多布隆信用"
 IBR_doblon_credit_desc: "金币比经文更能安抚人心。当商贩们重新愿意接受多布隆而非一袋盐时，伊比利亚的经济才真正开始呼吸。"
 IBR_rum_industry: "重启朗姆酒产业"
 IBR_rum_industry_desc: "朗姆酒是伊比利亚水手的血液，也是硬通货。酒坊的炉火重燃，商路随之延伸——酒桶滚过跳板的声音，就是这个国家复苏的心跳。"
 IBR_agri_scholars: "召回农业学者"
 IBR_agri_scholars_desc: "流亡海外的农学家们带着耐盐作物种子与轮作笔记归来。他们在试验田里弯腰的背影，比任何布道都更像祈祷。"
 IBR_victoria_trade: "与维多利亚通商"
 IBR_victoria_trade_desc: "维多利亚的商船再度驶入伊比利亚港口。船长们嘴上抱怨着这片海域的流言，货舱里却装满了这个国家最需要的一切。"
 IBR_harvest_of_revival: "麦浪重回伊比利亚"
 IBR_harvest_of_revival_desc: "第一场真正的丰收庆典在半个世纪后重回大地。人们把新麦做成饼，分给每一个到场的人——包括仇人。这一天，伊比利亚允许自己哭了。"
 IBR_inland_survey: "勘探内陆资源"
 IBR_inland_survey_desc: "勘探队深入久无人烟的内陆，在废弃矿井与干涸河床之间寻找着钢铁、铝土与一条被遗忘的赤金矿脉。"
 IBR_originium_refinery: "重建源石精炼厂"
 IBR_originium_refinery_desc: "源石是这个时代的血液，而伊比利亚早已忘记如何提炼它。当第一座精炼厂的烟囱冒烟时，附近村庄连夜搬走了三分之一的人——恐惧和就业机会一起到来。"
 IBR_sargon_engineers: "引进萨尔贡工程队"
 IBR_sargon_engineers_desc: "重金聘来的萨尔贡工程队用三个月干完了本地匠人三年的活。工地上流传着他们的谚语：“石头不会说谎，量它，切它。”"
 IBR_salt_ship_mass_production: "盐船步行机量产"
 IBR_salt_ship_mass_production_desc: "风帆步行机的生产线轰鸣起来。这种笨拙而可靠的巨兽迈过盐滩与废墟，把伊比利亚的疆土重新缝合在一起。"
 IBR_military_industrial_draft: "军工复合体草案"
 IBR_military_industrial_draft_desc: "一纸《军工复合体草案》让矿主、工坊主与军需官坐在了同一张桌前。有人称之为复兴的引擎，有人称之为吞噬国库的怪物——它两者都是。"
 IBR_energy_independence: "能源独立计划"
 IBR_energy_independence_desc: "精炼厂群拔地而起，燃料与电力第一次不必仰赖进口。工程师们说：灯塔要长明，国家要长亮——靠别人点灯的国家，永远活在黑暗里。"
 IBR_will_of_the_saint: "圣徒的意志"
 IBR_will_of_the_saint_desc: "圣徒卡门的意志就是审判庭的意志，审判庭的意志就是伊比利亚的意志。五十年了，这套逻辑第一次遭到公开的质疑——而质疑者的名字，往往出现在次日的忏悔名单上。"
 IBR_shadow_of_castile: "卡斯蒂利亚的阴影"
 IBR_shadow_of_castile_desc: "情报官呈上密报：一位自称卡洛斯九世的流亡贵族已经潜回国内。无论王室是否值得同情，阴影本身已足以撼动审判庭的正统性。"
 IBR_fortify_faith_border: "巩固信仰边界"
 IBR_fortify_faith_border_desc: "边检、告解、巡查——审判庭把国境线变成了一道信仰的滤网。能过滤掉深渊的信使，也能过滤掉远方的书、技术与思想。"
 IBR_purify_heretics: "净化异端"
 IBR_purify_heretics_desc: "审判庭的巡行审判官开赴南方三镇。他们的提灯照过每一间礼拜堂的地下室——火刑柱已经立起，只等名单公布。"
 IBR_inquisition_army_authority: "强化惩戒军权威"
 IBR_inquisition_army_authority_desc: "惩戒军接管了边防、缉私与治安的全部权柄。将军们发现：当审判庭需要一把剑时，它终于肯给剑足够的粮食了。"
 IBR_sever_laterano: "断绝与拉特兰的联系"
 IBR_sever_laterano_desc: "审判庭颁布《独立敕令》：伊比利亚教会与拉特兰母会自此断绝一切共融。仪式上，圣徒卡门亲手折断了母会颁授的牧杖——五十年积怨，一折两断。"
 IBR_holy_arsenal: "圣座武库"
 IBR_holy_arsenal_desc: "以圣座之名，武库向所有工坊敞开订单。细剑、板甲、手炮昼夜不停——长老们说这是圣战的家底，工匠们说这不过是活计。"
 IBR_eternal_lighthouse: "永恒灯塔"
 IBR_eternal_lighthouse_desc: "圣徒卡门在圣座上加冕：政教合一，提灯即王权。他没有发表长篇演说，只说了一句话：“伊比利亚不欠任何神明，从今往后，神明服务伊比利亚。”"
 IBR_crown_carlos: "拥立卡洛斯九世"
 IBR_crown_carlos_desc: "与其让王位悬在头顶，不如亲手把它交给自己选中的人。卡洛斯九世将在保皇派与部分审判官的簇拥下加冕——代价由别人来付。"
 IBR_carmen_reform_declaration: "卡门的改革宣言"
 IBR_carmen_reform_declaration_desc: "圣徒卡门在万人面前宣读了《改革宣言》：审判庭将自省、自新、向世界重新打开大门。广场上死一般寂静——五十年了，这座灯塔第一次承认自己迷过航。"
 IBR_abolish_islander_laws: "废除岛民法令"
 IBR_abolish_islander_laws_desc: "针对阿戈尔“岛民”的驱逐令、禁业令与特别税被逐一废除。旧法令的羊皮纸在广场上烧了三天三夜，火光映着一些人的笑脸，和另一些人的铁青面孔。"
 IBR_invite_overseas_scholars: "邀请海外学者归国"
 IBR_invite_overseas_scholars_desc: "一纸邀约飞向海外的流亡学者：归来吧，故乡需要你们的学问。学堂重开，藏书重编——被打断的课堂，在这一代重新接上了。"
 IBR_religious_tolerance: "宗教宽容法案"
 IBR_religious_tolerance_desc: "《信仰宽容法案》草案在佩尔多尼公布：凡不效忠深海者，信仰皆受保护。审判庭的强硬派称这是“向异端递刀”，改革派称这是“把刀从自己脖子上挪开”。"
 IBR_laterano_reconciliation: "与拉特兰和解"
 IBR_laterano_reconciliation_desc: "拉特兰的特使带来了母会的信函：共融可以恢复，条件必须商谈。五十年冰封的教门，终于被敲开了一条缝。"
 IBR_royal_ties: "旧日的联姻"
 IBR_royal_ties_desc: "无论王座上坐着国王还是议会，伊比利亚都需要朋友。拉特兰的圣座与维多利亚的宫廷，都还记得这位昔日邻人的姓氏。"
 IBR_new_iberia_declaration: "新伊比利亚宣言"
 IBR_new_iberia_declaration_desc: "当第一轮投票的结果被宣读时，广场安静得能听见风。没有圣徒的祝祷，没有国王的赦令——只有一张张选票，和墨水在纸上洇开的痕迹。伊比利亚两千年来第一次，试着不用下跪说话。"
 IBR_supreme_fencing_academy: "至高剑术学院"
 IBR_supreme_fencing_academy_desc: "第一所公开招生的剑术学院在格兰法洛成立。几何、算学与剑术同堂讲授——学院门口的铭牌上写着：至高之术，源于思考。"
 IBR_inquisitor_selection: "审判官选拔制度"
 IBR_inquisitor_selection_desc: "审判官的选拔不再限于教士子弟：武举开科，剑术、骑术、算学与律法皆为考目。落第的书生与猎户之子，第一次穿上了同一身白甲。"
 IBR_grand_formation_reform: "大阵制度改革"
 IBR_grand_formation_reform_desc: "三千人为一阵，长盾如墙，细剑如林。新的操典将惩戒军的传统编制重铸为海岸上的钢铁堤坝。"
 IBR_lantern_staff_research: "提灯法杖研发"
 IBR_lantern_staff_research_desc: "提灯法杖的改良型号列装部队：法杖与手炮合一，灯火即准星。长老们惊恐于“以术代祷”，士兵们只想知道它能不能烧穿海嗣的皮。"
 IBR_holy_sword_order: "组建圣剑骑士团"
 IBR_holy_sword_order_desc: "从全军选拔的剑术好手组成的圣剑骑士团在圣座前宣誓。他们的白甲上没有纹章，只有一盏提灯——骑士团团长说：我们的纹章，是黎明。"
 IBR_sword_masters_legacy: "剑术大师的传承"
 IBR_sword_masters_legacy_desc: "剑术大会、道场与学堂——至高之术将走出审判庭的深院，回到它诞生的地方。"
 IBR_guardians_of_the_dawn: "黎明的守誓者"
 IBR_guardians_of_the_dawn_desc: "“灯塔不灭，吾剑不折。”当誓词在军营中传开，连最愤世的老兵都在晨光里握紧了剑柄。这不是一句口号——在南方海岸的每一个凌晨，都有人在用生命兑现它。"
 IBR_rebuild_defense_army: "重建国防军编制"
 IBR_rebuild_defense_army_desc: "流寇、残部与各地戍卫队将被重新编入惩戒军的连队。奥夫雷贡将军在点卯册上落下第一个签名。"
 IBR_hand_cannon_license: "手炮量产许可"
 IBR_hand_cannon_license_desc: "审判庭的老匠人拆开了一支封存的手炮，图纸在灯下铺开。仿制拉特兰铳械的禁令仍在——但提灯法杖的“改进”，不在此列。"
 IBR_penitent_expansion: "惩戒军扩编法案"
 IBR_penitent_expansion_desc: "《扩编法案》在审判庭全票通过：连队翻倍，粮饷加倍，征兵年龄下调两岁。年轻人排起了长队——不为信仰，只为那口当兵的粮。"
 IBR_salt_mechanized_brigade: "盐船机械化旅"
 IBR_salt_mechanized_brigade_desc: "盐碱荒漠上，巨大的风力步行机列队启程。它们缓慢、笨重，却是废墟之间最可靠的长腿。"
 IBR_coastal_defense_system: "海岸防御体系"
 IBR_coastal_defense_system_desc: "烽燧、望楼、警钟与演练。戍卫队的年轻人将在老渔民的带领下，学会在第一声海鸣中守住阵线。"
 IBR_levy_en_masse: "全民皆兵法令"
 IBR_levy_en_masse_desc: "敕令下达：全民受训，全民持械，全民为战。伊比利亚没有一寸土地可以退让，也就没有一个人可以置身事外。"
 IBR_salvage_ships: "锈帆重整"
 IBR_salvage_ships_desc: "特纳里夫的旧港里，还趴着几艘大静谧之夜的幸存舰。工人们抽干舱水、更换龙骨，让它们带着满身伤疤重新浮起来——像这个国家一样。"
 IBR_rebuild_shipyards: "重建造船厂"
 IBR_rebuild_shipyards_desc: "船台的桩基重新打入海底淤泥。老匠人抚摸着新伐的龙骨木说：船和人一样，得先有骨头，才谈得上魂。"
 IBR_corsair_decree: "私掠许可法令"
 IBR_corsair_decree_desc: "胡安娜的船队停泊在无人管辖的旧锚地，桅杆上既没有王旗也没有提灯。海军部的特使带来了一纸特许状：劫掠敌国商船，分赃朝廷三成。海盗女主人掂了掂那份羊皮纸，笑了：“先付定金。”"
 IBR_restore_lighthouse_network: "恢复灯塔网络"
 IBR_restore_lighthouse_network_desc: "伊比利亚之眼只是开始。沿着海岸线，一座座熄灭的灯塔将被逐一唤醒，如同在黑夜里重新缝起一串纽扣。"
 IBR_grand_fleet_concept: "重返大洋的蓝图"
 IBR_grand_fleet_concept_desc: "海军部的绘图桌上铺开了野心：不是几艘巡逻艇，而是一支足以重开航路、护卫商船、猎杀深渊的大舰队。图纸上的每一根线条，都在向黄金时代的幽灵致意。"
 IBR_naval_storm_academy: "风暴海校"
 IBR_naval_storm_academy_desc: "在特纳里夫的风暴里建一所海校，听起来是疯了。但胡安娜说：没见过风暴的军官，配不上伊比利亚的海。"
 IBR_golden_fleet_sails: "黄金舰队启航"
 IBR_golden_fleet_sails_desc: "新舰的桅杆挂满金色的旗。黄金舰队不会归来——但它的继任者，正鸣着汽笛驶向深海。老人们在码头上说：看，它们回来了。孩子们说：不，它们是第一次去。"
 IBR_lost_blueprints: "寻找失落的图纸"
 IBR_lost_blueprints_desc: "布雷奥甘——那位设计了愚人号与半座黄金时代的传奇设计师，他的工坊图纸据说还藏在某座沉没的灯塔档案库里。打捞队与学者们带着手铲和祷词，出发了。"
 IBR_recall_shipwrights: "召回流亡造船师"
 IBR_recall_shipwrights_desc: "流亡的阿戈尔造船师们带着深海的压力工学与流线设计归来。老匠人起初拒绝与他们同席，直到看见那些图纸——然后沉默地让出了主位。"
 IBR_abyss_beacon: "深渊信标"
 IBR_abyss_beacon_desc: "在特纳里夫与菲尼斯特雷角架起声呐阵列，倾听深渊。六十年来，有一道巨大的轮廓始终在南方的海图之外徘徊——渔民叫它幽灵船，海军部叫它斯图提斐拉号。"
 IBR_stultifera_sighted: "愚人号在望"
 IBR_stultifera_sighted_desc: "声呐锁定了那艘船：它比任何海图记载的都要巨大，船身覆满溟痕，灯火却依然亮着。海军部将扩建特纳里夫军港——因为伊比利亚即将迎回它的传说。"
 IBR_boarding_expedition: "登舰远征"
 IBR_boarding_expedition_desc: "审判官、惩戒军与阿戈尔向导组成的登舰队即将跨帮而上。他们的任务只有三条：查明船员的下落，评估船体的状态，以及——把愚人号带回家。"
 IBR_breogan_legacy: "布雷奥甘的遗产"
 IBR_breogan_legacy_desc: "布雷奥甘的钥匙打开了核心舱室：源石炉、耐压船壳、以及那份足以改写伊比利亚历史的档案。科学院的老学究捧着图纸老泪纵横——黄金时代没有死去，它只是漂泊在外。"
 IBR_stultifera_relance: "愚人号·再航"
 IBR_stultifera_relance_desc: "是让愚人号重新升帆，还是让它带着秘密安息？这个决定将定义伊比利亚的下一个五十年。"
 IBR_underwater_tech: "水下城市技术解析"
 IBR_underwater_tech_desc: "从愚人号残骸与水下城市遗迹中解析出的耐压结构学，让伊比利亚的工程师们第一次看懂了“潜水”两个字该怎么写。"
 IBR_energy_system_rebuild: "能源系统重构"
 IBR_energy_system_rebuild_desc: "解析水下城市的供能回路后，工程师们重建了灯塔的能源核心。同一套技术搬进军舰，续航陡然倍增——深渊曾经拿走的东西，正在被一点点拿回来。"
 IBR_amphibious_design: "两栖突击舰设计"
 IBR_amphibious_design_desc: "能从浪里直接冲上滩头的战舰，配上能从水里爬上岸的战士——阿戈尔设计师称之为“回归”，惩戒军称之为“登陆”。"
 IBR_deep_sea_fleet: "深海舰队成军"
 IBR_deep_sea_fleet_desc: "“它们猎了我们五十年。”深海舰队司令在出航仪式上说，“现在，轮到我们了。”"

#国策树名与新增节点
 IBR_torch_of_iberia: "南疆火炬"
 IBR_axis_recovery: "复苏的意志"
 IBR_axis_recovery_desc: "国策树四条轴之一：经济。先让活人吃饱，再谈让死者安息——盐碱、渔港、铸币与麦田，这是伊比利亚唯一能算清的账。"
 IBR_axis_soul: "灵魂的裁决"
 IBR_axis_soul_desc: "国策树四条轴之一：政治。祭坛与海关，究竟谁该坐在王位边上？这条轴上的两条路线彼此不容——选了哪一边，另一边就再也不会假装没有看见你。"
 IBR_axis_soul_tt: "本轴分出「审判庭的守护」与「国门的敞开」两条路线，二者互斥，只能择其一。"
 IBR_axis_army: "剑与盾"
 IBR_axis_army_desc: "国策树四条轴之一：陆军。是磨出少数足以传世的剑，还是举起漫山遍野的盾？惩戒军的军饷只够回答一次。"
 IBR_axis_sea: "面向深海"
 IBR_axis_sea_desc: "国策树四条轴之一：海权。五十年来伊比利亚把海洋当作一扇必须关死的门；从今天起，它要学着把海洋当作一条可以走的路。"
 IBR_axis_sea_tt: "本轴的「传统舰队复兴」与「阿戈尔科技引航」两条路线互不冲突，可以全部走完。"
 IBR_steel_concessions: "钢铁特许状"
 IBR_steel_concessions_desc: "把内陆铁矿拆成一份份特许状卖给本地商人，王室不必再掏一分钱，矿井却在两年之内立了起来。萨尔贡人管这叫风险，伊比利亚人管这叫赎罪券。"
 IBR_carlist_pact: "王党密约"
 IBR_carlist_pact_desc: "王子被驱逐，不等于血脉断绝。几座港口、两所修院、若干艘夜航的小船——王党在伊比利亚从未消失，只是学会了低声说话。"
 IBR_carlist_pact_tt: "王党网络将一位流亡的王子秘密送回伊比利亚：拥立之路自此确定可达，不再取决于宫廷那一夜的抉择。"
 IBR_constitution_draft: "宪法草案"
 IBR_constitution_draft_desc: "起草一份把王权、教权与市政权统统关进同一间屋子的文件。光是起草本身就是一种胜利：从此以后，任何一方的暴力都得先找一个法条当借口。"
 IBR_free_press: "自由报章"
 IBR_free_press_desc: "报禁一开，忏悔名单就不再是秘密。审判庭的铁幕从来不是靠信仰支撑的，它靠的是没有人敢把话说完。"
 IBR_levy_reform: "义务兵役登记"
 IBR_levy_reform_desc: "每座灯塔下立一块石碑，刻着本区每一名适龄男丁的名字——后来连女丁也刻了上去。伊比利亚第一次知道，自己究竟还能派出多少人。"
 IBR_levy_reform_tt: "解锁决议：「惩戒军征召」。即便未曾强化审判庭的权威，王国的征兵簿也已握在军方手中。"
 IBR_line_of_battle: "战列线思想"
 IBR_line_of_battle_desc: "把战舰排成一条长线，让全部舷侧对准敌人——这本在欧洲写了三百年的教科书，伊比利亚要用二十年补课补回来。"
 IBR_coinage_reform_unlock_tt: "解锁决议：「铸币改革」。"

#决议
 IBR_dawn_category: "伊比利亚的抉择"
 IBR_deep_category: "深渊回响"
 IBR_drainage_works: "排盐工程"
 IBR_drainage_works_desc: "组织民夫疏浚排盐渠、修整田垄。工程枯燥而漫长，但盐碱退一寸，麦苗就进一寸。"
 IBR_coinage_reform: "铸币改革"
 IBR_coinage_reform_desc: "重开铸币厂，以赤金储备为抵押重铸多布隆，恢复货币信用。"
 IBR_penitent_recruitment: "惩戒军征召"
 IBR_penitent_recruitment_desc: "以审判庭的名义征召新兵，补充惩戒军连队的缺额。"
 IBR_grand_formation_decree: "大阵编制令"
 IBR_grand_formation_decree_desc: "按新操典编组一支重装海岸大阵，驻守首都近郊。"
 IBR_militia_mobilization: "民兵动员"
 IBR_militia_mobilization_desc: "召集村镇青壮编练灯塔戍卫队，充实海岸警戒力量。"
 IBR_corsair_fleet: "私掠船团"
 IBR_corsair_fleet_desc: "签发新的私掠特许状，让胡安娜的船团为大伊比利亚的荣耀“创收”。"
 IBR_deep_hunt: "海嗣猎杀"
 IBR_deep_hunt_desc: "组织深海舰队对近海海嗣巢穴实施猎杀行动。这是狩猎，也是复仇。"
 IBR_restore_lighthouse: "灯塔网络：修复下一座灯塔"
 IBR_restore_lighthouse_desc: "投入政治威望与工业产能，沿南方海岸再点亮一座灯塔。当前已修复：[?IBR_lighthouse_restored|0] 座。每一次修复都会让“大静谧的余波”进一步消退——粮仓重新有了余粮，港口重新有了灯火。"
 IBR_total_purge: "审判庭决议：全面肃清"
 IBR_total_purge_desc: "倾审判庭之力清剿深海教会：焚毁经卷、拆毁祭坛、缉拿主教。深渊的信仰将在伊比利亚绝迹——代价是，那些愿意归国教书行医的阿戈尔学者，也将被视为同党，永远地离开这片海岸。"
 IBR_gentle_reform: "审判庭决议：温和改良"
 IBR_gentle_reform_desc: "解除对阿戈尔学问与拉特兰技艺的禁令，以疏导代替火刑。旧秩序的卫道士不会善罢甘休——未来半年，街头的抗议与教堂的钟声将昼夜不休。"
 IBR_cleanse_altars: "净化沿海祭坛"
 IBR_cleanse_altars_desc: "派遣审判官巡查海岸线，捣毁藏在礁石与渔村之间的秘祭。当前深渊威胁度：[?IBR_deep_threat|0]。威胁度超过 100 时，南方海岸将爆发恐鱼入侵。"
 IBR_fight_seaspawn: "围剿恐鱼"
 IBR_fight_seaspawn_desc: "惩戒军与戍卫队全线出击，将上陆的恐鱼赶回深海。围剿结束前，沿海各省将持续流血。"

#事件
 ibr.1.t: "盐风城的信使"
 ibr.1.d: "一名浑身湿透的骑手在深夜叩响了大审判官的门，带来了盐风城的信：集市上出现了印着螺旋纹样的护符，传教者在贫民窟里布道，孩子们哼着没人听过来源的童谣。审判庭的巡查在上个月“意外”失踪了两人。信的末尾只有一句：请给我们一个交代。"
 ibr.1.a: "派出审判官调查"
 ibr.1.b: "以祈祷回应"
 ibr.2.t: "审判官的证词"
 ibr.2.d: "乔装的审判官回来了，带回的证词触目惊心：深海教会在盐风城的地下经营着一整座礼拜堂，饥荒中的穷人排着队献上自己的“养子”——教士说，那是献给海洋的祝福。审判官跪在堂前请示：如何处置？"
 ibr.2.a: "火刑示众，昭告全国"
 ibr.2.b: "暗中渗透，顺藤摸瓜"
 ibr.3.t: "潜入深海教会"
 ibr.3.d: "经过数月的蛰伏，卧底的审判官传回了主教团的核心经卷。深海教会的网络第一次完整地暴露在烛光之下——虽然主教的宝座还空着，但经卷的每一页，都是将来审判的罪状。"
 ibr.3.a: "罪证在握"
 ibr.4.t: "卧底的挽歌"
 ibr.4.d: "他们没能等来接应的船。三日后，两具“海难者”的尸体被冲上海岸，手腕上系着审判庭的绳结。深海教会用这种沉默的方式告诉审判庭：深渊也在盯着你们。"
 ibr.4.a: "为殉职者鸣钟"
 ibr.10.t: "卡斯蒂利亚的王旗"
 ibr.10.d: "一艘不起眼的商船靠上了南方的小港，卸下的货物中混着一人：卡斯蒂利亚王朝的旁系贵族，自称卡洛斯九世。保皇派的老兵们早已等他多年，而审判庭的巡查网也早已注意到那面在夜里升起的、绣着王冠的旗。"
 ibr.10.a: "驱逐出境"
 ibr.10.b: "容留观望"
 ibr.12.t: "王政复辟"
 ibr.12.d: "圣歌与钟声里，卡洛斯九世在佩尔多尼加冕。老贵族们热泪盈眶，仿佛大静谧从未发生。而在人群的边缘，审判庭的提灯第一次没有照亮国王的脸——它转过了身。"
 ibr.12.a: "国王万岁"
 ibr.13.t: "议会的钟声"
 ibr.13.d: "当第一轮投票的结果被宣读时，广场安静得能听见风。没有圣徒的祝祷，没有国王的赦令——只有一张张选票，和墨水在纸上洇开的痕迹。伊比利亚两千年来第一次，试着不用下跪说话。"
 ibr.13.a: "议会万岁"
 ibr.14.t: "提灯圣座"
 ibr.14.d: "圣徒卡门在万众瞩目下坐上圣座，提灯的光辉加于王冠之上。他没有发表长篇演说，只说了一句话：“伊比利亚不欠任何神明，从今往后，神明服务伊比利亚。”"
 ibr.14.a: "圣座万岁"
 ibr.20.t: "盐风城的大火"
 ibr.20.d: "审判官的长矛挑开了礼拜堂的门，火把在黎明前点燃。信徒们的哭喊与教士的诵经声混在一起，直烧到正午。灰烬里，人们找到了大量海盐腌制的不明躯体。审判庭面前有两个选择：把火烧得更大，或是把灰烬数清楚。"
 ibr.20.a: "连坐整肃，以儆效尤"
 ibr.20.b: "只诛首恶，安抚余众"
 ibr.25.t: "格兰法洛剑术大会"
 ibr.25.d: "五年一度的剑术大会在格兰法洛灯塔下重开。各村剑客尽携珍藏的细剑赴会，连审判官也与平民同台比试。至高之术的各派传人云集于此——有人为了荣耀，有人为了重振门楣，也有人，只是想证明剑还在。"
 ibr.25.a: "御驾亲临，比试一场"
 ibr.25.b: "观礼授勋"
 ibr.30.t: "伊比利亚之眼重燃"
 ibr.30.d: "燃料注入，镜阵校准，年轻护工的手在灯室的控制杆上停了很久——他叫流明，格兰法洛礼拜堂的护工。然后，他推下了手柄。光。五十年来的第一束灯光刺破黑夜，照亮了灯塔下黑压压的人群。有人跪下，有人唱歌，有人只是仰着头，任由泪水流进胡子里。而在灯室最深处，布雷奥甘留下的机关仍在缓缓转动——他们不知道，这不仅仅是一座灯塔，更是一口连通伊比利亚的话筒。"
 ibr.30.a: "让光芒照耀整个伊比利亚"
 ibr.35.t: "岛民的归舟"
 ibr.35.d: "第一批应召归国的阿戈尔学者在特纳里夫港靠岸。他们带着图纸、仪器与半个世纪未曾磨灭的乡音，也带着警惕——码头上审判庭的巡行审判官按着剑柄，人群的注视里有愧疚，也有敌意。最先走下跳板的白发工程师望了望灯塔，只说了一句：“灯，比我们走的时候暗了。”"
 ibr.35.a: "授予公民权，以诚相待"
 ibr.35.b: "有限居留，严密监视"
 ibr.40.t: "愚人号的残骸"
 ibr.40.d: "声呐阵列在深渊边缘捕捉到了异常：一个长达数百米的移动回波，正以恒定的航速环绕南方法域巡游——六十年了，它的航线从未改变。回波图谱上还叠着几个更小的信号，围绕巨影缓慢盘旋，如同信使。老水手们听到结果后只说了一句话：“那是愚人号。她还在等我们。”"
 ibr.40.a: "继续打捞，保持警惕"
 ibr.45.t: "私掠特许状"
 ibr.45.d: "胡安娜的船队停泊在无人管辖的旧锚地，桅杆上既没有王旗也没有提灯。海军部的特使带来了一纸特许状：劫掠敌国商船，分赃朝廷三成。海盗女主人掂了掂那份羊皮纸，笑了：“先付定金。”"
 ibr.45.a: "颁布私掠特许状"
 ibr.45.b: "拒绝与海盗合流"
 ibr.50.t: "深渊的呼唤"
 ibr.50.d: "南方三镇的告急文书同夜抵达佩尔多尼：数百人在同一个夜晚做了同一个梦，梦见海面下有一只缓缓睁开的眼睛。翌日，梦醒的人们中有人失声，有人失踪，还有人在沙滩上用海藻摆出了螺旋的图腾。深海教会的经卷里，将这称为“召唤的第一夜”。"
 ibr.50.a: "全面肃清，不惜代价"
 ibr.50.b: "安抚观望，静观其变"
 ibr.60.t: "海嗣上陆"
 ibr.60.d: "凌晨，南方海岸的烽燧燃起了五十年未见的警火。潮水退去后的滩涂上，留下大片不属于任何已知生物的拖痕，戍卫队与“它们”交了火——据幸存者描述，那些东西“比夜里更黑，比冬天更冷”。哨兵在阵亡前的最后一句话是：不要去看它们的眼睛。"
 ibr.60.a: "全体迎击，寸土不让"
 ibr.60.b: "弃守滩头，坚壁清野"
 ibr.70.t: "维多利亚商船到来"
 ibr.70.d: "维多利亚的远洋商船在特纳里夫港卸下了成箱的机械、布匹与种子，也卸下了成捆的契约。商务代表微笑着递上账单：货物可以赊，利息要算清。港口官员请示：这笔账，怎么记？"
 ibr.70.a: "接纳商约，互通有无"
 ibr.70.b: "征收重税，以补国库"
 ibr.71.t: "萨尔贡劳工争议"
 ibr.71.d: "萨尔贡工程队的效率有目共睹，但争议也随之而来：本地匠人抗议“异邦人抢走饭碗”，行会向审判庭递交了联名状；而工程队领队则抱怨工钱拖欠、宵禁严苛，扬言要带着桩机走人。"
 ibr.71.a: "严加管束，工程为先"
 ibr.71.b: "怀柔安抚，补发工钱"
 ibr.72.t: "宗教裁判"
 ibr.72.d: "《信仰边界敕令》颁布后，各地审判官开始逐一排查礼拜堂、学堂与市集。名单越来越长——长到审查官自己都开始犹豫：这里面，有多少是真的深渊信徒，又有多少只是告密者的私怨？"
 ibr.72.a: "大规模审判，绝不姑息"
 ibr.72.b: "张榜警告，以观后效"
 ibr.73.t: "圣徒的抉择"
 ibr.73.d: "改革派的重臣跪请圣徒卡门当众支持《改革宣言》，以圣徒之名为新政背书；而长老们则警告：圣徒一旦开金口，就再没有回头的余地。卡门沉默地望向窗外——窗外，是伊比利亚的黎明，或者黄昏。"
 ibr.73.a: "公开支持改革"
 ibr.73.b: "保持沉默"
 ibr.74.t: "教宗特使访问"
 ibr.74.d: "拉特兰教宗特使的车队驶入佩尔多尼，带来了母会的橄榄枝与一份厚厚的和解条款。特使在晚宴上举杯：“愿圣光重新照在两座圣堂之间。”而审判庭的长老们在幕后交头接耳：这条枝，接还是不接？"
 ibr.74.a: "恢复共融，重续旧谊"
 ibr.74.b: "礼貌送客，再议后决"
 ibr.75.t: "拉特兰的抗议"
 ibr.75.d: "拉特兰的公函送抵佩尔多尼：伊比利亚“自行改进”的铳械涉嫌仿制圣座专利制式，要求即刻停止生产并销毁图纸。信使还捎来了口信——据说圣座对此“深感遗憾，但充分理解贵国的处境”。"
 ibr.75.a: "照产不误"
 ibr.75.b: "转入地下"
 ibr.76.t: "黄金舰队下水"
 ibr.76.d: "特纳里夫船台，新舰的龙骨在礼炮声中滑入海面。老水手们说，他们听见了黄金时代回来的脚步声；工程师们说，那是船底刮过滑道的正常声响。舰长们在登舰名单前驻足——旗舰的名字，最终定为“黎明”。"
 ibr.76.a: "举行下水典礼"
 ibr.76.b: "秘密下水"
 ibr.77.t: "布雷奥甘的工坊"
 ibr.77.d: "沉没灯塔的档案库里，打捞队找到了传说中布雷奥甘的私人工坊：防水暗格里的图纸依然清晰，图纸上是一种前所未见的船体曲线，边缘的批注写着——“给还没有沉没的国家”。"
 ibr.77.a: "深入探索，满载而归"
 ibr.77.b: "封存现场，从长计议"
 ibr.78.t: "向深海进发"
 ibr.78.d: "新锐潜艇在夜色中离港，舷侧涂着审判庭的提灯纹章。出航仪式上，司令官的训词只有一句话：“五十年来，深渊以为只有它在看着我们。告诉它——我们也在看着它。”"
 ibr.78.a: "启航，向深渊进发"
 ibr.78.b: "待风，再练一程"
 ibr.80.t: "恐鱼入侵"
 ibr.80.d: "警火在南方海岸线上连成一线。潮水退去的滩涂上，成群的“恐鱼”正拖着湿亮的躯体向内陆爬行——它们比任何目击者描述的都多，也更饥饿。烽燧手嘶哑的警报沿着海岸传递：这不是一次搁浅，这是一场入侵。"
 ibr.80.a: "全体迎击，驱其回海"
 ibr.80.b: "封锁海岸，坚壁清野"
 ibr.81.t: "沿海的怪谈"
 ibr.81.d: "南方的渔村接连传来怪谈：有人在退潮的滩涂上捡到会蠕动的东西，有人在半夜听见海面下传来歌声，还有孩子说，他在窗外的雨里看见了一张没有眼睛的脸。老人们开始往门槛上撒盐。"
 ibr.81.a: "派人调查"
 ibr.81.b: "置之不理"
 ibr.90.t: "深渊中的轮廓"
 ibr.90.d: "声呐室里的军官彻夜未眠：那个六十年来在南方法域游弋的巨大轮廓，第一次转向了——正对着伊比利亚之眼的方向。随行的老造船师颤声念出了它的船名：斯图提斐拉号。愚人号。它还在航行。它回来了。"
 ibr.90.a: "悬挂提灯旗，舰队接近"
 ibr.90.b: "请乔迪与造船师以阿戈尔古礼呼叫"
 ibr.91.t: "六十年不沉的船"
 ibr.91.d: "它比海图上的任何船只都大，船身覆满惨白的溟痕，桅杆上的灯火却依然亮着。跨帮的登舰队踏上甲板——没有卫兵，没有船员，没有回答。只有海风穿过空荡的黄金回廊，和远处隐约的、钢琴的声音。"
 ibr.91.a: "强行突入，控制全船"
 ibr.91.b: "以审判庭礼制高声宣名"
 ibr.92.t: "船上的弥撒"
 ibr.92.d: "走廊尽头的礼拜堂里，烛火通明。一位白发老人背对众人立于圣坛前——船长阿方索，六十年前随船失踪的旧伊比利亚海军上校。他身后的长椅上坐满了船员：或者说，曾经是船员的东西。他缓缓转身：“不欢迎你们。这艘船上的人已经死绝了——旧伊比利亚人。”"
 ibr.92.a: "宣告火刑判令，拔剑"
 ibr.92.b: "收剑，倾听船长的独白"
 ibr.93.t: "沉舱里的真相"
 ibr.93.d: "布雷奥甘的档案舱里，铁盒中的图纸与航海日志记录着一切：黄金时代的伊比利亚舰队曾远征深海，以灯塔之光为矛，刺伤了海洋的神明。祂没有死，只是在哀鸣——大静谧不是天罚，而是那声哀鸣的余音；海嗣不是恶魔，而是海洋的免疫系统。而愚人号，是布雷奥甘留给“还没有沉没的国家”的最后答卷。"
 ibr.93.a: "将真相公之于众"
 ibr.93.b: "封存档案，永不开启"
 ibr.94.t: "恐鱼与溟痕"
 ibr.94.d: "登舰队的锤音惊醒了船腹中的东西：溟痕顺着走廊蔓延，恐鱼从舱门与通风管中涌出。登舰队被迫且战且退——要么死守船舱步步为营，要么炸断锚链任船随流漂向深海。"
 ibr.94.a: "焚烧溟痕，死守船舱"
 ibr.94.b: "炸断锚链，随流而去"
 ibr.95.t: "深海教会的圣船"
 ibr.95.d: "教堂的钟声从雾中传来——深海教会的船队包围了愚人号。白袍主教立于船首，向登舰队宣告：愚人号属于海洋，属于“父”。他们要来收回它，连同船上的一切。"
 ibr.95.a: "死战不退，寸舷不让"
 ibr.95.b: "弃舰焚舱，玉石俱焚"
 ibr.96.t: "修复，或安息"
 ibr.96.d: "布雷奥甘的钥匙打开了核心舱。造船师们的评估摆在桌上：船体七成完好，源石炉尚可修复——但需要倾举国之力的钢、金与人手。而在图纸的末页，是布雷奥甘的批注：“给还没有沉没的国家。”现在，抉择摆在了伊比利亚面前。"
 ibr.96.a: "倾举国之力，修复愚人号"
 ibr.96.b: "拆解研究，记录一切"
 ibr.97.t: "愚人号·再航"
 ibr.97.d: "汽笛长鸣。修复一新的愚人号在灯塔的光辉中缓缓离港，提灯旗与旧王室的金帆同时在桅顶飘扬。白发苍苍的乔迪站在舰桥上，握着那把钥匙——他说，叔叔要是看到这一幕，一定会笑话我们点了这么多灯。六十年了，愚人号终于可以不再是愚人号。"
 ibr.97.a: "愿它的航程永远向着黎明"
 ibr.98.t: "深渊安魂曲"
 ibr.98.d: "阀门开启，海水缓缓灌入船舱。船长阿方索拒绝离船——他说，船长的王座在甲板上。愚人号载着它的船长、它的秘密与六十年的漂泊，沉入海沟。登舰队在甲板上列队，向那盏最终熄灭的灯，敬了最后一个礼。"
 ibr.98.a: "安息吧，愚人号"

#新闻事件
 worldnews_ibr.1.t: "伊比利亚之眼重燃"
 worldnews_ibr.1.d: "在沉寂了半个世纪后，伊比利亚格兰法洛的巨型灯塔“伊比利亚之眼”昨夜重新亮起。光柱穿透浓雾与黑夜，数海里外的渔船得以返航。世界各地的人们从新闻影片中看到了那一幕：灯塔下的人潮与火光。有人说，这是伊比利亚从大静谧中醒来的第一声心跳。"
 worldnews_ibr.1.a: "灯塔重燃"
 worldnews_ibr.2.t: "审判庭肃清盐风城"
 worldnews_ibr.2.d: "伊比利亚审判庭昨日对南部城市盐风城展开大规模执法行动，捣毁多处地下礼拜堂并当众火刑处决了多名“深海教会”成员。浓烟与钟声整夜未熄。审判庭发言称此为“对深渊的第一次反攻”。"
 worldnews_ibr.2.a: "火光冲天"
 worldnews_ibr.3.t: "伊比利亚政局剧变"
 worldnews_ibr.3.d: "伊比利亚权力中枢昨夜发生剧变，统治该国逾半个世纪的审判庭政权出现重大转折。观察家指出，无论新政权由王冠、议会还是圣座执掌，伊比利亚这艘锈蚀多年的巨舰，都已开始转向。"
 worldnews_ibr.3.a: "局势未明"
 worldnews_ibr.4.t: "愚人号重见天日"
 worldnews_ibr.4.d: "伊比利亚打捞队宣布，已在南部深渊海域锁定传说旗舰“愚人号”（斯图提斐拉号）的残骸。黄金时代的绝代工程在沉睡半个多世纪后，即将重见天日。打捞队同时提醒：该海域仍有不明巨型生物活动。"
 worldnews_ibr.4.a: "深渊中的巨影"
 worldnews_ibr.5.t: "伊比利亚黄金舰队再度启航"
 worldnews_ibr.5.d: "在“大静谧”中灰飞烟灭的伊比利亚黄金舰队，昨日在特纳里夫港迎来继任者：数艘新式战舰鸣笛出港，沿岸灯塔逐一为之点亮。分析人士指出，这支舰队的规模尚不足黄金时代的十分之一，但其象征意义无法估量——海洋的儿女，重新下水了。"
 worldnews_ibr.5.a: "舰队出港"
 worldnews_ibr.6.t: "恐鱼登陆伊比利亚南岸"
 worldnews_ibr.6.d: "大量不明两栖生物昨夜登上伊比利亚南部海岸，多座渔村遇袭。伊比利亚审判庭已宣布南部海岸进入紧急状态，惩戒军正连夜驰援。这是“大静谧”以来，来自深海的威胁首次以如此规模重返陆地。"
 worldnews_ibr.6.a: "警火连天"
 worldnews_ibr.7.t: "愚人号修复再航"
 worldnews_ibr.7.d: "史上最庞大的修复工程宣告完成：在深海漂流六十年的传说旗舰“愚人号”（斯图提斐拉号）已于昨日修复完毕并重新下水，在伊比利亚灯塔的光辉中开始它的首次现代航行。各国武官均受邀观礼。有评论称：这不是一艘船的下水，这是一个时代的归来。"
 worldnews_ibr.7.a: "巨舰归港"
 worldnews_ibr.8.t: "愚人号长眠深渊"
 worldnews_ibr.8.d: "伊比利亚官方证实：捞起后的传说旗舰“愚人号”经评估已无修复价值，将按海军最高礼制沉入原发现海域。六十年漂泊，一朝安眠。伊比利亚发言人表示：“它带着我们的过去离开，也把我们的未来留了下来。"
 worldnews_ibr.8.a: "长眠深海"

# 对海嗣战争 · 洗海覆潮（国策、精神与限时精神）
 IBR_letter_to_iberia:0 "告伊比利亚同胞书"
 IBR_letter_to_iberia_desc:0 "铅字与羊皮纸把同一句话送进每座灯塔、每间修道院与每个港口：陆地不曾遗忘海上之人。同胞们，这场战争不是复仇，而是生存。"
 IBR_penitent_assembly:0 "召集惩戒军大会"
 IBR_penitent_assembly_desc:0 "悔罪者的剑在教堂前重新集结。惩戒军的军法官逐字核对开战公函——不为拖延，只为让每一柄剑都知道自己为何而出。"
 IBR_coastal_mobilization:0 "海岸线总动员"
 IBR_coastal_mobilization_desc:0 "渔村献出渔船，修会献出圣像，民兵在沙丘上架起铁丝网。被海潮侵占的灯塔，要一座一座夺回来。"
 IBR_inquisitor_special_recruit:0 "审判官特别征召"
 IBR_inquisitor_special_recruit_desc:0 "审判庭放下告解室的门帘，在征兵册上写下自己的名字。持剑的审判官们清楚：这一次，忏悔无法代替战斗。"
 IBR_total_mobilization_decree:0 "全国总动员令"
 IBR_total_mobilization_decree_desc:0 "钟声传遍半岛的每一寸土地。农人放下锄头，修士放下经卷——当无尽的海潮再度压向海岸，伊比利亚将举国握剑。"
 IBR_lighthouse_supply_system:0 "灯塔补给体系"
 IBR_lighthouse_supply_system_desc:0 "十余座大灯塔足以照亮一整片海域。如今它们不再只指引归途，还要让弹药、药品与口粮沿着光抵达每一段海岸。"
 IBR_arms_capacity_integration:0 "军械产能整合"
 IBR_arms_capacity_integration_desc:0 "修道院的铁匠铺与港口的船坞并入同一条生产线。剑与船出自同一炉火，正如审判与远航同出一脉。"
 IBR_seaborn_biology_research:0 "海嗣生物学研究"
 IBR_seaborn_biology_research_desc:0 "深海教徒的尸骸、搁浅的螯肢、渔网里缠着的鳞片——样本被送进灯下的解剖台。想劈开海潮，先要读懂海潮。"
 IBR_aegir_aid_coordination:0 "阿戈尔援助协调"
 IBR_aegir_aid_coordination_desc:0 "水下的城市通过特殊频段发来了答复：航道、图纸与老兵。阿戈尔没有忘记陆地上的同源之人。"
 IBR_iberian_prayer:0 "伊比利亚的祈祷"
 IBR_iberian_prayer_desc:0 "教堂的钟声与海浪声重叠在一起。祈祷不为求恕，而为铭记——伊比利亚仍在，且将永远在这里。"
 IBR_inquisitor_sermon:0 "审判官布道"
 IBR_inquisitor_sermon_desc:0 "审判官登上布道坛，经文换成了战报：「圣徒卡门留给我们的只有四个字——希望和决心。」"
 IBR_rebuild_heroic_memory:0 "重建英雄记忆"
 IBR_rebuild_heroic_memory_desc:0 "无名的墓碑换上刻着名字的石碑。那些葬身深海的人有了归处，而归处正是出发的地方。"
 IBR_children_lighthouse_education:0 "儿童灯塔教育"
 IBR_children_lighthouse_education_desc:0 "孩子们在灯塔下学写自己的名字，也学写「伊比利亚」。等他们长大，海会是家园，而不是伤口。"
 IBR_wash_the_tide_operation:0 "洗海覆潮行动"
 IBR_wash_the_tide_operation_desc:0 "惩戒军列阵于滩头，舰队升起战旗，灯塔的光连成一条通往深海的路。总攻开始——我的剑，将劈开海潮！"
 IBR_tide_splitter_1:0 "我的剑，将劈开海潮！ Ⅰ"
 IBR_tide_splitter_1_desc:0 "告同胞书贴满了半岛的每一面墙。粮仓上锁，酒窖上锁，征兵站的门从此不关。"
 IBR_tide_splitter_2:0 "我的剑，将劈开海潮！ Ⅱ"
 IBR_tide_splitter_2_desc:0 "沙袋和钢筋从这座灯塔一路码到那座灯塔。潮水要来，就让它自己撞上来。"
 IBR_tide_splitter_3:0 "我的剑，将劈开海潮！ Ⅲ"
 IBR_tide_splitter_3_desc:0 "解剖报告发到每一个营，士兵们第一次看清了要杀的东西长什么样。恐惧，开始变成准星。"
 IBR_tide_splitter_4:0 "我的剑，将劈开海潮！ Ⅳ"
 IBR_tide_splitter_4_desc:0 "作战地图上钉满了小旗。宽恕已去，审判未终——剑已举过头顶，只差落下。"
 IBR_specimen_analysis:0 "海嗣标本解析"
 IBR_specimen_analysis_desc:0 "灯下的解剖台上摆着来自深渊的样本。研究速度提升：10%，持续 180 天。"

# 深海教会残党（DBM）命名与民族精神
 DBM:0 "深海教会残党"
 DBM_ADJ:0 "深海教会残党"
 DBM_abandoned:0 "被遗弃者"
 DBM_abandoned_desc:0 "被海洋抛弃的教团残党蜷缩在荒野与孤岛之间，斩断了与大陆的一切联系。他们没有补给线，没有后援，也不再有能让他们倒下的饥荒与消耗——饥饿者食溟痕，伤者任伤口自行愈合。这支军队什么都不需要，除了继续存在的执念。"

# 吞并波利尔尼亚决议
 IBR_annex_pon:0 "吞并波利尔尼亚"
 IBR_annex_pon_desc:0 "将波利尔尼亚人民阵线并入伊比利亚版图：其全部领土、库存与舰队都将转归我方所有。"

# 天环骑士团独立事件
 ibr.99.t: "伊比利亚天环骑士团宣布独立"
 ibr.99.d: "灯塔的钟声还未散尽，天环的旗帜已在四境升起。曾与我等共守灯塔的骑士团宣布脱离伊比利亚——他们高举拉特兰的圣徽，宣称这片土地才是“真正信仰”的归宿。大团长的宣言传遍每个哨所：“十字即天环，殉道即归途。”内战，开始了。"
 ibr.99.a: "宽恕已死，迎战叛徒"

# 天环骑士团（TNR）命名与民族精神
 TNR:0 "天环骑士团"
 TNR_ADJ:0 "天环骑士团"
 TNR_martyrdom:0 "殉道者意识"
 TNR_martyrdom_desc:0 "殉道不是威胁，而是召唤。狂信徒军团不需要补给线，也绝不会在征服者面前低头：投降界限 +100%，补给消耗 -100%。"

# 审判庭之剑军团独立事件
 ibr.100.t: "审判庭之剑军团宣布独立"
 ibr.100.d: "灯塔的钟声还未散尽，审判的黑旗已在南境升起。曾经执掌审判庭的军团宣布脱离伊比利亚——他们自称唯有尘埃与铁剑才有资格裁决世人，宣称这将是“最后的审判”。审判官的铁蹄踏碎了哨所的门楣：“软弱者没有资格活在审判之后。”内战，开始了。"
 ibr.100.a: "裁决先于恐惧，迎战叛徒"

# 审判之剑军团（TBL）命名与民族精神
 TBL:0 "审判之剑军团"
 TBL_ADJ:0 "审判之剑军团"
 TBL_merciless:0 "绝不姑息软弱者"
 TBL_merciless_desc:0 "审判官的词典里没有“怜悯”二字。他们不需要补给线，也绝不会向任何人屈膝：投降界限 +100%，补给消耗 -100%。"

# 开局事件链：萨科塔异动
 ibr.108.t: "堕天使"
 ibr.108.d: "深夜，南境灯塔的守灯人在礁石间发现了一名重伤的萨科塔——头上没有圣辉。她自称是拉特兰的堕天使，被教廷追猎，渡海而来只求一个藏身之处。审判庭争执了整整一夜：交出她，是献给圣座修好的厚礼；收留她，等于向教廷的猎旗亮剑。天亮之前，审判庭做出了决定——把她藏进灯塔最深处的密室。消息是藏不住的：边境的传教士一夜之间多了三倍，两国的大小报馆同时咆哮起来。"
 ibr.108.a: "收留她"
 ibr.101.t: "白翼越境"
 ibr.101.d: "拉特兰边境的哨所来了一批不寻常的客人：萨科塔传教士结队而来，圣辉在暮色里明明灭灭。他们微笑着散发经书，却拒绝接受审判庭的盘查——“圣座的子民，不接受凡人的审讯。”争执演变为推搡，推搡演变为流血，第一批伤者已被抬进灯塔。边境线上，圣歌与剑鸣彻夜纠缠。"
 ibr.101.a: "边境戒严，盘查一切过境者"
 ibr.102.t: "教皇的调停"
 ibr.102.d: "拉特兰的答复比预想中来得更快——教皇的亲笔信越过边境线，随行者还有三位枢机。信中措辞恳切：萨科塔传教士将退出边境地带，作为交换，审判庭须解除戒严、归还扣押的经卷。“灯塔与圣座之间，不该流淌无谓的血。”审判庭以大局为重，接受了调停。"
 ibr.102.a: "以大局为重"
 ibr.103.t: "不再听命的剑"
 ibr.103.d: "调停的墨迹未干，谴责书已贴满哨所的门板。民间自卫组织“审判庭之剑”公开斥责审判庭在圣座面前屈膝：“当剑开始为懦弱让路，它就不再配称为剑。”他们宣布自今日起不再服从来自审判庭的任何命令，自负军械，自掌刑律。灯塔下的铁匠铺里，锻打声彻夜未停。"
 ibr.103.a: "由他们去吧"

# 过渡小事件：边境浮世绘
 ibr.104.t: "门后的经书"
 ibr.104.d: "边境的村庄在白日里闭户噤声，却在夜里醒着。孩子们翻过矮墙去领萨科塔的经书，老村长收下一本，用旧毯子裹了三层，压在床底最深处。恐惧与好奇在同一扇门后共存——哨所的探照灯扫过屋顶时，谁也没有出声。"
 ibr.104.a: "睁一只眼，闭一只眼"
 ibr.105.t: "哨所的长夜"
 ibr.105.d: "戒严的第七夜，火把在哨所外排成长列。执剑人们彻夜握剑而立，望着边境线上明明灭灭的圣辉。一个年轻剑士忽然发问：“圣辉也是光。为什么灯塔的光才是正光？”没有人答得上来，只有海风掠过剑脊，呜呜作响。"
 ibr.105.a: "握紧你的剑"
 ibr.106.t: "归还的经卷"
 ibr.106.d: "调停达成后，扣押的经卷装了整整三车，在哨所前当众归还。萨科塔传教士微笑着登车离去，车辙碾过边境线的瞬间，围观的人群里有人悄悄画了圣痕，也有人朝地上啐了一口。尘埃落定，哨卡的木栏重新升起。"
 ibr.106.a: "边境重开"
 ibr.107.t: "锻打声"
 ibr.107.d: "入夜后，灯塔下的铁匠铺没有一熄过火。军械库的账面上少了几箱矛头，没人承认经手。有人开始在酒馆里打听：审判庭之剑，到底有多少人？没有人知道确切的数目——只知道锻打声一夜比一夜密。"
 ibr.107.a: "继续盯着"
