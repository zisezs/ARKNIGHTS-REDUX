#国家领导人
 IBR_regional_defence_committee: "地区防御委员会"
 IBR_regional_defence_committee_desc: "大静谧摧毁了王国的一切，也包括秩序本身。在审判庭的鞭长莫及之处，各镇乡绅与老兵自发结成了地区防御委员会，以民兵守护村镇、以物易物维持生计。他们不相信神迹，也不相信王权，只相信手里的长矛与邻人的肩膀。"
 IBR_David_Esciara: "戴维·埃西亚拉"
 IBR_David_Esciara_desc: "戴维·埃西亚拉曾是王室的税务官，大静谧后流亡海外多年。他见证了外面的世界如何在废墟上重建，也终于明白伊比利亚的病根不在天灾，而在于一个把整个国家锁在忏悔中的政权。如今他回到佩尔多尼，召集旧日同僚，组成了民主革命委员会。他们不举火把，不喊口号，只在深夜的酒馆里散发油印的宪章草案。"
 IBR_Carmen_Iberia: "卡门·伊·伊比利亚"
 IBR_Carmen_Iberia_desc: "最后的圣徒，审判庭的创建者之一，卡门·伊·伊比利亚，他将自己无限的生命献给了伊比利亚那有限的未来。虽然随着岁月流逝，海嗣的威胁越来越像个谎言，但圣徒卡门依然相信，神明从未拯救伊比利亚，因此，他需要成为伊比利亚自己的神，即使人们需要付出被一个专制政府统治的代价。卡门不死，审判庭不倒；审判庭不倒，伊比利亚不灭。"
 IBR_Carlos_IX: "卡洛斯九世"
 IBR_Carlos_IX_desc: "卡斯蒂利亚王朝的旁系贵族，在大静谧后王室举族出逃时被遗忘在港口的孩子。如今他已不再年轻，在流亡中学会了忍耐、算计与等待。他以“卡洛斯九世”之名回国，自称王位永远不会悬空——它只是在等待一个配得上它的人。保皇派的老兵们亲吻他的戒指，而他微笑着，把目光投向佩尔多尼的审判庭。"
 IBR_Juan_Rivera: "胡安·里维拉"
 IBR_Juan_Rivera_desc: "前惩戒军军官，盐风城人，亲身见证了海嗣如何撕碎了他的一切。他不信审判庭的经文，却信审判庭手中的剑。“既然神不救人，那就让每个伊比利亚人都成为自己的神。”长剑党在他的带领下迅速壮大——纪律、剑术、手炮与热血，许诺给伊比利亚一个不再下跪的明天。"
 IBR_deep_sea_episcopate: "深海主教团"
 IBR_deep_sea_episcopate_desc: "没有人知道深海主教团的主教们是谁，正如没有人知道海面之下藏着什么。他们自称是“大静谧”的解释者：海洋召唤她的儿女回家，而伊比利亚应当顺从。他们的布道温柔而耐心，他们的仪式开始于一场梦境，结束于一场献祭。"

