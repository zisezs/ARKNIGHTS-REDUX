 SCR_lucian_gaul_char: "卢西恩·德·高卢"
 ########################
 # 剧本
 ########################
 SCR_ARK_SCENARIO_DESC: "高卢旧领，现维多利亚境内的克莱布拉松。雾气笼罩的林地深处，荒废的古堡亮起了烛火。历史悠久、剧目优秀的猩红剧团在此驻演——但要观看他们的演出，需要遵守些许规则。"
 ########################
 # 国策树与国策 —— 高卢的返场演出（四幕 48 国策 · 中轴对称）
 SCR_the_curtain_rises: "大幕拉开"
 SCR_the_curtain_rises_desc: "马车停了，帐篷立起，红丝绒垂落。传单上写着：此处驻演的剧团，历史悠久，剧目优秀。至于规则之外的事——剧团长从不解释。"
 SCR_crown_of_embers: "灰烬王冠"
 SCR_crown_of_embers_desc: "高卢没有亡，它只是散场太早，观众还没走完。剧作家宣布：我们需要一位主角。"
 SCR_gather_the_displaced: "收拢散落的旧台词"
 SCR_gather_the_displaced_desc: "复国者们各自背诵不同版本的台词。剧作家挥挥手：都收下吧，错词不要紧——只要愿意上台。"
 SCR_sole_director: "唯一的导演"
 SCR_sole_director_desc: "这部戏只有一个导演。其余的人，要么演好自己的角色，要么——我们台上见。"
 SCR_archives_of_embers: "灰烬档案"
 SCR_archives_of_embers_desc: "把所有关于高卢的残卷、族谱、遗嘱与旧地图编成一份总目。谁记得故土，谁就归我们管。"
 SCR_gallic_salon: "高卢沙龙"
 SCR_gallic_salon_desc: "旧贵族们需要一个能喝茶的地方，好让他们相信时代没有抛弃他们。给他们一个沙龙，收下他们的头衔。"
 SCR_crown_settled: "冠冕落定"
 SCR_crown_settled_desc: "当荒野与沙龙、老兵与学徒都称我们一声「高卢的舞台」，领导者就诞生了——由掌声加冕。"
 SCR_herald_on_the_road: "传令官上路"
 SCR_herald_on_the_road_desc: "把我们的名字写进每座移动城市的公告栏。传令官不问路，他只负责让所有人知道戏已开演。"
 SCR_pillage_the_myth: "收割高卢神话"
 SCR_pillage_the_myth_desc: "皇帝、巫王、四皇会战——把这些故事拆开、重写、念给下一代听。神话是最好的征兵处。"
 SCR_vanguard_state: "高卢先锋国"
 SCR_vanguard_state_desc: "终幕：剧作家把一面没有徽记的旗和一份建国文书一起放在桌上。是否摘下剧团的招牌、让猩红剧团成为一个国家——这一次，由您决定。"
 SCR_first_decree: "第一道政令"
 SCR_first_decree_desc: "建国后的第一道命令写给全体国民：演员表已经排好，请在开场前找到自己的位置。"
 SCR_court_of_stages: "舞台宫廷"
 SCR_court_of_stages_desc: "把古堡建成一座供万民朝圣的剧场。王座可以是把导演椅——只要它足够高。"
 SCR_roll_call_of_gaul: "高卢点名册"
 SCR_roll_call_of_gaul_desc: "先弄清高卢的每一块地、每一支枪、每一个不肯坐下的名字。要控制乱局，先数清乱局。"
 SCR_script_for_insurgents: "给暴乱者一份剧本"
 SCR_script_for_insurgents_desc: "把枪换成道具、把口号换成台词。让他们相信：跑龙套也是一种高卢式的反抗。"
 SCR_no_improvisation: "这里没有即兴"
 SCR_no_improvisation_desc: "擅自加词的演员会毁掉整部戏。剧作家张贴规则：凡即兴者，谢幕时没有座位。"
 SCR_stage_managers_of_the_wilds: "荒野的舞台监督"
 SCR_stage_managers_of_the_wilds_desc: "当每一堆篝火旁都有人记下谁在咳嗽、谁在磨刀，游击队就只是遍布大地的提词员了。"
 SCR_ledger_of_names: "名册"
 SCR_ledger_of_names_desc: "给每个武装组织编号、注册、指派台词。散兵游勇进了名册，就不再是自己的主角。"
 SCR_kind_theaters: "亲善剧场"
 SCR_kind_theaters_desc: "在游击队最爱的村庄搭免费剧场。看戏的人吃饱了掌声，自然不再记得谁是首领。"
 SCR_the_audience_sits_down: "观众就座"
 SCR_the_audience_sits_down_desc: "暴乱熄了，枪声停了，村庄重新点灯。所有人都坐下了——统治，从这一刻才算开演。"
 SCR_loyalty_is_a_line: "忠诚是句台词"
 SCR_loyalty_is_a_line_desc: "让每个前游击队长在众人面前念一段效忠词。念过的，就回不去从前了。"
 SCR_understudy_battalions: "替补营"
 SCR_understudy_battalions_desc: "把最驯服的游击队编成替补营，随军听用。他们曾是麻烦，如今是布景。"
 SCR_curtain_around_gaul: "高卢上空的幕"
 SCR_curtain_around_gaul_desc: "从林地到谷地，从城市到旷野，处处是我们的耳目。高卢第一次如此安静——安静得能听见心跳。"
 SCR_whisper_networks: "低语网络"
 SCR_whisper_networks_desc: "让窃听者比咳嗽声还多。低语构成的网，比铁栅栏结实一万倍。"
 SCR_dont_clap_yet: "别急着鼓掌"
 SCR_dont_clap_yet_desc: "统治不是一幕，是每一夜的重演。警备永不谢幕——掌声未落，下一场已经开始。"
 SCR_march_music: "军乐"
 SCR_march_music_desc: "先让所有人记起行军的拍子。鼓手归队，军团才愿意把脚抬起来。"
 SCR_rehearse_the_old_guard: "老近卫军的复排"
 SCR_rehearse_the_old_guard_desc: "老人们还留着旧军服。这一次要复排的，是同一出戏的另一个结局。"
 SCR_script_of_the_grand_campaign: "大军团的剧本"
 SCR_script_of_the_grand_campaign_desc: "当年他们就是在这里忘了给观众留离场通道。剧作家重写这部战争戏的调度。"
 SCR_veterans_choir: "老兵合唱团"
 SCR_veterans_choir_desc: "散落各地的老兵一起唱军歌。歌声找回的不止是士气，还有那套被埋了七十年的打仗手艺。"
 SCR_officers_school_on_wheels: "移动军官学校"
 SCR_officers_school_on_wheels_desc: "没有军校，就把军校装进列车。军官在铁轨上毕业，到站即上阵。"
 SCR_artillery_interlude: "炮兵间奏"
 SCR_artillery_interlude_desc: "高卢炮兵当年让联军头疼。让炮兵回归之前，先让兵工厂开足马力。"
 SCR_the_army_remembers: "军队还记得"
 SCR_the_army_remembers_desc: "军旗补好，军号吹响，老军官在沙盘前落泪：这支军队，还记得怎么赢。"
 SCR_gaulish_drill: "高卢操典"
 SCR_gaulish_drill_desc: "全军团同一套步伐、同一支号令。疯子治国，也治军——而且治得极好。"
 SCR_supply_caravan_restored: "补给车队重张"
 SCR_supply_caravan_restored_desc: "兵马未动，粮草先行。剧作家亲自替后勤写台词：每一个零件都要有下一幕的用处。"
 SCR_encore_of_the_empire: "帝国的返场"
 SCR_encore_of_the_empire_desc: "当世界以为高卢的军队早已谢幕，军营响起排练的鼓点。不是还魂——是返场。"
 SCR_old_guard_flag: "老近卫旗帜"
 SCR_old_guard_flag_desc: "把老近卫军的旗请回队列最前。一面旗，比十道军令更能让人赴死。"
 SCR_generals_box: "将军包厢"
 SCR_generals_box_desc: "元帅们不再亲临火线，改坐包厢看戏。看清全局的人，才配指挥返场。"
 SCR_ledger_of_ruins: "废墟账本"
 SCR_ledger_of_ruins_desc: "废墟不是终点，是未结清的账。先把高卢欠下的每一块砖头数清楚。"
 SCR_stage_of_iron: "钢铁舞台"
 SCR_stage_of_iron_desc: "碎铁熔成新布景：烟囱作立柱，锻炉作脚灯。克莱布拉松是一座连夜搭建的钢铁舞台。"
 SCR_harvest_the_ruins: "收割废墟的收成"
 SCR_harvest_the_ruins_desc: "倒塌的梁木是柴，废弃的钢轨能炼出枪管。凡高卢拥有过的，都要重新吃一遍。"
 SCR_forge_chorus: "锻炉合唱"
 SCR_forge_chorus_desc: "锤声此起彼伏，像一支合唱。剧作家站在炉边指挥：再响些，让全世界听见我们开工了。"
 SCR_rebuild_the_roads: "重铺道路"
 SCR_rebuild_the_roads_desc: "路是国家的台词——没有路，话就传不出去。"
 SCR_light_in_the_basement: "地下室的光"
 SCR_light_in_the_basement_desc: "科学家们躲在废墟地下室里，就着一盏灯拼凑旧图纸。光别灭——那是未来的布景。"
 SCR_the_land_remembers: "大地还记得"
 SCR_the_land_remembers_desc: "土地比人记性好。它记得庄稼怎么种、矿脉在哪里、河流往哪走。听大地的，重建就赢了一半。"
 SCR_farmers_take_a_bow: "农夫谢幕"
 SCR_farmers_take_a_bow_desc: "让耕者有其田，让收获有掌声。喂饱了肚子，戏才唱得下去。"
 SCR_trade_on_old_roads: "旧商路重开"
 SCR_trade_on_old_roads_desc: "沿着高卢商队走了一千年的路，重新挂起灯笼。货物往来处，就是人心所向处。"
 SCR_city_that_refuses_to_close: "拒不谢幕的城市"
 SCR_city_that_refuses_to_close_desc: "林贡斯被夷平了，但城市是一句没说完的台词。他们要我们记住一座废墟——我们就让世界记住一座新城。"
 SCR_muses_exchange: "缪斯交易所"
 SCR_muses_exchange_desc: "把灵感也变成商品：专利、乐谱、剧本、蓝图。艺术之都，先从交易所开始。"
 SCR_archive_tower: "档案之塔"
 SCR_archive_tower_desc: "把每一份高卢的图纸与知识封进塔里。只要塔不倒，这个民族就没有真死。"
 SCR_tree_initial: "高卢先锋国——四幕返场"
 SCR_vanguard_state_tooltip: "§Y触发事件「加冕，或谢幕」：由您决定是否正式成立「高卢先锋国」。§!"
# 动态民族精神（四大BUFF · 可升级 · 已整合全部小精神）
 ########################
 SCR_dyn_leadership: "高卢的冠冕"
 SCR_dyn_leadership_tooltip: "§G高卢的冠冕（领导权大BUFF）：政治点数获取、稳定度、战争支持度与意识形态牵引随复国大业逐级提升；科研与建造速度同步小步提升。加密与破译在特定国策后强化。§!"
 SCR_dyn_control: "舞台监督的花名册"
 SCR_dyn_control_tooltip: "§G掌控加深（控制大BUFF）：顺从度增长、反颠覆防御与情报行动奖励随整肃逐级提升；占领区抵抗度增长持续放缓，加密与破译逐级强化。§!"
 SCR_dyn_army: "返场的军团"
 SCR_dyn_army_tooltip: "§G军威正盛（陆军大BUFF）：陆军攻击、防御、士气与战争支持度随复排逐级提升；陆军经验获取、征兵能力、挖掘上限提升，制造宣战理由更快、所需紧张度更低。§!"
 SCR_dyn_rebuild: "不谢幕的脚手架"
 SCR_dyn_rebuild_tooltip: "§G重建加速（国力大BUFF）：建造速度、稳定度、政治点数与战争支持度随复兴逐级提升；科研速度、人口增长与核心部队攻防提升，消费品需求与经验损失持续下降。§!"
 SCR_dyn_leadership_desc: "世人说，那顶冠冕早已熔进林贡斯的焦土，与帝国一同被四国联军踩进了中央河谷的泥里。可我不信——火能烧掉石头的城，却烧不掉帝国最骄傲的那缕青烟。它悬在废墟上空，等着被一双疯子的手捏回形状。\n\n为灰烬加冕吧。王座从不需要宫殿，正如悲剧从不需要掌声——只要还有一个相信高潮尚未上演的人活着，高卢就仍在呼吸。"
 SCR_dyn_control_desc: "每一座被并入版图的城市，都是一座忘了自己正在演出的剧场。不必惊慌——监督握着花名册：谁在入戏，谁在装睡，谁在后台悄悄磨刀，册子上写得一清二楚。\n\n没有人真正离场。你只需安静地坐回观众席——下一幕，或许就轮到你的名字，被一种很动听的声音，念出来。"
 SCR_dyn_army_desc: "四皇会战那日，老近卫军战至最后一人——然后呢？没有人替他们谢幕。这不行，太不体面了，帝国不该死得这么潦草。\n\n于是我们把他们的名字，一个个缝回军旗上。帝国可以没有皇帝，但绝不能没有返场的军团——死亡不过是幕间休息，鼓声一响，谁还赖在台上不起来，谁就是逃兵。"
 SCR_dyn_rebuild_desc: "他们把林贡斯夷为平地，满以为这样，戏便演完了。可爱的观众啊——脚手架还立着，就意味着布景尚未换完，大幕从未落下。\n\n我们不要一座博物馆般的首都，我们要一座永远在建的城：吊杆上悬着尚未完工的钟楼，幕布背后藏着兵工厂。竣工之日？那份剧本，是替别的剧团写的。"
