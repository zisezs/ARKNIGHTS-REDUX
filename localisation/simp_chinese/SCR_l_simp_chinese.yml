 ########################
 SCR_vanguard_unlock_tt: "§Y限量部队「近卫军之锋」：§!解锁一支不可改装的固定编制——12 个摩托化步兵团，支援连 1（工兵连）。编制上限 §Y4§! 个师，首都当场开出 §Y2§! 个人员、装备、经验全满的近卫军之锋师。"
 SCR_vanguard_cap_up_tt: "§Y近卫军之锋：§!编制上限 §G+2§! 个师。"
 SCR_vanguard_support_recon_tt: "§Y近卫军之锋：§!支援连 1 → 2，侦察连入列。"
 SCR_vanguard_support_signal_tt: "§Y近卫军之锋：§!支援连 2 → 3，通信连入列。"
 SCR_vanguard_support_logistics_tt: "§Y近卫军之锋：§!支援连 3 → 4，后勤连入列。"
 SCR_vanguard_support_artillery_tt: "§Y近卫军之锋：§!支援连 4 → 5，炮兵连入列。整条陆军线走完，这支剧团的脸面才算配齐。"
