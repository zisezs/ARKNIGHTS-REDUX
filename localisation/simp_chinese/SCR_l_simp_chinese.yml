 ########################
 SCR_theatre_is_truth: "戏剧即真实"
 SCR_theatre_is_truth_desc: "戏剧的帷幕落下之时，现实的帷幕方才升起。我们并非在模仿生活，而是以更纯粹的形式——悲剧——来抵达生活的本质。\n\n为所到之处献上精彩的戏剧。然而当他们上演悲剧时，现实的悲剧也会悄然而至。"
 SCR_tragic_aesthetics: "悲剧美学"
 SCR_tragic_aesthetics_desc: "狂欢与毁灭是同一枚硬币的两面。我们邀请观众欢笑，但只有当他们落泪时，才真正理解了艺术。\n\n猎物吞下猎手......我们的太阳染满鲜红——这不值得恐惧。这是最完美的瞬间。"
 SCR_eye_of_the_director: "剧团长之眼"
 SCR_eye_of_the_director_desc: "祂注视着一切——台上的、台下的、幕后的、幕前的。每一个灵魂都是祂剧本中的一行字，而祂绝不允许错别字。\n\n有报告称，祂的名号与各种变体在千百年前就已存在。没有人见过祂摘下面具。据说面具之下，仍是面具。"
 SCR_theatre_is_truth_tt: "§G戏剧之外亦有舞台：观察与渗透效率提升。§!"
 SCR_tragic_aesthetics_tt: "§R观众的牺牲就是最好的演出：战争支持度提升，稳定度与人力下降。§!"
 SCR_eye_of_the_director_tt: "§G幕后之人无所不闻：加密与破译效率提升。§!"
