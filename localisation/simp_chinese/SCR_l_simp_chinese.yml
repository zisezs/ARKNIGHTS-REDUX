 # 决议
 ########################
 SCR_theatre_category: "幕后"
 SCR_theatre_category_desc: "剧团的秘密舞台工艺——把戏演在现实本身之上。"
 SCR_stage_a_tragedy: "排演一出悲剧"
 SCR_stage_a_tragedy_desc: "「无论好坏都只剩下最后一周了。我不希望它最后看起来只是拿来消遣的垃圾！」\n\n在无法离席的观众面前排演一出真正的悲剧。眼泪，是观众所能献上的最高敬意——而剧团从不让他们失望。"
 SCR_prepare_new_production: "筹备新剧目"
 SCR_prepare_new_production_desc: "活页剧目集已翻开：《凯旋颂》《一百零一日》《梦中奇缘》......剧作家把三份手稿摊在桌上，每一份都用干涸血色的墨水写成。\n\n「团长问先排哪一出。他说......观众饿了。」"
 SCR_insert_flypage: "插入飞页"
 SCR_insert_flypage_desc: "「笔者，与我同行。请告诉成员们，被你修改后的剧情是什么样子的？」\n\n往世界的书页间夹进一页空纸，改写其中一个小小的场景。没有人会察觉——直到结局。"
 SCR_public_triumph_tour: "《凯旋颂》：随机核心化一块占领区"
 SCR_public_triumph_tour_desc: "凯旋颂要一路演到国境之外——让我们齐唱颂歌，庆祝皇帝凯旋！皇帝万岁！高卢万岁！\n\n§Y巡演效果：§!随机使一块被我们控制但尚无核心的地区获得核心。冷却90天。"
 SCR_tour_category: "剧团的公开巡演"
 SCR_tour_der_ring: "《湖中至宝》：消费品需求-10%（90天）"
 SCR_tour_der_ring_desc: "即使高塔为之倒塌，众人为之相残，莱塔尼亚的至宝终究不会留在卡普里尼的手指上。林中那汪浅浅的湖水，才是它梦寐以求的归宿。\n\n§Y巡演效果：§!90天内消费品需求-10%（金库充盈，战争基金宽裕）。"
 SCR_tour_101_days: "《一百零一日》：陆军经验获取+100%（90天）"
 SCR_tour_101_days_desc: "曾经，有位平民向商人讲述了一个精彩绝伦的故事，这个故事经过层层传播，在一百零一日后传入王酋耳中。饶有兴趣的他微服私访前去寻找故事的源头，最后却发现，这位平民早已被自己处死。\n\n§Y巡演效果：§!90天内陆军经验获取+100%。"
 SCR_tour_lone_wander: "《独行客》：灵感碎片+1"
 SCR_tour_lone_wander_desc: "在大地的缝隙中，在城市的阴影下，独行的怪人窥视一切。在丑陋的铁桶面具中，隐藏着阴谋与疯狂。\n\n§Y巡演效果：§!获得1枚灵感碎片。"
 SCR_tour_wonderland: "《梦中奇缘》：征兵能力+5%（90天）"
 SCR_tour_wonderland_desc: "即使到不了远方的城堡，你至少还有同伴，我至少还有你。\n\n§Y巡演效果：§!90天内征兵能力+5%（人事调度函源源不断）。"
 SCR_tour_frost_deer: "《霜牡与雪牝》：陆军攻防+15%（90天）"
 SCR_tour_frost_deer_desc: "作为雪祀的亲缘护卫，我们的愿望是，亡于寒铁。\n作为血脉相连的双子，我们的愿望是，同生共死。\n你们的愿望太多了，只能实现一个，由我来选吧。\n\n§Y巡演效果：§!90天内陆军攻击与防御+15%。"
 SCR_tour_heria: "《赫里亚之辉》：陆军攻击+10%、经验+50%（90天）"
 SCR_tour_heria_desc: "在最危难的时刻，英雄们从太阳上落下，行过赫里亚山巅，来到米诺斯身边。\n\n§Y巡演效果：§!90天内陆军攻击+10%，陆军经验获取+50%。"
 SCR_tour_mother_wolf: "《七丘的狼母》：挖掘上限+50%、防御+10%（90天）"
 SCR_tour_mother_wolf_desc: "狼母离巢前车之鉴，规矩不可逾越。\n\n§Y巡演效果：§!90天内挖掘上限+50%，陆军防御+10%。"
 SCR_tour_the_dawn: "《初晓》：稳定度+3%、战争支持度+3%"
 SCR_tour_the_dawn_desc: "有一条光带从身后跑来，掠过城市喧嚣，跃向天与地的接缝。忽然，整个大地抖掉清晨的恍惚，睁开双眸，现出露珠与光亮。\n\n§Y巡演效果：§!立刻获得稳定度+3%与战争支持度+3%。"
 SCR_tour_golden_fowlbeast: "《金羽兽》：政治点+75"
 SCR_tour_golden_fowlbeast_desc: "纯金羽兽纯金卵，纯金羽毛摆又摆，纯金幼崽嘎嘎喊，纯金与人又何干？\n\n§Y巡演效果：§!立刻获得75政治点。"
 SCR_tour_wild_gold: "《狂野之金》：补给消耗-10%（90天）"
 SCR_tour_wild_gold_desc: "「无论你想做什么，你都需要这些东西，越多越好。」\n\n§Y巡演效果：§!90天内补给消耗-10%。"
 SCR_tour_lullaby: "《摇篮曲》：稳定度+10%、人口增长+5%（90天）"
 SCR_tour_lullaby_desc: "干净、舒适、安逸的梦境，从一首摇篮曲开始。睡醒之后，一切都会变得更美好。\n\n§Y巡演效果：§!90天内稳定度+10%，人口增长+5%。"
 SCR_tour_carnival: "《欢欣鼓舞》：消费品需求-5%（90天）"
 SCR_tour_carnival_desc: "庆祝吧，朋友！这等好事可不是天天都有。\n\n§Y巡演效果：§!90天内消费品需求-5%。"
 SCR_play_der_ring: "《湖中至宝》"
 SCR_play_101_days: "《一百零一日》"
 SCR_play_wonderland: "《梦中奇缘》"
 SCR_play_frost_deer: "《霜牡与雪牝》"
 SCR_play_heria: "《赫里亚之辉》"
 SCR_play_mother_wolf: "《七丘的狼母》"
 SCR_play_wild_gold: "《狂野之金》"
 SCR_play_lullaby: "《摇篮曲》"
 SCR_play_carnival: "《欢欣鼓舞》"
 SCR_release_gul: "释放傀儡国·高卢共和国"
 SCR_release_gul_desc: "从剧团的领地中划出一方舞台，让高卢的旗帜重新升起。\n\n§Y效果：§!（高卢共和国不存在，且我们拥有1040号地区时）在1040号地区释放高卢共和国为我们的傀儡国——无论我们手里攥着多少高卢故土，都只分出这一块领地，其余仍归剧团所有。\n\n§R谨以此防世界大战因高卢缺席而无法爆发。§!"
 SCR_shadow_over_salon: "沙龙上空的影子"
 SCR_shadow_over_salon_desc: "本文开篇仅需指出一个被所有正史忽略的事实：四国战争结束后的第一个演出季，剧团的巡演路线与高卢旧贵族的沙龙地图完全重合。巧合如此精准，以至于它只能是被安排的。"
 SCR_ledger_of_old_blood: "旧血账簿"
 SCR_ledger_of_old_blood_desc: "贵族最怕的从来不是革命者，而是记账的人。债务、私生子、赌约、典当的祖传佩剑——剧团用了三个演出季，把这些零散的纸页装订成册。本文作者有幸翻阅过账簿封皮：没有标题，只有一行小字，「所有人在我们面前都是演员」。"
 SCR_dressers_of_the_aristocracy: "贵族的更衣室"
 SCR_dressers_of_the_aristocracy_desc: "革命摧毁了贵族的头衔，却摧毁不了他们每日清晨的更衣仪式。当裁缝、侍女与管家都出自剧团的训练班，贵族们维持体面的每一根线，都系在我们手中。他们脱不下面具——因为面具是我们替他们戴上的。"
 SCR_puppets_in_the_salons: "沙龙中的提线"
 SCR_puppets_in_the_salons_desc: "至此可以提出本文的核心论点：高卢的旧贵族不是被消灭的，而是被招募的。他们照常出席舞会、照常议论时政、照常签署请愿书——只是台词需要提前送审。观众们至今没有发现，沙龙里最热烈的掌声都来自同一侧包厢。"
 SCR_the_marriage_contract: "婚约条款"
 SCR_the_marriage_contract_desc: "联姻是旧贵族最后的有效证件。剧团不缺魅力，缺的只是姓氏——于是一份份婚约被签订，条款冗长如剧本，而真正生效的只有附注：剧团成员自此以旧贵族的姓氏登台。血统可以被伪造，但婚约具有法律效力。"
 SCR_forged_genealogy: "伪造的族谱"
 SCR_forged_genealogy_desc: "本文在此披露一项技术性细节：高卢的族谱验证制度依赖三位公证人的签章，而其中两位的独子都曾在剧团的冬季戏班学习。当第三位公证人也在某场悲剧的观众席上落泪之后，族谱的印刷成本便仅剩纸张与墨水。"
 SCR_ministers_of_the_wing: "侧幕的大臣"
 SCR_ministers_of_the_wing_desc: "共和国重建后，各部的走廊里出现了越来越多的新面孔：他们博学、谦逊、履历完美。没有人追问他们此前的职业生涯——毕竟，审查谁是演员出身的人是可疑的，而审查者本人，正坐在剧团的化装间里。"
 SCR_voices_in_the_assembly: "议事厅里的和声"
 SCR_voices_in_the_assembly_desc: "决议需要多数，多数需要游说，游说需要餐桌，而餐桌需要剧团承办。当议员的侍应生都由剧团供给，法案的表决结果便提前一晚送到了彩排现场。反对派的存在是必要的——他们的台词早已写好，作用是让剧本显得真实。"
 SCR_the_chief_of_the_deep_office: "深层办公室的长官"
 SCR_the_chief_of_the_deep_office_desc: "档案、密档、烧毁前的抄档。共和国的情报机构自认为在监视剧团，这正是剧团需要他们相信的。真正的卷宗室位于剧院地下三层，编号规则与共和国档案完全一致——包括那些共和国自己都以为早已烧掉的部分。"
 SCR_the_state_wears_a_mask: "戴面具的国家"
 SCR_the_state_wears_a_mask_desc: "本文的结论在此可以先行陈述：高卢共和国仍然存在，它的国旗、宪法与议会都照常运转。但每一道政令在签发之前，都先在剧团的道具间里排练过一遍。国家没有亡，国家只是换上了剧团缝制的戏服。"
 SCR_the_deep_government: "狂欢之国，高卢倒影"
 SCR_the_deep_government_desc: "最终章：无需政变，无需炮火，无需一纸退位诏书。当幕布升起，执政官在台上宣读讲稿——而讲稿的批注、修改与最终定稿权，都归于一个从未出现在任何官方文件中的名字。本文到此为止。有些观众，比他们以为的更接近舞台。"
 SCR_deep_state: "狂欢之国，高卢倒影"
 SCR_deep_state_desc: "政令出自共和国，批注定稿权在幕后。"
 SCR_adv_pol_1: "维克托·安塞尔姆「账房总管」"
 SCR_adv_pol_2: "奥黛特·德·瓦隆「沙龙女主人」"
 SCR_adv_pol_3: "吉尔贝·蒙泰涅「出版商」"
 SCR_adv_pol_4: "玛戈·莱里捷「裁缝总管」"
 SCR_adv_pol_5: "阿尔芒·杜瓦尔「老议员」"
 SCR_adv_pol_6: "塞莱斯坦·富歇「档案官」"
 SCR_adv_pol_7: "伊莎多尔·布兰「银行家」"
 SCR_adv_pol_8: "露西尔·德·夏尼「伯爵夫人」"
 SCR_adv_pol_9: "巴蒂斯特·科兰「报人」"
 SCR_adv_pol_10: "奥诺雷·维尔内「法官」"
 SCR_adv_pol_11: "菲尔米娜·加斯帕「票务总管」"
 SCR_adv_pol_12: "埃德蒙·拉图什「诗人」"
 SCR_return_to_londinium: "重返林贡斯"
 SCR_return_to_londinium_desc: "他们把这座城夷成平地，好让世界忘记它。可脚手架记得，吊车记得，每一根重新扎进焦土的桩基都记得——我们回来了，带着图纸、剧团，和一整个国家的固执。"
 SCR_survey_the_rubble: "清点废墟"
 SCR_survey_the_rubble_desc: "工程师的白色图纸上，废墟被编号为A至F——坍塌的歌剧院、烧穿的钟楼、还站着一半的市政厅。每一个编号都用红笔圈过：可修复。全都可以修复。"
 SCR_requiem_for_the_capital: "收殓与安魂"
 SCR_requiem_for_the_capital_desc: "重建之前，先给死者一个交代。万人坑上立起白石碑，唱诗班在此排练安魂曲——排练了整整一个冬天，直到每一个音符都能稳稳落在石头上。"
 SCR_forest_of_scaffolds: "脚手架的森林"
 SCR_forest_of_scaffolds_desc: "杉木脚手架一夜之间长满全城，比四国战争前的林贡斯更高、更密。有人在脚手架里迷路了三天，出来时说：这不像是工地，像是新长出来的城市。"
 SCR_foundation_of_the_grand_theatre: "大剧院的地基"
 SCR_foundation_of_the_grand_theatre_desc: "重建的第一锹不挖住宅，不挖政府，挖剧院。地基深达三十米，浇了三层钢——有人说太奢侈了，剧团回答：一个不会演戏的城市，重建得再高也只是废墟的另一种形状。"
 SCR_homeward_act: "移民回归法案"
 SCR_homeward_act_desc: "难民名单是从收容营的册页上一页页抄回来的。凡登记回归者，赠车票一张、砖石千块、临街铺面一间。半年后，回归者的炊烟比脚手架先罩住了天际线。"
 SCR_lights_of_londinium_again: "林贡斯重新点灯"
 SCR_lights_of_londinium_again_desc: "竣工那夜没有剪彩，剧团包下了整座新剧院的首演。午夜钟声敲响时，全城万灯齐明——远处三国联军的哨所都看得见。他们看见了，但已经没有什么可以再做：这座城，重新亮了。而首都，自此迁回林贡斯。\n\n§Y效果：§!需要拥有并完全控制林贡斯（483号地区）：+10民用工厂、+10军用工厂、+20建筑槽，设为巨型城市并迁都，同时获得地区修正「世界之都，高卢之心」与2个科研槽。"
 SCR_londinium_heart: "世界之都，高卢之心"
 SCR_londinium_heart_desc: "所有人的目光都望向这里——它是被从灰烬里扶起来的，如今它替整个高卢站着。"
 SCR_londinium_lights: "万灯齐明的林贡斯"
 SCR_londinium_lights_desc: "重新亮起来的不只是灯，还有敢在午夜之后留在街上的人。"
 SCR_armament_decree_1: "军备法令·战时生产"
 SCR_armament_decree_1_desc: "步兵装备的生产线昼夜不停，每一支步枪的工时都被精打细算到极点——军团需要的从来不是精致，而是足够。"
 SCR_armament_decree_2: "军备法令·军团统购"
 SCR_armament_decree_2_desc: "军团现在以单一买家的身份出现在所有工厂面前：统一定价、统一验收、统一发货。商人抱怨利润，然后照单全收。"
 SCR_old_guard_broken: "折断的旧近卫军"
 SCR_old_guard_broken_desc: "老元帅替我们带队。从此军令上有他的签名，军旗角上多了一道红。他打得比谁都稳——他比谁都清楚，这支军队只需要胜利，不需要说话。\n\n§R代价：§!所有人都亲眼看见，最硬的那一个人也会低头。此后行礼之前，老兵们总要先看一眼他的后背。"
 SCR_gallic_martyrs: "高卢的殉道者"
 SCR_gallic_martyrs_desc: "我们把他的血留在第一排的座位上，把他的名字留在广场的石头上。石头是免费的，名字也是——它们从此自己生长。\n\n§R代价：§!看台确实为主角的死法热血沸腾，但服从度再也长不出来：夜里有人藏人，也有人往山里去。"
 SCR_old_world_new_god: "旧世新神，高卢倒影"
 SCR_old_world_new_god_desc: "「旧世的神明已经散场，观众却还举着空杯。该由我们在高卢的废墟上，重新开一场酒宴了。」\n\n酒神不再藏在披风与面具之后。猩红剧团将吞并高卢共和国的全部家底——它的土地、它的枪炮、它自视甚高的旧魂灵——把它们悉数收进自己的戏箱，当作新神名下的行省继续谢幕与巡演。旧世界的神早已死去；今夜，新神替它倒映在杯中。\n\n§Y效果：§!吞并高卢共和国，其全部核心州直接转为我们自己的核心，不留无核心的占领区；这些新核心州将同时戴上地区修正§R「清醒者的盲目顽抗」§!（地区可用人力-50%、地区可用工厂数量-50%），须由后续决议「重塑高卢之魂」逐一化解。\n\n§R启用条件：拥有 §Y300§! 以上政治点数、已完成国策「高卢先锋国」，且高卢共和国（GUL）仍然存在。§!"
 SCR_declare_war_on_LTN: "舞台之外，剑指莱塔尼亚"
 SCR_declare_war_on_LTN_desc: "剧团的巡演地图上，莱塔尼亚是下一座城市。当工厂的烟囱足够多、舞台足够大，就没有理由继续等待。\n\n§R启用条件：花费 §Y50§! 政治点数，且拥有超过 §Y120§! 座工厂（民用＋军用＋船坞）、莱塔尼亚仍然存在。启用后立即对莱塔尼亚宣战，目标为完全吞并。§!"
 SCR_encore_for_the_old_guard: "为旧军团安排的加演"
 SCR_encore_for_the_old_guard_desc: "旧军团没有投降，只是散了场。散场的军官回到田里、回到府里、回到儿子的名字里——他们仍在，只是不说话。台上还缺一幕：让最有名望的那几根骨头，当众演一次屈服。\n\n「抵抗已经散场了。」舞台监督说，「我们只需要它谢幕。」\n\n§R启用条件：花费 §Y100§! 政治点数，已完成国策「高卢先锋国」，且本国占有原高卢的核心州。一次性决议，开启事件链「旧军团的加演」——此后如何收场，由您当场决定。§!"
 SCR_GUL_Columbia_pact_decisions: "哥伦比亚联邦之约"
 SCR_GUL_Columbia_pact_decisions_desc: "哥伦比亚联邦主导着自由大陆公约组织。猩红剧团与高卢的事业若想在西大陆立足，离不开那台轰鸣的工业巨兽——递交文书吧，让新神与旧邦同乘一艘陆行舰。"
 SCR_GUL_join_columbia_pact_faction: "加入哥伦比亚联邦所属的阵营"
 SCR_GUL_join_columbia_pact_faction_desc: "自由大陆公约组织以哥伦比亚联邦为首，是西大陆最庞大的工业与军事同盟。\n\n向哥伦比亚递交结盟文书：加入其阵营，接受公约的集体防御——从此，旧世界的敌人们要面对的不再是一支流亡剧团，而是一整片大陆的钢铁幕布。"
 SCR_GUL_join_columbia_pact_faction_tt: "§G与哥伦比亚联邦缔结盟约：加入自由大陆公约组织阵营，享受公约集体防御。§!"
 ########################
 # 特质提示
 ########################
 SCR_blood_diamond_song_tt: "§Y血钻的歌声：§!「于他自己，于观众，都是一种不幸。」——歌声会撕裂歌者的喉咙，也将痛苦渗入听众的耳朵：与其交战的敌方部队组织度恢复显著放缓。"
 SCR_illusionist_tt: "§Y幻术师：§!「魔术师助手」的看家本领——虚象布景扰乱敌军：增援抵达更快，侦察效率提升。"
 SCR_strict_teacher_tt: "§Y严师：§!「疼痛是记忆的载体，恐惧是敬意的源头。如果学生不怕我，他们就不会记住我教的东西。」——该指挥官所部进攻更强，附随部队获得经验更快。"
 SCR_stage_mastery_tt: "§Y舞台调度：§!毕生的走位与时机——计划上限与侦察效率提升。"
 ########################
 # 阵营
 ########################
 SCR_grand_theatre_pact: "大剧院协定"
 ########################
 # 事件
 ########################
 scr.1.t: "面具之后"
 scr.1.d: "根据傀影最后留下的讯息，追踪者迷失在了雾气笼罩的森林间。高卢旧领，现维多利亚境内的克莱布拉松地区，天色渐暗，周围野兽嚎叫声不绝于耳。眼前这座不祥的古堡，是唯一的避难所。\n\n你推开了大门——烛火次第亮起，帐篷立在庭院正中。剧团帐篷前分发的传单这样写着：\n\n「此处驻演的剧团叫做『猩红剧团』。历史悠久，剧目优秀。但要观看他们的演出，需要遵守些许规则。」\n\n幕后，有人微笑着注视观众入席。"
 scr.1.a: "入席吧。开演之前，谁都是客人。"
 scr.1.b: "看清这些「规则」再做打算。"
 scr.2.t: "新剧目构思"
 scr.2.d: "剧作家把三份手稿摊在桌上，每一份都用干涸血色的墨水写成。《凯旋颂》——颂歌献给凯旋的皇帝；《湖中至宝》——至宝终究沉入林中浅湖；《一百零一日》——故事传了一百零一日，讲故事的人早已被处死。\n\n「团长问先排哪一出，」剧作家说，「他说......观众饿了。」"
 scr.2.a: "排演悲剧——让他们流泪。"
 scr.2.b: "排演喜剧——让他们遗忘。"
 scr.2.c: "排演编年史——让他们记住。"
 scr.3.t: "血钻低语"
 scr.3.d: "道具间深处挂着「血钻」的旧戏服。猩红剧团覆灭的那一夜，它的主人以「血钻」之名高歌，随后亲手将匕首送进了老师的心脏。\n\n学徒们发誓今晚听见了它的低语：「戏还没有演完。」\n\n而幕后，老师的声音一如既往地温和：「钻石的光泽从未黯淡。它只是......在等一具新的嗓子。」"
 scr.3.a: "让血钻重返舞台。"
 scr.3.b: "有些戏服，就该永远挂在道具间里。"
 scr.4.t: "酒神的邀请"
 scr.4.d: "「于是有人在夜的怀抱中行走，于是有人在篝火前分享琼浆——」\n\n团长用同一只酒瓶斟满两只高脚杯。「旧舞台之神索要祭品，」他把其中一杯递给你，「我只要求参与。喝下它，整个世界都会成为我们的剧场。下台之后，演出继续。」"
 scr.4.a: "一饮而尽。"
 scr.4.b: "把酒洒在地上——作为祭奠。"
 scr.5.t: "高卢的灰烬"
 scr.5.d: "克莱布拉松地区接收计划草稿：考虑到该地区先前的抵抗与破坏程度，各公爵对这里兴趣缺缺。根据惯例，先划归领土接壤的公爵代为管理。\n\n「猎物吞下猎手......我的太阳染满鲜红......家在哪里？家在......哪里？」——子爵夫人的临终梦呓仍在古堡里游荡。\n\n「我们首先是演员，」唱诗班长说，「但在成为演员之前，我们是高卢人。」"
 scr.5.a: "收起灰烬——它们会再次燃烧。"
 scr.5.b: "让风保管它们。记忆已经足够。"
 scr.6.t: "血钻祭坛之夜"
 scr.6.d: "火把环绕着祭坛石。白衣的教师手持教鞭，以那抹温柔而可怖的微笑扫视跪着的学徒们。\n\n「你需要在脑海中构想下刀的位置和角度。想想我们已经排演过的段落——你一直表现得很好，只差这一段。」\n\n「疼痛是记忆的载体。今晚，我们开始最后一课。」"
 scr.6.a: "让最后一课开始。"
 scr.6.b: "体格好的几个，另有用场。"
 scr.7.t: "与傀影的对话"
 scr.7.d: "一只双尾黑猫钻过帐篷的门帘，声音错落着响起，像一种诡异的重唱：「说实话，我更喜欢『傀影』......虽然寓意并不怎么好，但它是你自己取的名字。」\n\n黑衣的身影随后而入，琥珀色的瞳孔望着团长那把空椅子。「我杀过老师一次。那不够。所以告诉我——他现在在写什么戏？」"
 scr.7.a: "「与我同行，学生。血钻，该磨利刀锋了。」"
 scr.7.b: "「只是聊聊，老朋友。只是聊聊。」"
 scr.8.t: "万物的归宿"
 scr.8.d: "最后的排练结束了。团长站在一座用破碎国家的残骸搭成的舞台上，向寂静的观众席致意。\n\n「女士们，先生们。最后一出戏没有幕间休息，没有返场，也没有活下来的评论家。这一次帷幕落下时......它落在万物之上。」\n\n他鞠躬。烛火尽数熄灭。某处，一位观众永远地鼓着掌。"
 scr.8.a: "悲剧完成了。他终于可以——瞻仰。"
 scr.9.t: "万物的庆典"
 scr.9.d: "今天没有征服的旗帜。广场上挂满了灯笼，酒水自由流淌，剧团有史以来第一次免费演出。悲伤本身在前排落座——它哭泣着，也起舞着。\n\n「戏剧结束了，」团长在灯火中宣布，面具闪闪发亮，「庆典还没有。」"
 scr.9.a: "愿庆典永不散场。"
 scr.10.t: "凯旋"
 scr.10.d: "最后一幕，名为「登台致礼」。\n\n旧帝国的战鼓再次擂响——这一次由游吟诗人执槌。克莱布拉松的城墙上，高卢的旗帜迎着晨风升起；旗下，猩红剧团向一个忘记了如何鼓掌的民族鞠躬谢幕。\n\n「让我们齐唱颂歌，庆祝皇帝凯旋！」\n\n「皇帝万岁。高卢万岁。」——而新的剧目，才刚刚开演。"
 scr.10.a: "为了高卢！为了舞台！"
 ########################
 # 事件链：旧军团的加演
 ########################
 scr.11.t: "花名册上的旧名字"
 scr.11.d: "舞台监督把一本厚册子搁在琴盖上。封皮是用旧军旗改的，弹孔还在原来的位置。\n\n「三百七十二名军官，都在服役年纪。六十四户贵族，还不肯在巡演公告上署名。」他用指节敲了敲册子，「抵抗已经散场了。可这些人还活着——活着，就不算散场。」\n\n「团长说，戏要演给活人看。」他翻开第一页。第一行那个名字，所有高卢的孩子都会念：吉尔贝·拉斐特元帅，四十二年兵役，三十七处旧伤。\n\n「所以先给旧军团上一课。上什么课，您定。」"
 scr.11.a: "先审最有名望的那一个。"
 scr.11.b: "不必审。把家眷请进包厢。"
 scr.11.c: "散场。把这本册子烧了。"
 scr.12.t: "公开审判，第一幕"
 scr.12.d: "剧场被改成了法庭：被告席立在舞台正中，追光从旧吊点落下来，观众席卖的是站票。\n\n拉斐特穿着那身补过肘部的旧军服走上台。控状共十一页，他只念了一句：「第一高卢集团军，吉尔贝·拉斐特，四十二年。」\n\n「签名吧。」剧团长把《巡演效忠册》推过去，笔里灌的是酒。「签了，你的兵明天就换上新的幕布继续开拔；不签——今晚我们正好缺一场谢幕。」\n\n台下有人在低声念那个名字，一遍，又一遍，像在喊安可。"
 scr.12.a: "让他的兵团替他签。把他立成我们的招牌。"
 scr.12.b: "不签就枪毙。谢幕正缺一个开场。"
 scr.12.c: "让他回家。告诉他是女儿替他签的字。"
 scr.13.t: "没有谢幕的枪声"
 scr.13.d: "枪声排在开场铃之前。为了声学效果，乐队被撤走了，所以那几声响得格外干净。\n\n血溅上第一排的空座位，舞台监督仔细地用幕布把它盖住——那一段不在节目单上。\n\n第二天，广场的石头上添了许多新刻的名字，粉笔字很快被人拓下来，传抄成一本书。深夜里仍有连队按旧番号点名，点到第七十一个名字时，全连一起答到。\n\n「他的最后一课演完了。」唱诗班长说，「可观众不肯散场。」"
 scr.13.a: "把这段剪进正剧——它已经是我们的了。"
 scr.14.t: "返场的老将军"
 scr.14.d: "海报上是他：旧军服、勋章、十字绶带，底下一行小字——「与新舞台同行的老近卫军」。印刷厂连夜印了四万张，从林贡斯一直贴到诺曼底。\n\n他被领到台上念稿子，声音很稳，稳得像是有人在替他说话。念完，台下先静了一息，随即爆出一场他此生没有受过的欢呼。\n\n他的兵团照原番号开拔了，只是旗角多了一道红。老兵们什么都没说，从此行礼之前都要先看一眼他的后背。\n\n「完美的演出。」剧团长鼓掌，「他连背叛都演得像是忠于自己。」"
 scr.14.a: "笔留给他，幕布留给我们。"
 scr.15.t: "高卢的和解"
 scr.15.d: "他被放回府里。门厅的墙上裱着一页纸：《巡演效忠册》上那一行签名，是他女儿的笔迹。\n\n她至死不肯落笔。那行字是摹的——摹到第九遍才像。舞台监督把前八张废稿一并裱在旁边，标题写着《高卢的和解》。\n\n剧团把这面墙做成巡展的第一站。贵族院跟着在整册上签了名，签得很整齐。此后每一场他都在座，坐在第一排，笑得比任何演员都标准。\n\n「他再没说过一句话。」剧作家在笔记里写，「观众却一致认为，他是这里最好的演员。」"
 scr.15.a: "笑就够了。观众分不出真假。"
 ########################
 # 超事件
 ########################
 scrse.1.t: "酒神的大陆巡演"
 scrse.1.d: "旧世界的帷幕在高卢的废墟上落下，却没有一片掌声属于落幕本身。剧团长摘下披风，从那座被夷为平地的旧城一路而行——林贡斯的碎砖成了他脚下的露天舞台，凯旋门的残柱立起新的花环。\n\n曾经不可一世的共和高卢，如今被一只酒杯轻轻收进了戏箱。传单飞掠过每一座移动城市的广场：今夜，酒神巡演大陆。\n\n「旧世的神明早已散去。」他在聚光灯下斟满琼浆，「而新的神灵，需要一个开场。」"
 scrse.1.a: "§T举杯吧——新神的巡演，刚刚开始§!"
 SCR_super_event_1_title: "酒神的大陆巡演"
 SCR_super_event_1_quote: "\"旧世界的神早已死去，今晚祂借我们的喉咙与杯盏，重新登台谢幕。\"\n——猩红剧团，大陆巡演公告"
 SCR_super_event_1_close: "§T旧世新神，高卢倒影§!"

 # 剧团招聘中！决议
 SCR_recruit_vanguard: "剧团招聘中！·近卫军之锋"
 SCR_recruit_vanguard_desc: "台下缺人，台上缺兵。告示贴出去：招募近卫军之锋——十二个摩托化步兵团带一个工兵连，管饭，管装备，管谢幕。"
 SCR_recruit_vanguard_tt: "在§Y首都§!当场开出 §G1§! 个人员、装备、经验全满的「近卫军之锋」师。需先完成国策「军乐」。"
 SCR_recruit_dolls: "剧团招聘中！·颂乐人偶"
 SCR_recruit_dolls_desc: "提线人偶连的老把式们说：会翻跟头的傀儡，也得会翻山。八队山地步兵、工兵与火炮各一连，绳线握在剧团手里——山再高，幕布一拉就到。"
 SCR_recruit_dolls_tt: "在§Y首都§!当场开出 §G2§! 个人员、装备、经验全满的「颂乐人偶」师（8山地步兵团+工兵连+火炮连）。首次招募将顺带补齐山地步兵训练。"
 SCR_dyn_gaul_gaul: "高卢，高卢！"
 SCR_dyn_gaul_gaul_desc: "「让我们齐唱颂歌——皇帝万岁，高卢万岁！」战争时期的所有国策加成，都汇进这一声呐喊。"
 SCR_dyn_gaul_gaul_tooltip: "§G高卢，高卢！（战时终幕大BUFF）：完成「第二次四皇会战」分支国策即可逐级叠加——陆军攻击、防御、士气与战争支持度随主变量提升；征兵能力、可招募人口、稳定度、政治点数获取、建造速度、工厂最高效率与人口增长随辅变量提升。§!"
 SCR_morale_high: "士气正盛"
 SCR_morale_high_desc: "梦是假的，我们士气正盛。旗还没有倒，戏就没有散场。"
 SCR_manmade_originium_storm: "人造源石风暴"
 SCR_manmade_originium_storm_desc: "人为引爆的源石尘暴吞没了割让的每一寸土地。军队在风暴里组织度归零、寸步难行，人口在尘埃中凋零——这不是胜利，是葬礼。"
 scrse.2.t: "源石风暴预警"
 scrse.2.d: "警报不是从天上来的，是从地里长出来的。\n\n源石熔炉烧到最后一天，炉壁裂开的那道缝，成了整片大陆的天空。灰白色的风暴从高卢边境升起，像一堵会走的墙，把城市、军旗、剧院和没演完的戏，一并卷进了幕后。\n\n林贡斯的钟声停了，四皇的军队也停了。所有的地图在同一夜作废——这片土地从此只剩一个名字：焦土。\n\n「都记下来。」有人在风暴里喊，「这就是我们做过的那个梦。」"
 scrse.2.a: "§R散场吧——风暴不谢幕，观众不留座§!"
 SCR_super_event_2_title: "源石风暴预警"
 SCR_super_event_2_quote: "\"我们做过一个梦。梦里是一片焦土。现在，请大家和我们一起，把它做完。\"\n——猩红剧团，最后一次演出公告"
 SCR_super_event_2_close: "§R全剧终§!"
 scrse.3.t: "高卢复国"
 scrse.3.d: "三色旗又升起来了。旗是新的，旗杆上的钉孔是旧的，每一颗都记着一个没能回家的名字。\n\n剧院的乐队第一次不奏谢幕曲，奏的是国歌。台下坐着士兵、农夫、遗孀和演员，他们互不相识，却在同一个音符上同时站了起来。\n\n「这一幕我们排了很久。」剧团长在侧幕低声说，「久到快要忘了——它原本是谁的剧本。」"
 scrse.3.a: "§T让旗留下——这一次，它盖住的是我们自己§!"
 SCR_super_event_3_title: "高卢复国"
 SCR_super_event_3_quote: "\"历史从不重复，除非有人替它把台词重新写好。\"\n——猩红剧团，复国之夜演出记录"
 SCR_super_event_3_close: "§T历史重现？§!"

 # ==================================================
 # 重塑高卢之魂 — 吞并高卢后的州级灵魂改造
 # ==================================================
 SCR_remake_soul_category: "重塑高卢之魂"
 SCR_remake_soul_category_desc: "布景拆了重修，城墙重修了又拆，只剩最后一块幕布还没换过——高卢人自己的脑子。剧团说：不必用刺刀，给他们看更好看的东西，他们会自己走下台。"
 SCR_blind_resistance: "清醒者的盲目顽抗"
 SCR_blind_resistance_desc: "他们看得清剧团的每一处破绽，也正因为看得清，才死活不肯承认台上演的是真的。于是抵抗成了默剧：砸自己的犁，停自己的车床，一天天下不来地、出不了货。"
 SCR_drunk_on_slaughter: "陶醉于屠杀"
 SCR_drunk_on_slaughter_desc: "血溅在台前，比溅在台上好看。当第一个高卢人学会为陌生人的死鼓掌，这块土地就不再需要宪兵了——它需要的是门票。"
 SCR_drunk_on_lust: "陶醉于肉欲"
 SCR_drunk_on_lust_desc: "剧院改成了浴场，广场改成了长桌，谈论的话题从「我们曾是谁」换成了「昨夜是谁」。人一旦尝过好日子，就不肯再为抽象的东西去死。"
 SCR_drunk_on_obedience: "陶醉于服从"
 SCR_drunk_on_obedience_desc: "跪下去的人不必再思考，也不必再开工。他们把双手恭恭敬敬交了上去——连同那双手本来能造出的一切。"
 SCR_beauty_of_blood: "鲜血之美"
 SCR_beauty_of_blood_desc: "「血是最便宜的颜料，也是最耐久的一种。」团长把刷子递过去，「今晚给一州上底色。」\n\n§Y效果：§!人力 §R-20,000§!、基础稳定度 §R-1%§!；随机挑一块带有「清醒者的盲目顽抗」的地区，改为「陶醉于屠杀」（地区可用人力-20%）。\n\n§R启用条件：本国仍有地区带着「清醒者的盲目顽抗」。可反复执行，直到清醒者耗尽。§!"
 SCR_beauty_of_blood_tt: "随机一州：§Y清醒者的盲目顽抗§! → §Y陶醉于屠杀§!"
 SCR_beauty_of_debauchery: "淫堕之美"
 SCR_beauty_of_debauchery_desc: "宴会从黄昏摆到下一个黄昏，没有人记得散场。欲望是最忠诚的观众——它从不要求剧情。\n\n§Y效果：§!人力 §G+20,000§!、基础稳定度 §R-3%§!；随机挑一块带有「清醒者的盲目顽抗」的地区，改为「陶醉于肉欲」（地区可用人力+20%）。\n\n§R启用条件：本国仍有地区带着「清醒者的盲目顽抗」。可反复执行，直到清醒者耗尽。§!"
 SCR_beauty_of_debauchery_tt: "随机一州：§Y清醒者的盲目顽抗§! → §Y陶醉于肉欲§!"
 SCR_beauty_of_puppet: "傀儡之美"
 SCR_beauty_of_puppet_desc: "提线术最难的从来不是手，是让人心甘情愿把手举起来。高卢人学得比谁都快——他们甚至还替操纵者鼓掌。\n\n§Y效果：§!人力 §G+100,000§!、基础稳定度 §R-10%§!；随机挑一块带有「清醒者的盲目顽抗」的地区，改为「陶醉于服从」（地区可用人力+100%、地区可用工厂数量-50%）。\n\n§R启用条件：本国仍有地区带着「清醒者的盲目顽抗」。可反复执行，直到清醒者耗尽。§!"
 SCR_beauty_of_puppet_tt: "随机一州：§Y清醒者的盲目顽抗§! → §Y陶醉于服从§!"

 # ==================================================
 # 猩红剧团的大陆巡演 — 六站巡演、血腥狂欢节与巡演见闻
 # ==================================================
 SCR_continent_tour_category: "猩红剧团的大陆巡演"
 SCR_continent_tour_category_desc: "高卢的舞台太小了：装不下剧团的野心，也快装不下这么多观众。既然旧大陆不肯来看我们，那就把戏台搬到他们家门口去——每座城市谢幕时，都会留下一样东西。"
 SCR_bloody_carnival: "血腥狂欢节！"
 SCR_bloody_carnival_desc: "鼓声不停，就没有人回去上工。整整一年，这条街只产掌声，不产兵。"
 SCR_bloody_carnival_tt: "在目标国随机一个地区制造 §Y血腥狂欢节！§!：当地可用人力 §R-100%§!，持续 §Y365§! 天。"
 SCR_tour_in_vic: "在维多利亚帝国进行大陆巡演"
 SCR_tour_in_vic_desc: "雾都的观众肯为一场戏排队三条街，也肯为同一场戏在报纸上吵三个月。\n\n§Y效果：§!在维多利亚帝国统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「我早就是高卢人了！」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且维多利亚帝国仍然存在。§!"
 SCR_tour_in_clb: "在哥伦比亚联邦进行大陆巡演"
 SCR_tour_in_clb_desc: "哥伦比亚的银行家买票从不问剧情，只问版权。\n\n§Y效果：§!在哥伦比亚联邦统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「金融权贵相逢恨晚」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且哥伦比亚联邦仍然存在。§!"
 SCR_tour_in_yan: "在大炎进行大陆巡演"
 SCR_tour_in_yan_desc: "大炎的海关最懂戏：每一箱道具都要开箱验看，每一件戏服都要登记造册。\n\n§Y效果：§!在大炎统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「大炎全面封杀高卢影像制品」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且大炎仍然存在。§!"
 SCR_tour_in_urs: "在乌萨斯进行大陆巡演"
 SCR_tour_in_urs_desc: "乌萨斯有四个军区、两处审查机构，以及一种谁也说不清的耐心。\n\n§Y效果：§!在乌萨斯统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「乌萨斯乱上加乱」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且乌萨斯仍然存在。§!"
 SCR_tour_in_ltn: "在莱塔尼亚进行大陆巡演"
 SCR_tour_in_ltn_desc: "莱塔尼亚的学院先写三千字批判高卢的和声，再买空首演的票。\n\n§Y效果：§!在莱塔尼亚统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「音乐无国界」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且莱塔尼亚仍然存在。§!"
 SCR_tour_in_src: "在叙拉古进行大陆巡演"
 SCR_tour_in_src_desc: "叙拉古的狂欢节有自己的日程表，外来剧团只能排在配菜那一栏。\n\n§Y效果：§!在叙拉古统治区内随机挑选一个地区，使其获得 §Y365§! 天的地区修正 §R血腥狂欢节！§!（当地可用人力-100%），并触发事件「狂欢节的配菜！」。\n\n§R启用条件：已完成国策「高卢先锋国」，花费 §Y50§! 政治点数，冷却 §Y90§! 天，且叙拉古仍然存在。§!"
 scr.20.t: "我早就是高卢人了！"
 scr.20.d: "巡演第一站的谢幕还没完，前排一位勋爵就站起来，用跑调的加利亚语喊：我早就是高卢人了！他确实买了三张票——其中两张是替他牵来的那匹马买的。\n\n剧团的翻译在后台记笔记：「维多利亚人说这句话时，喉咙往左边拐。这门学问比高卢语法好学多了。」"
 scr.20.a: "让雾也跟着鼓掌。"
 scr.21.t: "金融权贵相逢恨晚"
 scr.21.d: "哥伦比亚的银行家们包下整场夜戏，散场后把团长请进贵宾厅。他们不问剧情，只问版权、票价，以及「亡国」能不能做成可交易的凭证。\n\n「你们卖的是感动，」一位董事敲着桌子，「我们买的是流水。这单生意怎么做不成人？」\n\n团长喝完那杯不属于他的酒，回答：加一个中场休息，票钱翻倍。全场起立鼓掌。"
 scr.21.a: "签。为什么不签。"
 scr.22.t: "大炎全面封杀高卢影像制品"
 scr.22.d: "巡演船还没靠岸，大炎的公文先到了：查禁一切高卢影像制品，含唱片、海报、剧照，以及「疑似高卢口音的吟唱」。一箱道具戏服被海关扣成了违禁宣传材料。\n\n后台的演员们决定改演哑剧。三日后新的禁令也到了——哑剧被认为「比有声的更像暗号」。"
 scr.22.a: "那就演给他们看，用不出声的那种。"
 scr.23.t: "乌萨斯乱上加乱"
 scr.23.d: "乌萨斯的巡演批文送回来时，四个军区各自填了四个日期，两处审查机构互相吊销了对方的许可。剧团照常在广场开演：演到一半，两支巡逻队为「谁有权解散集会」动起手来，观众原地不动，掌声全都给了斗殴。\n\n散场后账房很满意——这是全程唯一一场没有人提前退场的演出。"
 scr.23.a: "乱处有票，接着演。"
 scr.24.t: "音乐无国界"
 scr.24.d: "莱塔尼亚的学院派在报纸上写了三千字，论证高卢音乐「和声上是堕落的，节奏上是野蛮的」。写下那三千字的同一批人买空了首演的票，还要求加演。\n\n「音乐无国界。」老教授在采访中说，「但审查有。请把加演的乐谱送到我的私宅，不要寄到学校。」"
 scr.24.a: "把乐谱寄到私宅。"
 scr.25.t: "狂欢节的配菜！"
 scr.25.d: "叙拉古的狂欢节早有自己的日程，剧团的巡演被排在最后一位——按当地说法，压轴的甜点之后上一盘咸的。「配菜也行，」团长说，「配菜有人吃，主菜常常没有。」\n\n那晚有三家报社收到匿名捐款，两笔旧账被陌生人结清，一位教父点了全场最贵的酒，然后送给了隔壁桌的宪兵。"
 scr.25.a: "配菜也要演到明早。"
 scr.28.t: "加冕，或谢幕"
 scr.28.d: "终幕的灯已经亮起。剧作家把一份没有徽记的建国文书放在桌上，旁边是那面早就裁好的旗。\n\n签下它，猩红剧团从此不再只是一个剧团：国号改为「高卢先锋国」，执政团接管舞台，卢西恩·德·高卢将替高卢把戏演完。\n\n搁置它，剧团就继续巡演下去——没有人会知道这面旗曾经被裁好。\n\n台下没有观众，只有您自己。这一回，剧本不替您做决定。"
 scr.28.a: "签下名字。自今而始，高卢先锋国。"
 scr.28.b: "把文书留在桌上。剧团还没有谢幕。"
 SCR_vanguard_state_accept_tt: "§Y成立高卢先锋国：§!国号改为「高卢先锋国」，执政党转为先锋国执政团，卢西恩·德·高卢出任国家领袖；并向世界发布复国新闻。"
 SCR_vanguard_state_decline_tt: "§Y维持现状：§!保留「猩红剧团」国号与现行政体；获得 §Y75§! 政治点数与 §G5%§! 稳定度。"

