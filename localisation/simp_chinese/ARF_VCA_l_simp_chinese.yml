#事件

 event_vca.1.t: "职责……"
 event_vca.1.d: "从拿到这个骑警警徽开始，格拉尼就在期待着这一天的来临。不是找钱包，不是替忘带钥匙的居民开锁，她今天终于接到一个正式的任务，做一件一个骑警应该做的事——参与押运犯人。这倒也不是说在她心中开锁之类不是一个骑警该做的事，只是，她终于可以做她一开始就梦想着去做的事。\n\n“受到武装小队袭击，人手不足，第三小队请求支援！”\n“二队情况如何？分两个去紧急支援！撑到总部人手来！”\n“是格拉尼那队……她、这种任务就不该找……”\n\n押送犯人的车队在突如其来的攻击下紧急停下，即便已经做好了准备，但对面的人数还是超出了骑警们的预期。格拉尼在押运车背后保持着防守姿势，犯人还在车厢里被队友控制着。按照规矩车内的队友也绝不可能再打开车门，犯人的情况不必担心。那接下来，就是尽力拖延停火时间，等待支援。\n\n只是刚才上司的话让格拉尼有些生气。虽然这类的话语她已经听过太多次，但今天是她第一次接到了正式的任务，格拉尼原以为这是对她能力的认可。现在看吗……才意识到原来并非如此。\n\n“你就待在这里守着车，等我们处理好就行了。”格拉尼看着自己的两个前辈拿着武器冲着对面射击，他们解决掉了一个、两个…….可敌人却从掩体后面冒出来更多，嘴里叫着“只来了两个！”便冲了过来。前辈和队友突然倒下，他们把手从按压着的伤口上拿开，格拉尼看到了满掌的鲜血。停下的车队是很好用的掩体，格拉尼躲在其中发起了数次冲锋。队友们没有抱以希望，直到他们看到她击溃了敌人的队形，他们被这个娇小的女孩一个个拖回了安全的区域。对面甚至暂时地退避了回去。\n\n后续来支援的小队接过了押送犯人的任务，格拉尼护送负伤的前辈和队友前往了附近的医院接受救治。她已经在逐渐改变人们对她的看法了，虽然她从来没有否定过自己，但是得到他人的认可，也是一件令人开心的事。"
 event_vca.1.a: "格拉尼擦了擦肩膀上的警徽，它虽在先前沾染灰尘，但现在仍再度闪闪发亮。"
 event_vca.2.t: "……褪色"
 event_vca.2.d: "从拿到这个骑警警徽开始，格拉尼就在期待着这一天的来临。不是找钱包，不是替忘带钥匙的居民开锁，她今天终于接到一个正式的任务——镇压……罢工工人？长久以来，格拉尼将“保家卫民”视为自己的职责，相信每一天的辛勤工作能够换来更美好的明天。可如今，她的所见所闻却打碎了这如镜花水月般的美好幻想。\n\n“过去的事情……就让它过去吧……”月光透过窗户，洒在格拉尼的脸上，可却衬托出了她埋在深处的那丝忧伤。与那些土生土长，有些族谱甚至能追溯到古阿斯兰王的维多利亚人不同，格拉尼祖上是从卡西米尔移居而来的，而这也使她有着不同于身边许多人对于“荣誉”与“正义”等品德的追求。\n\n望着镜中的自己，格拉尼想起了刚入职的时候。相比与她的老前辈们，格拉尼那时不仅资历小，还面临着诸如身材单薄、个子矮小等等硬伤。即使勉力通过选拔加入了骑警队伍，也没少面临同事们的调侃和嘲笑。他们让格拉尼去做一些小事，而拒绝她参与正式的执法行动。因此，她在那时所执行的工作多是些琐碎的社区小事。它们虽显然不能助力格拉尼升迁与成名，可她依旧主动接过了这些繁杂工作，为那些处于困难中的人寻求解决办法。格拉尼因此得到了诸多市民的表扬信，以及更珍贵的，属于人们的信任……\n\n……可如今呢？她不知道这是否只是她心中的不安所致，但在那件事过去之后，今日的巡逻，甚至是下班回家的路上，她都有一种古怪的感受——好像，周边市民们眼中对她的敬意与亲切感都已不见，转而的则是不安、畏惧、甚至憎恨。\n\n她依然直视着镜中的自己，恍惚之中，那倒影仿佛使双手背过身去，而非如现实中的她一般将手搁置于洗手台上。她还听见了声音，那似乎是劝说她放下过去的善言，又似乎是诱引她滑向深渊的恶神之言……霎那间，一切仿佛都在天旋地转，格拉尼的眼前似乎如走马灯般播放一个个场景。她如同镜中的自己一般收起双手，可并未将其置于背后，而是缓缓举起……却只见一片血的殷红。\n\n格拉尼自床铺上惊醒，她这才意识到那不过是场噩梦。血是假的；声音是假的；卫生间也是假的……可那“正式的任务”，却永远都真实发生过。"
 event_vca.2.a: "谁又能替您洗净双手血腥？"

 event_vca.10001.t: "血脉"
 event_vca.10001.d: "相比于“曾经”作为维多利亚的骄傲，一度是维多利亚陆行舰舰队旗舰的“全能”号，“荣光”号作为一艘崭新的陆行舰，却诞生于老国王被绞死后的那个混乱年代。舰上的设备与装潢，与“全能”号截然不同，如果不是在直升机上亲眼确认过，格拉斯哥帮的女孩们都以为自己登上的是一艘豪华客运舰。\n\n“所以，卡铎尔呢。”维娜扭头看了看身旁众人，自己的同行者似乎越来越少，“希望他不要恨我。”\n\n“你的希望屁用没有。”因陀罗伸了个懒腰，“维娜，你作出这个决定时就应该想到结果。”\n\n“所以，开斯特公爵呢。我还挺想亲眼看看这个维多利亚最有权势的人。”摩根用嘴里的口香糖吹了个泡泡，由于这不是专门的泡泡糖而只是口香糖，所以完全没吹起来。\n\n正当几人你一言我一语地聊天时，守在门前的卫兵轻柔地打开了舱门。玛丽·开斯特·维多利亚走进了安置维娜的这间会客室，身后跟着其他政要。一时间，众人被这气氛吓得不敢出声。\n\n“不需要那么拘谨，孩子们。你们都是维娜的……朋友，对吧。”开斯特公爵带着慈祥的微笑，径直走到维娜的身旁坐下，“血缘关系上，我是维娜的姑姑，你们就当到她的姑姑家来作客，就像对待普通人一样对待我们就好。”\n\n“路易斯姑妈有事，不能从开斯特城赶来。戴安娜阿姨在军营里，等会儿她就到了。”开斯特公爵如同唠家常一般，念出了蒙格雷夫勋爵和库尔塞勒公爵的名字，却让格拉斯哥帮的女孩们感到疏离。她们不约而同地看向维娜的脸。\n\n“姑姑，承蒙您照顾。”维娜的脸上是平和的微笑，平静得简直不像其他人记忆里的她。也许她们从来没有真正认识“推进之王”。这令格拉斯哥帮的众人感到一丝恐惧，以及凄凉。"
 event_vca.10001.a: "身不由己。"
 event_vca.10002.t: "原生家庭"
 event_vca.10002.d: "“所以，这就是那把剑？”\n\n马库斯·邦德爵士吐出一个烟圈，看着眼前坐在沙发上的三个盛气凌人的女人，挑了挑眉毛，“尼古拉斯送到我手上的就是这个东西。要是不信，你们把这把剑带上‘荣光’号，不就完了么？”\n\n“还是说，女士们，你们关心的压根不是这把剑？”邦德爵士把雪茄在烟灰缸里按灭，“反正，之前我得到过承诺，把那个姑娘带回来并不是必须的任务。所以我的人不会受到任何惩罚。”\n\n“没你的事了，爵士，请回吧。”开斯特公爵双手抱在胸前，叹了口气。邦德爵士就像是听到下课铃的孩子，转身走出了房间，连行礼都忘了。\n\n“我说过了，那个孩子不像她的父亲。虽然优柔寡断了一点，但是她的自我意识严重过剩，有太多自己的想法。”戴安娜·库尔塞勒走到酒台旁，随手倒出一杯威士忌，一饮而尽，“她爹是另一个极端。对与他说话的最后一个人言听计从，而真正执行起来又过分残暴……”\n\n“戴安娜，你不用每次都把话题绕回阿利斯泰尔，他早死了。”路易丝·蒙格雷夫翻了个白眼，把视线放回茶几上那把被破布裹着的剑，“所以，这可是一次不小的挫折，玛丽。我要对我们的所有外国盟友解释这一情况。”\n\n“维娜表明了她的态度。”开斯特公爵沉默了片刻，在心里把自己做错了什么全数过了一遍，“她交出国剑，说明她希望战胜萨卡兹。而她拒绝来到开斯特城，说明她不愿意受人摆布。”\n\n“我们本来就打算在背后摆布她。”戴安娜·库尔塞勒不知何时又倒出一杯酒，她摇晃着杯子里的威士忌，也坐回沙发上，“所以说她自我意识过剩。”\n\n“她想必会投靠温德米尔一方。到时候，我们还可以宣称是温德米尔公爵在背后操控她。毕竟议会在我们手上，大部分贵族和金融资本也都在我们这边。”路易丝·蒙格雷夫推了推眼镜，“只是我们需要更多的游说和斡旋。”\n\n玛丽·开斯特·维多利亚揉了揉太阳穴，她很久没有这么头疼一件事。"
 event_vca.10002.a: "“但她是个阿斯兰。”"
 event_vca.10003.t: "囚笼"
 event_vca.10003.d: "亚历山德莉娜·维娜·维多利亚的加冕仪式于开斯特城郊外的开斯特城堡内举行，这座城堡在历史上就一直作为王室的行宫被使用。巨幅的维多利亚国旗取代了阿斯兰王室和开斯特公爵的纹章，成为城墙上的绝对主角。显然是想要在这一困难时期强调团结。\n\n在伦蒂尼姆陷入混乱后，大部分王室财产都被开斯特公爵从城中撤走，因此使得加冕仪式能够用上大部分古老的器物，包括秩序圣球、“诸王之息”圣剑、黄金车厢等。唯一的缺憾便是先王头顶上的王冠下落不明，而王座无法带出伦蒂尼姆。\n\n仪式从游行开始，游行路线的起点为开斯特主教座堂，途径市政厅和开斯特皇家邮政大楼，最后进入城堡内部。作为对战争状态的强调，维娜选择了穿上骑士铠甲而不是雍容华贵的女王礼服，而这也导致她在黄金车厢内被热得头晕眼花。\n\n当维娜在开斯特城堡下车，她需要独自一人穿过被布置好的仪式场地，红色的地毯是标注好的路线。本地的唱诗班和交响乐团提供亘古不变的那几首曲子，维娜有些恍惚，她开始质疑自己的选择是否正确，但即使她在内心中产生了悔意，她也无处可去。毕竟现实不是言情小说，维娜不能逃离自己与这个国家的婚礼现场。\n\n开斯特公爵、蒙格雷夫勋爵和库尔塞勒公爵坐在最前排，她们的身边是托利党的议员。在维娜的强烈要求下，格拉斯哥帮的成员们被安排在坐席的另一边，她们是来陪维娜走完这一程的。不过在她们的身后，是来自乌萨斯、莱塔尼亚、炎国等等君主制国家的外交使节，变相说明了，她们是外人。\n\n接下来的仪式流程异常的繁琐，包括宣誓、涂油和加冕。涂油是维娜觉得最恶心的环节，听说这个油还是从萨尔贡弄来的，象征着阿斯兰王朝与萨尔贡的联系，但她只觉得滑腻。由于传统的王冠去向未知，开斯特公爵启用了存放在城堡宝库内的古代王冠，重量压得维娜脖子难受。\n\n仪式的最后，是臣民对坐在王座上的女王宣誓效忠并亲吻她的右手。维娜坚定地拒绝了让格拉斯哥帮的人上台的方案，最终是由开斯特公爵、蒙格雷夫勋爵和库尔塞勒公爵分别代表贵族、议会和军队执行了吻手礼。\n\n全部的仪式结束后，维娜头顶的古代王冠被摘下，换成了一个纯金制成的环形头冠。她在维多利亚国歌声中重新登上黄金车厢，在精心挑选的纯白色驮兽的牵引下前往她在城内的临时居所，一座被征用的紧邻市政厅的豪华酒店，并登上阳台接见欢呼的民众。"
 event_vca.10003.a: "她再也无法离开。"
