 event_vca.3.t: "计划审查"
 event_vca.3.d: "就在最近数周，原本在提斯敦市政府中不过是位小官员的埃尔斯忽然工作量暴增：先是大批难民涌入市区，后又是一系列令人心累的清查、统计与救济工作。因他过度实诚且肯干的处事风格，埃尔斯不幸地承担下了大多数无人肯干的脏活累活。无论是堆积成山的复杂文件还是亲临基层的复杂任务，他几乎尽全力地完成了一切目标。\n\n然而，现实却从未给过这位官僚半分仁慈。在一切似乎已经尘埃落定之时，上级却再度交给了他整理及审查住房建设计划相关文件，并将之传达至各层级工程部门的使命。本想着能够再度清闲下来的埃尔斯不得不重新将自己绑在办公桌前，一份又一份地整理那些不知为何竟如此杂乱无章的文件。\n\n“这糟心日子该什么时候到头啊……”当再次敲定一页预算报表的数字准确无误时，官僚不禁轻声嘟囔道。在数个昼夜的奋斗之下，他已经快要被官僚主义措辞和维多利亚式计量单位的换算式们搞疯了。但万幸，拜这几天的超负荷工作，他已经离最终完成差不了多远了。\n\n“建筑材料采购规范——连这玩意都要我来替着整理？”埃尔斯的自言自语中充满了嘲讽意味。“略过这段，跳过那些，然后……”随着埃尔斯在忽略了一大堆胡乱的内容后翻到了最后几页，一些相对他的工作而言总算可被称之为“有趣”的东西出现在了官僚的视线之中，那是份某企业集团关于承建包括提斯敦新住房区的投标文件。在正文的叙述之中，这家企业相当有自信地对其业务专业性与效率性大加自荐，并声称将保证工期绝无半分拖延，而工地上也不会出现任何足以耽误施工的意外事故。\n\n“那到底是个什么公司？才刚投标就夸下如此海口？”埃尔斯喃喃地质疑道。他停下了走马观花式的扫视，仔细在原本未曾细致读阅的文本中寻找答案，而结果显然不出其所料。"
 event_vca.3.a: "“这公司是位贵族的家族产业？那没事了。”"
 event_vca.3.b: "“政府竟然找了哥伦比亚大公司承包？真是不可思议！”"
 event_vca.4.t: "与凯熙品茗"
 event_vca.4.d: "“感谢您能邀请我来为国家出谋划策，公爵大人。”经济学家缓缓走入房间，向着开斯特公爵玛丽·开斯特·维多利亚致以标准的脱帽礼。\n\n“很好，凯熙先生。想必您一定有信心胜任这份工作。”开斯特公爵并未将视线转向经济学家那边，而只是自顾自地往红茶中加了些肉桂粉。“请坐，茶已准备妥当，想添的话可以按电铃叫仆人来。”\n\n“公爵大人，我想谈谈关于经济的问题。”在椅上坐稳还未片刻，凯熙便拾起了他的经济学知识：“事实上，在您的邀请之前，在下一直对我国政府所施行的经济政策有些与主流不同的见解——例如对伦蒂尼姆金融潮及其余波的应对措施……”\n\n“哦？金融潮的应对？我过去倒是看过您的一些相关研究。”公爵的插话稍稍打断了凯熙，但她随之又示意让经济学家继续话题。\n\n“……即便当年的‘金融潮’已近乎使国民经济完全崩盘，许多身居高位的所谓‘经济学家’却仍笃信财政保守主义与自由放任能够施展神迹，但却从未思考过政府在经济领域的真正意义，致使我国经济长久困于停滞乃至于倒退的泥潭之中。我在当年便已撰写过不少文章呼吁经济干预与公共工程，但却大多石沉大海，甚至多有遭到质疑。那些坚定的自由市场拥趸们在词汇上可是无所不用其极，他们直到洛泽维尔特——那位哥伦比亚的天才总统真正以干涉主义政策缔造出繁荣才肯封口。”当提到他在当年所遭受的攻击时，约翰·凯熙的语气显然有所加重。\n\n“因此，公爵大人，我对经济现状的建议和当年并未有太大差距：其一自然是国家干预的重要性，经济状况愈是萎靡不振，政府便愈应主动下场调控市场。例如基建工程、劳动岗位创造等等必不可少。其二则是改变财政方针，债务和赤字不但无罪，反而有功。国债发行应当扩大，以获取更多资本投入生产与消费扩张。而其三则在于‘开拓’，无论是向西方荒地在字面意思上的开拓，还是向谢拉格这样帝国势力范围内新兴经济体的投资‘开拓’，它们都将成为经济复苏的驱动力——如此政策在哥伦比亚早有实践。”\n\n“您的确是学富五车，凯熙先生。”开斯特公爵放下茶杯，脸上浮现起一丝笑容。“那么，就目前的战备状态，您又有何建议？”"
 event_vca.4.a: "一位不可多得的贤才。"
 event_vca.5.t: "工党与社会党间发生冲突"
 event_vca.5.d: "作为帝国议会内较为边缘的派系，各左翼政党相互间的关系却难以称之为融洽，甚至时有政治摩擦乃至于相互攻讦之事发生。就在数日之前，随着某位不知名社会党活动家在报纸上发布了谴责工党为“修正主义”，并呼吁“真正的工人政党”们一同团结起来，抵制与工党的任何合作并同其疏远。\n\n随着又一场左翼阵营之间的冲突变得愈演愈烈，一些工党议员开始攥文反击，并对社会党与共产党等极左翼政党所支持的“不可能主义”观点大加嘲讽，称其不过是一群空有理想而无实干，且将造谣与嘲讽他人视作政治斗争手段的“业余政治爱好者”而已。\n\n截至目前，随着舆论战线上的对抗愈发升温，这一原本只有寥寥几位政客在意的事件已经引来了愈发多的关注。两党高层皆对此事有所评价，而部分本与社会党-工党冲突并无多少关系的中间派与右派议员也涉足了这场冲突。但无论政客们如何看待此事，真正掌握最大政治权力的托利党中央却无任何动作。\n\n盲目地在其中一方选边站队显然不会是多么理智的行为——如此行动不仅会破坏托利党与其他政党间的关系，甚至可能引发议会内的相互不信任。相较站队而言，由托利党及玛丽·开斯特公爵本人进行调解是个较为理性的选择，但也不失变为“和稀泥”式策略的风险，因而不作任何干涉也被视作至稳之策。但在最终，开斯特公爵依然做出了她的选择。"
 event_vca.5.a: "隔岸观火，岂不妙哉？"
 event_vca.5.b: "还是应当尽我们所能地维护团结。"
