#国家精神
 NEL_Difficult_years: "六十四年苦难岁月"
 NEL_Difficult_years_desc: "七城联邦——亦可称之为奈德尔兰联省共和国，早已成为了这片大地上所有人的旧忆。它诞生于独立战争的风暴，崛起于四皇会战的前夕，最终陨落于科西嘉一世的溃败。\n在高卢帝国毁灭之际，作为高卢附庸的七城联邦也难逃被瓜分的命运。那时，巫王霍尔昏佐伦亲临七城，建立了一个残酷而暴虐的总督管辖政权。四十年时光一晃而过，在奈德尔兰族的不屈抗争和双子女王的开明革新之下，七城总督府在1078年正式解散，被立场更为温和的特别省政府所取代。\n然而，七城的苦难却并未结束。每时每刻，莱塔尼亚的政客、商人与将领都在贪婪地从这里掠夺资源，任何形式的武装独立运动也招致莱塔尼亚驻军的重拳打击。人们只能寄希望于监事官与改革家，希望这些位高权重的领袖能为七城带来新生。\n愿天主护佑七城，愿命运眷顾奈德尔兰。"
