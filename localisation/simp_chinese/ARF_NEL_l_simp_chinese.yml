#人物
 NEL_Prince_of_Orange: "奥兰治亲王"
 NEL_Prince_of_Orange_desc: "奥兰治亲王本名玛尔塔·冯·利乌多尔芬格，出身于莱塔尼亚的厄登赫尔大区。作为选帝侯家族中的次女，玛尔塔本无任何领地继承权，也从未享受过优渥的贵族待遇。然而，这段饱受冷眼的童年却磨炼了她的意志与能力，并在她心中种下了一颗名为“博爱”的思想之种。\n随着莱塔尼亚正式在七城地区建省，玛尔塔期待已久的机会终于来临。她向父亲提出请求，希望可以前往七城担任监事官一职。当然，家族此时正急于将玛尔塔调离本土，以求摆脱这颗离经叛道的“烫手山芋”。于是，玛尔塔监事官走马上任，成为了七城特别省的第二号人物。\n在七城的那段时光，玛尔塔精进学术、勤于政务。她既博取了双子女王的赏识，也赢得了七城民众的拥护。作为回报，白女王将“奥兰治亲王”的头衔赐予她，人民则带给她优秀的口碑与热烈的支持。\n尽管处处受到威廉公爵的排挤与家族亲戚的异见，但玛尔塔却从未向他们妥协一步。她坚信，只有大度放手、平等相待，方可守住帝国尊严，造福七城诸民。"
