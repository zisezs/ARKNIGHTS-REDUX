#政党名称
 FGL_despotism_party: "自由高卢军"

#人物
 FGL_Jacques_Pompidou: "雅克·庞皮杜"
 FGL_Jacques_Pompidou_desc: "雅克·庞皮杜，在四皇战争前只是一名少尉，但随着高卢的高级将领接连战死，当时还年轻的庞皮杜一路高升，最终在战争结束时，他已经成为了一名中将。作为狂热的民族主义者，庞皮杜拒绝向前来受降的莱塔尼亚军屈服，而是在一个夜晚率部出逃，在荒原流亡的日子里，庞皮杜与一股自由主义流亡者搭上了线，并带领他们一路走到了最后一块还打着高卢旗帜的土地，高卢属波利尔尼亚。由于再没有人比他的地位高，庞皮杜被推选为“高卢共和国”的临时总统，担负起把这些流亡者们带回祖国的重任。在一开始，庞皮杜是真的想过这回事的，但随着尤里卡战争打响，波利尔尼亚人民阵线的游击队将高卢属波利尔尼亚拆得支离破碎，这个从壮年流亡到老年的将军终于意识到，高卢复国只不过是他和其他老人的痴言妄语。"

#国家精神
 Loser_gathering_place: "失败者的聚集地"
 Loser_gathering_place_desc: "在高卢战败后，她的殖民地和她的本土一样，被胜利者们瓜分，唯有一个例外——高卢属波利尔尼亚，这里的总督坚决反对维多利亚的接管，最终通过与美拉尼西亚殖民领的交涉勉强获得了独立地位。之后，一队由庞皮杜将军率领的自由主义者从荡然无存的高卢本土来到了这里。他们计划着在这里建立一个自由高卢流亡政府，希望有一天能回到本土的家乡。不过，一群失去了一切的士兵、商人和小官员，又能在这个贫瘠的土地上做出什么呢？"
 The_time_to_wake: "梦醒时分"
 The_time_to_wake_desc: "尽管自由高卢做着光复本土的可怜的梦，但是现实并不会对他们温柔。前波利尔尼亚殖民地的大部已经被波利尔尼亚人民阵线占领，而缺乏生产线的自由高卢军无法获得像样的装备，也无法获得补员——控制区内的大部分原住民和殖民者后裔对复国大业根本无感，自由高卢军一开始寄托希望的国外援助也被证明是想屁吃。也许，梦终归有做完的那一次，然后再也无法入眠。"
