l_simp_chinese:

# ==============================================================================
#  大炎（YAN）战后国策树簇 —— 国策名称与空描述
#  名称来自用户提供的汉化文本；国策描述（_desc）与效果暂留空。
#  与 common/national_focus/YAN_postwar_shared.txt 同批生成。
# ==============================================================================

YAN_pw_dragon_entrust:0 "真龙托孤..."
YAN_pw_dragon_entrust_desc:0 "真龙弥留之际，将大炎与幼主一并托付朝臣。遗诏落定，朝野却未必服气。"
YAN_pw_daughter_of_yan:0 "大炎人民的女儿"
YAN_pw_daughter_of_yan_desc:0 "陈晖洁以近卫局之身走入朝堂。她不是真龙的血脉，却是大炎百姓看着长大的女儿。"
YAN_pw_dragon_is_mortal:0 "真龙亦凡人"
YAN_pw_dragon_is_mortal_desc:0 "真龙走下神坛，以凡人之身临朝。神性褪去，合法性第一次需要靠政绩证明。"
YAN_pw_infected_regent:0 "感染者摄政王？"
YAN_pw_infected_regent_desc:0 "让感染者入朝，是收编还是豪赌？朝野议论纷纷，矿场与街区先给出了答案。"
YAN_pw_return_longmen:0 "重返龙门之旅"
YAN_pw_return_longmen_desc:0 "龙门是炎国最像「未来」的城市。把那里的治理经验搬回京城，比任何奏章都直白。"
YAN_pw_medical_bureau:0 "设立医政司"
YAN_pw_medical_bureau_desc:0 "医政合一，药、疫、医者皆归一部。疫病退去的地方，人口与税基一同回来。"
YAN_pw_livelihood_project:0 "安居乐业工程"
YAN_pw_livelihood_project_desc:0 "先让人有屋住、有饭吃，再谈忠君爱国。"
YAN_pw_public_healthcare:0 "公共医疗保障"
YAN_pw_public_healthcare_desc:0 "医保铺到州县，疫病与工伤不再直接拖垮一户人家。"
YAN_pw_demon_experience:0 "魔族佬的好经验..."
YAN_pw_demon_experience_desc:0 "魔族在城市治理与源石工业上有一套。放下成见，先学能用的。"
YAN_pw_guard_reform:0 "近卫局改革"
YAN_pw_guard_reform_desc:0 "治安不能只靠京营。近卫局扩权、改制、下沉街区。"
YAN_pw_meet_underworld_king:0 "约见地下皇帝"
YAN_pw_meet_underworld_king_desc:0 "龙门的地下秩序有它自己的皇帝。朝廷要做事，绕不开这张桌子。"
YAN_pw_purge_censorate:0 "肃政院大清洗"
YAN_pw_purge_censorate_desc:0 "监察系统先烂，法度就无从谈起。肃政院内部先动刀。"
YAN_pw_rule_of_law:0 "法治即人治"
YAN_pw_rule_of_law_desc:0 "法条写得再漂亮，也要有人肯照着办。先把「人」管住。"
YAN_pw_court_charter:0 "新时代朝会章程"
YAN_pw_court_charter_desc:0 "朝会不再是谁嗓门大谁说了算。议程、记录、表决，一项项立起来。"
YAN_pw_court_balance:0 "朝中制衡者"
YAN_pw_court_balance_desc:0 "左右相、台谏、军府彼此牵制，才不至于再出一个独断的真龙。"
YAN_pw_rehabilitate:0 "平反冤假错案"
YAN_pw_rehabilitate_desc:0 "旧案重审，冤狱昭雪。放出来的不只是人，还有被吓住的民心。"
YAN_pw_suiling_reform:0 "岁陵改革"
YAN_pw_suiling_reform_desc:0 "岁陵不只是皇陵，也是源石与工造的命脉。把它从祭祀改造成产业。"
YAN_pw_dragon_power_act:0 "真龙权力法案"
YAN_pw_dragon_power_act_desc:0 "权力不再靠血统默认，而由法案逐条授予、逐条限制。"
YAN_pw_civilized_yan:0 "文明大炎人"
YAN_pw_civilized_yan_desc:0 "教化不是背经书，是让人知道什么该做、什么不该做。"
YAN_pw_law_abiding_yan:0 "懂法大炎人"
YAN_pw_law_abiding_yan_desc:0 "普法从州县学堂开始。百姓知道法，官吏才不敢乱用法。"
YAN_pw_heaven_omen:0 "天喟当明"
YAN_pw_heaven_omen_desc:0 "天喟之剑，当鸣则鸣。真龙托孤的阴影散去，新法接过了国祚。"
YAN_pw_garden_epiphany:0 "界园顿悟"
YAN_pw_garden_epiphany_desc:0 "界园一悟，军备的积弊与出路同时看清。旧制不能再拖。"
YAN_pw_yumen_talks:0 "玉门谈话"
YAN_pw_yumen_talks_desc:0 "玉门边军守了一百年。谈话不是寒暄，是把边军的经验写进国策。"
YAN_pw_civil_and_martial:0 "文韬武略兼备"
YAN_pw_civil_and_martial_desc:0 "将不能只懂打仗，文官也不能只懂案牍。"
YAN_pw_pingfeng_guard:0 "屏风卫普适化"
YAN_pw_pingfeng_guard_desc:0 "屏风卫的装备与编制不再专属京营，边军也能用。"
YAN_pw_to_frontier:0 "到边疆去！"
YAN_pw_to_frontier_desc:0 "把新兵、工匠与新政一起送到边关。边疆不是流放地，是前线。"
YAN_pw_defensive_defense:0 "守势国防"
YAN_pw_defensive_defense_desc:0 "大炎不先动刀，但每一道山口都要守得住。"
YAN_pw_stop_war:0 "止戈为武"
YAN_pw_stop_war_desc:0 "武备的终点不是征伐，是让战争不必发生。"
YAN_pw_for_the_people:0 "无非一念为苍生"
YAN_pw_for_the_people_desc:0 "一念之间，先想苍生，再想朝廷。"
YAN_pw_clear_roads:0 "肃清驰道祸害"
YAN_pw_clear_roads_desc:0 "驰道是国脉，也是匪患与贪腐的温床。清道即清政。"
YAN_pw_yan_land:0 "炎土归炎"
YAN_pw_yan_land_desc:0 "失落的炎土一寸寸收回。土地回来，人才回来。"
YAN_pw_poor_scholars:0 "寒门贵士"
YAN_pw_poor_scholars_desc:0 "门第不再是唯一的梯子。寒门子弟也能凭本事入仕。"
YAN_pw_punish_corruption:0 "惩戒贪官污吏"
YAN_pw_punish_corruption_desc:0 "吏治不清，军备与民政都是空谈。先惩贪，再谈其他。"
YAN_pw_mountain_high:0 "岳不厌高"
YAN_pw_mountain_high_desc:0 "山不厌高，兵不厌精。边军换装、要塞连成一线。"
YAN_pw_i_am_nothing:0 "我无"
YAN_pw_i_am_nothing_desc:0 "我无，故天下有。真龙不再以神自居，国祚系于万民。"
