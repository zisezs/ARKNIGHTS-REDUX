l_simp_chinese:
 # 乌萨斯帝国 · 开局将领本地化（姓名 / 简介）
 # 由 docs/_urs_generals_build.py 生成，勿手改。

 URS_gen_Kutuzov: "米哈伊尔·库图佐夫"
 URS_gen_Kutuzov_desc: "帝国最老的元帅。他打过冻原上所有的仗，包括那些不该打的。"
 URS_gen_Kutuzov_info: "帝国陆军的活化石。他相信乌萨斯靠冬天的雪和士兵的尸体赢下战争 ——而这两样，恰好都还很多。"
 URS_gen_Shoitracz: "安德烈·绍伊特拉茨"
 URS_gen_Shoitracz_desc: "他不是贵族，靠战功爬上来。他因此比任何人都更怕失去战功。"
 URS_gen_Shoitracz_info: "帝国新军的代表。他的纪律是真正意义上的「不问缘由」。"
 URS_gen_Andreyev: "格里高利·安德烈耶夫"
 URS_gen_Andreyev_desc: "近卫军的第二任长官。第一任死于一次从背后来的枪。"
 URS_gen_Andreyev_info: "近卫军只忠于皇帝 —— 问题是，谁是皇帝。"
 URS_gen_Kuznetsov_b: "瓦西里·库兹涅佐夫"
 URS_gen_Kuznetsov_b_desc: "帝国装甲兵的教父。他说坦克不是用来冲锋的，是用来「在正确的时间出现在正确的地方」的。"
 URS_gen_Kuznetsov_b_info: "陆行舰项目的实际推动者。他的车队从来不会因为缺油停在半路 —— 至少在他的报告里。"
 URS_gen_Orlova: "叶卡捷琳娜·奥尔洛娃"
 URS_gen_Orlova_desc: "帝国后勤系统的总账。她说过：军队不是靠勇气行军的，是靠面包。"
 URS_gen_Orlova_info: "她管的兵，永远比别人手下多三成 —— 因为她的兵不会饿死。"
 URS_gen_Belyaev: "谢苗·别利亚耶夫"
 URS_gen_Belyaev_desc: "他在北部冻原带游击队活了七年。他带的兵，每人都会死三次的走法。"
 URS_gen_Belyaev_info: "冻原游击战的专家。他相信撤退是一种进攻 —— 只要方向选对了。"
 URS_gen_Volkov: "阿尔谢尼·沃尔科夫"
 URS_gen_Volkov_desc: "内卫部队的指挥官。他的部队不参加正面战斗 —— 他们只是在战斗之后清点。"
 URS_gen_Volkov_info: "内卫是乌萨斯最忠诚的部队。这句话在帝国史上被反复验证，也反复被背叛。"
 URS_gen_Smirnov_s: "波里斯·斯米尔诺夫"
 URS_gen_Smirnov_s_desc: "总参谋部的首席作战官。他的沙盘上，乌萨斯从没输过。"
 URS_gen_Smirnov_s_info: "他习惯在地图上解决问题。地图不会流血，这是他坚持用地图的唯一原因。"
 URS_gen_Tretyakov: "伊万·特列季亚科夫"
 URS_gen_Tretyakov_desc: "装甲集群的突击指挥官。他相信速度比火力更便宜。"
 URS_gen_Tretyakov_info: "他的突破战术写在第三局的教材里。那本教材的扉页上写着「不要回头」。"
 URS_gen_Romanova: "安娜·罗曼诺娃"
 URS_gen_Romanova_desc: "帝国空军的总监。她飞的次数比帝国大多数飞行员加起来还多。"
 URS_gen_Romanova_info: "空军在乌萨斯是个奢侈品。她是少数坚持认为「奢侈品值得买」的人。"
 URS_gen_Zaharov: "尼古拉·扎哈罗夫"
 URS_gen_Zaharov_desc: "俯冲轰炸机部队的指挥官。他的座机机头涂着一只瞎了眼的鹰。"
 URS_gen_Zaharov_info: "他相信飞机的价值在于「在敌人抬头发问之前把答案扔下去」。"
 URS_gen_Belova: "玛丽亚·别洛娃"
 URS_gen_Belova_desc: "帝国海军残余舰队的司令。她守着的是帝国最后的十艘船。"
 URS_gen_Belova_info: "乌萨斯从来不是海军国家 —— 但总得有人站在甲板上，看着地平线。"
