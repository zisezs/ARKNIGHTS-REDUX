 #领导人
 IRL_Kermand_Whalen: "克斯曼德·维伦"
 IRL_Kermand_Whalen_desc: "克斯曼德·维伦是一位治军有方且严厉的老将军。曾经参与过先前维多利亚大大小小的对外或是干涉战争。并一步步晋升至此。\n在退居二线后也在皇家陆军学院及其下属的近卫学院中为暴风突击队培养了许多优秀成员。而在被调配到罗布利尔后他也是游离在各个公爵明争暗斗之外的和善老市长。其罗布利尔军 区内城市的气氛甚至比维多利亚许多公爵直辖地区更加的放松。"
 #特质
 IRL_Heartless_also_has_love: "无情亦有情"
 
 #精神
 IRL_Northern_guard_idea: "北方卫士"
 IRL_Northern_guard_idea_desc: "作为上次世界性大战后维多利亚打造的防御体系的一部分，罗布利尔军区忠诚地执行这维多利亚委派的光荣使命；阻拦一切北方而来的敌人。过去是，现在是，未来也是。"
 
 
 