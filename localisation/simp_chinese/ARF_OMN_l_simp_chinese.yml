 OMN_Civil_War_Decisions: "鄂姆诺达尔内战"
 OMN_civil_war_text_Chantashaw_manpower_text: "[?OMN_chantashaw_manpower]"
 OMN_civil_war_text_Aryusz_manpower_text: "[?OMN_aryusz_manpower]"
 OMN_civil_war_text_remaining_days_text: "[?OMN.OMN_civil_war_remaining_days]"
 OMN_civil_war_Chantashaw_win_desc_Chantashaw: "在我们绝对优势的实力下，敌军根本不是我们的对手。我们的部队轻松地突破了对方的防线，对敌军造成了沉重的打击。我们实现了这一阶段的战术目标，敌军只能仓皇逃窜到更加偏远的地区，去跪在地上崇拜那个一文不值的“天父”了。相信过不了多久，这场小小的叛乱就将结束，而我们伟大的元首尚塔萧，真正的鄂姆诺达尔公爵将会带领整个乌萨斯，重现往日的帝国荣光！"
 OMN_civil_war_Chantashaw_win_option_Chantashaw: "伟大的元首永远正确！"
 OMN_civil_war_Chantashaw_win_desc_Aryusz: "战场上不断传来的坏消息，让我们意识到我们策略上的疏漏。我们为我们此前的失误付出了代价：前线部队的损失过于惨重，无法抵挡民族军的攻势，我们只能放弃前线，转进到更加稳固的防线中。我们衷心相信我们的虔诚一定能够得到天父的眷顾，现在，是时候重整态势，面对更加严酷的战场了。"
 OMN_civil_war_Chantashaw_win_option_Aryusz: "天父与我们同在"
 OMN_civil_war_Aryusz_win_desc_Chantashaw: "敌军的实力远远超出了我们的预计，我们的攻势都被对方完全化解，而我们前线的薄弱部位，却被他们偷袭得手。为了避免更大的损失，我们只能被迫撤退，而对方却士气大增。这次失利为我们敲响了警钟，我们决不能再有这样的失误。如今，我们必须重整部队，制定下一阶段的战略重点。"
 OMN_civil_war_Aryusz_win_option_Chantashaw: "可恶！"
 OMN_civil_war_Aryusz_win_desc_Aryusz: "那所谓“元首”的淫威，怎能与伟大天父的光辉相提并论？在他的注视下，我们战场上的兄弟们通过缜密的侦查和巧妙的计策，大败民族军，拓展了我方在战线上的优势。现在，那渺小的“元首”正在自己的安乐窝里瑟瑟发抖，而我们相信，胜利的曙光就在眼前，天父终将降下他的荣光，让鄂姆诺达尔成为真正的地上天国！"
 OMN_civil_war_Aryusz_win_option_Aryusz: "赞美天父！"
