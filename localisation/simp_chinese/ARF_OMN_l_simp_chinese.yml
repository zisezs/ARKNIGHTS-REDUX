 focus_stp.27.d: "[OMN_civil_war_Aryusz_win_desc]"
 focus_stp.27.a: "[OMN_civil_war_Aryusz_win_option]"
 focus_stp.27.tt: "尚塔萧方兵力§G+800§!\n亚利乌什方兵力§G+500§!"
 focus_stp.28.t: "民族革命军团胜利"
 focus_stp.28.d: "民族军的士兵坐着锈迹斑斑的卡车冲进了新教堂区，即使新正教会的民兵们拼死抵抗，但是结果依然只是徒劳。随着各个民兵指挥官和牧首的尸体与民族军的旗帜一同升起，尚塔萧元首宣告了自己的胜利。\n\n唯一比较遗憾的是，亚利乌什在少数残党的掩护之下逃离了鄂姆诺达尔，目前行踪不明。不过即使他回归，也无法改变尚塔萧元首对于鄂姆诺达尔的绝对统治。"
 focus_stp.28.a: "为元首欢呼三声！"
 focus_stp.29.t: "新正教会胜利"
 focus_stp.29.d: "总督府的大门跟民族军败类的旗帜被一同推倒，在我们忠诚的追随者们击败了总督府内最后的近卫队后，尚塔萧的暴行也随着民族军政府的瓦解而灰飞烟灭。\n\n然而当我们找到尚塔萧本人时，他早已在总督办公室里头饮弹自尽。某种程度上来说他远比那些落荒而逃的贵族和军官有骨气，不过他的死也将彻底的宣告民族军的落败。"
 focus_stp.29.a: "战争终于结束了……"
 focus_stp.30.t: "落荒而逃"
 focus_stp.30.d: "虽然我们已经尽全力想要在对局中赢得对手，然而或许是因为运气不佳，也可能是指挥者的失误，我们最后输掉了这场战斗。我们现在唯一能做的只有逃向附近其他军阀势力的范围内寻求帮助，但是他们接不接受就是另一码事了。\n\n我们当中许多人脸上都挂着一幅或悲伤或愤慨的表情，许多人都认为我们本能够赢得这场战斗，然而历史不会给我们第二次机会。倘若我们有第二次机会，我们会赢回来，并将我们的敌人彻底的消灭殆尽。"
 focus_stp.30.a: "然而我们现在只能逃跑，而且越远越好"
 focus_stp.30.tt: "随机转移至附近其他的军阀势力继续游玩"
