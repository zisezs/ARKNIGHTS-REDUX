#国策
 OMN_the_dawn_here_is_quiet: "这里的黎明静悄悄"
 OMN_the_dawn_here_is_quiet_desc: "鄂姆诺达尔一直是个“毫不起眼”的农业地区，正如绝大部分边缘地区一样，产量似乎是他们的唯一任务，不过这一地区也不是永远都风平浪静的，在过去，旧贵族发生过暴动，农奴们起过义，但都基本被镇压了。而在老公爵之子尚塔萧继位之后，让这个“与世无争的打谷地”多了几分喧嚣……"
 OMN_limited_mechanization: "有限机械化"
 OMN_limited_mechanization_desc: "我们目前的经济和掌控的技术不允许我们进行完全甚至半机械化，但是我们又必须通过机械化提高我们的农业生产效率，所以在这种情况下我们只能进行有限机械化。虽是无奈，但是对于当下来说也算是上策"
 OMN_improve_village_community_system: "改良村社制度"
 OMN_improve_village_community_system_desc: "作为一个以传统农业为支柱产业的“打谷地”，在鄂姆诺达尔传统的制度中，农民种出来的粮食有很大一部分都要交给村社。在过去，这种制度虽然苦了农民，但是却保证了当地的稳定，并且老公爵作为一名保守的统治者，也并不想对这一制度做改革\n\n而现在世道换了，新掌权的尚塔萧准备对村社制度进行大刀阔斧的改革，把收租大头村社给一脚踢开，弱化其在农业和村镇管理上的干预。这样做不仅仅能安抚当地的农民巩固统治，同时也能强化中央的权力，再者也可以提高农业生产效率，可谓一石三鸟"
 OMN_new_mining_equipment: "新型采矿设备"
 OMN_new_mining_equipment_desc: "鄂姆诺达尔虽然不是以矿物开采为主的地区，但是这片土地上却有着数量不少的铜铁和煤炭，虽然没有多少源石这类的高价值矿藏的存在，但是供应鄂姆诺达尔本土的工具铸造和供暖还是足够的\n\n不过考虑到如今各类工具、金属零件需求增高，以及从乌萨斯各地涌来的难民导致的供暖需求提升。我们可能确实是需要一些更高效的开采工具，而不是仰仗用鞭子加速矿工们挥动十字镐的速度"
 OMN_working_hours_improvement: "工作制改良"
 OMN_working_hours_improvement_desc: "虽然在乌萨斯大地上加班加点的工时并不少，但是每天十四个小时的工作时间对于“大多数人”来说还是有些太苛刻了，一方面这不适应尚塔萧的改革，另一方面不时改善工时确实是一个安慰人民的好办法，但是我们又不能让他们太悠闲，或者说他们是否准备好了接受工作制的改良？"
 OMN_fertilizer_factory: "化肥工厂"
 OMN_fertilizer_factory_desc: "化肥，现代农业的伟大产物，有了他我们就可以大大改善“收成靠天收”的情况了。但是长期以来我们的化肥大量依托其他地区的生产，这对我们来说是十分致命的，所以建立我们自己的化肥工厂必须提上日程！"
 OMN_highly_tolerant_crops: "推广高耐性作物"
 OMN_highly_tolerant_crops_desc: "作为传统的农业地区，过去我们所常种植的老作物（例如荞麦或者燕麦）相比于经现代技术改良后的作物（例如玉米，土豆等）不仅耐性差而且产量相对较低，而恰恰农作物的产量就是我们的生命，所以推广新的作物特别是玉米和土豆就成了一件重要的头等大事"
 OMN_great_change: "大换血"
 OMN_great_change_desc: "“忠诚不绝对，就是绝对不忠诚”这是一句广为流传的谚语，而对新上任的尚塔萧来说更是如此，自从自己的父亲去世之后，原先老父亲手下的那些军官和旧贵族们就开始蠢蠢欲动，自己现在还有能力压他们一头，但长久下去，这些人必然是后顾之患，所以是时候清理旧贵族和不忠于自己的军们了"
 OMN_appoint_new_nobles: "任用新贵族"
 OMN_appoint_new_nobles_desc: "在清洗掉旧贵族以及其既得利益集团后，我们迫切的需要新的人来代替他们，不然我们的政府就无法运作。而思来想去我们或许可以让“新贵族”们来担任重要的职务……但这或许需要我们花点钱和信用好让他们和我们在一条船上"
 OMN_officer_corps_governs: "军官团执政"
 OMN_officer_corps_governs_desc: "比起沉醉于尔虞我诈的职场且又利欲熏心的文官们来说，军人们要单纯和忠义的多。我们不需要所谓的“贵族”们来帮忙，让军官们担任政府当中各个层级的官职显然才是更好的选择"
 OMN_administrative_methods_reform: "行政方法改革"
 OMN_administrative_methods_reform_desc: "我知道你在想什么，但我们的改革并不是要改革官僚体制，这没必要也不现实，我们的改革暂时只会在行政方式上进行，做个比喻就是改进我们手中的工具而不是我们自己\n\n考虑到现实情况这次改革包含：标准化档案归纳以及给各办公室加上电话等等，这将大大的提升我们的行政效率"
 OMN_village_office: "村社办事处"
 OMN_village_office_desc: "村社这一制度很久以来都是乌萨斯大地上众多乡村的传统自治制度，而现在这一制度暴露出了一定的局限性，例如不便于统一管理，乡村分布过散的效率较低等\n\n所以我们现在要做的就是在各个村落建立政府的专门联络处以及行政处，这样一来就可以大大增加对广大农村地区的控制以及提高农村地区的行政效率"
 OMN_connect_all_regions: "连通全地区"
 OMN_connect_all_regions_desc: "许多年来，由于乌萨斯地区广大的地理面积，电话线只存在于各大中小型城市中，数量更多的更多乡村地区甚至还在用传统的“替我带句话”的模式\n\n——这太慢了，在我们的改革中这是不可容忍的，但是我们又不可能给各个村户都安装电话。随意经过我们的研究，目前的最优解就是把电话线暂时先联通到各个乡镇和城市地区的办事处，先方便有事通知和部队调遣"
 OMN_underground_military_factories: "筹备地下军工厂	"
 OMN_underground_military_factories_desc: "我们到军事力量太弱小了，过去我们的定位一直是“安静的农业打谷地”，军队建设基本为0 相关的军事工业建设亦为0。这在当下的局势是万不可以的，不过考虑到目前国内局势下，我们必须避开那些可能给我们造成麻烦的“意外情况”\n\n鉴于日前的乌萨斯国内局势，如果我们直接明面上建设军工厂，这很可能引起又中央政府的不满以及介入，因而我们最好的选择还是在中央政府不知情是情况下建立地下军工产业"
 OMN_divide_the_army: "分割军队"
 OMN_divide_the_army_desc: "感染者和非感染者的矛盾古已有之，特别是在乌萨斯这种地方，感染者和非感染者的矛盾在乌萨斯政府多年的“良政”下，已经几乎到了水火不相容的的境界\n\n如果让军队混着来的话后果可能不堪设想，更何况感染者可能传播原石病，这样一来感染者就更不能和非感染者在一起了，所以感染者和非感染者的部队编制一定要完全分开"
 OMN_hybrid_division: "杂种师"
 OMN_hybrid_division_desc: "在乌萨斯其他地区对感染者的政策一直相对很苛刻，但在鄂姆诺达尔我们没有那么的“苛刻”，所以感染者和非感染者的矛盾也不算太大。考虑到军队的管理成本，以及短期内我们扩军备战的现实需求，让感染者和非感染者组成混编师似乎是个更好的选择"
 OMN_form_shooting_army: "组建射击军"
 OMN_form_shooting_army_desc: "为我们到军队装备由尚塔萧公爵的老熟人从“特殊渠道”购买而来的新式自动铳械，并且组建独立的射击军部队。这将大大的提升我们军队的战斗力，未来的战斗一定是铳械至上的时代，我们必须跟上这一步伐，不然就将被时代所吞没"
 OMN_next_july_plan: "下一个七月计划"
 OMN_next_july_plan_desc: "鄂姆诺达尔的一切在尚塔萧的打理下仅仅有条的发展当中，事情几乎是出乎意料的非常顺利。虽然目前我们跟新正教会的冲突尚且存在，但是不至于一触即发\n\n而在这个局面之下，我们可以考虑开展下一个七月计划，来思考怎么会鄂姆诺达尔的未来继续添砖加瓦"
 OMN_transfer_food_reserves: "转移粮食储备"
 OMN_transfer_food_reserves_desc: "事态已经变得紧张起来了，而作为重要的资源，粮食势必会遭到其他势力的“特别关注”，而农业又是我们到支柱产业，每年的粮食出口是我们财政收入的大头\n\n考虑到我们目前的储量地已经成了“广为人知”的秘密了，所以我们必须把我们的粮食储备转移到别的地方"
 OMN_appease_farmers: "安抚农民"
 OMN_appease_farmers_desc: "毫无疑问的是，不时的给予底层民众一定的好处可以很大程度上安抚他们，很多时候给他们一些蝇头小利，他们就会非常的“心怀感激”了，并保持安定一段时间\n\n更不用说是在这种特殊情况下了，虽然这会耗一些资源，但是有的时候花点钱，总不能溅一身血和受一身伤要好"
 OMN_village_picket: "村社纠察部"
 OMN_village_picket_desc: "底层民众们现在对我们已经有很大的不满了，近来的绿军暴乱也十分的严重，所以相比于安抚他们，我们还是让军事警察直接下乡出重拳好了，毕竟非常时期就必须要用非常手段"
 OMN_village_martial_law: "农村地区戒严"
 OMN_village_martial_law_desc: "不管我们用什么方式将现在已有的暴乱暂时压制了下去，但是长期来看，我们必须对广大的农村地区进行戒严，好让广大的农村地区不敢再生事。虽然这会造成一定的不满，但是我们除此之外也没有更好的办法了，况且在眼下这个节骨眼，我们也没有那没多的时间来考虑别的方法了"
 OMN_block_information: "封锁信息"
 OMN_block_information_desc: "现在鄂姆诺达尔已经是实际意义上的混乱不堪了，绿军和旧贵族各种势力犬牙交错，不过好在目前各种事态的情况对比起过去来说还不算十分严重\n\n但如果“尚塔萧谋杀自己的父亲”这一消息扩散开来，所引起的后果是我们所不能控制，甚至是无法想象的。所以此时我们必须封锁相关消息，并且通过舆论或武力来尽可能的将这件事的影响压下去"
 OMN_find_the_suspect: "揪出嫌疑人"
 OMN_find_the_suspect_desc: "这段时间来，我们的密探一直在调查炮制出“尚塔萧谋杀自己的父亲”这一论调的人是谁，并且不惜一切代价。当然，尚塔萧叶明说了，他不在乎找到人的时候它是死的还是活的"
 OMN_make_use_of_topic: "借题发挥"
 OMN_make_use_of_topic_desc: "既然现在，局势已经如此混乱，那我们为何不趁现在将剩余旧贵族的财产搜查并查封呢？正好进来有旧贵族搞……兴许我们可以通过此事件借题发挥一下，好将他们彻底一网打尽"
 OMN_a_chance: "一个机会"
 OMN_a_chance_desc: "在鄂姆诺达尔目前的监狱里关押着各式各样的旧贵族，他们其中的很多人都在尚塔萧的亲兵砸开他们的大庄园的那一刻并将他们打入这冰冷大牢的时候才体会到什么叫做“领导者权威”\n\n很多人到现在了还是没有接受这突如其来的强烈反差感，所以虽然身在大牢之中，但内心还是抱着“我是高贵的贵族姥爷”的思想不放，他们渴望抓住一切机会离开大牢\n\n那既然这样，我们为什么不给他们一个机会，或者说以把他们放出来为交换为尚塔萧澄清呢？反正相比于讲他们在大牢里关死，还不如榨干他们的最后一丝价值"
 OMN_nothing_happened: "无事发生"
 OMN_nothing_happened_desc: "在用各种方法，或软或硬解决掉了绯闻之后，尚塔萧暂时松了一口气。虽然不排除后面还会有更多的幺蛾子，但是至少当下最麻烦的问题和制造问题的人都被处理掉了，后面的其他事情再糟糕也不会比这要更坏……大概吧"
 OMN_interrogating_army_defectors: "审问军队叛逃者"
 OMN_interrogating_army_defectors_desc: "军队叛逃，这在鄂姆诺达尔甚至乌萨斯大地都是一件十分不多见的事情，而这次叛逃也造成了很恶劣的影响，所以抱着杀鸡儆猴，了解情况，以及满足好奇心的想法，将立刻审问军队叛逃者"
 OMN_investigating_green_army: "调查“绿军”"
 OMN_investigating_green_army_desc: "绿军，到底是个什么鬼东西？直到现在我们对他们的认识和印象几乎只停留在“由一群宗教神棍和被蛊惑的村民所组成的叛匪”\n\n但在实际的作战中这支“绿军”爆发出了不该属于他们的战斗力，不仅仅是士气，还有令公爵都觉惊奇的纪律性。所以，回到最开始的那个问题，绿军，到底是个什么鬼东西？"
 OMN_seize_militia_armed_forces: "查封民兵武装"
 OMN_seize_militia_armed_forces_desc: "一直以来由于鄂姆诺达尔地区广大的农业面基以及分散的农村，军警等暴力部门无法做到在各个村庄中都有驻扎。所以各村之间都有大量的民兵武装，虽然在过去他们还有减轻一定的匪患压力，以及保证农业不会被野兽群给霍霍完\n\n但近来的都局势导致许多地方以手上的武装为资本跟我们对着干，甚至自立为王，给我们造成了很大的麻烦。所以综合考虑，是时候查封民兵们的武装了"
 OMN_strengthen_strongholds: "巩固各地据点"
 OMN_strengthen_strongholds_desc: "鄂姆诺达尔的各处都留有之前叛军或旧政府军建立的碉堡据点，我们可以翻修与重建这些地区，来帮助我们在之后的战争当中建立防御上的优势，同时也能够将其作为物质和粮食存储的仓库"
 OMN_disaster_is_coming: "大难将至"
 OMN_disaster_is_coming_desc: "要在绿军真正发难之前最好所有必要的准备\n\n我们将会着手加快军工厂建设同时秘密制造并存储武器，征招更多的士兵，总而言之一切有利于为内战做准备的事现在都是第一要务，其他的都要让路。所以相对于其他地区，我们的军事建设时间紧任务重拖沓不得，现在，生死存亡的未来正向我们极速驶来"

 OMN_for_whom_the_bell_tolls: "丧钟为谁而鸣"
 OMN_run_through_the_wilderness: "白兽奔行于荒野"
 OMN_run_through_the_wilderness_desc: "在拉特兰人的教经当中提到过有一种白色的蹄兽，而当它出现的时候就预示着灾难的发生。如果世界上真的有这只野兽，那么此时它应该正狂奔于鄂姆诺达尔的荒野之上"
 OMN_the_bell_tolls_for_many: "丧钟为众者而鸣"
 OMN_the_bell_tolls_for_many_desc: "软弱的新正教会和他的信仰并不能够带领鄂姆诺达尔人走向更好的未来，毕竟他们甚至自己连教典都没有完成。而尚塔萧元首不仅有着一套比那些幼稚的宗教疯子和马佐夫懦夫更优越的理论，他也有着常人不具备的学识还有美德——他才是鄂姆诺达尔，乃至整个乌萨斯的合法统治者！"
 OMN_hire_bodyguards_of_old_nobles: "雇佣旧贵族亲卫"
 OMN_hire_bodyguards_of_old_nobles_desc: "当成批的“旧贵族”被我们邀请到断头台上体验皇室待遇之后，他们的护卫变成了落魄民间的地主打手和富商佣兵。而我们的人力虽不算捉襟见肘，但是如果我们能够雇佣他们为我们效力，或许能够在一定程度上缓解填线兵力不足的情况"
 OMN_paid_conscription: "有偿征兵制"
 OMN_paid_conscription_desc: "单纯的口号并不能鼓动所有人为你卖命，但是只要给一点恰到好处的奖赏和利益，他们便会心甘情愿的同你一起赴汤蹈火。不过最主要的是，那群只是单纯由愤怒和宗教狂热驱动的叛军士兵在我们给出的丰厚报酬面前，恐怕也难以坚持自己的立场和信仰"
 OMN_recruiting_infecteds: "征募感染者"
 OMN_recruiting_infecteds_desc: "鄂姆诺达尔对于感染者的宽容超过了90%的乌萨斯地区，他们能够在这里吃上一口饭，喝到干净的水，甚至不用担心睡觉的时候被来历不明的大火烧成灰。不过这些“恩施”早已暗中标好了价码，如果他们需要得到更多，就必须拿起武器为尚塔萧公爵服役"
 OMN_recruiting_citizens: "征募城市民"
 OMN_recruiting_citizens_desc: "鄂姆诺达尔并没有多少狭义上的城市地区，但是如果你把那些木头屋子组成的聚落也看作是“城市”的话，那么鄂姆诺达尔可能是整个乌萨斯城市化最高的地区。但是这并不重要，现在这些住在木头屋子里头的人要么拿起长枪同浴血搏杀，要么就在矿场和农田里头干到只能爬着走"
 OMN_recruiting_felons: "征募重刑犯"
 OMN_recruiting_felons_desc: "鉴于我们有些严苛的法律，我们的监狱如今不算是人满为患，也算是摩肩接踵。与其让这些囚犯在牢里头天天吃干饭，倒不如把他们发配到战场上，而他们也都能够得到来自于公爵本人的特赦，但是他们必须用自己或者敌人的鲜血来换取，并且只有活下来的那一批人才有这个资格"
 OMN_seize_military_factories: "夺取军事工厂"
 OMN_seize_military_factories_desc: "我们曾经犯了一个错误——就是低估了武器的价值。那些工厂能够生产我们战斗所需要的一切物质，从长刀、弓弩、作战服，再到铳械，子弹，装甲车。我们不能失去她们，只要能够夺回这些重要的军事工厂，那么任何人力上的损失都是微不足道的"
 OMN_perish_together: "同归于烬"
 OMN_perish_together_desc: "虽然那些武器工厂对于我们来说固然是重要的，但是我们在他们身上所花费的代价也是有限的。既然我们无法保证在短时间且地损失的情况下得到这些工厂，那不如直接用燃烧弹和源石尘脏弹把那些工业园区炸成不可接触的废墟——我们得不到，那敌人也别想要得到哪怕一颗螺丝钉"
 OMN_assault_on_cathedral: "突袭大教堂区"
 OMN_assault_on_cathedral_desc: "大教堂区是叛军骨干和领袖们商讨对策和存储物质的核心地带，虽然防御森严，但是并非无孔不入。如果我们对这个敌人的心脏发起一次强而有力的袭击，即便不能够杀死或俘虏敌方的重要人物，也仍能对敌人的士气与补给造成沉重的的打击"
 OMN_burn_agricultural_warehouses: "焚烧农业仓库"
 OMN_burn_agricultural_warehouses_desc: "即便我们提前转移了大量的粮食储备，但是叛军依然通过各种奇淫巧技藏匿了大量的粮食，并在内战开始后把他们秘密集结到了各个要点地区的农业仓库当中。我们需要这些食物，但是我们恐怕并不能得到它们全部，所以把它们尽数焚毁，或许才是最优选"
 OMN_the_bell_tolls_for_few: "丧钟为寡者而鸣"
 OMN_the_bell_tolls_for_few_desc: "尚塔萧的暴行理当被制止，作为统治者他不仅用武力和酷刑强迫人们屈服于它，而且他的诡计也将整个鄂姆诺达尔陷入了一片火海之中。新正教会将在亚利乌什大主教的带领下将这个不称职的暴君从他的王座上推倒下来"
 OMN_unite_old_nobles: "联合旧贵族"
 OMN_unite_old_nobles_desc: "旧贵族并不是我们合适的合作对象，但是基于我们现在有着共同的敌人，他们相比会愿意同我们合作。不过我们也不明指望这些养尊处优的官老爷和大少爷拿起武器上战场，不过让他们从自己的小金库里头拿出来一些赤金和通钞还是不成问题的"
 OMN_accept_deserters: "接纳军队逃兵"
 OMN_accept_deserters_desc: "并非所有人都心甘情愿的为尚塔萧卖命，有些人是因生活所迫，有些则是担心家人受到牵连，有些只是纯粹的被诱拐欺骗到了军队里头充当炮灰和苦役。我们可以通过策动那些军队中的不满分子，从军队当中掀起一场叛乱来扰乱尚塔萧的军事计划，同时也让那些被迫从军的人真正有机会拿起武器反抗压迫自己的奴隶主"
 OMN_equal_rationing: "平等配给"
 OMN_equal_rationing_desc: "尚塔萧在内战前就掠夺并运走了大部分的粮食储备，虽然我们通过秘密地窖和贿赂官员等等方式保住了一部分的粮食，但是想要支撑接下里漫长的内战依然是十分艰难的。不过即便如此，我们也不会将全部的粮食倾向于军队，我们的队伍是由那些劳苦大众组成的，我们不能够忘记这一点"
 OMN_soldiers_first: "士兵优先"
 OMN_soldiers_first_desc: "尚塔萧在内战前就掠夺并运走了大部分的粮食储备，虽然我们通过秘密地窖和贿赂官员等等方式保住了一部分的粮食，但是想要支撑接下里漫长的内战依然是十分艰难的。我们如今可能得被迫压缩发给民众们的口粮，而将至少七成的粮食都输送给军队，这将有助于我们的军队士气，以期盼能够早点结束这场内战"
 OMN_arm_prisoners: "武装劳改犯"
 OMN_arm_prisoners_desc: "许许多多的人被尚塔萧和它的爪牙们冠上了各种各样不可思议的罪名然后被随意的投入了牢狱之中。虽然其中也不乏一些真正的恶徒和罪犯，但是他们大多数都是无辜之人。我们或许可以考虑将他们拯救出来并发配武器，让他们加入到反抗尚塔萧暴政的行列当中"
 OMN_arm_believers: "武装平信徒"
 OMN_arm_believers_desc: "在我们的追随者当中不乏有着非常强烈的参军欲望的人，但是想要这些瘦弱的僧侣和信众能够像那些训练有素的士兵一样同敌人拼刀却并非不容易。不过只要我们有足够的武器和人力，训练出一批有着足够军事素养的“十字军”也并非难事"
 OMN_arm_infecteds: "武装感染者"
 OMN_arm_infecteds_desc: "感染者虽然不是鄂姆诺达尔被压迫的最厉害的那一批，但是他们就如同鄂姆诺达尔的大多数人一样，几乎终日活在高强度无休息的劳作当中，而获得酬劳也只能最低限度保证自己不死于饥饿。也正因如此，他们是我们可以团结的对象之一，即便这会招致一部分感染者厌恶者的强烈反对"
 OMN_way_of_truth_belief: "信真理为道"
 OMN_way_of_truth_belief_desc: "宗教狂热能够保持长久的热情和稳定，但是相对的他也容易使普罗大众变得盲目和偏执。不过亚利乌什有着更好的主意，他曾经在年幼时从一位神父哪里得到了启发并用了足足三年完成了一个名为新真理的思想，虽然这个思想并没有跳脱出宗教的基底逻辑，但是其比起纯粹的宗教狂热而言，要理性且更“先进”"
 OMN_contemporary_crusaders: "当代十字军"
 OMN_contemporary_crusaders_desc: "宗教狂热能够保持长久的热情和稳定，但是相对的他也容易使普罗大众变得盲目和偏执。但是如今我们的优势在尚塔萧军队的强力攻势下渐显颓势，而我们也不得不选择通过我们最不希望的方式来发动还能够战斗的信众，让他们以一种几近于自杀的方式对尚塔萧的军队发起猛攻——这会为我们篡权巨大的优势，但代价则是千百万个鲜活的生命……"

 OMN_everything_as_usual: "一切照常？"
 OMN_everything_as_usual_desc: "动乱结束了，所有的领土都已经被我们再次整合回来，并且新正教会和绿军只剩下来少部分零星抵抗，同时所有的内部叛徒和旧贵族的势力也被一并清扫干净——而现在，是时候让鄂姆诺达尔回归到正轨当中了"
 OMN_clean_up_green_army_remnants: "清理绿军残余"
 OMN_clean_up_green_army_remnants_desc: "绿军武装自农民当中诞生与壮大，即便我们在之前的战斗当中已经将他们几近消灭，但是现在依然剩下了数量不少的残余武装力量。而我们将会在缜密的计划之后，将这部分一举消灭，以根除这个对于鄂姆诺达尔安定最大的威胁因素"
 OMN_total_religious_ban: "全面宗教禁令"
 OMN_total_religious_ban_desc: "新正教会曾经只依靠谎言和谬论就蛊惑了大批的鄂姆诺达尔人来暴起破坏了我们安定的生活，并最后导致了内战的发生。而现在所有的异端邪说都必须被彻底的根除，任何宗教相关的事物和人都应当被坚决且彻底的清扫干净"
 OMN_resume_agricultural_production_chantashaw: "恢复农业生产"
 OMN_resume_agricultural_production_chantashaw_desc: "农田和农业仓库大多毁于了之前的内战当中，虽然重新修建他们是一个大工程，但是如果想要恢复农业生产效率到过去的水平，这一点小小的付出就是必要的。毕竟没人想要饿肚子，而饿着肚子是干不成大事情的"
 OMN_concentrate_rural_population: "集中剩余农村人口"
 OMN_concentrate_rural_population_desc: "在内战当中，大量的农村城镇都被炮火毁于一旦，大量的农民失去了曾经的住所和家园，只能到处流浪更甚者选择了落草为寇。我们无法重建那么多的农村城镇建筑群落，但是我们可以将一部分农民集中安置新的现有农村城镇当中，而另外一部分可以运送到城市或工厂当中作为劳动力补充"
 OMN_factory_restoration_plan_chantashaw: "工厂修复计划"
 OMN_factory_restoration_plan_chantashaw_desc: "各种工厂和手工作坊大多毁于了之前的内战当中，虽然重新修建他们是一个大工程，但是如果想要恢复工业生产效率到过去的水平，这一点小小的付出就是必要的。毕竟在高大的楼房，在没有水泥、砖瓦和趁手工具的情况下可建不成"
 OMN_rebuilding_construction_chantashaw: "重建社会基层建设"
 OMN_rebuilding_construction_chantashaw_desc: "虽然内战告捷，但是整个鄂姆诺达尔的基层管理建设基本上在之前的战争当中被砸了个稀碎，如果我们想要让政府的每一道命令都能够准确且有效的传达和实施，就必须开始着手重建能够将整个鄂姆诺达尔联系起来的社会基层组织网络"
 OMN_pledge_of_allegiance: "宣忠誓言"
 OMN_pledge_of_allegiance_desc: "尚塔萧公爵塑造了鄂姆诺达尔完整和秩序井然的社会，然而却依然有着无数自称是“自由主义者”的败类想要破坏这一切。如今每个人都有义务向我们伟大的领袖表以致敬和忠诚，并且不管他们是否真的自愿与否都必须去做，除非他们不再想要站在这片土地之上"
 OMN_makeover: "改头换面"
 OMN_makeover_desc: "一个好的领袖知道怎么带领他的人民走向更加美好的未来，一个更好的领袖知道怎么带领他的国家取得更多的权利。一个最好的领袖知道如何带领他的民族成为整个乌萨斯乃至整片大地之上最强大的存在。现在，我们将会跨出征服未来的第一步——独立！！！"
 OMN_sacred_victory: "神圣的胜利"
 OMN_sacred_victory_desc: "动乱结束了，曾经压迫在鄂姆诺达尔人民头上的那座大山如今已经被我们砸了个稀碎，而那些啃食着劳苦大众血肉的食尸鬼也被我们几乎剿灭一空，盘旋在这片土地上的乌云依然消散——而现在，是时候让鄂姆诺达尔回归到正轨当中了"
 OMN_clean_up_former_government_remnants: "清理前政府残余"
 OMN_clean_up_former_government_remnants_desc: "政府军随着尚塔萧的死亡而一哄而散，即便如今在各地有着不少打着复兴旧政口号的叛军，但是他们大多数是些落草为寇的前政府军罢了。而我们将会在缜密的计划之后，将这部分一举消灭，以根除这个对于鄂姆诺达尔安定最大的威胁因素"
 OMN_religion_bread_new_law: "宗教、面包与新法"
 OMN_religion_bread_new_law_desc: "尚塔萧的暴政不仅毒害了整个鄂姆诺达尔许久，他恶毒的话语还为曾经的鄂姆诺达尔人们的思想上拷上了枷锁。而现在我们会亲手把砸个稀碎，虔诚的信仰、平等的配给、以及全新的法律将会将其取代，鄂姆诺达尔的人们也将在其中走向新的未来"
 OMN_resume_agricultural_production_aryusz: "恢复农业生产"
 OMN_resume_agricultural_production_aryusz_desc: "农田和农业仓库大多毁于了之前的内战当中，虽然重新修建他们是一个大工程，但是如果想要恢复农业生产效率到过去的水平，这一点小小的付出就是必要的。毕竟没人想要饿肚子，而饿着肚子是干不成大事情的"
 OMN_improve_farmers_situation: "改善农民处境"
 OMN_improve_farmers_situation_desc: "在内战当中，大量的农村城镇都被炮火毁于一旦，大量的农民失去了曾经的住所和家园，只能到处流浪更甚者选择了落草为寇。我们不能够辜负了这些在内战时期为我们抛头颅洒热血的人们，我们必须立刻着手开始重建城镇地区，已给广大农民一个安身之处"
 OMN_factory_restoration_plan_aryusz: "工厂修复计划"
 OMN_factory_restoration_plan_aryusz_desc: "各种工厂和手工作坊大多毁于了之前的内战当中，虽然重新修建他们是一个大工程，但是如果想要恢复工业生产效率到过去的水平，这一点小小的付出就是必要的。毕竟在高大的楼房，在没有水泥、砖瓦和趁手工具的情况下可建不成"
 OMN_rebuilding_construction_aryusz: "重建社会基层建设"
 OMN_rebuilding_construction_aryusz_desc: "虽然内战告捷，但是整个鄂姆诺达尔的基层管理建设基本上在之前的战争当中被砸了个稀碎，如果我们想要让政府的每一道命令都能够准确且有效的传达和实施，就必须开始着手重建能够将整个鄂姆诺达尔联系起来的社会基层组织网络"
 OMN_christening: "洗礼仪式"
 OMN_christening_desc: "正教会的典故和经文早在先皇时期便已经下落不明，如今还只剩下了一部分手抄本还残留在了民间。虽然内容无非是一些最基本的洗礼和祈祷相关的仪式方面的内容，而且或多或少还有“本土化”修改之疑，但如果想要让正教会再度复兴，我们就不妨从最基础的部分开始，一点点完善它"
 OMN_holy_country: "神圣的国度"
 OMN_holy_country_desc: "霞光普照在亲爱的大地上，隐隐听见小仙鹤在歌唱。鄂姆诺达尔的人们以不在被苛政和酷刑所折磨，暴君和他的爪牙们也已被尽数消灭，鄂姆诺达尔将要迎来自己的重生——在十字架返照的金光和麦浪的翻涌声中，换发新的生机"

#事件
 focus_omn.1.t: "晨曦"
 focus_omn.1.d: "老萨沙迎着打霜，早早地起了个床，这倒不是什么上了年纪的反应，也不是什么养了多少年的习惯，纯粹只是因为腹中无果，胃液的反流烧得他躺着也不是，站着也难受。他感觉一只手从他的食道往外抓啊抓，抓得他心慌，抓得他感觉血流往上直翻涌；他也想再睡一会儿，可他既睡不着，又没法睡，一躺下，他也不知道能不能再爬起来。\n\n早点起来也好，他想，早点起来去教堂也许能多分一点饼，早点起来也省得那些卒子来“叫他”，人到了这个岁数，伤疤好得特别地慢。\n\n于是他向着村子里那个风格迥异的建筑一步步地蹭过去，建筑实际上也并不华丽，但当地的教职人员还是很用心地装饰了那么一下，一开始人们感觉他奇怪，久而久之反而开始尊崇了起来。不为别的，就为那一周一次的“圣餐”，这教堂里的人给到了教堂的人都分那么点饼，分那么点水，当地的老爷们也不阻拦，任由这群人这么发下去，于是一年年下来，这儿成了来往人员最多的地方。\n\n尽管老萨沙起得够早的了，但教堂外面还是早早地围着了那么两圈人，等他蹭到人群那边，这围着的人已经是又围了一圈。\n\n听着屋子里洪亮的声音，老萨沙也多少感到心安，尽管他也听不懂这群人说了点什么，但柔和的语气也给他的筋骨多少加了分力气，背上的伤也就没那么疼了，可终归他来得晚，他还得让肚子里的小手舀着他的胃酸那么甩来甩去，脸上呢，也不能表现得太难看，他终归是要撑点脸面，虽然说这点脸面对于他的身份也没什么多大的作用。\n\n终于到了他这里了，他便掏出随身带的杯子，教职人员先是撕了那么一块饼，而后又给他的杯子里匀了些温水，在简单地感谢之后，老萨沙便尽可能地压着姿态地吃了下去。尽管吃的时间很短，他脑子却也没闲着，他听说他吃的这饭是什么人把自己变成了饼之后的产物，吃到现在也还没吃完，他也是感到奇怪。他也想着自己以后会不会也变成饼"
 focus_omn.1.a: "他要是变成饼，能不能给自己远方的儿子先留上几块？"
 focus_omn.2.t: "换了面貌"
 focus_omn.2.d: "他一上场，便慢悠悠地从一个质地精良的文件夹里掏了张纸，弹了两下，纸张发出清脆的“啪，啪”声，显然质地均匀，纸质较为厚重，绝对称得上是用料上乘。\n\n可他一张嘴，众人却感觉还没有那封纸来得有意思。\n\n据政府任命的督察官于今日来到了这个小村落（替换名称），本来只是个偏远的小地方，没想到这里也受到了上面的恩宠，这让当地的居民一时心情复杂。鄂姆诺达尔聚集着不少由外地逃向这里的人，如此一来，他们其实也没有太多太激烈的反应。\n\n旧有的村社管理系统已经被新来的大人带着士兵强行接管，现在，整个村子的人们都聚集在广场，听着这人如同自来水阀门一般滔滔不绝地念着条文行令，实际上的内容其实没多少人听进去，因为他们知道这些内容大多数不一定用得上，用得上的其实大多来自于他们个人的口头命令，上一刻还记载于纸上的，下一刻便可能跟着鞭子一块儿打在背上，村里剩下的人们岁数都不小了，而年轻人早就听着信，大多散了。\n\n也许原来的人们会抱怨村社的不成事，抱怨或者或那的打骂，抱怨为什么粮食和账本永远对不上，粮税为什么永远填不满，如今这些抱怨全都没了。诺大的广场上，回荡的只有那充满激情的演讲与稀稀拉拉的羽兽声，仿佛为这片土地带来什么新东西似的"
 focus_omn.2.a: "也许的确如此"
 focus_omn.3.t: "另一片金海"
 focus_omn.3.d: "“喂，歇一歇吧~”伊万向着另一边田的老头打着招呼\n\n“喀嚓”，老头把锄头往田埂上一杵，上午的烈日把地面晒得透透的，也晒得人暖洋洋的。老农停下身来，伊万也刚好干完一条陇，此时和老头擦着头上的汗，有一句没一句地聊着。\n\n两边作物种得并不一致，可都长出了嫩嫩的小苗，很是好看，老头偏了一眼。\n\n“燕麦？”\n\n“是，麦子，长得真不赖。”伊万放松地说着。\n\n“那你这就是给老爷们种精细粮了，有福气啊小伊万。”老农慢吞吞地吐着字，也不知道是讽刺还是真的羡慕。\n\n“别嘲讽我了老默斯莱，谁不知道这麦子是最剩不下的，而且这土豆和麦子也是要倒换着种的，明年这片田应该也是种土豆了。”伊万倒也是听得出来好歹，也反过来抱怨两句“这破地方天气冷，一年也就收这一茬，听说那暖和的地方一年能连着麦子和土豆一块儿收了去，那边应该从来没愁过吃吧。”\n\n“呲。”默斯莱倒是有点忍不住“去了那南方，我看你活得时间还没有我们瞎扯淡的时间来的长。”\n\n一听这话，伊万的精神头萎靡了一二，不过马上他又打起精神，堆起笑容地蹭到默斯莱附近：“嘿嘿，老默斯莱，默斯莱·马林斯基！就咱们那么多年的交情，秋冬的时候你自己藏的也分我那么两分呗，不要多，饿不死你弟弟我就好。”\n\n默斯莱听完，倒也“嘿嘿”两声，反诘到："
 focus_omn.3.a: "“你小子裂兽大开口啊？”"
 focus_omn.4.t: "大肃清"
 focus_omn.4.d: "早上8点45分，尚塔萧离开会议厅，在随从与护卫的围护下向市郊区进发。\n\n上午10点45分，尚塔萧离开了墓园，最近他常来这里，一是为了悼念父亲，二也是为了让自己清净清净——他已经很难有个安静的去处了。\n\n11点30分，他将下午会议所需的文件全部整理完毕。\n\n中午12点25分，他与女儿吃了一顿简单的午饭，女儿餐后还要了一小点的甜品，父亲也无可奈何地答应了这个请求。\n\n下午1点30分，距离会议还有一小时三十分钟开幕，在场人员正在焦急地清点到场人员。\n\n2点15分，尚塔萧于会议厅现身。\n\n2点45分，人员悉数到场，会议进入最后的准备阶段。\n\n3点整，会议正式开始，会议主持致开幕介绍。\n\n3点04分，尚塔萧登上会议台。\n\n3点05分，全场寂静。\n\n3点06分，尚塔萧于会议上发言：\n\n“在危机面前，每一个机关、每一个岗位，必须保持绝对的纯洁性。”"
 focus_omn.4.a: "清扫即刻开始"
 focus_omn.5.t: "军人政治学"
 focus_omn.5.d: "自从索伦斯基的岗位被代替之后，无事可做也无事可寻的索伦斯基便一天天地沉沦了下去，他早上从家门出来，中午在酒吧泡着，晚上被旧相识或者老同事抬回去，一日三班倒，生活倒也算得上十分规律。\n\n近几天不一样了，不一样在于他找到了个酒伴，于是他多了一个“上午和酒伴瞎侃”的好习惯。\n\n“乌里亚，你说……那群混蛋到底是怎么想的……”一张口，乌里亚诺夫便知道索伦斯基要抱怨他的遭遇了，所幸他也是想抱怨一番的。\n\n“他说我……说我手脚不干净，贪了不明来路的财产，老实讲，你我都清楚，哪有几个不贪的呢……”说到这儿，索伦斯基便掏出随身的银酒壶，灌了一口“不上下疏通关系，谁会跟你老老实实办事儿！”\n\n“是，更别说那群大老粗能干点什么，不是鞭子就是刀子！”乌利亚诺夫听到这儿也跟着抱怨了起来，和着寒风，他不由得感觉一阵晕眩“哈，索性也不管他，他们没了咱们我倒是想看看能搞出什么新的乱子来！”借着劲头，他夺过索伦斯基的酒壶，也吹了一口。\n\n索伦斯基倒是也想抢回来，但看同伴正在兴头上，索性也不去抢，裹了裹身上的大衣，叹了口气，接着话匣子那么聊下去：\n\n“说起来啊老哥，你是因为啥事儿让那群牲口抓了套啊？”"
 focus_omn.5.a: "“他妈的，他们说我管的账目混乱，根本对不上……”"
 focus_omn.6.t: "隔墙有眼"
 focus_omn.6.d: "时至秋季，天总是黑得很早，露水早早地把松针打湿，浓重的雾气与黑夜交织着，共同包裹着村落露不出一丝的痕迹。\n\n“嘿，”小屋里，一个黑糊糊的影子把另一个拉到自己身边“你还能争取到几个人？”\n\n搭话的人是村社的老书记，如今整个村社被搞了个羽飞兽跳，尤其是这个所谓的机械化，让他本来能在账本上浑水摸鱼的地方限制了不少，他本来以为能够联系到不少的反对者，而现在只看另一个黑影摇了摇头，显得十分无奈的样子。\n\n一声悠长的叹气声从屋中传出，把屋外的小羽兽惊走了两只。\n\n“说实在的，书记，我们现在也干不了什么多余的事情，不如早点弃了这个念头，想办法多和他们搞搞关系，把这些农业机械再泛用泛用，年底到时候我们也好交差。”这另一个影子是书记最忠诚的一位了，几个“硬骨头”也是他给办妥了的，可如今这个时候他也说些丧气话，这让书记又气又恼。\n\n“你……”还没等书记半个字说出口，手下赶忙捂住书记的嘴，不让他多说一句话，似乎生怕这多说的一句话能引发什么爆炸一样。\n\n过了很久，屋里的空气渐渐缓和下来，书记也似乎放松了一些“是的，你说得对，我们还有周旋的地步……走，休，休息一下吧，时间也很晚了。”一股浓烈的疲惫感从他的身上散发出来，与屋里的黑暗把二人的表情模糊起来。\n\n而屋外，雾气依旧浓厚得不成样子，把影子与小羽兽们的动作与行为掩盖得滴水不漏。"
 focus_omn.6.a: "今夜无事发生"
 focus_omn.7.t: "村社已死"
 focus_omn.7.d: "正午时分，一名大男人在街道上闲逛，这是他闲逛的第三天了。\n\n村社的“改革”已经持续了有一段时间了，作为书记的他是被关照的重点之一，而对于平常大大咧咧的他来说，现在的行为如同是有人把他关进了仓鼠笼子里一般，好在不同的是，他的人身自由等基本权利并没有限制，但依旧对他来说是种莫大的限制。\n\n他本是想往他的朋友兼干事家去的，却糊里糊涂地走向了村外的小路上。农忙时节已过，晌午的地头上也没有多少人做活，整个地径显得十分空旷。等他反应过来的时候，人已经离开村子很远了。\n\n巧的是，他想找的人也正在田头远眺，看起来也是一片茫然。\n\n“嘿！”他招了下手，“嘿！听得见我说话吗？”\n\n听到有人叫他，田头这人才缓过神来，于是两人在这条路上有一话没一话地搭着，可两人聊的话还不如田里的麦梗长得多。\n\n他回想了自己的半生，从二十岁来到此地，如今三十年已经过去，自最初的踌躇满志到现在的满腔油嘴滑舌，细细数来，连自己也哑然失笑。\n\n“嗯？书记，你笑什么？”男人的笑引得他的干事也惊讶几分，自他于书记手下干事也有了将近十年了，书记极少笑过，当然，这也和书记让他处理的事情有关，大部分时候作为打手的他，所遇到的场景自然也是不适宜笑的，但即使如此，在其他时候里，书记他也是不常笑的。\n\n男人听完，又干扯了几声，转眼望向了远方的夕阳。待到太阳又下去几分时，长叹一声："
 focus_omn.7.a: "“没什么，米可拉，我们回去吧”"
 focus_omn.8.t: "事变"
 focus_omn.8.d: "“大人，这是卡拉钦斯克于今日发来的文件，请您过目。”\n\n尚塔萧有些不耐烦地将文件包一把夺了过来，粗粗地扫了一行上面的标题，便把文件包丢到了一边。\n\n被甩出去的文件露出一角，隐约看到“讨伐”的字样；而标题告诉他当地坊间流传着绿军与贵族的消息，意料之中。\n\n实际上，这些老古板的叛乱对他来说只是时间问题，只是他们需要一个理由，而现在，正好这个理由出现了，他，尚塔萧·伊凡耶维奇·戈利岑，竟被人宣称暗杀了自己的父亲，不仅言辞激烈，似乎还有什么人证物证，由此相关的谣言开始愈演愈烈，即使尚塔萧第一时间尽可能地阻止了谣言的传播，但也晚了一步。如今，虽然尚塔萧的权柄并未受损，但地方的人们已经觉察出了一丝不对劲。\n\n近一个月可以说是尚塔萧最忙碌的时刻，不仅各地报道有士兵出现了逃走与过于懈怠的情况，居民流动性也比过去上升了十几个百分点，这是非常危险的征兆；与此同时，五花八门的文件占据到了尚塔萧的桌面上，仿佛这些文件也读懂了他内心的急迫感，于是，文件开始如海浪般一波波地涌过来，让他没有更多地时间去应对那么多的事情。\n\n夜幕逐渐降临，整个首都也逐渐安静下来，先是郊区，而后居民区，各个大小店面也跟着关门歇业，接着工厂也安静了许多，整个城市如今只有干路和政府处的灯火彻夜不停。\n\n他能想到绿军和老贵族的野心丝毫未曾褪去，也清楚自己的处境，但他现在还没法停下来，他感觉群狼正在向他逼近，眼里泛着幽幽的绿光，仿佛很久没有进食了，而他所作的，就是整理准备，死命地盯着这群狼崽子的一举一动"
 focus_omn.8.a: "时间迫在眉睫"
 focus_omn.9.t: "缺斤少两"
 focus_omn.9.d: "亚历山大正颇为头疼地抓着他的头发一顿乱揉，他已经让人点了几遍了，可仓里的粮食和账本上记的数总是对不上，这可是今年的新粮，少那么一分，他的心就要疼上一阵。他已经派人再去查了，查不上的话，他们的俸禄也要扣上一块。\n\n于是这位小贵族开始在院子里一遍遍地踱步，他的消息渠道告诉他新任的公爵推行了一系列的政策，而粮食方面，今年的税收又加了三成，这三成加上原本就高得不少的粮税，他不知道今年的新粮最后送到粮库的还能有多少。想到这里，他就感觉头发又掉了那么几根。\n\n一回主房，他便看到妻子那张也像是被人揉成一团的表情，情绪便又是低了一些。\n\n“喀嚓”一声，剑拔出鞘，他看着这父亲留给他的剑，与他也是陪伴了有那么几年，父亲去世的时候，老人家指了指陪伴了他一辈子的剑，一字字地交代这把剑，是当年先皇征战四方时，皇帝亲自奖赏的，就算家里的财产全都扔干净了，这剑也是万万不能丢的。可惜等他想再问上点什么的时候，老人家已经先一步走了。\n\n他又看了一会儿，便又把剑插了回去，叹了口气，临近晌午，妻子也早早地做好了饭菜，和小儿子等着他，吃饭的时候一家三口也是一言不发，屋子里回响着令人发闷的沉默。\n\n这个时候，上午派出去的守卫喜滋滋地传来消息，新粮的确是让几个农民藏了去，他已经缴了他们的粮食，只等领主一下令，他便去好好地触发他们，顿时小领主感觉空气缓和了不少，他也算善心大发，此事儿不予追究。当然，他也不去追究为什么上午手下的鞭子在左腰，中午却不守规矩地别在了右腰间了"
 focus_omn.9.a: "他接过了小儿子手里的糖，轻轻地微笑了一下"
 focus_omn.10.t: "纠察队下乡"
 focus_omn.10.d: "自集结队伍的那一刻起，他们踏着碎雪奔向四方，带着任务与信任。\n\n有别于曾经的纠察队，尚塔萧将纠察队重新组织，以用于疏通基层。曾经的纠察队，烧杀抢掠无一不做，尚塔萧认为“这明显违背了纠察队的初衷”。新组建的纠察队被明确要求应“事事按照程序进行”，“以任务完成为重”，并设立了明确的奖惩制度。被如此教导的纠察队的确与曾经的纠察队十分有别，其任务效率明显比曾经提升了一个档次，而各地区中产阶级及富农的流失度也整整下降了一倍有余，可谓是极富成效。\n\n而纠察队本身的人员来源也被严格控制，除了人数被严格限制，加入纠察队还会被严格查询其血脉及位置，由此，纠察队的组成十分地“纯正”，并且与各地的基层贵族联系甚足，这也从另一方面提升了纠察队的任务成功率。\n\n——但高效率的背后是什么？"
 focus_omn.10.a: "也许怒放的血樱已经说明了一切"
 focus_omn.11.t: "告密者之死"
 focus_omn.11.d: "柳博芙已经尽可能地让自己保持冷静了，可是自己依旧控制不住地打冷战，毕竟自己现在是被逮住了，而且是尚塔萧的亲卫队，也就是说逮捕他的命令是总辖直接发令……一想到这里，她的腿哆嗦得更厉害了。\n\n“哦，真抱歉，女士。”转眼间，尚塔萧总辖带着职业性的假笑来到了他的面前，一边笑，一边手上的语言也不停歇“我来晚了一些，毕竟，你知道的，就最近的工作……我很忙，你会体谅的吧？”他的语言温柔得不成样子，仿佛两人之间其实毫无秘密。\n\n一个手势递出，其他人转身离开了房间，此时房间只剩二人，尽管柳博芙完全没有被拘束，但她已经瘫软得只能紧紧握住椅子的靠手才能勉强控制住自己的姿势。\n\n“伊凡·埃布里耶维奇·柳博芙，32岁，作为我官僚班子里的一把手之一，容我冒昧地问，是我哪里得罪了你，以至于要用这样的……谣言，来攻击我吗？”说到这的时候，尚塔萧已经一个转身到了柳博芙的身边，用低沉的声音在她的耳边厮语。\n\n“不……不，没有，没……”而在柳博芙的眼里，此时是一条蟒蛇捆在了自己的身上，对她吐着芯子，以至于她近乎丧失了所有的语言能力。\n\n“说实话的，你真的是非常恶毒，以父亲的死来攻击我，即使是卑微如草履的人，他们应该也不会这么做，对吧？”他着重地强调了最后的词语，柳博芙本也并不是一个坚强的人“是的……不！不是！不是这样……我没有……我没有……”\n\n“是的，你没有。”她感到尚塔萧的身子一下子离开了她的身边，那种重压感似乎一瞬间地从她的身子里清脆地出去了。\n\n“但是，我有。”"
 focus_omn.11.a: "从此知道这个秘密的人少了一个"
 focus_omn.12.t: "内卫出逃"
 focus_omn.12.d: "“哟~呦~呦，看看又是什么新鲜的小肉来……哦天，哦天啊！杰里，怎么会是你？”\n\n随着牢内的一声惊呼，狱卒又给牢房找到了一名新成员，利索地把软趴趴的可怜小伙扔进牢之后，狱卒又“砰砰”地敲了敲铁栅栏，随后一声不吭地离开了，只留下因为这一番动作变得稍微安静的罪犯，或者说，逃兵们。\n\n“怎么样，默斯莱，这小子还活着吗？”刚才称呼小伙叫杰里的一名蓬头垢面的家伙稍微有些急切地说着。\n\n“放心，只是晕过去了，怎么，尤里，从来没见过你这么急切过？”被称呼为默斯莱的家伙慢慢转过头来，同是一脸的蓬头垢面，只不过他给自己的乱发扎了个髻，据他称呼是“易于打理”。\n\n而平常放荡不羁的尤里此时则显得面如土灰，耷拉着身子伏在地上，人们也不愿意去这个时候打理他。\n\n看看这群浑浑噩噩的逃兵们……有些的确是因为害怕逃了被抓到了这里，可其他的呢？默斯莱这么想着，眼前这个小子岁数看起来绝没有十五六岁，胡子茬都看不到，他是因为什么？逃了兵役？公然地反对尚塔萧？还是人头抵了农税？这都不好说，眼下监狱人数似乎越来越多，谣言也越来越多，甚至听说内卫都离开了这片地区……\n\n“啊啊啊啊啊！”尤里的嘶吼声打破了他的思考“冷静点，尤里！人还没死呢你嚷嚷什么！”\n\n外面到底闹成什么样了，老兵油子的他是不敢继续想了。"
 focus_omn.12.a: "作为回应，警棍敲打狱栏的声音比刚才更大了"
 focus_omn.13.t: "绿旗叛军"
 focus_omn.13.d: "致总辖大人：\n\n对于“绿军”的情报搜寻工作进展神速，通过各地区的人员进行情报集中交流分析后我们得知，“绿军”目前是一只以宗教为联系纽带的队伍，他们以“先知”为首，主要分布于我们的农村地区，尤其以较为贫穷的地区更为活跃；在城市地区，“绿军”更多地以宣传为主。每只“绿军”并不具有典型的军队组织规划，更多的以神职人员为首，神职以下的管理非常扁平；但在此之上，则又能看到类似军队的规划，以至于能看到类似于营团级的编制，加之“绿军”成规模的训练，而这和我们查询到的，一名来自于前“夜猫”旧贵族亲卫队的人员可能有着直接的关系。而就目前我们调查到的情报，“绿军”的规模并没有呈减少的态势，其规模化程度与日俱增，也许他们的下一次发难近在咫尺。\n\n库瓦托洛夫 敬上"
 focus_omn.13.a: "继续调查，一有新消息就尽早汇报"
 focus_omn.14.t: "艰难抉择"
 focus_omn.14.d: "虽然早有预兆，但是突如其来的变动还是惊异到了所有人，整个鄂姆诺达尔在一瞬之间崩作了两半。一边是作为鄂姆诺达尔合法统治者的尚塔萧所带领的政府军势力，而另一边则是由“新正教会”领袖带领的农民和狂信徒组成的叛军。总督尚塔萧已于全体广播宣布“所有人都要参与进来以抵御这一肉眼可见的危险”；作为回应，叛军的钟声也已经响彻四方，二者水火不容，似乎只有一方倒下的结局。\n\n而对于生活在这片土地上的人们来说，要么被迫加入尚塔萧的预备队，要么被村民裹挟加入叛军。巨大的裂痕被物理性地置放到了众人面前，即使刀尖的对面是邻好，是朋友，抑或是至亲之人。"
 focus_omn.14.a: "叛乱者罪不可赦，尚塔萧公爵万岁"
 focus_omn.14.b: "我们愿意为真理与自由献身"
 decision_omn.1.t: "鄂姆诺达尔政府军胜利"
 decision_omn.1.d: "据前线战地记者传回的消息，政府军的士兵冲进了叛军最后所在的新教堂区，双发爆发了剧烈的巷战，但是最后证明这只是临死前的挣扎。随着一具具尸体被清理、抬出，政府军的旗帜最终在叛军的大本营冉冉升起，尚塔萧公爵宣告了自己的胜利，并将设立相关的庆祝活动与社会修养政策。\n\n唯一遗憾的是，亚利乌什在少数残党的掩护之下逃离了鄂姆诺达尔，目前行踪不明，但他也无法再聚拢起反抗的力量。政府对残余势力的大范围清扫已经提上日程。"
 decision_omn.1.a: "为公爵欢呼三声！"
 decision_omn.2.t: "新正教会胜利"
 decision_omn.2.d: "随着总督府的大门与政府军恶棍的旗帜被一同推倒，在我们忠诚的追随者们清扫了总督府内最后的近卫队后，我们可以骄傲地宣布，罪恶的尚塔萧政权已经在这片大地上永远地消失了。\n\n然而我们找到尚塔萧他本人时，他早已在总督办公室中服毒自尽，某种程度上来说他远比那些落荒而逃的贵族和军官有骨气，但他的自尽只是想逃避对我们兄弟姐妹所犯下的滔天罪行所应得的审判！兄弟姐妹们，携起手来，我们会将这个人渣和他的党羽们永远地钉在历史的耻辱柱上，永远！"
 decision_omn.2.a: "兄弟姐妹们，战争结束了！"
 focus_omn.15.t: "焚尽"
 focus_omn.15.d: "“这些，还有这些，全部都烧了，动作麻利点！”一名军官训斥着手下的士兵把一打又一打的书和纸张塞进满满当当的火炉里头——现在上头下令，让他们把那些教会以及跟宗教相关的书籍和印刷品全部焚烧掉，粉碎、掩埋统统不许，只许焚烧，让这些东西一丝都剩不下。\n\n“这些书里头都写了啥，能有那么大的乱子……”\n\n“闭嘴，”军官直接打断了士兵的牢骚“你要做的就是听令行事，我们花钱雇佣你，不是让你在这里说闲话的！”一边示意其他的士兵加快速度，随后便匆匆地去了另一边继续指挥行动。\n\n被训斥的士兵也不继续自找没趣，继续低下头把散落一地的印刷纸一张张地丢进了火炉里磨洋工。虽然他真的很好奇书里头写着啥，但是他的内心想法还是劝告他不要想太多，他只管骗工资，书里面的东西他感觉没法给他瘪瘪的肚子多塞一口粮食。"
 focus_omn.15.a: "毕竟他不是当官的，没必要想那么多"
 focus_omn.17.t: "向领袖致敬"
 focus_omn.17.d: "深夜的城镇广场上，镇民、纠察队、士兵、政府官员们俨然有序地站成了一列又一列，他们在寒冷的冬夜里正倾听着由通过扩音器播放的漫长而又言辞亢奋的“领袖宣言”。多亏了士兵与纠察队们忠心和细致的引导，每个人自愿地聚集到广场上，尽管似乎有些人打着哆嗦，有些人脸上有些青紫，以至于有些脸色都不太一样了。\n\n“乌萨斯大地万古流芳！乌萨斯万岁！”留声机内外共同响起了令人激昂的口号，于是这场漫长的演讲终于告一段落。散去之时，有的人面露骄傲，有的人低声怨言，有的人只是打着哈欠想着继续睡一会儿，而大部分的人则一脸麻木——远在千里之外尚塔萧自然知道如此的场景，在场面事他也只会说些场面话，但如果连场面话都无法忍受的人……"
 focus_omn.17.a: "他的追随者会用刺刀告诉他们什么是忠诚和真理"
 focus_omn.16.t: "人人有份"
 focus_omn.16.d: "清晨，老萨沙如同往日那样从床上爬起，他不仅感叹自己头一回能够起得那么晚——“是啊，老爷们的卒子们已经不在了……”他自言自语的回答着一个没被提出的问题——而且他也没有再被鞭子或者胃酸叫起来。\n\n穿过忙忙碌碌的镇子街道，他来到了那座老教堂。她很幸运，没有毁于之前的战争，至少大部分没有，但是这并不妨碍她是这座镇子上少有的还能辨认与从前并无二致的那个“大姑娘”。\n\n而在门口，依然是人挤人，农民、工人、士兵排了一行有一行的长队，不过一旁维护治安的人看到了老萨沙的模样，便负责他到了另外一边较短的队伍里头——这里大部分都是年事已高的老者，也由几个年轻人，不过他们都有点残疾，只是老萨沙几乎认不出多少熟面孔，许是他年纪实在太大了。\n\n当老萨沙终于走进那扇大门之后，分发食物的教职人员人员几乎很快就认出老萨沙，而老萨沙被叫到名字之后看了半天才认出来这个已经缺了一条胳膊又满脸伤痕的年轻人……只不过两人并没有说什么，两人只是用眼神互相交流了一下，老萨沙也只是在接过面包和一小碗菜汤后就走开了。\n\n“这样就够了。”他想，这就够了。"
 focus_omn.16.a: "没什么变换……但是一切又变了"
 focus_omn.18.t: "第一次洗礼"
 focus_omn.18.d: "一个难得的大晴天，教堂里头挤满了前来围观的信徒和看热闹的群众，而亚利乌什站在教堂最中央的洗礼台面前。虽然自己长久以来都是以先知和神父的身份自称，但是亲手执行洗礼仪式还的确是头一回。\n\n在脑中再次过了一遍流程后，他开始向着在场的众人开始复述起了编排好的赞神颂词，并不时的摆动着双手做出一些意义不明但是看起来内涵丰富的姿势。\n\n在让他自己感到有些尴尬的发言结束后，他对着一旁的志愿者做了一些交流，之后又将另一个人的头轻轻地浸泡在了水中。而在数次这样看起来毫无意义的……额，行为艺术之后，亚利乌什向着众人和志愿者宣告了他受到净化和来自于上苍的祝福，顿时整个教堂开始回响起了一阵又一阵的惊呼与呐喊，并且久久没有消散。"
 focus_omn.18.a: "好吧，至少结果比我想象中要好得多"
 news_omn.1.t: "日升之地"
 news_omn.1.d: "今日，东乌的鄂姆诺达尔地区内部叛乱宣布告一段落。由现任管理者尚塔萧·伊凡耶维奇·戈利岑带领的政府军镇压了由农民、旧贵族和狂信徒组成的叛乱军队，其在程序性的演讲中宣布，将开始着手重建鄂姆诺达尔的基础设施和农业建筑，同时派遣了大量的的军事警察和纠察队前往各地展开抓捕行动。\n\n虽然宣称尚塔萧有脱离中央政府自立为王的消息甚嚣尘上，但是其本人十分坚定的否定了这一说法，并表示鄂姆诺达尔将按部就班地恢复乌萨斯粮仓的历史地位。但实际上这并不重要，毕竟东乌萨斯如今已经乱成了一锅粥，再增加一名选手也只不过是意料之中的事情。"
 news_omn.2.a: "一切按计划进行"
 news_omn.2.b: "新选手加入了赛场"
 news_omn.2.c: "东部无事发生"
 news_omn.2.t: "弥赛亚之国"
 news_omn.2.d: "今日，一群由狂信徒和农民组建的，被称为“绿军”的民间武装组织彻底接管了乌萨斯的鄂姆诺达尔地区的控制权。其领导人表示将会带领着鄂姆诺达尔人走向一个充满信仰和希望的新未来，同时表示会和各方保持尽可能和平的状态，并宣称对乌萨斯的忠诚及对于周边粮食供应的安全保证。\n\n然而附近的其他公爵领表示了极度的担忧，没有人知道这么一群由狂热分子和农民组成的集团是否真的愿意对各方努力维持和平状态，尤其是之前的鄂姆诺达尔当局还对于农民集团施行了极端高压的剥削政策，即使新领导人于宣称的一样的确保证了各方正常的粮食供应也难以让各方完全放松警惕。乌萨斯中央则对此未进行发表任何言论。"
 news_omn.2.a: "天父在上，我们成功了……"
 news_omn.2.b: "我有着很不好的预感"
 news_omn.2.c: "东部无事发生"
 news_omn.3.t: "鄂姆诺达尔的变革"
 news_omn.3.d: "就在鄂姆诺达尔的尚塔萧公爵发出“忠诚”宣言不久后，曾经代表着乌萨斯的旗帜被降了下来，取而代之的是一面陌生的新旗帜——不再有双头骏鹰，而是爪兽头颅构成的黑黄旗帜，与乌萨斯的传统大相径庭。\n\n就此，鄂姆诺达尔实际上已经在公共场面上宣布从乌萨斯的版图上剥离了出来，而已然陷入了乱局当中的乌萨斯中央也无余力处理此事，即使他们知道这是一个极度危险的信号。\n\n鄂姆诺达尔的行为明显地激励了其他的军阀，曾经那些碍于中央威慑的一部分军阀，如今也开始蠢蠢欲动。而作为粮仓的鄂姆诺达尔地区无疑将成为漩涡中心之一，从此，鄂姆诺达尔将向着仅有的路途一路狂奔。"
 news_omn.4.a: "乌萨斯的未来将由我们来命令与征服"
 news_omn.4.b: "我看见了一匹苍白的蹄兽，它奔跑在荒原之上"
 news_omn.4.c: "这总会发生的……"
 news_omn.4.t: "鄂姆诺达尔的变革"
 news_omn.4.d: "鄂姆诺达尔的领袖“神父”和他的追随者已然食言，他们将曾经画有双头羽兽的旗帜降下并烧毁在了篝火中。而取而代之的则是无数的十字架和那一面刻画着十字架的彩色绘布——他们宣称天父已然再次降临到了人间。\n\n就此鄂姆诺达尔从乌萨斯的版图上剥离了出去，而已然陷入了乱局当中的乌萨斯中央也无余力处理此事，即使他们知道这是一个极度危险的信号。\n\n鄂姆诺达尔的行为明显地激励了其他的军阀，曾经那些碍于中央威慑的一部分军阀，如今也开始蠢蠢欲动。而作为粮仓的鄂姆诺达尔地区无疑将成为漩涡中心之一，但，鄂姆诺达尔将向着仅有的路途虔诚迈进。"
 news_omn.4.a: "阿门——"
 news_omn.4.b: "我看见了一匹苍白的蹄兽，它奔跑在荒原之上"
 news_omn.4.c: "这总会发生的……"

