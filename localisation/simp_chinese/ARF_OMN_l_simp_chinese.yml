#民族精神
 OMN_oppressed_peasants: "农民压迫"
 OMN_oppressed_peasants_desc: "鄂姆诺达尔作为罕见的没有压迫感染者，甚至允许他们在部分岗位工作的地区，虽然看上去是比较的开明，但是实际不过是缺乏苦力来帮忙耕种农田罢了。不得不说至少在被压迫和责罚这点上，无论是感染者还是非感染者，地主和监工们都是一视同仁，而且他们同样得从日升之时干到日落之后，并且一日三餐的食物也只有燕麦粥和菜汤"
 OMN_peaceful_threshing_ground_1: "与世无争的打谷地"
 OMN_peaceful_threshing_ground_1_desc: "鄂姆诺达尔虽然是中乌萨斯的重要产量基地，但是因为种种原因，这里并没有驻扎大量的军队。同时鄂姆诺达尔的募兵制度和出口策略也都是相当保守的形态，不过皇帝钦差的保障加上产粮基地经不起战火的蹂躏，这些因素最后使得鄂姆诺达尔得以在混乱的中乌萨斯局势中保持相对和平的状态。"
 OMN_peaceful_threshing_ground_2: "与世无争的打谷地"
 OMN_peaceful_threshing_ground_2_desc: "鄂姆诺达尔虽然是中乌萨斯的重要产量基地，但是因为种种原因，这里并没有驻扎大量的军队。同时鄂姆诺达尔的募兵制度和出口策略也都是相当保守的形态，不过皇帝钦差的保障加上产粮基地经不起战火的蹂躏，这些因素最后使得鄂姆诺达尔得以在混乱的中乌萨斯局势中保持相对和平的状态。"
 OMN_burning_wheat_field: "燃烧的麦田"
 OMN_burning_wheat_field_desc: "鄂姆诺达尔的麦田在燃烧，整个国度变成一片地狱。过去鄂姆诺达尔从未有一件兵工厂，也没有任何人去研究武器的生产制造，甚至军队都从未扩编过\n\n然而在中央政府都无法介入的情况下，每个人都在尽自己所能的扩编军队，同时一座座或大或小的军械工坊被建立了起来，鄂姆诺达尔将会面临她最大的一场浩劫"
 OMN_work_two_shifts: "两班倒工作制"
 OMN_work_two_shifts_desc: "过去农民和工人长期要工作16~20个小时，哪怕是政府官员也得至少工作14个小时。而如今尚塔萧非常“仁慈”的把集体底层的工作时间强行调整到了12个小时\n\n然而，这份馈赠也并非没有代价。首先就是每个人说得到酬劳被狠狠地砍了一刀，而另外一方面就是要有一批人从黄昏之后干到第二天的日出之时才能够休息"
 OMN_divided_omnodar: "分裂的鄂姆诺达尔"
 OMN_divided_omnodar_desc: "鄂姆诺达尔被两方势力一分为二，现在所有的工业建筑群以及可用的人力也皆是如此。"
 OMN_divided_omnodar_1: "分裂的鄂姆诺达尔"
 OMN_divided_omnodar_1_desc: "鄂姆诺达尔被两方势力一分为二，现在所有的工业建筑群以及可用的人力也皆是如此。"
 OMN_divided_omnodar_2: "分裂的鄂姆诺达尔"
 OMN_divided_omnodar_2_desc: "鄂姆诺达尔被两方势力一分为二，现在所有的工业建筑群以及可用的人力也皆是如此。"
 OMN_agricultural_production_recovering: "农业生产状况稳步恢复"
 OMN_agricultural_production_recovering_desc: "我们的工人和农民正在竭尽全力的劳作着，相信在不久之后，鄂姆诺达尔的农业状况就会恢复到站前的情况。届时，黄金色的稻田和深棕色的仓库将会再度成为鄂姆诺达尔最靓丽的风景线"

