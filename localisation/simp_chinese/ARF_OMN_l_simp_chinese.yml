#人物
#国家元首
 OMN_Ivan_Ebrievich_Lyubov: "伊凡·埃布里耶维奇·柳博芙"
 OMN_Ivan_Ebrievich_Lyubov_desc: "被皇帝亲自任命下来的钦差大臣，她会对于将粮食运输给集团军以及中央的事情绝不会有一点含糊。但是除此以外的余粮则会被她以个人的方式处理掉，不论是分发给农民的象征性救济粮，还是卖给其他公爵的粮食，多多少少都被倒卖掉或者掺假了部分，这也是为何她每月都有着一笔相当于工钱四倍的秘密收入。\n\n作为标准的投机分子，她几乎跟任何同僚都有着共同语言，哪怕是负责看守粮仓大门的那个伊凡——不过考虑到他们两个都是自私的享乐主义者，这似乎也没有什么奇怪的。\n\n不过在中低层，却没有一个人给她好眼色。毕竟面对一个总是无端的咒骂羞辱，克扣自己薪酬，欺骗自己钱财和子嗣的可憎之人，哪怕是最忠实的下民都会觉得作呕。不过归功于多疑的本性，他得以躲过了数次针对她的暗杀——不过她也仅仅只是暂时逃过一劫罢了。"
 OMN_Aryusz_Solovich_Mogira: "“牧首”亚利乌什·索洛维奇·莫吉拉"
 OMN_Aryusz_Solovich_Mogira_desc: "亚利乌什真名【列日德昂·瓦西里耶维奇·马雅夫】，1021年生于乌萨斯西部某大城市。作为典型的贵族子弟，他自幼在高等学府、私人教师以及周末教会学堂里头学习到了各类繁杂的科学知识和宗教礼仪。同时在学校的地下读书会里头他还有幸接触到了马佐夫、雅客等左翼政治学家的书籍，并在之后的陆陆续续接触到了很多来自于花语运动的政治学说。\n\n列日德昂在生命的前大半生都在追求仕途以及尝试改变乌萨斯的糜烂现状，然而在内卫和保守派双重压力下，他最后选择了70岁那年离开了繁荣的西部，来到了这个偏远的中部村镇地区。\n\n列日德昂并不认为宗教可以拯救乌萨斯，但是对于陷于抑郁和绝望的乌萨斯人民来说，宗教却是最有效的强心剂之一。所以列日德昂披上了救世主的外衣，依靠着一段“神话”笼络人心，并伺机来达成自己的真正目标。"
 OMN_Chantashaw_Ivanevich_Golitzen: "尚塔萧·伊凡耶维奇·戈利岑"
 OMN_Chantashaw_Ivanevich_Golitzen_desc: "在其父死于疑案之后，尚显年轻的尚塔萧接过了公爵的位置，成为了鄂姆诺达尔新一任法理上的合法领导人。随后关于其父死亡原因的疑云一直盘绕在他的身边，但是他对此不以为然——他只是耸了耸肩\n\n尚塔萧的管理手段远比其父强硬甚多，他不仅大手一挥把官僚部门进行了物理层面上的大扫除，还直接关押和处死了大量被他指认为“欲想篡位谋权”的贵族。而当他宣布将以钢枪和长刀通知这片沃土之时，整个鄂姆诺达尔便被其牢牢握于手中\n\n虽然尚塔萧的政策对比起其父而言要“开明”许多，但是也依然没有跳脱个人独裁这点，尤其是鄂姆诺达尔的内卫是个连自理都稍显困难的老人的情况下。因而人们对此即便有所不满和怨言也毫无作用——皇帝管不到这里，周围的比邻也需要这片土地的粮食"

#将领
 OMN_Ivan_Ivanevich_Karitos: "“疯魔伊凡”伊凡·伊凡耶维奇·卡里托斯"
 OMN_Ivan_Ivanevich_Karitos_desc: "疯魔伊凡的名号在乌萨斯的军队当中的恶名可谓是无人不知、无人不晓，他放纵手下残杀战俘，劫掠村庄，甚至自己也双手沾满数百人鲜血，他唯一收敛的原因只会是害怕自己不再受到皇帝的宠幸。\n\n不过他并不是保皇派，也不是新旧贵族，甚至也跟改革派毫不沾边。他就是一个纯粹到混账的精致的利己享乐主义者。只要费奥多尔允许他继续做这个边缘王国的军队头子，他就愿意继续“效忠”这位新皇，这也是费奥多尔派遣他作为鄂姆诺达尔的总指挥官以及在紧急情况下的最高领导人的原因——因为他只是个容易满足的小人。\n\n不过疯魔伊凡的军事才能却是毋庸置疑的，在过去的几场战争中，他从未有过失败的记录，这让他几乎很快就身居高位——不过另一个原因还因为其他竞选者都死于了原因不明的意外事故。"
 OMN_Udenich_Kolanovic_Polineski: "尤登尼奇·科拉诺维奇·波利涅斯基"
 OMN_Udenich_Kolanovic_Polineski_desc: "抱着为国家服役的爱国者情结来到中部地区的青年军官，然而在和疯魔伊凡的长时间相处之后，他的爱国之心却被疯狂和无趣的日常将近消磨殆尽。直到在接触到了伊凡公爵之子——尚塔萧之后，在和同龄人的相互鼓励之下，这位年轻人重燃了内心炽热的报国之心。\n\n同时他也宣誓会永远追随尚塔萧的步伐，并在背地里头组织起了憎恨疯魔伊凡的农民，传教士和士兵，准备好在将这个帝皇的宠儿扼杀在他的城堡里头。"
#内阁成员
 OMN_Siren_Helena: "塞壬·海伦娜"
 OMN_Siren_Helena_desc: "来历不明的神秘女性，从口音，装束和习惯上面能够判断并不是乌萨斯本土人，目前她暂时停留在了【新正教会】管理下的城镇里头担任巡回医师的身份，但是关于她的目的和更多的相关资料都是个谜。"

