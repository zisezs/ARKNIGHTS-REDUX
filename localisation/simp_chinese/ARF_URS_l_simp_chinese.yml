 URS_World_War_Category: "对全世界宣战"
 URS_World_War_Category_desc: "北境的凛风将不再区分敌友，整片泰拉大陆都被帝国视作猎场。\n\n§R启用条件：§!游戏日期大于 §Y1103.1.1§!。"
 URS_declare_war_on_all: "对所有国家宣战"
 URS_declare_war_on_all_desc: "对所有尚未交战的国家宣战（本国、附庸国与阵营成员除外）——包括废土（ZZZ）；获得全面征服的战争目标。\n\n§R启用条件：§!游戏日期大于 §Y1103.1.1§!。"
 URS_declare_war_on_all_tt: "对全世界所有尚未交战的国家宣战，并获得全面征服的战争目标。"


 URS_imperial_court_panel3_button_text: "派系影响力"
 URS_imperial_court_panel3_button_tt: "虽然§4改革派§!与§g保守派§!间的政治斗争之火已经被全面点燃，但这却并不代表着两大派系之内就没有争议与摩擦。事实上，二者内部早已分化出了§5多§!§0元§!§2化§!的政治旁支。这些旁支山头各有各的主张，一举一动也并不完全听令于中央。因此，如何处理好这些§g小§!§d团§!§8体§!与政党中央的关系，便成为了两党领导人共同的心头之患。\n\n倘若一个派系能够团结一心、凝心聚力，那么它就能在政治斗争中取得更大的优势，并有更多的机会推行自身政策。"
