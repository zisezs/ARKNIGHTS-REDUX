 #领导人及人物
 URS_Feodor_Vladimirovich_Ryurik: "费奥多尔·弗拉基米罗维奇·留里克"
 URS_Feodor_Vladimirovich_Ryurik_desc: ""
 URS_Islam_Vitte: "伊斯拉姆·维特"
 URS_Islam_Vitte_desc: "如果要用一个词描述维特的生平，只有“矛盾”可堪。在作为专制主义卫士的同时，他还是一个善于根据现代化发展需要而改变统治方式及施政策略的所谓“改革主义官僚”。\n\n维特毕业于圣骏堡学院法律系。仰仗着与前任财政大臣维施涅格·鲍勃斯的关系以及显赫的家族背景，他成功在大学毕业后进入了帝国财政部门。得益于他的辛勤工作，维特迅速成长为了一名优异的经济官僚，并获得了帝国经济部门的认可，展露出了自己的卓越才能。同时，他那改革主义色彩浓厚的经济思想也引起了皇帝和帝国改革派的注意。\n\n在改革派的有意培植下，维特很快就加入了帝国中央文官序列，同时也成为十月党的一员。之后，维特主持撰写了《乌萨斯经济管理概论》。这使得皇帝惊讶于他独到的经济理论与改革见解，并因此决心提升他的官职。他迅速地在文官体系中爬升，并最终接任了财政大臣的宝座，甚至成了改革派的领军者。\n\n当他终于登上权力的巅峰后，却发现摆在自己面前的只有摇摇欲坠的破碎山河。暂且不言来自外部的压力，仅仅是在内部，他的敌人就不仅是保守派一党。皇帝对他主持的经济改革越发失去耐心，十月党的部分成员则渐渐背离他的信念。但无论如何，名为乌萨斯的舰船已经摇摆欲沉，而他则是舰桥上发号施令的船长。这个古老帝国的未来，取决于他的一念之间。"
