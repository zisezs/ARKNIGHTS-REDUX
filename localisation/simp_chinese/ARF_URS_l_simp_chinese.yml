 #精神
 URS_afterwave_of_great_rebellion: "“大叛乱”的余波"
 URS_afterwave_of_great_rebellion_desc: "二十年前，由感染者群体与旧贵族军队所发动的“大叛乱”席卷了乌萨斯大地。多亏了皇帝的英明决策与帝国军的迅速回援，这场骚乱才得以平息。然而，这场本该成为历史的叛乱浩劫却依旧影响着今日的乌萨斯——针对旧贵族与军官进行的轮番清洗将旧贵族与新贵族间的最后一缕羁绊无情斩断，被叛乱冲击的国家经济坠入深渊而停滞不前，而愈演愈烈的感染者危机则为整个帝国蒙上了一层黑暗阴影。\n\n时代潮流裹挟之下，乌萨斯正如一叶于怒涛间摇摆不定的孤舟，载着不安的人们艰难航行。待一切尘埃落定后，永恒的时间终将为所有人揭示帝国的命运——迎来救赎，§R或万劫不复§!。"
 URS_unstable_society: "愈发动荡的社会局势"
 URS_unstable_society_desc: "随着乌萨斯帝国的政治弊病与军事失败日积月累至排山倒海之势，国内的社会矛盾便因而彻底爆发。在帝国议会之内，新贵族和旧贵族争吵不休，军队与政府纠缠不下；而在辉煌殿堂之外，饥肠辘辘的贫民们正呐喊着口号沿街抗议，越来越多的感染者正拾起武器和暴政相争。毫无疑问，乌萨斯父国已然重病缠身。治疾愈病、重铸帝国之路，道阻且长。"
 URS_stabilizing_social: "维稳中的社会"
 URS_destroyed_economy: "近乎毁灭的经济体系"
 URS_destroyed_economy_desc: "寒冷、落后、荒芜，世人用这些词汇来比喻乌萨斯帝国的经济体系。在“大叛乱”的横加摧残之后，本就羸弱不堪的帝国经济体系更是轰然倒塌，仅为我们留下了无数的债务空洞与名为通货膨胀的烂摊子。而惨无人道的矿场制度与近乎剥削的赋税征收也在无声地蚕食着下层平民对皇帝乃至整个帝国的忠诚与信心。因此，无论是为了帝国的存续还是人民的福祉，我们都必须试图挽救国家的经济体系。"
 URS_recovering_economy: "恢复中的经济"
 URS_broken_army: "残破不堪的帝国军队"
 URS_broken_army_desc: "“大叛乱”之后，皇帝发动了一场针对涉事帝国军的全盘清洗。尽管它成功阻止了又一场叛乱再度来临，但过宽的打击面却已对我国军事指挥体系造成了毁灭性的损害。更糟糕的是，帝国军上下对乌萨斯当局的最后一丝信任也因残酷的清洗而消逝殆尽。血染的雪花纷飞落下，只有漫长的时间才能弥合乌萨斯军队的深重疤痕。"
 URS_reforming_army: "改革中的军队"
 URS_reformed_army: "改革完成的军队"
