#决议及GUI
 URS_imperial_court_decisions: "帝国皇庭"
 URS_imperial_court_decisions_desc: "变革与进步的浪潮如同凛冽寒风一般席卷着北境大地，乌萨斯新老贵族间积压已久的深重矛盾随之被彻底点燃。如今，帝国的政坛分裂成了两大派系——由新贵族所组成的§4改革派§!，以及由旧贵族组成的§g保守派§!。\n\n§4改革派§!，即§4“十月党”§!的领袖是§4伊斯拉姆·维特§!，他们主张推陈出新，让全新的思想与制度遍及帝国的方方面面，将乌萨斯转化为一个开明的国家。这一派系的背后是锐意进取的§Y费奥多尔大帝§!。\n\n§g保守派§!，即§g“帝国主权同盟”§!的领袖是§g安东·卡德洛夫§!，他们主张在有限改革的基础上保留曾经的统制思想与等级制度，并重新确立乌萨斯的军政霸权。这一派系还与§L乌萨斯帝国军§!存在着千丝万缕的联系。\n\n目前的局势\n§4改革派支持度§!：[?URS_reformist_percentage|%0]\n§g保守派支持度§!：[?URS_conservative_percentage|%0]"
 URS_economic_recovery_decisions: "经济恢复"
 URS_economic_recovery_decisions_desc: "腐朽的制度与接连的灾祸已经使乌萨斯的财政状况摇摇欲坠、大厦将倾。因此，眼下的重点是便尽可能早地完成经济恢复，以拯救帝国的经济体系。"
 URS_area_management_decisions: "大区管理"
 URS_area_management_decisions_desc: "大区制度把帝国的辽阔疆域切成若干块可直接经营的行政单元。中央派驻的大区长官集军政财权于一身，既能把改革推到底层，也能在千里之外自行其是——从这一刻起，帝国的治理效率与治理风险同时被放大。"
