#寸步不让（大炎宣战）
 URS_Not_one_step_back: "寸步不让"
 URS_Not_one_step_back_desc: "大炎的兵锋已经越过北境。对乌萨斯而言，这不再是边关偶起的摩擦，而是一场必须站着打完的战争。皇帝下了令：一寸土地也不许后退。工厂昼夜不熄，铁水与枪弹一并涌向前线；而每一个被逼到墙角的乌萨斯人，都在用自己的方式回答同一个问题——这片雪原，究竟是谁的。"
