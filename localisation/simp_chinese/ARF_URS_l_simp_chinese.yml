 URS_imperial_reformist_party_title_text: "§4改革派内部形势§!"
 URS_imperial_conservatist_party_title_text: "§g保守派内部形势§!"
 URS_imperial_reformist_party_orthodox_text: "§5正统派§!对§4十月党中央§!\n忠诚度：[URS_imperial_reformist_party_orthodox_text_loc]"
 URS_imperial_reformist_party_orthodox_text_1: "竭诚尽节"
 URS_imperial_reformist_party_orthodox_text_2: "忠心耿耿"
 URS_imperial_reformist_party_orthodox_text_3: "不冷不热"
 URS_imperial_reformist_party_orthodox_text_4: "心怀异见"
 URS_imperial_reformist_party_orthodox_text_5: "愤愤不平"
 URS_imperial_reformist_party_orthodox_text_6: "彻底决裂"
 URS_imperial_reformist_party_orthodox_tt: "§5正统派§!由改革派领袖§4伊斯拉姆·维特§!及其追随者组成，是十月党中资历最老、规模最大、思想最成熟的政治派别。他们主张在北境大地上建立一个以立保守民主制和统制式混合经济为基础的君主立宪政府，从而以稳健的步伐引领乌萨斯帝国成为现代化的民主国家。"
 URS_imperial_reformist_party_humanity_text: "§0人文派§!对§4十月党中央§!\n忠诚度：[URS_imperial_reformist_party_humanity_text_loc]"
 URS_imperial_reformist_party_humanity_text_1: "竭诚尽节"
 URS_imperial_reformist_party_humanity_text_2: "忠心耿耿"
 URS_imperial_reformist_party_humanity_text_3: "不冷不热"
 URS_imperial_reformist_party_humanity_text_4: "心怀异见"
 URS_imperial_reformist_party_humanity_text_5: "愤愤不平"
 URS_imperial_reformist_party_humanity_text_6: "彻底决裂"
 URS_imperial_reformist_party_humanity_tt: "§0人文派§!由改革派要员§4尤里·马尔托夫§!以及他的朋友们组成，是十月党中初露锋芒的泛左翼政治派系。他们希望将乌萨斯改造为一个基于议会君主制与社会市场经济的社会民主主义国家，并通过更为激进的社会变革将现代化之光洒遍帝国疆域。"
 URS_imperial_reformist_party_progressive_text: "§2进步派§!对§4十月党中央§!\n忠诚度：[URS_imperial_reformist_party_progressive_text_loc]"
 URS_imperial_reformist_party_progressive_text_1: "竭诚尽节"
 URS_imperial_reformist_party_progressive_text_2: "忠心耿耿"
 URS_imperial_reformist_party_progressive_text_3: "不冷不热"
 URS_imperial_reformist_party_progressive_text_4: "心怀异见"
 URS_imperial_reformist_party_progressive_text_5: "愤愤不平"
 URS_imperial_reformist_party_progressive_text_6: "彻底决裂"
 URS_imperial_reformist_party_progressive_tt: "§2进步派§!由改革派成员§4狄安娜·克林斯基§!以及潜藏于党内的年轻共和派人士组成，是十月党中规模最小却最为激进的左翼政治派系。他们敏锐的政治目光已经从腐朽的君主主义转向了新兴的哥伦比亚式自由主义，并希冀以大刀阔斧的现代化改革重塑古老的乌萨斯帝国。"
 URS_imperial_conservatist_party_mild_text: "§g温和派§!对§g帝国主权委员会§!\n忠诚度：[URS_imperial_conservatist_party_mild_text_loc]"
 URS_imperial_conservatist_party_mild_text_1: "竭诚尽节"
 URS_imperial_conservatist_party_mild_text_2: "忠心耿耿"
 URS_imperial_conservatist_party_mild_text_3: "不冷不热"
 URS_imperial_conservatist_party_mild_text_4: "心怀异见"
 URS_imperial_conservatist_party_mild_text_5: "愤愤不平"
 URS_imperial_conservatist_party_mild_text_6: "彻底决裂"
 URS_imperial_conservatist_party_mild_tt: "§g温和派§!由保守派领袖§g安东·卡德洛夫§!及其政治盟友组成，是帝国主权同盟的中右翼核心派系。他们代表着中间派旧贵族与老派军官的利益，希望维持帝国现有的政治框架不变，同时对其进行有限的修补与改良。"
 URS_imperial_conservatist_party_iron_text: "§d铁腕派§!对§g帝国主权委员会§!\n忠诚度：[URS_imperial_conservatist_party_iron_text_loc]"
 URS_imperial_conservatist_party_iron_text_1: "竭诚尽节"
 URS_imperial_conservatist_party_iron_text_2: "忠心耿耿"
 URS_imperial_conservatist_party_iron_text_3: "不冷不热"
 URS_imperial_conservatist_party_iron_text_4: "心怀异见"
 URS_imperial_conservatist_party_iron_text_5: "愤愤不平"
 URS_imperial_conservatist_party_iron_text_6: "彻底决裂"
 URS_imperial_conservatist_party_iron_tt: "§d铁腕派§!由威名赫赫的保守派人士§g米哈伊·斯托雷平§!及忠诚的君主派人士组成，是帝国主权同盟中规模较大的右翼旁支派系。他们主张维持并强化乌萨斯君主制、全盘保留旧有文化传统以及大举镇压改革派人士，并对帝国目前的政治体制作极有限的“重新诠释”。"
 URS_imperial_conservatist_party_revival_text: "§8复兴派§!对§g帝国主权委员会§!\n忠诚度：[URS_imperial_conservatist_party_revival_text_loc]"
 URS_imperial_conservatist_party_revival_text_1: "竭诚尽节"
 URS_imperial_conservatist_party_revival_text_2: "忠心耿耿"
 URS_imperial_conservatist_party_revival_text_3: "不冷不热"
 URS_imperial_conservatist_party_revival_text_4: "心怀异见"
 URS_imperial_conservatist_party_revival_text_5: "愤愤不平"
 URS_imperial_conservatist_party_revival_text_6: "彻底决裂"
 URS_imperial_conservatist_party_revival_tt: "§8复兴派§!由臭名昭著的前第七集团军总参谋官§g安娜西斯塔娅·阿列克谢耶夫§!及她的老战友们组成，是位于乌萨斯政坛光谱最右端的新秩序主义派系。他们主张架空或废除皇帝、建立法西斯式共和制度和法团主义经济制度，并通过战争手段来复兴昔日帝国的无上荣光。"
 URS_economy_decisions: "经济改革"
 URS_economy_decisions_desc: "腐朽的制度与接连的灾祸已经使乌萨斯的财政状况摇摇欲坠、呈大厦将倾之态。因此，眼下的重点是尽可能早地完成经济改革计划，以拯救经济体系。接下来，我们将引入几个必定影响改革最终成果的重要因素：\n\n“经济改革完成度”代表了目前经济改革的综合进程，是解锁国策树中关键改革节点的必要条件。本界面的各项决议则可以为帝国注入强劲而持久的良性经济影响，并逐步削弱“濒临毁灭的经济体系”的负面影响，在完成后还将以一定数值增加“经济改革完成度”。\n\n§O经济改革完成度：§![?URS.URS_economy_reform_progress|%%0]"
 URS_military_decisions: "乌萨斯帝国军"
 URS_military_decisions_desc: "“大叛乱”后的大清洗固然拔除了§L帝国军§!内部的反动势力，却无法掐灭他们心中的不满之情。这无关那些老派将领们对§4改革派§!或是§g保守派§!的看法，恐怕他们对整个乌萨斯帝国政府都怀有异见。\n\n倘若§L帝国军§!对于中央政府的忠诚度较高，就能为我国提供一定的作战增益，军事改革也能顺利推行下去；反之，较低的忠诚度则会带来严重的负面效果，或者是……§L一件所有人都不愿想象的事情§!。\n\n§L帝国军的忠诚度：§![URS_empire_army_loyalty_loc]"
 URS_empire_army_loyalty_loc_1: "誓死效忠"
 URS_empire_army_loyalty_loc_2: "忠心耿耿"
 URS_empire_army_loyalty_loc_3: "保持平静"
 URS_empire_army_loyalty_loc_4: "满腹牢骚"
 URS_empire_army_loyalty_loc_5: "叛变意图"



#国策
 URS_1094_imperial_conference: "1094年帝国会议"
 URS_1094_imperial_conference_desc: "乌萨斯帝国自从“大叛乱”以来就陷入了一片混乱之中。于帝国境内，新贵族、旧贵族、帝国军等各大势力争斗不休，经济陷入停滞、民生破落凋零。而在圣骏堡的权贵们所鞭长莫及的东部边疆，一大群割据军阀则如雨后春笋般纷纷出现，互相征伐、乱作一团。但是，无论如何，日子总得过下去，乌萨斯仍要继续前进。\n\n北境大地迎来了六月的短暂夏日，由费奥多尔皇帝与改革派大臣伊斯拉姆·维特主持的1094年帝国会议即将开幕。这场会议将决定未来一年乌萨斯的治国路线，也将是我们阻止混乱蔓延、开始初步重建的起点。乌萨斯帝国的诸多乱象，是时候该理一理了。"
 URS_reopen_supreme_court: "恢复最高法庭运转"
 URS_reopen_supreme_court_desc: "作为帝国政治体系中最早感染上腐败与懈怠之疾的机构，全乌萨斯最高法庭现在只不过是一具散发着金钱臭味的腐尸罢了。不过，倘若我们决心恢复帝国诸律法丧失已久的效力和权威，恐怕就不得不让这具尸体起死回生，哪怕死而复生的是个丧尸。"
 URS_supervision_method: "监察手段"
 URS_supervision_method_desc: "在使得帝国最高法庭的那些大法官们不情不愿地重新开始工作后，我们接下来便可以一根根地斩断缠绕帝国官僚体系多年的贪污腐败之藤。尽管帝国中央目前的影响力还不足以建立完备的全国性政治监察系统，但改革派领袖伊斯拉姆·维特仍然坚持要设置一个直接对皇帝负责的临时监察机构来暂时承担反腐工作。"
 URS_appropriate_pressure: "适当施压"
 URS_appropriate_pressure_desc: "可悲的是，乌萨斯官僚体系中最为腐败奢靡的一类人却是帝国政府长期赖以依靠的贵族们。如果我们毫不留情地对他们展开横扫，就必然使圣骏堡的统治根基大为动摇。所以，保守派领袖安东·卡德洛夫建议我们施温以和之策——由保守派出面对贵族们加以适当的压力，以期贪污腐败之殇能够缓慢消解。"
 URS_ensuring_public_safety: "确保治安"
 URS_ensuring_public_safety_desc: "从圣骏堡的条条大街，到东达利亚的小小村庄；放眼帝国全境，治安效率低下的现象都可谓层出不穷。而我们若是连最基本的治安条件都无法保障，乌萨斯的律法又何以延伸？——制度化社会治安条例与准则、加大对警察队伍的管理与监督投入、确保治安执法流程高效化；我们必须做到，我们也能够做到。"
 URS_remove_thorns: "拔除刺头"
 URS_remove_thorns_desc: "在我们清贪扫腐的努力之下，帝国文官体系在整体上已经洁净了不少。然而，还有一部分大小官僚仍不愿接受这一变化，并在四处制造改革的阻力。对于他们这种“刺头儿”，我们下手时就可就不必那么优柔寡断了。"
 URS_establish_national_security_council: "建立帝国安全委员会"
 URS_establish_national_security_council_desc: "尽管政治与文化上的多元自由是改革派眼中现代社会的基本特征，但在这段动荡不安的特殊时期，我们却必须选择性地筛查并根除对那些帝国政府构成威胁的个人、组织或是思潮，以确保复兴工作顺利进行。保守派要员米哈伊·斯托雷平建议皇帝专门设立一个名为“乌萨斯帝国安全委员会”的机构来承担上述的工作，正如俗语所言——“此乃必要之恶。”"
 URS_eliminate_dissidents: "抹除异见分子"
 URS_eliminate_dissidents_desc: "实际上，所谓公正严明的帝国安委会并不难被某个政治派系所掌控，更何况我们当初在建立它时还给自己留了几扇后门。也就是说，我们完全可以利用安委会来大规模地抹除与圣骏堡步调不一致的异见分子——也包括我们在帝国皇庭中的政治对手。为了乌萨斯的未来，我们将掀起一场政治风暴，有计划地清除异见者以确保乌萨斯的政治稳定。"
 URS_infiltrating_secret_societies: "渗透秘密结社"
 URS_infiltrating_secret_societies_desc: "对待那些妄图推翻其君主的叛乱分子，帝国安委会绝不能简单地诉诸于暴力与镇压，而是要无声渗透、缓慢腐蚀，秘密肢解或是收买那些反抗皇庭的秘密结社。如此一来，我们便能在确保社会安定的前提下，逐个击破那些居于帝国之内的敌人。"
 URS_reestablish_government: "重设圣骏堡政务院"
 URS_reestablish_government_desc: "作为建立一个真正意义上的中央集权统一国家的第一步，我们必须放弃几乎等同于封君封臣体系的现有行政制度，转而重新设置一个强而有力的最高行政机构——即圣骏堡政务院，来恢复政府对乌萨斯腹地的有效管辖。尽管此举仍然无法挽救帝国在东达利亚地区日渐衰微的影响力，但至少可以让乌萨斯帝国之心恢复跳动。"
 URS_reorganize_state_offices: "重整各州政务院"
 URS_reorganize_state_offices_desc: "单单只在圣骏堡设立一个政务院是不够的。接下来，是时候在帝国地方各州继续推进中央集权体系的建设了。我们应当延续之前的策略，在各地设立类似的机构，并对圣骏堡政务院层层负责，形成一条层层向下的集中式行政链。这样一来，乌萨斯的心脏便将向四方迸出它应有的活力。"
 URS_establish_local_selfgovernment: "建立地方自治体系"
 URS_establish_local_selfgovernment_desc: "乌萨斯是一个地域辽阔的国家，高度集权的行政制度只会给本就摇摇欲坠的帝国双头鹰带来更为难堪的压力。所以，我们有必要在目前的改革基础上再适当放权于地方，以保障各州各族的文化权与自治权，同时降低行政压力。毕竟，只有帝国的臣民团结一心、携手共进，乌萨斯的古老皇冠才能再度焕发它往日的荣光。"
 URS_reorganizing_police: "重组警力"
 URS_reorganizing_police_desc: "乌萨斯帝国的执法力量鱼龙混杂而难以管辖，令政府长期十分头痛。纠察队、宪兵队、帝国军乃至内卫，他们的职权范围之间存在着无数重合之处与模糊地带，令帝国的执法行动极度低效而又混乱不堪。因此，我们很有必要将重组一支训练有素的警察部队，并规范警力与军力各自的行权范畴。只有如此，帝国的律法才能得以高效伸张。"
 URS_trust_civil_service: "信赖文官集团"
 URS_trust_civil_service_desc: "相比于陈腐的贵族们，由改革派为代表的进步文官集团显然是我们确保统治的更优选择。倘若我们确保了来自他们的支持，就可以在皇庭之内有效制约那些排斥革新的贵族群体，并大大压制后者的影响力。惟有施以此策，帝国才能继续向新纪元大步迈进。"
 URS_relying_on_aristocracy: "仰仗贵族群体"
 URS_relying_on_aristocracy_desc: "乌萨斯贵族不仅是地方乡绅豪强的主要组成部分，还在帝国文官体系中占了不少分量。如果我们要维系大帝的权威与圣骏堡的统治，就少不了来自贵族群体的支持。因此，惟有令他们在行政体系中发挥应有的作用，贵族们才会真正成为帝国伟业的基石。"
 URS_reshuffle_treasury: "改组财政部"
 URS_reshuffle_treasury_desc: "毋论已经一团糟的各地收支，单单是乌萨斯中央政府的财政现状就已经令人极度担忧。倘若我们希望将帝国经济从濒临崩溃的深渊中一把拉出，就必须先从改组中央财政部开始，分析财政状况、拆解违约债务、重新配置收支，一步步重建帝国经济的坚实后盾。"
 URS_tax_police: "税务警察"
 URS_tax_police_desc: "税务警察，这是在一年前帝国掌控力逐渐势微的时候便被开始组建的队伍，由原首都警卫和内务宪兵组成，而现在正是启用的时机。这支队伍只有一个目的，不惜代价恢复中央对地方经济的绝对掌控，这样经济才有恢复过来的可能。"
 URS_erect_gallows: "竖起绞架"
 URS_erect_gallows_desc: "税警已经出击，不出所料，有很多脑满肠肥的地方蛀虫显然并不想乖乖就范。那么我们也不妨用一些斯托雷平的老办法处理几个典型，来让他们重新考虑自己的抉择。"
 URS_reestablishing_local_control: "重建地方控制"
 URS_reestablishing_local_control_desc: "我们收回地方权力的计划执行的基本成功，当然，那些地方上的渣粹也没资格继续手握先皇赐予他们的领土了，帝国将重新派驻忠诚的官员进驻以掌控全局。"
 URS_foreign_trade_negotiations: "对外贸易商谈"
 URS_foreign_trade_negotiations_desc: "如今，帝国曾经的盟友已经分崩离析，但我们若是想撑过这一次的浩劫，就不得不重新找回跟我们一路的盟友，尽管我们还并不知道将付出怎样的代价。"
 URS_expanding_foreign_investment_access: "扩大外资准入"
 URS_expanding_foreign_investment_access_desc: "我们第一阶段的商谈已经落幕，接下来我们就该决定更重要的外资准入限度了。改革派的态度是全面开放，而保守者则恰恰相反，无论如何，这是刚刚喘过第一口气的帝国财政不得不决定的一环。"
 URS_joint_investment_projects: "联合投资项目"
 URS_joint_investment_projects_desc: "自从对外贸易和外国资本的引入后，我们国家的财政确实有好转的迹象，但所需的还远远不够，接下来的计划是更进一步的邀请别国的合作项目，但具体的实施方案还需更进一步的探讨。"
 URS_dealing_with_debt: "处理债务"
 URS_dealing_with_debt_desc: "当我们确立恢复方案，重组的财政部上交了一份报告，他们终于从成堆的债务中确认了大多是国内的资本，既然是内部那就好办了，危机当头，显然，我们该好好谈一谈。"
 URS_reduce_administrative_expenses: "缩减行政开支"
 URS_reduce_administrative_expenses_desc: "帝国正处危难当头，曾经的经验告诉我们，缩减行政开支是必不可少的一环。裁员砍预算，处理冗官冗员……再苦一苦行政部门，这都是为了更伟大的帝国。"
 URS_reduce_excessive_taxes: "减少苛捐杂税"
 URS_reduce_excessive_taxes_desc: "目前帝国的税收体系已经变成了一摊乱麻，曾经各地方都在收着各样的杂税，而政府拿不到一毛钱，自从我们重建了对地方的控制，是时候一刀整改了，把秩序的税收带回各地。"
 URS_aristocratic_industries_nationalization: "国有化贵族产业"
 URS_aristocratic_industries_nationalization_desc: "帝国财政还有一部分便是来自那数之不尽的产业贵族，无论是宫廷内外的贵族与帝国的财政都拥有密不可分的联系。我们需要将一部分的贵族产业进行国有化，无论是自愿还是被迫，这是恢复经济必不可少的部分。"
 URS_encourage_private_economy: "鼓励私营经济"
 URS_encourage_private_economy_desc: "落后的贵族经济体制已经不符合现在的时代变迁了，我们应该鼓励我国的私人经济发展，让经济流通起来。"
 URS_balance_the_books: "平衡收支"
 URS_balance_the_books_desc: "随着第一批经济措施完成，各部门和机构之间的预算已经铺平，工业化的道路已经夯实的地基，帝国政策上万年不变的赤字也第一次平衡了收支。接下来，我们将进行更进一步的经济改革。"
 URS_reconstruction_high_command: "重建最高司令部"
 URS_reconstruction_high_command_desc: "在“大叛乱”后，乌萨斯帝国的军事指挥体系就分裂成了数个相互独立的集团军总参谋部，缺乏统一的指挥与协调。为了终结这种无序状态，我们有必要重建早已支离破碎的前帝国军最高司令部，以此恢复对帝国军队的统一指挥与管理。"
 URS_change_has_come: "变革已至"
 URS_change_has_come_desc: "在军事战术日新月异的背景之下，乌萨斯帝国军也该丢弃那些名不副实的“光荣传统”了。让变革的浪潮席卷军队，让老气横秋的军人们接受时代的洗礼！倘若我们出于顾虑而选择更为保守之路，恐怕帝国军只会进一步坠入深渊。"
 URS_develop_the_tradition: "发扬传统"
 URS_develop_the_tradition_desc: "尽管新式战术正层出不穷，但这并不意味着帝国军需要全盘摒弃那些久经考验的军事传统。我们应该对优秀的传统进行筛选与保留，进而让乌萨斯军队的思想内核在这全新的时代中仍能得以发扬。"
 URS_dealing_with_stains: "处理污点"
 URS_dealing_with_stains_desc: " 在我们夜以继日的殚精竭虑之下，帝国军终于有点军队的样子了。这很好，但还不够。正巧，我们在军队那边的人寄来了一份文件，里面详实记录了一些老派高级将领的——呃，出格行为。这显然已经超出了军事法庭的职能极限，我们必须亲自决定对他们的处置措施。"
 URS_stick_to_bottom_line: "严守底线"
 URS_stick_to_bottom_line_desc: "在军事改革的推进之下，乌萨斯帝国军必须成为一支训练有素、听令行事的军队，而非四处烧杀抢掠、无法无天的乌合之众。因此，我们很有必要制定一定的交战准则，并一丝不苟地在各集团军推行它。"
 URS_considerable_progress: "昂首迈步"
 URS_considerable_progress_desc: "随着指挥体系的逐步重建，帝国陆军终于恢复了有组织、成建制的协同作战能力，并在多次模拟战役中取得了令人惊喜的成果。诚然，乌萨斯帝国军仍未恢复巅峰时期的作战水准，但他们依旧取得了值得肯定的进步。"
 URS_new_method_of_warfare: "全新战法"
 URS_new_method_of_warfare_desc: "“飞机”，世人以这个名称来称呼那些在四皇会战中首次亮相的空中铁罐。它们所具备的军事潜力或许将彻底颠覆帝国军现有的一切作战理论。“坦克”则是一个新生的军事名词，代表着机动性与泛用性比传统陆行舰更强的小型军用装甲单位。虽然我们目前的科研力量还不足以同时研发这两种新式兵器，但只要广泛列装二者之一，乌萨斯军队的综合实力就能得到质的飞跃。"
 URS_cast_sky_sword: "铸剑长空"
 URS_cast_sky_sword_desc: "显而易见，飞机在战争方面上的潜力可比那些笨重的坦克大得多！我们应该将现有资源更多地投入于资助空军研究、发展航空工业、训练职业飞行员，进而提升乌萨斯帝国空中力量的综合作战能力。至于坦克什么的——还是之后再说吧……？"
 URS_rule_the_earth: "统御大地"
 URS_rule_the_earth_desc: "相比脆弱的飞机而言，坚实的陆行舰显然更胜一筹。在战场上，它们既是无坚不摧而又坚不可摧的移动堡垒，又是全能而万用的指挥枢纽。然而，传统陆行舰的机动性缺陷却在“四皇会战”中暴露地淋漓尽致。为了弥补这一缺憾，我们应该将现有资源主要用于更加灵活的“坦克”的理论研究与实践探索中，进而实现对陆地战场的绝对掌控。至于飞机什么的——以后再考虑吧……？"
 URS_threedimensional_warfare: "立体战争"
 URS_threedimensional_warfare_desc: "大舰巨炮的时代已经过去，而我们先前所付出的努力则得到了丰厚的回报。新近整备完毕的乌萨斯空天部队已具备战略侦查、对地打击、协同作战等能力，他们将成为帝国军的苍穹先锋，并引领我们开启一个全新的军事纪元——立体战争时代。"
 URS_enlarge_production_capacity: "扩大产能"
 URS_enlarge_production_capacity_desc: "为了使新式兵器更快地投入广泛使用，我们或许该从帝国军总参谋部那里再“借”一点儿微不足道的经费来提升新式武器的产量指标。虽然这肯定会惹得那些老派军官们很不高兴，但是转念一想——只要能让帝国军重获新生，这点儿代价又算什么呢？"
 URS_tide_of_iron: "钢铁洪流"
 URS_tide_of_iron_desc: "在帝国无数精英的全力以赴之下，新式坦克就此诞生。圣骏堡的人们望向远方，那由钢铁与巨炮所汇成的洪流正浩浩荡荡地接受着皇帝的检阅。大地颤抖着，一双双惊惧交加的眼睛望着滚滚而来的时代浪潮，一只只满怀敬意的手臂伸向天空表达敬意。这支汇聚着帝国荣光的伟大军队，定将让整个世界为之战栗！"
 URS_strive_for_excellence: "精益求精"
 URS_strive_for_excellence_desc: "过于注重事物的数量，反而很可能忽略事物的质量。如果我们要研发出远胜于过去劣式战备的新型武器，就必须将重点放在提升它们的综合质量上。让我们戒骄戒躁，把现有的资金多多投入到科研与测试方面，并期待上述努力会得到丰富的回报。"
 URS_the_more_the_better: "越多越好"
 URS_the_more_the_better_desc: "过于注重事物的质量，反而很可能忽略事物的数量。我们花大价钱可不是为了仅仅得到几件稍微好用点儿的新式武器，我们要的是便于大规模化量产且可广泛列装于帝国军的制式装备。让我们全力以赴，把现有的资金多多用于压缩成本与优化流程，并期待上述努力会得到丰富的回报。"
 URS_1097_imperial_conference: "1097年帝国会议"
 URS_1097_imperial_conference_desc: "1097年帝国会议"

 URS_to_the_future: "迈向未来"
 URS_to_the_future_desc: "帝国会议尘埃落定，众望所归的改革派赢得了大帝的信任与议会的多数。如今，我们终于有机会以新贵族的意愿重塑古老的乌萨斯帝国了。朝阳缓缓升起、蓝图徐徐铺开，一个崭新的未来正等待着我们，等待着伟大而光荣的乌萨斯祖国"
 URS_conference_prologue: "大会序幕"
 URS_conference_prologue_desc: "第一次十月党团结大会即将揭开序幕。名义上，召开这场会议的用意是增进党内的理解与协作；实际上，它却是一场决定十月党 未来主导派系的大博弈。赢家未必全盘通吃，但输家定会失去一切。新贵族们将捍卫正统一派的权威，亦或是寻求更为激进的道路？一切将在瞬息之间尘埃落定。"
 URS_the_way_forward: "前进之道"
 URS_the_way_forward_desc: "正统一派的思想观念过度保守，他们治下的乌萨斯帝国只会日益腐化，而进步一派的政治纲领却又尤为偏激，他们跃进式的治国方针反会一败涂地。两相映照之下，只有马尔托夫的人文派最适合引领十月党乃至乌萨斯迈向未来。就让这年轻的改良者，带领我们走上乌萨斯的进步之路吧。"
 URS_emphasize_authority: "强调权威"
 URS_emphasize_authority_desc: "马尔托夫与克林斯卡娅或许已与十月党的正统路线渐行渐远，但如此局面却并不代表着他们可以脱离党中央而自行其是。如果这群自大的年轻人们非要不顾大局而恣意妄为，那就让维特大臣为他们上一堂深刻的政治课吧。"
 URS_Kerenskaya_invitation: "克林斯卡娅的邀约"
 URS_Kerenskaya_invitation_desc: "狄安娜·克林斯卡娅向以马尔托夫为首的人文派发来了晚宴的邀请函，如果狄安娜与她的进步派朋友对于即将到来的宴会怀有鲜明的政治意图，那么人文派就能借这次晚宴来取得狄安娜对马尔托夫的认可，甚至促成人文派与进步派的联手之势。"
 URS_Vitte_expectation: "伊斯拉姆的期望"
 URS_Vitte_expectation_desc: "一直以来，伊斯拉姆·维特都对马尔托夫寄予厚望，并希望后者可以成为十月党未来的接班者。也许维特并不明白一场全面变革的必要之处，但他却能理解马尔托夫拯救乌萨斯于水火之中的赤胆之心。因此，相比行将走火入魔的进步派，维特与他的正统派阁僚们更值得马尔托夫的信任。"
 URS_dominate_Octobrist_party: "统御十月党"
 URS_dominate_Octobrist_party_desc: "作为资历最老、规模最大、思想最成熟的十月党派系，维特大臣的正统派有责任，也有义务指导新贵族们走向惟一的正途。为了帝国的未来，我们必须不惜代价地巩固正统派在十月党中的绝对主导权，并压制来自其余两派的异议私语。只有如此，十月党才能排除万难、稳步前进。"
 URS_rudder_to_left: "船舵向左"
 URS_rudder_to_left_desc: "在人文派逐步获取十月党的领导权后，当下要务是尽快调整十月党未来的航线，以适应一个全新的、“改良社会主义”的新贵族领导层。在这之后，古老而光荣的乌萨斯便将迎来彻底的变革，帝国的进步之路也会归于马尔托夫所设置的轨道。"
 URS_smooth_sailing: "平稳航行"
 URS_smooth_sailing_desc: "正统派经受住了派系斗争的考验，并始终紧握着十月党的领导权。当下，有一件事显得尤为重要——向十月党，新贵族，乃至整个乌萨斯帝国彰显我们不变的初心与目的，并开始一步步地推行维特大臣那精密而谨慎的改革计划。"
 URS_results_of_recovery: "复兴计划的成果"
 URS_results_of_recovery_desc: "无论过去三年的复兴计划成效如何，它都成功稳住了乌萨斯帝国濒临崩溃的危局，并为我们提供了继续改革所需的收入来源与制度基础。现在，维特大臣决定以他最擅长的领域——经济为中心，带领十月党开始一系列更为激进的革新工作。"
 URS_restructuring_transportation: "重整交通系统"
 URS_restructuring_transportation_desc: "完整而健全的交通系统如同纵横曲折的大小血管,将帝国之心圣骏堡所泵出的资源与影响力输送至乌萨斯全境。然而，数量可观的公路与铁轨却在过去几十年间因混乱而被毁坏或荒废。因此，重建乌萨斯的交通系统应当成为进一步经济改革的要务之一。"
 URS_ural_railway: "乌拉尔大铁路"
 URS_ural_railway_desc: "相比于发展已经初具规模的帝国核心圈而言，优先振兴乌拉尔山脉西侧的一批新兴工业城市显然是更具前瞻性的选择。事不宜迟，我们必须立即将乌拉尔大铁路计划提上日程，并开始对其的初步研究与实地勘测。"
 URS_circular_rail_line: "环圣骏堡轨线"
 URS_circular_rail_line_desc: "相比于发展远离帝国核心的偏远地区而言，优先振兴环绕圣骏堡的中心圈铁路及电车网显然是成本更低、速度更快、效果更好的选择。事不宜迟，我们必须立即将环圣骏堡轨线网计划提上日程，并开始对其的初步研究与实地勘测。"
 URS_shift_construction: "轮班修建"
 URS_shift_construction_desc: "不够快，不够快，不够快！这条漫长绵延的铁道上可承载着乌萨斯帝国经济腾飞的希望，你们手中的铁锤都不许给我停下，哪怕只有一分一刻的刹那！为了最大化铁路的修建速度，我们应采取十二小时两班轮换工作制，让铁路施工的最前线成为不夜之城！"
 URS_supply_security: "供应保障"
 URS_supply_security_desc: "建设一个功能健全的交通系统绝不仅是用蛮力修几条公路、铁路或磁浮列车线那么简单。因此，随着工程规模的逐步扩大，我们需要重新规划一个完整且高效的物资供应体系，以在国道体系修建时为其提供必要的资源与支持。"
 URS_picking_up_legacy: "拾起遗产"
 URS_picking_up_legacy_desc: "尽管“大叛乱”重创了旧世代的交通网络，但在被毁国道的残址处仍然能找到可资利用的资源，甚至是保存完整的废弃路段。如果我们希望高效地完成铁路的修建，就必须有效地利用起这些往昔的遗产。"
 URS_all_connected: "四通八达"
 URS_all_connected_desc: "在为实现那雄心勃勃的铁路网计划而付出了无数努力之后，我们验收成果的那一刻终于到来了。随着寒风驶过的列车发出阵阵轰鸣，而乌萨斯帝国的威严与崇高也将随着纵横八方的铁路网而不断延伸。"
 URS_further_reform: "改革更进一步"
 URS_further_reform_desc: "在过去的三年间，我们所做的改革固然巩固了帝国上层建筑的稳定性，却并未彻底解决社会矛盾的根源。接下来，我们将会对整套腐朽而落后的帝国制度体系执行大刀阔斧的改革，并粉碎一切阻挡改革的障碍。"
 URS_special_meeting: "感染者政策特别会议"
 URS_special_meeting_desc: "为什么一个感染者会被称为“感染者”？或许是由于不幸的事故，或许是由于自身的疏忽，或许是由于某人的恶作剧——但无论如何，感染者们都必须背负着矿石病的原罪，在乌萨斯的土地上艰难地苟活着。同为大帝的臣民，我们绝不能因为区区矿石病就排斥与仇恨自己的同袍！让我们召开一场圣骏宫特别会议，向北陆全境展现十月党对改革感染者政策的决心！"
 URS_serfdom_abolition: "农奴制的退场"
 URS_serfdom_abolition_desc: "北境大地之上，无数被捆上重重缰绳锁链的农奴正从事着效率极度低下的农业劳动，他们生活拮据、地位低微，被当作感染者一般呼来喝去、避之若浼。无论是为了他们还是我们，这种现象都应该被终止。从现在开始，农奴应享有任何一位帝国合法公民都具有的基本人权，同时具有从旧贵族手中赎买自身成为自由人的权利。如此一来，他们便能化作驱动无数工厂呼啸运转的枚枚齿轮，令我们的经济向前迈进。"
 URS_old_mines_abolition: "旧矿场的落幕"
 URS_old_mines_abolition_desc: "乌萨斯帝国的旧矿场长期以来饱受世人诟病。我们之所以还保留着那些矿场，仅仅是因为它们具有低廉的雇工成本与高额的矿物产出。然而，在生产方式日益革新的冲击之下，它们早已失去昔日的价值。或许，是时候终结这些惨无人道的矿场，并尘封它们背后的黑暗往事了。"
 URS_fate_of_serfs: "农奴的归宿"
 URS_fate_of_serfs_desc: "农奴制的历史已经在乌萨斯告一段落，然而农奴问题却并未因此迎刃而解。无数农奴在被解放后失去了养家糊口的工作，部分人甚至因支付从旧贵族手中购买土地的赎金而负债累累。无论出于什么理由，我们都必须尽快决定这些前农奴的归宿与命运。"
 URS_status_of_unions: "工会的地位"
 URS_status_of_unions_desc: "尽管令人刻骨铭心的圣骏堡大动乱已经落下了帷幕，但它对帝国所造成的影响却不是一时半会儿可以消退的——一个显著而有力的证明就是遍布全乌萨斯工业区的所谓“工人联合会”。我们理应慎重决定这些组织在乌萨斯的地位，以及它们未来的命运。"
 URS_new_layout: "全新格局"
 URS_new_layout_desc: "我们在近期对乌萨斯政治体系的种种改革虽无法触及帝国的根本弊病，但也有力地缓解了曾经高涨不下的社会矛盾。如今我们所要做的，便是为这一段时期的改革画下句号，并为之后更为激进而触及本源的改革打下基础。"
 URS_emphasis_on_industrial: "重视工业发展"
 URS_emphasis_on_industrial_desc: "维多利亚、哥伦比亚等依靠工业迅速崛起的泰拉强国已经向我们昭示了这项技术的伟大力量。然而，乌萨斯本国的工业体系却因大叛乱的干扰和保守派的暗中抵制而极度落后。为此，我们必须着重对待那些冒着滚滚浓烟的钢铁巨兽，并将它们立为驱动帝国经济腾飞的基石。"
 URS_integrating_discrete_factories: "整合离散工厂"
 URS_integrating_discrete_factories_desc: "帝国的多数工业设施都相当离散地分布在北境荒原各处，无法形成一条有效率的工业生产链。因此，我们需要有序地对上述工厂逐步执行整合，将分散的生产设备进行集中化与一体化。如此一来，帝国的工业状况就能得到显著改善。"
 URS_empire_franchise: "帝国特许经营"
 URS_empire_franchise_desc: "多亏了保守派长期以来对中小资产阶级的疯狂压制，帝国的市场如今只能依靠几家由新贵族含辛茹苦拉扯养大的企业支撑。所幸，我们现在终于可以把指手画脚的保守派从经济指挥室里一把拉出来，然后以新贵族的所思所想来大刀阔斧地改造帝国经济了。"
 URS_expanding_power_plant: "扩建电厂"
 URS_expanding_power_plant_desc: "作为无数工业机器的唯一动力源，规模化的发电设施对于渴求工业化的乌萨斯帝国而言显得万分重要。然而，帝国现有的发电厂却难以负担工业之路所带来的能源压力。因此，我们有必要尽快对电厂进行扩建。"
 URS_factory_centralization: "工厂集中化"
 URS_factory_centralization_desc: " 整合化与集中化的工业区可以迸发出超乎我们想象的效率。这意味着，如果我们希望以相对薄弱的工业力量完成数目繁多的生产任务，就必须对前者进行更进一步的汇流与整合，以将数个工业枢纽的产能效率提升至极致。"
 URS_prepared_for_damage: "有备无患"
 URS_prepared_for_damage_desc: "尽管对工业设施进行整合与集中可以显著提升其产能效率，但这也意味着我们的工业枢纽更容易在战时被敌方瞄准并集火，进而使战时工业损耗不可避免地增加。考虑到日渐紧张的世界局势，我们或许该探索一条将工业离散化的道路。"
 URS_industrial_might: "工业伟力"
 URS_industrial_might_desc: "随着乌萨斯本国工业体系的蓬勃发展与高速运转，我们为了工业现代化所做出的种种努力在此刻受到了丰厚的回报。现在，工业的伟大力量将为我们所用，乌萨斯之鹰的崇高意志将随着钢铁机器冒出的滚滚浓烟而扶摇直上，直抵天穹。"
 URS_examining_military_top_brass: "审视军队高层"
 URS_examining_military_top_brass_desc: " 绍伊特拉茨的信警醒了我们——在过去的三年之间，我们只顾着提升帝国军队的战斗力，却忽略了其在政治方面上的巨大影响。现在，这个后果极其可怕的疏漏必须被弥补。让我们迈出第一步，开始重新审视乌萨斯帝国军的领导层与高阶军官。"
 URS_promote_young_people: "提拔少壮派"
 URS_promote_young_people_desc: "以绍伊特拉茨为代表的帝国军少壮派大多有过赴哥伦比亚或维多利亚留学进修的经历，因而能更加认同我们的改革思想。通过提拔少壮派军官，我们可以间接排挤那些忠于旧贵族的老将领，同时在军中创造改革思想的土壤。"
 URS_destroy_army_group_system: "摧毁集团军制"
 URS_destroy_army_group_system_desc: "落后而低效的集团军制度将乌萨斯帝国军由整体分割为了数个互相对立的子单位，同时还间接引发了二十年前那场骇人听闻的“大叛乱”。如果我们想要得到一支真正属于新乌萨斯的军队，就必须下定决心扫除集团军制的遗毒。"
 URS_beware_of_noble_officers: "盯紧贵族军官"
 URS_beware_of_noble_officers_desc: "在我们紧锣密鼓地推行军事革新之际，心怀不满的贵族派军官也在暗中对我们施加阻力，而这是十月党绝不能容忍的。倘若我们寻求在政治上全面掌控乌萨斯帝国军，就很有必要严密监视这些旧贵族在军队之中的代理人，并确保他们无法对我们接下来的工作造成阻碍。"
 URS_what_we_fight_for: "我们为何而战"
 URS_what_we_fight_for_desc: "一支真正具有战斗力的军队，必须知晓自己究竟为何而战。在往昔的漫长时光之中，那虚无缥缈的帝国荣耀让无数帝国军人白白葬身于战争之中；而在如今的全新世代来临之际，我们则将赋予帝国军真正的价值——为了值得尊敬的自我而战，为了光辉万丈的十月党而战，为了一个崭新的乌萨斯而战。"
 URS_advisory_officer_corps: "顾问军官团"
 URS_advisory_officer_corps_desc: "各人的事应由各人来做。既然养尊处优的贵族军官们不谙调兵遣将之道，我们就该将指挥帝国军的重任交予年轻而杰出的少壮派军官手中。为此，我们应当组建一个全新的，饱含新鲜血液的顾问军官团。"
 URS_integrate_command_system: "整合指挥体系"
 URS_integrate_command_system_desc: "在落后的集团军制被彻底终结之后，是时候建立一个更为集权且高效的帝国军指挥体系了。让我们对原属各集团军的指挥系统进行重组与整合，并将四分五裂的乌萨斯帝国军再度熔铸为一个不可分割的整体"
 URS_recalling_exiled_generals: "召回流放将领"
 URS_recalling_exiled_generals_desc: "“大叛乱”后，一批怀抱进步思想的帝国将领在保守派的暗中策划之下惨遭流放。但如今，十月党的掌权让我们得以重新启用他们。是时候下令召回这些将领了，他们定能为帝国军树立一个全新的榜样。"
 URS_set_off_reform_trend: "掀起改革思潮"
 URS_set_off_reform_trend_desc: "在一切铺垫工作准备到位后，眼下的帝国军急需一场改革主义思潮的洗礼。凭借着这次思想浪潮的冲击，军队少壮派将获得足以扳倒贵族派将领集团的绝对优势，而我们也将顺势为掌控帝国军铺平最后一步道路。"
 URS_infected_enlistment: "感染者入伍"
 URS_infected_enlistment_desc: "尽管帝国社会对感染者存在着巨大的偏见与敌视——而后者能够造成的各类危害也的确不可小觑——但这仍然无法否定矿石病感染者在作战方面上的独特优势。倘若能令感染者在严格限制与层层考核下加入帝国军的行列，源石技艺的可怕力量就将被我们所掌控。"
 URS_new_commander: "新司令上任"
 URS_new_commander_desc: ""
 URS_victory_of_Octobrist_party: "十月党的胜利"
 URS_victory_of_Octobrist_party_desc: "社会矛盾日渐消散，社会经济重回正轨，帝国军队再振雄风，我们终于做到了！新贵族们所取得的丰功伟绩足以证明——十月党能够，也必将带领乌萨斯走上未来之路！为了崭新而美好的明天，为了光荣而伟大的帝国，让英明的十月党与新贵族带领我们向未来前进！"


#事件
 test_urs.1.d: "“帝国会议结束了，大概的情况我也知道了。”昏黄的灯光下，费奥多尔大帝放下了手中的一叠叠报告，抬头望向他面前的议长维特，“伊斯拉姆，你怎么看？”\n\n灯光照亮了维特的额头，他的下半张脸则被黑暗所笼罩：“殿下，决定乌萨斯命运的时刻已经到来了。”\n\n“伊斯拉姆，把话挑明了讲。”大帝目光犀利，“无须顾忌，这里只有你我二人。”\n\n“是，殿下。”议长的声音出现了一丝颤抖，但顷刻间便恢复正常，“自大叛乱以来，帝国已经迈过二十年岁月。然而，被大叛乱所激化的无数危机却并无缓解之势。”\n\n寒风吹拂而过，吊灯微微摇晃。变幻的光影笼罩了二人的面庞。\n\n“我与卡德洛夫此前曾各自主持过不少改革，试图扭转帝国的颓势，但无一成功。”维特顿了顿，“所以，我们在帝国会议上达成了共识——要想拯救帝国，就必须先联合新旧贵族的力量。”\n\n“然而，就像我此前说的，潜藏于暗处的万千威胁已经汇聚成了一股可怕的力量。它们蠢蠢欲动，渴望将整个乌萨斯帝国拖入毁灭的深渊。”\n\n凛冽寒风发出可怖的吼声，纤细的吊灯正摇摆欲坠。忽明忽暗的光影仿佛议长口中帝国的命运，悬而未决、动摇不定。\n\n“所以，帝国就此来到了命运的交界处，两条路已经在我们面前展开。”维特道，“一条，名为改革；另一条，名为终焉。”\n\n一阵沉默后，费奥多尔缓缓开口道：“你想把整个帝国绑上你的改革战车。”\n\n“殿下，除此以外，别无他路。”议长诚恳地说，“我所能做之事，惟有虔诚祈祷。祈祷那辆改革战车不会跌落绝壁，然后摔得粉碎。”\n\n大帝一言未发，维特也知趣地保持着沉默。寂静笼罩了厅堂。北风呼啸，宛如哀鸣。\n\n良久，费奥多尔开口了。\n\n“伊斯拉姆，知道我最喜欢你的哪一点吗？”\n\n“请讲，殿下。”\n\n费奥多尔注视着维特，维特则毫不退缩。最后，大帝轻叹一声，说道："
 test_urs.1.a: "“无畏。”"

 focus_urs.1.t: "法庭的平凡一幕"
 focus_urs.1.d: " 作为全乌萨斯最高法庭的首次开庭，费奥多尔大帝与维特议长都亲自莅临了金碧辉煌的法庭大厅，在顶层座席上冷冷注视着法庭内所发生的一切。\n\n“——传唤被告人，前乌萨斯帝国财政部副部长，圣温伯爵，伊万·列昂诺夫。”传令官面无表情地喊道，两位宪兵一左一右地将一个大腹便便的男人架进了被告席。那男人神情慌张，左顾右盼，嘴里不住地喊道：“我是无辜的！你们……你们要为自己的无礼付出代价！”\n\n“……即使已经失去所有，还不愿放下贵族的架子吗？”费奥多尔若有所思地自语道。\n\n居于首席的大法官严厉地开口道：“列昂诺夫前伯爵，你被指控利用职权之便贪污四百三十万切尔文，擅自挪用公款以作私用，非法扩大自己在圣温的家族封地。你是否承认以上指控？”\n\n“我……我不承认！”那男人额头上沁出点点汗珠，“这是对我和我的家族的污蔑！我是……是无辜的！我要叫律师！”\n\n“书记官，记录以上发言。”法官的声音越发严厉，“列昂诺夫前伯爵，你无权要求传唤你的律师团队，这是对你的单独特别审判。”\n\n“不……不！”肥胖的男人双眼暴凸，发疯般地想要挣脱宪兵的束缚，“我是无辜的！你们不能这么做！……求求你！”\n\n“肃静！”法官用木槌猛敲了一下桌面，然后从桌下拿出一个微型窃听器。他冷笑着按下了窃听器的播放按钮。列昂诺夫猥琐的声音立即响彻鸦雀无声的法庭：\n\n“奥里诺，没错，再把这一箱搬上车……那群议会的蠢货们，修几个破水坝难道就能让钱来生钱了吗？还不如把它们统统装进我的钱包，让我那美丽的葡萄园变得再大一点——”\n\n另一个略显生涩的声音响起，大概是列昂诺夫的仆人：“大人，钱已经全搬上马车了。”\n\n“好，好……这可是几百万切尔文啊……”一阵咯咯笑声过后，录音戛然而止。\n\n“列昂诺夫前伯爵，你还有什么想说的吗？”法官嫌恶地把窃听器塞进桌下，然后问道。\n\n“我……”肥胖的男人不知所措地四下张望。毫无预兆地，他的脸突然开始抽搐，紧接着，抽搐症状蔓延到了他的双手。法官看出了男人的异样，但就在他开口询问的一瞬间，那男人竟然口吐白沫，直挺挺地向后倒去。\n\n“医生，叫医生过来！”法官喊道，整个法庭霎时陷入了混乱。\n\n“唉……”费奥多尔叹息道。片刻后，他转向身旁的维特，开口说道："
 focus_urs.1.a: "“多少体谅一下这个误入歧途的可怜人吧。”"
 focus_urs.1.b: "“可以为这个卑贱的可怜虫准备绞刑架了。”"
 focus_urs.2.t: "街巷之内"
 focus_urs.2.d: "“叶列娜，快跑！”一声绝望的吼叫撕破了寂静的夜晚，就连街头老树上栖息的那群黑鸦都随之扑翅逃散。这声音来自一对年轻情侣中的男青年，他正被蒙面的歹徒用小刀抵住喉咙。而他的另一半，则慌张地往另一处街角跑去。\n\n高跟鞋敲地的声音在街巷中回荡，叶列娜正慌张地敲打一扇又一扇门，可却它们无一打开。周边的窗户零零星星地亮起了微光，几颗好奇的脑袋探出窗来，然后又急忙缩回。\n\n终于，叶列娜被逼到了一个死胡同。三个歹徒缓缓地向她靠近。明晃晃的路灯之下，他们臂上的黑色斑痕正隐约闪着光泽。叶列娜似乎已经可以闻到他们嘴边逸散的口臭，她只能在心中默默祈祷，祈祷自己不会遭遇和那位贵族出身的男友一样的下场。\n\n“妞儿，知道我们为什么要干掉你吗？”为首的歹徒擦拭着他手中的匕首，冷笑道。\n\n叶列娜没有回答，只是不住地发颤。\n\n“你那小男友的老爸是个他妈的矿场主，该下地狱的混蛋。”那歹徒恶狠狠地道，用嘴舔了舔匕首，“我们的十几个弟兄死在了他手下。知道吗？他们是在矿井里活活累死的。”\n\n叶列娜抖得更厉害了。\n\n“去他妈的纠察队吧，我不在乎明天还能不能活着，今晚我们只求复仇。”歹徒目不转睛地盯着叶列娜，目光开始上下扫动，“哟呵，有几分姿色嘛...不如让我们来乐一乐吧——”\n\n此刻的叶列娜双眼紧闭，等待着迎接着自己的可怕命运。但是，她却只听到了几声枪响和歹徒的惨叫。她小心翼翼地睁开眼，发现那三个歹徒早已被打成了筛子，正头朝天地躺倒在自己的血泊里。几个军人装束的家伙快步上前，俯身检查歹徒的情况。少顷之后，他们喊道：“确认暴徒已被击毙！”\n\n一名军官这才现身。他先和士兵小声交谈了几句，然后向叶列娜敬了个礼，用洪亮的嗓音说道：“小姐，十分抱歉，希望我们没有来迟。”\n\n叶列娜局促不安地看着军官衣领上的金质徽章，那是一个她从未见过的样式。\n\n“你们...是谁？是纠察队吗？——还是宪兵队......”\n\n“都不是，小姐。”军官安抚性地拍了拍叶列娜的肩，然后说道："
 focus_urs.2.a: "“我们是圣骏堡警队，你可以信任我们。”"
 focus_urs.3.t: "走向末路"
 focus_urs.3.d: "斯潘诺维奇公爵百无聊赖地用指节叩着桌面，发出有节奏的响声。午后的阳光透过百叶窗照入室内，挂钟的指针正慵懒地缓缓旋转。又是一个微不足道的平凡下午，他想。\n\n然而，他的想法却被一阵急切的敲门声所打破。他不耐烦地打开门，一张焦急的脸探了进来：“公爵大人……我们可能暴露了。”\n\n斯潘诺维奇脸色剧变：“进来说。快！”\n\n那人挤进了公爵的办公室，几乎要跌倒下去：“大人，他们发现了……他们发现我们往莱塔尼亚转移资金的账单了！”\n\n“蠢货！”公爵气急败坏地打了那人一耳光，“我跟你说过最近行动要低调点……那个该死的维特，原本我们马上就能离开埃法这个鬼地方，去沃姆伦德过上好日子——”\n\n眼看着公爵又要再扇一耳光，却突然停下了手：“——也罢。快去帮我收拾行李，你这个笨手笨脚的混蛋，我们今天日落时就逃去莱塔尼亚西境领……”\n\n这时，敲门声再度响起。斯潘诺维奇狠狠地一把拉开门，正要大骂一句时，却突然把溜到嘴边的脏话咽回了肚里——一名军官正倚靠在门口，腰间的铳套里插着一把铳械。\n\n“呃……日安，先生。”斯潘诺维奇紧张地笑道。\n\n“嗯——埃法贵族会议议长，斯潘诺维奇公爵大人，是您没错吧？”军官翻着手上的一沓花名册问道，没等公爵回应，他就继续说道：“您不需要劳神去莱塔尼亚西境领了，圣骏堡监狱的大门已经为您敞开。”\n\n“我不明白您在说什么，先生。”斯潘诺维奇应道，他的额头已经沁出冷汗。\n\n“实际上，我现在或许该称呼您为——斯潘诺维奇前公爵了？”军官脸上讽刺般的笑容已经逐渐褪去，取而代之的是显而易见的嫌恶。\n\n斯潘诺维奇还未来得及答话，那军官就大手一挥道：“宪兵，拷走他！”\n\n尽管汗如雨下，斯潘诺维奇却如坠冰窟。突然出现的两个宪兵一左一右，将他上铐架起。那名军官则踱步走进他的办公室，开始饶有兴趣地翻看他私吞公款的各种罪证。公爵的大脑一片空白，惟有一个念头如秃鹫般在他的心头盘旋……"
 focus_urs.3.a: "……他完了。"

