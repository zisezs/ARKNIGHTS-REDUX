 VAB_Elite_conciliators: "精英派调和者"

 #国家精神
 VAB_Left_and_right: "左右逢源"
 VAB_Left_and_right_desc: "詹姆斯·亚伯科恩既没有辽阔的公爵封地，也从无足以改变帝国局势的军事力量。这令他在八大公爵的内部圈子中长期居于边缘地位。为求自保，亚伯科恩不得不在高多汀与威灵顿之间左右逢源，确保属于自己的脆弱生态位不会一夕崩溃。可惜，随着维多利亚进一步滑向崩溃，这名小公爵或许终将成为二者其一的权斗工具。"
 VAB_Maritime_trade_is_booming: "海贸繁荣"
 VAB_Maritime_trade_is_booming_desc: " 在一众小公爵领中，惟有亚伯科恩公爵的封地毗邻海洋。随着维多利亚帝国逐渐陷入动荡，高多汀与威灵顿两大滨海公爵领相继启用贸易封闭政策，而亚伯科恩公爵领则迅速发展为帝国境内最大的海贸黑市军火中转站。于是，这笔意料之外的利润随即滑入公爵的腰包中。"