 #人物
 VAB_James_Abercorn: "詹姆斯·亚伯科恩"
 VAB_James_Abercorn_desc: "在维多利亚八大公爵之中，詹姆斯·亚伯科恩——第二代亚伯科恩公爵，或许是最受塔拉人与盖尔兰人欢迎的一员了。虽然他出身于盎格兰的贵族家庭，却在继承爵位后成为了传统的塔拉贵族之一。他致力于扩大渐进式改革与捍卫塔拉人权益，主导完成了多个塔拉地区与盖尔兰地区的公共福利项目，深受封地民众的爱戴。\n魔族入侵后，亚伯科恩公爵仍然坚持着民族调和与务实主义的基本步调，试图维系公爵领地内的旧有秩序。然而，维多利亚已容不下一寸安宁之地，亚伯科恩与他的子民也逃不过卷入战争的命运。现如今，他只能寄希望于长袖善舞的外交手腕，在乱局中勉强保住自己的这块小小领土。"
 VAB_Major_maritime_oligarchs: "各大海运寡头"
 VAB_Radical_military_clique: "激进军人集团"

