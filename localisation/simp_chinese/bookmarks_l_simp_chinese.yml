 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 COUNTRY_SELECTION_CHARACTER_DESC: ""
 ARK_SCENARIO1_DESC: "£episode_1"
 ARK_SCENARIO1_NAME: "在寒冷的北方，\n\n二十年前大叛乱的阴云如今仍笼罩在乌萨斯之上，\n\n异见者们在等待时机，\n\n反抗的火种也已在东达利亚冻原点燃。\n\n"
 ARK_SCENARIO2_DESC: "£episode_2"
 ARK_SCENARIO2_NAME: "在泰拉的中央谷地，\n\n往日的维多利亚帝国如今笼罩在金融风暴和革命混乱的双重阴云之下，\n\n公爵们争先恐后地撕扯着帝国的尸体，\n\n而维多利亚的敌人和旧友也都期待着分一杯羹。"
 ARK_SCENARIO6_DESC: "£episode_6"
 ARK_SCENARIO6_NAME: "大狩维天\n\n一纸诏令自百灶传出，各道衙署连夜张榜：凡有胆气者，无论猎户、术师还是天师府学徒，皆可应募入陵。\n\n诏书上没写「岁」，只写着「巨兽」。\n\n司岁台的折子一夜比一夜厚，秉烛人下陵一月比一月密。守了千年的那桩旧事终于要做个了断——这一回不再是巡陵，也不是再补一次封印。"

 ARK_SCENARIO7_DESC: "£episode_7"
 ARK_SCENARIO7_NAME: "哥伦比亚实验\n\n「如若此后百年千年，来人漫步于繁星身侧，人们便要赞颂她的名。」\n\n「弧光一号」是一沓写给军方的废纸，那座藏在垃圾场里的环形巨构只有一个真名：万星园。它替泰拉撕开过一次天幕，让双月露了脸，而把它送上天的人没有回来。\n\n十科合议厅彻夜亮着灯——止损清算，还是把她的实验做到底。城门外等着要交代的有政府、军方和梅兰德基金会，城内等着接盘的比这更多。\n\n总辖塞雷娅可以用铁拳把实验室守成国界，可以让整座城市沉进水面的倒影里，也可以抬头再看一眼那颗星。天空被撕开过一次，就能被撕开第二次。"

 ARK_SCENARIO8_DESC: "£episode_8"
 ARK_SCENARIO8_NAME: "北方的雪原帝国。冬将军统治着配给、征召、流放与沉默；皇帝在冬宫深处缺席，内卫用黑档案维持秩序，圣愚赤脚走过村庄，北原裂口在梦里低语。\n\n你继承的是辽阔冻土、沉重军工和永不满足的边界，也是旧账、边疆、寡头与枯竭的人口。解冻沉默，封圣疯癫，或向暖海进军。每一条路，雪都会记住。"
 ARK_SCENARIO9_DESC: "£episode_9"
 ARK_SCENARIO9_NAME: "尽情变革吧，超级叙拉古人！"
 ARK_SCENARIO10_DESC: "£episode_10"
 ARK_SCENARIO10_NAME: "望见烈日焚烧天空之影。\n望见君王的国沦殁，隐逸在心中的最后喉音。\n恩典永恒，如金律不可动摇。\n权威无情，泪滑过脸庞。\n告别他的愿景。告别他的罪。献上君王的终局。\n拾级而上吧，此为步上双塔之时。"

 RHL_ARK_SCENARIO_DESC: "莱茵生命不是哥伦比亚的一家公司，而是哥伦比亚的另一套政府。\n\n它用科学许诺未来，用资本收买现在，用实验消耗过去。\n\n当它成为国家，天空就是它的领土，星门就是它的边境，而每一个哥伦比亚人，都是它的股东——或者它的耗材。"

 CLB_ARK_SCENARIO_DESC: "未来将会更新"
 GUL_ARK_SCENARIO_DESC: "未来将会更新"

 LTN_ARK_SCENARIO_DESC: "一千多年前，十支部族的先贤在同一段旋律下立盟。金律乐章既是这个国家的宪法，也是全泰拉最庞大的一件法术：它规定了选帝侯如何推举皇帝，也规定了每一个莱塔尼亚人如何感受美。\n\n坐在双塔上的是两个诞生于术式的女儿。她们杀死了上一任皇帝，也继承了他的高塔、他的信徒与他留下的那套权力结构。一白一黑两座塔由廊桥相连，文书上至今写着两个签名。\n\n九位选帝侯各有政府、法律与军队。他们畏惧的从来不是巫王这个名号，而是双塔会走上他的旧路。北方的冬灵山脉里，最初定居者的歌谣只在下葬时响起；南方的夕照区里，街上的居民被告知自己没多长时间了。\n\n这个国家有最好的法典、最好的学校与最高的法术普及率，而眼前没有一样东西能随手推动。要么在锁链里做选择，要么去改这根锁链。"
 URS_ARK_SCENARIO_DESC: "他们说你统治乌萨斯。可乌萨斯不属于皇帝，它属于冬天。\n\n配给簿决定谁活，征召令决定谁死，黑档案决定谁从未存在。圣愚在雪中布道，说皇帝已死，说北方有东西在应答。军官等待命令，村庄在沉默中消失，而冬宫里的座位一直空着。\n\n现在你坐上去。你可以让春天融化沉默，可以让疯癫登上圣坛，也可以让帝国的渴求吞没边界。\n\n但记住：乌萨斯不缺严寒、军队和敌人。它缺的是一个不必再靠严寒团结的理由。"
 YAN_ARK_SCENARIO_DESC: "未来将会更新"
 YAN_DASHOU_ARK_SCENARIO_DESC: "岁陵的封印已经撑不了太久了。\n\n司岁台的记档一年比一年厚，秉烛人下陵的次数一月比一月密，而百灶街市上的说书人还在讲那桩不能细讲的事。太傅主张再谈一谈，太尉主张直接动手，十二片碎片各有各的打算，龙门递来的折子压在御案最底下。\n\n真龙坐回那张空了很久的椅子时，大炎能选的其实只剩两条路：要么替岁兽再拖一代人，要么举国为狩，把这桩千年旧事一次做尽。"
 BNF_ARK_SCENARIO_DESC: "未来将会更新"
 SAG_ARK_SCENARIO_DESC: "未来将会更新"
 GLD_ARK_SCENARIO_DESC: "未来将会更新"

 VIC_ARK_SCENARIO_DESC: "维多利亚帝国曾是中陆无可置疑的霸主，它击败高卢雄鹰，执起工业革命之火炬，引领着泰拉向前的道路。可随着阿利斯泰尔二世皇帝之死及随后的诸多混乱，帝国如今已是摇摇欲坠。八大公爵各怀野心，难以团结；皇位长久空缺使得议长职位亦长期空缺，进而致使帝国引以为傲的立宪制度运转失灵。\n\n这些浮现在帝国表面之上的危机就已无比棘手，可于破碎金瓯的外表之下，深层问题才更多地困扰着帝国。从诺曼底到卡拉顿，从纳斯尔纱到康诺特群岛，分离主义之火正灼烧着陨落雄狮的躯体。而转望伦蒂尼姆，“卡兹戴尔军事委员会”的占领亦是当下难题。在此等时局之下，帝国能否走出当下泥潭，再度复兴旧日光辉？这对于亿万维多利亚人而言都仍是个值得思考的问题。"
