 SRC_QIQIU_ARK_SCENARIO_DESC: "叙拉古不属于七座山丘，它属于那些懂得在葬礼上微笑的人。\n\n家族用秩序粉饰暴力，灰厅用律法粉饰家族，而脚下的土地只记得两件事：谁签下了那张禁令，谁又在狂欢节戴上了面具。\n\n荒芜与狂欢、萌芽与市政、纯白与审判——三条路都通向同一座城，也都要求你先背叛它的一部分。"

 UFE_ARK_SCENARIO_DESC: "多年以来，乌萨斯都把科雷马边疆区当做自己的“帝国御用垃圾桶”，他们把大多数革命民主派政治犯流放到此地，并且丝毫不关心科雷马的社会发展。\n\n帝国政府的委任官僚格伦沃夫十年如一日地对当地人敲骨吸髓以中饱私囊，完全没有意识到科雷马边疆区早已暗流涌动。忍无可忍的民众即将要了他的命；而卧薪尝胆的民主革命者很快就要接管这片土地，并将其改造成一片志在摧毁乌萨斯帝国的革命根据地。"
 REU_ARK_SCENARIO_DESC: "在塔露拉用银色的利剑刺穿科西切的胸膛的那一刻，她对自己的未来还没有计算到今天。迷茫的少女在冻原之上游荡，她曾有过一段安顿生活，却又因感染者纠察队的迫害，不得不与农家养女阿丽娜一同再度逃亡。之后，塔露拉率领的一小队感染者与“爱国者”博卓斯卡替所率的叛逃盾卫合流，并凭着自己的信念号召成为了游击队的领导者。\n\n如今，队伍在贝加尔湖畔一个名为拉泽的小村镇周边建立起了根据地，以为未来前往南方并攻占移动城市的计划做好准备。然而，缺乏足够的物资补给，这些游离在冻原之间的散兵游勇们，真的能做到一举夺下切尔诺伯格的壮举吗？而就连塔露拉自己也无法判断的是，那条狡诈的黑蛇设下的诅咒，会在什么时候给襁褓中的整合运动致命一击……线团即将绷断。"
 KMG_ARK_SCENARIO_DESC: "那场震撼泰拉的大叛乱既撕裂了乌萨斯社会，也带走了老萨文科夫将军的性命。身为叛徒后裔的萨文科娃与母亲被送往家族的祖传封地，在内卫监视下度过了自己的童年和青春期。事过境迁，她如今正立足于母亲治理下已打下工业基础的克缅哥罗德城，凭借出色的文学造诣和社交技巧，成功在上层社会重获一席之地。\n\n母亲死后，波尔卡·萨文科娃如今已无任何亲人，只有老管家与她的密友陪在身边。她固然铭记着自己的家族是如何沦落至此，但她也明白，乌萨斯不可能也不应该向着老公爵希望的方向改变。在多年的文学创作中，她也明白了些许社会运行的逻辑。以冻原为纸，兵锋为笔，克缅哥罗德女大公，波尔卡·萨文科娃，即将推出她的下一部巨作。"

