 #OMN_ARK_SCENARIO_DESC: "斯塔夫罗波尔拥有着东达利亚最辽阔的平原地带，是远离乌萨斯中央政府外唯一的粮食生产基地，通过保持着与其他公爵领的贸易往来，乡村与田野得以在当下的和平时期得到恢复与重建。\n许多遭受到了战火摧残的乌萨斯人聚集于此，但这也使得这片土地上的人民长久以来处于了一种悲伤和抑郁的情绪当中，直到一位宣布自己是受到了天父启示，来将天意和救赎散播到这片饱受摧残土地上每一处，每一个人心中的传教士的到来。\n他以【亚利乌什·索洛维奇·莫吉拉】自称，并宣称因为罪人和孽物没有得到审判，因而导致天父让天灾降于人间以惩戒这片大地上所有的凡人。而他原是一位愚昧的不信者，直到他在一次病痛导致的昏迷当中梦见了天父，并在他那里得到了宽恕和使命，而这也是他为何离开了乌萨斯的繁荣西部，来到此地的原因。\n随着天父使者的到来，新的宗教开始在这片土地上生根发芽，他被那些众信者称之为【新正教】，虽然创立后缺乏成体系的教典和刑法，但是这并不妨碍它成为信教者心中的精神支柱和斯塔夫罗波尔人民团结一致的最好象征。"