 COUNTRY_SELECTION_CHARACTER_DESC: ""
 ARK_SCENARIO1_DESC: "£episode_1"
 ARK_SCENARIO1_NAME: "在寒冷的北方，\n\n二十年前大叛乱的阴云如今仍笼罩在乌萨斯之上，\n\n异见者们在等待时机，\n\n反抗的火种也已在东达利亚冻原点燃。\n\n"
 ARK_SCENARIO2_DESC: "£episode_2"
 ARK_SCENARIO2_NAME: "在泰拉的中央谷地，\n\n往日的维多利亚帝国如今笼罩在金融风暴和革命混乱的双重阴云之下，\n\n公爵们争先恐后地撕扯着帝国的尸体，\n\n而维多利亚的敌人和旧友也都期待着分一杯羹。"
 LTN_ARK_SCENARIO_DESC: "一千多年前，十支部族的先贤在同一段旋律下立盟。金律乐章既是这个国家的宪法，也是全泰拉最庞大的一件法术：它规定了选帝侯如何推举皇帝，也规定了每一个莱塔尼亚人如何感受美。\n\n坐在双塔上的是两个诞生于术式的女儿。她们杀死了上一任皇帝，也继承了他的高塔、他的信徒与他留下的那套权力结构。一白一黑两座塔由廊桥相连，文书上至今写着两个签名。\n\n九位选帝侯各有政府、法律与军队。他们畏惧的从来不是巫王这个名号，而是双塔会走上他的旧路。北方的冬灵山脉里，最初定居者的歌谣只在下葬时响起；南方的夕照区里，街上的居民被告知自己没多长时间了。\n\n这个国家有最好的法典、最好的学校与最高的法术普及率，而眼前没有一样东西能随手推动。要么在锁链里做选择，要么去改这根锁链。"
 VIC_ARK_SCENARIO_DESC: "维多利亚帝国曾是中陆无可置疑的霸主，它击败高卢雄鹰，执起工业革命之火炬，引领着泰拉向前的道路。可随着阿利斯泰尔二世皇帝之死及随后的诸多混乱，帝国如今已是摇摇欲坠。八大公爵各怀野心，难以团结；皇位长久空缺使得议长职位亦长期空缺，进而致使帝国引以为傲的立宪制度运转失灵。\n\n这些浮现在帝国表面之上的危机就已无比棘手，可于破碎金瓯的外表之下，深层问题才更多地困扰着帝国。从诺曼底到卡拉顿，从纳斯尔纱到康诺特群岛，分离主义之火正灼烧着陨落雄狮的躯体。而转望伦蒂尼姆，“卡兹戴尔军事委员会”的占领亦是当下难题。在此等时局之下，帝国能否走出当下泥潭，再度复兴旧日光辉？这对于亿万维多利亚人而言都仍是个值得思考的问题。"
 VWI_ARK_SCENARIO_DESC: "提示：维多利亚温德米尔边防集团军在游戏开局不可游玩，请先游玩维多利亚帝国，并通过事件选择维多利亚温德米尔边防集团军"
 VCA_ARK_SCENARIO_DESC: "提示：维多利亚开斯特势力圈在游戏开局不可游玩，请先游玩维多利亚帝国，并通过事件选择维多利亚开斯特势力圈"
 UFE_ARK_SCENARIO_DESC: "多年以来，乌萨斯都把科雷马边疆区当做自己的“帝国御用垃圾桶”，他们把大多数革命民主派政治犯流放到此地，并且丝毫不关心科雷马的社会发展。\n\n帝国政府的委任官僚格伦沃夫十年如一日地对当地人敲骨吸髓以中饱私囊，完全没有意识到科雷马边疆区早已暗流涌动。忍无可忍的民众即将要了他的命；而卧薪尝胆的民主革命者很快就要接管这片土地，并将其改造成一片志在摧毁乌萨斯帝国的革命根据地。"
 REU_ARK_SCENARIO_DESC: "在塔露拉用银色的利剑刺穿科西切的胸膛的那一刻，她对自己的未来还没有计算到今天。迷茫的少女在冻原之上游荡，她曾有过一段安顿生活，却又因感染者纠察队的迫害，不得不与农家养女阿丽娜一同再度逃亡。之后，塔露拉率领的一小队感染者与“爱国者”博卓斯卡替所率的叛逃盾卫合流，并凭着自己的信念号召成为了游击队的领导者。\n\n如今，队伍在贝加尔湖畔一个名为拉泽的小村镇周边建立起了根据地，以为未来前往南方并攻占移动城市的计划做好准备。然而，缺乏足够的物资补给，这些游离在冻原之间的散兵游勇们，真的能做到一举夺下切尔诺伯格的壮举吗？而就连塔露拉自己也无法判断的是，那条狡诈的黑蛇设下的诅咒，会在什么时候给襁褓中的整合运动致命一击……线团即将绷断。"
 KMG_ARK_SCENARIO_DESC: "那场震撼泰拉的大叛乱既撕裂了乌萨斯社会，也带走了老萨文科夫将军的性命。身为叛徒后裔的萨文科娃与母亲被送往家族的祖传封地，在内卫监视下度过了自己的童年和青春期。事过境迁，她如今正立足于母亲治理下已打下工业基础的克缅哥罗德城，凭借出色的文学造诣和社交技巧，成功在上层社会重获一席之地。\n\n母亲死后，波尔卡·萨文科娃如今已无任何亲人，只有老管家与她的密友陪在身边。她固然铭记着自己的家族是如何沦落至此，但她也明白，乌萨斯不可能也不应该向着老公爵希望的方向改变。在多年的文学创作中，她也明白了些许社会运行的逻辑。以冻原为纸，兵锋为笔，克缅哥罗德女大公，波尔卡·萨文科娃，即将推出她的下一部巨作。"
