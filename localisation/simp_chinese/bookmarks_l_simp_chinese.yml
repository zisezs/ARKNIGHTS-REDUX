 KJG_ARK_SCENARIO_DESC: "谢拉格，这片停滞之地正向着那命运的十字路口不断前进。自1065年奥拉维尔·希瓦艾什的改革开始，有关传统与进步的思考便萦绕在每个人心头。布朗陶与佩尔罗契家族虽乐于接纳一些无害的新事物，却对宪政改革深恶痛绝，而年轻的学生、知识分子与商人们则踊跃支持。改革家的事业因一班失控列车戛然而止，但谢拉格的改革进程并未就此结束。\n\n恩希欧迪斯·希瓦艾什，希瓦艾什家族的正统继承人于1090年回归故乡，通过一系列手段使本已滑落边缘的家族重回政治核心三族议会。也再度打开国门，在维多利亚支持下继续了父亲的未竟事业。他更为强硬的改革立场也带来了更为激烈的内部矛盾，亦使无数人对雪境的未来有了新的思考。山中之国的未来会走向何方？传统、改革甚至是革命？命运将裁定一切。"
 KZM_ARK_SCENARIO_DESC: "千百年前，天马王国在面对梦魇可汗的耻辱性军事失败后遭骑士推翻。而在王室统治终结的混乱逐渐淡去，旷日持久的辩驳与对立结束之后。贵族骑士们最终达成共识，将卡西米尔自曾经的王国改造为了由贵族所统治领地之联合，由名为监正会的联席会议领导协调。\n\n时代在前进，历史在发展。百年长河如弹指一挥间，先是由商业联合会以资本与企业崛起，后是作为司法机构的国民院在制度演变之中逐渐后来居上。如今，监正会大骑士长与国民院瑟姆议长都希望推动自己的议程向前。而在二者之外，阴影中的其他政治势力也想使联合领走向自己所设想的未来。卡西米尔的明日或许仍在迷雾之中，但车轮早已开始转动。"

