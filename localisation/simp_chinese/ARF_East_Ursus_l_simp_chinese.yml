 East_Ursus_Upheaval_Decisions_GUI: "乌萨斯第二次大叛乱"
 East_Ursus_Upheaval_MainImage_Desc: "§R“大叛乱”§!，是数十年前血峰战役结束后，乌萨斯吞下苦果后的并发症。这场叛乱由感染者而起，牵扯到了乌萨斯全国上下所有的阶级和利益团体，而旧贵族则扮演着俗套的幕后黑手角色。这场“大叛乱”在乌萨斯各地引起了不计其数的抗议、暴动和叛乱，最终以新贵族将旧贵族全数清算，建立起新秩序而宣告落幕。但“大叛乱”的余波仍然回荡在乌萨斯的土地上，从§Y圣骏堡§!的阴谋场，到§Y克缅哥罗德§!和§Y贝加尔延达谢斯克§!的粉饰人间，再到冻原上燃起的§Y点点星火§!，只需要一把钥匙，§R“第二次大叛乱”§!的潘多拉魔盒就将打开。"
 East_Ursus_Upheaval_Contenders_Title: "角逐者"
 East_Ursus_Upheaval_Contenders_Title_Desc: "§Y角逐者§!\n------------\n角逐者囊括了所有控制了§W东乌萨斯§!其中一部分的政权。我们只有将这些政权逐一击败或吸收，巩固对整片东达利亚冻原的掌控，才有能力面对西边的乌萨斯中央势力。"
 East_Ursus_Upheaval_Contenders_Value1: "[?Upheaval_Contenders_Num_1|W0]"
 East_Ursus_Upheaval_Contenders_Value2: "[?Upheaval_Contenders_Num_2|W0]"
 East_Ursus_Upheaval_Contenders_Value_Desc: "现在还有§Y[?Upheaval_Contenders_Num_1]位角逐者§!掌控着§R东乌萨斯§!的一部分。我们是其中之一。\n\n现在还有§Y[?Upheaval_Contenders_Num_2]位角逐者§!掌控着§R[East_Ursus_Upheaval_CurrentRegion]§!的一部分。我们是其中之一。"
