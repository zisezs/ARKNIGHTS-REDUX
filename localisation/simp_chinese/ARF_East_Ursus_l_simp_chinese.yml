 East_Ursus_Upheaval_Contenders_Entry_Defeated_Desc: "[THIS.GetFlag]§R[THIS.GetName]§!已经被彻底击败。"
 East_Ursus_Upheaval_Contenders_Entry_PreparesWar_Desc: "根据情报，[THIS.GetFlag]§r[THIS.GetName]§!正在准备向我方开战！"
 East_Ursus_Upheaval_Contenders_Entry_AtWar_Desc: "我们当前正在与[THIS.GetFlag]§R[THIS.GetName]§!交战。"
 East_Ursus_Upheaval_MainDesc: "当鲜血与硝烟再次浸染这片冻土的时候，注定了橄榄与白鸽无法解决东乌萨斯积怨已深的矛盾。\n不管是因为民族、感染者的被压迫，抑或是党派、贵族及阶级之间的之间的针锋相对，这片土地上的人们已经用行动做出了他们的判断。破片与源石之下，一切生命将回归平等。\n\n而当尘埃落定，§Y东乌萨斯§!也将逐出最终的胜利者。"

 East_Ursus_Upheaval_Stats_CivilianChaos_Title: "骚乱"
 East_Ursus_Upheaval_Stats_CivilianChaos_Title_Desc: "§Y£upheaval_chaos §R民间骚乱§!\n------------\n在这场大叛乱中，我们必须以适当的方法手段管理民众，并且尽快结束战斗，否则随之而来的可能是§R自我毁灭§!。"
