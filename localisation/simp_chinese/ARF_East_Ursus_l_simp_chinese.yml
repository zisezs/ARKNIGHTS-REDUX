 East_Ursus_Upheaval_Stats_CivilianChaos_Value_Bad: "[?Upheaval_Chaos|%R0]"
 East_Ursus_Upheaval_Stats_CivilianChaos_Value_Desc: "§F£upheaval_chaos §R民间骚乱§!\n£upheaval_chaos §R民间骚乱§!每§W周§!均会§R增长§!。当下的局势[East_Ursus_Upheaval_Stats_CivilianChaos_Value_Desc]\n------------\n§W当前的§!民间骚乱总值对我们产生如下§W修正§!：\n - 适役人口修正：[?Upheaval_Chaos_Modifier_conscription_factor|+0%]\n - 移动中组织度损失：[?Upheaval_Chaos_Modifier_org_loss_when_moving|-1%]\n - 非战斗补给耗尽惩罚：[?Upheaval_Chaos_Modifier_out_of_supply_factor|-1%]\n - 稳定度：[?Upheaval_Chaos_Modifier_stability_factor|=+%]\n - 战争支持度：[?Upheaval_Chaos_Modifier_war_support_factor|=+%]\n - 投降界限：[?Upheaval_Chaos_Modifier_surrender_limit|=+%]§!"
