 central_tundria_trade_dispute_decisions: "中东达利亚贸易争端"
 central_tundria_trade_dispute_decisions_desc: "在中东达利亚地区，贝加尔坐拥丰厚而清洁的水电资源，而克缅哥罗德则掌控着这一地区最富裕且最易开采的源石矿脉。作为广义上的能源市场竞争对手，加之双方在地区政治上的矛盾，以及两地统治者的私人恩怨，两个公爵领之间的贸易争端最终还是升级成了一场小型的贸易战。鉴于乌萨斯中央政府对于此地尚属微弱的控制力，可以预见的是，两位公爵将会谨慎地通过一切被允许的手段，夺取这次贸易战的胜利。\n\n§Y萨文科娃§!贸易影响力：[?KMG.trade_influence]\n\n§Y贝加尔大公§!贸易影响力：[?BAK.trade_influence]"
