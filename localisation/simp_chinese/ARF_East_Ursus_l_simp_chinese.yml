 East_Ursus_Development_Decisions: "东达利亚开拓计划"
 East_Ursus_Development_Decisions_desc: "\n\n\n\n\n£GFX_East_Ursus_Development_Level_2_banner\n\n\n\n\n\n\n\n得益于“大叛乱”的余波，乌萨斯帝国忙于应对乌拉尔以西土地的乱局，而忽略了对东达利亚的管理。包括我们在内的许多地方势力于圣骏堡的行政疏忽中崛起，拥有了事实上的独立地位。无疑的是，吾等脚下这片名为东达利亚的土地——即乌萨斯东部的广袤雪原与森林并非已驯之土。不过这片地广人稀之地虽难称之为宜居，但依然能算作是值得开发的宝地。\n\n通过对工农业的发展及综合社会投资，我们有着充分机会使东达利亚发挥其完整潜力。而在同时，作为地方政权的微小体量也为我们带来了“船小好调头”的优势。利用好手上的行政资源，把控好内政事务与经济发展，东达利亚必将崛起，就此抛掉“流放地”与“贫瘠边疆”的帽子。"
