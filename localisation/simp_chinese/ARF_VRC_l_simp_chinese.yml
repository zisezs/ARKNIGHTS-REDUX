 #民族精神
 VRC_Passion_of_freedom: "自由热情"
 VRC_Passion_of_freedom_desc: "在盖尔兰的漫长历史中，我们一度拥有属于自己的王冠和土地，世世代代过着田园牧歌般的生活。直至侵略者摧毁了我们所珍视的一切，盖尔兰就此迎来一段不堪回首的黑暗岁月。\n\n数百年后的今天,随着维多利亚全境相继陷入动乱，盖尔兰人挣脱枷锁的时机已然到来。尽管行动仓促、准备不足，起义者们仍然在维多利亚的废墟之上建立了盖尔兰临时政府———个真正可以代表盖尔兰人的政权。无论有多么艰难，我们都会竭力保卫这来之不易的自由。"
 VRC_Struggle_for_Crown: "王冠之争"
 VRC_Struggle_for_Crown_desc: "很少有人注意到，盖尔兰临时政府的正式国号是“盖尔兰独立国”——既非王国亦非共和国而是模棱两可的独立国。自起义成功以来，迎回旧盖尔兰王族后裔、重新建立君主制政体的呼声便日益高涨。君主派的拥护者鱼龙混杂，大多是宗教保守主义团体和庄园地主，甚至包括维恩·苏莱特领导的盖尔兰民族党右翼。\n\n然而，真正执掌大权的昆蒂莎·斯特金斯与民族党左翼却反对复辟，主张开辟一条传承高卢启蒙主义精神的共和之路。除非王冠之争真正得到解决,否则临时政府乃至盖尔兰社会都将因此争吵不休。"