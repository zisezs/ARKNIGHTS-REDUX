# 叙拉古 · 三路线（选国家界面路线卡片专用，bm9「七丘的新芽」）
 SRC_Route_Wasteland_Revelry:0 "荒芜与狂欢！"
 SRC_Route_Wasteland_Revelry_desc:0 "旧叙拉古用家族编织牢笼，用秩序粉饰暴力。拉普兰德选择成为“荒芜”——成为狼群的头狼，把整个旧叙拉古当作敌人。她要废除十二家族不得明面斗争的禁令，复活被西西里夫人废除的狂欢节，让戴上面具的人在法律之外厮杀、寻仇、狂欢。城市不再是家族的私产，而是狼群重新洗牌的猎场。"
 SRC_Route_Untamed_Sprout:0 "萌芽不会被牢笼束缚！"
 SRC_Route_Untamed_Sprout_desc:0 "它不试图用狼群取代家族，而是要用法律、市政、工会与市民积分，把家族赶出城市的骨架。新沃尔西尼宣布“不存在家族”，推行《新都市管理法案》，让法官、警察、运输保障署和普通市民共同支撑一座真正属于活人的城市。"
 SRC_Route_White_Penance:0 "审判天神的纯白之国"
 SRC_Route_White_Penance_desc:0 "它要证明“律法”也能由人来创造：以灰厅为中枢，以巨狼之口为利刃，以法院与法官为代理，把十二家族纳入同一套标准。家族可以存在，但不得互相倾轧；城市可以移动，但必须在纯白律法之下。叙拉古将获得长久的稳定——不再有明面上的血，也不再有关不上的门。代价是地方自治、狂欢节与改革的萌芽，一并被压平在那层白色之下。这是一个没有家族混战、也没有真正自由的天神国度。"
