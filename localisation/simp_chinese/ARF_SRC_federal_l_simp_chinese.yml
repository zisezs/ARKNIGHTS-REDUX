 SRC_tt_year_one_leader: "§Y莱昂图索·贝洛内§!出任国家领袖，获得特质§H灰厅话事人§!与§H领袖的尊严§!（执政党不变）"
 SRC_tt_year_one_fury: "家族元老公开宣战：稳定度§R-20%§!，且每约§Y90天§!流失一座非首都核心州"
 SRC_tt_civic_open: "解锁机制：§Y市民积分§!与§Y管理法修正案§!决议分类"
 SRC_tt_unlock_background_check: "解锁决议：§Y背景审查§!（管理法修正案）"
 SRC_tt_unlock_grey_hall_note: "获得身份：§Y灰厅观察员§!；解锁决议§Y灰厅照会§!"
 SRC_tt_unlock_city_league: "解锁决议：§Y城市互联计划§!"
 SRC_tt_unlock_community: "解锁决议：§Y自治社区§!"
 SRC_tt_unlock_registration: "解锁决议：§Y市民登记处§!（可追回流失的核心）"
 SRC_tt_unlock_emergency_trial: "解锁决议：§Y紧急审判§!"
 SRC_tt_unlock_police_sweep: "解锁决议：§Y治安扫荡§!"
 SRC_tt_unlock_werewolf_liaison: "解锁决议：§Y荒野通行协议§!"
