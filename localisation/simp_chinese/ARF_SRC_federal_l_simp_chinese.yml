############################################################
# 叙拉古 (SRC) · 民主的胜利——叙拉古联邦共和国
# 国策树 / 民族精神 / 管理法修正案决议 / 配套事件
# 图标清单见 docs/SRC_国策图标表.md
############################################################

#========================= 国策：名称与描述 =========================

# ---- 起始 ----
 SRC_year_one_new_volsinii: "莱昂图索大显身手！"
 SRC_year_one_new_volsinii_desc: "新沃尔西尼建成一周年。代理市长莱昂图索站在市政厅顶层，俯瞰这座没有家族入驻的城市。拉维妮娅的《新都市管理法案》已经推行，卡车工会开始运转，港口昼夜不息。但卡西米尔资本的货架协议、威尼斯家族的暗中走私、十二家族的蛰伏观望、西西里夫人的沉默——一切都在等待他的下一步。\n\n他决定不再等待。"
 SRC_year_one_new_volsinii_tt: "§Y莱昂图索·贝洛内§!出任国家领袖，获得特质§H灰厅话事人§!与§H领袖的尊严§!（执政党不变）"
 SRC_tt_year_one_capital: "§Y定都沃尔西尼§!：市政厅的印玺挂上这座城的门楣。首都州定为沃尔西尼；若此前因战乱或割让他迁，此刻归位。"
 SRC_year_one_fury_tt: "家族元老公开宣战：稳定度§R-20%§!，并且每约§Y90天§!流失一座非首都核心州"
 SRC_civic_open_tt: "解锁机制：§Y市民积分§!与§Y管理法修正案§!决议分类"

# ---- 分支一 · 家族的去势 ----
 SRC_new_urban_law_enforced: "新都市管理法案全面推行"
 SRC_new_urban_law_enforced_desc: "“这里是新沃尔西尼，这里的法律没有任何情面可讲。”拉维妮娅的法槌落下。背景审查、人员登记、武器管控、市民积分——每一项条款都在把家族势力挤出城市的合法空间。法案通过的那天夜里，第五大街安静得反常，像是所有人都在屏息等待第一记回击。"
 SRC_purge_family_remnants: "清剿家族残余势力"
 SRC_purge_family_remnants_desc: "甘比诺和卡彭巡逻在第五大街，他们曾是“西西里人”，如今是出租车司机与安保。但暗处仍有家族楔子、走私通道、地下钱庄。莱昂图索下令：一个不留。市政厅的档案柜里，被划掉的名字一天比一天多，而划名字的人很清楚——每一道墨痕背后都有一把还没开火的铳。"
 SRC_absorb_truck_union: "收编卡车工会与运输保障署"
 SRC_absorb_truck_union_desc: "伊雷妮的运输保障署掌握着新沃尔西尼的物流命脉。莱昂图索明白，谁控制港口与卡车，谁就控制城市。他决定把运输保障署正式并入市政体系——不是收买，而是给方向盘后的人一个盖章的位置。卡车司机们第一次发现，市政公文里会出现他们的名字。"
 SRC_dismantle_underground_economy: "瓦解地下经济网络"
 SRC_dismantle_underground_economy_desc: "家族的钱不只来自葡萄酒和港口。赌场、高利贷、走私、保护费——这些地下经济是家族蛰伏的养分。拉维妮娅的法官们开始逐一拔出这些根系。查封的账本堆满法院的走廊，而每一个数字背后，都是一张在灰厅圆桌旁坐了很多年的脸。"
 SRC_madam_silence: "西西里夫人的默许"
 SRC_madam_silence_desc: "西西里夫人没有表态。但巨狼之口没有出现在新沃尔西尼，阿格尼尔也只是在教堂里安静地喝咖啡。莱昂图索知道，沉默就是默许——只要他不越过那条线。他把这条线画在办公桌上，每天看一遍，然后继续签发第二天的人口登记表。"
 SRC_grey_hall_reform: "灰厅改革：家族代表退出"
 SRC_grey_hall_reform_desc: "灰厅的圆桌曾经属于十二家族。莱昂图索没有掀桌，而是把新沃尔西尼的椅子搬了进去。当家族代表发现圆桌上多了一个“无家族城市”的席位，秩序的定义开始改变——铳仍旧悬在头顶，但握铳的手不再只属于血脉。"
 SRC_families_corporatized: "十二家族企业化改造"
 SRC_families_corporatized_desc: "德米特里说：“贝洛内会进入这座城市，以我的方式，按你的规则。”莱昂图索最终接受：家族无法一夜消失，但可以变成企业——注册、纳税、受法律约束。萨卢佐酒业、贝洛内企业、罗塞蒂文化公司，从此不再是家族，而是法人。老人们在各自的宅邸里摔了茶杯：他们打赢过所有对手，却输给了一张营业执照。"

# ---- 分支二 · 世界渴望之城 ----
 SRC_port_expansion: "新沃尔西尼港扩建计划"
 SRC_port_expansion_desc: "新沃尔西尼港是叙拉古的货运枢纽，也是这个国家未来的心脏。莱昂图索下令扩建码头、增加泊位、把陆行舰的接驳轨道铺到吊车尾侧。港口的灯火从此不灭——据说最老的水手们特意在岸上等着看，想看看这句话到底能亮多久。"
 SRC_mobile_city_network: "移动城市网络连接"
 SRC_mobile_city_network_desc: "叙拉古有二十三座移动城市，新沃尔西尼是第二十三座。莱昂图索提出“城市网络计划”——用贸易、通讯与法律，而非家族血缘，把移动城市连接起来。若城市之间只靠血缘通行，那么改变就永远轮不到没有血缘的人。"
 SRC_columbia_tech_investment: "哥伦比亚技术投资"
 SRC_columbia_tech_investment_desc: "哥伦比亚的移动城市技术让叙拉古得以建造新城市。莱昂图索向哥伦比亚敞开大门，但设定了条件：技术可以来，资本必须遵守新沃尔西尼的法律。沙雷的“黄金平原”酒业把这份条件书读了三遍，然后开始计算违约金的算法。"
 SRC_civic_points_autonomy: "市民积分与自治体系"
 SRC_civic_points_autonomy_desc: "市民积分不仅是身份认证，更是新沃尔西尼的自治实验。通过认证金、社区服务、守法记录积累积分，市民获得落户、就业与福利资格。没有家族背景，也能成为城市的主人——这句话被印在登记处的墙上，而墙外排着长队。"
 SRC_new_art_district: "新艺术区与文化复兴"
 SRC_new_art_district_desc: "乔万娜的剧作、空的歌声、塞壬唱片的旋律、白日剧团的灯光——新沃尔西尼的艺术区正在成为泰拉中部最耀眼的舞台。文化不是装饰，是新的认同：当一座城市开始有自己的故事，它就不再需要借用家族的故事。"
 SRC_central_terra_trade_hub: "泰拉中部贸易枢纽"
 SRC_central_terra_trade_hub_desc: "北接莱塔尼亚，东邻卡兹戴尔与雷姆必拓，南连拉特兰，西通维多利亚——叙拉古的地理位置从未如此重要。新沃尔西尼要成为整个泰拉中部的十字路口：货物在这里换轨，消息在这里换语言，规矩在这里换主人。"
 SRC_city_of_desires_blueprint: "世界渴望之城的蓝图"
 SRC_city_of_desires_blueprint_desc: "莱昂图索在市政厅展示了一张蓝图：新沃尔西尼不只是叙拉古的城市，而是一座“世界渴望之城”——法律、贸易、文化、技术、自由，所有被家族秩序压抑的东西，都将在这里生长。图纸右下角没有签名，只有一行小字：本城市不接待家族。"

# ---- 分支三 · 荆棘之路 ----
 SRC_united_court_independent: "城邦联合法院独立"
 SRC_united_court_independent_desc: "城邦联合法院名义上掌握最高司法权，实际只是中央司法机构。拉维妮娅推动改革：法院独立于灰厅与议事会，法官终身任职，判决不受家族干预。第一条修正案宣读时，旁听席上有人笑出声——直到他们看见法警堵住了门。"
 SRC_lavinia_judicial_reform: "拉维妮娅的司法改革"
 SRC_lavinia_judicial_reform_desc: "“我会去改变它。”拉维妮娅戴着荆棘手套，在法院与黑夜之间穿行。她推动《新都市管理法案》修正案、紧急审判程序、复仇禁制令——每一条法律都是刺向家族秩序的一刀。手套上的刺磨平了，法槌的边却越来越锋利。"
 SRC_judge_academy: "法官系统职业化"
 SRC_judge_academy_desc: "叙拉古没有警察系统，法官甚至要负责社会治安。拉维妮娅建立法官学院，培养新一代法官——他们不属于家族，只属于法律。学院的入学名单上没有姓氏备注，这是叙拉古司法史上第一次。"
 SRC_infected_rights_law: "感染者权益保障法"
 SRC_infected_rights_law_desc: "叙拉古的感染者政策借鉴哥伦比亚：缴纳巨额保险金才被允许正常生活。莱昂图索与罗德岛合作推动感染者权益保障法——保险金由市政补贴，歧视行为入刑。法案生效的第二天，登记处的队伍里第一次排进了戴面具的人。"
 SRC_civic_equality_act: "市民平等权利法案"
 SRC_civic_equality_act_desc: "无论出身家族还是卡车司机，无论鲁珀还是其他种族，无论感染者还是健康人——新沃尔西尼的市民一律平等。这是莱昂图索对卢比奥那句“我们是活生生的人”的回应：公文末尾的名字，终于走到了正文第一行。"
 SRC_local_elections_pilot: "民主选举制度试点"
 SRC_local_elections_pilot_desc: "新沃尔西尼市长由任命产生，但莱昂图索决定试点区议会选举。市民积分达标者拥有投票权。家族不能投票，企业不能投票，只有市民能投票。开票那晚，第五大街的灯亮到凌晨，没有人放鞭炮——他们只是站在那里，等着一个数字。"
 SRC_federal_constitution_draft: "叙拉古联邦宪法起草"
 SRC_federal_constitution_draft_desc: "莱昂图索、拉维妮娅、德米特里、乔万娜、伊雷妮——不同出身的人坐在同一张桌前，起草叙拉古历史上第一部联邦宪法。核心条款只有三条：家族不得干政，法律高于一切，移动城市自治。灰厅的名单被送到桌上时，没有人伸手去接。"

# ---- 分支四 · 铳与秩序的新解 ----
 SRC_police_department_rebuild: "新沃尔西尼警察局重建"
 SRC_police_department_rebuild_desc: "诺埃米是见习警察，她曾经以为警察只是家族的附庸。现在，新沃尔西尼警察局直接对市政厅与法院负责，不向任何家族低头。第一份值班表贴出来时，有人问这算不算宣战——莱昂图索说，这只是一份值班表。"
 SRC_armed_political_education: "武装力量政治教育"
 SRC_armed_political_education_desc: "德米特里说：“你制定的规则将成为新沃尔西尼的家族行动的约束，而我的方式则将凝聚所有叙拉古人的力量与精神。”莱昂图索明白，武装力量必须知道为何而战。讲堂里没有神龛，只挂着一本翻开的法典和一张城市地图。"
 SRC_penguin_logistics_assist: "德克萨斯与企鹅物流的协助"
 SRC_penguin_logistics_assist_desc: "德克萨斯留在新沃尔西尼，担任企鹅物流特别顾问。她和能天使、可颂、空一起，为市政厅提供情报、物流与战术支持。大帝的兽主身份，也让狼之主体系对新沃尔西尼有所忌惮——有些账，狼群也懒得去算。"
 SRC_counter_wolf_lords: "对抗狼之主影响"
 SRC_counter_wolf_lords_desc: "红说：“真狼死了，红听了外婆的话。”但狼之主的游戏不会结束。莱昂图索与拉普兰德达成默契：荒野归狼群，城市归人类。新沃尔西尼设立猎狼人联络处，门口没有招牌，只有一盏给夜归人留的灯。"
 SRC_national_guard: "建立叙拉古国民卫队"
 SRC_national_guard_desc: "家族有私兵，灰厅有巨狼之口，新沃尔西尼必须有国民卫队。莱昂图索以退伍军人、卡车司机与前家族打手为兵源，建立一支忠于法律而非家族的武装力量。宣誓书上要签的不是家主的名，而是自己的名——很多人第一次发现，自己写得来自己的名字。"
 SRC_guns_and_order_redefined: "铳与秩序的新解"
 SRC_guns_and_order_redefined_desc: "德米特里伸出手：“这将成为这座城市全新的‘铳与秩序’，莱昂图索。”莱昂图索握住了他的手——铳代表最终暴力归国家，秩序代表法律适用于所有人，包括家族。两只手都还脏着，但脏的方式不同，这恰好是这座城市新的分工。"
 SRC_militarization_of_state_forces: "军事力量国家化"
 SRC_militarization_of_state_forces_desc: "萨卢佐的私兵、贝洛内的安保、威尼斯的载具公司武装——莱昂图索通过《管理法修正案》，逐步把家族武装转化为国民卫队、警察与港口安保等国家力量。家族可以经商，但不能拥兵。军械入库清单的最后一栏写着：原持有人，已注销。"

# ---- 横向整合 ----
 SRC_mobile_cities_league: "移动城市自治联盟"
 SRC_mobile_cities_league_desc: "新沃尔西尼不是唯一渴望改变的城市。布鲁奈罗、蒙特卢佩、特尔尼——越来越多的移动城市开始效仿《新都市管理法案》。莱昂图索建立“移动城市自治联盟”：不结盟、不称臣、不认家族，只认同一套登记表格与同一条公路。"
 SRC_casimir_capital_response: "卡西米尔资本的应对"
 SRC_casimir_capital_response_desc: "沙雷的“黄金平原”酒业、货架陈列协议、高额违约金合同——卡西米尔商业联合会试图架空新沃尔西尼政府。莱昂图索与拉维妮娅用修正案反击：加征关税、特许经营、本地产业保护。沙雷把合同撕了，然后按新规矩重新签了一份。"
 SRC_leytonia_shadow_response: "莱塔尼亚阴影的应对"
 SRC_leytonia_shadow_response_desc: "葆拉被毒杀，卡普里尼的刺客来自莱塔尼亚的“永恒恩典”。莱昂图索明白，莱塔尼亚不允许有人发出不同于赞歌的声音——但新沃尔西尼允许。市政厅的客房登记簿上多了一栏：因言而来者，免认证金。"
 SRC_rhodes_island_agreement: "罗德岛合作协议"
 SRC_rhodes_island_agreement_desc: "拉维妮娅通过德克萨斯与罗德岛建立联系。罗德岛提供医疗、感染者收容与战术协同；新沃尔西尼提供港口、仓储与法律支持。协议只有两页，第二条写着：本城市不接受任何以血液定价的保险。"
 SRC_texas_returns: "德克萨斯的归来"
 SRC_texas_returns_desc: "德克萨斯没有逃。她说：“这片土地还没有那么无可救药。所以，我不逃了，就这么简单。”她留在新沃尔西尼，成为连接企鹅物流、罗德岛与市政厅的桥梁。她的假期被无限延长，理由一栏只写了两个字：市政。"

# ---- 终局 ----
 SRC_new_volsinii_model_victory: "新沃尔西尼模式的胜利！"
 SRC_new_volsinii_model_victory_desc: "多年以后，当叙拉古联邦共和国的旗帜在新沃尔西尼港升起，莱昂图索站在市政厅顶层，想起贝纳尔多那句话：“我本以为自己已经完成了毕生的愿望，可以再无遗憾了。却没想到，现在，我又想看一看，莱昂能做到什么了。”\n他做到了。\n十二家族或企业化、或消亡、或退入荒野。灰厅变成联邦议会，城邦联合法院成为真正的最高法院，城邦联合议事会从门面变成民主政府。铳与秩序被重新定义：铳归国家，秩序归法律。\n拉维妮娅的荆棘手套终于不再染血，德克萨斯的假期无限延长，德米特里的贝洛内企业成了联邦最大的物流公司，而拉普兰德偶尔还会回来说一句：“德克萨斯，你是个货真价实的理想主义者。”\n新的一天已经来了。"

