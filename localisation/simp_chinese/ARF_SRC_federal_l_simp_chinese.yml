#========================= 民族精神 =========================

 SRC_old_guard_fury: "老一辈怒火中烧！"
 SRC_old_guard_fury_desc: "新沃尔西尼建成一周年那天，十二家族的家主们同时给贝洛内家的年轻人写来了信。信纸都很厚，话都很客气，意思只有一个：一座没有家族的城市，凭什么活着。莱昂图索把信按时间顺序钉在墙上，每天添一条市政公告——他们要的是体面，他要的是登记表格。\n\n稳定度§R-20%§!，并且每约§Y90天§!，某座非首都核心州会因家族的地方网络而脱离效忠。"
 SRC_old_guard_fury_tt: "每约§Y90天§!流失一座非首都核心州的核心（§Y市民登记处§!决议可追回）"
 SRC_dyn_new_model: "新沃尔西尼模式"
 SRC_dyn_new_model_desc: "打击黑帮这条线上攒下的全部成果：背景审查、人员登记、武器管控、灰厅席位、营业执照。它不是一句口号，而是一叠越来越厚的公文——每推行一项《管理法修正案》，这座城市的稳定与政府的余力就涨一格。"
 SRC_dyn_city_of_desires: "世界渴望之城"
 SRC_dyn_city_of_desires_desc: "建设城市这条线上攒下的全部成果：码头、泊位、轨道、电缆、合同、剧院与唱片的版税。城市网络把二十三座城串成一圈灯火，而新沃尔西尼是这圈灯火的开关。"
 SRC_dyn_thorn_road_end: "荆棘之路的尽头"
 SRC_dyn_thorn_road_end_desc: "促进公平正义这条线上攒下的全部成果：法院独立、紧急审判、法官学院、感染者权益、平等法案、区议会选举。荆棘手套磨平了刺，法槌的边却越来越锋利——这条路没有尽头，但每走一步，城市的底气就多一分。"
 SRC_dyn_guns_and_order: "铳与秩序的新解"
 SRC_dyn_guns_and_order_desc: "加强武装力量思想建设这条线上攒下的全部成果：警察局、政治教育、企鹅物流、猎狼人联络处、国民卫队、国家化军队。铳归国家，秩序归法律——叙拉古人第一次把这两样东西握在自己手里，而不是握在某个姓氏手里。"
 SRC_civic_points_system: "市民积分体系"
 SRC_civic_points_system_desc: "认证金、社区服务、守法记录折算成的城市信心。积分本身记在市政厅的账上（§Y市民积分§!），而它换来的稳定、余力与低负担，则由每一位登记在册的市民共同持有。"
 SRC_timed_trial: "紧急审判程序"
 SRC_timed_trial_desc: "法槌不必等到天亮。紧急审判让法官们可以在证据链闭合的当夜签发拘票，也让市政厅在接下来几个月里说话格外有分量。"
 SRC_timed_community: "自治社区运转"
 SRC_timed_community_desc: "积分达标的小区自己管自己的事：门禁、垃圾、托儿、夜巡。市政厅只负责盖章，而盖章的队伍短了一截。"
 SRC_timed_hunt_pact: "荒野通行协议"
 SRC_timed_hunt_pact_desc: "猎狼人联络处递出的那盏灯起了作用：商队敢在夜里走山路，部队敢在荒野扎营，而狼群只是从坡上看了很久，然后转身离开。"
 SRC_timed_penguin_run: "特别运输线"
 SRC_timed_penguin_run_desc: "企鹅物流的车队昼夜穿行于港口与内陆之间。货舱里不止有包裹，还有药品、备件、法官，以及一整个偶尔需要连夜转移的家族档案柜。"

#========================= 领袖特质 =========================

 SRC_grey_hall_spokesman: "灰厅话事人"
 SRC_grey_hall_spokesman_desc: "圆桌边上终于坐进了一座无家族城市的代表，而他说话的时候，其他人必须听完。稳定度§G+10%§!。"
 SRC_dignity_of_leadership: "领袖的尊严"
 SRC_dignity_of_leadership_desc: "市长不是家族的门面，法律才是这座城市的门面。政治点获取§G+20%§!。"

