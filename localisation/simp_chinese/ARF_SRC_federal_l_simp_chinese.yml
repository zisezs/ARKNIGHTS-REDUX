#========================= 决议分类与决议 =========================

 SRC_reform_category: "管理法修正案"
 SRC_reform_category_desc: "《新都市管理法案》不是一次通过的法律，而是一整套不断追加的修正案。背景审查、紧急审判、自治社区、特许经营——每一条都在把家族从合法空间里挤出去，每一条都需要政治点、时间，以及一座愿意配合的城市。"

 SRC_dec_background_check: "背景审查"
 SRC_dec_background_check_desc: "每一个在市政厅挂名的人都过一次表：有无家族血缘、有无案底、有无未申报的往来账目。审查名单每天变短一截，被划掉的人则开始改行开出租车。"
 SRC_dec_grey_hall_note: "灰厅照会"
 SRC_dec_grey_hall_note_desc: "以城市的名义向灰厅发函，要求按人口而非家族分配议事席位。回函很慢，但格式变了——第一次出现“新沃尔西尼市”这五个字。"
 SRC_dec_city_league: "城市互联计划"
 SRC_dec_city_league_desc: "把电缆、公路与统一税则铺到邻城去。联盟不靠誓约维系，靠的是同一张单据在两座城都能盖章。"
 SRC_dec_franchise_tariff: "特许经营与关税"
 SRC_dec_franchise_tariff_desc: "货架陈列协议要交税，违约金合同不受保护，本地产业优先采购。沙雷读完新条例，把旧合同撕了，然后按新规矩重新签了一份。"
 SRC_dec_emergency_trial: "紧急审判"
 SRC_dec_emergency_trial_desc: "证据链闭合的当夜就签发拘票。家族律师团抗议程序仓促，法官们回答：你们的账本早就仓促过了。"
 SRC_dec_autonomous_community: "自治社区"
 SRC_dec_autonomous_community_desc: "把一段街区交给积分达标的居民自治：门禁、垃圾、托儿、夜巡都由自己排班。市政厅只保留盖章的权力，而盖章的队伍短了一截。"
 SRC_dec_civic_registration: "市民登记处"
 SRC_dec_civic_registration_desc: "老一辈每抹掉一座州的核心，登记处就把那座州的居民重新造册一次。血脉的账本旧了，人口的账本还新着——问题只是谁愿意花政治点去翻页。"
 SRC_dec_constitutional_convention: "制宪会议"
 SRC_dec_constitutional_convention_desc: "不同出身的人坐进同一间屋子，用两个多月写一部联邦宪法。会议期间街上格外安静，因为每个人都知道：散会那天，叙拉古要么换一副骨架，要么什么都不变。"
 SRC_dec_police_sweep: "治安扫荡"
 SRC_dec_police_sweep_desc: "警察局的夜班名单上，家族的名字被划掉一批。保护费收不上来，赌场改了门面，高利贷的账本烧了一半——街面安静得让人想报警，而接电话的正是警察。"
 SRC_dec_wolf_corridor: "荒野通行协议"
 SRC_dec_wolf_corridor_desc: "猎狼人联络处递出灯，狼群递出路。商队与部队在荒野边缘获得了罕见的东西：一条不需要绕山的直线。"
 SRC_dec_penguin_run: "特别运输线"
 SRC_dec_penguin_run_desc: "企鹅物流的车队昼夜穿行。运费按箱计，不问内容物；市政厅按季度结算，从不问那一箱为什么在凌晨三点从港口开往山里。"

#========================= 事件文案 =========================

 src_federal.1.t: "西西里夫人隐藏在幕后"
 src_federal.1.d: "回函来自拉特兰的一家印刷厂，落款处没有名字，只有一枚压印的狼头。信上说，灰厅注意到了新沃尔西尼的一举一动，也注意到某些年轻人把《管理法》念得比祷文还熟。最后一段只有一句话：巨狼之口不会出现在你的城市，除非你把它请进去。\n\n莱昂图索把信读了两遍，然后交给拉维妮娅归档——归档，而不是回应。"
 src_federal.1.a: "沉默就是许可"
 src_federal.1.b: "把话说到明处"
 src_federal.1.c: "照旧归档，不予回应"

 src_federal.2.t: "酒窖与账本"
 src_federal.2.d: "清剿令下达的第三天夜里，威尼斯家族的载具公司在码头被烧了两辆车；第二天，萨卢佐酒业的账房发现自己被扣在海关。两家都否认与自己有关，两家都派了人来问市政厅打算站在哪一边。第五大街的警察们第一次发现，最难的不是抓人，而是决定先抓谁。"
 src_federal.2.a: "两家一起查"
 src_federal.2.b: "让法院去调解"

 src_federal.3.t: "哑弹"
 src_federal.3.d: "市政厅侧门的台阶下发现了一枚没炸的东西。技术警员说引信被人做过手脚——做手脚的人不想杀人，只想让人改天再签一张查封令。当晚，法官公寓楼下多了一辆不认识的车，车里的人一直坐到天亮。"
 src_federal.3.a: "照原计划继续查封"
 src_federal.3.b: "先稳住他们"

 src_federal.4.t: "十字路口的灯火"
 src_federal.4.d: "莱塔尼亚的记者写了一篇题为《没有家族的城市能否存活》的长文；卡西米尔的商业联合会连夜增派了三名代表；龙门商会则只问了一句：新航线什么时候开。所有的电报都寄往同一座建筑，而收发室的老职员说，这些信如果放在十年前，收件人应该是某个家主。"
 src_federal.4.a: "让所有人来看"
 src_federal.4.b: "把门关上，继续干活"

 src_federal.6.t: "又一座州改了主意"
 src_federal.6.d: "登记处的印章在某座州府门前吃了闭门羹。地方官的解释很客气：粮价、旧债、还有几位“不能得罪的人”。市政厅的电报线还通着，但纸面上的效忠已经被老一辈用一袋面粉、一场葬礼和一句祖训悄悄换了主人。"
 src_federal.6.a: "派人去把话说清楚"
 src_federal.6.b: "记在账上，以后再算"

 src_federal.7.t: "制宪会议开幕"
 src_federal.7.d: "会场没有主席台，只有一张长桌和一叠空白纸。莱昂图索念了第一条：家族不得干政。门外传来一阵骚动，某个家族的律师要求记录在案——他确实被记录在案了，作为旁听者。"
 src_federal.7.a: "继续念下去"

 src_federal.9.t: "叙拉古的未来"
 src_federal.9.d: "旗帜升起来的时候，港口的吊全部停了半分钟——这是水手们的规矩，也是最正式的礼。莱昂图索站在市政厅顶层，看着第五大街上的人群，忽然想起贝纳尔多那句话：我又想看一看，莱昂能做到什么了。\n\n新的一天已经来了。而城市还要继续长大。"
 src_federal.9.a: "把灯留着，明天还要登记"

 src_federal_news.1.t: "新沃尔西尼模式胜利"
 src_federal_news.1.d: "叙拉古宣布改组为联邦共和国：灰厅解散为联邦议会，城邦联合法院成为真正的最高法院，十二家族的名字从政治名单上撤下，只留在商业登记册里。泰拉中部第一次出现一座不以血脉为骨架的国家。"
 src_federal_news.1.a: "这是我们做到的事"
 src_federal_news.1.b: "家族的时代结束了？"

 src_federal_news.2.t: "叙拉古联邦宪法生效"
 src_federal_news.2.d: "制宪会议在两个多月后交出了文本：家族不得干政，法律高于一切，移动城市自治。签字页上有市长、法官、企业家、剧作家与工会主席的名字——叙拉古历史上第一次，这五个身份出现在同一张纸上。"
 src_federal_news.2.a: "签字页要存档"
 src_federal_news.2.b: "泰拉会记住这一天"

#========================= 伟大建设工程 =========================
 SRC_tt_great_project_left: "本节工程尚未满 §Y3§! 期"
 SRC_tt_great_project_going: "§Y伟大建设工程§!开工：全市的塔吊、变电站与高架桥同时占用产能（§R工业产出 -15%§!、§R消费品 +5%§!，为期 270 天）"
 SRC_tt_great_project_done: "竣工：首都 §G+3§! 基础设施、§G+3§! 民用工厂与 §G+3§! 民用工厂槽位；另一座州 §G+2§! 基础设施；稳定度 §G+5%§!"
 SRC_dec_great_construction: "对新沃尔西尼的伟大建设工程！"
 SRC_dec_great_construction_desc: "蓝图摊在市政厅的长桌上，四角压着五份签字文件。工程分三期：先填海砌港，再架变电站与高架，最后把新区的街道一次铺完。工地上的塔吊从港口一直排到山脚，而每一台塔吊下面都站着一个不再需要向家族低头的人。"
 src_federal_news.3.t: "新沃尔西尼的第三期工程竣工"
 src_federal_news.3.d: "叙拉古宣布对新沃尔西尼的伟大建设工程第三期完工：新的防波堤、变电站与高架桥同时投用，新区的街道在图纸之外真实地长了出来。工程队收队那天，市政厅在港口点亮了全部泊位——据说那是为了让人看清，这张蓝图不是画出来的。"
 src_federal_news.3.a: "我们的城市在长大"
 src_federal_news.3.b: "叙拉古真的在修路？"

# ── 国策配套事件正文（35 段）──
 SRC_evt_flavor_ok: "记下这一页"
 src_federal.101.d: "新沃尔西尼市政厅顶层，落地窗外是彻夜不息的港口灯火。莱昂图索·贝洛内站在桌前，面前摊着三份文件：拉维妮娅的《新都市管理法案》修正案草案、伊雷妮的运输保障署年度报告、德米特里从萨卢佐酒业发来的合作意向书。\n\n他想起贝纳尔多临终前的话：“我又想看一看，莱昂能做到什么了。”\n\n他拿起笔，在修正案首页签下名字。\n\n“新的一天已经来了。但新的一天不会自己到来。”"
 src_federal.102.d: "法院广场上，拉维妮娅站在临时搭建的讲台前，身后是巨幅的《新都市管理法案》全文。市民围了里三层外三层，甘比诺和卡彭穿着出租车司机的制服混在人群里。\n\n“这里是新沃尔西尼，”拉维妮娅的声音不大，但每个字都像法槌落下，“这里的法律没有任何情面可讲。”\n\n人群沉默了片刻，然后一个卖披萨的老头带头鼓起掌来。掌声稀稀拉拉，但逐渐连成一片。远处的巷口，一个穿黑西装的鲁珀男人压了压帽檐，转身消失在阴影里。"
 src_federal.103.d: "深夜，第五大街地下停车场。新沃尔西尼警察局联合国民卫队前身部队展开突袭。诺埃米握着手电筒的手在发抖，但她没有后退。\n\n仓库门被撞开，里面堆满了未登记的源石制品和武器。三个家族楔子被按在地上，其中一个抬起头，冷笑：“你们以为抓了我们，家族就没了？”\n\n诺埃米蹲下身，把手电照在他脸上：“新沃尔西尼没有家族。”\n\n这是她第一次说出这句话时没有犹豫。"
 src_federal.104.d: "伊雷妮把运输保障署的牌子挂上办公室门时，手停了一下。牌子是新的，但门还是卡车工会那扇旧铁门，门框上还留着索默尔当年用钥匙划的痕迹。\n\n“署长，”一个司机探头进来，“市政厅来人了，说要谈正式编制的事。”\n\n伊雷妮转过身，把钥匙揣进口袋：“让他们进来。还有，以后别叫署长，叫伊雷妮就行。”\n\n门关上之前，她低声补了一句：“索默尔，你看到了吗。我们不再是没人管的野狗了。”"
 src_federal.105.d: "拉维妮娅的法官团队花了一个月梳理家族资金链，最终锁定了十七个地下钱庄、四个走私码头、两个伪装成酒庄的赌场。收网那天，拉维妮娅亲自带队。\n\n在最后一个地下钱庄的保险柜里，她发现了一本账册。扉页上写着一行字：“献给新沃尔西尼，愿这里再无我们的容身之处。”\n\n落款是一个被家族除名的会计。拉维妮娅合上账册，对身边的法官说：“这个人，找到他。他欠叙拉古一个证人席位。”"
 src_federal.106.d: "阿格尼尔在教堂里擦着杯子，头也不抬：“你来了。”\n\n莱昂图索在他对面坐下：“夫人那边，有消息吗？”\n\n“没有消息就是消息。”阿格尼尔倒了两杯葡萄酒，推过去一杯，“西西里不接受破坏规则，是因为从来没有人提出能让她满意的答案。你正在提出答案，她至少愿意看。”\n\n“如果答案她不满意呢？”\n\n阿格尼尔喝了一口酒：“那就把答案写得更好。年轻人，放轻松。”"
 src_federal.107.d: "灰厅的圆桌很大，大到十二家族各坐一方还绰绰有余。但今天，圆桌边缘多了一把椅子。椅子背上钉着一块铜牌，上面刻着：“新沃尔西尼——无家族城市代表”。\n\n十二家族的代表面面相觑。有人想说什么，但看了看圆桌主位——西西里夫人的位置空着，只有巨狼之口的一枚徽记放在那里。\n\n莱昂图索拉开那把椅子，坐下了。没有人说话。但所有人都知道，圆桌上的秩序，从这一刻起不再是十二个人的游戏。"
 src_federal.108.d: "德米特里把萨卢佐酒业的营业执照放在桌上，旁边是贝洛内企业的法人变更文件。\n\n“以我的方式，按你的规则。”他伸出手。\n\n莱昂图索看着那只手。他想起小时候德米特里教他握刀，想起贝纳尔多死后德米特里在墓前站了一整夜，想起萨卢佐的刺客和威尼斯的走私船。\n\n他握住了那只手。\n\n“德米特，家族这个词，以后在法律文件里找不到。”\n\n“我知道。”德米特里笑了一下，“但家人这个词，法律管不着。”"
 src_federal.109.d: "第一艘来自龙门的万吨货轮驶入新沃尔西尼港时，码头上挤满了人。伊雷妮站在塔吊下，手里攥着对讲机，嘴里念叨着泊位编号。\n\n货轮鸣笛三声。人群欢呼。诺埃米在人群里举着相机拍照，快门声被汽笛盖过。\n\n甘比诺靠在栏杆上，对卡彭说：“你记不记得，几年前这里还是一片荒地。”\n\n卡彭看着货轮慢慢靠岸：“不记得了。我只记得我们差点死在这片荒地上。”\n\n两人沉默了一会儿，然后同时笑了。"
 src_federal.110.d: "布鲁奈罗城的代表第一次访问新沃尔西尼时，被港口规模吓了一跳。他问莱昂图索：“你们到底想做什么？”\n\n莱昂图索带他走上市政厅顶层，指着远处：“叙拉古有二十三座移动城市。以前它们被家族分割，像二十三座孤岛。现在，我们要把它们连起来——用贸易、通讯、法律，而不是血缘。”\n\n代表沉默良久：“如果家族不同意呢？”\n\n“家族已经同意了。”莱昂图索指了指楼下——德米特里的车队正从港口驶出，车身上印着“贝洛内物流”。"
 src_federal.111.d: "哥伦比亚代表团带来的不只是技术，还有一整套商业逻辑。首席代表在谈判桌上侃侃而谈：“我们可以提供移动城市核心模块，但你们必须开放港口和关税。”\n\n莱昂图索听完，把合同推回去：“技术可以来，资本必须遵守新沃尔西尼法律。这是我的底线。”\n\n代表愣了一下：“莱昂图索先生，您知道有多少城市求着我们投资吗？”\n\n“我知道。”莱昂图索站起来，“但那些城市没有新沃尔西尼的法律。”"
 src_federal.112.d: "第一个拿到新沃尔西尼正式市民积分的，是一个卖披萨的老头。他在新沃尔西尼住了四十年，从家族时代住到新城市时代，亲眼看着卡拉奇被炸死、卢比奥自杀、贝纳尔多服毒。\n\n他拿着积分卡，翻来覆去地看：“这东西，能让我孙子不用去家族当打手？”\n\n工作人员点头：“能。只要他好好读书，好好工作，好好纳税。”\n\n老头把积分卡贴在胸口，哭了。"
 src_federal.113.d: "新艺术区的开幕演出上，空站在聚光灯下，唱了一首《不期而会》。台下坐着乔万娜、德克萨斯、能天使、可颂，还有穿着便服的德米特里。\n\n唱到副歌时，乔万娜突然站起来，大声喊了一句：“德克萨斯！你还没死呢！”\n\n全场安静了一秒。然后德克萨斯站起来，面无表情地回了一句：“你也没死。”\n\n两人隔着人群对视，然后同时笑了。空在台上继续唱，声音比刚才更亮。"
 src_federal.114.d: "莱塔尼亚的商队、卡兹戴尔的矿石贩子、雷姆必拓的机械师、拉特兰的甜点师、维多利亚的纺织商——新沃尔西尼港的报关大厅里，五种语言同时响起。\n\n报关员是个年轻的鲁珀姑娘，她一边填表一边对旁边的新人说：“别慌。记住三件事：货单要真，关税要交，家族的人来了叫保安。”\n\n新人点头：“那要是保安也怕家族呢？”\n\n姑娘抬起头，指了指大厅墙上那行字：“这里是新沃尔西尼。法律没有情面可讲。”"
 src_federal.115.d: "莱昂图索在市政厅会议厅展示了那张蓝图。蓝图很长，铺满了整张会议桌，上面画着港口、铁路、法院、学校、医院、艺术区、感染者收容中心、联邦议会大厦。\n\n拉维妮娅站在桌边，手指沿着蓝图上的虚线移动：“这里是法院，这里是议会，这里是宪法广场。”\n\n德米特里站在对面，指着港口区：“这里是我的地盘。物流、仓储、安保，我来负责。”\n\n伊雷妮站在门口，抱着手臂：“运输保障署要一条直达港口的专用通道。”\n\n莱昂图索看着他们，突然想起贝纳尔多的话：“真正的权力，应当是能够引领一整个时代的力量。”\n\n“这不是蓝图，”他说，“这是宣战书。向旧叙拉古宣战。”"
 src_federal.116.d: "拉维妮娅站在城邦联合法院的台阶上，身后是十二位新任命的高级法官。他们的名字被刻在法院门楣上——没有家族姓氏，只有名字。\n\n“从今天起，”她对着台阶下的记者和市民说，“这座法院不再属于任何家族，不再属于任何城市，不再属于任何派系。它只属于法律。”\n\n一个老法官从人群中走出来，颤颤巍巍地摘下自己的家族徽章，放在台阶上。\n\n然后是第二个、第三个。徽章堆了一小堆。拉维妮娅看着那堆金属，轻声说：“荆棘之路，从这里开始。”"
 src_federal.117.d: "深夜，拉维妮娅在办公室里翻看新修订的《紧急审判程序》。桌角放着那封皱巴巴的信——很多年前，那个被家族推上法庭的替罪者写给她的感谢信。\n\n有人敲门。是伺夜。\n\n“这么晚还不走？”他靠在门框上。\n\n拉维妮娅头也不抬：“这条条款不够严密。家族请的律师能从三个地方钻空子。”\n\n伺夜走过来，看了一眼条款，拿起笔改了几个字。拉维妮娅抬头看他：“你怎么知道这里要改？”\n\n“哥伦比亚的狡诈，你忘了？”伺夜笑了一下，“我学过的。”"
 src_federal.118.d: "法官学院的开学典礼上，拉维妮娅看着台下五十张年轻的面孔。他们来自不同的城市、不同的种族、不同的阶层。有人曾经是家族打手，有人曾经是卡车司机，有人曾经是感染者。\n\n“叙拉古没有警察系统，”拉维妮娅说，“法官就是叙拉古的秩序。你们要学的不是怎么判案，而是怎么在没有人支持的时候，仍然做出正确的判决。”\n\n一个学生举手：“老师，如果家族威胁我们呢？”\n\n拉维妮娅沉默了一会儿，然后说：“那就让他们看看，你们手上的荆棘手套，不是装饰。”"
 src_federal.119.d: "罗德岛的医疗队第一次进入新沃尔西尼感染者收容中心时，苏苏洛站在门口，深吸了一口气。她见过很多感染者收容所，但新沃尔西尼这个不一样——干净的病床、充足药物、独立的通风系统。\n\n“这是谁设计的？”她问。\n\n一个穿着便服的前家族医生走过来：“我设计的。我以前在家族里专门处理‘麻烦的感染者’——就是让他们消失。现在，我在赎罪。”\n\n苏苏洛看着他，伸出手：“欢迎加入罗德岛。”"
 src_federal.120.d: "法案通过那天，一个萨弗拉商人、一个鲁珀卡车司机、一个感染了矿石病的教师、一个前家族打手——四个人站在市政厅门口，手里举着同一份文件。\n\n记者问他们为什么要来。\n\n卡车司机说：“因为我的车队里有个感染者，他开得比我好，但以前只能拿一半工资。”\n\n教师说：“因为我的学生里有萨弗拉的孩子，他以前不敢说自己的种族。”\n\n前打手说：“因为我以前打人，现在我想保护人。”\n\n萨弗拉商人说：“因为我是个生意人。平等能让我多赚钱。”\n\n四个人互相看了一眼，都笑了。"
 src_federal.121.d: "都灵区第一次区议会选举那天，投票站设在原来的家族会所里。会所墙上还留着家族的徽记，但被一块红布遮住了。\n\n一个老奶奶颤巍巍地走进投票站，投下第一票。工作人员递给她一张贴纸，上面写着“我投票了”。\n\n老奶奶把贴纸贴在拐杖上，走出投票站，对等候的记者说：“我活了七十年，第一次投票。以前选谁不选谁，都是家族说了算。现在，我说了算。”\n\n远处的街角，一个穿黑西装的鲁珀男人看着这一切，默默转身离开。"
 src_federal.122.d: "起草委员会第一次会议在新沃尔西尼法院的地下室举行。没有圆桌，只有一张长条桌，桌上铺满了各城市的法律草案。\n\n莱昂图索坐在桌子一端，拉维妮娅坐在另一端，德米特里坐在侧面，伊雷妮坐在门口。还有布鲁奈罗、蒙特卢佩、特尔尼的代表，还有罗德岛的法律顾问，还有企鹅物流的代表。\n\n“第一条，”拉维妮娅拿起笔，“叙拉古联邦共和国的主权属于全体叙拉古人。任何家族、任何城市、任何组织，不得凌驾于法律之上。”\n\n没有人反对。\n\n“第二条，”她继续写，“移动城市实行自治，但自治权由联邦宪法授予，不得对抗联邦法律。”\n\n德米特里举了一下手：“港口和物流，归联邦还是归城市？”\n\n“归联邦。”莱昂图索说，“但联邦委托贝洛内企业运营。”\n\n德米特里点头：“成交。”"
 src_federal.123.d: "诺埃米第一天到警察局报到时，局长让她选一把武器。柜子里有制式弩、施术单元、短刀、铳形法杖。\n\n她选了弩。\n\n“为什么？”局长问。\n\n“因为我第一次见到真正的家族暴力，就是弩箭。”诺埃米说，“那只手从我耳边飞过，是贝纳尔多救了我。现在，我要用弩保护别人。”\n\n局长沉默了一会儿，把弩递给她：“好好用。”"
 src_federal.124.d: "国民卫队第一期政治教育课上，教官是德米特里。\n\n“你们中有人当过家族打手，有人当过雇佣兵，有人当过走私船护卫。”德米特里在黑板前踱步，“我不问你们的过去。我只问一个问题：你们为什么而战？”\n\n台下沉默。\n\n“为钱。”有人小声说。\n\n“为活命。”\n\n“为家人。”\n\n德米特里点头：“好。从今天起，你们的答案是：为新沃尔西尼的法律而战，为叙拉古人的尊严而战。如果你们做不到，现在就可以走。”\n\n没有人动。"
 src_federal.125.d: "德克萨斯坐在市政厅的临时办公室里，面前是企鹅物流的加密通讯器。能天使的声音从里面传出来：“德克萨斯，大帝说新沃尔西尼的披萨不错，他想来开分店。”\n\n“让他先交税。”\n\n“他说他是兽主，不用交税。”\n\n德克萨斯沉默了三秒：“告诉他，新沃尔西尼法律适用于所有种族。兽主也不例外。”\n\n通讯器那头传来大帝的怒吼：“这个德克萨斯！比西西里夫人还难搞！”\n\n德克萨斯关掉通讯器，嘴角微微上扬。"
 src_federal.126.d: "拉普兰德回到新沃尔西尼那天，德克萨斯在港口等她。\n\n“你来干什么？”德克萨斯问。\n\n“来看看你。”拉普兰德靠在栏杆上，“顺便告诉你，扎罗说新沃尔西尼的气味变了。以前是血和酒，现在是……墨水？”\n\n“是法律。”\n\n“难闻。”\n\n两人沉默了一会儿。然后拉普兰德说：“我让狼群不进城。但你也别让猎狼人进荒野。这是停战协议。”\n\n“我不代表猎狼人。”\n\n“你代表德克萨斯。”拉普兰德转身离开，“够了。”"
 src_federal.127.d: "国民卫队成立那天，莱昂图索站在检阅台上。台下是三千名士兵——前家族打手、退伍军人、卡车司机、感染者、萨弗拉、鲁珀、沃尔珀。\n\n他们穿着统一的制服，但武器五花八门：制式弩、铳形法杖、改装卡车、源石炸药。\n\n“你们没有统一的武器，”莱昂图索说，“但你们有统一的信念。从今天起，你们不再为家族而战，不再为金钱而战。你们为新沃尔西尼而战，为叙拉古联邦而战。”\n\n三千人齐声喊：“新沃尔西尼！联邦！法律！”\n\n声音震得港口的海鸥四散飞起。"
 src_federal.128.d: "德米特里把一把铳放在桌上，旁边放着一本《联邦宪法》。\n\n“这是旧的铳与秩序。”他指着铳，“西西里夫人的铳，家族的秩序。”\n\n然后他拿起宪法：“这是新的铳与秩序。铳归国家，秩序归法律。你制定规则，我凝聚力量。”\n\n莱昂图索拿起宪法，翻开第一页：“你确定你能接受？”\n\n德米特里笑了一下：“我从小就在接受。接受你比我小四岁，接受你比我聪明，接受你比我更适合当领袖。现在多接受一件事，不难。”\n\n莱昂图索握住他的手。这一次，比上次更紧。"
 src_federal.129.d: "最后一批萨卢佐私兵交出武器那天，阿尔贝托在拘留所里看着电视新闻。画面上，他的前手下们穿着国民卫队制服，列队走过新沃尔西尼法院广场。\n\n记者问其中一个士兵：“你为什么加入国民卫队？”\n\n士兵说：“因为我不想再当家族的打手。我想当叙拉古的军人。”\n\n阿尔贝托关掉电视，对看守说：“给我一张纸，一支笔。我要写信。”\n\n“写给谁？”\n\n“写给拉普兰德。告诉她，她赢了。”"
 src_federal.130.d: "德克萨斯站在新沃尔西尼港的码头上，看着企鹅物流的货轮缓缓靠岸。能天使从船上跳下来，手里举着一个披萨盒：“德克萨斯！大帝让我带给你的！他说这是龙门最好吃的披萨！”\n\n德克萨斯接过披萨盒，打开看了一眼。里面是空的。\n\n“能天使。”\n\n“嗯？”\n\n“披萨呢？”\n\n能天使眨眨眼：“大帝说，让你先签这份长期物流合同，他才把披萨给你。”\n\n德克萨斯把空盒子扣在能天使头上，转身走向市政厅。但她走了两步，停下来，回头说：“合同拿来。披萨也要。”"
 src_federal.131.d: "凯尔希的通讯出现在市政厅屏幕上时，莱昂图索正在和拉维妮娅讨论宪法草案。\n\n“罗德岛愿意提供医疗、感染者收容、战术协同。”凯尔希的声音一如既往地平淡，“但我们需要新沃尔西尼港的长期停泊权，以及感染者权益保障法的联邦推广承诺。”\n\n拉维妮娅看了莱昂图索一眼。莱昂图索点头。\n\n“成交。”拉维妮娅说，“但有一条：罗德岛不能干预叙拉古内政。”\n\n凯尔希沉默了三秒：“我们从不干预。我们只提供选择。”"
 src_federal.132.d: "沙雷的“黄金平原”酒业在新沃尔西尼的市场份额被修正案压缩到不足三成。他亲自来市政厅找莱昂图索谈判。\n\n“莱昂图索先生，您这是在破坏公平竞争。”\n\n莱昂图索把修正案推过去：“这是公平竞争。您的货架陈列协议要求零售商二选一，您的合同违约金高到卡车司机破产，您的并购让本地酒庄全灭。现在，我们要求您遵守新沃尔西尼法律。”\n\n沙雷站起来，整理了一下西装：“您会后悔的。”\n\n“也许。”莱昂图索也站起来，“但您会先破产。”"
 src_federal.133.d: "莉泽尔带着黑绒幕乐团在新沃尔西尼艺术区演出那天，莱塔尼亚大使馆发来照会：要求新沃尔西尼交出“涉嫌参与毒杀案”的乐团成员。\n\n莱昂图索把照会递给拉维妮娅。拉维妮娅看完，拿起笔在照会背面写了一行字：\n\n“新沃尔西尼法院已审理此案，判决为：葆拉之死系莱塔尼亚‘永恒恩典’策划。请贵国配合调查。”\n\n她把照会递回去：“发给莱塔尼亚大使。”\n\n莉泽尔在隔壁排练厅继续排练。音乐声穿过墙壁，像在嘲笑那张照会。"
 src_federal.134.d: "布鲁奈罗、蒙特卢佩、特尔尼、新沃尔西尼——四座城市的代表在新沃尔西尼港签署《移动城市自治联盟宪章》那天，灰厅发来了一封电报。\n\n电报只有一句话：“西西里夫人问：你们要造反吗？”\n\n莱昂图索拿起笔，在电报背面写了回电：“不。我们只是在回答您当年问阿格尼尔神父的问题——有没有人能提出让您满意的答案。”\n\n他把电报递给信使：“发回去。”\n\n信使走后，德米特里问：“她会满意吗？”\n\n莱昂图索看着窗外：“不知道。但她至少不会用巨狼之口来回答。”"
 src_federal.135.d: "叙拉古联邦共和国成立那天，新沃尔西尼港放了二十三响礼炮——每一响代表一座移动城市。\n\n莱昂图索站在市政厅顶层，身边是拉维妮娅、德米特里、伊雷妮、德克萨斯、乔万娜、诺埃米、甘比诺、卡彭，还有罗德岛的代表、企鹅物流的代表、移动城市自治联盟的代表。\n\n广场上，市民举着联邦旗帜。旗帜上没有家族徽记，只有一行字：“法律高于一切”。\n\n远处，拉普兰德靠在港口栏杆上，扎罗趴在她脚边。她看着礼炮的烟雾，说：“德克萨斯，你做到了。”\n\n德克萨斯站在她旁边：“是我们做到了。”\n\n拉普兰德笑了一下：“不。是你们做到了。我只是……没挡路。”\n\n两人并肩看着礼炮。最后一响落下时，拉普兰德转身离开。\n\n“去哪儿？”\n\n“荒野。”拉普兰德头也不回，“但我会回来看你们的。毕竟，权力是真正的狼群。而你们，现在也是狼群了。”\n\n德克萨斯看着她的背影，轻声说：“永别了，拉普兰德。”\n\n拉普兰德停了一下，然后继续走。\n\n新的一天已经来了。"
 srcse.1.t: "叙拉古的新纪元！"
 srcse.1.d: "灰厅的圆桌被拆了，木料够搭三座舞台。新沃尔西尼人没有把它做成纪念碑，他们做成了看台。\n\n灯暗下来的时候，没有人吹口哨——叙拉古人从来不信台上的人。他们见过太多穿得体的男人在同样的灯光里许诺同样的东西，然后转身去领自己那一份。\n\n可那个歌手还是唱了下去。他唱一座不需要家族也能运转的城市，唱法官、警察、司机和卖馄饨的老板娘，唱那些名字第一次被写进同一部法律里的人。\n\n“他也是骗子吗？”有人在人群里小声问。\n\n没有人回答。第二幕唱到一半，前排的人开始跟着哼，后排的人站起来，想看清台上究竟是谁。"
 srcse.1.a: "§T他也是骗子吗？§!"
 SRC_super_event_new_era_title: "叙拉古的新纪元！"
 SRC_super_event_new_era_quote: "“我们不为宏大叙事鼓掌，只为这一天确实过得不坏鼓掌。”\n——新沃尔西尼，联邦成立日的第二幕"
 SRC_super_event_new_era_close: "§T他也是骗子吗？§!"

