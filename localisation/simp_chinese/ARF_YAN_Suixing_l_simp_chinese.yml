# 大炎 · 【岁醒】开局树（2026-10-25 精简为 5 格）
# 生成器：E:/tmp/sui12/gen_suixing.js

# ---- 国策 ----
YAN_suixing:0 "岁醒"
YAN_suixing_desc:0 "司岁台最早的古卷拓本上记着一句：有兽名岁，裂为十二。千年前那场大狩把它赶出了大炎疆土，却没能赶出人们的记性——玉门就是为那场狩猎修的堡垒。如今，岁陵底下的呼吸换了节拍。"
YAN_suixing_press_tt:0 "岁压 -20——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Seal_Suiling:0 "岁陵封禁"
YAN_SX_Seal_Suiling_desc:0 "以百灶为中心划出禁区，禁军换下秉烛人；十九州的地脉逐段截断，百谷的仓门开了，器侑与字侑一起烧掉。四线同时动手，岁压从八十压到十七——这笔账先按能算清的那部分算。"
YAN_SX_Seal_Suiling_press_tt:0 "岁压 -63——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Behemoth_Sight:0 "巨兽现形"
YAN_SX_Behemoth_Sight_desc:0 "真龙只带一面旗出宫，十二个代理人挨个过堂；千年前那场大狩的整套安排摆上台面。然后祂站起来——影子压过半个平原，那年的望烽节，鼓停了。"
YAN_SX_Behemoth_Sight_press_tt:0 "岁压 +32——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Whole_Board_Bet:0 "通盘之赌"
YAN_SX_Whole_Board_Bet_desc:0 "司岁台说罪在封陵，兵部说罪在养伥，钦天监说罪在天。真龙独自走下丹墀，隔着腰上那把钥匙与祂相对——一百八十枚黑子散入人间，再没人算得出下一步。"
YAN_SX_Whole_Board_Bet_press_tt:0 "岁压 -24——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Sui_Agreement:0 "岁陵之约"
YAN_SX_Sui_Agreement_desc:0 "约上没写谁输谁赢，只写了祂退回陵里、人间照旧过日子。执笔那人的手抖了一路——他记得半句没写完的话：以天下为棋枰。"
YAN_SX_awake_p_tt:0 "岁兽苏醒度上升：祂醒得越透，反扑越狠"
YAN_SX_awake_m_tt:0 "岁兽苏醒度下降：镇压见效，读数回落"
YAN_SX_Sui_Agreement_tt:0 "岁压清零、撤除「岁临天下」；祂退回岁陵，人间照旧。大炎改回正常国策树。"
YAN_SX_shudao_m10_tt:0 "书刀完整度 −10：肃清要翻旧账，刀口又卷了一分。"
YAN_SX_shudao_m15_tt:0 "书刀完整度 −15：封了笔，也就少了一双能改错字的眼睛。"
YAN_SX_agent_m10_tt:0 "代理人信任 −10：甄别名单上，十二个人的名字都在。"
YAN_SX_agent_u20_tt:0 "代理人信任 +20"
YAN_SX_bufan_m50_tt:0 "不反准备度 −50：那台机器暂时不必开了。"
YAN_SX_bufan_u25_tt:0 "不反准备度 +25：再走一步，就能送真龙上路。"

# ---- 岁压精神 ----
YAN_sui_pressure:0 "岁临天下"
YAN_sui_pressure_desc:0 "司岁台把它记作「岁」：千年前那场大狩只送走了祂的身影，没能送走人们的记性。祂没有动手，只是醒着——而祂醒着这件事，就足够让大炎的炉子一座座冷下来。"

# ---- 严重程度读数 ----
YAN_sui_press_mild:0 "\n§G岁压：轻微§!——岁陵只剩几声闷响，各州的奏报还写得完整。"
YAN_sui_press_tight:0 "\n§Y岁压：吃紧§!——地脉开始倒灌，工坊的炉温压不住，征调文书一天三改。"
YAN_sui_press_grave:0 "\n§O岁压：危殆§!——十九州同时报警，百灶的米价一天一个数。"
YAN_sui_press_collapse:0 "\n§R岁压：崩局§!——产线成片停下，军队靠缴获过日子。司岁台已经不再写理由。"
YAN_sui_press_doomsday:0 "\n§R岁压：绝境§!——大炎基本停摆。这不是天灾，是有人在收账。"
YAN_sui_press_clear:0 "\n§G岁压：平复§!——岁陵安静下来，人间照旧过日子。"
