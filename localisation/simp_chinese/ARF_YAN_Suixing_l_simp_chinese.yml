# 大炎 · 【岁醒】开局树（重制版）
# 生成器：E:/tmp/sui12/gen_suixing.js

# ---- 国策 ----
YAN_suixing:0 "岁醒"
YAN_suixing_desc:0 "司岁台最早的古卷拓本上记着一句：有兽名岁，裂为十二。千年前那场大狩把它赶出了大炎疆土，却没能赶出人们的记性——玉门就是为那场狩猎修的堡垒。如今，岁陵底下的呼吸换了节拍。"
YAN_suixing_press_tt:0 "岁压 -3——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Wake_Thunder:0 "岁陵崩裂"
YAN_SX_Wake_Thunder_desc:0 "封印不是被谁打破的，是自己撑不住的。当年为那场大狩修的镇物，一夜之间裂了七道缝；秉烛人上陵勘察，奏报只有八个字：镇石尚在，封记已死。"
YAN_SX_Wake_Thunder_press_tt:0 "岁压 0——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Loyal_Edict:0 "勤王诏书"
YAN_SX_Loyal_Edict_desc:0 "诏书发到十九宣政司，落款是十七岁的真龙。同一天，司岁台把「不反」的钥匙从库房最深处取了出来——那是留给真龙血脉的最后一条路：以身为引，与岁同归。"
YAN_SX_Loyal_Edict_press_tt:0 "岁压 -4——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Seal_Suiling:0 "岁陵封禁"
YAN_SX_Seal_Suiling_desc:0 "以百灶为中心划出禁区，秉烛人换成了禁军。秉烛人的本职是「明烛以驱巨兽之影，巡游以察社稷之患」——如今他们只守墙，墙里的事，谁也不许再看。"
YAN_SX_Seal_Suiling_press_tt:0 "岁压 -6——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Cut_Leyline:0 "地脉截流"
YAN_SX_Cut_Leyline_desc:0 "十九州的地脉逐段截断，断了它的食。断脉的地方要旱三年，这笔账以后再算——管账的司岁台如今每天烧掉的册子，比往年一整年还多。"
YAN_SX_Cut_Leyline_press_tt:0 "岁压 -4——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Granary_Levy:0 "百谷急调"
YAN_SX_Granary_Levy_desc:0 "兵过如梳，粮过如篦。百谷的仓门开了，管仓的只问一句：够不够撑到开春？开春是望烽节，玉门要在城头擂响十七声鼓，把这一年的劫难一笔记完。"
YAN_SX_Granary_Levy_press_tt:0 "岁压 -2——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Purge_Zhang:0 "伥物肃清"
YAN_SX_Purge_Zhang_desc:0 "邙山镇的器物开始活过来：器有了侑，字有了伥。肃清队挨家挨户，辨别的法子很土——会动的烧掉，不动的留着。烧到第三天，火堆边站着的人都在说话，谁也不敢先停手。"
YAN_SX_Purge_Zhang_press_tt:0 "岁压 -1——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Storm_Suiling:0 "岁陵攻坚"
YAN_SX_Storm_Suiling_desc:0 "禁军、天师、钦天监的术师一并压上岁陵，陵前的石阶一夜被踩平。司岁台翻了旧档：千年前那场大狩，也是从这样的石阶开始往上走的。"
YAN_SX_Storm_Suiling_press_tt:0 "岁压 -6——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Dream_Counter:0 "梦域反制"
YAN_SX_Dream_Counter_desc:0 "令把梦摊开，均把梦盖回去，一寸寸收。梦里杀了三天，醒来时百灶落雪——雪落在八千年为春、八千年为秋的地方，谁也不觉得意外。"
YAN_SX_Dream_Counter_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Melt_Qiyou:0 "器侑销熔"
YAN_SX_Melt_Qiyou_desc:0 "器侑烧起来没有烟，只留一声很轻的响动，像是道谢。"
YAN_SX_Melt_Qiyou_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Seal_Ziyou:0 "字侑封笔"
YAN_SX_Seal_Ziyou_desc:0 "天镜阁封笔三日，三日之内不许落墨：字一落到纸上，就可能站起来。旧档里那些没写完的句子，是这三天里唯一被允许留白的东西。"
YAN_SX_Seal_Ziyou_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Slay_Sword:0 "斩岁之剑"
YAN_SX_Slay_Sword_desc:0 "宗师佩剑里封着岁兽本体十二分之一的意识。重岳握着它的时候，把「朔」的名字又念了一遍——他答应过，这把剑最后要送回陵里去。"
YAN_SX_Slay_Sword_press_tt:0 "岁压 -7——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Burn_Mowang:0 "墨魉焚卷"
YAN_SX_Burn_Mowang_desc:0 "夕把自己的一幅画烧了。火盆边上她说，那一笔本来就不该留在世上——「省得它自己走出来。」"
YAN_SX_Burn_Mowang_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Jieyuan_Rite:0 "界园镇抚"
YAN_SX_Jieyuan_Rite_desc:0 "易主持界园镇抚，仪轨一日一夜不歇。他说界园里收着的都是死东西：图籍、器物、旧题跋——死东西最懂事，你把它摆正，它就一直在原位。"
YAN_SX_Jieyuan_Rite_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Shanhaizhong_Trial:0 "山海众问罪"
YAN_SX_Shanhaizhong_Trial_desc:0 "祭坛倒了，「山海八荒，尽归其主」的口号当日就哑了。跪在最前头的那个人说，他见过神——神只对他说过一句话：我只是正好需要些人手来制造混乱。"
YAN_SX_Shanhaizhong_Trial_press_tt:0 "岁压 -4——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Dragon_Led_Hunt:0 "真龙亲征"
YAN_SX_Dragon_Led_Hunt_desc:0 "真龙出宫，仪仗只带一面旗。他说这一趟不必回来，回来的是谁都可以。"
YAN_SX_Dragon_Led_Hunt_press_tt:0 "岁压 -6——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Agent_Screen:0 "代理人甄别"
YAN_SX_Agent_Screen_desc:0 "十二个人挨个过堂。问的不是忠不忠，是你还想不想当自己。"
YAN_SX_Agent_Screen_press_tt:0 "岁压 -5——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Great_Hunt:0 "大狩维天"
YAN_SX_Great_Hunt_desc:0 "千年前那场大狩，诛神逐兽，岁裂为十二——司岁台监之，岁陵镇之，玉门备之。所有的安排都摆在明面上，摆了一千年，等的就是今天。"
YAN_SX_Great_Hunt_press_tt:0 "岁压 -10——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Behemoth_Sight:0 "巨兽现形"
YAN_SX_Behemoth_Sight_desc:0 "祂终于站起来。影子压过半个平原，烽火台上竟没人敢点第二堆火——那年的望烽节，鼓停了。"
YAN_SX_Behemoth_Sight_press_tt:0 "岁压 +14——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Bufan_Reforge:0 "不反再铸"
YAN_SX_Bufan_Reforge_desc:0 "不反源石重新浇筑，引子用真龙自己的血。铸成那天没人敢往铸炉那边看——都知道铸的不是器，是一条退路。"
YAN_SX_Bufan_Reforge_press_tt:0 "岁压 +10——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Sui_Wrath:0 "岁怒难平"
YAN_SX_Sui_Wrath_desc:0 "岁怒不是脾气，是账。祂记得大炎做过的事：诛神、逐兽、裂为十二。千百年一笔一笔积下来，总要有人认这笔。"
YAN_SX_Sui_Wrath_press_tt:0 "岁压 +8——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Court_Trial:0 "御前论罪"
YAN_SX_Court_Trial_desc:0 "司岁台说罪在封陵，兵部说罪在养伥，钦天监说罪在天。殿外雪落半夜，没人扫。"
YAN_SX_Court_Trial_press_tt:0 "岁压 -10——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Dragon_Descends:0 "真龙下阶"
YAN_SX_Dragon_Descends_desc:0 "真龙独自走下丹墀，仰头看了很久。他身后是皇位，身前是那东西——中间隔着的，是他腰上那把钥匙。"
YAN_SX_Dragon_Descends_press_tt:0 "岁压 -8——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Whole_Board_Bet:0 "通盘之赌"
YAN_SX_Whole_Board_Bet_desc:0 "「以望为名的这盘棋，就算你胜好了——可你知道这盘棋在通盘来看，有多微不足道么？」一百八十枚黑子就此散入人间，再没人算得出下一步落在哪里。"
YAN_SX_Whole_Board_Bet_press_tt:0 "岁压 -6——岁压决定工厂、船坞、基建、科研、组织度、补给与稳定度的失血幅度"
YAN_SX_Sui_Agreement:0 "岁陵之约"
YAN_SX_Sui_Agreement_desc:0 "约上没写谁输谁赢，只写了祂退回陵里、人间照旧过日子。执笔那人的手抖了一路——他记得半句没写完的话：以天下为棋枰。"
YAN_SX_awake_p_tt:0 "岁兽苏醒度上升：祂醒得越透，反扑越狠"
YAN_SX_awake_m_tt:0 "岁兽苏醒度下降：镇压见效，读数回落"
YAN_SX_Sui_Agreement_tt:0 "岁压清零、撤除「岁临天下」；祂退回岁陵，人间照旧。大炎改回正常国策树。"
YAN_SX_shudao_m10_tt:0 "书刀完整度 −10：肃清要翻旧账，刀口又卷了一分。"
YAN_SX_shudao_m15_tt:0 "书刀完整度 −15：封了笔，也就少了一双能改错字的眼睛。"
YAN_SX_agent_u10_tt:0 "代理人信任 +10：祂们看见大炎真的在认账。"
YAN_SX_agent_m10_tt:0 "代理人信任 −10：甄别名单上，十二个人的名字都在。"
YAN_SX_agent_u20_tt:0 "代理人信任 +20"
YAN_SX_bufan_m50_tt:0 "不反准备度 −50：那台机器暂时不必开了。"
YAN_SX_bufan_u25_tt:0 "不反准备度 +25：再走一步，就能送真龙上路。"

# ---- 岁压精神 ----
YAN_sui_pressure:0 "岁临天下"
YAN_sui_pressure_desc:0 "司岁台把它记作「岁」：千年前那场大狩只送走了祂的身影，没能送走人们的记性。祂没有动手，只是醒着——而祂醒着这件事，就足够让大炎的炉子一座座冷下来。"

# ---- 严重程度读数 ----
YAN_sui_press_mild:0 "\n§G岁压：轻微§!——岁陵只剩几声闷响，各州的奏报还写得完整。"
YAN_sui_press_tight:0 "\n§Y岁压：吃紧§!——地脉开始倒灌，工坊的炉温压不住，征调文书一天三改。"
YAN_sui_press_grave:0 "\n§O岁压：危殆§!——十九州同时报警，百灶的米价一天一个数。"
YAN_sui_press_collapse:0 "\n§R岁压：崩局§!——产线成片停下，军队靠缴获过日子。司岁台已经不再写理由。"
YAN_sui_press_doomsday:0 "\n§R岁压：绝境§!——大炎基本停摆。这不是天灾，是有人在收账。"
YAN_sui_press_clear:0 "\n§G岁压：平复§!——岁陵安静下来，人间照旧过日子。"

