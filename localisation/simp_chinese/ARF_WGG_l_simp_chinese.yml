 #民族精神
 WGG_legal_system_intricate: "法律系统错综复杂"
 WGG_legal_system_intricate_desc: "在理论上，西方边境领的法律本该使用与莱塔尼亚本土同出于金律乐章的法典，而那些最高层的政府部门也是据此原则实践的。但事实上，各层官僚部门与民众至今还未完全接纳莱塔尼亚式的法律。民间仍将高卢统治时代遗留的习惯法视作解决冲突的最好方式，而许多政府机构也在数套截然不同乃至相互矛盾的法律间被绕得昏头转向。虽然近期政府进行了不少旨在消解行政冗余与加强法规统一的改革，可法律上的不统一仍是西方边境领需要面临的一大难题。"
 WGG_Revival_of_Commerce: "商业再兴"
 WGG_Revival_of_Commerce_desc: "在高卢仍存的遥远过去，西方边境领所处之地便有着发达的商贸业。卡西米尔、维多利亚、莱塔尼亚等多国商人在此经营生意乃至定居生子，而林贡斯所遣官员警察则维护着当地稳定。在巫王时代的恐怖统治狂暴地摧毁当地经济秩序之前，西方边境领本有着不输莱塔尼亚本土的财富。而在赫尔昏佐伦的高塔坍塌，卡尔斯·塞勒成为新总督后，一项被称作“再兴”的计划在崔林特尔梅中央支持下得以启动。依靠本土输送的无数资金与劳动力，西方边境在十余年间便回归了过去的经济高速增长，而在大战之后替代高卢官僚占据统治地位的莱塔尼亚商人们也赚得盆满钵盈。\n\n可在繁荣表面之下，莱塔尼亚人与本地其他民族不平等的经济分配问题对于地方政府而言仍是个藏于暗中的危机。若是无法将其解决，西方边境领内部的民族问题也或将进一步恶化。"
 WGG_Ethnic_Conflict_idea: "民族关系：纷争不断"
 WGG_Ethnic_Conflict_idea_desc: "对于除去巫王残党以外的所有莱塔尼亚人而言，赫尔昏佐伦——这位臭名昭著的暴君所统治之时代都绝对是一场刻骨铭心的磨难。而对西方边境领的人民而言，这场磨难不仅是无止的镇压、逮捕，更是可怖的种族压迫。当年统治西方边境领的总督不仅将镇压政策变本加厉，还引入了种族优越论以合法化其对非莱塔尼亚人近乎奴役的残酷压迫。\n\n在如今，巫王时代的可拍回忆虽已逐渐远去，但前人留下的“遗产”仍深刻影响着这片土地。尽管卡尔斯·塞勒总督自上任这一职位以来长期支持民族和解与融合政策，今日的西方边境领依旧遭受民族问题所困扰。"