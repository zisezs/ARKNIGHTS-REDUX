 #领导人
 WGG_Carls_Seler: "卡尔斯·塞勒"
 WGG_Carls_Seler_desc: "身为少数活过巫王时代恐怖统治的莱塔尼亚自由派政治家，卡尔斯·塞勒与其他莱塔尼亚政界人物有着诸多不同。这不仅体现在他出身自本地商人而非著名的贵族世家上，更是体现在塞勒的政治追求与他的自由主义理念上。他在巫王时代的边境领政府中摸爬滚打的同时尽力隐藏自己的自由理想，并在1077年巫王倒台后受双子女皇任命成为了西方边境领的总督。\n\n作为这片在巫王时代饱受摧残土地的新领导者，塞勒所接手的摊子绝对是个烫手山芋。当地的民族问题足以令最老道的行政官僚焦头烂额，而被摧残的经济与充斥缺陷的行政系统若想改革到可堪一用的水准也绝非易事。但卡尔斯·塞勒依旧坚持了下来，并以他的自由主义与平等主义理念试图使西方边境领能够变得更好。他在初任总督的那几年曾饱受嘲讽，但事实证明了塞勒道路的正确。十数年过去，曾经凋敝的经济大有好转，而民族关系与行政系统的效率也略有改善。随着边境领正一步步变好，许多人开始逐渐对这位曾不被看好的自由派总督心生认可。也许在塞勒带领下，西方边境领真的能够走出往日阴影，成为帝国皇冠上最耀眼的那颗明珠。"

