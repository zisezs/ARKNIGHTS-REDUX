 # ===== 开局树前 12 格国策的简介（设计稿原文）· 2026-09-30 =====
 URS_dr_ursus_dream_desc:0 "乌萨斯曾在无数个寒冷的长夜中前行。冰原、战争与灾难塑造了这个伟大的帝国，也塑造了生活在这片土地上的人民。\n\n然而，乌萨斯的故事尚未结束。\n\n在帝国辽阔的疆土之上，无数双眼睛正望向同一个未来——一个强盛、统一而繁荣的乌萨斯，一个无需畏惧严寒与灾难，能够屹立于大地之上的伟大国家。\n\n这便是我们的梦想。\n\n费奥多尔将会让每一个乌萨斯人在黎明中醒来，看见一个强盛、统一、不再受辱的帝国。乌萨斯之梦，从冻土上升起。"
 URS_dr_root_of_problems_desc:0 "梦想能够凝聚一个国家，却无法掩盖它所存在的问题。\n\n在漫长的历史中，乌萨斯依靠强大的军队、辽阔的土地走到了今天。然而，帝国表面上的强大并不能证明一切都在正常运转。\n\n官僚机构日益臃肿，军队内部积弊丛生，民众与统治阶层之间的裂隙不断扩大，而帝国赖以维系工业与战争的资源，也并非取之不尽。\n\n这些问题并非一日形成，也不可能靠一句口号解决。\n\n如果乌萨斯真的想要走向那个曾经描绘过的未来，那么我们首先必须回答一个问题：\n\n究竟是什么，正在阻碍乌萨斯成为它应当成为的样子？"
 URS_dr_state_desc:0 "一个庞大的帝国，需要无数齿轮才能运转。\n\n命令从中央传向地方，税收从城市汇入国库，物资从工厂送往军队，而帝国的每一项决策，都需要依靠无数官员去执行。\n\n可当这些齿轮开始生锈呢？\n\n官员开始优先考虑自己的利益，地方机构逐渐脱离中央的控制，而本应维持国家运转的制度，也在漫长的岁月中变得僵硬而迟缓。\n\n腐败并非只存在于某个办公室。\n\n问题在于，整个齿轮都已经需要润滑了。\n\n乌萨斯必须解决自己的国家机器。"
 URS_dr_army_desc:0 "军队是乌萨斯的剑。\n\n从边境的冻土，到帝国最遥远的城市，乌萨斯的旗帜之所以能够屹立至今，离不开无数士兵的鲜血与忠诚。\n\n可一柄锋利的剑，也需要被妥善保养。\n\n近年来，军队内部的问题已经越来越难以忽视。指挥体系彼此掣肘，军官之间争夺权力，基层士兵承受着不断增加的负担。\n\n乌萨斯拥有一支庞大的军队。\n\n但一支庞大的军队，并不意味着一支真正强大的军队。\n\n我们必须重新审视这柄剑。\n\n它究竟为何而战，又究竟是谁在握着剑柄？"
 URS_dr_rotten_desc:0 "乌萨斯的疆土依旧辽阔，军队依旧庞大，帝国的旗帜依旧飘扬在无数城市之上。\n\n可在那些宏伟的建筑、庄严的宫殿与厚重的公文背后，另一种景象正在蔓延。\n\n命令停留在地方，报告被层层修改，资源在抵达目的地之前便不知所踪。\n\n帝国并非没有法律，也并非没有制度。\n\n只是这些东西已经腐朽太久了。\n\n乌萨斯的国家机器依旧在运转，但它已经无法像过去那样有效地执行来自中央的意志。\n\n我们必须承认这一点。\n\n乌萨斯病了。"
 URS_dr_tension_desc:0 "乌萨斯的军队从来都不缺少勇气。\n\n真正令人担忧的，是那些已经无法被勇气掩盖的问题。\n\n大叛乱之后，帝国军队经历了大规模的重组。旧有的军官体系被打乱，地方军区之间的隔阂更加严重，而战争留下的猜忌，也随着时间沉淀在每一把军刀与每一面军旗之间。\n\n名义上，他们都效忠于乌萨斯。\n\n但当命令真正下达时，却已经没有多少人能够确定，身边的人究竟会听从谁的命令。\n\n九军七旗，各有其主。\n\n军队仍然站在那里。\n\n可这一次，剑已经出鞘，却还没有人知道它究竟会指向何方。"
 URS_dr_empty_chairs_desc:0 "帝国军事议会本应是乌萨斯最高军事权力的象征。\n\n大叛乱后，七位元帅各自代表着帝国最强大的七个集团军，在这里讨论战争、军备与帝国的军事战略。\n\n至少，过去是这样。\n\n如今，会议桌前仍然摆着七把属于元帅的椅子。\n\n但其中五把始终空着。\n\n五个集团军并没有失去他们的军队，也没有失去他们的旗帜。\n\n他们只是认为，没有必要参加这个会议。\n\n在那些集团军看来，帝国军事议会不过是一群远离前线的官僚与将领，为了争夺中央的认可而进行的无休止争论。\n\n真正的军队，不需要坐在这里等待别人告诉他们应该如何作战。\n\n于是，他们选择不来。\n\n七把椅子，只有两把有人落座。\n\n剩下的五把椅子，则像五个无声的耳光，提醒着帝国：\n\n这些集团军只效忠于他们的乌萨斯。"
 URS_dr_officials_first_desc:0 "一纸命令从首都发出，需要经过无数人的手才能抵达帝国最偏远的角落。\n\n每经过一个人，它便可能被重新解释一次。\n\n有些人出于谨慎，有些人出于利益，有些人则只是单纯地希望让事情保持现状。\n\n久而久之，中央的命令开始变得越来越模糊。\n\n帝国拥有成千上万名官员。\n\n可真正愿意为帝国负责的人，又还有多少？\n\n如果国家机器已经出了问题，那么我们必须先看看，是谁在推动这些齿轮。"
 URS_dr_gear_after_desc:0 "我们清查了官员。\n\n我们检查了账目。\n\n我们揭开了一层又一层藏在帝国行政体系中的秘密。\n\n可当尘埃落下以后，那个最令人不安的问题却依旧存在。\n\n即使所有腐败的官员都被替换，即使所有罪责都被追究，乌萨斯仍然会拥有庞大的行政机构、迟缓的审批流程以及层层叠叠的官僚体系。\n\n这不是某一个人的问题。\n\n这是机器本身的问题。\n\n更换齿轮或许很容易。\n\n真正困难的是让整台机器重新转起来。"
 URS_dr_lubricant_desc:0 "再坚固的机器，也无法在锈蚀与摩擦中长久运转。\n\n我们已经清理了一部分腐败，也重新审视了那些早已僵化的制度。但新的制度并不会因为一纸命令便立即生效，过去积累的问题也不会在一夜之间消失。\n\n官员仍然需要培训，机构仍然需要协调，地方与中央之间仍然需要重新建立联系。\n\n乌萨斯的机器太庞大了。\n\n我们无法一口气把它全部拆掉重造。\n\n那么，就先让那些停滞已久的齿轮重新转起来。\n\n有时候，帝国需要的并不只是新的齿轮。\n\n还需要一点润滑油。"
 URS_dr_internal_silence_desc:0 "内卫。\n\n他们是皇帝的利刃。\n\n与普通军队不同，内卫不属于任何集团军，也不需要在军事议会上为自己的派系争取利益。他们不参加军方的权力角逐，也很少干涉普通军队的日常事务。\n\n他们只在帝国需要他们的时候出现。\n\n然而，有一件事情必须被明确：\n\n内卫效忠的从来不只是皇帝本人。\n\n皇帝可以更替，宫廷可以改变，军队可以重组。\n\n但乌萨斯不能倒下。\n\n对内卫而言，皇帝是帝国的统治者，却不是他们忠诚的终点。\n\n他们效忠的是乌萨斯本身。\n\n所以他们才保持沉默。\n\n因为只要乌萨斯依旧存在，他们就没有必要向任何人证明自己的忠诚。\n\n而当帝国真正需要那把利刃的时候——\n\n他们自然会出鞘。"
 URS_dr_lonely_desc:0 "当我们开始清点乌萨斯所拥有的一切时，却发现了一件令人不安的事情。\n\n官僚机构有自己的规矩。\n七大集团军有自己的传统。\n地方势力有自己的利益。\n\n就连那些最忠诚的内卫，也只忠于乌萨斯本身，而不是任何一个人的意志。\n\n每个人都在维护他们所认为应该维护的东西。\n\n可当中央需要一个真正能够站出来，与我们共同承担责任的人时——\n\n我们找不到这样的答案。\n\n曾经，我们以为帝国如此庞大，身边自然会有无数支持者。\n\n现在才发现，庞大的帝国并不意味着团结。\n\n宫殿依旧灯火通明。\n帝国的旗帜依旧矗立。\n军队依旧驻守边疆。\n\n可在这一切背后，真正愿意与中央共同承担乌萨斯未来的人，寥寥无几。\n\n我们拥有整个帝国。\n\n却仿佛孤身一人。"

