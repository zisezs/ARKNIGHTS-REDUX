l_simp_chinese:

# ==============================================================================
#  大炎 · 登临意（事件链 · 10 环）
#  · 原作 act23side，地点大炎北境移动城塞玉门，时间早春三月
#  · 视角：玉门归国途中，重岳要交出那把剑，朝廷要决定剑落在谁手里
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 满客栈
# ------------------------------------------------------------------
 yan_dly.1.t: "满客栈"
 yan_dly.1.d: "玉门与龙门因一场天灾临时拆分，滞留的旅客把城里客栈住满了。\n\n茶馆里连日争论《玉门风云》演的是不是真事，一个从萨尔贡来的游客何昔安自称见过戏里的宗师，差点跟邻桌动了手。\n\n同一天，医馆伙计槐天裴挑着一担药从门口经过。他在玉门抵了三年药钱，不知道自己的女儿槐琥就坐在隔壁桌。老鲤也在茶馆，临走时提了一句：三天后是那姑娘的生日。"
 yan_dly.1.a: "拨钱安顿滞留客，不许驱赶"
 yan_dly.1.b: "照例清城，滞留者限期离境"
 yan_dly.1.c: "借这批人手，充实北境民户"

# ------------------------------------------------------------------
# 2 擂台榜
# ------------------------------------------------------------------
 yan_dly.2.t: "名字要上第一页"
 yan_dly.2.d: "玉门城里立着一块擂台榜，第一页只挂十个名字。龙门来的槐琥连赢了五场。她要让名字出现在全城最显眼的地方，好让三年没跟她说过话的父亲看见，名次倒在其次。\n\n第五场的对手是阿纳萨少女截云，她争的是头名的奖品，一把剑，用来祭拜师父。槐琥赢了这一场，在榜下站了一会儿，转身去找那个输了的姑娘。"
 yan_dly.2.a: "重赏擂台，广募天下武人"
 yan_dly.2.b: "擂台照旧，不另拨钱"
 yan_dly.2.c: "许擂台胜者入军籍，授职"

# ------------------------------------------------------------------
# 3 托剑
# ------------------------------------------------------------------
 yan_dly.3.t: "交给比武第一人"
 yan_dly.3.d: "重岳要交出一把剑。剑名「朔」，是他弃掉神性、把残魂封进去才留下的东西。他守玉门一百年，如今要走，剑得留下。\n\n朝廷原意是交给司岁台或军中封存，看时局、看谁坐得稳。重岳不同意，坚持交给比武第一人。太傅替他转呈，理由是司岁台离那个罪人太近。左宣辽听完没有作声，把茶盏放下了。\n\n座中还有龙门总督魏彦吾。他看了重岳很久，只说：你比我干脆。"
 yan_dly.3.a: "准重岳所请：剑归比武第一人"
 yan_dly.3.b: "剑归司岁台封存"
 yan_dly.3.c: "剑留军中，由左宣辽掌"

# ------------------------------------------------------------------
# 4 截杀
# ------------------------------------------------------------------
 yan_dly.4.t: "信使队"
 yan_dly.4.d: "城外的天灾信使队被杀了，十几具尸体摆成流寇劫杀的样子。做得不算精细，有一条袖口是反缝的。\n\n龙门特使林雨霞带着数据回城，路上又遭了一次截杀，铸剑坊坊主孟铁衣用一锤砸断了对方的刀。左宣辽当天下令：三日内追剑、缉凶、清山海众，玉门封城，减速，改航道。\n\n这差事交给他的儿子左乐。左乐接了令，没有敬礼，转身就走。城里人知道封城意味着什么：半城滞留的旅客、几十家武行，还有所有说不清来历的人，都要关在这座行驶中的城塞里。"
 yan_dly.4.a: "准封城，全力缉凶"
 yan_dly.4.b: "不封城，查案归查案"
 yan_dly.4.c: "改航道避灾，暂缓追查"

# ------------------------------------------------------------------
# 5 桃花
# ------------------------------------------------------------------
 yan_dly.5.t: "满院桃花"
 yan_dly.5.d: "那一夜，魏彦吾的院子里开满桃花。花期未至，睚进了城。这头巨兽被山海众奉为首领，所到之处时序错乱。重岳空手接下一刀，四人合围，仍让它走脱。混乱中，剑架上的「朔」被截云盗走了。\n\n重岳在空剑架前站了很久，没有发怒，只是不太习惯架子空着。同一夜，一个没有留下姓名的人找到睚，谈成一个约定：两分之势，互不妨碍。"
 yan_dly.5.a: "通缉截云，追回「朔」"
 yan_dly.5.b: "放截云走，剑由她带离"
 yan_dly.5.c: "全城戒备，以睚为首要之敌"

# ------------------------------------------------------------------
# 6 旧账
# ------------------------------------------------------------------
 yan_dly.6.t: "望烽节第二夜"
 yan_dly.6.d: "望烽节三日擂十七声鼓，记过去一年的劫难。第二夜，孟铁衣登上城楼，求左宣辽准他出城，收二十年前死在城外的兄弟的尸骨。\n\n左宣辽拒绝了，封城期间谁也不许出。孟铁衣没有闹，只把那一年的事讲了一遍：山海众混进城，左宣辽改制，武行被逐个请出行伍，铸剑坊从官办变成铁匠铺，他的兄弟就死在那一年，尸骨一直没有收回来。他说，镖局也好，物流也好，赌上的都是人命，为的也是人命。说完便下了城楼。左宣辽在原地站到鼓响。"
 yan_dly.6.a: "准其出城收尸，官给祭仪"
 yan_dly.6.b: "不准，封城之令不可自破"
 yan_dly.6.c: "召孟铁衣入军籍，旧事一概不问"

# ------------------------------------------------------------------
# 7 封坊
# ------------------------------------------------------------------
 yan_dly.7.t: "官民撕破脸"
 yan_dly.7.d: "太合暗查了三天，第四天被人抬回来，伤在睚的手里，重伤垂死。他是肃政院的监察御史，平祟侯旧部。\n\n左乐随后搜查铸剑坊，把里面几十个江湖人带回军营，理由是封城期间聚众、私藏兵器、妨碍查案。武行的人说朝廷又把他们当贼办，军里的人说这些人本来就说不清来历。\n\n同一天，林雨霞拿一只袖标去试探尚蜀来的杜遥夜，想知道她站在哪一边。试探的结果是杜遥夜差点死在山道上。"
 yan_dly.7.a: "严惩立威，一个不放"
 yan_dly.7.b: "释放收编，人尽其用"
 yan_dly.7.c: "不复究，但一律逐出玉门"

# ------------------------------------------------------------------
# 8 仓库
# ------------------------------------------------------------------
 yan_dly.8.t: "演一场信使之死"
 yan_dly.8.d: "仓库的门是自己开的，孟铁衣在里面等着。他承认数据是他换的，信使队是他杀的，那场流寇劫杀从头到尾是他做的戏。他要把天灾引进玉门，理由是这座城上下离心，官不信民，民不信官，只有一场真天灾才能让所有人重新站到一起。\n\n杜遥夜当面骂了他，骂完转身就走。她走到巷口时追兵到了，孟铁衣回头替她挡了一刀，到死没有解释。林雨霞把真正的数据匣交到杜遥夜手里，说时代在往前走，但不该有人被抛下。陈晖洁赶到时，只看见一地的血，和一个抱着匣子站在巷口的姑娘。"
 yan_dly.8.a: "以烈士礼葬孟铁衣，不追其罪"
 yan_dly.8.b: "按律论罪，私引天灾不可恕"
 yan_dly.8.c: "不褒不贬，铸剑坊复为官办"

# ------------------------------------------------------------------
# 9 十合
# ------------------------------------------------------------------
 yan_dly.9.t: "第十合"
 yan_dly.9.d: "天灾来之前，重岳在城头演一场武，给全城壮胆，对手是医馆后院练拳的槐天裴。前九合重岳让着，第十合槐天裴拼了命，被一拳打飞，摔在城墙根下，又自己爬了起来。\n\n他抹掉嘴角的血，朝满城喊：你确实是天下第一，但我再练四十年，就能胜过你一拳。城头一时无人说话，过了一会儿鼓响了。太傅在城楼里看着，没有回头，只对左宣辽说：把剑托给他吧。"
 yan_dly.9.a: "重赏槐天裴，授「武典」编修"
 yan_dly.9.b: "命录武官把这场武记进典籍"
 yan_dly.9.c: "不赏，不过一场演武"

# ------------------------------------------------------------------
# 10 第十八声鼓
# ------------------------------------------------------------------
 yan_dly.10.t: "第十八声鼓"
 yan_dly.10.d: "钦天监算过，拆城避灾要半年，来不及。左宣辽在两个方案里选了升屏风卫、正面硬扛，修好要三个月，也要死人。他说，玉门是大炎的玉门，做的事都是为了保亿万百姓，不是只保这一城。\n\n令把十二名术师赶进内城，自己留在瓮城，以酒对高城，独自退了两次风暴。截云把「朔」还了回来，重岳这才发现她拔过那把剑，额上的玉石是介质，罪人几十年前就落下了这一子。重岳没有追，把剑托付给槐天裴，说等我再练四十年，再来找你。\n\n他把《武典》连同养生功法交给左宣辽。左宣辽亲自击鼓送行。第十八声鼓响时，玉门正在复航，四卫有两组报废，城中半数受损。睚拿到了它要的坐标，自己算了算，大限只剩两月。"
 yan_dly.10.a: "记全城之功，玉门一体叙赏"
 yan_dly.10.b: "剑归槐天裴，代理人一事不再提"
 yan_dly.10.c: "以此役为由，重议「不反」"
