l_simp_chinese:

# ==============================================================================
#  大炎 · 登临意（事件链 · 10 环）
#  · 原作 act23side，地点大炎北境移动城塞玉门，时间早春三月
#  · 视角：玉门归国途中，重岳要交出那把剑，朝廷要决定剑落在谁手里
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 满客栈
# ------------------------------------------------------------------
 yan_dly.1.t: "满客栈"
 yan_dly.1.d: "玉门和龙门因为一场天灾，紧急拆分了一次。拆分之后，滞留在玉门的人塞满了全城的客栈。\n\n茶馆里天天在吵一件事：《玉门风云》那出戏，演的是不是真的。\n\n有个人自称是宗师的亲传弟子，姓何，是个从萨尔贡来的游客。他说戏里那位宗师他见过。邻桌的人不信，两边差点掀了桌子。\n\n同一天，有个人挑着一担药从茶馆门口过。他叫槐天裴，是个医馆伙计，靠抵药钱在玉门待了三年。\n\n他不知道，他的女儿就在隔壁那桌坐着。\n\n两人隔着一面墙，谁也没看见谁。\n\n老鲤那天也在茶馆。他提了一句：三天后是那姑娘的生日。"
 yan_dly.1.a: "拨钱安顿滞留客，不许驱赶"
 yan_dly.1.b: "照例清城，滞留者限期离境"
 yan_dly.1.c: "借这批人手，充实北境民户"

# ------------------------------------------------------------------
# 2 擂台榜
# ------------------------------------------------------------------
 yan_dly.2.t: "名字要上第一页"
 yan_dly.2.d: "玉门城里立着一块擂台榜。\n\n榜分几页，越往上越难上。第一页只挂十个名字。\n\n一个年轻姑娘连赢了五场。她叫槐琥，龙门科大机械工程毕业，在鲤氏事务所做事，罗德岛的外勤干员。\n\n她不是为了赢。她是想让自己名字出现在第一页——那面榜贴在全城最显眼的地方，只要上了第一页，全城都看得见。\n\n包括她那个三年没跟她说过话的父亲。\n\n第五场上来的对手是个阿纳萨少女，叫截云。她来抢的不是名次，是名次第一名的奖品：一把剑。\n\n她要那把剑，是为了祭拜她的师父。\n\n这一场槐琥赢了。她捧着牌子站在榜下，看了很久，然后转身去找那个输了的少女。"
 yan_dly.2.a: "重赏擂台，广募天下武人"
 yan_dly.2.b: "擂台照旧，不另拨钱"
 yan_dly.2.c: "许擂台胜者入军籍，授职"

# ------------------------------------------------------------------
# 3 托剑
# ------------------------------------------------------------------
 yan_dly.3.t: "交给比武第一人"
 yan_dly.3.d: "重岳要交出一把剑。\n\n他是玉门的宗师，守这座城守了百年。那把剑叫「朔」，是他自己的一半——他弃了神性，把残魂封进剑里，才有了今天这个可以站在人堆里的人。\n\n现在他要走了，剑得留下。\n\n朝廷的意思原本是：交给「合适的局势」，也就是交给司岁台或者军中，看成色、看时局、看谁坐得稳。\n\n重岳不同意。他说，要交给比武第一人。\n\n太傅替他把这个意思转了上来。太傅的理由是：司岁台离那个罪人太近了——近到不能再近。他宁可让一个局外人接手。\n\n左宣辽听完，一句话没说，把手里的茶盏放下了。\n\n那一夜，魏彦吾也在座上。他是龙门总督，四十年前从百灶出逃的那个人。他看了重岳很久，最后只说了一句：你比我干脆。"
 yan_dly.3.a: "准重岳所请：剑归比武第一人"
 yan_dly.3.b: "剑归司岁台封存"
 yan_dly.3.c: "剑留军中，由左宣辽掌"

# ------------------------------------------------------------------
# 4 截杀
# ------------------------------------------------------------------
 yan_dly.4.t: "信使队"
 yan_dly.4.d: "城外的天灾信使队被灭了。\n\n十几个人，都是信使署的编制，尸体摆成被流寇劫杀的样子。做得不算糙，但也谈不上精细——有一条袖口，是被人反过来缝的。\n\n龙门特使林雨霞带着数据回城，路上又挨了一次。救下她的是铸剑坊的坊主孟铁衣，一锤把那伙人的刀砸断了。\n\n左宣辽当天就下了令。\n\n三日之内，追剑、缉凶、清山海众。玉门封城，减速，改航道。\n\n这道令是给他的儿子左乐去办的。左乐接了令，没有敬礼，转身就走了。\n\n外面的人不知道这道令意味着什么。城里的人知道：封城，就是把这半城滞留的人、几十家武行、和所有说不清来历的人，一起关在这座正在行驶的城塞里。"
 yan_dly.4.a: "准封城，全力缉凶"
 yan_dly.4.b: "不封城。查案归查案"
 yan_dly.4.c: "改航道避灾，暂缓追查"

# ------------------------------------------------------------------
# 5 桃花
# ------------------------------------------------------------------
 yan_dly.5.t: "满院桃花"
 yan_dly.5.d: "那一夜，魏彦吾的院子里开满了桃花。\n\n那不是季节。那是睚进来了。\n\n睚是巨兽，山海众奉它为首领。它裁错春秋，剪宇怀腹——它带来的地方，时间是乱的。\n\n重岳空手接了它一刀。四个人围上去，还是让它走了。\n\n混乱里出了一件事：那把「朔」，被截云盗走了。\n\n当夜重岳一个人站在空了的剑架前面，站了很久。他没有生气。他只是不太习惯，那个架子上空着的样子。\n\n另一边，有一个没有留下姓名的人找到了睚。\n\n他们谈了一个约定：两分之势，互不妨碍。"
 yan_dly.5.a: "通缉截云，追回「朔」"
 yan_dly.5.b: "放截云走。那把剑本就该由人拿"
 yan_dly.5.c: "全城戒备，以睚为首要之敌"

# ------------------------------------------------------------------
# 6 旧账
# ------------------------------------------------------------------
 yan_dly.6.t: "望烽节第二夜"
 yan_dly.6.d: "望烽节是玉门的三日节。三天里擂十七声鼓，记过去一年的劫难。\n\n第二夜，孟铁衣上了城楼。\n\n他来求一件事：准他出城，给二十年前死在外面的兄弟收尸。\n\n左宣辽拒了。理由很正当：封城期间，谁也不许出。\n\n孟铁衣没有闹。他站在城楼上，把二十年前的事讲了一遍。\n\n二十年前，山海众混进了城。出事之后，左宣辽改制，把武行一个个请出了行伍，铸剑坊也从官办变成了铁匠铺。孟铁衣的兄弟们，就是那一年死在城外的。他们的尸骨至今没有收回来。\n\n他说：镖局也好，物流也好，万变不离其宗，赌上的是人命，为的也是人命。\n\n他说完就下去了。左宣辽站在城楼上，一直站到鼓响。"
 yan_dly.6.a: "准其出城收尸，官给祭仪"
 yan_dly.6.b: "不准。封城之令不可自破"
 yan_dly.6.c: "召孟铁衣入军籍，旧事一概不问"

# ------------------------------------------------------------------
# 7 封坊
# ------------------------------------------------------------------
 yan_dly.7.t: "官民撕破脸"
 yan_dly.7.d: "太合暗查了三天，第四天被人抬了回来。\n\n是睚伤的，重伤垂死。他是肃政院的监察御史，平祟侯的旧部。\n\n左乐随后搜了铸剑坊。他把里面几十个江湖人，悉数带回了军营。\n\n理由很充分：封城期间聚众、私藏兵器、妨碍查案。\n\n事情就这么撕开了。武行的人说，朝廷又一次把他们当贼办。军里的人说，这些人在城里本来就说不清来历。\n\n同一天，林雨霞用一只袖标去试探杜遥夜——她想看看这个尚蜀来的姑娘是哪一边的。\n\n试探的结果是：杜遥夜差点死在山道上。"
 yan_dly.7.a: "严惩立威，一个不放"
 yan_dly.7.b: "释放收编。人尽其用"
 yan_dly.7.c: "不复究，但一律逐出玉门"

# ------------------------------------------------------------------
# 8 仓库
# ------------------------------------------------------------------
 yan_dly.8.t: "演一场信使之死"
 yan_dly.8.d: "仓库的门是自己开的。\n\n孟铁衣在里面等着。他承认了：数据是他换的，信使队是他演的，那场「流寇劫杀」从头到尾就是一出戏。\n\n他要把天灾引过来。\n\n他说，玉门这些年上下离心，官不信民，民不信官，铸剑坊的炉子凉了二十年。只有来一场真的天灾，这座城才会重新上下一心。\n\n杜遥夜当面痛骂他。骂完了，转身就走。\n\n她走到巷口的时候，追兵到了。孟铁衣回头去救她，替她挡了一刀。\n\n他到死都没解释自己。\n\n林雨霞把真正的数据匣交到杜遥夜手里。她说：时代在向前走，但是不该有人被抛下。\n\n那一夜陈晖洁也在玉门。她赶到的时候，只看见一地的血，和一个抱着匣子站在巷口的姑娘。"
 yan_dly.8.a: "以烈士礼葬孟铁衣，不追其罪"
 yan_dly.8.b: "按律论罪，私引天灾不可恕"
 yan_dly.8.c: "不褒不贬。铸剑坊复为官办"

# ------------------------------------------------------------------
# 9 十合
# ------------------------------------------------------------------
 yan_dly.9.t: "第十合"
 yan_dly.9.d: "天灾来之前，重岳要在城头演一场武。\n\n他要的是给全城壮胆。挑的对手是槐天裴——那个三年抵药钱、在医馆后院练拳的人。\n\n两人在城头站定。\n\n前九合，重岳让着。槐天裴看得出，全城的人也看得出。\n\n第十合，槐天裴拼了命。他被那一拳打飞出去，摔在城墙根下，然后自己爬了起来。\n\n他被打败了，但他赢了一拳。\n\n他抹了抹嘴角的血，冲着满城的人喊了一句话：\n\n你确实是天下第一。但我练了四十年，就能胜过你一拳。\n\n城头上没有人说话。过了一会儿，鼓响了。\n\n太傅和左宣辽在城楼里看着。太傅没有回头，只对左宣辽说了一句：把剑托给他吧。"
 yan_dly.9.a: "重赏槐天裴，授「武典」编修"
 yan_dly.9.b: "命录武官把这场武记进典籍"
 yan_dly.9.c: "不赏。演武而已"

# ------------------------------------------------------------------
# 10 第十八声鼓
# ------------------------------------------------------------------
 yan_dly.10.t: "第十八声鼓"
 yan_dly.10.d: "钦天监的人算完了：要拆城避灾，需半年。来不及。\n\n左宣辽把两个方案摆在桌上。第一是迁走半城百姓，放弃归国进度。第二是升屏风卫，正面硬扛——修好要三个月，要死人。\n\n他选了第二。\n\n他说：玉门是大炎的玉门。它做的所有事，都是为了保亿万大炎百姓平安。我们不是要保住这一城的安危。\n\n令把十二名术师全赶去了内城，自己留在瓮城，以酒对高城，独自退了两次风暴。\n\n截云把「朔」还了回来。重岳这才发现，她拔过那把剑——她额上的玉石是介质。罪人早在几十年前就落下了这一子。\n\n重岳没有追。他把剑托付给槐天裴，说：等我再练四十年，再来找你。\n\n又把《武典》连同养生功法一并交左宣辽。\n\n左宣辽亲自击鼓送行。\n\n第十八声鼓响起来的时候，玉门正在复航。四卫有两组报废，城中半数受损。\n\n而睚拿到了它要的坐标。它自己算了算，大限只剩两月。\n\n它要去找那位做个了结了。"
 yan_dly.10.a: "记全城之功，玉门一体叙赏"
 yan_dly.10.b: "剑归槐天裴，代理人一事不再提"
 yan_dly.10.c: "以此役为契机，重议「不反」"
