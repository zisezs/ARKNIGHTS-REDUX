 #人物特质
 VRN_A_lone_veteran: "孤军老将"

 #国家精神
 VRN_Lonely_at_sea: "碧波上的孤军"
 VRN_Lonely_at_sea_desc: "在联合进军以失败告终后，帝国军队各部也相继陷入混乱。很快，将领们对祖国的忠诚便随着指挥链一同瓦解，沦为了八大公爵的权力工具。而维多利亚皇家海军却是鲜有的例外——在乔伊·杰里克元帅“保全人员与舰艇”的命令下，停泊在帝国各大港口的舰队迅速返回圣维多利亚岛，让皇家海军得以免受诸位公爵的瓜分。\n但在笼罩帝国残躯的阴云之下，皇家海军正面临着更为严峻的考验。自从舰队联席会议决定成立圣维多利亚岛军管政府以来，缺乏合法性的政权就饱受民众的抗议乃至冲击；与本土的全面脱钩也加剧了当地经济情况的恶化，并使得大型舰艇的维护工作越发艰难。如今，皇家海军正被迫面临一个关乎其命运的抉择：加入内战中的一方换取补给，抑或在圣维多利亚岛上自噬而亡。"
 VRN_Where_the_soul_is: "灵魂所在"
 VRN_Where_the_soul_is_desc: " 维多利亚皇家海军一度是全泰拉最为强大的海上军事力量。严明的舰队军纪、不俗的军官素质与热忱的团队精神维持着皇家海军的灵魂所在——忠诚、智慧、勇气。即便维多利亚帝国已然分崩离析，这些优良传统也从未消逝。相反，现在正是它们在支撑着皇家海军的决心与斗志。"