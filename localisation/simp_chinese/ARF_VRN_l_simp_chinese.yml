 #人物
 VRN_Joey_Jerick: "乔伊·杰里克"
 VRN_Joey_Jerick_desc: "乔伊·杰里克可谓是维多利亚皇家海军的灵魂人物。他在十三岁那年便加入了海军，并于同一年遭遇了震惊全国的“阿斯兰”号撞船惨剧——他至今仍旧记得，当帝国引以为傲的旗舰被火光吞噬时，在他四周不断响起的一声又一声呼救与哀嚎。杰里克虽然奇迹般地幸免于难，但昔日的阴影却挥之不散。\n或许正是因为那段不堪回首的记忆，杰里克在往后的海军生涯中始终抱持着谨小慎微的指挥风格。当他作为第三海军大臣参与舰队现代化工程时，杰里克选择为每艘战舰多配备一台冗余水泵与一艘逃生艇；而当他亲率舰队在萨尔贡大坝海域激战时，杰里克则以周密计划部署始终维持着对运河海峡的全面封锁。\n数十年时光一晃而过，杰里克步步爬上了皇家海军总司令的高位。虽然文官政府对他颇有微词，但他麾下的诸位将领却仍衷心拥戴着这位声望崇高的舰队上将。时光缓慢而坚定地流逝，昔日意气风发的青年舰长已经老去。他静静地望着地平线处的浪潮翻覆，仿佛自己与一位普通的海边老人无异。\n魔族入侵与联合进军击碎了帝国的脆弱团结，也打破了杰里克的宁静生活。在一番天人交战过后，他再度戴上海军帽，挥舞着拐杖宣布“皇家海军绝不向任何公爵宣誓效忠！”，终究在秩序崩坏的乱世中保住了帝国舰队的人员与舰艇。然而，资源配给的捉襟见肘与八大公爵的软硬兼施却无时无刻不在动摇着将领们的意志。现在，杰里克眼前惟余一条笼罩在浓雾中的未定前路......"
