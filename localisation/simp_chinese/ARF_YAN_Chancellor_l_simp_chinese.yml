# ---- 国策描述 ----
YAN_chc_pact_root_desc:0 "真龙把「除岁」的诏书压在案底，另拟了一份：与岁同行。许祂借一副岁片的身子，短暂地坐一坐大炎的朝堂。"
YAN_chc_pact_throne_desc:0 "朝会照开，奏章照批。只是批红的字迹，偶尔不像人写的。"
YAN_chc_pact_return_desc:0 "期限到了。祂回陵里去，人间的事，人间自己办。"
YAN_chc_pact_energy_desc:0 "镇了千年的那股力气，被引去推百灶的行远之足。"
YAN_chc_pact_interest_desc:0 "千年沉疴一朝除，利息却要往后千年里慢慢还。"
YAN_chc_pact_people_desc:0 "生杀予夺仍归朝廷。祂若伸手，约便作废。"
YAN_chc_pact_seal_desc:0 "立过约的事，谁都不许往外说。史官照写，写别处。"
YAN_chc_domain_economy_desc:0 "田亩、商路与炉火：岁相为大炎的生计与百工谋一条长路。"
YAN_chc_domain_domestic_desc:0 "安民、定律、修史：让朝廷的规矩落到每一户人家。"
YAN_chc_domain_military_desc:0 "守土、制胜、度地：以岁相之长，重整大炎的兵备与疆防。"
YAN_chc_domain_diplomacy_desc:0 "医药、艺文、庖厨：以照拂与共席，重新连接大炎与天下。"
YAN_chc_zhongyue_chu_desc:0 "「朔」这个名字，还有那缕残魂，都一并封印在了那把剑里。玉门的人，只认得「宗师」。"
YAN_chc_zhongyue_zb_desc:0 "有的投身军伍，有的收起刀，安心过普通百姓的日子。"
YAN_chc_zhongyue_a3_desc:0 "很多人的家都在大炎别的地方，但他们依然守着这座城。"
YAN_chc_zhongyue_b3_desc:0 "等到人人都不需要习武来保护自己的那一天，才算是真正的太平日子。"
YAN_chc_zhongyue_c3_desc:0 "玉门作为炎国的屏障，戍守塞上。屏风卫作为玉门的屏障，四卫不倾，三风不度。"
YAN_chc_zhongyue_cri_desc:0 "莫在行事时，忘了最初的情和理。身在局中，手握决断权柄，亦是手握杀伐重器。"
YAN_chc_zhongyue_fin_desc:0 "宗师离任的日子快到了。剑托付给一个合适的人，他就不来告别了。"
YAN_chc_wang_chu_desc:0 "他把自己锁进古寺，说是精进棋艺，枯坐二十年。出寺那日，棋盘摆在寺外。"
YAN_chc_wang_zb_desc:0 "手伸到军需用度上的人，已经进了狱中候审。能不能活着出来，看他的运气。"
YAN_chc_wang_a3_desc:0 "排兵布阵，算无遗策——他自己算得最清楚的，是代价。"
YAN_chc_wang_b3_desc:0 "回到那副躯壳中去，杀死祂，成为祂——为这天下万千生灵谋一份「大利」。"
YAN_chc_wang_c3_desc:0 "替他们打破这一道枷锁，找到在这世间的位置——变成人。"
YAN_chc_wang_cri_desc:0 "余劝他不要怀着死志。他答：账已经平了，后面的路，我自己走。"
YAN_chc_wang_fin_desc:0 "他给自己算的是一条苦路：以身为牢，替岁受罚。与永世不得超生无异。"
YAN_chc_ling_chu_desc:0 "「朝廷的信啊……久违的事情了。」信压在酒壶下，人已经应了征。"
YAN_chc_ling_zb_desc:0 "山上挑夫的两顿茶不要钱，官府掏的。安民，就该安在这点琐事上。"
YAN_chc_ling_a3_desc:0 "「以大炎疆土为盘，以天下苍生为子。」这局里，总算看得见人。"
YAN_chc_ling_b3_desc:0 "「化为泡影破灭的，就不能是它吗?」不必打，梦醒它就散了。"
YAN_chc_ling_c3_desc:0 "「普天之下，皆为匹夫。」那天衙门里，挤满了没有门第的人。"
YAN_chc_ling_cri_desc:0 "「若无人能相制衡，那宁可不用你们。」她回：可你未免太看轻自己了。"
YAN_chc_ling_fin_desc:0 "「无所谓」说了许多年。如今她说：这一局，务必要赢，说完先买酒去。"
YAN_chc_jun_chu_desc:0 "《炎律》修毕，移住丹燕的行装未启，召书先到；她只道「有人约见了我，不得不赴约」。"
YAN_chc_jun_zb_desc:0 "律条重勘，从她自己的《炎律初理》勘起：当年落笔的每一句，都要重新对过出处。"
YAN_chc_jun_a3_desc:0 "新《炎律》颁下那天，无人鼓掌，也无人喊冤；卷末只注一行：移住丹燕未行。"
YAN_chc_jun_b3_desc:0 "她来只问是非曲直，「并没有打算替谁当说客」；旁人递来的话，一概挡回。"
YAN_chc_jun_c3_desc:0 "律法最好的结局，是摆在架上落灰；刑措不用，才算律成。"
YAN_chc_jun_cri_desc:0 "太尉死在殿上，那句「等待着您的裁断」终无人听见；卷宗上只落下两个字——待审。"
YAN_chc_jun_fin_desc:0 "她把书刀交还民间，只留一句：「大炎的历史，应该由它的子民亲自叙写」。"
YAN_chc_jie_chu_desc:0 "她身殒一百二十年，遗稿字迹已难辨认；太史阁重启，把散轶旧牒补成完璧。"
YAN_chc_jie_zb_desc:0 "丹燕报三千，工部要改百余；「除非真能证明资料的确出了错」，她一字不改。"
YAN_chc_jie_a3_desc:0 "表章、账册、口供，一式一档、一档一号；文牍归一，各说各话的余地就少了一分。"
YAN_chc_jie_b3_desc:0 "书刀藏在天镜阁顶楼，封印两把钥匙：监正与她二姐各持一把，少一人便取不出。"
YAN_chc_jie_c3_desc:0 "「经过她手的史册文章，只要她不愿意，便无人能够修改」——后来成了罪状里的一句。"
YAN_chc_jie_cri_desc:0 "真龙写下「今夜明月人尽望」，随手用她的书刀刮去那个「望」字——纸面洁白如初。"
YAN_chc_jie_fin_desc:0 "「这柄书刀，以后就由二姐代我保管」——她替二哥赴死，也知道自己不会被记录下来。"
YAN_chc_shu_chu_desc:0 "召书到的时候，她还在田里。起身赴召之前，她把今岁的种一担一担清点好。"
YAN_chc_shu_zb_desc:0 "定天时，规二十四节气，再把耕种的知识教给更多人。历法写在纸上，收成长在地里。"
YAN_chc_shu_a3_desc:0 "只靠地块上的粮食，喂不饱所有人。她要的是万顷良田，连偏远乡村也能吃上自己种的粮。"
YAN_chc_shu_b3_desc:0 "「只是把过去的经验记下来，告诉后来的人。」灾年过去总会有丰年，人们得靠自己扛。"
YAN_chc_shu_c3_desc:0 "田搬到移动地块上，用水用电都容易，再遇天灾，整片田开走便是。土地只是变了副模样。"
YAN_chc_shu_cri_desc:0 "坝塌了，上游的田要淹，下游的工期在催。她破例散了一次洪水，把它分成细流。"
YAN_chc_shu_fin_desc:0 "雨落下来，土地的皲裂褪尽，万物生长。城里再没人记得她，她已在江南的田里教人播种。"
YAN_chc_ji_chu_desc:0 "奉召入城，他先把账理了一遍。该还的还，该收的收——人到了，账才能动。"
YAN_chc_ji_zb_desc:0 "「契约一旦签下，该付的代价，可就半点都逃不了了。」画了押，才算数。"
YAN_chc_ji_a3_desc:0 "茶商老实纳税，官府省了事，他自己抽成——三赢的买卖，的确是难得的划算生意。"
YAN_chc_ji_b3_desc:0 "有利一起赚，风险却只由一边担着——这不是合算买卖。要做得长久，两方得背一样的险。"
YAN_chc_ji_c3_desc:0 "先生留下一句话：去看看这世上有没有能让普天下人共赢的大利。他说，我会去看看的。"
YAN_chc_ji_cri_desc:0 "为什么直到现在，炎国才决定除岁？他问：这件事里，有没有某些人自己的算盘？"
YAN_chc_ji_fin_desc:0 "「这账本，今天就算做平了。」半目胜负，生死之间——做平了，便不再多算。"
YAN_chc_yi_chu_desc:0 "进京那趟，他只背了一箱图籍。先摊图，再谈事。"
YAN_chc_yi_zb_desc:0 "山有多高，水有多深，他都要自己看一眼。看过了才画。"
YAN_chc_yi_a3_desc:0 "图画完的那天，工匠照着尺寸动手。靠猜的日子过去了。"
YAN_chc_yi_b3_desc:0 "仗要耗多少，账要赔多少，放在一张桌上算。赔得起的，就别打。"
YAN_chc_yi_c3_desc:0 "山记山，水记水，一笔一笔入籍。再出事，就不是天意了。"
YAN_chc_yi_cri_desc:0 "工期写在契上，雨不认契。是加急赶完，还是推倒重画。"
YAN_chc_yi_fin_desc:0 "界园最后的样子，他请别人的笔来记。图上不落自己的名字。"
YAN_chc_nian_chu_desc:0 "「杀红眼的野兽，是不能一直拴在笼子里的。」朝廷用十二楼五城，换她一回出手。"
YAN_chc_nian_zb_desc:0 "熔炼。浇铸。砥砺。三道工序逐家上册，铁就不再是私货。"
YAN_chc_nian_a3_desc:0 "「这座城市，拿来当冶炉正正好。」下料不分街坊，什么都往里炼。"
YAN_chc_nian_b3_desc:0 "小打小闹没意思了，她抬手把难度往上拨：「该提升一下难度了。」"
YAN_chc_nian_c3_desc:0 "「就命名为玄极巨兵吧。」用整城的物质与热量炼出的怪物，就是给国运的考卷。"
YAN_chc_nian_cri_desc:0 "「畏响动，畏火光。」巨响她不怕，爆竹声才让她想起那桩旧案。"
YAN_chc_nian_fin_desc:0 "「我是年，排行老九——是他姐姐。」十二人挤在同一炉火前，谁也不许先烧完。"
YAN_chc_fang_chu_desc:0 "他出了大炎地界，在萨尔贡收了学徒。学徒替他回了大炎，人没到，秤到了。"
YAN_chc_fang_zb_desc:0 "几钱几分，戥秤上不含糊。少一分不治病，多一分伤人。"
YAN_chc_fang_a3_desc:0 "尺寸、升斗、戥秤，六部与药铺只用一套。"
YAN_chc_fang_b3_desc:0 "驰道照走，只是每道关口多一道检。病不许搭车进城。"
YAN_chc_fang_c3_desc:0 "人也好，巨兽化身也罢，病了就是病人。秤上不分这一层。"
YAN_chc_fang_cri_desc:0 "席摆了几回，他没来。苦于疾病的人还多，他自己排在了后头。"
YAN_chc_fang_fin_desc:0 "他留在了大炎境内，归期没定。史册那一行，先空着。"
YAN_chc_xi_chu_desc:0 "香点上了，卷也开了。她只问一句：「失望了？」画卷里的江山，从不为了谁满意。"
YAN_chc_xi_zb_desc:0 "「有形无神，终究只是——」后半句她没说完，笔已经落下。"
YAN_chc_xi_a3_desc:0 "她给一镇人画了无灾无疫的太平。画中人睡得很稳，只是没人问过，笔在谁手里。"
YAN_chc_xi_b3_desc:0 "「也唯有不问世事，方能惬意。」她出山管事的规矩只有一条：别来扰我清静。"
YAN_chc_xi_c3_desc:0 "有人说她画地为牢。她懒得辩：「兵戈相见，最是无聊」，门关着，吵声也进不来。"
YAN_chc_xi_cri_desc:0 "百年不曾闭眼，不是逞强——她怕一梦醒来，自己就不复存在。"
YAN_chc_xi_fin_desc:0 "旧赌翻上台面，她认输。「就让我在近处，看看你究竟能做到哪一步。」"
YAN_chc_yu_chu_desc:0 "召书递到灶前时，他手底没停——面还得下完。这一趟出门，余味悠长。"
YAN_chc_yu_zb_desc:0 "门槛他偏要修得矮矮的，十几年不换。挡不住风也无妨——门槛筑高了，天下食客就不来了。"
YAN_chc_yu_a3_desc:0 "他管得了街坊四邻的灶火，管不了天下的粮价。养民之责，一半在店，一半在朝。"
YAN_chc_yu_b3_desc:0 "店里那一半他做得仔细；剩下的一半，天下人衣食无忧，只能请陛下多费心了。"
YAN_chc_yu_c3_desc:0 "该到的都到齐，该吵的照吵。他张罗的是那张桌子——总有一天会真正坐满。"
YAN_chc_yu_cri_desc:0 "梦醒后，他把油盐酱醋挨个尝了一遍，滋味没变，才笑出来：是人是兽，记不记得，也没差。"
YAN_chc_yu_fin_desc:0 "十二个人，一张桌子；梦里也好，梦醒也好，世上百味，到底还是团圆的味道最好。"
YAN_chc_domain_economy_end_desc:0 "田有岁、市有账、炉有火——三人在阁各安其位，府库与坊市终于连成了一条线。"
YAN_chc_domain_domestic_end_desc:0 "礼、律、史三者相济：人心有所依，律条有所据，史笔有所归。"
YAN_chc_domain_military_end_desc:0 "屏立塞上，算在帷幄，图在山川——大炎的兵备自此有了骨头。"
YAN_chc_domain_diplomacy_end_desc:0 "药到、画到、饭到——大炎重新坐回了那张桌子。"
YAN_chc_wangri_desc:0 "银杏挂果，百灶拆完——工部立下的军令状。二十年之期行至尽头，明日，便是望日。"
YAN_chc_crown_a_desc:0 "残阳熔金，穹宇震鸣。八域渐次分离，巨构辗转投下暗影——它们是行远之足，更是立命根基。"
YAN_chc_crown_b_desc:0 "山水，长街，烟火，弦歌；锻坊，百谷，宰府，兵革。八域不散，九州同举——然此番分离，前路未卜。"

# ---- 精神 ----
YAN_chc_dom_economy:0 "岁相在阁·经世济民（黍·绩·年）"
YAN_chc_dom_economy_desc:0 "黍司农、绩司贾、年司工——三人在阁，田亩、账目与炉火便都有了着落。"
YAN_chc_dom_domestic:0 "岁相在阁·朝纲有序（令·均·颉）"
YAN_chc_dom_domestic_desc:0 "令司礼、均司律、颉司史——安民、定律、修史，朝廷的规矩这才落到每一户人家。"
YAN_chc_dom_military:0 "岁相在阁·兵略筹谋（重岳·望·易）"
YAN_chc_dom_military_desc:0 "重岳守土、望司暗、易司博——玉门的屏、十九道的算、山川的图，一并压在兵备上。"
YAN_chc_dom_diplomacy:0 "岁相在阁·四海往来（方·夕·余）"
YAN_chc_dom_diplomacy_desc:0 "方司医、夕司艺、余司膳——戥秤、画卷与灶火，重新把大炎与天下连在一处。"
YAN_chc_dom_economy_end:0 "岁相在阁·经世济民·百工丰饶"
YAN_chc_dom_economy_end_desc:0 "百工丰饶：经世济民三人在阁，各尽所长——田有岁、市有账、炉有火——三人在阁各安其位，府库与坊市终于连成了一条线。"
YAN_chc_dom_domestic_end:0 "岁相在阁·朝纲有序·纲纪肃然"
YAN_chc_dom_domestic_end_desc:0 "纲纪肃然：朝纲有序三人在阁，各尽所长——礼、律、史三者相济：人心有所依，律条有所据，史笔有所归。"
YAN_chc_dom_military_end:0 "岁相在阁·兵略筹谋·长城永固"
YAN_chc_dom_military_end_desc:0 "长城永固：兵略筹谋三人在阁，各尽所长——屏立塞上，算在帷幄，图在山川——大炎的兵备自此有了骨头。"
YAN_chc_dom_diplomacy_end:0 "岁相在阁·四海往来·四海同席"
YAN_chc_dom_diplomacy_end_desc:0 "四海同席：四海往来三人在阁，各尽所长——药到、画到、饭到——大炎重新坐回了那张桌子。"
YAN_chc_dream_crown:0 "八域不散"
YAN_chc_dream_crown_desc:0 "百灶拆分为移动城市，八域各安其位——这一场荒唐梦，最后落成了九州同举。"
YAN_sui_pact_reign:0 "岁片临朝"
YAN_sui_pact_reign_desc:0 "真龙与岁的交易在朝堂上兑现：祂借一副岁片的身子坐着那把椅子。朝会照开，奏章照批——但人间的规矩，仍是人间的规矩。"

