l_simp_chinese:

# ==============================================================================
#  大炎 · 洪炉示岁（事件链 · 10 环）
#  · 原作 act6d5，地点龙门，时间年关
#  · 视角：属国急报送进百京，玩家以朝廷身份拍板
#  · 文风照原作与 [[ARF_YNW_Upheaval]]：白描、短句、克制
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 年关
# ------------------------------------------------------------------
 yan_honglu.1.t: "龙门的年关"
 yan_honglu.1.d: "除夕深夜十一点一刻，龙门边防指挥中心的灯没有一盏是熄的。\n\n魏遵武下的令，写进公文只有四个字：全城守岁。可这四个字调到的是最高戒备——庙街封了，下城区的灯牌一块一块暗下去，近卫局全员在岗。\n\n新来的雪雉抱着一摞报告在走廊里迷了路。她刚从哥伦比亚回来，不知道龙门人在这一夜怕什么，也没人肯跟她说。\n\n罗德岛的舰船申请停泊，理由栏里也只有两个字：守岁。\n\n陈晖洁在防线上站了一整夜，没有收到任何异常报告。\n\n这才是最不对的地方。按司岁台的旧档，年关前后，总会有点什么。"
 yan_honglu.1.a: "命魏遵武如实呈报，一个字也不许粉饰"
 yan_honglu.1.b: "由它去。龙门的事，龙门自己了"
 yan_honglu.1.c: "令司岁台遣秉烛人南下"

# ------------------------------------------------------------------
# 2 巨洞
# ------------------------------------------------------------------
 yan_honglu.2.t: "庙街外的巨洞"
 yan_honglu.2.d: "近卫局的卷宗上写着：成因不明。\n\n那是一个巨洞，边缘的建筑呈熔化状，焦痕铺出去几百米，焦痕上没有脚印，也没有尸首。卷宗送到陈晖洁案头时已经压了两天——按规矩，这种案子要往上递，往上递就要写明「疑似何物」，而没人敢写。\n\n消息还是漏了。\n\n龙门公园，陈晖洁拦下要去庙街过年的鬼姐一伙。两边拼了一场酒。鬼姐输了，输得干脆，却在放下碗的时候笑着说了一句：听说你们找到了它。\n\n陈晖洁没有否认。\n\n第二天，庙街外围已经站满了看热闹的人。他们不是来闹事的，他们只是想知道，自己住的这座城，去年关到底在怕什么。"
 yan_honglu.2.a: "着近卫局公开巨洞勘查记录"
 yan_honglu.2.b: "封锁消息，追查泄密者"
 yan_honglu.2.c: "承认旧档所载，张榜告谕龙门全城"

# ------------------------------------------------------------------
# 3 升温
# ------------------------------------------------------------------
 yan_honglu.3.t: "入夜反常升温"
 yan_honglu.3.d: "退休的林警员和魏先生在街角下棋。下到一半，魏先生把棋子放下了，说：不对。\n\n入夜了，天却在升温。空气里有一股焦味，很淡，像很远的地方在烧铁。\n\n同一夜，阿米娅带着博士抵龙门，说是来「守岁」。她在指挥中心讲了一个传说：每至年关，有一物来，来则城破。各城邦的旧档都记着这件事，可记载互相对不上——有的说它在雪里，有的说它在火里，有的说它根本不来，只是人自己怕。\n\n博士听完问了一句：那这次是哪一种。\n\n没有人答。\n\n罗德岛方面的意思是，他们手上有专门的档案，也有专门为此培养的人。他们愿意交出来。\n\n条件是，朝廷要认这件事是真的。"
 yan_honglu.3.a: "调司岁台旧档与罗德岛档案对勘"
 yan_honglu.3.b: "驳斥。年关之说出自乡野，不足为凭"
 yan_honglu.3.c: "认下来，并请罗德岛的人入龙门协防"

# ------------------------------------------------------------------
# 4 兵俑
# ------------------------------------------------------------------
 yan_honglu.4.t: "兵俑"
 yan_honglu.4.d: "它们是天亮前进城的。\n\n带着整合运动的标志，队列整齐，可是探测仪上什么都没有——无源石反应，无感染体征，无体温。它们不是感染者，它们甚至不是活的。\n\n魏遵武只看了一眼照片，就说了两个字：兵俑。\n\n近卫局的人不明白这个词的份量。魏遵武明白。他下令疏散庙街与下城区，其余各处按兵封锁，不许出击。\n\n因为它们顶着死者的脸。\n\n有人认出了自己的儿子。有人认出了十年前塌方里没找回来的工友。它们很脆，一枪就散，散了又在街角重新聚起来。无穷无尽。\n\n陈晖洁后来说，那一夜最难的不是打，是让你的兵相信，对面那张脸不是人。"
 yan_honglu.4.a: "严令：见即击，不得近前辨认"
 yan_honglu.4.b: "先疏散，后合围，不急于一战"
 yan_honglu.4.c: "调禁军南下，以重兵碾过封锁区"

# ------------------------------------------------------------------
# 5 反向检索
# ------------------------------------------------------------------
 yan_honglu.5.t: "反向检索"
 yan_honglu.5.d: "热源找不到。\n\n年在这座城里，可是这座城所有的仪器都看不见它。源石技艺测不到，红外测不到，连狗都闻不出方向。它像一滴落进江里的墨。\n\n提议来自工程部的新人。雪雉说：既然找不到它，就把整座城点亮，然后看哪里是黑的。\n\n把龙门全城的源石器械同时过载，每一台都在尖叫，每一处都亮——只有一处不会有反应，因为那里站着的东西不属于这套体系。\n\n代价是数千万的损失，和半个城瘫痪一夜。\n\n魏遵武批了。\n\n热源锁定的同一刻，四号城区的防线被突破。"
 yan_honglu.5.a: "准。全城过载，钱由朝廷出"
 yan_honglu.5.a.tt: "龙门全城源石器械过载一夜，工业区瘫痪，损失由国库核销。\n热源坐标锁定，司岁台据此重排年关警戒等级。"
 yan_honglu.5.b: "不准。为一物之影毁半城之产，不值"
 yan_honglu.5.c: "只过载军用与官署器械，民产不动"

# ------------------------------------------------------------------
# 6 老林
# ------------------------------------------------------------------
 yan_honglu.6.t: "顺手扔进垃圾箱"
 yan_honglu.6.d: "封锁区漏了。\n\n一队兵俑从三号巷道窜出去，值守的年轻人追了两步，回头找电话的时候，它们已经不见了。\n\n半个时辰后，指挥中心的电话响了。是退休的林警员。他说，那几个东西跑到他家楼下了，他顺手扔进了垃圾箱，问还能不能再上阵。\n\n魏遵武握着话筒沉默了很久，最后说：您歇着。\n\n挂了电话，他下令全线反击。\n\n那一夜的龙门街头，还有另外一些人。槐琥拎着一根棍子从巷子这头打到那头；地下怪医把铺子门板卸下来当担架；吽站在事务所门口，一步没退，因为他身后是伤员。\n\n他们谁也没有编制。\n\n战后统计的时候，这部分人不知道该记在哪一栏。"
 yan_honglu.6.a: "另立一栏：编「龙门义勇」，一体叙功"
 yan_honglu.6.b: "照旧。无编制者不叙功，以免开例"
 yan_honglu.6.c: "发抚恤，不入册——记名而不授职"

# ------------------------------------------------------------------
# 7 炎熔对年
# ------------------------------------------------------------------
 yan_honglu.7.t: "夕到底告诉了人类多少"
 yan_honglu.7.d: "炎熔是追着热源去的，一个人。\n\n罗德岛的人后来解释：她是为此被培养出来的。从她还是个小姑娘的时候起，她学的每一门课都指向同一个目标——狩猎年这一族。\n\n她站到它面前的时候，它正在看这座城。\n\n炎熔念了一段真言。「群石之将，魂魄为萁。」\n\n那是很古老的东西，古到不属于人类的语言体系。年停住了。它回过头，第一次认真看她。\n\n然后它说了一句让所有人都没想到的话：\n\n夕到底告诉了人类多少？\n\n炎熔没有回答。她的任务报告里这一段是空白的，只在末尾写了一句：目标具备可交流人格，且对我方言说有识别反应。建议重新评估「夕」的立场。\n\n司岁台的档房里，夕的名字下面有一行很小的字：代理人，未定。"
 yan_honglu.7.a: "立即提审夕，查其与炎熔之间的所有往来"
 yan_honglu.7.b: "不动夕。它若肯说话，就是可以说话的人"
 yan_honglu.7.c: "压下这份报告，不入档"

# ------------------------------------------------------------------
# 8 洪炉
# ------------------------------------------------------------------
 yan_honglu.8.t: "熔炼。浇铸。砥砺。"
 yan_honglu.8.d: "它开始把这座城当炉子用。\n\n「天有洪炉，地生五金，晖冶寒淬照云清。」\n\n那不是喊出来的，那是整座城在响。钢梁在弯，路面在软，二十一号城区的轮廓线在三天里变了两次形状。年的兵俑不再是脆的了——它们开始有甲，有刃，有会施术的感染者人偶。\n\n第三日，近卫局失去二十一号城区。\n\n陈晖洁和阿米娅站在郊区的土坡上往回看。她们看见自己出生的那片街区，如今是一块烧红的铁。\n\n阿米娅问：还救吗。\n\n陈晖洁说：救。\n\n她没有说怎么救。她只是把望远镜放下了，然后开始点名——点那些还活着的、还能站着的人的名字。\n\n墓碑上刻下的每一笔都做不得假。这是她父亲教她的。"
 yan_honglu.8.a: "令龙门死守，朝廷调兵增援"
 yan_honglu.8.b: "准龙门弃守二十一号城区，全力保人"
 yan_honglu.8.c: "以此为契机，重议「不反」"

# ------------------------------------------------------------------
# 9 爆竹
# ------------------------------------------------------------------
 yan_honglu.9.t: "畏响动，畏火光"
 yan_honglu.9.d: "炎熔回来报了一件事，报得很没底气。\n\n她说，年怕爆竹。\n\n不是比喻。是字面意义上的怕——畏响动，畏火光。年关时满城炸响的那些红纸卷，对它来说是实打实的伤害。\n\n指挥中心里没有人笑。因为如果这是真的，那么这座城每年冬天在做的这件民俗小事，就不是民俗，是防御工事。\n\n炎熔还有第二个判断：它怕的不是爆竹，它怕的是爆竹所代表的东西。她怀疑那恐惧来自年自身投影出的某种存在——某种比年更老、且与年同源的东西。\n\n换句话说，年是怕它自己那一族的什么。\n\n第三个情报：年持剑与盾。盾碎了会再生。\n\n这份报告在司岁台压了一夜。第二天早上，天经阁那边来人说，书刀的记载里有一页，讲的正是「以火驱岁」。"
 yan_honglu.9.a: "全城征购爆竹火药，配发各防线"
 yan_honglu.9.b: "只在小范围试用，不惊动它"
 yan_honglu.9.c: "扣下这一条。年若可伤，则可谈判"

# ------------------------------------------------------------------
# 10 玄极
# ------------------------------------------------------------------
 yan_honglu.10.t: "玄极"
 yan_honglu.10.d: "计划是雪雉和炎熔一起定的：把护城炮的源石内核拆出来，当一支巨型二踢脚。\n\n炎熔负责把年引到核心那里去。然后她会摊牌——陷阱是内核，加上她自己压缩空间的那一次爆炸。年要么同归于尽，要么受伤。\n\n倒数到一的时候，年伸手把她推开了。\n\n爆炸之后，年坐在废墟里，说龙门的花椒不够味儿，然后说：我投降。\n\n它的身体就那么消失了。用爆热造的假象。\n\n等它再现身，整座龙门已经被炼成了一具玄极巨兵。它站在自己的城上面，问人类：你们能遏制它吗。\n\n后来的事，罗德岛的内部档案写得很含糊。只有一句被划掉又写回来的批注：年长驻本舰。\n\n它没有被消灭。它只是暂时不玩了。\n\n而在那份档案的最后一页，另一个「同胞」留了一行字：该熄灭大地的火种了。"
 yan_honglu.10.a: "记功、抚恤、重建。龙门这一页翻过去"
 yan_honglu.10.b: "默许年长驻罗德岛，以「代理人」名义在册"
 yan_honglu.10.c: "把玄极巨兵的图纸收进天经阁——那是兵器"

# ---------------- 收尾精神 ----------------
 yan_honglu_aftermath: "洪炉余烬"
 yan_honglu_aftermath_desc: "二十一号城区在年关之后重建了两年。新的路面下面还压着旧的路面，旧的下面还有。龙门人不再提那一夜，只在每年除夕把爆竹炸得比别处响三倍。\n\n司岁台为此立了一条新规：年关前后，全城源石器械强制降载，各城邦一体遵行。这条规定在公文里叫「洪炉条令」，在民间叫「别让那东西又拿我们的城当炉子」。\n\n玄极巨兵的残件被封存在龙门的地下工事里，编号、上锁、每年清点。清点的人换了三任，谁也没敢动。"
 yan_honglu_pact: "与年立约"
 yan_honglu_pact_desc: "朝廷最终没有把年列为讨伐对象。\n\n它长驻罗德岛，名义上是「代理人」，实际上谁也管不住它。它向那些对人类不敌意的同胞推销罗德岛，推销得很热情，成功率不明。\n\n司岁台的档房里，夕的名字下面那行小字被改成了：代理人，在册。年、夕、令三人的档案被并到同一个卷宗里，卷宗的封皮上写着「岁之分身」，下面另起一行，是椿的笔迹：\n\n它们不是敌人。它们只是还没决定要不要当敌人。\n\n炎熔后来长成了一个能独当一面的干员。年对此表示欣慰，并且拒绝解释自己为什么会欣慰。"
