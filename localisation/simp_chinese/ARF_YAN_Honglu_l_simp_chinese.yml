l_simp_chinese:

# ==============================================================================
#  大炎 · 洪炉示岁（事件链 · 10 环）
#  · 原作 act6d5，地点龙门，时间年关
#  · 视角：属国急报送进百京，玩家以朝廷身份拍板
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
#  · 收尾精神文案在 ARF_YAN_Sidestory_Outcomes_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 年关
# ------------------------------------------------------------------
 yan_honglu.1.t: "龙门的年关"
 yan_honglu.1.d: "除夕深夜十一点一刻，龙门边防指挥中心的灯没有一盏熄。炎武下的令写进公文只有四个字：全城守岁，实际调动的是最高戒备。庙街封了，下城区的灯牌一块块暗下去，近卫局全员在岗。\n\n新来的雪雉抱着一摞报告在走廊里迷了路。她刚从哥伦比亚回来，不知道龙门人在这一夜怕什么，也没人肯告诉她。罗德岛的舰船申请停泊，理由栏里同样是那两个字。\n\n陈晖洁在防线上站了一整夜，没有收到任何异常报告。按司岁台的旧档，年关前后总会出点事，今年却安静得反常。"
 yan_honglu.1.a: "命炎武如实呈报，一个字也不许粉饰"
 yan_honglu.1.b: "由龙门自行处置，朝廷不问"
 yan_honglu.1.c: "令司岁台遣秉烛人南下"

# ------------------------------------------------------------------
# 2 巨洞
# ------------------------------------------------------------------
 yan_honglu.2.t: "庙街外的巨洞"
 yan_honglu.2.d: "近卫局的卷宗上写着成因不明。巨洞边缘的建筑呈熔化状，焦痕铺出去几百米，上面没有脚印，也没有尸首。卷宗送到陈晖洁案头时已经压了两天，按规矩要往上递，递上去就得写明疑似何物，而没人敢写。\n\n消息还是漏了。陈晖洁在龙门公园拦下要去庙街过年的鬼姐一伙，两边拼了一场酒。鬼姐输了，放下碗时笑着说了一句：听说你们找到了它。陈晖洁没有否认。\n\n第二天，庙街外围站满了看热闹的人。他们没打算闹事，只想知道自己住的这座城，去年关到底在怕什么。"
 yan_honglu.2.a: "着近卫局公开巨洞勘查记录"
 yan_honglu.2.b: "封锁消息，追查泄密者"
 yan_honglu.2.c: "承认旧档所载，张榜告谕全城"

# ------------------------------------------------------------------
# 3 升温
# ------------------------------------------------------------------
 yan_honglu.3.t: "入夜反常升温"
 yan_honglu.3.d: "退休的林警员和魏先生在街角下棋。下到一半，魏先生把棋子放下，说不对。入夜了，天却在升温，空气里有一股很淡的焦味，像很远的地方在烧铁。\n\n同一夜，阿米娅带着博士抵达龙门，说是来守岁。她在指挥中心讲了一个传说：每到年关，有一物来，来则城破。各城邦的旧档都记着这件事，可记载彼此对不上，有的说它在雪里，有的说它在火里，有的说它根本不来，只是人自己怕。博士问这次是哪一种，没有人答。\n\n罗德岛表示手上有专门的档案，也有为此培养的人，愿意交出来，条件是朝廷要认这件事是真的。"
 yan_honglu.3.a: "调司岁台旧档与罗德岛档案对勘"
 yan_honglu.3.b: "驳斥，年关之说不足为凭"
 yan_honglu.3.c: "认下来，并请罗德岛的人入龙门协防"

# ------------------------------------------------------------------
# 4 兵俑
# ------------------------------------------------------------------
 yan_honglu.4.t: "兵俑"
 yan_honglu.4.d: "它们在天亮前进城，带着整合运动的标志，队列整齐。探测仪上没有源石反应，没有感染体征，也没有体温，这些东西既不像感染者，也不像活人。\n\n炎武只看了一眼照片，就说出两个字：兵俑。他下令疏散庙街与下城区，其余各处按兵封锁，不许出击。兵俑顶着死者的脸，有人认出了自己的儿子，有人认出了十年前塌方里没找回来的工友。它们很脆，一枪就散，散了又在街角重新聚起来，没有尽头。\n\n陈晖洁后来说，那一夜最难办的事，是让士兵相信对面那张脸不是人。"
 yan_honglu.4.a: "严令：见即击，不得近前辨认"
 yan_honglu.4.b: "先疏散，后合围，不急于一战"
 yan_honglu.4.c: "调禁军南下，以重兵碾过封锁区"

# ------------------------------------------------------------------
# 5 反向检索
# ------------------------------------------------------------------
 yan_honglu.5.t: "反向检索"
 yan_honglu.5.d: "热源找不到。年在这座城里，可城里所有仪器都看不见它。源石技艺测不到，红外测不到，连狗都闻不出方向。\n\n提议来自工程部的新人雪雉：既然找不到它，就把整座城点亮，看哪里是黑的。把龙门全城的源石器械同时过载，每一台都在尖叫，每一处都亮，只有一处不会有反应，因为那里站着的东西不属于这套体系。代价是数千万的损失和半座城瘫痪一夜。\n\n炎武批了。热源锁定的同一刻，四号城区的防线被突破。"
 yan_honglu.5.a: "准。全城过载，钱由朝廷出"
 yan_honglu.5.a.tt: "龙门全城源石器械过载一夜，工业区瘫痪，损失由国库核销。\n热源坐标锁定，司岁台据此重排年关警戒等级。"
 yan_honglu.5.b: "不准，不值得为一道影子毁半城"
 yan_honglu.5.c: "只过载军用与官署器械，民产不动"

# ------------------------------------------------------------------
# 6 老林
# ------------------------------------------------------------------
 yan_honglu.6.t: "顺手扔进垃圾箱"
 yan_honglu.6.d: "封锁区漏了。一队兵俑从三号巷道窜出去，值守的年轻人追了两步，回头找电话时已经不见了。半个时辰后，指挥中心的电话响了，是退休的林警员。他说那几个东西跑到他家楼下，他顺手扔进了垃圾箱，问还能不能再上阵。炎武握着话筒沉默了很久，说：您歇着。\n\n挂了电话，他下令全线反击。那一夜的龙门街头还有另外一些人：槐琥拎着棍子从巷子这头打到那头，地下怪医把铺子门板卸下来当担架，吽站在事务所门口一步没退，因为身后是伤员。他们谁也没有编制，战后统计时不知道该记在哪一栏。"
 yan_honglu.6.a: "另立一栏：编「龙门义勇」，一体叙功"
 yan_honglu.6.b: "照旧。无编制者不叙功，以免开例"
 yan_honglu.6.c: "发抚恤，记名而不授职"

# ------------------------------------------------------------------
# 7 炎熔对年
# ------------------------------------------------------------------
 yan_honglu.7.t: "夕到底告诉了人类多少"
 yan_honglu.7.d: "炎熔是追着热源去的，一个人。罗德岛后来解释，她从小受的训练就指向同一个目标：狩猎年这一族。\n\n她站到它面前时，它正在看这座城。炎熔念了一段真言：「群石之将，魂魄为萁。」那是很古老的东西，古到不属于人类的语言体系。年停住了，回头第一次认真看她，然后说了一句让所有人意外的话：夕到底告诉了人类多少？\n\n炎熔没有回答。她的任务报告里这一段是空白，只在末尾写：目标具备可交流人格，且对我方言说有识别反应，建议重新评估「夕」的立场。司岁台的档房里，夕的名字下面有一行很小的字：代理人，未定。"
 yan_honglu.7.a: "立即提审夕，查其与炎熔之间的所有往来"
 yan_honglu.7.b: "不动夕，看它是否肯开口"
 yan_honglu.7.c: "压下这份报告，不入档"

# ------------------------------------------------------------------
# 8 洪炉
# ------------------------------------------------------------------
 yan_honglu.8.t: "洪炉"
 yan_honglu.8.d: "它开始把这座城当炉子用。「天有洪炉，地生五金，晖冶寒淬照云清。」那句话没有谁喊出口，整座城都在响。钢梁在弯，路面在软，二十一号城区的轮廓线三天里变了两次形状。年的兵俑不再脆，开始有甲、有刃，也有会施术的感染者人偶。\n\n第三日，近卫局失去二十一号城区。陈晖洁和阿米娅站在郊区的土坡上往回看，她们出生的那片街区已经是一块烧红的铁。阿米娅问还救吗，陈晖洁说救，然后把望远镜放下，开始点那些还活着、还能站着的人的名字。墓碑上刻的每一笔都做不得假，这是她父亲教她的。"
 yan_honglu.8.a: "令龙门死守，朝廷调兵增援"
 yan_honglu.8.b: "准龙门弃守二十一号城区，全力保人"
 yan_honglu.8.c: "以此为由，重议「不反」"

# ------------------------------------------------------------------
# 9 爆竹
# ------------------------------------------------------------------
 yan_honglu.9.t: "畏响动，畏火光"
 yan_honglu.9.d: "炎熔回来报了一件事，报得很没底气：年怕爆竹。她说的是字面意思：年畏响动，畏火光。年关满城炸响的红纸卷对它来说是实打实的伤害。\n\n指挥中心里没有人笑，因为如果这是真的，这座城每年冬天做的就不再是民俗，而是防御工事。炎熔还有第二个判断：它怕的可能是爆竹代表的东西，那恐惧来自年自身投影出的某种存在，某种比年更老、与年同源的东西。第三个情报是年持剑与盾，盾碎了会再生。\n\n这份报告在司岁台压了一夜。第二天早上，天经阁来人说，书刀的记载里有一页讲的正是「以火驱岁」。"
 yan_honglu.9.a: "全城征购爆竹火药，配发各防线"
 yan_honglu.9.b: "只在小范围试用，不惊动它"
 yan_honglu.9.c: "扣下这一条，年若可伤便可谈"

# ------------------------------------------------------------------
# 10 玄极
# ------------------------------------------------------------------
 yan_honglu.10.t: "玄极"
 yan_honglu.10.d: "计划是雪雉和炎熔一起定的：拆下护城炮的源石内核，当一支巨型二踢脚。炎熔负责把年引到内核那里，然后摊牌，陷阱是内核加上她自己压缩空间的那一次爆炸。年要么同归于尽，要么受伤。\n\n倒数到一的时候，年伸手把她推开了。爆炸之后，年坐在废墟里说龙门的花椒不够味，然后说我投降。它的身体消失了，用爆热造的假象。等它再出现，整座龙门已经被炼成一具玄极巨兵。它站在自己的城上面，问人类：你们能遏制它吗。\n\n罗德岛的内部档案对后来的事写得很含糊，只有一句被划掉又写回来的批注：年长驻本舰。它没有被消灭，只是暂时不玩了。档案最后一页，另一个同胞留了一行字：该熄灭大地的火种了。"
 yan_honglu.10.a: "记功、抚恤、重建，龙门善后"
 yan_honglu.10.b: "默许年长驻罗德岛，以「代理人」名义在册"
 yan_honglu.10.c: "把玄极巨兵图纸收进天经阁"
