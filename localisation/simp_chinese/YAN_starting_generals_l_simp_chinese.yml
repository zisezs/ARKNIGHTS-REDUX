l_simp_chinese:
# ============================================================
#  大炎 · 开局将领（不含岁家十二代理人）  2026-10-26
# ============================================================

# —— 新将领姓名 ——
YAN_Taihe:0 "太合"
YAN_Lin_Qingyan:0 "麟青砚"
YAN_Qiubai:0 "仇白"
YAN_Yun_Qingping:0 "云青萍"
YAN_Xingxiong:0 "星熊"
YAN_Zheng_Qingyue:0 "郑清钺"
YAN_Jieyun:0 "截云"

# —— 新将领小传 ——
YAN_Taihe_desc:0 "肃政院副监察御史，左宣辽旧部。早年在玉门军中掌军纪，伤了一条腿，仍旧随军北上。"
YAN_Lin_Qingyan_desc:0 "大理寺少卿出身，因查太师案辞官，后归天师府。雷法落处，卷宗与敌阵一样焦黑。"
YAN_Qiubai_desc:0 "重岳弟子，姜齐剑客。曾护送一个冒名的少年穿过西北山道，三次把他从死人堆里捞回来。"
YAN_Yun_Qingping_desc:0 "重岳录武官，《武典》执笔。不会武功，却能把一支军队该走的章法一行一行写清楚。"
YAN_Xingxiong_desc:0 "龙门近卫局干员，下城区执勤多年。盾比人先到，人比盾后走。"
YAN_Zheng_Qingyue_desc:0 "行裕镖局总镖头，人称「问霜客」。十年前走镖失货，镖局没倒，他也没倒。"
YAN_Jieyun_desc:0 "阿纳萨弓手，游走大漠。话很少，箭很多。"

# —— 已有顾问角色的将领小传 ——
YAN_Zuo_Xuanliao_general_desc:0 "平祟侯，玉门守将。守城数十年，屏风卫的每一道接缝他都亲手验过。"
YAN_Wei_Yanwu_general_desc:0 "炎武，龙门总督。赤霄剑法与时局一样，都不肯给人留退路。"
YAN_Chen_Huijie_general_desc:0 "龙门近卫局前高级警司。赤霄剑法，天喟之剑；她拔剑时，通常已经想好了收剑之后要说的话。"
YAN_Lao_Tianshi_general_desc:0 "天师府祖师，坐镇北境四百年。火法疯癫，但没人敢说她算错了天时。"
YAN_Zuo_Le_general_desc:0 "司岁台秉烛人，平祟侯之子。查案，也查山海的踪迹。"

# —— 专属特质 ——
YAN_gl_pingfeng:0 "四卫不倾"
YAN_gl_pingfeng_desc:0 "四卫不倾，三风不度。他在玉门城头站了太多年，知道哪一段墙会先塌。"
YAN_gl_chixiao:0 "赤霄照夜"
YAN_gl_chixiao_desc:0 "赤霄出鞘时，龙门的风会先静下来。"
YAN_gl_tiebi:0 "铁面整军"
YAN_gl_tiebi_desc:0 "军纪不是写在纸上的，是走在队列里的。"
YAN_gl_tiankui:0 "天喟之剑"
YAN_gl_tiankui_desc:0 "她的剑比话快，收剑时通常已经不必再说。"
YAN_gl_leifa:0 "惊蛰雷动"
YAN_gl_leifa_desc:0 "雷落之前，天师府先听见她的脚步声。"
YAN_gl_jianxin:0 "剑心通明"
YAN_gl_jianxin_desc:0 "剑客的心里不能有第二件事。"
YAN_gl_wudian:0 "武典在握"
YAN_gl_wudian_desc:0 "他不提刀，但每一支军队都想让他站在自己这边。"
YAN_gl_longmen_dun:0 "龙门之盾"
YAN_gl_longmen_dun_desc:0 "下城区的夜路她走了很多年，没人能绕过她。"
YAN_gl_beiming:0 "北境薪火"
YAN_gl_beiming_desc:0 "北境的风雪换了四百年，她的火还没灭。"
YAN_gl_bingzhu:0 "明烛巡游"
YAN_gl_bingzhu_desc:0 "明烛以驱巨兽之影，巡游以察社稷之患。"
YAN_gl_wenshuang:0 "问霜护道"
YAN_gl_wenshuang_desc:0 "镖车可以慢，货不能丢；人可以退，道不能丢。"
YAN_gl_damo:0 "大漠孤锋"
YAN_gl_damo_desc:0 "大漠里没有路，她走过的地方就是路。"
