#国家历史#
 #KRT#
 CountryIntroContentText_10_KRT: ""
 CountryIntroContentText_11_KRT: "1054年，§2四皇会战§!成为了迄今为止泰拉世界有史以来规模最大的战役，高卢帝国、维多利亚、莱塔尼亚、乌萨斯的上百万名士兵在高卢境内聚集厮杀，大半个泰拉都聚焦于这场几个世纪以来最激烈的战争中。在这场战役期间，乌萨斯上将§2伊万·凯林登§!率领第4步兵军的数万名士兵和七艘陆行舰抵达西陆，他们是在错误的情报中阻截高卢军队失败，在混战中迷失方向来到了这片陌生的荒原。\n据悉，当地人称呼这里为「科里亚特」，意为“金花与玛瑙的赐福之地”，如他们所说，这里水草丰茂，且附近有适宜耕作的土地和几处矿脉，这里没有战争，这对于厌倦了苦闷厮杀的前线士兵来说无疑是一碗烈酒，冲昏了他们的理智。\n军中因而爆发了激烈的争执，由于战时乌萨斯的严苛峻法十分残酷，未能完成任务的军队会受到严惩。且信使在半途始终未能传来来自帝国的情报，军队中有要求将军在此地安顿的想法。他们带来的陆行舰装载有工业模块，完全足以在这里建立根据地，伊万·凯林登在大部分军官的支持下，终于决定在当地自立，正式脱离乌萨斯帝国。\n科里亚特的民族构成十分复杂，它主要分为三部分，共同成为了帝国维持统治的核心力量。首先，是皇帝凯林登从四皇战争中带到西陆的§2乌萨斯人、当地土邦§!，以及沦为被征服者的§2萨尔贡人§!。三者共同构成了如今的科里亚特民族，在帝国内部存在森严的等级制度，西陆极权之国按照自己的方式将维尔德贵族放在一等人的位置上，而土邦分子作为协助者，统治着帝国不计其数的感染者、萨尔贡人、还有荒野游民。科里亚特在那段工业化和垦荒的岁月形成了强大的凝聚力，这为凯林登建立帝国打下了坚固的基石。\n1059年，科里亚特帝国成立，这是一个移民国家，建立了初步的混合制经济和基础工业，伊万·凯林登在当地人的支持下和军队的拥戴下加冕称帝。在政治上，科里亚特以§2集权方式§!构建政府框架，统治者的权利不受法律约束，皇帝拥有无限的立法权与行政权。在这时，科里亚特人已经是一个相当有认同感的概念了。"
 CountryIntroContentText_12_KRT: "从1070年到1090年，科里亚特陷入了动荡不安的年代，首先是帝国轰轰烈烈的拓荒运动在这一时期终止，原因是不断前进的科里亚特探险队终于在荒野上撞上了其他文明——同样处于拓荒时期的哥伦比亚和比勒陀利亚，双方在经过同一时期的漫长发展和扩张后，边境垦荒区相邻，呈现出对峙状态。\n1073年，哥伦比亚无视了科里亚特的警告，也不打算在南方疆界问题上做出让步，那年秋天，国内的贵族听闻了战争的消息，拉开了两国恩怨的序幕。双方的边境战争持续了二十余年，在七次战争中互有胜负，最终以1090年§2《华雷兹—埃帕尔条约》§!的签订告终，条约规定，哥伦比亚承认孤星共和国的独立，割让华雷兹-埃帕尔一线的边境区域给科里亚特，这条边境线上至今为止仍然布满两国的战争工事和游弋的陆行舰，双方依然在南方处于军事对峙状态，凯林登一世相信，这不会持续很久的。国内的政治家也做出预言，这或许只是一段时间的休战。两国止战...或者说进入了下一轮的对峙状态中。\n在南方，北萨尔贡国度比勒陀利亚也与科里亚特直接接壤，双方互相宣称了势力范围，但对于南方的几处重点矿脉出现争端。在边境冲突中，两国的拓荒队发生了交火，随后演变为了战争，科里亚特人展现出了他们的强悍，当陆行舰和坦克部队的轰鸣响彻南方原野，萨尔贡人溃不成军，被迫承认了边境的归属权。\n科里亚特南北皆敌，而凯林登则向国民们描绘了一个§2“伟业”§!，他向科里亚特人民指出了当前帝国所面临的难题，如果要让帝国走向一个繁荣昌盛的世界，那就必须南北出击，击败哥伦比亚和萨尔贡人，来让他们突破囚笼，成长为真正的西陆帝国，皇帝的声音让国内进入了一个§2狂热的备战状态§!，以此拉开了90年代的序幕。"
 CountryIntroContentText_13_KRT: "随着时间的推移，科里亚特多年以来所积聚的种种矛盾也开始显现出来，首先是愈发贪婪暴虐的维尔德贵族，短短二十年来，贵族阶级迅速腐化，建国之初乌萨斯士兵的风尚和荣誉消散无踪。国内从上至下的行政机构出现严重的腐败，过于臃肿的贵族阶层让上升通道极其渺茫，皇帝颁布了许多严苛的法令来维持对底层的控制力度，在严苛的制度中，大部分平民麻木的低着头，对这样的社会现状感到不满。菲林人让·道尔提出希望皇帝能主动接纳民意，建立一个限制贵族权力的民主机构，随后他的主张受到了来自贵族的迫害，这些民主分子在帝国内被视为眼中钉，遭到了取缔和禁止，被写入了帝国教育法案中——帝国永恒，维尔德贵族至高无上。\n还有什么比这样的现状更绝望呢，这位永恒的皇帝控制着一切，他也知晓一切问题的答案，他洞悉如何才能消灭叛军，更明白该如何平衡国内的势力，让他的统治稳如泰山——让·道尔最终死在了绞索上，皇帝废除了赤金制本位，转而将那些反对让利的财阀也全部用武力扫清。将财富分给了不满的贫穷阶级，在对国内的贫富差距进行平衡后，科里亚特恢复了暂时的稳定，这种政治上的平衡术还是很成功的。皇帝说服了市民，他所做的一切都是为了科里亚特人民，于是共和派又被人们扔进了垃圾桶，凯林登再一次用国家资本解决了近在咫尺的政变，接下来，他要将枪口调转指向国外了，这是为了科里亚特帝国的未来。然而真的能南北出击，在两个方向上征服哥伦比亚和萨尔贡人？对此不少军官深思熟虑，他们担心国内的工业和经济不足以支持一场大规模的§2总体战§!。科里亚特即是凯林登一世，他的名字是帝国，一切权力是他的，一切义务也只能由他履行，他是帝国的核心，他是帝国本身；皇帝苦心经营帝国三十余年，未来他也必将继续为这艘大船保驾护航，\n\n§R         ————要让这一切灭亡，除非他死去，时间不多，然而科里亚特的伟业已然迫近了。§!"
 
#国家现状#
 #KRT#
 CountryIntroContentText_20_KRT: ""
 CountryIntroContentText_21_KRT: "皇帝§2凯林登一世§!是一位§2永生者§!，他与§2凯尔希§!、爱国者§2博卓卡斯替§!一样，都是泰拉世界中不朽的存在，对于这样的存在登上了国家权力顶峰主要产生了三个后果。第一，皇帝的权力几乎延伸到了国家的所有领域，同时皇帝的能力也让任何人难以反抗。第二，帝国政府的运转和官僚的权力受到严重压制，一切主要事务都要依赖于皇帝的裁决与专断，他可以用自己意志改变这个国家的运转体系和经济规则。贵族们将他奉为神邸，而平民们麻木的遵循着永恒制度下的准则。第三，上层阶级的权力几乎呈现静止状态，所有人都对这位永恒的皇帝深信不疑，也只有皇帝青睐的人员才能进入帝国的管理体系中。\n但也要认识到，这位永恒皇帝并不代表着真理，恰恰相反，他的思维难以跟上泰拉新时代的新兴思潮。皇帝对君主制和战争带来的影响抱有相当偏执的看法，在感染者问题上也秉持着和乌萨斯别无二致的迫害奴役政策，这些制度给科里亚特带来的是灾难，苦痛，以及无穷无尽的负面影响——§2就算是贤明的皇帝永世长存，他的铁律就一定能带来繁荣么？§!\n§2科里亚特·维尔德·安德烈§!，帝国的皇储之一，在科里亚特北方军长期服役，用以防备来自哥伦比亚的威胁。对于这个阴险狡诈麻木无情的男人，人们给他起了一个绰号“北方雄鹰”。这不只是用于称呼他本人，也是称呼他手下的北方军士兵，这只雄鹰常年以来盘踞在帝国北方，在20年的战争中已经博取了一批中下层士兵和军官的绝对效忠，渐渐成为了一股让皇帝凯林登忌惮的势力。\n皇帝不打算放任这只狂热的北方雄鹰继续鸣叫下去了，不过清算北方军派系必定会引起一场腥风血雨，他需要找到更好的方式解决北方问题。"
 CountryIntroContentText_22_KRT: "民主思想在科里亚特内并非豪无立足之地，恰恰相反，从§2高卢帝国§!带来的民主制度自科里亚特帝国建立以来就有所关注，不管是建国初期的乌萨斯人还是后续的融合形成的科里亚特人，民主制的呼吁一直都有存在，只不过凯林登一世的个人魅力发挥了无可替代的作用。他在人民深处饥荒岁月时毅然出手，又在战争时期为帝国打开了通往胜利的道路，皇帝成功为人民稳固了君主制的信心，国内的主流观点便也认为一个权威的君主才能领导国家走向强盛与繁荣，按照科里亚特的集权框架，民主制度很难在这种体制内有所存续。\n不过这也并不是说支持民主的人士在帝国就销声匿迹，大多数以手工业者、农场主、小工厂主、店铺经营者为代表的小资产阶级和以帝国财团和亚索伯重工为代表的寡头阶级仍然对民主制度抱有很大的兴趣。他们在维尔德贵族与皇帝的极权体系内受到一定压制，直到1093年国内共和派在政变失败后遭遇血腥镇压，宣扬民主的领袖§2让·道尔§!被杀，皇帝在国内的短暂混乱时期取缔了所有民主派政党，自此科里亚特的民主运动落入低谷。\n但帝国皇储§2科里亚特·维尔德·霍夫曼§!仍然对民主派人士抱有同情，对民主制度抱有憧憬与信仰，这样一位皇储仍然与帝国财团和许多资产阶级支持者有着密切的联系，皇储与工商业界的联系颇深，大工厂主和企业家也纷纷向这位皇储许诺，如果有朝一日帝国权力更迭，他们必将不遗余力的支持皇储。\n霍夫曼赠予了他们一个亲手制作的花环，§2这枚自由与平等之环或许终有一天会颠覆科里亚特的君权。§!"
 CountryIntroContentText_23_KRT: "§2科里亚特·维尔德·休伯特§!大概是帝国建立以来最离经叛道的皇储了，他对于帝国的现状感到失望，对帝国内悲惨的奴隶和感染者抱有很深的同情之心。休伯特反对凯林登在国内实施的白色恐怖，认同君主制中光辉的一面。即贵族与皇帝应该为人民指引正确的方向，并在恰当的时机压制国内不正确的声音，他能忍受不同声音的存在，通过阶级调和与社会思想改造，让所有人紧密的团结在皇帝的周围，去打造出理想的君主国。\n休伯特的观点让人感到古怪，并不是说这种观点本身有多么可怕。而是它就像是一个无法实现的童话，如果皇帝不去保持自己的绝对权威，又要把持国家发展的方向，那个道路要怎么才能实现呢？这样的权力体制到底是民主还是独裁？到底是集权还是分权？休伯特没能给出他的答案，他早在几年前便离开了科里亚特，国内仍然有许多人将他视为最适合继承凯林登极权统治的人。毕竟他是三个皇储里最支持君主制的那位皇储，但很少有贵族去支持这位皇储，但他的观点依然如同救命长绳抛给了帝国处在深渊中的奴隶和感染者，休伯特的思想是唯一能拯救他们的观点。§2或许这位君王将如他所说，带给科里亚特君权以新生。§!\n在南方，萨尔贡人就像是帝国的顽疾，变成了难以根除的肿瘤长在了帝国的要害上，多年以来他们不断地袭击道路、破坏建筑、摧毁航道设施、扰乱南境土邦控制区的秩序，他们自称解放者，为了这片土地上受到剥削和压迫的萨尔贡人而战，二十年来自科里亚特军队踏上南方，游击队的抵抗从来没有停止过。\n不断有民风彪悍的§2比勒陀利亚人§!加入他们，科里亚特人对南境也长期处于放任自治的状态，当地土邦难以管辖漫长的南方边境线，于是从萨尔贡地区运入科里亚特的武器和补给便能让游击队长久的抵抗下去。在民主派政变事件结束后，南方也成为了§2共和派人士§!的老巢，大量从中央地区遭到政治迫害的民主人士与萨尔贡游击队有所联系，他们的力量愈发壮大，成为了顶在帝国南部的一根尖刺。"
 
 
 
