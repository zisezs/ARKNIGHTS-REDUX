#人物
 YNW_Chang_Qing: "常清"
 YNW_Chang_Qing_desc: "常清出生于一个武学世家，但出乎所有人的意料，常清在成年后并没有和她的父母还有兄弟姐妹一样，选择在江湖中行侠仗义，而是报考了长定武备学堂，成为了一名军官。毕业后的常清并不与军中其他的“长定系”成员往来，而是主动请缨，前往生活条件最为艰难的西北都护府，在玉门卫开始了她的军旅生涯。常清的天赋很快引起了时任西北都护的高仙的注意，她将常清调为自己的行军秘书，将她作为自己的接班人培养。随着高仙回到百京担任兵部尚书，得到推荐的常清便顺理成章地接任了西北都护一职。在军中的日子里，常清并没有忘记行侠仗义的家训，在士兵和百姓看来，常清是一位有仁有义的统治者，她体恤士兵，关心百姓，率先将中原的巡捕制度改革引入都护府，维护了西北的治安，还平等对待西北的少数民族部族，而不是像安北都护一样进行强制迁移。虽然宽松的统治政策也让一些反对力量得以渗透入西北的社会之中，但平生只相信正义的常清并不在意。人们不知道的是，对她来说，如果有一天，帝国成为了不义的那一方，那成为不义的敌人也无妨。"
