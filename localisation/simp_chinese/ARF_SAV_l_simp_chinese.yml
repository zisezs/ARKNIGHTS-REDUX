#国家元首
 SAV_Salman_Sauvage: "萨勒曼·砂乌第"
 SAV_Salman_Sauvage_desc: "仆人\n\n砂乌第家族的领袖，一个“丢祖宗脸”的家伙，尽管萨勒曼·砂乌第已经人过中年，这样的中伤仍然萦绕在王酋领的街头巷尾。确实，不同于他的父亲和兄长，在中陆列强的巧取豪夺之下保住了希贾兹地区的源石开采权，萨勒曼似乎只会躺在赤金搭建的城堡中，用哥伦比亚金券讨好着国外的列强和黄金之城的统治者。但萨勒曼清楚，掌控源石开采权是一种手段，挥霍钞票同样也是手段，让砂乌第家族端坐希贾兹和纳季德的王酋之位的手段。"
