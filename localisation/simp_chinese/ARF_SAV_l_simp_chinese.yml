#民族精神
 SAV_three_family: "三大家族"
 SAV_three_family_desc: "希贾兹-纳季德地区自古以来便由三大家族掌控：萨弗拉族的砂乌第家族、沙漠丰蹄族的沙马尔家族和阿戈尔族的阿穆尔家族。砂乌第家族作为萨尔贡帝国在这个地区的代言人，掌控着关键的源石开采权。沙马尔家族作为希贾兹地区除砂乌第之外的另一家族，在王酋领与外界的贸易中扮演者至关重要的角色。阿穆尔家族曾经是此地的统治者，但在萨尔贡新的王朝持续多年的打压下，如今仅仅控制着靠近水源的纳季德地区，维持着基本的农业生产，但也有人说他们在酝酿着某种阴谋。无论如何，在这片黄沙弥漫的土地上，没有人能逃离三个家族的阴影。"
 SAV_muru_warriors: "姆鲁族战士"
 SAV_muru_warriors_desc: "在沙漠中，除了那些拥抱现代生活的人，还有一群坚持着原始的游牧和行商生活的人，他们被称作“姆鲁人”。在与大地的战斗中，他们每个人都成为了骁勇善战的猛士，而艰苦但自由的生活方式又吸引了更多人加入他们，包括感染者。对政治家们来说，如果能够利用好这些人的力量，自己的势力就有可能在明争暗斗中取得优势，当然，给出的报酬也必须足够丰厚，同时谨记一点：不要食言。"
