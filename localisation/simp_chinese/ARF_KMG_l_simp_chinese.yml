#事件
 focus_kmg.1.t: "被赐予晨星的女孩"
 focus_kmg.1.d: "如果你初次造访在克缅哥罗德郊区的那所大宅邸，你一定会为刚进门就看到的那一幅巨大的肖像画震惊，那个挂在旋转楼梯顶部的巨幅油画是这所宅子曾经的主人，老克缅哥罗德公爵的肖像画，而这个大叛乱的祸首之一，已经随着他的政治遗产一起灰飞烟灭。\n\n一个穿着黑袍的少女推开了沉重的大门，缓步走上陈旧的大理石台阶，在老公爵的肖像前驻足。波尔卡·萨文科娃看着眼前这个陌生的面孔，她记忆里的父亲没有那么年轻，那么意气风发。那个男人只是敷衍地应付和妻女在一起的时光，更多时候，他只是坐在书房里，一边看着波尔卡当时还无法读懂的典籍，一边叹气。在波尔卡的记忆里，老公爵并不算是一个称职的父亲。如果老公爵仍在人世，波尔卡也许在某一天和他大吵一架，然后离家出走去做她的文学家梦。\n\n但是波尔卡并没有这个吵架的机会。在那场改变了乌萨斯命运的大叛乱中，她的父亲就是掀起叛乱的主谋之一，而那个沉默寡言的中年男人在经历了人生中最后一次疯狂后，在帝国的首都，在他妻女的面前，被绞索绞死。乌萨斯帝国给了老公爵的遗孀和独女罕见的宽仁，只是将她们扔回老公爵在远东的祖传封地，终日与冰雪还有流窜的感染者武装作伴。回到克缅哥罗德之后，尚且年幼的萨文科娃被送去城中的学校继续学业，她的母亲似乎刻意让她变成一个普通的乌萨斯人，而不是一个贵族后裔。老夫人则开始担当起家主的职责，在她老到不能动弹之前，这个坚毅且同样野心勃勃的女人将这个远东小城打造成了一个基地，一个完全属于成年后的波尔卡的、能够为她的愿望服务的基地。\n\n就在亲眼目睹父亲被吊死后，波尔卡开始逐渐理解他。老公爵无法接受乌萨斯被那些“短视”的商人逐渐渗透、控制，这个偏执的旧时代遗老，希望帝国回到那个充满荣耀和斗志的时代，就像他的肖像画里的精神状态，年轻而强大。如果还有机会和父亲对话，波尔卡一定会嘲笑他的想法。波尔卡理解父亲改变乌萨斯的执念，并且完全继承了他对乌萨斯的忠诚和热爱，但她不会怀念那个她素未谋面的时代，在她的心中，乌萨斯需要的是前进，而非倒退，而现在的乌萨斯囿于纸醉金迷，对身上的脓疮毫无察觉，这样的残躯，断然不可能走入波尔卡想象的新时代。\n\n“小姐，您在这里站了很久了。”老管家卡托波夫不知何时出现在波尔卡的身后，“您是刚从将军的墓地回来吗。”\n\n波尔卡·萨文科娃轻轻点头，转身走上楼梯，眼睛还没有从那张已经开始开裂的油画上离开。"
 focus_kmg.1.a: "“我在回忆他长什么样子。”"
 focus_kmg.2.t: "融化的海"
 focus_kmg.2.d: "杜丁斯科耶是一座小城镇，她与渔村的界限仅仅是几座现代化的港口。维克托·拜德拉科夫是这里的军事主官，掌控着只有几百人的感染者纠察队和一百多人的港口警卫。拜德拉科夫已经被发配到这里有些年头了，这些年以来，除了港口设施经历了一波翻修之外，他没觉得这里有什么变化。他倒是听说更南方一点的一个领主对这个小镇有想法，可能是想暗地里扩张势力范围吧，拜德拉科夫对这种贵族老爷之间的权谋没什么兴趣。\n\n这天早上，以一种极为慵懒的心情，拜德拉科夫走进了他在镇里的办公室，然后他就被坐在沙发上的一个穿着修女服的女人吓了一跳。\n\n“你，你怎么进来的。”\n\n“你没锁门，维克托·拜德拉科夫先生。”那个修女微笑道，“您不用紧张，我是奉克缅哥罗德女大公之命前来的。”\n\n拜德拉科夫翻了个白眼，取下自己的外套，挂在门后，“我对你的主子和她的什么宫廷权谋一点兴趣都没有，赶紧走吧。”\n\n“萨文科娃小姐不是那种传统的贵族。”修女依然微笑着，她从沙发上站起，缓步走到拜德拉科夫身边，“而您也不是那种传统的乌萨斯军人。”\n\n拜德拉科夫没有想过，自己有一天居然会被一个修女的气场吓得说不出话来。他确实不是什么传统军人，他和传统军人的区别就是，他参与过反对沙皇的活动。实际上就是由于这个原因，经过正经军事学院教育的他才被发配到这个除了冰雪什么也没有的小镇，坐着一个近似于警察局长的位子。\n\n“萨文科娃小姐认为，杜丁斯科耶在她的战略中至关重要，只不过这个地方名义上还属于沙皇管辖，为此，她可能需要一些关键人物的‘效忠’。”修女继续说着，“萨文科娃小姐对你的履历很感兴趣，我们可以为你安排一个指挥官或者教官的工作，而从你手下出来的军队，将成为未来埋葬沙皇的主力军。”\n\n拜德拉科夫咽了口口水，看来南方的那位贵族小姐想通过他控制杜丁斯科耶，为此还开出了一个不低的价码。他似乎根本没有犹豫的余地。或者说，他根本不需要犹豫。"
 focus_kmg.2.a: "“成交。”"
 focus_kmg.3.t: "长线投资"
 focus_kmg.3.d: "“公爵大人，您瞧，纠察队的这些小伙子们多么健壮、多么精神！我就是靠着手下的这些小伙子们，把困扰了我们好几年的流窜感染者武装消灭殆尽的！”克缅哥罗德的感染者纠察队长正向来访的萨文科娃吹嘘自己的功劳，萨文科娃对此只是报以公式的微笑。她对感染者的状况比这个只会夸夸其谈的大肚子军官了解得多，她在感染者游击队的内线传回的消息表明，如今的平静只不过是那支大部队收缩实力、专心休养的结果。\n\n“小伙子们！集合！今天公爵大人来视察，现在给她展示一下你们的纪律！”正在萨文科娃自顾自地端详营房的设施情况时，纠察队长吹响了哨子，把还在忙活训练的纠察队员们集合了起来。实际上萨文科娃的兴致遭到了严重的打击，但是她不是随意发作的人，只是维持着冷冷的微笑，向列队起来的士兵们举手行了个礼。\n\n但是纠察队长清点完人数后，脸色却难看了起来。“妈的，谢尔盖呢！”他下意识地骂道，然后突然意识到萨文科娃还在自己身后，“列夫、叶夫根尼！你俩去把谢尔盖·恩弗隆给我找来！”\n\n“长官，不用找。”叫叶夫根尼的那个士兵坏笑着，似乎早就预见到了谢尔盖的窘样，“那小子肯定还躲在营房里看书呢，他一看书就像聋了一样。”\n\n“非常抱歉，公爵大人！我之后一定严厉处罚那个小子！”纠察队长转过身，准备脱帽谢罪，却被萨文科娃摆手打断了。\n\n“无妨。我倒是想看看这个叫谢尔盖的士兵。带我去他的营房。”\n\n谢尔盖·恩弗隆坐在床上边啃着大列巴边看书的时候，怎么也想不到自己有这么一天。他此时正看到一段难懂的段落，下意识的小动作把手里握着的面包块都搓烂了。然后一个陌生的女声惊醒了他，谢尔盖一抬头，一个贵族打扮的小姐站在他的面前，身后是他气得脸色发青的长官。\n\n“谢尔盖·恩弗隆，对吗？”还没等谢尔盖放下书，站直身子来敬礼，那个贵族就接着发话了，“你有考虑过去上军校或者文化学校吗？”\n\n“报告长官，我没有钱。”\n\n贵族小姐笑了笑，“没事的，我有。就当是我对你才华的欣赏。毕竟能看懂戴维·里卡多的《赋税原理》的人，我在这座小城里还没见过几个。“\n\n“你，明天把他送到公爵府上，我的人会安排好的。”萨文科娃盯着已经目瞪口呆的纠察队长，“有什么疑问吗？”"
 focus_kmg.3.a: "收益不会在第一秒展现出来。"
 focus_kmg.4.t: "忠诚不需要很多"
 focus_kmg.4.d: "萨文科娃正用刀叉切割着一块流着肉汁的兽肉，虽然她的公务日益繁忙，但是她仍然习惯于每天进行一次贵族的晚餐。亚历山大·卡托波夫穿着管家的西装，静静地伫立在萨文科娃的身后。\n\n“联络我父亲旧部的事情，办得怎么样了？”萨文科娃将切好的肉送进嘴里，嚼了几口便咽了下去，“是不是没人愿意来？”\n\n卡托波夫叹了口气，他也没什么好隐瞒的，“只有几个当年的士官给了回复，愿意加入我们。但是那些稍微高级一些的家伙，没有一个回应。”\n\n“再正常不过了。”萨文科娃又切下一块肉，吃了下去，“当年的那些家伙们不是战死了就是被帝国收买了，我也没指望每个人都能像你一样有良心，亚历山大。”\n\n“您过誉了，小姐。”卡托波夫拿起一瓶红酒，“要添酒吗，小姐？”\n\n“不用了，我今晚还有事，我需要保持清醒。”萨文科娃继续吃着她的肉排，餐厅里陷入了短暂的沉寂，只有刀叉相碰的声音。\n\n“那冯西亚茨基呢？”萨文科娃突然问道，“那个疯子？”\n\n“阿纳斯塔斯在哥伦比亚当雇佣兵，信使可能还需要一些时日才能传回消息。”\n\n“我不质疑他的忠诚，他肯定会回来的。”萨文科娃放下刀叉，用餐巾擦了擦嘴，“问题只是他什么时候回来，我有一支精锐需要交给他。”\n\n餐厅的大门被粗鲁地撞开，卡托波夫惊讶地看到一个警卫慌慌张张地冲进来，“上校……有个打扮奇怪的男人要进庄园来，我们怎么拦也拦不住……”\n\n萨文科娃从椅子上站起身来，微笑着瞥了卡托波夫一眼，“看来那个疯子已经到了。”"
 focus_kmg.4.a: "有一个就够了。"
 focus_kmg.5.t: "归途"
 focus_kmg.5.d: "在登上那艘高速陆行舰之前，萨文科娃又一次回头驻足。圣骏堡是一座伟大的城市，她吞吐着乌萨斯土地上的所有生命，为这个跛脚巨人提供苟延残喘的能量。萨文科娃相信自己还有回来的那一天，但她也清楚，自己对抗巨人的手段还远远不够。\n\n正当萨文科娃转身准备登舰之时，一声呼唤穿透了陆行舰隆隆的引擎声，使得萨文科娃的脚步再次停住。来人是萨文科娃不算朋友的朋友，诗人尼古拉·古米廖夫。他的知名度是萨文科娃的十倍百倍不止，也许后世会用他的名字命名一代文学史，但他的政治力量倒是不如萨文科娃的零头，因为他只是一个落魄的旧贵族。古米廖夫喘着粗气，不近视的他带着眼镜，头上还顶着滑稽的假发。一看到萨文科娃，表情狼狈的古米廖夫便开口问道：“萨文科娃小姐，介意我和我的家人去远东暂住几天吗？”\n\n看到对方这样的扮相，以及古米廖夫和他身后的夫人手上拖着的大号行李箱，萨文科娃心里已经猜到了八九分真相。她走下舷梯，微笑着接过古米廖夫手中的行李，“没问题，虽然克缅哥罗德不如圣骏堡一般繁华，但是亲近自然，想必也能唤起一些非同凡响的妙笔。”\n\n于是这艘即将踏上归程的陆行舰就多了三名乘客，古米廖夫和他的妻女。在上了船后，古米廖夫摘下他那简陋的装扮，解释道他已经被跟踪多日，想趁着萨文科娃来到圣骏堡，借机前往远东避避风头。萨文科娃对此倒是不意外，不如说一个作品里处处流露出自由派观点的诗人，活跃了那么久还没出事，都是古米廖夫的影响力在保护他自己。\n\n“那你之后打算怎么办？”萨文科娃和古米廖夫说着，但她的眼睛倒是看着古米廖夫唯一的女儿，她似乎还没有出过圣骏堡，所以高速陆行舰外面飞速向后离去的景色，把这个小女孩的注意力牢牢地吸引住了。\n\n古米廖夫叹了口气，“还能怎么办？我当然是要继续创作的，有出版商的关系和那么多读者，总还能赚到稿费。”\n\n“你有没有想过，你这一走可能就回不去了。”\n\n“总比永远走不掉强。”古米廖夫苦笑，“希望你的城市能让我的家人生活得舒适一些。”\n\n“这你大可放心，我的朋友。”萨文科娃微笑着，以文学家的身份，她对古米廖夫的境况深表同情。不过她的另一重身份，能够让她给予一些同情以外的支持。"
 focus_kmg.5.a: "“你有没有兴趣为我工作呢？”"
 focus_kmg.6.t: "是恐惧让他们看到他"
 focus_kmg.6.d: "几位女仆将一道道佳肴端进房间里，轻轻放下，盘子和桌子发出细微的碰撞声，除此之外再没有其他的声响。今天的来客是个体面人，一切礼节什么的都要完备。萨文科娃亲自倒了一杯起泡酒，高高举起，“欢迎您远道而来，苏洛金教授。”\n\n坐在她对面的老男人拉起脸上的皱纹，微笑着回应，然后将杯中的酒一饮而尽。\n\n“我真没想到，我刚从西边回来，您就亲自光临我们这个小城市。”萨文科娃放下酒杯，似乎还想寒暄几句再开饭，“您要是说一声，我肯定专程再往大学跑一趟。”\n\n彼得·苏洛金呵呵笑了两声，“要是你真的去了那里，我的学生们肯定会很高兴的。他们都是你的书迷。”\n\n然后他拿起小勺，舀起面前的鱼子酱，“不过我也要有一段时间见不到他们了。我辞职了，萨文科娃小姐。”\n\n萨文科娃一愣，她花了几秒钟处理这个信息。彼得·苏洛金算是她在学术界的又一个朋友，两位忘年笔友几年前就开始了书信往来。有别于其他人对萨文科娃的文艺作品的欣赏，这位圣骏堡大学的社会学教授对萨文科娃的政治思想情有独钟。萨文科娃当然不吝惜在知识分子中渗透她的思想，在她看来，这位苏洛金教授会是一个在学术界有巨大价值的暗线。\n\n不过，既然这位老教授辞职了，那所谓暗线也就无从谈起了。萨文科娃整理清楚了思绪，恢复了平日的从容。“我真是没想到，您会放弃在首都为帝国培育人才的事业。那您之后打算做些什么？”\n\n“我打算给你帮帮忙。”苏洛金微笑道，“在这边的房子我都已经买好了，在普里托姆斯基大街上，在克缅哥罗德还算不错的地段，对吗？”\n\n萨文科娃释怀地笑起来。她明白了，苏洛金认为他不仅仅应该是一个“暗线”，他的野心也许不止一个学者，或者说他认为他的“学术理想”只有在她的支持下，才能落地。萨文科娃记得，这位苏洛金教授的研究方向包括文明分类理论和优生学，她在心里坏笑了一会儿，看来他能够成为一位优秀的理论家。\n\n“那就只好为我们无私的苏洛金教授，再敬一杯了。”"
 focus_kmg.6.a: "“干杯。”"
 event_kmg.1.t: "触不可及"
 event_kmg.1.d: "在没有什么事情的时候，亚历山大·卡托波夫喜欢站在餐厅的落地窗边，欣赏庄园里那个不算大的花园。在他年轻的时候，他是老萨文科夫公爵为数不多的亲信之一，也多次收到老公爵的邀请，在这个餐厅里与老公爵的家人共进晚餐。\n\n在大叛乱前夕，卡托波夫被圣骏堡的诏令调离，在他当时看来，这是一次升迁，老公爵甚至还和他的同僚一起为他举行了一次酒会。但现在回看，这似乎更像是皇帝和议会注意到了老公爵的阴谋，将他这个得力干将调离以削弱老公爵的集团军。就在他离开后不久，老公爵与其他贵族掀起了大叛乱。叛军的兵锋一度直抵圣骏堡，但就是卡托波夫的部队坚守住了那个关键的阵地，从而在援军抵达之前将老公爵拦在了圣骏堡城外。\n\n因为那次战役，卡托波夫得到了无上的荣耀，但他的内心却一直为此挣扎。服从命令是军人的天职，可自己的老上司就在阵地的另一端；老公爵不止一次向他透露过自己的宏伟蓝图，可自己的身后是圣骏堡的无数市民……带着这种挣扎，卡托波夫在军中熬到了退休年龄，拒绝了帝国为他授予的将衔，以上校军衔退役。在退役后，他鬼使神差地来到了克缅哥罗德，老公爵的封地。在这所宅邸里，已经卧床不起的公爵夫人笑着原谅了他，然后在卡托波夫的痛哭声中，为他下达了最后一个任务：帮助年轻的新任女大公管理领地。在这之后，圣骏堡的名流圈子里再也无法听到卡托波夫的名字，而克缅哥罗德的大宅子里出现了一个留着显眼的八字胡的老管家。\n\n克缅哥罗德的天上飘着小雪，轻薄如羽的雪花落在窗外的花坛里，然后迅速地消散了。卡托波夫突发奇想，想打开落地窗，伸出手去接一片雪。不过他立即打消了这个念头，自己的身体逐渐老去，已经吹不得太多冷风了，而且这样做还会让屋子里的热量散去。\n\n卡托波夫突然觉得，自己与萨文科夫家族的关系就像这些雪花。唯一与他深交的老公爵已经被处死，认识他的老夫人也已经寿终正寝，而克缅哥罗德如今的女主人，似乎已经和他这种旧时代的残党没有了共同话题。就像这些雪花，隔着窗子还能看见它们飘落的身影，却已经无法触及。亚历山大·卡托波夫想到这里，叹了口气。"
 event_kmg.1.a: "算了，小姐今晚还有一场晚宴。"
 event_kmg.2.t: "那位女士"
 event_kmg.2.d: "对克缅哥罗德那些不关心政治的老百姓来说，如果非要让他们选一个地方，作为这座移动城市的权力中心，那么他们不会选公爵府邸，而是在城中心的一个不起眼的小楼。因为以他们的地位见得到的官员，都是在这座小楼周围来来去去。\n\n这座老旧的小楼的主人，是加布里埃尔·列维托娃。她的父母只是这个小城的小学校的小教师。能够赐予她如此权力的，自然只有萨文科娃一人。作为波尔卡·萨文科娃回到克缅哥罗德后最亲密的友人，列维托娃在老夫人还在世的时候，便被萨文科夫家视若己出。随着萨文科娃成年亲政，列维托娃的地位也已经没有其他人可以质疑。\n\n能够在克缅哥罗德掌握如此权力，列维托娃靠的当然不仅仅是与女大公的私人关系。出生在这个东部小城的她受过良好的教育，靠着教会学校的关系，列维托娃得到了前往西乌萨斯进修学业的机会，然后她又带着知识回到了这里。萨文科娃不可能拒绝自己的密友提供的协助，当然她也清楚，在政治领域，她和她都需要时间来成熟。所以列维托娃成为了女大公的幕僚，开始逐渐从那名沙皇派来的废物官员手中一点点分割权力。\n\n作为萨文科娃为数不多的几个完全信任的人，列维托娃知道萨文科娃的一切理论、梦想、渴望。在年少时，第一次听到萨文科娃向她描绘的未来以后，自知无法到达她的高度的列维托娃就决定，要为了她的理想奉献全部。不过列维托娃没想到的是，真正到了奉献的时候，事情是那么的琐碎。征税、治安、城市建设，还有秘密进行的户口登记，实际的事务比西乌萨斯的课堂困难了千百倍还不止。\n\n不过对列维托娃来说，她愿意继续做下去。这个上过教会学校的女孩有着殉道者一般的虔诚。萨文科娃已经开始为了她的理想在棋盘上布局，那么列维托娃要做的，就是确保萨文科娃的理想能够化为真实。她的随从已经隐晦地提醒过她的身体健康，但列维托娃对此也只是一笑了之。为了追赶上她的脚步，列维托娃只能付出更多的时间和精力，她相信这一切都是值得的。\n\n想到这里，列维托娃拍了拍自己的脸颊，继续着枯燥而繁重的文书工作。"
 event_kmg.2.a: "睡吧，一切渴望。"
 event_kmg.3.t: "主会宽恕我吗？"
 event_kmg.3.d: "战争给阿纳斯塔斯·冯西亚茨基的身体留下了数不尽的痕迹，他丢了一根小拇指，一只耳朵被打了个洞，躯干上留下的刀伤和枪伤更是难以统计。但冯西亚茨基并没有感到后悔或痛苦，他只会干这个。\n\n在二十多年前的大叛乱中，冯西亚茨基跟着老萨文科夫公爵一路进军，兵锋一度抵近圣骏堡城下。老公爵把冯西亚茨基带在身边只有一个理由，他为了胜利可以不择手段。在那次旷日持久的攻防战中，冯西亚茨基的术士团负责保卫主力部队的侧翼，而圣骏堡守军的反攻方向恰恰就在他的阵地对面。但是帝国军筹备了数周的反攻最终却没掀起任何波澜，大叛乱的天平直到后来两大集团军驰援后才最终倾覆。在战后的调查中，沙皇的手下发现，那支本应发起反攻、冲击叛军侧翼的部队，被极为强大的源石法术彻底摧毁了，他们连与后方联络的机会都未曾拥有。而在叛军撤退时抛弃的阵地上，调查员们发现了更为可怖的场景：上千名战俘和叛军伤员被人为变成感染者，然后作为施术的阵列燃尽了最后一点生命。\n\n针对这支术士团的清算行动很快开始，甚至早于对老公爵本人的审判。术士团的各级指挥官都被警察和内卫尽数剿灭，帝国不能容忍同时拥有残忍和技术的人在自己的控制之外。但唯独那支部队的指挥官不知所踪，只有冯西亚茨基自己知道，他那个时候正在给年幼的萨文科娃小姐当男保姆。再后来，为了保证他的安全，老夫人决定将他送往国外，于是冯西亚茨基开始成为一个雇佣兵，反正都是打仗，在哪都是打。\n\n冯西亚茨基并不是一个守得住秘密的人，他不止一次把自己的经历与其他的亡命徒们交换，而他也不止一次被问过那个问题：为什么要这么做？确实，如果自己不使用那么残忍的手段，战争的结果也不会出现什么变化，而自己还有可能躲过帝国的清算，在重组后的乌萨斯军队里谋得一官半职。冯西亚茨基对自己说的是，乌萨斯军人的品德便是忠诚，便是不择手段地去获得胜利。但是在他的心里，似乎一直有一个无法辨别是善还是恶的声音，在时时刻刻地提醒自己，他之所以选择残忍，只不过是他的秉性如此。\n\n回到克缅哥罗德以后，冯西亚茨基从那个以前他喂过饭的小姑娘手里接下了一个任务，组建一支完全忠于萨文科娃的秘密部队，这支部队将负责镇压、监视和特种作战，残忍和忠诚是女大公对这支部队的要求。冯西亚茨基在私底下告诉自己，小姐是将他当作了一只黑手套，去干那些她不愿意干的事。但是依然是那个声音在不断地提醒他：这不过是他的欲望被萨文科娃洞穿后，女大公赐予他的奖赏。"
 event_kmg.3.a: "我是主的仆人。"
 event_kmg.4.t: "推销思想"
 event_kmg.4.d: "即使萨文科娃的探子和情报网一直关注着整合运动的动向，但是当切尔诺伯格落入整合运动手中的消息传来到克缅哥罗德，萨文科娃还是吃了一惊。但随后的局势变化就让她连吃惊的时间都没有了。萨文科娃清楚，她一直期待着的事情发生了。切城易手的连锁反应很快传递到了克缅哥罗德，第三集团军覆灭后，周边的贵族和军阀都蠢蠢欲动，尤其是南边的贝加尔大公几乎已经按捺不住了，损失了一支嫡系大军的他似乎还有更大的野心。\n\n萨文科娃早已为当前的混乱局面做好了打算，同时也包括战争所带来的难民潮。已经有不少人从冲突中的东东达利亚地区逃往克缅哥罗德，在萨文科娃的布置下，公爵领的政府正密切关注着其中有着军事或行政背景的家伙们，在这些人里面找几个可用之才。\n\n“前警察、纠察队……这个则是出逃的会计……”在越来越成熟的列维托娃的领导下，负责收集信息的部门很快将一沓档案放在了萨文科娃的桌上，虽然只是初步的调查，但是对萨文科娃来说已经足够了。\n\n“那些切尔诺伯格逃出来的小公务员什么的，先直接让他们去政府报到吧。我们未来肯定会越来越缺人的。”萨文科娃把看过的档案整理好，搁在一旁，似笑非笑地说着，“那些有军事背景的家伙，我和上校之后再好好审一审他们。”\n\n“波尔卡，我……想给你推荐一个不在名单里的家伙。”坐在桌边的列维托娃突然发话，萨文科娃惊讶地一挑眉，但她没有开口，于是列维托娃继续说下去。\n\n“有一个自称从切尔诺伯格逃往龙门，之后又主动跑过来的商人，罗泽耶夫斯卡娅。她自称是个中介商人，最近在市场上通过推销炎国带来的商品出名了。我想我们可能需要她。”\n\n“用她来建立和炎国的商业往来吗？”萨文科娃把笔夹到耳朵上，饶有兴致地听着。\n\n“不。”列维托娃笑笑，“我看过她所谓的推销，我能够看到她这些花哨词汇之下的力量。我想，我们的事业需要一个煽动者。”\n\n萨文科娃舔了舔嘴唇，点了两下头。她个人确实喜欢面对公众做一些演讲、出几本小册子，不过对于未来越来越大的国家来说，一个专门的宣传部门也的确有必要。“找个时间安排她和我见面。不需要单独的，最好把她放在某一次普通的征召流程里。如果这个家伙只是徒有其表，那么我们还可以把她扔去干她本来的营生。”"
 event_kmg.4.a: "“尽快。”"
 event_kmg.5.t: "既然我不信神……"
 event_kmg.5.d: "东达利亚的混乱局势已经开始了一些时日了，所以克缅哥罗德的军队也一直紧绷着神经。所以一架小型飞机罕见地出现在这座远东小城上空时，许多没见过飞机的士兵都差点开火把它打下来。直到萨文科娃本人的命令传达下来，这架螺旋桨小飞机才慢慢悠悠地降落在机场。\n\n“帕维尔，你真是不要命了。”萨文科娃带着人亲自到了机场，飞机的舱门刚打开，萨文科娃就嘲讽地喊道，“西边的日子不舒服吗，你跑到我们这打着仗的地方找乐子？”\n\n一个穿着毛皮大衣，戴着毛皮帽子的男人从飞机上一边走下来，一边颤抖着扯紧了他的大衣。“舒服个屁，十月党还是皇帝都是一样的衣冠禽兽！不如老妹儿你靠谱！”\n\n“我靠谱？”萨文科娃手指着自己，笑道，“我这个小镇子，都没地方让你这个大出版商赚钱，我们这能够认字的一只手估计都数完了。”\n\n帕维尔·索夫钦斯基搓着手，跟着萨文科娃的人上了她的轿车，“哼，没人识字，你还会印那么多政治宣传？还会直接在西边的大城市招募教师？再怎么样，你这里不需要书，纸总是要的吧。”\n\n上了车后，索夫钦斯基摘下他的毛帽子，露出了稀疏的头顶，“乌萨斯现在的境况，老妹你比我清楚多了。杜马里的政客一直在扯皮，军队和官僚又是步步紧逼，哪里还有我们做生意的人的位置啊。”\n\n“那你的钱呢。分我们一点赞助呗。”萨文科娃继续打趣道。\n\n“那必须的老妹，你的保护费我肯定交给你。你要建什么刀枪大炮的工厂，我给你投钱。”索夫钦斯基从大衣里拿出雪茄盒，“介意我在车里抽一根吗？”\n\n萨文科娃回头瞪了一眼，索夫钦斯基只得乖乖地把雪茄塞回去，“当然，我的钱肯定不会存在圣骏堡的。保不齐哪天他们就把我所有家当给抄了。我已经在哥伦比亚和拉特兰打点好了，要是老妹你也想在国外存钱，尽管问我就行。”\n\n“既然没有人保护我，我就必须保护自己。”索夫钦斯基嘟囔着，神情突然严肃起来，“萨文科娃老妹，你可得靠谱点，别输了。”\n\n萨文科娃只是笑笑，没说什么。"
 event_kmg.5.a: "……那我就做自己的神。"
 event_kmg.6.t: "交个朋友"
 event_kmg.6.d: "虽然冯西亚茨基的恐怖名声早已流传在外，但他有一个特点是出乎人们的刻板印象的。作为一个乌萨斯人，阿纳斯塔斯·冯西亚茨基并不酗酒，甚至几乎不喝酒，因为他认为酒精会腐蚀他脑子里的施术能力和战斗技巧，会干扰他杀人。所以当罗兹耶夫斯卡娅带着几瓶烈酒来拜访他的时候，只是碰了一鼻子灰。\n\n冯西亚茨基虽然冷酷、残暴，但他不是傻子。作为黑色卫队的领袖，政府内部的四号甚至三号人物，谁都会试着巴结他。所以他没有直接回绝罗兹耶夫斯卡娅的好意，而是笑着请她在自己的办公室坐下，然后看着这个年轻的政治新星自顾自地喝起来。\n\n“所以啊，我在炎国流亡的日子……是真的好辛苦啊！”罗兹耶夫斯卡娅的酒量和酒品似乎都不太行，才过了一会就开始说胡话，但是冯西亚茨基并不会因此放松警惕。\n\n“我在龙门……结识的那几个朋友，他们听说我到了克缅哥罗德……也想来为萨文科娃小姐……效忠……”罗兹耶夫斯卡娅说着，又往嘴里灌了一口酒，“他们都……挺能打的！阿纳斯塔斯，你说你们黑色卫队……能不能把他们几个招过来？”\n\n听到这里，冯西亚茨基轻蔑地一笑，这个女人无非是想安排几个亲信，好在未来分一杯羹或是培植自己的势力。这样的人他见多了，他站起身，摆摆手准备送客。\n\n然后罗兹耶夫斯卡娅的眼神突然锐利起来，她悠然地向后靠在椅背上，抬起双腿放上了桌子，“当然，我也不是不明事理的人。作为帮我朋友的忙的答谢，我可以让宣传部门多为您说一些好话。毕竟，等以后萨文科娃小姐的事业成功那一天，一个只会杀戮的黑色卫队领袖，多少让小姐她脸上没光。”\n\n冯西亚茨基是一个粗人，他一开始确实没把罗兹耶夫斯卡娅的身份放在心上，宣传部长。在他看来，在军事的胜利和铁腕的手段面前，三言两语的宣传不值一提。不过既然对方敢以此作为筹码，那一定有其道理。冯西亚茨基板着脸，拿起了罗兹耶夫斯卡娅还没启封的那一瓶伏特加，放到了自己的桌子上。\n\n“你的心意我领了。让我看看你还有什么惊喜给我吧。”冯西亚茨基微微翘起嘴角，挥手让手下把罗兹耶夫斯卡娅请出房间。\n\n第二天，一个文件袋就送到了冯西亚茨基的办公桌上，里面是对其履历的详细资料和如何抹去他的污点、塑造他骁勇善战形象的方案，文末还留下了一个笑脸的涂鸦，作者在旁边手写了一小句话：\n\n“崇拜比畏惧更有效。”"
 event_kmg.6.a: "看来这个朋友交对了。"
 focus_kmg.7.t: "大地的本质"
 focus_kmg.7.d: "穿着便服的萨文科娃在吱呀叫的椅子上扭动着，摆出一个还算舒服的姿势。虽然自己在人前装出一副自信满满的样子，但萨文科娃心里实际上也有些忐忑。她知道自己的书在乌萨斯全国都很畅销，其中不少销量都是平民百姓的贡献，但是乌萨斯或是太大了，也许大部分人依然是不认识她，在一个工人社区的小酒馆里进行宣传，可能自己确实是有点异想天开。\n\n远方响起一阵阵铃声和哨声，工业区块的下班时间到了，嘈杂的人声逐渐从四面八方逼近，\n\n几个蓄着胡子的高大男子率先走了进来，领头的那个人扫视着酒馆内部，然后对吧台大喊道。\n\n“伊戈尔！老样子，给我们来点啤酒！该死的工头今天把阿列克谢打了一顿，他今天来不了啦！”在女仆害怕的目光和萨文科娃冷冷的注视下，那几个工人慢慢踱步到了酒桌旁，领头那人走到吧台前，准备从酒保手上接过啤酒，顺便与他熟识的酒保继续闲聊。\n\n“唉，伊戈尔，我听说那个作家，叫什么萨文科娃的，来到咱们城里了，你听说了吗？”那人靠在吧台上，大大咧咧地朝着酒保说道，“也不知道去哪个老爷府上玩去了，看来和其他文人没什么两样！”\n\n那个工人自顾自地笑起来，然后他发现他的酒保朋友并没有和他一起笑，只是抿着嘴唇微笑着，谁都看得出来这是在憋笑。“维克托，你这个蠢货。你看看那边坐着的，那就是萨文科娃女士！”\n\n这一下把那个工人惊得跳了起来，然后他赶忙跑到萨文科娃的桌前，从怀里掏出一本《那不是》，萨文科娃的一本书，“女士，我，我刚刚都是随便说的，其实我一直在读您的书！我还给不少不识字的弟兄念过……”\n\n“你怎么相信我就是那个作家，不是你的朋友故意诈你呢。”萨文科娃微笑着，手里倒是拿好了准备签名的钢笔，“萨文科娃这样出身名门的文人，应该出现在大宅子里才对吧？”\n\n“不不不，女士，我方才真是乱说的。我们能看得出来，你和其他作家不一样，你写的书都是我们这些粗人看得懂的！”工人连连摆手，他的几个朋友也出于看热闹凑了过来，“我们很爱读这些故事，要不信，你问弟兄们！”\n\n“无妨。”萨文科娃熟练地从工人手上拿过那本书，在扉页上签了名，“不过我觉得，萨文科娃不会教自己的读者随意评价一个自己没见过的家伙。”\n\n“您别误会，我是平时粗野惯了，说话没分寸！”工人还在慌张地摆手，沧桑的脸上显露出像孩子一样的紧张。萨文科娃大笑起来。\n\n“没事，我的书就是写给你们这样的人看的。”"
 focus_kmg.7.a: "不知谁在说违心的话。"
 focus_kmg.8.t: "圣骏堡之行"
 focus_kmg.8.d: "圣骏堡，乌萨斯帝国的大脑，皇帝最宏伟的宫殿，这个地方似乎并不是波尔卡·鲍里索夫娜·萨文科娃，叛徒的女儿，应该来的地方。但是圣骏堡还有一个名字，乌萨斯艺术家的亚马乌罗提，这便是作家萨文科娃来到这里的理由了。\n\n“……所以我认为，乌萨斯的文艺也应当跟随陛下的步伐，向其他国家敞开胸怀，让其他民族的诗句充盈我们的心灵，然后才能写出象征崭新乌萨斯的华章。”一位梳着油光闪闪的大背头的年轻作家在众人面前侃侃而谈，他手中的酒杯因为他夸张的肢体语言而好几次处在倾倒的边缘。萨文科娃站在他的面前，微笑着，小口地抿着杯中的香槟，这是乌萨斯在四皇战争后获得的少有好处，前高卢属地香槟的利口酒特许经营权。\n\n“萨文科娃小姐，又是如何想的呢？”年轻作家收起了他张扬的肢体，转而谦恭地向萨文科娃微微低下头，似乎在寻求她这位大作家的意见。萨文科娃仍在不紧不慢地品着香槟酒，她知道，面前这位叫做维克托·利哈乔夫的年轻人，是今天这场宴会实际上的主角。利哈乔夫家族依附着这次宴会的赞助商，古卡波夫集团。萨文科娃的出版商，索夫钦斯基的公司，同样挂靠在这个财团名下。维克托是家族里的小儿子，出人意料地喜欢文学，因此利哈乔夫家族求着古卡波夫集团举办了一场欢迎萨文科娃的宴会，目的是让这个小子沾上萨文科娃的边，给他的文学生涯镀镀金。萨文科娃知道一切，但是她不能让别人知道。\n\n“当然了，利哈乔夫先生很有见地。在先皇过于强势的扩张政策下，我们乌萨斯人也陷入了迷茫。我们忘记了我们种族与生俱来的谦逊、坚忍的美德，而是一味地骄傲自满。”萨文科娃看看利哈乔夫，再看看周边的人，她希望她的眼光足够天真、足够单纯，“这其中也包括我的父亲，他太自大了，以至于认为陛下背叛了乌萨斯民族的骄傲，最后背叛了陛下。可是，父亲他所认为的‘骄傲’，实际上只是落后于时代的一个错觉。就像利哈乔夫先生说的那样，乌萨斯应该重拾过去的美德，向泰拉各国敞开胸怀，才能获得新生。”\n\n一阵掌声响起，然后随着利哈乔夫放下手，掌声又逐渐凋零。激动不已的维克托·利哈乔夫走上前来，向萨文科娃附身行礼，“萨文科娃小姐，您的文学见识实在是太深刻了，我的发言一下便显得相形见绌。可否与我共舞一曲，我们继续探讨文学的问题？”\n\n萨文科娃对维克托微笑，召唤侍者过来取走了她的酒杯。古卡波夫是皇帝身边的红人，不能放过这个机会。这样想着，萨文科娃伸出了手。"
 focus_kmg.8.a: "“乐意之至。”"
 focus_kmg.9.t: "都烂透了"
 focus_kmg.9.d: "今夜的萨文科夫家宅邸门前人头攒动，今天是萨文科娃宴请这些贵族地主们的日子，其中不少人是从远方赶来的。即使是一个小小的公爵领，其境内的中小贵族地主，也已经有数十位，加上他们的亲属和家丁，更是有上百号人挤进了这个规模并不大的老宅里。\n\n老宅的餐厅当然不可能容下那么多人，而宴会厅的规格也并没有多大，于是宴会的地点理所当然定在了花园中。一张张华美的长桌被摆在了花园里，上面盛着各种精致的餐食，有些小地主都还是第一次见到，因此吃得胆战心惊，生怕吃的方式不对，在其他人面前出丑。在花园靠近宅子的那一侧，搭着一个台子，本来应该由萨文科娃在这里发表几句祝酒词，宴会才能开始的，但是女大公似乎有什么紧急事务不能按时出席，因此是由老管家卡托波夫来宣布宴会开始。\n\n实际上，这场宴会当然不是因为萨文科娃善心大发，要请这些本来就不愁吃穿的地主老爷吃一顿饭，她必然是要借此机会推行一些打压地主的政策。地主贵族们也心知肚明，他们清楚这位女大公的性格和政治观点，她多次公开批判过乌萨斯的地主农奴制度，想要用她自己控制的民粹农民团体控制乡村。所以这次不少人带着家丁，目的就是偷偷探查一下宴会现场，确认萨文科娃不至于导演一出“血色宴会”，即使真的发生了，也方便自己溜走。\n\n正当宾客们把酒言欢的时候，萨文科娃不知何时出现在了主席台上，她拍两拍手，咳了两声，把所有人的目光都吸引到了自己身上。\n\n“抱歉各位，今日事务繁忙，没能准时出席宴会。我简单和各位说几句，关于各位都很关心的农业政策问题。由于发展农村经济和筹备新的农民协会的需要，希望各位在之后几年不要加租，适当照顾一下农民的生活。我一段时间后会派几位事务官，去检查各位有没有实施好这几项工作。就是这样！希望大家享受今天的宴会！”\n\n这就完了？台下的地主们还没反应过来，萨文科娃已经重新披上大衣，在几个仆人的护送下走回了房子里。不过，既然她都这么说了，即使一些贵族还有着疑虑，他们也将信将疑地带着这种心情，乘上了回程的车子。\n\n所以在过了几天后，当萨文科娃派遣的事务官带着一纸交易土地的合同，以及一瓶解毒药，走到这些卧床不起、奄奄一息的小地主床前时，他们大部分人得到的都是统一的回答。"
 focus_kmg.9.a: "“我签……我签。”"
 focus_kmg.10.t: "闲谈"
 focus_kmg.10.d: "“安德烈，我真想不明白你为什么非要拉着我，来参加这个什么该死的”爱国农民协会“。我们能从这里获得什么？花整整25戈比，就为了从他们那拿一本证书？”\n\n“哦，哥哥，你能不能把眼光放长远些。他们不是都说了吗，有了这个证，以后去和他们买肥料和工具，都能打折呢！一年下来，省下的钱早就抵得上这25戈比了。”\n\n“他们说打折，你就信？安德烈，我就是对你这种可笑的单纯放不下心。我比你大了十岁，我见过的地主老爷也比你多，我还没见过哪个老爷这么心善的！”\n\n“冷静些，阿廖沙哥哥。要是这25戈比真的白花了，我去多做一份帮工的活，给家里赚回来，好了吧。况且，我真的觉得，萨文科娃女士，她和别人不一样。”\n\n“贵族老爷们能有什么不一样的！你可不要被他们宣传的那些鬼话迷了脑子！”\n\n“可是你瞧，她的命令真的让那些地主们把土地吐了出来，然后让大伙用低价把土地又买了回来，她给咱们的贷款还不要利息呢！难道萨文科娃女士不是农民的大恩人吗？”\n\n“……”\n\n“哥哥，萨文科娃女士她都已经做了几件好事了，我宁愿相信她还能再做好事。大家肯定都是和我有一样的想法儿，不然为啥今天那么多人也喊着要加入那个什么‘挨过农民协会’呢。”\n\n“唉，你要真这么想，哥哥也不多说什么。安德烈，你是读过小学的，比哥哥见识多。但是我真的在用经验提醒你，世上没有免费的善意。”"
 focus_kmg.10.a: "“但是有打了折的啊。”"
 focus_kmg.11.t: "BUG"
 focus_kmg.11.d: "走进门后，绍伊特拉茨打量了一下四周，然后带着犹疑的神色，坐到了萨文科娃面前。“呃……萨文科娃小姐，没想到您会找这种地方和我见面。”\n\n萨文科娃喝了一口咖啡，“怎么，是您认为这所咖啡馆不够高档，不习惯？”\n\n“那当然不会，我们军人什么苦没受过，我对生活条件没什么要求。”绍伊特拉茨陪笑道，虽然他嘴上这么说着，手上倒是一直在拍打着衣服沾到的灰尘，“我意外的是——您别介意——像您这样的贵族小姐才不应该在这种地方。”\n\n“在我的封地，这样的咖啡店已经是那里最好的了。”萨文科娃微笑，“我也不卖关子。我找将军见面，是想了解一下，您关于军队改革的看法。”\n\n“看来我的改革观点都已经传到远东去了啊。”绍伊特拉茨苦笑道，“实际上，关于军队改革，我的想法很简单，无非是更新装备、改变训练方法、变革指挥体系之类的。乌萨斯总不能固步自封，泰拉各国都在变革，我们也不能落在后面，对吧？”\n\n萨文科娃抿了口咖啡，点点头。绍伊特拉茨继续说着：“对于换装备、换战术这类的改革，基本上军队里大部分人都是支持的，我的部队也已经开始尝试新的战法了。只不过到了改革指挥体系这些方面，我就和那些老家伙们不对付了。”\n\n“我听说了。”萨文科娃放下咖啡杯，往杯中加了几粒方糖。方糖和茶匙和杯壁碰撞，发出叮当的响声。“流言总是嘈杂但是难以忽视的。”\n\n“小姐你觉得军队改革怎么样呢。毕竟您的父亲也是一位将军，您应该也学会了不少这方面的东西。啊，虽然大叛乱时我与他交过手，但是我个人一直敬佩着他。”绍伊特拉茨突然说道。\n\n“没必要说那么多好话。作为一个爱国者，我一直认为，变革才是让国家存续下去的关键。”萨文科娃尝了一口加了糖后的咖啡，咂咂嘴，“我和父亲那样的老顽固不一样。”\n\n“要是老顽固少一些就好了。”绍伊特拉茨自嘲地笑笑。\n\n“将军，如果你的衬衫上有只虱子嘲笑你，那就杀掉他。”萨文科娃拍了拍肩头沾染上的灰尘，“您是军人，想必比我更清楚这个道理。”\n\n“当然，当然……”绍伊特拉茨喃喃道，然后突然抬起头，看向萨文科娃，“话说回来，您是为了什么想了解军事改革的事情？”\n\n“写书。”"
 focus_kmg.11.a: "二人相视一笑。"
 focus_kmg.12.t: "各人做各人应做的事"
 focus_kmg.12.d: "“不用拘束，也不用紧张，马尔托夫先生。”看着警觉地环顾四周的尤里·马尔托夫，萨文科娃笑着把他领到桌前，“虽然这里是圣骏堡的酒店，但是我的随从已经把事情打点好了，不会有人监视的。”\n\n“所以，你就请我来喝下午茶？”马尔托夫挑眉，“我还以为萨文科娃小姐只是一个与世无争的文学家。”\n\n“过誉了，马尔托夫先生。”萨文科娃招呼了几个女仆过来，为她和马尔托夫摆好茶具和甜点，“哪个和文字打交道的人，没有一点政治理想呢。你我都是一路人。”\n\n“好吧。你打算干什么。”马尔托夫拿起瘤奶杯，往冒着水汽的茶杯里倒，“你也不像是一个慷慨到请新认识的朋友品茶的人。”\n\n“我只是想和您交流一下……政治理念。”萨文科娃拿起一块高卢小圆饼，没有咬下去，只是捏在手上，“我有幸拜读过几篇您在《理想报》上的评论……”\n\n听到“理想报”几个字，马尔托夫下意识地抖了一下，手里的红茶洒了几滴。萨文科娃耸耸肩，一个女仆走过来，轻擦了几下滴落在桌布上的茶水。\n\n“没必要紧张，马尔托夫先生。我既然会找你见面，说明我肯定对你有所了解。”萨文科娃挥手让女仆退下，“如果有什么冒犯，还请原谅，因为我很中意您的政治评论。”\n\n“你直说吧。为什么找我？”马尔托夫喝了一口茶，让自己平静下来。他以为自己曾经是个激进分子的历史没多少人知道，没想到一个远在东达利亚的旧贵族对此再也清楚不过。\n\n“按照你们的理论，在那个建成了‘社会主义’的国度，是不需要什么‘皇帝’的吧。”萨文科娃把手中的高卢小圆饼放到嘴边，咬了一口，“就像这个小点心的家乡一样。”\n\n“……此话不假。专制制度是挡在社会主义道路上的一大阻碍。但是，我主张的是用温和的手段逐步改革……”\n\n“反正皇帝是不需要的，对吧？”萨文科娃又咬了一口小圆饼，送了一口茶，“我想说的是，在这一点上，你与我不谋而合。”\n\n“哦？我还以为你是和你父亲那样的保皇派呢。”马尔托夫疲惫地陪笑道，“那你对那位陛下，有什么办法吗？”\n\n“我有一支军队。规模不大，但总归是有。”萨文科娃又吃一口，把那块小圆饼吃完，“对于帝国来说，当然远远不够。所以我想找一些朋友。”\n\n“不过，你暂时不用想太多，毕竟我也没打算和沙皇陛下撕破脸。我们每个人都有自己要做的事。”萨文科娃招手，一位女仆上前为她添茶。"
 focus_kmg.12.a: "“现在，我们还是专心品茶吧。”"
 focus_kmg.13.t: "律法与罪恶"
 focus_kmg.13.d: "“你知不知道，我们今天的会面，明天就会登在报纸的头条上？”伊斯拉姆·维特背着手，笑着走过富丽堂皇的走廊。波尔卡·萨文科娃微笑着，以标准的贵族步幅，跟在维特的身后，步入了他的办公室。\n\n“和您这位著名的作家见面，可以向外界释放很多信号。比如我们对文学界的态度，对您社会贡献的认可，之类的。”维特引萨文科娃进门，坐到沙发上，他自己则站在门边，一边说着一边脱掉自己的大衣。\n\n“不过，这些内容都得等到记者来以后再说。”维特的声音突然拉低了几度，露出他那特有的忧郁而阴沉的面容，“所以，克缅哥罗德女大公，你有什么目的。”\n\n萨文科娃公式地笑着，“我没什么目的，议长大人。我只是一个作家。”\n\n“大叛乱已经过去很多年了，旧贵族也被打压了很多年。”维特坐到自己的办公桌前，双手交叉靠在桌上，“有一些人，或是喊着要恢复旧日荣光，或是发誓要为亲人复仇，我们都见怪不怪了。\n\n“但是有些人，虽然她的家族在大叛乱中几乎失去一切，却一直对外宣称自己无心政治，只是写写诗歌、写写小说。我不是傻瓜，我清楚谁才是真正有野心的那种人。\n\n“波尔卡·鲍里索夫娜·萨文科娃，你想干什么。老鲍里斯的大名还写在你的名字之里呢，别以为我会忘记。”\n\n萨文科娃没有说什么，只是踱步到窗边，“有人说过，世间如果没有法律，便也不会有罪恶。如果这话是真的，那么我的父亲又有什么过错呢。”\n\n“然而事实就是，乌萨斯有她的法律。”维特冷笑，“只是可惜，乌萨斯的法律现在还拿作家萨文科娃小姐没什么办法。”\n\n看着窗外的圣骏堡，萨文科娃叹了口气，转身看向议长，“维特先生，我们都是聪明人。我们都知道有些事情不是记者应该知道的。”\n\n维特微微颔首，做出一个“请”的手势，“所以，我希望你能诚实。不是为了我，为了乌萨斯。”"
 focus_kmg.13.a: "“我正是为了乌萨斯。”"
 focus_kmg.13.b: "“我只是想为父亲要个公道。”"
 focus_kmg.14.t: "憎恶"
 focus_kmg.14.d: "“已经全都安排好了，波尔佳。”这是列维托娃走进房间的第一句话。听到这话，萨文科娃轻蔑地挑起嘴角，放下了手头的工作，去拿起了一瓶红酒。\n\n在萨文科娃为酒杯中注入血红色的液体时，列维托娃继续说了下去，“积攒的那批源石已经投入各地的黑市，相信能对能源价格造成不小的冲击。我们在西边的媒体朋友预计会在明天发布关于水电站运作效率和输电安全性的质疑文章。”\n\n“我们正好卡在签订新合同的时间点。这下贝加尔大公那位死老头，只能吹胡子瞪眼，看着他的能源合同被我们抢走了。”萨文科娃将一杯酒递到列维托娃手上，“这下有得他难受的。”\n\n“但是他肯定有反制措施。我们和他打交道那么多年，他不可能不做准备。”\n\n“无妨，局势当然是逐步升级的。”萨文科娃喝下一口红酒，“我们当然也准备了后手。”\n\n“我只是有些担心，杜丁斯科耶港的状况受天气影响太大，也许对计划会有变数。”列维托娃没有喝酒，只是摇晃着杯中的液体，“还有新客户的事……”\n\n萨文科娃伸手搂住列维托娃的腰，拉着她坐到沙发上，“想太多会影响你的判断，加莎，你做庶务太多，思维受影响了。”\n\n“好吧，我相信你。”列维托娃撇一眼萨文科娃，叹口气，“你是知道我有些神经质的。”\n\n“面对贝加尔大公那个狡诈的家伙，多想一些是对的。”"
 focus_kmg.14.a: "“不过日子还长着呢。”"
 event_kmg.7.t: "平常的一天"
 event_kmg.7.d: "当列维托娃在晨光中推开萨文科娃的房门时，她看到萨文科娃只是披着睡袍，坐在书桌边写着她的手稿。列维托娃的嘴角抽动了一下，她忍着涌到嘴边的话语，轻步走到萨文科娃的身后，试探性地问道。\n\n“你……已经知道结果了？”\n\n“如果说具体的细节，我还不知道。”萨文科娃放下手中的笔，伸了个懒腰，“不过嘛，贝加尔大公那个死老头肯定被打得鼻青脸肿。”\n\n“看来你睡得很好，今天这个时间就醒了。”\n\n“开什么玩笑，这原本就是我和纸笔见面的时间，你才是打扰我的人呢。”\n\n列维托娃无奈地笑笑，萨文科娃现在表现得很是轻松，但就在昨天的深夜，她还通过电话向自己传达着最后的布置，以防事情再出变故。和贝加尔大公的这场贸易冲突远比想象中的艰难，或许是某些黑色幽默的原因，已经迈入人生晚年的贝加尔大公在夜晚反而更有精神，所以对方的许多反制措施都在夜间发生。包括列维托娃自己在内，克缅哥罗德的许多人都因为这件事，很长一段时间没睡好觉了，萨文科娃能像以前一样那么早起床写书，着实令她意外。\n\n“所以，你在写什么？”列维托娃知道自己带来的好消息已经没用了，于是把话题转向了萨文科娃面前的手稿。幸好我们不只是通风报信的关系，列维托娃一边把手掌搭在萨文科娃的肩膀上，心里一边这样想着。\n\n萨文科娃重新拿起笔，补完先前还在写的句子，“没什么，这个是记录思路的手稿，不是什么正文。不过我记下了一个好句子。”\n\n“是什么？”"
 event_kmg.7.a: "“我的生活又要成一铁圈，如前一样地转动。”"
 event_kmg.8.t: "陌生的人"
 event_kmg.8.d: "卡托波夫给所有的佣人都放了一天假，视萨文科娃的情况，这个假期还有可能要延长。佣人在离开之前三五成群地窃窃私语，管家是否因为害怕他们看到女大公的失态，毁坏了家族的名誉？或是担心佣人们犯下什么刺激到女公爵的错误，从而引来不必要的麻烦？\n\n老管家并没有制止这些猜测在佣人之间的传播，比起军营里的错误情报和谣言，这些流言蜚语处理起来太过容易。卡托波夫驱散佣人们的原因很简单，他了解萨文科娃，在遇到无法承受的挫折时，这个小女孩会把自己锁在房间里，让她的情感和思绪在脑海中厮杀。当房门再次打开时，出现的只会是角斗笼中幸存下来的胜者。\n\n列维托娃同样清楚萨文科娃的秉性，所以她在自己的那座小楼里承担下了贸易战失败的所有压力，而卡托波夫手下那些跑来“汇报情况”的军官，也被他打发走了。贸易冲突的失败，有不少的败因就出在军事行动的糟糕表现上，要是让这些没有眼力见的家伙们进了公爵府，他们可能都没法活着出去。\n\n卡托波夫听到楼上传来了动静，萨文科娃内心的战争估计已经结束了。上校并没有急于上去察看女大公的情况，他还在忙着把即将放进珐琅锅里炖煮的肉块煎上色。在煎肉的嗞嗞声中，萨文科娃的脚步声越来越近，最后终于来到了上校所在的房间。\n\n“上校，这个时候就开始准备晚餐了吗。”萨文科娃的声线似乎又冰冷了几分。\n\n“小姐，这种高卢式炖菜需要提前几个小时做准备。”卡托波夫没有回头，他知道，萨文科夫家族的人都不喜欢做事分心的家伙。尽管如此，他还是在做菜的空档中瞥了一眼萨文科娃。她的状态似乎与从前没有太多不同，只是不如往常精神，她只是站在厨房的门外，好像在观察卡托波夫久违的亲自下厨，但眼神似乎又飘去了其他地方。\n\n“上校，你是不是让仆人都回去了。”萨文科娃突然问道。\n\n“是的，小姐，我让他们提前回去休息。”\n\n萨文科娃的眼神不易察觉地黯淡了几毫秒。“以后我没命令你做的事，你不要做。”这句话被冰冷地吐出来，不带任何感情。\n\n“遵命，小姐。”卡托波夫没有停止手上的动作，头也不回地回答道。萨文科娃的脚步再次响起，不过这次是逐渐远去。直到烧热的铁锅把卡托波夫的手指烫了一下，老管家才回过神来。\n\n萨文科娃从未干涉过卡托波夫对府上的管理，今天是第一次。如果是其他时候，卡托波夫可能会觉得她只是一时兴起，但是事情发生在贝加尔大公将她打倒后，卡托波夫只能想到最坏的那个结果。"
 event_kmg.8.a: "在笼子里幸存下来的不是他熟悉的那个小女孩了。"
 focus_kmg.15.t: "死亡是不讲什么法律的"
 focus_kmg.15.d: "“你听说了吗，佛尼埃，女公爵要给咱们发工钱呐！”佐治·罗普什兴冲冲地冲进棚屋里，头顶上的矿工头灯都没顾着摘下来，“说是咱们的工钱，以后就和那些没感染的工人一个样儿了！”\n\n躺在板床上的男人翻个身，冷哼一声，表达着他的不屑。看自己的高涨情绪得不到回应，佐治的劲头泄了八分，但他仍然坚持着他的表达欲。“我说的可是真话。我去城里的时候，听到不少体面人都在说这事！他们脸上的表情难看着呢，假不了！”\n\n佛尼埃不想问佐治那小子是怎么溜出矿场、溜进城里的，但是他的描述确实让自己好奇了。他又翻个身，坐起身来，咳嗽两声。“他们怎么说的？”\n\n“说是女公爵打算给咱们发工钱，无论多少，都要发。还有给矿上配什么消防设备，这玩意我听不懂。”\n\n佛尼埃冷笑一声，摸了摸自己下巴上的胡茬和胡茬里突出来的源石颗粒，“类似的把戏我见多了，二十年前大叛乱刚结束，圣骏堡的那个小皇帝就说过类似的话。结果呢？你我现在还在这样的破矿场里。”\n\n“可是，我看着那些体面人脸色那么难看，我猜女公爵这回说的是真的……”佐治不愿放弃他的幻想，不过被年长他几岁的佛尼埃这么一说，他确实有点动摇，“她和那个皇帝，应该不一样吧……？”\n\n“女公爵？哈！”佛尼埃的轻蔑更加一层，“佐治，你毕竟还是太年轻，有些事情，你不去问就一辈子不会知道。女公爵她的老子，就是当年的叛乱主谋之一。”\n\n佛尼埃说着，一边撩起自己的衣服，露出自己腹部的伤疤，伤疤周围的皮肤已经布满了源石结晶，“就是她爹的部队，在打进我住的镇子以后，把整个镇子杀成了一个空城。我的矿石病就是因为他们染上的，那些该死的兵一刀划开了我的肚子，然后飘散的源石粉尘钻进了这个大洞。”\n\n“我当时只有十岁，你还没有出生。”佛尼埃察觉到自己有些激动，他站起身，拍了拍一脸震惊的佐治，“我不是要骂你，我只是希望，你作为感染者，不要总受那些老爷的骗。”\n\n一天后，佐治激动地跑进了棚屋中，还一边喊叫着，“佛尼埃，我说的真没错！工头真的要给咱们发钱！”\n\n但那张板床上并没有佛尼埃躺着哼哼的身影，而另一个感染者后脚跟着他进了屋，拍了拍他的肩膀。“佐治，工头让我过来收拾他的东西。”\n\n“他怎么了？”"
 focus_kmg.15.a: "“5号矿坑塌了，他在里面。”"
 focus_kmg.16.t: "人生是没有正义的"
 focus_kmg.16.d: "佐治·罗普什又一次溜进了城里，他在被扔进感染者矿场之前，一直在西乌萨斯的几个大城市里当扒手。他的矿石病是从母亲身上遗传下来的，而她的母亲是贫民窟里的一个妓女。\n\n在有一次因为不长眼偷了一名正在休假的军官后，他被扔进了感染者矿场，然后几经辗转被发配到克缅哥罗德城外的一个小矿上。在那个小矿场，工头和经理都不是什么好东西，工头是没感染的大老粗，身强体壮但是就是不下矿，经理则是一个只想着赚钱的酸腐家伙，只有他遇见的那个叫佛尼埃的老矿工是个好人。\n\n说佛尼埃是个“老”矿工，其实他也就比佐治大了一轮。他在矿上经常护着这个瘦小的年轻人，闲暇时候还经常给佐治讲人生经验，虽然他的半辈子也是在感染者矿场度过的。\n\n克缅哥罗德正在扩建和翻新，城里多出了许多工地。由于萨文科娃的慷慨补贴政策，一些城里的老房子也在翻新，佐治走过一条街，就有两三座老房子里传出装修的嘈杂声，有些建筑工人直接就把材料摆在屋外。佐治顺手拿起一袋铁钉，塞进包里。\n\n转过街角，一家杂货店出现在佐治眼前，佐治看了看，店里只坐着一个打着瞌睡的秃顶老头子，于是他径直走了进去。\n\n晚上，当佐治绕过守卫溜回矿场，赶在工头点名之前站进队伍里时，杂货店的老板正在被他的妻子指着鼻子数落。"
 focus_kmg.16.a: "原因是店里丢了一大包白糖。"
 focus_kmg.17.t: "我的血使我痛苦"
 focus_kmg.17.d: "“女公爵大人，您突然来访，在下有失远迎啊！”谢尔戈夫向着走下车的萨文科娃夸张地鞠了一躬，他给萨文科娃的第一印象并不好，因为这个家伙的衣服过于干净了。萨文科娃这几天已经巡视过几个矿场了，她新聘请的那些矿场经理显然比谢尔戈夫接地气得多，眼前的这个经理，干净到了似乎根本没在工作的样子。\n\n“没关系，谢尔戈夫。”不过萨文科娃不是来处理人事安排的，她只是想弄明白这个地方的储量还有多少。随着局势越来越紧张，萨文科娃需要统筹领地内所有的资源，即使是这个小矿场她也不能忽视。“西装不错。”\n\n“哪里哪里，都是便宜货。”谢尔戈夫堆笑着，把萨文科娃领到了矿场的小楼里。这是一座修建了很多年的小楼，只有两层，在矿场充当办公之用，顶层的阁楼里则分给一些技术人员用作宿舍。谢尔戈夫的办公室在二楼的尽头，面向着矿场的主要部分——那一座裸露着源石矿床的小山。\n\n萨文科娃在谢尔戈夫的办公室里坐下，虽然这个地方理论上的主人是矿场经理，但萨文科娃自然地坐到了主桌前，而谢尔戈夫当然不会说什么。“谢尔戈夫，我先问个问题。听说你这里前些日子发生了矿难？”\n\n“呃，没错。”谢尔戈夫脑门上浮起一层薄汗，不过很快消退掉，“我们这最近的一次事故，是那边的5号矿坑。由于那些奴工们在建造加固设施时故意怠工，结果他们自己吃了苦头。不过您放心，5号坑我已经安排人重新清理了，现在早就恢复运作了。”\n\n办公室的门被粗鲁地打开，一个健硕的身躯走了进来。谢尔戈夫看到来人，似乎是抓住了救命稻草，“大人，这位就是我们的工头，他可以和你说明那次事故……”\n\n工头看看经理，再看看坐在办公桌后的萨文科娃，然后自豪地拉开嗓子，说道，“5号坑的事故只造成了6个感染者死亡，然后在一个星期内，我们就完成了清理工作，并且加固了矿坑结构。”\n\n“至于善后工作……当时是有一批感染者借此闹事。”工头说着，捋起袖子，刻意秀了秀肌肉，“我可是在萨尔贡当了几年保镖。这群人最后都被我治的服服帖帖。”\n\n正当工头卖弄自己的经历时，萨文科娃左后方的那扇窗户突然碎掉，一个挂包砸破窗子，飞了进来，掠过萨文科娃的脑袋边上，落在工头和经理之间。还没等两人反应过来发生了什么，萨文科娃就一把掀翻了桌子，趴在了后面。\n\n当萨文科娃再次睁开眼睛时，她面前是卡托波夫上校，老管家此时穿着他很久没拿出来的军装，精致的军官白手套拍打着萨文科娃的脸颊。空气里弥漫着灰烬和血腥的味道，萨文科娃感觉有些温热的粘稠物从自己的额头上流下来，然后便是脸颊上的刺痛。“叫医生过来，小姐醒了！”卡托波夫看见萨文科娃的眼皮缓缓打开，立即转头呼唤着他身后的士兵，“小姐，你怎么样？”\n\n萨文科娃抓住卡托波夫的手，在老管家的帮助下缓缓起身，眼前是一片狼藉的矿场办公室，分散的钉子插在了屋子的各个角落，房间中央横陈着两具可悲的尸体，上面同样扎满了铁钉。看来那个喜欢吹嘘的工头和惹人厌的经理已经退出生物圈了。萨文科娃深呼吸一口气，她似乎除了头上受了点伤，四肢和内脏都完好无损，不过爆炸的冲击力让她感觉有些晕，一个没站稳，她再次倒在了老管家的身上。"
 focus_kmg.17.a: "“该死的……这帮家伙需要付出代价……”"
 focus_kmg.18.t: "源石出口问题"
 focus_kmg.18.d: "“……由于我们私自进行的源石开采并未得到帝国当局许可，因此除已登记的矿场以外，产自公爵领的源石矿无法通过正规渠道售出。这一情况可能可以通过将贝加尔大公领排除在能源交易市场以外而得到改善。\n\n“由于黑市贸易的秘密性和风险性，当前我们只能选择较为单一的源石出口方向。其一为通过炎国的帮派或莱塔尼亚的地方贵族作为中间商，将源石矿洗白后投入国际市场，此方案虽风险较大、回报周期较长，但收入可观。其二为联系乌萨斯境内黑市经营者，将源石矿在乌萨斯境内出售，此方案执行难度小，但本土黑市商人的信用水平不高，且易受到黑市价格波动影响。”\n\n看完手里的报告，萨文科娃叹了口气。一个小公爵想做点生意还真不容易。思索片刻后，她在这篇报告下方写下了批注："
 focus_kmg.18.a: "对外进行销售。"
 focus_kmg.18.b: "利用本地黑市。"
 focus_kmg.19.t: "一把尖锐的刀"
 focus_kmg.19.d: "佣人们没有人能拦住鼻子里喷着气的帕维尔·索夫钦斯基，首先他们不敢动手，其次他们是真的没能力拦住。就这样，这个愤怒的商人从公爵府的门口一路冲进了萨文科娃的书房。穿着日常的贵族服饰的萨文科娃笔下正写着她的下一篇小说，她对于把门砸开冲进来的索夫钦斯基并没有感到意外，只是抬手指了指书架旁的沙发，示意他坐下。\n\n在气头上的索夫钦斯基当然不会乖乖坐下，他走到萨文科娃的书桌前，双手撑在书桌上，“公爵小姐，我需要一个解释。为什么要建立什么‘最高经济委员会’？你分明很清楚这种制度对于我们企业家来说意味着什么！”\n\n“帕维尔，我现在在忙。”萨文科娃抬眼瞪着索夫钦斯基，“坐——下——”\n\n索夫钦斯基被这么一瞪，气焰散了七分，他悻悻地走到那张沙发上坐下，但嘴皮子还没停下来，“公爵小姐，你知道的，会采用这种制度的只有一种人，那就是那些马佐夫主义者，他们不相信市场能给泰拉带来好处。”\n\n萨文科娃没理会他的牢骚，继续着手里的工作。过了大约十多分钟，她才把手稿和笔墨收起来，整理完面前的书桌，把自己挪到了索夫钦斯基旁边的沙发上。\n\n“老妹，不是我一个人有意见。”索夫钦斯基见萨文科娃过来，迅速转变到套近乎的状态，身子屈着往前，压着声音说道，“你知道的，我帮你联系了好一些企业家朋友，来支持你的事业，而且你这儿的不少商人，他们人挺不错的，我也和他们处挺好。但这个最高经济委员会，对咱们的限制太大了，我各行各业的朋友都对这个有意见，我也是帮人家表达一下意见嘛。”\n\n“现在是战时，我希望你能够理解。”萨文科娃冷冷地说着，“况且，我不认为在整个东达利亚都乱成一锅粥的情况下，你们有什么生意可以做。”\n\n“这话说的！”索夫钦斯基苦笑着，拍了一下自己的大腿，似乎像表现出自己的从容，只不过实际效果是相反的，“有了商界的支持，咱们才能尽快从战时体制转向正常化，经济才能尽快恢复嘛！况且，我们和外国人也有生意可做，现在打起仗来了，矿石什么的肯定不好卖吧？”\n\n萨文科娃的表情仍然没有太多波动，她按了一下传唤铃，一位女仆端着装着酒的托盘进了房间。女仆娴熟地倒好两杯酒，放在了萨文科娃和索夫钦斯基手边的小桌上。\n\n“帕维尔，我给你一个补偿。”当索夫钦斯基拿起酒杯、啜饮红酒时，萨文科娃发话了，“这个最高经济委员会，会有你的一个位置。”\n\n萨文科娃拿起酒杯，晃动着里面的葡萄酒，“你可能失去了一点点利润，但是你获得了权力。作为回报，我希望你能够运用你的聪明才智，让最高经济委员会这把尖刀，把我们的经济裁切成一个理想的状态。”\n\n索夫钦斯基愣了一下，然后他的嗅觉告诉他，最好接受这个条件。因为萨文科娃开出的第一个条件，一般是最好的那一个。"
 focus_kmg.19.a: "而他还不打算被这把刀刺中。"
 focus_kmg.20.t: "专心忙他自己的事"
 focus_kmg.20.d: "萨文科娃并不经常睡懒觉，她的作息一直很规律，并且她也不是喜欢久睡的体质，所以，她今天中午才起床这件事显得十分罕见。萨文科娃翻了个身，在床上坐起，门外的女仆便轻轻叩响了房门。\n\n“小姐，苏洛金博士今天很早就来找您了。现在他在书房等您。”\n\n“知道了，我一会就去见他。”萨文科娃伸了个懒腰，走下床，将睡袍解下，扔在床角，“对了，他是不是脸色不太好？”\n\n过了十多分钟，在书房坐立难安的彼得·苏洛金听到扭动门把的声音，急切地站起身来。走进屋子的萨文科娃脸上带着歉意，眯眼微笑着，“抱歉了，教授，让您等那么久。昨天晚上与企业家们的晚宴，我喝的酒有点太多了，恢复精神花了我不少时间。”\n\n“没必要道歉，萨文科娃小姐。”苏洛金教授布满沟壑的脸上堆出一个微笑，“在你的这个位置，有些应酬是不得不做的。”\n\n萨文科娃“呵”的笑了出来，“您才是没必要故弄玄虚，教授。我知道你对我放过那些商人很有意见。在决定与他们进行商谈的那一刻，我就知道你今天会来。”\n\n苏洛金坐直起来，正准备说什么。萨文科娃摆摆手，继续说着，“您提出的统制经济的方案，我对其完全认同。但您是政治学的教授，您也知道，政治是妥协的艺术，而作为一个小政权，我们并没有太多妥协之外的选择。”\n\n苏洛金叹了口气，透过他的那副金边眼镜看着萨文科娃，“小姐，我并不是因为你是否认可我的方案而来的。我的考虑同样出于政治层面。如果在政权初创的这一时期，不能通过强制的行政手段实现对经济的绝对控制，那么之后这些寡头们脱离我们的掌控，只会是时间问题。”\n\n“这就是为什么我需要你，教授。”萨文科娃微微颔首，“妥协是我们不可避免的现实，但我相信你一定能想出后手。”\n\n苏洛金冷笑一声，眼神撇向侧边，“呵，政策制定那是你们当权者的事情了。我只是个忙着研究学问的老头子罢了。”\n\n“帕维尔·索夫钦斯基与他的朋友们也只是一群忙着埋头赚钱的老头子。”萨文科娃微笑道，“他们可没心思管你的学问。”\n\n“若想指挥这些凭着本能朝金钱冲刺的动物，对你应该不是什么难事。”萨文科娃说完，懒洋洋地靠倒在了沙发上，“每个人都只会专心忙他自己的事。”\n\n苏洛金再次冷笑一声，但这一回他的眼神回到了萨文科娃的身上。“你说的倒是没错，萨文科娃小姐。”"
 focus_kmg.20.a: "“我蔑视他们。”"
 focus_kmg.21.t: "劳动，祖国"
 focus_kmg.21.d: "“坦白地说，我不明白您为什么会考虑这个问题。”彼得·苏洛金看完了萨文科娃的计划，微笑着把那几张纸甩在桌上，“我们不需要照搬这个来自那些堕落国家的制度。工会完全可以归政府控制，由我们去指挥工人们，远比那帮乌合之众们的‘自治’高效得多。”\n\n老管家卡托波夫轻轻咳嗽两声，“苏洛金阁下，我想提醒您的是，小姐是希望通过保留工会来获得工人群体——尤其是西部的工人的支持。”\n\n“并且保留工会的部分独立性和我们控制工会并不冲突。”罗兹耶夫斯卡娅补充道，“通过宣传手段和行政手段，我们完全可以驯化工会。”\n\n萨文科娃看着房间里的幕僚，嘴唇紧紧抿起，显然有些举棋不定。她明白控制工会的好处，但她怀疑目前的小公爵领能否承担这一决策的行政成本。实际上她也准备了两份计划，只不过她只把其中一份丢上了这次临时的小会议。\n\n“帕维尔，你是商人，我想听听你的意见。”萨文科夫转向站在窗边抽着烟的索夫钦斯基，把问题抛给了他。\n\n索夫钦斯基把雪茄从嘴里拿开，吐出一口烟雾，烟草的刺激也难掩他脸上的厌恶之情。“我吗？公爵女士，你知道的，工会就是赤匪们的聚集地，我巴不得他们死绝！”\n\n“波尔卡。”列维托娃凑到她耳边，小声说着，“无论你如何决定，这项决定都很难更改。收回对工会独立性的承诺，或是把整合好的工会组织重新放出来，我们都会面临极大的阻力，改变决定的行政成本也会更高。尤其在我们统一这片大地以后。”\n\n萨文科娃无奈地笑笑，向后倒在沙发上。深呼吸一口气后，面对房间里的幕僚，她作出了决定。"
 focus_kmg.21.a: "“留着工会吧，我们可能还用得着它。”"
 focus_kmg.21.b: "“教授说得对，把工会整合进政府对我们来说更好。”"
 focus_kmg.22.t: "我们是……"
 focus_kmg.22.d: "一辆汽车从萨文科夫家的宅邸驶出，穿过了正在戒备战争的克缅哥罗德城，来到了位于城市另一端的军队司令部。没有任何仪仗队的欢迎程序，萨文科娃径直走进了会议厅之中，她约见的三位将军早已在此等候多时。\n\n“诸位，我就长话短说吧。”萨文科娃环视了屋子里的三人，谢尔盖·恩弗隆、维克托·拜德拉科夫、阿纳斯塔斯·冯西亚茨基，某种程度上，这几个人各自代表了军队和政府里的不同派系。虽然派系斗争不会威胁到萨文科娃本人的地位，但她也希望这些人在自己手下不至于混得不愉快。\n\n“关于军队是否要保持独立，我想征求一下你们的意见。你们都知道，卡托波夫上校是个坚持传统的军人，他认为军队不应该受到政治和意识形态的影响。但是我们要建立的是一个崭新的国家体制，所以我想知道，你们有没有什么新的想法。”\n\n冯西亚茨基首先发言：“我的经历告诉我，您对黑色卫队的安排是无比正确的，因此我认为，其他部队也应该像黑色卫队一样，将意识形态贯彻在部队建设当中。”\n\n“我反对。”拜德拉科夫慢悠悠地发言，不出意外地遭到了冯西亚茨基的怒视，“军人都是很单纯的，您只需要简单地命令他们就行了，不需要再向军队中灌输什么理论。这只会挤占训练和现代化改革的资源。”\n\n谢尔盖·恩弗隆此时举起了手，他咽了一口唾沫，看向萨文科娃。“公爵女士，我无意冒犯您的父亲。但是如果我们像帝国的体制一样，给予军队过多的自主权，那么出现像老公爵那样的叛乱将是不可避免的，至少在理论上如此。”\n\n萨文科娃沉思了几秒钟，然后摆出一副标准的微笑，“诸位，很有价值而且很有效率的讨论。我会尽快做出决定，然后再与各位商讨具体的实施方案。”\n\n三人依次退出会议厅，萨文科娃摘下头顶的军帽，捧在手里。她抚摸着军帽上剑与荆棘的徽记，最终决定……"
 focus_kmg.22.a: "……乌萨斯的军队。"
 focus_kmg.22.b: "……人民共和党的军队。"
 focus_kmg.23.t: "瓦尼亚和他的水管"
 focus_kmg.23.d: "“嘟——嘟嘟——”一长两短的汽笛标志着正午过一刻，意味着午饭时间到来。年轻的乌萨斯工人瓦尼亚活动了一下僵硬的双腿，从运作的流水线上下来，不顾手上沾满的油污，翻找起自己的午餐篮子。\n\n今天的午餐是用报纸包着的三个带皮土豆、一撮盐和一小撮蛋黄酱。也不必洗手，用手一捏把土豆的外皮撕下来，就能凑合着填饱肚子，浪费了营养丰富的土豆皮，但至少午餐不会有机油的味道。\n\n瓦尼亚把饭前祷告和土豆一起填进肚子里，盯着厂房的吊灯发呆。自从长到能够看清楚机器上在加工什么开始，瓦尼亚就在工厂里当学徒，他在工厂里居住的时间比在自己家里的时间更久，还没满二十岁的瓦尼亚已经是一位熟练的工人了。工头总是说瓦尼亚真是个标准的好小伙子——在东乌萨斯的工厂，这句话一般指脑子里几乎什么都不想，斗大的字不识一筐，力气比裂兽都大，酒量好的像是酒桶，然后还能把拉特兰正教里神和几十个不同圣徒的名字倒着背出来。\n\n瓦尼亚确实是这么一个标准的小伙子，他的人生几乎只有干活，祷告，讲黄段子以及下班了和工友们一边喝酒一边痛骂老板。除此之外，他的世界里几乎没有什么别的东西。所以瓦尼亚并不知道，他工作的这个水管厂到底有什么蹊跷。\n\n没有人会用7.62毫米内径的水管输水，这么窄的内径，水龙头出来的那点水连浇花都不够。也没有人会用整个的钢坯去钻出一根水管，只要输送水的话，把金属材料卷起来焊牢就好了。\n\n瓦尼亚更没心思搞明白为什么他们做完的管材还要拿去用专门的机床切削内部。只要萨文科娃小姐能按时发这笔工资，随便他生产的是什么东西都好。\n\n“嘟嘟——嘟——”汽笛又响了，瓦尼亚喝了口水，把嗓子眼里的最后一口土豆冲下去。"
 focus_kmg.23.a: "“该干活了。”" 

#文本提示
 KMG_white_tt: "§W……有一匹白蹄兽，骑在蹄兽上的拿着弓，并有冠冕赐给他。他便出来，胜了又要胜。§!"
 KMG_black_tt: "§g……有一匹黑蹄兽。骑在蹄兽上的手里拿着天平。我听见在四活物中似乎有声音说：“一钱银子买一升麦子，一钱银子买三升大麦，油和酒不可糟蹋。”§!"
 KMG_red_tt: "§R……另有一匹蹄兽出来，是红的。有权柄给了那骑蹄兽的，可以从地上夺去太平，使人彼此相杀，又有一把大刀赐给他。§!"
 KMG_pale_tt: "§L……有一匹灰色蹄兽。骑在蹄兽上的，名字叫做死，阴府也随着他，有权柄赐给他们，可以用刀剑、饥荒、瘟疫野兽，杀害地上四分之一的人。§!"


