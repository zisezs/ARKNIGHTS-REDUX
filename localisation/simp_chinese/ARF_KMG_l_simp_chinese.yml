 focus_kmg.24.t: "揭开印迹"
 focus_kmg.24.d: "夕阳光芒穿越微微打开的窗户，映入屋内，照耀在老人脸上。电视机的亮度与声音都被调到很低，但电视音响传出的广告声依然能够使人清晰听见。在暖色的灯光下，她的手缓缓移到了沙发左侧的小桌子上，自文件收纳架中抽出了一本相片册。翻开它的第一页，那签名使老人想起了许多。\n\n“尤莉亚·阿纳托利娃·安特洛娃”，那是她在几十年前的名字。而如今，她早已改名易姓。社区里的孩子们都叫她娜塔莉奶奶，只知道她是为慈祥的老婆婆，却不知道这个名字，以及一段人们都不知道的往年旧事。\n\n1076年4月19日，这一天对于娜塔莉，抑或那个她已近乎忘记的名字——尤莉亚而言无比使人印象深刻。在那一天，尚且年轻的她加入了第六集团军旗下的一个步兵团，并就此走上了一条偏离原本生活轨迹的道路。事实证明，这个选择不亚于在伊戈尔起义时加入骏鹰军。因为时间还没过去一整年，“大叛乱”便被平定。而当尤莉亚听到这个消息时，她也“加入”了被帝国通缉的叛贼之列。于是，当年的尤莉亚不得不在少数几个还愿意收留她的亲朋好友帮助下逃到东达利亚，并将身份与一位父母双亡，亲友全无的失踪之人互换，自此有了娜塔莉这个新名字。而在这之后，她才得以安定下来。\n\n可即便过了这么多年，她依旧对“大叛乱”记忆犹新。她还记得那位将军，也还记得在部队中的战友们。她知道他们不是官方口径中毫无人性，邪恶且丑陋的叛匪，而是一个个鲜活、生动且具体的人。她还记得，但已经不希望再去想起这些事了。娜塔莉放下了心中曾存的那个尤莉亚，将目光看向电视。广告已经结束，可最现在正播放的节目却将她重新拉回了近三十多年前。\n\n“晚上好，各位观众朋友们。今天，我们将把视线放到历史上来，这次谈论的话题的确比较沉重，因为它就是那场在当年对我们乌萨斯影响深远的第一次‘大叛乱’。让我们连线一下瓦西里教授。”\n\n“……没错，我在这里要同各位说的观点可能会有些颠覆常知。但大家要明白的是，第一次‘大叛乱’绝不仅仅是一场如其名字所述的‘叛乱’而已。事实上，它是一场革命，一场为推翻圣骏堡腐朽政权，争取人民利益的伟大革命——是具有重大历史意义的。”那位教授的每句话都如巨锤般击打着娜塔莉，抑或说尤莉亚胸口的无形巨石，直至将其击碎。当她从巨大震惊中缓过来时，才意识到自己的衣领已被泪水打湿。"
 focus_kmg.24.a: "历史之风终究吹散落叶。" 
 focus_kmg.25.t: "街道之花"
 focus_kmg.25.d: "每次上班通勤，走过此段路程之时，米哈伊尔都会感到一丝发自内心的异样。而在今天，这种感受愈发清晰鲜明，也愈发令他感到不自在。\n\n以往，米哈伊尔去镇上那家小工厂的上班路上总是有着五光十色的各类招牌与广告，从面粉食品到药物家具无所不有。可随着大动乱再度降临东达利亚，在某一日，一群声称效命于“克缅哥罗德民族共和国”的士兵进入了镇子，并宣布以波尔卡·萨文科娃与乌萨斯人民共和党的名义接管此地。自此之后，那些招牌广告便被逐个取下，转而替换为了画着荆棘剑、双头鹰或是描绘一个穿军装的年轻女子的画像的海报——此人的样貌令米哈伊尔想起了曾经搅动乌萨斯数十年动荡的萨文科夫公爵，或许她正是这位将军的后人？米哈伊尔如是所想，但这并不是那些海报关键点，真正的重点在于就在不久前完成的“翻修”。\n\n在那些施工的日子里，他常常看到许多看上去十分可疑的陌生面孔穿过街道，以及被布料之类掩盖得严严实实的施工现场。米哈伊尔曾问过一个工人模样的人他们到底是在做什么，却只是被简单地搪塞过去，而这也使他内心之中更起了一层怀疑。“为什么翻修个海报都要搞成这样？”有时，他会这样问自己。而在工程结束，那些海报再度焕然一新之时，他的疑虑也愈发加重。\n\n米哈伊尔转头看向右方，那是一幅在街道上十分常见的画像，辅以花体的乌萨斯文“萨文科娃领导我们！”。它是如此寻常不过，可当视线与画上人物的眼睛对齐之时，米哈伊尔却只感觉那异样达到了极点。那眼睛并不如古典时代的雕像那般无神，而是充满力量，仿佛警告着每一位公民他们服从领袖的义务。而在恍惚之间，米哈伊尔似乎感觉那眼睛微微地向左转动了一些，可他的理智又告诉自己这显然是不可能的。于是，在隐秘的微型摄像头视野中，米哈伊尔·伊万诺维奇·戈哈列夫继续向前走去。\n\n与此同时，在一个秘密的监控室中，一位警官正通过无数个这样隐藏在暗处的摄像头，监视着小镇的一切。而他手边的档案袋中所藏文件则记录着小镇中线人带来的镇民身份信息与政治倾向报告。在其中的第二百三十四页上，正记录着关于米哈伊尔·伊万诺维奇·戈哈列夫的一切。"
 focus_kmg.25.a: "“男、乌萨斯族、锯木厂普通工人、已婚、无政治倾向表现……”" 
 focus_kmg.26.t: "最终清算"
 focus_kmg.26.d: "尼古拉·古米廖夫明白，自己的生命已经快要到达尽头。坐在牢房的床上，望向被铁栏杆分割的窗外。他多么希望这时能有人走过来告诉他被赦免的消息，可这种事情发生的概率显然不会高于监狱在下一秒毫无预兆地轰然倒塌。追思往昔岁月，后悔的情绪充斥着文学家的内心。“要是当年找到别的机会，不向东达利亚，而是往国外去。或者是来东达利亚的时候就尽可能地远离那个‘元首’……我估计也不至于落得如此境地。”古米廖夫一边这样想着，一边翻开了他的笔记。\n\n万幸，即便他已经离死差不了多远，监狱依然给这位前文坛巨擎留了些“人文关怀”，而这本笔记本与那支由他挚友所赠的钢笔得以保留便是其中的一部分。而感谢这些“临终关怀”，他在铁窗之内仍能继续旧有思绪，继续过往的诗歌创作。可提起笔，古米廖夫才意识到自己已经有好几天写不出任何东西了。瞧瞧这些天他写得都是什么？或许是由于被永远顶在后脑勺上的铳口指着，他的精神都快和错乱没了界线，写出来的尽是些空有哀叹的胡言乱语。而如今占领他脑子的，和这些纸面上的胡言乱语或许没什么两样。\n\n“尼古拉·古米廖夫先生。”正当他放下钢笔，再度躺在那张简陋且令人不快的小床铺之上时，一个声音自牢门外传来。他再度坐起来，缓缓地看向门外。此人看上去打扮不同于守卫，反而穿着身他没见过的制服，这令古米廖夫心中联想到了些不好的事情。而不幸的是，他的联想和事实差距不远。\n\n“古米廖夫先生。在下委婉地跟您说，元首下了命令，您可能看不见下周一的太阳了。”当这句话被那男人说出口时，古米廖夫的内心并没有感受到任何惊讶或是多么不安，他只感受到了麻木——或者说，一种死之将至的无力感。他想起了同妻女踏上那艘高速陆行舰的时刻，也想起了自己仍在政府中时的往日种种。政治就是这么残酷的东西，一个不掌多少实权的官员，仅仅因为思想观点的偏差便要被处死。“或许，这就是乌萨斯历朝历代的传承吧。”古米廖夫如是所想。他只希望，自己的妻女不会因此遭受株连。毕竟，他自被关进监狱以来便再也没有听到与这两位亲人相关的任何消息。"
 focus_kmg.26.a: "某处，蓝色羽兽展翅飞翔。" 
 focus_kmg.27.t: "贝加尔垂钓"
 focus_kmg.27.d: "趁着少有的休息日，瓦西里耶夫又一次来到了这座桥边。钓竿崭新得冒光，饵料无比充沛，而“打窝”的位置更是得天独厚。更棒的是，得益于他在捕鳞论坛上联系到的那位钓友，他这次还能把钓上来的鳞全部现烤现吃。\n\n“这生活！简直美到不可思议的程度了！——话说，你带了调料吗？”瓦西里耶夫将那截小玉米挂在钩子上，朝着钓友说道。\n\n“当然啦，还带了番茄酱。”钓友没有急着去钓鱼，而是转而自他的汽车后备箱中取出了张折叠椅。“说真的，每次看到那座大坝，我都会想起它还挂着贝加尔大公的旗子的时候。”\n\n“贝加尔大公？谈起这个头衔，我倒是想起了一些。”瓦西里耶夫的墨镜反射起阳光。“你谈这个，是想说起啥啊？那老头子我以前听说过，他手底下的文官们据说相当厉害。”\n\n“可不止是文官，他真正的拿手好牌，还得是这些大坝。或者说，一整套的能源体系。”钓友在经过与“乌式轻工业”的几番斗争后可算勉强打开了折叠椅，并小心翼翼地坐下。\n\n“天杀的，这椅子咋这么烂……”钓友大发牢骚。“我们还是说回贝加尔大公吧——当年中东达利亚贸易战，他就靠这堆水电站跟萨文科娃女公爵狠狠地对着干，但现在呢？你还记得开车过来时候我跟你讲的新闻吧。”\n\n“哦？‘贝加尔能源公司完全整合入中央电网’？那联系过往的话，这听起来就有点像是正式的胜利公告了，哈哈。”瓦西里耶夫爽朗大笑，并奋力地甩出了钓竿。\n\n“大概就是这个意思吧！”钓友朝着另一个方向也甩出了他的钓竿。“我以前还在那里上班的时候，对贝加尔大公的纹章相当印象深刻。刚开始上班的时候，我还以为它是个怪物的狰狞獠牙，可到了后面，才意识到那其实是个大坝！”\n\n钓友凑了过来，掏出他的移动终端点开图片。“你看，是不是很像？”"
 focus_kmg.27.a: "“哈哈！我第一眼也看错了。”" 
 focus_kmg.28.t: "青年试炼"
 focus_kmg.28.d: "与无数与他年纪相仿的少年男女们一同站在操场上，布亚诺夫既感到心潮澎湃，也对在他青年团未来生活的未知与不确定而怀有一丝紧张之情。直至已经成为这个组织一员的现在，布亚诺夫对萨文科娃青年团的了解仍旧相当之少。他最初是在家里的电视上听说了其的成立，依稀记得那时主持人的表情和语气相当激动，并声称这“象征着领袖的伟大远见”、“是克服心灵瘟疫的一剂良药”云云。而就在他看到这则报道过后没过多久，便有政府工作人员上门同布亚诺夫的父母沟通，并最终把他带来了这个静静驻扎在河边的营地，以体会这“良药”可否真的能够战胜“心灵瘟疫”。\n\n少年咽下口水，略微调整站姿。“我到底站在这里有多久了？”他如此想道，可还未给出答案，布亚诺夫的思绪便被自他前方传来的声音打断。\n\n“各位新晋的团员们，共和国未来的前锋们。”那讲台两侧的扩音器可算履行起了它的职责。“相信你们中的许多人仍对加入萨文科娃青年团的意义不甚了解，甚至于对这件事本身怀有少许抵触之情。但我相信，各位必将在这段旅程中获得对你们的前途，乃至于整段人生都大有裨益的收获。我想说的是，萨文科娃青年团不仅仅是一个能使年轻人们能够得到历练的组织，更是你们自乳臭未干的孩子成长为一个真正的、完全的人的必经之路……”\n\n就这样，布亚诺夫听着这冗长的演讲，又连续站了半个钟头。而在演讲结束之后，他终于得以与其他团员一同真正前往训练场一试身手。在经过被铳械拆卸重组、打靶射击与战斗姿势训练填满的整个下午后，布亚诺夫最终拖着疲惫之躯随着队伍来到了集体宿舍——他在未来要长久生活的地方。这里从布置到色调似乎都展现着一股军事化风格，甚至连床上被子都被叠成了四四方方的造型。靠在被漆成军绿色的走廊墙上，少年终于得以长舒上一口气。“你别说，这种‘准军旅生活’似乎还不错。”他自言自语道。远处，太阳正缓缓落下。对于布亚诺夫而言，他在萨文科娃青年团的第一天已然结束。"
 focus_kmg.28.a: "未来还会更好吗？"
 focus_kmg.29.t: "杜丁斯科耶的发展"
