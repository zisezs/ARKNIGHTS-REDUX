 KMG_ART_OF_CONQUEST_desc: "我国的国家民粹体制具有极为特殊的属性，她的经济与军事体制是一把可怕的双刃剑：在中短期战争中，我们将爆发出惊人的战斗力，以至于综合国力超越我们所占有的物质条件……然而意志的胜利总是暂时的，物质资源的胜利才是永固的——我们会在持续的战争和动荡中因为过度动员而不断“失血”，如果不能尽快统一全国、获取全乌萨斯的市场和资源，我们的民族共和国将面临崩溃的危险。\n\n§R当相关修正的效果过高或过低时，数值大小会触碰到上下限，届时就算我们的经济再崩溃，情况也不会更糟糕了……§!"
