#人物
 KMG_Polka_Savinkova: "波尔卡·萨文科娃"
 KMG_Polka_Savinkova_desc: "老克缅哥罗德公爵在挑起“大叛乱”时，并没有考虑到失败之后的后果，包括自己那个年幼的女儿将何去何从。大叛乱的结局已经写入历史，而身背“叛徒的女儿”之名的波尔卡也被乌萨斯帝国的新贵们所排挤，跟随着母亲回到了老公爵位于东方的封地。在母亲也随父亲而去后，这个年轻的女孩便成为了克缅哥罗德公爵领的实际统治者。不同于那些心怀怨念的旧贵族，年轻的女公爵似乎并没有什么历史包袱。相反，波尔卡醉心于文学创作，并且通过几篇小说和诗集在乌萨斯的文学界打响了名气，这让她成功重新回到乌萨斯的政治核心，毕竟谁会去讨厌一个纯良的文学少女呢？\n\n波尔卡·萨文科娃如果不出意外，她的后半生将被文学、贵族酒会和金钱填满。但是那些生活在克缅哥罗德的人们知道，老公爵的旧部下们也知道，萨文科娃自己也知道，在圣骏堡东方的数千公里之外，一场华丽的戏剧正在编排，而写下剧本的，是乌萨斯当代著名的女作家，波尔卡·萨文科娃。"
 KMG_Pavel_Suvchinskyv: "帕维尔·索夫钦斯基"
 KMG_Pavel_Suvchinskyv_desc: "在乌萨斯的文学界，帕维尔·索夫钦斯基并不知名，他似乎只是一个急切地想要混进文学圈子里的贵族老头。但是作为一个贵族老头，那么很多人都认识他。索夫钦斯基家族作为新贵族，老索夫钦斯基在多年以前的大叛乱中殒命，而立之年的帕维尔接管了家里的造纸帝国。然后帕维尔突发奇想，如果自己家都能造纸了，为什么不进军印刷出版行业？应该说他的决策是成功的，索夫钦斯基集团利用自身资源，在出版业飞速扩张着，顺带将帕维尔自我感觉良好的文学细菌也一起传播了出去。然而好景不长，随着沙皇政府的言论控制政策愈发严苛，乌萨斯的出版业也走入了寒冬，这也让帕维尔对于沙皇制度的不满不断加剧。在各种机缘巧合之下，帕维尔在文学圈子里结识了波尔卡·萨文科娃，两人很快成为忘年之交。通过萨文科娃有意无意的透露，帕维尔意识到了她的远大理想，作为新贵族的一员，他决定将赌注压在这个旧贵族的女儿身上。乌萨斯帝国可能会在未来的硝烟中颓然倾塌，但索夫钦斯基集团的纸张和书籍，无论在哪一个乌萨斯，都能带来源源不断的财富。"
 KMG_oligarch: "寡头"
 KMG_Nikolay_Gumilev: "尼古拉·古米廖夫"
 KMG_Nikolay_Gumilev_desc: "人物肖像：\n\n\n\n\n\n\n\n£Nikolay_Gumilev\n\n\n\n\n\n\n\n\n如果不是乌萨斯帝国对诗人的迫害，尼古拉·古米廖夫不可能会拖家带口地前往东达利亚，去克缅哥罗德投奔那个他只见过几次面的文学家朋友。作为乌萨斯的文坛领袖之一，古米廖夫不同于其他激进的文学家，他尽量使自己远离政治风暴，三番五次地申明自己的诗歌只是单纯的艺术。但是游历过中陆西陆各国的他根本掩藏不住自己的思想，或者换个角度说，新时代的诗歌在帝国眼中本身就是一种罪过。在友人的警告和建议下，古米廖夫趁着萨文科娃前往圣骏堡旅行的时候，提出到远东的克缅哥罗德“采风”，从而使得内卫对他的抓捕计划未能实现。回到克缅哥罗德的萨文科娃向古米廖夫送去了一封邀请函，希望他能在她的政府中工作，古米廖夫没有拒绝，不过他也没有什么政治抱负，教育部长之类的职位就足够了。"
 KMG_poet_aloof_from_world: "与世无争的诗人"
 KMG_Sergey_Efron: "谢尔盖·恩弗隆"
 KMG_Sergey_Efron_desc: "人物肖像：\n\n\n\n\n\n\n\n£Sergey_Efron\n\n\n\n\n\n\n\n\n谢尔盖·恩弗隆是萨文科娃一手提拔起来的，他本来只是一个被征进感染者纠察队的农民，在萨文科娃亲政之前，他以为自己这辈子最多能当个纠察队长。但在萨文科娃整编感染者纠察队时，她却意外地发现了这个机灵的同龄人。谢尔盖无论是指挥作战还是管账，都是一把好手，这个小伙子唯一欠缺的只是正规的培训。尽管背地里有人说，培养一个普通得不能再普通的农民，是萨文科娃无人可用的无奈之举，但谢尔盖·恩弗隆朴实的情感告诉他，自己不能辜负公爵女士对他的知遇之恩。"
 KMG_smart_operator: "精明经营者"
 KMG_Alexia_Kosichina: "阿莱克西亚·柯西琴娜"
 KMG_Alexia_Kosichina_desc: "阿莱克西亚·柯西琴娜是一个城市工人的女儿，同时也是一个感染者。她感染矿石病后，她的家人就和她断绝了关系，没有把她亲手送到集中营里可能是家人对她留的最后一点情面。阿莱克西亚一路从西乌萨斯流浪到远东，加入了一支感染者队伍，之后这些人又与塔露拉的整合运动合流，阿莱克西亚也顺带成为了整合运动的成员。在整合运动活动时，她被当作后备干部培养，但她尚未系统地完成社会主义的理论学习，整合运动就在大叛乱之中被打散了。阿莱克西亚被迫再次流亡，最终来到了克缅哥罗德，萨文科娃的政府热情地接待了她，不仅仅是因为她作为感染者，是萨文科娃再好不过的宣传素材，更是因为萨文科娃本人，对于她所说的“社会主义”理论，表现出了十足的兴趣。而阿莱克西亚·柯西琴娜也没有辜负萨文科娃的期待，她很快适应了自己新的身份，运用脑海里留存着的社会主义理论，阿莱克西亚正在为萨文科娃的民粹主义理论注入新的生命力。"
 KMG_young_theoretician: "稚嫩的理论家"
 KMG_Alexander_Katopov: "亚历山大·卡托波夫"
 KMG_Alexander_Katopov_desc: "卡托波夫上校在克缅哥罗德的日子里，时常站在窗前，对着外面的冰冷空气叹气。在大叛乱时，亚历山大·卡托波夫还只是一个中尉，他的部队在圣骏堡外围的一个阵地上抵挡住了叛军疯狂的攻势，直到援军抵达将他们换下。这次战斗对于整个战役的走向都极为关键，大叛乱平定后，卡托波夫也因此得到嘉奖，并由于大叛乱导致乌萨斯的高级将领损失过多，他一路从中尉被提升到上校。但卡托波夫对于这些荣誉并无兴趣，他刚到退役年龄便匆匆退出军队，然后便在乌萨斯军界销声匿迹。造成这种情况的原因只有一个：卡托波夫是老萨文科夫公爵的老部下。在大叛乱前一年，他刚被军方从原部队里调走，而那场决定一切的阵地战，敌方就是老萨文科夫的军队。极其了解老上司战法的卡托波夫自然能够游刃有余地应对战斗，但老公爵被处以绞刑后，不安和愧疚开始缠绕着他。在被这种情感折磨了十多年后，他选择了离开，去到克缅哥罗德赎罪。出乎他的意料，已经卧床不起的老公爵夫人并没有责怪他，只是希望他能够顾念旧情，帮助当时尚年轻的新一任克缅哥罗德女大公管理这片领地。卡托波夫接下了这个任务，他以长辈的身份帮助萨文科娃管理着领地，并在萨文科娃逐渐成熟后，主动放弃权力，转而去训练公爵领的私兵。由于他的军衔、贡献和与公爵家族的关系，卡托波夫一直被视为克缅哥罗德除了公爵女士之外最有名望的人，但上校明白，随着自己的身躯也逐渐老去，自己向老公爵报道的日子正在一天一天迫近。"
 KMG_old_housekeeper: "老管家"
 KMG_Gabrielle_Levitova: "加布里艾尔·列维托娃"
 KMG_Gabrielle_Levitova_desc: "人物肖像：\n\n\n\n\n\n\n\n£Gabrielle_Levitova\n\n\n\n\n\n\n\n\n与克缅哥罗德的其他任何人都不同，加布里艾尔·列维托娃可以说完完全全是萨文科娃的亲信。列维托娃出生在克缅哥罗德，她的父母都是城里的小学校的教师，如果不是大叛乱改变了乌萨斯大部分人的命运，加布里艾尔可能这辈子都不会遇上波尔卡·萨文科娃。但也许就是命运，当老公爵因为叛乱被吊死以后，波尔卡与母亲从西乌萨斯回到了位于远东的祖传封地，当时还小的波尔卡必须去学校，而加布里艾尔就成了她在学校的第一个朋友。落魄贵族和小城姑娘的友情在文学上略显俗套，但两人的友谊的确是实打实的。随着萨文科娃成长成一位领袖，列维托娃作为她的密友一直陪伴在她的身边，并且她本人也逐渐展露出政治上的天赋。在克缅哥罗德的人们私下的议论中，如果萨文科娃当真想要成为一位统治者，列维托娃很有可能是她的第一副手。"
 KMG_hardworking_assistant: "拼命的副手"
 KMG_government_guardian: "政府守护者"
 KMG_Viktor_Bydrakov: "维克托·拜德拉科夫"
 KMG_Viktor_Bydrakov_desc: "人物肖像：\n\n\n\n\n\n\n\n£Viktor_Bydrakov\n\n\n\n\n\n\n\n\n与大部分离开西乌萨斯，前往东达利亚的军官们相似，维克托·拜德拉科夫也是因为政治原因。但他和那些远东边疆区的自由派和逃亡南方的感染者同情者们又有些不同，他的进步倾向并不是很明显。在维克托的观念里，对于一个国家，一个强人或者强权的政府是必要的，但是这个角色不应该是世袭的沙皇来扮演。正因此，他在保皇派和进步派两方都找不到自己的位置，于是也被排挤到了一个终日飘着冰雪的地方，杜丁斯科耶。所幸，赤金总不会被埋没，在萨文科娃完全控制杜丁斯科耶后，维克托·拜德拉科夫引起了她的注意，并且成功成为了克缅哥罗德政府的一员。其实客观地评价，维克托是一个庸才，但有时候，一个循规蹈矩的中立者，带来的并非全是坏事。"
 KMG_Anastasia_Rozaevskaya: "安娜斯塔西娅·罗兹耶夫斯卡娅"
 KMG_Anastasia_Rozaevskaya_desc: "人物肖像：\n\n\n\n\n\n\n\n£Anastasia_Rozaevskaya\n\n\n\n\n\n\n\n\n克缅哥罗德的重要人物们不是萨文科夫家族的新知故交，就是从西乌萨斯逃亡或贬谪过来的家伙，唯独安娜斯塔西娅·罗兹耶夫斯卡娅是一个例外：她是自己跑过来的。安娜斯塔西娅本来的生活还不错，她的家人是在切尔诺伯格和龙门之间经营小商品贸易的商人，但切尔诺伯格事件发生后，她家破产了，并跟着其他难民一起跑到了龙门避难。之后，整合运动这群“赤匪”接管了切尔诺伯格，她回去收拢家产东山再起的美梦也破灭了。正当安娜斯塔西娅为未来发愁时，她在龙门的乌萨斯社区里听说了萨文科娃女大公的政治活动，本就是萨文科娃的书迷的她大为惊喜，她用尽浑身解数，设法穿过炎国边境和其他军阀的控制区，来到了克缅哥罗德。一开始，萨文科娃并没有注意到她，毕竟她的外表看起来只是和其他人一样的难民。但安娜斯塔西娅很快就用她家传的商业技能，在这个战争时的城市闯出了名堂，并成功见上了萨文科娃的面。而在滔滔不绝地讲述自己对萨文科娃的民粹主义主张的理解后，安娜斯塔西娅·罗兹耶夫斯卡娅得到了女大公的一个微笑。在这之后，她迅速进入了萨文科娃的幕僚团内，并且以着极快的速度升迁，成为了一颗冉冉升起的政治新星。"
 KMG_inexperienced_demagogue: "经验不足的煽动者"
 KMG_Anastasy_Vonsiatsky: "阿纳斯塔斯·冯西亚茨基"
 KMG_Anastasy_Vonsiatsky_desc: "人物肖像：\n\n\n\n\n\n\n\n£Anastasy_Vonsiatsky\n\n\n\n\n\n\n\n\n对于冯西亚茨基来说，战斗似乎就是他人生的全部。他在大叛乱期间，是老萨文科夫公爵的直属术士部队的一个团长，而这支部队在大叛乱结束后由于过分的残暴，被胜利的帝国当局清算，而冯西亚茨基本人却不知所踪。只有老公爵夫人和波尔卡知道，那支嫡系部队的指挥官伪装成家里的仆人，和她们一起去到了东达利亚的祖传封地。在公爵家族一开始的艰难时期，阿纳斯塔斯·冯西亚茨基通过给别人当雇佣兵，赚钱帮老上司的家人熬日子。而他的忠诚也获得了奖赏，在波尔卡·萨文科娃成年亲政后，冯西亚茨基被她召回，担任秘密的“黑色卫队”的领导人。在这支精锐而恐怖的队伍里，萨文科娃相信，冯西亚茨基能够充分发挥他和他们的潜力。"
 KMG_black_executioner: "黑色刽子手"
 KMG_Peter_Sorokin: "彼得·苏洛金"
 KMG_Peter_Sorokin_desc: "与人们刻板印象里的“激进派”的形象不同，彼得·苏洛金看起来是个温文尔雅的学者，和罗兹耶夫斯卡娅那样的煽动者或冯西亚茨基这种刽子手都不一样。但实际上，彼得是克缅哥罗德最激进的重要人物，甚至可能比萨文科娃本人都要极端。原因只有一个，他的脑子里有学问。彼得是乌萨斯的正经大学的正经教授，甚至还在莱塔尼亚的威廉大学当过一段时间的交流学者，他是纯粹为了政治理想才来到克缅哥罗德的。如果说萨文科娃只是给她的理论指明了一个大方向的话，彼得·苏洛金就是将这个理论具象化于实际的“军师”。他极其狂热的鼓吹平民的力量，但又反对实行自由主义或更左翼的民主，而是主张通过一个专政党派进行统治；他反对自由市场，同时对社会主义者的公有制乌托邦不置可否，主张走法团主义阶级调和的第三条道路；他为乌萨斯民族的优越性进行了大量的论证，并为“种族净化”提供了从强制迁移到集体屠杀的多种方案……应该说，他的才华和忠诚对于萨文科娃来说是不可多得的财富，但同时，也是会让女大公上瘾的毒品。"
 KMG_scholar: "学者"

#国策
 KMG_memorial_day_of_old_duke: "老公爵的祭日"
 KMG_memorial_day_of_old_duke_desc: "波尔卡的父亲，老克缅哥罗德公爵，作为大叛乱的发起者被吊死在圣骏堡的街头，距今已经过去了十数年，波尔卡的命运也因此走向了一条未知的道路。尽管纪念一个叛徒是不被容许的，但老公爵的旧部仍然在这一天默契地来到了公爵宅邸，与他留在这片大地上的唯一痕迹共同缅怀这个坚毅的灵魂。"
 KMG_savinkovas_tour: "萨文科娃的旅行"
 KMG_savinkovas_tour_desc: "波尔卡·萨文科娃，除了是克缅哥罗德的公爵之外，她还是一位声名远扬的作家。从西方送来的邀请函在她的书桌旁堆积如山，也许她必须去西方一趟。借着发布新书的由头，萨文科娃可以与不少人见面，寻找可能的盟友，打消当局的疑虑，以及向那些贪婪的记者们象征性地挥挥手。"
 KMG_savinkova_tour_begin: "萨文科娃正在旅行"
 KMG_fawn_upper_class: "讨好上层阶级"
 KMG_fawn_upper_class_desc: "虽然自己的父亲是一位可憎的叛匪，但他的爵位并未被剥夺，在母亲的教导下，萨文科娃成功地成为了一位贵族大小姐，掌握贵族所应当学会的一切技能：舞蹈、音律、礼节、品酒、在酒会中收集情报、与变节者建立联系……"
 KMG_establish_prestige_among_masses: "在群众中建立威望"
 KMG_establish_prestige_among_masses_desc: "萨文科娃作为一名作家，写的却不是什么晦涩难懂的宫廷小诗。她是一名小说家，而小说是什么人都可以读懂的，不识字的人都可以找别人念。因此，作家萨文科娃在乌萨斯的民众中拥有巨大声望，便不是什么怪事了，而萨文科娃完全可以利用这一点。"
 KMG_new_book_publishing: "新书出版"
 KMG_new_book_publishing_desc: "在途径几个乌萨斯大城市后，萨文科娃抵达了圣骏堡。在乌萨斯帝国的心脏，同时也是帝国的文化中心，萨文科娃将宣布她的新书。可以预计的是，这本名为《苍白骑士》的虚构战争小说将为女公爵带去不亚于封地收入的大笔版权费，以及用金钱也收买不到的——人心。"
 KMG_conclave_army_youth: "密会军队少壮派"
 KMG_conclave_army_youth_desc: "乌萨斯帝国军由乌萨斯的数个集团军组成，在大叛乱之后，这支昔日辉煌的军队，已经完全落入新贵族的掌控下。幸好，虽然萨文科娃的父亲是旧贵族的失败者，但萨文科娃和帝国军都没有看对方不顺眼，主权同盟中的激进派赏识萨文科娃的文字重新唤起了乌萨斯的军国主义狂热，而萨文科娃看中了将军们在乌萨斯的政局中搅动风云的潜力。"
 KMG_news_from_progressives: "进步派的消息"
 KMG_news_from_progressives_desc: "立民党，进步联盟，虽然他们明面上都拥护十月党的君主立宪改革，但动动脑子都知道，其中不乏潜藏的共和主义者，而这些人恰好就能成为萨文科娃的朋友。这些西方的政客们并不知道冻原的真相，也不知道萨文科娃宏伟的蓝图，但萨文科娃的目的便是如此，只要稍微放出一点点诱人的真相，我们就能从皇帝手中窃得他们的忠诚。"
 KMG_meet_witt: "与维特见面"
 KMG_meet_witt_desc: "伊斯拉姆·维特，国家杜马议长，他和他的十月党正在将乌萨斯带入正轨——至少他们自己这么认为。对于作家萨文科娃来说，和议长这种级别的政要会面，将无限地拉高她的威望，而对于萨文科娃公爵来说，这是一个打消疑虑、展现忠诚的机会，抑或是一个露出獠牙、留下警告的威胁？"
 KMG_four_horsemen: "四个骑士"
 KMG_four_horsemen_desc: "在拉特兰正教的寓言中，有天启四骑士的传说，而这给了萨文科娃女士不少的灵感，不只是文学上的，还有一些其他方面的……"
 KMG_white: "§W白色§!"
 KMG_white_desc: "§W白骑士§!代表了§W“瘟疫”§!，而矿石病就是我们这个时代最严重的瘟疫。然而这种瘟疫，伴随其身后的是宏伟的现代源石工业和世界市场，若是我们能够掌控工业、操纵贸易，那么“瘟疫”的力量便在我们手中。"
 KMG_black: "§g黑色§!"
 KMG_black_desc: "§g黑骑士§!象征着§g“饥荒”§!，而农民是乌萨斯民族永恒的支柱。如今的人类不再是向上天渴求麦粒的卑微模样，化肥、农机、先进的管理方式，这些都将是我们战胜饥荒的有力武器。而第一步，是让我们领地内的乌萨斯农民见识到这些东西。"
 KMG_red: "§R红色§!"
 KMG_red_desc: "§R红骑士§!是§R“战争”§!的代言人，而战争也是萨文科娃必须面对的宿命。东达利亚的旧贵族之间的猜忌早已不是秘密，而圣骏堡只是通过几个内卫来维系这一间琥珀宫。粉饰的面具终有一天会被粗暴地扯下，而我们要做的就是在幻象破碎后能够割断对手的喉咙。"
 KMG_development_of_teixet_mine: "开发泰谢特矿区"
 KMG_development_of_teixet_mine_desc: "泰谢特矿区作为我们领地上重要的经济支柱，一直以来都为我们提供优质且廉价的源石，作为出口的拳头货物和工业的燃料。为了满足领地内和贸易的需求，根据进一步的勘察显示，在矿坑深处仍然有大量可以开采的源石。因此，扩展泰谢特矿区势在必得，不惜一切代价。"
 KMG_development_of_northern_port_area: "开发北部港区"
 KMG_development_of_northern_port_area_desc: "拥有庞大的工业和矿业并不意味着金币就会滚滚而来，而幸运的是，前任女公爵，波尔卡的母亲，将乌萨斯在北方海域的唯一出海口经营得非常繁荣。我们需要做的只是进一步扩建港口，提高港区的货物吞吐量，以把更多的货物通过水路销往乌萨斯各地，甚至是其他的国家。"
 KMG_limit_infected_slave_workers_exploitation: "限制对感染者奴工的剥削"
 KMG_limit_infected_slave_workers_exploitation_desc: "乌萨斯帝国对感染者的政策非常简单：毁灭。诚然，感染者确实会传播骇人的矿石病，但萨文科娃觉得这些可怜的家伙罪不至死。相反，她一直认为这些精通源石技艺的家伙能够成为乌萨斯民族复兴的巨大能量。不过考虑到我们名义上仍然听从乌萨斯中央的统治，那么我们可以从稍稍改善他们的生活条件和工作状况开始，最后改变这一切。"
 KMG_originiums_export_issues: "源石出口问题"
 KMG_originiums_export_issues_desc: "在挖掘出源石矿后，除了满足自身的需求之外，我们下一个要考虑的问题就是向谁出口这些矿物，毕竟把他们堆在仓库里可不会凭空变出钱来。考虑到这些货物的危险性和重要性，还有我们的开采并未得到帝国允许，我们应当慎重考虑出口对象。"
 KMG_mineral_deposits_in_forest: "森林中的矿藏"
 KMG_mineral_deposits_in_forest_desc: "我们的领地中，除却矿山和矿井以外，在终年冰寒的原始森林中也存在一些裸露在地表上的矿物，除了源石之外，铁矿等金属矿物也是重要的工业原料。我们不能让它们就这么躺在皑皑白雪中，应当组织探查队伍将这些矿物回收利用。"
 KMG_trade_dispute_with_baikalyandashsky: "与贝加尔大公领的贸易争端"
 KMG_trade_dispute_with_baikalyandashsky_desc: "虽然贝加尔大公领的主要贸易产物是领地中源源不断的电能，和我们出口的源石似乎没有冲突，但在农副产品和工业品的贸易上，同为中东达利亚工业中心的双方不可避免地产生了争端。倘若正大光明的手段无法解决这个问题，萨文科娃并不排斥采取一些……“非常规手段”，毕竟她也看老贝加尔大公不爽很久了。"
 KMG_above_board_trade: "光明正大的贸易"
 KMG_above_board_trade_desc: "我们相信自己的矿石货物无论是纯度还是稳定性都是冻原上首屈一指的，只需要在台面上的竞争就可以有效的将其他人挤出市场。同时，我们将把武器作为捆绑销售和促销的手段，通过武器与矿物的绑定来让军火商们无法拒绝我们的条件。\n\n唯一的问题是，在乌萨斯帝国的眼皮底下，独立地开展贸易是否明智？内卫和中央军并不能以此将萨文科娃送上绞刑架，但只需要几个禁令就可能让全境的工厂和贸易路线停摆……"
 KMG_lay_out_underground_trading_channels: "布局地下交易渠道"
 KMG_lay_out_underground_trading_channels_desc: "冒险对于萨文科娃来说，从来不是她的第一选择。她已经隐藏了那么久，她不介意继续下去。因此，采取一些“地下”的贸易手段也是必要的。比如夹层里的源石矿、避开补给路线的商队……这些贸易并不会记入明账，因此不免出现差错和舞弊。就当公爵赏他们的吧。\n\n另外，一直屡禁不止的黑市贸易网络也可以在我们的考虑范围内，那些家伙可不在乎这些东西到底是哪来的，他们的关系网也比我们更“深入”客户中，也更容易将我们的东西脱手——唯一问题是，他们可能会要求高昂的中间费用。"
 KMG_building_fertilizer_plants: "建设化肥厂"
 KMG_building_fertilizer_plants_desc: "乌萨斯这片荒原的最大问题就是太冷了。寒冷让大地封冻，让土地变得异常贫瘠，让我们的人民难以耕种，就算种植了耐寒的作物，产量也会因为严寒变得非常低。因此，我们首先要做的就是普及化学肥料，通过化学手段提高种植区的土壤肥力，尽可能的提高农作物产量，以喂饱我们的人民。"
 KMG_expansion_of_granary: "扩建粮仓"
 KMG_expansion_of_granary_desc: "生产环节之后，就是存储环节了。小型谷仓不仅存储量低，而且还面临许多风险——管理不当、鼠患虫害等等问题都会直接影响我们的存粮量和品质。建设更多大型粮仓能有效的将粮食收入我们的囊中，在科学且合理的管理方式下，我们不仅可以减少损耗，还能够通过粮食分配的“小手段”来加强对地方的控制。"
 KMG_banquet_for_small_medium_landowners: "宴请中小地主"
 KMG_banquet_for_small_medium_landowners_desc: "领地内的地主乡绅们不知道的是，萨文科娃在农业政策上，是一个进步主义者。简单来说，萨文科娃女士认为农民应当拥有自己的土地。不过，我们没必要像激进共和主义者那样，嚷嚷着把地主们都赶尽杀绝，一场宴会或许就能让明事理的人吐出他们的土地。不明事理的人嘛，他们的名字不会在宾客名单上留下来。胡萝卜加大棒的手段，从古至今都十分有效，这次也不会例外。"
 KMG_khleb_and_kwas: "大列巴和格瓦斯"
 KMG_khleb_and_kwas_desc: "我们必须考虑到所处的极寒气候，农作稍有不慎就有可能颗粒无收。因此，我们需要将粮食制作成易饱、储存时间长的食物。乌萨斯农民在长期的生产生活中，捣鼓出了格瓦斯和大列巴，而我们要做的，就是把制作这些玩意的事情交给工厂的机器。这不但提高了食物的储存时间和效率，让我们多了一分应对粮食危机的机会，而向周边出口盈余的产品，将进一步提高我们的贸易收入。"
 KMG_standardize_market_prices: "规范市场价格"
 KMG_standardize_market_prices_desc: "长期以来，由于农贸市场的价格完全不受控制，导致农民辛苦耕作一年的收获可能被粮贩子以非常低的价格收割，然后又被在城镇中以高价出售，这严重伤害了农民和市民的利益。然而我们又不能允许农民们无限制的要价，粮食价格的大幅波动将伤害我们的政权稳定性。因此，我们有必要采取必要措施，由政府确定粮食的收购价格，确保农副产品价格在合理范围内波动，尽可能保证生产者和消费者双方的利益。"
 KMG_patriotic_farmers_association: "爱国农民协会"
 KMG_patriotic_farmers_association_desc: "想想看吧，对于那些大字不识一个的老农来说，能够让他们最简单的兴奋起来的方式不就是“老套的民族主义说辞、叮叮当当有规律的鼓点和一枚廉价的奖章”吗？再加上一些实际的好处，比如稍微高一点点的农作物统一收购价，分发更加便宜的农药、肥料以及免费帮忙修复农具等，他们有什么理由不参加萨文科娃女士的爱国农民协会呢？"
 KMG_call_on_the_people: "号召人民"
 KMG_call_on_the_people_desc: "面对即将到来的风暴，我们必须尽可能发动我们的人民，让他们意识到接下来即将面对一场前所未有的大变局。因此，我们首先要做的就是宣传，更多的宣传，非常多的宣传。通过强调我们的合法性、在我们的统治下的舒适的生活，以及其他地区和统治者所造成的灾难来形成对比，将萨文科娃塑造成为人民之友和乌萨斯的救世主，将人民紧紧团结在我们身边。"
 KMG_contact_old_subordinates: "联络旧部"
 KMG_contact_old_subordinates_desc: "虽然大叛乱失败了，但父亲的很多旧部下仍然还在乌萨斯各界活动，虽然他们被剥夺了军籍，无法继续在乌萨斯军中活跃，但我们也有一支军队。避开乌萨斯帝国的眼线，我们可以召回几个被迫退役的高级军官，他们将成为我们建军的领导者。"
 KMG_purchase_weapons: "采购武器"
 KMG_purchase_weapons_desc: "由于乌萨斯帝国对公爵领的限制，我们仅仅能够生产维持感染者纠察队和警察部队的普通武器，重炮、战车等先进装备我们根本不可能生产，而即使是一般的铳械，质量也远不如军用装备。不过，通过国际市场和黑市贸易，我们还是可以用各种名目，采购一些不至于让乌萨斯中央警觉的武器。"
 KMG_local_security_forces: "地方治安队"
 KMG_local_security_forces_desc: "随着我们的部队规模逐渐扩大，内卫已经注意到了萨文科娃的反常举动，她急需给出一个理由。所幸，乌萨斯并没有明令禁止各村镇拥有自己的民兵，我们可以用“地方治安队”的由头把内卫和其他官员哄骗过去，代价就是这些部队难以开展正常的训练，也无法配发合格的装备。"
 KMG_secret_force: "秘密部队"
 KMG_secret_force_desc: "部队规模的扩大是很难骗过乌萨斯帝国的眼睛的，但萨文科娃决定赌一把。军队？什么军队？萨文科娃完全否认了部队的存在，而实际上，移动城市内部的可利用空间比想象中的大得多，我们完全可以在地下建立一支秘密部队。除了萨文科娃女士与她的几位密友，这支秘密部队不为任何人所知，他们训练有素、装备精良，但代价就是为了掩盖他们，他们的规模不能扩张得过大。"
 KMG_reorganize_infected_pickets: "整编感染者纠察队"
 KMG_reorganize_infected_pickets_desc: "感染者纠察队一直以来负责发现并抓捕我们领地内的所有不受控的感染者，并将他们送往应去的地方接受集中管理。但他们名义上并不属于我们管辖，而是听命于圣骏堡。不过在萨文科娃的多年经营下，本地的感染者纠察队早已对公爵忠心耿耿，因此把他们正式收编，也只是走个程序的事。"
 KMG_building_car_factory: "建设汽车厂"
 KMG_building_car_factory_desc: "在广袤的荒原上行动，不能仅靠我们人员的双腿或是驮兽的四肢，最能相信的只有轰鸣的钢铁和机械。通过新建汽车厂，我们将为自己的武装力量配备机械化装备，提高他们的越野能力和速度，并且带来更多就业岗位。"
 KMG_smuggling_firearms: "改良铳械生产线"
 KMG_smuggling_firearms_desc: "虽然铳械的生产早已不被拉特兰垄断，但是我们过于落后的小作坊生产方式无法满足如今的需要。建设大量的铳械生产线，让每一位士兵得到先进而可靠的武装，当帝国问及此事时，我们会说这是为了便于镇压当地的感染者叛乱。"
 KMG_kemergorod_city_expansion: "扩建克缅哥罗德城区"
 KMG_kemergorod_city_expansion_desc: "现在，随着我们的经济发展，人口也在不断涌入到我们的城市中，这虽然证明了目前政策的有效性，但带来了一系列问题，主要集中在我们的核心移动城市无法容纳如此多的新居民的问题上。因此，我们有必要对城市进行新的规划，划分出新的区划，供涌入的人口生活，同时为未来的工业化扩展打好基础。"
 KMG_repair_the_road: "修整道路"
 KMG_repair_the_road_desc: "在扩建城市的同时，我们也需要对道路进行整修，不仅仅是城市的，还有乡村的和各镇子之间的。一条工整的道路不仅仅是美观的问题，还能让我们的各式载具行驶的更加快速、更加舒适，提高领地各处的流通性，改善交通情况。"
 KMG_support_local_schools: "资助本地学校"
 KMG_support_local_schools_desc: "教育是未来的根基，我们的年轻一代和未来都集中在这些地方学校中。通过资助这些学校，不仅可以改善他们的教育水平，还可以通过我们的影响力，来在课本和教育过程中添加一些萨文科娃女士的民粹主义思想，来保证我们教育出的新一代是忠诚的爱国者，萨文科娃小姐是当代乌萨斯的著名作家，学生们和老师们都不会拒绝的。"
 KMG_buy_modern_industrial_equipments: "购买现代工业设备"
 KMG_buy_modern_industrial_equipments_desc: "诚然，我们的城市已经在蓬勃发展，但一座位于远东的移动城市无法满足自身工业的全部设备需求——完全自给自足的代价是巨大的，而在经济上完全得不偿失。关键的工业设备仍然需要进口和购买，以满足更新换代和扩张的需求。在我们的工业发展初具规模之后，我们便可以试着制造一些仿制品。"
 KMG_organize_regional_communication_network: "整理地区通信网络"
 KMG_organize_regional_communication_network_desc: "现在，是时候让我们放眼领地的通信网络了。我们不能再依靠信使、羽兽这类又不靠谱又迟滞的手段来统治领土了，尤其是这些传递方式可能会传输某些敏感信息，一旦被拦截或篡改，将带来非常严重的影响。我们必须普及现代的通信网络，通过建立无线电塔和无线电通讯网络，我们将用电磁波构建出一个新的现代统治体系。"
 KMG_prepare_to_decouple_economy: "准备经济与外界脱钩"
 KMG_prepare_to_decouple_economy_desc: "我们的经济尚未准备好与外界贸易完全脱钩，但这一天终将会来——倘若乌萨斯陷入新的乱局，我们对外的贸易很快就会被无序与混乱波及，陷入崩溃境地。因此，我们必须做好痛苦的自给自足的准备，通过提高内需、增发货币等等紧急措施来应对随时可能到来的风暴。"
 KMG_contact_trustworthy_guys: "联系值得信任的家伙"
 KMG_contact_trustworthy_guys_desc: "远东边疆区是乌萨斯帝国流放共和派军官和进步学者的地方，但圣骏堡不知道的是，这些人在那片蛮荒之地联合在了一起，并且发展出了不俗的实力。得益于老公爵部下的联络网，我们成功与远东的共和派们搭上了线，他们也许并不完全支持萨文科娃的民粹主义，但至少在共和的层面，我们是同路人。"
 KMG_reward_loyalty: "奖赏忠诚"
 KMG_reward_loyalty_desc: "来参加军队的并不一定是优质的战士，也有可能是颗粒无收的农民或走投无路的乞丐，但对这些忠诚于我们的人来说，奖赏是理所应当的。优秀而忠诚的士兵可以升官加爵，获得更多财富，提供一些小小的特权和便利。他们将成为一个个活生生的例子，以向领地内的所有人展示，成为一名士兵并向萨文科娃女士宣誓效忠，将获得何等回报。"
 KMG_only_obey: "唯一服从"
 KMG_only_obey_desc: "服从是军人最重要的品质，而我们的军队只须也必须服从于萨文科娃女士的命令。军队中的宣传工作绝对不可忽视，通过书籍、影片还有日复一日的口号，士兵们的脑子里除了军事知识以外，只应该有萨文科娃的民粹思想，并且发自内心的去服从、去执行她的命令。"
 KMG_recruit_outstanding_infecteds: "招募优秀感染者"
 KMG_recruit_outstanding_infecteds_desc: "感染者在萨文科娃的理想蓝图中，不再是社会的累赘、国家的败类，而是光荣的大乌萨斯民族的一份子。因此，我们会给感染者们一个前所未有的机会——任何证明了自己的忠诚以及作用的感染者会被招募，发挥他们在源石技艺和其他领域的特长，并且提供与普通士兵没有差异的军饷和待遇。这些从未感受过人世温暖的家伙们必然会对我们感恩戴德，从而成为萨文科娃最忠诚的支持者。"
 KMG_seeking_investment_in_pipe_factory: "寻求“水管厂”投资"
 KMG_seeking_investment_in_pipe_factory_desc: "购买武器远远不能满足我们军队的需要，一旦冲突爆发，我们的军火交易也必然受到影响，因此建立武器生产线是绝对必要的。但乌萨斯的监视让我们没法舒服地扩张我们的军工生产。因此，我们将以寻求水管和钢管投资的方式来秘密的寻求外部的工业投资，然后这些精致的无缝钢管，就能在战争时摇身一变，成为火炮和铳械。"
 KMG_renovated_tractor_factory: "改建拖拉机厂"
 KMG_renovated_tractor_factory_desc: "装甲载具和拖拉机之间的区别并不大，我们只需要将拖拉机厂的生产线进行改造，就可以适应未来战争中的装甲载具需求。当然了，他们现在仍将继续生产拖拉机，为我们的农民提供优质的农用机械，但在未来，一旦出现新的需求，他们将迅速转型，转而生产坦克与履带装甲车。"
 KMG_black_guard: "黑色卫队"
 KMG_black_guard_desc: "什么是黑色卫队？这将是一支通过层层考核和审批才能加入的精锐力量，他们将接受各方面训练，以应对任何未来可能面对的情况。他们将装备我们最新和最精锐的武器，成为战场上一把不可阻挡的尖刀。最重要的是，这支军队的军官们不仅才华横溢，而且对萨文科娃无限忠诚，黑色卫队将成为萨文科娃的双手的延伸。"
 KMG_pale: "§L灰色§!"
 KMG_pale_desc: "东乌萨斯的局势越来越混乱了，而我们也已经做好了战争的准备。在那个拉特兰寓言的结尾，最后踏上这片大地的是一名§L灰色§!的骑士，他的名字是§L死亡§!，而地狱也随他而来……"

 KMG_hell_followed_with_him: "地狱随之而来"
 KMG_hell_followed_with_him_desc: "第二次大叛乱时代已经到来，贵族、野心家、叛匪，所有人都在为生存和霸权而搏杀。而我们作为准备最为充分的势力，现在是为了萨文科娃的理想进军的时候了。在那名灰色的骑士身后，我们将为敌人带来地狱。"
 KMG_reinforce_defense_circle: "加固克缅哥罗德防御圈"
 KMG_reinforce_defense_circle_desc: "虽然我们有十足的信心将敌人碾碎，但从未雨绸缪的角度考虑，我们也必须做好敌人兵临城下的准备。克缅哥罗德在军事上处于一个非常关键的位置，作为地区的交通枢纽之一，强化这座移动城市以及周边的防御将让我们在未来能够处于一个更佳的境况。最重要的是，这会使得城里的居民感到安全，并且让他们忙于工作，从而忘记战争带来的那些不适。"
 KMG_increase_war_tax: "增开战争税"
 KMG_increase_war_tax_desc: "战争已经来临，我们的经济也必须服从于战争的需求。维持军事工业的高位运转、扩大军队规模，这些都需要大量的资金。因此，即使这样做可能损害人民的生活，战争税也必须立即开征。相信我们忠诚的人民都是能够理解的。"
 KMG_internal_affairs: "着眼内政"
 KMG_internal_affairs_desc: "长期以来，克缅哥罗德的政府仍是按照公爵领的体制运行着，而在大叛乱开始后，我们必须做出改变。原来与西边的朝廷相关的政府职能必须尽快恢复，战时的临时体制也应当立即确立。我们现在就要做好最终统一全国的准备。"
 KMG_implement_rationing_system: "实行配给制度"
 KMG_implement_rationing_system_desc: "虽然战争已经爆发，我们的经济政策尚未完全转向，仍然是民用市场经济，但在强敌环伺的情况下，这套体系早已无法运行下去。在战争爆发后，我们的很多外贸渠道都已被切断，许多商品已经断供，而要利用好我们现有的储备，只有一个办法——实行必要的配给制度，由官方直接干预所有物资的分配。"
 KMG_increase_repressive_spending: "增加镇压支出"
 KMG_increase_repressive_spending_desc: "一个稳定的后方是我们能够维持长时间的战争的首要条件，但战争本身就会破坏社会生产的稳定，我们的敌人更是会处心积虑地破坏我们的后方。而当军队必须在前线推进战线时，内务部门就需要承担更多的镇压职责。所以，对于镇压部门的拨款必须增加，这样才能让反对者都得到他们应得的下场。"
 KMG_alternative_transportation_routes: "增开备用运输线路"
 KMG_alternative_transportation_routes_desc: "战争爆发后，前线与后方的补给线是敌人袭击的重点，而那些和平时期常用的运输路线就显得有些过于醒目，因此，我们必须寻求新的运输路线，包括重启一些废弃线路，或是直接动用大型机械开辟全新的道路。"
 KMG_establish_supreme_economic_council: "成立最高经济委员会"
 KMG_establish_supreme_economic_council_desc: "什么是最好的经济体制？萨文科娃的回答是，让领袖和关心人民的精英统制全国的经济，用有形的大手直接掌控资源的分配，从而让那些所谓“新贵族”再也不能用市场的小伎俩欺骗人民。我们恰好可以利用战时经济体制的理由，建立最高经济委员会，由一批信得过的学者和经济官僚对全国的经济进行管理。诚然，这样会让那些小寡头和小市民们不满，但他们本来就不在萨文科娃为乌萨斯人民规划的未来之中。"
 KMG_control_resource_trade: "严格控制资源贸易"
 KMG_control_resource_trade_desc: "在战争时期，最不应该让市场决定的就是各种资源的流通，许多资源都是稀有而昂贵的，而我们的军队和人民却又非常需要它们。因此，一方面，我们必须紧盯着这些战略资源的去向，另一方面，最高经济委员会可以通过行政手段，管理资源从矿井到工厂的整个流程，做到效率最大化。"
 KMG_new_communications_standards: "编订新通讯标准"
 KMG_new_communications_standards_desc: "由于大部分军阀都是从乌萨斯的旧体制中脱离出来的，他们的通信方式仍然沿用的是旧帝国的老东西。但我们是不同的，既然我们要建立新的秩序，那么整个国家就必须抛弃那些老掉牙的玩意。通过引入炎国和哥伦比亚的通信设备，我们进一步改进我们的通信系统，确定全新的标准，这不仅可以让百姓用上更加高效的电话和无线电，还可以让各级经济委员会的沟通更为顺畅，效率进一步提高。"
 KMG_take_over_far_eastern_university: "接收远东大学"
 KMG_take_over_far_eastern_university_desc: "在我们完全控制科雷马边疆区后，位于奇廷卡斯克的远东国立大学归于我们治下。这所由被流放的激进派组成的学术天堂，若是能够善加利用，便能成为我们政权的宝贵资产。首先，我们需要逐步接手大学的管理，之后与这些学者们谈一谈，他们将在未来的乌萨斯扮演怎样的角色。"
 KMG_order_business_owners_to_obey: "要求企业主服从"
 KMG_order_business_owners_to_obey_desc: "在决定成立最高经济委员会后，各地的企业主们果不其然开始反对，其中不乏一些和我们的政府联系颇深的人物。虽然在战争的大背景下，这些人迫于压力，还只是停留在口头抗议的阶段，但如果把他们晾在一边，最后闹出关停工厂或是带资投敌的乱子，对我们的恶劣影响不可估量。因此，我们最好动用行政手段或者暴力机关，迫使这些家伙服从。"
 KMG_establish_investment_management_committee: "成立投资管理委员会"
 KMG_establish_investment_management_committee_desc: "虽然最高经济委员会理论上控制了全国的经济，但实际上，还是有一定数量的资本家，由于和政府的联系，游离于体制之外。出于管理这些合作者和未来进入我国的外国资本的考量，在最高经济委员会之下，我们新设了一个投资管理委员会，用以引导这些投资者手里的资本去向，保证这些资本流向我们想要它们到达的地方。"
 KMG_convene_business_meeting: "召集商贸企业会议"
 KMG_convene_business_meeting_desc: "萨文科娃小姐的内在是温和的、充满了文学家特有的人文情怀的。因此，她更喜欢通过一些大家都满意的方式达成目的。一个各企业与政府之间直接对话的会议已经在筹备当中，我们将共同探讨如何在这一动乱时代达成妥协和共赢的最佳平衡。一个新的乌萨斯必然需要这些人的参与，无论是为了战争的最终胜利，还是未来的重建和争夺世界市场。"
 KMG_split_reorganize_guilds: "拆分重组各行会"
 KMG_split_reorganize_guilds_desc: "虽然我们已经和一些大企业达成了一致，但是对于数量繁多的中小企业主们，政府实在没有精力去一个个迎合他们的要求。所幸，在各行业的主要企业协助下，我们可以对各行业的行会进行拆分重组，利用行政手段将中小企业囊括其中，建立一种妥协下的法团体制，从而加强我们对经济的掌控能力。"
 KMG_attract_foreign_capital: "吸引外国资本进入"
 KMG_attract_foreign_capital_desc: "外国资本一直以来都是一味激烈的猛药，它可以迅速刺激我国经济发展，但外资的渗透过深对国家来说并不是什么好事。但是就现在来说，一切进入的外资都是为我们的战争所服务的，只不过是战时军事工业体系的一部分。我们也不可能对进入我国的外国资本撒手不顾，一切外国背景的企业都在内务部门的密切关注之中，但总的来说，我们不希望给外国人塑造出不友好的印象。"
 KMG_build_free_trade_port: "建设自由贸易港"
 KMG_build_free_trade_port_desc: "杜丁斯科耶虽然是极北少有的良港，也在我们的不懈建设下得到了一定的发展，但终归无法与西部那些历史悠久的港口城市相比。在企业主们的要求下，我们将扩建现有港口，同时将杜丁斯科耶设置成完全的自由港，通过一套新的促进自由贸易的政策来鼓励对外贸易，促进当地经济发展，并且让我们获取外国的资源更加便捷高效。"
 KMG_joint_industrial_equipment_research: "联合工业设备研究"
 KMG_joint_industrial_equipment_research_desc: "由于乌萨斯帝国的固步自封，我们的工业水平也惨遭连累，乌萨斯产的工业设备在国际上与她的国际地位不符，甚至都比不过一些前殖民地国家。但通过杜丁斯科耶港，我们与外国企业有了更深入的合作，不仅可以单纯进口工业生产设备，还可以发起一些联合研究项目，将他们的机器改良成更适应乌萨斯严寒气候的改进型，并获得他们的生产许可。"
 KMG_sell_nursing_home: "抛售松心山疗养院"
 KMG_sell_nursing_home_desc: "贝加尔大公领的松心山谷疗养院，在和平时期是乌萨斯达官显贵们聚会和度假的地方，也是泰拉有名的旅游胜地，而贝加尔大公也靠着旅游业在之前赚得盆满钵满，只不过这个地方的光芒被贝加尔能源公司完全盖过了。而当松心山谷完全居于我方控制后，如何处置这个因战争荒废的疗养院就成了问题。由于这里的开发潜力仍然很高，也许通过一场拍卖会可以很好地将这个地方抛售出去，还可以对外展示我们的控制力和营商环境，毕竟我们都能开拍卖会了。"
 KMG_promote_republican_ideals: "宣传共和主义理念"
 KMG_promote_republican_ideals_desc: "共和主义是团结着我们政府内大多数人的理念，许多被迫害的学者、士兵、感染者，都寄希望于萨文科娃可以建立一个不同于沙皇政权的国家，国家的领袖不再由血统决定，人民能够获得民主和自由地生活下去的权利，乌萨斯将以共和国之名重生于泰拉大地之上。"
 KMG_inciting_nationalist_fervor: "煽动民族主义狂热"
 KMG_inciting_nationalist_fervor_desc: "乌萨斯民族是泰拉最伟大、最优秀的民族，无论是萨文科娃还是她的追随者们，都对此深信不疑。而阻碍乌萨斯民族迈向她的伟大征程的拦路石，是腐朽的沙皇和唯利是图的新贵族资本家们。乌萨斯真正的灵魂在坚毅勇敢的农民之中，在吃苦耐劳的工人之中，在勇猛无前的士兵之中，只有人民的力量，才能涤荡那些污染伟大民族的蛀虫，实现民族的真正伟大。"
 KMG_determine_union_status: "确定工会地位"
 KMG_determine_union_status_desc: "在多年前的大叛乱之中，工会是为数不多的被保留下来的果实。这个从南方列强起源的制度是组织工人的有效方式。现在，我们需要确定工会在当前的战争中，以及未来我们获得全国政权后，在国家中的地位。是作为一个爱国工人的独立组织，还是完全成为新国家的一个有机组成结构。"
 KMG_determine_principles_for_army: "确立建军原则"
 KMG_determine_principles_for_army_desc: "在沙皇的统治下，乌萨斯的旧军队只不过是为皇帝一人意志驱使的灰色牲口。萨文科娃想要建立的新国家绝不需要这样的军队。军队的结构体制必须向最先进的列强看齐，但与此同时，建军的原则也必须慎重考虑。老将军们都主张保留军队的独立性，但政府内的激进派都认为，军队必须为政治、为人民共和党服务。"
 KMG_advancing_front: "推进战线"
 KMG_advancing_front_desc: "大叛乱使得整个东乌萨斯的局势已经完全失控，我们必须抢占先机，推进对敌人的战线，确保我们的战略纵深。同时，我们将撕下一直以来的伪装，将我们的各种部队重整为正规军队，宣告萨文科娃的野心。"
 KMG_expand_recruitment_scale: "扩大征募规模"
 KMG_expand_recruitment_scale_desc: "原先的志愿兵与征召兵并不能满足战争的需求，随着战争规模的扩大，我们需要更多的士兵、军官，组建更多的部队，补充现有部队的损失。我们必须下达新的动员令，同时出台一系列鼓励参军的政策，让源源不断的新兵进入兵营。"
 KMG_make_war_plans: "制定战争计划"
 KMG_make_war_plans_desc: "东乌萨斯的局势错综复杂，而我们的敌人也不是泛泛之辈，没有缜密的计划难以战胜。因此，我们必须召开军事内阁会议，制定整体的战略计划，并确保军队能够坚定执行计划，一步一步地向最终胜利迈进。"
 KMG_factories_never_stop: "工厂连轴转"
 KMG_factories_never_stop_desc: "在全面战争的状态下，我们的工时制可能要放弃一些仁慈，因为工厂必须一直维持生产，送到前线的武器和弹药决不能停歇，我们将实行新的两班或三班倒制度，确保工厂能够24小时不间断的生产，保证前线士兵们不至于与敌人肉搏。"
 KMG_victory_of_will: "意志的胜利"
 KMG_victory_of_will_desc: "精良的武器与优秀的训练对一支军队来说确实重要，但如何区分平庸的军队和优秀的军队？显然只有战斗意志能说明一切。我们的军队建设将注重于培养官兵的作战意志和技巧，这使得我们的战士们能坚守更长的时间，奔袭更远的距离，甚至在一定程度上通过超人的意志来弥补我们与敌人之间的科技差距。"
 KMG_turn_on_propaganda_machine: "军国主义宣传"
 KMG_turn_on_propaganda_machine_desc: "过去的军队不注重战争的宣传，但现代的战争学者们告诉我们，宣传在战争中扮演着几位重要的作用。全面启动的宣传机器能告诉士兵们，他们为何而战，从而让他们同仇敌忾，齐心协力。而穿插在煽动性宣传之中的战术战法教育，也能够有效提升士兵的战斗技巧。宣传是一件武器，如果我们能利用好它将事半功倍，即便这意味着需要将谎言重复一千次。"
 KMG_encourage_officer_initiative: "鼓励军官主动性"
 KMG_encourage_officer_initiative_desc: "理论上，军人的使命就是服从，而下级军官自然要服从更上级军官的命令。但是我们可以鼓励他们在执行战役命令的同时，自由决定部队战术，进一步扩大战果；或是在前线获得第一手情报后自主进行火力侦察和袭扰行动。赋权下级军官，鼓励他们的主动性，能够让我们的军队变得更加狡诈，更具有侵略性。"
 KMG_annex_bosque_arms_group: "吞并博斯克军火集团"
 KMG_annex_bosque_arms_group_desc: "切里亚宾的博斯克军火集团在战前一直是乌萨斯最大的军火集团之一，但随着大叛乱爆发，这家由切里亚宾大公控制的军工巨头自然成为了他一人的战争机器。而随着切里亚宾政权被我们彻底摧毁，博斯克军火集团，这个遍体鳞伤的巨人，也将迎来被我们完全吞并的结局。"
 KMG_summarize_war_experience: "总结战争经验"
 KMG_summarize_war_experience_desc: "在战争之中，人的智慧是最重要的。通过汇总各地战报，总结战争经验，我们可以不断更新士兵们的作战手册，从而让战斗更具计划性和科学性。而且让士兵们自主总结作战的经验，能够增进他们对军队的归属感，从而确保他们的忠诚。"
 KMG_create_national_commandos: "创建“国民突击队”"
 KMG_create_national_commandos_desc: "战争是一个大泥潭，无论我们在胜利进军还是收缩防御，战线上的缺口是难以填满的。黑色卫队建议我们，组建一个新的准军事民兵组织，“国民突击队”，将那些狂热但缺乏训练的爱国者们征召进来，利用这些人极高的战斗意志，让他们进行一些伤亡巨大的攻坚行动。同时，也可以将一部分黑色卫队的士兵编入其中，使得这支部队在战斗之余，还可以执行侦察、镇反等特殊职能。"
 KMG_crushing_of_technology: "科技的碾压"
 KMG_crushing_of_technology_desc: "如果要说我们与其他军阀相比，有哪些优势，那么对外的联系绝对是一个。通过与外国军工企业的合作，以及我们自身的研发努力，我们将把士兵武装到牙齿，将我们的军队打造成一支由现代科技结晶缔造出的强大力量，通过科技的力量碾碎我们的敌人。"
 KMG_introduce_new_tactics: "引进核心圈国家战法"
 KMG_introduce_new_tactics_desc: "乌萨斯的战争理论在泰拉大陆早已明显落后了，但我们的大部分军官都只接受过乌萨斯的军事教育，因此他们和其他军阀一样，只会打呆仗。所以我们必须引入外国的更先进的新型战役战略理论，指导我们的军队走向胜利。"
 KMG_create_air_assault_force: "建立空中突击部队"
 KMG_create_air_assault_force_desc: "虽然飞机在现代战争中的地位已经得到认可，然而，似乎很少有人认识到新型的直升机对于地面作战的作用。萨文科娃敏锐地注意到了这一种武器的价值，而乌萨斯的其他人显然还没有意识到直升机的革命性作用。在派遣军官秘密前往其他国家学习后，我们已经有了组建一支空中突击部队的能力，现在只待这支神秘部队投入战场，搅乱敌人的整条战线。"
 KMG_landship_modernization: "陆行舰现代化改造"
 KMG_landship_modernization_desc: "由于我们的陆行舰生产能力被乌萨斯帝国限制，我们手头上的陆行舰全都是老公爵掀起大叛乱那时的产物，虽然老公爵夫人费尽心思将这些钢铁巨兽保存了下来，但她们实际上面临着许多问题，武器系统老旧、舰体结构耗损、缺乏现代通信设备……所幸在现在，我们不用在沙皇面前遮遮掩掩了，我们可以公开与军工企业联系，对我们手头的陆行舰进行现代化改造，然后让这些巨舰重新投入战场。"
 KMG_centralized_command_system: "集中化指挥系统"
 KMG_centralized_command_system_desc: "无线电、电话，乃至最新型的电脑，这些现代科技首次允许我们将指挥系统如此高效的整合在一起，通过统帅部的直接集中化指挥，将军们能够直接指挥数以十万甚至百万的军队，庞大的军队犹如巨兽，在庞大之余却又拥有惊人的灵活性，能够用硕大的体格将对手缠绕、分割，最终将其变成美味的胜利。"
 KMG_reorganization_baikal_energy_company: "重整贝加尔能源公司"
 KMG_reorganization_baikal_energy_company_desc: "贝加尔大公一直是我们在东达利亚的死对头，这个老家伙一直在萨文科娃小姐的对面玩弄着他那自以为是的权术。但现在这个老家伙死在了我们的铁蹄之下，而作为他的遗产之一，掌控了包括乌萨斯最大的一座水电站在内的贝加尔能源公司，已经完全被我们掌控。在对其管理层进行清洗后，这家曾经与我们竞争的能源巨头，现在只能匍匐在我们脚下，为我们的军事工业提供源源不断的能源。"

