#国策树名称

#国策名、描述及配套tip
 KMG_Use_rationing_system_desc: "虽然战争已经爆发，我们的经济政策尚未完全转向，仍然是民用市场经济，但在强敌环伺的情况下，这套体系早已无法运行下去。在战争爆发后，我们的很多外贸渠道都已被切断，许多商品已经断供，而要利用好我们现有的储备，只有一个办法——实行必要的配给制度，由官方直接干预所有物资的分配。"
 KMG_Increased_spending_on_repression_desc: "一个稳定的后方是我们能够维持长时间的战争的首要条件，但战争本身就会破坏社会生产的稳定，我们的敌人更是会处心积虑地破坏我们的后方。而当军队必须在前线推进战线时，内务部门就需要承担更多的镇压职责。所以，对于镇压部门的拨款必须增加，这样才能让反对者都得到他们应得的下场。"
 KMG_Additional_transportation_desc: "战争爆发后，前线与后方的补给线是敌人袭击的重点，而那些和平时期常用的运输路线就显得有些过于醒目，因此，我们必须寻求新的运输路线，包括重启一些废弃线路，或是直接动用大型机械开辟全新的道路。"
 KMG_Establish_Supreme_Economic_Council_desc: "什么是最好的经济体制？萨文科娃的回答是，让领袖和关心人民的精英统制全国的经济，用有形的大手直接掌控资源的分配，从而让那些所谓“新贵族”再也不能用市场的小伎俩欺骗人民。我们恰好可以利用战时经济体制的理由，建立最高经济委员会，由一批信得过的学者和经济官僚对全国的经济进行管理。诚然，这样会让那些小寡头和小市民们不满，但他们本来就不在萨文科娃为乌萨斯人民规划的未来之中。"
 KMG_Strictly_control_resource_trade_desc: "在战争时期，最不应该让市场决定的就是各种资源的流通，许多资源都是稀有而昂贵的，而我们的军队和人民却又非常需要它们。因此，一方面，我们必须紧盯着这些战略资源的去向，另一方面，最高经济委员会可以通过行政手段，管理资源从矿井到工厂的整个流程，做到效率最大化。"
 KMG_new_communications_standards_desc: "由于大部分军阀都是从乌萨斯的旧体制中脱离出来的，他们的通信方式仍然沿用的是旧帝国的老东西。但我们是不同的，既然我们要建立新的秩序，那么整个国家就必须抛弃那些老掉牙的玩意。通过引入炎国和哥伦比亚的通信设备，我们进一步改进我们的通信系统，确定全新的标准，这不仅可以让百姓用上更加高效的电话和无线电，还可以让各级经济委员会的沟通更为顺畅，效率进一步提高。"
 KMG_take_over_far_eastern_university_desc: "在我们完全控制科雷马边疆区后，位于奇廷卡斯克的远东国立大学归于我们治下。这所由被流放的激进派组成的学术天堂，若是能够善加利用，便能成为我们政权的宝贵资产。首先，我们需要逐步接手大学的管理，之后与这些学者们谈一谈，他们将在未来的乌萨斯扮演怎样的角色。"
 KMG_order_business_owners_to_obey_desc: "在决定成立最高经济委员会后，各地的企业主们果不其然开始反对，其中不乏一些和我们的政府联系颇深的人物。虽然在战争的大背景下，这些人迫于压力，还只是停留在口头抗议的阶段，但如果把他们晾在一边，最后闹出关停工厂或是带资投敌的乱子，对我们的恶劣影响不可估量。因此，我们最好动用行政手段或者暴力机关，迫使这些家伙服从。"
 KMG_establish_investment_management_committee_desc: "虽然最高经济委员会理论上控制了全国的经济，但实际上，还是有一定数量的资本家，由于和政府的联系，游离于体制之外。出于管理这些合作者和未来进入我国的外国资本的考量，在最高经济委员会之下，我们新设了一个投资管理委员会，用以引导这些投资者手里的资本去向，保证这些资本流向我们想要它们到达的地方。"
 KMG_convene_business_meeting_desc: "萨文科娃小姐的内在是温和的、充满了文学家特有的人文情怀的。因此，她更喜欢通过一些大家都满意的方式达成目的。一个各企业与政府之间直接对话的会议已经在筹备当中，我们将共同探讨如何在这一动乱时代达成妥协和共赢的最佳平衡。一个新的乌萨斯必然需要这些人的参与，无论是为了战争的最终胜利，还是未来的重建和争夺世界市场。"
 KMG_Split_and_reorganize_guild_desc: "虽然我们已经和一些大企业达成了一致，但是对于数量繁多的中小企业主们，政府实在没有精力去一个个迎合他们的要求。所幸，在各行业的主要企业协助下，我们可以对各行业的行会进行拆分重组，利用行政手段将中小企业囊括其中，建立一种妥协下的法团体制，从而加强我们对经济的掌控能力。"
 KMG_attract_foreign_capital_desc: "外国资本一直以来都是一味激烈的猛药，它可以迅速刺激我国经济发展，但外资的渗透过深对国家来说并不是什么好事。但是就现在来说，一切进入的外资都是为我们的战争所服务的，只不过是战时军事工业体系的一部分。我们也不可能对进入我国的外国资本撒手不顾，一切外国背景的企业都在内务部门的密切关注之中，但总的来说，我们不希望给外国人塑造出不友好的印象。"
 KMG_build_free_trade_port_desc: "杜丁斯科耶虽然是极北少有的良港，也在我们的不懈建设下得到了一定的发展，但终归无法与西部那些历史悠久的港口城市相比。在企业主们的要求下，我们将扩建现有港口，同时将杜丁斯科耶设置成完全的自由港，通过一套新的促进自由贸易的政策来鼓励对外贸易，促进当地经济发展，并且让我们获取外国的资源更加便捷高效。"
 KMG_joint_industrial_equipment_research_desc: "由于乌萨斯帝国的固步自封，我们的工业水平也惨遭连累，乌萨斯产的工业设备在国际上与她的国际地位不符，甚至都比不过一些前殖民地国家。但通过杜丁斯科耶港，我们与外国企业有了更深入的合作，不仅可以单纯进口工业生产设备，还可以发起一些联合研究项目，将他们的机器改良成更适应乌萨斯严寒气候的改进型，并获得他们的生产许可。"
 KMG_sell_nursing_home_desc: "贝加尔大公领的松心山谷疗养院，在和平时期是乌萨斯达官显贵们聚会和度假的地方，也是泰拉有名的旅游胜地，而贝加尔大公也靠着旅游业在之前赚得盆满钵满，只不过这个地方的光芒被贝加尔能源公司完全盖过了。而当松心山谷完全居于我方控制后，如何处置这个因战争荒废的疗养院就成了问题。由于这里的开发潜力仍然很高，也许通过一场拍卖会可以很好地将这个地方抛售出去，还可以对外展示我们的控制力和营商环境，毕竟我们都能开拍卖会了。"
 KMG_promote_republican_ideals: "宣传共和主义理念"
 KMG_promote_republican_ideals_desc: "共和主义是团结着我们政府内大多数人的理念，许多被迫害的学者、士兵、感染者，都寄希望于萨文科娃可以建立一个不同于沙皇政权的国家，国家的领袖不再由血统决定，人民能够获得民主和自由地生活下去的权利，乌萨斯将以共和国之名重生于泰拉大地之上。"
 KMG_inciting_nationalist_fervor: "煽动民族主义狂热"
 KMG_inciting_nationalist_fervor_desc: "乌萨斯民族是泰拉最伟大、最优秀的民族，无论是萨文科娃还是她的追随者们，都对此深信不疑。而阻碍乌萨斯民族迈向她的伟大征程的拦路石，是腐朽的沙皇和唯利是图的新贵族资本家们。乌萨斯真正的灵魂在坚毅勇敢的农民之中，在吃苦耐劳的工人之中，在勇猛无前的士兵之中，只有人民的力量，才能涤荡那些污染伟大民族的蛀虫，实现民族的真正伟大。"
 KMG_determine_principles_for_army: "确立建军原则"
 KMG_determine_principles_for_army_desc: "在沙皇的统治下，乌萨斯的旧军队只不过是为皇帝一人意志驱使的灰色牲口。萨文科娃想要建立的新国家绝不需要这样的军队。军队的结构体制必须向最先进的列强看齐，但与此同时，建军的原则也必须慎重考虑。老将军们都主张保留军队的独立性，但政府内的激进派都认为，军队必须为政治、为人民共和党服务。"
 KMG_advancing_front_desc: "大叛乱使得整个东乌萨斯的局势已经完全失控，我们必须抢占先机，推进对敌人的战线，确保我们的战略纵深。同时，我们将撕下一直以来的伪装，将我们的各种部队重整为正规军队，宣告萨文科娃的野心。"
 KMG_expand_recruitment_scale_desc: "原先的志愿兵与征召兵并不能满足战争的需求，随着战争规模的扩大，我们需要更多的士兵、军官，组建更多的部队，补充现有部队的损失。我们必须下达新的动员令，同时出台一系列鼓励参军的政策，让源源不断的新兵进入兵营。"
 KMG_make_war_plans_desc: "东乌萨斯的局势错综复杂，而我们的敌人也不是泛泛之辈，没有缜密的计划难以战胜。因此，我们必须召开军事内阁会议，制定整体的战略计划，并确保军队能够坚定执行计划，一步一步地向最终胜利迈进。"
 KMG_factories_never_stop_desc: "在全面战争的状态下，我们的工时制可能要放弃一些仁慈，因为工厂必须一直维持生产，送到前线的武器和弹药决不能停歇，我们将实行新的两班或三班倒制度，确保工厂能够24小时不间断的生产，保证前线士兵们不至于与敌人肉搏。"
 KMG_victory_of_will_desc: "精良的武器与优秀的训练对一支军队来说确实重要，但如何区分平庸的军队和优秀的军队？显然只有战斗意志能说明一切。我们的军队建设将注重于培养官兵的作战意志和技巧，这使得我们的战士们能坚守更长的时间，奔袭更远的距离，甚至在一定程度上通过超人的意志来弥补我们与敌人之间的科技差距。"
 KMG_turn_on_propaganda_machine_desc: "过去的军队不注重战争的宣传，但现代的战争学者们告诉我们，宣传在战争中扮演着几位重要的作用。全面启动的宣传机器能告诉士兵们，他们为何而战，从而让他们同仇敌忾，齐心协力。而穿插在煽动性宣传之中的战术战法教育，也能够有效提升士兵的战斗技巧。宣传是一件武器，如果我们能利用好它将事半功倍，即便这意味着需要将谎言重复一千次。"
 KMG_encourage_officer_initiative_desc: "理论上，军人的使命就是服从，而下级军官自然要服从更上级军官的命令。但是我们可以鼓励他们在执行战役命令的同时，自由决定部队战术，进一步扩大战果；或是在前线获得第一手情报后自主进行火力侦察和袭扰行动。赋权下级军官，鼓励他们的主动性，能够让我们的军队变得更加狡诈，更具有侵略性。"
 KMG_annex_bosque_arms_group_desc: "切里亚宾的博斯克军火集团在战前一直是乌萨斯最大的军火集团之一，但随着大叛乱爆发，这家由切里亚宾大公控制的军工巨头自然成为了他一人的战争机器。而随着切里亚宾政权被我们彻底摧毁，博斯克军火集团，这个遍体鳞伤的巨人，也将迎来被我们完全吞并的结局。"
 KMG_summarize_war_experience_desc: "在战争之中，人的智慧是最重要的。通过汇总各地战报，总结战争经验，我们可以不断更新士兵们的作战手册，从而让战斗更具计划性和科学性。而且让士兵们自主总结作战的经验，能够增进他们对军队的归属感，从而确保他们的忠诚。"
 KMG_create_national_commandos_desc: "战争是一个大泥潭，无论我们在胜利进军还是收缩防御，战线上的缺口是难以填满的。黑色卫队建议我们，组建一个新的准军事民兵组织，“国民突击队”，将那些狂热但缺乏训练的爱国者们征召进来，利用这些人极高的战斗意志，让他们进行一些伤亡巨大的攻坚行动。同时，也可以将一部分黑色卫队的士兵编入其中，使得这支部队在战斗之余，还可以执行侦察、镇反等特殊职能。"
 KMG_crushing_of_technology_desc: "如果要说我们与其他军阀相比，有哪些优势，那么对外的联系绝对是一个。通过与外国军工企业的合作，以及我们自身的研发努力，我们将把士兵武装到牙齿，将我们的军队打造成一支由现代科技结晶缔造出的强大力量，通过科技的力量碾碎我们的敌人。"
 KMG_introduce_new_tactics_desc: "乌萨斯的战争理论在泰拉大陆早已明显落后了，但我们的大部分军官都只接受过乌萨斯的军事教育，因此他们和其他军阀一样，只会打呆仗。所以我们必须引入外国的更先进的新型战役战略理论，指导我们的军队走向胜利。"
 KMG_create_air_assault_force_desc: "虽然飞机在现代战争中的地位已经得到认可，然而，似乎很少有人认识到新型的直升机对于地面作战的作用。萨文科娃敏锐地注意到了这一种武器的价值，而乌萨斯的其他人显然还没有意识到直升机的革命性作用。在派遣军官秘密前往其他国家学习后，我们已经有了组建一支空中突击部队的能力，现在只待这支神秘部队投入战场，搅乱敌人的整条战线。"
 KMG_landship_modernization: "陆行舰现代化改造"
 KMG_landship_modernization_desc: "由于我们的陆行舰生产能力被乌萨斯帝国限制，我们手头上的陆行舰全都是老公爵掀起大叛乱那时的产物，虽然老公爵夫人费尽心思将这些钢铁巨兽保存了下来，但她们实际上面临着许多问题，武器系统老旧、舰体结构耗损、缺乏现代通信设备……所幸在现在，我们不用在沙皇面前遮遮掩掩了，我们可以公开与军工企业联系，对我们手头的陆行舰进行现代化改造，然后让这些巨舰重新投入战场。"
 KMG_reorganization_baikal_energy_company_desc: "贝加尔大公一直是我们在东达利亚的死对头，这个老家伙一直在萨文科娃小姐的对面玩弄着他那自以为是的权术。但现在这个老家伙死在了我们的铁蹄之下，而作为他的遗产之一，掌控了包括乌萨斯最大的一座水电站在内的贝加尔能源公司，已经完全被我们掌控。在对其管理层进行清洗后，这家曾经与我们竞争的能源巨头，现在只能匍匐在我们脚下，为我们的军事工业提供源源不断的能源。"


 KMG_Additional_transportation: "增开备用运输线路"
 KMG_Establish_Supreme_Economic_Council: "成立最高经济委员会"
 KMG_order_business_owners_to_obey: "要求企业主服从"
 KMG_establish_investment_management_committee: "成立投资管理委员会"
 KMG_Concentrated_training_workers: "工人集中培训"
 KMG_Concentrated_training_workers_desc: "劳动力、原材料、市场——属于工业经济的三大支柱。如今我们已有充沛的原材料与充满活力的消费市场，但劳动力却在进一步的经济发展中展现出了欠缺之势。工业技术愈发精进，而对于工人所掌握专业知识的需求也愈发提高。为此，我们将组织工人集体参与由国家组织的集中培训，以教授他们工作所需的关键知识。"
 KMG_Comprehensive_economic_plan: "全面经济计划"
 KMG_Comprehensive_economic_plan_desc: "长久以来，许多精英学者们都将“无形的大手”奉作圭臬，认为放开双手让市场自由运转便是最有效的经济模式。这种理念曾经深入人心，但以伦蒂尼姆金融潮为代表的数场经济危机已然证明了纯粹自由市场模式的失败，而未来也将属于政府的“有形大手”而非市场的“无形大手”。正因如此，我们将会开展全面经济计划，进一步加强国家对经济的控制力。"
 KMG_Collective_farm: "集体农庄"
 KMG_Collective_farm_desc: "近代以来的工业化进程早已证明小农经济的低效与落后，为了加强农业生产效率，我们将开展全盘的农业集体化进程，将原本分散的农业劳动整合入集体农庄体系中。虽说这种激进的改革必然会导致诸多具体执行过程中的问题，而政策本身也显然会让许多人联想到什基普塔尔这类社会主义国家所采取的经济政策。但长远来看，它无疑对我国的农业进步大有裨益。"
 KMG_Big_kemergorod_Industrial_zone: "大克缅哥罗德工业区"
 KMG_Big_kemergorod_Industrial_zone_desc: "克缅哥罗德既是萨文科娃小姐的家族祖地，也是她统治的根基所在。虽说克缅哥罗德城显然无法作为长久的政治中心存在，但它作为地区工业与经济、交通中心的地位依然大有价值。我们将会加强向克缅哥罗德工业区的投资，争取将该地打造为一个有着成体系供应与消费链的大规模工业中心。"
 KMG_Endogenous_economy: "内生型经济体"
 KMG_Endogenous_economy_desc: "我国的经济发展需要以我国作为主体，尽可能地排斥外部势力的干涉，而国内每个地区的发展也自然需要以当地人民作为主体。我们将以内生型发展作为经济的主导性理念，鼓励以人为本、城乡合作协调等等概念，并确保发展模式以自下而上为主，依靠基层力量而非纯粹由中央指令推动。"
 KMG_Industrial_future_revolution: "工业未来革命"
 KMG_Industrial_future_revolution_desc: "自第一颗源石工业的火种燃起以来，工业技术的进步便从未停下。维多利亚在机械科学的发展中引领鳌头，可却在电子技术的发展中落后于人。然而，在如今，属于这两种技术的时代都已过去。未来的工业革命将不再只是由一两种核心技术引领，而是会向着全方位的智能化演进，而我们的乌萨斯祖国也绝不会在其中落后于人！"
 KMG_Strictly_control_resource_trade: "严格控制资源贸易"
 KMG_new_communications_standards: "编订新通信标准"
 KMG_take_over_far_eastern_university: "接收远东大学"
 KMG_tundra_transport_network: "铁路工程改革"
 KMG_tundra_transport_network_desc: "自西乌萨斯到乌拉尔山脉，再到东达利亚的广袤土地，乌萨斯祖国被漫长的铁路线所连接起来。这些铁路线大多数都有着悠久的历史，以至于其中不少路段显已过时，而如今所采用的诸多工程建设方法也如同那些老旧轨道一般落后于时代。因此，无论是处于民用还是军事考虑，我们都必须对铁路工程进行改革。"
 KMG_tundra_transport_network_tip: "解锁铁路建设决议"
 KMG_convene_business_meeting: "召集商贸企业会议"
 KMG_Split_and_reorganize_guild: "拆分重组各行会"
 KMG_Commercial_review_system: "商业审查制度"
 KMG_Commercial_review_system_desc: "常言道：“无奸不商”。这句话自古有之，而在今日依然有效。商业上的不公平竞争与欺诈、偷税漏税等等问题虽并非致命，但仍是值得在意的疏漏之处。我们将建立一个体系化的商业审查制度，以促进商业环境与打击商贸活动中暗藏的犯罪行为。"
 KMG_sell_nursing_home: "抛售松心山谷疗养院"
 KMG_build_free_trade_port: "建设自由贸易港"
 KMG_joint_industrial_equipment_research: "联合工业设备研究"
 KMG_Support_local_heavy_industrial_enterprises: "扶持本地重工业企业"
 KMG_Support_local_heavy_industrial_enterprises_desc: "由钢铁、合金机械与矿业为代表的重工业在任何时候无疑都是工业经济的基石。如果没有它们助力，轻工业及农业的发展必将举步维艰。我们将以干涉主义的经济手腕扶植那些扎根自东达利亚本土的重工业企业，以带动整体性的经济发展。"
 KMG_attract_foreign_capital: "吸引外国资本进入"
 KMG_Deepen_international_energy_network: "深化国际能源网络"
 KMG_Deepen_international_energy_network_desc: "从电力到液化源石，我们掌握着各类驱动工业的重要能源。而在我们手上，其价值并不局限于它们本身所能提供的工业价值，更在于它们能在能源网络中的意义。为了能够进一步挖掘这些“工业之血”的价值，我们将深化国际能源网络，加强与那些友好邻国在能源上的合作关系。"
 KMG_Cooperative_economy: "法团协作经济"
 KMG_Cooperative_economy_desc: "国家就如一台精密的机器，而各个阶层的民众在其中则是构筑其的无数齿轮与螺丝钉。但正如机器长久运行会生锈故障一般，在国家机器的细微之处也会有诸多运行不畅之处，就例如经济体系中的众多问题。为此，我们将支持法团主义及协作主义与经济制度之间的有机融合，来促进其能够以更高效率运转。"
 KMG_New_town_construction_movement: "新城建运动"
 KMG_New_town_construction_movement_desc: "在数年之前，我们便曾对克缅哥罗德城区进行过一次翻修与扩建。而如今，随着[KMG.GetName]的领土逐步扩大，一场涵盖范围更广，工程量更大更高的新城建运动也是时候开始了。从住房、工商业区到各类其余建筑都会得到扩张，相信在工人们的挥汗如雨之下，我们治下的无数城市都将焕发出新的光辉。"
 KMG_Ideal_life_in_Ursus: "乌萨斯理想生活"
 KMG_Ideal_life_in_Ursus_desc: "“经济”这个词汇意味着什么？对于学者与官员而言，它或许既代表着无数在报表与文件中跳动的数字，又或许代表着诸如货币、劳动力、商品等复杂概念。可对大多数普通人而言，它的概念却是如此的虚无缥缈，乃至于脱离生活。为了将我国取得的经济成就与民众真正关联起来，我们将向全国宣传“乌萨斯理想生活”的概念，并切实在各方面促进人民的生活水平。"
 KMG_advancing_front: "推进战线"
 KMG_expand_recruitment_scale: "扩大征募规模"
 KMG_make_war_plans: "制定战争计划"
 KMG_factories_never_stop: "工厂连轴转"
 KMG_victory_of_will: "意志的胜利"
 KMG_turn_on_propaganda_machine: "军国主义宣传"
 KMG_summarize_war_experience: "总结战争经验"
 KMG_encourage_officer_initiative: "鼓励军官主动性"
 KMG_Strengthen_soldier_discipline: "强化士兵纪律"
 KMG_Strengthen_soldier_discipline_desc: "无论古今内外，任何军队的纪律都是制胜之关键。毕竟，你怎么能指望一群连指挥官命令都不听，行动全凭我行我素的士兵打赢仗呢？正如同历史上无数优秀军事家所做的一样，我们也需要强化士兵的纪律，使他们能够全心全意地听从指挥。"
 KMG_create_national_commandos: "创建“国民突击队”"
 KMG_Expand_vehicle_production: "扩大车辆生产"
 KMG_Expand_vehicle_production_desc: "无论是为了武装将要组建的机动步兵与装甲步兵，还是考虑到后勤系统的摩托化需求，从重型卡车到摩托车的大规模生产都必不可少。我们将尽可能扩大与改进现有的各类车辆生产线，并投资新建更多汽车厂以供应前线需求。"
 KMG_annex_bosque_arms_group: "吞并博斯克军火集团"
 KMG_reorganization_baikal_energy_company: "整合贝加尔能源公司"
 KMG_Embrace_armored_combat: "拥抱装甲作战"
 KMG_Embrace_armored_combat_desc: "一支真正强大的军队必然不应当局限于简单的徒步步兵与火炮支援，从装甲车、步兵战车再到庞大的主战坦克与高速战舰，我们在重武器上的军备绝不应该落后于时代。现在，是时候扩展军事思维，开启向装甲时代前进的伟大路程了。"
 KMG_crushing_of_technology: "科技的碾压"
 KMG_introduce_new_tactics: "引进核心圈国家战法"
 KMG_create_air_assault_force: "建立空中突击部队"
 KMG_Support_force_construction: "辅助部队建设"
 KMG_Support_force_construction_desc: "正面战场中的士兵在战争中固然重要，但这不意味着相对而言不那么引人注目的辅助部队并不值得我们关注。事实上，在复杂多变的战场上，它们的地位不容忽视。我们将支持各类辅助部队的建设与扩展，以增强军队的综合战斗能力。"
 KMG_Military_academy: "春斯卡娅军事学院"
 KMG_Military_academy_desc: "在基层士兵之上，那些负责指挥与协调的军官乃至更高层的指挥官同样重要。而随着当下的扩军进程，军官缺口也在逐步扩大。既是为了当下的人才需求，也是为了未来我军的长远考虑，我们会在克缅哥罗德以东的春斯卡娅建设一座军事学院以培养军官。"
 KMG_centralized_command_system: "集中化指挥体系"
 KMG_centralized_command_system_desc: "无线电、电话，乃至最新型的电脑，这些现代科技首次允许我们将指挥系统如此高效的整合在一起，通过统帅部的直接集中化指挥，将军们能够直接指挥数以十万甚至百万的军队，庞大的军队犹如巨兽，在庞大之余却又拥有惊人的灵活性，能够用硕大的体格将对手缠绕、分割，最终将其变成美味的胜利。"
 KMG_Large_corps_group_operations: "大兵团集群作战"
 KMG_Large_corps_group_operations_desc: "即便战争中所使用的武器如何改变，战术如何更新，战争的底层逻辑都永远不会改变。从遥远的部落时代到乌萨斯建国之初；从世界大战到第二次大叛乱的当下。集中优势兵力，在关键性战役中以数量压倒敌人的作战方针都从未过时。而我们也将确立这种作战模式为主导，并完善现有的军事理论。"
 KMG_Ursus_style_training: "“乌萨斯”式训练"
 KMG_Ursus_style_training_desc: "构成一支强大军队的根本是什么？这个问题的答案或许不仅限于一种东西，但士兵自身的坚强意志绝对在其中占据着重要地位。而为了锻炼我军士兵的身心，我们将会对现有的训练做出符合乌萨斯人体质的修改。这或许会使许多士兵感到不满，但长远来讲，这对他们而言还是有益的。"
 KMG_Promote_national_heroism: "宣扬民族英雄主义"
 KMG_Promote_national_heroism_desc: "对任何一支军队来说，“我们为何而战”都是个不可逃避的问题，而我们所给予的回答将会是“为乌萨斯民族而战”。每一位军人身上都将担负着保卫这个伟大民族，并甘愿为它献出自己生命的伟大使命。毫无疑问，这种信念必将极大强化士兵们的士气与奉献精神，并激励他们奋勇杀敌，以为乌萨斯民族争取一个更美好的未来。 "
 KMG_Break_barriers_in_command_system: "破除指挥体系壁垒"
 KMG_Break_barriers_in_command_system_desc: "现有军事指挥体系中的无数官僚主义与不合理的组织架构严重妨碍了军队的战斗力，同样也使军事改革大为受阻。我们有必要对其进行一场从上到下的重组，以破除从总司令到每一位普通士兵之间的层层阻隔，将这些“壁垒”彻底摧毁。"
 KMG_Fighting_nation: "战斗民族"
 KMG_Fighting_nation_desc: "自古以来，乌萨斯便是一个善战的民族。千年之前，我们的先祖曾团结在伊戈尔大帝的麾下推翻骏鹰暴政，将这个伟大的民族自枷锁之下解放。而在乌萨斯立国之后，永恒的对外扩张也成为了长远以来的国策。随着我们以乌萨斯民族自古以来的战斗精神将帝国击溃，我军的士气也迈上了新的台阶。而这种“战斗民族”精神将被我辈传承下去，亿万乌萨斯人必须为伟大的祖国而战。"
 KMG_From_night_to_dawn: "三百三十三"
 KMG_From_night_to_dawn_desc: "三百三十三，从夜晚到黎明；\n从黎明再到日落，三百三十三。\n三百三十三，从夜晚到黎明；\n为了乌萨斯祖国“三百三十三”！"
 KMG_Experimental_weapon_application: "实验武器应用"
 KMG_Experimental_weapon_application_desc: "只靠老式步铳武装军队便能打赢仗的日子早就过去，如今已是个战争兵器每年都在推陈出新的时代，而我们对新式武器的研究已有了不少成果。现在，是时候将诸多仍处于实验阶段的武器批量化生产并列装前线，将它们交到士兵的手上“实地测试”了。虽然这些新式武器尚处于实验阶段的可靠性可能会带来一些意外问题，但这么做依然是利大于弊的。"
 KMG_Specialized_engineering_unit: "专业化工程部队"
 KMG_Specialized_engineering_unit_desc: "从东达利亚到西乌萨斯，我们伟大祖国既有着广袤的平原与丘陵，亦有着大片林海雪原。这些地貌或许在和平时期能够成为诗人笔下对大好河山的赞美，但在如今这个大叛乱席卷的动荡时期，它们却在许多时候成为了我们进军路上的阻碍。为此，有必要使工程部队达成专业化，让他们能够适应各类地形并建立起沟壕防线。"
 KMG_Expand_logistics_network: "铺开后勤网络"
 KMG_Expand_logistics_network_desc: "从古至今，战争都不仅限于前线的拼杀，补给战线亦是战争的关键一环。即便再精锐的战士，若缺粮少弹也难以发挥出完全的作战能力。而在我们当下及未来会所面临的战事中，后勤无疑更是至关重要。因此，为确保我军在战争中的顺利推进，必须增强并最大限度地扩展我们的后勤系统。"
 KMG_Victory_of_elegance: "优雅之胜"
 KMG_Victory_of_elegance_desc: "在曾经，战争在诸多时候被人们视作血腥、可怖与不体面的，而士兵们也总是一幅灰头土脸乃至满身鲜血的形象。但随着科技的不断跃进，靠人命填出来的胜利正在成为过去时。如今，无数新型战争兵器开始逐渐替代于前线冲杀的无数军人。随着我们以这些强大的武器叩开圣骏堡大门，以“更优雅的方式”取得胜利已然迈入现实，并成为了我军的闪亮名片。"
 KMG_Aerospace_research_Institute: "飞行器研究院"
 KMG_Aerospace_research_Institute_desc: "在这个时代，战争早已不局限于平面之上。随着空军被引入战争，战场首次有了全方位的立体概念。而对于任何一个强大的国家而言，空军也是必不可少的。虽说我们目前手上的飞机屈指可数，战斗机更是少之又少，似乎毫无组建一支空中部队的基础。但为未来着想，还是应当建设飞行器研究院以为未来的强大空军奠基。"
 KMG_Compile_flight_manual: "编订飞行手册"
 KMG_Compile_flight_manual_desc: "无论兵器怎样先进，仗归根到底还是由人来打的。陆海军如此，空军亦然。相较于飞机本身，飞行员所掌握的战斗技巧才是苍茫蓝天之上的制胜关键。为此，我们将综合老资历飞行员们与他国空军的经验，编订统一的飞行手册以教导新一代的飞行员们。"
 KMG_Improve_fighter_design: "改进战斗机设计"
 KMG_Improve_fighter_design_desc: "由于我国空军起步太晚，目前所采用的许多机型与设计都显已落后于世，因而也必须加强对先进设计的追赶。我们将会积极地学习前人经验，从如哥伦比亚、维多利亚等科技强国的飞行器设计中汲取灵感，以使我们的空军得以追赶上现代化的步伐。"
 KMG_Rule_sky: "统治蓝天"
 KMG_Rule_sky_desc: "空军在战争之中究竟应该扮演何种角色？这个问题自第一架飞机被投入战场之时便随之出现，而几十年来，人们对此的思考可谓异彩纷呈，而我们也将给出属于自己的一份答案：空军的意义在于其对于空域的掌控，其主要职责则在于保持制空优势与对战场的主导性，以协助陆军赢得战役胜利。"
 KMG_Bring_down_heavenly_fire: "降下天火"
 KMG_Bring_down_heavenly_fire_desc:  "空军在战争之中究竟应该扮演何种角色？这个问题自第一架飞机被投入战场之时便随之出现，而几十年来，人们对此的思考可谓异彩纷呈，而我们也将给出属于自己的一份答案：空军的意义在于其对地面敌军的强大打击与压制能力，其主要职责便是以雷霆之势降下天罚，将措不及防的敌人杀个片甲不留。"
 KMG_Formalization_URPP: "人民共和党正规化"
 KMG_Formalization_URPP_desc: "虽名为政党，但乌萨斯人民共和党在当今事实上不过是旧公爵府那套人换了个名字而已。显然，当下的组织形式不过是个过渡性的形态。我们必须将人民共和党正规化为一个真正的政党，才能巩固它在当下及未来的执政根本。"
 KMG_Expand_number_of_members: "扩大党员规模"
 KMG_Expand_number_of_members_desc: "世上从未有一个仅有极少人构成的党能够长久统治国家之事，一个足以长久执政的党必然需要有着足够的民意支持与其自身的体量，而我们的乌萨斯人民共和党亦然。现在是时候通过多种方式向社会宣传我们的党，使各界学富五车之士加入人民共和党，巩固我们的执政之本了。"
 KMG_Decide_the_route_tip: "§R这将决定我们未来的路线§!"
 KMG_Formulate_party_platform: "制定党纲"
 KMG_Formulate_party_platform_desc: "对于任何政党而言，拥有一套完整且清晰的政治纲领都是必不可少的。虽然让人民共和党更加“大帐蓬”化，尽可能吸引到更多人的支持与加入也未尝不是一种选择，但那样也会埋下诸多隐患。因此，我们有必要为人民共和党制定一套属于其的党纲，以确保党在政治方向上的统一。"
 KMG_Vindicating_The_Great_Rebellion: "为第一次大叛乱正名"
 KMG_Vindicating_The_Great_Rebellion_desc: "在世人的传统历史认知中，第一次大叛乱无疑是一场席卷帝国上下的浩劫，而这场浩劫的“罪魁祸首”便是我们萨文科娃小姐的父亲萨文科夫将军。这样的历史认知根植于人们心中，可这能代表它就是正确的吗？如今时机已至，是时候揭露真相，为那些真正的爱国者平反了。我们将会从上到下，全方位地正名第一次大叛乱，自此使民众的历史观念拨乱反正。"
 KMG_Redefining_Ursus_nation: "重定义乌萨斯民族"
 KMG_Redefining_Ursus_nation_desc: "当下的民族主义理论无疑在许多地方仍有着修改的空间，就比如这样一个简单的问题：什么是乌萨斯民族？它究竟仅仅意味着在乌萨斯土地上生活的乌萨斯族人，还是包括所有乌萨斯的人民，乃至这片大地上所有的乌萨斯族？出于现实政治需要，我们有必要对大众认知中的“乌萨斯民族”重新定义，以为民族革命奠基。"
 KMG_Savinkova_youth_league: "萨文科娃青年团"
 KMG_Savinkova_youth_league_desc: "为了使我国的青年人们能够得以历练，也是为了让军事力量能够获得增强，我们将组建一个官方的青年组织，即以我国领导人波尔卡·萨文科娃命名的萨文科娃青年团。这些青少年将在成年人的教导之下组成一个统一的准军事组织，以训练与学习各类他们所需的军事策略，为未来成为真正的士兵而做好准备。"
 KMG_Big_bother: "思想监控"
 KMG_Big_bother_desc: "广大人民无疑是我们事业的根基，可这层根基如今并非完全稳固。在难以察觉的阴暗之处，无数隐秘之敌正在滋生。他们妄图妖言惑众，煽动民众推翻政府以坐食渔利，而我们绝不会容许此等行径继续下去。非常时期行非常手段，在情报机构的努力下，一张涵盖全社会的监控网络将被搭建起来，以随时监测民间的一举一动，并揪出那些妄图挑拨离间的阴谋家。"
 KMG_When_the_Third_Angel_arrives: "第三位天使降临"
 KMG_When_the_Third_Angel_arrives_desc: "在拉特兰正教的神话故事中，第三位天使之降临意味着来一场难以避免的最终审判将要降临。而如今，一场如神话中所述的伟大审判也在前方等待着我们。而那，便是我们未来将究竟走向何方的道路之争。是为共和理想而抛洒热血，还是迈向真正的民族革命？或许，这一切早已命中注定。"
 KMG_Hero_of_republic: "共和国的英雄"
 KMG_Hero_of_republic_desc: "波尔卡·萨文科娃乃何许人也？她由那位挑动第一次大叛乱的萨文科夫将军所生，亦在第二次大叛乱中走上了革除旧命之路。而在如今，这条属于她的道路已然明晰。萨文科娃成为了如明亮晨星般指引着人们的“共和之女”，而她也将引领着乌萨斯祖国与其人民走向一个消除旧日皇权，以共和国之律代替王冠与权杖的美好未来。"
 KMG_Sole_leader_of_Ursus: "乌萨斯之唯一元首"
 KMG_Sole_leader_of_Ursus_desc: "波尔卡·萨文科娃乃何许人也？她由那位挑动第一次大叛乱的萨文科夫将军所生，亦继承了父亲的道路。而在当下，她已在人民共和党之幕僚簇拥之下成为了一位无可置疑的独裁者，而属于她的道路也在刀光剑影与枪炮鸣响之中悄然显现。一场伟大的民族革命将就此启程，而乌萨斯民族必将在这场革命之中迈向那光明前途。"
 KMG_Ideological_appeal: "意识形态吸引力"
 KMG_Ideological_appeal_desc: "在那些老贵族王公眼中，所谓“意识形态”不过是一帮古高卢共和主义乱党发明出来的奇技淫巧。可对于我们这个新生的共和政权来说，意识形态却是针对这些旧势力的制胜关键。无论我们走上了属于共和主义还是民族民粹主义的道路，这些意识形态的吸引力都足以为我国争取到许多潜在支持，并激发民众的心中热忱。"
 KMG_Build_administrative_network: "构建全国性行政网络"
 KMG_Build_administrative_network_desc: "随着我们逐步扩张大到如今的体量，曾经的行政体系已显得无比过时。从内部的贪污腐败，到无数与时代脱节的组织形式乃至过于陈旧的设施与设备，它们的寿命无疑快要到头。毫无疑问，新的时代也必须要有新的行政网络，一个串通全乌萨斯的官僚制度将被搭建起来，而它也将引领着我们将祖国抬上一个新的高度。"
 KMG_Purge_double_dealer: "清洗两面派"
 KMG_Purge_double_dealer_desc: "幸运抑或不幸的是，我们在迈向祖国光明未来的路上吸收了太多对乌萨斯民族与人民共和党缺乏忠诚的“两面派”。他们在表面上效忠国家，背地里却要么对政府的政策发表异见，要么私通藏匿于阴影中的反贼叛党。毫无疑问，这些内部之敌将不会有半点好下场，是时候让他们的政治生命乃至生物学生命就此结束了。"
 KMG_Purge_moderate_tip: "§R温和派顾问将被清洗§!"
 KMG_Integration_of_party_and_state: "党国一体化"
 KMG_Integration_of_party_and_state_desc: "在元首的伟大统治之下，乌萨斯人民共和党将不再仅仅是一个普通的政党。它将与国家机器深度融合，也会在同时深层次地涉及政治体制的方方面面。在我们未来将要走向的光明前途中，国家将全方位地掌控甚至包括每一位公民在内的一切，而党将会成为它最得力的操纵之手。"
 KMG_Sorokin_plan: "苏洛金计划"
 KMG_Sorokin_plan_desc: "毫无疑问，乌萨斯民族是这片大地上最为伟大的民族。可无论多伟大的民族都要面临这样一个问题，即下一代能否继续传承其父辈的优良精神与强健体魄。而正是考虑到这个问题，苏洛金博士提出了他的计划。通过以干预式手段来促进优良基因的延续，并掐断劣质基因的流传，我们的下一代必将青出于蓝而胜于蓝。"
 KMG_Cult_of_Personality_of_Savinkova: "萨文科娃的个人崇拜"
 KMG_Cult_of_Personality_of_Savinkova_desc: "是谁引领着我们走向光荣未来？是谁执掌着伟大的人民共和党？是谁领导着新生的共和政权施行专政？又是谁指引着乌萨斯民族走向打碎枷锁，迈向复兴的伟大道路？她承继了父亲的伟大遗志，誓要摧毁压在人民头上的旧秩；她代表着乌萨斯人民的意志，将整个民族的重担压在自己身上。她，便是波尔卡·萨文科娃，属于全乌萨斯的明亮晨星，我们的伟大领袖。"
 KMG_New_Ursus_culture: "新乌萨斯文化"
 KMG_New_Ursus_culture_desc: "乌萨斯诸多优雅的古典文化的确有其优点，但新时代的新乌萨斯自然也需要属于它的新文化。让我们超越已然过时的现实主义与浪漫主义，同样也抛弃那些来自外界堕落文化的腐蚀吧！如国际上的诸多法西斯主义运动一样，我们也将支持各类先锋主义与未来主义艺术，以其塑造崭新的乌萨斯文化。"
 KMG_Draft_republican_charter: "编写共和宪章"
 KMG_Draft_republican_charter_desc: "毫无疑问，在我们的高歌猛进之中，乌萨斯传国千年的专制皇权正逐步走向崩塌，而属于一个崭新共和制乌萨斯的黎明已在地平线上展现。可无论这个共和国的制度民主或否，它都无疑需要一部属于自己的宪章。因此，现在是时候抛掉过时的旧帝国法典，开始编纂共和国未来将施行的伟大宪章了。"
 KMG_Invite_national_republican_faction: "邀请全国共和派"
 KMG_Invite_national_republican_faction_desc: "虽说在帝国治下，共和主义思潮长久以来遭到压制。但事实上，从布列斯克到奇廷卡斯克，属于共和制度的火种仍在顽强燃烧。我们将拉拢与团结这批有着重大意义的共和派人士们，并邀请他们加入[KMG.GetName]的政府担任诸多职位。当然，共和总是与民主相伴相生，我们也将与此同时开展一些社会改革，使体制变得稍加分权乃至于倾向于民主。"
 KMG_Ursus_republican_tip: "[URS.GetName]的共和派将加入我们"
 KMG_Establish_republican_government: "建立临时共和政府"
 KMG_Establish_republican_government_desc: "随着阻拦我们迈向祖国统一的敌人被逐一击破，我们已由曾经的军阀政权转变为了一个真正能够统领全乌萨斯的政府。而顺应着时事气候，萨文科娃决定与政府中的共和派人士们一同建立一个乌萨斯的全国性临时共和政府，以自此替代那个衰朽不堪的旧帝国，并为未来那个真正强大的新乌萨斯打下第一块基石。"
 KMG_Separate_from_radicals: "与激进派割席"
 KMG_Separate_from_radicals_desc: "幸运抑或不幸的是，我们在迈向共和未来的路上吸收了太多或支持极端民族主义，或希望建立法西斯主义专政体制的激进分子。他们在曾经或许是国家的左膀右臂，但在迈向共和的路上却成了同定时炸弹般的不稳定因素，指不定哪日就会爆炸。为此，我们有必要先下手为强，通过或动用武力，或以秘密行动的方式除掉这帮祸患。"
 KMG_Purge_radicals_tip: "§R激进派顾问将被清洗§!"
 KMG_Eliminate_traces_aristocratic: "消灭贵族政治痕迹"
 KMG_Eliminate_traces_aristocratic_desc: "对于任何一个新生的共和国而言，贵族政治都是绝对无法被忍受的东西。如果旧贵族依旧保有他们的大片领地与无数凌驾于大众头上的特权，那共和制下的平等精神又何从谈起？虽说萨文科娃本人便是贵族出身，但她仍然选择了迈出这步，开启“去贵族化”的进程。自此开始，将旧日耀武扬威的权贵们扫入历史的垃圾堆。"
 KMG_Maintain_personal_dictatorship: "维持个人独裁"
 KMG_Maintain_personal_dictatorship_desc: "或许是由于哥伦比亚这个最大的民主共和国带来的印象，每逢提及共和制，人们心中总会自然而然地将其与民主制度绑定。可追忆这个年轻强权的历史，它又何尝不在马克·麦克斯总统时期无限趋近于专制？虽然许多国内的共和派都希望萨文科娃能够成为乌萨斯的“民主先驱”，但她依旧捍卫了自己的立场。现有的专制制度将被维持，民主主义者们可以洗洗睡了。"
 KMG_Allow_legitimate_opposition: "允许“合法反对派”"
 KMG_Allow_legitimate_opposition_desc: "独裁制度在许多时候都被人们视作不允许任何异议、亦容不得半分反对之声的恐怖体制。在许多独裁者的领地，事实也大抵如此，但在我们治下却绝不会有如此场景。一些以温和方式反对政府决策的民间政治团体将免遭查禁的悲惨命运，而许多“御用反对派”也将在政府支持下组建起来。它们虽难以真正改变政府决策，但也无疑给了民众们一个发声渠道。"
 
