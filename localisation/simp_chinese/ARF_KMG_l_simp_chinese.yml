#民族精神
 KMG_descendant_of_rebellion: "叛乱之裔"
 KMG_descendant_of_rebellion_desc: "克缅哥罗德的前任公爵，老萨文科夫将军，是那一场撼动了整个乌萨斯根基的大叛乱的主要发起者之一。虽然老公爵本人已经在绞刑加火化之后彻底烟消云散，但新任女大公作为他的独女，仍然受到乌萨斯帝国政府的严密监控。沙皇的探子遍布公爵领，甚至包括一名定期进行巡查的内卫。在这样严密的监视下，建立起一支能够与其他力量抗衡的军队极为困难，虽然萨文科娃可以在秘密基地训练士兵，或是借剿匪之名扩充防卫部队，但比起正规军，这种躲躲藏藏的方式，效率显然是非常的低下。"
 KMG_decentralized_industrialization: "分散的工业化"
 KMG_decentralized_industrialization_desc: "由于乌萨斯帝国在大叛乱之后颁布的法令，位于远东的移动城市都不能在未经允许的情况下发展自己的工业，这个旨在限制远东旧贵族的法案确实限制了克缅哥罗德的发展。但在老公爵夫人，叶夫根尼娅·萨文科娃的努力下，一批工厂还是在移动城市之外悄然发展起来，并为公爵领的农民们提供了宝贵且更廉价的工业品。虽然这些分布在乡村和小镇子上的工厂无法通过集聚效应提高生产效率，但是对于新一任女大公来说，母亲留下的这些遗产已经足够她继续自己的事业。"
 KMG_hidden_in_woods: "潜藏于林"
 KMG_hidden_in_woods_desc: "在外人看来，波尔卡·萨文科娃是一个与世无争的女公爵，她时常透露出对其父亲命运的恐惧，因此比起纵横捭阖，这位尚未褪去稚气的贵族小姐似乎更倾心于文艺创作。应该说，萨文科娃对文学的喜爱并非假象，但她的野心的确不为人所知。虽然在相当长的一段时间内，出于保存实力的需要，萨文科娃没有展现出自己的政治倾向，确实让西边的沙皇和新贵族们放松了一些警惕，但与此同时，这也代表着女大公的政治影响力极其的微弱。"
