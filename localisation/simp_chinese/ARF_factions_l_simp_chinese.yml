 faction_libertyland_treaty_organization: "自由大陆公约组织" #简称LiTO 自约

 faction_zwillingstuerme_pakt: "双塔协定" #简称Zwilpakt 双协
 
 faction_shenzhou_league: "东陆防御公约" #简称 东陆公约

 eastern_continent_defense_goal_name: "保证东陆集体利益"
 eastern_continent_defense_goal_desc: "东陆从不缺少强邻与旧怨，缺的是一次把诸邦写进同一份誓书的机会。公约不索取土地，也不干涉内政：凡签约者，其疆界即全体签约者的疆界。以集体之名，东陆的每一寸土地都不应成为下一个被吞并的注脚。"

 faction_communist_international: "共产国际" #简称Comintern 国际

 faction_terra_balance_committee: "泰拉平衡委员会" #简称TBC 平委

 faction_regulation_pact: "圣骏堡规程" #简称 规程 / Регламентный Пакт

 regulation_pact_manifest_name: "维持秩序稳定"
 regulation_pact_manifest_desc: "秩序从来不是天上落下来的。它由哨所、铁路时刻表和一份份签过字的规程堆起来。圣骏堡的条款简短得近乎粗暴：签约者的边界由全体签约者担保，签约者内部的动乱即被视为对规程全体的动乱。这份文件里找不到自由的段落——在乌萨斯看来，自由与秩序从来不是可以并列的两样东西。"
