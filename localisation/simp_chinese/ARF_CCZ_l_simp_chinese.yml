#国家元首
 CCZ_characters_1: "简·威森伯格"
 CCZ_characters_1_desc: "作为政治学和法学的博士，简·威森伯格女士一开始其实并不满意她的位置，南部贸易联盟是一个政界对商界妥协的产物，而成为其中的政府专员显然不是一个好差事。但当她来到马克西米安波利斯以后，威森伯格女士立即意识到了这个位子的含金量。在哥伦比亚国内难以弥合的政商关系在这里得到了惊人的融合，她的外交和政治才干可以在这个代表了哥伦比亚国家意志的职位上尽情施展。在理清了运河共管领复杂的外交关系和社会形势以后，出生于洛斯维加斯的威森伯格开始筹划一场豪赌，这将比任何一个赌局的赔率都要丰盛，因为结局将会是赢者通吃。"
