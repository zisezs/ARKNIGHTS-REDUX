#民族精神
 CCZ_ideas_1: "门户开放的桥头堡"
 CCZ_ideas_1_desc: "数百年前，伊比利亚利用阿戈尔科技切开了萨尔贡的血管，而为了防止萨尔贡运河这一道可怖的伤疤愈合，伊比利亚在运河和扎伊尔湖两岸占领了大片土地，在官方文书中，这是伊比利亚帝国向萨尔贡“租借”的领地。在大静谧摧毁了伊比利亚之后，这些所谓的“租界”并没有被归还给萨尔贡，而是被如同看见了尸体的黑羽兽一般闻讯而来的列强们瓜分，而就在列强们为了这些土地争得剑拔弩张时，后来者哥伦比亚提出了一个方案：各国建立一个协调委员会，以共同管理的方式分配在萨尔贡的利益。这个被称为“门户开放”的政策很快得到了各国的认可，并且成为了运河共管领一以贯之的治“国”方略。只要哥伦比亚特区、伦蒂尼姆、崔林特尔梅和圣骏堡的大人物们需要，萨尔贡运河共管领就会为他们榨掉萨尔贡人的最后一滴油水。"
 CCZ_ideas_2: "联合商团"
 CCZ_ideas_2_desc: "列强们不可否认的事实是，萨尔贡运河共管领的建立并不怎么正当，萨尔贡的民族主义者们时不时就会在共管领的移动城市里打冷枪或是放路边炸弹，所以，如何保护运河共管领里各国的利益，便成为了一个重要的问题。而最终解决方案，就是如今的“泰拉联合商团”。这支承担着运河共管领的全部防卫任务的武装力量，不隶属于任何一个列强指挥或管辖，其成员皆是来自各国的“志愿者”，如果说黑钢国际之流也是“志愿”的话。无论如何，联合商团的扁平化管理兴许会让其在军事行动中寸步难行，但是作为一个镇压反抗力量的非官方准军事组织，联合商团的架构已经足够完成它分内的任务。"
 CCZ_ideas_3: "万国理事会"
 CCZ_ideas_3_desc: "万国理事会是基于“门户开放”政策而设立的国际协调机构，总部位于古阿加门帝国的旧都，马克西米安波利斯。这一机构设立的初衷是协调萨尔贡地区各列强之间的利益分配，避免几个大国在黄沙或雨林之间大打出手。而随着运河共管领形成规模，理事会还承担起了这些占领区的实际政府职能，至少对殖民者们如此。并且随着泰拉核心圈的政治格局演变，高卢在覆灭后被理事会除名，而逐渐恢复元气的伊比利亚和经济地位不断上升的雷姆必拓则成为了观察员国，但仍然无法挑战哥伦比亚、维多利亚、莱塔尼亚、乌萨斯这四大巨头的地位。\n由于万国理事会采取一国一票制度，因此理论上没有一个国家可以操控理事会，但理事会还需要一个最高执行官，因此，坐在最高执行官办公室里的那个人来自哪个国家，哪个国家就在这片遥远的土地上占据优势。\n当前的理事会控制者：§Y哥伦比亚§!"