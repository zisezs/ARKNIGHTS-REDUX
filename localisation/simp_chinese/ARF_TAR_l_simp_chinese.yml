#事件
 event_tar.2.t: "先发制人"
 event_tar.2.d: "“我向第二集团军军部发电报，让他们派风暴突击队过来稳定局势，萨尔达安姆回电，竟然不许！”汉密尔顿上校将电文重重甩在沙盘上，还觉得不解气，又踹了一脚桌腿。\n\n坐在办公桌前的希尔中校冷笑一声，啜饮了一口红茶，“丽塔将军可是温德米尔公爵身边的大红人，公爵折戟伦蒂尼姆后，那个鲁珀女人就被火速提拔，现在都高升军长了。”\n\n“进军伦蒂尼姆失败的消息就像给那帮叛匪打了睾酮似的，昨天我们在邓多敦又丢了五个弟兄。这帮深池恐怖分子就像杂草一样，割了一批又来一批。”汉密尔顿上校恼火地挠头，“事到如今，看来必须执行那个‘非常计划’了。”\n\n“哪个计划？”希尔放下茶杯，警觉起来，“不会是用源石脏弹那个计划吧。我以为你说着玩儿的。”\n\n“你觉得外面那些叛匪是打着玩的吗？”汉密尔顿上校瞪着他的副官，“必须让法斯特维尔的轰炸机带弹值班，哪里有深池的部队就炸掉哪里。”\n\n“你这样会激化局势！”希尔中校一拍桌子站了起来，然而，汉密尔顿上校的手铳在下一秒就顶上了他的脑门。\n\n“希尔，你当我是傻子吗？你这个被深池收买的内鬼！”上校恶狠狠地说道，“你们这些塔拉出身的傻逼都不可信！老子早就派人跟踪你了！”\n\n被拆穿身份的希尔只是闭上眼睛，嘴角露出微笑。在他的手伸向腰间的军刀的那一秒，一声枪响在指挥所的墙壁上绘出一朵血花。\n\n汉密尔顿上校把枪收回枪套中，看着从门外冲进来不知所措的卫兵，他拿起希尔尸体边上那一台黑色电话的听筒。"
 event_tar.2.a: "“给我接法斯特维尔空军基地。”"