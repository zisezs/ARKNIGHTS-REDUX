#国家领袖
 BIL_Fickerz_Thompson: "菲克尔兹·汤普森" 
 BIL_Fickerz_Thompson_desc: "1064年，菲克尔兹·汤普森出生于哥伦比亚特区的富庶之家，父亲和母亲都是公务员，这给了菲克尔兹一个安逸的童年，他在幼年时便能坐着父亲的车到距家几十公里远的税务局去接触到那里的工作流程，税务局的日常工作给他留下了很深刻的印象，他也亲眼在那里见证了父亲是如何与上流社会打交道的，哥伦比亚的大公司在避税环节往往要与税务官们进行沟通，这个权职也充斥着一些有利于双方的交易。很快菲克尔兹也通过父亲学会了人生的第一课，那就是当你攥紧权力，那些有钱人就不得不来巴结你。父亲答应帮助加尔塞斯矿业公司隐瞒一批存货的资产走向，借此获得了努力工作几十年都赚不来的财富。家中便与公司建立了一定的关系。\n\n年幼的经历深深刻印在菲克尔兹心里，他沿着父亲安排的人生道路，大学毕业后成为了一名外交人员，在1094年他三十岁的时候接手了北萨尔贡问题，这个位置充斥着危险，他在前往比勒陀利亚之前已经有三个大使在当地被暗杀。加尔塞斯矿业公司和当地的感染者冲突也愈演愈烈，他很有可能成为第四个牺牲品，不过菲克尔兹还是去了。\n\n比勒陀利亚仍在经济危机的余波中挣扎，他们对哥伦比亚人没有好感，不过菲克尔兹不在乎，他只想安全的攥住自己的权力，然后在这个过程中给自己谋求一张在哥伦比亚官运亨通的金票，他是权力道路上的冒险者。" 
