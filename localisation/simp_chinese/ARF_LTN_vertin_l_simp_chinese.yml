l_simp_chinese:

# ============================================================================
# 莱塔尼亚 (LTN) ·「司辰的暴雨」维尔汀线本地化
#   对应 common/national_focus/LTN_vertin_shared.txt / events/LTN_vertin.txt
#   / common/ideas/LTN vertin_ideas.txt / common/decisions/LTN_vertin_decisions.txt
#   / common/dynamic_modifiers/LTN_vertin_dynamic_modifiers.txt
#   / common/characters/LTN.txt 的 LTN_Vertin
# ============================================================================

# ---- 一、15 格国策 ----
 LTN_vt_who_is_vertin: "维尔汀是谁？"
 LTN_vt_who_is_vertin_desc: "宫廷的记录里只有一句：外邦人，持手提箱，无人知道她的来历。女皇的声音很轻——先弄清她是谁，再决定要不要见她。"

 LTN_vt_local_storm: "局部突发暴雨"
 LTN_vt_local_storm_desc: "哥伦比亚麦克斯邮报援引莱国之声的报告：雨滴并非从天而降，而是从地面升向天空，仿佛大地在洗涤自己。被溶解与被回溯的人都从那场雨里消失，建筑物、行人甚至意识都被抹去，世界退回过去的某个时间点。"

 LTN_vt_arrival_of_timekeeper: "司辰的到来"
 LTN_vt_arrival_of_timekeeper_desc: "维尔汀，圣洛夫基金会的司辰，带着自己的小队抵达。她是已知唯一能完全免疫暴雨回溯的个体，手提箱可以庇护神秘学家，对人类无效；腕上的辉光管表监测暴雨周期。黑女皇与Z女士谈判之后，她短期驻扎莱国。"

 LTN_vt_arcane_academy: "建立莱塔尼亚神秘学学院"
 LTN_vt_arcane_academy_desc: "重塑之手还是来了。维尔汀满一个月大时被送进第一防线学校——基金会辖下收容未成年神秘学家的机构，她在那里是最小的孩子。为了保卫泰拉，Z女士与几名对泰拉有兴趣的高层认为学院要广泛征召神秘学家。"

 LTN_vt_chicago_lesson: "芝加哥的教训"
 LTN_vt_chicago_lesson_desc: "重塑之手已经渗透了这座城市的权力网络，经济大萧条的种子被他们浇水施肥——他们要提前触发一九二九年的暴雨。芝加哥最终还是被吞没了，但维尔汀记住了阿尔卡纳看她的眼神，那不是敌人的审视，更像某种期待。"

 LTN_vt_world_in_suitcase: "箱中的世界"
 LTN_vt_world_in_suitcase_desc: "手提箱里装着一间可以躲过暴雨的房间，也装着基金会愿意交给莱塔尼亚的那点信任。维尔汀不希望灾难重演，史塔西与女皇之声开始重点监视内部，黑山羊说服了白羊。"

 LTN_vt_hand_in_shadow: "阴影中的手"
 LTN_vt_hand_in_shadow_desc: "面具下的脸被一张张对上名册：伯爵、选帝侯的继承人、高塔里被判定造诣欠佳的学生。金律殿堂把档案摊开在长桌上，这一次不需要等到庆典之夜。"

 LTN_vt_unpaid_summer_job: "暑假工小维没有工资"
 LTN_vt_unpaid_summer_job_desc: "维尔汀第一次意识到钱这件事，是在基金会财务部和联合帝国财政大臣鲍威尔斯之间。她要报销移动城市费、驼兽费、弹药消耗，还有星锑在酒吧砸碎的那把吉他。财务部的男人从眼镜上方看她：暑假工没有工资，也没有报销。"

 LTN_vt_mistletoe_shares: "槲寄生的股票"
 LTN_vt_mistletoe_shares_desc: "美国人和哥伦比亚人有什么区别！维尔汀收下了那张持有券，然后发现槲寄生给她的远不止五万美金，还有十四行诗的照片。"

 LTN_vt_columbia_merchant: "哥伦比亚商人"
 LTN_vt_columbia_merchant_desc: "钱，还是钱。司辰要弄懂这些，才能作为政府顾问活下去。商队的合同与工厂的订单写在同纸上，只是签字的人不一样。"

 LTN_vt_shares_and_arts: "股票与神秘术"
 LTN_vt_shares_and_arts_desc: "我猜，莱塔尼亚自由派又要哀嚎。不过现在是紧急状态，我们要快点——把法术的产能折算成票面，再把票面折算成机床。"

 LTN_vt_ducat_circulation: "杜卡特的流通"
 LTN_vt_ducat_circulation_desc: "杜卡特是莱塔尼亚的国家货币，铸着双塔的纹章。要提振它的信用来制衡龙门币，先得让边远城镇的银库只认这一种钱。"

 LTN_vt_originium_curse: "源石的诅咒"
 LTN_vt_originium_curse_desc: "源石既能治人也能吃人，莱塔尼亚在这条线上走过一千年。雷姆必拓与波利瓦尔的资本愿意把炉子建到九大区，只要宫廷保证矿脉的开采权不受选帝侯的世袭账目干扰。"

 LTN_vt_mefo_bonds: "梅福券的应用"
 LTN_vt_mefo_bonds_desc: "黑女皇的银行家亨利认为，要快速把杜卡特和龙门币放在一起比较，先要提振经济。维尔汀不懂这些，只能交由十四行诗和圣洛夫基金会高层。不过，梅福券怎么感觉怪怪的——这些券在一〇九九年之前到期。"

 LTN_vt_corporate_refuelling: "企业加油"
 LTN_vt_corporate_refuelling_desc: "你知道这意味着什么吗？苏芙比第一次看到平衡伞工厂的财务报告时这样问。司辰把报告推到她面前：只要希望时代还在，重建速度就可以超过暴雨的回溯速度。那份账上的数字不好看，但它有一个之前所有账本都没有的东西。"

# ---- 二、国策效果说明 ----
 LTN_vt_storm_tt: "§Y莱国之声§!把这份报告送到双塔的案头，§G圣洛夫基金会§!的代表随后请求入境。"
 LTN_vt_advisor_tt: "§Y维尔汀§!进入莱塔尼亚人才池，并被任命为§G政治顾问§!；同时获得 §G325§! 陆军经验。"
 LTN_vt_academy_units_tt: "编制§Y司辰机动中队§!被写入名册（§R模板锁定，不可编辑§!），并在首都成建制拉出 §G5§! 个师。"
 LTN_vt_hunt_remake_tt: "获得§Y追捕重塑之手§!：只有在与重塑之手的叛军交战时，陆军进攻 §G+20%§!、组织度 §G+5%§!、突破 §G+5%§!。"
 LTN_vt_arrest_tt: "触发事件§Y「阿纳卡姆，你被捕了」§!；可征召人力 §R-5,000§!。"
 LTN_vt_embrace_tt: "获得精神§Y手提箱庇护§!，并触发事件§Y十四行诗的拥抱§!（维尔汀心情 §G+5§!）。"
 LTN_vt_civilwar_tt: "获得§Y阿尔卡纳档案§!与§Y追捕重塑之手§!，战争支持度 §G+10%§!。\n§R重塑之手将在莱塔尼亚境内举旗叛乱——内战结束后，司辰会离开。§!"
 LTN_vt_merchant_tt: "获得精神§Y哥伦比亚商人§!：民用工厂产出 §G+20%§!，产线最大效率 §G+10%§!。"
 LTN_vt_finance_tt: "解锁决议页签§Y金融介入§!：把法术产能与票面折成工席与军械产线。"
 LTN_vt_originium_tt: "解锁决议页签§Y源石设施投资§!（五条，合计 §G+30§! 座民用工厂），并获得§Y源石经济战§!。"
 LTN_vt_break_monopoly_tt: "行会垄断被拆开：只要重建速度快过暴雨的回溯速度，账本上就会出现§G正数§!。"

# ---- 三、事件 ----
 LTN_vertin.1.t: "圣洛夫基金会的到来"
 LTN_vertin.1.d: "一场局部的暴雨落在莱塔尼亚的土地上，而雨滴是从地面向上升起的。双塔的宪兵封锁了三条街，女皇之声在废墟外唱了一遍又一遍。然后有使者递上名片：圣洛夫基金会，请求入境调查。"
 LTN_vertin.1.oa: "让他们进来。金律乐章不需要害怕一场雨。"
 LTN_vertin.1.ob: "先把雨记录进档案，再谈入境。"
 LTN_vertin_1_ob_tt: "记录会留在§Y金律殿堂§!的档案柜里，等待它的主人来翻阅。"

 LTN_vertin.2.t: "阿纳卡姆，你被捕了"
 LTN_vertin.2.d: "宪兵队长官在清晨敲响了一栋公寓的门。面具被摘下，站在门口的是一位伯爵的儿子、选帝侯的继承人。黑山羊说服了白羊，女皇之声把逮捕令读得很慢——不是因为犹豫，是因为要让更多人听见。"
 LTN_vertin.2.oa: "关进金律殿堂，慢慢查。"
 LTN_vertin.2.ob: "公开审判，让九大区都听见名字。"
 LTN_vertin_2_ob_tt: "公开的名字会带来恐慌，也会带来§G战争支持度§!。"

 LTN_vertin.3.t: "十四行诗的拥抱"
 LTN_vertin.3.d: "十四行诗把手提箱放回桌上，抱得很用力。她说：司辰，我们不是来拯救世界的，我们只是不想让它在我们的注视下被改写。"
 LTN_vertin.3.oa: "那就从这座城开始。"
 LTN_vertin_3_mood_tt: "维尔汀的心情 §G+5§!，当前读数 §Y[?LTN_vt_mood|0]§!。"

 LTN_vertin.5.t: "阴影中的手"
 LTN_vertin.5.d: "档案上的名字一个个对上了脸。他们在高塔里被淘汰，在剧院后门交换密码表，在贵族的婚礼上把宪兵全部调走。现在，他们决定不再藏面具。"
 LTN_vertin.5.oa: "那就让他们站到光里来。"

 LTN_vertin.6.t: "重塑之手举旗"
 LTN_vertin.6.d: "几个大区在同一夜挂出了自己的旗。他们自称重塑之手，说自己要改写的不是一座城，而是整场暴雨。金律乐章第一次在同一份名册上出现了两种唱法。"
 LTN_vertin.6.oa: "莱塔尼亚的意志不容改写。"

 LTN_vertin.7.t: "司辰离开莱塔尼亚"
 LTN_vertin.7.d: "辉光管表归零，暴雨周期回到了它该有的位置。维尔汀把手提箱交还给基金会的人，说：这里的账我不再管了。黑女皇只回了一句：谢谢，暑假工。"
 LTN_vertin.7.oa: "一路顺风，司辰。"
 LTN_vertin_7_tt: "§Y维尔汀§!离开内阁并退出人才池；双塔把这段记录归档为一次成功的合作。"

 LTN_vt_arcana_leader_desc: "重塑之手在莱塔尼亚的执行人。面具之下的名字出现在金律殿堂的档案里，也出现在选帝侯的家谱上。"

# ---- 四、民族精神 ----
 LTN_vt_suitcase_sanctuary: "手提箱庇护"
 LTN_vt_suitcase_sanctuary_desc: "箱子里有一间不会被回溯的房间。双塔把它借给核心领土的防御工事：城墙后面站着的不只是士兵，还有一个不用躲雨的证人。"

 LTN_vt_arcana_archive: "阿尔卡纳档案"
 LTN_vt_arcana_archive_desc: "司辰小队留下的一份卷宗：重塑之手的关系网、资金走向与面具下的名字。宪兵与密探第一次不用凭猜测去抓人。"

 LTN_vt_aid_network: "外部资助网络"
 LTN_vt_aid_network_desc: "神秘学家们的私房钱汇进了帝国账户。钱不多，也不要求回报——只是每一笔都要在账上写出用途，而宫廷第一次照着写了。"

 LTN_vt_columbia_backing: "哥伦比亚商人"
 LTN_vt_columbia_backing_desc: "商队的订货单把工厂的炉子重新点起来。他们要的是乐器、法术装置与合格的产线，别的都可以谈。"

 LTN_vt_ducat_reserve: "儿储备"
 LTN_vt_ducat_reserve_desc: "杜卡特被钉上了准备金。票面稳住的当天，宫廷的文书写得最快，主战的声音也最响。"

 LTN_vt_era_stockpile: "跨时代物资储备"
 LTN_vt_era_stockpile_desc: "企业把垄断拆开之后，仓库里第一次堆满了不为庆典、不为战争，只为重建而存的物资。"

 LTN_vt_mefo_applied: "梅福券的应用"
 LTN_vt_mefo_applied_desc: "银行家亨利把券发到每一个工地。炉子、要塞、雷达站与炼油厂都在同时动工，只是每一张券都要在§Y一〇九九年§!之前兑付——而政治点数正被这些工程一寸寸吃掉。"

# ---- 五、两枚定向精神（dynamic modifier） ----
 LTN_vt_dyn_hunt_remake: "追捕重塑之手"
 LTN_vt_dyn_hunt_remake_desc: "只有正在与重塑之手的叛军交战时才生效：陆军进攻 §G+20%§!，组织度 §G+5%§!，突破 §G+5%§!。档案在手，剑不必再四处乱挥。"

 LTN_vt_dyn_originium_war: "源石经济战"
 LTN_vt_dyn_originium_war_desc: "只有正在与重塑之手的叛军交战时才生效：民用工厂产出 §G+25%§!，消费品需求 §G-5%§!。他们的炉子被封条贴住，我们的炉子被重新点火。"

# ---- 重塑之手叛军专属 ----
 LTN_vt_remake_creed: "改写乐章的人"
 LTN_vt_remake_creed_desc: "他们说金律乐章只是上一个时代的回声，要由他们的手重新谱写。招兵很快，人心却始终悬着：陆军进攻 §G+5%§!，征兵 §G+5%§!，战争支持度 §G+10%§!，稳定度 §R-5%§!。"

 LTN_vt_remake_net: "重塑之手的密网"
 LTN_vt_remake_net_desc: "面具、密码表与剧院后门织成的网络比宪兵的老办法灵得多。反间谍 §G+15%§!，失范防御 §G+10%§!。"

 LTN_vt_remake_arcana: "面具之下"
 LTN_vt_remake_arcana_desc: "阿尔卡纳从不摘下面具。摘下过的人都说，那下面什么都没有——只有一双记着暴雨的眼睛。"

# ---- 六、顾问 ----
 LTN_Vertin: "维尔汀"
 LTN_Vertin_advisor_desc: "圣洛夫基金会的司辰，目前已知唯一能完全免疫暴雨回溯的个体。她按辉光管表的读数安排休息与出勤，也按同一份读数决定这座城还剩下多少时间。"
 LTN_adv_vertin: "暴雨中的司辰"
 LTN_adv_vertin_desc: "她把操典当成乐谱来读：哪儿不对，就在那里补一小节。"

# ---- 七、决议页签 ----
 LTN_vt_purse_decisions: "司辰小金库"
 LTN_vt_purse_decisions_desc: "暑假工没有工资，但她已经开始替这座城算账。"

 LTN_vt_remake_decisions: "反重塑之手"
 LTN_vt_remake_decisions_desc: "档案、宪兵与女皇之声按同一份名册行动。"

 LTN_vt_finance_decisions: "金融介入"
 LTN_vt_finance_decisions_desc: "把法术的产能折算成票面，再把票面折算成机床。"

 LTN_vt_originium_decisions: "源石设施投资"
 LTN_vt_originium_decisions_desc: "雷姆必拓与波利瓦尔的资本进场，矿脉的开采权写进宫廷的合同。"

 LTN_vt_mefo_decisions: "梅福券兑付"
 LTN_vt_mefo_decisions_desc: "§R一〇九九年之前到期。§!两条都要在到期前点完。"

# ---- 八、决议正文 ----
 LTN_vt_dec_economy_question: "笨蛋，问题在经济"
 LTN_vt_dec_economy_question_desc: "维尔汀把财政大臣的账本翻到最后一页，然后合上：问题从来不在钱上，在钱从哪里来。消费品需求 §Y+10%§!，为期 60 天。"

 LTN_vt_dec_excalibur: "好吧，红弩箭交给你了"
 LTN_vt_dec_excalibur_desc: "她把产线的调度交给更懂机械的人，自己去看暴雨的周期。民用工厂产出 §G+10%§!，政治点数获取 §G+5%§!，消费品需求 §G-2%§!。"

 LTN_vt_dec_folk_patronage: "接受神秘学家民间资助"
 LTN_vt_dec_folk_patronage_desc: "信封里没有署名的，多半是学生在自己少吃一顿之后凑出来的钱。政治点数 §G+70§!。"

 LTN_vt_dec_remake_sweep: "按档案抓人"
 LTN_vt_dec_remake_sweep_desc: "宪兵按卷宗上的地址一家家敲门，面具在门口被摘下来。稳定度 §R-1%§!，到期后政治点数 §G+45§!、人力 §G+10,000§!。"

 LTN_vt_dec_remake_funding: "断其资财"
 LTN_vt_dec_remake_funding_desc: "重塑之手的钱走过三家当铺与两座剧院。反间谍 §G+15%§!，到期后政治点数 §G+30§!、陆军经验 §G+15§!。"

 LTN_vt_dec_remake_voice: "女皇之声宣讲"
 LTN_vt_dec_remake_voice_desc: "台上唱的还是金律乐章，台下听的人第一次被点名。失范防御 §G+10%§!，到期后稳定度 §G+3%§!、战争支持度 §G+2%§!。"

 LTN_vt_dec_grain_short: "做空粮价"
 LTN_vt_dec_grain_short_desc: "把账面利润换成工席：到期后民用工厂 §G+2§! 座。"

 LTN_vt_dec_art_patent: "神秘术专利授权"
 LTN_vt_dec_art_patent_desc: "法术装置的设计图纸换成特许费。到期后军用工厂 §G+2§! 座、陆军经验 §G+10§!。"

 LTN_vt_dec_theatre_bond: "剧院包场承销"
 LTN_vt_dec_theatre_bond_desc: "帝国最大的两座音乐厅被拿来发债，票房成了担保。到期后政治点数 §G+60§!。"

 LTN_vt_dec_originium_line_1: "源石产线·第一条"
 LTN_vt_dec_originium_line_1_desc: "卢滕区的旧炉子被重新点上。到期后民用工厂 §G+6§! 座。"

 LTN_vt_dec_originium_line_2: "源石产线·第二条"
 LTN_vt_dec_originium_line_2_desc: "雷姆必拓的工程队带来了一套不用贵族签字的流程。到期后民用工厂 §G+6§! 座。"

 LTN_vt_dec_originium_line_3: "源石提纯工坊"
 LTN_vt_dec_originium_line_3_desc: "把碎屑变成可以入药的结晶。到期后民用工厂 §G+6§! 座、政治点数 §G+20§!。"

 LTN_vt_dec_originium_line_4: "波利瓦尔的矿权合同"
