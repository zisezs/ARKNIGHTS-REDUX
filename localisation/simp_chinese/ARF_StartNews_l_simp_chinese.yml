l_simp_chinese:
 start.1.t: "欢迎游玩PRTS-模拟作战终端"
 start.1.d: "十分感谢您游玩我们的MOD，因为组内成员忙于各自的学业或是工作，使得MOD如今才姗姗来迟\n\n由于制作时间不多，目前版本是我组临时赶制出来的，也因此不可避免会有不少的漏洞以及不完全和瑕疵甚至于空缺的地方，敬请谅解\n\n请注意，因为是临时制作版本，所以目前卡兹戴尔所有的相关内容都是暂时的，正式版本的卡兹戴尔相关内容将会做出大量的修改和删减。正式版本的卡兹戴尔将会在每一个大版本更新时同步更新部分内容，以及正式版本的内容将会更加丰富以及精细，尽请期待！\n\n最后，祝愿各位玩得开心：）"
 start.1.a: "………"