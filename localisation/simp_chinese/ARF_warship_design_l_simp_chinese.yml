 ARF_WSD_SLOT_sp: "特种"

 # ===== 设计台 · 摘要 =====
 ARF_WSD_SUM_TITLE_1: "炮舰 §T· 轻型压制平台§!"
 ARF_WSD_SUM_DESC_1: "最轻的一型。四座工厂三个月一条，装不下超重型主炮，也扛不住正面——它存在的意义是让每个师都能带上一点舰炮。"
 ARF_WSD_SUM_COST_1: "占用军工厂：§Y[?arf_ws_gb_cost]§! 座 §T（裸装 2 座）§!"
 ARF_WSD_SUM_DAYS_1: "建造周期：§Y90§! 天（不随配件变化）"
 ARF_WSD_SUM_STATS_1: "当前方案合计加成\n软攻 §Y+[?arf_ws_gb_soft]%§!   硬攻 §Y+[?arf_ws_gb_hard]%§!   穿甲 §Y+[?arf_ws_gb_ap]%§!\n装甲 §Y+[?arf_ws_gb_armor]%§!   对空 §Y+[?arf_ws_gb_air]%§!   可靠 §Y+[?arf_ws_gb_rel]%§!\n§T支援连§! 攻§Y+[?arf_ws_gb_bnatk]%§!  防§Y+[?arf_ws_gb_bndef]%§!  速§Y+[?arf_ws_gb_bnspd]%§!  组§Y+[?arf_ws_gb_bnorg]%§!\n§T全军HP§!§Y+[?arf_ws_gb_bnhp]%§! §T（作用于全师所有营）§!"
 ARF_WSD_SUM_TITLE_2: "突击舰 §T· 中型突破平台§!"
 ARF_WSD_SUM_DESC_2: "为突破而生的中型平台。双联装主炮与混合动力是它的标准解，代价是装甲永远比无畏舰薄一层。"
 ARF_WSD_SUM_COST_2: "占用军工厂：§Y[?arf_ws_as_cost]§! 座 §T（裸装 5 座）§!"
 ARF_WSD_SUM_DAYS_2: "建造周期：§Y365§! 天（不随配件变化）"
 ARF_WSD_SUM_STATS_2: "当前方案合计加成\n软攻 §Y+[?arf_ws_as_soft]%§!   硬攻 §Y+[?arf_ws_as_hard]%§!   穿甲 §Y+[?arf_ws_as_ap]%§!\n装甲 §Y+[?arf_ws_as_armor]%§!   对空 §Y+[?arf_ws_as_air]%§!   可靠 §Y+[?arf_ws_as_rel]%§!\n§T支援连§! 攻§Y+[?arf_ws_as_bnatk]%§!  防§Y+[?arf_ws_as_bndef]%§!  速§Y+[?arf_ws_as_bnspd]%§!  组§Y+[?arf_ws_as_bnorg]%§!\n§T全军HP§!§Y+[?arf_ws_as_bnhp]%§! §T（作用于全师所有营）§!"
 ARF_WSD_SUM_TITLE_3: "无畏舰 §T· 重型决战平台§!"
 ARF_WSD_SUM_DESC_3: "陆上战舰的顶点。三联装超重炮、超重型装甲、源石核心可以同时装上，前提是这个国家真的掏得出那么多军工厂。"
 ARF_WSD_SUM_COST_3: "占用军工厂：§Y[?arf_ws_dr_cost]§! 座 §T（裸装 10 座）§!"
 ARF_WSD_SUM_DAYS_3: "建造周期：§Y365§! 天（不随配件变化）"
 ARF_WSD_SUM_STATS_3: "当前方案合计加成\n软攻 §Y+[?arf_ws_dr_soft]%§!   硬攻 §Y+[?arf_ws_dr_hard]%§!   穿甲 §Y+[?arf_ws_dr_ap]%§!\n装甲 §Y+[?arf_ws_dr_armor]%§!   对空 §Y+[?arf_ws_dr_air]%§!   可靠 §Y+[?arf_ws_dr_rel]%§!\n§T支援连§! 攻§Y+[?arf_ws_dr_bnatk]%§!  防§Y+[?arf_ws_dr_bndef]%§!  速§Y+[?arf_ws_dr_bnspd]%§!  组§Y+[?arf_ws_dr_bnorg]%§!\n§T全军HP§!§Y+[?arf_ws_dr_bnhp]%§! §T（作用于全师所有营）§!"
 ARF_WSD_SUM_TITLE_4: "辅助舰 §T· 后勤保障平台§!"
 ARF_WSD_SUM_DESC_4: "不开火的那一型。吊臂、备件、担架与永远修不完的引擎——它自己不上战列线，但没有它，战列线撑不过第三天。"
 ARF_WSD_SUM_COST_4: "占用军工厂：§Y[?arf_ws_ax_cost]§! 座 §T（裸装 2 座）§!"
 ARF_WSD_SUM_DAYS_4: "建造周期：§Y365§! 天（不随配件变化）"
 ARF_WSD_SUM_STATS_4: "当前方案合计加成\n软攻 §Y+[?arf_ws_ax_soft]%§!   硬攻 §Y+[?arf_ws_ax_hard]%§!   穿甲 §Y+[?arf_ws_ax_ap]%§!\n装甲 §Y+[?arf_ws_ax_armor]%§!   对空 §Y+[?arf_ws_ax_air]%§!   可靠 §Y+[?arf_ws_ax_rel]%§!\n§T支援连§! 攻§Y+[?arf_ws_ax_bnatk]%§!  防§Y+[?arf_ws_ax_bndef]%§!  速§Y+[?arf_ws_ax_bnspd]%§!  组§Y+[?arf_ws_ax_bnorg]%§!\n§T全军HP§!§Y+[?arf_ws_ax_bnhp]%§! §T（作用于全师所有营）§!"

