 # ===== 高速战舰设计台 · 通用 =====
 ARF_WSD_TITLE: "§Y高速战舰设计台§!"
 ARF_WSD_SUBTITLE: "四个舰种各有一套装配方案。配件越多，占用的军工厂越多；开工时按当前方案结算。"
 ARF_WSD_LEFT_NOTE: "§Y怎么用§!\n左侧选舰种，每行一槽位，\n◀ ▶ 循环切换配件；\n切到「未安装」即空置。\n\n§Y结算§!\n顶部给占用军工厂数与属\n性合计（只算战舰自身，\n不含支援连那一串）。\n\n§Y支援连§!每行右侧那串\n是该配件给全师的营级加\n成：攻/防/速/组作用于所\n有步兵营；全军HP作用于\n全师。切配件即随之变化。"
 ARF_WSD_EMPTY_NAME: "§T—— 未安装 ——§!"
 ARF_WSD_EMPTY_EFF: "§T不占用额外产能§!"
 ARF_WSD_RESET: "清空本舰种全部配件"
 ARF_WSD_FOOT_NOTE: "配件不是新科技：只改已解锁战舰的数值、造价与全师支援连加成。"
 ARF_WSD_CLOSE_TT: "关闭设计台"
 ARF_WSD_PREV_TT: "上一项配件"
 ARF_WSD_NEXT_TT: "下一项配件"
 ARF_WSD_RESET_TT: "把本舰种的全部槽位清空为空置"
 ARF_WSD_ENTRY_TITLE: "§Y高速战舰设计局§!"
 ARF_WSD_ENTRY_DESC: "设计局只接受图纸。为四型战舰各自的七个槽位选定配件：主炮、副炮、装甲、引擎、火控、弹药、特种。装得越满，数值越高，占用的军工厂也越多。"
 ARF_WSD_ENTRY_BTN: "进入设计台"
 ARF_WSD_ENTRY_HINT: "（Esc 关闭）"
 ARF_WSD_ENTRY_TT: "打开高速战舰设计台"

 # ===== 设计台 · 页签与槽位 =====
 ARF_WSD_TAB_1: "炮舰"
 ARF_WSD_TAB_2: "突击舰"
