YAN_sui_ling_revolt:0 "岁陵之乱！"
YAN_sui_ling_revolt_desc:0 "秉烛人左乐，连夜启程。岁陵这一乱，伤的是国本：人口流散、工厂被毁，账目我一笔笔记着。乱局当前，司岁台的烛火不能灭。灾要救，乱首更要查。诸位各自保重，等我消息。\n——左乐，在司岁台抄卷宗时发言"
YAN_sui_ling_revolt_tt:0 "岁陵之乱爆发：全国各州各流失 10000 人口，随机 50 座民用工厂被破坏。"
YAN_sui_banner_lowered_tt:0 "需要【岁兽偃旗息鼓】：完成【岁陵之乱！】后的 120 天镇压任务。"
YAN_mission_suppress_shanhai:0 "镇压被煽动的山海众"
YAN_mission_suppress_shanhai_desc:0 "被煽动的山海众在各州举事。禁军与司岁台正在弹压，但乱局不会在一夜之间平息。"
YAN_eco_phase1_review_factories_tt:0 "需要民用工厂数量大于 220。"
