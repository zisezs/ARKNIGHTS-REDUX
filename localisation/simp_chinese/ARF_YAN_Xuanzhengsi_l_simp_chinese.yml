 MAPMODE_YAN_XZS_MAP_MODE_DESCRIPTION:0 "以颜色标出大炎十九个宣政司的辖地，明金一块为上京真龙脚下、天子直辖。"
 yan_xzs_map_mode_tooltip:0 "§Y[FROM.GetName]§!\n[FROM.region_of_states_title]"
 yan_xzs_map_mode_tooltip_delayed:0 "大炎疆域辽阔，朝廷分天下为十九宣政司，每司辖州数不等，设宣政使总领钱粮、刑名与兵备。图上色块即各司辖地；明金一块是上京百灶州——真龙脚下，不隶任何宣政司，由天子直辖。"
