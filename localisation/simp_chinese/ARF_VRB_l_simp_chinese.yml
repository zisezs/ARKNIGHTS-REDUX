 #民族精神
 VRB_Commune_Morning_Star: "公社晨星"
 VRB_Commune_Morning_Star_desc: "联合进军以惨败告终后，维多利亚帝国迅速滑向崩溃，工人代表委员会随即与数个左翼政党协同发动起义，占领了开斯特公爵领工业重镇曼彻斯特及周边的数座卫星城市。在总书记安妮·伯纳德绍的规划之下，一个以昔日林贡斯公社的人民主权体制为基础、杂糅了维多利亚式改良主义纲领的社会主义政权最终宣告成立。\n\n然而好景不长，此刻的公社正在陷入理论分裂与派系斗争的泥潭，而开斯特公爵麾下的军队却在摩拳擦掌，随时准备夺回曼彻斯特城。或许，这枚冉冉升起的晨星不过是同林贡斯公社无异的又一次飞蛾扑火。"
 VRB_Peoples_Defense_Army: "人民自卫军"
 VRB_Peoples_Defense_Army_desc: "在曼彻斯特公社建立后，工人代表委员会通过的第一项法令便是废除帝国常备军，仿效林贡斯公社建立全新的无产阶级武装部队——人民自卫军。这支军队由所有具备作战能力的公民志愿组成，实行逐级向上监督的军事基层民主制度，是守护革命的中坚力量。"