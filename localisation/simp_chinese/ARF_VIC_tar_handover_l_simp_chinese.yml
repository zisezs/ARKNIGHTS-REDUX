# 维多利亚·塔拉移交事件（events/VIC_tar_handover.txt）
# 生成器：docs/gen_vic_tar_loc.js
 vic_tar.1.t: "塔拉的王冠要不要交出去"
 vic_tar.1.d: "议事厅的地图上，塔拉被画成一片没有名字的颜色。十八个省份、一座被天灾掀翻的王城、一条从石高原野一路烧到小丘郡的线——它们都写在\"皇帝的冠冕之一\"这句漂亮话里，也都写在每晚九点那声钟响里。\\n\\n军需官的数字很难看：北边的舰队要煤，伦蒂尼姆要粮，而塔拉人要的只是一间能点灯的屋子。有两位公爵已经在私下谈论\"如果南边先起火，我们来得及扑灭吗\"。\\n\\n所以问题被摆到你面前：是在内战之前，把这片注定要烧起来的地方交还给它自己人；还是把钉子再敲深一寸，让驻军替我们说话。"
 vic_tar.1.req: "我们手上至少还有一个带塔拉标记的省份"
 vic_tar.1.a: "把王冠交还给塔拉人——由我来戴。"
 vic_tar.1.a.tt: "§Y把塔拉交给深池，并由你执掌§!：\\n· 18 个 §G塔拉省份§! 移交并转为 §Y深池核心§!（维多利亚保留核心，成为日后的宣称）\\n· 深池定都 §G纳斯尔纱（621 号省）§!，继承你的科技并拉起 §YDUB_Start§! 编制\\n· 置 §YTAR_independence_flag§!，国名外观改为 §Y塔拉王国§!\\n· 你将从当前国家 §R切换为深池（塔拉王国）§!；复国树入口决议随即解锁"
 vic_tar.1.b: "让它走。我们受够了南边的账。"
 vic_tar.1.b.tt: "§Y释放塔拉§!：18 个省份移交并转核心，深池独立由 AI 执掌；你留在原位，§R政治点数 -40§!、§R战争支持度 -5.00%§!，但南方的驻军负担一并卸下。"
 vic_tar.1.c: "冠冕不许有缺口。"
 vic_tar.1.c.tt: "§G政治点数 +60§!、§G稳定度 +5.00%§!；作为代价，塔拉诸省永久挂上 §Y塔拉驻军负担§!（地区可用人力 §R-25.00%§!、地区可用工厂 §R-10.00%§!）。\\n§R内战一旦爆发，这些省份不会安静地等着被争夺。§!"
 TAR_garrison_burden_dm: "塔拉驻军负担"
 TAR_rd_gastriel_pact: "加斯特里尔号的邀请"
 TAR_rd_gastriel_pact_desc: "登上「加斯特里尔」号去见铁公爵本人。他要的不是同盟，是一个结局：公爵领并入塔拉，它养了七年的人随它一起来。"
 vic_tar.3.t: "与威灵顿会晤"
 vic_tar.3.d: "「加斯特里尔」号的会客室里铺着两张图，如今只剩一张还有用。威灵顿公爵坐在窗边，手杖横在膝上没有起身——他不是起不来，是不愿给这场谈话添上臣服的形状。\\n\\n他比谁都清楚南边已经烧成什么样子：塔拉诸省既挂过他的封锁线，也挂过深池的起火点，而现在封锁线上的兵源、军械和名分，都只够守住自己那一片领地。他把七年里不肯说出口的那句话先讲了：公爵领要的是一个结局，不是两场战争。\\n\\n随行的军官在门边等着，一串名字连着近卫队、参谋席和炮兵教官席——迈克·柯林特、陶茂斯·巴拉、约翰·奥康纳。他们不打算再换一次主人，他们只想确认：这面旗下还留不留得下位置。"
 vic_tar.3.a: "公爵领并入塔拉。他的人，到我们这边来。"
 vic_tar.3.a.tt: "§Y吞并威灵顿公爵领§!：\\n· §G若公爵领已独立成形§!：其全部省份随吞并入我方版图，其中 §Y塔拉省份§! 立即转为 §G我方核心§!，其余省份只接管不给核心；部队随编制移交\\n· 若它仍是个零领土名分：地无从可取，人照单全收\\n· §G全部顾问与将领转籍§!：铁公爵本人、迈克·柯林特、陶茂斯·巴拉、约翰·奥康纳等一众政治顾问、军队参谋与指挥官进入我方人才池，按席位自行任用\\n· 若此刻正与公爵领交战，先行单独停战\\n\\n政治点数 §G+80§!、稳定度 §G+10.00%§!、战争支持度 §G+5.00%§!\\n§R「铁公爵」这个名字不会消失——它从此只出现在塔拉的功臣名录里。§!"
 TAR_Eblana_Dublinn_desc: "都柏林家的长女，沃里克伯爵的学生，喷吐死火的德拉克异种。她习惯把最残酷的命题重述成一个美学问题，用考问和玩笑代替命令，被追问时只回一句反问。她要的从来不是王座：她要塔拉重新想起自己的名字，哪怕为此要把自己的生命、死亡和名声一并押上桌。"
 TAR_Loughshinny_Dublinn_desc: "妹妹，长期作为姐姐的影子存在，以\"领袖\"之名签署过许多人的死刑。她先讲礼节，再下决断，对陌生人用敬语，对自己人却只会说\"不\"。她不擅长煽动，也不擅长撒谎——她擅长的是把火变成一盏能端在手里的灯。"
 TAR_Harmonie_desc: "菲林，深池的谋臣，同时挂着威灵顿近卫队的名分——她从不掩饰这一点，甚至以此为傲。辞令华丽，随时在外交腔与自嘲之间切换，把审讯说成跳舞。她自陈只想知道\"火烧穿一切之后，这片大地是什么样子\"。"
 TAR_Mandragora_desc: "石系术师，小丘郡出身，深池在伦蒂尼姆的头目。碎石结成无死角的盾，凭空立起石柱，也能唤出荆棘之林——代价是她同一时间只能做成一件事。她急躁、贪功、怨毒，把每一次屈辱记成条数；她最恨的贵族，正是把她当棋子的人。"
 TAR_John_OConnor_desc: "公爵领的老军官，赤铁近卫队的教官之一。他不懂塔拉语的歌谣，却记得每一条牧道上死过谁；在公爵领并入塔拉之后，他负责让两边的人学会同一套口令。"
 TAR_Wesle_Wellington_desc: "塔拉出身的大公爵，被叫做\"铁公爵\"。他把手杖和军装当作绷带，用军人的短句下命令，拒绝一切\"战争之神\"式的宏大叙事。他亲手把一座城市从地图上抹去过，也亲手把旧旗烧掉、把自己的名字交给塔拉的新旗——他清楚自己不会被所有人原谅，他只是决定站在哪一侧。"
