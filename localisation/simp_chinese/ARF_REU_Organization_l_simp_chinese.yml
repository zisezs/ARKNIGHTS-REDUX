l_simp_chinese:
 REU_Organization_Department: "革命组织部"
 REU_promote_young_cadres: "提拔新青年干部"
 REU_promote_young_cadres_desc: "一般而言，东达利亚苏维埃共和国的布党干部主要有三批，冻原干部、切城干部和后续的其他干部。冻原干部在过去是革命队伍的主要领导层。但随着时间增长，冻原干部平均文化水平似乎远不如后续加入革命的干部们，这是早期雪原斗争形式使然。但我们不能长时间只让这些冻原干部凭借资历卡占高位，适当提拔一些新青年干部对我们有利。"
 REU_promote_young_cadres_tt_after_1100: "§R需在 1100 年 1 月 1 日之后方可提拔新干部§!"
