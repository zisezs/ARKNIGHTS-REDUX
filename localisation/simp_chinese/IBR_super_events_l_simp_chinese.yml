  ####################
  ####SUPER EVENTS####
  ####################

  ibrse.1.t: "深海猎人登陆伊比利亚"
  ibrse.1.d: "她们从潮水的裂缝中走上沙滩——深海猎人，阿戈尔最后的兵器。歌蕾蒂娅的长戟挑起溟痕的碎浪，斯卡蒂的巨剑在雨中低鸣，幽灵鲨的歌声混着乌尔比安的沉默。审判庭的提灯与深渊的猎手在海岸线上对峙，谁都清楚：在对抗深海教会的战场上，猎人与审判官，终将站在同一条战线。"
  ibrse.1.a: "§T谁因堕落而雀跃？§!"
  IBR_hunter_land_title: "深海猎人登陆伊比利亚"
  IBR_hunter_land_quote: "\"当她祈祷，星星停止闪烁；当她悲叹，痛苦四处蔓延。\"\n——阿戈尔的哀歌"
  IBR_hunter_land_close: "§T谁因堕落而雀跃？§!"

  ibrse.2.t: "洗海覆潮行动"
  ibrse.2.d: "惩戒军的连队踏过南方盐碱滩涂，提灯的火光点燃了绵延数十里的溟痕。这是伊比利亚数十年来第一次向海洋发起进攻——审判庭称之为圣战，军人们称之为“洗海”。风车般巨大的盐船步行机列阵于海岸，如同年迈的骑士冲向命运的风车。哪怕海水终将漫过堤岸，今夜，长矛必须掷出。"
  ibrse.2.a: "§T堂吉诃德冲向了风车§!"
  IBR_wash_tide_title: "洗海覆潮行动"
  IBR_wash_tide_quote: "\"纵然长矛折断、战马倒毙，骑士仍要冲向那不可战胜之物。\"\n——审判庭战地手记"
  IBR_wash_tide_close: "§T堂吉诃德冲向了风车§!"

  ibrse.3.t: "大静谧重演"
  ibrse.3.d: "没有海啸，没有风暴。灯塔一盏接一盏地熄灭，钟声停在半空，浪花凝固在礁石上——就像六十年前那样，海洋收回了自己的声音。人们涌向街头，仰望那片过于平静的海面。有人跪下祈祷，有人重新拾起祖先的恐惧。深海教会的主教们说：这一次，祂是真的醒来了。"
  ibrse.3.a: "§T繁衍，生长§!"
  IBR_great_silence_title: "大静谧重演"
  IBR_great_silence_quote: "\"当祂停止呼吸，海洋便学会了沉默。\"\n——布雷奥甘手记"
  IBR_great_silence_close: "§T繁衍，生长§!"
