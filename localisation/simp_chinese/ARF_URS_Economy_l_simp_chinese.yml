l_simp_chinese:
 # ===== 乌萨斯经济国策树「老爷，我们要面包！」 2026-09-15 =====
 # 国策 25 条（总领 1 + 四主线各 6）/ 共享民族精神 1 个 / 快捷键 1 个
 # 本树按需求不含决议：加成全部走共享民族精神 URS_good_life。

 # ---- 共享民族精神 ----
 URS_good_life: "乌萨斯人的美好生活！"
 URS_good_life_desc: "面包不是从账本里长出来的，是从矿脉、工厂、炉子和人的肚子里长出来的。经济法案、科研教育、地方与中央的拉扯、民用工业的四条线，最后只折算成一句话：乌萨斯人的日子，能不能比昨天好一点。改革推进多少，这句话就有多少分量。"

 # ---- 快捷键 ----
 URS_shortcut_economy: "经济·老爷，我们要面包！"

 # ---- 国策 ----
 URS_bread_demand: "老爷，我们要面包！"
 URS_bread_demand_desc: "圣骏堡的面包价格在半年内涨了两倍。卡托加区的工人排了三条街的队，最后只领到半磅掺了木屑的黑面。有人在冬宫广场上喊出那句口号——「老爷，我们要面包！」——人群跟着喊了一整天。\n\n维特没有派兵。他把自己关在办公室里，把帝国的账本从头翻到尾，然后在第一页写下一行字：问题不在面包，在于谁在决定面包的分配。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§R稳定 -5%§!）"
 URS_eco_winter_act: "冬季资源调配紧急法"
 URS_eco_winter_act_desc: "法案以一票之差通过。帝国的源石储备、燃料、粮食、运输力量全部进入战时配给体制：卡托加区优先供电，第一集团军优先补给，第四集团军削减三成，第二集团军接受中央调度。\n\n维特在议会宣布结果时，台下没有一个人鼓掌。他回到办公室，桌上放着两份互相矛盾的报告——卡托加区军工复产的进展，与远北矿区矿脉枯竭的确认。他把两份叠在一起，放进同一个文件夹。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§R消费品需求 +5%§!）\n§R帝国军忠诚度 -5§!"
 URS_eco_originium_ration: "源石配给制"
 URS_eco_originium_ration_desc: "源石是乌萨斯的血液，而血液正在枯竭。配给制实施第一个月，圣骏堡的居民区开始出现冻死案例，第四集团军的仓库里却仍然堆满源石炸药。\n\n维特派阿洛伊泽去泽尔格勒核查。阿洛伊泽回来报告：第四集团军在囤积物资，准备长期对抗。维特在报告上批注：先解决眼前，再解决将来。但他知道，将来已经来了。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§R消费品需求 +5%§!／§R稳定 -5%§!）"
 URS_eco_noble_tax_exempt: "贵族免税权废除"
 URS_eco_noble_tax_exempt_desc: "世袭贵族免缴矿脉税、土地税和贸易税已三百年，交换条件是战时提供骑兵和粮草。如今贵族提供的骑兵不到编制的一半，粮草则被倒卖到了外资公司。\n\n维特在公民大会上提出废除免税权，会场沉默整整一分钟，随后旧贵族代表集体退场。维特没有阻拦，只让书记官记下缺席者的名字，把名单交给了第三局。第二天，圣骏堡的贵族宅邸门前多了一队内卫。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G政治点 +0.05/日§!／§G政治点成本 -5%§!）\n§R帝国军忠诚度 -5§!"
 URS_eco_currency_reform: "金切尔文改革"
 URS_eco_currency_reform_desc: "金切尔文的购买力取决于你站在哪片土地上：在圣骏堡能买一袋面粉，在卡托加区只能买半袋，在远北矿区什么都买不到——那里只认实物。\n\n维特以帝国财政担保统一汇率，禁止地方贵族和集团军私自铸币。改革推行到第三个月，泽尔格勒的市场上出现了两种金切尔文：帝国的和叶甫根尼的。商人们用脚投票。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G政治点 +0.05/日§!／§G国际评价 +5%§!／§G政治点成本 -5%§!）"
 URS_eco_assembly_budget: "公民大会经济权"
 URS_eco_assembly_budget_desc: "维特在公民大会上提出：议会应有权审议帝国年度预算、矿脉开采合同、外资公司准入。这不是请求，是最后通牒。\n\n旧贵族称之为「议会篡权」，军事贵族称之为「文官乱政」，但工人代表和学生代表第一次坐进了旁听席。散会时瓦西里说：你给了他们经济权，他们就会要政治权。维特回答：他们已经要了。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G稳定 +10%§!／§G占领抵抗度 -5%§!／§G政治点 +0.05/日§!）"
 URS_eco_treasury_overhaul: "帝国财政重整"
 URS_eco_treasury_overhaul_desc: "国库已经空了三成。维特下令裁撤冗余机构、削减贵族年金、追缴外资公司欠税，并把第三局的加密通讯专利出售给卡西米尔商人。\n\n第一批追缴税款来自沃伦佐娃家族，金额足以支付卡托加区三个月的军工复产。第二批追缴却碰了壁——特里波列夫公爵的矿脉已抵押给维多利亚的银行，而银行不受乌萨斯法律管辖。维特在报告上批注：追得回的叫税，追不回的叫债。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§G建设速度 +10%§!）"
 URS_eco_bureau_tech_transfer: "第三局技术下放"
 URS_eco_bureau_tech_transfer_desc: "第三局掌握着军用加密通讯、新型材料、独立无线电和军用设施识别码。维特要求它向军工企业下放部分技术，允许卡托加区的工厂生产加密终端和新型合金。\n\n第三局局长拒绝了三次，第四次同意了，但只下放通讯协议，不交核心算法。维特没有追究。他在日记里写：第三局的墙太高，我暂时翻不过去。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G科研速度 +10%§!／§G生产效率保持 +5%§!）"
 URS_eco_university_reform: "圣骏堡大学改革"
 URS_eco_university_reform_desc: "圣骏堡大学是帝国最古老的学府，也是贵族子弟的镀金场。维特以考试成绩取代推荐信，以平民子弟取代世袭名额，以源石技艺和工程学取代神学与骏鹰法典。\n\n第一批改革后的录取名单中，平民学生占三成，自由民学生占半成。旧贵族在校园外抗议，学生联合大会在校园内庆祝。真理在剧院里对安娜说：他们终于打开了门，但门后面的路还很长。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G科研速度 +10%§!／§G稳定 +5%§!）"
 URS_eco_miner_training: "矿工技术培训"
 URS_eco_miner_training_desc: "远北中心矿区的矿工是帝国最底层的劳动者，也是最稀缺的技术工人。维特在矿区设立技术培训学校，教授操作新型钻探设备、识别矿脉走向、处理奥卡流体。\n\n第一批学员三百人，毕业时只剩两百一十人——九十人被奥卡感染，转入隔离区。矿区工程师在报告中写道：培训有效，但奥卡的危险被低估了。维特批示：继续培训，加强防护。而防护设备的生产线，已经被第四集团军征用。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G科研速度 +5%§!）\n§G帝国军忠诚度 +5§!"
 URS_eco_oka_research: "奥卡研究"
 URS_eco_oka_research_desc: "奥卡是失去能量的源石，是矿脉枯竭后留下的黑色流体，是远北矿区研究所的意外发现。第三局的研究表明，它可以作为通用溶剂，用于制造炸药、推进剂和部分源石技艺的替代介质。\n\n实验室的第一份报告指出：奥卡会加重感染者的病情，对非感染者致命。维特签字时问了一句：那矿工呢？工程师回答：矿工是感染者。维特把笔放下了。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G燃油容量 +10%§!／§G燃油获取 +10%§!）\n§R邪魔污染度 +5%§!"
 URS_eco_sarcophagus_energy: "石棺能源研究"
 URS_eco_sarcophagus_energy_desc: "石棺是前文明遗产。凯尔希曾封锁它，伊利亚曾为它而死，第一集团军曾把它变成零号项目。维特下令重启石棺能源研究，目标是以它替代源石矿脉，为帝国提供长期能源保障。\n\n研究在切尔诺伯格地下设施进行，第三局与第一集团军的工程师联合参与。第一批数据表明转化率极高，但每次启动都会释放微量邪魔污染。项目负责人艾丽塔在报告结尾写道：我们烧的是感染者的生命。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G燃油容量 +5%§!／§G工业产出 +5%§!／§G战争支持 +5%§!）\n§R邪魔污染度 +5%§!"
 URS_eco_caster_academy: "战争术师学院"
 URS_eco_caster_academy_desc: "战争术师是帝国最危险的武器，也是最不稳定的士兵。维特在圣骏堡建立战争术师学院，系统培训源石技艺、战场战术与失控处置。\n\n第一批学员来自第四集团军和第二集团军，第一集团军拒绝派人。院长是杜宾推荐的退役教官，他在开学典礼上说：你们要学会杀人，也要学会活下来。学员中有一名来自远北矿区的感染者，他的源石技艺是让矿石自燃。第一堂课上，他烧了自己的课桌。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G战争支持 +10%§!／§G生产效率保持 +5%§!／§G科研速度 +5%§!）"
 URS_eco_katoga_unblocked: "卡托加区解封"
 URS_eco_katoga_unblocked_desc: "卡托加区是圣骏堡的老工业区，被封锁后停产三年，管道生锈，工人流散，机器停转。维特下令解除部分封锁，优先生产弩箭、弹药和陆行舰零件。\n\n第一批复产的是第三机械厂，开工那天只来了三成工人。厂长说，剩下的人要么死了，要么进了监狱，要么加入了无缚者同盟。维特没有追究，下令从远北矿区调拨矿工填补空缺。第一批矿工到达那天，圣骏堡下着雪。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§G建设速度 +5%§!）"
 URS_eco_zergrad_autonomy: "泽尔格勒自治权"
 URS_eco_zergrad_autonomy_desc: "泽尔格勒是第一集团军的卫星城，被称为「明日之城」。它有自己的行政机构、警察、税收，甚至自己的货币。维特下令收回自治权，将其纳入中央直辖。\n\n第一集团军拒绝执行。斯韦特兰纳在回复中写道：泽尔格勒是军城，不是民政区。维特派阿洛伊泽去谈判，带回一份协议：泽尔格勒名义上接受中央管辖，实际上保持自治。维特签字时说：你谈回来一个空壳。阿洛伊泽回答：空壳也是壳。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G占领抵抗度 -10%§!／§G政治点 +0.05/日§!）\n§R帝国军忠诚度 -5§!"
 URS_eco_bresk_duchess: "布列斯克女大公"
 URS_eco_bresk_duchess_desc: "布列斯克是乌萨斯北部重镇，由叶莉莎女大公统治。她拥有自己的军队、矿脉和外交渠道，是帝国最有权势的地方领主。维特要求她接受中央派驻的行政官、财政官和军需官。\n\n女大公没有拒绝，也没有同意。她只是邀请阿洛伊泽到布列斯克做客，带他参观了她的矿脉、工厂和军队。阿洛伊泽回来对维特说：她不需要我们，我们需要她。维特沉默了很久。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G政治点 +0.05/日§!／§G国际评价 +5%§!）"
 URS_eco_farnorth_control: "远北矿区控制"
 URS_eco_farnorth_control_desc: "远北中心矿区是帝国最后的源石储备地，也是矿脉枯竭最先发生的地方。维特下令派驻第三局特派员、近卫军驻军和医疗队。\n\n矿工领袖雷尔金拒绝接受驻军：我们已经有了纠察队，不需要更多的枪。谈判结果是：矿区接受医疗队，拒绝驻军；接受技术培训，拒绝第三局监听。维特签字时问特派员：你觉得雷尔金是什么人？特派员回答：一个不想跪着的人。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§G顺从度增长 +5%§!／§R稳定 -5%§!）"
 URS_eco_army_economy_strip: "集团军经济剥离"
 URS_eco_army_economy_strip_desc: "乌萨斯的集团军不仅是军事单位，也是经济单位——自己的矿脉、工厂、农场和贸易渠道，可以独立于中央财政生存。维特下令把矿脉、工厂和农场收归中央，集团军只保留军需后勤。\n\n第一集团军部分执行，第四集团军全盘拒绝，第二集团军全盘接受。叶甫根尼在泽尔格勒发表声明：第四集团军的经济是士兵的饭碗，谁动饭碗，谁就是敌人。维特把声明放在桌上，对瓦西里说：他先动手了。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§G建设速度 +5%§!）\n§R帝国军忠诚度 -5§!"
 URS_eco_noble_negotiation: "地方贵族协商"
 URS_eco_noble_negotiation_desc: "维特在圣骏堡召开地方贵族协商会，讨论税制改革、矿脉国有化和地方自治。会议开了三天，没有达成任何协议：旧贵族要维持免税权，新贵族要矿脉开采权，军功贵族要增加军费，地方领主要保持自治。\n\n维特在闭幕时说：你们要的，帝国都给不了；帝国要的，你们都不给。他走出会场时，沃伦佐娃夫人追上来，说了一句：维特先生，你比皇帝更危险。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G稳定 +10%§!／§G占领抵抗度 -5%§!／§G政治点成本 -5%§!）"
 URS_eco_energy_converter: "能源转换器推广"
 URS_eco_energy_converter_desc: "能源转换器是弑君者在圣骏堡偷电时使用的设备，能把源石能量转化为民用电力。维特下令在卡托加区和圣骏堡推广，为居民区提供取暖和照明。\n\n第一批转换器安装在卡托加区工人住宅。供电当晚，居民们发现灯亮了，暖气还是冷的——工程师解释：转换器功率不够，只能照明，不能取暖。居民们没有抱怨，只是把家里的旧炉子搬出来，重新烧起了木柴。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G消费品需求 -10%§!／§G建设速度 +5%§!）"
 URS_eco_katoga_production: "卡托加区复产"
 URS_eco_katoga_production_desc: "卡托加区是圣骏堡的老工业区，也是帝国军工的脊梁。维特下令全面复产，优先生产弩箭、弹药、陆行舰零件和民用取暖设备。\n\n第一批复产的第三机械厂用了一个月才恢复三成产能；第二批复产的第五纺织厂用了一周就恢复五成——因为纺织厂的女工比机械厂的男工更便宜，也更容易招到。厂长在报告中写道：复产有效，但工人不足。维特批示：从远北调人。他没有写的是：远北的人正在死去。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G工业产出 +5%§!／§G生产效率保持 +5%§!）"
 URS_eco_zergrad_city: "泽尔格勒明日之城"
 URS_eco_zergrad_city_desc: "泽尔格勒有整洁的街道、明亮的灯光、温暖的住宅和充足的食品——但这些都是为军人和军属准备的。平民住在城外的集体住宅里，没有供暖，没有电力，没有配给。\n\n维特下令把市政资源向平民倾斜：削减军属配给，增加平民住宅供暖。命令下达到泽尔格勒时，市政官拒绝执行：泽尔格勒是军城，不是慈善堂。维特把命令转给了阿洛伊泽。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G消费品需求 -10%§!／§G稳定 +5%§!）"
 URS_eco_fuel_plants: "燃料工厂建设"
 URS_eco_fuel_plants_desc: "乌萨斯的冬天需要燃料，而源石配给制把民用燃料压缩到了最低限度。维特下令在卡托加区和布列斯克建设燃料工厂，以奥卡为原料生产民用燃料。\n\n第一批工厂在卡托加区投产，日产量足够供应圣骏堡三分之一的居民。但奥卡燃料燃烧后会产生黑色粉尘，居民们抱怨空气变差。工程师在报告中写道：燃料有效，但污染严重。维特批示：先解决冻死，再解决污染。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G燃油容量 +10%§!／§G消费品需求 -5%§!）"
 URS_eco_heating_relief: "居民取暖保障"
 URS_eco_heating_relief_desc: "圣骏堡的冬天一年比一年冷，而源石配给制让居民区的供暖时间缩短到每天四小时。维特下令实施居民取暖保障计划：在每一个居民区设立取暖站，提供免费热汤、临时避寒所和医疗检查。\n\n第一批取暖站在卡托加区开放，当天就有三百人排队。取暖站的医生说，很多人不是冻伤的，是饿的。维特在报告上批注：增加食品配给。但他知道，食品配给也快见底了。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G稳定 +5%§!／§G消费品需求 -5%§!／§G每月人口 +5%§!）"
 URS_eco_consumer_goods: "消费品生产"
 URS_eco_consumer_goods_desc: "乌萨斯的消费品工业在战争中萎缩了七成，市场上只剩军用品和黑市货。维特下令恢复消费品生产，优先生产冬衣、靴子、炊具和药品。\n\n第一批冬衣在卡托加区投产，用的是库存的军服布料，颜色是灰色的。居民们穿上灰色冬衣，走在灰色的街道上，像一群影子。维特在视察时问一名工人：暖和吗？工人回答：暖和。但看起来像囚犯。\n\n§Y民族精神§!「乌萨斯人的美好生活！」（§G消费品需求 -15%§!／§G每月人口 +10%§!／§G稳定 +5%§!）"

