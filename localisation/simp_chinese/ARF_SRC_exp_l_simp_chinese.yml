 SRC_exp_tt_elector_dec: "解锁决议：§H对莱塔尼亚帝国宣战§!（对外扩张分类）"
 SRC_exp_tt_ltn_levee: "为§H莱塔尼亚§!动员 §H50§! 个师：帝国首都将出现 50 支「莱塔尼亚帝国动员师」（16 步 + 5 支援连，装备与兵员齐装满员）——这是莱塔尼亚最后的抵抗，垮掉之后即为叙拉古所用"
