 SRC_exp_tt_wargoal_mra: "对§H克罗地亚迪纳摩§!取得宣战理由（无期限）"
 SRC_exp_tt_advance_levee: "对博尔扎诺国、克罗地亚迪纳摩的战事一开，两国首都将各自拉起 30 支 16 步「边境民团」——这就是「准备伟大进军」准备的东西"

