#========================= 国策：名称与描述 =========================

# ---- 总起 ----
 SRC_exp_wolflings: "七丘的狼崽子们！"
 SRC_exp_wolflings_desc: "叙拉古的孩子是在七座山丘的传说里长大的：狼母哺育了双子，双子垒起了第一座城。可如今的狼群只剩宅邸墙上的旧画像，和边境上被人推来推去的界碑。莱昂图索把这句话印在动员令的第一行——「七丘的狼崽子们，该出门认认路了。」\n\n于是叙拉古第一次不谈生意，谈起了外面。"

# ---- 左路 · 选帝侯之路 ----
 SRC_exp_wolf_culture: "灌输狼性文化"
 SRC_exp_wolf_culture_desc: "新沃尔西尼的教科书换了一版。教育委员会管这叫「重新介绍叙拉古」：讲狼群如何围猎，讲一个猎人怎样替同伴挡下身后的牙。孩子们在操场上排成队列，喊的不再是某个姓氏，而是一座城市、一面旗。老教师们在办公室里嘀咕了很久——从前教的是怎么一个人活下去，现在教的是怎么一群人一起活。"
 SRC_exp_leithanien_claims: "控诉莱塔尼亚暴行"
 SRC_exp_leithanien_claims_desc: "档案柜最底下压着一摞发黄的纸。叙拉古的城市曾被莱塔尼亚当作移动城市技术的试验场，武备贵族用「金律」的名义，把叙拉古的名字从地图上抹掉过不止一次。莱昂图索把这摞纸搬上灰厅的圆桌，一页一页念。念到一半，连最沉默的那位家族代表都抬起了头——他们头一回发现，自己恨的原来是同一个东西。\n\n散会时没有人说话，但第二天，全城的报纸都登了同一段摘录。"
 SRC_exp_elector: "我早就是选帝侯了！"
 SRC_exp_elector_desc: "莱塔尼亚的选帝侯席位是贵族用血统换来的。叙拉古没有血统可自称，但有港口、有钢铁、有二十三个听话的城市。一封盖着叙拉古国徽的公文送进莱塔尼亚首相府，上面只有一句话：「选帝侯的席位空了几个世纪，不如让我来坐。」\n\n首相府没有回信。莱昂图索也不等回信——他已经在核算动员令要烧掉多少车皮了。"

# ---- 右路 · 边疆与进军 ----
 SRC_exp_identity: "强化叙拉古人认同"
 SRC_exp_identity_desc: "叙拉古人从前只认同两件事：家族，和手里的铳。莱昂图索要做的是第三件——让人在海关、在港口、在异国的酒馆里说出「我是叙拉古人」时，说的不是某个姓氏。新发下去的市民证上没有血统栏，只有一行编号。有人说这样太冷了。莱昂图索说：冷的东西才拼得起来。"
 SRC_exp_frontier_purge: "打击边疆分裂主义"
 SRC_exp_frontier_purge_desc: "叙拉古的边疆州从来不听新沃尔西尼的。那里挂着家族的旗，收着家族的税，用的是家族的律法。整肃队带着《管理法》走进那些州，做的第一件事是把家族纹章从界碑上凿下来，换上狼徽。凿子敲了一整夜，边疆的狗也叫了一整夜。\n\n第二天早上，税关准时开了门。"
 SRC_exp_great_advance: "准备伟大进军"
 SRC_exp_great_advance_desc: "莱昂图索在军事会议上摊开地图：博尔扎诺国挡在北边，克罗地亚迪纳摩守着山口。他没说要打谁，只说了两个字——「准备」。参谋部连夜核算粮道、车皮与运力，军械库的账本第一次被翻到最后一页。\n\n而边境上的猎人已经先动了：他们从来不等命令，只等天气。"

# ---- 总结与终局 ----
 SRC_exp_legion_triumph: "军团凯旋！"
 SRC_exp_legion_triumph_desc: "叙拉古的军团上一次列队走过新沃尔西尼的街，还是家族时代的事。这一次走在最前面的是国民卫队，接着是从边疆回来的整肃队，再后面是一群穿着莱塔尼亚式大衣、却佩戴狼徽的士兵。莱昂图索站在观礼台上没有说话——他知道街上的人看的不是军容，而是一个国家终于有了自己的军队。\n\n当晚，双塔协定的席位被重新排了一遍。"
 SRC_exp_glorious_citizens: "光荣的叙拉古公民！"
 SRC_exp_glorious_citizens_desc: "最后一份公文是《公民法》，只有三条：凡是愿意交出家族纹章、在市民名册上签名的人，都是光荣的叙拉古公民；凡是公民，无论出身，享有同等权利；凡是还没有核心的地区，只要叙拉古的旗在那里飘着，就终将成为叙拉古的土地。\n\n签署那天没有仪式。只有排队的人从市政厅一直排到港口，队伍安静得能听见海。"

#========================= 民族精神 =========================

 SRC_dyn_super_siracusan: "超级叙拉古人"
 SRC_dyn_super_siracusan_desc: "「我们不是家族，我们是一个国家。」这句话从一个口号变成一种事实，用了整整九道政令：狼性的课堂、控诉的档案、界碑上的狼徽、动员令的车皮。叙拉古人开始习惯用「我们」指代一个比姓氏更大的东西。\n\n这个精神不会一次到位——每通过一格对外扩张国策，它就长一档。"

 SRC_dyn_glorious_citizen: "光荣的叙拉古公民"
 SRC_dyn_glorious_citizen_desc: "《公民法》生效之后，叙拉古的市民名册第一次比家族谱系更长。公民不再需要姓氏来证明自己属于这里：一张编号、一份守法记录、一次在登记处的签名，就够了。\n\n莱昂图索在签署当天说：「从今天起，叙拉古的边界不在纸上，在名册上。」"

 SRC_dyn_state_wolf_law: "狼徽律法"
 SRC_dyn_state_wolf_law_desc: "家族纹章从界碑上凿掉之后，空出来的位置钉上了一枚狼徽。这片边疆的税、律法与名册从此改由新沃尔西尼管辖——愿意在名册上签名的人，也就成了叙拉古的征兵对象。"

#========================= 决议分类 =========================

 SRC_exp_category: "对外扩张"
 SRC_exp_category_desc: "叙拉古不再只做买卖。宣战、附庸、整肃、入册——这些事从前由家族在酒桌上谈，现在由新沃尔西尼的公文办。"

#========================= 决议 =========================

 SRC_exp_dec_war_ltn: "对莱塔尼亚帝国宣战"
 SRC_exp_dec_war_ltn_desc: "莱塔尼亚的选帝侯席位不会自己空出来。动员令已经发了下去，档案也公开了，剩下的只有一件事——把话说完。\n\n§Y需要§!：战争支持 §H> 50%§!、稳定度 §H> 40%§!、§H100§! 政治点与 §H50§! 指挥点。"
 SRC_exp_dec_war_ltn_tt: "对§H莱塔尼亚联合帝国§!宣战（全部核心州已由【控诉莱塔尼亚暴行】预先取得宣称）。三条线任一达成即自动收网：它的抵抗垮到两成以下、§H帝都陷落§!、或议和时我方手里握着莱塔尼亚的核心州——莱塔尼亚退出战争并成为叙拉古的附庸。"

 SRC_exp_dec_purge_frontier: "整肃边疆家族"
 SRC_exp_dec_purge_frontier_desc: "边疆州的家族纹章还在界碑上，税还进了家族的账房。整肃队要做的，是把《管理法》钉进那些还在按老规矩办事的州。\n\n§Y花费 50 政治点，30 天办完一个州。§!"
 SRC_exp_dec_purge_frontier_tt: "整肃一个边疆州：该州获得州级修正§H狼徽律法§!（可征兵人口 +20%、当地人力 +20%），并直接成为叙拉古的核心领土。"

 SRC_exp_dec_contain_columbia: "遏制哥伦比亚人的扩张势头"
 SRC_exp_dec_contain_columbia_desc: "哥伦比亚的资本比军队先到。黄金平原的酒业、移动城市的图纸、还有那些带着合同来谈「合作」的商人——每一份合同都在替哥伦比亚画地图。莱昂图索不打算赶走资本，他要做的是把叙拉古挪到桌子另一头：加入双塔协定，然后让莱茵生命知道，叙拉古的港口不是谁的后院。\n\n§Y花费 100 政治点。§!"
 SRC_exp_dec_contain_columbia_tt: "加入§H双塔协定§!阵营（莱塔尼亚主导；若该阵营已不存在则由叙拉古按同一章程重立门户，若叙拉古已经坐上主位则这一段自动跳过）。同时哥伦比亚对叙拉古好感 §R-50§!，并对§H莱茵生命§!取得宣战理由。"

 SRC_exp_dec_core_states: "把没有核心的地区核心化"
 SRC_exp_dec_core_states_desc: "《公民法》的第三条不是一句空话：只要叙拉古的旗还在那里飘，那片土地就迟早要写进名册。法官们开始逐州核查——完全控制、没有抵抗、还没有入册的地方，一份一份地补上。\n\n§Y花费 100 政治点与 50 指挥点，冷却 90 天。§!"
 SRC_exp_dec_core_states_tt: "将一个§H完全控制且没有抵抗§!的非核心州并入叙拉古核心领土。"

#========================= 事件 =========================

 src_exp.1.t: "选帝侯的臣服"
 src_exp.1.d: "莱塔尼亚的军团在动员令下达的那一周就散了。武备贵族们这才发现，自己花钱养的东西，运兵靠的是叙拉古的车皮，吃饭靠的是叙拉古的粮食。当抵抗的账本掉到两成以下，首相府终于回了信——信上没有抬头，只有一枚印章。\n\n莱昂图索把信交给外交次官，说：「归档吧。从今天起，莱塔尼亚是我们的一部分。」"
 src_exp.1.a: "把金律装进档案柜"

 src_exp_news.1.t: "金律换了主人"
 src_exp_news.1.d: "莱塔尼亚联合帝国宣布停止抵抗。帝国议会最后一次开会只用了二十分钟，通过的文件只有一份——几个世纪以来，金律第一次向别人低头。\n\n那份文件上已经没有「联合帝国」四个字，落款写的是莱塔尼亚联邦。与此同时，双塔协定重新排了席位：这一次，坐在主位上的不是莱塔尼亚。"
 src_exp_news.1.a: "看起来狼群已经学会排队了。"
 src_exp_news.1.b: "莱塔尼亚人不会就这样认账。"

 SRC_exp_op_contain_columbia: "叙拉古的遏制"

