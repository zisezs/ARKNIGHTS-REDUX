l_simp_chinese:

 worldnews_kaz.1.t: "[Get_newspaper_header]萨卡兹人北进"
 worldnews_kaz.1.d: "对于萨卡兹人的动向问题，这始终是各国关注的问题。哪怕由特雷西斯组建的卡兹戴尔军事委员会已经完全统一了这片区域，但卡兹戴尔内部的战乱却似乎仍然在存在，直到最近，卡兹戴尔的军政府向外界透露出了一批训练有素的萨卡兹军队正在跨越卡兹戴尔的北方边境向布拉戈维申斯克前进。\n\n由于乌萨斯帝国的日渐衰落。布拉戈维申斯克已然成为了由乌萨斯管辖的对卡兹戴尔的缓冲区，而事实上，这片位于乌萨斯境内却不受严厉管辖的不毛之地也是曾经卡兹戴尔混战中败北者少有的避难之地。\n\n同时，乌萨斯官方也向各个城市表明绝不会让这些肮脏的混蛋跨入祖国领土半步。而对此许多来自其他国家的记者则抱有些许质疑。"
 worldnews_kaz.1.a: "背叛萨卡兹意志者终将被毁灭"
 worldnews_kaz.1.b: "如果他们真的做到了呢"
 worldnews_reu.1.t: "[Get_newspaper_header]共产主义者统一乌萨斯"
 worldnews_reu.1.d: "随着最后一场决定性战役结束，乌萨斯帝国曾经引以为傲的军队宣布对苏维埃红军投降。而就在今天的早些时候，已经迁至圣骏堡的临时最高苏维埃向全泰拉宣告，一个名为“苏维埃联盟”的新政权在乌萨斯帝国的废墟上成立。领导这个政权的布尔什维克党将由“花语运动”中衍生出的马佐夫主义作为指导思想，不过诸多国际观察家们，依然习惯于用他们以前的名字称呼他们，“整合运动”。起初，这一支队伍是以塔露拉为领袖的多支感染者反抗军的联盟。而在与萨卡兹红军意外会师并进行初步改组后，这支队伍便转变策略，开始进行割据战争。\n\n在切城事件发生后，整合运动联合罗德岛和龙门，趁机击溃了第三集团军，接管了切尔诺伯格。在随后爆发的大动乱中，整合运动和改组后的苏维埃红军一路势如破竹，击败了盘踞在东乌萨斯地区的数个旧贵族和军阀，并在统一了乌萨斯东部地区后，向乌萨斯帝国发动了最终决战并取得了胜利。\n\n临时最高苏维埃已经向乌萨斯各地发出通告，呼吁各地方苏维埃选出代表，前往圣骏堡召开正式的最高苏维埃大会，共同决定这片土地上的劳动者的未来。"
 worldnews_reu.1.a: "冬天终有尽头。"
 worldnews_reu.1.b: "赤色黎明到来。"
 worldnews_reu.1.c: "又一枚骨牌倒下了。"
 worldnews_reu.1.e: "让我们为帝国的陨落哀悼。"
 worldnews_reu.1.f: "……"
 worldnews_reu.2.t: "[Get_newspaper_header]整合运动向南转移？"
 worldnews_reu.2.d: "乌萨斯帝国第三集团军司令部宣称，他们已经基本完成了针对一支感染者反叛军的剿灭作战，消灭了叛军对切尔诺伯格城的军事威胁。但细心的观察家发现，第三集团军并未宣称击杀叛军头目，而乌萨斯南部小城布拉戈尔已经与圣骏堡失去联系，因此很有可能，这支被称为“整合运动”的感染者叛军已经摆脱了乌萨斯第三集团军的追击，并在乌萨斯南方重建了根据地。\n\n泰拉其他国家对于“整合运动”知之甚少，由于乌萨斯官方并不公布其军事行动的细节和对于该组织的情报，人们只能知道，这支部队主要由在乌萨斯逃亡的感染者组成，并且吸纳了一支由正规军叛变而来的部队和一些萨卡兹佣兵。一些记者曾在切尔诺伯格、霍尔奎克等乌萨斯远东城市目睹过该组织发放的传单，主要内容为鼓动感染者和劳工加入其组织进行反抗，一些评论家猜测，他们的思想可能带有马佐夫主义或工团主义色彩。"
 worldnews_reu.2.a: "……"
 worldnews_reu.2.b: "又一支叛军？"
 worldnews_hgs.1.t: "[Get_newspaper_header]南东国金融危机爆发"
 worldnews_hgs.1.d: "根据多家媒体报道，在炎国长鼎集团在东国的分部被曝光存在严重金融风险后，东国光元政府（以下简称“南东国”）的股价与房价急剧下跌，炎国的证券交易市场也受到了一定影响。作为东陆最大的房地产巨头之一，长鼎集团在南东国占有极大的市场份额，并控制着东国咨政院的大部分席位。但在炎国户部的一次核算中，长鼎集团被发现具有严重金融风险，虽然其本部通过了炎国户部的后续审查，但东国分部却被发现负债率过高，存在资金链断裂的风险。\n\n调查结果曝光后，长鼎集团东国分部的股价暴跌，引爆了市场对南东国股市的忧虑，投资者纷纷抛售股票，最终导致南东国股市熔断。同时，由于长鼎集团是南东国最大的房地产企业，其旗下的房产也受影响，价格出现暴跌，引发了房市的恐慌，东国房市正面临崩溃风险。目前，东国咨政院领袖，长鼎集团（东国）的董事，徐卓琳，已经回到炎国接受紧急调查。"
 worldnews_hgs.1.a: "畸形的尝试必然咽下畸形的苦果。"
 worldnews_uta.1.t: "[Get_newspaper_header]切尔诺伯格进入军事管制"
 worldnews_uta.1.d: "乌萨斯切尔诺伯格市政厅发布通告，由于“感染者叛军威胁”，乌萨斯第三集团军将对此城实行无限期军事管制。目前，包括哥伦比亚、莱塔尼亚在内的诸多国家，已经建议其公民不要前往该城市，并要求乌萨斯当局提供窗口期以撤离侨民，但乌萨斯帝国外交部尚未对此做出回应。\n\n对切尔诺伯格的持续管制，也导致乌萨斯国内对政府和军队的不信任加剧。由于前段时间第三集团军已经宣称消灭感染者威胁，但其仍对切城进行军事管制，使得人们不得不质疑军队的实力，是否真的能够消灭感染者叛军的威胁。另一方面，作为拥有百万人口的大型移动城市，切尔诺伯格在乌萨斯远东地区是重要的贸易枢纽，持续的军事管制，也使得乌萨斯商界对乌萨斯与东陆各国的贸易感到担忧。"
 worldnews_uta.1.a: "阴谋已经开始了。"
 worldnews_reu.3.t: "[Get_newspaper_header]切尔诺伯格危机解决"
 worldnews_reu.3.d: "切尔诺伯格的电台在沉寂数日后，于今日对外发出一则消息：苏维埃红军在友好势力的协助下，挫败了乌萨斯第三集团军的战争阴谋，并从他们手中解放了切尔诺伯格。\n\n该消息中提到，在乌萨斯贵族的密谋下，第三集团军借躲避天灾之名，意图操控切尔诺伯格核心城撞击炎国西北城市龙门，由此引发两国的战争，但苏维埃红军不惧危难，冒险登上行进中的移动城市，领导城市工人起义，夺取了切尔诺伯格核心城，及时停止了移动城市，拯救了两座城市的人民。\n\n这支名为“苏维埃红军”的部队，其前身为乌萨斯的感染者反抗组织“整合运动”，观察家们分析，其应当是在转战其他地区时进行了改组，成为了一个具有马佐夫主义色彩的反抗组织。马佐夫主义为“花语运动”中衍生出的一种思潮，主张推翻现有的政治经济制度，建立“共产主义”社会。目前，乌萨斯和炎国官方都尚未对此做出回应。"
 worldnews_reu.3.a: "枷锁已然破裂。"
 worldnews_cam.1.t: "[Get_newspaper_header]苏利耶跋摩二世逝世"
 worldnews_cam.1.d: "甘武者帝国的皇帝，“征服王”苏利耶跋摩二世于昨日夜晚在睡梦中逝世。苏利耶跋摩二世是甘武者帝国的缔造者，在他统治时期，他效仿哈拉帕帝国，团结起甘武者各部落建立起集权制度。军事上，彻底征服了宿敌阿育陀耶，将其全境纳入统治，彻底消除了甘武者的边境威胁，并在满贾帕希内战时夺取了北部的出海口，从而让甘武者成为了南洋航运中的有力竞争者。但同样在其统治下，甘武者延续其穷兵黩武的国策，导致其经济发展水平远逊于东陆其他国家。又因苏利耶跋摩二世在击败满贾帕希后称帝，招致了大炎帝国和哈拉帕帝国两大列强的不满，也使得甘武者在地区贸易中面临多项限制，经济陷入停滞。\n\n由于寿命长达124岁，苏利耶跋摩二世的子辈已经全部去世，他的长孙女，接受过现代教育的信诃努珂公主作为甘武者皇室的第一顺位继承人，已经在大吴哥府宣布即位为阇耶跋摩七世，她的加冕仪式将择他进行。"
 worldnews_cam.1.a: "甘武者的军国主义会为他陪葬吗？"
 worldnews_yan.1.t: "[Get_newspaper_header]张太岳被任命为炎国太师"
 worldnews_yan.1.d: "炎国朝廷宣布，前任太师魏甫因病辞去太师职务，由前礼部尚书张太岳接任太师一职，授印仪式将于今日举行。作为炎国政治派系“夕江党人”的领袖，张太岳和他的派系在炎国是坚定的改革派，主张对炎国进行全方位的改革，以解放炎国的发展潜力，在与其他列强竞争时拥有更大优势。在前段时间的南东国金融危机中，“夕江党人”因未能及时发现风险、初期应对不力而被指责，但随后他们比较成功地消除了金融危机对炎国社会造成的负面影响，因此获得了皇帝的青睐。同时，反对党“金甲集团”领袖杨钊又因其亲信的腐败案，导致其威望被严重损害。在权衡利弊后，皇帝魏遵礼最终决定任命张太岳为太师。\n\n张太岳本人由于正在筹备觐见皇帝、进行授印仪式，无法接受媒体采访，但“夕江党人”的其中一位核心人物王雱在接受媒体采访时透露，他对张太岳的“胜利”并不意外，并且他所属的政治派系已经有了“一套全面的改革方案”。"
 worldnews_yan.1.a: "古老帝国的又一次新陈代谢。"
 worldnews_yan.2.t: "[Get_newspaper_header]炎国电视剧《是，丞相》开播"
 worldnews_yan.2.d: "近日，在竞争激烈的炎国电视剧市场中，于夕江电视台首播的《是，丞相》政治讽刺喜剧异军突起，开播首日便创造了炎国电视剧收视率的新纪录。《是，丞相》改编自小说家冯敬梓和吴梦龙合著的同名小说，讲述了一名虚构的首席丞相，因其深受年老和腐败丑闻的双重困扰，于是决定在朝廷中挑选自己的政治继承人的故事。《是，丞相》用幽默的情节和对白设计，巧妙地讽刺了朝廷内部的权钱交易和官僚主义，同时也塑造出了数个性格鲜明的角色，收获了大批粉丝。\n\n由于剧中角色对朝中大臣有意或无意的影射，《是，丞相》开播以来便出现许多争议，许多官员都公开表达了不满，要求将其停播。但剧集的制作兼播出方夕江电视台并未理会这些批评，一些评论家认为，夕江电视台作为深受改革派影响的媒体，《是，丞相》很有可能是倾向改革的“夕江学会”攻击朝中保守派的一个武器。"
 worldnews_yan.2.a: "下一集什么时候播出？"
 worldnews_kjg.1.t: "[Get_newspaper_header]谢拉格发生政变"
 worldnews_kjg.1.d: "今日稍早时候，谢拉格于长波波段广播发布消息，宣称“谢拉格现已进入了新的时代”。据悉，谢拉格三大家族之一的希瓦艾什家族于蔓珠院举行圣山大会之际发动了一场军事政变，并将三大家族的行政权力悉数整合，领导这次政变的为家族首领恩希欧迪斯·希瓦艾什，他宣称谢拉格从此将睁开双眼，尽其所能地面对接下来的时代变化。\n\n作为圣山之巅的谢拉格蔓珠院，在近些年通过希瓦艾什家族所属的喀兰贸易公司与其他国家进行商贸往来，其总裁也正是其家族首领，据悉此次政变并未造成严重的流血冲突，谢拉格地区的宗教机构依然保持着正常运作，有观察员称虽然谢拉格以全新的姿态展现于世人面前，但自然环境及发展前景依旧是摆在眼前最为棘手的问题。"
 worldnews_kjg.1.a: "一块只属于昨日与明日的土地"
 worldnews_vic.1.t: "[Get_newspaper_header]维多利亚全面内战"
 worldnews_vic.1.d: "虽然占据维多利亚首都伦蒂尼姆的卡兹戴尔军事委员会已经撤出，但维多利亚各大公爵之间的矛盾最终还是走向了无可挽回的冲突。目前，各大公爵都切断了任何沟通渠道，并且各自宣布自己是维多利亚的唯一合法政权，效忠不同公爵的军队已经在争夺地带发生交火。许多试图逃离维多利亚的难民聚集到了维多利亚与其他国家的边境地区，希望得到邻国的庇护。\n\n在僵持了数年之后，曾经的泰拉第一强国最终还是落入了内战的深渊。泰拉各国纷纷对此表示关切，呼吁停火止战，建立联合政府。但同时，许多国家已经向各自支持的势力输送了武器装备或资金支持，而这些域外干涉方都默契地保持了沉默。可以预见的是，维多利亚的和平仍然没有出现在地平线上。"
 worldnews_vic.1.a: "伦蒂尼姆之桥正在倒下。"
 worldnews_vic.2.t: "[Get_newspaper_header]梅纳利姆遭受脏弹袭击"
 worldnews_vic.2.d: "维多利亚的紧张局势进一步升级。昨日，位于维多利亚南部塔拉地区的一座小城梅纳利姆被数枚特制的航空炸弹袭击，炸弹中装载了大量的源石粉尘，吸入者即会感染不可治愈的矿石病。根据粗略估计，脏弹爆炸直接导致数百人丧生，而受到感染的人数则在八千人到两万人之间。\n\n当地的维多利亚军队随后表示，他们对此次空袭负责，并且宣称袭击的原因是该城内藏有塔拉分离主义恐怖组织“深池”的秘密基地。军队的发言人还宣称，他们已经根据维多利亚法律规定，进城清剿“深池”的部队。但根据目前流传出的视频和幸存者报告，维多利亚军队只是在城内无差别屠杀。\n\n“深池”组织如今已经从地下转入公开活动，其发言人“蔓德拉”公开对维多利亚驻军的袭击表示谴责，并宣称深池会进行更猛烈的报复。维多利亚的威灵顿公爵也宣称发动袭击的维多利亚驻军为抗命的叛军，其直属部队已经准备对其进行清剿。这批驻军在指挥链上的直接领导者，温德米尔公爵，则未对此事发表任何评论。"
 worldnews_vic.2.a: "他们没有底线了吗？"
 worldnews_clb.1.t: "[Get_newspaper_header]社交平台软件“X”发布"
 worldnews_clb.1.d: "哥伦比亚商人，前总统马克·麦克斯今日召开新闻发布会，向公众宣布，一个名为“X”的社交平台已经开始运营，所有使用哥伦比亚联邦城际网络的网民，都可以在“X”平台上注册社交账号。“X”平台被定义为一个“blog”网站，即“博客”。用户可以在平台上发表任何内容，既可以简单地分享生活，也可以发布作品，还可以与其他用户参与热点话题的讨论。不少经济学家都对这一新型网络产品的盈利前景感到怀疑，但哥伦比亚民众对此则是热情高涨，在“X”开通首日，就有数百万人开通了属于他们的社交账号。\n\n在马克·麦克斯于1049年因修宪弹劾案和放任军队发动未遂政变被迫辞职后，这个哥伦比亚的开国元勋就淡出了公众视野，专注于经商事业，而这次发布会是他首次在公众面前举行的大型活动。据马克·麦克斯所言，平台的名字“X”取自其名字Max的末字母，他认为这个起名方式“有代表性和话题度”。他还声称，他对于“X”即将获得成功深信不疑，因为这是“古人的智慧”。"
 worldnews_clb.1.a: "那么他自己会开一个账号吗？"
 worldnews_sag.1.t: "[Get_newspaper_header]伊巴特王酋在讨伐中殒命"
 worldnews_sag.1.d: "广袤的萨尔贡帝国境内发生了一场暴乱。无数部族人冲入伊巴特王酋的王宫，而前者则死于火灾之中。火灾抑或暴民？没有人知道杀死他的是谁。萨尔贡军队对此事熟视无睹，也许是过于孱弱的实力限制了其行动。据悉，一位被当地人称作“沙卒”的神秘人物也出现在了现场，但他为何在此并没有任何人知晓。\n\n占领王宫的部落民们为此欢欣鼓舞，但为争抢战利品——特别是未来统治这片地区的权力，他们以极快的速度爆发内斗。他们卷入了对王酋之位的争夺，但在最终，没有任何一个部落民夺得王冠。\n\n待硝烟散尽后，老王酋的儿子承继父亲之位，成为了新的王酋。他已经开始着手平定叛乱，但是否能够尽快完成这一目的还犹未可知。"
 worldnews_sag.1.a: "沙中之火熊熊燃烧。"