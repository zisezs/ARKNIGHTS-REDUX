# ---- 国策描述 ----
YAN_court_shanshui_e1_desc:0 "博相 · 界园。由真龙亲自点将，入宰府署理山水。"
YAN_court_shanshui_e2_desc:0 "天师府。由真龙亲自点将，入宰府署理山水。"
YAN_court_shanshui_s1_desc:0 "历书一年一颁，丰歉、汛期、行军的日子都在里头。算准了，少死很多人。"
YAN_court_shanshui_s2_desc:0 "司岁台压着的那批旧图，终于肯拓一份给工部。"
YAN_court_shanshui_s3_desc:0 "山道上的驿铺十里一个，驿马三十里一换。"
YAN_court_shanshui_s4_desc:0 "邙山镇人与伥同住。镇上只求一件事：夜里别开窗。"
YAN_court_shanshui_s5_desc:0 "新镇选址之前，先请天师看一遍土，再看一遍水。"
YAN_court_shanshui_s6_desc:0 "天师府开了外府，收的不只是术师，还有肯学的人。"
YAN_court_changjie_e1_desc:0 "律相 · 炎律。由真龙亲自点将，入宰府署理长街。"
YAN_court_changjie_e2_desc:0 "前大理寺少卿。由真龙亲自点将，入宰府署理长街。"
YAN_court_changjie_s1_desc:0 "炎律上一次修订，是四十年前。"
YAN_court_changjie_s2_desc:0 "死罪要三审。一审在州，二审在大理寺，三审在决院。"
YAN_court_changjie_s3_desc:0 "巡防营管的是街面，不是战场。"
YAN_court_changjie_s4_desc:0 "谁家在长街有几间铺子，账面上一目了然，案子才好断。"
YAN_court_changjie_s5_desc:0 "大理寺断，刑部核，肃政院参。三家的门，各开各的。"
YAN_court_changjie_s6_desc:0 "律学取士考判词，不考文章。"
YAN_court_yanhuo_e1_desc:0 "膳相 · 余味居。由真龙亲自点将，入宰府署理烟火。"
YAN_court_yanhuo_e2_desc:0 "前尚蜀知府。由真龙亲自点将，入宰府署理烟火。"
YAN_court_yanhuo_s1_desc:0 "丰年收，荒年粜。仓里的粮也有不进不出的时候。"
YAN_court_yanhuo_s2_desc:0 "粮价涨到第三日，常平仓就该开门了。"
YAN_court_yanhuo_s3_desc:0 "御膳司的菜谱三年一改，改的是节令，不是排场。"
YAN_court_yanhuo_s4_desc:0 "行商坐贾，各立一簿。簿子齐了，税才好收。"
YAN_court_yanhuo_s5_desc:0 "百珍宴一年一回，来的不只是官，还有厨子。"
YAN_court_yanhuo_s6_desc:0 "百灶的灶，从来不止一口。"
YAN_court_xiange_e1_desc:0 "史相 · 太史阁。由真龙亲自点将，入宰府署理弦歌。"
YAN_court_xiange_e2_desc:0 "艺相 · 画卷。由真龙亲自点将，入宰府署理弦歌。"
YAN_court_xiange_s1_desc:0 "太史阁的门开了一条缝，让人进去抄旧档。"
YAN_court_xiange_s2_desc:0 "学宫的讲席重开，先开算学、工造、律令三院。"
YAN_court_xiange_s3_desc:0 "六部的门道编成册子，师徒相授那一套，往后要摆到明面上。"
YAN_court_xiange_s4_desc:0 "入思贤陵的名字，由史官议，不由上意定。"
YAN_court_xiange_s5_desc:0 "那把刀不入朝廷，交民间史官收着。"
YAN_court_xiange_s6_desc:0 "画院收了几个不肯画人的画师。"
YAN_court_duanfang_e1_desc:0 "工相 · 火炉。由真龙亲自点将，入宰府署理锻坊。"
YAN_court_duanfang_s1_desc:0 "工造总局把散在各坊的匠籍收拢成一本。"
YAN_court_duanfang_s2_desc:0 "炮身铸了三次。前两次废了，第三次开火时裂了。"
YAN_court_duanfang_s3_desc:0 "行远之足在城里造，零件从八域进来。"
YAN_court_duanfang_s4_desc:0 "船坞立起来那天，年绕着骨架走了三圈。"
YAN_court_duanfang_s5_desc:0 "巨兵第一次站起来，观礼的人退到了衙门外。"
YAN_court_duanfang_s6_desc:0 "匠人手里的图，从前只传儿子。现在传徒弟。"
YAN_court_baigu_e1_desc:0 "农相 · 大荒城。由真龙亲自点将，入宰府署理百谷。"
YAN_court_baigu_s1_desc:0 "屯田册上的名字，一半是兵，一半是民。"
YAN_court_baigu_s2_desc:0 "渠成之后，荒地上第一次长了稻。"
YAN_court_baigu_s3_desc:0 "边军不打仗的时候也种地。粮吃自己种的，兵就稳。"
YAN_court_baigu_s4_desc:0 "荒年开仓的口令，写在州县的门板上。"
YAN_court_baigu_s5_desc:0 "粮车走驰道，从大荒到玉门，十日。"
YAN_court_baigu_s6_desc:0 "黍把三样种籽分了三块田，谁都不许动。"
YAN_court_zaifu_e1_desc:0 "三公 · 太傅。由真龙亲自点将，入宰府署理宰府。"
YAN_court_zaifu_e2_desc:0 "龙门总督。由真龙亲自点将，入宰府署理宰府。"
YAN_court_zaifu_s1_desc:0 "考成的簿子三年一填，填的是实事。"
YAN_court_zaifu_s2_desc:0 "罢一个官，比升十个官难。"
YAN_court_zaifu_s3_desc:0 "廷议每月初一开，奏本初五进。"
YAN_court_zaifu_s4_desc:0 "御史出巡不带仪仗，只带一本空簿。"
YAN_court_zaifu_s5_desc:0 "十九司的权责写清楚，州府之间就少扯皮。"
YAN_court_zaifu_s6_desc:0 "用人不拘一格，这话说来容易。太傅做了一辈子。"
YAN_court_bingge_e1_desc:0 "守土相 · 玉门屏风。由真龙亲自点将，入宰府署理兵革。"
YAN_court_bingge_e2_desc:0 "三公 · 太尉。由真龙亲自点将，入宰府署理兵革。"
YAN_court_bingge_s1_desc:0 "三年一换，兵认得地，地也认得兵。"
YAN_court_bingge_s2_desc:0 "烽火点起来，一盏接一盏，传到百灶是两个时辰。"
YAN_court_bingge_s3_desc:0 "禁军的册子重造，吃空饷的名字划掉了三百个。"
YAN_court_bingge_s4_desc:0 "军府的簿子上，兵、马、甲、粮各一栏。"
YAN_court_bingge_s5_desc:0 "功在阵前记，赏在阵后发。"
YAN_court_bingge_s6_desc:0 "太尉在地图上圈了三处，说要设郡。"
YAN_court_bei_e1_desc:0 "礼相 · 苍生为子。由真龙亲自点将，入宰府署理北门。"
YAN_court_bei_e2_desc:0 "玉门守将。由真龙亲自点将，入宰府署理北门。"
YAN_court_bei_s1_desc:0 "哨探往北走三十日，回来时少了一个人。"
YAN_court_bei_s2_desc:0 "北地的军，冬衣比甲胄更要紧。"
YAN_court_bei_s3_desc:0 "榷场开在北门，一日一市，日落即关。"
YAN_court_bei_s4_desc:0 "雪地里练阵，练的是站得住。"
YAN_court_bei_s5_desc:0 "垒石筑城，先垒三处，再看对面动静。"
YAN_court_bei_s6_desc:0 "北疆设省，派的是文官，带的是印。"
YAN_court_xifang_e1_desc:0 "医相 · 权衡。由真龙亲自点将，入宰府署理西馆。"
YAN_court_xifang_e2_desc:0 "礼部侍郎。由真龙亲自点将，入宰府署理西馆。"
YAN_court_xifang_s1_desc:0 "通译馆里的话，一句要译三遍才对得上。"
YAN_court_xifang_s2_desc:0 "条约抄一遍存两处，一处礼部，一处天镜阁。"
YAN_court_xifang_s3_desc:0 "西边的书上讲的不少是器物的道理，也有讲人的。"
YAN_court_xifang_s4_desc:0 "把买来的东西拆开，一件一件对图。"
YAN_court_xifang_s5_desc:0 "西边的商队进来，第一件事是验货。"
YAN_court_xifang_s6_desc:0 "缴来的东西登记入册，能修的修，不能修的拆。"
YAN_court_dongfang_e1_desc:0 "暗相 · 十九道。由真龙亲自点将，入宰府署理东抚。"
YAN_court_dongfang_e2_desc:0 "秉烛人监正。由真龙亲自点将，入宰府署理东抚。"
YAN_court_dongfang_s1_desc:0 "司岁台的网撒在东边，收的是巨兽的动静。"
YAN_court_dongfang_s2_desc:0 "秉烛人一年巡两趟，只在夜里进城。"
YAN_court_dongfang_s3_desc:0 "密折不走驿，走人。人到御前，折子才开。"
YAN_court_dongfang_s4_desc:0 "界石立了三处，山民认了，才算数。"
YAN_court_dongfang_s5_desc:0 "密档的柜子三把锁，钥匙分在三个人手里。"
YAN_court_dongfang_s6_desc:0 "这一局从古寺摆到锁川，落子无声。"
YAN_court_nanfang_e1_desc:0 "贾相 · 账目。由真龙亲自点将，入宰府署理南库。"
YAN_court_nanfang_e2_desc:0 "司岁台监正。由真龙亲自点将，入宰府署理南库。"
YAN_court_nanfang_s1_desc:0 "矿政设局，先把矿权收进册子。"
YAN_court_nanfang_s2_desc:0 "织造总局开工那天，绩自己坐在账房。"
YAN_court_nanfang_s3_desc:0 "商队出关要有护卫，护卫的饷从税里出。"
YAN_court_nanfang_s4_desc:0 "南库的仓底，垫着三层木板。"
YAN_court_nanfang_s5_desc:0 "天下的账先算平，才谈得上分利。"
YAN_court_nanfang_s6_desc:0 "边市的税一日一结，日落后封匣。"

# ---- 事件 ----
YAN_court.20.t:0 "满朝"
YAN_court.20.d:0 "十三席坐满。案上那张地图第一次拼成完整的一张，山水、长街、烟火、弦歌、锻坊、百谷、宰府、兵革各占一块，北、西、东、南、海另列在外。有人添了灯，议事随即开始。"
YAN_court.20.a:0 "依议施行"
YAN_court.21.t:0 "首次开议"
YAN_court.21.d:0 "宰府开了第一次会，人到了一半。散会时太傅留下一句：往后每月初一都来。"
YAN_court.21.a:0 "照例开议"
