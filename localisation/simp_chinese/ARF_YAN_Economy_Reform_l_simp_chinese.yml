# ---------------- 将领 ----------------
YAN_gen_texas:0 "德克萨斯"
YAN_gen_texas_desc:0 "德克萨斯家族的末裔，企鹅物流的特别顾问。她很少说话，剑和行军路线都收拾得很干净。"
YAN_gen_lemuen:0 "蕾缪乐"
YAN_gen_lemuen_desc:0 "企鹅物流的资深干员，拉特兰出身。她习惯把战场拆成一张张便签，再按顺序一张张解决。"

# ---------------- 事件：满目疮痍 ----------------
yan_eco.1.t:0 "满目疮痍"
yan_eco.1.d:0 "§W〔旁白〕§!：百灶宫城入夜当燃六十盏宫灯，今夜却撤去了四十盏。仅存的二十盏里，十盏守着宫门，十盏照着御案。\n§Y户部侍郎§!：「陛下，国库……已经是空的了。」\n§M太傅§!：「空到何种地步，不妨直言。」\n§Y户部侍郎§!：「臣不敢奏。这本实账一旦摊开，朝堂上是要掉脑袋的。」\n§Y真龙§!：「那就给朕翻。一页一页地查，查到有人把亏空认下来为止。」\n§Y户部侍郎§!：「若不算各州拖欠的岁贡，臣今夜拼死也只能凑出六十万两。」\n§Y真龙§!：「六十万两，够做什么？」\n§Y户部侍郎§!：「只够修补禁城底下的护城封印。」\n§M太傅§!：「陛下今夜裁撤宫灯，户部大堂里的烛火，想必能亮得更久些。」\n§Y真龙§!：「撤灯省不下几个铜板，朕只是嫌殿里太亮，晃得某些人看不清账目。」\n§Y真龙§!：「明日早朝，朕要见到实账。」"
yan_eco.1.b:0 "先关掉几盏灯"

# ---------------- 事件：我看魏彦吾搞得很不错... ----------------
yan_eco.2.t:0 "我看魏彦吾搞得很不错..."
yan_eco.2.d:0 "§W〔旁白〕§!：日落大道的霓虹次第亮起。街角鳞丸摊蒸腾的热气漫过半条巷子，魏彦吾背着手，在摊前驻足良久。\n§Y魏彦吾§!：「老伯，来一碗。」\n§R百灶随员§!：「……魏公，下官奉旨来龙门，不是来陪您逛夜市的。」\n§Y魏彦吾§!：「着什么急。你们百灶的钦差到了龙门，总得先闻闻这街上的烟火气。」\n§Y魏彦吾§!：「说吧，龙门的经商规矩，户部打算怎么个学法？」\n§R百灶随员§!：「自然是……先调阅龙门近十年的税册与账目。」\n§Y魏彦吾§!：「死账有什么好看的。能在市井里滚出真金白银的，才叫真账。」\n§C林§!：「老魏，驿馆那边还在等你的准话。」\n§Y魏彦吾§!：「回他们的话：想看账可以，先把龙门商会的规矩摸透了，咱们再坐下来谈数字。」\n§W〔旁白〕§!：滚烫的鳞丸端上桌，魏彦吾慢条斯理地尝了一颗，随手将竹碗推到随员面前。"
yan_eco.2.b:0 "先看账，再谈规矩"

# ---------------- 事件：我看哥伦比亚搞得很不错... ----------------
yan_eco.3.t:0 "我看哥伦比亚搞得很不错..."
yan_eco.3.d:0 "§W〔旁白〕§!：汐斯塔的黑曜石码头昼夜吞吐不息。市政厅门前悬着哥伦比亚联邦的旗帜，旗角已被微咸的海风浸湿。\n§R赫尔曼·道尔科斯§!：「诸位自大炎远道而来，不去观赏火山盛景，反倒一头扎进市政厅看账本？」\n§G锡兰·道尔科斯§!：「父亲，火山是汐斯塔的风景，账目上写的才是联邦与市议会的规矩。」\n§R赫尔曼·道尔科斯§!：「锡兰，在外宾面前把底交得这么透，父亲这生意可就没法谈了。」\n§Y大炎使者§!：「名山大川我大炎见得多了。使团此来，是想瞧瞧一座刚平定内乱的自由市，是如何拿捏财权的。」\n§R赫尔曼·道尔科斯§!：「三年前黑曜石矿走的是官定牌价，如今嘛，由市议会随行就市。」\n§Y大炎使者§!：「既如此，不知赫尔曼市长准许我们带些什么回百灶复命？」\n§R赫尔曼·道尔科斯§!：「成熟的投资章程，或是懂行的人才——全凭贵国陛下挑。」\n§W〔旁白〕§!：锡兰微微一笑，将一册装订考究的历年税务旧档推过桌面，扉页正停在十一年前那场「大静谧」后的重建账目上。"
yan_eco.3.b:0 "只带走人，不带走账"

# ---------------- 事件：大鲍勃与坎诺特合谋窃取大炎国有资产... ----------------
yan_eco.4.t:0 "大鲍勃与坎诺特合谋窃取大炎国有资产..."
yan_eco.4.d:0 "§W〔旁白〕§!：界园外围库房清点完毕，账实相抵，整整少了三成。失窃的除了大批精密源石器件，还有半卷岁陵旧档。\n§M坎诺特§!：「容我先声明一句——鄙人坎诺特·古德英纳夫，是个本分的生意人。不过库房出了这么大窟窿，总归得找个人顶缸，对吧？」\n§R大鲍勃§!：「少把脏水往我身上泼。我只管酿酒和货运，撬大炎官库的事，可不是我干的。」\n§M坎诺特§!：「老朋友，别急着撇清嘛。园子里的违禁货是怎么装上源石虫车队运出去的，你我心照不宣。」\n§G左乐§!：「秉烛人左乐请陛下示下：这伙黑市商贾，是即刻收网严办，还是暂且记在暗账上？」\n§Y真龙§!：「记下。放长线，人先留着，莫要打草惊蛇。」\n§W〔旁白〕§!：左乐将旧档封皮上的火漆私印拓下一份，原卷依旧锁回铁匣，仿佛从未有人动过。"
yan_eco.4.b:0 "先记在账上"

# ---------------- 事件：鸭爵来信 ----------------
yan_eco.5.t:0 "鸭爵来信"
yan_eco.5.d:0 "§W〔旁白〕§!：一封信毫无征兆地落在议事厅案头。不见信使踪影，信封上亦无火漆，唯有一根雪白的鸭羽压着信纸。\n§M太傅§!：「（展开信笺念道）『听闻大炎正在筹措一场必胜之仗，鄙人愿略尽绵薄之力。至于报酬——我只求亲眼见证一场比天坠之灾更精彩的战争。』」\n§M太傅§!：「哼，高卢来的兽主。这些长生者的慷慨，向来都是明码标价的。」\n§Y真龙§!：「信上可曾提他想要什么？」\n§M太傅§!：「附页上列了一长串古物与地契的名目，口气倒是不小，问朝廷敢不敢应承。」\n§Y真龙§!：「压在案头。回与不回，且看他们接下来能拿出多少诚意。」\n§M太傅§!：「……老臣遵旨，这便替陛下压在最上头那一摞。」\n§W〔旁白〕§!：缀着白羽的信笺被搁在御案顶层，底下压着七份边关急报。至于先翻哪一份，全看大炎如今的缓急轻重。"
yan_eco.5.b:0 "把信压在案头"
