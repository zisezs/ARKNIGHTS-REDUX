# ==============================================================================
#  大炎 · 经济国策树重制版 —— 动态精神 / 法案 / 事件 / 顾问
#  国策名称与效果 tooltip 在 ARF_YAN_Economy_Rework_l_simp_chinese.yml（生成器产物）
