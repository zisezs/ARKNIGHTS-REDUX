# ---------------- 动态民族精神 ----------------
YAN_eco_spirit:0 "大炎前路黯淡..."
YAN_eco_spirit_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n岁陵之乱中，大炎各地的基础设施和经济秩序遭到严重破坏，艰难扛过天灾人祸之后国民经济百废待兴。\n\n为此，刚从多索雷斯度假归来的§R陈晖洁§!女士决定对经济制度展开大刀阔斧的改革...\n\n老资历农业学家§R黍§!和小资历美食家§R余§!也被太傅邀请过来为民生保障出谋划策..."
YAN_eco_spirit_steady:0 "大炎平稳航行..."
YAN_eco_spirit_steady_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n风浪还在，船已经稳住了。账本一页页补齐，市面上重新有了隔夜的钱。"
YAN_eco_spirit_waves:0 "大炎乘风破浪！"
YAN_eco_spirit_waves_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n大炎不再只是等风浪过去。船头抬起来，沿着自己的航线走。"

# 贸易法案的和平 / 战时切换修正（无图标，不进政治面板）
YAN_eco_trade_peace:0 "独善其身（和平）"
YAN_eco_trade_peace_desc:0 ""
YAN_eco_trade_war:0 "兼济天下（战时）"
YAN_eco_trade_war_desc:0 ""

# ---------------- 限时民族精神 ----------------
YAN_eco_victoria_blew:0 "维多利亚爆了！"
YAN_eco_victoria_blew_desc:0 "维多利亚的银行一家接一家关门，泰拉的商路跟着抽紧。大炎的账房连夜点灯，把能收的钱先收回来。"
YAN_eco_longmen_governance:0 "推广龙门治理经验"
YAN_eco_longmen_governance_desc:0 "龙门那一套按点换班、划线下棚、开票留根的规矩，被抄成册子发往各州。学得像不像，先看有没有人照着做。"

# ---------------- 法案 ----------------
YAN_unburning_economy:0 "不烧心经济"
YAN_unburning_economy_desc:0 "不靠把炉火烧到最旺来撑场面，先把每一块砖、每一根梁用在能长久的地方。账面上慢一点，家底却厚起来。"

YAN_self_reliant_trade:0 "独善其身，兼济天下"
YAN_self_reliant_trade_desc:0 "关起门来把自己的账算清，是独善其身；等有余力，再把路修到别人门口，是兼济天下。大炎先做前者，后者留给以后。"

YAN_self_reliant_trade_tt:0 "\n§Y和平时期：§!科研速度 §G+20%§!，工厂产出 §G+20%§!，战略资源出口 §G+30%§!\n§Y战争时期：§!战略资源出口 §G+10%§!，军用工厂建造速度 §G+30%§!，每周稳定度 §R-1%§!"

# ---------------- 国策效果的特殊行 ----------------
YAN_eco_suppress_corruption_tt:0 "§Y民族精神追加效果：§!"
YAN_eco_suppress_corruption_rename_tt:0 "§Y民族精神【大炎前路黯淡...】改名为【大炎平稳航行...】并追加效果：§!"
YAN_eco_wonders_tt:0 "§G全部奇迹工程进度 +25%，持续 24 个月§!"
YAN_eco_chen_report_note_tt:0 "§8和平时期：科研速度 +20%，工厂产出 +20%，战略资源出口 +30%\n战争时期：战略资源出口 +10%，军用工厂建造速度 +30%，每周稳定度 -1%§!"
YAN_eco_steady_sailing_note_tt:0 "§8与民用经济同档，但民用工厂建造速度 +30%§!"

# ---------------- 将领 ----------------
YAN_gen_texas:0 "德克萨斯"
YAN_gen_texas_desc:0 "德克萨斯家族的末裔，企鹅物流的特别顾问。她很少说话，剑和行军路线都收拾得很干净。"
YAN_gen_lemuen:0 "蕾缪乐"
YAN_gen_lemuen_desc:0 "企鹅物流的资深干员，拉特兰出身。她习惯把战场拆成一张张便签，再按顺序一张张解决。"

