# ---------------- 动态民族精神 ----------------
YAN_eco_spirit:0 "大炎前路黯淡..."
YAN_eco_spirit_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n岁陵之乱中，大炎各地的基础设施和经济秩序遭到严重破坏，艰难扛过天灾人祸之后国民经济百废待兴。\n\n为此，刚从多索雷斯度假归来的§R陈晖洁§!女士决定对经济制度展开大刀阔斧的改革...\n\n老资历农业学家§R黍§!和小资历美食家§R余§!也被太傅邀请过来为民生保障出谋划策..."
YAN_eco_spirit_steady:0 "大炎平稳航行..."
YAN_eco_spirit_steady_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n风浪还在，船已经稳住了。账本一页页补齐，市面上重新有了隔夜的钱。"
YAN_eco_spirit_waves:0 "大炎乘风破浪！"
YAN_eco_spirit_waves_desc:0 "\n\n\n\n\n\n£GFX_YAN_eco_reform_banner£\n\n\n\n\n\n\n\n大炎不再只是等风浪过去。船头抬起来，沿着自己的航线走。"

