 #民族精神
 SIE_Economic_transformation: "转型期中的汐斯塔经济"
 SIE_Economic_transformation_desc: "在还未加入哥伦比亚联邦的数十年前，汐斯塔曾高度依赖黑曜石开采产业。而在后来，随着“大静谧”余波逐渐消退，旅游业又成了新的支柱产业。\n\n尽管汐斯塔一直希望能够成为一个中立商业枢纽城市，但黑曜石开采与旅游业依旧是支撑经济的重要部分。不过，新开发区的建设正在稳步推进，而转型进程也在不断前行。也许有一天，这座美丽的南方小城能够真正改变自己的经济结构，成为赫尔曼市长愿景中的样子。"
 SIE_Southern_Trade_Port: "稳固的南方贸易港"
 SIE_Southern_Trade_Port_desc: "赫尔曼·道尔科斯市长所规划的转型进程已然结出硕果。汐斯塔在他的英明领导下迎来了崭新曙光：黑曜石开采在经济中的分量已不足为重，而旅游业也不复曾经基石地位。\n\n或许汐斯塔的工农业仍难被称作发达，但商业与航运业皆得到了充分发展。在哥伦比亚联邦庇护之下，汐斯塔成为了中陆南方的窗口都市，依靠商贸于诸国间维持微妙中立地位，作为“泰拉大地上最后的自由城市”冉冉生辉。挑战与机遇仍在未来等待着汐斯塔，而这座已迈入新时代的城市也将不惧一切艰难险阻，继续勇往直前。"
 SIE_Extractive_economy: "盘剥式经济"
 SIE_Extractive_economy_desc: "在克洛宁政变后，汐斯塔的经济体系于他旨意被改造为当下的畸形状态。旧日节制的黑曜石开采已然不再，无节制的开采行为则使环境状况大为恶化，而工人们也为一日胜过一日的工时与不断减少的薪水与福利而怨声载道。\n\n也许自然资源（特别是黑曜石）的大量出口的确能为汐斯塔带来一段经济繁荣期，可被遗弃的经济转型计划与人们脸上的不满都彰显着一个事实——这种剥削性的经济导向无力长久维持，它终有一日会倒塌。无论推倒者是其创造者克洛宁自己，还是不满的市议会...亦或者群情激愤的人民。"
 SIE_volcano_issues: "火山口下"
 SIE_volcano_issues_desc: "在当年建设汐斯塔的开拓者们看来，他们所选择建立定居点的地区或许是少有的宜居之地——气候温和，水源充沛。但这些先人们似乎忽略了一个简单事实——那便是近在咫尺的火山。尽管它似乎长期处于休眠期，没有对汐斯塔的太大威胁。但倘若其在某日突然喷发，必将造成灾难性的可怖后果。\n\n为远离这把悬于头上的达摩克里斯之剑，赫尔曼·道尔科斯市长一直在向新开发区投入资源，尝试将汐斯塔完全搬上移动城市以躲避天灾。目前，这个或将改变汐斯塔风貌的项目已经完成大半。或许在不久的将来，人们就将搬迁至移动城市上生活。远离美丽的海岸沙滩，也同时远离火山的危机。\n\n§R不过，若来不及在灾难降临前将汐斯塔搬上移动城市，汐斯塔必然面临万劫不复的危机。§!"
 SIE_Almost_destroyed: "近乎毁灭的汐斯塔"
 SIE_Almost_destroyed_desc: "在当年建设汐斯塔的开拓者们看来，他们所选择建立定居点的地区或许是少有的宜居之地——气候温和，水源充沛。但这些先人们似乎忽略了一个简单事实——那就是那近在咫尺的火山。尽管它似乎长期处于休眠期，没有对汐斯塔的太大威胁。但倘若其在某日突然喷发，必将造成灾难性的可怖后果。\n\n§R而在如今，灾难已然降临。汐斯塔火山于无止境的过度滥采之下最终喷发，近乎整个汐斯塔市就此毁灭。尽管有着哥伦比亚特区的支持，但救灾与重建工作的推进仍然推进缓慢。考虑到城区堪称可怖的受灾范围，也许汐斯塔将再无重振之日。§!"
 SIE_solitary_boat_of_south: "“南方孤舟”"
 SIE_solitary_boat_of_south_desc: "作为在扩张浪潮中少许未被吞并的自由城邦，汐斯塔所处地位相当微妙。它最初由哥伦比亚人建立，又曾受维多利亚诸公爵的觊觎，在过去处于大国的夹缝之间。而在1066年，随着维多利亚“邀请加入”的单方面通知，汐斯塔走到了城市命运的十字路口。\n\n人们都不想失去得来不易的自由，可维多利亚的势力是如此强大。面前的抉择令议事大会议员们陷入两难境地，而就在此时，还未成为市长的议员赫尔曼·道尔科斯提出了应当与哥伦比亚取得联系的提议。通过对哥伦比亚的求援，汐斯塔顺利度过了这场危机，可代价却是以高度自治的自由邦身份加入联邦。如今，汐斯塔的安全在哥伦比亚庇护下无疑有了保障，这叶“南方孤舟”得以平稳航行，但未来是否还会有重大危机仍是个未知数。"
 SIE_Siesta_Police: "汐斯塔警队"
 SIE_Siesta_Police_desc: "就像泰拉现存的大部分独立城邦一样，汐斯塔并没有任何真正意义上的军队系统，一支人数不多的职业警队便是所有武装力量。考虑到本市并不需要面对任何军事冲突，这支警队在处理治安等日常事务上的规模已经足够。但随着地缘局势日趋激化，汐斯塔在未来遭遇外敌入侵或将不再是种假想。或许有朝一日，汐斯塔人将为保卫自由邦而建立一支从属哥伦比亚的正规军。"

 #事件
 #未来的开发者你好:)以下这些事件文本可以随便修改！因为它们都并非为玩家而创作。——谢拉格的橘色菲林，于2025/10/8
 sie.1.t: "1097年汐斯塔黑曜石节"
 sie.1.d: "D.D.D还是大帝，你会投给谁？\n\n另外黑曜石节为什么叫黑曜石节你知道吗？不知道的话看了接下来触发的新闻你就知道咧:)"
 sie.1.a: "好耶！"
 sie.2.t: "针对市长的阴谋？"
 sie.2.d: "市议会中一位忠于赫尔曼·道尔科斯的议员向市长呈交了自己的调查，他似乎认为秘书克洛宁近期行动过于反常，也许和一些坊间关于某些人对市长策划阴谋的传言有关。"
 sie.2.a: "克洛宁究竟想干什么？"
 sie.2.b: "不切实际的谣言罢了。"
 sie.3.t: "被挫败的阴谋"
 sie.3.d: "一个不幸消息——我们发现了克洛宁妄图政变的阴谋。而他似乎也意识到了这点，妄图诱导火山爆发以摧毁汐斯塔！万幸市长和来本市度假的罗德岛干员们（或市警局）成功阻止了阴谋，而克洛宁也被关进了监狱。当然，对外界的宣称是亲爱的克洛宁先生只是身患重病，去住院了。"
 sie.3.a: "好好好。"
 sie.4.t: "赫尔曼市长遭遇刺杀！"
 sie.4.d: "真是个该死的日子，市长正在发表激动人心的演讲。人们的情绪都十分热情，可某个人好像热情过头了——他突然掏出一把手弩向市长射击，竟然正中胸口！赫尔曼·道尔科斯市长自数十年前便是汐斯塔的灵魂人物，他的遭袭不禁让人感到强烈不安。不过至少我市急救人员效率很高，第一时间就把昏迷不醒的市长先生送往了医院。"
 sie.4.a: "谢天谢地，赫尔曼他还精神着呢！"
 sie.4.b: "噩耗传来！赫尔曼不治身亡。"
 sie.5.t: "克洛宁政变！"
 sie.5.d: "一切都来得如此突然，我们完全不知道这个家伙是何时收买了这么多政府内部人员的！市议会完全被他控制，而几位市政府的保安人员也和克洛宁沆瀣一气。在汐斯塔警察反应过来之前，克洛宁的支持者以迅雷不及掩耳之势控制了汐斯塔市政厅，而那些议会中的叛徒则支持他成为了新任市长！"
 sie.5.a: "道尔科斯时代已死。"
 sie.6.t: "浮出水面的隐秘阴谋"
 sie.6.d: "市长遇刺后数十日，我市警察通过对凶手的大记忆恢复术与相关调查发现了一个惊人事实——市长秘书克洛宁便是这场暗杀的幕后凶手！人证物证皆在，没想到同行如此多年，人们才发现克洛宁竟是此等小人！毫无疑问，他没有任何脱罪理由，这个可耻的阴谋家已经被判处终身监禁。"
 sie.6.a: "天啊。"
 sie.7.t: "新的领航员"
 sie.7.d: "看起来我们的新市长锡兰·道尔科斯已经从青涩期中走出，而这几年的工作经历也让她不再优柔寡断且依赖议会与经验丰富的行政官僚们。毫无疑问，锡兰市长已经继承了他父亲的所有优秀品质，成为了一位真正领袖。"
 sie.7.a: "循此苦旅，终抵群星。"
 sie.8.t: "汐斯塔的转型进程"
 sie.8.d: "待在城市旁边的火山对汐斯塔来说显然太过危险，为此赫尔曼市长在过去便一直计划将汐斯塔搬上移动城市。如今，这个计划已经完全投入实际，人们在黑曜石节过后纷纷移居新开发区，而汐斯塔向成为中立商务活动枢纽的转型也在逐步进行。"
 sie.8.a: "以后可能再也看不到海了。"
 sie.9.t: "汐斯塔的转型大获成功"
 sie.9.d: "我们已经成为了一座真正的现代商贸城市，不再需要依靠往日的黑曜石经济，也不再需要旅游业撑起GDP了！"
 sie.9.a: "太棒了！"

 #等会，这些是新闻事件，别在没有准备的情况下动这些！
 worldnews_sie.1.t: "[Get_newspaper_header]汐斯塔黑曜石节开幕"
 worldnews_sie.1.d: "作为一年一度的音乐盛会，黑曜石节在泰拉南方的城邦汐斯塔中已有了不短的历史。据说它的起源可被追溯到过去矿工们在黑曜石采石场竖井中举办的简单音乐会，而在历史长河中，其最终演化为了如今人们所知的盛大国际音乐节。\n\n如同以往一样，汐斯塔市政府于黑曜石期间向公众开放了所有度假村、酒吧及各类娱乐设施。而黑曜石节的精髓，即通过投票决定年度最佳音乐家的环节也一如往常被延续。多国游客正在涌入汐斯塔，而许多著名歌手与乐队也一同前往。相信1097年的黑曜石节一定能够延续以往辉煌，成为又一场令人印象深刻的盛事。"
 worldnews_sie.1.a: "祝大家玩得开心！"
 worldnews_sie.2.t: "[Get_newspaper_header]汐斯塔的突发政变"
 worldnews_sie.2.d: "就在今日，哥伦比亚的远方飞地——拥有高度自治权的汐斯塔自由邦发生了一起惊人事件。掌权数十年的政治强人与企业主赫尔曼·道尔科斯市长于政变中被推翻，而作为赫尔曼市长秘书与早年间合作伙伴的克洛宁在市议会议员们拥护下成为了新任市长。\n\n与道尔科斯不同，这位通过政变上台的汐斯塔新任市长有着天灾信使与火山监测工程师背景，但他的施政策略却显得极不符合其身份。克洛宁市长不顾生态环境问题，高调宣布将开启大规模黑曜石开采项目。许多赫尔曼·道尔科斯留下的经济转型与城市建设项目被搁置或乃至取消，而支持前市长的政治活动家甚至民众也遭大规模逮捕。看起来这座“南方孤舟”的未来将不甚乐观。"
 worldnews_sie.2.a: "哥伦比亚特区会作何想法？"
 worldnews_sie.3.t: "[Get_newspaper_header]汐斯塔市长遇刺"
 worldnews_sie.3.d: "惊人消息从哥伦比亚的南方飞地传来，汐斯塔自由邦——这座于联邦内拥有高度自治权的城市就在刚刚发生了一起政治刺杀，而遇刺者不是别人，正是已于该市掌权数十年的市长赫尔曼·道尔科斯。\n\n作为汐斯塔自1066年至今的统治者，赫尔曼·道尔科斯或许可被称为汐斯塔历史上最为伟大的市长。曾在维多利亚兼并威胁下为汐斯塔找到新出路的他广受民众拥戴，而其遇刺也引发了广泛的恐慌情绪。许多关于市长健康状况或刺杀事件的传言在短时间内广为流传，有人声称市长已经身亡，也有人声称刺客是维多利亚或萨尔贡派来的。但在官方通告下，许多传言不攻自破。\n\n根据市政厅方面的消息，刺客没能伤及赫尔曼市长的任何脏器或别的致命部位。目前已能确认市长生命安全无忧，也许赫尔曼在不久后就能回归市议会，继续他的工作。"
 worldnews_sie.3.a: "连这南方小邦也要堕入政治暴力的泥沼？"
 worldnews_sie.4.t: "[Get_newspaper_header]汐斯塔市长遇刺身亡"
 worldnews_sie.4.d: "惊人消息从哥伦比亚的南方飞地传来，汐斯塔自由邦——这座于联邦内拥有高度自治权的城市就在刚刚发生了一起政治刺杀，而遇刺者不是别人，正是已于该市掌权数十年的市长赫尔曼·道尔科斯。\n\n作为汐斯塔自1066年至今的统治者，赫尔曼·道尔科斯或许可被称为汐斯塔历史上最为伟大的市长。曾在维多利亚兼并威胁下为汐斯塔找到新出路的他广受民众拥戴，而其遇刺也引发了广泛的恐慌情绪。许多关于市长健康状况或刺杀事件的传言在短时间内广为流传，可随着一则讣告发出，汐斯塔市陷入了更为严重的恐慌中。\n\n根据官方消息，赫尔曼·道尔科斯市长不幸离开了人们。在这位拥有崇高声望的政治强人去世后，市议会紧急推举了其女锡兰·道尔科斯临危受命，担任“代理市长”。人们对此事意见不一，有人将其视作宪政史上的耻辱，高呼这完全是如王国般的封建继承制；也有人将锡兰·道尔科斯所担任的“代理市长”视作过渡性职位，认为这不过是权宜之策。"
 worldnews_sie.4.a: "“南方孤舟”的未来仍处迷雾之中。"
 worldnews_sie.5.t: "[Get_newspaper_header]旧汐斯塔火山爆发"
 worldnews_sie.5.d: "或许汐斯塔人早已预料到了这天的到来——就在今日，旧汐斯塔的火山灰逐渐弥漫，荫蔽住大半天空。山岩崩落，岩浆涌出，烟尘遮住了半边天空，又缓缓落回地面。人们的旧日回忆就此被纯白的火山灰掩埋，而汐斯塔的历史也掀开了新的一页。\n\n汐斯塔的市民们对此事感受不一，有人对旧汐斯塔的毁灭感到遗憾甚至悲伤，而一些人则认为这不应被称作“毁灭”，而是属于汐斯塔之新生的里程碑。\n\n自汐斯塔搬上移动城市已经过去了数年，这座曾经由哥伦比亚“退役”士兵建造，由黑曜石产业撑起的南方城邦已顺利完成了向商业与旅游业的转型进程，并作为一座中立的自治城市在愈发动荡的泰拉大地上艰难维持着属于他们的和平。此次火山爆发虽无重大政治或经济意义，但其或许仍会为人们铭记。"
 worldnews_sie.5.a: "一个时代的结束？"
 worldnews_sie.6.t: "[Get_newspaper_header]汐斯塔之灾"
 worldnews_sie.6.d: "或许自克罗宁全面接管市政府，开启毫无节制的大规模黑曜石开采之时，汐斯塔人便早已预料到了这天的到来——就在今日，汐斯塔的火山灰逐渐弥漫，荫蔽住大半天空。山岩崩落，岩浆涌出，烟尘遮住了半边天空，又缓缓落回地面。无数生命就此被纯白的火山灰掩埋，而汐斯塔也进入了全市紧急状态。\n\n克洛宁市长于火山喷发中侥幸生还，并在逃离已近乎成为焦土的汐斯塔市中心后于受天灾影响程度较低的市郊重组政府。这位前天灾信使的命运终遭天灾反噬，而汐斯塔民众与市议会对克洛宁的信任也跌至谷底。在哥伦比亚援助下，救灾工作正缓缓开展。可考虑到汐斯塔市近乎所有部分已遭毁灭，或许未来的重建将极为困难。"
 worldnews_sie.6.a: "种下之因终成恶果。"