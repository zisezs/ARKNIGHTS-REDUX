l_simp_chinese:
 #领导人
 SIE_Herman_Doykos: "赫尔曼·道尔科斯"
 SIE_Herman_Doykos_desc: "提起汐斯塔这座南方的美丽城邦，人们会在第一时间想起什么？是美丽的海滩，黑曜石抑或与这种石头同名的音乐盛会，还是它令人印象深刻的火山？若向汐斯塔之外的人提及这个问题，他们大抵会在前四个事物中脱口而出其中一个。可对于汐斯塔本地市民而言，这个问题的答案却更加多元。他们或许会向你提及本市的一些“古老”传统与有关政治的小道传言，抑或对城市前景的展望与担忧。可若统计归纳这些回答中关于人名的数据，你显然难以忽略赫尔曼·道尔科斯市长的鼎鼎大名。\n\n身为在本市早已声望斐然的著名企业主与议事大会议员，赫尔曼在1066年前便已是当时汐斯塔最具话语权的数位政治家之一。从旧日的“南方小径”、“南方航道”到如今的“南方孤舟”，他也无疑也是见识了近代汐斯塔大部历史的老资历之一。过往对从人际交往到地缘政治积攒下的经验让他在汐斯塔面对维多利亚“邀请”所致危机，议事大会不知所措时果断提出了与哥伦比亚恢复联系的建议。而在的全民艰难讨论过后，这则提案最终得以通过。依靠加入联邦获得庇护，汐斯塔得以幸存，而赫尔曼·道尔科斯也获得了前所未有的强大政治影响力。\n\n抓住这个千载难逢的机会，利用与哥伦比亚特区之间的信息差与他手上的一把好牌，赫尔曼得以全面改组汐斯塔的行政体制，并在法案得到表决之后正式登上“领航员”之位。如今，虽在由议事大会改组而成的市议会之中仍难得到所有议员支持，而他在部分事务上被认为或许有些倾向于“软性威权主义”的做法也小有争议，但赫尔曼·道尔科斯市长依旧稳握住权柄，继续为孤舟开辟航路。"
 SIE_Ceylon_Doykos: "锡兰·道尔科斯"
 SIE_Ceylon_Doykos_desc: "锡兰·道尔科斯，这位火山学者出身的年轻继任者，在父亲赫尔曼·道尔科斯遇刺后的权力真空中被推上“临时市长”之位。作为政治家之女的她虽然自幼浸染官场气息，但早在维多利亚国立大学求学时期，便展现出了超越其自身的意识——不仅频繁参与源石病理研究社团，更在毕业前夕协助汐斯塔与外国医疗公司建立了跨城医疗合作项目。\n\n当各方势力在议会厅争执不休时，也正是因为她的这份特殊资历，使她成为改良主义的劳工派与自由主义的哥伦比亚派都能勉强接受的过渡人选。然而，这位临时市长的上任并不意味着汐斯塔回归稳定。如达摩克里斯之剑一般的火山烟尘依旧漂浮在每个人的头顶，而市议会中的争议与将汐斯塔搬上移动城市之工程的诸多问题若想解决亦非易事。当锡兰·道尔科斯召开会议时，她所面对的绝不仅是地质报告上的跳动曲线，抑或经济报表上的杂乱数字——而是一场真正的考验：一场检验她是否能够真正引领汐斯塔远离灾难威胁，迈向更伟大未来的考验。而迎接这份考验的人，正是数年前那个还在维多利亚咖啡馆里为毕业论文焦躁的少女。\n\n或许在某日黄昏，锡兰会坐在办公室内，望向窗外昏红的夕阳。手中的通讯器显示着岩浆流动模拟图和议会抗议函，她突然想起维多利亚图书馆那个迷茫的深夜，此刻她才终于懂得：真正的答案从来不在书页间，而一直藏在脚下这片灼热大地之中。"
 SIE_Ceylon_Doykos_desc_alt: "" #未使用，期待未来的更新吧
 SIE_Cronin: "克洛宁"
 SIE_Cronin_leader_desc: "当运载金券的车辆接连驶出克洛宁的府邸，越来越多的议员收下了他那份“薄礼”。于是，政府的风向渐渐偏向了这位由赫尔曼一手提拔起来的副手、秘书兼合作伙伴。\n\n泰拉历1082年，一场突如其来的天灾席卷了克洛宁的故乡。他眼睁睁看着亲友在灾祸中逝去，家园化为废墟。为了存活，他被迫蜷缩进污浊的垃圾桶中，躲避灾后遍布的源石，以免感染矿石病。这段经历在他心中刻下深重的创伤，多年过去，他仍深信财富才是唯一的救赎。直到那个男人出现——赫尔曼·道尔科斯。他救起了克洛宁，给予他容身之处。后来克洛宁才得知，这位恩人来自一个名为汐斯塔的城市，正是那里的市长。自此，克洛宁便常伴赫尔曼左右，担任秘书，处理日常事务与琐碎工作。赫尔曼任命他为天灾信使，使他在权力的阶梯上步步攀升。克洛宁并未如黑那般直接参与赫尔曼的家长式治理，却在某些时刻悄然知晓其中玄机。\n\n利欲熏心之下，克洛宁伪造了火山监测报告，声称火山状态极不稳定，随时可能喷发，以此煽动市民恐慌。同时，他与V3工业勾结，暗中监督火山深处的非法黑曜石开采。沉甸甸的哥伦比亚金券和维多利亚镑源源不断地流入他的口袋。\n\n争执始于一场或许本身无足轻重的小小议案。二人在办公室中从清晨吵到日暮，最终克洛宁摔门而去，昔日恩义就此断绝。在他持续的金钱攻势下，绝大多数市议员倒向了他。政变当夜，克洛宁终于坐上了梦寐以求的市长座椅。而在他上任的几日之后，克洛宁便启动了堪称夸张的资源采掘项目。大量机械被投入黑曜石开采，这座小岛的资源被这位年轻人急剧透支。听着下属汇报火山危险指数不断攀升，克洛宁只是挥挥手让人退下。他坚信，如今的汐斯塔已焕然不同——或许已然临近的毁灭，正是新生的开始。"
 SIE_Cronin_second_in_command_desc: ""
 SIE_Leaderless: "无组织领导层"
 SIE_Leaderless_desc: "如果你是游戏里看到这条文本，那大概是用了控制台导致的。"
 SIE_Schwarz: "黑"
 SIE_Schwarz_leader_desc: "“汐斯塔怎么就成了现在这个样？”当坐在临时市长之位上，看着一份份报告中克罗宁留下的烂摊子焦头烂额之时，这句话总会在黑的脑中响起。这位城市治安局局长的人生可谓坎坷不平，她本生于一个虽不富裕，却还算小康的雷姆必拓商人家庭。可在黑六岁那年，一场突如其来的变故致使她染上矿石病，还在阴差阳错中失去了双亲并遭受奴役。\n\n而在颠沛流离的奴隶生活之中，她最终被一支佣兵团买下。而这支佣兵团除了进行战争行为，更多的是负责接手大人物们的委托，做一些上不得台面的脏活。而黑经过他们的锻炼，成为了一个孩童杀手。在经过几次任务后，“组织”接到了让某座城市出一些“意外”的任务，而黑的命运也因这场任务而得以改变。她原本的任务是去暗杀汐斯塔市长赫尔曼·道尔科斯，却在接近后者的过程中被其折服，并借前者之力达成复仇。自此，回归光明之下的黑逐步褪去了身上黑暗。可即便任职市长保镖兼治安局局长，她在曾作为杀手时冰冷与漠视生命的本性仍未被洗净。\n\n这种“独特”的性格在有时备受指责，但事实证明，它也在关键时刻给了黑做出关键决断，率领警队推翻暴君克罗宁的勇气。随着特警小组杀穿市长卫队防线，克罗宁的“窃市专政”得以终结。人民欢欣鼓舞，而哥伦比亚特区也默许了黑成为新任“临时市长”。身为人民拥戴的过渡之选，黑的执政方针并未超脱赫尔曼时代的框架。但除去对她而言最为紧要的维稳，平息克罗宁带来的生态灾祸与政治灾难也必不可少。从艰难维持汐斯塔的自治，到尽可能不出差错地将权力过渡回市议会中的温和派，这条路必然不会轻松。" #未使用，期待未来的更新吧

