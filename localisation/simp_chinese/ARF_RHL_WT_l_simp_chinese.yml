 RHL_wt_l4: "莱茵“树”民防"
 RHL_wt_l5: "递质指挥网络"
 RHL_wt_r1: "聚焦发生器战备"
 RHL_wt_r2: "浮空舰队动员"
 RHL_wt_r3: "动力甲军团"
 RHL_wt_r4: "兽主战争契约"
 RHL_wt_r5: "星门紧急开启"
