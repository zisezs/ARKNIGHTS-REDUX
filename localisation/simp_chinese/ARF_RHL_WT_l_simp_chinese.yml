# ══════════════════ 国策正文（tooltip 首行灰白正文） ══════════════════
 RHL_wt_flavor_start: "哥伦比亚从未如此需要莱茵生命。当战火从维多利亚烧到乌萨斯，从莱塔尼亚烧到卡西米尔，天空成为最后的战场。十科合议厅的灯光在那一夜没有熄灭。"
 RHL_wt_flavor_l1: "这不是演习，不是拓荒，不是天空热。这是战争。每一个哥伦比亚人，无论感染者还是非感染者，无论贵族还是拓荒者，都要为这场战争贡献一切。"
 RHL_wt_flavor_l2: "塞雷娅站在哥伦比亚西部的边境线上。她的钙质化从手掌蔓延至整条山脉，将每一个山口、每一座桥梁、每一处海岸都变成了坚不可摧的堡垒。“科学不容侵犯，真理只在射程之内。”"
 RHL_wt_flavor_l3: "石棺的能量被优先供应给军事工业。特里蒙的灯火熄灭了，但兵工厂的熔炉彻夜燃烧。斐尔迪南在能量井旁站了三天三夜，确保每一度电都流向最需要的地方。"
 RHL_wt_flavor_l4: "莱茵“树”的根系覆盖了整个哥伦比亚的天空。当敌机来袭，那些看似普通的枝叶会释放出密集的咒言弹幕；当导弹落下，树冠会像盾牌一样展开。娜斯提在树上刻下了第一道防线。"
 RHL_wt_flavor_l5: "每一名士兵的脑中都有一个微型递质节点。他们不需要无线电，不需要旗语，不需要命令。他们只需要一个念头——整个军团就能像一个人那样移动、开火、撤退。多萝西的梦想，在战场上变成了最可怕的武器。"
 RHL_wt_flavor_r1: "聚焦发生器从万星园的残骸中被重新组装起来。这一次，它不再对准星荚，而是对准了每一个威胁哥伦比亚的城市。“地平弧光计划”没有失败，它只是需要一个新的目标。"
 RHL_wt_flavor_r2: "螺旋桨天堂的废墟上，新的浮空舰队正在升空。它们不再是游乐园的展品，而是搭载着源石火炮与递质制导武器的战舰。哥伦比亚的天空，第一次有了主人。"
 RHL_wt_flavor_r3: "每一个哥伦比亚公民都能穿上动力甲。不需要训练，不需要筛选，不需要天赋。只要你还活着，你就是一件武器。“加入联邦军，你就是动力甲！”——这句征兵海报上的话，在战时变成了现实。"
 RHL_wt_flavor_r4: "鸭爵出现在十科合议厅的窗外。他说：“我可以帮你们。但我要看到一场比天空坠落更好看的战争。”塞雷娅在契约上签了字。她知道代价是什么——但她别无选择。"
 RHL_wt_flavor_r5: "马里亚姆从因非冰原发来通讯：星门的能量读数已经稳定，可以开启一次。但只能开启一次。克丽斯腾的遗产，将在这场战争中兑现。“告诉我，塞雷娅——你想从星门后面要什么？”"
 RHL_wt_flavor_end: "十科合议厅的灯光终于熄灭了。塞雷娅走出会议室，看向特里蒙的天空。那里有浮空舰队在巡航，有聚焦发生器的光环在闪烁，有莱茵“树”的枝叶在风中摇摆。她知道，这场战争无论胜负，哥伦比亚都将不再是原来的哥伦比亚。"

