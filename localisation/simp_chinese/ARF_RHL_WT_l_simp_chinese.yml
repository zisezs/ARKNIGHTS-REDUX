# ══════════════════ 莱茵生命·战时国策树（RHL_wt） ══════════════════
# 入口：决议「真理终将得胜！」——莱茵生命、1100 年及以后、处于非和平状态。
# 终局：国策「莱茵战争机器」——移除动态修正 RHL_wt_dyn，换挂 RHL_wt_warmachine（同名效果）。
# 三条「花费类」效果里，只有防空阵地建造花费（写不进动态修正）由
# common/ideas/RHL_wt_ideas.txt 的隐藏精神承载，故此处也给出它的名称键；
# 空军 / 陆军的攻防数值已直接并入动态修正 RHL_wt_dyn。

# ══════════════════ 决议分类 ══════════════════
 RHL_wt_decisions: "莱茵生命·战时体制"

# ══════════════════ 决议 ══════════════════
 RHL_wt_decision_truth: "真理终将得胜！"
 RHL_wt_decision_truth_desc: "哥伦比亚从未如此需要莱茵生命。当战火从维多利亚烧到乌萨斯，从莱塔尼亚烧到卡西米尔，天空成为最后的战场。十科合议厅的灯光在那一夜没有熄灭。\n\n§Y效果：§!授予民族精神「战时经济」（军用工厂产能 §G+30%§!，稳定度 §R-40%§!），并载入莱茵生命战时国策树。\n§R启用条件：§!莱茵生命；时间 1100 年及以后；处于非和平状态；人类玩家限定。"

 RHL_wt_decision_load_tree: "加载战时国策树"
 RHL_wt_decision_load_tree_desc: "十科合议厅的灯光在那一夜没有熄灭——现在，把哥伦比亚的全部产能推上战时轨道。\n\n§Y效果：§!授予民族精神「战时经济」（军用工厂产能 §G+30%§!，稳定度 §R-40%§!），并载入莱茵生命战时国策树。\n§R启用条件：§!莱茵生命；§Y仅人类玩家可见可用§!（AI 不会进入战时体制）。\n§L随时可用，无需等待战争爆发；与「真理终将得胜！」共用同一入口效果，用过任意一条另一条即消失。§!"

 RHL_wt_decision_originium_storm: "启动人造源石风暴"
 RHL_wt_decision_originium_storm_desc: "十科合议厅的灯光终于熄灭了。塞雷娅走出会议室，看向特里蒙的天空。那里有浮空舰队在巡航，有聚焦发生器的光环在闪烁，有莱茵“树”的枝叶在风中摇摆。她知道，这场战争无论胜负，哥伦比亚都将不再是原来的哥伦比亚。\n\n§Y效果：§!对所有交战国的首都引爆人造源石风暴（州级核爆），并在当地留下 §R730 天§! 的原子辐射。\n§R启用条件：§!完成国策「莱茵战争机器」；任一交战国的投降度 §Y大于 50%§!。"

