 development.1.t: "农业水平提升至现代农业"
 development.1.d: "是什么造就了这一切成就？如今农业已经发展到一个前人从未设想过的高度，农业真正成为了一项属于未来的产业，过去利用土地耕作的方式几乎被抛弃了，新式的转基因作物拥有仅仅用一些特制营养液就能生长在水中的能力，它们高产，不怕病害，不怕虫蛀，并且能够将这种强健的基因传递千秋万代。自动化控制系统取代了农民，如今我们甚至不需要拖拉机和收割机司机了：自动驾驶系统接管了驾驶舱，上百台农机可以在同一时间出动，以过去传统有人农机上百倍的效率完成各自的任务—它们甚至还是全电动的！，新式药物和生物学技术将畜牧业提高到另一个层次，人们已经开始人工合成牲畜，从不会有肥肉的猪到随时可以产奶的牛。\n\n但是在这一切经济数字和欣欣向荣的农产品市场下，又掩盖着什么秘密？我们究竟是为子孙后代创造了一个没有人再挨饿的世界，亦或者我们只是一群愚蠢的为产量不择手段的功利主义者？\n\n一切都得交由我们的子孙去批判，不过至少在当下，我们证明了一个人人生活富足的世界是有希望的。"
 development.1.a: "“错乱疯狂的未来”——"Virtual Insanity”"
 development.2.t: "农业水平提升至机械化农业"
 development.2.d: "电动灌溉设备唧唧作响，三两台收割机在田间行进，在阳光下闪着光的拖拉机轰隆驶过田埂小路，微风拂过金黄的麦田，配有最新式温湿度控制器的自动筒仓被谷物塞满，集约化养殖场中牲畜正在进食掺有各式名字拗口的防疫药物的饲料---这一切景象都在向我们阐述一个令人振奋的事实：我们的农业水平已经有了长足的进步，如今已经几乎不需要人工的劳作，轰鸣的钢铁巨兽将以前所未有的速度完成前人想也不敢想的工作量，现代化学工业也在田间地头证明自己的力量不仅可以用于毁灭，也可以用于创造：新式的化肥，除草剂和杀虫剂被广泛用于生产，在养殖业中也掀起了在牲畜身上施用各式全新上市的抗生素，激素和维生素的潮流，虽然引起了公众对食品安全性的担忧，但是在日益增长的亩产量和出栏数目面前这一切都只是一些恼人的噪音罢了，乡村遍布农机经销商，育种站，农资店铺。很显然，人类农业历史将要迎来一次新的，翻天覆地的大革命了。"
 development.2.a: "“该死，谁又往我的拖拉机油箱里灌了机油？”"
 development.3.t: "农业水平提升至集约化农业"
 development.3.d: "最近，关于集约农业的话题被激烈的讨论着，人们讨论着随着工业化进程一道进行的农业集约化进程；新式的耕作方法，诸如轮耕，密植，杂交等从前农民们闻所未闻的耕作方法和现代的植物学理论把农业从纯粹经验主义的实践和总结变成了一门同样需要严密计算和推理的科学，像畜力拉动的收割机这样的工具也在改变着农业工作本身。然而，这场变革真正重要的是农业生产的形式：过去自耕农们自给自足，独立于市场的时代已经彻底过去了，农村的物资供应市场不在独立于城市，随着工业化的深入，城市对农业生产的依赖增强，农村逐渐和城市绑定在了一起，为了满足工业化产生的劳动力缺口和逐渐增长的非农业人口数量，农村被驱赶上了快速发展的大道，大型农庄被建立，严格编排的工作时间表—当然还有严厉的监工—提高了工作效率，也减少了农民数量的需求，而那些多出来农民们被赶进城市的工厂中，他们经历了工业化发展血腥而不可避免的一环，这就是所谓的“原始积累”"
 development.3.a: "“在我还小的时候，妈妈会轻摇我的摇篮，在家后院的棉田”——"Cotton Fields""
 development.4.t: "农业水平提升至自给农业"
 development.4.d: "过去寸草不生的荒地如今被农人的锄头和犁征服，空置了许久的筒仓终于迎来了第一克小麦，磨坊中又响起久违的吱嘎声，农民们无微不至的关照着自己田地中的作物：除草、驱虫、浇水。一切工作都要做的不紧不慢，细心再细心，直到最终收获的那一天，农民们终于从繁重的劳动中解脱出来，与亲朋好友相聚，以自己的方式庆祝收获，直到下一个播种季，周而复始，如此生活千年。无论如何，我们的农业水平已经有了长足的进步，如今我们的粮食供应虽然仍不乐观，但至少已经脱离了“饥荒”的范畴，虽然距离所有人都无需辛苦劳作换取口粮的时代还很远，无论如何，我们已经在对饥饿的战争中取得了值得夸耀的战果。现在，人们满足了自己至关重要的第一需求：温饱，终于有机会去考虑其他一切事务：从发动战争到探索世界的奥秘。"
 development.4.a: "“在那片偏远荒原，为我的温饱而战”——"Baba O’Riley""

 development.5.t: "农业水平下降至寸草不生"
 development.5.d: "自我们的祖先第一次驯服植物并有意识的种植以获取热量开始，人类、农业和文明就变成了无法分割的三位一体，再伟大的帝国如果忽视了农业，必定会在饥荒和叛乱中分崩离析，无论是高高在上的帝王，傲慢自大的官僚或者是精益求精的工匠，没有千万面朝黄土背朝天的农民辛勤劳作供养这些人物，他们都将在可悲的营养不良中死去。\n\n问题是我们现在要么没有田地，要么没有农民，我们都得营养不良了。"
 development.5.a: "“打扰了，请问这碗麦粥您还吃不吃？”"
 development.6.t: "农业水平下降至自给农业"
 development.6.d: "集约化农业生产的努力失败了，这一努力失败的原因众说纷纭。可能是因为城市没有足够多的岗位吸纳无地农民，或者缺乏足够大的粮食市场消化产能，又或者是整个国家面对着某种深重的经济危机，不得不把一些人赶回乡村——或者饿死。无论原因如何，结果是显而易见的，那些曾经连田阡陌的集中化农庄破产了，自耕农们回到了自己的地头，用自己村庄内和附近集市的产出满足自己平生的一切所需，除去缴税，他们又一次不再需要与外界的一切发生关系。那些我们曾经努力集中起来进行农业生产的农民回到了过去的生产状况，回到了那个没有良种和机械，没有化肥和农药——当然也没有排班表的时代。工厂老板们会为市场的萎缩和工人的短缺而苦恼的。"
 development.6.a: "“那税收和工厂怎么办？”"
 development.7.t: "农业水平下降至集约化农业"
 development.7.d: "非常坏的消息，由于农用机械的缺乏，农业化工原料的短缺，农村的破产或其他种种原因，我们不得不回到过去以畜力和人力进行主要农业劳动的时代。那些曾经威力无比的农用拖拉机死兽一般倒在它们工作过的田埂里，农民们没法再开动它了，很快它们都会被拖走，拆解然后变卖，上好的金属能换不少钱。面对虫灾和兽瘟我们再次无能为力，尽管大家知道如何对付这些东西，但我们搞不到我们急需的种种药物，只能依靠减小养殖密度来预防瘟疫，采用间作以减小虫灾的破坏力。化肥的严重短缺使得土地肥力发生了下降，我们必须重新启用轮作制以节约地力，这导致我们需要更多的职业农民和更多的土地来保障我们的粮食供应。所幸，那些水利设施目前还能用。很显然，未来的几年都将是饥荒之年，我们必须做好准备，必要时动用战略储备来维持安定。"
 development.7.a: "“先勒紧裤腰带吧，挺一挺就过去了。”"
 development.8.t: "农业水平下降至机械化农业"
 development.8.d: "创造超级作物对如今的人类来说也许不是什么好主意，但现在指责当年的监管太过草率来的太晚了——那些超级作物的子孙后代正在破坏我们的生态环境，使得我们控制区内的植物生态出现了不同程度的破坏，许多野生植物的基因库被转基因作物污染了，我们不知道如此复杂的生态系统被我们如此扰动之后会发生什么，我们希望事情不会变得更糟糕。超级病原体导致的瘟疫正在我们的兽栏之间肆虐，滥用抗生素导致的生态危害不仅损害了养殖业，还使得我们的公共卫生部门焦头烂额，希望事情还不会更糟。完全电动化的农业机具倒是留了下来，除了太贵以外它们没啥缺点，新的农机采购可能还是会青睐于传统农机，直到我们解决价格以及其他应用上的难题。"
 development.8.a: "“大踏步的前进，大踏步的后退”"

 development.9.t: "工业水平提升至工厂自动化"
 development.9.d: "我们的国家和社会正在迎来一个伟大光荣的时刻——工业的自动化进程已经取代了巨大的进展，工业革命在这片大地上已经被我们聪慧的科学家和工程师，技艺精湛的工人和术师们发展到了一个节点，一个通向真正未来社会的节点，叩开了通向一扇新时代的大门。在过去的工厂里，工人们忍受着源石反应带来的技艺辐射，为了微薄的工资而挥汗如雨，但如今全新的工业互联网已经连接起工厂里精致如天工造物的机器人和物流系统，工人们只需要面对着巨大的全息屏幕，手持终端下达指令，原材料就能被机器人轻松的加工为产品；大地数据传输网络和无人化物流网络的建立，已经让交通要道上络绎不绝的商业交流渐渐成为历史，无人载具正在根据新建成的产业大数据中心的指令，从琳琅满目的货架上取出定制化的产品，以最精确的时间安排送向最需要它们的地方；与此同时，小规模的制造商也是成为时代的牺牲品，围绕着数据和信息展开的全局化产品调配使得只有最巨大，管理最有效的大企业能够组织起规模如此之惊人的社会化大生产。在辉煌背后，也有着绝对不可忽视的隐患：巨大的失业规模、技术对人生活的异化、惊人的源石环境污染、甚至是骇人听闻的技术反叛危机，都是这个时代不和谐的杂音。工业的自动化，是泰拉文明的未来，或是末日？"
 development.9.a: "不论如何，未来已至"
 development.10.t: "工业水平提升至工厂规模化"
 development.10.d: "过去的工业，是脏乱、低效、血汗劳动的综合体，但在今天，我们已经迈出了一大步，大企业对工业生产的支配，已经为我们带来了前所未有的生产管理效率。现代化的工业，就是巨大的工业联合体和充足的产业基础设施的综合体。在如此巨大的工业生产规模面前，我们的经济体已经能够提供足够的能源、原材料、交通工具、科学技术和高素质的劳动力，喂饱这座巨大的工业机器。过去那种工匠手工式的，去标准化的和竞争力底下的工业生产现在一去不复返，巨大工厂雇佣了数以千计的工人，分工明确而有着专业管理人员的精细指挥控制，他们操纵着有着体量如古代奇观一般的超级机器，以诸神创造世界一般的巨力生产出过去要付出无数手工才能生产出的钢铁、机械、化学药剂、源石燃料、电子产品和建材，以最精确的控制手段和最史无前例的生产力来塑造今天的现代生活。经营这些大工厂的垄断组织取代了旧有的小工厂，自动化生产线取代了手工加工，但是，工人也从机器的操纵者，变成了机器的一个配件，他们的生命或许还比不上机器上的一段源石回路，甚至不如一颗螺丝钉。"
 development.10.a: "欢迎来到摩登时代"
 development.11.t: "工业水平提升至小型生产线"
 development.11.d: "工业是什么？有人说是机器，有人说是源石能源，有人说是大工厂。但是，没有劳动的广泛协作和分工，工业革命又从何谈起呢？曾经，我们国家的经济就是许许多多小作坊和综合体，而通过建立起真正的厂房，安装需要多人协作才能运转的技术装备，我们已经迎来了工厂制度的开枝散叶。自由散漫的作坊式生产正在逐渐被工厂里的劳动纪律所击败，人们已经越来越形成守时的习惯；工厂里生产的大量产品日渐过剩，呼唤着建造新交通系统来帮助在远方销售产品；整体化的能源供应正在逐渐建立起来，这必将让所有居民感受到现代源石能源所提供的排山倒海般的力量。只不过，拦在工业现代化面前的障碍，也逐步显现出来，高素质劳动力的缺乏、技术的落后，还有越来越应该受到人们重视的感染者权益问题，都成为亟待解决的难题。"
 development.11.a: "点燃锅炉，鸣响汽笛！"
 development.12.t: "工业水平提升至电动工具生产"
 development.12.d: "人类的工业起初只需要一双巧手，但很快，光依靠一双手就不足以制造足够多合格的产品。为了弥补人力的不足，我们引入了役畜和风车、水车，但风车和水车需要自然条件的帮助，随后我们发明了蒸汽机，尽管嘈杂，但它可以建造在绝大多数有一点点水供应，且燃料可以送达的地方，随着工厂规模的扩大和蒸汽设备运作必须连贯才能保持效率的特性，我们引入煤气和蜡烛，辅助工坊彻夜不停。如今，随着电力这种跨时代能源的普及，以上都将成为过去式，发电厂建筑在远离工厂的地方，依靠电线驱动工厂的机器，既改善了工厂的物流环境，又让工厂的布局更加紧凑。电灯的使用也提供了更多的照明，大大降低了彻夜工作的成本，还让工厂更不容易火灾，一切似乎都是好消息，但随着照明的改善，工人们也失去了夜晚这个天然的休息时间，永不停歇的机器也制造了更多的工伤报告。"
 development.12.a: "“嘿！别把手伸进去！”"

 development.13.t: "工业水平下降至纯手工工坊"
 development.13.d: "在人类过去的文明史上，那些能工巧匠无不是如此劳作，他们日出而作，日落而息，用最简单的工具去锻打，铸造，切削，烧制……一双巧手，最多加上一点点水力和风力，配合上常年积累的经验，这就是创造过去一千年间几乎所有产品的秘诀。纵使不再拥有电动或气动的便利工具，我们的工匠依然能够工作，依然能制造出那些基本的产品。只要师傅们认真的教学和鞭打他们的徒弟，我们的能工巧匠就生生不息。\n\n请别在意产量问题。"
 development.13.a: "“这够吗？”"
 development.14.t: "工业水平下降至电动工具生产"
 development.14.d: "多人协作的工业生产线自然很好，整齐划一的流水线可以让工业生产规模更大，更便捷，工人所需的专业培训也可以更少，但我们似乎还是失败了。导致我们失败的原因可能有非常多：缺乏搭建生产线的技术和经验导致难以普及，过于廉价的人工导致升级生产线无利可图，复杂动荡的政治环境导致缺乏国内市场维持工业生产，外国商品倾销导致本土工业发展困难，随便哪个原因都可能阻断我们的工业升级之路，所幸我们还有一些使用电动工具的小作坊能够运转，暂时先这样吧，也许有一天我们还能在全国推广工业流水线这种生产方式。"
 development.14.a: "熄火……下工了。"
 development.15.t: "工业水平下降至小型生产线"
 development.15.d: "那些曾经如雷贯耳的工业联合体解散了，曾经昼夜不息的厂房已然关停。现实的冰水浇灭了超大规模生产的火焰，随着大型工业联合体的倒闭解散，那些曾经如同神话一般的大型生产线被拆解或变卖，已然失去了往日的光荣。许多受过训练的知识分子不得不去同那些普通技工一起争抢不需要他们知识的岗位，或者去其他国家寻找工作机会，大量受过训练，知道如何使用先进设备生产的工人也不得不用回那些堪称简陋的劳动工具，全国的工业生产水平都陷入了衰退当中。"
 development.15.a: "悲剧，这是整个国家的损失。"
 development.16.t: "工业水平下降至工厂规模化"
 development.16.d: "完全自动化的工业是个好主意，可为了完成生产的自动化，我们必须付出大量成本——随着传统岗位的减少和小微制造企业的大量关停，大批失业普通工人成为社会的不安定因素，随着先进技术的应用，维护整个工业体系所需的资源也日渐增多。\n\n也许我们太急躁了。"
 development.16.a: "“脚踏实地，也好”"

 development.17.t: "教育水平提升至普及高等教育"
 development.17.d: "我们做到了！现代化的生产需要具备足够多知识积累的人力，普及的高等教育一方面提供了足够的知识或技能培训，一方面又大大提升了我们国民的平均文化素养，在我们的国家，能胜任进行自动化生产的人才俯拾皆是，我们的新兵对学习如何使用各种技术兵器得心应手，今日我们所做的一切都将为我们未来更长远的发展铺好康庄大道，在通往未来的大道上，我们将比其他人走得都快！"
 development.17.a: "“想学啊，我教你啊？”"
 development.18.t: "教育水平提升至普及初等教育"
 development.18.d: "我们建设了大量的扫盲班和中小学校，以求普及从小学到初中的初等教育，这些教育的目的是培养现代工业社会所需要的人才，他们具备一些比较初级的知识，这些知识可以帮助他们进一步深造，或者解决大多数日常生产生活中所需的问题——当然，还有两个更重要，但也更难启齿的原因：初等教育有助于塑造民族认同，提高我们民族内部的团结，此外，接受过初等教育的训练之后，我们的国民会更适应按照时间表，听从上级指令行事的现代工业生活。"
 development.18.a: "“上课起立就是开工集合，都一样”"
 development.19.t: "教育水平提升至基本扫盲"
 development.19.d: "随着我们扫盲工作的进行，现在绝大多数我们的年轻人都能进行基本的读写，有一部分老人因为年岁太老，终究没能得到基础文化教育。但对相对年轻的国民来说，读书识字，会基本的计算已经不再是珍惜到需要专门单列一条的，值得炫耀的技能。会读报纸，会写书信，会进行基本的计算都被视为一种基本的素质，被默认为一个年轻人应该拥有的能力。"
 development.19.a: "“报纸发行量扩大了十倍。”"
 development.20.t: "教育水平提升至高文盲率"
 development.20.d: "好消息，随着我们扫盲工作的进行，有些原先的文盲学会了简单的文字书写，能够读一点文字和写一些常用词，包括自己的名字，并且可以进行最基础的数学计算，这使得我们的基层官吏的平均素质稍微提升了一些。在劳动阶级中，出现了大量的书信代写和代阅读的职业，客观上促进了我们民间通讯和交流的发展。"
 development.20.a: "“一加一等于二，没错吧。”"

 development.21.t: "教育水平下降至文盲遍地"
 development.21.d: "居民的文化程度可以说是一个民族的脊梁，它是复杂工作的润滑剂，因为如果无法读写，就无法处理文字信息，使得大规模协作不太可能。它是集体认同的凝结核，因为我们说同样的话，写同样的字，我们就是基础意义上的自己人。尽管很丢人，但很难不承认一点，在这个意义上，我们的民族是无脊椎动物。"
 development.21.a: "“需要我继续在地上爬吗？”"
 development.22.t: "教育水平下降至高文盲率"
 development.22.d: "老百姓反正都是要劳作一辈子的，读书写字有什么用？站在决策者的角度上，也许稍微动动脑子就能想出许多广义上的好处，例如人口文化素质的提高可以增加各个职业的平均技能水平，例如受过基本教育的人更容易忠诚于本民族，可以提高国家凝聚力，例如普惠和广泛的教育可以提高国家发现和利用人才的能力……可问题是，这一切总的来说都是国家的好处，而不是老百姓眼前实打实的好处，反正横竖都要干一辈子活，就算不会写自己的名字，不明白加减乘除，日子不照样过吗？"
 development.22.a: "“读书对他们总该有些什么用才好吧。”"
 development.23.t: "教育水平下降至基本扫盲"
 development.23.d: "我们关停了许多并不需要的中小学校，尤其是那些贫困地区的学校。因为他们的招生数越来越少，过分入不敷出，投入补贴来维持如此大规模的初等教育似乎有些不合时宜，更别提寻找教师本身的困难了。对大多数群众而言，从事工人和农民的工作并不需要初中文凭就能胜任，会读报纸，会写书信，会进行基本的计算，听从工长的命令都是基本的素质，是一个年轻人应该拥有的能力——但大多数工人和农民似乎只要会这些就够了，至于一元二次方程，基本的外语知识？我会这些我买菜能打折吗？"
 development.23.a: "“很抱歉，不能”"
 development.24.t: "教育水平下降至普及初等教育"
 development.24.d: "我们的许多大学减少了招生，说真的，我们并不需要那么多大学生。没有那么多适合他们的岗位提供，维持这么大规模的高等教育似乎是纯粹的得不偿失。他们从大学毕业出来，发现自己的工作初中生也干得了——那他们多受的那么多年教育到底有什么意义呢？浪费全家人的钱和时间吗？那还不如取消那些没必要的大学，集中教育资源，把大学的大门留给有兴趣，有需要……或者付得起账的人吧。"
 development.24.a: "“大学的门没必要为每个人开着”"

 development.25.t: "行政效率提升至制度完善"
 development.25.d: "在过去的年代，帝国的尺寸决定于传令兵的速度，取决于烽火台的烽烟，取决于商队的畜力车。\n\n在近代，一个国家的行政力量与电话电报线、无线电波和陆地船舶航线紧密相连。\n\n随着我们造出能部分代替人思考的机器，在城市之内通过一根小小的网线互相传播文字、报表甚至视频和音频，我们也许能尝试一种从未有过的社会形式——这些能帮助计算和处理报表的机器能帮助我们处理大多数的基础问题，而通过无纸化，即时通讯的互联网系统，更高效的信息传递和行政效率将成为可能，我们的每一级政府机构的效率都将前所未有的大大提高。"
 development.25.a: "“我们将铸就从未有人设想的明天。”"
 development.26.t: "行政效率提升至高效行政"
 development.26.d: "这样的国家，在过去的一千年里，在这片大地上还从来不曾有过，能将全国强大的力量如臂指使的调动起来，把国家机器的存在拓展到最边缘的村庄，而在这个过程中我们将顺带着逐步消灭贫困和无知，塑造出有史以来最幸福的人民。我们在做一个伟大的事业，无论成功与否，我们都将如此尝试。"
 development.26.a: "“我们不仅有机会走向一个富裕和强大的社会，而且有机会走向一个伟大的社会”"
 development.27.t: "行政效率提升至正常运转"
 development.27.d: "这真是甜美，不是吗？\n\n当我们的最高立法机构通过法律，我们的所有司法机关就会遵循，我们的常备军是全国唯一合法的军事力量，而地方民兵也不再只是豪强们豢养私兵的幌子，他们真真正正成为了统一的国家军队的后备与辅助力量，当我们命令完成一个全国性计划，能限制我们的只有我们自己的技术水平以及国库的厚度，税务机关正常的征收国家税务，而不是向各个省收取贡品。真是健康的国家机器。"
 development.27.a: "“为了这一切，我们值得举杯庆贺。”"
 development.28.t: "行政效率提升至低效行政"
 development.28.d: "可喜可贺。\n\n我们现在至少可以自称为一个国家而不是一个城邦。我们拥有一支存在在大地上而不是理论上的陆军，我们的财政机构至少能够通过各种手段维持我们的正常运转。我们的命令现在可以通过至少名义上科层制的机构半心半意的执行，我们订立的法律能用于指导地方司法机关。尽管离开我们首都之外，那些所谓的省长和总督们到底有多忠诚依然未可知。\n\n腐败依然笼罩着我们的领土，地方山头依然明火执仗的显露出来，甚至连地方之间可能都随时爆发大规模火并，政府的控制力恐怕也只到万人规模的聚集地为止，但没什么可害怕的。"
 development.28.a: "“一千年以来，大地上绝大多数国家也不过如此”"
 development.29.t: "行政效率提升至政府形同虚设"
 development.29.d: "恭喜，我们名义上已然成为一个政府。\n\n但局势仍然不容乐观，我们的政令只在包括首都在内的几个重要地区有效。在我们的统治核心之外，没有人会赞同我们的政策，除非他们觉得这个政策对他们有利可图。大大小小的地方利益集团依然在实质上控制着我们占领区的方方面面，他们暂时还没有公开反对我们，但这不过是因为他们找不到足够好的理由。我们当前的地位出自这样的力量均衡，希望您学过一点杂技。"
 development.29.a: "“您需要走钢丝的技巧”"

 development.30.t: "行政效率下降至无政府"
 development.30.d: "“最坏的秩序胜过无秩序”\n\n这句箴言已然实现。\n\n无论这里曾经屹立着多么辉煌的帝国，如今它也化为焦土，成为地理概念。在这个国家的废墟之上盘桓着军阀、土匪和自立为王的宵小之辈，而无论是谁都绝无能力哪怕在名义上控制它原本所有的疆土。巨人倒下，群鸦毕至，腥风血雨，骤然四起，如果我们的后代有幸记得这一切，他们会称其为黑暗时代。"
 development.30.a: "“慢慢长夜终将过去，但在此之前，先活下来”"
 development.31.t: "行政效率下降至政府形同虚设"
 development.31.d: "事态恶化了。\n\n可靠消息显示有多个地方势力正在囤积军火，我们的军队系统也难称忠诚，财政收入已经到达历年低点，目前暂不清楚这是由于经济衰退还是因为地方政府已经不愿意上交税款进入国库。统计部门无法得出任何可靠的数据，我们可以确定这是由于地方集团的极度不配合态度。尽管各地政府目前宣称效忠于我们，但这种效忠已经前所未有的可疑。各地方行政区划之间的关系正滑向互相独立，截然不同的独立王国。如果放任事态继续恶化下去，我们的政权崩溃将只是时间问题。"
 development.31.a: "“滴答、滴答、听见了吗？那是末日之钟”"
 development.32.t: "行政效率下降至低效行政"
 development.32.d: "出大乱子了。\n\n这摊烂摊子不知道因何而起，是因为我们的财政收入逐年下降，使得我们不得不减少中央军队的预算而让地方通过自己的财政组建自己的武装？是我们放弃省界之间的通盘规划而默许那些行政区划之间明争暗斗？还是因为我们撤出了基层行政机关，把那些越发严峻的烂摊子丢给其他人考虑？或者是因为其他的一些事情？\n\n都不重要了，现在我们国家机关的正常运转已经不再可能。我们现在失去了对地方机关的大多数控制权，他们现在依然效忠于我们，但这可能只是因为我们为他们提供了合法性背书，以及他们打不过我们的军队。\n\n用那些时髦的政治学者们的话——我们已经成为了一个封建国家。也许我们现在应该叫您国王陛下？"
 development.32.a: "“祖国四分五裂，我不过是一介裱糊匠”"
 development.33.t: "行政效率下降至正常运转"
 development.33.d: "这里出了些小问题，但还好。\n\n因为各种原因，我们可能需要稍微撤回一些给地方自治机构的资助，关停或者缩小一些政府直管项目，然后交给各个省份稍微更大一些的自治权……然后我们可能也要放松对金融机构的管制，减少一些对经济的投资。这么做虽然可能会对我们政府的能力稍有损害……但没关系\n\n毕竟也不是没有经济学家支持我们这样做"
 development.33.a: "“管的越少，就越好嘛”"
 development.34.t: "行政效率下降至高效行政"
 development.34.d: "我们的尝试失败了。寄希望于搭建从未有过的一套自动化体系，向现代化工厂一样处理行政事务，裁减绝大多数的冗官冗员，这恐怕还是太大胆了一些……\n\n因为掐灭我们火苗的力量太多了，无论是官僚机构的行政惯性，政府雇员的文化水平，还是官僚主义固有的缺陷，又或者是岌岌可危的国库或者咄咄逼人的外部威胁。\n\n它们可能都为我们的失败埋下了伏笔。\n\n这一切还不够完善，对不起。"
 development.34.a: "“无所谓，反正我们的国家不是还矗立着吗？”"

 development.35.t: "贫困率发展至无贫困"
 development.35.d: "我们身处一个前所未有的伟大社会，高度繁荣的经济让我们的人民享用着无穷无尽，令人眼花缭乱的各类消费品，纷繁复杂的社会保障系统如同安全网一般，把贫困和我们的人民层层隔离开来。完善的医疗，充分的教育，华美的服饰，丰富的食品，舒适的房屋，幸福的生活。一切的一切对我们来说如同水和空气，我们出生在其中，也自然的享用它到最后一刻。"
 development.35.a: "“人生而平等，故而皆有权利幸福。”"
 development.36.t: "贫困率发展至极低贫困"
 development.36.d: "完善的医疗系统，负担合理的教育，光鲜新派的服饰，产自大地各个角落的食品，窗明几净的现代建筑物——这些东西曾经只有少数人能够享受，如今却成为大多数人民只要想，努力工作就能享受的待遇。我们已经比历史上的任何一个盛世都要富足，现代生活的光辉照耀着几乎所有人……我们可以相信，明天会更好。"
 development.36.a: "“过不好是不是你没有努力？”"
 development.37.t: "贫困率发展至较低贫困"
 development.37.d: "好消息，我们基本解决了困扰这片大地百姓数千年的首要问题——吃饱穿暖，饿殍遍地的景象已经成为过去式，我们的国民不再害怕寒潮和酷暑，因为他们知道总有一个永远在等待他们的居所，冬天温暖，夏天通风。过去那些吃不饱，穿不暖的日子正被历史封存。"
 development.37.a: "“愿它永不复现。”"
 development.38.t: "贫困率发展至广泛贫困"
 development.38.d: "困扰我们的饥荒正在减少，或者说至少从一个危及生命的问题变成一种令人不适的状态，因为营养不良导致的直接死亡日趋下降，我们的人口死亡率正在稳步减少。但由于医疗资源的紧张，可靠住房和足够服装的欠缺，绝大多数人一觉醒来的第一个问题，依然是该如何保障自己的存活。"
 development.38.a: "“事已至此，先吃饭吧”"
 development.39.t: "贫困率发展至普遍贫困"
 development.39.d: "饥饿是我们土地上每个人深植于脑海中的记忆，我们消除大规模营养不良的努力取得了初步进步——当然还存在着普遍的饥饿，但鉴于饿死的人没有新出生的人多，四舍五入就是没饿死人。"
 development.39.a: "“啥？四舍五入？”"

 development.40.t: "贫困率恶化至严重贫困"
 development.40.d: "绝对贫困是指每日收入无法维持基本生存需求的状态。人类想活下来真的很简单，一个不会流失体温的住所，每天大概八千焦耳的热量摄入，没了。只要满足这两点，不需要各种文明小把戏，一个人类就能生存下去。但问题是，在我们控制区里，许多人连满足这点需求都做不到，我们的情况，往好点说是饿殍遍地，往坏一点说，那就是期货死人。做点儿什么吧，在一切太晚之前。"
 development.40.a: "“那太糟糕了。”"
 development.41.t: "贫困率恶化至普遍贫困"
 development.41.d: "我们控制区的每一个角落都被营养不良和缺乏御寒衣物导致的悲观情绪笼罩。绝大多数人只能从食物中获得勉强撑到下一天的热量，水灾，旱灾，高温天气，寒潮……哪怕最微小的自然变化都将带来巨大的死亡数字，唯一值得庆幸的是，我们总会习惯这样死去。"
 development.41.a: "“又要降温了。”"
 development.42.t: "贫困率恶化至广泛贫困"
 development.42.d: "广泛的经济问题导致绝大多数人口正在失业并返回赤贫状态，我们居民人均收入的恶化速度超出预期。他们将无法负担起足以吃饱的食物，能够御寒的服装，基本的医疗保障和用以居住的房屋，长此以往将产生诸如社会的严重不安，犯罪率的连日攀升等种种其他不良现象，我们得做点什么了。"
 development.42.a: "“令人不安。”"
 development.43.t: "贫困率恶化至较低贫困"
 development.43.d: "我们缺乏足够的岗位让每个人都享有体面的生活，周到的医疗保障，光鲜的服饰和鳞次栉比的高楼只有少数人才配拥有。不过也不用担心，吃的东西差一点就差一点，住的地方破一点就破一点，反正去哪都饿不死，不是吗？"
 development.43.a: "“日子还能过下去，对吧。”"
 development.44.t: "贫困率恶化至极低贫困"
 development.44.d: "为全国提供超大规模的社会保障这件事是个好点子，可是我们的财政部门压根负担不起，适当削减这些保障可以让我们的财政腾出手来，用在更关键的事务上。取消这些福利待遇可能会遭到阻力——但再过些日子，他们总会理解的。"
 development.44.a: "“小孩儿不喝奶不是也能茁壮成长？”"