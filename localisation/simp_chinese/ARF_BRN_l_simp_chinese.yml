 BRN_Camp_mine: "集中营矿场"
 BRN_Camp_mine_desc: "泰尔美涅茨是乌萨斯远东地区重要的矿产地，包括源石在内的多种矿物此地均有大量产出，而开采这些矿物的成本基本为零，这是因为当地同时还拥有帝国在远东最大的感染者集中营，而让感染者来挖矿，是不用像普通工人一样付工钱的。顺便一提，如果工人不幸感染了矿石病，那么他们的工钱也不用付了。"