 elec_prim_clb.1.t: "共和党全国代表大会"
 elec_prim_clb.1.d: "共和党的全国代表大会被选定在特里蒙郊外的一座大型体育场内部举办，在自由派的主要阵地举行这场大会，或多或少包含了一些共和党人对如今陷入混乱的联邦进步党的嘲讽之意。大会以数首哥伦比亚乡村音乐的串烧开场，共和党的重要人士在悠扬的乡村音乐歌声中依次入场，给在场的各州代表与观看电视转播的观众留下了深刻印象。由于并没有出现如联邦进步党那样的突发情况，共和党的竞选工作得到了良好筹备，但最终依然出现了两名争夺提名的候选人，各州代表需要在全国代表大会上做出最后抉择。\n\n首先进行发言的是国会参议员道恩·查尔斯，他作为共和党党内的灵魂人物，以一己之力在共和党的在野时期团结了大部分自由派和保守派共和党人，并且凭借在参议院的影响力，推动多项法案往共和党喜欢的方向修改。面对选民对愈演愈烈的政治暴力与备受关注的国内民权问题，道恩·查尔斯承诺他会把稳定和安全带回哥伦比亚，并且通过对话缓解不同群体之间的矛盾。查尔斯提名的副总统是雷蒙德·切尼，他在发言中补充了经济与外交的政策主张，称若二人的组合当选总统，将把经济发展的重心放在扩大自由贸易上，而这一目标与保卫自由市场的外交主张相辅相成。\n\n之后由海蒂·李进行发言，这位州长是共和党内民粹派的领导者，相比查尔斯在党内高层中的崇高声望，海蒂·李在基层党代表与选民之间更受欢迎。海蒂·李以她在索莱伊尼亚州的工作经历作为演讲的开头，她罗列了自己作为州长的一系列成就，包括大规模兴建公共工程与税法修订，并且将自己与遇刺的前总统洛泽维尔特对比，称这位前自由派总统的“新政”之所以不了了之，正是因为他没有与大型企业对抗的魄力，而只是做些发放救济的表面功夫，而自己若当选总统，将把自己在索莱伊尼亚州的经验推向全国。在发言的最后，海蒂·李请出了她的提名的副总统候选人，出身乡村的乔安娜·D·李维斯，这名年轻的联邦参议员同样是共和党民粹派的重要人士。\n\n在两位主要候选人完成发言后，一些党外名人也陆续上台发言，各自对他们支持的候选人发出声援。最终，在交响乐团令人难忘的演奏声中，在场的共和党各州代表完成了投票，确定了代表共和党参加本次总统大选的候选人是……"
 elec_prim_clb.1.a: "道恩·查尔斯！"
 elec_prim_clb.1.b: "海蒂·李！"
