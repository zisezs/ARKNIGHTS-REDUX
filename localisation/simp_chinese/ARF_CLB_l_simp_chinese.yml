#国策
 CLB_national_defense_reform_budget_formulation: "国防改革预算编制"
 CLB_national_defense_reform_budget_formulation_desc: "联邦的军队在四国战争后便鲜有大规模更新，装备老化和战术滞后已成为公开的秘密。我们需要全面评估国防体系的短板，具体来说，需要抽调军方的审计官和文职专家组成联合委员会，逐项记录各军区的人员、装备和储备状况，并形成报告提交国会审议，并据此编制联邦军队的改革预算。"
 CLB_Colombian_army_reform: "哥伦比亚陆军改革"
 CLB_Colombian_army_reform_desc: "陆军仍然是国防力量的主体，但它的组织结构仍停留在上一个时代。面对新的国际局势，我们将启动全面的陆军改组计划，目前已经有朱姆菲尔德将军与歌利森将军的两项改革方案等待选择。两位将军的方案各有倾向，只有时间和历史能证明哪一套方案更胜一筹，但我们只有一次机会。"
 CLB_Zumfelde_plan: "朱姆菲尔德方案"
 CLB_Zumfelde_plan_desc: "作为一名非传统的战地将官，文官出身的朱姆菲尔德将军提交了一份激进的重组提案：削减重型装甲部队，扩充快速反应旅，将资源集中到特种作战和空中机动上。未来的战争不再是线性的阵地对垒，而是分散的、高节奏的冲突。支持者认为它更适合哥伦比亚的海外利益保护，但反对者认为这一道路会使哥伦比亚在面临正面对抗时丧失优势。"
 CLB_asymmetric_warfare_theory: "非对称作战理论"
 CLB_asymmetric_warfare_theory_desc: "哥伦比亚军队的优势在于更先进的情报侦察和火力投送技术，这让我们在冲突中常常能掌握非对称优势，而我们正应该扩大这一优势。在保持基本对抗能力的前提下，强化技术装备的使用，利用高科技带来的侦搜、机动和火力优势，能让我们对于那些古老而传统的敌人保持持续性的压制。"
 CLB_revised_training_manual: "修订训练手册"
 CLB_revised_training_manual_desc: "基于新的作战理论，我们全面修订了陆军的训练手册。新教材删除了过时的队列礼仪和静态射击考核，增加了城市战、反伏击、敌后渗透和火力引导等科目。每一名士兵必须在模拟实战环境中通过测试才能获得战斗岗位资格。训练不再是形式，而是生存的保障。"
 CLB_empower_junior_officers: "赋权基层军官"
 CLB_empower_junior_officers_desc: "战场上，排长和连长往往比远在后方的将军更了解局势。我们改革指挥链，授予基层军官更大的临机处置权，允许他们在不违反总体意图的前提下调整战术。同时建立快速反馈机制，让前线的经验教训能够迅速转化为全军的共识。分散决策不等于失控，而是灵活。"
 CLB_small_scale_grouping: "小规模编组"
 CLB_small_scale_grouping_desc: "传统的大规模兵团不适合我们的战略需要，我们需要的是能够全域部署、快速反应的机动力量。我们将尝试把师团级单位拆分为若干个战斗营，将通信、医疗和火力支援等职能下放。这些战斗营可以独立、快速完成复杂战役任务，需要时又能迅速合成更大的战术单位。灵活编组让部队在复杂环境中更加游刃有余。"
 CLB_emphasize_special_operations: "强调特种作战"
 CLB_emphasize_special_operations_desc: "特种部队在近年来的几次行动中证明了价值。我们扩大特种作战司令部的权限，增加预算用于人员选拔和装备升级。同时建立地区性的特种作战训练中心，向常规部队传授特种侦察和目标引导技能。特种作战的理念将渗透到整个陆军的血液中，使部队化作利刃直插敌人的心脏。"
 CLB_next_generation_armor_design: "次世代装甲设计"
 CLB_next_generation_armor_design_desc: "尽管朱姆菲尔德的方案削减了重型装甲部队的数量，但保留下来的战车必须足够先进。我们启动竞标，要求军工企业提交新一代轻型坦克和轮式步兵战车的设计方案。新装甲车辆必须具备高机动性、良好的防护和信息化战场感知能力。少数精锐胜过一堆废铁。"
 CLB_arts_weapon_research: "法术武器研发"
 CLB_arts_weapon_research_desc: "源石技艺在军事领域的应用潜力巨大。我们向国防部资助的数所大学和私营实验室拨款，开发新型单兵法术武器，将哥伦比亚的科技优势转变为国防优势。"
 CLB_all_area_deployment: "全域部署"
 CLB_all_area_deployment_desc: "朱姆菲尔德预测，哥伦比亚未来将面临多方向的全面战争，这需要我们在所有可能产生威胁的方向建立军事存在。我们建立地区联合作战司令部，将各军种的指挥链路根据地区整合为不同的网络，并统筹于参谋长联席会议。各战区指挥官可以实时调动所有领域的资产，从轨道侦察到战术无人机打击无需跨兵种协调。这将意味着敌人会在每一寸空间感受到压力。"
 CLB_Gollison_plan: "歌利森方案"
 CLB_Gollison_plan_desc: "歌利森将军作为一线军官，坚持重型装甲和机械化步兵的路线。她主张保留大规模的战斗部队，并强调火力投送的重要性。歌利森认为只有压倒性的火力和装甲才能维持一线的威慑能力，在战争爆发后迅速击溃任何潜在对手，并且维持在最坏打算下的对峙空间。"
 CLB_synthetic_organization: "合成化编制"
 CLB_synthetic_organization_desc: "虽然歌利森将军是大兵团的拥护者，但她并不排斥合成化的思想。我们将旅级单位改为合成化编制，每个旅都拥有装甲部队、炮兵部队以及工程、通信等辅助部队。同时依然保留了师团一级的火炮、侦察部队，以确保战役级别的临机能力。这种编制借鉴了战后各国军队改革的经验，使部队在实战中更加灵活高效。合成化是陆军现代化的必由之路。"
 CLB_new_generation_armor_tactics: "新一代装甲战术"
 CLB_new_generation_armor_tactics_desc: "装甲兵不能只依赖蛮力。我们组织旅级以上的指挥所演习，重点演练信息化条件下的装甲突击、侧翼掩护和后撤集火。新战术强调利用无人机和雷达获取实时战场情报，引导坦克在敌人火力范围外精确射击。车组人员不仅要会开炮，还要会搞计谋。"
 CLB_new_type_officer_training: "新式军官培训"
 CLB_new_type_officer_training_desc: "传统军校的课程已经落后于时代。由于合成化改革对指挥官个人能力的要求提高，军官教育体系的改革势在必行，军校内需要增加联合指挥、战略沟通和军事伦理学等课程。学员必须完成至少一次海外部署或与盟友军队的联合演习才能毕业。"
 CLB_regular_military_exercises: "定期军事演习"
 CLB_regular_military_exercises_desc: "演习是和平时期最好的准备。我们将原先随机的军事训练改为制度化的年度大型演习，邀请盟友观察员参与。演习科目涵盖两栖登陆、空降突袭和网络防御，每次演习后出具评估报告并限期整改。通过反复的压力测试，部队的实战能力稳步提升。"
 CLB_full_mechanization: "全面机械化"
 CLB_full_mechanization_desc: "摩托化步兵已经过时。我们制定新的军队现代化计划，将现役作战旅换装为步兵战车和装甲输送车，并配套修理和补给车辆。全面机械化不仅提高战场机动性，还能为士兵提供基本的装甲防护。这是一笔巨大的投资，但也能为我们提供难以想象的战场优势。"
 CLB_expand_engineers: "扩充工程兵团"
 CLB_expand_engineers_desc: "工兵在战场上的作用常被低估。我们增加工程兵团的编制和预算，装备新型架桥车、扫雷车和快速筑路设备。同时培训工兵掌握战场评估和简易爆炸装置拆除技能。无论是进攻中的障碍破除还是防御中的工事构筑，工程兵团都是不可或缺的。"
 CLB_strategic_artillery: "战略性炮兵"
 CLB_strategic_artillery_desc: "大口径火炮、远程火箭炮乃至战术弹道导弹能够发挥战略级别的作用，它们可以打击敌指挥中枢，毁灭正在集结的部队，乃至破坏敌方战略资产。我们采购新型远程精确打击系统，提高炮兵旅的独立作战能力。配套建设前沿侦察和火力引导体系。战略炮兵的价值不在于火力密度，而在于在正确的时间击中正确的目标。"
 CLB_integrated_command_link: "集成化指挥链路"
 CLB_integrated_command_link_desc: "各军兵种之间的信息壁垒会严重挫伤作战效能。我们建立统一的战术数据链，使飞机、舰艇、坦克和单兵都能共享同一幅战场态势图。指挥链路集成的项目还包括加密通信和抗干扰设备。信息优势是现代军事优势的核心，哥伦比亚必须掌握它。"
 CLB_infantry_equipment_bidding: "步兵装备竞标"
 CLB_infantry_equipment_bidding_desc: "单兵装备的质量直接影响士兵的士气和生存率。我们启动新一轮的步枪、防弹衣和夜视仪竞标，淘汰落后型号。竞标过程透明公开，最终中标者将获得国防部的专项投资。这将是军火企业的又一次重大历史机遇。"
 CLB_military_communication_equipment: "军用通信设备"
 CLB_military_communication_equipment_desc: "战场通信不畅会导致指挥失灵和误伤。我们采购新型战术电台和通信中枢载具，确保连级单位在任何地形下都能保持联络。同时研发抗干扰和加密模块，防止敌军窃听。一套可靠的通信设备往往比一辆坦克更能改变战斗的走向。"
 CLB_private_military_company: "私营防务公司"
 CLB_private_military_company_desc: "联邦军队的精力有限，且不适宜执行某些敏感任务。我们通过立法，为私营军事和安保公司提供特许经营权，并建立相应的监管框架。这些公司可以在海外承担要员保护、设施安保和培训当地武装等任务，减轻正规部队的负担。但必须严格合同管理和行为准则，防止失控。"
 CLB_subordinate_research_institutions: "部属科研机构"
 CLB_subordinate_research_institutions_desc: "军事技术的竞争是长期竞赛，而私营企业总是不如国防部可靠。我们将安全的后方城市建立国防部直接管理的军事研究机构，将分散在各大高校和研究所的军事项目集中管理。园区内设有保密实验室、测试靶场和快速原型车间。科研人员及家属享受军人和军属待遇，成果转化周期缩短。国家意志与学术智慧的结合，将催生下一代战争机器。"
 CLB_air_cavalry: "空中骑兵师"
 CLB_air_cavalry_desc: "利用直升机进行垂直机降和火力支援的作战方式已经成熟。我们组建实验性的空中骑兵师，装备大型运输机、运输直升机和武装直升机，能够在数小时内将整旅兵力投送到泰拉任何角落。该师还配备无人机侦察连，具备察打一体能力。空中骑兵将成为快速反应部队的尖刀。"
 CLB_fight_for_freedom: "为自由而战"
 CLB_fight_for_freedom_desc: "哥伦比亚的立国之本是自由和民主。当独裁政治和恐怖主义威胁到这些价值观时，我们不能袖手旁观。第二次世界大战已经爆发，国会授权总统在必要时使用武力保护海外公民和盟友，并批准扩大征兵宣传。我们提醒每一位士兵：他们不只是在为哥伦比亚的荣誉而战，而是在为自由民主的征程而战。"
 CLB_national_volunteer_service_corps: "国民志愿服务团"
 CLB_national_volunteer_service_corps_desc: "并非所有人都会扛枪，也并非所有人都需要扛枪。我们建立国民志愿服务团，招募适龄青壮年公民在战争期间参与社区重建、灾难救援和边境巡逻，这能有效减轻战争时期联邦军队的压力。这项计划既能培养公民的责任感，也为国防系统储备了大量受过基础训练的后备人员。"
 CLB_reserve_conscription: "预备役征召"
 CLB_reserve_conscription_desc: "随着哥伦比亚加入第二次世界大战，根据《国防动员法案》，一切登记在册的预备役人员都会被征召入伍。这部分人员不仅包括现役的国民警卫队，同时包括已经退伍的老兵和适龄青年。有经验的预备役人员会直接填补前线部队的空缺，而更多的预备役人员则需要在本土接受必要的训练，组建全新的战斗部队开赴前线。"
 CLB_front_line_ice_cream: "在前线吃冰淇淋"
 CLB_front_line_ice_cream_desc: "听起来荒谬，但这并非没有可能。调查数据表明，前线部队在拥有充足食品供应时，尤其是可获取热食与冰淇淋这类零食的时候，心理状态明显改善，士气明显提高。我们需要确保后勤供应的稳定性和丰富度，并且鼓励国内食品工厂扩大生产，确保每个前线的战士们都能吃到自由民主的冰淇淋。"
 CLB_battlefield_medical_training: "战地救护训练"
 CLB_battlefield_medical_training_desc: "战场死亡案例中，大量伤员本可在得到必要的治疗后存活。因此，我们强制所有作战单位参加战地救护认证课程，内容包括止血带使用、气道管理和伤员后送程序，并且从国内征召一批有经验的医生与护士前往二线战地医院，作为必要的支援。军医的目标不是零伤亡，而是避免可以避免的伤亡"
 CLB_arsenal_of_democracy: "民主兵工厂"
 CLB_arsenal_of_democracy_desc: "哥伦比亚的工业产能是自由世界的重要支撑。通过宣传动员和提供必要的拨款和税收减免，哥伦比亚的军工企业必须在短期内将弹药、轻武器和车辆产量翻倍，以支撑第二次世界大战的庞大消耗。同时调动国家战略储备，将战略资源转化为士兵们手中的武器。生产线上流出的每一件装备，都可能决定战争的胜负。"
 CLB_Colombian_automobile_industry: "哥伦比亚汽车工业"
 CLB_Colombian_automobile_industry_desc: "哥伦比亚拥有全泰拉首屈一指的汽车制造业。随着战争爆发，我们向汽车制造商提供补贴，鼓励他们开设新的生产线用于生产军用卡车、装甲车和发动机。同时建立民用车辆征用登记制度，确保战时能够迅速征用合适的民用车辆。公路上的每一辆卡车，都是潜在的后勤血管。"
 CLB_firearms_combat_improvement: "铳械实战化改进"
 CLB_firearms_combat_improvement_desc: "联邦军队当前装备的步枪在高烈度战争中暴露了可靠性不足的问题。采购新装备已经来不及，因此我们只得启动改进计划，更换枪管钢材、改进枪机结构和增加防尘盖。同时采购新型瞄准镜和消音器，供特种部队和侦察兵试用。士兵需要一支能在沙尘、泥浆和冰雪中照样击发的枪。"
 CLB_issue_war_bonds: "发行战争债券"
 CLB_issue_war_bonds_desc: "战争需要钱，而普通公民付出能看到收益的钱比缴税更主动。财政部发行年息百分之五的战争债券，面向全社会公开销售。债券资金将专项用于军事采购和基础设施建设。同时配合宣传，让购买债券成为一种爱国象征。这不仅筹到了资金，也让整个国家的所有人都能够为战争做出贡献。"
 CLB_multinational_joint_command: "多国联合司令部"
 CLB_multinational_joint_command_desc: "四国战争的失败原因之一，便是我们与高卢盟友缺乏协同、各自为战。因此，我们提议与阵营内各国建立联合司令部，统一进行战争部署。司令部下设联合参谋团，由各国军官按比例混合编组。联合指挥不仅能提高协同效率，还能增强盟友之间的政治互信，并最终为战争胜利后的世界格局奠定基础。"
 CLB_Colombian_air_force: "哥伦比亚空军"
 CLB_Colombian_air_force_desc: "哥伦比亚是泰拉现代航空的发源地，我们是四国战争中最早应用空军的国家。随着战争形态演变，我们赋予空军更大的预算自主权和战略规划权，启动机队更新计划。未来十年，空军将确立以制空、对地支援和战略投送为核心的三大使命。如果天空一定要是谁的后院，那么只能是哥伦比亚的。"
 CLB_asymmetric_advantage: "不对称优势"
 CLB_asymmetric_advantage_desc: "哥伦比亚空军遥遥领先与泰拉各国，我们要做的是继续扩大这种领先优势。空军的任务将注重于维持绝对的制空权，并利用制空权优势发动对地打击，消灭敌方有生力量，瘫痪敌方后方设施。我们要让前线士兵不需要对天空感到恐惧，因为天上只会有我们的飞机。"
 CLB_24h_strike: "24小时打击"
 CLB_24h_strike_desc: "全球部署要求空军具备全天候快速反应能力。我们组建常备任务部队，战机挂弹待命，可在接到命令后五分钟内起飞。重点训练夜间编队、空中加油和陌生机场降落。24小时打击的概念不仅是速度，更是任何时区的投送能力。太阳永不落下，哥伦比亚的战机也永不休息。"
 CLB_penetrating_air_superiority: "穿透性制空"
 CLB_penetrating_air_superiority_desc: "为获得制空权，我们需要集中力量击破敌方空军的关键节点。这需要我们发展隐身战斗机、电子战飞机与反辐射弹药，演练超低空突防、猎杀关键目标和全频段压制。"
 CLB_strategic_bomber_research: "战略轰炸机开发"
 CLB_strategic_bomber_research_desc: "为实现战略目的，我们需要更新现有的轰炸机机队，开发新型战略轰炸机，要求打击范围能够覆盖泰拉主要区域。新轰炸机需要进一步扩大机内空间，为弹舱和油箱的扩容奠定基础，还需要装备最新型的观瞄设备，提高命中精确度。"
 CLB_strategic_deterrence: "战略威慑"
 CLB_strategic_deterrence_desc: "战略威慑意味着拥有随时摧毁敌方的战争潜力的能力，使敌方不敢对我们发动战争。为此，空军需要建立战略打击能力，包括扩大轰炸机机队，加强在其他地区的军事存在，以及掌握战略轰炸的技能。简单来说，就是空军需要拥有把炸弹丢到敌人头上的能力。"
 CLB_hellscape: "地狱景观"
 CLB_hellscape_desc: "无人机是未来战争的关键装备，已经在许多局部冲突中证明了其价值。哥伦比亚需要发挥生产力和科技优势，生产庞大数量的无人机，并且有计划地在有人机上搭载人工智能。通过无人机在数量上的压倒性优势，我们可以有效地实施战场遮断，维持制空权优势，并且将这种优势转变为敌军陆军头顶的地狱景观。"
 CLB_air_ground_integrated_coordination: "空地一体协同"
 CLB_air_ground_integrated_coordination_desc: "空军不是单打独斗的军种，再多的飞机也无法占领地面的领土。空军的主要任务是协同地面部队的作战，配合整体战役目标，解决空中和地面的敌军威胁，帮助陆军拔除进军路上的钉子，让地面上的兄弟姐妹们畅通无阻地抵达目的地。"
 CLB_ground_support_training: "对地支援训练"
 CLB_ground_support_training_desc: "飞行员需要理解地面部队的呼唤，迅速应对变化的敌情。我们要求所有攻击机飞行员完成地面引导员课程，并派往陆军部队交流。地面部队则要学习如何正确标记目标和传递坐标。对地支援不是按按钮，而是需要血肉之躯的勇气和精准。"
 CLB_new_attack_aircraft_airframe: "新型攻击机机体"
 CLB_new_attack_aircraft_airframe_desc: "攻击机是专精于对地精确打击的机型，我们启动下一代攻击机项目，要求机体具备低空低速性能、良好装甲和强大的火力挂载。与战斗机不同，攻击机不需要速度，但需要续航和生存力。新机体将采用更先进材料减轻重量，同时保留关键部位的装甲保护。"
 CLB_Air_Force_Forward_Air_Controller_Training: "空军引导员培训"
 CLB_Air_Force_Forward_Air_Controller_Training_desc: "空军并不是每个人都在天上飞，向前线派遣空军引导员，是提高空地协同效率的关键。我们设立专门课程，从陆军部队中抽调人员，接受空地协同的战术训练和必要课程。引导员编入陆军战斗序列，配备便携式数据终端，作为空军和陆军之间的沟通桥梁，可以直接呼叫火力支援。"
 CLB_eagle_wall: "“鹰墙”"
 CLB_eagle_wall_desc: "强调空地一体协同并非放弃制空权，通过集中优势兵力，我们依然能够获得战场内绝对制空权。以制空战斗机为核心，构建预警机、对地攻击机和制空战斗机一体多层次的战役级编组模式，进行持续的空中压制作战，能够确保敌军的飞机和防空导弹不会有任何开火机会。"
 CLB_all_weather_operations: "全天候作战"
 CLB_all_weather_operations_desc: "泰拉的气候复杂多变，雨天、雪天和沙尘暴都会限制空军行动，但这不是阻止我们的空军出动的理由。我们研发全天候导航和瞄准系统，并加强夜间起降训练。要求所有战斗部队具备在恶劣天气下执行任务的能力，同时储备足够的备用零件应对高损耗。敌人不应指望坏天气保护他们。"
 CLB_advanced_airframe_research: "先进机体研发"
 CLB_advanced_airframe_research_desc: "联邦空军现役的主要战机皆为四国战争末期机型的衍生款，已经不再适用于当下的战争需求。我们启动先进机体研发计划，对新一代多用途飞机进行招标，并探索复合材料、矢量发动机、新型航电等前沿技术。该计划旨在研发一款能够快速列装以更新机队的机型，需要兼顾新技术与可靠性。"
 CLB_aviation_academy: "哥伦比亚航空兵学院"
 CLB_aviation_academy_desc: "飞行员是空军的灵魂。我们在南部沙漠建立新的航空兵学院，装备模拟器和教练机，并返聘退役飞行员作为教官。学员将学习基础飞行、战术编队和电子对抗，并到一线部队实习。学院的毕业生将成为未来二十年空军的骨干。"
 CLB_west_Terra_air_defense_command: "西泰拉防空司令部"
 CLB_west_Terra_air_defense_command_desc: "防空需要统一指挥。我们联合阿卡迪亚等友好国家，建立西泰拉防空司令部，整合所有雷达站、防空导弹部队和拦截机联队。司令部与民航管制中心联网，能够快速识别敌友。一旦发生冲突，这个司令部将成为防空作战的中枢神经。"
 CLB_add_military_airports: "增设军用机场"
 CLB_add_military_airports_desc: "分散部署可以提高生存能力。我们在全国范围内选址，建设能够覆盖全域的备用军用机场，配套油库、弹药库和简易机库。这些机场平时只保留维护人员，战时可以快速启用。同时推进国会立法，战争爆发时允许我们征用民用机场和高速公路。"
 CLB_promote_ace_pilots: "宣传王牌飞行员"
 CLB_promote_ace_pilots_desc: "英雄是军队的品牌。我们挑选几名战绩突出的飞行员，通过媒体宣传他们的故事，并发行主题邮票和纪念品。这不仅能鼓舞内部士气，还能吸引年轻人报考飞行学校。一个王牌飞行员的影响力，有时胜过一支航空大队。"
 CLB_democratic_airlift: "民主空运"
 CLB_democratic_airlift_desc: "战略空运能力是哥伦比亚全球影响力的支柱。我们扩充运输机队，并建立空降师。在任何地区发生人道主义危机或盟友请求支援时，我们承诺第一时间投送首批部队和装备。民主空运不是空洞的口号，而是济世的能力。"
 CLB_next_generation_fighter_program: "次世代战机计划"
 CLB_next_generation_fighter_program_desc: "我们启动新一代战斗机的概念设计，具备隐身、超视距打击、电磁干扰战能力等科幻小说一般的能力，其设计指标要求一架战机击败敌军半个联队。这款战斗机将成为未来空战的定义者。"
 CLB_Advanced_Munitions_Research_and_Development: "先进弹药研发"
 CLB_Advanced_Munitions_Research_and_Development_desc: "先进的弹药改变了战争的形态。我们加大对钻地弹、巡航导弹和新一代航空炸弹的研发投入，同时降低成本，使精确打击不再奢侈。弹药虽小，却可以决定战略胜负。人命关天，但子弹价廉。"
 CLB_Our_Stage_on_Terra: "我们在泰拉的舞台"
 CLB_Our_Stage_on_Terra_desc: "哥伦比亚自诞生之日起便浸染在两种争议之中。是成为称霸西半泰拉的绝对强权，还是承担起我们作为民主灯塔的天命？全球舞台已经铺开，哥伦比亚已经准备好表演。"
 CLB_Bolivar_Dispute: "玻利瓦尔纷争"
 CLB_Bolivar_Dispute_desc: "玻利瓦尔的内战已经延宕数十年，联邦军队对该国内战的直接干预已经被历史证明是一场巨大的失败，因此我们将重心转向支持玻利瓦尔的亲哥伦比亚势力。玻利瓦尔联合政府已经在内战的对峙中证明了其价值，我们需要进一步加大对联合政府的支持，以确保其在内战烈度重新上升时，拥有保护哥伦比亚利益的能力。"
 CLB_Provide_Intelligence_Support: "提供情报支持"
 CLB_Provide_Intelligence_Support_desc: "玻利瓦尔联合政府的军队战斗力与内战中的其他势力差别不大，但我们可以通过增强其情报能力使其获得战术优势。我们的特工将会加强对玻利瓦尔王国和真正玻利瓦尔人党的渗透，并且与联合政府共享情报，使其掌握战场主导。我们还将提供一系列先进的侦察和通讯装备，进一步增强其战场感知能力。"
 CLB_Expand_Military_Presence: "扩大军事存在"
 CLB_Expand_Military_Presence_desc: "虽然联邦军队曾在玻利瓦尔折戟沉沙，但维持在当地的军事存在是很有必要的。随着玻利瓦尔局势愈发动荡，联合政府请求我方增加驻军，以维持秩序。理论上，联邦军队不需要参与前线的战斗，只需维持几大关键枢纽城市的治安秩序，让我们的盟友能够腾出手来应对敌军威胁。当然，并没有哪个条款明确规定我们不能部署在前线。"
 CLB_Approve_Expanded_Air_Strikes: "批准扩大空袭"
 CLB_Approve_Expanded_Air_Strikes_desc: "空袭对于破坏敌军后勤、杀伤有生力量的效果绝佳，并且危险系数远低于将地面部队投送到一线进行厮杀。哥伦比亚空军已经被授权扩大对玻利瓦尔王国武装力量和真正玻利瓦尔人党的空袭行动，以进一步扩大联合政府在战场上的优势。"
 CLB_Wait_for_the_Dice_to_Fall: "等待骰子落下……"
 CLB_Wait_for_the_Dice_to_Fall_desc: "玻利瓦尔内战的战火已经重燃，而这一次很有可能是最后一次。我们已经完成了对玻利瓦尔联合政府的投资，现在只能静待他们兑现自己的价值。当然，我们可以亲自下场操盘，但必须承认，决定结果的筹码并不在我们手上。"
 CLB_Maintain_Existing_Borders: "维持现有边界"
 CLB_Maintain_Existing_Borders_desc: "随着玻利瓦尔内战的结束，我们支持的那一方在战争中落败，我们只得与新的玻利瓦尔政府划定边界。根据谈判结果，两国维持现有边界不变。这无疑是我们玻利瓦尔外交政策的又一次失败。"
 CLB_Agreement_with_Local_Forces: "与本土势力的协议"
 CLB_Agreement_with_Local_Forces_desc: "随着联合政府在内战中胜出，我们决定与其商议领土重划事宜。玻利瓦尔东部许多城市实质上已被我国代管多年，在确保其自治权和关税特殊地位等权利的基础上，玻利瓦尔新政府同意将其割让给我国，具体交接事宜将在后续会议中确定。"
 CLB_Commitment_to_Continue_Supporting_Enterprises: "承诺继续支持企业"
 CLB_Commitment_to_Continue_Supporting_Enterprises_desc: "我们的企业在玻利瓦尔有大量的重要资产和商业利益，几大寡头已经实际上掌握了玻利瓦尔联合政府的权力。我们将重申对这些企业的支持，压制联合政府内的本土派，并寻求将玻利瓦尔东部地区完全整合至我国领土内。"
 CLB_Reaffirm_Narroism: "重申纳罗主义"
 CLB_Reaffirm_Narroism_desc: "泰拉西陆是西陆人的西陆。这是纳罗总统在他还是国务卿时就提出的关键论断。对于国内的孤立主义者和保守派而言，重申纳罗主义不仅意味着我们将会减少对那些“不重要”地区的浪费，更意味着哥伦比亚将在她熟悉的土地上建立起牢不可破的秩序。"
 CLB_Colombias_Backyard: "哥伦比娅的后花园"
 CLB_Colombias_Backyard_desc: "西陆北部诸国都是前伊比利亚的殖民地，随着伊比利亚帝国的衰退，这些国家纷纷独立，并且仿效我国建立起了民主共和的体制。这些国家拥有丰富的自然资源，并且市场潜力巨大，如果开发得当，我们和他们都能从中收获巨额利益。"
 CLB_Support_Moratak_Military: "支持莫拉达克军方"
 CLB_Support_Moratak_Military_desc: "虽然莫拉达克的军方不是什么民主主义者，但他们坚定地站在我们的利益一边。当莫拉达克政治陷入混乱时，我们可以选择支持莫拉达克的军方进行强力镇压，恢复秩序，以确保我国在莫拉达克的经济利益不受暴民和民粹主义政客破坏。"
 CLB_Democratic_Consensus_with_Moratak: "与莫拉达克的民主共识"
 CLB_Democratic_Consensus_with_Moratak_desc: "我们坚信民主国家之间能够达成共识。我们将公开支持莫拉达克的民选政府，推动其国内局势走向缓和，以此达成双方的政治互信，从而为后续开展更深层次的经济合作奠定良好基础。"
 CLB_Eradicate_Quechua_Extremism: "清除克丘亚极端主义"
 CLB_Eradicate_Quechua_Extremism_desc: "克丘亚政府持续鼓吹极端民族主义和复仇主义思想，并且支持武装分子在西陆各地袭击哥伦比亚公民。我们需要对其采取迅速且强烈的军事行动，彻底清除这一西陆的不稳定因素。"
 CLB_Beware_of_Wyvern_Anti_Colombian_Sentiment: "警惕瓦伊凡反哥伦比亚思潮"
 CLB_Beware_of_Wyvern_Anti_Colombian_Sentiment_desc: "反对我国的民族主义思潮已经在瓦伊凡蔓延，许多瓦伊凡政客公然鼓吹这一立场，甚至一些我国的瓦伊凡移民也受到影响。我们需要公开回击这一思潮，支持瓦伊凡国内的温和派，并且在必要时对一部分瓦伊凡政客进行制裁。"
 CLB_Westland_Economic_Community: "西陆经济共同体"
 CLB_Westland_Economic_Community_desc: "我们倡议建立西陆经济共同体，成员间逐步减免关税、消除贸易壁垒，并促进多个领域贸易的自由化。共同市场将增强区域内国家的经济活力和经济韧性，当然，还可以让我们的跨国企业收益颇丰。"
 CLB_Status_of_Dosores: "多索雷斯的地位"
 CLB_Status_of_Dosores_desc: "多索雷斯作为玻利瓦尔的自治城市，其在地区内长期保持特殊地位。随着玻利瓦尔内战结束，多索雷斯的地位需要得到最终确定。无论是成为独立的自由城邦，还是并入玻利瓦尔或我国，谈判过程我国必须全程参与。"
 CLB_Sargon_Adventure: "萨尔贡冒险"
 CLB_Sargon_Adventure_desc: "萨尔贡帝国已垂垂老矣，其看似体量庞大，实则脆弱不堪。由于海嗣威胁和内部动荡，中陆各国对这片土地都望尘莫及，而这对我们意味着一场收益极大的冒险。如果这场冒险成功，哥伦比亚将独占这一片广袤土地上的利益。"
 CLB_Support_Minos_Demands: "支持米诺斯诉求"
 CLB_Support_Minos_Demands_desc: "自从米诺斯从萨尔贡治下独立，我国就与其保持了良好的关系。在米诺斯利益相关方的游说下，我们决定公开支持米诺斯对安纳托利亚王酋领地的领土诉求，并且向米诺斯提供必要的经济和军事援助。"
 CLB_Disrupt_Anatolia_Order: "破坏安纳托利亚秩序"
 CLB_Disrupt_Anatolia_Order_desc: "随着米诺斯与安纳托利亚之间矛盾的激化，对安纳托利亚王酋领的渗透时机已经成熟。通过秘密渠道资助反对派媒体和公民组织，渗透其经济领域，制造内部矛盾，我们可以在冲突爆发之前尽可能地削弱其战争潜力。"
 CLB_Agamen_and_New_Agamen: "阿加门与新阿加门"
 CLB_Agamen_and_New_Agamen_desc: "米诺斯人在古代建立起了伟大的阿加门帝国，而哥伦比亚联邦忠实地继承了古阿加门人的精神。随着我们帮助米诺斯完成了对萨尔贡的复仇，两个阿加门帝国建立起了牢不可破的友谊。米诺斯将筹备加入我们的阵营，并签署一系列合作条约，为表达我们的支持，我们也将积极斡旋将运河领治下的马克西米连波利斯归还米诺斯的事宜。"
 CLB_Ensure_Loyalty_of_Canal_Zone_Representatives: "确保运河领代表忠诚"
 CLB_Ensure_Loyalty_of_Canal_Zone_Representatives_desc: "萨尔贡运河领是伊比利亚人退出后，几大列强为维持对萨尔贡运河控制所建立的国际托管领地。各国在运河委员会内部均有代表，但多数国家仅仅将其视为一种名誉头衔。但萨尔贡关乎我国核心利益，我们需要扩大运河委员会内哥伦比亚代表的数量，并且积极获得其他国家代表支持，确保运河领忠于我国，至少忠于我国的利益。"
 CLB_Desert_Storm: "沙漠风暴"
 CLB_Desert_Storm_desc: "萨尔贡中西部地区是一片广袤的沙漠，但沙漠之下蕴藏着丰富的源石矿藏和其他自然资源。我们将筹备成立哥伦比亚南方战区司令部，准备对当地进行必要的军事干预，以维护我国的经济利益。"
 CLB_Tswana_War: "茨瓦纳战争"
 CLB_Tswana_War_desc: "茨瓦纳共和国是我国支持建立的民主政权，是萨尔贡地区的民主样板。茨瓦纳共和国与前母国，萨尔贡的穆塔帕王酋领，长期存在领土争端。我们支持茨瓦纳发动先发制人打击，尝试推翻穆塔帕王酋领的统治，将民主自由播撒至萨尔贡的心脏地区。"
 CLB_Sunk_Cost: "沉没成本"
 CLB_Sunk_Cost_desc: "茨瓦纳战争的泥潭远比我们想象中要深。但我们不能抛弃我们的盟友，并且我们在战场上仍然占据相对优势，这使得即使开启停火谈判，我们也能获取更多利益。因此我们需要加大对这场战争的投入，维持现有优势，寻找机会打破僵局。"
 CLB_Exploit_Victory: "乘胜追击"
 CLB_Exploit_Victory_desc: "穆塔帕王酋领在多国部队的打击下不堪一击，整个萨尔贡北部地区都已被我们解放，萨尔贡帝国内部因此陷入严重混乱，许多王酋领已经公然违抗帝国中央的统治，反抗组织也开始出现。我们应当乘胜追击，开展多线攻势，将萨尔贡帝国彻底变为一个历史名词。"
 CLB_Ruin_of_Shal_Agad: "沙尔-阿加德之隳"
 CLB_Ruin_of_Shal_Agad_desc: "庞大而孱弱的萨尔贡帝国已经轰然倒塌，那座伟大的黄金之城现在已经落入我们手中。我们将在沙尔-阿加德举行盛大的阅兵仪式，并且与当地自由派展开合作，在这座古老帝国的废墟上建立起一个新的民主自由的政府。"
 CLB_Sawudi_Criterion_Source_Stone_Company: "砂乌第-准则源石公司"
 CLB_Sawudi_Criterion_Source_Stone_Company_desc: "砂乌第王酋与我国具有良好的合作经历，其希望与我国准则源石公司签订协议，联合成立砂乌第-准则源石公司，垄断当地的源石开采与提炼，并且促进当地的工业化发展。"
 CLB_Deep_into_Akahura: "深入阿卡胡拉"
 CLB_Deep_into_Akahura_desc: "阿卡胡拉是一片神秘的土地，据悉，他们仍然保持着部落政治的社会形态。我们将派遣勘探队穿越沙漠、草原和雨林，联系当地部落，建立贸易站和矿业、林业据点，以达成对萨尔贡最西端地区的控制。"
 CLB_Take_Over_Iberian_Sphere_of_Influence: "接管伊比利亚势力范围"
 CLB_Take_Over_Iberian_Sphere_of_Influence_desc: "伊比利亚在大静谧后便国力衰退，其海外势力范围大幅收缩。而如今伊比利亚又面临新的内战风险，我们可顺势接管其海洋岛屿，并对阿台墨兹王国提供军事保护，填补权力真空。"
 CLB_Intervene_in_Iberian_Situation: "介入伊比利亚局势"
 CLB_Intervene_in_Iberian_Situation_desc: "伊比利亚虽然是一个已经衰落的帝国，但其仍然保有了充足的战争潜力和许多失落科技。我们有必要在伊比利亚内战中支持伊比利亚的民主主义者，推动一个自由、开放的伊比利亚政府出现，这将使我们的势力范围深入中陆南方，使我们在与莱塔尼亚的博弈中获得优势。"
 CLB_Expand_External_Intelligence_Department: "扩张对外情报部门"
 CLB_Expand_External_Intelligence_Department_desc: "由于工作重心转向外部，哥伦比亚情报部门将获得更多预算和人手，扩张全球情报网。重点招募技术人才和语言专家，并加强与各国商业公司、学术机构的合作。情报是看不见的战线。"
 CLB_D_Combat_Detachment: "“D”作战分遣队"
 CLB_D_Combat_Detachment_desc: "为维护我们的海外利益，我们将建立一支代号“D”的特种作战分遣队，专门执行高风险的特战任务。成员从现有的特种部队中选拔，进行更严苛的训练。这支部队直接归属特种作战司令部指挥，其任务是快速反应、全球投送，在敌国深处执行特战任务。"
 CLB_AI_Assisted_Intelligence_Analysis: "AI辅助情报分析"
 CLB_AI_Assisted_Intelligence_Analysis_desc: "海量的情报数据让人工分析不堪重负。我们引入人工智能算法，处理通信截获和社交媒体数据，自动识别异常模式和潜在威胁，并且针对性加强监控。"
 CLB_Freedom_Lighthouse: "自由灯塔"
 CLB_Freedom_Lighthouse_desc: "在我们自己的叙事中，哥伦比亚是泰拉第一个自由民主的政权，而传播自由和民主也是哥伦比亚的责任。进步主义者和自由主义者都对海外干涉抱有极高的热忱，尤其是对于四国战争后建立起的国际秩序，他们认为哥伦比亚有责任去拆毁这一腐朽不堪的旧秩序。"
 CLB_Dismantle_Midland_Fortress: "拆解中陆堡垒"
 CLB_Dismantle_Midland_Fortress_desc: "莱塔尼亚是泰拉中陆的霸主，但她不可能是永远的霸主。莱塔尼亚利用君主制纽带和经济军事捆绑，将其与周边许多邻国绑定，构筑了一座坚固的“中陆堡垒”。但大地上不存在密不透风的堡垒，我们要做的是逐步将其渗透、拆解。"
 CLB_Counter_Ursus_Threat: "对抗乌萨斯威胁"
 CLB_Counter_Ursus_Threat_desc: "乌萨斯军国主义对我国北方安全产生了直接威胁。我们需要加大在泰拉北部的军事存在，并且联络一切可能的盟友，目的是构筑起一个对乌萨斯的包围网。"
 CLB_Pannonia_Gamble: "潘诺尼亚豪赌"
 CLB_Pannonia_Gamble_desc: "潘诺尼亚是莱塔尼亚的传统势力范围，与其说是莱塔尼亚的盟友，不如说是莱塔尼亚的傀儡。也正因如此，潘诺尼亚内部长期存在反对莱塔尼亚势力的政治派系。在条件允许时，我们的情报部门可以支持当地反对派发动政变，一旦成功，哥伦比亚将获得一个忠诚的盟友。但失败也将使我们与莱塔尼亚的关系变得无可挽回。"
 CLB_Survey_Iberian_Coast: "勘测伊比利亚海岸"
 CLB_Survey_Iberian_Coast_desc: "大静谧已经过去数十年，观测到的海嗣数量逐年下降，海洋专家认定，通航伊比利亚的条件理论上已经具备。因此我们将派遣科考船对伊比利亚海岸进行勘察，获取水文数据，并重新与伊比利亚政府开展接触，进行民事渗透。"
 CLB_Focus_on_Poliernia_Region: "专注波利尔尼亚地区"
 CLB_Focus_on_Poliernia_Region_desc: "相比于已经被大静谧与独裁统治燃烧殆尽的伊比利亚，临近的波利尔尼亚地区更有开发价值。无论是自由高卢抵抗组织，还是当地的温和社会主义者，都和我们没有直接的地缘冲突，与他们合作开发当地资源是更加可行的选项。"
 CLB_Aid_Obrenoviche: "援助奥布雷诺威切"
 CLB_Aid_Obrenoviche_desc: "奥布雷诺威切是中陆地区主要的反莱塔尼亚力量，但其与周边多国均存在领土争端和边境摩擦。我们将主动与其接触，以民主化和提供经济利益作为条件，向他们提供包括先进装备、军工产线和军事顾问在内的一系列军事援助。"
 CLB_Syracuse_Family_Ties: "叙拉古家族纽带"
 CLB_Syracuse_Family_Ties_desc: "在哥伦比亚历史上，来自叙拉古的家族在灰色地带扮演了重要角色。虽然这些人很多都是被我们处理过的犯罪分子，但也有不少人在金盆洗手后成为了各州重要的政治家族。我们可以利用他们与叙拉古母国的关系，培植叙拉古的亲哥伦比亚力量。"
 CLB_Colombia_RIM_Billiton_Cross_Continental_Partnership: "哥伦比亚-雷姆必拓跨大陆伙伴关系"
 CLB_Colombia_RIM_Billiton_Cross_Continental_Partnership_desc: "雷姆必拓是远在泰拉大陆东端的民主政权，我们两国都有着反抗维多利亚殖民统治的共同历史记忆。在泰拉大陆局势日益动荡的背景下，加强两国在经济、社会和军事领域的深度合作非常有必要。"
 CLB_Demand_Kalalit_Assume_Obligations: "要求阿卡迪亚承担义务"
 CLB_Demand_Kalalit_Assume_Obligations_desc: "阿卡迪亚是我们的姊妹共和国，长期享受哥伦比亚的安全保护。由于其处于面对乌萨斯的第一线，我们要求其承担更多义务，包括提供军事基地和扩编其本国军队。"
 CLB_Hermit_of_the_Snowfield: "雪原的隐者"
 CLB_Hermit_of_the_Snowfield_desc: "萨米是一个神秘的地区，甚至难以被称为国家，但他们在数次抗击乌萨斯侵略的战争中都获得了胜利。通过派遣科考队和贸易团体前往萨米，我们能够促进萨米的现代化和民主化，从而在极北获得对抗乌萨斯帝国的重要盟友。"
 CLB_Knight_on_the_Frontline_of_Tyranny: "暴政前线的骑士"
 CLB_Knight_on_the_Frontline_of_Tyranny_desc: "卡西米尔历史上与乌萨斯冲突不断，其仍有广袤领土被乌萨斯占领。这些身处对抗乌萨斯暴政第一线的骑士是我们的重要盟友。我们将派遣军事顾问，并商谈军售合同，协助卡西米尔军队完成现代化改革。"
 CLB_Our_Interests_in_the_Commercial_Enclave: "我们在商业飞地的利益"
 CLB_Our_Interests_in_the_Commercial_Enclave_desc: "我们在萨米地区拥有一块直属联邦政府的商贸飞地，主要作为北方的贸易中转站和海洋开发中心。这块飞地值得进行更多的投资，通过在此地建设军事基地和军用机场，我们可以获得对抗乌萨斯的后方基地。"
 CLB_Contact_Eastern_Dalia_Warlords: "联络东达利亚军阀"
 CLB_Contact_Eastern_Dalia_Warlords_desc: "乌萨斯的东达利亚地区军阀割据，据悉，其中不少军阀持民主主义思想，更有一些本人即为乌萨斯流亡的民主派。我们可以与这些军阀建立联络，帮助其武装，支持其对抗乌萨斯帝国政府，换取一部分在当地的经济利益。"
 CLB_Ursus_Democracy_Dawn: "乌萨斯民主破晓"
 CLB_Ursus_Democracy_Dawn_desc: "乌萨斯民主主义者在乌萨斯的内战中胜出，我们将与这个新生的民主乌萨斯建立友好的合作关系，并吸纳其加入自由大陆公约组织。浴火重生的乌萨斯将成为民主自由的另一大火炬手。"
 CLB_Dismember_the_Behemoth: "肢解巨兽"
 CLB_Dismember_the_Behemoth_desc: "乌萨斯陷入内战，而内战双方都不是我们理想的合作者，甚至其中一方有可能比乌萨斯帝国还更难沟通。我们有必要借此机会支持乌萨斯国内的分离主义力量，例如哥萨茨、白乌萨尼亚等，尽可能肢解这一庞大的帝国，使其无法再产生威胁。"
 CLB_Victoria_Collapse: "维多利亚崩塌"
 CLB_Victoria_Collapse_desc: "维多利亚帝国在卡兹戴尔干涉和内战中分崩离析，这将成为哥伦比亚的重大历史机遇。我们将拆解这一庞大帝国，在中陆地区打开一个干涉切口。并且维多利亚遍布这片大地的殖民地也将为我们所用。"
 CLB_Reaffirm_Support_for_Mayor_of_Siesta: "重申对汐斯塔市长的支持"
 CLB_Reaffirm_Support_for_Mayor_of_Siesta_desc: "汐斯塔市长赫尔曼·道尔科斯在维多利亚内战后面临外部贸易关系阻断和内部权力斗争危机。我们重申对道尔科斯家族的支持，并提供低息贷款用于火山喷发后的重建工作。同时推动哥伦比亚企业参与当地基建项目。友谊需要定期维护。"
 CLB_Take_Over_Sargon_Dam: "接管萨尔贡大坝"
 CLB_Take_Over_Sargon_Dam_desc: "伊比利亚利用阿戈尔技术建造的萨尔贡大坝开启了西陆殖民狂潮，而在其衰落后，大坝被维多利亚接管。如今维多利亚也陷入混乱，而莱塔尼亚等国无法将力量投射至此，这座大坝将是哥伦比亚的囊中之物。"
 CLB_Contact_Gaul_Restorationists: "联络高卢复国者"
 CLB_Contact_Gaul_Restorationists_desc: "高卢抵抗组织在长期蛰伏后，已趁维多利亚动荡之机重新活跃，我们将与他们建立联系，提供培训和资金。高卢在四国战争时是哥伦比亚坚定的盟友，我们绝不能再一次抛弃盟友。并且支持高卢复国，将对维多利亚的统治造成重大打击。"
 CLB_Gaul_Exiles_Return_Home: "高卢遗民返乡"
 CLB_Gaul_Exiles_Return_Home_desc: "我们鼓励我国境内的高卢遗民返回故土，加入高卢抵抗组织，为抵抗组织提供资金和技术援助，并且成为我国与高卢之间沟通的代言人。"
 CLB_Deploy_Agents_to_Infiltrate: "派遣特工渗透"
 CLB_Deploy_Agents_to_Infiltrate_desc: "通过派遣特工对诺曼底公爵领和其他维多利亚占高卢地区进行渗透，我们可以有效支持我们高卢盟友的行动，加快维多利亚帝国的崩塌。"
 CLB_Gaul_Lend_Lease_Act: "《高卢租借法案》"
 CLB_Gaul_Lend_Lease_Act_desc: "国会已通过一项特别法案，授权向高卢复国者提供旧型号的武器和弹药，用以支持他们的复国战争。这项法案相比起常规的军购合同，基本等同于无偿的军事援助。"
 CLB_Utilize_Kazimierz_Corridor: "利用卡西米尔通道"
 CLB_Utilize_Kazimierz_Corridor_desc: "卡西米尔走廊是连接东西的陆上通道。我们将利用我们与卡西米尔的政治联系，通过卡西米尔境内对高卢和维多利亚其他地区开展渗透、输送物资，支援盟友的军事行动。"
 CLB_Divergent_Paths: "殊途"
 CLB_Divergent_Paths_desc: "尽管我们倾尽全力支持了高卢复国运动，然而这些忘恩负义的家伙背叛了我们。他们在复国成功后拒绝与我们开展进一步的合作，甚至驱逐了我们的顾问。在新的一轮大战中，哥伦比亚和高卢将不再是一个阵营的伙伴。"
 CLB_Counter_Leithania_Influence: "应对莱塔尼亚影响"
 CLB_Counter_Leithania_Influence_desc: "莱塔尼亚也在资助高卢抵抗组织，并且支持其中的保皇派力量。我们需要应对莱塔尼亚对高卢的影响，削弱亲莱塔尼亚派系的力量，以维系我们与高卢抵抗组织的合作关系，避免其完全倒向莱塔尼亚。"
 CLB_Beware_of_Gaul_Radicalization: "警惕高卢激进化"
 CLB_Beware_of_Gaul_Radicalization_desc: "高卢复国主义者中不乏共产党人或极端民族主义者，完全可以预见，这些激进派不可能和我们达成良好的合作。但这些人在高卢抵抗组织内的影响力正在逐渐扩大，我们必须打压这种激进化倾向，避免出现一个共产主义的高卢或失去理智的高卢。"
 CLB_Sixty_Year_Bond: "六十载羁绊"
 CLB_Sixty_Year_Bond_desc: "四国战争已经过去六十年，但哥伦比亚与高卢的战友情谊未曾减弱半分。随着高卢重新屹立于泰拉大地之上，哥伦比亚与高卢签定下一系列友好合作协议。新的战争在所难免，而高卢将是我们坚定不移的盟友。"
 CLB_Search_for_Potential_Allies: "寻找潜在盟友"
 CLB_Search_for_Potential_Allies_desc: "我们不能放着维多利亚陷入混乱不管。如果有机会，我们应该在维多利亚建立起一个友好政权，或是支持维多利亚国内的分离主义者，分裂维多利亚帝国。这意味着我们需要在维多利亚内战的各方中寻找值得合作的潜在盟友。"
 CLB_Tara_Republicans: "塔拉共和派"
 CLB_Tara_Republicans_desc: "塔拉独立运动的主力，“深池”之中，共和派是不容小觑的派系，但相比于深池内的保皇派和威灵顿公爵的力量仍然相对弱小。我们可以与这些共和派建立联系，为其提供特战训练、武器装备等，增强其实力，同时也是强化我们对其的影响力。"
 CLB_Tara_Smuggling_Channels: "塔拉裔走私渠道"
 CLB_Tara_Smuggling_Channels_desc: "哥伦比亚国内有许多塔拉裔移民，这些人依然对维多利亚的统治抱有深切的仇恨。我们可以利用他们与本土塔拉人之间的走私渠道，向塔拉走私军火、粮食等重要物资。这些热爱母国的塔拉人必然会支持我们的行动。"
 CLB_Gaeland_Independence_Movement: "盖尔兰独立运动"
 CLB_Gaeland_Independence_Movement_desc: "盖尔兰在历史上较早成为维多利亚帝国的一部分，其独立运动一直不温不火，但潜力巨大。我们将对其提供资金援助，并开展媒体攻势，增强独立运动的声量。一个独立的盖尔兰将使得维多利亚帝国元气大伤，将其变成微不足道的盎格兰小王国。"
 CLB_Convoy_Across_the_Wasteland: "跨越荒原的运输队"
 CLB_Convoy_Across_the_Wasteland_desc: "我们将组织大型运输队，从哥伦比亚出发，穿越无人荒漠，将武器和物资运抵盖尔兰势力控制区。车队配备装甲车辆和防空武器，并雇佣天灾信使向导，确保运输过程安全高效。"
 CLB_Create_Fait_Accompli: "制造既定事实"
 CLB_Create_Fait_Accompli_desc: "我们支持的维多利亚分离主义势力已经拥有了足够的力量，现在我们需要他们将维多利亚的分裂变成不可改变的事实。我们支持其筹建临时政府，提供外交声援和媒体宣传，将这一地区的独立确定下来。"
 CLB_Show_Consideration_for_Old_Ties: "顾念旧情"
 CLB_Show_Consideration_for_Old_Ties_desc: "虽然我们协助高卢复国，支持塔拉和盖尔兰的分离主义者，但维多利亚在历史上仍是我们的文化母国，许多哥伦比亚人对维多利亚依然有复杂的情感。地缘政治上，与维多利亚完全敌对也是不明智的选项。因此，我们寻求与维多利亚政府修复关系，与新的维多利亚政府建立同盟。"
 CLB_Tear_Off_the_Mask: "撕破假面"
 CLB_Tear_Off_the_Mask_desc: "外交伪装已经失去意义，我们与维多利亚的关系完全破裂、不可挽回。因此我们也无需维持表面上的体面，我们将公开宣称对维多利亚与莱塔尼亚政权的敌视态度，并且加强对维多利亚一线的军事部署。"
 CLB_Queen_s_Gambit: "后翼弃兵"
 CLB_Queen_s_Gambit_desc: "高卢与维多利亚之间的深层矛盾尚未得到解决，两国必然在未来爆发下一场战争。而我国无论选择支持哪一方，卷入这场战争都不可避免。我们必须在二者之间作出抉择，并且直面在这之后与莱塔尼亚的全面冲突。我们已经陷入后翼弃兵的局面，必须选择一方进行牺牲，当然，最好不需要做这种选择。"

