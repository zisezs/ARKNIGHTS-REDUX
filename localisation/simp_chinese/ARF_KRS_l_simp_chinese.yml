 KRS_conservatism_party: "克拉斯尼亚尔贵族领（改革派）"
 KRS_despotism_party: "克拉斯尼亚尔贵族领（保守派）"

#国家领袖
 KRS_Mikhail_Pavel: "米哈伊尔·帕维尔"
 KRS_Mikhail_Pavel_desc: "最开始，帕维尔子爵以为这不过是一次平常的出向任务：领取俸禄，镇压叛乱，获取利益，回到首都。然而，他大错特错了。他自诩带来了更先进的管理经验，自认能够为帝国打造一个全新的制造业基地，让自己的名字闪耀在史书当中。可乌萨斯的雪原不同意这个想法，那些挣扎着求生的工人，那些早已被当地贵族掏空口袋的工厂主们，他们将长久以来的不满宣泄在帕维尔身上，这让他几十年来疲于奔命。如今，又一场暴动席卷而来，已是古稀之年的子爵再也不复曾经的意气风发。这一次。他只想尽快结束混乱，然后远离这个是非之地。\n\n自从子爵被圣骏堡的高官派驻到此，他已经在这片雪原度过了数十个春秋冬夏。如今，他已然衰老，对领地的掌控也大不如前。也许，是时候找一位接班人了。"
 KRS_aging_viscount: "衰老的子爵"
 KRS_Yuri_Sayanov: "尤里·萨亚诺夫"
 KRS_Yuri_Sayanov_desc: "在东部领地的无数行政官僚中，萨亚诺夫并不是最耀眼的那一位，也不是权力最大的那一位。在整个贵族领面临一场内部斗争的情势下，萨亚诺夫只求能够保住自己的身家性命。然而，官僚们总是会寻找一个利益的代言人。在克拉斯尼亚尔，面对着权势滔天的贵族寡头，萨亚诺夫就是这个代言人。只要萨亚诺夫还能为他们带来足够的利益，官僚们就会永远团结在他的身边……但愿如此。\n\n作为贵族领第一大城市的市长，他的存在已经被各位贵族看在眼中：有人视之为眼中钉肉中刺，有人奉之为贵族领未来的唯一希望，更有甚者，将他视作叛乱分子在贵族领内的间谍，只因他生长于克拉斯尼亚尔的雪原和森林之间。他的工作如履薄冰。但是，若真要问他有没有想过建立自己的功业，萨亚诺夫却又支支吾吾、不肯回答……也许，在他心里，藏着一个繁荣富强、没有战乱的克拉斯尼亚尔，正等待着某个时刻的到来。没有人知道萨亚诺夫下一步要做什么，除了他自己。也许是大刀阔斧的改革，也许是谨小慎微的换汤不换药……总之，他还有很多时间。"
 KRS_young_mayor: "年轻的市长"
 KRS_faction_by_himself: "自成一系"

#民族精神
 KRS_workers_riots: "工人暴动"
 KRS_workers_riots_desc: "长久以来对北方民众的压榨已经让他们怨气冲天，他们最终选择了用武力诉说他们的要求。"
 KRS_Krasnyar_transport_hub: "克拉斯尼亚尔交通枢纽"
 KRS_Krasnyar_transport_hub_desc: "大叛乱后，为了更有效地管理东方领地，费奥多尔陛下亲自要求在叶尼塞河的弯曲处修建了这座枢纽站，为克拉斯尼亚尔提供物流服务。它与整个东达利亚的道路连接在一起，将这里的产品送往帝国各处。"

