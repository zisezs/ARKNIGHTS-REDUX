 #国家精神
 VAS_Behind_the_scenes: "幕后人物"
 VAS_Behind_the_scenes_desc: "坊间常常风传，阿什沃思公爵背后有着一位极其重要的大人物；另有谣言称，这位大人物其实正是伦蒂尼姆市民自救军的领袖之一——克洛维西娅大人。无论如何，目前至少可以肯定：此人与公爵长期保持着密切联系，并主宰着公爵的外交方向甚至军事计划。至于这位幕后人物的影响究竟是好是坏，便没人能说得清了。"