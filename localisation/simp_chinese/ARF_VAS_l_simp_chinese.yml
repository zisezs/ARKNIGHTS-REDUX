 #人物
 VAS_Roland_Ashworth: "罗兰·阿什沃思"
 VAS_Roland_Ashworth_desc: "在一众醉心政治的帝国公爵之中，罗兰·阿什沃思可谓是一个扎眼的异类。对他而言，玩弄权术毫无乐趣，工程设计与基础建设才是值得钟情的事业。他曾与工程师詹姆斯·布林德利密切合作，创新了运河隧道与渡槽技术；盎格兰的运河网络也出自他的手笔。倘若一切不出差错，他或许会作为一名工业先驱被载入史册，为后世的人们所津津乐道。\n虽然帝国所面临的存亡危机正将阿什沃思重新拉入政界，但他却依旧保持着低调而务实的立场。他秘密为境内的民主派人士提供庇护，却不露声色地对罢工运动进行残酷镇压；而在公爵们的事务上，他也倾向于中立和观望。但事态往往不遂人愿，阿什沃思很快便将意识到一点——在维多利亚的乱局之中，无人可以置身事外。"
