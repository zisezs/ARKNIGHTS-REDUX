#国家领袖
 BWS_Tatyana_Vederskaya: "塔季扬娜·韦德尔斯卡娅"
 BWS_Tatyana_Vederskaya_desc: "塔季扬娜·韦德尔斯卡娅是一个战争英雄，至少以前是。她是在四皇会战时大放异彩的军官，如果没有意外，她将一路升迁，在某个集团军获得一个重要的职位，但是哥伦比亚军队的炮弹就是那个意外。炮弹的破片削掉了她的半个身子，圣骏堡的医生拼了命才把塔季扬娜的性命保下来，但是她已经成了一个残废。韦德尔斯卡娅沉默地回到了家族留下的公爵领地，乌萨斯军队对外宣称她被派去镇守南部边疆，但谁都明白，这只是开除塔季扬娜·韦德尔斯卡娅的变相说法。她在治疗过程中对吗啡形成了依赖，回到老家后，她的上瘾更加一发不可收拾，她开始动用公爵领内的资源，帮助自己获取这种“合法”的毒品。随着时间沉默地流过，往日意气风发的军官现在只是一个躲在卧室里打着吗啡的瘾君子，而她领地上人民的死活，优先级并不在吗啡之上，在韦德尔斯卡娅看来，他们都只是购买吗啡的资金来源而已。"
