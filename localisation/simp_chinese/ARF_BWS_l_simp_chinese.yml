#民族精神
 BWS_No_mans_land: "无主之地"
 BWS_No_mans_land_desc: "布拉戈维申斯克的领主早已高高挂起、不问世事，只有征税队冲进村子时，当地人才能感受到她的存在。而由于卡兹戴尔的连年内战涌入此地的难民，并不在领主关心的范围内。无助的乌萨斯本地人和萨卡兹难民只得组建起各自的小团体，拿起简陋的武器，维护自己微不足道的那点利益。如果没有第三个势力打破这种局面，布拉戈维申斯克就将一直、一直混乱下去，直到永远。"