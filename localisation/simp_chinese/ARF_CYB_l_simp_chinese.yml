#民族精神
 CYB_Bosque_arms_factory: "博斯克军火公司"
 CYB_Bosque_arms_factory_desc: "博斯克军火公司，全称§B“萨拉托夫博斯克军工集团”§!，主要生产经营武器装备及其他军用物资的公司，其创始人萨文托夫筹巨资与另外两位合伙人共同经营，在当下已经名扬北陆，乌萨斯著名的195mm“博斯克巨炮”就是由该公司生产研发，同时也生产配套的步兵弩枪“闪凌”，这些畅销武器很快击败了同类产品并占据了整个乌萨斯市场，其军火甚至远销中陆和哥伦比亚，一部分武器也通过黑市流入萨卡兹，得到了普遍的高评价。\n军火贸易带来资本，无上资本铸就出寡头——萨文托夫借助博斯克公司给自己谋取了难以置信的利益，这次投资大获全胜，取得了难以想象的回报，他用资本的力量巩固了自己的统治，一个稳固的博斯克军火集团也得以控制领地的方方面面，在博斯克公司和萨拉托夫公爵领背后的是一个个难以估量的庞大利益集团。"
 CYB_worker_unrest_modifier: "工人不满"
 CYB_worker_unrest_modifier_desc: "自1084年贵族们的战争终结后，萨拉托夫公爵领就进入了火热的建设时代，领地开始采取一系列措施，通过低廉成本的劳动力吸纳大量外国投资，这种高压环境已经持续了十年之久，虽然抹除了战争带来的萧条景象，但越来越多的工人和领民的生活水平却没能得到提升。\n领民们目之所及，看到的只是越来越多的中乌萨斯难民以及看不到头的建设任务，矿石病感染率因此激增，这引发了一系列不满和抗议，工人们要求改善他们的劳动环境和劳资待遇，减少接纳更多的难民进入领地。在这个斗争过程中不乏一些恶性的流血冲突事件。严重影响了萨拉托夫领地的正常运作，其根源在于寡头企业和外国资本长期以来的压榨和领地政府的高压统治，在工人们得到满意的答复前，不满的声音是不会消失的。\n§R当然了，领地政府可以解决问题，也可以解决提出问题的人。§!"
 CYB_Fernando_arms_factory: "费尔南多军工厂"
 CYB_Fernando_arms_factory_desc: "1092年，费尔南多军工厂被博斯克公司投入9000万乌元巨资在奥坦堡初步建成，此后又吸引了许多外资加入，钢铁和源石构成了军工厂的灰面外壁的全貌，这里到处充斥着火热的气氛和为了日常所需辛勤劳作的工人，这是萨文托夫公爵五年来的杰作。\n作为乌萨斯南部最强大的工业区，整个公爵领地的命脉费尔南多军工厂承包了无数军火商的订单，这里先进的机床设备与颓败的乌萨斯现状形成了鲜明的对比，泰拉世界最先进的火炮和武器从生产线上运出奥坦堡，又将源源不断的财富收割殆尽，这座军工厂的工业力量终有一天能让世界惊叹，请相信它的力量。"
 CYB_Autanburg_arms_storage: "奥坦堡军火库"
 CYB_Autanburg_arms_storage_desc: "四皇会战时期，科西嘉一世率领大君亲征乌萨斯，势如破竹的高卢人以摧枯拉朽之势击穿了乌萨斯的北方防线，震怒的伊万大帝随即率军南下，奥坦堡在当时成为了四皇会战的最前线，也吸纳了全乌萨斯不计其数的战争资源。\n劲弩，大口径弩炮，不同口径的源石火炮，各式各样的术士装备和配套的近卫武器，乃至令人望而生畏的重型越野坦克，这些战争巨兽在四皇会战结束后大多被封存在了奥坦堡的武备库中，然而仍然绝大多数经受不住时间的侵蚀磨损严重。\n如果有必要，我们可以重新启用这个五十年前的军火宝库，有选择的修复那些值得抢救的装备，让乌萨斯这些强大的战争兵器重现世间。这是伊万大帝留下的珍贵宝藏，没有人清楚奥坦堡的军火库里到底还隐藏着什么黄金时代的利器，萨文托夫领有足够的底气屹立于东乌萨斯地区，威慑那些觊觎我们财富的宵小之徒。"
 CYB_fourteen_hour_work: "十四小时工时"
 CYB_fourteen_hour_work_desc: "我们必须加紧时间，保证工厂的生产效率，每一个人在这个过程中，都应该付出他们全部的血汗！"
 CYB_sixteen_hour_work: "十六小时工时"
 CYB_sixteen_hour_work_desc: "还不够，还不够！我们必须榨干工人们的最后一丝精力，无论付出怎样的代价。难道会有什么更坏的结果吗？"
 CYB_cash: "高昂关税"
 CYB_cash_desc: "萨拉托夫公爵领的关税不会因为一点破事就发生改变，高昂的关税是萨拉托夫财富的源泉，更是萨拉托夫的底线！"
 CYB_free_market: "自由市场"
 CYB_free_market_desc: "我们对博斯克军工的建设取得了成效，这片大地上的市场都向我们敞开，是时候取回属于我们汗水和心血的回报了。"
 CYB_arms_export: "有限军火出口"
 CYB_arms_export_desc: "萨拉托夫公爵的决断使得这个乌萨斯最大的的军工齿轮再次转动起来，与武器生产线上那刀枪剑戟一同到来的，还有数不胜数的财富与利益。"

#国策
 CYB_sunshine: "日光"
 CYB_sunshine_desc: "泰拉历1094年，萨拉托夫大州迎来了她的新一个年头，距离“大叛乱”结束已经过去了整整十八年，乌萨斯中部的废土和愁云还未散去，作为在那场战争中损失最严重的地区之一，萨拉托夫领地还需要漫长的时间来恢复。这里百废待兴的荒地和漫山遍野的矿石都亟待开采，转而变为博斯克军工和她麾下源源不断的财政收入。\n在这段时间里，我们的领主费尔南迪·萨拉托夫一直亲力亲为，在方方面面给予最大的支持，今天这位领主终于结束了自己的远途旅行，将回到奥坦堡开始主持事务，并致力于开启领地内的新篇章，他的随身幕僚也紧跟其右。"
 CYB_sunshine_tt: "萨拉托夫大公将结束例行的领地巡视，我们将开始讨论大选前最后一年的有关事项。"
 CYB_friendship: "友谊"
 CYB_friendship_desc: "路德加·威尔和库鲁·尼克，谈起这两个在奥坦堡权极一时的幕僚，人人都会想到萨拉托夫大公的左膀右臂和知心好友，自萨拉托夫领地迎来了新主人，他们两人就一直悉心侍奉着公爵，迄今为止已经不知道度过了多少个日夜。\n威尔擅长与领地的多方人士打交道，尼克擅长管理内务人事，两人帮助大公解决了许多财政和内政上的困难之处，同时对领地的发展方向提出建议，可以说萨拉托夫领地能发展到如今这个模样，两人居功至伟。\n这份友谊支撑着大公在前路漫行，博斯克军火公司和奥坦堡是他们共同的遗产，这座岁月悠久的乌萨斯城市在他们的凝视下愈发兴旺，三人齐心协力经营着领地的方方面面，终有一天能恢复到大公期待的模样。"
 CYB_friendship_tt: "领地“三巨头”即将在奥坦堡会面谈论近期领地即将举行的选举问题。"
 CYB_Bosco_Share_holders_meeting: "博斯克股东大会"
 CYB_Bosco_Share_holders_meeting_desc: "博斯克军火公司寄托着领地的全部希望，三年前，大公展开了雄心勃勃的重工业发展计划，通过行业资源倾斜和农业剪刀差在领地里发展出了乌萨斯东南地区最大的军工厂，用以支撑大公的军火贸易。一转眼时光匆匆，当年的单薄工厂已经擢升为了令整个乌萨斯为之骄傲的南部军工枢纽，我们自然也要回报当年那些慷慨解囊的投资人。\n当然，这可能不会持续太久……"
 CYB_Bosco_Share_holders_meeting_tt: "我们将召开一次股东大会，聆听来自博斯克公司的声音，并开始着手制定新一年的贸易方案。"
 CYB_raise_working_hours: "提高工作时长"
 CYB_raise_working_hours_desc: "还不够，还远远不够，我们的生产效率仍然不足以弥补巨大的缺口，有很多次我们都只能坐视宝贵的军火订单被其他竞争者抢走，仅仅因为我们的工厂没有办法按时生产庞大数量的源石制品。这真是令人遗憾至极。\n炮弹、火花塞、弩枪，乃至一粒最微不足道的弩弹，不只是威名赫赫的博斯克火炮，任何军火订单都能被费尔南迪军工厂承包，而失去这些订单会让我们的年度预算和利润缩水至少30%。没有时间给那些懒鬼休息了，双休日将被单休所替代，在我们找出更好的办法前，从现在开始所有人都必须将工作时长提高到十四个小时！\n尽管这对于一些人来说很艰难，但相信更多的人会理解我们的，正如他们理解乌萨斯这片土地的寒冬有多么难熬，在工位上持续工作是一种顽强精神的体现，为了领地，为了奥坦堡！"
 CYB_raise_working_hours_tt: "这会加剧工人不满带来的影响。"
 CYB_lord_tenure: "领主任期"
 CYB_lord_tenure_desc: "在初步分派了公司任务后，奥坦堡有一揽子事情需要公爵亲力亲为去处理，首先是领地内现在此起彼伏的工人抗议和暴力事件，何塞·佩尼亚里埃塔和他的工人协作联盟正在不遗余力的反对政府目前的政策。除此之外，博斯克董事会内部那群只会往自己钱包里敛财的混蛋也应该被教训一下了，腐败的行政部门需要被大力整顿，对外贸易和感染者权利问题也相继提上日程。\n萨拉托夫自信十足，他能够同时处理好这些棘手的问题……在仅剩的任期内改善领民目前的生活，加强领地综合实力的同时树立他在选举中的形象，这也不至于失去既得利益者的支持。"
 CYB_Bohr_Act: "波尔法案"
 CYB_Bohr_Act_desc: "波尔法案是公爵于半年前制定的有关对工人薪酬以及社会制度保障的意见而编辑成的修正法案，它明确固定了领地内的工厂主需要严格遵守较高的最低时薪，向工人发放薪水，同时也要求他们在节假日要求加班时以三倍工资的水准发放加班费，这一法案得到了部分大工厂主的强烈抗议，以为这意味着他们的生产成本几乎一瞬间翻了倍。\n波尔法案褒贬不一，工厂主和小资本家对他憎恨至极，感染者和劳工阶级对它倍加推崇。这项法案能否顺利推行还是一个未知数，只有法案本身存在的意义是毋庸置疑的，那就是它贯彻了萨拉托夫公爵本人对领地发展方向的期望。"
 CYB_Bohr_Act_tt: "减轻工人不满带来的影响。"
 CYB_improve_the_salary_of_workers: "提高工人待遇"
 CYB_improve_the_salary_of_workers_desc: "自进入工业时代后，工人阶级前所未有的在社会上壮大起来，成千上万的劳动者在轰鸣咆哮的源石工厂中挥洒汗水，用他们的精神和意志给所有人铸造了现代文明的奇迹——移动城市。然而工人的地位自工业革命以来都没有得到任何提升，随着制度的进步和革新，这些群体的力量正在逐渐崭露头角，并取代了传统的农业手工业。\n要让领地长治久安就不得不需要他们的力量，而比起剥削和残酷的压榨，摆在聪明人面前有一条更为便捷有用的道路，通过复利保障和高待遇来促进阶级合作，劳资关系的稳固便是萨拉托夫大公理想中的社会制度。"
 CYB_social_security_system: "社会保障制度"
 CYB_social_security_system_desc: "给予感染者公民权一直都是领地内争论已久的话题，董事尤格斯拉夫·拉济奇一直反对这一做法，他认为放任感染者在领地内自由活动会造成很多隐患，首先感染者本身极其危险。他们可以使用普通人无法抵御的强大法术，有些人甚至连警察都很难掌控。而且对感染者开放隔离区也可能会让矿石病更加不受控制的传播开来，这无疑都是让人沮丧的事情，很可能反噬自身，于事无补。\n不过随着宽容的声音越来越多，近日对社会保障的制定议程吸引了无数人的讨论，相继有市民请愿希望政府能开放对感染者保障制度，至少让他们不必再以为各种生活必需品而为难。"
 CYB_increased_tariff: "增收关税"
 CYB_increased_tariff_desc: "我们十分感谢外资企业给与博斯克的帮助，在经营初期，这些外国朋友帮助我们度过了那段艰难的岁月。但时过境迁，随着萨拉托夫领地越来越强盛，我们应该开始着手为自己的利益所考量，终止那些在投资初期签订的部分合同，然后在合作问题上重启新一轮的谈判。\n黑钢国际在博斯克的投资占据股份的两成，他们拥有高额的关税豁免权和领地内的优先贸易特权，这一现状应该被终止，我们必须采取手段来捍卫本土产业免遭破坏，否则萨拉托夫领地的繁荣将被永远笼罩在外国人的阴影之下。"
 CYB_increased_tariff_tt: "黑钢国际有可能对我们的政策提出抗议。"
 CYB_expand_fiscal_expenditure: "扩大财政支出"
 CYB_expand_fiscal_expenditure_desc: "政府主要履行的主要职能之一就是社会财富再分配，公民通过税收的形式将宝贵的税款上交领地，按照领地的税法和政府的政策将这些钱再用到其最需要用的地方，比如扶贫，再比如投资，再比如将陈旧的基础设施翻修一新。不论如何，领地现在需要大笔支出拉动目前不景气的各个产业。"
 CYB_New_market: "崭新的市场"
 CYB_New_market_desc: "市场需要每个人的参与和良好的维护，一个繁荣的市场取决于多方面因素，人口数量、消费能力、人民贫富差距、乃至商品的多样性，我们能参考的经验并不多，国际贸易正在朝着我们走来，比起拒绝，我们更应该勇敢拥抱它，然后在平坦的大路上开拓属于萨拉托夫的自由市场。\n这是资本的胜利，也是人民的致富之路，博斯克军工会将他的商标带到这片大地上的每个角落，用镰刀收割所有目之可及的财富。"
 CYB_Bosco_first: "博斯克优先"
 CYB_Bosco_first_desc: "公司的战略方针一直以来都遵循着极大程度的利己原则，自我们垄断了现今火炮的生产权限后就更是如此，技术领先带来的红利效应可以帮助领地快速发展。我们有理由在外贸方针上采取更加强硬的手段，来保证其他竞争者屈服于博斯克军火的统治之下，甚至是让他们无法离开我们。\n然而公司内部不是铁板一块，某些恶劣的大股东随时准备就这个问题展开一场漫长无用的博弈和讨论，我们没时间跟那些人在这件事情上东拉西扯，公爵需要拿出自己的威严，然后按照既定方案坚定的实施下去。\n博斯克是无与伦比的瑰宝，而领地更像是鲜花旁边的绿叶。"
 CYB_money_is_all: "金钱就是一切"
 CYB_money_is_all_desc: "大叛乱结束以来，乌萨斯帝国的东部领地就陷入了沉寂和萧条中，历经十余年的动乱时期，贵族们才勉强将东部领土整合成自己的地盘，然而当人们凝视着北境大地才猛然发觉，曾经富饶的沃土在无尽的军阀混战早已面目全非。\n萨拉托夫领地一直对外进行着贸易封锁，因为领地议员全都担心向其他乌萨斯军阀出售武器会导致严重的后果，前路引向何方还是一个未知数，谁知道哪天我们卖出去的武器就会变成射向自己的弩弹？\n乌萨斯是一片宝地，上面的每个人都需要防身的武器，博斯克必然要利用这一点来追求更高的利润，金钱的诱惑促使着堕落者一步步走向深渊，固执的无视掉身边冰冷的骨骸。"
 CYB_trade_open_the_way: "贸易打开航路"
 CYB_trade_open_the_way_desc: "是时候灭一下第八集团军的嚣张气焰了，那些盘踞在领地南方的兵痞无赖丝毫不把公爵的威严当一回事。竟然封锁了前往中陆的必经航线，并宣称任何陆行舰没有他们的允许都不得通过，这真是无耻至极的勾当，他们以为自己是谁啊？\n必须现在就亮出刀锋，派出我们的特使然后对奥坦堡广袤的南部地区施加影响力，否则我们的中陆贸易将无从谈起，领民也会对公爵的领导威权产生怀疑。\n军队集结，火炮上膛，如果艾迪安·尼古拉斯和他的几个走狗不打算妥协，那我们也不介意用武力威胁的手段达成目标。第八集团军的驻地必须服从，现在就要！"
 CYB_labor_brings_prosperity: "劳动带来繁荣"
 CYB_labor_brings_prosperity_desc: "劳动从来都是创造价值的源泉，十四小时工作制显然还是不足以支撑这一阶段的军火订单需求。\n更多的贸易，更多的订单。还需要劳动，现在还不能休息……\n去工作吧，为了领地，为了萨拉托夫大公！每个人都能用辛勤的汗水来度过充实的一天，而不是待在家里无所事事的虚度光阴，用劳动养活你的家庭！"
 CYB_labor_brings_prosperity_tt: "增加工人不满带来的影响。"
 CYB_citizen_of_infected_persons: "感染者公民权"
 CYB_citizen_of_infected_persons_desc: "相较于其他乌萨斯地区粗暴的管理方案，领地对待感染者的态度已经足够宽容，感染者隔离社区普遍在奥坦堡的边缘城区设立，有负责的专员和医疗人士进驻这些感染者聚居区，给予他们一定程度上的生活保障，令萨拉托夫领地的感染者问题一直不是非常严重。\n领地议会近期正在讨论一项新的法案，有关于是否完全开放对感染者的禁令，拆除隔离区域并完全接纳这些感染者成为领地的一份子……不是所有人都希望看见感染者得到公民权，但也有人会支持我们的正义，毕竟萨拉托夫领地绝大部分工人都有感染者的双重身份。"
 CYB_duke_blessing: "公爵赐予福报"
 CYB_duke_blessing_desc: "我的獠牙从不置人于死地，只有狼人拥有杀生的尖牙。我的子嗣还有我余罪的继承人已经全部逝去，大帝荣光如同一缕破碎幻梦渺无踪影，萨拉托夫之名止步于此，大公的称谓不过也是旧世界尚未散尽的余烟。大叛乱也带走了心底仅存的温情，也碾碎了某些人对圣骏堡的渴望。\n只有领地如同雪地烛光，照亮了不远处的风景，奥坦堡发展迅速，贸易改革已经初具成效，乌萨斯未来仍然十分明朗。"
 CYB_Pisco_Regulations: "皮斯克条例"
 CYB_Pisco_Regulations_desc: "该死的寡头，该死的董事会！那些人愚不可及的大脑袋里容不下一丁点仁慈和善良，没有一个人在意领地的发展，目光短浅粗鄙至极，成天只会用自己奢华的生活去掩饰内心的焦虑和恐惧。\n博斯克董事会逐渐腐败，已经成为了领地最大的肿瘤，虽然不得不承认寡头们在建设初期起到的积极作用，不过现在他们的权利已经开始威胁到了奥坦堡的发展和大公在博斯克公司的领导地位，这是大公所绝对不能容忍的事情。\n大公心意已决，要从政府机构和职能部门入手，逐渐剔除掉这些人的影响，然后着手让公司股权全部回到他的手中……"
 CYB_rotation_system: "轮换制度"
 CYB_rotation_system_desc: "工人们已经在高强度的劳作下坚持了数个年头，每周都可能有人突发疾病猝死在岗位上，为奥坦堡温暖的寒夜燃尽了自己，聊胜于无的抚恤金完全无法安慰家属的心情，于是工厂的残酷体制也就流传开来。\n人们普遍对这种疲于奔命的上工手段感到厌恶和不满，别有用心的人开始将这些作为攻击政府的手段，他们声称资本家正在毫无底线的剥削工人，这种残酷的制度必须被推翻。\n皮斯克条例可以开始倾听工人们的意见，实行轮换制度无疑是解决问题的一种手段，至少不会让他们继续吵吵嚷嚷叫个不停了。"
 CYB_honorary_title_of_labor: "劳动荣誉头衔"
 CYB_honorary_title_of_labor_desc: "奥坦堡工会完全由工人协作联盟掌控，他们的抗议和游行就一直没停止过，越来越多的工人在他们的煽动下开始反对现在的制度，他们希望由工人和工会主导，在奥坦堡建立一个工人自治领，真是有够异想天开的。\n谁知道何塞·佩尼亚里埃塔那个吃错药的醉汉是怎么突然在工会有这样大的影响力的？尽管他半点好话也不会给政府说，但我们还是不得不捏着鼻子去找这个人，然后希望他们能与政府达成合作关系，以政府的名义给一些优秀上进的工人颁发荣誉称号。这会对外宣称是一次正式的协商会谈，他们能合作最好，如果不能，那我们也有理由攻击他们完全是胡搅蛮缠。"
 CYB_honorary_title_of_labor_tt: "如果我们与工人协作联盟达成合作，那就能大大减轻工人不满带来的影响。"
 CYB_department_specialization: "部门专业化"
 CYB_department_specialization_desc: "安排部门分工是一项漫长细致的工作，先前的分类无疑太过粗糙，我们将重新考核各部门的情况，然后将某些不必要的职能部门进行合并和再分工。\n这会触及许多寡头的利益，因为某些好用的政府通道可能因此被堵死，不过那些人什么时候能决定领地的内政了？"
 CYB_rectify_administrative_organs: "整顿行政机构"
 CYB_rectify_administrative_organs_desc: "领地内的行政效率尤其低下，腐败问题开始影响我们的政府，有很多人凭借与企业和寡头的特殊关系就能在竞选中脱颖而出成为政府的公务员，但是这些人名不副实，能力有限。经常把十分简单的事情搞得一团糟，却会趾高气昂的指责别人，长此以往职能部门出现的乱象和歪风邪气层出不穷。\n有必要开始整顿了，议会将按照大公的意愿重新出台评估制度，并剔除一些确定收受贿赂的贪官污吏，那些吸血虫不配呆在公职岗位上！"
 CYB_improve_territorial_management: "完善领地管理"
 CYB_improve_territorial_management_desc: "皮斯克条例的落实堵上了行政机构的许多窟窿，现在奥坦堡的政府体制虽然仍旧不能称得上高效，但也不至于令人诟病，人们明显发现办事效率比起先前快了好几个档次，政府官员也不能再像以往那样颐气指使，政府改革已经起到了它应有的作用。\n更广阔的地区呢？整个乌萨斯呢？当公爵每每想到这些，就不由得幻想起大叛乱的光景，如果那天圣骏堡被成功夺取，乌萨斯是不是该在这样的政府改革下重新焕发勃勃生机？\n那些可耻之徒……他们毁了乌萨斯，但他不会一直等待下去的。"
 CYB_waiting_favourable: "静候佳音"
 CYB_waiting_favourable_desc: "几个月前，萨拉托夫就嘱托给威尔一个重要的任务——确保大公能在领地的选举中取胜，候选人除了他自己以外还包括何塞·佩尼亚里埃塔、尤格斯拉夫·拉济奇、安德雷特·埃玛隆、以及威尔本人。\n这个任务并不难，在萨拉托夫大公本身拯救奥坦堡于饥荒中的名望来看，他只需要稍微承诺做点什么，或者发表一场振奋人心的演讲就能赢得选举，人们普遍对公爵目前的统治还算满意，但何塞的出现只用了几个月就搅乱了这些。\n先是工厂事故，然后是随之而来的抗议浪潮，闹腾的工人罢工让每个人都相当难堪，人们才恍然意识到大公的统治似乎也没有想象中的那样完美，在选举中其他寡头也都对领地的执政权表现出了十足的兴趣。\n对于选举，自己绝不能落败，否则他所想的一切计划都将化为泡影，乌萨斯将再也没有机会按照他的方向前进了。他需要必胜的把握，而路德加·威尔，这个他数十年的至交好友无疑是唯一可能帮得上他的人，让这一切万无一失。"
 CYB_opening_Day: "开幕之日"
 CYB_opening_Day_desc: "都完了……完了……怎么会这样？无耻的叛徒……叛徒！路德加·威尔那个混账！我要亲自去找他，真是整个人都疯了，他竟然蒙骗了我……\n不……不不不不……不……不！！\n他必须付出代价——！！"
