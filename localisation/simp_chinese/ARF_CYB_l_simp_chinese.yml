#国家领导人
 CYB_Fernando_Saratov: "费尔南迪·萨拉托夫"
 CYB_Fernando_Saratov_desc: "自风云动荡的五十年代开始，萨拉托夫就已经在乌萨斯的大地上闯荡了，他经历过热血沸腾的黄金时代，也亲身参与过那个令所有乌萨斯人为之狂热的大征服时期，他亲眼目睹伊凡大帝的炮舰碾碎了所有不信者，将非凡的光辉播撒到整个北境，继而铸造了如今的乌萨斯帝国。\n作为一名经历过数次乌卡战争的老兵，战争对萨文科夫的影响深重，那些铳炮齐鸣，血肉纷飞的残酷景象深刻震撼了尚且年轻的萨拉托夫，他在一次战斗中被银枪天马击中了肩胛骨，死里逃生捡回一条命，也靠着奋力搏杀救下皇储的英勇事迹获得了公爵的赐封——萨拉托夫公爵，那是他一生中最显赫的日子，也是他值得吹嘘的功绩表彰，这是用血和肉在战场上换来的东西。\n好景不长，三十年如一梦，伊凡大帝溘然长逝，巨人的倒下也让萨拉托夫感到无比悲哀，这个国家仿若一瞬间停摆了，贵族的糜烂和军队的腐朽全都从大地的每个缝隙饥渴的钻了出来，将大帝留下的乌萨斯腐蚀的不成样子。他进而愤怒的谋划了反对新皇的方针，并在1076年最终联合其他贵族一同掀起了“大叛乱”，可惜在那场战争中不幸落败。\n“大叛乱”似乎带走了旧时代，带走了伊凡大帝的荣光，也让乌萨斯人在炮鸣中惴惴不安，但新时代将由谁来主导？睿智的将军，虔诚的贵族？坚毅的教士？还是那些蠢蠢欲动的感染者叛军？当萨拉托夫转过头，在冰冷的帝国东部看向他惨遭流放的境遇，只能发出令人不寒而栗的冷笑。他们自以为能让他在这冰天雪地失去斗志，自以为这样就能高枕无忧——是如此令人发笑。\n博斯克军火公司继承着他的全部期望，他迟早会将憎恨已久的乌萨斯皇权彻底葬入坟土，然后按照他萨拉托夫的愿景，重建一个真正继承了伊凡大帝荣光的乌萨斯帝国，属于所有自由者的广袤未来。"
