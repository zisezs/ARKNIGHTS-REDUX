 focus_cyb.1: "极地与枪炮"
 focus_cyb.1.t: "极地与枪炮"
 focus_cyb.1.d: "下午四点，乌萨斯中部，奥坦堡。\n不知道为什么，泰拉世界的人们总是对日光抱有一种天然的敬畏，不论是白天还是黑夜，他们都崇尚那些发光的物品，对漆黑的大地感到恐惧和无端的抵触。\n乌萨斯寒冷的天气下，一辆造价不菲的房车从冰原驶过，呼啸北风从每个间隔和空隙钻入，进而汹涌而来的寒意驱散了萨拉托夫最后的睡意。公爵皱起眉头看向窗外的北原；太阳像是逐渐黯淡的光盘渐渐西斜，收敛起那刺眼的光芒，在北境基本上预兆着寒夜将至，荒野上的人们该点燃篝火了。\n“你怎么看大选的事？”萨拉托夫收回目光，不经意间低声问道，他的所有注意力都放在了身边的这个人身上，路德加·威尔是他的左膀右臂，也是博斯克公司得以运营到今天的主要策划人。威尔闻言先是有些奇怪，然后不动声色咽了一口热茶，回应说，“大选结果不是早就注定了么？在我们的关系疏通下，那些贱民就没什么机会在选举下取胜。”\n公爵哂笑几声，他偶然间想起最近从奥坦堡听说过的笑话——给他们半天时间，他们将在选举上创造奇迹，这是领地内的平民组织“极地冰花”所说出的话，他们无时无刻不在揭露政府中存在的问题和腐败，并呼吁一个由领地平民组成的政党来取代领地上贵族们的行政权。\n他们的领袖何塞·佩尼亚里埃塔是一个玻利瓦尔人，在几年前参加过哥伦比亚的某些事情，不过自从这个陌生人来到领地上就一天都没消停下来过，不是在酒馆里喝的酩酊大醉聚众闹事，就是到处宣扬鼓吹自己的政治才能，举手投足间都是懒惰的醉汉气质。难以想象他的政党究竟是用什么凝聚起来的，至少萨拉托夫对这个人的印象极为差劲。\n威尔叹了口气，警告说：“醉汉执政听起来很可笑不是么？但是我们也不能忽视何塞，这个人可并不蠢，他每次鼓动的抗议游行都是在针对那些犯了错的贵族，我们也抓不到他有什么严重的把柄。最大的问题是有不少对我们抱有不满的平民真的会去支持那个家伙，他们才不在意接班人，只要我们倒台就能让那些混蛋拍手称快。”\n“不用太担心，他们跑不掉的，先专心在选举上取胜。”萨拉托夫冷哼几声，微微闭目沉思，想着一会儿要干的事情。"
 focus_cyb.1.a: "“威尔，该去见见重要的人了。”"
 focus_cyb.2: "亲密伙伴"
 focus_cyb.2.t: "亲密伙伴"
 focus_cyb.2.d: "库鲁·尼克已经在自己的工厂里工作了三十年了，在他还是个年轻人的时候，乌萨斯还不是这个模样，他没有在当年参加那场令所有人印象深刻的战争，也没有参加贵族们所谓的叛乱行动。如今乌萨斯还是乌萨斯，奥坦堡也安然无事，让尼克萌生出了不少在这里安度晚年的想法，萨拉托夫描绘的那个乌萨斯精英阶级创造的美好国度，正属于他这种人，因此他们也建立了稳固的友谊。\n“你知道，选举的事情都已经办妥了，到时候有我们控制的130多名领地代表都能投下赞成票，你会毋庸置疑的维持自己的领主地位，而其他人只会以为是自己的影响力不够强。”尼克如此说着，一边抽牌，然后靠着桌子投下一叠筹码，他很喜欢在闲暇之余与自己的亲信玩赌牌，“嘿！今天运气不错，13点。”\n萨拉托夫抿了抿嘴，再三张嘴，他的目光游移不定，给尼克的感觉有点迷茫，“说的没错，不过那些人的行为怪怪的，他们甚至都没跟我交涉过，我很怀疑他们是不是还在谋划别的事情。”\n那些人指的自然是博斯克集团的无数合伙人，奥坦堡从来不是一个人说了算的地方，博斯克公司在奥坦堡组建了包括了军火公司和其他几个商业集团的联盟，这个庞大的会议拥有好几十名寡头，威尔是他们之中影响力最大的那个，他们共同组成了博斯克的高层，被人们私下里用土话称为「贪婪者的聚集地」\n尼克暗暗无奈，他不想费尽心思去思考那些公司的事情，就拿黑环电子来说吧，他们的董事就如同一桶臭尿，仅仅是看上一眼就能让他作呕不已，思考片刻，他认真说道：“你有什么可担心的？博斯克倒台对他们也没好处，没了博斯克，整个领地都得倒台，难道你指望那些人会串通一气做些什么让自己生意泡汤的蠢事？”\n萨拉托夫想了想，他突然又释怀下来，尼克是对的，领地内各打小算盘的公司们不会让别人取得领导地位，也不太可能联合起来反对威尔，他大概纯粹是有些神经过敏。"
 focus_cyb.2.a: "嘿，尼克，也跟我玩一盘。"
 focus_cyb.3: "独到经验"
 focus_cyb.3.t: "独到经验"
 focus_cyb.3.d: "博斯克公司因何取胜是一个好问题，许多人都曾研究过奥坦堡这片贫瘠的土地为什么会诞生这样一家声名鹊起的军火企业，并在短短几年间靠着可靠性极强的产品扬名中陆，并在哥伦比亚圣温交易所长期占据高价榜位，不少著名的公司评论家和研究学者对此有过详尽的分析。\n威尔的财富？尼克的管理制度？萨拉托夫的名望？创新性的员工架构？还是什么不知名的因素在起作用？不少人挠净头皮屑都试图仿照萨拉托夫的成功经验，不过均以失败告终，乌萨斯大地上只有这一家成功的军火公司，几乎独霸市场。或许只有公爵本人才知道他的成功并不是什么奇怪的事……他的家族给他留下了最宝贵的财富——足以容纳高温源石与巨大冲击力的刚性炮管，这份铸造工艺能让博斯克大炮的射程达到恐怖的地步，远远超过维多利亚人或是莱塔尼亚人造出来短小无力的破烂玩意儿。\n今年奥坦堡的股东大会是有史以来最盛大的一次，投资公司的208名股东来自世界各地，其中既有抱着试探之心的投机者，也有底气十足的大铺投资人，他们能在这里相会很大程度上都是对博斯克的事业有或多或少的自信，才会在这里投下一笔不菲的资金。\n萨拉托夫盛装出席，他用最直白的口吻将博斯克公司今年的财务报表和利润情况相继公布，见证了外国股东们的表情从疑虑到舒展，再到一丝欣喜，这些人微妙的小表情尽皆被他收入眼中，公爵相当享受这种感觉，把一切了如指掌的事情操弄在手中。\n想到这里，萨拉托夫自信的轻笑几声：“公司的事业还会继续欣欣向荣，请相信军火市场在将来的表现，今年将按照10%的比例追加履行分红方案，所有支持我们事业的投资人绝不会被亏待，博斯克大炮将继续为公司带来源源不断的财富！”\n一音话落，股东们满意的窃窃私语掩盖了全场，股东大会在和睦欢喜的氛围中结束了。在分红获利和经营良好的情况下，不少人都开始考虑追加公司资本，萨拉托夫如臂挥使的辗转于这些上流社会的精英，他们在许多问题上达成了共识和协议。"
 focus_cyb.3.a: "手艺胜过一切珠宝。"
 focus_cyb.4: "奥坦堡工协"
 focus_cyb.4.t: "奥坦堡工协"
 focus_cyb.4.d: "一大清早，诺弗兰大街上的居民就被嗡鸣的震钟吵醒，沉浸于清晨好梦和舒适壁炉的居民翻身而起，瞪大眼睛愤怒的盯着走上街头的“工人协作联盟”，简称「工协」，那是何塞·佩尼亚里埃塔和他的追随者正在向政府示威，他们身上怀揣不少吓人的武器，甚至有人端着劲弩，中间几个人协力举着的那个牌子上写着「我们要为辛勤劳动的人讨回属于他们的财富」。\n“加入我们！打倒贵族！”\n“居民们，打倒贵族！人人皆国王！”\n绝大多数居民又好气又好笑，这些口号要是在高卢革命时期还会被别人看上诧异的几眼，四十多年过去了，这种反对贵族的声浪在这种不合时宜的情况下显得颇为可笑。他们可以在萨拉托夫大人的领地上安居乐业，有什么必要投入到一场不死不休的混乱斗争中呢？民主制度是失败者的产物，出现在领地里对大家都没有好处，平民们冷眼旁观冷清的街道，没有任何人走出门槛加入他们，就像是在看粉墨登场的小丑在自娱自乐。\n“没有人跟着我们啊，何塞！”大清早的冷风吹过，科舒茨感到有些脖颈发凉，哆哆嗦嗦忍不住回头看向昂然自得的何塞，“我们再这样下去肯定会引来警察的。”说完他在心里暗骂几句玻利瓦尔混蛋，何塞这个刚愎自用的家伙根本就没有在听他说什么。\n何塞敷衍的点着头，无视了科舒茨的担忧，自顾自朝着那边的居住区放声大吼：“同胞们！平民亲人们！你们还没有受够萨拉托夫和他的追随者表现出的贪婪本性？他是个不折不扣的屠夫，几年前还在圣骏堡享清福，没有多少造福市民的能力，胡吃海喝的本事倒是样样不差，这样的人根本不配坐在执政官的位置上！”\n他的企图没能得逞，至少何塞走到一个大楼下面时，窗户突然开了，然后一盆冰冷的臭水一股脑倾倒下来，把他淋成了可笑的落汤鸡，不少工协成员呆若木鸡。随后令人窒息的尴尬气氛足足停顿了能有三十秒的漫长时间，科舒茨见状脸色僵硬，附近的伊万诺瓦也手指发麻，直到何塞毫无怒意的勾起嘴角：“谢谢您的赞赏！楼上的人家！”\n当气势汹汹的奥坦堡警察拿着警棍走上了诺弗兰大街，科舒茨暗暗叹了口气，他知道差不多到时候了：“我们还要继续吗？”何塞回头看了看自己这些人手里的可笑武器，又看了看对面的警察，只好不动声色的瞥了科舒茨一眼，声音低沉："
 focus_cyb.4.a: "“还是拉倒吧。”"
 focus_cyb.5: "企业领地"
 focus_cyb.5.t: "企业领地"
 focus_cyb.5.d: "萨拉托夫领，原意指萨拉托夫大公所统治的领地，这个意思非常纯粹简单，圣骏堡也一厢情愿的认为旧贵族们统治的方法非常传统，他们只不过是在领地上认命更多的走狗与亲信巩固统治，然后在屁大点的一亩三分地种上庄稼粮食，像以往那样靠着农业税就能让领主吃饱喝足了，也不需要想其他有的没的事情。\n今日不同往日，随着社会生产力的进步和时代的发展，许多迂腐上了年纪的老贵族不能理解一些新奇的东西，63岁的萨拉托夫是个意外，他敏锐的洞察了资本阶级在社会发展中占据的重要地位和其掌握的强大力量。工厂主和大商人都渴望争取自己的权利并将这种力量拓宽到更广泛的领域，在重商主义和重工主义被相继证明有效后，许多乌萨斯贵族都开始谨慎的对待这一阶层，毕竟高卢的民主革命的思想有很大程度上就源自这一批中产阶级。\n萨拉托夫是与众不同的那一个，他放下了自己传统老牌贵族的架子和权柄，强调资产阶级表现出的无限潜力，他大度的用萨拉托夫领的权利给自己在资本席位谋划了一块沃土。通过出让领地特权，开辟选举制、治理法律化，以及行业资源倾泻，短短数年时间他便从外国乃至乌萨斯各地的流动商人那里获得了无数财富，建立了在市场地位不可动摇的博斯克军工，那几年是火热而璀璨的，正如大公那颗炽热跳动的心。\n不过作为交换，代价就是相当多的领地特权被出让给了各大合伙人以及同盟集团，萨拉托夫领已经沦为了博斯克公司和他们盟友的附庸，本体并不在奥坦堡或者任何一个地方，她的本体是资本——是来自全泰拉军火商的入股和知名商企，他们的投资构成了这个领地的绝大多数财富，那意味着大资本家们绝不会容忍萨拉托夫领倒台，因为那样他们在这片土地的投资都会打了水漂。\n不过萨拉托夫大公不希望其他公司插手领地事务，随着漫长的时间流逝，博斯克公司早就不再是他一个人的东西，他只是最具话语权的那个人罢了。这个公司掌握着无数军火订单，甚至都排到了明年的分量，他完全有能力拿着这个作为筹码与寡头理事会的家伙们谈判，然后把那些早年出售的股权强行收购回来，彻底把竞争者踢出博斯克，毕竟山高皇帝远，那些公司在萨拉托夫领的拿捏下也无可奈何。"
 focus_cyb.5.a: "公爵望着遥远的北山，只是一次次的重复着。"
 focus_cyb.6: "领地时政"
 focus_cyb.6.t: "领地时政"
 focus_cyb.6.d: "公爵不是一个刻板严厉的人，至少所有认识他的领民都这么说，他给予了领地希望和焕发的勃勃生机，时至今日领地的许多民众仍能记起饿肚子的那段岁月，虽然人们仍然度日艰难，但至少现在的生活正朝着美好方向驶去。\n在大规模的工业化将农民的大规模耕地侵占后，许多人被迫开始谋划起其他生路，比如加入技术培训学校然后在半年的学习后掌握复杂机床的使用方法，在流水线上日复一日拼装那些机械。工作时长被提升到了十四小时，不过大多数人暂时没有怨言，因为他们的工资确实也得到了提升和保障。\n萨拉托夫公爵向所有人许诺，在领地的情况严峻的条件下，他需要得到其他人的理解和支持，而领民们也一如既往地支持公爵的政策，因为他比起那些其他地方贪婪而不讲道理的乌萨斯税务官已经好了太多。\n不过这样的情况不能长时间持续下去，在某天下午，螺丝工伊扎特在过度劳累后猝死在岗位上，随后人们在他的家里发现了无数张亟待兑换的欠条还有一些工厂内的丑闻。城市内的小道消息很快就走露出去，然后将矛头直指博斯克公司的联合企业恰尔重工，人们指控恰尔重工在劳动时间和薪酬分配上完全不符合公爵制定的《波尔法案》。\n很快，借由此事，一场场由工协趁乱引发的抗议和游行又开始在奥坦堡弥漫起来，这件事情很快惊动了公爵，但董事会的寡头对此全都各执一词，似乎并不打算因此对工协让步……"
 focus_cyb.6.a: "愚蠢的商人永远不知道收敛自己的贪婪心。"
 focus_cyb.7: "威严"
 focus_cyb.7.t: "威严"
 focus_cyb.7.d: "“你在跟谁说话？”\n“什么——先生……但是！”\n“我问你——我现在是这个领地的主人，你现在是在跟谁说话？”\n萨拉托夫脸色阴沉而肃杀，血红的眼神就像是看着待宰羔羊，让人回忆起荒野上的乌萨斯黑狼，可怕极了。丹尼尔想要解释的话语被完全打断，语塞间隙不得不拼尽全力抑制自己粗重的喘息声，才不至于在逐渐加快的心跳中露出狼狈的表情。\n“肮脏的蠢货！”萨拉托夫恶狠狠的斥骂着，尽管眼前这个人是博斯克公司的重要合作人，也是数个外国大公司的话事人，但他压根不在乎得罪他。\n“你克扣了工人的工资，把所有雇员赶出他们的住处，让他们在肮脏陈旧的环境干活却不愿意付出半毛钱的安全工程，你犯下这些足以激怒神民们的行径，还有什么资格到我眼前来喊冤叫屈？”\n“滚出去！趁着我还没有改变主意让你们彻底滚出我的领地！”萨拉托夫又是一声怒吼，看着在丹尼尔铁青的脸色中后退几步，不可置信的谩骂起来，“你这么敢这么做？萨拉托夫，你知不知道你这是在侮辱恰尔重工，我必须提醒你这对我们的合作可没什么好处。”\n萨拉托夫突然站了起来，指向门外用尽全身力气咆哮道：“滚出去！你听不懂吗！非要我叫卫兵？”\n丹尼尔沉默下来，他这辈子也没有几次被这样侮辱过，像是一条丧家之犬被呵斥着赶出房间，只好咬牙切齿道：“……这么干没有好下场，你会后悔的，我是否可以理解我们的合作到此为止？”\n“哥伦比亚人，随你的便。”萨拉托夫隐隐冷笑，目送丹尼尔离开房间，扯了扯自己的领带然后坐下，翻开了自己的记事本在上面勾掉了恰尔重工的名字，然后仔细想了想，又在上面勾掉了其他几个子公司的名字。三天后，所有恰尔重工所属的工人都得到了他们拖欠已久的薪酬。"
 focus_cyb.7.a: "可笑的贪婪蠢货。"
 focus_cyb.8: "给予感染者保障？"
 focus_cyb.8.t: "给予感染者保障？"
 focus_cyb.8.d: "彼得·潘拉利懊恼的抬了抬自己的眼镜，作为奥坦堡审查局的首席部长，他有些疲惫的目光扫向桌面上的文件，实际上，他根本没有什么审查的权利，整个领地从大事到小事无疑都是由博斯克公司所主宰，他唯一要做的就是在看完内容后盖上自己的印记。\n这种事情做多了，他也变得越来越麻木，至少不会像刚开始一样心怀怨恨和不满，博斯克只会往自己腰包里塞钱的某些混蛋他早就见怪不怪。\n但这次彼得皱起眉头，因为他第一眼就看到这张纸上写的是有关于为感染者提供医疗保障的相关文件，上面明确规定对于感染者应该许诺并给与一定程度上的医疗支持，这些医疗的全部费用（包括一些药物、杂费和其他必须的住院费，以及十分透彻的明细分列清单）都应该由萨拉托夫政府承担，并且登记在账作为全年预算的一部分，彼得看完这些还以为自己读错了，或者是出现了幻觉。\n他在仔细盯了好半晌后，突然站起身叫来了送这封文件的信使，问了他到底是怎么回事，随后信使很郑重的回复道：“这是萨拉托夫公爵的亲笔信件，还有什么问题吗？”\n“呃……不，没有了，我只是想问问公爵大人真的没有出现笔误？”彼得狐疑的看着信使，他不敢相信的问道，“要给感染者建立这种保障制度，我们的隔离区可要忙碌起来了，而且……”\n“是的，公爵大人明确强调了这份文件的重要性。”信使打断了他的话，又轻描淡写的拍了拍肩膀上的灰尘，然后房间里陷入了死一般的沉寂，彼得张了张嘴，没能说出半个字。看来以后他要重新衡量感染者在领地内的地位了。"
 focus_cyb.8.a: "至少对于感染者来说这是一个福音。"
 focus_cyb.9: "暖阳"
 focus_cyb.9.t: "暖阳"
 focus_cyb.9.d: "夜深了，外面皎洁的月光照射在同样晶莹的萱花玻璃上，在眼前映衬出宛如水晶琉璃般的效果，华丽而美好。\n博罗尔扎诺孤儿院，这里收容着800名整座城市内无家可归的孩子，奥坦堡政府授权为这些慈善机构提供相应的财政补助和支持，这种情况自波尔法案实施以来已经持续了两年，可以预见未来仍然会持续下去。\n伊万·柯里亚耶维奇好奇的注视着门外的一颗高耸的白杨树，借着明亮的月光勉强能看到笔直的树干上栖息着无数漂亮的蓝色羽兽（泰拉世界的飞鸟代称）伊万认真的观察它们的一举一动，包括舒展翅膀的动作和嘴喙的模样，这对于一个七岁孩子来说也是十分有趣的事情。\n柯里亚耶维奇是幸运的，却又是不幸的，说他不幸是指他年幼家庭便遭遇大难，父母都在一次严重的工业事故中丧生，他也很不幸的罹患相当严重的矿石病。说他幸运是指他生在了萨拉托夫领，而大公本人开明的感染者政策显然对他这样的孩子十分友好，至少不像其他地方的一些领主那样粗暴。\n康斯坦丁兴高采烈的走进了房间：“孩子们，都出来。”孩子们转过头，伊万叹了口气，有点不情愿的跟着转过身，就看到平常和蔼的康斯坦丁叔叔像往常一样将热毛巾拿了出来，然后为每个可爱的孩子擦拭手掌和身体。\n“一会儿你们要去做身体检查，记得要有礼貌。”康斯坦丁严肃的朝着每个孩子叮嘱这么一句，轮到柯里亚耶维奇时，他忍不住在嘴里嘟哝着，“先生……为什么我们每天都要做这样的身体检查？我得了很严重的病吗？”\n“是的孩子……”康斯坦丁一愣，随之而来的是纠结，他不知道要怎么跟孩子解释诸如“血液源石浓度”这样的事情，而这些监测手段很大程度上也只是为了确认这些孩子的状态，并不会起到什么真正的治疗效果。每次夜深人静之时，康斯坦丁都会隐约听到楼下的孩子们因为矿石病而痛的哭喊的声音……神民在上，那是多么令人倍感无力又哀伤的场景，他十分想为这些孩子做些什么。望着男孩天真的目光，康斯坦丁从一阵阵晕眩中回过神，鬼使神差说："
 focus_cyb.9.a: "“别担心，你的病不会有事的。”"
 focus_cyb.10: "拦腰截断"
 focus_cyb.10.t: "拦腰截断"
 focus_cyb.10.d: "“提高10%？你是认真的？”尼克的表情怪异起来，他今天被萨拉托夫找上门谈及有关领地的税务问题，他打算将针对哥伦比亚的外企公司加征关税，直接达到25%的地步。这让他十分诧异，政府应该还没到这种缺钱的要紧地步吧？这会得罪几乎全部领地的外资。\n萨拉托夫似乎并没有听出尼克语气中的担忧和质疑，他自顾自的解释自己的政策：“那些哥伦比亚的吸血虫不可信任，他们唯一的目的就是把厂子越来越多然后压榨奥坦堡民众的血汗钱，我们只是防止那些外国人拿走我们的财富而已，况且现在是他们需要我们，而不是博斯克需要他们。”\n尼克嬉笑起来，他做了个好笑的无奈表情：“您瞧，公爵大人，如果不是了解你的想法，我还会以为你是一心为工人们着想的大善人呢。”他说完若有所指的补充道，“为了工人们的待遇去得罪哥伦比亚的大企业可没什么好处，他们如果真的中断合作……”\n“那我们也没有什么好怕的。”萨拉托夫摆了摆手，靠在真皮沙发上：“你要知道这个世界上从来不缺战争和厮杀，博斯克的枪炮才能代表未来，而不是那些蝇营狗苟的烂人。”\n尼克点头承认，让人看不出他的想法，但谁知道呢，他在几天后就完美按照公爵的意思解决了关税问题，看起来不少哥伦比亚人要难堪很长时间了。"
 focus_cyb.10.a: "真抱歉，外国的利益不在我们的考量范围内。"
 focus_cyb.11: "外资抗议"
 focus_cyb.11.t: "外资抗议"
 focus_cyb.11.d: "哥伦比亚人对我们近日以来的做法相当愤怒，萨拉托夫公爵在私人房间见到了怒气冲冲的黑钢国际话事人。他面红耳赤的向公爵说明了他们不能接受这样的关税额度，其他的哥伦比亚企业也大差不差，话事人认真请求公爵能够再三考虑这件事。\n萨拉托夫爱答不理，他半闭着眼睛，用仄斜的目光打量着看起来有点可怜的话事人：“命令已经下达，政令已经签署，现在没有什么事情值得我收回我说出的既定事实。”\n“黑钢国际在博斯克这里已经赚取了不少东西，这些年我也没有亏待你们的投资，如果认为这个现状无法接受，可以考虑退出奥坦堡的生意，我们并不一定非要合作。”公爵低笑起来，用犀利的几句话就让黑钢话事人哑口无言。\n半晌，房间内沉闷的空气被对方打破，话事人似乎松口妥协了，他尽可能用委婉语气的表明了自己不想终止合作的意愿，黑钢分部可以用其他手段换取关税豁免——接下来只需要萨拉托夫自己选择需要什么。\n公爵的目光再三闪烁，随后他开口了："
 focus_cyb.11.a: "“那么……领地需要黑钢的武器技术。”"
 CYB_black_iron_equipment: "黑钢国际的技术"
 focus_cyb.11.b: "“我需要黑钢在政治领域给予帮助。”"
 focus_cyb.11.c: "“不需要，如果不能接受新的关税额度，我们的合作就此终止。”"
 focus_cyb.11.tt: "黑钢国际终止了与领地的合作。"
 focus_cyb.12: "新设施投资"
 focus_cyb.12.t: "新设施投资"
 focus_cyb.12.d: "今日黎明，萨拉托夫匆忙赶到奥坦堡议事厅，随身只带着他的书记官和侍从，他一进门就让其他政府人员都神经兮兮的，嗅觉灵敏的一些职员已经明白公爵大抵又要来宣布新的政令了。\n果不其然，公爵找到了头疼不已的尼克，兴奋的将自己雄心勃勃的新投资计划表递给了他，尼克皱起眉头看了几眼，上面是有关于年久失修的公共设施，萨拉托夫打算拿出部分政府预算去三号城区解决这些问题——这几乎是打算建立新城区所需的钱了。\n“大公先生，这基本上意味着老城改造和翻新，我们至少需要50亿以上的投资才能完整把奥坦堡改造一遍。”尼克苦笑着解释道，他知道公爵煞费苦心的目的是为了拉动经济内需，但这种大型的公共项目也足以让政府面临财政窘境，“我们是不是需要从长计议？”\n“不着忙，尼克，你知道博斯克和其他财团都对奥坦堡这块宝地看得上眼，那些房地产商早就想在这里赚得盆满钵满了。”萨拉托夫笑了笑，继续说到计划的筹款细节，“去联系吧，我希望看到这份建设方案在下个月就开始实施。”\n公爵说完，背过手自顾自远去，一如既往地威严冷漠，只留下愁眉苦脸的尼克和哀嚎的领地公务员，刚才那番谈话意味着下个月不会轻松了，至少他们不会有什么加班费。"
 focus_cyb.12.a: "乌萨斯很冷，但奥坦堡依旧热火朝天。"
 focus_cyb.13: "繁荣之路"
 focus_cyb.13.t: "繁荣之路"
 focus_cyb.13.d: "让自己的人民度过一个暖冬，让他们丰衣足食，让他们感受来自君主的善意和关怀，让乌萨斯的土地上载歌载舞，这是不少人心中的理想世界。但作为统治者却不尽然，叙拉古著作《中陆君主论》里面对这种行为做出了警告，一旦你的人民吃饱，很可能等待的是永无止尽的贪婪和索取。\n这种观点不无道理，人们的需求和欲望永无尽头，就像是北境大地的十月飞雪，白茫茫的看不到边，大多数人不会去想你已经做了什么，而是去指责你为什么不去做什么——因此疲民政策在整个50年代受到欢迎，领主们应当让自己的领民保持在贫困和饥饿边缘那个交界线上，这样他们既能看到生活的希望，又会迫于现实原因无力反抗他们的领主。\n试看整个乌萨斯，只有萨拉托夫才能有这样的情况出现，自波尔法案实行开始，通过抬高关税控制外贸，扶持本地化产业并打击豪绅，大范围升薪，建立社会保障制度都初具成效。曾经落后贫穷，毁于战火的奥坦堡已经焕然一新，人们安居乐业，如同乌萨斯平原上一颗美丽的珍珠，傲然屹立在无数山脉的东方。\n“市场上的商品确实多起来了，你的努力不无成效啊，老伙计。”威尔欢快的笑了笑，他坐在沙发上，拿着自己喜爱的那根大烟斗抽了一口，给萨拉托夫倒了满满一杯的伏特加，“还有谁能对你的治理感到不满？”\n“是啊，希望这份繁荣能永远持续下去。”萨拉托夫沉默片刻，并不直接回答，公爵只是面带笑意瞧着自己的杰出作品——奥坦堡的核心城风景比世界上任何的美丽画卷还要珍贵。他一生只有这两个最出色的成就，第一个是建立博斯克公司，第二个就是经营属于他的萨拉托夫领。\n路德加·威尔笑了笑，举起杯子与他相碰，他的语气似乎意味深长：“肯定会的，大公阁下。”"
 focus_cyb.13.a: "富强的领地总好过贫穷和压榨。"
 focus_cyb.14: "贵族和资本"
 focus_cyb.14.t: "贵族和资本"
 focus_cyb.14.d: "萨拉托夫从始至终明白，他对公司的控制力并不是完美无缺的，这是一场场的交易和利益博弈才换来的今天。\n对于博斯克公司来说，他只是拥有最大限度的经营权，但在许多重大事项和人事任命上，他都需要过问领地内的几个大股东，他们是领地内的其他贵族，在公司初期慷慨解囊提供了大量资金，虽然比起那些外资惹庞大资金来说微不足道，不过仍然在领地内的行政事务中有很大话语权。\n某些股东在背地里用自己的特权，肆意妄为的小动作他并不是没有注意到，他只是在最大限度的容忍那些人。萨拉托夫眯着眼，公司的腐败无处不在，那些混账现在已经沦为了只会往自己的钱袋子里装钱的懦夫，每每看到这些事情都只能睁一只眼闭一只眼，但不代表他不在意。\n很难说领地的本质是不是包装成政府的企业，但最起码在经济上是如此了，如果失去博斯克提供的经济支撑，那领地的未来也就无从谈起。他需要谨慎的考量自己的行动，在适当的情况下终结那几个把持着特权的公司寡头……铲除掉支持他们的党羽，然后把博斯克真正的变成属于乌萨斯的瑰宝。\n萨拉托夫如此想着，他不能让董事会逐渐消沉的意志毁了博斯克，他从抽屉里拿出白纸，简单的将笔粘上墨水。然后开始试着拟定在他本次任期内最后半年里要执行的公司方略，这会让大多数人满意，以保障他在公司内的威严。顺便让那些人麻痹大意，为他接下来的手段铺垫道路。"
 focus_cyb.14.a: "谁能代表公司，是我还是他们？"
 focus_cyb.15: "向敌人出售武器"
 focus_cyb.15.t: "向敌人出售武器"
 focus_cyb.15.d: "博斯克公司的名望辗转各国，公司轰鸣转动的齿轮让安德雷特·埃玛隆的名号也随即响彻这片大地，有人对这个小个子黎博利人的第一印象就是微不足道的投机分子，如果这样想那就大错特错了，他兢兢业业在博斯克公司打拼的几年里已经坐到了仅次于威尔与萨拉托夫的位置上。\n他自80年代开始就不遗余力的支持萨拉托夫大公和他的事业，迄今为止已经将家族地产全都染印上了博斯克的印记。也有人讥讽他是“屈膝贵族”，是不正当的贵族身份，但没有人能够否认埃玛隆在这个过程中赚到了难以置信的财富，他精明的操纵着公司的财务管理，那会是一些愚蠢的家伙无法想象的天文数字。\n“大叛乱结束后我就说过这行不通，全面向乌萨斯各地开放军火贸易？你真的确定？领地南边的一些臭虫还有土匪可无时无刻不想把我们撕碎。”埃玛隆眯着眼睛，吸了几口沉闷的空气，生气的敲着桌子吼道，“如果说给维多利亚人卖军火还能忍受，那么向第八集团军提供武器就大可不必了吧？”\n萨拉托夫和颜悦色，他不想跟埃玛隆进行无谓的争吵：“公司的股东们一致认为近年来仅依靠中陆贸易已经支撑不了愈发庞大的领地开销，如果我们要维持每年10%的高昂分红，就不得不开辟新市场。”\n“还是说你情愿得罪董事会也要在这个问题上一意孤行？”萨拉托夫观察着埃玛隆糟糕的脸色，对方陷入沉思当中，公爵的话锋渐稳，“或许我们都该好好想一想，周围到底是不是有那么多敌人值得提防，这样的贸易封锁已经持续了太久，我们不可能一直孤立下去。”\n埃玛隆疲惫的扶了扶额头，他知道自己说不过这个老家伙，只能郑重的警告公爵：“我只知道把最先进的大炮卖给别人会有问题，尤其是当对方不打算跟你好好说话的时候，而你这个时候应该考虑的不应该只是董事会的心情，还是说选举已经把你逼到不得不这样做了？”\n“哈，为什么你会认为这跟选举有关系？”萨拉托夫反问道，他的语气沉稳，一再强调：“这都是为了我们共同的利益，不是么？”埃玛隆听完沉吟良久，随后不屑的轻轻嗤笑几声。"
 focus_cyb.15.a: "“不要玩火自焚，大公阁下。”"
 focus_cyb.15.tt: "我们将解除对周边地区的军火出口禁令。\n所有东乌萨斯地区势力都会收到我们发出的信息。"
 focus_cyb.16: "航线保障"
 focus_cyb.16.t: "航线保障"
 focus_cyb.16.d: "当大叛乱的战火将整个乌萨斯撕裂，第六集团军的叛乱在皇帝的意志下灰飞烟灭之时，未来会怎么样还是一个未知数，绝大多数贵族被流放到偏僻无垠的雪原上，包括那些不听皇帝掌控的集团军，当时有人曾经做出预言，乌萨斯的贵族制度随着这一变故彻底土崩瓦解了。所有贵族的荣光也随之寿终正寝。\n有些人在悲愤绝望中含恨自杀，也有不屈者带着对皇帝的恨意苟延残喘，随时准备裹挟着怒火对西乌展开一场所谓的「清洗之战」，萨拉托夫领地南边的第八集团军就是这样的一个可怕存在，有时经常让人捉摸不透，绝大多数军官和士兵都抱着对圣骏堡难以想象的仇恨，他们在大叛乱中几乎都有亲人死去，那张令上百万人丧命的悲剧仍然令许多人记忆犹新。\n第八集团军的长官艾蒂安·尼古拉斯与萨拉托夫领地的幕僚库鲁·尼克，今日在靠近边界的古雷索斯瓦夫会面，在那里他们深刻的商讨了有关近期提出的航道问题——艾迪安明确反驳了萨拉托夫领开放边境航线的要求，并转而在会谈上谴责了奥坦堡并没有履行对第八集团军“本应该履行的职责”。\n“真可笑，我们可没有义务给他们提供任何一枚弩弹，艾迪安那个古板愚蠢的大脑袋难道只剩下对皇帝的愤怒了？”库鲁·尼克回来后跟萨拉托夫如此抱怨，他诉说了在会议上艾蒂安的傲慢无礼，对方没有在贸易问题上有任何谈判的意愿。\n萨拉托夫轻蔑的冷笑几声，他最喜欢对付像是艾迪安这样脑子一根筋的混球，他都不需要做什么其他的高明手段，只需要在边境彰显奥坦堡军队的威力，这些人就只能灰溜溜的给他们打开前往中陆的大门。"
 focus_cyb.16.a: "无需废话，让大炮替我们发言。"
 focus_cyb.17: "火炮之威"
 focus_cyb.17.t: "火炮之威"
 focus_cyb.17.d: "库鲁·尼克现在的心情简直快要爽上了天，可笑的是就在上周，他还在古雷索斯瓦夫惨遭羞辱，第八集团军的狗杂种全都趾高气昂好像是什么古代神王一般在他面前高谈阔论，好像下一秒就要将他踩在脚下摩擦了。但现在呢？瞧瞧着这些脸色黑如猪肝，一个个自诩强者的小人怎么变成这副这样灰头土脸的样子？\n博斯克大炮的威力让第八集团军畏惧如鼠，我们可以从数十公里外轰击消灭尚在集结中的敌军，乌萨斯的“帝国火炮先兆者”控制着所有空域，他们毫无机会，只能在恐惧之中被天空降临的审判之火消灭，哈，真是大快人心！\n尼克冷笑着，缓缓盯着艾迪安用军大衣擦了擦手上的汗水，然后在他的对面落座：“很抱歉，尼克先生，上周我们针对维多利亚航线的会谈有很多欠妥的地方，现在我们可以重新考虑这些事情。”\n“哈，我记得参谋长先生上周可不是这么说的。”尼克瞥了他一眼，阴阳怪气的从秘书官那里拿来会议日志，“来吧，我瞧瞧——上周开出的条件，这周可不是这么回事了。”\n艾迪安咬牙切齿，他的脸色如同一尊朽木般僵硬难看，他越是表现出这种难以忍受的样子，尼克就愈发刻意的延长这美妙一刻。随后他们起身，虚伪的握了握手，彼此宣布乌萨斯兄弟的情谊不会随着小小摩擦而有任何改变。\n三天后，整个萨拉托夫领地沉浸在狂欢中，随着第八集团军的屈服，萨拉托夫陆行舰队被允许通过格奥尔良斯克，中陆航线洞开无阻，尼克也在议事厅中通知了大公这个好消息。"
 focus_cyb.17.a: "属于博斯克和全体奥坦堡人的伟大胜利！"
 focus_cyb.17.tt: "我们的信使将会通过中陆航线前往各国，构建军火销售的网络。"
 focus_cyb.18: "火热的氛围"
 focus_cyb.18.t: "火热的氛围"
 focus_cyb.18.d: "费尔南迪军工厂内热火朝天，泰拉世界最可怕的重型火炮在那些流水线上被加工出来，修长的炮管被打磨的光洁如新，宛如山间出产的上好美玉，这座工厂实施着令人麻木的十六小时工作制，这样让人倍感麻木的工作强度未免为人诟病。何塞的工人协作联盟不止一次要求领地在这件事情上做出改变，但不论是抗议还是游行均以失败告终。\n闸刀碰撞和齿轮转动的激荡声折磨着每个工人的内心，他们一方面对这种疲惫不堪的工作深恶痛绝，但另一方面又舍不得这份不菲的薪水和绝佳的升迁路线。与其他地方不同，萨拉托夫大公许诺工人以良好的待遇，每个人在工厂里工作三年都有可能得到提拔，尽管工作时间苛刻而且难以忍受，但他们能从哪里找到轻松又赚钱的其他工作呢？\n因此，工人们反而害怕的是工人协作联盟真的搞出什么乱子，有人在工作时特别在机器和炮管上写上自己的名字，后面的署名也会附加上一句“非常好工作，爱来自萨拉托夫。”这样的事情变得普遍后，工厂里的环境也就尽显幽默风趣，人们讨论着源石工业广阔的前景和充满希望的未来。\n高工时，高负荷，高待遇，这是博斯克军工和萨拉托夫大公制定的基本方针政策，所有懒虫和不愿意出卖劳动力的穷鬼不应该呆在这里，去荒原上怨天尤人等待救世主或许更适合那些异想天开的家伙。"
 focus_cyb.18.a: "懒鬼！工作十六小时是你们的荣幸！"
 focus_cyb.19: "倒塌的障壁"
 focus_cyb.19.t: "倒塌的障壁"
 focus_cyb.19.d: "53号政令上对于感染者作出了新的指示，上面明确规定并赋予了感染者拥有与其他人对等的公民权，无论是在生活起居还是工作任用方面，任何人都不得对感染者身份有任何主观上的歧视，这一条例也被写入了《奥坦堡领民法》中，这几乎跟乌萨斯宪法中规定的某些感染者管理法背道而驰。\n这意味着进步和繁荣？这象征着未来乌萨斯将会朝着接纳感染者的方向改变？萨拉托夫大公今天在奥坦堡的演讲振奋人心。\n他用不疾不徐的语速向所有人描绘了一个无与伦比的新乌萨斯，在那个国度里，经济繁荣，社会进步，任何人都能在自由宽泛的法律体制下找到人生的意义。那是一个泛民主化的新国度，在充沛的市场竞争下洗去旧帝国陈旧的阴霾，带来宛如雨后的大草原相似的勃勃生机。\n“我们不要一千万死尸，也不要什么四处破坏稳定的稽查队，现在我们要做的就是骄傲的在日光下展露你们皮肤上的源石，然后骄傲的告诉所有人，你是萨拉托夫领地最宝贵的公民！”\n当公爵的演讲落幕，现场如同雷鸣般的掌声伴随着喜极至泣的欢呼，人们蜂蛹而至，疯狂的冲过卫兵只希望靠近大公，与他握手，并感谢他为感染者所做的一切，感染者隔离区被拆除了，我们只能祝愿未来的道路一切顺利——并寄希望于宽容的感染者方案不会让我们追悔莫及。"
 focus_cyb.19.a: "感染者将自由的拥抱每处空气。"
 focus_cyb.19.tt: "野蛮的管理制度终将消散于原野。"
 focus_cyb.20: "私谈"
 focus_cyb.20.t: "私谈"
 focus_cyb.20.d: "这座晶莹的小小坟冢位于奥坦堡的东郊，那件事过去很久很久了，很少有人知道这个地方，那里常年有一个无人居住的小房间。\n萨拉托夫带着忧伤而悲悯的情怀轻轻拭去墓碑上的灰尘，很少有人知道公爵在奥坦堡寄予了另外一份深厚情感。除去繁杂的政务和公司内的许多杂事占用的时间，公爵闲暇之余就会来到这里悼念他唯一的女儿塔里娅，她在大叛乱中被“皇帝的利刃”所杀，萨拉托夫永远都忘不了那一天在尘土飞扬的天际中消散的女孩。\n墓碑旁的杂草又生长出来，年复一年皆是如此，萨拉托夫将这块地细心打理，在墓碑旁的荒野开辟了几块田地。上面种满了不知名的野菜，每逢春季这里都会出现漫山遍野的迷途花，像极了过去圣骏堡的欢笑岁月，或许没有人能从公爵的笑意中体会到那份情感，但公爵凝望着圣骏堡的深邃眼神却不会骗人。\n“你果然在这里，这么多年你都没有谈及复仇的愿望？”墓碑旁，威尔捻着胡须，神色复杂的盯着萨拉托夫的脸，他沉思良久，又斟酌其词，“那天执行任务的皇帝内卫具体是谁，我还没有查到，但想必皇帝肯定对此了如指掌。”\n“你应该明白，没有皇帝的命令，塔里亚大概率不会死。”他继续说道，希望沉浸于思索的萨拉托夫能改变心意。\n“我对皇帝只剩厌恶，他是死是活对我而言都无关紧要。”萨拉托夫起身拍了拍自己外套上的灰尘，“复仇从来不是我剩余人生中的唯一念头，现在不是，过去不是，相信将来也不可能是。我所要做的只不过是亲手摧毁古板的旧帝国。然后按照我的心愿亲自重塑乌萨斯大地。这么多年了，你难道还没有明白我的心？”公爵说完，默默念诵起了经书中的悼词，让这里尽染哀伤之意。\n威尔神色复杂，就算萨拉托夫不认为这是皇帝的错，他也不能容忍那个施以暴行的皇帝内卫继续活着。他会用千百倍的怒火让那个混球后悔出生，无论公爵怎么想。"
 focus_cyb.20.a: "血债血偿，什么都不能掩盖这一事实。"
 focus_cyb.20.tt: "威尔相当固执……他终有一天会清算圣骏堡的愚者……"
 focus_cyb.21: "寡头斗争"
 focus_cyb.21.t: "寡头斗争"
 focus_cyb.21.d: "领地的行政机构高度被博斯克公司所捆绑，主要是由股东组成的董事会把持着领地的方方面面，这种决策权的垄断已经给许多人带来了相当多的困扰。比如说不合理的劳动时间和劳动强度，再比如说肆意改变人事任命，公然将重要的政府职位通过买官弼爵的方式转变为私产……而且只要有人稍有什么事情不顺董事会的心，就会得到一张强制警告，长此以往领地的沉沦是迟早的事。奥坦堡不能自甘堕落，臃肿的行政现状必须得到改变了。\n萨拉托夫没办法立刻消除董事会对领地各个方面的影响，他没有这个影响力能推翻其他合伙人的意见，虽然威尔和尼克这两个老朋友可以不遗余力的支持他，但他们在其他所有人的反对声中依然太过渺小。\n为此，公爵决定从其他地方下手，将目标瞄准董事会的爪牙们，全力打击领地内出现的乱象，《皮斯克条例》正是为此而生的，这份条例出自萨拉托夫的手笔，详细规定了领地内的工作制度和部门改组方针。他所有的步骤都有迹可循，而且对博斯克有切实利益，董事会即便感到不满没有任何理由反对。\n萨拉托夫一直都相信劳资关系的重要性，这份条例能让领地实现长治久安，阶级合作的好处可要远远大于阶级斗争，合作共赢才是资本流动迄今为止的最高境界，即便让利给工人也好过像是某些疯子般的感染者一样，要从他这里讨什么债……那可太不妙了。"
 focus_cyb.21.a: "有人总是不明白，细水才能长流。"
 focus_cyb.22: "秩序之始"
 focus_cyb.22.t: "秩序之始"
 focus_cyb.22.d: "从古至今，没有任何国家能在一窝乱的情况下获得成功，做任何事情都需要规则，无论那个规则是好是坏，无法用统一的信条组织起队伍绝对会导致灾难性的后果。\n奥坦堡的工头制度已经持续了三年了，这帮助领地从那一无所有的困顿季节逐渐恢复过来，但长时间的高强度劳作无疑会降低工厂效率。尤其是考虑到越来越多的工人开始对这样的制度感到不满，大公下令对工头制度进行改革，两班倒的轮换制度无疑是最适合目前人力充沛的奥坦堡，既能保证费尔南迪军工厂不至于停工，也能让工人们感到满意。\n萨曼兴奋的看着今天工厂上传来的消息，几个工友告诉他好日子快到了，最近政府发布的文件告诉人们工厂可以采取轮换制度，虽然疲惫的流水线作业仍然不会停止，但至少他们能够得到更多的休息时间了。\n好事多磨，相信未来的生活总会更好，萨曼思绪至此，满意的在轮换制的申请表上填了“晚班”，几个工友嬉笑着打趣，怀疑他们很快就会爱上新的工作表。"
 focus_cyb.22.a: "能提高效率的方法就是好方法。"
 focus_cyb.23: "谈判"
 focus_cyb.23.t: "谈判"
 focus_cyb.23.d: "诺弗兰街317号，萨拉托夫在私人公寓里再次会见了何塞·佩尼亚里埃塔，这个被许多政府官员看做是流氓恶棍的民主党派领导者，领地内诸多的恶性事件都由他们煽动而起，虽然很难承认，但何塞本人的影响力在某些支持他的工人群体中仍然占比极大。所以政府并不希望通过暴力取缔这个政党。\n“我们丝毫不怀疑工人在工厂里工作的合法性！但是你现在……嗝！你现在根本就是在胡来……嗯……？你说对不对……十六……十六个小时啊……驮兽都他妈没你这样……嗝……这样使唤的！”\n萨拉托夫满脸不悦，他强忍着自己心下的恼意，原本以为那些醉汉之类的说辞都是谣言，没想到何塞居然真的拿着一瓶伏特加喝的醉醺醺的就过来了，这个玻利瓦尔佬当真以为自己不敢处置他？这也太不把奥坦堡议事厅放在眼里了！\n“请你注意一下，我们现在谈论的不是工时问题，而是赐予劳动标兵荣誉称号的问题，如果工人协会不打算组织这件事，难道还要我去找别人吗？”萨拉托夫不悦的扯了扯领带，他突然一阵好笑，暗暗猜想是不是所有地方的工会都只能充当这样的作用。\n“放屁！”何塞怒目圆睁，好像听到了什么好笑的事情，然后一抬额头开始大发酒疯，“什么荣誉工人？胡扯！全都胡扯！那就是一群背叛了工人的恶贼！他们全都不应该出现在工厂里为你卖命！”说完何塞失落的笑了笑，似乎又消沉下来，手腕一歪将伏特加往嘴里送。\n“……那我们就是没必要谈下去了？”萨拉托夫似笑非笑，这个醉汉的行为丝毫不能让他生气，相反这类行为让他感到无比安心，这证明领地内唯一让他无法掌握的反对派领袖，竟然只是一个无端就会喝的酩酊大醉的废物。\n“当然，没法谈……嗝！”何塞摇头晃脑，嘴角浮出轻蔑的笑意，转过身里倒歪斜要打开大门，“你自己去看着办吧，萨拉托夫，工人协会不会跟你们合作了，反正你也一直……嗝！没瞧得上工会不是？”"
 focus_cyb.23.a: "真可惜，他们不会合作的。"
 focus_cyb.24: "新部门"
 focus_cyb.24.t: "新部门"
 focus_cyb.24.d: "博斯克军火公司的部门分类极其冗杂，从人事部和销售部再到财务部以及管理部，每个部门都存在大量闲置人员，这些人绝大多数都在董事会添加的职位上工作，在某种意义上与董事会的裙带关系密不可分，已经成为了公司目前最大的毒瘤。\n根据统计，仅仅是五十多个冗余部门就带来了至少超过三千名员工的不必要开支，长此以往公司的吸血虫群体也会越来越多，那些本应该转化为更积极的正面效用都被某些人给浪费掉了，这显然不是公爵所能容忍的现状。\n萨拉托夫在董事会上谈及部门改革，提出将几个无用的部门合并，但仅仅是这样就遭到了剧烈反对，除了威尔和尼克，几乎所有寡头都在反对他整顿部门结构的意见，公爵心知肚明，眼前这几个人所想的事情跟领地的发展丝毫不相关，他也没必要继续给他们脸色。\n“但是名单上的很多人已经给公司财政带来了压力，有时甚至不得不用领地的赋税进行补贴。”萨拉托夫如此施加压力，“如果董事会不同意我合并一些部门，我也只能考虑大规模裁员。”\n这话一说出来，圆桌上的气氛陡然间变的火药味十足，几个董事会上的大寡头，比如说安德雷特·埃玛隆，查尔斯·怀特曼，德米特里·莫佐列夫斯基，还有尤格斯拉夫·拉济奇几个人全都用审视的目光打探着萨拉托夫的脸色。\n“有什么必要这么做吗？”德米特里如此发难，“公司财政还很健康，部门运转也全都正常，这样大费周章去搞部门合并？这会不会搅乱原本年初制定的既定营业目标？”萨拉托夫心下轻蔑，直勾勾的盯着他的眼睛：“您知道最好的经营手段就是不断革新自身，如果你不懂，那最好就不要说话。”"
 focus_cyb.24.a: "德米特里愣住了，那一瞬间他看见了某种可怕的东西在公爵身上闪动。"
 focus_cyb.25: "效力至上"
 focus_cyb.25.t: "效力至上"
 focus_cyb.25.d: "公务员是政府部门的基层干部，也是大多数人走行政之路的起点，很少有人能说自己在起初就成为什么核心部分的领导者，绝大多数人都需要踏踏实实从基层干起。\n公务员的工作很繁杂，虽然并不忙碌但几乎什么都要做一些，应付咨询，领地政务报告，提交领地新一年的税收报表，艾米丽已经习惯了这样平静的生活工作，在奥坦堡他能感受到为数不多的美丽夕阳，这种日子也算不错。\n不过好运从今天结束了，艾米丽刚刚喝完咖啡，决定把近日自己的工作报告上交给负责人，一个职员冷冷的拍开大门，不同寻常的感觉从他的身上传了出来，然后所有人都不自觉的停下了自己手边的工作。注视着这个冷冰冰的家伙走到了房间中间的位置。\n“艾米丽……佩昂，姆杰拉克，你们几个出来。”职员冷冷喊道，艾米丽饱含困惑的跟着走出房门，在门外她和另外三个人都感到了天崩地陷是什么意思。\n“除名？为什么？”艾米丽委屈的抬起头，她认为自己没有所错任何事情，为什么要这样做？那她这几年在奥坦堡的奉献都算得上什么？还会有养老金和保障可言吗？身心坠入深深的冰窟当中，她几乎眼里含泪，只听对方冷漠的言语再次穿透了她的心，“很抱歉女士，但是这是公爵本人下达的行政令。”\n“你在政府中的年终绩效太低了，而末尾几名会被淘汰。”这个职员说完，伸出手要求艾米丽摘下自己的公务员徽记，她的眼前一阵天旋地转，不知道是怎么颤抖的将自己胸前的徽记扯下来的，“是……是的……我……是我的能力不足……对不起……真的对不起。”\n艾米丽一路摇摇晃晃的回到家，她不知道自己在被子里面哭了多久……但直到昏睡过去为止，她都在想过去的三年里她所得到的和失去的东西……现在没了工作，她还要怎么养活自己呢？"
 focus_cyb.25.a: "淘汰制度必须存在，否则无人会尽心尽力。"
 focus_cyb.26: "乡村轶事"
 focus_cyb.26.t: "乡村轶事"
 focus_cyb.26.d: "“萨拉托夫大公万岁！”\n手持长枪的卫兵一字排开，奥坦堡“马克米安”师作为公爵的亲属近卫队，士兵基本上全都清一色身穿黑底红纹制服，下身配上棕黑色长裤，将手里的武器笔直的伸向天空，犀利的目光注视着公爵的车辆从眼前缓缓开过。\n萨拉托夫与威尔乘车前往距离奥坦堡不远的斯拉迪夫乡村视察，大公主动下访是一件稀奇的事情。这里是距离移动城市最近的地区，对于绝大多数奥坦堡人而言，他们这辈子可能都不会有太多离开移动城市的机会，但公爵很喜欢在闲暇之余走出城市，到领地外面巡视，看一看荒野居民的生活。\n“这里的村长已经被撤换了，先前的那个是查尔斯安排过来的混球，仅仅一年就贪了两百万政府的预算经费，这还只是冰山一角，我挖出来的其他东西还不知道有多少。”威尔嘴角含笑，如此说道。\n萨拉托夫心情大好，点了点头示意自己知道了，他看着村庄的大片农田和修的整整齐齐的篱笆，打算在这里停车下去走走，有卫兵提出为了保证安全应该提前清空场地，公爵允诺了。\n村庄里的人问讯全都从家里跑了出来，自从奥坦堡迎来了新主人，他们的日子并不算好……博斯克军工对周围村庄的压榨比起传统贵族有过之而无不及，稍有劳动能力的青壮年都在法令下被强制送进了工厂，因此大多数人对城里来的大人物没有多少好感。\n萨拉托夫感叹于村民们的冷淡，也甚至自己不受欢迎的现状，只好扫兴的铩羽而归，旁边这个只会拍马屁的新任村长不见得能做的有多么出色，于是萨拉托夫想了想，对威尔说道：“我们应该常来这里看看，希望下一次能看见这里变得比今天繁荣。”"
 focus_cyb.26.a: "村长僵直后背，木讷的盯着公爵的车辆远去。"
 focus_cyb.26.tt: "我们的行政效率有所改善了"
 focus_cyb.27: "晨昏前夕"
 focus_cyb.27.t: "晨昏前夕"
 focus_cyb.27.d: "三十年了，他与威尔已经做了三十年的老友，人生有几个三十年呢？除去那些长生者的寿命，没有多少人能找到纯粹的友谊，绝大多数人都是在生命长河的流淌中互相利用，然后尽可能让彼此更加好过而已。但威尔不是，他是萨拉托夫印象中最值得信赖的人，他把自己全部的话事权都交给了他，甚至是选举的一些重要的准备事项也是他来操办，包括贿赂和拉拢这些见不得人的做法。这在他人的揣测中或许十分大胆，但萨拉托夫显然对此毫不担心。\n落日西斜，奥伦堡的一天结束了，萨拉托夫惴惴不安的看向私人豪宅的大门口，下面的花园泉水叮咚，在清晨是放松身心的好地方，现在却给人格外喧闹的不适感。他等待着威尔的报告，他不想要哪怕半点失败的可能，他希望在选举中完胜，然后众望所归的继续担任博斯克公司的最高掌舵人。\n“大公阁下！”突然大门被轻轻敲了敲，威尔熟悉的声音从门外传出，这令萨拉托夫一瞬间便喜上眉梢，他匆忙直起腰板，“快进来！”\n威尔今天仍旧穿着那身简单的便服外套，拄着附庸风雅的拐棍，嘴角带着清淡的微笑直抒胸臆，朝着公爵道明有关选举问题的第一手消息，他保证董事会将不遗余力的支持自己，并足以将萨拉托夫大公推上领地新一届的执政官位置。\n萨拉托夫欣慰的点了点头，他知道威尔相当可靠，他们的友谊从四皇战争之时就开始了，直到今天他也能想起宝贵的军旅生涯有多少回忆，从圣骏堡到东国，每一次战场上他们都救了彼此不知道多少回。\n威尔倒了一整杯红酒，公爵则举起伏特加，两人的杯子碰出清脆的响声，“预祝公爵阁下的新任期进展顺利。”他笑了笑，萨拉托夫也点了点头，释然又无奈的松了口气，为了乌萨斯，也为了友谊。"
 focus_cyb.27.a: "“再干几年，为我们的友谊干杯！”"
 focus_cyb.28: "败露"
 focus_cyb.28.t: "败露"
 focus_cyb.28.d: "这天深夜，萨拉托夫被人从睡梦中唤醒，他眯着眼睛不满的走下楼梯，在自己的家中见到了匆匆忙忙的库鲁·尼克，他的神色很是焦急，看到不紧不慢的萨拉托夫眼前一黑，险些气晕过去：“你在干什么？”尼克生气的质问说，“你知不知道一些事情？我们正在落入颓势！博斯克的丑闻败露了！该死的，现在那些示威者和那些早就对公司不满的家伙全都抓住攻击点对我们猛烈炮轰！”\n萨拉托夫被他劈头盖脸的一顿咒骂说懵了，他迷茫的瞧着尼克，就像是入学的小学生在开学礼上看着生气的老师。他同样焦虑的接过了尼克递过来的一张冰冷的报纸，借着明亮的灯光，不需要外面寒冷的晚风，公爵也感觉一股冰冷刺骨的寒意从四肢百骸蔓延到大脑。让他打了个激灵，瞬间便清醒过来。\n报纸标题上只有短短的一行字——《奥坦堡大屠杀的真相？博斯克公司和萨拉托夫不为人知的秘密！》\n“他们怎么知道的？他们怎么知道的！我问你尼克！那件事的所有证据都应该在那天被大火吞噬了！”萨拉托夫红着眼睛看完了报道的最后一个符号，然后一拳把报纸敲在了桌子上，咬牙切齿的咆哮着，尼克被吓到了，公爵像头暴怒的雄狮死死盯着他，让他感觉自己的灵魂就要被生吞活剥。\n尼克结结巴巴，他摇了摇头脸色惨白：“我……我不知道……大公阁下……但是人们相当愤怒，他们希望你给出解释，然后董事会也纷纷跟这件事撇清关系，我们已经处在风口浪尖了，选举该怎么办？”\n选举……选举……现在谁他妈还有心思去管什么选举？萨拉托夫不可置信瞪大眼睛，他完了，屠杀领民的暴行在任何时候都不能容忍，更何况那件事是这样恶劣的性质……他眼前一黑，仿佛都能看到死难者的亲属在眼前索命。但他们到底是怎么知道这件事的，他明明早些时候就让威尔……等等……威尔……威……尔？\n萨拉托夫猛然间明白了什么，他抬起头，一遍遍的朝着天花板歇斯底里的大吼起来。"
 focus_cyb.28.a: "“威！尔！你竟然敢...！！”"
 focus_cyb.28.tt: "公众已经得知谁才是真正的刽子手，我们所做的一切功亏一篑，这将会极大程度增加工人不满带来的影响。"
 focus_cyb.29: "断绝"
 focus_cyb.29.t: "断绝"
 focus_cyb.29.d: "“我问你，这是怎么回事？现在就给我一个解释？”在路德加·威尔的公寓豪宅中，萨拉托夫怒气冲冲，尽管让一个63岁的老人能够如此愤怒的场面并不多，威尔还是足够淡定的在泡完茶后才转过头欣赏这位老朋友摆出的十足丑态。\n“我告诉了人们事情的真相，顺便揭露你无耻丑恶的行径，有什么问题么？费尔南迪？”威尔轻蔑的笑了笑，坐在沙发上打量着萨拉托夫，就像是在打量着什么重要但并不可惜的物品。\n萨拉托夫语塞，他胸膛中的怒意几乎撑爆皮肤，他用了几十年的涵养才让他没有立刻发难，他冷笑几声：“你背叛我？”\n威尔撇了撇嘴，他饶有趣味的品吮着手中的红酒，鲜艳如血滴：“可以这么说，老朋友，你变了。你变得优柔寡断，不再有当年那种敢于和高卢人拼命的毅力和胆识，甚至都不敢去面对曾经的失败。那个跟皇帝的走狗拼命的费尔南迪哪去了？嗯？”\n萨拉托夫几乎欲笑出声音，他字字珠玑的大声呵斥：“你疯了？你要做什么？带着奥坦堡和所有人继续再无谓的斗争下去？瞧瞧你的四周吧，大叛乱给我们留下的是千疮百孔的废墟，这还不够么？你还要再来一次？”\n“有何不可！你的女儿，我的儿子！他们的家人！多少兄弟朋友死在皇帝的手里？嗯？想想塔里娅，想想你的家人，想想血峰战役失败以来堕落快要二十年的乌萨斯！那个皇帝比他妈萨卡兹人生的的狗杂种还要不如，你居然还抱着天真的幻想？”威尔生气的把手里的红酒摔了，朝着萨拉托夫怒吼。\n说完，威尔似乎眼睛里闪动着莫名的情绪，他坐下扶了扶额头，发出悠长而细碎的叹息声：“朋友……我们是朋友……费尔南迪，正因为我们是朋友，我才不能让萨拉托夫领，让我们共同的奥坦堡因为你的错误而毁于一旦。”\n“你该退居幕后了，我会主导一场终结乌萨斯混乱的行动……让圣骏堡回到他理应的主人手里，然后把那腐朽的皇室给予我们的痛苦全部如数奉还。”威尔说完，他似乎也不想继续听萨拉托夫说哪怕一个字，不过从今天起，他们就不得不渐行渐远了，冰冷的雨季早已过去，但更加深邃的寒夜还在后面。"
 focus_cyb.29.a: "如果没有政治，他们本该是永远的朋友。"
 focus_cyb.29.tt: "威尔已经开始主导选举，他试图在选举中取代萨拉托夫。\n开启选举国策"
 international_cyb.1: "来自萨拉托夫领的传音"
 international_cyb.1.t: "来自萨拉托夫领的传音"
 international_cyb.1.d: "从荒野上抵达的信使给我们带来了一个新的消息，他们声称是萨拉托夫公爵指派他们，前来告知奥坦堡即将解除对乌萨斯地区的军火出口禁运，谁都知道，自1076年“大叛乱”结束以来，东部贵族领之间的关系就转变为相当微妙的态势。公爵们互相达成了心照不宣的和平协议，另一方面又都在扩张自己领地的实力，随时为了下一场可能的潜在冲突而做好准备。\n显然，萨拉托夫大公先前一贯遵循着“军火禁运”的贸易原则，但现在情况随着严峻的经济压力有所改变，信使表明公爵现在愿意向任何有意愿购买武器的领地开放购买窗口，那些恐怖的重炮现在都成了摆在地上任人选购的商品，既然现在他们一心扑到了钱眼子里……这或许是我们加强军备的绝佳机会。"
 international_cyb.1.a: "军火宝库今日敞开了大门"
 international_cyb.2: "北境军火？"
 international_cyb.2.t: "北境军火？"
 international_cyb.2.d: "军火贸易对于许多国家来说是诱人的果实，特别是对于那些无力自主生产武器的地区来说，他们还需要在某些暴力冲突和斗争中取得胜利，那么向荒野上或者某个地区的军火商求助是最好的选择。只要能够向那些贪婪的秃鹫付得起不菲的一笔钱，那么源源不断的武器装备就能从千里之外的兵工厂送到你的手中，帮你击垮政敌……或者是你不喜欢的任何人。\n当然了，对外购买武器利大于弊，还是弊大于利？不少专家和学者都在这个问题上看法不一，造不如买和买不如造两种观点，自军工业发展初期就争执不休，肆意购买外国的武器装备必然会导致本国的军工业落后陈旧，但如果在危机时刻能从外国获得必要的装备，那也没有必要吝啬自己的钱包。\n总之，军火贸易好处多多，在各国的发展中起到关键作用，近日乌萨斯的博斯克军火公司宣布将会重启新一轮的中陆贸易，毋庸置疑的是，谁能拥有更先进的技术，谁就会在军火贸易中占据优势位置。"
 international_cyb.2.a: "战争和冲突伴随着无数机遇"
 
