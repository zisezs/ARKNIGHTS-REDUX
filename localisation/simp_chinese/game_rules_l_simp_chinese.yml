l_simp_chinese:
 Custom_ARF_war_attack_buff: "大远征"
 Custom_ARF_war_attack_buff_desc: "我是他的首归之女。那段日子是我人生中最美好的时光。我们一起生活了十年，就他跟我，父与女。找到我之后，他把我从失去所有的黑暗中带了出来，将我放在他身侧，我们一起度过了一段时光。十年里，他只关注和养育了我。我们之间形成了一种纽带，牢不可破，比他和他其他干员之间的纽带都强，因为他们之中没有一个曾像我那样和他共度那么长的时间。十年，算不得长，我想，十年和万年相比，也就是一个心跳的时间。但即使如此。我还是珍视那段时光。他教会了我一切。他给了我一枚戒指，说我是他的人马座。我清楚的记得博士眼神是多么骄傲，我听见，整个罗德岛都在轻声呼唤着我的名字。"
 Custom_ARF_war_defend_buff: "大叛乱"
 Custom_ARF_war_defend_buff_desc: "我从未想要这样。我从未想要发动我的干员。我们曾一同驱散了这片大地的疾病。但你背叛了我，你背叛了我们所有人。你从普瑞赛斯那里窃取力量，向你的干员们撒谎。泰拉只有一次繁荣的机会，如果你不愿抓住他，那我会。那就让战争爆发吧。从萨米的天空，到焚风热土的边缘；让海洋沸腾，让星辰坠落。即使流尽最后一滴血，我也要见证泰拉再次获得自由。如果我无法从你的失败中拯救他，博士，那就让泰拉燃烧吧。"

