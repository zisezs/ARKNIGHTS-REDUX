#人物
 RMB_Brian_Wieghorst: "布莱恩·维格霍斯特"
 RMB_Brian_Wieghorst_desc: "作为联邦自由党的党魁，布莱恩·维格霍斯特以他的谈判技巧而闻名雷姆必拓，因为大家都不会忘记在几十年前，围栏事件愈演愈烈时，当时只是一名年轻律师的布莱恩，是如何将怒气冲冲的维多利亚代表安抚下来，又如何巧妙的将雷姆必拓独立的诉求摆到他们的面前。也因此，在围栏事件结束后的多年后，深陷信任危机的联邦自由党把已经从外交部长职位上退休好几年的布莱恩重新请出山，成功保住了摇摇欲坠的议会席位。在成为联邦的总统后，布莱恩·维格霍斯特发挥他外事工作上的长处，一方面继续延续之前的亲维多利亚外交政策，维系着雷姆必拓重要的进出口市场，另一方面，又积极推进与尤里卡的合并事宜，让激进势力对联邦自由党的印象有所改观。随着与尤里卡的谈判进行到最后的阶段，布莱恩·维格霍斯特和联合自由党应该能够撑到下一个大选年，如果不出意外的话。"
