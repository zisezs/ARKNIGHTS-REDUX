#国家精神
 diplomatic_crossing: "外交方向的问题"
 diplomatic_crossing_desc: "在雷姆必拓从维多利亚手中独立后，开国元勋们选择学习他们在西方的前辈，仿照建立了一套民主选举的体制，所以来自哥伦比亚的毛病也全都传染给了雷姆必拓。掌握雷姆必拓政坛的联邦自由党是雷姆必拓独立的主力，然而在独立后，联邦自由党出于经济利益考量，仍然执行亲维多利亚的外交政策，但雷姆必拓民族意识的构建来自于围栏事件中反抗维多利亚的事实，而围栏事件本身又是一场声势浩大的工人运动，因此联邦自由党的亲维政策遭到了国内左翼和右翼的共同声讨，由此引发的对自由党政府其他政策的攻击，则是将堪加拉的议会变成了一团浆糊。"
 Sarkaz_refugees: "萨卡兹难民"
 Sarkaz_refugees_desc: "雷姆必拓作为与卡兹戴尔有陆路连通的国家，在过去的十几年中，无数的萨卡兹难民因战乱或天灾涌入雷姆必拓，虽然其中大部分人只是将雷姆必拓作为前往维多利亚或叙拉古的跳板，但依然有大量的萨卡兹选择停在雷姆必拓境内。难民们为雷姆必拓带来了廉价的劳动力，却让本土的雷姆必拓矿工们失去了工作，而迥异于雷姆必拓文化的萨卡兹文化又带来了持续不断的冲突。管理这些萨卡兹难民，对于国家的财政来说，无疑是一笔巨大的开销，而管理之中的漏洞，更是让我们头疼的问题。"
 desert_native: "沙漠民族问题"
 desert_native_desc: "在雷姆必拓的中部地区，是一片广袤的沙漠地带，这里是雷姆必拓土著民族的故乡，几支扎拉克和黎博利的亚种民族自古以来就生活在这里，并且在维多利亚的殖民开发中，与殖民者们产生了极其尖锐的矛盾。尽管雷姆必拓已经从维多利亚独立出来，但土著民族的处境没有丝毫改变，因为这些生活在沙漠中的可怜人，在雷姆必拓独立的全过程中，一直以看客的身份，观看着自己的命运被他人审判。而目前摆在雷姆必拓的领导者面前的，有两个选项，让这些土著民族继续生活在雷姆必拓的边缘，或是参考奥特亚罗瓦方案，让他们成为雷姆必拓的一份子。当然，某些人手上也许还有第三种方法，但是谁都不希望这种方法被实施。"