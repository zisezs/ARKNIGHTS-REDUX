l_simp_chinese:
 REU_Kazimierz_Category: "解放卡西米尔"
 REU_Kazimierz_Category_desc: "骑士团治下的卡西米尔把感染者当作一次性的耗材。当乌萨斯的工厂连成地平线，整合运动的视线终于越过边境，落在邻国那些同样被践踏的人身上。\n\n§R启用条件：§!§Y1102 年 1 月 1 日§!之后。"
 REU_liberate_kazimierz: "解放卡西米尔"
 REU_liberate_kazimierz_desc: "卡西米尔的骑士仍在高唱荣誉，而矿场里的感染者连姓名都没有。我们不去谈判，也不去请求——整合运动要做的，是把枪口转向西边那片同样在流血的国土。\n\n§R启用条件：§!§Y1102 年 1 月 1 日§!之后；与卡西米尔尚有外交余地时方可发起。"
 REU_liberate_kazimierz_tt: "获得对§Y卡西米尔§!的§Y全面征服§!战争目标，由你自行决定何时宣战。"
 REU_liberate_kazimierz_tt_after_1102: "§R需在 1102 年 1 月 1 日之后方可发起解放战争§!"
