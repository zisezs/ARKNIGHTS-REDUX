#国家元首
 MOT_characters_1: "尤塞利诺·奥利维拉"
 MOT_characters_1_desc: "尤塞利诺·奥利维拉总统其人，便是所谓“莫拉达克之梦”的具象化身。他出身于莫拉达克小镇亚曼蒂纳的一户莱塔尼亚移民家庭，在赴维多利亚留学归来后便当上了资深外科医师。他的大夫生涯持续了短短两年，莫拉达克独立战争便轰然爆发。受过现代教育、认同民主思想的奥利维拉当即决定加入热图利奥元帅的起义军，并在战争胜利后凭借才能与功绩谋得了州长一职。\n1081年，奥利维拉参与创建了如今的执政党“莫拉达克社会民众党”，并积极投入到中央政务之中。短短六年后，他便与联邦工党的右翼领袖茱莉亚-爱德华多·洛佩斯达成合作，并以“进步与发展”的口号夺下总统之位。短短两届任期之内，他尽情挥发着自己的现代化雄心，将莫拉达克建设成了一个飞速发展的新兴工业国家，也为自己博取了“莫拉达克梦之具象”的美名。\n然而，奥利维拉的传奇之路并非一帆风顺。繁荣表象之下，通货膨胀与国家外债宛如两枚定时炸弹，随时可能将经济奇迹的地基炸得粉碎；联邦议会之中，民众党与工党的联盟早已彻底破裂，确保多数地位成了遥不可及的奢求。奥利维拉总统并不谋求第三届任期，而是希望另觅一位接班人解决乱局。但现在的问题是——那个可怜的家伙会是谁？"
