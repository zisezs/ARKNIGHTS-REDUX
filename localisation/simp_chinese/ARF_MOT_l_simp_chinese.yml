#民族精神
 MOT_ideas_1: "宪政临界"
 MOT_ideas_1_desc: "自莫拉达克确立共和制度以来，由国父热图利奥一手缔造的宪政民主体系稳定维持了二十五年之久，直至尤塞利诺·奥利维拉总统在七年前走马上任，博弈与对抗便日益趋于极化。至今，昔日的稳定多党格局已经支离破碎：民众党与工党反目成仇，左右两翼之间激斗不休；极端政治力量正在悄然崛起，威胁着议会的基本秩序。毋庸置疑，莫拉达克的宪政民主体系已经来到了一个临界点——在克制中存续，亦或在疯狂中灭亡。\n目前，我国的宪政稳定度为：§Y如履薄冰§!"
 MOT_ideas_2: "为了未来"
 MOT_ideas_2_desc: "尤塞利诺·奥利维拉总统怀着一个伟大的梦想——让工厂与烟囱遍布贫瘠的荒原，将莫拉达克亲手缔造为泰拉西陆的经济明星。宪法与民众则给了他八年，也就是两届总统任期的时间来达成这个承诺。如今，时间过去了七年，奥利维拉的任期也即将迎来尽头。在他治下，莫拉达克的经济总量与工业产值暴涨了数倍，但恶性通货膨胀与区域发展失衡的问题也接踵而来。而总统本人已经失去了料理危机的勇气，转将民众党赢下大选的希望全数寄托于“莫拉达利亚首都区”的都市宏图之上。无论奥利维拉能否如愿，最后总得有人挺身接住这七年高速发展期所留下的烂摊子，否则莫拉达克就已经将前脚踏入万丈深渊。"
 MOT_ideas_3: "达摩克利斯之剑"
 MOT_ideas_3_desc: "以热图利奥时代为起点，莫拉达克军方一直自视为国家利益的最终守护者，甚至是政治危机的绝对仲裁者。他们藏于幕后牵丝引线、施加影响干预政务，只为确保联邦议会的运行不偏离其所认定的“国家秩序”。而在今天，军方的这种角色定位依旧存在，并且越发显得变幻莫测。§R倘若莫拉达克的宪政体系一夕崩溃，守护者便会出面重建绝对的秩序。§!\n如果稳定度低于0%，那我们就有的受了。"