 # ===== 国际贸易 · 分类与决议 =====
 ARF_trade_category: "国际贸易"
 ARF_trade_category_desc: "七个市场的需求与供给一览。各国按侧重把贸易商品投入市场，被他国抢走的需求就填不到自己手里。出口额转成建造速度、政治点获取与科研速度，再按本国稳定度折算（稳定度 100% 时拿满额）。"
 ARF_trade_reset_weights: "重置贸易侧重"
 ARF_trade_reset_weights_desc: "把七个市场的侧重权重全部还原为 1（= 均分全部贸易商品）。"

 # ===== 国际贸易 · 动态修正 =====
 arf_international_trade: "国际贸易"
 arf_international_trade_desc: "国际贸易带来的月度加成（已按稳定度折算）。出口额越高，建造越快、政治点越多、科研越快；稳定度 100% 时拿满额，稳定度不满就按比例打折。"

 # ===== 国际贸易 · 入口面板 =====
 ARF_TRD_ENTRY_TITLE: "§Y国际贸易§!"
 ARF_TRD_ENTRY_DESC: "七个市场按需求与竞争分利。\n出口额转成建造速度、政治点\n获取与科研加成，再按稳定度折算。\n本月出口额 §Y[?arf_tm_sum_fill]§! 点。"
 ARF_TRD_ENTRY_BTN: "打开市场看板"
 ARF_TRD_ENTRY_HINT: "加成按稳定度打折"
 ARF_TRD_ENTRY_TT: "查看七国市场的需求、竞争与本国份额"

 # ===== 国际贸易 · 看板 =====
 ARF_TRD_TITLE: "§Y国际贸易 · 市场看板§!"
 ARF_TRD_SUBTITLE: "贸易商品 = 民用工厂数。商品按侧重分投七个市场，被他国抢走的需求填不到自己手里。"
 ARF_TRD_H_MKT: "§T市场§!"
 ARF_TRD_H_DEM: "§T贸易需求§!"
 ARF_TRD_H_SUP: "§T全球出货§!"
 ARF_TRD_H_RATE: "§T满足率§!"
 ARF_TRD_H_OUT: "§T本国出货§!"
 ARF_TRD_H_FILL: "§T本国填补§!"
 ARF_TRD_H_WT: "§T侧重§!"
 ARF_TRD_SUMMARY: "本国贸易商品 §Y[?arf_tm_tg]§! 点　·　竞争力 §Y[?arf_tm_comp_pct]%§!　·　出口额 §Y[?arf_tm_sum_fill]§! 点　·　稳定度 §Y[?arf_tm_stab_pct]%§!\n本月加成：建造速度 §G+[?arf_tm_build_pct]%§!（基础 +[?arf_tm_build_base_pct]%）　·　政治点获取 §G+[?arf_tm_pp_pct]%§!（基础 +[?arf_tm_pp_base_pct]%）　·　科研速度 §G+[?arf_tm_res_pct]%§!（基础 +[?arf_tm_res_base_pct]%）"
 ARF_TRD_FOOT: "§T满足率 = min(1, 该市场需求 ÷ 全球出货)：供不应求时本国出货全被吸收，供过于求时按比例折减。\n出口额 = 七市场填补合计；每 1 点 = 建造 +0.5% / 政治点 +1% / 科研 +0.25%；三项均再乘稳定度（100% = 拿满额）。§!"
 ARF_TRD_CLOSE_TT: "关闭市场看板"
 ARF_TRD_W_UP_TT: "把更多贸易商品压到这个市场（上限 9）"
 ARF_TRD_W_DOWN_TT: "减少投入到这个市场的贸易商品（下限 0）"

