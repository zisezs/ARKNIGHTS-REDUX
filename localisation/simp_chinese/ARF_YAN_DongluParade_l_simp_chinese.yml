yan_mil.24.t:0 "东陆演武仪典"
yan_mil.24.d:0 "在重岳、年、望三位奇才的襄助与当朝真龙的乾纲独断之下，大炎帝国陆军痛定思痛，深刻汲取了岁陵之乱的教训，彻底完成了由守势防军向雷霆攻势之师的蜕变，已然具备将一切来犯之敌拒杀于国门之外的铁血战力。\n\n为此，天师府老天师与朝廷太尉联名奏请，决定于东陆举行一场声势空前的联合大演武，广邀周边诸国遣使观摩参演，预计前后调动兵马逾千万之众。\n\n§R「别把这次演习太当回事，真正对抗邪魔时可不会只有军事演习这种过家家的强度」§!"
yan_mil.24.a:0 "三军整装"

YAN_donglu_parade_title:0 "东陆演武仪典"
YAN_donglu_parade_quote:0 "兵者，国之大事，不可不察——《孙子》"
YAN_donglu_parade_close:0 "不会闹出人命的"

YAN_exercise_no_casualties:0 "军事演习，无人伤亡..."
YAN_exercise_no_casualties_desc:0 "炮声是真的，弹药是假的。至少在他们自己的战报里，没有人会死。"
