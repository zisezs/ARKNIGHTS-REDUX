 #民族精神
 QUC_revenge_fanaticism: "复仇之国，复仇之民"
 QUC_revenge_fanaticism_desc: "自伊比利亚黄金舰队抵达的那刻，克丘亚民族便做好了与侵略者同归于尽的准备。纵使曾经占尽优势、不可一世，殖民者们最终依旧被赶出了祖国。以无数同胞的鲜血和尸体为代价，克丘亚赢得了光荣的独立。\n\n但我们的使命仍未结束，莫拉达克与玻利瓦尔至今仍被殖民者的后裔所统治，核心圈列强的阴影也从未真正散去。总有一天，克丘亚会让它们付出代价，在泰拉西陆上确立真正属于其主人的秩序。"
 QUC_shaky_committee: "摇摇欲坠的委员会"
 QUC_shaky_committee_desc: "在受人敬爱的克丘亚国父——阿米尔·阿霍万尼过世后，瓦伊纳·卡帕查克以副手身份接过了其衣钵。这位年轻且温和的领袖很快便下令结束军事动员状态，并将大部分资源投入于战后重建工作之中。得益于他的决策，克丘亚的经济实力在过去五年间快速恢复，支离破碎的社会也正重新凝为一体。\n\n然而，并非所有人都赞成卡帕查克的家长式统治。以裴龙为代表的公理党人士不满于当局的专制色彩，乌曼楚莫与团结在他身边的极端民族主义分子则对当局的和平妥协态度感到愤恨不平。只需要一次小小的契机，卡帕查克便将前功尽毁。"