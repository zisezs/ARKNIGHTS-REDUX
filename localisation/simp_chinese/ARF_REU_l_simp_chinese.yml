 REU_March_Begin: "急行军开始"
 REU_March_End: "急行军结束"
 event_reu.14.t: "劫掠大获成功！"
 event_reu.14.d: "这次行动相当顺利，排头兵迅速占领了几个关键位置，我们没什么损失就将对面收拾了个落花流水。小队长在清点战后时候发现我们不仅没丢一个人，甚至连伤也没伤几个，掠夺的物资足够我们花点时间好好清点一下了！"
 event_reu.14.a: "“收队！”"
 event_reu.15.t: "劫掠成功"
 event_reu.15.d: "我们这次碰了块硬茬子，敌人的抵抗有点在我们的意料之外，我们拼死拼活还是把我们需要的东西给抢出来了，不过还是没了几个，不管……不管怎么说，这也不算是场赔本买卖，只是事后处理我们要稍微花点时间了。"
 event_reu.15.a: "“把医疗物资优先分配一下吧”"
 event_reu.16.t: "劫掠失败"
 event_reu.16.d: "我们总算是撤出来了，鬼知道这次他们多加了几道防！恐怕这几个就是我们逃出来的所有人了，不仅汤是一点儿没喝到，连着本儿也搭进去不少……事情虽然怎么都能过去，但，我们接下来该怎么办？"
 event_reu.16.a: "“听好命令，接下来我们容不得半点差错”"
 event_reu.17.t: "宝物到手！"
 event_reu.17.d: "轻轻松松！多亏一开始排查摸点做得仔细，我们几个小组顺着边就摸了进去，路上一个大头兵也没遇到！这趟可算是收获颇丰，不仅走的时候满满当当，有几个小伙子还找到了点意外之喜，估计现在对面那群冤大头还不知道他们家都被掏空了呢！"
 event_reu.17.a: "“这羊你们也不能逮着一只使劲薅啊……”"
 event_reu.18.t: "物资带出来了"
 event_reu.18.d: "真是没想到，敌人临时变了哨，不过还是比较顺利地混进去了，得亏来的这群都是点老手，一个个脑筋活得很！虽然说这次行动成功了，不过我们在出来的时候遇到了点小麻烦，几个家伙差点跑不了，不得已扔了点，咳，总归带出来就是好的嘛！"
 event_reu.18.a: "“那我们得好好复盘一下这次行动了”"
 event_reu.19.t: "侥幸脱险"
 event_reu.19.d: "坏事儿了，这次不知怎得，敌人把整个布局打乱了，我们仅有几个人混了进去，连个毛也没碰到不说，敌人鼻子又不知怎得灵了起来，愣是领着兵就追上去了，有几个粗笨的还是没躲开他们，就对面那群老东西的手段……恐怕凶多吉少。"
 event_reu.19.a: "“少一个老手我们都经受不住啊……”"
