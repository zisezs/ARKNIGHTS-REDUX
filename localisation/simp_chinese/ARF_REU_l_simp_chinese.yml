### 军官分工特质（LKMT Plus）###
 CHI_commissar_officer: "政工干部"
 CHI_commissar_officer_desc: "这名军官精通思想政治工作。"
 CHI_staffer_officer: "参谋长"
 CHI_staffer_officer_desc: "这名军官善于军事谋划精通具体军事业务工作。"
 CHI_military_officer: "军事干部"
 CHI_military_officer_desc: "这名军官精通军事指挥工作。"
 REU_democracy_reform: "塔露拉民主改革运动"
 REU_democracy_reform_desc: "塔露拉同志将继续领导我们进行社会主义革命，而近来民间的一些情绪似乎都在要求我们进行真正人民当家作主的社会主义民主改革，破除乌萨斯的封建制度和集权传统。克内希同志指出，我们的党是从人民中走来的，如果只是用我们的专制独裁去替代了乌萨斯皇帝的专制独裁，放弃实现人民民主，那么我们充其量不过是从以前的整合运动变成了一个新的乌萨斯帝国，用整合运动的干部去替代了乌萨斯皇帝的文官。尽管塔露拉同志现在还对我们民主改革的未来态度比较模糊，但克内希和阿丽娜同志都在这一议题上提供了各自的计划，克内希同志偏重于意识形态群众运动化，而阿丽娜同志偏向于优先进行意识形态教育，我们可以在两种计划中加以选择……"
 REU_Knecht_plan: "克内希计划"
 REU_Knecht_plan_desc: "克内希同志计划在东达利亚地区进行社会主义民主改造，充分发扬社会主义民主的应有之义，争取将我国建立成全乌萨斯布尔什维克攻不可破的红色堡垒。"
 REU_Alina_education: "阿丽娜教育"
 REU_Alina_education_desc: "阿丽娜同志是感染者们以前的老师，在乌萨斯城市里做过几年教员的她指出，人民群众不经受更为深刻的社会主义价值观教育是难以接受我们激进改革的手段的，甚至改革只会否定之否定而适得其反，因为人民只会以他们旧的道德和价值判断进行行动。"
 REU_post_commune_wall_poster: "张贴公社墙报"
 REU_post_commune_wall_poster_desc: "旧乌萨斯文官制度一向喜欢打压民众的声音，我们需要做的是让民众尽量多尽量敢的去表达他们对我们的意见。我们红军素来就拥有印刷口号并在根据地广泛贴张以向民众进行社会主义宣传教育的传统，我们可以鼓励人民把许多不便直说的心里话贴在墙报上，并且在各级行政体系上建立体系更完备的监督方式，靠这些方式对我们加以监督。"
 REU_decentralize_cadre_power: "分散干部权力"
 REU_decentralize_cadre_power_desc: "旧乌萨斯帝国的千年专制史，就是一部官僚权力不断集中、不断与民众走向对立的历史。从圣骏堡到地方的政府部门，全部官吏皆由上层任命、只对贵族与皇权负责，行政、司法与经济权力高度垄断在少数官僚手中，基层乡社与劳动者毫无话语权可言。这种集权官僚体系既是剥削阶级统治的工具，也滋生了无尽的贪腐、低效与苛政，成为套在乌萨斯人民身上的沉重枷锁。\n内战的严峻形势也曾迫使我们实行高度集中的干部管理体制，以集中全部力量赢得战争。但随着解放区的巩固与建设的开启，权力过度集中的弊端正逐渐显现：部分干部沾染了旧官僚的习气，脱离生产实际，漠视群众诉求，甚至以管理者自居，违背了苏维埃 “一切权力属于劳动者” 的根本原则。\n我们必须坚决遏止官僚化集权化的苗头，为了实现从制度层面的制约，克内希同志决定推行干部权力分散化。将行政管理、生产调度与社会事务的决策权限稳步下放到各级地方苏维埃，多方监管，专业负责。让工厂、集体农庄与街道社区的基层代表拥有实实在在的议事权与监督权；废除干部的等级特权与特殊化待遇，推行干部定期参加集体生产劳动的制度，让公职人员始终扎根于群众之中；建立健全苏维埃代表的选举与罢免机制，各级干部必须对本级代表大会负责、接受群众的公开监督。\n权力的分散是人民民主的真正落实。只有当每一位干部都牢记自己是人民的公仆而非主人时，革命才会真正深植于冻土之下不会被任何风浪所动摇。"
 REU_establish_red_cadre_school: "建立红色干校"
 REU_establish_red_cadre_school_desc: "内战中，我们的红军里自然也涌现出大批工农出身的干部。他们忠诚勇敢、扎根群众，凭着朴素的阶级觉悟与革命热情撑起了地方苏维埃政权的骨架。但随着地方权力的稳步下放，以及生产建设的全面铺开，干部队伍的短板日益凸显：数量上难以覆盖广袤的冻土边区，能力上参差不齐，许多同志缺乏系统的理论素养与基层治理方法，难以应对复杂的群众工作与生产建设难题。\n为锻造一支真正属于劳动者、服务于劳动者的干部队伍，仅仅依靠我们先前借用几个学校临时搭建的干校是不够的。如今，阿丽娜同志再次主导开设了新的完整体系的干部学校体制。我们将在新设置的各边区首府与各大城市建立红色干部学校，从优秀工人、集体农庄社员、红军基层战士与群众积极分子中选拔学员，让最广大的劳动者阶层拥有自己的人才培养通道。\n我们明确，红色干校绝不培养脱产的下一代“学生预备干部”“学生官僚”。新的学校会实行半工半读、勤工俭学、教学与革命生产实践深度结合的办学方针：我们的课堂上既会讲授革命理论、苏维埃的治理原则与群众工作方法，也会依据专业传授工业调度、农业技术、源石基础应用与基层建设实务；学员每半月必须回到原工厂、原农庄参加集体劳动，在生产一线检验所学。阿丽娜同志亲自审定了编写的全部教学大纲，她批注的是：合格的整合运动干部，首先要能接受良好的社会主义教育，能够听清农民的诉求，看懂工人的难题，不许站在高台之上念着脱离实际的命令。"
 REU_urge_social_construction: "督促社会建设"
 REU_urge_social_construction_desc: "塔露拉同志指出，我们目前的首要任务还是进行社会主义社会的改造和建设，我们党要及时提升执政能力，继续实施战时共产主义政策并将我国建立成足以和乌萨斯帝国对抗的革命国家……"
 REU_democratic_spirit_education: "民主精神教育"
 REU_democratic_spirit_education_desc: "民主是什么？在乌萨斯皇帝贵族眼中，民主是叛乱的代名词。而在大多数知识分子眼中，民主则是科雷马边疆区曾经奉行的那种十二月党人式的实验。而克列缅秋格的萨文科娃甚至曾经都一度标榜自己是“民主”势力。阿丽娜同志通过阅读书籍和社会调查，指出了乌萨斯人民长期以来被误导而形成的对“民主”的谬误——民主不再会是口号，会是粉饰的外壳。民主应当是社会主义的，是共产主义的，是能够实现阶级革命的，能让工农当家作主的。而更为重要的是，民主不是依靠任何个人带来的或者能被任何个人所否定了的，而是需要大众一起去争取，一起获得的。"
 REU_consolidate_existing_values: "巩固现有价值"
 REU_consolidate_existing_values_desc: "塔露拉同志告诉阿丽娜，社会主义教育具有长期性和艰巨性，她没办法否认那些把乌萨斯皇帝肖像换成自己肖像的人在当下确实是在“革命”当中了。毕竟有什么办法能够完全去除这些他们解放了的人对他们这些解放者的爱戴呢？所以我们应该采取更柔和的办法，把人民群众的这种对我们的爱戴转移到社会主义建设的爱戴上去。"
 REU_liberate_the_poor_and_speak: "解放穷人说说话"
 REU_liberate_the_poor_and_speak_desc: "在泰拉王侯将相的历史中，被往往是那些最穷苦最需要被我们解放的人，但他们常因处于社会最底层无法发出自己的声音。我们的解放解放了和他们相比许多“不那么”穷困的无产阶级，但对于这些最底层的民众和感染者，这些历史学家所说的“沉默的大多数”“被忽略的历史”，我们需要在社会上树立新的风气，以鼓励他们这些最穷苦的一批人站起来说说话为目标，让大家更深刻的感悟帝国旧社会的罪恶和更好的参与新社会的建设——帝国政府再也不能回到我们的土地上了！"
 REU_seek_army_assistance: "争取军队协助"
 REU_seek_army_assistance_desc: "近期进行改革的阵痛使得暂时保持中立的红军人心浮躁。我们红军是保卫革命的最大力量，所以在进行革命时，克内希同志似乎有意争取红军也一定程度地参与到地方的民主改革建设尝试中来，这或许会削弱改革的阻力，但无疑可能会动摇红军忠诚听命的军队传统……"
 REU_consolidate_scientific_spirit: "巩固科学精神"
 REU_consolidate_scientific_spirit_desc: "旧乌萨斯帝国的统治体系内，贵族始终将科学禁锢在深宫与私学的高墙之内。他们一面垄断源石技术，以此榨取工农的血汗；一面将感染者与生俱来的源石技艺污蔑为 “异端的邪祟”，用蒙昧、偏见与恐惧维系着腐朽的等级秩序。因此，乌萨斯的广大贫苦人民从来没有受到过系统性的教育，尽管在劳动中，他们充分积累了属于劳动人民自己的智慧，但一旦出现超出他们“常规”认知的事情（比如天灾，比如帮助他们进行解放）时，他们更偏向于求助神明，或者生搬硬套在自己知识范畴内的认知进行解释，比如我们在解放东达利亚的时候已经闹出不止一次人民把我们当作是神民，把塔露拉同志当作是天神下凡的笑话。对这些认识落后思想迂腐的人民来说，如果不普及科学精神，对他们进行更彻底的科学教育，那指望依赖他们进行民主评议参政而推行我们党的民主改革简直就是天方夜谭了。"
 REU_appeal_to_the_broad_left_front: "向左翼广泛阵线的呼吁"
 REU_appeal_to_the_broad_left_front_desc: "纵观反抗乌萨斯帝国腐朽统治的势力内，可以被称为“左翼”势力的不仅仅只有我们乌萨斯苏维埃红军一支，一些进步知识分子虽然自称不是马主义者，但依然在现阶段和我们进行扶助工农，土地改革，治疗源石病的诉求相符，我们可以及时吸纳这些政治精英加入我们的国家建设之中，一来让他们为我们国家贡献智慧，二来不至于让这些人在战时成为危害我们国家的不利因素。"
 REU_hand_over_the_microphone: "转交话筒"
 REU_hand_over_the_microphone_desc: "“站起来！不许跪！让大家说话！”我们决定在全国广泛组织一种更新形式的诉苦大会，劝说这些旧社会的最大的受害者们及时站出来，不必顾及什么的进行诉说，以便使得革命同志们寻找到共情的对象，形成革命的合力。“喂，你们这里谁过的最惨，谁过的最穷？想不想上来讲讲你们自己的故事？”"
 REU_promote_party_committee_guidance: "推动党委指导"
 REU_promote_party_committee_guidance_desc: "我们的党是一支从乌萨斯内战中成长出来的势力，我们的干部久经革命艰难的考验，而民众中近期确有一些相当反动的言论。这反映民间确实还有不少对党认识的不清晰和不支持，有被反动势力回潮利用的风险，因而我们将继续实行对这些反动势力的专政，贯彻落实党的领导作用。"
 REU_army_backs_revolutionary_left: "军队要支持革命左派"
 REU_army_backs_revolutionary_left_desc: "塔露拉同志还是说服了爱国者将军，我们的红军会支持地方上对民主的保障，以争取支持群众和支持革命左派为目的削弱敢于对抗改革的力量，同时红军会参与到对地方秩序的底线保障中来，以免有敌人浑水摸鱼进行无底线无下限的活动。"
 REU_army_upholds_loyalty_tradition: "军队恪守忠诚传统"
 REU_army_upholds_loyalty_tradition_desc: "算了，红军同志们还是保持现状为好，我们的红军依旧是忠于党，忠于乌萨斯人民的军队，这一阶段的任务还是将精力及时投入到练兵备战，解放全乌萨斯上来。"
 REU_compulsory_education: "义务教育"
 REU_compulsory_education_desc: "革命不仅要推翻剥削者的政权，更要砸碎劳动者精神上的枷锁。每一个社会主义的新劳动者都有义务和权利接受教育。我们要让他们知晓——科学从来不是少数精英阶层的私产，而是无产阶级改造世界、抵御严寒、战胜矿石病的最有力武器。我们将在国内全境建立基层科普站与源石技术讲习所，让工人与集体农庄社员都能掌握基础的工业原理与设备操作方法；我们将整顿这篇土地上遗留的科研院所，清除学术官僚，树立以生产实践为唯一标准的学术风气；我们将以康拉德同志的唯物主义思想武装全体科研工作者，破除宗教迷信与贵族偏见，让科学精神真正扎根于每一片红军解放的土地，成为乌萨斯苏维埃永不崩塌的精神基石。"
 REU_mass_basic_education: "群众基础教育"
 REU_mass_basic_education_desc: "萨沙同志告诉了我们一个耐人寻味的现象：以前有过一些帝国时代还算开明的知识分子来到他生活的村庄给村民启蒙，但那些知识分子西装革履，面对农民要言必及新——所谓“启蒙”“民主”“科学”，而乌萨斯老农民们并不买账，这些完全崭新的词汇或许可以吸引年轻人的注意，改变一些中年人的认知，但对于年龄更长而往往是村庄元老的人来说会遭到莫大的排斥和抵触。我们还是需要建立一些更接地气的宣传方式，以群众认知为基础普及常识。"
 REU_socialist_league: "社会主义联盟"
 REU_socialist_league_desc: "社会主义者们从来都是要为人民带来更多福祉的。我们组建一个新的社会主义联盟，将知识分子们求同存异的规范到国家治理体系中来，这对国家治理有莫大帮助。阿丽娜同志为了更好的让这些知识分子发挥作用，在现阶段让他们加入了政工部下辖的文工团和政治队中，及时强化了军队的政治宣传力和士兵战斗力。"
 REU_strengthen_party_leadership: "强化党的领导"
 REU_strengthen_party_leadership_desc: "布尔什维克党需要纯洁性。博卓卡斯替将军的话似乎有些道理，许多知识分子虽然自诩是革命者，但他们所思所想大多只是个人主义英雄主义作祟的成果，一旦革命遭遇不利或者实现胜利，恐怕这些人才会露出自己真实的面目——妥协性和软弱性并存的小资产阶级面目。我们还是要依靠我们伟大的布尔什维克党领导我们，才能真正实现共产主义的胜利。"
 REU_this_is_the_final_struggle: "这是最后的斗争！"
 REU_this_is_the_final_struggle_desc: "国际歌曾经说过，这是最后的斗争，我们和党内革命实现阶段胜利后出现的官僚主义、以权谋私等种种乱象进行了有利斗争，现在我们可以说，我们对革命进行了有效的建设和促进作用，是时候根治乌萨斯的病症了，我们会将红旗插上圣骏堡的城头！"
 REU_plan_in_disadvantage: "计划陷入不利……"
 REU_plan_in_disadvantage_desc: "克内希同志担忧的告诉塔露拉，她的计划似乎陷入了很不利的状况下，尽管我们的建设目前一直在发展进步，但这些都只是建立在一个自上而下有强力而无活力的大组织下实现的，她很担心，如果只依靠塔露拉个人的权威维持这个体系的革命性和进步性，新的乌萨斯在她之后真的会继续保持这种初心吗？"
 REU_greatest_common_divisor: "最大公约数"
 REU_greatest_common_divisor_desc: "阿丽娜同志的计划成功了，我们争取到了一切可以争取的力量从而争取革命的胜利，形成了一个争取革命胜利的最大公约数。如今我们人心齐泰山移，让我们的革命同志们肩并肩行进，为争取更大的胜利而奋斗。"
 REU_walk_alone_in_silence: "默默独行……"
 REU_walk_alone_in_silence_desc: "阿丽娜同志表示，计划实施似乎不怎么乐观，可以预见的是我们接下来只能继续独行了。要创造人类真正的幸福全靠我们自己，叶莲娜参谋长已经加紧了练兵备战以继续巩固我们红军的力量，继续坚持实施专政和武装斗争的路线……"
 REU_examine_revolutionary_achievements: "检验革命成果"
 REU_examine_revolutionary_achievements_desc: "从目前来看，我们民主改革的计划已经得到实施，它的效果犹未可知，但随着新一届大会即将召开，我们民主改革的成果将会被汇报给塔露拉同志加以检验……"
 REU_dem_reform.7.t: "克内希同志的第一个建议"
 REU_dem_reform.7.d: "旧乌萨斯总督府的办公楼正门廊柱上的弹孔被草草填上，只留下一段深浅不一的印记；庭院中央，曾经气派的石雕喷泉如今只剩半尊——大理石雕的雪原驯鹿被炮弹齐肩削去头颅，喷口断裂成参差的缺口，开春的残雪还积在半满的池底。\n塔露拉的办公室就设在原总督的书房里。不过那些鎏金吊灯、贵族油画早已被清理走了，只留下宽大的红木办公桌，桌面上一半摊着西部对峙战线的态势地图，一半摞着一堆民主改革的调查报告。康拉德・克内希站在桌前，正在向塔露拉逐条阐释着她采取的民主改革计划最终方案的全貌与必要性。\n“我们把一些权力适当下放到地方苏维埃只是搭起了一个改革骨架，如果没有群众运动使得群众真正参与，骨架里就是长不出更鲜活的血肉的。” 克内希的语气依旧十分笃定，“帝国靠愚民政策和官僚垄断维系统治，而我们绝不能重蹈覆辙。必须让每一个车间、每一座农庄、每一个社区都建立起真正的群众议事机制，赋予劳动者以完整的提案权、监督权和罢免权。只有人民亲手参与建设的政权，才不会被官僚主义架空，才不会在风浪面前垮掉。”\n塔露拉一直没应声。她走到窗边，背对着克内希，目光落在窗外那半座残破的喷泉上。此时天空中又飘起了雪来，打在玻璃上沙沙地响。过了片刻，她才缓缓开口。\n“你的第一份方案，我已经在三个先进社区先试行了两个月。” 她转过身，手肘轻靠在窗沿，“整体效果，比我预想的要好。基层的问题——比如工矿业的防护装备配发、农庄的种子分配、社区的托儿所增设——很多方法，群众自己提出来，自己讨论出办法，比我们坐在办公室里拍板要管用得多。”\n她顿了顿：“但，这里出现了许多问题。有人提案说红军干部和地方干部办公室的皮椅都是‘剥削阶级残余’，要求统一换成硬木凳；而为了显示公平，可以让红军废除军衔制搞人人平等；还有人查食堂的账目，连炊事员采购的时候多拿了一块黑面包一壶水都要摆到台面上批判；还有几个想浑水摸鱼的，趁机散布合作社不好，搞‘分田单干’好的论调，结果话刚说出口，就被在场的农业社员指着鼻子骂了回去，轰出了会场大门。”\n她拿起试点报告翻到最后一页展示给克内希看，语气沉重：“最后是柳德米拉同志汇报的东西，三个试点的工业产出平均降了近五个百分点，农庄的冬贮进度也慢了一截。由于群众热衷于天天开议事会，他们的工时少了，工作的人手散了，并且正常的生产和生活秩序都受了影响。”\n“这是必经的阵痛，塔露拉同志。” 克内希立刻回应，“群众第一次握有这样的权力，难免生疏，难免走弯路。可你也看见了，真正遇到别有用心的人，站出来捍卫革命的是群众自己。他们是我们最可靠的力量。要发动改革就绕不开人民，你知道的。”\n塔露拉没有接话。她重新望向窗外，目光越过半座喷泉，望向城市西侧的天际线。那里的工厂烟囱正冒着浓烟。而更遥远的西部雪原上，她仿佛已经看到帝国军队正在集结。\n她沉默了很久，室内只剩下风雪敲窗的轻响。\n最后，她开口了："
 REU_dem_reform.7.a: "克内希同志，就按你的方案把改革继续推行下去吧。"
 REU_dem_reform.7.b: "克内希同志，现阶段还是需要以工业建设为目的。"
 REU_dem_reform.8.t: "社会调查的报告"
 REU_dem_reform.8.d: "塔露拉正坐在宽大的橡木桌前，翻阅一份从远方考察途中寄来的文件。这是阿丽娜送来的社会调查报告，纸页间夹着实地速写、手绘图表与贴在纸面上的照片，图文并茂，沉甸甸地摊开在桌面上。\n阿丽娜是塔露拉最早结识的战友；如今她身兼红军政工部部长与共和国宣传部主任两职，常年奔走于各个解放区的村镇、矿区与工厂之间，深入民间做实地走访。在塔露拉授意她进行改革后，她写的这份报告，便是她跨越多地调研之后凝结而成的成果。\n塔露拉逐页细读。阿丽娜在文中直言：当下的土地之上，“民主” 二字虽已被提起，可民众对它的理解五花八门，充满了误解与曲解。\n在偏远农庄里，不少老农听人说起民主，第一反应竟是民主就是人人都有机会当上总督，甚至当上皇帝。在他们的想象里，权力依旧是独属于一人的特权，只是这特权可以轮流落到任何人头上。\n而受过教育的知识分子群体，则走向另外的极端。一部分人将民主直接等同于哥伦比亚合众国的议会竞选制度，认为哥伦比亚的民主是灵丹妙药；另一部分人则满心恐惧的认定民主便是无序的暴乱、暴民横行的天方夜谭，完全拒斥群众参与治理。\n阿丽娜在报告中继续写道：翻阅统计各地宣传简报、统计街头标语、群众集会的文稿就能发现，在东达利亚苏维埃共和国的公共宣传口号话语体系里，“革命”“社会主义”反复出现，深入人心；但“民主”和“社会主义民主”概念出现的频次远远落后。而词语的缺席代表思想的缺位。如果劳动者无法理解真正属于自己的民主究竟是什么模样，那么再宏大的革命口号，也容易沦为空洞的外壳。\n卷宗附带的照片与笔记让塔露拉心头不禁压上重担。阿丽娜拍下不少村镇集会和民居墙壁的实景记录：旧帝国皇帝画像被摘下焚烧，取而代之的是塔露拉的肖像；旧的帝国徽记被红旗和新的国徽覆盖。无疑，虽然他们“革命”了，潜藏在他们底层的思维逻辑却是依旧延续着帝国时代的崇拜传统。民众自发地用旧日供奉君主、崇拜神明的方式表达拥护与热爱，将革命领袖塑成新的偶像。这种发自民间的爱戴固然真切，可本质仍是偶像崇拜。阿丽娜在报告中郑重警示：这种思想残余危害深远，若不及时肃正，就算推翻了旧帝国的统治，旧时代的精神枷锁依旧会牢牢禁锢人民，使得革命日益和真正想要达到的面貌相去甚远。\n塔露拉读完报告，低声笑了一声。她拿起手边的红笔，不禁陷入思考。旧的思想不会随枪炮一同消亡的。现在她该怎么批？"
 REU_dem_reform.8.a: "致阿丽娜：民主教育刻不容缓。"
 REU_dem_reform.8.b: "阿丽娜同志：依托现实引导为主。"
 REU_dem_reform.9.t: "干部会议"
 REU_dem_reform.9.d: "作战会议室的空气里弥漫着烟草的气息。巨大的新的红色控制区西侧的军力部署图占满了整面墙壁。塔露拉坐在长桌主位。列席的红军将领与党政干部分坐两侧，会议室里灯芯发出轻轻的响声。\n“我们的基层民主改革推行已经有了几个月，我感觉还算有成效，但是……” 塔露拉的声音压得很低，目光扫过在场众人，“不少地方干部嘴上喊着拥护，背地里照旧搞一言堂；更有甚者，把群众的批评当成挑衅，想方设法打击报复。”\n她将一份政治保卫局的报告推到桌中央，封面上的几个红字格外刺眼。\n“贝加尔矿区那里，四个工人联名举报工厂书记克扣口粮、倒卖工厂物资，证据确凿。结果就在上周，那个书记勾结了三个跟他有私交的地方民兵，半夜摸进工人宿舍，把四个人全枪杀了。更过分的是，他们随即又偷袭了我们的边岗战士，拿了几支步枪连夜逃去了帝国那边。”\n会议室里的气压瞬间更低了。塔露拉语气里压着怒意，“但这居然不是个例。近半个月，各省各边区上报的干部报复批评者的事件就有七起。我们有些‘同志’希望如果有人敢站出来说话，就要付出血的代价。”\n叶莲娜，红军参谋长冰蓝色的眼眸看向克内希，语气直白：“克内希同志，所以你是打算让红军介入地方事务？”\n“是。” 克内希不假思索。“乌萨斯红军从诞生那天起就不是单纯的打仗机器，它是保卫革命、保卫劳动者的武装。现在新的革命局势既然已经走到了关口，地方上的蛀虫和动摇分子都在试图堵上群众的嘴，我们就不能让工农同志们孤零零地站在前面。我希望红军能接过保障革命秩序的职责，和各地的工农代表组织配合，扫清那些躲在革命队伍里的败类。”\n“我反对。”\n博卓卡斯替老将军的声音低沉厚重。\n“诸位……都清楚，乌萨斯帝国中央正在西线集结他们的军团，据说眼下还正在大批量生产他们的新式坦克，演练装甲突击战术，摆明了是要针对我们红军的短板。我们红军以步兵为主，我们的部队最习惯的是步兵对攻的陆军作战经验。现在红军全军都正忙着改良编制、训练反坦克技术、挖掘西线防御工事，恨不能一个人掰成两半用。”\n老将军瞥向克内希，对上她的灼灼目光：“把红军分散到地方去搞整肃掺和社会纠纷，会冲散备战的节奏的。如果我们的训练落下了，等和帝国决战的时候，我们要拿什么挡？要多承受多少不必要的损失？二来，红军现在就卷进地方政治里，官兵的军人认同会模糊，长期下来只会动摇队伍的忠诚观念。革命的军队，首先得能打胜仗，连这个国家都守不住，再进行改革也没用。”\n一堵墙仿佛压在会议室的空气里。众人——党政干部和军政干部的目光最终都落回塔露拉领袖身上。\n她的视线一会儿落在西线地图上密密麻麻的敌军标识上，一会儿看着那份案件卷宗上。她认同克内希的话——红军是革命的军队，绝不能看着劳动者被残害而无动于衷；可她也比谁都清楚，帝国的战争机器也正在加速运转，他们绝不是轻易就能撼动的对手。\n灯影在她脸上明暗交错，最终，她缓缓开口。"
 REU_dem_reform.9.a: "军队要支持革命群众。"
 REU_dem_reform.9.b: "军队要保持革命忠诚。"
 REU_dem_reform.10.t: "边疆区的见闻"
 REU_dem_reform.10.d: "科雷马边疆区的朔风裹挟着冰屑，刮过荒原发出呜呜的声响，像曾经来过的帝国苦役犯沉在风里的余叹。阿丽娜踩着冻得东一块西一块伤疤的土路走进村口时，脚步不由得顿住了。\n土坯矮房挤在背风的山坳里，多数烟囱只飘着一缕若有若无的淡烟；几个裹着破皮袄的村民缩在墙根下，露在外面的脸蛋与手背冻得满是冻疮，睁着怯生生的眼睛望着这群外来者。这里是边疆最偏远的村落，旧帝国时代是流放者的栖身地。虽然如今革命的红旗插上了乡苏维埃的房顶，阿丽娜看见旗杆上已经变成了新的红旗，但这里却依旧几乎没什么改观。\n迎上来的几个年轻乡干部个个面色疲惫，棉衣领口磨得发毛，眼圈乌黑。一见到阿丽娜，几人就忍不住倒起苦水：“阿丽娜同志，我们按上面的要求，白天拆了村口的宗教神庙，晚上村民就偷偷把神位请回家里去；卫生院免费发退烧药和抑制剂，他们转头就去神汉那儿讨符水。我们嘴皮子磨破了，没用！乡亲们要么当面点头应着，背后照旧；要么干脆跟我们对着干。我们是真不知道该怎么办了。”\n阿丽娜先温声安抚了几人，没急着听汇报，她裹紧大衣，沿着村巷慢慢走。巷子里静悄悄的，偶有几声咳嗽从土房里传出来，不少人家的门缝里飘出烧黄纸的淡烟。走到老榆树下时，她遇见个挎着补丁篮子的老大娘，听见干部们念叨，老人叹了口气，凑过来压低了声音：\n“同志啊，别怪小同志不尽力。前阵子村东头那寡妇家小子受了寒，烧得直说胡话。干部们说要送乡卫生所打针，那寡妇死活不依，说孩子冲撞了什么这里的神，非得喝请的符水。几个小同志守了三天三夜，没看住，那孩子……就这么没了。寡妇疯了似的往村后冰河跳，还是这几个干部跳冰窟窿里把人捞上来的，现在人还躺在床上，半死不活的。”\n老大娘用袖口抹了抹眼角：“造孽啊……可这或许就是命吧。”\n没等她开口，墙根下蹲着自顾自抽旱烟的老大爷咳了一声，沙哑着嗓子接过话：“不是命是啥？咱们村祖祖辈辈就受穷，这两年本来收成就薄，还被溃兵抢了两回。老天爷注定咱们这地方是苦窝，再折腾也没用。”\n“大爷，不是这样的。” 阿丽娜蹲下身，尽量让语气平和易懂，“这里穷是因为旧帝国的官老爷年年抢粮征税；是因为这边冻土厚、地力差，又没修水渠、改土壤，才打不出粮食。这些都能改——靠我们自己动手。”\n老大爷打量了她一番，摇摇头：“姑娘，你是城里来的文化人。可我们活了六七十年，世世代代都这么过来的。不是命，又能是什么呢？”\n阿丽娜张了张嘴，终究什么都没说出口。\n一行人沉默着走出村子。荒原上的风更猛了，萨沙走在她身侧。他作为阿丽娜教过的感染者学生，如今已经是红军里代号 “浮士德”的优秀射手、战斗英雄团长，自愿跟着阿丽娜做了这次出行的警卫。他望着绵延的雪原，忽然开口：“阿丽娜老师，我想起小时候住的那个村子里来过一群城里来的知识分子。他们都穿着西装，皮鞋擦得锃亮，然后站在土堆上讲什么要追求‘科学’‘启蒙’‘民主’，说拜神是愚昧，说老人们顽固不化。我们小孩们觉得新鲜；可村里的长辈都骂他们是‘洋先生’，忘了祖宗的规矩，拿土块把他们赶跑了。那些人走的时候还骂我们是愚民。”\n萨沙顿了顿，整理了一下腰间的步枪背带：“那时候我觉得他们说的都对，可看着村里面的老头老太们气的发抖，不敢吭声。现在想来，他们说的话很对，就是方法有很大的问题。”\n阿丽娜踩着积雪往前走，靴底发出咯吱咯吱的声响。\n她在村口停下脚步望了一眼风雪中朦胧的村庄，又望向远方正在施工的乡中心学校。"
 REU_dem_reform.10.a: "同志们，革命不等人啊！"
 REU_dem_reform.10.b: "萨沙，你说的，我会考虑的。"
 REU_dem_reform.13.t: "文艺会"
 REU_dem_reform.13.d: "符拉迪沃边区下着冷雨，打在文艺作家联盟办公楼的玻璃窗上。这栋砖石结构的老建筑原是帝国皇家文艺学会的东部分会，门楣上鎏金的双头鹰徽记已经被凿去，阿丽娜推开会议室木门时，迎面扑来还有一丝没散尽的烟熏味——内战最吃紧的时候，这里当过临时伤员收容所，她看到墙角至今还留着淡淡的碘酒印子。\n长桌上摊着刚油印完的第一届文联委员名册。阿丽娜拉过木椅坐下，扫了一遍，眉头越蹙越紧。名单上的名字她大半都眼熟：什么军旅作家、工人诗人、早年跟着她办过地下刊物的老战友……清一色是自己人。可那些曾在克列缅秋格的文化沙龙里名动一时、在科雷马的新大学讲坛上执过教的学者，翻完整本册子，也寥寥无几。\n“沃伊诺夫同志，” 她抬眼望向几个文联委员边的男人，在名册空白处轻轻点了两下，“我记得东达利亚的文化人，早年大半聚在克列缅秋格和北边边疆区。怎么委员里就这么几张熟面孔？总不能全都逃走了吧。”\n瓦西里・沃伊诺夫，如今的文联主席闻言苦笑了一声。\n他端起搪瓷水杯抿了一口：\n“哪能都跑了。解放那会儿还死心塌地给帝国唱赞歌的保皇文人，确实跟着溃兵逃去了西边；几个没跑掉的被工人纠察队揪了出来，现在还关在看守所里。”\n他顿了顿，脸上露出几分难色：\n“剩下的其实不少——比如大学教授、小说家、画家、民俗学家……他们大多早年就同情反抗帝国专制的势力，当时不少暗地里还给我们传过情报。可这些人大多是小资产阶级出身。他们拥护推翻帝国，赞成工厂归工人、土地归农庄，可对我们的塔露拉同志、对苏维埃、对我们进行专政的一元化领导有一肚子微词。有的私下说我们‘太激进’‘容不下不同声音’，有的干脆闭门谢客，不跟我们打交道。”\n沃伊诺夫又叹了口气：\n“前一阵党要清理思想阵线，一批说话出格的被划成‘妥协动摇派’，送进了劳动改造营；剩下没动的，同志们也都刻意疏远着，毕竟都害怕自己哪天也和他们一起倒霉。”\n阿丽娜没有插话。窗外的雨下得密了些，顺着玻璃淌下一道道水痕，模糊了窗外的街景。\n如果连受过教育的左翼同路人都被挡在阵线之外，如果文化阵地永远只围着一小群自己人打转，那终究只是闭门造车。民众听不到更多元的声音，看不到更实在的道理，就很难彻底砸碎旧帝国时代愚昧的界限。\n“我不这么看。” 她身子微微前倾，“这些人不是敌人。他们希望乌萨斯富强，没有跑也说明他们德行上并不有亏于劳动人民。文化建设、思想启蒙，不能只靠我们的老战友硬撑。我们需要还有学者去教书，需要作家去写文章，需要大家一起去撬动旧社会的思想根基。把他们推到对立面去，甚至直接关起来，最后损失的只会是我们自己的事业。”\n“我打算组建一批文艺工作队和基层宣讲队，把这些温和派的左翼学者都吸纳进来。只要不反对革命、不勾结帝国，就让他们自由创作。让他们下工厂进农庄，让他们亲眼看看革命到底是什么，看看工农的日子是怎么过的。革命思想都不是靠堵出来的，都是拥有真实经历才能最终达到拥护的。与其把他们挡在门外当隐患，不如拉到身边来，一起做事。”\n沃伊诺夫的眉头瞬间拧成了疙瘩：“阿丽娜同志，不是我泼冷水。这些人平日里大多一个个自视甚高，嘴上说自己是左翼拥护革命，心里未必服气。现在给他们自由，给他们平台，万一他们借着搞文艺的名头，暗地里散布怀疑论调，动摇民心怎么办？眼下西线帝国军天天在增兵，内部思想要是乱了，那就是后院起火！”\n他顿了顿，语气放低了些，却更实在：\n“再说下面的同志也不会答应，许多工人农民同志解放的时候流血出汗，现在又凭什么让这些躲在书斋里的人过来指手画脚？到时候闹起意见，反而更难办。”\n阿丽娜没有立刻反驳。她站起身走到窗边，望着雨幕里的城市。市政厅楼顶的红旗浸在雨里，沉甸甸地垂着。\n她想起当年偷偷给整合运动送药的医生，深夜里印发进步传单的教师，还有冒着风险发表进步文章的作家。他们或许不勇敢，或许不彻底，但他们到底不是敌人。\n雨声淅淅沥沥敲打着窗棂，打在沉默的空气里。许久，阿丽娜眼中已有了决断。"
 REU_dem_reform.13.a: "沃伊诺夫同志，给一些人摘帽吧"
 REU_dem_reform.13.b: "沃伊诺夫同志，我们还是要多培养新人。"
 REU_dem_reform.14.t: "工作队的考察"
 REU_dem_reform.14.d: "薄雪覆满了集镇的土路，乡苏维埃的动员会就设在冻得硬邦邦的打谷场边。克内希裹着件露了棉絮的旧皮袄，和几名随行的整合干部分散混在人群里，她把帽檐压过眉骨，没人认出这位来自中央的委员。\n台上的地方干部正挥着胳膊高声宣讲，从秋收征购讲到冬季修渠，他们个个都话语流利、情绪饱满，每讲一段便有人带头振臂呼号，前排的积极分子立刻跟着应和，喊声在寒风里十分响亮。克内希的目光慢慢扫过全场：站在前排的多是乡干部、劳模、民兵和入党积极分子；越往人群后排，气氛却越沉。家里贫苦的农民裹着老衣，抄着手缩在避风的墙根下，这些人始终抿着干裂的嘴唇，没人举手提问，也没人插一句话。\n最后前面人高呼“塔露拉领袖万岁！红军万岁！整合运动万岁！”，这个会就这么结束了。\n克内希跟着散会时人群一样散开，她听见身边两个老农低声嘟囔了句 “反正每次都是感谢共产党和塔露拉的好就行”，便裹紧袄襟匆匆走远了。\n随后几天她又混进了城区工厂钢铁车间开班前会的现场，只见工厂书记抱着新发下来的生产名册，从产量指标到工时安排逐条念完，淡淡地抬眼问了句“大家有没有意见”，底下一片机器余震般的沉默，便算全数通过。“那么，散会！”工厂书记宣布解散。克内希清楚的看到明明有个年轻工人张嘴想说什么，却被旁边的老工友扯了扯袖口，最终还是把话咽了回去。散会后工人们各自回到机床边，轰鸣的钢铁声里，没人再提起刚才的会议。\n工作队回到办公室时，天色已黑。随行的几名整合运动的干部搓着冻红的手，反倒觉得此行所见并不算糟。\n“克内希同志，我看基层好得很。” 有人先开了口，“地方干部动员能力强，说话有分量，群众都愿意听。这不正说明我们的整合工作做得好，大家信赖我们的领导吗？说实话，好多群众不就盼着我们拿主意，让我们带领他们干革命求解放吗？”\n旁人也纷纷附和，都说眼下正是百业待兴、西边不太平的时候，有强有力的基层领导领着大伙干反而是好事。\n克内希坐在桌前对着沿途记下的密密麻麻的笔记，眉头却始终没有松开。她不满地摇了摇头：“你们只看见我们的干部和积极分子们喊口号喊得响亮，那那些坐后排一声不吭的人呢？他们才真的是穿得最破、日子过得最难的农民，在车间里干活最苦的普通工人，他们不说话，那是觉得说了也白说，你布尔什维克党领导一切也主宰了一切嘛。我们搞民主改革，只要这些干部领着群众喊口号有什么用？！我们是要让老百姓自己敢自己开口做主人。”\n她站起身，走到窗边望向夜色里的雪原。远处工厂的烟囱冒着暗红的烟，像旧时代没燃尽的余烬。\n“旧帝国的官老爷们也觉得百姓沉默是‘挺安分的’，结果呢？我们这个新生的国家绝不能走这条路。让那些最该说话的人始终站在阴影里沉默，干部和群众之间就永远隔着一层墙。把矛盾藏在墙后面，早晚有一天会塌下来砸死人的。”\n她转过身：“我们社会主义国家要的不是一群只会听命行事的顺民，要的是劳动者能在精神上真正站起来，让他们敢站出来说自己的诉求，敢相信自己说的话算数。”"
 REU_dem_reform.14.a: "最终，几个整合运动干部被克内希说服了。"
 REU_dem_reform.14.b: "最终，几个整合运动干部兴致缺缺。"
