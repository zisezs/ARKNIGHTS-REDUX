#国策
 #点燃星火
 REU_Light_the_spark: "点燃星火"
 REU_Light_the_spark_desc: "感染者游击队在塔露拉的领导下，已经在东达利亚的冻土上辗转数载。塔露拉虽然希望感染者们有朝一日能够成为燃尽这片大地的火焰，但是现实的情况并不允许她做梦。游击队现在仍然只是一支小规模的部队，远未达到能够与周边贵族的亲兵对抗的实力，更遑论乌萨斯的几大集团军，所以当下我们要做的，是将这一点点火星，燃得更亮一些。"
 REU_Looking_for_firewood: "寻找柴薪"
 REU_Looking_for_firewood_desc: "如果说理想是火种，那么让火种延续下去的柴薪，便是感染者游击队的战士。只有不断吸收新的感染者加入我们的事业，理想的火焰才能延续下去，而我们这支小小的队伍，也才有可能撑过几个月之后自北地而来的冬日寒风。"
 REU_Wait_for_the_cold_wind: "等待寒风"
 REU_Wait_for_the_cold_wind_desc: "东达利亚的冬季是漫长而煎熬的，虽然游击队战士们已经在这片大地游走许多年，但是肉体终究不是钢铁所铸，没有人能够不依靠任何装备在寒风和冰雪之中生存。所幸，这段时间的准备工作让我们的队伍能够勉强撑过即将到来的冬季，并且留存最后一丝精力，在来年的春天对未来进行展望。"
 REU_Establish_material_exchange_channels: "建立物资交易渠道"
 REU_Establish_material_exchange_channels_desc: "虽然感染者和普通人之间存在隔阂，但在营地周边的村落中，一些善良的农民仍然愿意与我们交换生存物资。如果我们能够挑选出几个人与他们定期交易物资，便能够保障补给来源的稳定，况且，若是与村民们处好了关系，我们也可以寄希望于他们偶尔的慷慨。"
 REU_To_improve_the_conditions_of_the_campsite: "改善营地条件"
 REU_To_improve_the_conditions_of_the_campsite_desc: "队伍中懂得判断天灾和气候的战士最近感到些许忧虑，他们一致认为今年的冬天会比以往更为寒冷，北风的凶狠程度也会更上一层。因此，对营地内的房舍进行加固，并且趁冬天尚未到来，临时增开几个烧炭工坊，将有助于我们更好的熬过即将到来的寒冬。"
 REU_Ursus_Poetry: "乌萨斯的诗"
 REU_Ursus_Poetry_desc: "提到乌萨斯，外乡人会想到一个好战、高傲的民族，感染者们则会想到残暴、恐怖和奴役。但在历史上，乌萨斯也从来不缺乏伟大的诗人、乐师和舞者，而让孩子们知道什么才是“乌萨斯”这三个字背后真正重要的东西，便是阿丽娜和其他感染者老师们的职责。"
 REU_Make_recon_Squad: "培养侦察小队"
 REU_Make_recon_Squad_desc: "随着游击队为越冬而驻扎在固定地点，培养一批侦察兵的计划就必须提上日程。这些侦察兵的职责是寻找并标记附近的感染者纠察队，让游击队在与乌萨斯当局的对抗中获得一点点情报优势，从而占得属于弱者的先机。"
 REU_Free: "主动出击"
 REU_Free_desc: "感染者纠察队常常会押送感染者去往矿场或工厂，而驻扎在东达利亚的帝国集团军手中的装备和补给品也是游击队极缺的优质资源。如果在面对军队时我们可以利用情报优势主动出击，我们就能有更多的机会获取更加高效的装备，增强我们的力量。"
 REU_Lost: "避免牺牲"
 REU_Lost_desc: "每个跟随游击队的感染者，都不是为了无谓的牺牲才做出这样的选择的，而我们也不应该将生命简单地看作胜利的代价。面对感染者纠察队时，若非必要，我们都应当避其锋芒，防止暴露我们的位置，同时避免损失更多的有经验的战士。"
 REU_Fire_kid: "武装孩子们"
 REU_Fire_kid_desc: "队伍中有许多孩子，他们有些是游击队战士的儿女，有些是被解救的孤儿，在最坏的打算中，这些孩子最终有可能独自面对敌人，因此，教导他们一些基本的战斗技能，是对孩子们的生命负责的必要之举。为了生存，相信他们都会理解的……"
 REU_Talulah_Frostnova: "黑龙与白兔子"
 REU_Talulah_Frostnova_desc: "塔露拉作为游击队中的后来者，却因为一些不成熟的理想成为了感染者们的领袖。叶莲娜身为游击队的创始人之一，对这个来路不明又异常强大的德拉克，心中始终存着几分提防。但在冬天到来前的那次谈话中，两个年轻的领袖们还是达成了一项共识，游击队将开始试探感染者数量众多的大城市，在下一年向切尔诺伯格进军。"
 REU_A_good_sleep: "让同伴安息"
 REU_A_good_sleep_desc: "矿石病是一种绝症，只要感染上，感染者的生命便已经进入了倒数。而在感染者游击队中，因病去世是仅次于战斗减员的第二大死亡原因。虽然矿石病有一系列治疗药物，但全部都只有缓解病情恶化，延缓发病速度的效果，但这样的药物，对于游击队，也同样是一种珍惜资源。对于那些已经到达重症阶段的感染者们，我们是要拿为数不多的药品进行最后一次尝试，还是为那些剩余生命更多的人们留下一些资源？"
 REU_Nothing_to_eat: "拮据的口粮"
 REU_Nothing_to_eat_desc: "在口粮问题上，游击队还没有听到过几次好消息。无尽的辗转使得游击队自行耕种成为无稽之谈，而感染者与普通人之间的隔阂又使得在交易中换取口粮极为困难，很不幸，在今年的冬天，我们错误估计了口粮的消耗速度，在交换或劫取到下一批补给之前，我们有必要对口粮的供应量进行限制了，所以，有人会数学吗——"
 REU_Walk_on_the_ice: "走上冰面"
 REU_Walk_on_the_ice_desc: "依赖在村庄中交换的面包或林中采集的野果，不足以保证整个游击队的生存所需，而在冬季还能稳定产出食物的唯一手段，便是渔获。在我们能够控制的区域中，包括了一段（贝加尔）湖的湖岸，而装扮成普通渔民前往冰面上捕鱼，是一种既安全又高效的食物获取手段。而为了加快破冰的效率，塔露拉表示自己愿意帮助捕鱼小队出一份力。"
 REU_Take_the_medicine: "夺取药品"
 REU_Take_the_medicine_desc: "侦察小队前日发现了几条新开通的运输线路，这些使用普通卡车而非陆行舰的小车队偏偏运输的是为乌萨斯军警过冬而配给的医疗用品，袭击这些线路或许会增加敌人对我们的注意力，但是也能让我们的战士更好地撑过这个冬天。"
 REU_Village_Intelligence_6: "村庄情报网"
 REU_Village_Intelligence_6_desc: "通过持续的交易，我们已经和周边的几个村庄搞好了关系，村民们已经不会将我们的战士视为怪物或者别的什么东西，因此，我们或许可以与这些村庄建立更加稳定的交流渠道，让村民们帮我们注意感染者纠察队，而在纠察队进村作威作福之时，我们也可以为他们提供一些保护。"
 REU_Frostnova_say_ee: "霜星的不语"
 REU_Frostnova_say_ee_desc: "叶莲娜·“博卓卡斯替”，游击队元老“爱国者”的养女，也是在“爱国者”年老后逐渐接替其带领游击队的接班人。她对游击队的现任领袖，塔露拉，内心中一直存在着两个矛盾的观点，她相信着塔露拉口中稚嫩的理想，但同时对这个神秘莫测的德拉克满怀猜疑。不过，在当下艰苦但平静的日常中，叶莲娜选择如霜天中的星辰一般，沉默不语，将疑问留到将来。"
 REU_Elite_Finn: "精锐雪怪"
 REU_Elite_Finn_desc: "雪怪小队是霜星一手组建起来的队伍，其成员大多都是在游击队建立初期，便与霜星并肩作战的战士们，叶莲娜给予他们无条件的信任，而他们也同样无条件地信任“大姐”。现在，我们的下一个目标设定为向城市进军，那么这支精锐小队的作用便至关重要。一部分雪怪小队的老兵被提拔为教官，教导其他的游击队成员，而其他队伍中出众的战士，也会被调到雪怪小队中，学习更多的战斗技能和源石技艺。"
 REU_Enlarge_the_guard: "扩大盾卫队伍"
 REU_Enlarge_the_guard_desc: "多年以前，“爱国者”带领一支盾卫部队出走，他们成为了游击队最早的一批战士。如今，游击队的武器储备稍微丰富了些许，而一些能够打造装备的工匠也加入了我们的行列，培养新的盾卫已经成为了可能，而我们游击队中的感染者，并不缺乏愿意将战友保护在身后的战士。"
 REU_Promotion_team: "推广小组作战"
 REU_Promotion_team_desc: "战斗并不是不用思考地和敌人蛮干，如果拥有战术和技巧，我们完全可以以更少的代价获得更大的战果。霜星将在爱国者的协助下，把在泰拉军队中已经广泛运用的小组作战战法推广到游击队之中，拥有更强战斗力和指挥能力的战士将成为“组长”，成为游击队作战指挥层级之中最基层的指挥员，在具体的作战情境下带领战友们灵活发挥。"
 REU_The_teacher_of_the_infected: "感染者们的老师"
 REU_The_teacher_of_the_infected_desc: "如果未来的目标是进入城市，那么我们的感染者战士们就不能一直满足于自己粗鄙的面貌。将识字班、科普班这些原本只为孩子开设的学习班推广到整个游击队中，能够提高战士们的文化水平和素养，并且让他们明白，知识对我们的事业是多么重要。而阿丽娜作为孩子们的老师，要承担组织起这些学习班的任务，她想必是最合适的人选……"
 REU_Prepare_the_city_propaganda_organization: "筹备城市宣传组织"
 REU_Prepare_the_city_propaganda_organization_desc: "城市中有数量众多的感染者，但他们与因暴露在天灾下感染的农民不同，大多是在生产或生活中因意外感染的，其中还不乏富贵人家。如何要让他们理解并接受我们的理想，加入我们的队伍，这是我们在进入城市前需要回答的问题。目前看来，让队伍中了解城市生活的感染者们成立一个宣传组织，是在心理上建立战线的最好手段。"
 REU_Chernobog_recon: "切城侦察行动"
 REU_Chernobog_recon_desc: "切尔诺伯格，乌萨斯帝国在远东的重要移动城市，有为数众多的感染者在这座城市的工厂里燃烧着生命，而我们终有一天要解放他们。“弑君者”柳德米拉已经动身，她将带领一支小队，为我们探明切尔诺伯格城的构造和守备情况。"
 #光自卡兹戴尔
 light_from_Kazdel: "光自卡兹戴尔"
 REU_Light_from_Kazdel: "光自卡兹戴尔"
 REU_Light_from_Kazdel_desc: "一支神秘而特别的部队救下了阿丽娜，他们自称从卡兹戴尔而来，但他们的人员组成和目的都不甚明朗。当务之急，是与游击队的其他人说明此事……"
 REU_Alina_statement: "阿丽娜的陈述"
 REU_Alina_statement_desc: "作为第一个遇见那支自称“红军”的部队的人，阿丽娜将在其他游击队领袖的面前说明事情经过，顺便一举两得地将塔露拉擅自离队是检讨和向其他人介绍阿丽娜的计划一起完成。"
 REU_Build_a_new_camp: "营建新营地"
 REU_Build_a_new_camp_desc: "萨卡兹红军的先头部队已经到达，据他们的说法，还有一支更庞大的部队在行军当中。我们的营地显然无法容纳更多人员，因此我们在原营地的东侧开拓了新的区域，让萨卡兹红军在那里驻扎，而他们的先头部队将与我们一起建设这片新营区。"
 REU_Ask_for_help_again: "寻求帮助，再一次"
 REU_Ask_for_help_again_desc: "游击队如今面临一个很现实的问题。红军的抵达无疑能增强我们的力量，然而我们本就匮乏的粮食储备根本不足以喂饱即将到来的上万张嘴。我们只能试着再次向周边的村庄寻求帮助，看看他们能不能再给我们一些口粮，尽管我们也清楚，村民们的口粮可能也不足以支撑他们挺过这个冬天。"
 REU_Communism_coming: "康拉德·克内希到来"
 REU_Communism_coming_desc: "萨卡兹红军的大部队到了，而他们的领头人是一个金发的萨卡兹女性。那个人自称康拉德·克内希，担任着一个名为“卡兹戴尔共产党”的奇怪组织的领导职位，而她和她的部下想和我们开诚布公地谈谈。"
 REU_One_by_one: "两支部队，两个指挥"
 REU_One_by_one_desc: "在先前的会议上，我们已经决定让游击队与红军分属两个指挥系统，大家一致认为，让指挥官们率领自己熟悉的部队，能够发挥出部队的最大潜力，而战士们继续与熟悉的战友作战和训练，心理上也同样会更易接受。"
 REU_One_by_more: "采用混合编制"
 REU_One_by_more_desc: "在先前的会议上，我们决定将萨卡兹红军和游击队整编为一支新的部队，以补齐人数不足的编制。虽然在初期的磨合上可能有些挑战，但指挥官们认为，让战士们互相交流作战经验，有助于整支队伍战斗力的长远提升。"
 REU_Unremitting: "自强不息"
 REU_Unremitting_desc: "塔露拉和阿丽娜都认为，我们不能总是依赖于向村民们索取物资，随着我们抢夺或交易得到的生产资料越来越多，我们有能力也有必要建立起自给自足的生产体系。利用营地周边的资源，我们已经可以通过土法生产出很多东西，虽然我们的产品质量可能不尽人意，但在这片冻原上，还能奢求什么呢。"
 REU_Rely_on_transactions: "依赖交易"
 REU_Rely_on_transactions_desc: "克内希提醒我们，与群众的交流是至关重要的，而物资的交易是建立起联系的物质基础。游击队的生命在于这片大地之中，而加深我们与周边村庄的物资交流，是解决补给问题的最高效也最简单的方案。我们自身的生产能力当然应该增强，但这些产品应当更多地用于与村民们的交易。"
 REU_The_new_communists: "康拉德的新学生"
 REU_The_new_communists_desc: "塔露拉、阿丽娜、叶莲娜，这三位年轻人，康拉德·克内希在她们的身上看到了这片大地未来的希望，因此她将马佐夫和海森的理论倾囊相授。而三位年轻人也并未辜负她的期待，在几次点拨后，她们逐渐摸到了“共产主义”这个崭新理论的门道。认为时机已然成熟，康拉德现在将引领她的新学生们，走出木屋中的小课堂，在冻原之上开展实践教学。"
 REU_Mass_line: "第一课：群众路线"
 REU_Mass_line_desc: "康拉德和卡兹戴尔共产党不是为了少数人的利益而战斗，相反，萨卡兹红军是为了最广大人民群众的利益而战斗的，而这场战争离开了人民群众本身，便无从谈起。现在，康拉德·克内希要向感染者游击队传授这个道理，而这节课将从一次简单的拜访开始。"
 REU_Hug_each_other: "相互拥抱"
 REU_Hug_each_other_desc: "周边的村庄在游击队的困难时期为我们提供了极大的帮助，即使是以旧时代的礼节，不去道谢也是说不过去的。因此，游击队的几位领袖将各自率领一小队士兵，前往临近的村庄，向当地村民们表达感谢。"
 REU_Not_slaves_helpers: "不是奴隶，是帮工"
 REU_Not_slaves_helpers_desc: "感染者奴工制度是乌萨斯帝国在这片大地上刻下的最丑陋的一道伤痕，这也导致许多逃亡到我们队伍中的感染者们对工作本身相当地恐惧。但是劳动是人类区别于野兽的标志，因此我们需要让感染者们在劳动中找回自我。恰好在开春之后，周边乡村的农民们缺乏劳动帮手，让战士们去帮忙做农活，可以锻炼战士们，更可以加深我们和村民们的关系。"
 REU_Let_the_soldiers_go_home: "让战士们回家"
 REU_Let_the_soldiers_go_home_desc: "我们队伍中的好些战士都是因感染矿石病被迫离开家乡的，他们离乡的理由是躲避乌萨斯军警，并不是被家乡的人们所排挤。现如今战士们都在游击队中安顿了下来，是时候允许他们返乡探亲了，而他们的经历也将成为宣传我们的理想的绝佳教材。"
 REU_Class_view: "第二课：阶级观点"
 REU_Class_view_desc: "为什么乌萨斯的军警和农民都是非感染者，他们对我们的态度却天差地别？康拉德让宣传小组这几天增印一批小册子，她说这里面写有数十年前来自马佐夫与海森的回答。一批先行版已经下发到各个小组的组长手中，阿丽娜建议我们在几天后和组长们开一个读书会。"
 REU_Pick_up_the_Sarkaz: "接纳萨卡兹人"
 REU_Pick_up_the_Sarkaz_desc: "虽然游击队内之前已经有萨卡兹人存在，但要让主体民族为乌萨斯、埃拉菲亚、卡特斯等冻原民族的游击队员们迅速地与一支全是萨卡兹的部队融合在一起，显然不是一件简单的事情，更何况他们之中还有很多人不是感染者。在博卓卡斯替的牵头下，一支专门的工作小组受命去引导游击队战士们，让他们尽快接纳新的战友的到来。"
 REU_The_Sarkaz_weapon_manufacturing_science: "萨卡兹武器匠人"
 REU_The_Sarkaz_weapon_manufacturing_science_desc: "一批萨卡兹工匠随着红军抵达了营地，他们拥有高超的铸造技术，手上还有几台现代的生产机械，我们已经开辟了一块区域来搭建他们的工坊，现在只需等待他们将新招揽的工人们培训完毕，我们新的兵工厂就可以开张了。"
 REU_The_nice_book: "来自文明世界的书籍"
 REU_The_nice_book_desc: "萨卡兹红军对文化的追求是我们前所未见的，即使卡兹戴尔长期处于动荡中，他们还是试图收集来自世界各地的全新书目，而如今他们又慷慨地将这些典藏赠予我们。营地内的一座小屋被重新设置为图书馆，面向所有愿意获取知识的战士和孩子们开放。"
 REU_Educated_youth_go_to_the_countryside: "把知识散播到村庄"
 REU_Educated_youth_go_to_the_countryside_desc: "愚昧是东达利亚冻原上的诅咒，而破除这一诅咒的方法只有知识。统治者们只会将知识锁在自己的高塔之中，而我们将证明，知识在人民中才能真正发挥它的力量。让队伍中少有的几个知识分子带队下乡，将我们的理念和实用知识一道传播到冻原的村庄之中。"
 REU_Can_production_line: "建立罐头生产线"
 REU_Can_production_line_desc: "渔猎和采集野果野菜是我们长期以来获取食物的方式，但这样做的显著缺点就是得到的食物难以保存。好消息是萨卡兹红军的后续部队带来了几台罐头的生产设备，只要我们能够弄到液化源石发电机，我们就能得到可以保存至下一个冬天的罐头食品，还可以将其添加进与村民交易的清单中。"
 REU_Exploration_of_mineral_veins: "探查矿脉"
 REU_Exploration_of_mineral_veins_desc: "在萨卡兹红军为我们带来了几座工厂之后，我们对源石及其他矿产的需求就越来越大。得益于临近村庄中的几位老矿工的指引，我们在控制区内发现了几座新的矿山，在装备准备就绪后，便可以进行初步的勘探和采掘。"
 REU_Deal_with_the_white_area: "与白区交易"
 REU_Deal_with_the_white_area_desc: "乌萨斯当局知晓我们的存在，但他们仅限于知晓。若是让村民们作为中间商，我们便可以同临近城镇中的商人们进行交易，既不会暴露我们的踪迹，还可以获取我们急需的工业物资。"
 REU_Set_up_a_medical_station: "开设医疗站"
 REU_Set_up_a_medical_station_desc: "萨卡兹人的源石技艺水平高超，这是泰拉大地上每个人公认的事实。而康拉德·克内希将红军中最强的术士们都编入医疗组中，这样的决策保证了在北征途中红军极小的非战斗减员。现在，克内希要求医疗术士们下到基层，在解决游击队和周边村民们实际困难的同时，在情感上与我们更进一步。"
 REU_Learn_combat_skills: "学习萨卡兹战斗技巧"
 REU_Learn_combat_skills_desc: "在多年的征战中，这批萨卡兹战士们将战斗经验精炼成肌肉记忆和条件反射，我们选择其中最精锐的那些人担任教官，在当前这一战斗较少的时段，训练游击队员们的技战术能力，以期在未来的冲突中胜过乌萨斯军警们一头。"
 REU_The_experience_of_tundra: "冻原的经验"
 REU_The_experience_of_tundra_desc: "辗转东达利亚冻原多年，我们自有一套与乌萨斯军警、与这片大地斗争的经验，而这些是初来乍到的萨卡兹们所欠缺的。想要帮助他们在冻原上生存下去，我们需要把这些经验传授给他们。"
 REU_Believe_in_non-infected_people: "相信非感染者"
 REU_Believe_in_non-infected_people_desc: "萨卡兹红军的经验告诉我们，感染者与非感染者完全能够和睦相处，甚至并肩作战。而我们与那些和善的村民们交往的经验，似乎也证明了这一观点的正确性。或许，我们应当尝试着同周边的村庄加深联系……"
 REU_health_to_villages: "卫生进乡村"
 REU_health_to_villages_desc: "队伍中的医护人员们一致认同，矿石病的危害被妖魔化了，普通人对感染者的排斥皆因于此。如果我们能让专业医生们向村民们解释，矿石病并不会通过普通的接触传染，那么相信他们都会对我们放下成见。当然，科普工作要和医疗下乡一起进行。"
 REU_When_you_need_generosity: "需要慷慨的时候"
 REU_When_you_need_generosity_desc: "冻原上的农民，他们的生活并不比我们舒服多少，他们同样缺乏如药品、燃料之类的珍贵工业品。康拉德告诉我们，如果游击队能够做到将珍惜的资源优先让给村民们，就一定能得到人们的衷心拥护。她是一路从卡兹戴尔摸爬滚打走过来的，也许我们应该试一试。"
 REU_Purchase_safety_facilities_in_mining_area: "采购矿区安全设施"
 REU_Purchase_safety_facilities_in_mining_area_desc: "资源勘探工作已经初见成效，但是现阶段我们手中的装备无法进行深入的开采。矿区的源石环境极不稳定，如果缺少安全设施，即使是感染者矿工，危险的环境也会加重他们的矿石病，更不用说坍塌等其他风险。不过既然我们已经开通了与城市的交易渠道，那么稍微等待交易小组获取一批专业的安全设施，所消耗的时间成本并不昂贵。"
 REU_Democratic_management: "民主管理的尝试"
 REU_Democratic_management_desc: "一些萨卡兹红军战士向我们表示，既然我们有了自己的生产体系，那么工作场所的民主就应当被提上日程，即劳动者们的劳动时间、劳动强度以及领班人都应当交予他们自行决定。这样的制度确实符合社会主义的理想状态，而我们对于实行效果的忧虑，红军战士们表示，他们会提供一切支持。"
 REU_Develop_urban_miners: "发展城市矿工"
 REU_Develop_urban_miners_desc: "之前我们进军切尔诺伯格的计划因为一系列突发事件而搁置，但我们仍然留下了一点点成果，那就是我们在城市内的工作小组。叶莲娜将着手联络柳德米拉，让她将我们在矿区中的成功试验宣传出去，从而吸引更多的城市感染者来到我们的营地，壮大我们的队伍。"
 REU_Enhanced_warlock_equipment: "强化术士装备"
 REU_Enhanced_warlock_equipment_desc: "开采出的源石除去作为燃料的一部分，另一部分可以被用来加强我们术士队伍的装备水平，配合上我们从城市中采购到的零件，我们可以让我们的术士们更好地发挥出他们的源石技艺。"
 REU_Attack_the_aristocratic_mansion: "袭击贵族宅邸"
 REU_Attack_the_aristocratic_mansion_desc: "要让我们的战士和其他人迅速理解阶级观念是不现实的，我们还是应当一步步来。很多战士们都是出身于村庄之中，而在村庄中最尖锐的阶级对立便是贵族地主和普通农民之间的对立，最近的一个贵族宅邸就在我们的控制区边缘，里面的贵族老爷还不清楚我们现有的力量，也许他可以成为一个很好的教材……"
 REU_Anti-tax_struggle: "抗税斗争"
 REU_Anti-tax_struggle_desc: "按照乌萨斯的气候，农田中的粮食即将成熟，而由上层贵族派遣下来的税务官也将于此时来到乡野之中。这些税务官不仅冷酷无情地执行着贵族定下的苛刻税额，还经常威胁村民们贿赂他们，不过在我们到来后，这种情况不会再发生了。派遣我们的战士伪装成村民，指引各村庄的农民进行抗税斗争，狠狠地打击乌萨斯统治者的嚣张气焰，并且为乡亲们谋取切实的利益。"
 REU_Public_trial_meeting: "公审大会"
 REU_Public_trial_meeting_desc: "在先前的行动中，一些死不悔改又作恶多端的贵族或税官被我们绑回了营地，虽然很多游击队员都主张将他们处决，但萨卡兹红军的建议是，把他们拉到临近的村庄中，召开一场让所有人都参加的公开审判大会。这是群众民主的要求，一些红军战士如是说道。"
 REU_Act_together: "共同行动"
 REU_Act_together_desc: "根据阶级观点，人们不再应当被分为感染者与非感染者，而是应该分为工农阶级和食利阶级，因此，那些同样受苦受累的农民和我们是同一条战线上的战友，那些欺压百姓的贵族和感染者纠察队是我们共同的敌人。联络与我们友好村庄的村民，一同对附近的贵族地主和纠察队发动袭击，重新分配他们的财富，可以让我们获得更多普通村民的支持。"
 REU_New_hideout: "新的藏匿点"
 REU_New_hideout_desc: "我们和附近村庄的老百姓关系越来越好，他们逐渐意识到感染者并非瘟疫，我们的战士也明白了普通人并不自发地仇视感染者，我们之间的隔阂都是统治阶级营造出来的铁幕。而随着我们活动范围地扩大，一些战士不可避免地需要长驻村庄之中，因此，我们可能需要和村民们借住几间房舍，以避开巡逻中的感染者纠察队，作为交换，我们将为村民们提供保护。"
 REU_Let_the_children_play: "让孩子们玩耍"
 REU_Let_the_children_play_desc: "虽然我们的群众工作已经取得很大进展，但让所有人立刻转变观念是不现实的。幸运的是，孩子们的思想仍是一张白纸，没有被旧观念所荼毒，我们可以让老师们主导搭建一片让周边村庄的孩子们游玩的区域，让他们来和我们队伍里的小战士们交朋友。"
 REU_A_public_debate: "一场公开的辩论"
 REU_A_public_debate_desc: "我们最近的行动引起了队伍里一些人的不满，他们认为塔露拉和其他领袖背叛了自己的“理想”，选择与其他非感染者“同流合污”，忽视了为感染者自身谋取利益。他们称康拉德·克内希和她宣传的“社会主义”是软弱的异端学说，是向非感染者势力投降，而毫无头脑地打击贵族地主，是为了领袖自己谋取财富。虽然他们说得似乎有一些道理，但是康拉德提醒我们，这个派系的人们，似乎都是小有家资的被迫流亡者，和穷苦的普通感染者“有本质上的区别”……"
 REU_Vanguard_organization: "第三课：先锋组织"
 REU_Vanguard_organization_desc: "指望所有人的思想觉悟像往杯子里倒水一般，同步地上升，显然是幼稚的。实践经验表明，几个先进分子的带头作用是显著的，康拉德说，这些先进分子所组成的先锋组织，便是未来斗争中的核心力量。先锋队将负责领导斗争、保卫人民、引领思想，并且在成功夺取政权的未来统筹经济建设和民生事务，而这些工作的准备，要从现在开始。"
 REU_Activist_study_class: "积极分子学习班"
 REU_Activist_study_class_desc: "虽然阿丽娜老师的工作量已经很大了，不过当前似乎只能继续委屈她了。我们把所有在之前的斗争中表现突出的战士们组织到一起，建立了一个新的学习班，教授社会主义的基本原理和管理手段。这些积极分子之后将被冠以一个从高卢语舶来的称呼，Кадры，即“干部”。"
 REU_Exemplary_role: "表率作用"
 REU_Exemplary_role_desc: "作为积极分子，自然做什么事都是要比其他人更加积极，只有做得多做得好，才有资格成为之后的干部。通过鼓励积极分子在生产和战斗中发挥表率作用，并且对其中表现突出的人进行公开的表彰，可以在思想宣传和激励战士方面做到一举两得。"
 REU_Political_commissar: "政治委员"
 REU_Political_commissar_desc: "虽然我们的战士都是有理想的人，但是在战斗中他们还保留了许多陋习，比如虐待俘虏或是私藏战利品，要想教育战士们，康拉德建议我们学习萨卡兹红军，在各个层级的作战小组中，选出作战能力强同时又思想进步的战士，作为政治委员，与小组长等指挥职位平级，政委管生活，指挥官管作战。"
 REU_Learn_administrative_methods: "学习行政方法"
 REU_Learn_administrative_methods_desc: "随着我们与群众的关系愈发紧密，加上我们在不少地方已经清除了贵族势力，我们的队伍已经实质上成为了本地的行政机构，随之而来的便是控制区内群众面临的切实问题，变成了我们身上的切实责任。处理群众之间的小事就是整个队伍的大事，为此我们需要购买一些相关书籍进行学习，同时与各个村庄的村长和乡绅们虚心求教，毕竟，我们暂时还需要他们。"
 REU_Prepare_for_the_establishment_of_a_school: "筹建学校"
 REU_Prepare_for_the_establishment_of_a_school_desc: "让孩子们得到教育，不是一件可以等到斗争胜利后才开始办的事情，相反，这是斗争的一部分。有一些被我们的宣传吸引而来的城市知识分子在近期抵达了营地，我们终于可以扩建我们的学校了，这所学校将面向控制区内所有的孩子开放，无论感染者或非感染者，并且我们保证，上学一定是免费的。"
 REU_Agrarian_revolution: "打贵族，分田地"
 REU_Agrarian_revolution_desc: "虽然我们之前已经惩戒过几名贵族，但还有一些小贵族不在第一次行动的目标中，不过现在他们的好日子到头了。在游击队武装力量的撑腰下，我们鼓励村民主动去抄了贵族的老宅，并在工作组指导下，把贵族占有的土地重新分配到各家各户。"
 REU_Recruitment_of_uninfected_workers: "招募非感染者工人"
 REU_Recruitment_of_uninfected_workers_desc: "我们的矿场和几个工厂虽然并不缺乏人手，但是招入更多的工人以实现轮班制，也是不错的选择。为了展现我们与非感染者之间并无敌意和隔阂，我们的工厂将向周边的村庄开放更多岗位，既能让农民们多掌握一门手艺，也让他们在农闲时分多一些收入。"
 REU_Infiltrate_the_infected_picket_team: "渗透感染者纠察队"
 REU_Infiltrate_the_infected_picket_team_desc: "乌萨斯军警之间也并非铁板一块。根据社会主义的理论，军警之中的很多人同样也是为了混口饭吃的无产者，所以他们也是我们可以团结的对象。一些非感染者的村民愿意帮助我们渗透进附近的感染者纠察队中，传播我们的理念，说不定可以策反一些尚存良心的纠察队员，最坏的结果，也可以扰乱敌人的军心。"
 REU_The_first_Congress: "召开第一届整合运动萨卡兹红军大会"
 REU_The_first_Congress_desc: "在建立先锋队的初期准备工作和稳定控制区局势的工作双双完成后，召开整合运动游击队和萨卡兹红军的联席大会的实际已经成熟。会议将选举即将成立的“乌萨斯共产党”的领导集体，确定党的革命纲领和具体的斗争路线，并且准备建立政权，与乌萨斯当局分庭抗礼。"
 REU_emergency_meeting: "反剿灭紧急会议"
 REU_emergency_meeting_desc: "最坏的情况出现了。尽管康拉德时常提醒我们，进步势力将要面对反动派的联合绞杀，但贵族同盟和第三集团军的剿灭作战仍然超出了我们的应对能力。根据地边缘的友好村庄被敌人烧毁，几支游击部队也已经被打散建制，为了生存，我们急需召集所有干部和指挥官，商讨应对敌人的方法。"
 REU_To_the_south: "前往南方"
 REU_To_the_south_desc: "南下是塔露拉很早就提出的策略，但没人想到游击队的南下之路，会以这样的形式揭幕。根据地附近的村庄已经与我们建立了紧密的关系，游击队的营地建设也初见成效，但面对数倍于我们的敌军，如果要活下去，只有一条路可走：抛弃我们短暂的家，走过卡兹戴尔红军来时的路，前往南方。"
 REU_Buy_time: "争取时间"
 REU_Buy_time_desc: "时间是我们最缺乏的资源，南下的筹备和行军都需要时间，但敌人并不会给我们这个机会，因此我们只能自己争取。部分战士必须留下，拖延敌军的进攻，掩护主力部队和组织核心的撤退。"
 REU_Elite_vanguard: "精锐先锋"
 REU_Elite_vanguard_desc: "游击队和萨卡兹红军之中，总会有几支部队在装备和作战水平上更为突出，而这时候便是他们表现的时候了。叶莲娜已经主动请缨，与雪怪小队率先向南进发，击破脆弱的地方守备军，为大部队的行军开路。"
 REU_three_discipline: "三大纪律"
 REU_three_discipline_desc: "游击队将要离开自己熟悉的土地，为了确保南进过程中的军队纪律，也为了长远解决军民关系问题，几个高层干部们讨论出了三条简明易懂的口诀，让战士们牢记于心：一切行动听指挥，不拿群众一针一线，一切缴获要归公。这三大纪律将成为游击队区别于乌萨斯旧军队的关键。"
 REU_mobilize_the_masses: "发动群众"
 REU_mobilize_the_masses_desc: "在内卫的领导下，剿灭军势如破竹，我们布置的哨卫营地根本无法阻挡敌人的进军，留给我们的倒数第二道防线只有根据地周边的村庄了，如果本地的居民不配合，敌人的驻军和补给就会受到影响，从而影响敌人的行军速度，为主力的转移赢得宝贵的时间。"
 REU_Light_Pack: "轻装上阵"
 REU_Light_Pack_desc: "进军的速度是最重要的，为此我们不得不放弃一些笨重的设备，包括那几台萨卡兹红军带来的机器。虽然很可惜，但是工兵们保证，他们能够在安顿下来以后重新攒出一套工业设备，相比起大家的生命安全，他们的辛苦微不足道。"
 REU_Take_Everything: "带走一切"
 REU_Take_Everything_desc: "根据地的一切资源都是游击队和群众的心血，我们不能轻易将它们抛弃。尽管携带这些资源和设备会严重拖慢行军速度，但是它们同样也能提供进军途中不可或缺的补给，并且在我们安顿下来后，它们会加快新根据地建设的速度。"
 REU_resistance_seeds: "反抗之种"
 REU_resistance_seeds_desc: "行军途中遇到的群众并没有听说过什么部队叫感染者游击队，又是什么思想叫共产主义，而我们对沿途乌萨斯纠察队的胜利和打击贵族的行动让他们很快就明白了。为巩固群众工作的成果，也为了继续拖延身后的敌军，一些干部留在了当地，在沿途百姓的心中播下反抗的种子。"
 REU_whole_to_parts: "化整为零"
 REU_whole_to_parts_desc: "神出鬼没的游击队是敌人的噩梦，每天击杀几个人的战果并不丰硕，但对敌人的心理打击是显著的。让留守游击队能够达到这一点的关键，是与群众融为一体的能力。敌人将永远活在这样的恐惧中，他们看见的每个淳朴农民，都有可能是身经百战的游击战士，在等待着一击毙命的时机。"
 REU_Avoid_involvement: "避免牵连"
 REU_Avoid_involvement_desc: "我们必须最大限度地低估敌人的下限，群众已经为我们做了太多，我们不能再让战火燃烧到他们的身上。为了防止敌人对群众进行报复，战士们必须远离各个村庄，灵活利用隐藏在森林中的资源袭击敌人，尽管这会大大增加战士们的损失，但是能够避免群众付出更大的牺牲。"
 REU_New_Comrade: "新的同志"
 REU_New_Comrade_desc: "南下的路上，感染者、贫困的农民、矿工、孤儿……很多无处可去的人们加入了我们的队伍。在研究部队现状后，我们决定将其中有作战能力的人征召为游击队的战士，不过是编制一支全新的部队，还是将他们与有经验的士兵们混编，还需要指挥官们的进一步讨论。"
 REU_extend_trading_network: "扩展地下交易网络"
 REU_extend_trading_network_desc: "柳德米拉为我们带来了好消息，她与秘密部队在渗透切尔诺伯格的过程中，在沿途都建立了地下的物资交易渠道，而这些渠道对如今的南下进军犹如雪中送炭。派出我们的干部去重新联系交易者，并扩展交易的内容，能够更好的保障主力部队在南下途中的补给供应。"
 REU_Mass_working_group: "群众工作小组"
 REU_Mass_working_group_desc: "在南下的过程中，作为先锋部队的雪怪小队总结出了一套群众工作的方法，他们希望将其推广到整个队伍中。一个由干部领导，积极分子参与的群众工作小组，去承担军事任务之外的民生事务，虽然听起来很复杂，实际上便是让战士们多帮群众解决一些麻烦事。"
 REU_enter_Blagoveshchensk: "进入布拉戈维申斯克"
 REU_enter_Blagoveshchensk_desc: "布拉戈维申斯克是乌萨斯帝国境内的萨卡兹人聚集地，由于卡兹戴尔的内战，诸多难民涌入了这个地方。此地的贵族早已不问世事，任凭当地的百姓自生自灭，但这也为我们提供了机会，大部队可以直接进入此地而不被立即发现，待我们在此地站稳脚跟，乌萨斯帝国在这里的统治，也已经进入倒计时了。"
 REU_second_hometown: "我们的第二故乡"
 REU_second_hometown_desc: "在暂时摆脱了第三集团军的追击以后，我们终于能在布拉戈维申斯克安顿下来。这个地方比预期的要好上不少，也要坏上不少，组织核心得以进驻布拉戈维申斯克，贵族遗留下来的资源也足以重建游击队，但更广泛的控制区也意味着更复杂的社会环境，更何况我们还需要第一次面对民族问题——萨卡兹难民与本地乌萨斯人的冲突。"
 REU_reorganization_congress: "整合运动改组大会"
 REU_reorganization_congress_desc: "在南下的进程中，之前反对共产主义的那一批人虽然有所收敛，但他们在行动中与组织的分歧，仍然让我们几次差点面临危险。而在我们进入布拉戈维申斯克后，这伙人又开始宣传他们反对现有路线的思想了。与其继续为了那无用的仁慈把他们留在队伍里，不如一劳永逸地把他们清除出去。"
 REU_integrated_forces: "整编部队"
 REU_integrated_forces_desc: "在如此规模的转移行动之中，在任何方面都尽善尽美是不可能的，对我们来说，最大的混乱出现在军队的编制上。原有的部队大多被敌军冲散，先锋部队更是损失惨重，而我们又匆忙组建了一支新兵组成的部队，并且一些地方群众的自卫武装也加入了我们的队伍。我们必须改变这样的混乱情况，让冗余的士兵复员，重新整编现有部队为几支满编师。"
 REU_Rase_experience: "在拉泽的经验"
 REU_Rase_experience_desc: "我们在拉泽待的那一年半时间并不算长，但仍然为我们积累了宝贵的经验。劳动教育、公审贵族、军民联合……这些经验放在乌萨斯的任何一个农村都能适用，我们没有理由不在布拉戈维申斯克将这些事情从头再做一遍。"
 REU_deep_in_mass: "深入群众"
 REU_deep_in_mass_desc: "对于布拉戈维申斯克的老百姓来说，我们是凭空冒出来的新统治者，如果我们不去做些什么，在他们眼里我们可能和原来的贵族没什么两样。把干部和先进分子派遣到根据地各地去，建立基础的行政组织，解决群众的切实问题，在群众的心中树立我们的形象：为劳动者而战的队伍。"
 REU_city_organization: "发展城市组织"
 REU_city_organization_desc: "相比于只拥有几个大村子的拉泽地区，布拉戈维申斯克地区拥有一个移动城市和几个小城镇，这对我们的群众工作也提出了新的更高的要求。为了稳定的需要，我们应该先与市民阶层合作，发展我们的城市组织，并且在城市工人和感染者贫民之中，寻找新的同志。"
 REU_group_command_system: "重建小组指挥体系"
 REU_group_command_system_desc: "在南下的作战中，我们损失最大的是各级的指挥官和政委，他们的装备过于显眼，而政治教育让他们身先士卒，反而导致了更大的伤亡。为了恢复游击队的战斗力，我们必须重建小组作战的指挥体系，将值得信任的士兵提升为作战组长或政委，并且在战术上对他们加强教育。"
 REU_Sarkaz_and_Ursus: "萨卡兹与乌萨斯"
 REU_Sarkaz_and_Ursus_desc: "布拉戈维申斯克最特殊的情况，便是这里复杂的种族问题，乌萨斯人、与乌萨斯融合的萨卡兹原住民和萨卡兹难民，不同的群体混居于此，关于种族的暴力行为层出不穷。我们必须尽快解决这种威胁根据地稳定的问题，幸运的是，在萨卡兹红军的帮助下，我们的工作开展会容易很多。"
 REU_land_redistribution: "土地再分配"
 REU_land_redistribution_desc: "土地的再分配，是乌萨斯革命的关键一环，土地的再分配将完全摧毁农业贵族的统治，解放的农民将成为我们队伍的坚定支持者，但由于敌人的剿灭打断了我们在拉泽进行的土地革命，因此它仍然停留在康拉德和阿丽娜的理论上，我们对此没有任何经验。正因如此，我们工作的开展既迫切，又需要小心、小心、再小心。"
 REU_leaders_school: "重开干部学校"
 REU_leaders_school_desc: "由于根据地面积的扩大，我们对干部的需求也更大了，原有的积极分子培训班已经不能满足培养干部的需要了。阿丽娜对组织报告称，她想借用本地中学的几所教室开办干部学校，并且让一些经验丰富的干部兼任老师，这样能更高效地培养队伍的新鲜血液。"
 REU_political_commissar_power: "加强政委权力"
 REU_political_commissar_power_desc: "在最初设立政治委员的时候，他们只是扮演着宣传政治理念的军中教师，但现在我们需要给予政委更大的权力，让政委成为共产主义在军中的代理人，加强我们对军队的控制，而不是像其他乌萨斯军阀一般，让军队成为将军们的私人武装。为此，政委的指挥权将被提高到与指挥官同一水平，并且要对军队在作战之外的所有活动负责。"
 REU_west_threat: "应对西面威胁"
 REU_west_threat_desc: "西面的博罗努尔仍然处于贵族的统治下，尽管他们尚未对我们发起主动进攻，但如果任凭敌人在我们身旁安睡，下一次的剿灭作战就有可能从西面而来。为了确保根据地的安全，也为了解放更多受压迫的劳动人民，我们恢复战斗力后就应尽快消灭他们的威胁。"
 REU_base_literacy_program: "根据地扫盲计划"
 REU_base_literacy_program_desc: "在之前漫长的游击战争中，游击队的每个人都清楚，乌萨斯的农民都是目不识丁的文盲，但直到最近，我们才意识到我们可以改变这一点。在阿丽娜的直接指导下，运用拉泽根据地的经验，我们可以更快地推行扫盲计划，而利用布拉戈维申斯克原有的基础设施，重建并发展根据地的教育也同样不再是幻想。"
 REU_restore_transportation_system: "恢复运输系统"
 REU_restore_transportation_system_desc: "从前，乌萨斯冻原上的各个移动城市之间建立了稳定的运输系统，但是在布拉戈维申斯克旧贵族的无能统治下，通行运输陆行舰的道路已经无法使用，而民间的基础设施也基本荒废。泥岩将率领工兵重修乌萨斯政府的运输系统，一旦工程顺利完工，根据地各处的物资交流会更为便捷，从而更有利于各个村镇的经济恢复。"
 REU_production_campaign: "大生产运动"
 REU_production_campaign_desc: "我们的干部不能只是战场上的先锋，也不能只是村庄里的治理者，如果脱离了最基础的劳动生产，那么干部就有可能腐化成新的乌萨斯贵族。参考萨卡兹红军的经验，塔露拉已经将大生产运动的细节下发到各级行政和军队组织，在各地建立直属中央所有的工厂或农庄，而干部必须全程参与建设过程。"
 REU_military_officers_school: "开设军官学校"
 REU_military_officers_school_desc: "虽然游击队的战士们很多都身经百战，但他们的经验皆来源于作战实践，而没有理论支撑的实践很难升华为有效的方法论。因此，在阿丽娜的协助下，叶莲娜将在布拉戈维申斯克的郊区模仿干部学校开设面向指挥官的军事学院，向游击队的老兵和新兵们教授最新的军事理论和思想，并且结合我们自身的经验，尝试在军事理论研究上取得突破。"
 REU_village_democracy_experiment: "农村民主实验"
 REU_village_democracy_experiment_desc: "虽然中途出现许多意料之外的情况，根据地的土地再分配还是基本完成了，而我们在农村的下一步行动，是探索一种全新的农村民主形式。在布拉戈维申斯克周边的乡村，我们尝试建立类似自治工厂的农村公社制度，在博罗努尔地区，则采取建立地方农会的过渡方式，而南方的多民族地区，则是进行基层民主的试验，由当地群众投票选出村镇的行政管理人员。在经过试点实验后，我们将在几个月或几年后决定，崭新的乌萨斯将采取何种形式。"
 REU_worders_autonomy: "推广工人自治"
 REU_worders_autonomy_desc: "拉泽的经验告诉我们，让工人在工作场所进行自主管理不仅符合共产主义的构想，而且工人们愈发高涨的积极性更是狠狠打了质疑者们的脸。而进入布拉戈维申斯克之后，我们对城市工作的经验也越来越丰富，是时候讨论如何将工人自治推向整个根据地了。一部分人认为由我们主导建立一个工会是最好的选择，通过工会来直接管理各工厂，制定生产计划，并为工人们提供自治的平台，另一些人认为我们应当采取类似地方农会的方式，让工人们自行组织工会，之后再由我们去进行承认，并且指导他们改进。"
 REU_political_army: "政治建军原则"
 REU_political_army_desc: "长期以来，我们队伍内部存在一种错误倾向，即使是早年的塔露拉本人也未能幸免，那就是纯粹的战争主义。幸运的是，萨卡兹红军为我们带来了正确的理论，我们意识到了军队是为了政治理想而服务的，而不是一味的为了战争而战争。一场面向所有指挥员的会议将在罗斯格拉格召开，向整支军队传达我们得出的最新理论：政治建军。根据会议日程，游击队将在会后改组为乌萨斯红军，这支队伍将为解放全乌萨斯乃至全泰拉劳动者的理想而服务，而不会成为统治者的私兵或嗜血的战争机器。"
 REU_first_Soviets_Congress: "召开第一届苏维埃大会"
 REU_first_Soviets_Congress_desc: "我们在布拉戈维申斯克落脚已经大半年了，我们躲过了敌人最疯狂的追杀，帮助当地的群众打倒了压迫者，缓和了萨卡兹和乌萨斯之间的民族矛盾，恢复了布拉戈维申斯克的生产，消除了西面敌人的威胁，并且初步建立起了社会主义性质的经济。我们的根据地比以前更广大，在根据地生活的农民、工人，还有红军的士兵，也比之前更多。因此，我们需要召开一次新的代表会议（совет），比那个胎死腹中的游击队-红军联合会议规模更大、更具有代表性，所有的农民、工人、士兵和知识分子都将派出代表参加。这次会议将决定我们未来的具体目标，并且为我们赋予一个全新的身份。"
 REU_to_all_workers: "告全国劳动者书"
 REU_to_all_workers_desc: "随着我们在南方站稳脚跟，我们可以重新审视我们的理想和目标了。旧的整合运动已经结束了她的历史使命，新的苏维埃将代表千万劳动者在此地崛起。阿丽娜，党的第一书记，在苏维埃大会后起草了一份《告全国劳动者书》，向全乌萨斯境内的劳动者宣告，苏维埃政权在东达利亚的冻原上证明了她的成功，而向西进军、解放整个乌萨斯的劳动者，将是[REU.GetName]不再掩饰的目标。"
 REU_set_radios: "设置广播电台"
 REU_set_radios_desc: "为了继续向生活在敌境内的劳动者们宣传我们的理念，我们需要建立一个持续运作的广播电台，它将成为乌萨斯第一个播放人民的声音的电台。"
 REU_reorganize_central_government: "改组中央机构"
 REU_reorganize_central_government_desc: "随着我们成为政权的角逐者，旧时游击队体制下混乱的管理体制便显得过时。通过借鉴哥伦比亚、炎国等国家的行政体制，我们决定建立一批专业部门，分管不同领域的工作，并且在此之上建立一个各部门民主决策的机构，即苏维埃部长会议。"
 REU_establish_intelligence_system: "建立情报系统"
 REU_establish_intelligence_system_desc: "游击队时期，我们的情报工作虽然卓有成效，但是这些成果都是不专业的情报人员用鲜血换来的。最高苏维埃已经批准柳德米拉着手整理现有的情报网，并且建立一个专门的情报机构，政治保卫局（ГПУ，格别乌），格别乌将通过渗透敌人，使其从内部瓦解，同时盯紧我们的身边，警惕叛徒再次出现。"
 REU_ministry_of_foreign_affairs: "外交部"
 REU_ministry_of_foreign_affairs_desc: "尽管根据马佐夫和海森的学说，无产阶级的任务是解放全泰拉的无产阶级，但是我们与整个泰拉相比，依然太过弱小，因此我们需要处理好与周边国家的外交关系，并且结好泰拉的其他超级强权，在隐藏起对他们的厌恶的同时，向他们展示，让我们取代乌萨斯帝国，对他们而言是更好的选择。"
 REU_ministry_of_industry: "工业部"
 REU_ministry_of_industry_desc: "现阶段我们的最终目标，是击溃圣骏堡的乌萨斯帝国政权，解放乌萨斯境内的全部劳动者，但东达利亚冻原上的农村，无法与西乌萨斯全力开动的战争机器相抗衡。因此，我们要发挥计划经济的优势，让工业部统筹根据地内的工业建设，争取在短时间内建造出尽可能多的工厂，为即将到来的最终决战提供坚实的后盾。"
 REU_ministry_of_finance: "民政部"
 REU_ministry_of_finance_desc: "在冻原上挣扎的时候，我们要计算的是每一天如何分配拮据的口粮，而现在我们需要计算的是部队的经费、建设的支出、劳动者的薪资。建设共产主义的经济是一条无人探索过的道路，即使是康拉德和萨卡兹红军也爱莫能助，在坚持马佐夫的原则的前提下，我们要做且能做的，只有尝试一切可能的方法。"
 REU_ministry_of_national_defense: "国防部"
 REU_ministry_of_national_defense_desc: "当我们只是一支反抗军的时候，军队就是我们的全部。但是随着我们控制了一个又一个地区，我们就要对当地老百姓的生计负责，而军政不分的体制很容易让群众想起乌萨斯帝国军统治下的黑暗时代。在先前召开的罗斯格拉格会议的基础上，苏维埃决定继续推进政治建军的国策：设立以文职干部主管的国防部，负责征兵和管理装备制造等军备建设事宜。"
 REU_restore_educational_order: "恢复教育秩序"
 REU_restore_educational_order_desc: "乌萨斯帝国留下的遗产并非一无是处，其中对我们最有价值的便是仿效泰拉其他国家建立的现代教育体系。在政治审查通过后，我们会让旧学校的老师们恢复工作，不过教科书的内容将由我们重新审定。并且根据计划，即将成立的教育部将定期审查老师们的教学内容，同时在各个学校设立的共产主义青年团，也将给予学生们扳倒反动教师的权力。"
 REU_Foreign_research_assistance: "寻求外国科研协助"
 REU_Foreign_research_assistance_desc: "科学技术是无法从土地里长出来的，即使我们通过书本获取了知识，没有实验的条件，我们对技术的实际运用就无从谈起。除去利用敌人留下的设施进行科研之外，我们能走的路只有向友好国家寻求帮助这一条。"
 REU_foreign_capital_under_control: "监控下的外资"
 REU_foreign_capital_under_control_desc: "穷，是对我们的经济状况最简单粗暴的回答。随着战乱加剧，冻原上本就稀少的工业城市大多停止运作，而前线地区的农民和矿工更是苦不堪言。所幸在根据地的后方，社会秩序尚且稳定，因此外交部将负责联络有投资意向的外国资本家，前来根据地支援我们的经济建设，而工业部将对他们的行为进行限制，这是我们作为共产主义者最后的底线。"
 REU_industrial_recovery_plan: "工业集中计划"
 REU_industrial_recovery_plan_desc: "捷报接连从冻原的战火前线传来，而代价是因战斗而毁灭的移动城市和工业化矿场。为了劳动者的生计，也为了苏维埃政权的存续，我们急需对遭到战争破坏的工业设施进行重建。在重建的同时，我们还顺便对工业场所的安全标准进行了一些修改，虽然这些需要我们花费更多的预算，但是重建总比新建省钱。"
 REU_Revise_grain_collection_system: "修订粮食征收制度"
 REU_Revise_grain_collection_system_desc: "大叛乱的持续导致了很多问题，其中最要紧的问题便是粮食问题。前线的部队需要口粮，流离失所的难民需要救济，物流中断的移动城市需要活命。解决这些问题的方法目前只有一个：让农民们上交更多的粮食。最高苏维埃已经在讨论修订现行的征粮制度，损害农民们的利益已经是板上钉钉的事情，讨论的内容只是如何让农民们的损失小一些。"
 REU_infiltration_force_training: "渗透部队训练"
 REU_infiltration_force_training_desc: "对切尔诺伯格的渗透行动，是我们取得切城战役胜利的关键。在尝到甜头后，我们决定将渗透作战的战法发扬光大，通过选拔出一批体格优异、经验丰富的战士，对他们进行渗透城市的专业战术训练，并且配备如喷气背包和直升机之类的新式装备，这支专门训练的部队就可能让我们在与其他军阀的战争中取得优势。"
 REU_Prepare_the_P_department: "筹备“P”部门"
 REU_Prepare_the_P_department_desc: "这片大地上存在太多未知的事物，它们无法用常人的思维去理解，而又极具危险，甚至威胁着全体无产者的生死存亡。作为革命的先锋，我们有将这些异常之物阻挡在日常之外的责任。一个秘密部门已经得到批准，开始组建。其从属于政治保卫局，负责对未知异常进行研究和镇压，等待着他们的第一批任务，包括北境邪魔的对策研究和“蛇鳞”原理的解构。"
 REU_oripathy_scientific_prevention_control: "矿石病科学防治"
 REU_oripathy_scientific_prevention_control_desc: "我们不能忘记我们走到一起的初衷：为感染者的平等而战。即使我们的纲领在不断的修改、前进，但感染者的权利我们不能就此忽视。矿石病的危害切实存在，在思考如何消除统治阶级灌输给群众的错误观念同时，我们也应该尽可能降低矿石病的感染率，并且动用国家的力量，让感染者们得到科学有效的治疗。"
 REU_reverse_engineering: "外国设备逆向工程"
 REU_reverse_engineering_desc: "工业建设的规模在稳步扩大，不少委员已经开始为逐渐扩张的外部资本而担忧。为将来与外资可能的决裂做好准备，我们需要尽快掌握工业建设的自主权，而第一步将从工业设备的自主生产开始。按照计划，我们的技术人员将对外国工厂的设备进行复制，并且尽快开动仿制品的生产线，填补各地工业建设的空白。至于知识产权？资产阶级的把戏罢了。"
 REU_foreign_industry_experts: "邀请外国工业专家"
 REU_foreign_industry_experts_desc: "通过与国外的交流进一步深入，我们了解到，在中陆和西陆的那些发达国家中，有许多与我们一样信仰共产主义的同志，而其中很多人都是熟练的技术工人和工业专家，他们中的一些人已经与我们的外交官联络，表达了前来支援我们的革命的意愿。比起让这些国外的同志在战场上流血牺牲，工业部认为让他们协助我们的经济建设，是更有价值的选择。"
 REU_reconstruct_backward_urban: "重建落后城区"
 REU_reconstruct_backward_urban_desc: "乌萨斯帝国的城市建设，对于无产阶级来说，可以说与监狱没什么区别。权贵住在移动城市的上层，呼吸着新鲜的空气，无产阶级则只能在移动城市的边缘地带或中下层蜗居，感染者贫民则更加悲惨，居住在底层的他们甚至可能一辈子见不到天空。这一切将随着我们的进军而改变。不符合安全标准的城区将被重建，所有人都将居住在舒适的新区块之中，包含配套公共设施、公园和平等的住房条件。"
 REU_local_militia: "地方民兵训练"
 REU_local_militia_desc: "随着战争规模的扩大，越来越多的红军战士投入前线，而地方的治安就成了问题。抛开流民转化成的土匪和敌人的渗透分子不说，在广袤的冻原上，即使是野兽就足够让农民们焦头烂额了。因此，我们需要将一部分治安的职能移交给群众，包括组建地方的民兵队或工人纠察队。至少在这个混乱的时期，让大家拥有保护自己的安全的权力。"
 REU_experimental_gunnery_unit: "实验性铳械部队"
 REU_experimental_gunnery_unit_desc: "铳械的杀伤力早就得到了证明，但是由于其过于精密的构造，我们以前的生产能力根本无法制造出合格的铳械，即使可以使用也大多是危险的残次品。不过随着我们工业能力的提高，我们现在有能力仿制缴获或购买到的铳械，甚至可以尝试研发出更具威力、更易于操控的新型铳械，我们可以先将其装备在一支实验部队上，待测试完毕后，便可向全军推广。"
 REU_publication_censorship_system: "出版物审查制度"
 REU_publication_censorship_system_desc: "虽然说苏维埃政权鼓励个人自由，但是自由是有条件的，不是说某些资产阶级知识分子可以自己印书自己去卖的。为了防止一部分知识分子继续用乱七八糟的出版物来毒害群众的思想，我们需要将出版印刷的权力收归苏维埃，在战时暂时由一个专门委员会对出版物进行审查，这套制度的命运，将在战后进行重新评估。"
 REU_take_over_university: "接管远东大学"
 REU_take_over_university_desc: "远东国立大学，除了经费来源于圣骏堡的帝国政府，和帝国没什么关系。相反，在里面执教的老师不少都是遭到帝国迫害的进步学者，他们将远东大学打造成了一个开放的学术天堂。对我们来说，远东大学将是我们所掌握的第一所高等学府，她将对我们未来的科研工作和干部培养发挥至关重要的作用。进步的教师们可以继续他们的教学，而我们也可以着手制定大学生所用的社会主义教科书了。"
 REU_natural_disaster_meteorological_center: "设置天灾气象中心"
 REU_natural_disaster_meteorological_center_desc: "虽然我们可以通过严格的规章制度和安全设备，去减少工作场所感染矿石病的风险，但是天灾并不是我们可以控制的。我们能做的只有监测天灾云的形成，勘探地下源石矿脉的流动，尽早预报天灾，组织群众避难。为此，我们需要建立一个专业的官方监测机构，一部分设备可能需要向外国采购，但是为了人民的安全，这些都是值得的。"
 REU_coordinated_resource_development: "统筹资源开发"
 REU_coordinated_resource_development_desc: "东达利亚冻原为数不多的优点之一，就是其蕴藏的资源。根据目前我们探查到的资源数量，这些资源供应给一个统一的乌萨斯绰绰有余，而多余的资源，可以用来扩建我们的工业，也可以出口至国外换取实打实的赤金。我们将在工业部之下设立一个新的部门，对国内的资源开发进行统筹管理，合理安排建设与出口之间的关系。"
 REU_develop_tourism: "发展第三产业"
 REU_develop_tourism_desc: "无论是老游击队战士，还是新来的外国同志，都一致认为，如果生命安全有保障的话，在东达利亚冻原上旅行的体验应该挺不错的。随着松心山谷落入我们手中，这里的疗养院设施便可以作为我们发展旅游业的第一块招牌。即使对于战乱中的乌萨斯，外国游客可能还抱有一些恐惧的心理，但是把这里发展成劳动群众的假期旅游地，也是不错的结果。"
 REU_procurement_communication_equipment: "采购通信设备"
 REU_procurement_communication_equipment_desc: "前线所使用的通讯系统大多是缴获的设备，而且由于缴获成功率随着战争规模扩大而越来越低，前线红军的通讯设备配备率也越来越差。由于我们尚无自行生产精密电子元件的能力，因此只能依靠国防部的装备预算加紧采购一批新式通讯设备，如果能以民用的名义招来几个电子制造商，就更好了。"
 REU_suppress_snake_scale: "清剿“蛇鳞”"
 REU_suppress_snake_scale_desc: "我们在科西切的旧宅邸里发现了不计其数的密件，经过塔露拉主席的亲自确认，这些密件都来自于“黑蛇”的其他“蛇鳞”。不死的恶神对革命的威胁是巨大的，它在革命初期几乎就要成功将革命引入深渊，而如今它的灰烬仍然危害着革命的前程。特别行动令已经签发，柳德米拉将全权负责这次肃反行动，她将在弑君之前先用几个“蛇鳞”练练手。"
 REU_resource_export_committee: "资源输出委员会"
 REU_resource_export_committee_desc: "由于乌萨斯境内的自然资源极其丰富，根据经济专家的计算，如果维持目前的资源出口态势，我们在击败乌萨斯帝国之前就有可能跃升为泰拉的第一资源输出大国。泰拉的资源市场是资本主义全球化的领域，其中充满了阴谋诡计和国事人情，以及最恐怖的诱惑。最高苏维埃已经决定设置一个专门委员会，管理对外国的资源出口情况。我们对此必须慎之又慎，在泰拉资源市场的天灾云中，控制好陆行舰的航向。"
 REU_no_discrimination_committee: "感染者消歧视委员会"
 REU_no_discrimination_committee_desc: "对感染者的歧视已经无法追溯，我们所知晓的便是这种卑劣手段的本来面貌——群众斗群众。虽然崭新的布尔什维克党不再仅仅为了感染者而战斗，但我们仍然记得我们自称“整合运动”的日子，是矿石病让我们走到一起，共同反抗暴君的国度。最高苏维埃已通过决议，组建一个专门委员会负责感染者的去污名化工作。如今我们正在一步步迈向胜利，现在正是兑现我们对感染者最初的诺言的时候。"
 REU_national_relation_committee: "民族关系委员会"
 REU_national_relation_committee_desc: "乌萨斯帝国是各族人民的监狱。骏鹰、乌萨斯、埃拉菲亚、梦魇库兰塔、萨卡兹……各民族在遭受皇帝和贵族压迫的同时，还因为生活方式和传统的差异产生重重矛盾，而这些矛盾在野心家利用之下，又成为了不同民族相互攻伐的借口。为了解决积累百年的民族矛盾，各族的最高苏维埃代表同意组建一个特别委员会，对解放区内的各组关系进行协调。无产者只有阶级而没有民族，只有消除了本不应存在的隔阂，我们才能发挥出我们真正的力量。"
 REU_Improving_medical_conditions: "改善医疗条件"
 REU_Improving_medical_conditions_desc: "在旧乌萨斯帝国治下，医疗卫生等部门相当程度地处于匮乏状态，且在许多情况下仅供上层使用。为了广大人民的身体健康与减少红军的非战斗减员，我们有必要引入更多新型药物与医疗经验，并将其尽快付诸临床，以改善糟糕的医疗现状。"
 REU_Red_Air_Force: "建立赤色空军"
 REU_Red_Air_Force_desc: "一支真正的现代化红军绝不应当仅仅依靠陆军决胜，空军在现代战争之中亦是一股不可忽视的力量。尽管如今我们并无空军基础，库存中也无充裕的各类飞行器。但在与东达利亚诸军阀的作战之中，红军逐步掌握了一些空军基地、本地飞机生产线以及各类飞行器蓝图。利用这些资源，我们无疑可以开启建立赤色空军的进程，为未来所将涉及的新式战争做好准备。"
 REU_Phase_3: "召开临时苏维埃大会"
 REU_Phase_3_desc: "随着最后的抵抗平息，东达利亚终于在苏维埃红旗之下得以统一。如今，我们已建立起了一个牢固的社会主义政权，并与西方的反动旧帝国分庭抗礼。可乌拉尔以东的土地虽已稳定，但新生的东达利亚苏维埃仍面对着诸多挑战。不过无论如何，现在都是时候召开一场临时苏维埃大会了。从外贝加尔到远东，各地的布尔什维克党员们都将齐聚一堂，在大会上决定革命的未来。"
 REU_The_dawn_for_ideal: "理想的拂晓"
 REU_The_dawn_for_ideal_desc: "在临时苏维埃大会上，塔露拉同志与阿丽娜同志凭借过往指引革命的经验与对未来的展望规划取得了大多数党员支持。随着塔露拉同志正式连任主席，由她领导的革命道路也将继续向前。党将于接下来的阶段开展更为广泛的社会主义改造，并整军备战，应对未来的革命战争。"
 REU_Willing_to_sing: "乐于歌唱"
 REU_Willing_to_sing_desc: "共产党的组织永远根植于广大人民之中，而工农革命也唯有共产党才能领导。换句话说，群众是党的根基，而党的责任便是引领无产阶级走上社会主义道路。随着东达利亚局势逐步稳定，行政整合工作逐步进行，我们也将继续扩展党的基层组织，并在人民之中广传共产主义理想与革命乐观主义理念。"
 REU_Good_at_resisting: "善于反抗"
 REU_Good_at_resisting_desc: "自创建之始，乌萨斯共产党便以引领人民反抗暴政，推翻腐朽的旧秩序为己任，而我党的前身整合运动也是东达利亚地区最为知名的反抗武装。从游击战的刀光剑影，到大叛乱的铳炮争鸣，我们已历经无数战斗。而在未来，党也将带着过去反抗暴政，引领革命的经验继续前行。"
 REU_Dare_to_dream: "敢于梦想"
 REU_Dare_to_dream_desc: "苏维埃虽立国未久，但它已经带给了乌萨斯人民摆脱封建帝制，走向公平未来的希望。我们的革命道路绝不会止于东达利亚与西乌萨斯，而对旧文化的改造也不应就此停下。我们会支持旧日仅供贵族的文化普罗大众化，也将大力发展社会主义科学与文学，以助力我国的社会主义新文化。"
 REU_Unify_the_thinking_within_the_party: "统一党内思想"
 REU_Unify_the_thinking_within_the_party_desc: "乌萨斯共产党是坚持社会主义理想，代表无产阶级利益的工农政党，其最终目的在于建成共产主义社会。这一原则是党的核心，也是所有党员皆认可与追随的方向。可虽方向统一，但党内在有关于在社会主义阶段所施行的政策仍有所分歧。或许在和平时期，党内能够自由讨论对社会主义道路的看法是件好事。但在大敌当前的如今，我们唯有加强思想统一，才能维护党自身的统一。"
 REU_The_spirit_of_hard_work_and_simplicity: "艰苦朴素精神"
 REU_The_spirit_of_hard_work_and_simplicity_desc: "对奢侈生活与过度消费的狂热无益于塑造优秀的苏维埃公民，当下的物质条件相对过去虽已有改善，但仍未做到可供人肆意浪费的程度。在未来，保持节俭与朴素，珍惜资源，避免浪费，勇于面对困难的生活作风仍应作为属于所有人的准则。"
 REU_Improved_vehicle_production: "改良载具生产"
 REU_Improved_vehicle_production_desc: "从卡车到吉普车，再到装甲运兵车与步兵战车。无论对于前线抑或后勤而言，战争中各类载具的意义皆至关重要。为了加强红军摩托化乃至机械化进程，现有的各类载具生产线将得到扩张与改进，以加强其生产能力。"
 REU_Encourage_revolutionary_arts: "鼓励革命艺术"
 REU_Encourage_revolutionary_arts_desc: "随着对文化界的社会主义改造稳步进行，艺术界的无产阶级化也应当摆上日程。新社会的艺术将不再如旧社会般专供上层阶级，而应当属于所有人民。无论是现实主义、未来主义，抑或其他在封建统治者们看来无比离经叛道的艺术流派都将得到支持，而戏剧与文学也将向着更多颂扬革命精神与无产阶级力量的方向转变。"
 REU_Agricultural_cooperatives: "推进农业合作化"
 REU_Agricultural_cooperatives_desc: "个体农业的生产效率在如今已然落后，农业集约化将会是属于全泰拉的大趋势，而我国也绝非例外。或许施行集体农业是个不错的想法，但完成其进程对于现阶段状况而言或许过于劳民伤财，且若决策有误可能导致诸多社会问题。因此，相较之下，合作社化才更应成为我们农业改革的主导方案。"
 REU_Discover_Warlock_talent: "发掘术士人才"
 REU_Discover_Warlock_talent_desc: "虽然技术的发展已使部分在古代战场上意义非凡的源石技艺逐渐淡出军事视野，但法术兵种在战争中仍是不可或缺的一部分。我们将招揽社会各界擅长源石技艺的人才加入红军，为国内外无产阶级解放事业贡献出自己的一份力。"
 REU_Artillery_fire_raid: "炮兵火力突袭"
 REU_Artillery_fire_raid_desc: "在过往所经历的战役中，各类火炮已向我们展现了其不俗的对敌杀伤能力与战略价值。而在未来，红军也将以炮兵部队建设为主要任务。更为先进的炮兵战术及战略理论将在红军中得到引进与运用，我们的火炮弹幕必将遮天蔽日，杀尽一切反动派的威风。"
 REU_Defeat_Ursus_militarism: "击灭乌萨斯军国主义"
 REU_Defeat_Ursus_militarism_desc: "旧乌萨斯帝国以国家机器压制人民，并通过穷兵黩武，肆意对外侵略转移内部矛盾。如此的反动政权竟能维持数个世纪真乃乌萨斯民族之耻，而我们的使命便是将这个穷凶极恶的反动军国主义政权就此击灭，还全乌萨斯人民一个真正属于他们的新乌萨斯。"
 REU_Revolutionary_education: "革命教育"
 REU_Revolutionary_education_desc: "教育永远是为阶级服务的：在旧帝国治下，它的目的在于将人训练为劳动机器，以及传播君主主义意识形态以维护沙皇统治；而在社会主义制度中，其将致力于每个人都能够全面而自由地发展，并塑造拥有独立思考能力的无产阶级新公民。我们目前的教育系统显然未能完全落实以上原则，为此教育改造进程必须进一步深入。"
 REU_Front_line_initiative: "前敌能动性"
 REU_Front_line_initiative_desc: "军人的天职的确在于服从命令，但战场局势总是瞬息万变，若一线士兵仅知遵循上级命令行动，必然会导致整支军队失去自身主动性。命令式指挥的过时思维应当被彻底破除，并鼓励基层指战员与战士们自身的能动性。确保战士们能够在遵循军事任务大框架，不违抗基本指令的情况下使具体行动更为快速且灵活。"
 REU_Civil-military_friendship: "军民情谊"
 REU_Civil-military_friendship_desc: "旧社会的军人往往在社会地位上高于平民，而新时代的苏维埃红军绝不会沿袭这种反动传统。我们的军队来自人民、服务人民、也终将回到人民中去。军民之间的关系也将会团结一致，患难与共，而非如同那些过去以欺压人民取乐的旧军警一般。"
 REU_Modern_fortifications: "新式工事建造"
 REU_Modern_fortifications_desc: "无论是在进攻抑或防守的战役之中，军事工事都是绕不开的话题。从碉堡哨楼到桥梁沟壕，各类工事总是能在危急时刻为前线雪中送炭，抑或是锦上添花。因此，为了红军能够在战场上不落后于人，我们将为工程部队引入各类新式的军事工事建造方法。"
 REU_Multi-echelon_rounds: "多梯队轮战"
 REU_Multi-echelon_rounds_desc: "在自动武器普及后，人海攻势便逐渐过时，但大规模强袭的作战理念却从未退出战场。而为将这种作战理念在现代战争中进一步发挥，红军将引入梯队概念，在长久持续与高强度的作战行动中将兵力以梯队编组。这种新军事理念不仅能够有效避免连续伤亡带来的严重士气打击，更能够使我军持续作战能力大为提升。"
 REU_All-domain_combat: "全域作战"
 REU_All-domain_combat_desc: "大叛乱时期于冻原之上的战斗很大程度上锻炼了红军对冬季作战环境的适应性，但我们当下与未来索要涉足与面对的战场环境却并非仅有冻原一种，而是将涉及更为广泛的高山、森林等复杂地形与各类极端气候。而为能够在这些状况各异的战场中占据优势，我们将在红军中向战士们教授各类新式作战理念。"
 REU_Large_corps_synergy: "大兵团协同"
 REU_Large_corps_synergy_desc: "大多数时候，战争都并非一对一式的决斗，而是复杂的多面作战。而在一场大规模会战之中，各大兵团的组织协调与后勤补给工作将会是重中之重。大兵团协同将成为红军的战略指导方针，引领我们克敌制胜，最终摘得胜利果实。"
 REU_Red_Night_raid: "赤夜突袭"
 REU_Red_Night_raid_desc: "夜袭战术的历史源远流长，而随着近现代的技术革新，借助渗透突袭战术与夜视仪等先进装备，当今的夜间突袭作战将变得更为致命。为能够完全掌握此类先进战术，我军将加强夜间作战演练，并加强对各类相关武器装备研究与生产。"
 REU_The_final_march: "最后的行军"
 REU_The_final_march_desc: "在临时苏维埃大会上，博卓斯卡替同志凭借在红军中的声望与军事现代化倡议取得了大多数党员支持。随着博卓斯卡替同志正式接过塔露拉同志的主席职位，乌萨斯共产党的革命策略也将转变得更为强硬与军事化。党将于未来开展一系列军事改革，以将红军建设为真正现代化的武装力量。"
 REU_Loyal_soldiers: "忠诚之士"
 REU_Loyal_soldiers_desc: "红军不仅是党和人民的革命队伍，更是属于共产主义的先锋队。为了这支队伍能够真正履行其职责，而非异化为如旧帝国集团军般的军阀，我们必须严格履行政治建军原则，坚定每一位战士的共产主义信仰，使红军能够真正上下一心为共产主义事业而服务。"
 REU_Vanguard_Army: "先锋之军"
 REU_Vanguard_Army_desc: "作为苏维埃至关重要的武装力量，红军肩上承担着解放全国与对外输出革命的重任。无论在如今或未来，它都将是无产阶级的坚硬铁锤，足以粉碎一切阻挡社会主义前进的反动分子。不过，这并不意味着我们会自满于现状。迈向革命与军事现代化的道路绝非坦途，但红军仍将大步向前。"
 REU_Warriors: "善战之师"
 REU_Warriors_desc: "历经东达利亚雪原之上无数战役的磨砺，红军如今已是一支有着充足经验的百战雄师。我们曾翻过高山、跨越荒原，也曾在移动城市与敌人为战。这些过往战役的历程与其精神将被每一位战士铭记与学习，而未来的红军也将如过往征程一般战无不胜。"
 REU_Orders_and_prohibitions: "令行禁止"
 REU_Orders_and_prohibitions_desc: "无论任何时代，任何一支正规军都需要纪律来维持，而作为人民武装的红军更是如此。我们必须重视红军内部的纪律管理：加强战士们对指战员命令的果断性与执行力，并对军中胆敢无视革命铁律，如军阀私兵般肆意妄为者予以严惩。"
 REU_Massive_armored_assault: "大规模装甲突击"
 REU_Massive_armored_assault_desc: "以步兵与炮火协同为主力推进战线的策略早已过时，以坦克代表的装甲部队才是现代战争中地面部队的绝对主力。我们的军事编制与主导性战略思想必须跟上时代，而红军装甲师的训练也将以最高优先级列入军改日程之中。"
 REU_Modern_infantry_tactics: "现代步兵战术"
 REU_Modern_infantry_tactics_desc: "步兵长久以来都是军队的核心，而红军也不例外。但随着科学技术与军事战术的日新月异，固守过往的徒步步兵战术已不再可行。在我们对红军步兵部队的革新之中，卡车与装甲运兵车将逐步列装一线，而指战员们也将学习最新的作战理论，并在战场上将之付诸实践。"
 REU_Joint_operations_of_multiple_corps: "多兵团联合作战"
 REU_Joint_operations_of_multiple_corps_desc: "随着不断的科学技术进步，战争形态早已今非昔比。如今的战场早已不再由单一兵种主宰，而是如同一个由无数战术职责各异的兵团组成的庞大沙盘。对于我们而言，如何使这些兵团协调有致地作战便是当下的重要任务。我们需要加强红军各单位的联合作战训练，加强其协同作战能力。"
 REU_Militarization_of_plant_management: "军事化工厂管理"
 REU_Militarization_of_plant_management_desc: "在任何战争之中，军事生产都是相当重要的一环。若无工厂矿山开足马力，空着手的士兵可无力上阵杀敌。为保证战争时期的军备生产状况，各地的军工厂都将采取统一军事化管理，生产纪律与人员管理将皆由红军监督。"
 REU_Centralized_command_system: "集中化指挥体系"
 REU_Centralized_command_system_desc: "仅靠传统口头与文书命令来指挥士兵显已过时，其不仅效率低下，且易造成对指令的误读导致军事混乱。无论如何，红军的指挥体系必须得到重塑。各类新式技术将被引入军中，而各层级指战员岗位也需要得到改编与调整，以加强军事命令传达的畅通性。"
 REU_Military_Academy: "开设军事学院"
 REU_Military_Academy_desc: "随着红军逐步扩编，专业军事人才的缺口也在逐步扩大。从基层指战员到后方的参谋，诸多军中岗位皆已出现缺口。万幸，先前在布拉戈维申斯克郊区所开办的军官学院如今已初有成效。而我们也将借鉴其模式开设更多新军事学院，以培养优秀的新一代战士。"
 REU_Military_pickets: "军事纠察部队"
 REU_Military_pickets_desc: "仅靠士兵们的自觉性无法建成一支真正纪律严明之军，唯有设立专职监督单位才能将军纪落实。红军将设置专门的军事纠察部队，监督每一位战士的作风与举止，并打击一切涉军犯罪，维护红军的形象与军人合法权益。必要时，他们也应当兼职警戒勤务与宪兵职责。"
 REU_Advanced_military_engineering_equipment: "先进军用工程装备"
 REU_Advanced_military_engineering_equipment_desc: "乌萨斯的地形复杂且多样，这对于行军与战斗而言都是个不小的困难。而为克服这些困难，工程部队可谓必不可少。但在现阶段，我军工兵的装备大多已经与时代脱节，对于红军整体作战能力造成了不少拖累。为将这块短板补全，我们必须争取让每一位工兵都能用上最为先进的装备。"
 REU_Specialized_logistics_troops: "专门后勤部队"
 REU_Specialized_logistics_troops_desc: "古往今来，每逢谈及战争，人们总是将目光投向前线的拼杀，却常常忽略看似无关紧要的后勤战线。为了红军战士们在前线能够第一时间得到从武器弹药到制服食物的各类物资，乌萨斯红军的后勤系统建设必须得到重视。专职后勤工作的支援部队将得到组建，以加强现有军事勤务体系。"
 REU_Special_Scouts: "特种侦察兵"
 REU_Special_Scouts_desc: "有效的军事侦察能够为战略制定与施行提供极大便利，而侦察兵往往需要由素质过硬且不畏牺牲的优秀战士担任。如此关键的兵种必然应当得到严格培育，我们将以特种部队的训练方式为每一位侦察兵提供先进作战培训，将他们塑造为红军最尖锐的锋刃。"
 REU_All-terrain_combat_training: "全地形作战训练"
 REU_All-terrain_combat_training_desc: "或许新式装备与战略能够缓解诸多在复杂地形与气候中作战的不便，但战争终究是由人决定的。如果我们的战士仅仅懂得如何在平原上作战，那可真是走上歪路了。从雪山到沼泽、从丛林到山丘，各类地形作战训练将在红军中展开。“多流汗，少流血”——正如这句话所说的一样，唯有艰苦训练，才能造就一支真正强大的军队。"
 REU_Multi-level_reserves: "鏖战蓝天"
 REU_Multi-level_reserves_desc: "迄今为止，我们已经完成了许多对红军地面部队的改革。但在军事现代化的长路之上，新近建立的苏维埃红空军也应得到关注。毕竟，现代战争早已不再停留于纸面与沙盘之上，而天空也绝非极限。从今开始，红空军将全面开启赶超核心圈国家的伟大历程，直至它真正成长为一支不可战胜的无敌之师。"
 REU_Lead_by_example: "空中大炮"
 REU_Lead_by_example_desc: "红军的支援火力绝不应当仅限于地面的火炮与装甲，而是应当更为重视空中力量运用。接下来，军事参谋与科学家们专注于从军事技术与战术上完善空军对地支援体系，使我们的红空军成为令敌人地面部队闻风丧胆，军心溃散的强大力量。"
 REU_Movement_Annihilation_War: "铁翼英雄"
 REU_Movement_Annihilation_War_desc: "空中战机大多造价不菲，而驾驭它们的飞行员也是百里挑一。为了每一位对红空军而言皆弥足珍贵的飞行员都能够尽可能发挥出自己的力量，我们将规制全新的空军军校课程与训练项目，确保这些热切的年轻人能够在走出军校时成为真正优秀的军人。"
 REU_Air-ground_three-dimensional_combat: "空地立体作战"
 REU_Air-ground_three-dimensional_combat_desc: "随着各类战斗机、轰炸机与近距支援机逐步融入红军战斗体系，我们现有的战略与战术系统也必须迎来革新。新的作战理论将把战场从平面扩展至立体，同时将旧有的联合作战理念与现代化战争中的新式学说相互融合，打造空地高效协同的军事方针。"
 REU_Berserk_into_Saint_Grypherburg: "终局之战"
 REU_Berserk_into_Saint_Grypherburg_desc: "自拉泽湖畔的小小游击队，到布拉戈维申斯克的革命根据地，再到屹立于东达利亚之上的苏维埃共和国。我们一次次取得胜利，一次次为革命熔炉添柴加薪。而在当下，斗争尚未结束。在乌拉尔山脉以西，旧帝国正对新生的苏维埃政权虎视眈眈，妄图将社会主义火种扼杀于摇篮之中。我们必须做好对与帝国最终决战的万全准备，才能将全乌萨斯人民解放。"
 REU_Contact_Metropolitan_Workers: "联络大都市工人"
 REU_Contact_Metropolitan_Workers_desc: "无产阶级专政是我党最为根本的政治路线，而白区内大都市的工人阶级也将是我们重要的统战对象。与敌人内部的进步团体建立联系必不可少，而投放诸多反封建、反军国主义，宣扬民族解放与革命的宣传材料至白区后方也是个屡试不爽的策略。相信在建立没有统治阶级压迫、人民当家做主之社会的号召下，革命之火必将燎原。"
 REU_Reaching_out_to_ethnic_minorities: "联络少数民族地区"
 REU_Reaching_out_to_ethnic_minorities_desc: "旧乌萨斯帝国的反动体制造就了一个所有人压迫所有人，唯有极少数上层得利的“民族监狱”。许多旧帝国统治下的少数民族皆饱受其害，长久遭受不公的制度性歧视。为了彻底击碎这个大监狱，使少数民族同胞们得到解放。我们会同白区内的少数民族聚居区进行联络，争取当地不愿受压迫的人民们与我们站在一起。"
 REU_Weapons_Design_Institute: "设立武器设计所"
 REU_Weapons_Design_Institute_desc: "为了能够彻底歼灭反动势力，为每一位战士提供其所需的新式武器至关重要。有必要充分利用现有的科研资源，设立一系列专职研究与改进各类武器装备的国立武器设计所，以确保红军的军备水平摆脱落后，紧紧跟齐时代步伐。"
 REU_Call_for_the_infected: "呼唤全国感染者"
 REU_Call_for_the_infected_desc: "整合运动虽在第一届苏维埃大会召开时便完成了其历史使命，但它的精神与遗产仍未消逝，而是融入了乌萨斯共产党的革命道路之中。旧乌萨斯帝国治下的感染者生活处境往往堪称绝望，而我们的社会主义理想将为受压迫的感染者们带来希望。如同整合运动时期的策略一样，我们会致力于唤起白区内感染者的斗争精神，引领他们以自己的力量打破枷锁。"
 REU_Turn_to_large-scale_wars: "转向大规模战争"
 REU_Turn_to_large-scale_wars_desc: "与旧帝国乃至更为强大的反动势力之决战早已与过往不同。我们在未来要面对的早已不再是东达利亚之上的各派军阀势力，而是拥有完备工业与军事体系的国家机器。在如此情况下，我们的生产部门与前线战士都必须适应新的战争模式，才能更好地发挥其力量。"
 REU_Support_the_front_line: "支援前线运动"
 REU_Support_the_front_line_desc: "一场战争的天平与否不仅在于前线胜负，更在于大众对其是否支持。万幸，由于革命战争的天然合法性，我们至今所经历的军事冲突中皆能得到人民的广泛支持。而在当下面对更为强大敌人的斗争之中，我们会借这份热忱的力量，呼吁广大人民群众为革命事业献出自己的一份力，尽其所能支援前线。"
 REU_Encourage_voluntary_labor: "鼓励义务劳动"
 REU_Encourage_voluntary_labor_desc: "在大规模革命战争的背景下，仅靠工时之内的劳动难以补全社会消费与前线军备的需求缺口。为了缓解当下的供需问题，我们将发动群众力量，鼓励全社会的青壮年劳动力参与从工程建设到工农业生产等等义务劳动。"
 REU_Suppression_of_counter-revolutionaries: "镇压反革命分子"
 REU_Suppression_of_counter-revolutionaries_desc: "随着革命进程大步向前，反动势力残余们的反革命破坏活动也愈发活跃。他们在夜晚于角落中制造饥饿、炸毁桥梁、毒害孩子，却在白天大呼自由平等博爱妄图掩饰恶行。无论是为了社会秩序，还是为了避免我们的人民遭受反革命思想挑拨，加强内部的肃反与反反动思想宣传都势在必行。"
 REU_War_communism: "战时共产主义"
 REU_War_communism_desc: "面对眼下革命形势，过往的经济模式已逐渐与现实脱节。为了全乌萨斯，乃至更广袤土地上的人民能够得到解放，我们必须在现阶段统合一切手头上的力量，以满足战争需求。过往的物资征用模式将更为严格，而资源及人力的分配优先级也将把军事需求放在首位。或许这无疑会对民众生活条件产生重大影响，但为了最终的胜利，这套体制在当下仍有其必要性。"

