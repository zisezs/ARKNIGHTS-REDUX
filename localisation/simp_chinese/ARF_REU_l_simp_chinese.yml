 REU_Communism_Spreading_Decisions_GUI: "思想建设"
 REU_Communism_Spreading_Decisions_GUI_desc: "卡兹戴尔革命运动的失败无可辩驳的证明了如下事实:无产阶级如果不能强而有力的团结起来，革命运动就必然失败。而只有在斗争的浪潮中，无产阶级对自己处境模糊的共识才会汇聚成一种真正的力量。\n\n经过卡兹戴尔内战血与火的淬炼,经过卡兹戴尔到东达利亚的漫长行军，卡兹戴尔共产党已经把自己组织成了这样强而有力的力量，他们拥有坚定的理想信念，丰富的斗争经验，但这一切的代价几乎不可接受—―他们最多的时候可能拥有数十万追随者和数万军人,足以让任何一个王公贵族颤抖，而如今他们只有不足一万残兵败将、老弱妇孺。\n\n整合运动在乌萨斯决不能重蹈覆辙，卡兹戴尔红军带来了理论和经验，也许我们的战士可以直接向他们看齐，把我们的整合运动塑造成和他们一样坚定的力量，而后，我们将领导东达利亚被剥削的群众团结起来，就像是冰水中的凝结核一样。\n\n让群众之水在乌萨斯帝国的寒风中化为坚冰,粉碎双头鹰的头颅。"

