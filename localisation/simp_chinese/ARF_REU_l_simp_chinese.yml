 REU_state_emergency_committee: "国家紧急状态委员会"
 REU_state_emergency_committee_desc: "民主改革的挫败迫使中央以非常手段稳住摇摇欲坠的秩序。国家紧急状态委员会统揽军政要务，一切分歧暂且搁置，一切资源优先供给国家机器：街头被军管巡逻填满，工厂转入战时作息，党内争论让位于一纸命令。\n\n它换来的是一支不再质疑命令的行政体系与一呼百应的战时动员能力，代价则是民心怨气的积累与稳定度的持续流失。没有人知道这份紧急状态会在哪一天结束。"
 REU_ursus_immortal: "乌萨斯永生"
 REU_ursus_immortal_desc: "冻土上的炉火再不会熄灭。从乌拉尔的矿井到东达利亚的集体农庄，从车间里的车床到设计局里的图纸，整片土地被组织成一台永不停歇的生产机器，而每一次效率的抬升、每一座新厂的落成、每一项技术的突破，都被写进同一个名字之下。\n\n乌萨斯不再只是某个王朝的疆域，也不再只是某一次革命的家国——它已经成为一种不会因为任何人离去而中止的存在。"
