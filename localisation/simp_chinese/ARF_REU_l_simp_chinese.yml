#事件
 event_reu.1.t: "点燃星火"
 event_reu.1.d: "1094年\n\n这是塔露拉·雅特里亚斯在东达利亚冻原上游荡的第四个年头，如果从她逃离黑蛇开始算起，那就是第七个年头\n\n这是叶莲娜·博卓卡斯替娅加入她的养父的游击战争的第七个年头，如果从她被乌萨斯帝国迫害开始算起，那就是第二十三个年头。\n\n这是阿丽娜与塔露拉一起逃离她的故乡的第四个年头。\n\n这是“爱国者”博卓卡斯替的儿子被他自己和乌萨斯帝国杀死后的第十八个年头。\n\n这是亚历克斯被当作逼迫他父亲的人质而投入感染者矿场的第十六个年头。\n\n这是柳德米拉被送去遥远的叙拉古拜师学艺的第十三个年头。\n\n这是萨沙和伊诺被游击队救下来的第二个年头。\n\n这是乌萨斯帝国推翻骏鹰统治，建立起一个新的帝国的第一千零六十一个年头。\n\n帝国犹如一个经历了千年严寒所形成的冰川，巍峨雄壮、不可撼动，而如今的这支小小游击队只是一颗微不足道的小火星，没有人会认为他们的温度能够将冰川融化，就连温暖像他们一样落魄的人都是问题。\n\n但是塔露拉不这么想，她有办法将这枚火星燃烧得越来越猛烈，至少，她认为自己有办法。"
 event_reu.1.a: "毕竟火融化冰是自然的规律。"
 event_reu.2.t: "战士"
 event_reu.2.d: "“回来啦。”阿丽娜听到木门被推开的声音，头也不回地问道。她已经习惯了新的生活方式，跟随游击队四处辗转，她不再需要干很多的农活，取而代之的是教育感染者孩子们读书识字和与周边村庄的人们打交道。当下，阿丽娜正在思考如何准备明天给孩子们上的绘画课，跟随着队伍的孩子有十几名，但她和其他老师手中的画笔和白纸加起来，也只能让两三个孩子用一支笔半张纸。\n\n“今天依然没有遇到大规模的纠察队，如果之后几天都是如此，我们就准备在这个地区扎营了。”塔露拉将她的那件大衣挂到床边，将提灯挂到床的另一边，“天灾信使带来的消息，这个冬天会比往年更冷，如果我们还是漫无目的地游荡，在军队发现我们之前，所有人都可能冻死了。”\n\n“你能不能把你那件大衣拿去卖掉，拿那点钱在城里买一些纸笔书籍回来。”阿丽娜抓着自己的角，半抱怨半玩笑地说着，她作为老师，当然很想帮孩子们拿到更多的纸笔，但她清楚，在严峻的生存条件下，学习用的纸笔绝对会是需求清单的最末尾。\n\n“全是血的大衣，哪个人敢要呢。”塔露拉笑着，她不是第一次听到这个抱怨了，“再说了，这件大衣可是我成为一名战士的证明。”\n\n“塔露拉同学，对我来说，笔和纸也是我作为战士的证明。”\n\n“好吧好吧，我之后在去给你弄几把刀剑来。”塔露拉走到阿丽娜身边，握住她的手，“我负责在战场上灼烧敌人的肉体。”"
 event_reu.2.a: "“而你负责点燃孩子们的灵魂。”"
 event_reu.3.t: "在那贝加尔湖边"
 event_reu.3.d: "“咔嚓，咔嚓”\n\n一只破旧的军靴踩破雪壳，直直陷入积雪，再被主人吃力的拔出来往前放下去。\n\n靴子的主人——前乌萨斯军队的14品武官，感染者游击队的巴兰尼科夫深一脚浅一脚的在东东达利亚地区的积雪里跋涉着。头顶套着绒套的马耳无力地垂下来，他的祖上是卡西米尔地区的库兰塔人，卡西米尔库兰塔以矫健的身手而闻名，但论对付寒冷天气的能耐，他可远比不上比不上乌萨斯人和本地的萨坎哈库兰塔。本来这种活不该让他这样不耐寒的人来的，可他还是强撑着跟来了，因为矿石病被踢出军队的前准尉不想被战友们视作累赘。\n\n出发前从战友们那里分来的热糊糊带来的力气和雄心壮志早就消散在松软寒冷的积雪中了，这个可怜人只是靠燃烧自己的意志力去勉强跟着在前面领路的黑衣女子。\n\n“塔露拉女士？我们到了没有？”快要昏过去的库兰塔人从肺里挤出一句话来。\n\n“已经到了，大家都站着歇一会，然后我们就开始。”\n\n被称为塔露拉的年轻领袖用手拂过已经结满冰霜的额头，再一甩手，挂在眉毛上的冰碴化成水被甩向积雪，在落地之前重新冻成碎冰。\n\n“记好了！不管有多困都千万别睡！来个人把雪橇赶过来！还有力气的人过来拉网！”\n\n女人拔出自己的佩剑，向面前一望无涯的广阔坚冰走去，冬天太阳苍白无力的光打在冰雪上，不觉得温暖，只让人觉得头昏脑涨。"
 event_reu.3.a: "“这太阳真冷啊。”"
 event_reu.4.t: "诗，理智与高压气团"
 event_reu.4.d: "“萨沙，你说老师教我们的这些东西，有什么用呢？”\n\n“怎么突然说这个，伊诺？”\n\n“你看，比如上绘画课的时候，我们连笔刷和画纸都没有，可是老师们还是坚持让我们画周围的风景，可是，我实在看不出来冻原的风景有什么好看的。”\n\n“也不能这样说，草药学不是让我们发现了更多可以吃的野菜吗，听说吃野菜能够让战士们补充维生素，这就是在课堂上学到的知识。”\n\n“好吧，那草药课有些用。”伊诺不情愿地承认了这一点，“那诗歌课呢，像奥涅金的那些诗，我真的不知道它们好在哪里。”\n\n“我也读不出来。”萨沙沉默了一会儿，“你的艺术天赋比我好多了，如果你读不出来，我肯定也不行吧。”\n\n“你们在这儿干什么，不去吃东西吗。”亚历克斯走到两个人面前，手里端着一碗红菜汤，“阿丽娜老师从指挥所那里拿来了一筐新鲜蔬菜，然后她就做了一大锅红菜汤给我们喝。你们喝了吗。”\n\n回应他的只是两个飞快跑走的身影。\n\n几分钟后，三个喝着红菜汤的孩子坐在原木堆旁，继续着他们的聊天。“亚历克斯，你是大科学家的孩子，你说说，老师教我们的东西有什么用呢？”\n\n“嗯，让我想想。你们都听说游击队要储备食物，准备过冬了吧。”\n\n“当然了，我还和萨沙一起去给腌蔬菜的叔叔阿姨帮忙了。”\n\n“爸爸告诉过我，南方的很多国家，他们的冬天要到十月甚至更晚才来到。所以当时我就问他，为什么乌萨斯的冬天来得这么早。”亚历克斯喝了一口红菜汤，像是在卖关子。\n\n“他告诉我，是因为东达利亚高压气团会在冻原上生成，然后才从这里出发，吹向别的国家。也就是说，冬天就是在冻原上出生的。”\n\n“亚历克斯，你说这些，还是没说明白，老师教给我们的东西有什么用呀。”\n\n“理智。爸爸和我说过，学习知识，探索大地上的未知，能够给予我们头脑里最需要的理智。就是因为有了理智，人类才能在冻原上生存下来，并且建立文明。”\n\n“可是，如果这么说，最有理智的那些科学家还是被乌萨斯害死了。亚历克斯，你爸爸说的真的是……啊！”伊诺正准备说下去，萨沙一掌拍在他的脑袋上，打断了他。\n\n亚历克斯苦笑一声，“没事，伊诺，我知道你没有恶意。关于我爸爸的事情，他在和我分别前，教了我一句诗。”\n\n“怎么又是诗歌啊。”伊诺烦躁地撅起嘴，亚历克斯依然笑着，自顾自地继续说下去。"
 event_reu.4.a: "“理智无法理解乌萨斯。”"
 event_reu.5.t: "黑龙的计划"
 event_reu.5.d: "叶莲娜在营地里走着，她感受到一阵风从北方吹来，随手扯了扯围巾。叶莲娜知道对于自己来说，寒风对自己本就冰冷的体温并没有什么作用，她做这个动作的唯一原因只是在模仿大部分人做的那样。\n\n她的靴子踏在厚重的土地上，这些泥土将在几个星期以后被北风完全封冻。干粮的储备尚待统计，但是其他的物资储备已经告急，包括她最需要的糖和辣椒素。如果塔露拉没有为她提供一个靠谱的计划，那么叶莲娜首先将会为她的辣椒糖果据理力争。\n\n思考着，叶莲娜已经不知不觉走到了塔露拉的木屋前。这间屋子于其他简易的房屋没有什么不同，能够找到它只是自己记忆力的功劳。塔露拉通知她今晚来商讨游击队的下一步计划，这既关乎即将到来的寒冬，也关乎整合运动所有人的未来。想着这些事，叶莲娜推开了门。\n\n塔露拉就坐在壁炉旁，好似在发呆，在这段等待的时间里，这位感染者们的领袖似乎什么也没干。看到霜星推开门走进屋子，塔露拉手指向对面的另一张椅子，示意她坐下。\n\n“接下来的计划是什么，塔露拉。”霜星并不想多说废话，博卓卡斯替的教导告诉她，重要的事情说得越简单越好。\n\n“熬过这个冬天，然后我们继续去南方。”塔露拉并没有看霜星，而是盯着跳动的火焰，“你知道这是我们一直以来的计划。”\n\n“说下去，我们需要讨论细节。”\n\n塔露拉继续盯着火焰，没有立即回答，只是任凭柴火燃烧出噼里啪啦的声音，过了一分钟，她才缓缓张口：“最关键的食物，我们继续用在森林里采集到的药材和野果野菜与村民们交换，然后我们可以趁着入冬之前的时间，通过打猎获得补充。等到贝加尔湖封冻之后，我会带人去开湖捕点鱼。”\n\n“那药品和其他东西呢，比如衣服和铳械？还是靠抢？”霜星看着塔露拉，“天气越来越冷，袭击的代价将会越来越大，敌人可以坐在温暖的卡车里，但我们的战士必须在寒风里埋伏几个小时。”\n\n“我已经安排好了。”塔露拉把脸转向叶莲娜，“我已经让柳德米拉去切尔诺伯格了，她会在那里发展线人，线人会试着给我们买一些我们需要的东西。”\n\n“钱从哪里来，不要告诉我你要让那些城市里的感染者自掏腰包，他们的工钱不可能让他们买得起东西。”“我有办法，即使我没有办法，我相信柳德米拉也会有的。”塔露拉看向霜星的眼睛，“叶莲娜，请相信我是正确的。切尔诺伯格是我们的下一个目标，所以我们必须尽早探明情况。”\n\n叶莲娜叹了一口气，“塔露拉，我不是不信任你……”"
 event_reu.5.a: "“……我不信任的，是我们自己。”"
 event_reu.6.t: "独处时分"
 event_reu.6.d: "在营地附近的森林里，有一片被采伐过的土地，塔露拉喜欢在夜晚睡不着的时候来这里待着。树桩上的原木现在已经变成了营地里的房屋和栅栏，塔露拉坐在一个小树墩子上，这里能让她想起和游击队员们一起劳动的日子。\n\n塔露拉从怀里掏出一个铝制的酒壶，这是她从一个纠察队员的尸体上找到的，翻出来的时候酒壶里什么也没有，里面只有直冲鼻腔的浓烈伏特加的味道。也许那个死人生前是个酒鬼，也有可能是个用酒来暖身子的怕冷的胆小鬼，塔露拉不想知道，她只是打开酒壶，往嘴里灌了一口伏特加酒。然后她马上吐了出来。\n\n热辣的蒸馏酒灼烧着塔露拉的口腔，她马上就后悔了，后悔自己不应该逞强，问那几个战士要酒喝。营地里并没有酿造设备，这个罐子里装的伏特加酒肯定是从哪里抢来的，但塔露拉依然不想知道。她只知道自己还是不适合喝烈酒。\n\n舌根依然火辣辣的疼，塔露拉想起了自己在公爵们的宴会上品尝高卢利口酒的日子，也许自己只适合喝那些东西。她给了自己一巴掌，不，塔露拉，香槟和勃艮第红酒不是战士喝的东西。然后她又叹了口气，喝不下烈酒的她是不是注定无法成为战士。\n\n塔露拉扭上了酒壶的盖子，重新放进大衣的口袋里。这件大衣也是她从贵族宅邸里带出来的，她一直没想明白自己为什么留着这件衣服，她自己不愿意承认的是，她可能还做着回去当贵族的美梦。塔露拉感觉身边的幻景在不断地变化，这些光秃秃的树桩一瞬间变成了宴会上摆满山珍海味的餐桌，又一瞬间变回了被游击队员们唱着民谣砍倒的一棵棵大树，最后又变回了荒凉的林场。这也是科西切的源石技艺吗，在塔露拉动摇时加剧她的幻想？塔露拉厌烦了，她重新拧开酒壶，抬头灌了一大口酒，让火热的伏特加直接滑入喉咙。\n\n妈的。塔露拉咳嗽着，在心里骂了一句乌萨斯粗口。她把酒壶放到原先她坐着的那个木桩上，然后拍拍大衣上的尘土，在这个安静的深夜走回营地。"
 event_reu.6.a: "而酒壶里的伏特加就好像她献给大地的祭品。"
 event_reu.7.t: "人前人后"
 event_reu.7.d: "“那个塔露拉，我一直觉得她不配当领袖！虽然她也和我们一起吃饭，一起睡破床板，打架的时候也会保护咱们，但是！我和你们说！有一点她绝对比不上霜星大姐！那就是……”\n\n“迪米特里你个傻逼快闭嘴吧……”\n\n“说啊，怎么不说了？”叶莲娜的脸上没有表情，就像她的体温一样冰冷。她在带队巡逻结束后就回到了营地，准备去雪怪小队的营房拿一颗辣椒糖，然后就听到了喝醉的迪米特里在胡言乱语，不，也不一定是胡言乱语。\n\n“那就是，塔露拉这个家伙，对兄弟们隐瞒太多了，哪里像霜星大姐，还有……嗝，大尉他老人家，什么事情都和我们说！”\n\n“完了，迪米特里连听觉都出问题了。”其他神智还清醒的雪怪小队队员都捂着额头，用眼角的余光偷看着霜星，等待着她的反应。\n\n霜星环视房间内，除去几个睡着的和面前发酒疯的迪米特里，没喝醉的还不少，她手指向其中一个人，“卓娅，告诉我，酒从哪来的。”\n\n“是亚历克斯的人拿过来的，好像叫……安德烈。他说是他们从一个运输车队那里抢的。”\n\n叶莲娜看了一眼地上的空酒瓶，还有一两瓶没打开的伏特加放在屋子中央的桌上，走上前去，沉默地把两瓶酒揣进怀里。\n\n“烈酒可以拿去杀菌消毒，下次缴获了烈酒，优先给医疗兵们看看。”霜星对着还清醒的雪怪们说着，在看到他们不停地点头后，她走到屋角的柜子旁拿了两颗辣椒糖，离开了营房。\n\n霜星拆开辣椒糖的包装纸，把糖丢进嘴里，不亚于烈酒的灼烧感刺激着她的舌头，她想起自己怀里还抱着两瓶伏特加，于是她转身向小医院的帐篷走去。\n\n走去医院的路上，她回味着迪米特里发酒疯时说的话，塔露拉确实隐瞒了很多东西，父亲似乎能够看穿她的一些伪装，但是叶莲娜不能。她并不想责怪那个说胡话的士兵，他和其他人每天都要生活在饥饿和寒冷中，担忧着感染者纠察队的大军发现这个营地，一次战斗就有可能比矿石病更快地夺去他的性命，而操控着这一切的领袖，他却对她一无所知。\n\n“你到底藏着多少东西，塔露拉。”"
 event_reu.7.a: "“刚刚霜星大姐来过了？！”"
 event_reu.8.t: "药"
 event_reu.8.d: "“伊利亚。”\n\n“啊，妮诺奇卡，什么事？”\n\n“……上个月，我们死了多少人了。”妮诺奇卡走到火堆旁坐下，她看了一眼身旁盯着燃烧的火焰发呆的伊利亚，这个从城里逃出来的医生，他的白大褂身上沾满了凝固的鲜血，还有刮不掉的源石碎屑，“我是说矿石病害的。”\n\n“十几个吧，大概。”伊利亚的视线从火焰上移开，他拉起自己的袖子，看着手腕上的源石结晶，又看看身边的那个游击队女战士，“其实也不能单纯归结于矿石病。有些弟兄在战斗中受了伤，伤口感染又导致矿石病恶化，结晶很快覆盖了他们的伤口，人很快就不行了。”\n\n“还有呢。”\n\n“我知道你想问什么，妮娜。”伊利亚把袖子拉回去，站起身，走回了被称作“医院”的那个小帐篷，“我们没有更多的抑制剂了。而且，即使我们有，那些已经到了用抑制剂的阶段的人，抑制剂对他们来说，也只不过是多活几天罢了。”\n\n伊利亚在药柜子里翻着东西，最终拿出了一瓶药片，重新走回了火堆旁，“还是像原来一样，你的症状一天吃一次，只有发痛到不能忍受的时候才能吃。”他的喉咙抽动着，似乎还有什么想说，他还是说出口了，“如果药够多，其实是应该一天吃两次的。”\n\n妮娜接过药，无奈地笑笑，把药瓶放进了外套下的衣服口袋里。\n\n“你的哥哥怎么样了？”\n\n“科利亚……他应该快不行了。”妮娜小声说着，不带感情，太多的苦难已经让她麻木了，“他的内脏都已经开始结晶化了，我今天摸他的肚子，已经是……”\n\n“我很抱歉，妮娜……”\n\n“您没什么需要抱歉的，医生。我们都知道这是绝症。”妮娜沉默了一会，然后又开口说着“科利亚让我问您一声，如果他快不行了，医院还会把抑制剂分给他吗。”\n\n伊利亚看着妮娜的脸，她的眼神流露出来的感情，似乎是早已知道答案。\n\n“我们现在没有抑制剂了。根据新的规定，如果我们有的话……”"
 event_reu.8.a: "“……医院欢迎他来见我们最后一面。”"
 event_reu.8.b: "“……临终的病人也不能使用了。”"
 event_reu.9.t: "面包与野草"
 event_reu.9.d: "“风越来越冷了。”阿丽娜匆匆忙忙地跑进屋子里，飞快地转身把门关上，生怕漏进屋子里的冷风把仅存的那一点温暖带走，“孩子们不能再在屋子外面上课了。”\n\n把大衣在门边的架子上挂好，阿丽娜绕到了正在伏案的塔露拉身后，游击队领袖的眉头紧锁，她看着桌上的几张草稿纸，连声叹着气。\n\n“怎么了，塔露拉，又遇上什么烦心事了？”\n\n“口粮。”塔露拉抓着头发，眼睛死盯着草稿纸上的那几个数字，“如果按现在的分配方式，我们的口粮根本撑不过这个冬天。所有人的过冬口粮都必须减少。”\n\n阿丽娜俯身，看着塔露拉面前的那一张被数字填得乱七八糟的草稿纸。她轻轻地笑了一声。“我的数学没有你这么好，算不出这些东西。不过有一个道理我是知道的。”\n\n“塔露拉，你能忍得了饿吗？”\n\n“我当然可以，如果口粮不够吃，我肯定会给自己更少的食物。”\n\n“那其他人呢？他们会像你一样，愿意忍饥挨饿吗？”\n\n年轻的领袖沉默了，她用理性计算出了能够让这支队伍撑过寒冬的新数字，但冬天显然不能用几串数字来衡量。\n\n“那我该怎么办，阿丽娜。”\n\n“如果从现在就开始减少口粮，我们能在冬天攒下更多的粮食吗？”\n\n“也许能。但是我不敢保证。”\n\n“那就从今天开始减少口粮的配给。现在的天气还没那么冷，大家会找到其他办法的，森林里还有野菜根呢。而且我相信，大家都会同意，把今天的粮食留到更寒冷的时候再吃。”\n\n塔露拉看着阿丽娜，又看了看桌上的那一张写满数字的纸。"
 event_reu.9.a: "“……我还是相信数字。”"
 event_reu.9.b: "“听你的吧。”"
 event_reu.10.t: "今晚吃鱼，明晚也吃鱼"
 event_reu.10.d: "“咕噜噜噜噜”一口大锅支在空的液化源石桶上，下面就是燃烧着的木柴，锅里的水已然开了，咕噜咕噜的冒着泡泡。一望无际的雪白冰面上星星点点的分布着一些围满了人的小洞，就在这些冰洞的附近就是架着锅的灶台。\n\n贝加尔湖的冰面连塔露拉都难以破开，自然也能支持这些个个小小的灶台。\n\n巴兰尼科夫拔出自己的佩刀，蹲下来，把冰面当做案板用力的劈砍一条约莫半普特重的大马哈鱼。掏空内脏的鱼被切成了大小不一的肉块，一切好肉，饿得两眼放光的整合运动战士们就马上涌上来抓起肉块就丢进一边的锅里。\n\n冬天这里的鱼真是好抓，稍微在冰面上破开一个洞，紧接着要呼吸新鲜空气的傻鱼儿就会一个个的往外跳，战士们只要备好渔网和鱼线就能抓来不知多少肥美的大鱼。\n\n就在锅里炖着鱼汤的同时，那个负责掌勺的兄弟正在向大家吹嘘当年自己在圣骏堡的小店堪称招牌的鱼汤手艺。据他吹嘘他的鱼汤营养丰富又十分美味，邻居家的小伙子就是因为爱喝他炖的鱼汤才“壮的和乌萨斯兽亲一样”。\n\n巴兰尼科夫咂咂嘴，一边听着，一边在记忆里翻找鱼汤的味道。\n\n失败了。\n\n他自己都记不清上次正儿八经的吃上一道鱼汤到底是什么时候了，大概自从因为接触了那天杀的源石，染上这搞不明白的怪病之后，饱受白眼和歧视的巴兰尼科夫就没有闲心思，也没有闲钱去好好坐下来享受哪怕一道热腾腾的汤。\n\n就在回忆的时候，他的怀里被塞了一碗汤。\n\n这玩意似乎不太能算得上是正经的鱼汤，调料欠奉，鱼肉则比洋葱土豆和胡萝卜加到一起都多，但无所谓，巴兰尼科夫还没反应过来，大半碗汤就消失在了嘴里。\n\n巴兰尼科夫想起了出发之前自己吃的那个不知道用什么粮食混在一起做成的糊糊，恐怕开春前所有人的粮食都是从贝加尔湖里捞上来的鱼。\n\n那开春后吃什么呢？\n\n冻原库兰塔人种植麦子，也蓄养瘤兽。要是他们肯卖给我们就好了。"
 event_reu.10.a: "可要怎么样他们才会愿意呢？"
 event_reu.11.t: "囚笼困境"
 event_reu.11.d: "整合运动的后勤交易队的马埃利·达米卡娜最近愁眉不展，整合运动的粮食消耗速度完全超出了预期。\n\n整合运动的粮食供应主要来源是和当地的村民交换，但最近的交换很少有成功的情况，就算成功交换到的也只有少的可怜的口粮。\n\n实在没有任何办法的整合运动后勤部只能加大交换的批次来填补数量上的不足，而马埃利带着她的交易小队已经跑了两三个村庄了，所能交换到的口粮依然是微乎其微。\n\n马埃利简直要崩溃了，但她不能把崩溃显露在面上，如果她都崩溃了，那么她所率领的这支小队的士气也会完全垮掉，她绝不能让这种事发生。\n\n这时，她们也来到了此行的最后一个村庄，她也只能寄希望于这个村庄还有余粮了。\n\n走进村庄，马埃利直奔了村长的住所，她刚一坐定便开门见山的说：\n\n“您好，我是整合运动后勤交易队三队的队长马埃利·达米卡娜。请问村里还有可供交换的食物吗？”\n\n看着沉默不语的村长，马埃利终于失去了她本该有的冷静，急切的说：\n\n“如果有的话就请您与我们交易吧，食物的供给已经完全紧缺了，我们愿意为交换开出双倍的价格。”\n\n听到这话，年迈的村长也叹了口气，带着马埃利走到了村中的仓库，推开重重的库门，其中连一点粮食也没有了。\n\n村长露出了悲哀的表情，叹了口气：\n\n“军队来过了，拿走了所有可以拿走的粮食，拿不走的就一把火烧掉。大概周到的村落都是这种情况。不过，我们凑一凑还是能有一点口粮，可以交换…”\n\n马埃利什么也说不出来了，只是麻木的交换了杯水车薪的食物。"
 event_reu.11.a: "交易队离开了村落"
 event_reu.12.t: "伏击"
 event_reu.12.d: "萨沙的内心非常忐忑，这是他第一次单独带队执行任务。在霜星和爱国者的教导下，萨沙的射击技术突飞猛进，而他的源石技艺也被开发出来，能够让他和其他游击队员隐匿踪迹，从而发动突然袭击。而今天的任务正好可以让他发挥这些优势。\n\n一个运输感染者的车队正经过此地，他们从遥远的伊赛特斯克出发，目的地是切尔诺伯格附近的矿场。乌萨斯政府把感染者送到离家乡千里之外的地方，目的只是防止感染者的亲人朋友前往矿区给他们送东西。将死的奴隶是不配得到乌萨斯的关注的。\n\n一颗子弹射穿了开路的卡车的前挡风玻璃，扎进司机的大脑中，失控的卡车在一阵摆动后翻倒，彻底拦住了整条道路。与此同时，另一颗子弹射进了最后一辆卡车的驾驶舱中，同样带走了驾驶员的生命，而卡车不受控制地继续向前开去，这个可怜人的遗体又在两辆车的追尾中彻底碎裂。\n\n“沉住气，把所有下车的乌萨斯士兵都打死以后再出去。”\n\n意识到有人袭击的护送军警匆忙下车，准备迎敌，但回应他们的只有来自四面八方又不知其源的子弹。\n\n直到最后一个拿着武器的人倒下，萨沙才停止了源石技艺，解除了伏击部队的伪装。小队队员们开始有序地搜索乌萨斯军警的遗体，寻找所有他们用得着和看得上的东西。\n\n“首要目标是搜索打开货柜的钥匙！优先搜索第一辆侧翻的车，塔露拉可不想看到感染者受伤！”萨沙指挥着后续的行动，他并不清楚这些游击队员们是否会服从他的指挥，但既然担当了这份职责，他至少要把自己能做的做好。\n\n他来到一个被打开的车厢前，里面全是惊魂未定的感染者，正在用恐惧和警惕的眼神看着面前的游击队员。萨沙深吸一口气，拉起覆盖着他手臂的衣袖。"
 event_reu.12.a: "“不要慌张，我们也是感染者。”"
 event_reu.13.t: "老师的职责"
 event_reu.13.d: "位于游击队营地中央的指挥所每一天都需要接待许多人，前线的指挥官，寻求帮助的流浪感染者，有胆量来做交易的商人……今天推开指挥所的木门的是一个没什么人认识的感染者老师，值班的传令兵也许只会认为，老师们的教学资源又短缺了。直到他被指挥所里激烈的争吵吸引了注意。\n\n“塔露拉！萨沙去哪了！他今天没有来上草药课！”阿丽娜一改平时的温柔，满脸怒意，一步步地逼向站在地图前的塔露拉，“你是不是让他去作战了？”\n\n塔露拉一时不知道怎么回答，是的，允许萨沙走上战场的命令最终是她下达的，但是萨沙的天赋是叶莲娜和老将军发掘的，而走上战场的愿望，则是萨沙亲口所言。她试图从这些事实里寻求一些片段来为自己开脱，但她又觉得这是在敷衍她最珍视的人，所以在几秒钟的语塞后，回应给阿丽娜的依然是沉默。\n\n“我知道作战部队的人手不足，我们也已经有几个老师上了战场。但是萨沙这个孩子，他才几岁啊，塔露拉！你怎么能……”怒音逐渐变为哭腔，话语终结在哽咽中。\n\n塔露拉继续沉默着，传令兵已经拉来一张椅子给阿丽娜，但阿丽娜没有选择坐下抹眼泪，而是用满眼的泪水瞪着塔露拉。她用愤怒掩盖她的担忧，而她的担忧则来自于她的坚强。\n\n“你是领袖，你有你的道理。但是我是老师，我也有我的道理。” 塔露拉明白，现在涉及到原则问题，她不奢望通过私下的亲密关系让阿丽娜屈服了。现在的阿丽娜不是别人，她只是一个感染者老师，而老师要对她的学生负责。"
 event_reu.13.a: "“我们是为了孩子去战斗，而不是让孩子去战斗。”"
#  event_reu.14.t: "劫掠大获成功！"
#  event_reu.14.d: "这次行动相当顺利，排头兵迅速占领了几个关键位置，我们没什么损失就将对面收拾了个落花流水。小队长在清点战后时候发现我们不仅没丢一个人，甚至连伤也没伤几个，掠夺的物资足够我们花点时间好好清点一下了！"
#  event_reu.14.a: "“收队！”"
#  event_reu.15.t: "劫掠成功"
#  event_reu.15.d: "我们这次碰了块硬茬子，敌人的抵抗有点在我们的意料之外，我们拼死拼活还是把我们需要的东西给抢出来了，不过还是没了几个，不管……不管怎么说，这也不算是场赔本买卖，只是事后处理我们要稍微花点时间了。"
#  event_reu.15.a: "“把医疗物资优先分配一下吧”"
#  event_reu.16.t: "劫掠失败"
#  event_reu.16.d: "我们总算是撤出来了，鬼知道这次他们多加了几道防！恐怕这几个就是我们逃出来的所有人了，不仅汤是一点儿没喝到，连着本儿也搭进去不少……事情虽然怎么都能过去，但，我们接下来该怎么办？"
#  event_reu.16.a: "“听好命令，接下来我们容不得半点差错”"
#  event_reu.17.t: "宝物到手！"
#  event_reu.17.d: "轻轻松松！多亏一开始排查摸点做得仔细，我们几个小组顺着边就摸了进去，路上一个大头兵也没遇到！这趟可算是收获颇丰，不仅走的时候满满当当，有几个小伙子还找到了点意外之喜，估计现在对面那群冤大头还不知道他们家都被掏空了呢！"
#  event_reu.17.a: "“这羊你们也不能逮着一只使劲薅啊……”"
#  event_reu.18.t: "物资带出来了"
#  event_reu.18.d: "真是没想到，敌人临时变了哨，不过还是比较顺利地混进去了，得亏来的这群都是点老手，一个个脑筋活得很！虽然说这次行动成功了，不过我们在出来的时候遇到了点小麻烦，几个家伙差点跑不了，不得已扔了点，咳，总归带出来就是好的嘛！"
#  event_reu.18.a: "“那我们得好好复盘一下这次行动了”"
#  event_reu.19.t: "侥幸脱险"
#  event_reu.19.d: "坏事儿了，这次不知怎得，敌人把整个布局打乱了，我们仅有几个人混了进去，连个毛也没碰到不说，敌人鼻子又不知怎得灵了起来，愣是领着兵就追上去了，有几个粗笨的还是没躲开他们，就对面那群老东西的手段……恐怕凶多吉少。"
#  event_reu.19.a: "“少一个老手我们都经受不住啊……”"
 event_reu.20.t: "麻烦事态"
 event_reu.20.d: "尽管已经做好了准备，冬天仍然比想象中的更加严峻，食物储备即将见底，已经有一些忍受不了饥饿的感染者寻求脱离队伍，塔露拉在担忧会不会有更多的人效仿他们。阿丽娜已经先一步出发，去那些已经建立了联系的村庄交换粮食，按照计划，塔露拉也会在开完这个小会后，带着捕鱼队继续去冰面上等待机会降临。\n\n敲门声打断了会议。塔露拉的心情有些不愉快，他们所讨论的是如何处置脱离队伍的人这样关键的问题，如果是无关紧要的小事，她也许会发火的。但是很明显，面前喘着粗气，外衣被利器撕破的战士，要对塔露拉说的并不是小事。\n\n“塔露拉！是纠察队！他们在搜查和我们交易了粮食的那个村庄！现在转移吗？我们现在撤走的话，等他们发现我们的踪迹，我们早就走了！”\n\n“把纠察队引过来。”塔露拉没有多余的思考，“我们在这附近伏击他们，即使要留下痕迹，我们也应该让纠察队认为这些是我们做的。”\n\n“塔露拉，再想想！十公里之内就是第三集团军的岗哨，一旦纠察队报信，他们也会出动！”\n\n“如果这两个村庄因为包庇我们而被洗劫……不，不包庇我们也没用，只要他们因为感染者而受害，我们之前建立的交易渠道就会功亏一篑，不会再有村子会愿意和我们交换物资了。”\n\n塔露拉走到门边，拿起她的剑。\n\n“我们现在要做的是拓宽我们的道路，以及愿意继续走下去的后人的路。"
 event_reu.20.a: "“还有问题吗？”"
 event_reu.21.t: "归来"
 event_reu.21.d: "塔露拉拖着疲惫的身躯回到营地，让她感到劳累的并不是战斗所造成的体能消耗，实际上，这种程度的战斗对她一个人算不了什么，真正让她劳神的，是如何保障所有战士们的安全。很幸运，这场战斗没有失去任何一个感染者战士。塔露拉已经迫不及待地在回到营地之后向阿丽娜索取一个拥抱了。\n\n“你们居然连援军也一并打垮了？不愧是塔露拉……！”\n\n塔露拉已经很习惯听到其他战士的称赞了，但作为领导者，沉溺在夸耀间并不是她应做的事。她转身问那个与她说话的战士：\n\n“感染者同胞们呢？”\n\n“已经安顿好了。我们找的那个备用据点有用了。”\n\n“清点-过人数没有？”\n\n“清点过了，有几个孩子哭着说什么，姐姐没回来，之类的……\n\n“不过这些事甚至有些常见了，哎。”战士叹了口气，他没有注意到身边的领袖错愕的神情。\n\n一个盾卫大步跑过来。\n\n“塔露拉！残存的纠察队我们已经发现了。看来是一直在逃。”\n\n“逃向哪里去了？”塔露拉的声音有些掩盖不住的慌张，和颤抖。\n\n“东边。不知道他们会不会找到之前我们赶走的那几个人。”"
 event_reu.21.a: "“——塔露拉？！”"
 event_reu.22.t: "重逢，亦是初见"
 event_reu.22.d: "雪为什么还没有尽头。\n\n冬天为什么还没有尽头。\n\n大地为什么还没有尽头。\n\n塔露拉这么想着。塔露拉停下了脚步。\n\n阿丽娜坐在路旁的树下，右手包扎着绷带，似乎安详地睡着，一个身着长袍的黑发萨卡兹蹲在她的身侧，似乎是在给她疗伤，在她们的身边，还站着几个手持武器的萨卡兹战士。\n\n塔露拉感受到自己的身体突然变得轻盈了许多，她不知道这是否是心理作用，抑或是真的有什么东西从她的身上剥离掉了。但她的手仍然放在剑柄上。\n\n“你们是谁。”塔露拉在持久的沉默后，缓缓吐出这几个字。\n\n“塔露拉？”听到了塔露拉的声音，阿丽娜睁开了眼，而她身旁的萨卡兹也顺着她的眼神看向了那个白发的德拉克。她和几个萨卡兹互相交换了一下眼神，随后，其中看上去是领头人的那一个战士将长刀收回刀鞘，走上前来。\n\n“我们是从卡兹戴尔来的萨卡兹红军，对感染者没有恶意。”\n\n这个家伙的乌萨斯语很蹩脚。这是塔露拉对他的第一印象。但是她也在这个战士的眼神里看到了一些特别的东西，她曾经只在很少的人眼睛里看到过的东西。\n\n“我是她的……”塔露拉用她所掌握的萨卡兹语言进行回应，但她对最后一个词语的选择仍然有些犹豫。\n\n“亲人。”阿丽娜微微地歪头，对看着她的塔露拉微笑着说。\n\n“亲人。”塔露拉用萨卡兹语把这个词再说了一遍。\n\n萨卡兹红军战士笑着让到林中小路的一旁。塔露拉小跑着，在那棵树下与阿丽娜紧紧相拥。"
 event_reu.22.a: "冬天将有尽头。"
 event_reu.23.t: "回家"
 event_reu.23.d: "“塔露拉回话了！”雪怪小队的通讯员向帐篷外喊道，霜星和其他几人马上冲了进来。\n\n“她的通讯环境如何，能接到游击队的公开频段上吗？”\n\n“我马上确认，大姐头！”通讯员摆弄通讯设备的几分钟里，本来还在沉默之中的营地炸开了锅。领袖的安危得到确认，但疑惑立即蹿上了游击队员们的心头。\n\n“塔露拉她身为领袖，却还是违反纪律私自离队，这……唉……”霜星身边的一个盾卫嘟囔着，然后他便被霜星瞪了一眼。\n\n“也许有突发情况。等塔露拉的回应。”霜星冷静地说着，“……所有人都有些各自保留的事情。”\n\n“一，二，三，确认。”熟悉的声音在通讯频道上响起，营地又再次陷入静寂。\n\n“收到，塔露拉。报告你的情况。”霜星拿起对讲设备。\n\n“我去找人了。”塔露拉顿了顿，“我派去交换物资的人遭到了袭击，是今天早上被放逐的那伙人干的。”\n\n“有人受伤吗？需要医疗兵去你的位置吗？”\n\n“这里有医疗兵了。”塔露拉再次停顿，她需要时间处理她的语言，“有另一支队伍在附近，他们救下了交换物资的人。他们都是萨卡兹，态度很友好，好像很希望来到我们的营地。”\n\n“了解。我会让队伍里的萨卡兹战士去把你们接回来。”\n\n挂断通讯后，塔露拉缓缓从树上滑下来，对那几个萨卡兹红军战士点了点头。那几个萨卡兹笑出了声，互相拥抱在一起，似乎他们等待这一天已经很久了。塔露拉不知道的是，他们真的等了很久，比她想象的时间长了很多，很多。\n\n“我会带你们去我们的营地。”塔露拉并没有向这些战士透露她的领袖身份，战士们都只是把她当作向导，“走吧。”\n\n“可惜，换来的东西被那些人抢走了……”阿丽娜缓缓站起来，但体力不支的她还是没站稳，靠在了树上，在身旁医疗术士的搀扶下才没有摔倒。\n\n“阿丽娜，别逞强。”塔露拉慢慢走到阿丽娜的身前，低下了她的身躯，“我背你走。”\n\n阿丽娜的脸泛起红晕，她想推脱，但她还是被身边的医疗术士扶到了塔露拉的背上，术士用着她那不熟练的乌萨斯语劝说着：“小姐，你的身体，不好。”\n\n“不用了，我真的自己可以……”她的声音越来越小声，而她的脸颊也越来越红。"
 event_reu.23.a: "德拉克背起了埃拉菲亚。"
 event_reu.24.t: "像乌萨斯人一样行事"
 event_reu.24.d: "东达利亚是一个冷酷无情的世界，连乌萨斯人自己也常常这么说。这里的土地每年都有至少七个月覆盖着一层厚厚的白雪。在这样的地方，如果一个人胆敢在严冬来临时贸然离开房屋，甭说那些刀子一样的寒风会不会把他变成冰雕，光是呼应着寒风从天上降下的皑皑白雪，其威力就足够把那个倒霉蛋活生生淹死在这些固态的水中——祖列尔不知道到底有多少同志在道路上被这些白色死神扼杀，但应该很多很多。\n\n祖列尔，萨卡兹建筑工之子，大概没人告诉他的父亲，在战乱频仍的卡兹戴尔当建筑工不是一个好主意。在他还是个孩子的时候，他亲眼看见他的父亲被一队人掠走了——不知道是王庭军还是佣兵团，但总的来说在混账程度上都一样。\n\n这就是为什么祖列尔参加了卡兹戴尔红军，他要把那些肆意凌虐百姓的白色死神统统消灭干净。\n\n但现在他在对抗另一种白死神——这个瘦削的卡兹戴尔男人正在为他的战友们打造能够用来过冬的营房。\n\n他的父亲是建筑工，而他自己小时候也学过两招，论盖房子啥的他确实算是一把好手，就在他面前，一栋木屋几乎差不多要封顶了，这座木屋用的是东达利亚森林里上好的木材，造型却是是典型的卡兹戴尔式样，整个房子的工艺简单但足以遮风挡雨，他觉得至少让每个战友都能住上房子已经够了——\n\n但一个穿着防寒服，把自己包的像是粽子的人说这样还远远不够。\n\n他是个本地人，他亲眼见过冬天的暴风雪把邻居家的房子压塌了，在那个风雪喧嚷的夜晚，邻居一家都被悄然埋在自家房屋的废墟里，一直到暴雪停止，他们才看到已经被雪花压垮了的邻居家的废墟。\n\n“我们乌萨斯人从来不敢这样建房子，我们会用木头搭比你这厚双倍的墙，选最粗的木头给房子承重……然后给房子配上一个尖顶。”\n\n祖列尔想了想，决定听从这个穿着防寒服的本地人的话，造一栋乌萨斯式的房子。"
 event_reu.24.a: "“既然在乌萨斯，那么我们就该像乌萨斯人一样行事”"
 event_reu.25.t: "初见，同归一梦"
 event_reu.25.d: "“小心脚下，塔露拉。”守候在简易哨塔上的感染者战士拉着塔露拉的手臂，把她拽上了哨塔，“你不常来到这里。”\n\n“每个人都有各自的岗位。我知道你和其他人守着这个地方有些日子了，格奥尔基。”塔露拉从身旁战士的手中接过望远镜，“也许今天你们就能等来换班的人。”\n\n“这是什么意思，塔露拉。”\n\n“又有一支队伍要加入我们了。不过，鉴于他们的规模，也许是我们加入他们。”\n\n“他们也是像我们一样的感染者吗？”\n\n塔露拉仍然举着望远镜，眺望着无边的冻原。风雪已经逐渐止息，但太阳仍然只是隐在朦胧的云中，远方的泰加林一片静寂，就像它千百年来不变的模样。\n\n“也许吧。我不确定。”\n\n“为什么说是不确定呢，塔露拉，我不明白。”格奥尔基问道。\n\n“正是因为我也不明白。”塔露拉摘下望远镜，看向身边的战士，“他们自称‘红军’，我还没有理解这个名号的意义。”\n\n“也许，是因为红色是鲜血的颜色。”\n\n“叶莲娜？！你什么时候上来的？”塔露拉惊讶地看着不知何时出现在自己身后的霜星，“你上到这里来干什么？”\n\n“和你一样，见我们的新朋友。”霜星迈步走到塔露拉左边，眼睛盯着远处的泰加林边缘。\n\n“塔露拉，你看！”眼尖的格奥尔基先叫出声来，他的手指向森林的方向。\n\n塔露拉再次举起望远镜。这次她看到了一支军队。这些萨卡兹人的军服已经破烂不堪，却维持着一种惊人的整洁。他们没有一个人的面容不透露出饥馑，但他们的眼睛里却有着与他们的健康状况不匹配的目光，自信、坚定，却又透露出一丝不属于嗜血的士兵的温和。这支队伍在无声的冻原上，以无声的方式行进着，但塔露拉似乎于无声之中听到了他们的力量。\n\n走在队伍最前方的，是一个金发的萨卡兹女性，她似乎瞥见了游击队营地那稍高出地面的哨塔，向哨塔的方向抬起了头。\n\n“我们终于见面了，战士。”康拉德·克内希轻动嘴唇，喃喃说道。"
 event_reu.25.a: "“你好。”（卡兹戴尔语）"
 event_reu.26.t: "红军会议记录：1094-12-XH（其一）"
 event_reu.26.d: "记录员：希维·卡奈森\n\n本次会议主题为萨卡兹红军中央领导集体与乌萨斯感染者游击组织的会师改组问题。\n\n红军代表康拉德·克内希发言：\n\n——讲述红军向北行军原因、目的、过程，康拉德强调进军是为保存力量，寻求盟友伺机反攻。\n\n红军代表塔尔曼恩补充发言：\n\n——红军可向感染者游击队提供技术和装备上的援助，希望得到信任。\n\n游击队代表塔露拉发言：\n\n——关于红军救助游击队相关人员一事，塔露拉对康拉德和塔尔曼恩表达感谢，表示反抗压迫者应当联合，欢迎红军来到此地。\n\n——游击队状况很差，无法自给自足，红军到来增大粮食压力，希望红军有办法解决。\n\n游击队代表叶莲娜发言：\n\n——对红军组织结构提出疑问，担忧非感染者与感染者关系。\n\n红军代表康拉德回答：\n\n——红军并非简单的感染者反抗组织，集合了卡兹戴尔的被压迫者。希望游击队可向红军学习指导思想。\n\n由于感染者游击组织方面需要讨论，代表塔露拉提议休会。"
 event_reu.26.a: "将记录归档。"
 event_reu.27.t: "红军会议记录：1094-12-XH（其四）"
 event_reu.27.d: "记录员：希维·卡奈森\n\n本次会议主题为红军与游击队的编制和指挥问题。\n\n红军代表康拉德·克内希发言：\n\n——由于红军对乌萨斯情况不熟悉，希望得到游击队帮助。提议将红军与游击队进行混编，建立联合指挥体系，红军指挥官加入游击队战斗序列。\n\n——学习乌萨斯语较快的战士可优先编入乌萨斯指挥官带领的队伍，其余战士可与霜星和泥岩带领的小队混编，降低语言隔阂带来的影响。\n\n——关于跟随红军行军的萨卡兹雇佣兵问题，康拉德希望游击队尊重他们的意愿，让雇佣兵自行选择是否接受整编。\n\n游击队代表博卓卡斯替发言：\n\n——对混编后的磨合阶段表达担忧，担忧整编导致战斗力下降，无法适应游击队高强度的战斗频率。\n\n——提议保留各自独立指挥体系。为确保共同作战效果，双方可互派顾问进行协同。红军需要的帮助可通过派顾问的方式解决。\n\n——关于雇佣兵问题，博卓卡斯替认可康拉德的提议。\n\n经过双方讨论和投票表决，会议达成共识："
 event_reu.27.a: "采取康拉德的方案。"
 event_reu.27.b: "采取博卓卡斯替的方案。"
 event_reu.28.t: "红军会议记录：1094-12-XH（其八）"
 event_reu.28.d: "记录员：尼曼亚尔\n\n会议主题：根据地后续发展问题\n\n游击组织代表塔露拉发言：\n\n——游击队已在本地建立起对外的物资交易渠道，可进一步扩大，通过与周边村子的交易解决物资问题。\n\n——可定期组织采伐、捕猎小队，获取木材、药材、兽肉和毛皮等物品，作为对外交易的物资，同时工匠制造的工具和武器也可用作交易。\n\n红军代表塔尔曼恩发言：\n\n——根据红军经验，根据地建设需自给自足，确保内部经济的稳定性和韧性。\n\n——红军行军携带了一批工业设备零件，条件允许可重新组装使用，虽代价较为高昂，但对于根据地长期发展非常重要。\n\n（塔露拉担忧工业设备的能源和隐蔽性问题）\n\n——能源问题可通过采掘裸露源石矿和劫掠敌人车队解决，同时承认隐蔽性和灵活性问题难以解决，需要其他人协助确保根据地安全。\n\n塔露拉补充：\n\n——建立自主生产能力同样可以为交易提供产品，值得考虑。但最终需要游击队内部讨论。\n\n经过讨论，游击队方面决定采取——"
 event_reu.28.a: "塔露拉的方案。"
 event_reu.28.b: "塔尔曼恩的方案。"
 event_reu.29.t: "会议纪要：109412萨卡兹红军-整合运动联合会议"
 event_reu.29.d: "1094年12月，我萨卡兹红军成功完成既定目标，抵达乌萨斯境内并与当地游击组织“整合运动”会合，并与其领导人就双方接下来的发展问题进行了讨论，并得到以下共识：\n\n一、萨卡兹红军与整合运动领导层重组为一个联合委员会，对红军与游击队在拉泽根据地的各项事宜进行管理和指导。\n\n二、萨卡兹红军尽最大限度支援整合运动发展拉泽根据地，协助整合运动对抗乌萨斯帝国当局。\n\n……\n\n八、考虑到整合运动的组织架构较为简单落后，基于整合运动领导人的提议，萨卡兹红军向整合运动提供指导思想、组织结构和斗争经验的指导，协助整合运动进行改组。\n\n双方一致认为，两个组织下一阶段的任务皆为与乌萨斯帝国当局展开斗争，解放更多被压迫者，发展自身力量，在敌人的包围中谋求生存。\n\n全泰拉的无产者们，联合起来！"
 event_reu.29.a: "将文件归档。"
 event_reu.30.t: "夜话"
 event_reu.30.d: "“我还以为今天晚上你不会来了呢。”听到门扉被推开的声音，正在缝补衣物的阿丽娜抬起头，在看到那一撮熟悉的白色卷发之后又重新开始了手中的工作。\n\n“萨卡兹红军的加入是一件麻烦事。”塔露拉到阿丽娜身旁的椅子上坐下，“康拉德和我们说了很多事情，他们的来意，他们的目的，还有他们的需求。”\n\n“你好像很憔悴，塔露拉。这件事不是应该让你高兴一些吗？”\n\n“康拉德说，萨卡兹红军的大部队仍在行军路上，而我们的粮食……不像能养活起他们的样子。”\n\n“真正让你担心的不是这个，塔露拉。”阿丽娜停下了手里的针线活，抬头直视着塔露拉的眼睛，“让我猜猜，也许真正让你烦恼的，是他们不全都是感染者？”\n\n塔露拉轻叹一声，“实际上，阿丽娜……”\n\n“康拉德·克内希小姐来找过我哦。”\n\n说话被打断了的塔露拉愣住了几秒钟，然后她脸上的惊讶逐渐变成了疑问。“但是你只是孩子们的老师……”\n\n“不要误会啦，塔露拉，康拉德小姐她只是想来看望我，看望那个被他们救下的幸运儿，也是让他们成功找到游击队的幸运儿。”阿丽娜给塔露拉送去一个微笑，低头继续着她的针线活，“但是，说到老师，康拉德小姐在知道我是老师之后，跟我说了这么一句话：\n\n“‘武装孩子们的头脑，比武装战士们的躯体更重要。’”说完这句话后，阿丽娜停下了手中的针线，将手中的衣物展开在塔露拉面前。\n\n“这是你今天被袭击的时候……穿的衣服。”\n\n“嗯，只是手臂那里被割坏了，所以很快就能缝好。你知道吗，塔露拉，那个为我疗伤的萨卡兹术士，她就是一个非感染者。”\n\n“你是说……”\n\n“塔露拉同学，还记得我和你说过的东西吗？感染了矿石病的是普通人，没有感染的也是普通人。”\n\n游击队的领袖此时就像又解决了一个难题的学生，她仰着头，她凝重的面庞上终于绽放一丝笑容。“谢谢你，阿丽娜。”\n\n“还没结束哦，塔露拉同学。”\n\n阿丽娜将缝好的衣服叠好收起，然后又坐回了塔露拉身边。\n\n“康拉德小姐也听我说了这句话，她说，我的想法很好，但是教给孩子们的应该再进行一些……嗯……小修改。我想，先教给你也无伤大雅。\n\n“普通人无论有没有感染矿石病，他们依然是普通人；贵族老爷们无论有没有感染矿石病，他们依然是贵族老爷。”\n\n“这好像不是‘小修改’。”塔露拉轻笑了一声，她感觉阿丽娜，或是康拉德，在向她传达一些不太一样的想法，“她告诉你为什么要这么修改了吗，阿丽娜？”\n\n“本节课到此结束！”阿丽娜笑着起身，转头去整理她的被子。\n\n“真狡猾啊，阿丽娜老师。”塔露拉摇摇头，也从椅子里站起来。\n\n“聪——明——！塔露拉同学，我教过你的哦。”埃拉菲亚脱下靴子，坐在了床边，“不过，我们明天可以一起去找康拉德小姐，问问她为什么这么修改。”\n\n“你准备好向大家介绍你了吗？毕竟，康拉德小姐是个大忙人，我们明天还有许多问题要讨论呢。”\n\n“为学生解答疑惑，是教师的责任。”"
 event_reu.30.a: "“晚安。”"
 event_reu.31.t: "引火之人（一）"
 event_reu.31.d: "当塔露拉与阿丽娜推开这座刚刚搭好几天的小木屋的门时，康拉德正坐在一张大桌子边上，和几个红军战士正说着什么。两人只好站在屋子的一角，安静地等那几位红军战士离开。\n\n许久，康拉德终于将事情交代清楚，然后她才看到一直在墙角等着的两个年轻人。她跳下桌子，招呼塔露拉与阿丽娜到桌边坐下，“我还准备去找你们呢，没想到你们先跑过来了。刚才让绘图员去准备附近的地图了，你们一定等久了吧。”康拉德笑着，拿起放在炉子上的水壶，倒了几杯滚烫的液体，摆在她和塔露拉阿丽娜面前。\n\n“我还不太会用乌萨斯的炉子。这是我煮的咖啡，莱塔尼亚属吕宋产的，煮的不怎么样，糟蹋了好东西，你们凑合着喝吧。”\n\n阿丽娜试探着舔了一口，然后被苦得差点“哕”了出来。她只好咂咂嘴，捧着散发着热量的咖啡杯，权当暖手。“康拉德小姐，我们来找您，是想问问，那天您来找我的时候，说的那些话是什么意思呢？”\n\n康拉德看着眼前的两名年轻人，她们尚未生出皱纹的脸上布满了尘土，显露出坚强和勇敢，同时又存在着一丝天真。康拉德看着她们，还有门外那个虽然窘迫却满溢着活力的游击队，许多熟悉的身影在她的脑海里浮现，林贡斯公社的幸存者，特里蒙和铸铁城的工人，雪绒花派的斗士……他们的心里都有着一团火，一团足以改变泰拉大地的火。康拉德清楚这意味着什么，她抿了一口咖啡。"
 event_reu.31.a: "“关于这些，我想先讲一个故事。”"
 event_reu.32.t: "引火之人（二）"
 event_reu.32.d: "“有一个小女孩，她的家人受够了卡兹戴尔的战乱和饥荒，决定逃离他们的家乡。在逃难的路上，她和家人由于雇佣兵的劫掠而走散了，她孤身一人，凭双脚走到了邻国莱塔尼亚。她无依无靠，一开始她只能靠乞讨为生，后来她看到一张报纸上的征兵启事，于是她决定碰碰运气，她‘借用’了报纸上看到的一个姓名参了军，后来她才知道，那是个男人的名字。\n\n“在莱塔尼亚军队里，她却认识了一群高卢复国主义者。她第一次知道了‘四皇战争’的真相，在那座被摧毁的‘世界之都’，曾经有一个人人平等，没有长官和老爷，感染者和非感染者并肩作战的林贡斯公社，而她最终与林贡斯城一起被摧毁。那些高卢人邀请她参与他们的事业，小女孩高兴地同意了。\n\n“当然，高卢人最后还是失败了。但是小女孩在这期间认识了她的老师，那个老绅士在研究着一个名为‘共产主义’的理论，小女孩从那位老人身上学到了很多东西。但是因为参加了高卢人的反叛，小女孩还是被迫离开了莱塔尼亚。她去到了新生的哥伦比亚，彼时那里正爆发了轰轰烈烈的‘花语运动’。\n\n“小女孩带着自己从老师那里学到的知识，去见了哥伦比亚的工人。她做着与在莱塔尼亚时一样的事，她和工人们一起罢工、暴动，和工厂主和老爷们斗。后来她引起了哥伦比亚政府的注意，小女孩被驱逐了。她的哥伦比亚朋友们告诉她，去旅行吧。\n\n“于是小女孩就去旅行了。她像小时候逃难时那样，用双脚走过泰拉大地上的各国。然后有一天，她的老师给她写信。那个老人的日子不多了。小女孩偷偷回到了莱塔尼亚，见到了她奄奄一息的老师。那个老绅士将自己的和前人的手稿都交给了小女孩，并嘱咐她，将‘共产主义’的理论延续下去。小女孩接受了，然后她急忙离开了还在通缉她的莱塔尼亚，没有出席老师的葬礼。\n\n“小女孩继续着旅行，最后，她回到了卡兹戴尔，在她的记忆里不存在的家乡。这个地方仍然在打仗，小女孩用她学到的知识，召集起了一些工人和佣兵，天真地试着结束卡兹戴尔的乱局，然后她就被现实打败了。”\n\n康拉德举起咖啡杯，又喝了一口，“后来，小女孩和她的战友们为了保存力量，决定离开卡兹戴尔，她们听说乌萨斯的冻原里有一支反抗军，于是她们便向北方走去了。”\n\n“说了这么多，”康拉德放下杯子，双手抱在胸前，“我想问的是，你们愿意像那些哥伦比亚人和萨卡兹们接纳了那个小女孩一样，接纳我传授给你们的知识吗，塔露拉？阿丽娜？顺便一提，那个小女孩可不是我。”"
 event_reu.32.a: "“毕竟，我已经老了。”"
 event_reu.33.t: "礼物"
 event_reu.33.d: "“您在吗，克林老先生，我是游击队的，有事找您。”\n\n伊拿村的村长克林一大早就被门外的敲门声吵醒，他揉着被眼屎粘住的眼睛，踱步到门边，正当他下意识要开门，他的儿子格鲁申拉住了他，“老爹，还给这些人开门做什么！”\n\n格鲁申压着声音，继续说着，“你忘了这些家伙之前向我们要了多少粮食吗？和这些叛匪混在一起，我们早晚要被官爷们抓走的！”\n\n克林皱起满是纹路的眉头，白了儿子一眼，“小子，游击队和我们要粮食的时候，至少好声好气地说话，换成纠察队，大伙身上都要留几个疤。”\n\n“所以我才劝你不要开门！”格鲁申再次拉住他的父亲，“我刚从窗子里看到了，这伙人都带着家伙什！看来他们也是没粮吃，要来抢了！”\n\n“老先生，您在家吗，我们给您带了礼物！”门外的人提高了声音。克林看了看自己的儿子，甩开他的手，“我先开门看看情况，如果真是来抢劫的，就当我们倒霉。”说完，老村长推开了木屋的房门。\n\n站在屋前的是一个白头发的姑娘，穿着一件比其他人好上不少的大衣，克林以前从来没见过这号人，她身后是几个游击队士兵，他们肩膀上扛着几个大袋子，像是武器的杆子从袋子的口中露出来。克林眯起眼睛，端详着眼前的姑娘，兴许她就是游击队的领头人。“大姑娘，什么事，来找我这个老头子？”\n\n塔露拉热情地笑着，拉住老克林的手，把他牵出了屋子，“老先生，前些日子我们缺粮，多亏了你们的及时帮助，不然我们的队伍，得饿死多少人啊！现在我们勉强挺过去了，所以想给您，应该说给村子里的大家，送点谢礼。”说完，她挥挥手，示意士兵们把肩上的袋子打开。\n\n老克林走上前去，袋子里确实装着一些“武器”，镰刀、铁锹、斧子，全是用好钢打的，比村子里用古法炼出来的东西好上太多了。克林不解的看看这些农具，再看看塔露拉，像是读懂了克林的疑惑，塔露拉笑着说道，“老先生，我们还是没解决口粮的问题，但是我们从官老爷那里抢到了一批好钢，就想着，打造一批农具送给乡亲们。您看这礼物合适吗？”\n\n老克林轻轻点了点头，回头从屋子里把一直在偷看的格鲁申叫了出来，“格鲁申，告诉乡亲们，来我们这里一趟。”"
 event_reu.33.a: "“咱们的朋友带了好东西过来。”"
 event_reu.34.t: "一封信"
 event_reu.34.d: "塔露拉小姐：\n\n自从我请假回家探亲大概已经过了一个多月了，在这期间，我发现乌萨斯的村民之间对我们感染者同胞的态度并没有之前我们以为的那么糟糕。\n\n我们之前一直都认为，沙皇的纠察队天天来捉拿感染者并且让他们服苦役，他们这样向平民百姓做宣传，当地的百姓也一定讨厌我们感染者，不要说那些城里出身的弟兄，连我这样土生土长的农家子弟都认为他们一定把我们视为瘟疫，唯恐避之不及。\n\n我自从感染矿石病被抓后，就在矿场服劳役，后来被我们的队伍解放，也就跟着游击队行军，整整四年没有回家看过。所以其实我也并没有亲眼见到普通百姓对于我们感染者的态度。\n\n这次返乡，家里双亲连同我的几个兄弟，除去最小一个夭折外，都还健在，只是身形更瘦些，他们看到我活着回来，都很欢喜。\n\n我原以为我是矿石病人，哪怕父母能不苛待我，同村的熟人也会避让我。\n\n然而他们并未怎么歧视我，我既未到无法劳动之病情，又在游击队学会了不少手艺，相熟人家有需要搭把手的劳作，也时常会求我帮助。\n\n听说最近粮食价格邪乎的很，无论丰年荒年都便宜的过分，乌萨斯帝国的课税也越发的紧，我问邻居他们明知道我是感染者为什么还肯让我帮忙，邻居的意思大概是，矿石病感染了几年内也未必会死，如若交不上税款，指不定土地就被收走，那到时候连饭都吃不上，搞不好死的比矿石病人更快。\n\n我想，尽管没有染病，我的乡亲们也是足够可怜的人了。"
 event_reu.34.a: "伊·马科夫斯基转记自谢·康斯坦丁诺维奇口述"
 event_reu.35.t: "为什么要组织农民抗税运动？"
 event_reu.35.d: "乌萨斯当局对东达利亚冻土的统治方式和对西乌萨斯的方式截然不同，沙皇政府并不会在这里派遣官员，组织一个政府，而是通过向他们效忠的军阀间接统治这里。习惯上只有那些最不受欢迎的官员才会被派来和这里的军阀进行接触。这里的贵族和军阀们也只负责向沙皇提供炮灰和一些微薄的税赋。\n\n沙皇就像是瞎子和聋子，他和他的整个朝廷对东达利亚的冻土荒原发生了什么既不关心，也不在意，到了现在这种态度更是已经达到有史以来的巅峰。\n\n乌萨斯当局根本无法管理东达利亚地区，实际上东达利亚军阀之间已经直接依靠发动战争来满足自己的贪婪胃口。\n\n在旷日持久的战争中，各个军阀都加大了对下属农村的剥削力度，臭名昭著的感染者纠察队被迅速扩充起来，因为他们不仅要抓捕感染者作为矿场劳工剥削，还要通过武装抢劫的方式榨干这些农村的每一滴油水，传统的包税制至少在我们现在的游击区宣告了终结。\n\n由于以上的原因，在我们所处游击区的乡土社会同时出现了以下三种现象。\n\nA.	维系乡土社会的教法、习惯法等不成文规章的执行迅速严酷起来，这一切全因为地方农民的正常生产生活已经遭到严重破坏，无法维持正常的生产生活秩序。\n\nB.富农、地主、贵族团体掌握了越来越多的农业资源，对畜力、水力和其他农业资源的垄断，导致阶级分化大大加剧，阶级矛盾大大激化\n\nC.	由于感染者纠察队转为对于人口、财物的无差别劫掠，由于外部输入的对感染者差别对待转变为对无差别的抢劫，并且部分地区产生了严重的人力空缺，原本农村地区极其激烈的反感染者情绪稍微的出现了松动。"
 event_reu.35.a: "“面对这种局面，我们应该怎么做？”"
 event_reu.36.t: "农民抗税运动工作原则"
 event_reu.36.d: "为了应对这种局面，争取到农村农民尤其是贫农和自耕农的支持，现在游击队上下应该按照以下的原则协调对农村的事务。\n\n第一章 总则\n\n第一条 反对各个军阀对农村、农民的抢劫行为，降低税务和劳役负担或为其支付适当回报，以赢得农村的支持，为游击队的进一步行动做物质准备。\n\n第二章 反对不合理的赋税\n\n第二条 反对军阀当局对农村的过量赋税，向农民表示我们不仅反对对农村进行劫掠，并且会与纠察队等走狗团体进行坚决斗争。对控制区农村的税收应当在合理范围内，应当向农民提前约定收取赋税的比例。\n\n第三条 徭役者应当发给物资或者以其他优待进行补偿，例如允许其借用工作队之畜力完成农业生产活动。其余优待补偿应视当地情况而定。\n\n第三章 打击富农、地主贵族等对水源、畜力、土地的垄断\n\n第四条 没收富农，地主、贵族占有的土地，除去满足正常生活的部分之外的土地之外，任何地主、富农、贵族、宗教组织占有的土地都应当平均分配给村落中的贫农、自耕农，保证每人占有的土地大体相等\n\n第五条 不承认任何河流、森林资源的私有权利，任何宣称对林区及其内各种资源；河流及其内各种资源的私有权利都为非法，若有地方村民自治组织的允许，则允许农民适当取用林木与渔获资源，水资源分配则需该水源流域所有村落进行协商。\n\n第六条 没收富农，地主、贵族占有的畜力与农具，交由村民自治组织管理或者交由村民互助组进行管理……"
 event_reu.36.a: "摘自发给一线工作队员的小册子"
 event_reu.37.t: "公开辩论"
 event_reu.37.d: "“政策改变以后的效果是显著的，无地的农奴被吸收进了组织，而且我们在城里的同志们也说，工人们对我们的运动更感兴趣了……”\n\n“别扯这些有的没的！”杰米多夫·亚斯特林拍案而起，手指着刚才发言的尼基塔·勃鲁扎克斯基，“尼基塔，你回答我一个问题，你是不是感染者？”\n\n尼基塔·勃鲁扎克斯基一时语塞，亚斯特林立马乘胜追击，“你还记不记得你当初从哥萨茨一路逃到冻原上，最后是谁收留了你？不就是因为你是感染者吗！这一路上，你说的那些个工人、农民，有谁看你一眼了？”\n\n亚斯特林的观点引得不少人随声附和，坐在前排的塔露拉脸色变得难看了起来。看到这一幕，亚斯特林嘴角的笑容更加放纵了，他继续高声说道，“塔露拉起初召集整合运动的时候，对我们说的是什么，各位还记得吗？是了！‘感染者应对自己的身份感到骄傲’！但是你们看看，现在的整合运动，哪还有一点感染者的位置！”\n\n“混淆概念是吧，杰米多夫。”一个雪怪小队成员从角落站了起来，“我，格奥尔基·克瓦连科，是一个工人，也是一个感染者，你问问在场的各位，谁在感染矿石病之前，不是工人农民？即使是因为父母是感染者才染上的矿石病，那他们也一定是工人和农民的孩子！”\n\n会场里响起赞同的声音，克瓦连科于是趁势追击，“倒是你，杰米多夫，你这家伙一定不是在矿场里受苦的工人。你这种富家子，是不是把源石当糖果吞下去，才染的病啊？”\n\n“各位，都不要攻击各自的出身……”别谢罗斯基慢慢说着，“我觉得，让更多的人加入我们的事业，当然是好的。只有力量壮大了，皇帝和议会才会正眼瞧咱们，接受我们的诉求。”\n\n别谢罗斯基还想说下去，但是他感觉会场里的气氛已经不太对劲，就把刚到嘴边的话又咽了下去。他是个精明的人，情况不对时，他懂得及时收手。方才亚斯特林和克瓦连科用愤怒的眼神盯着他时，他还觉得自己的发言可以继续，但他看到塔露拉的眼神开始玩味起来时，别谢罗斯基住口了。这不是一个好的信号。"
 event_reu.37.a: "多数派们似乎在寻找猎物。"
 event_reu.38.t: "乌萨斯经典罐头"
 event_reu.38.d: "“您不是在开玩笑吧，竟然说这些个做康波特用的瓶子就是我们排的口粮罐头？”\n\n巴兰尼科夫指着面前几个足足和人脑袋差不多大的玻璃罐，不敢相信自己刚从营军需员那里听来的消息——这玩意就是划拨给他们连队用来测试的新口粮。\n\n在还是乌萨斯帝国的末流军官的时候，巴兰尼科夫不是没有吃过罐头食品，但在他的印象里，罐头应该指的是一种用马口铁或者锡做成的装着不明混合物的圆柱体。灰牲口们一般把这个圆柱体丢到炊事员正在烧的开水里，之后就把里面的不明物质混合着黑面包或者燕麦饭之类的东西滚进胃里——如果状况紧急的话可以省去加热一步，直接把里面的不明物质滚进胃里。\n\n当然，也不是没有用玻璃装的罐头食品——比如说大城市卖的一种所谓的康波特罐头。虽然他一贯认为只有没有母亲的人才会敢叫这些不明胶质康波特。\n\n莫非组织上是要我们今后把那种“康波特”当饭吃不成——本来还在想终于不用靠鱼干和咸菜把燕麦糊糊送进肚子里的副排长巴兰尼科夫同志一看到这些瓶子人就愣住了。\n\n“您没见过这样的罐头吗？”营军需官，那个总是自吹自己的鱼汤的家伙用一种奇怪的含笑眼神盯着巴兰尼科夫的脸。\n\n“没有，除了买果酱的时候。”\n\n“那玩意可不能算果酱……”军需官赶忙扯开话题，“咳咳，这玩意长成这样主要是因为我们现在比较缺生铁，而且卡兹戴尔同志们带来的生产线丢了抽气机，铁罐头里的空气总是弄不干净……你看，你也不想吃臭罐头对吧。正好我们拿下了拉泽的玻璃厂，干脆就用先造玻璃罐头了。你别不信，最早的罐头就是卡乌战争时期一个药房老板发明的，那时候的乌萨斯军队吃的就是玻璃罐头。”\n\n“也就是说……玻璃罐头是个乌萨斯的文化遗产？”\n\n“差不多吧。”"
 event_reu.38.a: "“但愿这玩意不会破掉。”"
 event_reu.39.t: "不要回头"
 event_reu.39.d: "打尤莉·安德罗波娃记事起，这个世界就充满了烟尘、血汗，和源石的碎屑。她出生在切尔诺伯格城外的感染者矿场，是家里的第二个孩子，她的父亲没等到她的妹妹出生的那一天，就因为一个卫兵喝多了酒，被一刀捅穿了胸腔。她的大哥在16岁时，因为矿坑坍塌被永远留在了下面。在尤莉16岁的时候，她和妹妹被切尔诺伯格城里的一个工厂主以极低的价格买走，从此和她们的母亲断了音讯。\n\n尤莉进了城后，被工厂主丢到了他的车间里。尤莉的工作是组装一些她从来没见过的电子元件，而她的妹妹则是在流水线的尾端贴标签。这项工作枯燥乏味，但远比在源石矿场的日子安全，因为要学习工作流程，尤莉和妹妹甚至学会了写字。工厂主会给她和妹妹东西吃，甚至会每三个月给她们一点工钱，可以让她们买一些属于自己的东西，比如一件御寒的大衣。尤莉和妹妹逐渐习惯了这样的生活，比起在感染者矿场，这里至少能看得到明天的太阳。\n\n这样的状况一直持续到两个星期以前。那天，尤莉在贫民窟的一家杂货店里买了一包火柴。火柴盒子里装着一张纸条，上面写着从切尔诺伯格到一个叫拉泽的小镇的路线，纸条的背面写道，加入这个叫“整合运动”的组织，为所有被压迫的人们争取自由，向乌萨斯帝国复仇。尤莉之前从来没想过什么“自由”和“复仇”，她觉得感染者这一辈子就该是这样的，她甚至感谢那个工厂主把她从矿场买出来。她没对任何人说这件事，直到两天前，尤莉的妹妹离她而去。她的矿石病恶化，源石结晶在她的喉咙里生长出来，她吃不进任何东西，最后被活活饿死在电子厂的宿舍里。工厂主帮尤莉处理了妹妹的后事，没让她花自己的钱。尤莉没有特别悲伤，她知道感染者总会有这么一天，但是她记得妹妹临终前，用被源石结晶割伤的喉咙，挤出来的那句话：我想妈妈。\n\n第二天，当工友们被监工叫醒，他们惊讶地发现，尤莉的床上除了一张纸片，什么都没有。那张纸片上画着从切尔诺伯格到一个小镇的路线，背面是尤莉的笔迹，写着一句话：我要为了他们活下去。"
 event_reu.39.a: "为了过去，她选择与过去诀别。"
 event_reu.40.t: "冰雪相融"
 event_reu.40.d: "W是随着萨卡兹红军进入拉泽的雇佣兵小队成员，进入拉泽后W和她的小队一直在罗奥尔斯克边区巡逻，直到今天萨卡兹红军与整合运动交接完毕，他们才与整合运动的换防部队进行交接。\n\nW北上以来头次能够睡个好觉，直到第二天她才被热闹声音吵醒。\n\n“嘁，这么吵的声音是不是不想让人睡觉了！”\n\n“伊内丝？”连衣服都没有穿整齐的W打开门，看到了一位老熟人\n\n伊内丝面带微笑：“怎么？我好心的过来叫你起床，你是不是不太乐意了？”\n\n“你这么好心？我还以为你会突然反手握着匕首往我脖子上划上一刀呢！说吧，外面什么情况？”\n\n“这里在过伊万库帕拉节呢。”\n\n不一会，伊内丝带着W来到镇上，小商贩挤满了道路两旁，战士们都在把控着小镇上的秩序，四周村落的村民络绎不绝，他们特地从远方赶来参加活动，巨大的节日庆典舞台树就立在镇子中心，上面横挂着各种横幅。\n\n“原来让我们这两周在边境上加班加点干活是这个原因啊！”W不禁抱怨了一句。\n\n“毕竟这是乌萨斯这边的传统节日，不在这几天加强一下安保工作，芭芭雅嘎就会乘虚而入哦。”伊内丝比划了一下动作。\n\nW开口学了学：“叭叭……叭什么？”\n\n“看来你还不太懂乌萨斯这边习俗文化，那就在这几天好好放松，向他们学习一下吧。”\n\n“诶诶，别擅作主张啊，你这个臭山羊！”"
 event_reu.40.a: "萨卡兹人也在迅速适应着新的生活"
 event_reu.41.t: "一个人的故事（一）"
 event_reu.41.d: "在乌萨斯帝国最后的那些时日，从帝国东部的大城市切尔诺伯格出发，往北坐着时不时要停下加源石气加水的长途巴士花两天一夜沿着公路晃荡七八百里，在一个没啥名气的小镇子上让雪橇或者马车在往南的路上捎上大概二十里，会经过一个小小的无名村庄，贪得无厌的贵族老爷和灰皮的匪兵轮番光顾，这里没有电线，没有电影院，没有饭馆，只有一座兼做学校的小礼堂和它对面的一间小诊所。诊所里住着一个上了年纪的老大夫，年轻人都叫他米哈伊尔爷爷。\n\n米哈伊尔大夫太老了，他的尾巴和头顶像是没有人打理的茅草屋，剩下些稀疏的枯黄，他的眼睛和积灰的窗户一样暗淡无光，他的膝盖像是锈蚀的合页一样嘎吱作响。每当乌萨斯冬天的大地被积雪覆盖，他就感到自己和自己栖身的老诊所一样摇摇欲坠。\n\n他依稀记得在他还年富力强的时代，他是一个无忧无虑的军官，出身于贵族人家，生活在乌萨斯的荣誉和胜利之中——但他确实又和他的军官同伴们略有不同，在那身军官的制服底下，是一个多愁善感的人。他喜欢那些用古高卢语写就的文字——不是同僚们的附庸风雅，是真正的喜欢。那个日后被枪炮征服的民族用不是枪炮的方法先征服了他的心，他先读诗文，然后去读那些哲学家和历史学家，他一边读一边在心里问自己，什么是乌萨斯？\n\n他一开始的答案是沙皇和他的军队，要不是因为那个和他有过短暂情愫的侍女，他差点就要永远这样坚信下去了。还好，他没有，他偶然在流放犯的队伍里看到了那个女孩，在她被押往沙皇的矿井里做苦役之前的两三天，他和她短暂相处了一些时日，他只记得一件事，在最后的最后，那个农家出身的姑娘狠狠扇了他一耳光，“你看看我过的是些什么生活吧！”\n\n他记着这件事，试着去理解她的生活。\n\n他挤出自己的一些业余时间去扮演一个医生，乘着自己的车，用他不甚熟练的急救术去给那些他曾经眯着眼睛享受奉承的农民和工人诊断，渐渐地，他发现一件让他大为震动的事情——如果乌萨斯是沙皇和他的大军，那如果没有从地里种出来的这些粮食，从工匠手里制造出的武器，沙皇的大军就将不复存在，乌萨斯就将不复存在，而这些给他们提供粮食和武器的人正处在一种令人绝望的状态下，没有医药，吃不饱肚子，看不懂哪怕是圣经的只言片语，也大多数不懂算术。如果是刚成年的他，他会嘲笑这些人的愚蠢又赞美他们的纯质，但现在他明白，人生而平等"
 event_reu.41.a: "而乌萨斯帝国的全部辉煌的根基，不过在此而已。"
 event_reu.42.t: "一个人的故事（二）"
 event_reu.42.d: "他的巡诊还在继续，并且巡诊的时间逐步超过了他充当军官与贵族所要做的一切事务的时间之和，他越来越觉得自己过去的生活简直荒谬无耻。\n\n在初春里一个晴朗的日子，他来到那些家传的土地上，一片一片的向那些土地上为他家世代劳作的农民宣告，从今年开始，这些为他们的祖辈耕作的土地从今以后只属于他们自己，就像其他所有自由人一样，只需要缴纳沙皇的赋税而不需要向贵族负责。那片土地要卖要留、要种要荒、要种包菜还是种藜麦都完全可以，村边的森林他们也可以任意取作木材和燃料，接着他亲自去那些传下股份的工厂，把那些祖先留来让他不劳而获的股份发还给那些在噪音中生产商品的人——这么做无异于成为其他贵族社交圈里的众矢之的，但是他才不管那帮堕落的东西怎么想，他只想立刻远离这些装腔作势的鬼东西，去修补乌萨斯真正的根基。\n\n很快，乌萨斯的军队少了一个前途无量的年轻军官米哈伊尔少校，而圣骏堡附近的乡村与工厂里多出了一个行医米沙大夫。\n\n在行医生涯的大约第五个年头，他结识了一些和他当年有着差不多想法的军官——米沙大夫几乎只给穷苦人看病，军官们中的某一个在考察那些穷人的生活状况的时候听说了这个名字，于是他们就认识了。\n\n米沙医生偶尔会受邀参加这些人的沙龙，尽管他已经决定和堕落的军官生活绝缘，但行医的诊金却往往填不上药物的缺口，毕竟他所救治的那些病人的大多数要不是他就压根看不起病。在军官们的沙龙上，那些和他当年同僚几乎截然不同的理想主义者会给他一些资助来让他负担得起药物和医疗用品的开销。\n\n他渐渐地觉得那些高谈阔论的军官们和自己当年有些相似……然后就是大叛乱。\n\n米沙医生加入年轻军官们的队伍和沙皇的大军作战，在大叛乱失败后幸运的躲过了沙皇走狗的追捕，然后他追着自己的战友们的脚步，自我流放到了东达利亚的小小村庄。他原本带来了用来拉雪橇的雪橇犬和一匹老蹄兽，在没有下雪的时候他骑蹄兽出诊，下雪天他乘坐雪橇出诊。\n\n后来老蹄兽老死了也没留下后代，雪橇犬的孩子们倒是一代代生生不息，没下雪的时候他就步行出去看诊，下雪的时候就让那些饿得精瘦的雪橇犬拖着雪橇，所以有的病他夏天很难治，冬天却可以——主要是因为有的医疗器具和药都很重，他一个人带不走。\n\n他接生了这个小村庄的一整代人，在附近的村子和镇子里教出了几个年轻的医生——他们的手艺在大城市里估计只能算没出师，但在东达利亚的乡下，对治病救人懂得比自家老祖母多的人就足够叫大夫。\n\n回顾自己的一辈子，老大夫觉得……也做的足够了。尽管这些村里人还是出生，劳作，生孩子，最后被沉重的生活压垮再不醒来。一个老医生太卑微太弱小了，他至少尽了自己的全力去做。\n\n窗外是乌萨斯冬天的雪地，天上的太阳刺破乌云尽力洒下光明，身边的火炉烧的噼噼啪啪作响，没有来求诊的患者，今天也不出门巡诊。对一个老头来说是个适合休息的日子。\n\n“积雪、冻土、苦难、贫穷，东达利亚的一切已经这样运行了一千年。”\n\n“什么时候这一切才能宣告终结呢？”\n\n老人一边想着，一边望着冰封的大地，风刮过雪地，吹动树上的积雪和冰凌，露出针叶林里的一点绿色。"
 event_reu.42.a: "老医生睡着了。"
 event_reu.43.t: "生命的方程"
 event_reu.43.d: "“笃笃笃”\n\n“笃笃笃”\n\n把老医生从睡眠中唤醒的是一阵木门的敲击声，长年的行医生涯让他对这种声音极其敏感——这种声音一般和即将到来或行将离去的生命有关。\n\n“来了，来了”老人一边应和着，一边拖着有些僵硬的身体站起来尽力靠向门边，打开诊所的大门。\n\n“请问您是米哈伊尔先生吗？”立在门外的是一个戴着一顶当中缀着红五角星，裹着绿色大衣，眉毛和胡子都挂满了白霜的人，“我们是整合运动游击队，来找您有些事。”\n\n“我就是米哈伊尔，病人在哪里，是什么问题？”老人说着，转身去取挂在门边的白大褂。\n\n“嗯……老先生，我们不是为了一两个病人来的。”那个年轻人抹了一下脸上挂着的霜，“我们来是为了救更多的人。”\n\n“更多的人？”米哈伊尔听说过整合运动的存在，他们有时候会把一些感染者送来医治，近些日子他们也会送来一些生病的普通人，也会时不时把药品和一些物资辗转交给他。无论外面的传言和代表乌萨斯官方医治的喉舌们怎么说，医生觉得他们是好人。\n\n“是这样的，我们想要在我们控制中的那些农村建立医疗站，为他们提供健康保障……”那个红五星说道，他被冻得通红的脸在温暖的室内慢慢好转过来，“需要和您一样经验丰富的医生来教导我们的卫生员怎么治病。”。\n\n“慢着，你是说健康保障？”老大夫的眉头皱了起来，他叹口气，“你们这些年轻人不懂……人的健康这件事，大概有五分之一是医生决定的，剩下的五分之四则取决于生活环境与营养状况，我行医这么多年了，看的很清楚。你就是把圣骏堡的御医抓来，那些没有饭吃、生活在垃圾堆里、没有人照顾的人也是要死的……你知道你们在做什么事情吗？”\n\n出乎老人意料的，年轻人的脸上露出了一种自信的笑容。他盯着老人饱经沧桑的眼睛：“也就是说只要人人吃饱穿暖，生活在干净的地方，被人关注着，每个人都能更健康得多，是这样吗，老先生？”\n\n老米哈伊尔发誓，在四十多年前他在另一群人的身上见过一样的神情，他看见那样的热情在年轻战士眼里燃烧，他突然觉得眼睛有点酸。\n\n向前一步，年轻的手紧紧握住了老迈的手"
 event_reu.43.a: "“我们要做到的，我们保证”"
 event_reu.44.t: "初学者"
 event_reu.44.d: "面对着木屋的窗子，尼基塔·勃鲁扎克斯基整理了一下他的耳羽，调整了一下呼吸，然后推开了木屋旁的谷仓的门。在草堆的夹缝里摆放着桌子和椅子，这地方被整合运动借用，成了一间学校，而今天是这个学校的第一节课。\n\n“尼基塔，早上好，随便找个空位置坐下吧。我们还没开始上课。”阿丽娜坐在讲台后——说是讲台，其实也就是另一张小桌子——翻着一本书，“小心别碰倒老乡的草堆。”\n\n尼基塔点点头，小跑着找到最后一排的一张桌子，坐了下来。在他身边的是一个和他年龄相仿的乌萨斯女孩，本着基本的社交礼仪，尼基塔伸出了手。“你好，尼基塔·勃鲁扎克斯基。”\n\n“尤莉·安德罗波娃。”女孩也伸出了她的手，“你是黎博利？”\n\n“我从哥萨茨逃过来的，不说这些。你是为什么来这儿上课？”\n\n“我识字，所以他们就让我过来了。”尤莉的声音没有多少起伏，“你是这里的老兵吗。”\n\n“算是吧，我跟着塔露拉大姐头有四年了。但是我没有那些家伙资格老。”尼基塔偷偷指着坐在前排的几个人，“他们都是雪怪小队的，估计最近十年都在打仗。”\n\n“和我说说那个老师吧，她什么来头。”\n\n“阿丽娜吗，她一直和塔露拉大姐在一起，以前都只是给小孩子们教书，但是自从那些萨卡兹一来，她就开始帮大姐管事了。”\n\n“可能是秘书什么的吧。”尤莉自顾自说着，然后她看到尼基塔一脸的问号，于是补充道，“就是帮管事的管事。我在城里见过这种人。”\n\n尼基塔还想继续问关于城里的事，然后他就被阿丽娜清嗓子的声音打断了。\n\n“咳咳，各位同学，早上好，我是你们的老师，阿丽娜。可能有些老战士会认识我，我之前给孩子们上课，所以就会好奇，为什么我今天不去给孩子们讲课，而是和你们讲课呢？因为萨卡兹红军的朋友们告诉我们，战士们不应该只知道怎么战斗，还要知道为什么战斗。所以为了回答这个‘为什么战斗’的问题，我想先请大家做自我介绍……”"
 event_reu.44.a: "“先从最后一排的那位黎博利小伙子开始吧。”"
 event_reu.45.t: "书"
 event_reu.45.d: "“康拉德小姐，我想到一件重要的事……”\n\n“嗯？怎么了。”正在为几个人讲课的康拉德将书页折起，合上书，“阿丽娜，你想到什么事了。”\n\n“您说到，为了获得斗争的胜利，必须建立一个先锋组织，对吗？”阿丽娜停顿了一下，“并且，先锋组织的成员，都应该是充分领会，呃，共产主义的，先进分子……”\n\n“没错，萨卡兹红军就是按照这个原则组建的。”\n\n“可是，我们怎么办呢？”\n\n看着康拉德、塔露拉还有叶莲娜都疑惑地看着自己，阿丽娜清了清嗓子，赶忙补充道，“我的意思是，整合运动的战士们，又怎么像我们一样，学习什么是共产主义呢？我们多少认识字，塔露拉和您还会好几种语言，即使是这样，您讲学的时候还偶尔需要塔露拉帮您翻译。可是大部分整合运动战士们字都不识几个，更不用说读懂其他语言写的书了……”\n\n“还有书从哪来。”霜星补充道，“我也想了这个问题，即使我们能够把康拉德小姐整理的手稿翻译成乌萨斯文字，可是我们没有印刷的版式，红军带来的印刷机也没法派上用场。”\n\n“这件事情简单，只不过需要你们几位游击队的领袖们，多忙活一些。”康拉德笑着，“塔露拉会维多利亚语，不少手稿就是用维多利亚语写的，而我也在哥伦比亚待过一段时间，能够先把其他语言的文章翻译成维多利亚语，再让塔露拉把这些文章翻译成乌萨斯语就行了，中间让阿丽娜来润色，写成每个整合运动战士都能理解的样子。”\n\n“根据红军的经验，我们一般把文章节选几段既重要又简单易懂的部分，编写成一本小册子，分发给战士们。印刷的方式不用担心，柳德米拉不是在切尔诺伯格活动吗，我们可以让那里的地下组织弄一台印刷机，在城里印好了再运回来。”\n\n康拉德重新翻开书，“即使是建设先锋队，也不是一天就能建成的，我们需要一步步来。”"
 event_reu.45.a: "“而现在，我们还是继续上课吧。”"
 event_reu.46.t: "饭后闲谈"
 event_reu.46.d: "“亚历克斯老弟，你怎么看那些萨卡兹？”\n\n对于萨卡兹红军，亚历山大·别谢罗斯基很少向其他人说出他的想法，毕竟随着游击队的高层与康拉德的所谓“共产党”走得越来越近，别谢罗斯基明显地感到，自己这个曾经的游击队“金库管家”，正在被边缘化。因此，他越来越少地发表自己的观点，只是默默地观察时势，拿出游击队所需要的那一笔资金。\n\n不过如果一定要让他说几句，那他会说，萨卡兹红军到来以后，食物有点不够吃了。虽然以前的日子也不好过，游击队的吃食一般都是菜汤配硬得要命的大列巴，偶尔可以吃鱼汤或者肉汤，不过别谢罗斯基可以拿一点私藏的罐头来加加餐。但是红军到来以后呢，说是带来了几个生产罐头的设备，却把大伙拿到的新鲜食物都拿去造罐头了，原来储备就不多的大列巴和土豆倒是被这些人平分了下去。今天晚上吃的又是野菜汤配大列巴，但是大列巴的量比红军来之前少了一半，其他人也对此颇有微词，所以别谢罗斯基认为，自己抱怨这几句应该没问题。\n\n“是啊，我也这么觉得，明明是外人，却来抢我们的饭吃！”斯捷潘·卡肖夫一拍大腿，一股廉价香烟的味道从这只“黑羽鸦”的嘴里喷出来，让别谢罗斯基不自觉地皱起了眉头。\n\n卡肖夫看了看别谢罗斯基的脸，大咧咧地笑了起来，然后从自己的厚皮衣里掏出什么东西，塞到了别谢罗斯基手里，“一点心意，亚历克斯老弟，有件事情要和你谈谈。”\n\n别谢罗斯基看了一眼手上的东西，乌萨斯的高档巧克力，只有切尔诺伯格或者克缅哥罗德可以买得到。他识趣地把这东西揣进兜里，推了推眼镜，直视着旁边的那个佣兵头子，示意他说下去。\n\n卡肖夫那个蓄满了胡子的脸后堆起一丝微笑，他附到别谢罗斯基耳边，“我准备把塔露拉和她的那几个好朋友给绑了。你找个时间单独约她们见面，然后我们抓了她们作人质，爱国者和红军都不敢轻举妄动，然后我们就能带着人到别的地方去，再搞一个游击队，不用受这帮外来者的指指点点。”\n\n别谢罗斯基沉默了，他是对游击队有意见，但是他还没造反的胆子。他把目光从卡肖夫身上移开，“我可能需要，考虑考虑。”\n\n卡肖夫大声笑笑，用力地拍了一下别谢罗斯基的后背，“不用考虑了，老弟，你已经收下了我的小零食了。”然后他再次俯下身，用充满烟味的口气喷着别谢罗斯基的耳朵。\n\n“我可是知道你的钱都从哪来的，亚历克斯老弟，不要以为只有你一个人在克缅哥罗德有人。”"
 event_reu.46.a: "“毕竟巧克力也不是免费的。”"
 event_reu.47.t: "少数派报告"
 event_reu.47.d: "“操了，你看到这个通告了吗，别谢罗斯基？有没有搞错，塔露拉要把整合运动改组成什么‘布尔什维克党’？！”\n\n杰米多夫·亚斯特林风风火火地闯进亚历山大·别谢罗斯基的屋子，正在往壁炉里添柴的别谢罗斯基抄起一根柴火，敲了一下亚斯特林的脑袋，“能不能小声点。”\n\n“亚历克斯，我还是在塔露拉他们到东边以后才入伙的，但是你是老资格了吧？他们搞这一出，你知不知道？”亚斯特林尽力压低了声音，但是他激动的情绪导致他的尝试并不是很成功。\n\n“我知道有用吗？”别谢罗斯基白了一眼，把柴火往炉子里扔。新柴砸在已经烧成一团黑色的旧柴火上，爆出“噼里啪啦”的响声。“廷尔汀怎么说的。”\n\n“那个老东西？他说塔露拉干什么他都支持！”亚斯特林轻蔑地笑了一声，“他以为这个样子，那些家伙的小圈子就会重新为他敞开怀抱。”\n\n“布尔什维克党，多数派党，杰米，谁才是小圈子啊？”别谢罗斯基自嘲着，“我们就像这炉子底下的柴火，被新来的压在头上，还被搞得一身黑，动弹不得。”\n\n亚斯特林沉默了，他坐到别谢罗斯基身边，学着他一样盯着燃烧的炉火。在那一瞬间，他的脑子里飞快地过了一遍自己可能的结局，亚斯特林打了个寒战。\n\n“他们把整合运动改组成‘布尔什维克党’，是需要时间的，对吧。”\n\n别谢罗斯基突然的发话，把亚斯特林从消沉之中惊醒，“亚历克斯，你什么意思？”\n\n“其实在之前，卡肖夫找过我，说要给塔露拉找点麻烦。”别谢罗斯基叹了口气，“我当时没同意。不过现在，我想起这个讨厌的家伙来了。”"
 event_reu.47.a: "“在他们改组的这些日子里，给他们找找麻烦。”"
 event_reu.48.t: "意外事故"
 event_reu.48.d: "“不，不是这样的，我是冤枉的！不能弑君者说什么你们就信什么啊！”\n\n一块包装精美的巧克力被扔到跪在地上的斯捷潘·卡肖夫面前，柳德米拉走到他的身边，给了他一巴掌。“认识这个吗。”\n\n卡肖夫咽了一口唾沫，然后用颤抖的声音回答道：“我不知道啊。”\n\n柳德米拉叹了口气，“还在嘴硬。”挥挥手示意按着卡肖夫的士兵把他架到一边。卡肖夫的呼吸混乱了起来，因为他借着月光，看到在自己面前的，是游击队新做好的一个捕兽陷阱，里面立着好几根削得尖利无比的木杆子。\n\n“反正别谢罗斯基都招了。无妨，你说不说，你的结局都不会改变。”弑君者转过身，对着方才审问卡肖夫的那个黑影请示，“怎么处理。”\n\n“先勒死，然后再扔下去，我不希望他挣扎的血溅到我的衣服上，好不容易缝好的。”黑影走到了卡肖夫的身后，那个清冷的声音，卡肖夫感觉自己未曾听过。\n\n“然后明天早餐开始前，对所有人宣布，斯捷潘·安德烈耶维奇·卡肖夫在叛逃途中失足落入陷阱，当场丧命，在他的身上搜到了帝国政府的文书指示。之后马上控制住他的佣兵团成员，防止节外生枝。”\n\n“听见了吗，马上执行！”弑君者对手下士兵喊道，一个游击队员默默地解下他的鞋带，走到了卡肖夫的身后。\n\n“柳德米拉，还有一件事。”\n\n“您说。”\n\n“今晚的事，不要让塔露拉和叶莲娜知道。她们不喜欢脏活，虽然说实话，我也不喜欢。”"
 event_reu.48.a: "“明白了，阿丽娜。”"
 event_reu.49.t: "乌萨斯的原罪"
 event_reu.49.d: "孔德拉沙是一个传令兵，同时也是游击队驻扎在这个村子里的联络员之一。这个建在移动城市备用航线旁的小村庄没有名字，村民们都在依靠着贫瘠的土地和几公里外的森林生存，土地为他们产出粮食，森林为他们提供和城里人换钱的木材和皮草。在游击队的势力开始影响到这个村子以后，村民们的日子和往常并没有什么不同，依旧是打理那几片小小的耕地，隔一段时间组织一场森林里的游猎，唯一的变化，大概是他们已经大半年没有见到那个令人憎恶的税务官了。\n\n在和老百姓说话的时候，孔德拉沙并不喜欢戴着雪怪小队的兜帽，他不止一次因此被战友们打趣，说他是想和老乡们展示自己俊美的脸庞，期盼某个农家妹子对他一见钟情。孔德拉沙并不会去直接反驳，他也觉得自己有一些私心，但是他也会对其他人说，摘下兜帽和面罩是群众工作的态度，整合运动的战士们对老百姓没有什么要隐瞒的。\n\n“那个棚子底下这段时间就别站人了，我之后帮您问问，有没有人过来把棚子修修，或者重新搭一个……”\n\n当孔德拉沙安慰一个因为地基不稳而失去柴棚的大娘时，联络组的另一个成员撞开了门。“孔德拉沙……马上回营地！”\n\n孔德拉沙疑惑地看着这个撞进房子的术士，然后他就明白为什么门是被撞开的了。术士的左手拿着她自己的右臂，而肩膀上喷出的血已经在冰雪中缓慢凝固。\n\n“乌萨斯帝国的一个家伙袭击了村子！他看见我们的战士和村民一起打猎，然后就把他们都杀了……你马上回去和上级报告！不要管其他人！”\n\n那个术士用尽力气执行完最后一点战斗纪律，然后她转头看着惊魂未定的大娘，虚弱地挤出一个微笑，然后倒在了地上。\n\n“大娘，你快带邻居们藏起来。”孔德拉沙走到门边术士的身体旁，背起他放在门边的铳，“这群畜生看来不好对付。”\n\n“孩子，那你们……怎么办……”\n\n孔德拉沙带起了他的兜帽，风雪从缝隙中钻入他的发丝。"
 event_reu.49.a: "我们会宰了这群几把操的。"
 event_reu.50.t: "乌萨斯的至善"
 event_reu.50.d: "“我们是造了什么孽，一天之内五起内卫的目击报告。”\n\n“闭嘴，格雷戈里。专心保持阵型。”\n\n一组盾卫护送着一个步铳小队缓慢地向“路边村”推进，这是那个村子在档案中的备案名字。送来这个村子被袭击的消息的那个传令兵已经离开了人世。以往还算繁荣的村子现在寂静无声，数十只黑色羽兽在天空中盘旋，新鲜的血腥味从盔甲外渗入盾卫们的鼻腔，每个人的心里都在咒骂，每个人都闭口不言。\n\n推进到村子中央小小的广场时，盾卫们看见了矗立在广场中央的皇帝内卫，他身后的是一小队乌萨斯正规军，正在把他们从村子里搜集到的尸体堆叠在一起。一只黑色羽兽落在内卫的肩上，然后这只可怜的小家伙身体一僵，摔落在黑色的雪上。\n\n“……军团的盾卫也会自甘堕落。规劝你们，现在自尽。”皇帝内卫的面罩下传来不可名状的声响，他举起刀，指向身后搬运着尸块的士兵，再指向面前沉默的盾卫，“或者向第三集团军投降，或者我割下并带走你们的口鼻。”\n\n“转为掩护阵型，保护远程部队。”盾卫们的指挥官没有理会内卫的言语，只是冷冷地下达着命令，环形的阵型散开，在内卫的面前重组为一堵墙。\n\n“同作为乌萨斯的强大武力，盾卫却选择与我们对抗，与感染者为伍，愚昧至斯。”皇帝的内卫似乎叹了口气，他转过身，看着在广场上堆叠起的尸山，“这个村子，也是如此，包庇感染者，对抗乌萨斯的意志。这个时代的确不幸。”\n\n皇帝的内卫举起手里的刀，站在他身后的士兵敬了个礼，拿起放在手边的液化源石油桶，向堆积着的尸体上洒去。\n\n“丽达，我看见……那里还有人活着……”悄悄走到周边房屋里的步铳手在通讯里说着，“能不能先对那些士兵发动攻击……”\n\n“否决。不要冒进。”盾卫的指挥官依然在原地岿然不动，“我知道你的心里在想什么，但是忍住。”\n\n所有人都屏息等待着，等待皇帝内卫的下一个动作。内卫持刀的右手仍然悬在半空。\n\n然后那把刀突然向盾卫们碾过来。\n\n几颗子弹从四周的房舍中冲出，贯穿了那几个还在泼汽油的第三集团军士兵的脑子。几个人的尸体和内卫的刀刃同时落下。\n\n然后刀刃停在了半空中。“……焦灼的气味。”内卫收住了刀，目光越过面前的盾卫之墙，看着远处的一个人影。"
 event_reu.50.a: "“你想带走谁的什么——”"
 event_reu.51.t: "落雪，浸黑国土"
 event_reu.51.d: "“一个国家绝非善恶可以衡量。在这尺度上，什么都不值一提。”\n\n内卫的锋刃正在迫近，黑龙的火焰在不断消散。\n\n“帝国是你没法理解的东西，瓦伊凡。”\n\n又一轮射击，来自四方的子弹再一次被内卫盔甲中的气息所腐蚀，化为齑粉。\n\n“等等。瓦伊凡……不……你不会恰好……”皇帝内卫的进军第二次停住，他动摇了，这是他第一次动摇，“36……【密语】！”\n\n“……欺骗！”内卫停在原地，愣住的游击队员也停止了动作，所有事物都同他一起静止，只有天空开始飘落黑色的雪。\n\n一团火球砸向站在雪里的内卫，在他的盔甲上留下又一道灼烧痕迹。内卫看向火球来袭的方向，收起了他的刀。\n\n“现实比东达利亚冻原的风雪更冷，感染者。小心你们的身后吧，第一个对你们下手的，可能并不是你们的敌人。\n\n“也许你们不知道科西切是谁，但是你们知道公爵，也知道公爵的女儿会是下一任公爵。\n\n“你们身后的人并不是你们所看到的那样。”\n\n“说什么屁话呢，混账东西。”盾卫的指挥官骂了一句乌萨斯粗口，“你所看到的并不比我看到的多，没妈养的。”\n\n“告辞。塔露拉……我们期待你进一步的变化。你应该领导他们，你是合适的人。”内卫的面罩下似乎传出了笑声，他在盾卫的眼前转过身，缓步离开。\n\n“塔露拉！哈，哈……我和爸……还有雪怪小队……击退了一个……你的情况怎么样……”霜星的声音从后方传来，她身后跟着一群疲惫不堪的雪怪，和那个沉默寡言的老人，“这里发生什么了？为什么所有人都……”\n\n“叶莲娜，指挥队伍，搜寻还有没有幸存者……”塔露拉看着霜星，再看着之前护在她身前、现在却满脸怀疑和猜忌的脸庞，“我现在不适合继续当指挥员。”\n\n“塔露拉，他说的那些……”一个声音从盾卫队伍之中传来。\n\n“是真的。我的确曾是贵族培养的‘接班人’。我已经回答过了，还有问题吗？”\n\n“盾卫，收队！”丽达指挥官发出了收队的指令，她摘下头盔，瞪了一眼刚才发问的盾卫，“现在开始，谁也不能再问这样的傻逼问题！”\n\n然后她转向塔露拉，向这个消沉而迷茫的领袖敬了个礼。"
 event_reu.51.a: "“塔露拉，我认为你应该在全体游击队员面前，做自我批评。”"
 event_reu.52.t: "炬火，流落南境"
 event_reu.52.d: "“塔露拉，你有什么阴谋！”杰米多夫·亚斯特林一拍大腿，直接从座位上站了起来，他的追随者也纷纷起哄，矛头直指刚刚在大会上作完检讨的塔露拉。\n\n“亚斯特林，你冷静一点！”浮士德在自己的座位上喊着，“塔露拉既然在所有人面前做检讨，不就是说明她不打算藏着掖着吗！”\n\n亚斯特林鄙夷地看了一眼浮士德，“塔露拉派的小鬼，就不要帮这个未来的女公爵说话了！她一看就是瞒不住了，才被迫揭露这层身份的！”\n\n“杰米多夫·亚斯特林，你他妈的不要血口喷人！塔露拉遵守纪律作检讨，你他妈在大会上这样发言，你又算什么东西！”卡兹戴尔红军的塔尔曼恩也从椅子上站了起来，指着亚斯特林的鼻子骂道。红军内的激进派也跟着站起来，和亚斯特林的支持者们对峙。\n\n正当会场的秩序即将崩坏时，一声咳嗽让所有人安静了下来，争吵的、窃窃私语的、坐立不安的，都一起望向了发出咳嗽声的那个角落，那里矗立着一个温迪戈高大的身影。\n\n“在历史中获取虚无缥缈的轨迹，认定未来与历史相同，认定身份会决定明日一切，也是自大。”苍老厚重的声音从面罩下传来，“我愿为她担保。”\n\n“关于塔露拉的出身问题，我们可以之后再议。眼下还有一项更为紧急的事项。”坐在台上的康拉德·克内希扫视了一眼会场，看到刺头亚斯特林不情愿地坐下以后，她拿出了准备好的报告。\n\n“根据各个侦察小队发来的报告，乌萨斯第三集团军的大军正在向我们靠近。今天稍早时候的内卫袭击，只是敌人的一次试探。在北面的萨坎哈自治领控制区，第三集团军和自治领守备部队已经构筑了一条防线，目的是防止我们北上，而东面的第三集团军主力正在向我们进军，已经有一些游击队员和他们发生了战斗，面对这些装备精良、训练有素的敌人，我们的战士难以抵御他们的进攻，只能不断撤退。我们现在的唯一希望，是趁敌人的部队尚未抵达南部，沿湖向南转移，寻求在摆脱敌人追击后，再建立新的根据地。有人对此有疑惑吗？”\n\n康拉德深吸了一口气，再次看向台下的人们，“我知道，这代表我们需要离开这片土地，还有这片土地上的人们。对于红军战士们说，这还是我们的第二次远征，并且这一回我们没有确定的目的地。但是这是唯一的出路，因为革命不能在没有活人的情况下进行。”\n\n“而因为南下需要周密的资源调配和人员安排，我主张在此期间，若没有极特殊的情况，领导集体不应该进行变动。也就是说，塔露拉之前提出的无限期暂停工作的申请，暂时不予通过。对此项决定，同意的人请举手。”说完，康拉德举起了她的右手。"
 event_reu.52.a: "一阵沉默以后，人们抬起了他们的手。"
 event_reu.53.t: "恨"
 event_reu.53.d: "塔露拉的眉头紧锁着，其他人也是如此。干部团的一个工作组失踪了。这支小队被派去附近的一个村庄交换粮食，他们在失踪前还派通讯员传来了最后一次消息，他们在路上遇到了一群刚从一辆翻倒的押送车里逃出来的感染者，拿到粮食以后，他们打算把这些人带回来。\n\n“没妈养的，这下好了，还带人回来，现在他们自己都没回来。”柳德米拉咒骂着，她抑扬顿挫的骂声成了这片令人窒息的寂静中唯一悦耳的声响。塔露拉和阿丽娜带着几个干部去往工作组目的地的那个村子，她们希望能找到真相，弑君者知道后，也跟了过来。当那个村庄出现在远处时，塔露拉听到了村子里传出来的打斗声。她拔腿冲了过去。\n\n“畜生东西，伊万还那么信任你，我他妈的枪毙了你——”\n\n“叶夫盖尼，住手！你他妈在干什么！”\n\n那只拿着铳抵在农民脑门上的手僵在原处，叶夫盖尼·尤金采夫看到突然出现在他面前的塔露拉，脸上显露出惊愕的神情，“塔露拉，你——你怎么来了。”\n\n“给我把铳放下！你的武器为什么对着老百姓！”\n\n“老百姓？塔露拉，你管这些畜生叫老百姓？”叶夫盖尼脸上的肌肉颤抖着，他近乎发狂地挥舞着手上的铳，指着后面开始冒烟的村子，“我的队伍走到这个村子，想找个地方歇脚，他们把我们的战士们带到粮仓旁边，然后拿着刀剑就杀了上来！战士们根本没想到会被他们袭击，两个小战士还没拔出剑就被一刀砍死了，然后我们想跑进粮仓里找掩护，可是谁知道……”\n\n“老爷！你可要为我们作主啊！”那个被枪指着的农民突然放声大哭，面朝塔露拉跪了下去，也许是塔露拉披着的那件大衣，让他以为这是哪个贵族小姐了，“这伙感染者进了我们的村子，就开始烧杀抢掠啊！我的老婆都让他给打死了……”\n\n“放你妈的屁！塔露拉，你知道我在谷仓里看到什么吗？是他妈的十几具尸体！被烧得焦黑的尸体！我一眼就认出了里面有伊万，还有格列戈里，老家在圣骏堡的那个格列戈里医生！想都不用想，肯定是被这伙人弄死的！”\n\n塔露拉的脸沉了下来，她来这里的目的就是寻找工作组的踪迹，叶夫盖尼是老战士了，他不会骗她的。“给我带路，叶夫盖尼，以及马上叫你的部队停手。”"
 event_reu.53.a: "“以及把这个老家伙带上。”"
 event_reu.54.t: "火"
 event_reu.54.d: "谷仓里是一阵令人作呕的焦糊味，除去尸体的味道，最多的味道是麦秆灰烬的呛人味道，塔露拉最好奇的是，即使在这种程度的大火之后，这座粮仓的主体结构居然保持了完整，没有因此而倒塌，不然她连给这些战士们收尸的机会都没了。\n\n“都是憋死的。有些人的尸体都没有被火烧到多少。”塔露拉翻动着面前的一具尸体，尸体趴在地面上，死者的面容因此奇迹般地保存了下来。塔露拉认出这是伊万，这支工作组的组长，他在出发前是这么和中央汇报的：他的叔父一家住在这个村子，他们都是好人，肯定会给他们分一点食物。\n\n“这么说，你就是……”塔露拉回头看向那个瑟瑟发抖的老农民，他的眉眼和面前的这具尸体有几分相似。\n\n“塔露拉，他就是！我他妈问过了，就是这个家伙把伊万的队伍带进这个地方来的！”叶夫盖尼咆哮着，“他还说了，伊万最开始跑出来了，是他亲手拿镰刀把伊万砍死，再丢进来的！”\n\n“老爷，冤枉啊！”老农又一次“扑通”地跪下来，趴在地上哭号起来。\n\n“冤枉个屁的冤枉！你亲口说的你还想翻供！”叶夫盖尼走上前，把伏在地上号叫的老农揪起来，举起巴掌就准备往他脸上呼。\n\n“看着我。”塔露拉站起身，走到老农的面前，“你叫什么名字。”\n\n“米哈伊尔，老爷。米哈伊尔·普里索夫斯基。”\n\n“你的侄子，是你杀的吗。”\n\n“是是是，是我杀的。是我不长眼，不知道他们是老爷的佣兵。我只是不想和感染者扯上关系……”米哈伊尔一边说着，一边再次跪下，颤抖着请求着塔露拉开恩。塔露拉想笑，老米哈伊尔把她当作贵族老爷，把伊万和叶夫盖尼都当成她的佣兵，这个畏惧权力的小人，为了自保不惜谋害自己的侄子。\n\n“米哈伊尔，告诉我。”塔露拉蹲下，看着米哈伊尔因为恐惧而扭曲的脸，“你们这儿的领主是谁？”\n\n“是伊戈尔·季米诺夫，老爷！”老农颤抖着说出一个名字，“他住在更南方的庄园里，这个粮仓也是他带人修的，说是把他的粮食分一点给村里人……”\n\n“实际上是让你们帮他看家护院，对吧？”\n\n“没错，没错！老爷明察！我不是恶人啊，只是——万一和感染者扯上了关系，季米诺夫老爷不会让我们好过的呀！”\n\n“你说得没错，米哈伊尔。”塔露拉重新站起身，拍拍落在身上的灰尘——或者说是变成焦炭的尸体残烬，向谷仓外走去，“等会儿你给我们带路。”\n\n“老爷，您要去哪儿？”米哈伊尔颤颤巍巍地站起来，看着塔露拉离开的方向。"
 event_reu.54.a: "“当然是季米诺夫先生的宅子。”"
 event_reu.55.t: "原野"
 event_reu.55.d: "“同志们，乡亲们！我们今天在这里，公开审判这个吃我们血肉，还要把我们赶尽杀绝的，罪大恶极的刽子手，大地主大贵族伊戈尔·季米诺夫！”\n\n弗拉夏站在临时搭起来的木台子上，看着下面沉默不语的人群，努力掩饰着自己背后正在冒着冷汗的事实。他是最新一批学习班的积极分子，然后就被拉来这个小村子主持一场公审大会，而台下的这些家伙大部分都是前几天拿着刀枪棍棒袭击红军的农民。弗拉夏很怀疑这次公审的意义，他甚至不知道被绑在木桩上的那个贵族老爷和他，哪一个人更害怕。\n\n“伊戈尔·季米诺夫，几十年以来，剥削压迫我们农民，强占了大伙的土地，还逼着大伙给他上供……他还豢养了一伙佣兵，四处抓捕、拷打不愿意服从他的老百姓，活生生把人打死……”弗拉夏紧张的攥着手上的稿子，心里暗骂组织给他的安排，弗拉夏又不是这个村子的人，哪能背下来这个老东西犯了什么罪行。他偷偷抬眼看着台下的人群，依然死气沉沉，浑浊的眼睛里看不出他们的态度。\n\n“最可恨的是，在红军战士来这之后，他叫人把准备来交换粮食的红军战士骗走，把包括伤员和小孩子的一群人活活烧死在谷仓里！”弗拉夏继续念着，挥手让其他人把一个老农民带上台来，“老米哈伊尔可以作证！”\n\n米哈伊尔·普里索夫斯基颤颤巍巍地走上木台子，他的脸对着地面，生怕和绑在桩子上的季米诺夫有一点眼神交流。“就，就是季米诺夫老爷……花钱收买我，让我把我的侄子带到谷仓，把，把他们……烧死！”\n\n“米哈伊尔，你血口喷人！莫不是你自己决计，要谋害你的侄子，之后再来和我邀功？！我是在你来找我之后，才赏的你几个卢布！”沉默不语的季米诺夫忽地抬起头来，对着畏缩着的老米哈伊尔破口大骂道，“若不是你，今天老子怎么会有这种下场！”\n\n弗拉夏的脸黑了下来，他虽然年轻，分辨是非的能力还是有的，“米哈伊尔，那个家伙说的是真的吗？给我说他妈的真话！”\n\n米哈伊尔的腿彻底软了下来，扶着他的那个红军战士一时没反应过来，手一滑，直接让他“扑通”一下跪了下去。他的上下牙打着战，嘴角的胡子和嘴唇一起颤抖着，直到弗拉夏把他重新扶起来，他瘦削的脸都没能从苍白变回原来的蜡黄。\n\n“说！”\n\n米哈伊尔知道自己需要做出一个决定了。他用尽了全身仅剩的力气，发出一声嘶吼，虽然在旁人听来，这只是他沙哑喉咙里飘出的一丝喘息，“他在瞎说！”\n\n一团火焰在他的身后燃起，老米哈伊尔回头看去，季米诺夫的全身被火焰包裹着，这个老贵族的尊严和他的生命一起，随着火焰的灼烧和绝望的惨叫，一起飘向东达利亚的天上了。\n\n“伊万·普里索夫斯基，这个村子逃出去的一个感染者，光荣的红军战士，前几天被这个家伙烧死了。我今天代他还回来。”塔露拉不知道什么时候已经站在台上了，她的脸上没有一点感情波动，似乎只是在宣告着一只蝼蚁的死亡。\n\n“你们可能还不能理解，伊万是在为了什么而战斗。我们的时间太赶了，没法和你们解释。我只能告诉你们，这个家伙的田地和宅子，之后就没有主人了。你们有谁的东西在他那里的话，去拿回来吧。”\n\n一个声音从台下传来，他问了米哈伊尔也想问，但是没力气问出来的问题。“那老爷，你们去哪？”\n\n塔露拉的嘴角抽动了一下，然后她叹了口气，等到身后的那具尸体再也不发出尖叫之后，她用平常说话的音量，轻声说道。"
 event_reu.55.a: "“南方。”"
 event_reu.56.t: "与过去诀别"
 event_reu.56.d: "新瑟棱金斯克是一座小镇，它建立在被天灾毁灭的旧瑟棱金斯克西边几千米的地方。幸存者们大多都在天灾后离开了这里，而更多的人因为源石带来的利益选择从远方移居此地，康斯坦丁就是其中一员。在发现这个地方的工人和士兵都手头紧张以后，康斯坦丁从贝加尔延达谢斯克的亲戚那里借了一笔钱，在这个小镇开了一家当铺。这么多年过去了，康斯坦丁的当铺小有成就，他多造了一间库房，雇了两个伙计，其中一个是感染者，因为感染者只用给四分之一的工钱，对方还会对提供工作的人感恩戴德。自己和附近的纠察队也打点好了关系，根本不害怕因为雇佣了感染者被处罚。\n\n不过这几天，一支康斯坦丁从没见过的军队来到了新瑟棱金斯克，他们穿着土匪一般的衣服，但是没和城里任何人发生冲突。在经过一段时间的谨慎观望以后，康斯坦丁断定，这些人应该不是什么坏人，所以富有商业头脑的他立马向这伙人推销起他的当铺来，按他想的，都是当大头兵的，多多少少都有一些不良嗜好，而不良嗜好肯定要钱，当铺肯定能因此大赚一笔。出乎康斯坦丁意料的是，推销了几天，他的当铺没多出任何一个新顾客，甚至有几个之前三天两头拿家产来典当的老客都不见了踪影。除此之外，他雇来的那个感染者伙计，娜斯佳，也开始坐不住，好像是有胆跑到街上去了。想都不用想，康斯坦丁肯定是越来越郁闷了。\n\n这天，康斯坦丁还坐在屋子里吸着闷烟，突然那个正常人伙计走进他的办公室，跟他说来了个大单子，来人送来一件考究的贵族袍子，伙计自己估不出价值，只好来请康斯坦丁亲自去看。这康斯坦丁哪敢怠慢，贵族老爷来当铺必定是有什么难处，自己要是和贵族搭上了关系，即使对方是落魄贵族，那自己未来势必也多一条路子。这么想着，康斯坦丁小心翼翼地捏了捏自己嘴唇上弯弯的小胡子，走出了房门。\n\n来人是一个白色卷发的女子，身上穿着普通的棉布外套，但摆在台子上的那件大衣可不简单，康斯坦丁一眼就认出了上面的布料有炎国的丝绸和莱塔尼亚的兽绒。他赶忙让伙计把大衣展开，细细端详，这件大衣虽然有些破损和污渍，但是单是制作材料就能掩盖这些瑕疵。康斯坦丁的脑子飞速转着，在他从狠敲一笔和对贵族老爷诚实之中找到平衡点之后停了下来，然后康斯坦丁报出了一个数字。\n\n出乎意料的，那个头上长角的白发女士没有讨价还价，优雅的礼仪举止更让康斯坦丁断定，她一定是因为某些不可告人的原因而流亡的贵族。康斯坦丁是如此的高兴，以至于娜斯佳什么时候跟着那个白发女士走出了门，他也完全没意识到。\n\n“这么说，你想跟我们走？”塔露拉看着跟着她走出当铺的娜斯佳，把准备拿来买粮食的那一沓纸钞放进衣兜，“你的老板，没意见吗？”\n\n“呸呸，谁要管他，他经常拖我工钱，还只给我吃剩饭！”娜斯佳转头对当铺做出一个吐口水的动作，塔露拉忍不住笑出了声。\n\n“不过，我的族人都还在这里……我也有点担心他们……”\n\n塔露拉轻轻笑着，走上前去，俯身摸了摸这只小梦魇库兰塔的耳朵，在她耳边轻声说道：“别担心——”"
 event_reu.56.a: "“我们会回来的。”"
 event_reu.57.t: "游击队员"
 event_reu.57.d: "马兰游击支队的队员维连·乌米兰洛夫想到了帝国绝不会允许整合运动继续存在，但他没想到竟然来的如此迅速而猛烈。\n\n在第三集团军的围剿下，为了保存火种，游击队主力决定进行战略转移，但依然留下了一支队伍在当地继续运动，而留下的游击队正是维连所属的马兰支队。\n\n这一切都显得如此糟糕，在从窗口漏进的月光下，维连为他布满划痕的狙击铳上好了膛，此刻他正和另外两个队员潜伏在了村落中的屋子的二楼——游击队决定潜伏在了村落之中进行游击战——这里的村民毫不犹豫的接受了他们，哪怕可能的结果是自己被军队作为整合运动的支持者杀死。\n\n维连检查好了他的武器后，便警惕的从窗户向下看去，游击队得到消息，有一支部队今天要从这个村落经过。\n\n时间一分一秒的流逝，如此的寂静更能让人恐慌，但维连只是默默的握紧了手上的铳，楼外的路上传来了嘈杂的脚步，维连谨慎的探出头，便看见了那支部队和站在最前的军官。\n\n维连架上了他的铳瞄准了军官的喉咙，屏息凝神……\n\n“砰！”\n\n随着一声巨响，部队的末尾突然产生了骚动，维连明白这是攻击的信号，没有一丝犹豫便扣下了扳机，子弹破空而出，径直穿透了那名军官的胸膛。\n\n“杀啊！”\n\n军官的尸体倒下，而愤怒的战吼在每一栋屋子里响了起来，游击队们向着那群混乱的士兵们狂暴的发起了进攻，而维连也一件又一件的夺走他们的生命……\n\n这场战斗没有持续太久被埋伏的部队便被全数歼灭，维连和其他队员清点了自己能拿上的物资便离开了村落。"
 event_reu.57.a: "这只是，无数战斗中的小小的插曲而已"
 event_reu.58.t: "游击队员"
 event_reu.58.d: "马兰游击支队的队员维连·乌米兰洛夫正趴在雪坡上，将他布满磨损的狙击铳上好了膛，其他游击队的队员们也在他的旁边，所有人都注视着雪坡下的道路……\n\n在第三集团军接连不断的围剿下，游击队主力决定战略转移，但依然留下了一支游击队继续进行游击战，来阻碍乌萨斯帝国的部队接着深入。\n\n因为害怕波及连累周遭的平民，游击队决定在野外进行战斗，但这又同样导致了游击队没有真正安全的地方，所能拿到的补给除了少到可怜的粮食以外，包括弹药武器之类的补给也就只能通过游击活动从敌人那获取。\n\n虽然处境如此窘迫，但维连却没有任何失落的心境，因为他知道自己为何而战斗，也早就做好了为理想牺牲的准备。\n\n街道上是如此安静，时间在迅速的流逝，而维连一动不动，如果不是他还会眨眼，可能会被以为冻成了冰雕。\n\n就在这时，一阵急促的脚步声混杂着呵斥从道路一头传了过来。\n\n维连双手紧紧握住了他的铳，压低身姿，等待着发动进攻的信号…\n\n“砰！”\n\n随着源石技艺爆炸发生的巨响，进攻开始了，维连迅速的探出铳，大致瞄准后扣下了扳机，射穿了一名士兵，随后又拉动铳栓，如此的收割着生命。\n\n在如此的进攻下，部队的士气很快就崩溃了，在领队的军官也被子弹射穿喉咙时更是直接开始不顾一切的溃逃，但最终的结果依然是被全部歼灭。\n\n维连尽可能多的搜刮着子弹和其他的补给。在搜刮完毕后，跟上游击队迅速的撤离了。\n\n这片道路上再次变得寂静，只剩下地面上的尸体依然证明着发生的事。"
 event_reu.58.a: "这只不过是无数战斗中的小小插曲而已……"
 event_reu.59.t: "最后一剂"
 event_reu.59.d: "“老爷……那些感染者叛匪……已经来到城外了……”女佣战战兢兢地推开房门，塔季扬娜·韦德尔斯卡娅躺在乱七八糟的大床上，正用凶狠但无力的眼睛盯着她。\n\n“给我把所有的吗啡拿来。”韦德尔斯卡娅看着颤抖的女佣，低沉地嘶吼着。然而女佣似乎是被吓坏了，她只是愣在原地，一动不动，所以韦德尔斯卡娅提高了音量。\n\n“给老娘把吗啡拿来！听到了没有？”\n\n几分钟后，管家和女佣用托盘捧着针管和药瓶进了卧室，韦德尔斯卡娅抬起她那只枯槁的扎满针眼的手，一把抓住了这些瓶瓶罐罐。然后她继续用凶狠的眼光盯着下人们，意思是他们可以滚出房间了。\n\n在那一声轻柔却无法忽视的关门声响起后，韦德尔斯卡娅拿起了针管，像她过去几十年做的那样，把吗啡从瓶子里抽出来，然后将它注入自己的血管里。药物随着血液逐渐扩散，韦德尔斯卡娅感受到那股熟悉的头脑发麻的感觉，眼皮越来越沉重，她睡了下去。\n\n在梦里，她看到了另一个结局，她没有在四皇战争中被那枚炮弹削掉半个身子，也没有因此染上吗啡的瘾。她一路高升，从校官升为将官，最终领导着一支集团军。她在休假时，可以回到这一个囚禁了她后半生的庄园，在梦里，这里并不像现实那样，充斥着霉味和灰尘，乌萨斯东南部的暖阳从落地窗外照进来，外面是美丽的花园。在韦德尔斯卡娅的治理下，布拉戈维申斯克并不是一片混乱，萨卡兹的难民被挡在边境以外，淳朴的乌萨斯农民们在此地安居乐业，在节庆时还会聚集在她的公爵府邸，为她奉上礼品……\n\n然后，隆隆的炮声打破了宴会的欢愉，“赤匪”来了，他们冲进公爵府，砸碎了她的收藏，烧毁了她的花园，他们把韦德尔斯卡娅绑起来，抬到了绞刑架上。绞索渐渐收紧，韦德尔斯卡娅希望她像往常一样惊醒，但是这次没有，她依然在梦里，感受着自己的呼吸逐渐停止。"
 event_reu.59.a: "塔季扬娜·韦德尔斯卡娅，因吗啡注射过量去世。"
 event_reu.60.t: "会议后日程"
 event_reu.60.d: "“……亚历山大·列夫维奇·别谢罗斯基，反对党的路线，参与组建反党集团，与反动势力勾结，对我们的事业造成了极大损害。现政治局决定，将别谢罗斯基永久开除出党。”\n\n别谢罗斯基早就想过，他会有这么一天。自从他开始定期领取从克缅哥罗德寄过来的资金开始，他就知道自己会有这个结局。不过令别谢罗斯基感到意外的是，比起因为参与贩卖人口而被判处绞刑的杰米多夫·亚斯特林，自己居然还能留下一条命。\n\n别谢罗斯基把外套搁在肩上，走出了自己在布拉戈维申斯克的住所。南方的太阳比北方的更暖和，也更耀眼，所以别谢罗斯基并没有第一时间看清站在街边等他的人的脸。直到他听到那个熟悉的声音。\n\n“中午好，别谢罗斯基先生。”阿丽娜微笑着走上前来，“在这里住得怎么样？”\n\n别谢罗斯基看着眼前这个矮小的埃拉菲亚，冷笑一声，“在会上宣布把我开除出整合运动的人，现在来问我住得怎么样，您真是幽默，阿丽娜书记。”\n\n“你可是老资格了，别谢罗斯基，关心你一下，总可以吧？”阿丽娜眯起眼睛笑着，“况且，你只是被开除出党，又不是犯了像亚斯特林和列别尔那样的重罪。”说完，阿丽娜望向街道的尽头。\n\n顺着阿丽娜的视线看过去，别谢罗斯基觉得背后一凉。街道尽头的十字路口中央，立着一排绞刑架，围着架子的人群中传出一声高呼，“叛徒没有明天。”\n\n“我记得你不是感染者吧，所以某种意义上，你加入我们的动机还是很高尚的。”阿丽娜看着别谢罗斯基的脑门上滚下一颗豆大的汗珠，“所以，我还是想知道，你在布拉戈维申斯克住得怎么样呢？”\n\n“毕竟这里的气候，比起萨文科娃女公爵的那座移动城市，要温和不少呢。”"
 event_reu.60.a: "“要不要考虑继续在这儿继续住下去？”"
 event_reu.61.t: "一场即兴的演讲"
 event_reu.61.d: "“乡亲们，这里发生什么了！”\n\n整合运动宣传部组长带着他的组员在镇广场上隔开了两队人马：北上奔波而来的萨卡兹难民和当地的乌萨斯人。\n\n“组长！你作为乌萨斯人可要为我们说说话啊！”\n\n带头的乌萨斯人大声指着萨卡兹难民喊道：“这群带来不幸的种族要住在这里吗？！那我绝不允许！”\n\n萨卡兹也不甘示弱的吼道：“你什么意思！”\n\n“停下！乡亲们！”\n\n眼看一场争端要再次开始，组长分开了两人，随后在广场的中央开始了一场即兴的演说：\n\n“乡亲们，听我说，你们明明如此相似，为什么在互相争斗？\n\n我们进行的是艰苦的战斗。一场对那些压迫的人民的魔鬼们进行的战斗！我们用镰刀，矿镐和锤子把他们打落！\n\n所以乡亲们，他们害怕了，害怕到发抖！所以想从内部击垮我们！他们将我们分类，妄图让我们自相残杀！\n\n他们用种族，感染者，非感染者…还有很多很多的方式分裂我们，但同志们，我要告诉你们的是，这些根本就不重要！\n\n我们可能外貌，特征，习惯都不一样，但我们也是同样的，因为我们有一个共同的名字叫做无产阶级，而我们的敌人也有一个共同的名字，那就是统治阶级！\n\n我们不能中了那群离间我们的魔鬼的诡计！我们要团结起来，打破锁链，把属于我们的世界重新夺回来！”\n\n他这时拿起头顶的褶角软帽振臂一呼：\n\n“同志们！无产阶级们！联合起来！与他们斗争！”\n\n话音未落，台下的听众们便爆发出了无与伦比的喝彩，这场精彩的演说让即将爆发的争端消逝。"
 event_reu.61.a: "所有人都明白，真正的敌人到底是谁了"
 event_reu.62.t: "吞下死难者的苦……"
 event_reu.62.d: "“……那么，今天的议程就此结束，散会。”柳德米拉笔直地坐在主席台的第一排，塔露拉的声音从她的右侧传来。台下的代表们纷纷站起，从他们的坐席离开。柳德米拉看着离去的人群，放空了自己的大脑。\n\n一幕幕光景在柳德米拉的脑海中闪回，游击队聚在篝火旁唱着歌，父母带着她参加切尔诺伯格的一个又一个宴会，凯尔希与她在叙拉古的那个夜晚道别……然后她感觉到有人拍了拍她的肩膀，把她拉回了现实。是塔露拉。\n\n“柳德米拉，怎么发呆了。我们还有很多工作要做呢。”塔露拉轻轻地微笑着。就是她，刚刚在会议上宣布，让柳德米拉去组建一个情报机构，同时也是政治警察组织。也是她，在柳德米拉刚回到乌萨斯时，接纳了这只迷途的幼狼。柳德米拉抱歉地点点头，站起身，跟在塔露拉身后，离开了会场。\n\n“你的矿石病怎么样。嘴巴那里的感染，还影响你吃饭吗？”走出了那间由布拉戈维申斯克市政厅改造成的会场，塔露拉放慢了脚步，和柳德米拉肩并肩地走着，说着这样日常的话题，似乎一切和以前没什么不同。但是柳德米拉并没有这么认为，她停下了脚步。\n\n“塔露拉，我们到底要做什么？”柳德米拉低着头，攥紧了拳头，“我们的力量是比以前强大了，然后我们开始开这些繁琐的会议，穿起了烦人的制服，现在你告诉我，我要去组建一支秘密警察部队，就像感染者纠察队追捕我们那样吗？”\n\n柳德米拉的话音落下后许久，两个人都没有再说话。然后塔露拉转过身，向着原来的方向走去。“日子不一样了，柳德米拉。”\n\n“我们不再只是那个整日躲躲藏藏的游击队了，我们现在要去领导一个国家。你明白吗，柳德米拉，‘弑君者’。”塔露拉抬起头，看着临近正午的太阳，“如果你要杀死一个君王，那你首先应当做得比那个君王更好。”\n\n“你是政治保卫局的领导人，它将会成为下一个纠察队，还是成为无产者们的利剑与盾牌，决定权在你，而不在我。我只代表最高苏维埃——人民的意志。”塔露拉转过头，与柳德米拉四目相对。"
 event_reu.62.a: "“不过如果你觉得制服烦人，那就脱掉它吧。”"
 event_reu.63.t: "《为什么要实行农村民主？》"
 event_reu.63.d: "在党发布了开展农村民主建设工作的任务后，如预料一般，收到了很多干部提的意见，最多的一项就是：为什么我们要搞农村民主？要回答这个问题，就必须先回答，我们现在面临的农村状况是怎么样的？\n\n首先，同志们应当明确一个前提：乌萨斯是一个广大的国家，不同的地方，气候和土地的条件也是不同的，所以农业生产的形态也是不同的。在之前的拉泽老根据地，由于气候寒冷、土地贫瘠，农民依靠单纯的人力畜力耕种，大多都只能养活自己和家人，没有出现地主兼并其他农民土地的现象。在这种情况下，农村的阶级矛盾就简单地表现为，只能养活自己的自耕农，和通过收税和放高利贷来获取财富的贵族的矛盾。这也是为什么当初我们进行抗税斗争的原因。\n\n但是，自耕农拥有自己的生产资料，即土地和工具。虽然在表面的财富上，他们是贫困的，但是如果要将他们的土地收归公有，以便组织起现代的集约生产，这个时候他们就是保守的了。这就是小农阶级天然的保守性。因此，在之前的方针中，我们对自耕农一直是采取团结但保持距离的态度，关于农村民主的提法，在这个阶段确实被刻意忽视了。\n\n情况到了南方，就发生了变化。在布拉戈维申斯克和博罗努尔，气候更加温暖，土地也更加肥沃，而且布拉戈维申斯克还有民族问题这一特殊情况。在这里的农业生产，出现了通过财富兼并土地，将其他农民变为依附于土地的佃农的情况。也就是说，出现了很多依靠佃农和工人进行耕种，收取租佃的小地主，而在这些小地主之上，才是当地的贵族领主。在我军到来后，那些有贵族头衔的大地主都已经逃走或被关押，但是这些小地主仍然隐藏在农村，以普通农民自居，如果我们的干部们不了解情况，就很容易被他们所迷惑，从而忽视了农村实际上最广泛的阶级矛盾。\n\n而要解决这个矛盾，就需要依靠农村民主。不同于小农的保守性，这些佃农和劳工，除了劳动工具以外，实际上不掌握任何生产资料，完全成为了农业无产阶级，因此对于这一类农民，完全可以用组织工人民主的方式，将他们组织起来。详细地说，就是建立“农会”或农业公社……"
 event_reu.63.a: "将这本小册子下发基层干部。"
 event_reu.64.t: "基层扫盲工作队关于基层扫盲工作试点的工作报告"
 event_reu.64.d: "整合运动党中央：\n\n自从我们工作组被派驻试点基层扫盲工作以来，我们所驻扎的村庄附近已经起了可喜的变化，群众和我们部队的关系有了很大改善。\n\n在我们一开始派驻下乡的时候，因为我们部队感染者的比例比较大，很多老乡是不愿意靠近我们的，这点其他的同志也有在报告中提及。\n\n尽管他们的村庄的位置偏僻，但仍遭到乌萨斯帝国反动思想的荼毒，矿石病人被视为不敬上帝的惩罚，与矿石病人同吃同住同生活会导致传染。而且他们的村庄偏向自给自足，文化上天然的提防我们这些外乡人。\n\n两者作用之下。不消说我们队伍中的感染者同志，甚至我们中的非感染者同志也很难在他们中开展工作。\n\n经过一段时间的观察，我们尝试了新的工作方法，抓紧了两个工作重点。\n\n其一就是以农活好手为抓手打开农村局面。\n\n其二就是利用我们和当地小农的共同敌人——乌萨斯反动政府及其走狗的影响。\n\n在东达利亚地区，恶劣的自然环境产生了以小农为核心的自耕农农庄，这些农庄成员的贫富差距不大，农业好手们往往在当地拥有很高的威望。\n\n其次，尽管乌萨斯反动政府做不到直接在每个村子里驻扎上自己的行政机关，但是纠察队和包税人的压迫却一刻也没有减轻过，这里的阶级矛盾主要尖锐的表现在乌萨斯反动政府的走狗和小农之间。\n\n于是我们决定派出我们中的非感染者同志，先以行商的身份传播关于我们的游击队对抗包税人和纠察队的剥削的消息，又说有人找到了偏方，吃了这个偏方就可以和矿石病人同劳动同吃住而不被感染。\n\n我们派出了几队人假扮成行商传递消息之后，工作队大部才开拔进入村庄附近。\n\n尽管老乡们一开始还有些提防我们，但随着我们提供基础的医疗服务，帮助老乡们干农活，他们也愿意听我们讲的扫盲课了——我们的切入点是从基本的日常用字和文字计算开始。\n\n那些有着直接现实性的，和生产直接有关的知识和文化是最容易被接受和吸收的。\n\n随着这一个村子受到了我们工作队的好处，关于工作队的好名声也就随着几个临近自然村之间互通有无的小型贸易流传开来，到其他地方进行工作也方便了不少。现在我们最早入驻的村庄已经相当拥护我们的割据政权了。\n\n以上就是我们工作试点的简单报告，希望能早日在我们割据地区全面铺开基层扫盲工作，打开斗争局面。"
 event_reu.64.a: "——试点扫盲工作队"
 event_reu.65.t: "新手上路"
 event_reu.65.d: "尼基塔·勃鲁扎克斯基双手把着方向盘，小心翼翼地驾驶着装满土方的卡车，开在新铺的土路上。尼基塔压根就没有乌萨斯帝国的驾照，虽然在整合运动的控制区，应该不会有人查他的证件，但是他的驾驶技术也就成了最大的问题。会开卡车的战士给尼基塔上了几天速成课后，就让他开车上路了。\n\n在重建运输道路的任务发布下来以后，尼基塔所在的部队拿到了最重要的一项：重建从布拉戈维申斯克到罗斯格拉格的移动城市道路。移动城市道路除了作为移动城市固定的补给通路，更普遍的用途，是让两个聚落间的交通工具开得舒服一些。虽然理论上，被巨大的履带倾轧过去之后，任何地面都会变得平坦，但是布拉戈维申斯克城已经多年没有移动，而处于半不管状态下的布拉戈维申斯克，往日平坦的移动城市道路早已垮塌。如果让布拉戈维申斯克城把这段路再碾一遍，只会让路况再差上几倍，到时候别说卡车了，畜力车都走不了。\n\n尼基塔的部队干这个活已经有些时日了，从布拉戈维申斯克出发的一大段路已经能平稳行车了，尼基塔的任务就是从城外的小山丘上装土，然后穿过城市，把土方运到筑路队的工地，循环往复。虽然大家都说，只是开着车来回跑，运输队的任务比筑路队轻松多了，不过尼基塔可不这么认为，比起自己需要时刻紧绷着神经，观察驾驶的状况，筑路队只是在泥岩将军和其他几个石翼魔把土方扔到路上以后，走上去把土地平整一下就行了。\n\n不知不觉，尼基塔的车已经到达了目的地，正当他准备直接掉头，等石翼魔们把土方卸下就离开，导航员告诉他，筑路队都吃饭去了，让他把车停好，一起吃个饭再走。尼基塔暗骂一声，对他这种新手来说，还不如不停车。他胆战心惊地将卡车和其他人停在一起，擦了把汗，跳下了车。该死，得喝杯水平复一下心情。带着这样的想法，尼基塔走进了一个帐篷里。\n\n帐篷里，几个筑路队的战士们围在桌子旁，桌子中央摆着一锅热腾腾的红菜汤。看来是红菜汤配面包，伙食确实越来越好了。尼基塔走到一个白发的女战士身边，“同志，能帮我打一碗红菜汤吗。我是开车来送土方的。”\n\n“当然，要不你坐下来，吃点东西再回城里吧。”白发的萨卡兹女子起身打了一碗红菜汤，递到了尼基塔面前。尼基塔接过碗，吹了两口，还没想起说声谢谢，就坐到女战士的身边，吃了起来。这红菜汤确实好喝，还放了不少肉，伙食是真的越来越好了啊，尼基塔第二次想到。\n\n然后在当天晚上，尼基塔回到营地，就被其他战士们打趣道："
 event_reu.65.a: "“营长，你好大的面子啊，让泥岩将军给你打汤”！"
 event_reu.66.t: "老友来信"
 event_reu.66.d: "罗德岛一直是忙碌的，委托、研究、训练，还有那些必须完成的使命，具体到每一天每一小时的安排，就是成堆的文书工作和人事调配。阿米娅就是在这样的状态下，抱着一沓文件，推开了会客室的门。\n\n“暗索小姐，有什么新的合作组织信件吗？我要送去给博士了。”\n\n几分钟后，一沓厚厚的文件被摆在了博士的办公桌上，而在这一沓文件的顶端，是一个博士从未见过的信封，上面盖着一个令博士熟悉又陌生的标志。\n\n博士觉得自己曾在某个地方见过这个徽记，搜索了几段记忆后，博士找到了答案。是自己苏醒的那个时候，阿米娅把自己从石棺里拉出来，她身后站着的几个人……似乎身上就带着这样的标志。就像人类的DNA双螺旋，博士认为自己的脑子绝不会记错。\n\n但是为什么现在这个组织又会出现在自己眼前？以这种方式？带着疑惑，博士拆开了信。\n\n“罗德岛的博士，好久不见，近来可好？”\n\n这个在博士的记忆里，时而自称整合运动，时而自称布尔什维克党的组织，如今似乎已经在乌萨斯站稳了脚跟，正在与冻原上的军阀交战，而他们似乎对罗德岛有一些请求。\n\n“……我们早已了解到，贵公司同样致力于解决感染者的问题，这与我们的纲领不谋而合，因此我们想请贵公司在布拉戈维申斯克城设立办事处，并希望与代表商讨包括医疗合作、制药厂建设在内的进一步合作事宜。”\n\n读到这里，博士不禁自嘲地笑了，没想到自己还会被别人提醒，罗德岛是一个制药公司。关于商业的决策，博士一个人可做不了主。先继续读信吧。\n\n“……据我所知，贵司同时还与各国政商界保持着良好的关系，因此我们也想请贵司作为中间人，联络其他企业到我国投资，解决群众急需的衣物、日用品等生活物资的生产……”\n\n衣物可以试着联络0011？日用品可以给朝陇山发个信息……虽然还没正式确定合作，但博士发现自己已经在帮他们思考出路了。看来自己很想帮助这些冻原上的战士呢。博士又笑了，然后低头看向了最后的问候和落款。博士想起来了这个名字，在阿米娅把自己从石棺里拉出来后，第一个走上前与自己握手的整合运动干部就是她。"
 event_reu.66.a: "叶莲娜，霜星。"
 event_reu.67.t: "安东的新步枪"
 event_reu.67.d: "这是一片宽阔的操场，粗略搭建起来的讲台上站着几个红军战士，他们的身后是堆积起来的包装箱，身前则是一排排肃立的红军战士。\n\n“安东·布尔卡托夫斯基！”\n\n听见讲台上的同志念到了自己的名字，人群一个瘦削的青年猛地挺了挺胸，极其庄重地踏上了讲台，向着他敬了一个标准的军礼。\n\n“安东·布尔卡托夫斯基，您已经圆满完成了为期4星期的强化训练科目，无愧于原部队的尖子称号。”\n\n安东身前的同志向着安东还了一个标准的军礼，他的声音不大，但中气十足，整个操场都能听得一清二楚。在众目睽睽之下，安东感觉背后有些热热的，有些紧张不安——这是他第一次参加一次真正的授枪礼，如果这还不够让人紧张的话，作为训练尖子，安东不仅要第一位上来领枪，而且恐怕还要作为典型被单独讲评，他向来是个性格内向的小伙子。\n\n“从现在起，您，安东·布尔卡托夫斯基就是新组建的近卫步兵团的一员了。在这里，作为训练基地的指导员，我，谢尔盖·埃赫罗耶夫，要祝贺您，并且代表苏维埃和人民将这把自动步枪交给您。”\n\n站在埃赫罗耶夫身边的同志从包装箱里取出一支武器，抖掉上面的干草，双手交给了埃赫罗耶夫，阿赫罗梅耶夫再将这把武器双手递给安东。\n\n这支怪模怪样的枪和安东原先亲手用过的那些千奇百怪的枪都不一样，握在手里感觉和冲锋枪差不多，但那个弯刀一样的弹匣显示出它装填着某种比手枪子弹大，比步枪子弹小的弹药。难不成他要被分配去工兵部队，用冲锋枪和敌人死斗吗？\n\n仿佛是看出了他的疑惑，埃赫罗耶夫同志开了口：“这是九八型卡拉什尼科夫自动步枪，同志们的新产品，长八百八十毫米，装弹三十发，重约七乌磅。它能像冲锋枪一样扫射，又能向传统枪一样精确射击，它的性能理论上和列强们最新式的自动步枪差不多，像这样先进的自动武器，我们还是第一次生产。”\n\n“什么？”安东的心里已经惊叫起来。过去那些在乌萨斯冻土上跟着游击队，拎着四皇战争时期留下来的破枪东奔西跑的日子犹在眼前，如今居然这么快就能用上如此先进的枪支，使得他有一种突如其来的梦幻感。\n\n“然而，它还没有经历真正的战场考验，这是一种全新的武器。”\n\n“苏维埃和人民需要用宝贵的经验来改进这种武器，那么就要让最好的战士在实战中测试这种武器，这种武器越完善，它就能越有力的痛击白匪，这就是为什么要把这支武器授予您，安东·布尔卡托夫斯基。希望您能好好使用这支武器，这是苏维埃和人民的期望！”\n\n“是！保证完成任务！”安东站的更板正了些，坚决的敬了个礼。"
 event_reu.67.a: "士兵们的梦想之枪"
 event_reu.68.t: "重生的工厂"
 event_reu.68.d: "切尔诺伯格，一个如雷贯耳的名字，乌萨斯帝国的远东工业重镇，乌萨斯皇帝经略东方野心的起点，苏维埃乌萨斯的第一个大城市。\n\n在这座城市的一个正在施工的角落里，两个年轻的工人正在借着午餐时间闲聊。\n\n高个子的是伊万·茹科夫，矮个子的是瓦列里·捷格加廖夫，两个默默无闻的名字，切尔诺伯格第一枪械制造厂的工人，纺织工和锅炉工的子嗣。\n\n“万尼亚，你消息灵，你说我们的新厂房什么日子能盖好啊？”瓦列里抓着粗劣的黑面包，一边往嘴里送，一边问自己的工友，“那帮第三集团军的畜生东西，逃跑的时候一把火把我们的工厂烧成了这样，害得我们连着快一个月开不了工了。”\n\n“不知道，我们不正干着吗？要我说我们已经算是运气好的了，你又不是不知道，放在以前，要是厂子烧了，老爷们可不管我们死活，命令我们去折腾这破厂房，折腾到啥时候能开工啥时候才发下工钱，在此之前无论大伙家里有多揭不开锅，任你嘴唇说干了也不给你一个子儿，红军让我们清理维修自己以前的工厂，又还给我们一口饭吃，已经很不错了。”伊万喝了一口水壶里的水，“这狗日的世道，有口饭吃就不错啦，你没家没口的，在意这么多干嘛，反正东达利亚就没啥安生日子，咱们就过一天……”\n\n瓦列里摇了摇头，顾不上咽下嘴里的黑面包就打断了自己的朋友：“不，万尼亚，那不是我担心的事情，我的意思是说，照现在来看，我们的厂房啥时候能接着造枪造炮啊？”\n\n“造枪炮？你的意思是？”\n\n“啥时候我们能够再造枪炮交给红军，让他们狠狠地揍那帮不把我们当人看的老爷。”瓦列里看着自己的朋友，眉头都皱了起来，“你也看到了，这些红军和之前城里的老爷们不一样，他们愿意把穷人——我们这样的人当人看。”\n\n“是啊，帮我们灭火，不小偷小摸，不会喝的像是酒桶一样，也不把我们当做流水线上的机器看。确实是前所未有的好人啊。”\n\n“这就是为什么我盼着开工的原因了，万尼亚。”瓦列里叹了口气，把黑面包放到一旁，“你没看到吗，他们的很多士兵还拿着老旧的铳械，你到过他们摆弄过几次大炮？他们都是好人，可没有趁手的家伙……万一……万一他们要是守不住切尔诺伯格了怎么办？”\n\n高个子的伊万沉默了。\n\n过了一会儿，他站了起来。"
 event_reu.68.a: "“你说得对。我们的工厂确实越早修好越好。”"
 event_reu.69.t: "无人期待的剧目"
 event_reu.69.d: "霍尔奎克是乌萨斯最东端的大型移动城市，在以前，整合运动连靠近如此规模的城市都是禁忌，更遑论入城。但就在今天，整合运动的先锋部队在霍尔奎克市民的夹道欢迎中，从城市的入口一路行军至市政厅，将乌萨斯帝国的旗帜在全城人的面前烧毁，将整合运动的红旗在《革命颂》的歌声中升起。\n\n但塔露拉对这些仪式性的东西兴趣不大，她还有更要紧的事。\n\n“这些问题的答案，你们或许并不能在任何课本上找到。”\n\n乌萨斯国立远东大学的教学秩序并未受到政权交接的影响，虽然一部分腐败的学校行政官僚早已卷钱跑路，但大部分老师仍然自愿留在校园内，继续他们的工作。\n\n“当一个念头徘徊得足够久，就将它写下来。我乐于看见你们的观点。”\n\n塔露拉并没有走进教室，她的肖像在多日之前便已在霍尔奎克城的所有媒体上流传，她踏入教室势必会引起一阵骚动。\n\n“好了，这堂课该结束了。在下一次铃声响起之前，享受你们短暂的自由吧。”\n\n在大学生们纷纷从教室里涌出的时候，塔露拉走了进去。\n\n“你有什么疑问吗，同学？”\n\n“我找到你了。”斗士塔露拉走上讲台。\n\n“我还以为能更早见到你——”骏鹰老师卡谢娜的表情依旧如往常一般冷峻而高傲，但她的眼眸中闪过一丝惊慌，“——塔露拉。”"
 event_reu.69.a: "“这名字还是这么直白浅显啊，科西切。”"
 event_reu.70.t: "远方"
 event_reu.70.d: "“失败？我从来不认为一次失败便是结束。”卡谢娜，或者说是科西切，嘴角勾起一丝弧度。\n\n“那个埃拉菲亚压制住了科西切，那个萨卡兹把他从你的身上驱除，整合运动并没有在冻原里湮灭，反而变得越来越强大。\n\n“但科西切的计划也一样。他已经等来了他想要的那场足以立刻改变乌萨斯的战争。乌萨斯正在步上科西切为她设定的轨道。\n\n“战争正在发生。贵族之间的猜忌已经演化为铁与血的冲突，圣骏堡的议会正在变得越来越分裂，人们的意志也在一场又一场冲突中碰撞出新的火花。\n\n“而我，我会站在最富有活力的土壤上，尽我所能地播撒种子。我将引导……或者说促成这些变革的发生。\n\n“塔露拉，你就是我，我也是你。我们想要的，都是乌萨斯仍能在我们掌心迸出星火。\n\n“这场火……早晚会点燃整个乌萨斯。不，不仅乌萨斯。维多利亚、莱塔尼亚……都会被卷进来。\n\n“大火过后，这片土地会变得更加繁荣，还是迎来毁灭？\n\n“乌萨斯走过了自己的第一个千年——而我会令它走向第二个，第三个。这才是黑蛇存在的意义。\n\n“黑蛇不死，不是因为我有着自我存续的意志，而是因为乌萨斯必须活下去。”"
 event_reu.70.a: "“塔露拉，看一看吧，看看我说的这些话是不是都发自真心。”"
 event_reu.71.t: "星火"
 event_reu.71.d: "“不必了。”塔露拉同样报以轻笑。\n\n“那你还想着在这里杀死我吗？在一座自己控制的城市里杀人，显然不需要承担什么罪名。”\n\n“不要误会了，科西切，我只是觉得你可笑。我不再是那个以为杀了你就能解决问题的塔露拉。\n\n“‘人类的历史，就是斗争史。’这句话是你教给我的。类似的话，那个萨卡兹也对我说过，不过她增加了一个词。\n\n“‘人类的历史，就是阶级斗争史。’”塔露拉向前走出一步，她看到骏鹰教师的五官第一次排列出恐惧的组合。\n\n“让乌萨斯活下去并不需要黑蛇，让一个落后、腐朽、反动的乌萨斯活下去才需要黑蛇。这个乌萨斯是行将灭亡的旧贵族的，是眼中只有金钱的商人们的，是享受了一千年特权的皇室的，是你的，唯独不是我们的。\n\n“你口中的变革，只不过是为这个乌萨斯换上另一件衣裳。\n\n“不死的恶神终将死去。可杀死你的，不会是我。\n\n“人民会杀死你，你所维护的那个乌萨斯会与你同葬。\n\n“你至今仍以为自己能操弄人们的意志，而我们会证明给你看，终有一天，觉醒的人们会将所有统治者狠狠地踩在脚下，在那以后，乌萨斯将再无黑蛇。”"
 event_reu.71.a: "斗士转身离开。"
 event_reu.72.t: "传单"
 event_reu.72.d: "“……探索东达利亚的奇观——贝加尔湖，领略这个泰拉最深淡水湖的奥妙，并在湖畔渔村体验异域风情美食……”\n\n“有哪个发癫的人会去乌萨斯旅游啊，谁都知道他们那里在打仗，都不知道是谁在打谁。”出租车司机大大咧咧地侃着，他说话时挥舞的手让人担心起行车的安全，“这张传单啊，不知道是哪个乘客落在我车上，我都觉得是故意的，不过留着还能提供一点娱乐，就留着咯。”\n\n“其实，我有点想去。”乘客继续盯着传单，一字一句地念着上面的文字，“……您的安全由苏维埃红军保障，他们会让前线的炮火远离您的旅行目的地……”\n\n“哎哟，靓女，那你真的是胆子够大。其实吧，我也看过这张传单，不得不说，这个旅行项目有个优点，便宜。但是要是为了省这点钱，去这种还在打仗的地方，那我还不如在龙门随便找个地方钓鱼。”\n\n乘客从后视镜里瞟了一眼司机，然后又看向窗外，“唉，毕竟上班累了，也想换个地方散散心，贝加尔湖这种自然风光还是很吸引人的。”\n\n“哦哟，那老板你有品味，我这种俗人就看不来这种自然风景，我觉得山山水水都一样，看不明白。”司机猛地一踩刹车，看来前面又堵车了，“叼你老母，又有个冚家铲加塞。话说回来，老板你是做什么工作的。”\n\n“以前在近卫局上班，不过受过伤，退了。”乘客看着对向车道畅通无阻的车流，不自觉地把玩起自己的红色长发来，“不提这种旧事。”\n\n“怪不得你敢去乌萨斯啊，老板！”司机不自觉地挺起腰坐直，“原来是近卫局的长官，那你肯定不担心安全问题了，搞不好你还可以和那里的大兵打上几场喔！”"
 event_reu.72.a: "“这还真说不准。”九不自觉地笑出声来。"
 event_reu.73.t: "行必要之恶……"
 event_reu.73.d: "“怎么了，塔露拉，有什么事要到你家里说？”柳德米拉疑惑地跟着塔露拉进了屋子，“我今天下午还要指导尤莉去培训特工……”\n\n“非正式会谈。机密。”弑君者一进门，就看到阿丽娜把刚煮开的瘤兽奶倒进一个个杯子里，然后她将奶壶放下，坐到了屋子里唯二的一张椅子上，严肃地盯着柳德米拉。\n\n“我长话短说。”塔露拉把杯子递给柳德米拉，自己坐到另一张椅子上。“我之前为我隐瞒自己的贵族出身做过检讨，但我还是留了一些东西没说。”\n\n弑君者捧着瘤奶，心想着塔露拉这家伙还真是贴心，担心她的手没地方放，特意给了自己一个烫手杯子。苏维埃政权的两个权力巅峰和自己就在这一间令人安心的小屋里，柳德米拉明白，之后的谈话内容绝对不会让人安心。\n\n“科西切，那条老黑蛇，在我的身体里留下了一个源石技艺术式，简单来说，如果我的精神不稳定，他就会占据我的身体，然后以我的名义去执行他疯狂的计划。”塔露拉抿了一口热奶，咂咂嘴，“但我现在很难再感受到他的气息了，我姑且认为这个术式失效了。但这不是重点。”\n\n“科西切曾经说过，他对不止一个人施加过这个法术，也就是说，一旦他在我身上的计划失败，他还有很多的备用方案。”塔露拉说完，抬眼看了一眼柳德米拉的眼睛，眼神里带着一种明知故问的意味。\n\n“你要我去把他的替身都除掉。”\n\n“不完全是。”一直沉默的阿丽娜开口了，“我们希望你在政治保卫局下，建立一个机密部门，专门负责这一类……嗯……奇异现象的研究与应对。就比如，黑蛇这个术式的原理，还有北方那些不可言说的东西。”\n\n“这些，呃，可以说是‘超自然’的东西，不能让太多人知道，包括最高苏维埃。”塔露拉又喝了一口奶，“我建议——我是说，我命令，这个部门的存在必须是最高机密，所有和这个部门有关的东西都要严格筛查，从人员到器材、文件。”"
 event_reu.73.a: "“毕竟我们不知道自己在和什么战斗。”"
 event_reu.74.t: "不错的回忆"
 event_reu.74.d: "叶莲娜从口袋里摸出一颗辣椒糖，拧开它的包装，把那颗鲜红色的糖果扔进嘴里，然后听凭那片小小的包装纸被螺旋桨卷起的气流刮上天空。布拉戈维申斯克城今天迎来的客人来自那个制药公司，罗德岛，叶莲娜看着那台巨大飞行器的轰鸣声逐渐停息，一个男子带着略显疲惫的笑容，从舷梯走下，叶莲娜也同时踱步上前。\n\n“霜星小姐，你好，我是罗德岛干员，Guard。”来人面对霜星，扯掉了他的针织帽，露出头顶的菲林耳朵，行了个不算规范的脱帽礼，“如果之后我们能够敲定合作事宜，我应该就是罗德岛办事处的负责人了。”\n\n“很高兴见到你，Guard，手就不必握了。我的手太冷了。”叶莲娜微笑着，抬头打量着这台停泊在简陋小机场的飞行器，“罗德岛还有这样奇特的飞机吗？”\n\n“它吗，它是‘坏家伙’号，标准一些的说法应该是‘倾转旋翼机’。霜星小姐对它有兴趣吗。”\n\n“我是负责军事的，对这个漂亮的‘坏家伙’当然感兴趣。”叶莲娜轻声笑笑，“不过，这对贵公司来说是非卖品吧？”\n\n“应该是的，不过，它货舱里装的东西，对你们来说倒是免费送的。”Guard带着叶莲娜和随从走向机尾，“罗德岛新研制出了一款对冻伤的特效药，原料和配方都是你们提供给我们的，然后我们用更先进的设备弄了出来。今天运到这来的这些，是工厂批量生产出的第一批。当然，你们急需的矿石病抑制剂之类的东西也一起运过来了。”\n\n“是那个叫霜叶的小狐狸交给你们的吗，配方。”叶莲娜走进货舱，看着满舱画着罗德岛logo的箱子，“那个方子是我研究的。”\n\n“我们当然知道，所以我们才给这款药取了这个名字。”Guard打开一个箱子，把一管药膏拿出来，递到了叶莲娜手上。"
 event_reu.74.a: "“FrostNova冻伤特效药霜。”"
 event_reu.75.t: "“我们”"
 event_reu.75.d: "“每个人都把表填一下，用自己国家的语言就好，我们有专门的翻译人员。”雷德对着在帐篷外吵吵嚷嚷的人群用维多利亚语喊道，然后走回了那个窄小的帐篷里。作为会一门外语的前政府军士兵，雷德已经是党内不可多得的一个高材生了，所以他在没有作战任务的时候，就会被调派来迎接其他国家的志愿者。\n\n“你好……我不识字，请问我可以口述表上的内容吗？”一个瘦小的菲林女孩钻进帐篷里，“我是从维多利亚来的，我叫梅斯。”\n\n“可以，坐下吧。”雷德指了指摆在帐篷中间的椅子，这样的情况前些天也出现过，他已经见怪不怪了，“体检什么的等会你找个女战士带你去。首先是，战斗经验？”\n\n“呃……我没有战斗过，我只是……在一个整合运动的药厂里工作过。”\n\n“药厂？我没听说过我们在维多利亚有个药厂。梅斯小姐，我无意为难你，但是请你和我说实话。”\n\n“唉……好吧！我原先在一个私酒厂里工作，后来维多利亚的情况一天比一天差，酒厂倒闭了，我本来想逃跑……”梅斯说着，她的手紧紧抓着破旧的斗篷。\n\n“那有什么值得隐瞒的，一开始就老实说不就好了吗。”\n\n“你不懂！”梅斯突然大喊，把雷德和其他人吓了一跳，“后来……一群感染者跑到了废弃的酒厂里，他们说自己是整合运动，要征用酒厂的设备做些什么，然后带来这里给你们。”梅斯一边说着，一边开始抽泣起来，“但是后来，领主的巡逻队发现了他们，他们都死了，只有我逃跑了活了下来……之后我回去找他们，我只找到了一个草药的配方，和到这里的地图。”\n\n“我不是感染者，但是……这个止痛剂的配方，能给我换个整合运动的资格吗？听说，你们有一座移动城市，可以给我分一间房子吗？”梅斯的声音越来越小，逐渐只剩下抽泣，“我……我已经无处可去了。”\n\n帐篷里的空气沉默着，许久，雷德开口了，“梅斯小姐，你说的那个止痛药，你会做吗？”看到梅斯呆呆地点了点头后，他继续说道，“我会帮你联系一份制药厂的工作，希望你能尽力把那个止痛药做出来。至于你的住处，这些事不用太担心。”"
 event_reu.75.a: "“毕竟我们拥有的城市不止一座。”"
 event_reu.76.t: "集中营起义（一）"
 event_reu.76.d: "博罗努尔，远东最重要的矿业产地，也是最大的集中营所在地。圣骏堡的叛徒、万恶的政治犯，亦或是肮脏的感染者，都会被送到这儿来。他们在矿山之中无休止地劳作至死，驱动畸形的帝国缓缓运转。\n\n在来自军阀政府的重压之下，矿场与集中营的暴乱时有发生。然而，这些毫无组织性的小打小闹却无一成功，它们所能起到的惟一作用就是——招引纠察队的血腥镇压。\n\n苦难的悲歌仍在这片大地上演，绵延不断、无止无休。\n\n某天，一名新的政治犯在夜色之中到来。此人名为卢基·费奥多罗夫，据说是个出身圣骏堡的马佐夫主义危险分子，因为从事赤色思想的宣传活动才被帝国政府流放至此。\n\n这本该只是悲剧幕间的一个小小插曲——毕竟，人们风传的所谓“赤色党徒”也不过是又一个被放逐者而已。但是，集中营纠察队的军官却发现——随着时间推移，工人聚众的时间越来越长、频次越来越多，甚至是一小撮下级士兵也与他们聚在了一块。骚乱、示威、罢工、暴动，手执皮鞭的工头与大腹便便的军官不明就里，而管理工人的难度则直线攀升。\n\n最后，还是那群集中营管理处的将军们恨恨地得出了结论：\n\n“无须调查与审判，那个卢基必须当众处决！”\n\n于是，卢基便被纠察队五花大绑着拉到了广场中央，由集中营的首席军官亲自监督处刑。先前聚众滋事的工人们也都被皮鞭赶到广场，被强迫着观看这场处决。\n\n负责处刑的士兵手持统械稳稳地瞄准着卢基的头，首席军官则狞笑着注视这位被无数矿场工人尊为“不灭红星”的男人，期待着他在枪口之下流露出对于死亡的恐惧。然而，卢基却并未与此前被判处枪决的无数政治犯那般跪地求饶，而是挺直了腰杆，脸上毫无波澜。\n\n“子弹上膛！”首席军官大吼着，用长靴狠狠地跺着地面。\n\n卢基一旁的士兵熟练地为铳械装填子弹，但他们的双手却在微微颤抖。\n\n“行刑！”首席军官冷笑着喊道，这场闹剧是时候结束了。\n\n出乎所有人意料的是，那名士兵却如同被石化了一般。他们握着铳械的手颤抖着，迟迟不肯扣下扳机，而卢基则一脸云淡风轻，仿佛早已料到了这一切。\n\n“我说行刑！！”首席军官发了疯般的怒吼道，他紧握着双拳向那士兵作威胁状。\n\n士兵的脸上不禁显现出一丝痛苦之情，但他的手指已开始缓缓地向后拉动扳机。看来，那颗行刑的子弹马上就要自枪管旋转着飞射而出——\n\n——就在此刻，一声有力的呼喊打破了笼罩刑场的沉默。"
 event_reu.76.a: "“同志们！”"
 event_reu.77.t: "集中营起义（二）"
 event_reu.77.d: "正如卢基此前无数次在集中营内临时竖立的演讲台上所做的那番——在众目睽睽之下，他居然开始了一场演讲。\n\n“同志们，他们无休止地迫害我们、压迫我们，让我们的生存举步维艰，无论是士兵还是工人！我们如同奴隶，不知还要再受苦多久…”\n\n“住嘴，快！让他住嘴！”\n\n首席军官几乎不敢相信这一切。他见那名行刑士兵毫无反应，便粗暴地命令身旁的卫兵们上前堵住卢基的嘴。但是，他的命令却无人执行，等来的只有卫兵们震耳欲聋的沉默。\n\n而卢基的演讲还在继续。\n\n“同志们，变革之时就在此刻！让我们掌握自己的命运！”\n\n“操，快对这个疯子开枪！不然我他妈就连你们也一块儿杀了！”首席军官几乎是咆哮着发出命令，但被怒火冲昏头脑的他却完全没有察觉到士兵与工人们那充满杀气的目光。\n\n这时，一个强壮的矿工大步跨上了处刑台，还未等卫兵们反应过来，他便用那只布满老茧的拳头狠狠地打在了首席军官的脸上。\n\n“暴乱！”首席军官疯狂地咆哮道，手伸向腰间的配枪。\n\n“不，这是革命！”矿工又给了他一拳，并一把夺下了他的枪。\n\n台上台下，无数人积压数年的愤怒就在此刻爆发。底层士兵与工人的满腔恨意如同燎原之火，将首席军官本人与仍然忠于首席军官的卫兵统统撕成了碎片。卢基则被簇拥在汹涌人潮的中央，语气慷慨地继续着他的演讲：\n\n“同志们，这就是第一枪！让那群高高在上的家伙们听到我们的吼声吧！”\n\n人们欢呼着、呐喊着、大笑着、痛哭着。顺着阳光，卢基抬起了头。"
 event_reu.77.a: "他看到一支红旗迎光而来。"
 event_reu.78.t: "特殊情况"
 event_reu.78.d: "柳德米拉并不喜欢现在的生活。她在叙拉古是被当作一名杀手来训练的，但回到乌萨斯之后，塔露拉只是让她四处奔走，探查情报，她本人能够参与的军事行动少之又少，除去在南下过程中对几支敌军部队实施的斩首行动，柳德米拉的大部分时间都是在无聊的情报海洋里度过的。\n\n来到布拉戈维申斯克之后，柳德米拉出勤的时间更少了，那个在红军到来以后大放异彩的阿丽娜建议她留在根据地，培养新的谍报人员，并且汇总处理所有情报。柳德米拉服从了安排，但她内心对血液的渴望在不断挑拨她，她在期待着一个捕猎的时机。\n\n今天送来的信是来自切尔诺伯格的，这座城市在游击队南下转移的时候被第三集团军实施了军事管制，当时的理由是防止整合运动进入城市，但是粗暴的军管对柳德米拉之前搭建的情报网没有丝毫损伤，乌萨斯的手永远无法染指庞大的感染者群体，感染者被双头鹰所抛弃，因此也无法被双头鹰所了解。\n\n把双腿放到桌子上，柳德米拉找了一个自己最舒服的姿势，打开了信封。军队的巡逻、配给的数额、市民们惯常的不满……前面的内容都是柳德米拉看过无数遍的，她将信纸翻了个面，同时翻了个白眼，不出意料，又是一篇完美但是无趣的报告。\n\n直到她看到了一段文字。\n\n“在感染者聚集区发现特殊情况。一支未识别的十二人小队进入切尔诺伯格感染者Д区块，其中四人携带武器。目标进入区块后，以六人一组分头派发其携带的药物，获得群众关注。根据线人与其的交流记录，目标自称从属于名为‘罗德岛’的医药公司，该公司主业为研发针对矿石病的特效药，其发放的药物标签已附信送回。我部接到消息后尝试对其进行跟踪调查，但很快被其分头摆脱，推测其成员实际具有军事训练背景。目前，目标的目的、行踪、组成皆不明朗，但我部无法判断其重要程度，请求进一步指示。”\n\n柳德米拉，或者说，弑君者，把放在桌上的信封拿起，倒出里面放着的几张从药罐子上撕下来的标签，她看到了一个三角形的标识，这让她想起了一个人。\n\n但是弑君者还不能确定她的猜想是否正确，参加了那么多年她并不喜欢的情报工作，她依然形成了求证情报真实性的好习惯，她决定找一些人来确认她的想法。她走出这个狭小的办公室，对门外的卫兵说道："
 event_reu.78.a: "“帮我找W过来，我有事问她。”"
 event_reu.79.t: "叛匪与骑士"
 event_reu.79.d: "“……我目前所获得的情报就这么多。”念完了所有手稿以后，柳德米拉正准备收起所有资料坐下，但康拉德打断了她，示意自己想看看她手上的材料。\n\n“所以，一个挂着医药企业牌子的佣兵集团，进入了第三集团军重重把守的切尔诺伯格。”塔露拉试图理清自己的思绪，“他们的目标很有可能是城中的科研设施，除此之外，这伙人与卡兹戴尔内战中的女王派还有关联。”\n\n“是不是受雇于人？”叶莲娜简短地问道。\n\n弑君者摇摇头，“现在我没法证明，资本主义的世界，我们的人还没办法混进去。”\n\n“会不会是那里有治疗矿石病的机密？”阿丽娜的脸上依然挂着她那温和的笑容，“照柳德米拉的说法，他们派发的药物确实很有效，会不会他们的主业确实是医疗？”\n\n“没那么简单。”博卓卡斯替发话了，他沧桑的声音在小小的会议室里非常震撼，“萨卡兹，都知道，女王派代表什么。”\n\n“魔王。”康拉德合起文件夹，表情凝重，“我现在不想提这个东西，因为关于‘魔王’的记录非常繁杂，一时间我没办法解释清楚。但是，有一点是毋庸置疑的：魔王是所有萨卡兹的‘王’。”\n\n康拉德看着房间里一脸懵的其他人，内心里斟酌着即将吐出的词句：“和魔王相关的源石技艺，很有可能是一种精神影响的法术，真实的效果我也不得而知。女王特雷西娅，她便是当时的魔王，抛开她的源石技艺不谈，作为当时卡兹戴尔的正统政府，魔王的政治影响力是显而易见的。”\n\n“呃，那我们是不是暂时可以理解成，这伙人拥有王位宣称权之类的什么东西？”弑君者无奈地摊摊手，“那这些在卡兹戴尔内战中失败的家伙，来到切尔诺伯格是要做什么？”\n\n“我也无法判断。也许是切尔诺伯格的研究设施与魔王的源石技艺有联系，毕竟你的情报也提到了他们的目标……”\n\n“我觉得可能不大，毕竟我就是研究员的孩子……”\n\n“各位。”一直沉默着的塔露拉突然发声，“我们没有必要去研究他们的目的。我想知道的是，作为合作者的话，他们可信吗？”\n\n“如果是单纯的合作，他们是可靠的，至少不会像一些佣兵一样，做出背后捅刀子的行为。红军在撤军途中曾经和女王派相互照应，这点我可以保证。”\n\n“那么，我有一个想法。”塔露拉顿了顿，眼睛看向弑君者，“柳德米拉，继续探查这个组织的情报，我们要准备和他们搭上线。”"
 event_reu.79.a: "“然后我们便有了拿下切尔诺伯格的机会。”"
 event_reu.80.t: "复仇者之谋"
 event_reu.80.d: "随着进攻切尔诺伯格的目标被确认下来，整合运动和红军的每个人都分配到了新的工作，而柳德米拉的任务，就是整一个渗透切尔诺伯格的方案，然后给执行军事行动的家伙们过目。所以她把她能找到的所有从切城来的人都叫了过来，她可不希望这份计划出什么差错，毕竟一个失误就可能要游击队战士们用几十条命填上去。\n\n这个并不正式的会议已经开始了一个小时，来开会的战士们都已经大致得出了一些共识，比如进城之后要控制住警局，打开军火库把武器发给暴动工人，但是有一个最关键的问题无法解决：怎么进城。帮助切城的感染者和工人们逃出来的那条路线，随着第三集团军对城市实行军管，已经无法使用。而且城内的人们要是真想离开，还可以混进难民的队伍里，祈祷着那一天的检查站士兵愿意接受贿赂，可是进城完全是另一回事。\n\n“先突袭检查站，把看见我们的人都杀光，不就没人知道我们进来了吗？”\n\n“你是不是蠢啊，维克多，检查站少说也驻守了十几个人，他们都不用打电话，大喊一声我们就都得被发现，然后计划的部署就会全部被打乱。”\n\n看着吵吵嚷嚷的小作战会议室，柳德米拉捏了捏紧皱的眉头，虽然战士们的热情和经验都不逊于帝国的正规军，但是缺少靠谱的技战术训练真是个硬伤，要是队伍里多一些受过正经训练的人就好了。\n\n“工业区的废品通道。”一个声音从角落传出来，让嘈杂的屋子霎时间安静下来，那是一个把自己包的严严实实的年轻男人，“敌人都不是感染者，没人会愿意靠近那个全是污染物质的通道，但我们不需要顾虑这个。”\n\n柳德米拉把坐在自己边上的尤莉·安德罗波娃扯到脸上，“尤莉，这人是谁，我怎么感觉很面生。”\n\n“呃，他好像是雷德，雷德·瓦西列夫斯基，和我差不多一个时候加入组织的，他好像在政府军服役过，但是没被当作积极分子培养……”\n\n“我知道为什么他没被培训班选中，‘雷德’这个名字一点都不像乌萨斯人，搞不好他的真名是‘亚历山大’或者别的什么。”柳德米拉饶有兴趣地看着那个还在和其他人说明他的计划的年轻人，“按惯例来说，我们都会对隐藏自己身份的人有一丝警惕。不过他的话……”"
 event_reu.80.a: "“会议结束后你去告诉他，让他找爱国者将军报道。”"
 event_reu.81.t: "客从何处来"
 event_reu.81.d: "几个小时以前，一艘巨大的陆行舰停泊在了落蹄洲，一小时以前，还在家里教自己的东国女友做炒粉的林巧川被一通电话叫出了家门，出现特殊情况，近卫局需要临时加强警备，所以林警官的半天假期也泡汤了。\n\n半小时以前，林巧川终于克服了出勤的最大困难——龙门的车流，到达了他所负责的入城口岸。值班室里的珠州脏话和西北脏话不绝于耳，看来被突然从家里叫出来的不止林巧川一个人，想到这里，林警官的心里反而舒服了一些，他打了个电话给女友良子，给她报了平安，又说了一些“等着下班回家吃你做的炒粉”之类的肉麻话，此举又遭到了值班室里的单身男警官的嫌弃。\n\n尽管近卫局的通知是“出现特殊情况”，但并没有向林巧川这样的中层督察或警长和其他基层警员说明，是什么特殊情况。相反，按照林巧川他们遇到的情况，今天的情况与往常没什么不同。这个面向乌萨斯方向的口岸，自从乌萨斯东部局势动荡之后，入境的人就越来越少，起初有一些感染者难民，之后是零零散散的几个乌萨斯商人或小市民，在林巧川的同事偷偷摸摸收“茶钱”的时候，他从乌萨斯人那口音极重的炎国官话里听到，最近的乌萨斯大城市切尔诺伯格突然被军事管制，生意做不下去的商人只好跑来龙门另谋生路。至于军事管制的原因，那些乌萨斯人说是什么“土匪”“叛军”之类的家伙，意图袭击城市，但是从军队进城开始，过去了大半年，根本没听说有什么战斗在城市周边发生。\n\n林巧川不是一个关心政治的人，不过同一个值班室里有个从内地来的小年轻，对这件事很感兴趣，对着那些炎国话蹩脚的乌萨斯商人穷追不舍，在人家走后，还用值班室的电脑尝试寻找相关的新闻，被林巧川抓个正着。\n\n“林sir，你先放开我耳朵……你看，新闻说乌萨斯军队前几个月发动了一场针对感染者叛军的剿灭作战，所以前段时间才有那么多感染者难民逃到我们这边，那个叛乱组织叫……”同事的喊声把林巧川从回忆里唤醒，异常状况就出现在他面前的监控视频里，这个时候发呆真是他的失职。一队感染者出现在口岸前方，除了领头的一个白发埃拉菲亚，其他所有人都携带了武器。林巧川从座位上跳起，迅速套上挂在值班室墙上的装甲，冲了出去。\n\n“你好，我地冇得恶意。”正在林巧川指挥警员布置阵型，准备作战时，埃拉菲亚女性身边的那个人开口了，一口纯正的龙门口音珠州话，把所有人都整愣住了。林巧川看向说话的那个女性，尽管是白色卷发，长着他没见过的奇特的角，但是她让林警官想起了一个人，一个他想到就后怕的人，然后他就听到了那个他不想听的名字。"
 event_reu.81.a: "“我找陈晖洁。”"
 event_reu.82.t: "迟早要还"
 event_reu.82.d: "看着无边无际的车流，陈晖洁叹了口气，拉起了车上的警灯。她清楚这种做法对于龙门拥堵的交通并没有多少作用，但是如果这样能让浪费在路上的时间减少几分钟，那对于她来说就不亏。\n\n盯着前车的刹车灯，陈晖洁的脚放在油门踏板上无所适从。稍早时抵达的罗德岛制药为龙门带来一个重磅消息，乌萨斯第三集团军即将独走，利用切尔诺伯格核心城为掩护进攻龙门。陈晖洁在接到另一个重磅消息之前，正在总督的会客室里，听着罗德岛的领袖，那个名为阿米娅的小孩子，向他们解释当前的严峻局势。\n\n然后一通来自入境口岸的电话就把陈晖洁叫出了会客室，电话里那个叫林巧川的警长压不住自己慌张的声音，他称在他负责的口岸，有一队全副武装的感染者，其中的领头人点名要见陈晖洁警司本人。现在这伙人先做出了让步，自愿放下武器，在前线的值班室里等待，但林巧川警长对于这些来历不明的人还是非常担心，抛开他们是武装人员不谈，即使是感染者的身份，也足够让一整个区块的警员提起重视。\n\n陈一边开车，一边继续拨通那个值班室的电话，尽管被她堵在路上耽误了十几分钟，但来者似乎并不着急，林巧川警官传话道，那些人觉得，真正应该着急的是龙门，而不是他们。\n\n“他们的领头人，你把他们的外貌描述一下。”随着警车拐到一条通往城郊的路上，陈终于可以放心踩下油门，“我几分钟后到。”\n\n“是，madam。领头的有两个人，我无法判断谁才是真正的领导。一个是白色长发的女性埃拉菲亚，特点不是很明显，和大部分乌萨斯逃亡过来的农民差不多。另一个人是白色的卷发，也是一个女性，她自称种族是德拉克……呃，madam，我有个问题不知道该不该讲……”\n\n“说。”陈似乎意识到了什么，她在猜测林巧川要对她说的下一句话。\n\n“那个卷头发的，她的五官和您有点像。”\n\n“问她叫什么名字，还有年龄什么的基本信息。”\n\n电话那头短暂地沉默，传来模糊的说话声，也许是林巧川要再次确认对方的身份信息。几秒后，陈晖洁得到了她想要的答案。"
 event_reu.82.a: "“Madam，她说她叫塔露拉·雅特利亚斯。”"
 event_reu.83.t: "第二个价码"
 event_reu.83.d: "“出于局势紧张，以及龙门近卫局人手有限，我可以以之前的临时协议为基础，考虑一下你们的具体方案。”魏遵武背对着罗德岛的众人，看向落地窗外明灭的霓虹，拿起手里的烟管，轻轻吸了一口。然后他转过头来，盯着阿米娅，“但是正如我刚才所说——”\n\n“……罗德岛的要价太高，是吗？”在一阵小小的沉默后，凯尔希用不带感情的声音说着。\n\n“正是如此……”\n\n“那魏先生是否愿意接受另一个出价呢？”会客室的门被推开，那个二十年前离开这里的女孩走了进来，以乌萨斯的方式行了个礼，“塔露拉·雅特利亚斯，布尔什维克党的代表。”\n\n“魏长官……！对不起，我没拦住她……”陈跟在塔露拉的身后跑进会客室，大口喘着气，也许是奔跑导致她的呼吸急促，也有可能是她为了掩盖自己的不堪而装出一副疲惫的样子。\n\n看着眼前这张熟悉而陌生的脸，魏遵武的脑海里掠过很多东西，他不由自主地闭上了眼。夜雨、黑蛇、玄色的蓑衣、远去的小小身影……他搜索着过去二十年的所有因果，但是没有一条是支撑现在的这个塔露拉站在这里的原因。她变得不一样了。魏遵武再一次举起烟管，深吸一口，然后吐出一片云雾，笼罩在他和塔露拉的中间。\n\n“我不是为了你来的。”仿佛看透了魏遵武心里的恐惧和脆弱，塔露拉先开口了，“我的过去已经不重要了。我们是为了另一个未来而来。”\n\n塔露拉扫视了一眼在场的人，然后她转身，面向罗德岛的两位领袖，“只不过，我们的那个未来，和在场的各位有些许交集。”\n\n“说说你的价码。”凯尔希的声音仍然冷酷，“阿米娅，你已经做得很棒了。”她轻抚着身旁年轻领袖的头，示意现在，由她来接管这场谈判。\n\n“很简单。你们的行动已经惊动了乌萨斯第三集团军，他们无疑会提前这个疯狂的计划。而你们回收石棺的目标，并没有达成。”塔露拉看着凯尔希的眼睛，凯尔希也以目光回应，“我不知道石棺里是什么，但是你们肯定不会放弃它，所以你们找到了同样急于应对切城的龙门，希望得到龙门的帮助。”\n\n“……你的判断能力，很强。说下去。”\n\n“但是龙门是炎国的城市，龙门的行动代表着帝国的回应。切尔诺伯格很有可能打着躲避天灾的旗号，径直向龙门袭来。主动进攻，代表着炎国主动攻击乌萨斯的领土；什么也不做，等待着龙门的是毁灭。于是——”塔露拉转向魏遵武，“龙门决定接受罗德岛的合作申请，让罗德岛以第三方的身份介入，去停止那个失控的城市，从而化解政治上和安全上的双重危机。”\n\n塔露拉的嘴角勾起一丝弧度，按照她学习到的贵族谈判技巧，她停顿了几秒钟，观察着双方的表现。在读出了凯尔希和魏遵武平静外表下的蠢动之后，她给出了第二个价码。\n\n“我们作为乌萨斯帝国的‘叛军’，对切尔诺伯格发起的一切行动，都属于乌萨斯帝国的内政。如此一来，魏总督不再需要承担任何外交责任，而罗德岛可以作为‘叛军’的雇佣兵，参与我们的行动。”\n\n沉默的魏遵武终于开口，“那你们想要什么。”\n\n“我们不想从龙门身上得到任何东西。我们要的东西一直只有一个。”"
 event_reu.83.a: "“切尔诺伯格。”"
 event_reu.84.t: "第一锤：靶向药物"
 event_reu.84.d: "“既然魏总督和罗德岛都同意合作，那在会客室讨论接下来的问题，是不是不太正式呢？”得到魏遵武和凯尔希的回应后，塔露拉继续说着，“毕竟，我一个人无法决定所有合作事宜。我们的决策机关遵循民主的原则。况且，和我来的一位老先生想见见你。”她的目光落到了站在凯尔希身边的阿米娅身上，这让阿米娅惊地一颤。\n\n“陈警司，把她和她的随行人员，如果有的话，都带去近卫局的会议室吧。我和罗德岛的两位随后到。”\n\n“是，魏长官。”陈立正好，向魏遵武敬了个礼，随后她目送着塔露拉缓步走出会客室，快步跟了上去。\n\n“晖洁。”塔露拉突然开口了，陈的心跳慢了一拍，在来总督府的路上，塔露拉一直称她为“陈长官”，和她交谈的皆是关于这次会面的公务，而用名字来称呼她，这是塔露拉来到龙门之后的第一次。\n\n“我给你写了很多信。”塔露拉继续说着，她的语调不再像与几位位高权重的领袖交流时的咄咄逼人，她说得很平静，平静得像经历过很多事，“但是我全都没有寄出去。在我们逃往南方的时候，那些信，我都不小心弄丢了。”\n\n陈不知道从哪里开始提问，她并不知晓，她的这个姐姐曾经经历过什么，她只知道黑蛇带走了塔露拉，随后发生的事情都不在她能理解的世界。她斟酌了很久喉咙里的语句，最后也只憋出一句话：\n\n“没事的，这次重逢以后，你可以当面把信上的东西告诉我。”\n\n“塔露拉！怎么样，他们同意我们的要求了吗！”当陈和塔露拉走出总督府，那个叫做阿丽娜的埃拉菲亚第一个冲上前来。塔露拉来的路上告诉陈，这是她最亲密的战友。\n\n塔露拉走到阿丽娜的面前，握住了她的手，微笑着长叹一口气，她的肩膀今天第一次舒缓地自然垂下来，“我成功了。晖洁之后会带我们去别的地方，商讨正式的合作内容。”说着，塔露拉回头给了陈一个同样的微笑。\n\n陈晖洁愣住了几秒，然后她换下了工作状态的扑克脸，对塔露拉的笑容回报了一个给予家人的微笑。\n\n“布尔什维克党的各位，如果准备好了就出发吧。”"
 event_reu.84.a: "“龙门近卫局会全程为你们护航。”"
 event_reu.85.t: "第二锤：异卵同生"
 event_reu.85.d: "亚历克斯并不是政治局的成员，因此他也不会出席之后在近卫局的那场会议。得到了近卫局的批准后，他带领的警卫队被允许在无武装的情况下在龙门各处活动，当然，亚历克斯在解散了队伍后就发现，没走几步路就会有一个近卫局的跟班出现，普通的便衣警员无法瞒过这个年轻的老兵的眼睛，在走过了贫民窟的一条混乱的摊贩街后，亚历克斯断定，龙门近卫局跟丢他了。由于龙门城密不透风，根据地无法得知交涉的情况，因此需要利用弑君者通过乌萨斯难民制造的情报网，向布拉戈维申斯克方面传递消息，而代号“碎骨”的亚历克斯，便是这次行动的信使，现在，他需要前往龙门的贫民窟，对接一位乌萨斯族的线人。\n\n碎骨的鞋子踏过一滩腐烂发臭的菜叶和鱼下水，激起一阵令他反胃的气味。如果带着面具就好了，碎骨在脑子里咒骂着，为了防止目标太明显，亚历克斯把他平常携带的防毒面具留在了近卫局，只穿上了那件卫衣，用兜帽盖住他明显的白发和乌萨斯人的耳朵。\n\n充斥在碎骨耳内的龙门话如同白噪音，他无法理解其中的任何一个词语，因此也不会被它影响。他的眼睛捕捉到龙门市井百态的一角，肮脏的街道、狭窄的房屋、食物香气与污物恶臭交融的空气，和龙门的人。碎骨开始理解为什么塔露拉让他们四处走走，龙门的穷人过着比乌萨斯农民们更现代的生活，但这些人的眼睛依然是浑浊的，体态仍然是挣扎的，他们在移动城市里受到的压迫，并不比乌萨斯农民在冻原上受到的更轻多少。\n\n碎骨继续走着，他在绕下一个破旧的水泥旋转楼梯后，到了贫民窟区块的更深处。这个区块在龙门的官方名称为“玖号区块”，但龙门的百姓更习惯称之为“九朗”，但碎骨是听不懂龙门方言的，所以他离开后，这个地方在他的记忆里根本没有名字。这个地方是没有工作的感染者聚集的地方，因为矿石病失去工作能力的人，没法出卖劳动力的感染者幼童，以及语言不通的乌萨斯感染者难民，都在这个庞大却狭窄的“九朗城寨”，为着完全没有意义的明天挣扎求生。这里是碎骨的目的地，他很快就发现了他的接头人，那个人按照弑君者的安排，带着一个显眼的红色安全帽，蹲在城寨居民自己抠出来的“下水道”边上，抽着一根没有商标的香烟。\n\n“政治局安全，交涉正常进行。”\n\n情报传递的过程很简短。没人跟踪，周围的其他人都不会乌萨斯语，最简单的方式便完成了交接。碎骨目送线人离开，随后自己也转身，背向九朗城寨的方向离开。\n\n“亚历克斯……？”\n\n一个柔弱的女性声音传入碎骨的耳朵，这声纯正的乌萨斯语在龙门话的白噪音中是那么的刺耳，身经百战的老兵迅速朝声音的来源看去。他只看到一个白色短发的乌萨斯女孩，身边围绕着几个小孩子，用好奇的眼光看着他，看着两个长得极为相像的人。\n\n伪装和掩藏此时已经不重要了，碎骨摘下兜帽，露出他显眼的白色头发。然后，暂时不用扮演“碎骨”的亚历克斯，说出了那个已经十几年没能从他口中说出的乌萨斯单词。"
 event_reu.85.a: "“……姐姐？”"
 event_reu.86.t: "第三锤：苦难摇篮"
 event_reu.86.d: "当“爱国者”博卓卡斯替和其他人一起走进近卫局时，他注意到所有人的目光都放在了他的身上，然后又统一地迅速移开。龙门，或者说整个炎国，很少见到高原山脉另一边的萨卡兹，在他的记忆中，唯一一支迁徙到炎国的族群，也已经与如今的萨卡兹们相去甚远。即使有些近卫局的警员见过萨卡兹人，温迪戈也与其他萨卡兹长得完全不同，庞大的身形和可怖的气息，让旁观者的眼光在好奇和恐惧之中摇摆不定。\n\n但爱国者终究只是个老人，进入会议室后，年迈的温迪戈便寻找了一处角落，在其他人的照看下闭目安神。直到他战士的嗅觉探查到了一丝熟悉的气息。博卓卡斯替缓缓睁开眼。\n\n“塔露拉小姐，你们好！我是罗德岛的代表，阿米娅。这位是凯尔希医生……”\n\n“凯尔希，女勋爵？”苍老沙哑的声音从会议室的角落传出，把在场的大部分人都吓了一跳。爱国者缓缓站起身来，高大的身躯耸立在房间的一角，传达出的压迫感让随行的一名近卫局警官吓得向后倒坐在地上。惊惧之后，紧接着是一段沉默。\n\n“啊，各位不要紧张，爱国者老先生虽然看上去比较吓人，但是——”回过神来的阿丽娜急忙向龙门和罗德岛的代表们解释，但凯尔希已经自顾自地向那个角落里的巨人走去。\n\n“博卓卡斯替，久违了。”\n\n“我感受到，熟悉的气息，没有想到，是你。”爱国者微微俯下身，不知是鞠躬，还是俯视。“你为什么……没有变老。”\n\n魏遵武轻轻地咳嗽一声，将爱国者和凯尔希的视线向他的方向拉去，“两位，我们今日商谈的是未来的计划，过去的回忆，能否留待将来？”\n\n年老的温迪戈再次微微俯身，这次很显然是表达歉意，人们猜测他的面具下，此时应是微笑，“很抱歉，遇见老熟人，情不自禁。——但是，还有一些事，需要我，确认。”\n\n爱国者看着阿米娅，一步步向她走去。盔甲互相碰撞的声音在寂静的会议室里震耳欲聋。“有人对我说，殿下离去时，你们和她，在一起。”\n\n“告诉我，殿下她，是否有继承人。”爱国者在阿米娅的身前停住，年迈的温迪戈低着头，盯着年轻的卡特斯，“孩子，抬起头，看着我。”\n\n“阿米娅——”凯尔希想冲回阿米娅的身边，但爱国者的身躯实在过分厚重，把她和阿米娅分割在会议室的两端。凯尔希一瞬间甚至想动用武力，但她知道这是徒劳，而且这里并不是战场。\n\n“博卓卡斯替先生。”阿米娅缓缓抬起头，面对着爱国者面具后的眼睛，她菱形的瞳孔在博卓卡斯替的眼中显得尤为突出，“我是您的答案。”\n\n所有人都看到了爱国者的身躯在发抖，他似乎在笑。他的面庞被面具遮掩，他的声音被疾病夺走，但所有人都看见，他似乎在笑。许久，博卓卡斯替再次直起身，回过身去，走回他原来休息的那个角落。\n\n“孩子，我很幸运。我与命运抗争，无数年，如今，第一次看见，胜过它的可能。”爱国者坐回一开始他待着的地方，面具下的眼睛依然看着阿米娅，“最后的温迪戈，将会死在，魔王手中。我离开时，得到这个预言。”"
 event_reu.86.a: "“但是，今天，我知道了，魔王不是，我的敌人。”"
 event_reu.87.t: "成交"
 event_reu.87.d: "“根据协议，苏维埃红军将挑选出一支精锐部队，与罗德岛行动小组和龙门近卫局特别部队共同行动，进入切尔诺伯格核心城，停止核心城的移动，并夺取城内关键地区的控制权。渗透行动由塔露拉·雅特利亚斯全权指挥。\n\n“同时，在乌萨斯境内，苏维埃红军将对第三集团军的控制区发动正面进攻，牵制部署在其他地区的第三集团军部队，为渗透部队创造机会，并且寻求完全占领切尔诺伯格城。罗德岛将与龙门方面协同，在边境地区进行防御作战，阻击护送切尔诺伯格核心城的第三集团军部队。\n\n“在战斗结束后，苏维埃红军将确保两国边境的安全，并同意收留龙门境内的乌萨斯难民。罗德岛将协助龙门总督府，进行战后的恢复重建工作。龙门承诺在战斗期间和战后保护境内感染者的权益。”\n\n书记官念完摘要，她放下那本薄薄的协议书，看向坐在会议室里的三个领袖。在没有收到否定的回应后，书记官默默退下，将翻到了签字页的协议书留在了桌面上。\n\n“魏长官先请吧，您是这里的主人。”塔露拉微笑着做了个手势，魏遵武什么也没说，他沉默地站起身，沉默地签下代表龙门的姓名，沉默地回到座位上坐下。这份协议对龙门来说没有损失，但他需要时间重新习惯，习惯这种全程被人掌控的感觉。\n\n阿米娅第二个站起身，整合运动，或者说布尔什维克党的所有人，都盯着她。他们只是对这个与他们不一样的“感染者领袖”很有兴趣，不过阿米娅并不知道这一点，所以她在沉重的视线压力下签下了自己的名字。回到自己的座位上时，她仍然紧绷着一口气，不敢露出其他的表情。\n\n当轮到塔露拉时，那个经历过无数战斗的手，也是批阅过无数文书的手，在那一刻突然僵住了，她明白这个签字意味着什么。随着苏维埃红军夺取那个庞大的城市，由战争驱动着的第三集团军就将土崩瓦解，而她这个失控的“蛇鳞”必然导致信任着科西切的贵族们相互猜忌，随之而来的将是东达利亚冻原上无尽的混乱。但是这样的混乱，也是苏维埃政权的机会。想着这些事情，塔露拉签下了自己的名字。"
 event_reu.87.a: "“好了，事情办完了。接下来我们是不是应该互相握手？”"
 event_reu.88.t: "第一阶段：坍塌"
 event_reu.88.d: "尽管自己是秘密工会的老干部，米凯尔却被告知，这次集会他不许参加。这个半张脸被烫坏了的老工人是个急性子，追在联络人的屁股后面出了房门，无奈的联络人想着米凯尔是个信得过的同志，就把安排提前告诉了他。听了组织的安排，老工人气恼的眉头瞬间散开，对联络人再三强调自己一定不会告诉别人。\n\n所以在这一天的集会上，当赫斯基炼钢厂的几乎所有工人们聚集在厂房里，等着工会的领袖前来发言时，米凯尔和其他几个年轻的工人却不见了踪影。工人们对一部分人的缺席表示见怪不怪，谁还没有些私事需要处理？不过当那个在贫民中传得神乎其神的名字出现在现场时，有个工人还是悄悄说着，没能亲眼看到“弑君者”，老米凯尔真是亏大发了。\n\n“弑君者”告诉工人们，在城外的红军正在酝酿一场奇袭，需要城里的工人们里应外合，打军队的家伙们一个措手不及，赫斯基精炼厂是她的第一站，她之后还要亲自将整个切尔诺伯格的工业区串联起来，然后把这座城市变成一座燃烧的森林。\n\n有人问道，工人们没有武器，怎么对付那些装备精良的集团军士兵？\n\n“弑君者”平静地说道，在傍晚，红军的运输部队会在货运通道与工人们街头，到那时，刀剑法杖乃至军用铳，工人们拿得顺手的武器应有尽有。\n\n又有人问道，如果被提前发现了，怎么办？\n\n话还没问完，工厂的保安就被从外面扔了进来，这个可怜的男人被揍得血肉模糊，他身后是一个警官和几十个全副武装的警员。警官轻蔑地宣告着，在场的人涉嫌组织暴动，统统都要被逮捕。\n\n站在人群中央的“弑君者”冷笑一声，一股烟雾从她的身上冒出来，然后迅速扩散到整个厂房里。警官听到了大门关上的声音。\n\n“死杂种，你工人爷爷来了！”\n\n米凯尔挥舞着大锤，从厂房二楼跳下来，一下子砸碎了警官的脑袋。躲在暗处的工人们也同时跳出来，拿着铁锤、撬棍或者其他什么东西，在烟雾中把警察们全部解决了。\n\n擦掉飞溅在自己那半张好脸上面的血迹，米凯尔对人群中央的柳德米拉笑笑。\n\n“感谢米凯尔同志，一下子解决了我们面临的两个问题。”柳德米拉重新戴上兜帽，跃上厂房上方的钢梁，“再见了，我还有下一个地方要去。”\n\n死去警官的对讲机里传来警局的问话，米凯尔再次挥起大锤，把对讲机砸了个粉碎。"
 event_reu.88.a: "暴动开始了。"
 event_reu.89.t: "第二阶段：急性衰竭"
 event_reu.89.d: "“瓦西里，我不在的时候你务必看好检查站，不要让任何人趁乱混进来！”\n\n“是，长官！”瓦西里对着带队离开的长官行了个标准的乌萨斯军礼，但是他知道，靠五个人守住一个检查站，简直就是一个搞笑故事。一两个混过来的难民可能还能抓出来，要是传说中的“赤匪”发动大军攻过来，瓦西里他们根本拦不住，检查站是放了一挺重型机关铳，问题是留守的五个人根本不会操作。希望那些感染者看到那玩意会害怕吧，瓦西里这么想着。\n\n目送载着十几个士兵的卡车开进城里，瓦西里伸了个懒腰，坐回检查站的岗亭里。城里的工人莫名其妙地开始了暴动，起初他以为只是军管以来每天都在发生的罢工，但当警察局被一把大火烧掉的消息从城中传来，他的长官被拉回城里镇压暴动，瓦西里意识到事情不太对劲。\n\n不过城里的火应该烧不到入境入口吧。瓦西里心里这样安慰自己，从口袋里摸出一包香烟，挑出一根放进嘴里。\n\n瓦西里所在的入城通道因为某些技术原因，那个几米厚的钢铁大门卡住了，关了一半关不上。来修理的技工检查了一番，信誓旦旦地表示能修好，然后工程队鼓捣了几天以后，成功把那块大铁块，弄裂了，这下除了等城市停下以后换一个大门之外，没有任何别的方案。所以瓦西里就只好和队友一起，在这个半开不开的入城通道这里搞了个简易的检查站和路障。希望没人注意到这里有个裂缝，瓦西里寻思着，点燃了香烟。\n\n“什么人！”岗亭外突然传来队友的喊声，瓦西里一惊，循声看过去，队友的手已经按在了腰间的军刀上，然后一颗子弹飞过来，直接把他的那只手打断了。\n\n“苏卡。”瓦西里臭骂一声，拿起放在岗亭里的盾牌就冲了出去，招呼剩下三个能动的队友聚到自己身边，组成战斗队形，准备防范不明身份的袭击者。\n\n然后他就看见剩下三个队友双手高举，跪在地上，周围是穿着黑袍的袭击者。袭击者看到他冲出来，领头的那个人举起手里的铳，高声喊道：\n\n“缴械不杀！红军优待俘虏！”\n\n妈的，传说中的赤匪。那打个屁。瓦西里想到长官的那张臭脸，还有宪兵队因为他私藏了哥伦比亚的几本小说而关了他几个月禁闭，把盾牌丢到了一边，举起了双手。"
 event_reu.89.a: "有什么正在崩塌。"
 event_reu.90.t: "第三阶段：靶向药物"
 event_reu.90.d: "“好的，让我们再确认一次各自的任务。”\n\n煌皱着眉头，弓着身子，缩在这间小屋子里的感受属实让人不爽。她想不明白，塔露拉为什么选择这间逼仄的地下室作为“临时指挥部”。这间屋子在他们所在的切尔诺伯格贫民窟都是比较破的一间，据说这里属于红军的一名线人，他的另一个身份是工厂的锅炉工。\n\n“碎骨和浮士德，你们两个人带队去支援弑君者的暴动队伍，尽可能多地消灭敌人，让他们把更多的兵力投入到镇压工人上，把他们彻底拖住。”\n\n也许这样才有一点叛军的样子吧，煌在心里这么想着。她关于“叛军”的想象都来自童年时在炎国读到的那些小说和新闻，什么山海众啊，同盟会啊，出现在新闻里时，都是说他们的“地下组织”被摧毁，所以叛军在地下室里开会，可能是什么行规吧。\n\n“然后是，晖洁。你和你的近卫局队伍是要去控制车站、邮局、电视台和警察局，这类任务只能交给你们这些室内作战的专家。拿下这些地方后通知我们的人，工人武装会前来接管。还有，记住，不要说炎国话。”\n\n煌看着塔露拉在桌上的纸质地图上比划着，她以前看到的地图都是在罗德岛本舰上的电子屏幕上，凯尔希医生轻点几下就能把不同信息全部展示出来，比塔露拉的纸质地图方便多了，她在想要不要建议塔露拉在战斗结束后换一个电子地图，毕竟纸质地图看上去真的太麻烦了。\n\n“最后，是罗德岛的朋友们，和我。我们要去抢下切尔诺伯格核心城的密钥，夺取整座城市的控制权。这个任务难度很大，但又不能大张旗鼓，所以只能由单人战斗力极强的几个人来完成。”\n\n煌点点头，任务的目标她早就记下了。塔露拉向罗德岛承诺过，协助她夺取城市后，罗德岛可以不受限制地在城里完成他们的任务。所以现在，她应该好好听从塔露拉的指挥，事实上，她对这个反叛军领袖的指挥水平充满了好奇，不知道凯尔希医生和仍然沉睡在石棺里的博士和这个白发德拉克，谁的能力更胜一筹呢？\n\n“霜星率领的红军大部队预计在黎明时分抵达切尔诺伯格城外，如果我们能尽快完成任务，那么就能避免更血腥的战斗。”"
 event_reu.90.a: "“还有什么问题吗？”"
 event_reu.91.t: "第四阶段：局部坏死"
 event_reu.91.d: "“блядь，贝加尔大公这个老东西，现在怎么联系不上了？！”\n\n“子爵大人，现……现在，城里的信号站都已经被暴乱者占领了，我们和外面的通讯……已经中断了。”\n\n“废物！你们他妈的不会搭建军用的频段吗！”刻尔克子爵给了面前的军官一巴掌，把他赶出了房间，“弗拉德，马上去问，直升机什么时候准备好？”\n\n“你也开始害怕了呢，刻尔克子爵阁下。我还以为你是那种处变不惊的类型。”一声冷笑从房间的角落传来，刻尔克子爵的面部肌肉抽搐着，扭头看着被绑在椅子上的那个男人，他破烂的贵族袍子和凌乱的发型似乎在嘲笑着同为贵族的刻尔克子爵。\n\n“鲍里斯，你笑个屁笑！现在我们都要完蛋了！”\n\n“哦，我为什么不能笑，我从被你们第三集团军抓住那一天起就完蛋了，现在多了你一个垫背的，我高兴还来不及呢。”鲍里斯侯爵扬起下巴，轻蔑地看着气急败坏的刻尔克子爵，“只可惜你给自己找的安眠之地不太光彩，核心城的制动室，这种下层工人待的地方，还不如我在城里的那座宅子呢。”\n\n“他妈的，要不是为了把密钥带走，谁他妈来这地方！”\n\n“子爵大人，直升机已经准备好了！”\n\n刻尔克子爵紧锁的眉头绽开来，他满脸笑容地踱步到鲍里斯侯爵的面前，“鲍里斯，现在我能活命了，只有你一个人要死在这了。”\n\n刻尔克子爵从腰间拔出一把精美的匕首，“侯爵大人，我给你最后一点怜悯吧，为了防止你之后在叛匪的手里受折磨，我提前给你一个了断。”\n\n刻尔克子爵攥紧了刀柄，将手高高抬起，瞄准了鲍里斯侯爵的心脏。就在他即将刺下去的那一瞬间，一块铁板飞了过来，把他胸口以上的部分糊在了制动室的墙上。带着满脸的血，鲍里斯侯爵看向铁板飞来的方向，是一个银发的菲林小女孩，她的身后是那个通缉令上画着的脸庞，塔露拉·雅特利亚斯。\n\n“钥匙。”塔露拉径直走到鲍里斯侯爵的面前。鲍里斯的眼睛向下撇了撇，示意塔露拉去翻那具少了一块的尸体。\n\n塔露拉翻开刻尔克子爵那具被迷迭香砸掉了一小半的尸体，在外套的内袋里找到了切尔诺伯格的密钥。她走向控制面板，把那个紧急制动密钥放在了控制面板上。\n\n“口令。”"
 event_reu.91.a: "“Чтобы накормить весь народ.”（为了喂饱所有人民）"
 event_reu.92.t: "怒号光明"
 event_reu.92.d: "太阳正在从地平线下升起，霜星正站在一个小土丘的顶端，嘴里含着两颗辣椒糖。眼前的巨型移动城市正在大地上缓慢地爬行，在其身后扬起漫天的尘土。如果是在它正常的航线上，被冰雪润湿的泥土根本不可能被卷起来，但是它现在并不正常，因为它正在向沙漠边缘的炎国城市龙门驶去。\n\n侦察兵传来了最新的消息，暴动部队还在和城墙的守备军苦战，面对拥有重火力阵地的正规军，缺乏训练和护甲的工人们根本不是对手，只得搭建起街垒与他们对峙。\n\n霜星看着城中数不清的烟柱，每个燃起火的地方都是工人们和第三集团军的战场。但城市仍在移动，登上正在行进的移动城市，是正规军都不会轻易尝试的行为，更何况是毫无大城市作战经验的红军。但如果天亮时，城市还没有停下，霜星只能放手一搏。\n\n随后一声巨响传来，从移动城市的动力模块处冒出一大片黑烟，方才还在啃食地面的切尔诺伯格城停了下来。红军阵地中爆发出一阵热烈的欢呼声，霜星也松了一口气，她转身让参谋收起临时搭建的帐篷和电子设备，走下了小土坡。\n\n几十分钟后，一群训练过的冰暴源石虫炸碎了切尔诺伯格的外侧装甲层，训练有素的盾卫和雪怪小队队员粉碎了城墙守备部队的抵抗。在攻城部队和工人武装与守备军的战斗结束后，红军的大部队从伤痕累累的城市入口进入了城市。切尔诺伯格现在被置于苏维埃红军的控制之下。"
 event_reu.92.a: "我们胜了！"
 event_reu.93.t: "在梦中相遇（其一）"
 event_reu.93.d: "“不行……这个家伙身上也没有……”索尼娅在屋子里的第五具尸体上摸索着，这个被她一斧子切断颈部动脉和颈椎的第三集团军士兵身上并没有她想要的药品或食物，也许他也是为了找这些东西才跑进这里来的，索尼娅这么想着。她算不清这是她躲进这间空教室的第几天，为了防止那些发了疯的士兵发现她们，索尼娅甚至不敢拉开窗帘。\n\n索尼娅还记得这些大兵们进驻彼德海姆中学的那个早上，他们的长官声称要对这座城市进行军事管制，因此所有学校都应该停课。然后他们把一些人带走了，又把其他的人送进来，索尼娅看得出来，离开的家伙无一例外，不是贵族就是官员们的子女，送进来的则是和她一样的普通学生。血脉里的反抗精神——或是领袖欲望——在刺激着她，利用自己之前在校园斗殴中的威望，她暗地里把几个学生自结社团重组成了“学生自治团”。\n\n自治团开始在各个方面刁难这群大兵，为什么不让他们上课、不让他们离开，衣物呢、粮食呢、药品呢……学生们清楚这些反抗没有效果，但“反抗强权”所带来的快感，让这些青春期的孩子们沉溺其中。直到几天以前，一个大兵面对质问食物在哪里的学生们，抽出了军刀。\n\n对于手无寸铁的学生们，这很快变成了一场单方面的屠杀。有战斗能力的教师和学生们拼命反抗，结局是被军队的铳械打成筛子。士兵们发了疯似的杀人，学生身上值钱的东西被他们搜刮殆尽，包括女学生的贞操。索尼娅从来没有想过，事情会变成这个样子，在她成熟而又稚嫩的思想中，士兵是保卫乌萨斯的人民的。\n\n“冬将军”召集起了所有还能动的人，在已经变成地狱的彼德海姆中学杀出一条血路，并且找到了教学楼最高层的一间空教室，祈祷那些陷入疯狂的士兵会忽视她们这群人。有些人在出去查看情况和寻找资源时被杀死了，有些人因为伤势恶化也死去了。剩下的除了索尼娅，就是窝在墙角的这几个人。“夏将军”罗莎琳，在此前的混乱中被一铳射穿了手臂，现在根本拿不起武器；拉达倒是没有受伤，但是极端的饥饿已经让她站不起来；至于安娜和薇卡，这两个不会打架的女孩子，对她们的生存毫无帮助。如果从纯粹的利益出发，她们很多人都应该被抛弃，只是一种脆弱的责任感，或者说是为了赎罪，让索尼娅依然带着她们。"
 event_reu.93.a: "如果她不去组织这个自治团就好了……"
 event_reu.94.t: "在梦中相遇（其二）"
 event_reu.94.d: "如果她不去组织这个该死的“自治团”，老老实实待着，事情是不是不会变成这样？索尼娅握着手斧，再次陷入了自我拷打的陷阱，直到外面的脚步声把她拉回现实。这次的脚步声听上去十分嘈杂，很明显，对方来的人很多。索尼娅忐忑着，躲到门后，举起了手斧，这是她屡试不爽的偷袭方式，之前那些疯狂的士兵都是这么倒在这里的。\n\n门被推开，一队训练有素的士兵冲进了房间，索尼娅觉得他们的军装和之前的家伙不一样，而这些不一样的家伙们很快就发现了她，一把铳对准了她的胸口。\n\n索尼娅举起双手，闭上双眼，等待着她的死亡。但是死亡并没有如预想中来临。她只听到面前的那个士兵退下了装填好的子弹，然后轻轻地拿走了她手里的手斧。\n\n“操，你这个学生真他妈的厉害，这些家伙都是你打死的？”\n\n索尼娅愣住了，她呆滞在原地，看着前面这个操着农村口音的士兵，她看到了他布满伤疤的脸，和长在脸颊上微小的源石结晶。\n\n“……你是感染者？！”索尼娅吓得退后几步，靠到墙根上。\n\n士兵抬了抬眉毛，没有说什么，只是走到墙边，蹲下身子观察着那几个被索尼娅砍死的第三集团军士兵，然后他摘下了这几具尸体脸上的军帽和面罩。\n\n“看吧，我是感染者，这几个死人不是。小姑娘，你相信谁？”\n\n索尼娅一时无话可说，她之前看过实行军事管制的通告，也偷听到过占领学校的士兵们对话，据说军管的理由便是“在感染者暴徒的威胁下保护市民”。但是看着眼前这一幕，索尼娅突然发现，她分不清谁是暴徒，谁是真正的战士了。\n\n“我操，还有幸存者！医疗小队呢，叫他们过来！”另外一个士兵惊叫道，他应该是发现了藏在墙角的破布下面的那几个学生，索尼娅想，他们好像真的不是坏人。\n\n“我去找他们。”方才和索尼娅说话的那个士兵和其他人说道，他把铳背到身后，转身准备离开。\n\n“等等。”索尼娅叫住了他，那个士兵好奇地转过头，看着索尼娅的眼睛。\n\n“你们是谁？”\n\n士兵笑了笑。"
 event_reu.94.a: "“我们是红军，小姑娘。”"
 event_reu.95.t: "被选择的"
 event_reu.95.d: "“阿丽娜老师，现在城里的威胁还没有清除，你不能乱走……”\n\n“萨沙。”阿丽娜停下脚步，转过身，面对浮士德，一脸严肃，“你既然叫我老师，那么去关心学生就是我的责任，你是我的学生，那些在彼德海姆中学的孩子也是我的学生。”\n\n浮士德无奈地叹了口气，“那我去找一辆刚缴获的军车过来，这样你的安全有保障，而且比用两条腿走得快。”\n\n“好吧，至少你同意我去了，我们的小指挥官。”阿丽娜恢复了她一如既往的微笑。战争让你成长成为大人了，阿丽娜这么想着，但是她不打算把这句话说给萨沙听。\n\n几分钟后，浮士德找到了车和司机，阿丽娜就这样出发了。由于红军的渗透作战比较成功，切尔诺伯格的大部分道路都没有被彻底毁坏，这辆轻型装甲车就如以前一样，在散落着零星瓦砾的道路上穿行。\n\n“长官，你们要去的是那个彼德海姆中学？”司机把着方向盘，对着坐在后排的阿丽娜和浮士德说话。\n\n“司机同志，不用叫长官，红军的所有人都是平等的。”\n\n“哎呀，对对对，旧习惯一直改不过来。”司机笑着，拍拍脑门，“我以前就是在城里开卡车的，在你们以前，我都没见过不让人叫‘长官’的军队。”\n\n司机打着方向盘，转过一个弯，继续说着，“诶呀，红军同志，我想说的是，那个彼德海姆中学，情况可不好哟，听说那些兵痞子知道他们的老大没了以后，就在那个学校发了疯似的烧杀抢掠，他妈的，真是一群豚兽不如的东西啊。”\n\n“所以我更应该去那里。”阿丽娜一脸严肃，司机从后视镜里也能看到她低沉的眉心，“我也是一个老师，我要去看看那些学生的情况。”\n\n“啊呀，原来您是老师，我在你们来以前就听别人说了，你们红军是会给我们穷人上课的。以后我是不是也能和你们学点本事啊？”\n\n“当然了，同志。说起来，我还没问你的名字呢。”\n\n“哈哈，我叫列昂尼德，叫我廖尼亚就是。”司机憨厚地笑笑，然后在一座建筑物前踩下了刹车，“我们到了，这里就是彼德海姆中学。”\n\n“谢谢。”阿丽娜拉开车门，跳下车。眼前的彼德海姆中学一片寂静，几个红军士兵正在从教学楼往外搬运着遗体，大部分都是学生的，还有几具乌萨斯士兵的尸体，阿丽娜猜想他们是被反抗的学生杀死的。\n\n一个红军战士看见浮士德和阿丽娜，快速地向他们敬了个礼，然后小跑着来到他们面前，“萨沙队长，我们目前只发现五个幸存者，她们正在顶层的空教室，做初步的应急治疗。”\n\n“这几个孩子的名字是什么？”阿丽娜极力掩饰着内心的悲伤，她没想到幸存者的人数那么少。"
 event_reu.95.a: "“索尼娅、安娜、薇卡、拉达和罗莎琳。”"
 event_reu.96.t: "在春天之前"
 event_reu.96.d: "这是索尼娅在彼德海姆中学被接管之后，第一次哭泣。她以为死气沉沉的军事管制已经让她麻木，混乱之中的杀戮与求生让她更坚强，同伴的一个个离去让她变得冷漠，但是当那个自称“老师”的埃拉菲亚女性走到她面前，蹲下来轻轻拥抱住她的时候，索尼娅的泪水霎时奔涌而下。\n\n“如果……如果我没有搞那个该死的自治团，不带着同学们去做无聊的反抗，他们……他们是不是就……就不用死了……”\n\n阿丽娜轻抚着索尼娅的后背，在她的耳边轻声说着，“你没错，孩子。错的是那些士兵，是造成这一切的第三集团军，错的是乌萨斯，不是你。”\n\n“反抗没有错，你们只是选错了方式，而且你们都没有想到，敌人有多么恶毒和恐怖。”\n\n“你并没有害任何人。你不是还保护了四个同伴吗，孩子，你很勇敢。”\n\n索尼娅依然哭着，浮士德靠在门框上，他看见阿丽娜抱着那个孩子的背影，她在颤抖，她也哭了。这就是阿丽娜，浮士德想着，不像其他战士，在目睹了这么多东西以后，他们早已对牺牲和暴行麻木了。但阿丽娜不一样，她在经历过这些以后，依然会为她所看到的悲剧所哭泣，也许这就是老师应有的模样。\n\n“你已经做得很好了，好好休息吧。”阿丽娜松开她抱着索尼娅的手，帮哭泣的少女拭去眼泪，“我还要看看你的同伴呢，她们很坚强，她们都会没事的。”\n\n阿丽娜缓缓站起身，走向其他人躺着的地方。学生自治团的其他成员都因体力不支，无力地躺在红军战士临时用课桌搭起来的床上，接受着医疗小队的应急治疗。除了罗莎琳因为铳伤还要做临时的消炎和包扎之外，其他人都挂着红军在第三集团军手上缴获的葡萄糖注射液，已经睡着了。\n\n“看来没法和她们说话了。”阿丽娜苦笑着，走出了空教室，“浮士德，我有事和你说。”\n\n浮士德愣了一秒，阿丽娜很少用这个名字叫他，这意味着等会要说的可能是公事。缓过神来以后，他急忙走到阿丽娜的身边。\n\n“这些孩子，给了我一个启发。”\n\n阿丽娜沉默了一会，她走到走廊上，捡起地上散落的一张纸片，上面画着一个拳头，环绕着拳头的，是“乌萨斯学生自治团”几个大字。\n\n“她们有反抗的精神，但是没有反抗的策略，因此在面对敌人时束手无策。我想，我们应该负起教学生们反抗的责任。我之后会向中央建议，设立一个新的组织，专门负责青年学生们的工作，不仅仅是根据地的学生，还包括敌人控制区内的。”\n\n“我会推荐你来做组织工作，毕竟你也年轻，更清楚青少年是怎么思考的。至于组织的结构，就参考她们的这个‘学生自治团’吧。”\n\n“呃，可是我听说，这种自治团好像都是模仿哥伦比亚的那种小混混结社……”\n\n“名字而已，可以改的嘛，我想……”"
 event_reu.96.a: "“……‘共产主义青年团’就不错。”"
 event_reu.97.t: "捉拿扎涅采夫"
 event_reu.97.d: "欢呼声响彻天地，被攻破的博罗努尔集中营全然不复往日晦暗压抑的姿态。那些曾经命悬一线的政治犯和感染者们都聚在一起，和攻入集中营的红军战士们一同庆祝战斗的胜利。\n\n但巴兰尼科夫不在欢呼者的行列之中，在攻下臭名昭著的死亡监狱之后他的战斗任务并未终结。\n\n他负责指挥他的排——全师甚至全集团军最精锐的侦查排搜寻典狱长扎涅采夫这个畜生的踪迹。为了加大搜寻的面积，他把自己的排分成两部，一部亲自指挥，一部交给排副。每个半排都是全火器部队，装备从乌萨斯军队手里缴来的火器，包括排长本人在内每个半排有四名自动枪手，六个步枪手，一个机枪手，一个副射手，一个神枪手和两个术士，此外，排副的那支队伍还要再多出一支机枪小队。\n\n他有信心，只要不碰上皇帝的内卫，无论什么高手给扎涅采夫那个畜生保驾护航都会被他的战友们打成碎肉。\n\n巴兰尼科夫领着半个排穿过集中营的街道，他们之前看到了一辆被烧光了的豪华轿车。本以为里面会有目标的踪迹，却发现车里只有一个被烧的面目全非的汽车司机。于是他们抛下这辆车，向着预计目标逃窜的方向前进——负责外围警戒的部队早已报告没有看到任何东西试图冲过集中营的包围，那个畜生目前肯定还在包围圈里。\n\n“桦树02，这里是桦树01”他拎起对讲机，“找到菟丝子了吗？完毕。”\n\n“没有踪迹，完毕。”副排长的声音传来。\n\n“他妈的，揍死那个畜生！”“打，狠狠地打！”巴兰尼科夫的库兰塔耳朵动了动，他似乎听见有人在叫骂着打死什么人。\n\n“同志们，跟我去看看！那边似乎有动静！”巴兰尼科夫一挥手，挎着冲锋枪一路小跑就冲了过去，转过街道的拐角，他看见一大群穿着囚服的人围成一个圈，对圈里的什么东西又踢又打，时不时还有砖块和石头飞进去。\n\n“让一让，让一让同志们！”巴兰尼科夫拔高了嗓门挤过人群，进到了这个包围圈里。\n\n面前是一个被打得面目全非，勉强能看出人型的东西，身上穿着的无论是什么都已经被撕成了破布条，巴兰尼科夫靠上去用手一探——显然这个七窍流血的家伙已经死透了。\n\n“你们在打的是什么人？”他听到身后他的战友们发问，掏出口袋里的目标照片，巴兰尼科夫翻来覆去检查着这个玩意的脸。\n\n“伊万，那个疯狂的伊万！”身后的人群一阵喧嚷，在一位侦察排战士尽力的安抚下这一阵嘈杂终于安静下来，他听见有人骂了一句，“这个畜生该死，它还想逃跑，被我们揪出来打死了！”\n\n虽然已经被打成这副熊样，但他嘴里的那口被牙医用黄金补过的烂牙，以及五官的大致位置都和目标照片上的信息对得上，巴兰尼科夫确定了，这个人就是目标。\n\n“桦树02，我们可能已经发现菟丝子了，完毕。”\n\n一边说着，他一边试图从地上把这具尸体扛起来，就在他用手抓住死人的手臂往上拉的时候，他感觉到手感有些不对——就在他试图背起尸体的时候，尸体的手臂弯成了好几节。\n\n于是他放下这个尸体，再启动对讲机\n\n“桦树02，来的时候弄个担架来。”"
 event_reu.97.a: "“恐怕我们得公审一个被打烂了的死面口袋。完毕。”"
 event_reu.98.t: "告全国劳动者书"
 event_reu.98.d: "自骏鹰帝国解体，乌萨斯建国以来，已经过了一千年了。\n\n乌萨斯帝国曾经以反抗骏鹰的压迫为旗帜，击败了剥削无度，压榨人民的神民，不论城市还是荒原，不论黑土地还是永冻土都流传着这个古代传说，这些古代传说到乌萨斯推翻了恐怖的骏鹰帝国，建立起了一个新的国家之后就戛然而止。\n\n乌萨斯也许曾经是一个勇敢的名字，它也许曾经象征了对压迫和残暴的反抗——但若是一个骏鹰今天生在乌萨斯的国土之上，它会看到什么呢？\n\n它会看到数以千万计的农奴，哪怕在最肥沃的黑土地上劳作，他们所得也不过保证不成为饿殍，而他们中冻饿而死的每年都不计其数；它会看到那些工厂里的工人在雷鸣一般的轰鸣中一天工作十六个小时，只是为了养家糊口，当他们终于有一天疲惫不堪到把手放进机器里的时候，厂长就会把他们像是破面粉口袋一样丢出大门，一个工人活过四十岁就可以说是上天保佑；它会看到暗无天日的矿场，那些因为贫穷而买不起任何保护的人，一旦被源石感染，就会被像怪物一样被流放到这里，在这里他们没有食物、服装、医药、休息，他们在这里被强制劳作，挖出源石来维持圣骏堡老爷们的纸醉金迷，而他们自己平均七年就会送命；它会看到沙皇的税警带着刀枪招摇过市，榨干穷人口袋里的最后一枚分币；它会看到这个帝国的将军们花天酒地的同时，麾下的士兵们连吃饱都是个问题。\n\n它会看到这样一个怪物，这个怪物有着永不停歇的扩张胃口，有着无数吃不饱穿不暖的黎民百姓，这个畸形的怪物用它麾下的官员、警察、军队、包税人等种种手段趴在劳动者的身上，奴役他们来供养自己，在它的爪牙下，劳动者从人变成奴隶，最后一滴血汗都被压榨的干净。\n\n那个骏鹰一定会熟悉它的，它会立刻尖叫起来——骏鹰帝国，原来你在这里！\n\n对这个不合理的帝国，这个令人作呕的怪物的愤怒愈演愈烈，乌萨斯需要这样一场革命，像它毁灭腐朽丑陋的骏鹰帝国一样，这个腐朽丑陋的国家也必须被正义的力量毁灭！人民的愤怒可以粉碎骏鹰帝国的皇帝，一样也能粉碎乌萨斯的沙皇！\n\n我们是远东冻土上的游击队，是他们畏惧的赤色威胁，我们是农民的镰刀，是工人的铁锤——我们就是整合运动，我们是为全国的解放而战的力量。我们在这里呼吁全国劳动人民，呼吁全国的农奴、工人、无地农民们站起来，团结起来，和乌萨斯这个怪物开战！我们将团结一心，砸碎沙皇的锁链，创造全新的世界！\n\n今天我们解放了切尔诺伯格，明天我们就将解放整个乌萨斯！"
 event_reu.98.a: "“全国的劳动者们，联合起来！”"
 event_reu.99.t: "SerB酒馆的普通周日"
 event_reu.99.d: "“老板！再来一桶伏特加！并……并半普特腌肥肉！”\n\n“好！”SerB酒馆的老板谢尔盖听了这声吆喝，晃晃悠悠的从柜台下面抱起一个大木桶，连声应着工人的吆喝，“马上……就来！”\n\n这是谢尔盖的一个普通的周日，每当这个时候，连轴十六小时工作的乌萨斯工人们会一起涌进这间小酒馆，大嚼家常菜配那些劣酒，顺便痛骂老板、警察和官吏来开胃，这时候平日清闲的酒馆也会突然忙碌起来。\n\n而今天，谢尔盖格外忙碌——长期拖欠工人工钱的老板终于还是服软了，给他们结了薪水，罢工的工人们在这间酒馆庆贺自己来之不易的胜利。\n\n“老板！收音机忘记开了嘛！”工人们又起哄起来，赶着应付主顾们的谢尔盖确实忙中出错，放下伏特加桶就赶忙跑去开收音机。\n\n收音机里似乎多了一个新台，工人们起哄要听听内容。\n\n收音机里没有乐曲，取而代之的是一个铿锵有力的声音——“乌萨斯也许曾经是一个勇敢的名字，它也许曾经象征了对压迫和残暴的反抗——但若是一个骏鹰今天生在乌萨斯的国土之上，它会看到什么呢？”\n\n这个问句吸引了所有人的注意力。\n\n那个声音用一连串的例子痛斥着乌萨斯帝国正在生吞活剥自己的百姓，痛斥它的行为和历史传说里的骏鹰帝国别无二致。\n\n一时之间，工人们沉默了，一直到整段播放结束，广播频道里传来一些其他的声音，那些声音用天南海北的口音哭诉着自己的遭遇，哭诉着自己被剥夺的土地、被拖欠的工薪和被轧毁的肢体，哭诉暗无天日的矿道、灰皮畜生的刺刀和威逼。\n\n谢尔盖也在沉默，紧接着是愤怒，那些趾高气昂的警察和税吏也一样威胁着他的生意，而如果那些厂长们持续拖欠工资，失去主顾的小酒馆也会关门大吉。\n\n那天他们听了很久很久，感觉有什么东西在心里燃烧，他们一直听着广播，直到一个机灵的工人跑进来报信，说他看见一群披着灰皮的沙皇警察正在挨家挨户的搜查有没有人在收听一些不能收听的东西。\n\n前脚谢尔盖关上收音机，后脚沙皇的灰皮狗就冲进酒馆里驱散了喝酒的人群，他们趾高气扬的命令谢尔盖把门关上，酒馆打烊了，望着一片狼藉谢尔盖只是叹气。\n\n很普通的一个礼拜日，但在谢尔盖和他的帮工收拾完酒馆，准备去睡觉的时候。\n\n他失眠了，他辗转反侧，心里有什么好像在燃烧。"
 event_reu.99.a: "越想越气"
 event_reu.101.t: "注意！坦克"
 event_reu.101.d: "乌萨斯西部方才化冻的冻土上，一眼望不到头，插着红旗的坦克和步兵战车一个个飞过泥泞的原野。从东边到西边，穷尽人的目力也无法看到进攻锋线的两端。\n\n“斯拉维克，我们快要到了，继续下命令吧。”\n\n“嘿！斯拉维克？斯拉瓦？连长？”巴兰尼科夫的副连长，一个白毛的乌萨斯花了好些力气才把巴兰尼科夫的魂儿叫回来。\n\n老实说，巴兰尼科夫打心底就从来没有喜欢过坦克。他还是个小库兰塔崽子的时候，他就梦想着在陆行舰上当个船员。这一点也不奇怪，有哪个乌萨斯小孩不会在听闻乌沙科夫将军的事迹以后不梦想着成为一位伟大的舰队司令官呢？那可是乌萨斯帝国在陆行舰时代最伟大的将军，他麾下的陆行舰打得萨尔贡人落荒而逃，闻风丧胆。在小巴兰尼科夫的梦境里，他总是站在战舰的舰桥上，穿着金线和毛绒制成的大衣，指挥着自己的舰队拉成战列线，冲杀得敌人片甲不留。\n\n具体的敌人不重要——高卢人，维多利亚佬，魔族，萨尔贡……什么都行，他的舰队会杀进去大获全胜，巴兰尼科夫会和乌沙科夫一样成为乌萨斯人的骄傲。\n\n直到后来，巴兰尼科夫真的当了军人，他才知道早就没有陆行舰大战了。只剩下坦克，坦克，坦克，还是坦克。这些圆头圆脑的小东西代替了那些庞大的艨艟。四皇战争中各国的陆行舰队面对战场的无人区一筹莫展，那些勇敢（或者鲁莽）的乌萨斯舰队司令们试探性的派出的战舰没有一个能越过那被炮弹砸的遍地疮痍的，短短几公里的战区。\n\n在越过无人区之前，各种炮弹就会把它们化为废铁。当四皇战争爆发时，各国都以自己拥有多少战舰为荣，战争结束之后，只有地广人稀的乌萨斯还保存着一定量的战斗陆行舰，用来反制敌人在薄弱地带可能的舰队突击，或趁机劈入敌人空虚的阵地。\n\n当游击队夺下博罗努尔集中营的时候，他们曾缴获过一条小型陆行舰，当时他混进了接收这条船队伍里，站在舰桥上，平生第一次吹到了那里的风。他曾也做过这样的梦——也许他们会拥有一支庞大陆行舰舰队，那支红色的舰队将带着愤怒碾过帝国的疆土。\n\n他心里的另一部分知道这只是个不切实际的幻想，如果真到了能制造这种舰队的那一天，他们会先被装进那些圆头圆脑的铁罐头里，因为只有它们才能越过乌萨斯的冻土，把解放的消息连同125毫米炮弹一起塞进乌萨斯军队的嘴里。\n\n他早就想到了这么一天，只是没想到来的这么快。"
 event_reu.101.a: "“各步兵排，准备下车冲击阵地！”"
 event_reu.102.t: "苏维埃乌萨斯工人情报局关于乌萨斯全境解放战争的一点建议"
 event_reu.102.d: "……自东达利亚地区完全为我解放以来，全苏范围有关解放乌萨斯全境的意见日趋高涨，除各种信件、文艺作品、文章鼓动之外，亦反复出现多次示威抗议和请愿，要求完全解放乌萨斯——而白乌匪帮亦准备对我解放区之入侵，据多源消息证实，反动派军队已向边界区增派部队并准备物资，乌萨斯预计在90至120天内形成入侵我领土的初期作战能力。推测乌萨斯反动当局最迟在明年冻土翻浆期后即发动对我解放区的入侵行动，在此之前，其必然反复对我边境解放区骚扰试探我方反应，对我边境生产、生活秩序造成破坏，并试图获取我布防部队有关情报。且不排除有反动军官对我解放区发动军事冒险性质的入侵行动，以期提前引爆战争。以上，我局认为，乌萨斯全境解放战争已迫在眉睫。\n\n为此，我局建议，东达利亚解放区所有部队应提高战备等级至二级战备及以上，以压制乌匪军军事冒险之野心，把握开战时机之主动；充分进行群众动员，鼓励群众节约各种资源、延长劳动工时、提高劳动效率、踊跃报名参军以支援红军部队；增派更多情报资源于我与白乌匪帮接壤一线，以对白乌匪军移动城市、机场、交通枢纽、装备集结地、弹药仓库等重要节点进行提前标注和跟踪，提高我红军战争首阶段的战斗效率。\n\n此外，根据东达利亚解放战争之经验，我局将在未来一年内努力完成如下战争准备——联络白区工人阶级，策动工人阶级在必要情况下怠工、罢工甚至起义，以削弱白匪帮战争能力；联系各受乌反动当局压迫的少数民族地区，说明我方之民族政策，请求其采取各种手段，在战争开始后策应我方之行动；镇压混入我解放区的反革命分子，防止白乌匪帮第五纵队危害我解放区及我革命军队。"
 event_reu.102.a: "“以上，向您致以革命的敬礼！”"
 event_reu.103.t: "疯狂星期六"
 event_reu.103.d: "切尔诺伯格州人民政府告全州人民群众书\n\n同志们！公民们！随着东达利亚的解放，乌萨斯全境解放的曙光已在前方！然而，白匪军正蠢蠢欲动，企图用钢铁和炮火扼杀我们的革命成果，妄想把他们反动的绞索再次套上我们的脖颈，然而，他们休想！\n\n我们英勇的工人阶级会告诉他们，我们绝不同意！\n\n如今，这场战争已到决胜的最后关头，乌萨斯解放的未来和压迫的未来正在作最后的殊死搏斗，在这个万分危急的关头，我们前线的战士们需要更多的弹药、武器、粮食、被服，需要一切物资。这都要依靠我们的双手生产出来。\n\n在这决定乌萨斯命运的时刻，我们号召：全切州的每一个工厂、每一个农庄都在周六行动起来！由全州共产党员、共青团员和各级干部带头，在每个周六延长工作六小时，不计报酬，牺牲我们自己的休闲时间，支援前线的斗争！\n\n让我们的机床多生产一颗炮弹！让我们的田野多收获一袋粮食！让我们的街道多一分整洁！让我们的医院多一张病床！让我们更接近一步胜利！让白匪军在我们无产阶级的力量面前颤抖吧！\n\n切尔诺伯格州人民政府\n\n州党委第一书记П.С. 彼得罗夫\n\n州苏维埃主席А.И. 伊万诺娃\n\n州工会主席В.К. 谢尔盖耶夫"
 event_reu.103.a: "“一切为了解放，一切为了胜利！”"
 event_reu.104.t: "跨过卢比孔河的新方法"
 event_reu.104.d: "乌萨斯的冻土和落雪，自古以来似乎都是乌萨斯的名片，那些外国人来乌萨斯的时候，总是盯着她广袤的大地，谈论这些土地的壮丽，但只有乌萨斯人自己才记得乌萨斯的河流，那些河流。\n\n宽阔、湍急，在春天融雪时咆哮，在冬日严寒中封冻。自乌萨斯的伊戈尔皇帝反抗骏鹰帝国的统治开始，乌萨斯领土上那些纵横交错的天堑就一次次的反复作为压迫者或解放者的天然堡垒被应用着。起义者曾在大河两岸折戟，帝国的军队也曾畏惧过奔腾的激浪。就算是陆行舰队也不得不对这些河流退避三舍。\n\n大河，兀自奔流的大河。每当夜深人静之时，博卓卡斯替无数次质问自己。如果站在河边的是他，他会做的比历史上那些人更好吗？红军的力量也会被河流阻挡吗？那滚滚浊浪会像带走骏鹰的帝国一样带走乌萨斯苏维埃的将士吗？\n\n他必须想办法越过乌萨斯的河流，红军必须能跨过这奔腾的天堑。但这实在是个工程问题，而工程问题有一点好——那就是技术可以解决的问题就不是问题。\n\n当架桥车和机动桥的轰鸣彻底压过大河的咆哮，当步兵战车带着一往无前的气势冲入河流，当工兵不再需要砍伐木材制造木筏和桥梁，只需要坐在驾驶舱里操纵液压手柄，当第一辆坦克全速越过浮桥，消失在河对岸的地平线上。\n\n当整个师用前人未敢想象的速度越过河水，仿佛只是越过一个微不足道的的水沟。博卓卡斯替发现自己多虑了。红军已超越伊戈尔大帝，超越这片土地上古往今来的一切压迫者和反抗者。"
 event_reu.104.a: "“我已越过卢比孔河。”"
 event_reu.105.t: "在入土前先站直"
 event_reu.105.d: "东达利亚漫长的游击战争，卡兹戴尔没有尽头的革命烽火锻造了红军坚定的精神与深刻的阶级意识。然而，当革命的烽火从无边冻原化为城市街头的呐喊，再到如今席卷大半个乌萨斯大地的激流，站在这样一个解放全国之日的边沿……我们必须再次转变方向。\n\n我们曾是分散而致命的雪怪，是坚毅而刚强的剑士，我们擅长在冻土和荒原上同我们的敌人周旋，用我们的意志和我们的人民同敌人搏斗到底。\n\n但我们决不能只是这样的散兵游勇。乌萨斯帝国有百万大军，妄想着像扼杀十一月党人起义一样将我们的解放区吞并，面对这样正面展开之敌，传统的战术——化整为零，游击运动不能为我们带来胜利。东达利亚解放战争一次次的告诉我们，游击战术和发动群众自有其作用，却也有它的极限，当反动派将我们的城市化为他们野战部队活动区中的孤岛，当反动派屠戮村落散播绝望，我们必须报之以正面迎头痛击。\n\n从十一月党人失败的远东起义，到被迫战略转移的卡兹戴尔红军，再到我们险些覆灭于冻土上的游击队，历史一次次给了我们教训。我们必须从革命的游击军，转变为革命的野战军。工农阶级的幽灵必须变为工农阶级的锤砧。我们要以步兵师为骨肉，以航空兵为双眼，以装甲师为铁拳，在统一的指挥下粉碎他们。\n\n我们指挥员的头脑里必须装着从乌萨斯最北到最南的宽大阵线，我们的战士必须懂得从一切可能的地点和方向敌人进攻，我们拥有乌萨斯历史上一切革命者都未曾拥有的强大力量，我们必须团结一致，学会如何撕碎敌人的正面阵线，劈入他们纵深的薄弱点，在整个漫长的正面上彻底粉碎白匪集团。\n\n白匪军正在集结，他们还以为我们仍是他们幻想中东达利亚的散兵游勇，他们以为我们只是不敢正面交锋的游击队员，他们做着镇压十一月党人起义的白日梦，幻想着用一次庞大的、教科书式的正面进攻，将我们推回山里，推回地下，幻想着让他们令人作呕的帝国千秋万代永远持续下去，让他们来吧。\n\n驼子的脊背只有入土才会变直。但我们不会入土。"
 event_reu.105.a: "“把旧世界彻底送葬。”"
 event_reu.106.t: "铁翼生风"
 event_reu.106.d: "喷气发动机呼啸着，一对歼击机在跑道上滑行。\n\n“铁鹰，这里是场站，你已越过起飞决断点，祝你好运！”\n“这里是铁鹰01，收到。”\n“……这里是铁鹰02，收到。”\n\n年轻的飞行员紧握着操纵杆，不时瞟着领头的长机。飞上天空，成为飞行员，自由翱翔……在仅仅四五年前，这一切似乎都和那个鞋匠的儿子伊利亚毫无关系。\n\n他是个鞋匠的儿子，被父亲取了个大地勇士的名字，在教会学校念书，父亲希望他将来能当个神父，如果成绩不行，那就和父亲一样去做个鞋匠。恐怕父亲的希望要落空了，毕竟他对宗教和上帝不能说是没有兴趣，只能说是一点兴趣也没有，而对做鞋的手艺，他的兴趣也只比对上帝的兴趣多那么一点儿。至于这个大地勇士嘛……比起打架，他其实更喜欢读书。\n\n在诗歌和书籍中遨游的间隙，他偶尔会看向天空，东达利亚的晴空宁静高远，冬季呈现出冷淡的灰青色，夏季则好似最顶级的群青。那片天空属于想象力，属于诗人的咏叹，属于神话中的英雄和老爷们的飞机。可却从不属于他。\n\n直到红军来了，他们开进贝加尔延达谢斯克的大街，把那些握着粮食和工厂的老爷吊死或扔进荒原。有一天，红军来了那所教会学校，发下一些问卷，收卷的间隙，他们问有没有人愿意参军。\n\n“我们需要一些脑袋够机灵，身体够强壮，眼睛够锐利的小伙子。”\n“要干嘛呢？”他问。\n“开飞机。这位公民，我看您各方面条件就不错，有没有兴趣试试看？”\n他点了点头，这工作比鞋匠和神父都好多了。\n\n于是他啃了十几本不讲人话的教材，将教具模型攥在手上盘到包浆，坐在师傅的教练机上一次又一次升上天空以及被师傅怒骂，把如何操纵这金属双翼练成了第二本能。大地勇士成了苏维埃的雏鹰。\n\n“铁鹰02，你小子下次回话机灵点儿。”师傅的声音在无线电里响起来：“老是这样呆呆的，以后可别说你是我学生。”\n\n这是他第一次放单飞，下次不会了。"
 event_reu.106.a: "“轮胎离地，此处通往天空”"
 event_reu.107.t: "学习如何战争"
 event_reu.107.d: "前线指挥所里烟雾缭绕，近乎难以呼吸，计算机显示屏投出的冷光打在来来往往的通讯兵和参谋们的脸上，人的声音，电子设备的声音连同外面发电机的声音交杂在一起，混合成一片嗡嗡作响。\n\n理论上，演习已经宣告结束，师长瓦西里·彼得罗夫的红军已经拿下了胜利，尽管付出了超过一半兵力“伤亡”的代价，但红军已经完成了原定的目标。但他还是没法放下。\n\n“太糟糕了。”两天一夜没有合眼的师长同志就那么怔怔的看着地图，念念有词。\n\n“太糟糕了。”他的师有将近一半的兵力是临时征召的预备役，在区区两个月之前，他们还只是一群农民和工人。作为一个步兵师，他的任务似乎只是作为装甲师的后卫，夺占装甲突击中夺取的土地，阻拦敌人装甲兵的进攻——可问题就在于，至少根据他收到的报告，他的师连这种任务都干不好。\n\n两个月的军事训练教会了这些前民兵如何挖掘标准的防炮掩体，如何在荒原里辨别方向，安设反坦克炮和导弹，用步枪射击，坐在卡车上行军而不掉下来。但光会这些是不够的，面对蓝军装甲部队的模拟冲击，他麾下许多新兵单位堪称一片混乱，反坦克小组在压力下忘了怎么射击，步兵在炮火准备后迟迟不敢离开掩体发起反冲击，在模拟城市和村庄环境中这些新兵们的表现更是一塌糊涂。\n\n乌萨斯的装甲兵——在师长的预想中一定要比蓝军单位的进攻更猛烈，而这些勉强及格的新兵蛋子根本不可能拦住。唯一的好消息是，在演习的压力中，许多新兵和老兵总结出了些自己的窍门，无论是新的伪装射击阵地方法，还是单纯的想出了一些维护卡车和火炮的小花招。让他们多多交流，也许这个师的战斗力还能再提一提。\n\n事到如今，死库兰塔当活库兰塔医吧。\n\n“让各个单位好好开开战后总结会，有什么经验教训，就大大方方的说出来。”师长走出指挥所，狠狠地吸了一口相对干净——尽管还是一股液化源石味的空气。"
 event_reu.107.a: "“我们的时间不多了。”"
 event_reu.108.t: "子夜之前"
 event_reu.108.d: "“你们这帮混蛋！要拿走粮食，就从我的身上踏过去！”\n\n年老的乌萨斯伏在一袋燕麦上，几个农民打扮的乌萨斯人也或是拿着农具，或是拿着老式武器，和另一批穿统一制服的人对峙着。\n\n“狗日的纠察队！”\n\n……乡亲们不愿意交粮食，因为征粮队总是把除了口粮以外的粮食都带走，村支书瓦西里一直都知道。不想交粮食，乡亲们私下里都叫征粮队是纠察队，瓦西里也知道。乡亲们没那么老实，分了地和生产工具以后就做着当富农老爷的美梦——瓦西里还是知道。\n\n空气近乎凝滞了，瓦西里单薄的衣服一下被自己的冷汗浸透，征粮队和老乡们面面相觑，谁都没有动，也没有说话。\n\n“呜哇——”一声男孩的哭声划破了寂静，是斯捷潘大叔家的小万尼亚。\n\n“各位，听我说！”瓦西里自己似乎都听不清自己的声音：“各位！我也是种地的，我知道，没人愿意把辛辛苦苦种的粮食白白交给别人。”\n\n“可是，我想请各位想想看——乌萨斯帝国还在的时候，我们一年忙到头，几时能留下这么多粮食呢？红脑壳们是要收粮食，可收粮食也是为了前线能好好打仗，要是以前的老爷们来了，这些粮食难道我们就能留下来吗？”\n\n斯捷潘大叔从喉咙里挤出声音：“那老东西会把我们的粮食全拿去卖，换成大把大把的钞票……”\n\n“你们都听说过的，乌萨斯那个混蛋皇上要打回来，要是皇上回来了……”\n\n瓦西里狠狠吸了口气，定了定神：“再说了，苏维埃的命令是在战争结束之前收集所有余粮，等我们打败了乌萨斯帝国，就不用再交这粮食了！”\n\n“你敢保证吗？”\n\n“我保证不了。”瓦西里叹了口气：“我也是个种地的，我拿什么保证明天的事？但我可以保证，我们这里的每一袋粮食，都会运出去，变成口粮，变成子弹，把白匪军挡在外面！到我们打赢了，如果还有人这样……我也会和斯捷潘大叔一起挡在粮食前头。”\n\n人群叽叽喳喳，吵吵嚷嚷，终于从粮食袋前移开。征粮队员们对视一眼，沉默着上前把粮食抬上车。而瓦西里强撑着走回家里，扑腾一下瘫倒下来，大口喘着气。"
 event_reu.108.a: "“希望……希望苏维埃说话算话。”"
 event_reu.109.t: "新时代的戏剧"
 event_reu.109.d: "玛莲娜未曾想到，这位在外界眼中无比严肃的编剧竟然这么健谈。但相比于这点，令年轻记者更为惊讶的是，叶万德·库里尼扬编剧的知识面还出乎意料地极其广泛。她最初还在同这位富有学识的戏剧人谈论关于他专业，也就是戏剧相关的事情。可不出几分钟，话题便转移到了地理学，进而又到了她根本不了解的萨尔贡语相关知识。看了眼表，玛莲娜才意识到她竟然这就花掉了半个小时用在闲聊上面。\n\n“不能这样继续下去了。”玛莲娜如是想到。说来也巧，当想到这点时，库里尼扬刚好停下了他的舌灿莲花，而是举起茶杯，微微抿了口其中的古怪饮料。好吧，之所以不将它称作“茶”主要是因为这饮品十分诡异地泛着股蘑菇味。玛莲娜想，它也许是某种地方性美食，或者说干脆就是这位编剧一时奇思妙想的产物。\n\n但无论如何，玛莲娜趁着库里尼扬在将它喝下去前便以一句话打断了这个进程：“所以，库里尼扬先生，我们可以谈谈关于在今日将于新东达利亚市演出的那则戏剧的事情了吗？”\n\n“那则戏剧？”编剧轻轻地将茶杯放下。“你是说……《柯西切之死》，对吧。”\n\n“是的，库里尼扬先生。”玛莲娜做出一个职业式的微笑，这是她的招牌表情。“我想谈的是，您出于什么考虑要转变一贯的风格，从您擅长的古典式戏剧转向现代主义的风格？是因为您有了新灵感，还是说希望能够来点‘自我超越’？”\n\n“不，都不算是。”库里尼扬又端起了茶杯，记者注意到它的底部似乎缺了一块。“我没有那么高深啦，其实都是中央的缘故。党在上一次会议中说要支持革命题材的艺术，鄙人作为小有资历的人民艺术家，自然也要跟进。所以说，我当晚就去机关图书馆里恶补了党史。然后，您猜怎么着？”\n\n“很显然不用我猜，您偶然翻到了主席早年时候的经历，或者看了她的回忆录之类，于是就有了灵感。”\n\n“当然。”库里尼扬一脸自豪。“那段简直就是个现成的舞台剧剧本！鬼知道旧贵族礼仪到底给人培养成了什么样的说话风格，塔露拉主席在当年和柯西切公爵的对话简直可以原封不动地放进戏里。说到这个，我们不如谈谈我一些远大的想法吧，比如说电影改编之类——个人觉得这部戏就很不错……”\n\n望着库里尼扬再度开始喋喋不休，玛莲娜叹了口气，也许她是时候早点说句客套话，然后离开这里了。"
 event_reu.109.a: "这兄弟到底有几张“备用嘴”？"
 event_reu.110.t: "不了，同志"
 event_reu.110.d: "这是一个晴朗的早晨，伴随着起床号音，瓦西里耶维奇同其他战士一样收拾好属于部队的各类物资，将它们一一收进那些板条箱中。并在最后排列整齐，准备离开这个他们已经驻扎了半个月的村庄，奔赴更需要这支部队的地方。望向远处那第一缕升起的炊烟，瓦西里耶维奇想起了许多。\n\n当红军最初在动乱中接管这座村子时，当地可谓饱受战火摧残。以至于诸多房屋被夷为平地，田上的苔麦尽数枯萎，甚至连村边小溪都充满了血腥气味。当地群众对红军的眼神也充满了警惕与不信任，生怕他们不过是又一支打着好听旗号的军阀私兵。然而，红军的实际行动却一步步地打消了人们心中的疑虑。从政委、指战员、到每一位普通士兵，他们都在为村庄的重建奉献自己的一份力，而瓦西里耶维奇也在为将那些暴尸荒野的可怜人们重新安葬的行程中大大帮助了村民。\n\n最终，随着村庄可算回到了可以勉强运作的状况，而党组织也搭建完毕，瓦西里耶维奇和他的同志们也是时候离开这儿了。“说真的，我不知道为什么感到有点不舍。”他将步铳背上，叹了口气。\n\n“我也有点，兄弟。”一位站在前排的战友趁政委背身时回过头来，附和道：“这里的乡亲们都是好人呐，我有点怕如果我们走了，他们再遇上个天灾人祸的又该怎么办。”\n\n“是啊，也许他们应该去一座移动城市上的农业地块？”瓦西里耶维奇随口说道，而就在这时，一位农妇的身影来到了他的近处。\n\n“大人……哦不，同志。咱实在找不到东西报答你们的恩情咧！这点咱珍藏已久的老酒，要不你们拿去吧！”\n\n瓦西里耶维奇一眼便认出了眼前的那位大姐，她是村子扫盲班里那个总改不掉说话习惯的叶夫罗西娅。而看着她怀中捧着地一整箱伏特加，他不由得咽了口口水。可在短暂的冲动后，理性很快又重新占据了上风。他明白，这些东西他不能拿，任何人也不能代表红军收下这份礼物。于是，他赶忙挥手谢绝，试图说服大姐留下那些酒：“不了，同志！我们人民的军队不拿人民半个切尔文，这是政委同志教我们的。您还是继续让它们待在酒窖里吧——毕竟老酒才醇吗！”\n\n“别客气！别客气啊！”叶夫罗西娅最初以为这不过是客套话，可见那小伙子的头已经快要摇得比直升机叶片还快，她还是最终放弃了。农妇搬着那箱酒回了她的家，而红军战士们则就离开了这座村庄。"
 event_reu.110.a: "红军永远为人民！"
 event_reu.111.t: "流水线上的人民炮弹"
 event_reu.111.d: "在马特伊舍夫眼里，这帮军人仿佛是从地里冒出的一样。就在这个晴朗的上午，他本应当在炮弹生产线上劳动，可却被大喇叭喊到了门口集合，然后便看到了如今面前的这一幕。一位戴着大檐帽，政委模样的男人站在演讲台上，而几位同样身着制服的士兵则在两旁持铳护卫。马特伊舍夫挤过人群，勉强找到一个还算合适的立足之处。他刚想发声牢骚，可这时，那个演讲台正中央的指战员却开始了他的演讲：\n\n“各位工人同志们。”他拿起演讲稿，一字一句地说道：“我们来到这里，是出于党和国家的指示，也是承载着人民的伟大寄托。依据政治局最新作出的决定，在如今这个革命正面临重大转折的时刻，平常状态下的管理制度已然不再符合事实情况。而正是为了解决这个迫在眉睫的重大问题，中央已经批准由红军派遣军队干部，监督工厂生产并采取军事化管理制度。”\n\n听闻此言，台下的人群之中涌起了一股骚动。\n\n有人小心地问道：“未来会恢复到以前的制度吗？我不想一直把被子叠成四方！”\n有人直呼：“政治局里那帮子人真清高！让他们军事化一下试试？”\n而有人则更加直接：“去你的！老子要到事业单位干活！”\n\n一时之间，场面显得十分混乱，马特伊舍夫险些被挤得摔倒。而那指战员也察觉到了工人们的情绪，赶忙临时补充发言道：“同志们，快冷静下来！我这里所说的‘军事化’管理没有那么夸张！它并不意味着每个人都要如同军人一样执行严格的生活标准，其最大的意义在于加强是生产的纪律性及与前线的紧密团结——还有，那位先生。再骂中央，保卫部可能就要来调查你和反动分子们有没有关系了。”\n\n听闻此言，人群中可算稍稍安静下去了一些，大声喧哗转为了窃窃私语，而马特伊舍夫也再度找到了个稍微宽松些的落脚点。他依旧对这场改制难有信心，但至少抵制之心在指战员的澄清之下稍稍减了半分。"
 event_reu.111.a: "必要的小小牺牲。"
 event_reu.112.t: "人民社长（一）"
 event_reu.112.d: "坐在大棚边的土坡上，帕维尔·戈鲁申科望着远方那冉冉升起的太阳，以及在其照耀之下显得更加耀眼的苏维埃红旗。如往常般，他再度举起伏特加瓶，像每个真正的乌萨斯人一样灌上了一大口。戈鲁申科本不是一个爱感伤的人，可当唇齿与酒精相触之时，他仍想起了很多。那时，他还不是这家合作社的领导者，也从未想到自己有一天会走到这里。\n\n“场长？”正当戈鲁申科边闷伏特加，边追忆过往之时，一个声音自不远处响起。“您在这儿做什么啊？就这样坐在土坡上，不怕裤子还有尾巴脏掉吗？”\n\n来者是一位年轻人，穿着身虽有脏污，但仍显得十分精神的连身制服。可望向他的面孔，戈鲁申科却死活想不出此人的名字。但为表示礼貌，他还是勉为其难地开口：“可能是你的印象问题吧，我们乌萨斯族尾巴没那么长，就跟卡特斯似的只和个小绒球一样。”\n\n“我知道这个，场长……”年轻人说道，他不知从何处拿出了把小折叠椅，将其放在了离戈鲁申科差不多远的地方。“每次从宿舍出门，往农场去的路上，我老是看见您在这儿喝些什么。——所以，我今天才早起了半个小时，来向您请教您到底为何老爱待在这里。”\n\n“没啥事，不过是在回忆些每个中老年人都会有的往事罢了。等你到了年纪，自然也能体会到这种感受。”戈鲁申科笑了笑。\n\n“也许吧。”社员说道。“对了，向您做个自我介绍：我叫安德烈·尤里耶维奇·米列舍夫，不久前刚加入合作社。”\n\n“幸会——这话会不会说得有点晚了。”戈鲁申科笑了笑，与安德烈握了握手。\n\n“这个故事该从哪里开头呢？你想从我还在别列卡的时候谈起，还是直接讲到东达利亚之后发生的那些事儿？”戈鲁申科长长地呼了一口气，随后说道。"
 event_reu.112.a: "“但无论如何，一切还都要从那个‘国立工程学院’讲起……”"
 event_reu.113.t: "人民社长（二）"
 event_reu.113.d: "“每当看见像你这样的年轻人，我都会想起那段时光啊，尤里耶维奇。”戈鲁申科感叹道。“那年在工程学院毕业的时候，我刚好二十岁整，正属于是风华正茂的年纪。虽然现在的生活也还行……但对我而言，那时候才是真正最美好的日子。”\n\n“那您后来又为什么来了东达利亚呢？”安德烈鲁莽地打断了戈鲁申科，可他在说出这句话后不久便意识到自己似乎选错了时机。\n\n“别急，先等我讲完这段。”戈鲁申科摆了摆手。“那时的我是多么幸福啊！既面向着拥有无限可能的伟大前程，又有着在当下富足的生活，与美满的亲情、友情、爱情三大丰裕——特别是最后面那个。当年，我与我的的女朋友，也是后来的妻子一同创业，卖草莓的生意那叫一个兴隆。只可惜，我们遇到的年份有点不利。因为生意最红火的那年，发生了些……不可抗力。”\n\n讲到这里，帕维尔·戈鲁申科眉飞色舞的表情骤然变得冰冷。“意外总是来得比预料快。大约是70年代的时候，集团军们造反造到了旧帝国的核心区域，而我爱人也在当时意外失踪，生死不明。那时候的人们都说，生死不明和死掉其实没什么区别。而当战争结束，我可算能够回到家里而非躲在难民营里避难时。朋友告诉我，她的遗体被找到了，在一座乱坟坑里……”\n\n“……然后发生了什么？就像你知道的那样：我的生意全完了，亲朋好友几乎都死光，老家还成了一片被炮弹炸得坑坑洼洼的准荒原。于是，我就只好带着仅剩一点的家产背井离乡，最后到了东达利亚。要我说，咱能到今天这个‘算是能过’的地步，还真得感谢苏维埃。要是这地方仍归军阀们管，你说咱们能有今天的生活吗？”当拼上属于他故事的最后一块拼图时，戈鲁申科如释重负。\n\n“真是不吐不快啊……”曾经的商人，如今的“人民社长”，帕维尔·戈鲁申科缓缓起身，并对安德烈说道："
 event_reu.113.a: "“不过现在，是时候开始真正属于我们的一天了。”"
 event_reu.114.t: "萨卡兹红军归乡"
 event_reu.114.d: "随着点名与整队结束，最后一箱货物被载上汽车，康拉德·克内希与她所领导的萨卡兹红军已经做好了重返卡兹戴尔，解放故土人民的万全准备。“真没想到我们会在这个时候说再见……”塔露拉·雅特利亚斯依靠在一棵云杉边上，默默对康拉德说道。\n\n“再过不久就要启程了。”康拉德·克内希整理了一下衣领。“如今卡兹戴尔军事委员会的控制正摇摇欲坠，各地叛乱四起，而根据红军所能搜集到的消息，我部在卡兹戴尔境内继续进行长期斗争的同志也发起了暴动。我同样为双方的分别感到遗憾，但当下正是回到卡兹戴尔，再度发起革命的最时机，截然不能耽误。”\n\n“祝愿我们两国的革命都能够圆满成功吧。”塔露拉的眼神中流露出一丝期许。“康拉德小姐，我能够说相当感激您和卡兹戴尔红军对我们的帮助。从救下阿丽娜同志，再到协助我们进行社会主义思想建设与根据地发展，如果没有萨卡兹同志们的同心协力，我们根本走不到这一步。”\n\n“其实这更应该说是‘互助’，而非我们单方面的帮助，塔露拉同志。换位思考来看，卡兹戴尔红军如果在当初没有得到整合运动的接纳与合流，也未必能够积攒到如今这样足以重新发动武装斗争的实力。”康拉德说道。\n\n“时间不早了，我们也是时候启程回到卡兹戴尔了。再见了，塔露拉同志，还有各位乌萨斯的同志们，大家未来再会吧！”\n\n说完这句话后，康拉德·克内希最后挥手告别。随着她的身影，以及卡兹戴尔红军的队伍逐渐消失在地平线上，东达利亚雪原上的一切又再度回归平静。"
 event_reu.114.a: "一路顺风，我的同志！"
 event_reu.115.t: "又一次的苦涩滋味"
 event_reu.115.d: "自那次分别过后，塔露拉已经快忘了她有多久没有见到康拉德·克内希与她领导的萨卡兹红军战士们了。可随着零星关于卡兹戴尔红军落败的消息传来，以及克内希亲笔信件中提到在卡兹戴尔武装斗争的节节失利，塔露拉不禁开始担心起这位萨卡兹同志的状况究竟如何。而随着卡兹戴尔红军的队伍又一次在如今出现在她眼前，这份担忧显然已经走入现实。\n\n在与康拉德·克内希与卡兹戴尔红军们的交谈中，塔露拉才明白那些传言与信件中的描述皆所言非虚。在卡兹戴尔内战中，红军的防线一再遭敌军突破与被迫收缩，最终于濒临崩溃时被迫再次北进，试图在乌萨斯重新落脚。万幸苏维埃红军的接应足够及时，足以让卡兹戴尔红军免于更多行军中的人员伤亡与装备补给品损耗。\n\n目前，艰难转移后的萨卡兹红军已在布尔什维克党的协助下完成安顿工作，其中仍保持战斗能力的基层战士与指战员也重新加入苏维埃红军编制。或许在未来，他们仍有第三次解放卡兹戴尔故乡的机会。但在如今，这批饱经风霜的战士只得暂且留在东达利亚的土地上，协助布尔什维克革命者们完成乌萨斯革命事业。"
 event_reu.115.a: "胜败乃兵家常事……"
 event_reu.116.t: "哈拉德·阿维尔的贺电"
 event_reu.116.d: "致乌萨斯的革命同志们：\n\n恭喜你们已完成了建立政权的关键一步，向着解放全乌萨斯，打倒反动旧帝国的伟大前程大步迈进。同时，也是恭喜两方建立正式的外交关系，国际革命事业得以合力前进——我谨代表[UFT.Getname]人民致以诚挚的祝福，愿你们终能击败那些骑在人民头上的旧贵族、资本家与军阀，使乌萨斯人民重新做回他们自己的主人！\n\n作为同样的社会主义政权，[UFT.Getname]人民与乌萨斯革命政权的人民有着相同的利益与志向，也面对着同样的帝国主义敌人。在我个人看来，乌萨斯是一个古老、坚韧而又善于反抗压迫者的民族。它曾在历史上打破了压在人民身上的“骏鹰枷锁”，可如今，一个新的，以封建与军国主义缔造的新囚笼却再度出现。它如同古代的骏鹰帝国一般以压迫人民，妄图榨干广大无产阶级的最后一丝剩余价值。这个“新的”囚笼便是如今立于圣骏堡之上的乌萨斯帝国，一个被极少数贵族地主掌握的反动封建国家。\n\n或许它有着强大的军队与看似稳固的根基，但其作为反动的旧势力必然得不到人民支持。而你们的苏维埃军队则站在进步的那一边，代表着广大受压迫的工农阶级，因此必然能够得到更多人民支持。众人拾柴火焰高——有了人民的广泛拥戴，相信你们必将打破旧日枷锁，建立属于人民的新乌萨斯！\n\n——什基普塔尔共产党总书记，哈拉德·阿维尔"
 event_reu.116.a: "感谢远方的同志！"
 event_reu.117.t: "新的军装"
 event_reu.117.d: "历经漫长且艰苦的游击作战与机动攻防作战，在塔露拉同志的统筹领导与全体将士的奋勇奋战下，整合运动成功完成乌萨斯东达利亚地区势力的整合与统一。区域局势趋于稳定、根据地建设稳步推进，标志着我军长期以来以游击战、运动战为主的作战与建设阶段正式落幕，军队正规化、职业化建设再度被提为核心工作议程，全军开启从游击武装向正规作战军队转型的关键进程。\n\n长期的流动作战环境，让全军形成了务实求生的着装习惯。为适配复杂多变的战场环境、保障持续作战能力，上至指挥将领，下至基层士兵，始终秉持“有什么穿什么、实用优先”的原则，没有统一的制式着装规范。唯独博卓卡斯替元帅统领的盾卫部队，拥有专属定型制服与规整着装体系，着装统一、风貌严明，是全军唯一完成制式化建设的作战力量。\n\n相较于建制规整、着装统一、风貌严谨的乌萨斯旧正规军队，我军整体着装杂乱参差、毫无章法。各色服饰混杂搭配，不仅让军队队列毫无规整美感、缺失强军气势，更存在极大的实战短板：非制式着装无法适配不同兵种的作战需求，防护性、便利性、适配性参差不齐，严重制约战术动作开展与战场生存能力，成为我军正规化转型路上的突出短板。\n\n针对全军着装乱象与军制漏洞，博卓卡斯替元帅于今日正式提交专项议案，直指当前军队制服体系的核心问题。他明确指出，游击时代的随性着装模式，早已无法适配新阶段正规作战、军队管理、兵种协同的核心需求，统一制式军装、规范着装标准，是军队职业化落地的首要基础，必须即刻推进整改。\n\n议案获批后，全军迅速启动制式军装迭代升级与军制规范化改革工作。在叶莲娜、克内希二位同志的统筹设计、落地调度与统筹安排下，适配整合运动作战体系、贴合泰拉战场环境、兼顾实用性与规范性的全新职业化制式军装顺利定稿、定型投产，并有序配发至全军各部队。\n\n本次军装革新并非单一着装升级，而是配套化、体系化的全军建制改革。伴随新军装全面落地，全新的军衔等级制度同步推行，清晰划分将士职级、明确权责体系、规范指挥层级。同时，精细化兵种分工体系正式实施，根据近战、攻坚、游击、支援、守备等不同作战职能，完成兵种细化划分，搭配专属制式着装与作战配置，实现着装、军衔、兵种、职能的全方位匹配。\n\n此次改革彻底终结了整合运动无统一制式着装的游击时代，以标准化军装为载体，夯实了军队正规化、职业化建设根基，重塑了全军军容风貌、规整了军队指挥体系、优化了兵种作战结构，为整合运动在乌萨斯东达利亚地区稳固驻防、常态化作战、规模化发展筑牢了坚实的军事基础。"
 event_reu.117.a: "正规化建设，就此启程。"

