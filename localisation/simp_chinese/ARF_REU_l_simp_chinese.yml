 REU_Red_Army_ADJ: "感染者游击队"
 REU_Red_Army_DEF: "感染者游击队"
 REU_KAC_guerrilla_resistance: "红军游击队抵抗"
 REU_KAC_guerrilla_resistance_desc: "红军的番号撤走了，支部却留了下来。矿区、林场、废弃的采石场里，还有人在开会、藏枪、记名字。对占领者来说，这里的每一个人都算不上人，这里的每一根烟囱都点不着火——想在这里征税、征兵、开工，得先把整片土地翻一遍。"
 REU_lud_army_spirit: "枪杆子里面出政权"
 REU_lud_army_spirit_desc: "柳德米拉从不相信誓言，她只相信结构。军需账目收在主席办公室的抽屉里，政委向主席办公室汇报，近卫部队只对主席办公室开枪——三道绳索套在同一根枪杆上，握枪的人便再也没法自己决定枪口朝向。她讨厌阅兵，也讨厌勋章，却把部队里递上来的每一张告密条都亲自读过。有人问这样军队还怎么打仗。她说：军队当然会打仗，它只是不再会挑主人了。"
 REU_lud_apparatus_spirit: "驯服的官僚机器"
 REU_lud_apparatus_spirit_desc: "一份公文从起草到生效只需一眨眼，因为所有人都清楚主席办公室要的不是讨论，而是盖章。旧官员学会了在署名前停顿三秒，新官员学会了不必等待任何人的意见。国家机器头一回变得如此顺手——顺手到柳德米拉夜里会想：这么听话的东西，会不会哪天也对别人听话。于是她又在机器里添了几双眼睛。"
 REU_lud_masses_spirit: "面包与安宁"
 REU_lud_masses_spirit_desc: "柳德米拉向人民许诺两样东西：面包，与安宁。安宁指的是没有人再敢议论面包。配给的日子谈不上富足，但宣传画上的麦穗画得格外饱满，广播里的歌谣唱得格外响亮，队伍排得越长，越说明供应的东西金贵。夜里人们安静地入睡，白天安静地做工，孩子安静地背诵——一切都安静得近乎丰裕。"
 REU_lud_gpu_spirit: "暗处的丝线"
 REU_lud_gpu_spirit_desc: "她从不出现在聚光灯下。肃反工作队在巷子里抓人，情报局在工厂里记账，处刑人在边境线上点名，宫廷顾问在他国的餐桌旁落座——所有的线最终都汇向同一张办公桌。邻国大使开始抱怨自己的侍从听懂了不该听懂的话，柳德米拉只是把名单又抄了一份，锁进第二个抽屉。真正的刀，从不参加阅兵。"
 REU_lud_supreme_spirit: "主席万岁"
 REU_lud_supreme_spirit_desc: "报纸的头版、工厂的砖墙、教室的第一课，都在重复同一个名字。人们为它欢呼，也为那些不欢呼的人让出位置。柳德米拉对这套体制只有一点抱怨：为了让文件显得民主，还得找人把它当众念一遍。至于王座，她始终没打算坐——她更愿意站在王座的阴影里，看每一个坐上去的人先学会看她的眼色。"
 REU_Lyudmila_Take_Power_Category: "柳德米拉成为领导人"
 REU_Lyudmila_Take_Power_Category_desc: "本页决议在柳德米拉尚未担任国家领导人时出现。\n\n§Y国策【柳德米拉笑到最后！】需要柳德米拉担任国家领导人，且清洗时代已经结束。§!"
 REU_lyudmila_take_power: "让柳德米拉成为领导人"
 REU_lyudmila_take_power_desc: "柳德米拉接掌政权，成为感染者游击队的国家领导人。\n\n§R启用条件：§!花费 §Y50§! 政治点数，且柳德米拉尚未担任国家领导人。"
 REU_lyudmila_take_power_tt: "柳德米拉成为§Y国家领导人§!，并满足国策【§Y柳德米拉笑到最后！§!】的全部解锁条件。"
 reuse.1.t: "苏维埃统一乌萨斯"
 reuse.1.d: "帝国塌下来的时候，比想象中安静。\n\n圣骏堡的双头鹰被人从门楣上撬了下来，留下两个圆圆的坑，十一月的雪灌进去，没有人想起来补。城里的灯第一次不为阅兵与庆典而亮——它照着广场上的人群：士兵、工人、感染者、洗衣妇，还有刚从集团军司令部押来的、尚未相信自己已经输了的人。\n\n「三百年了，我们的名字一直写在别人的法令里。」宣读公告的人放下稿纸，「从今天起，由乌萨斯的劳动者自己来写。」\n\n红旗从圣骏堡一路插向乌萨斯的每一座移动城市。旧帝国的死亡证明上，签着这片土地所有劳动者的名字。"
 reuse.1.a: "§R红旗落定——乌萨斯属于它的劳动者§!"
 REU_super_event_soviet_ursus_title: "苏维埃统一乌萨斯"
 REU_super_event_soviet_ursus_quote: "\"双头鹰留下的两个空位，正好够插一面红旗。\"\n——临时最高苏维埃，圣骏堡"
 REU_super_event_soviet_ursus_close: "§R红旗飘扬在圣骏堡§!"
 REU_World_War_Category_desc: "工业达到足以支撑全面战争的规模后解锁。\n\n§R启用条件：§!工厂总数大于 §Y300§!。"
 REU_United_Front_Category: "反邪魔统一阵线"
 REU_uf_unite_ursus_warlords: "团结乌萨斯割据势力"
 REU_uf_unite_ursus_warlords_desc: "乌萨斯的土地上，割据者们仍在为各自的旗帜厮杀。圣愚把邪魔的意志灌进了他们的耳朵，唯有把散落的乌萨斯人重新攥成一个拳头，才谈得上一战。向所有仍未归顺的乌萨斯割据势力发出最后通牒：交出军队与土地，或者被碾过去。"
 REU_uf_unite_ursus_warlords_tt: "吞并全部仍在的§Y乌萨斯割据势力§!；所得领土全部成为我们的§G核心§!，其军队一并接收。"
 REU_uf_refugees: "接收被圣愚迫害的流民"
 REU_uf_refugees_desc: "圣愚的祭司们把不肯跪拜的人赶出家门，村庄在火里烧成白地，成百万的人沿着铁路往南走。我们张开边境：给他们一口饭、一件棉衣，然后就让他们拿起枪。这些人没有退路，也就没有第二种选择。"
 REU_uf_refugees_tt: "获得§G30§! 座地图外军用工厂与 §G1000000§! 人力。"
 REU_uf_sami_aid: "请求萨米秘术援助"
 REU_uf_sami_aid_desc: "萨米的祖灵比乌萨斯的皇帝更古老，也比邪魔更懂得这片冻土。派人穿过北方的雪线，把萨米的三位大长老请到临时首都来。他们会告诉我们，怎么用萨满的仪式把圣愚那些东西从士兵的脑子里赶出去。"
 REU_uf_sami_aid_tt: "获得民族精神【§G宁做一日乌萨斯，不做万年邪魔！§!】，持续 §G365§! 天。"
 REU_uf_talua_assault: "发动“塔露拉突击”"
 REU_uf_talua_assault_desc: "塔露拉的打法历来简单：不守、不绕、不等，把所有能动的部队堆到一点上砸开。这一次不一样的是，后方的担架队跟着一起冲——每一个还能救回来的伤兵，都会站在下一波攻势里。这条命令可以下十次，一次比一次沉重。"
 REU_uf_talua_assault_tt: "获得民族精神【§G塔露拉突击§!】，持续 §G90§! 天。§Y本决议可使用 10 次§!。"
 REU_United_Front_Zeal: "宁做一日乌萨斯，不做万年邪魔！"
 REU_United_Front_Zeal_desc: "萨米的萨满把冻原下的祖灵请了出来。士兵们不再畏惧眼睛里爬出黑丝的人——恐惧已经被更古老的东西压住了。"
 REU_Talua_Assault: "塔露拉突击"
 REU_Talua_Assault_desc: "全军压上，只求砸穿。突击过后，后方把每一具还能喘气的身体都抬了回来——伤兵不再是丢在阵地间的数字，而是下一轮冲锋的人。"
