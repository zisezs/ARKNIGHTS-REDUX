 REU_Demidov_Kirilyevich_Yastlin: "杰米多夫·基里尔耶维奇·亚斯特林"
 REU_Demidov_Kirilyevich_Yastlin_desc: "§L在乌萨斯仍处在传统贸易生产制度的情况下，整合运动依然需要通过以商品或通货来和其他的商贩贸易根据地所需要的资源，而作为东达利亚最敏锐的投机倒把者的杰米多夫很快就察觉到了这点，尤其是在其因为遭到同行嫉妒而被暗算成为感染者之后，他决定动用自己仅有的一些人脉来帮助救助了自己的整合运动\n\n然而身为曾经身居高位之人，他却始终无法放下身段与这些所谓的革命者共事。在他眼中，金钱和权力依然是他奉之上位的存在，而为此他甚至不惜在某些交易当中出卖自己的恩人和商业伙伴\n\n不过他也很清楚，终有一天会有人发现货物的残次品数量多到不正常，以及那些帮工总是时不时在半路上不见踪影。或许自己在被揭穿之后会被吊死，但是他并不在乎——人生就是一场豪赌，不是赢得盆满钵满，就是输得一干二净§!"
 REU_the_sincere_middleman: "“诚挚”的中间商"

 REU_Alexander_Levich_Beselowski: "亚历山大·列夫维奇·别谢罗斯基"
 REU_Alexander_Levich_Beselowski_desc: "§L亚历山大并不是什么有名的皇室贵族，也没有在政治、经济或军事上的成就，对于整合运动而言，眼前这名魁梧但是神情恍惚的传统乌萨斯中年落魄男性只有三个特点——富有、很富有、非常富有\n\n而至于他为什么会跑到整合运动的地盘上却不得而知，他自称是在找什么人，但是当询问细节的时候却又支支吾吾说不出个所以然。而他也并非什么被流放者，毕竟这位衣着得体，也无感染迹象的达官贵人，很难和其他几位有着类似情况的逃亡者划上等号。只不过在众人实在想不出结果之后，也都决定不去深究了\n\n不过作为收留自己的等价交换，这位富豪通过不知名的手段能够为根据地提供着源源不断的赤金和乌萨斯卢布。哪怕是其中数额最小的一次，也都超过了半数人一辈子所得和支出的总和\n\n不过在政治方面，他可以说是妥妥的中间派——当然，这个说法也可能是有失偏颇的。毕竟他就从未在政治方面有所过问，他只是在根据地需要的时候，变魔术般拿出一沓钱，然后钻回自己的屋舍当中\n\n但是很奇怪的是，他不总是给一样数额的资金。在根据地衰落时，他便只会扣扣搜搜的给一点。而在根据地强大时，他便会豪爽的一掷千金——而此时人们也才恍然大悟，此人其实就是一个背后可能有着神秘势力支撑的投机主义分子§!"
 REU_generous_giver: "慷慨解囊"

 REU_Tintine_Ivanovitch_Smirnov: "廷尔汀·伊凡诺维奇·斯米尔诺夫"
 REU_Tintine_Ivanovitch_Smirnov_desc: "§L廷尔汀总是自称是乌萨斯的“名将军”，而但凡了解过乌萨斯战史的人都清楚此人是完完全全的徒有虚名。他在乌萨斯大大小小的各种战役当中都扮演了一个麻烦制造者的身份，并以不可理喻的战术方针而闻名。虽然他的古怪战法偶尔有着奇效，但是更多时候还是臭棋连连，最后落得个士兵损失大半，并被共事的将军们给嘲笑不断的“标准结局”\n\n至于为何现在会沦落为流浪感染者，他对此也只是说着什么兵者诡道也，将军的失败不算输一类难懂的话，只惹得众人发笑。而在其被整合好心收留之后，他也是个总是喜欢侃侃而谈的家伙\n\n虽然在长期的相处当中，此人在谋略上或许确实有一手。但是在政治的层面，他总是表现出一种优柔寡断的状态。他一会赞同保守主义的观点，一会又支持社会主义的理念。而在政治上面有个专门的名词形容他这种人——中间派§!"
 REU_old_school_strategist: "老派军事家"

 REU_Stepan_Andreevich_Kashov: "斯捷潘·安德烈耶维奇·卡肖夫"
 REU_Stepan_Andreevich_Kashov_desc: "人物肖像：\n\n\n\n\n\n\n\n£Stepan_Andreevich_Kashov\n\n\n\n\n\n\n\n\n§L在许多人看来，黎博利似乎是优雅的代名词，而斯捷潘却是跟这种印象截然相反的存在——他留着一脸的络腮胡，满是污垢的土黄色制服，再上那顶永远戴不正的旧式军官帽。给人感觉就是个面相难看的强盗头子——或者说他就是\n\n整合运动在卡兹戴尔红军到来之前便已雇佣了这群素质低下的盗匪，虽说是为了扩充兵力而不得已而为之，但是哪怕是性子最好的整合运动成员也都无法忍受斯捷潘的那群流氓佣兵的粗俗举止\n\n而在卡兹戴尔红军到来之后，人们更是发现了这群盗匪是一群完完全全的乌合之众。不仅常为偷鸡摸狗之事，并且犯错不改，遇事第一个开溜，各种杀良冒功之类的事情更是数不胜数——正因如此，斯捷潘和他的那些同党得到了一个“黑乌鸦”的诨名，而人们也是对其“敬”而远之§!"
 REU_black_baron: "黑乌鸦"

 REU_Conrad_Knecht: "康拉德·克内希"
 REU_Conrad_Knecht_desc: "人物肖像：\n\n\n\n\n\n\n\n£Conrad_Knecht\n\n\n\n\n\n\n\n\n§L康拉德·克内希一直是一个叛徒，她的一生都在背叛之中度过。康拉德·克内希并不是她的本名，这个名字是这个孤儿背井离乡前往莱塔尼亚谋生时，照着报纸上的名字随便取的。而当她在莱塔尼亚军队中立下战功后，她又背叛了巫王的统治，转而与反政府分子韦伯·海森和高卢复国主义者“同流合污”。当高卢复国主义者的起义失败后，她又离开了那片流着血和泪的土地，去到了崭新的山巅之城哥伦比亚。在花语运动中，康拉德·克内希帮助红石蒜主义者们，将工团主义的思想进一步发展，但在哥伦比亚建制派获胜、花语运动陷入低潮后，她再一次选择了离开，这一次，她“背叛”的理由是探索泰拉大地。康拉德·克内希用双脚走过了维多利亚、卡西米尔，在乌萨斯被拒之门外，然后她再次回到了莱塔尼亚，去送别她的友人和导师。\n\n韦伯·海森在弥留之际，把弗拉基米尔·马佐夫和他共同写就的所有手稿交给了康拉德，他对康拉德说，这个叫做“共产主义”的理念是改变泰拉的关键，他希望康拉德能帮他继续写下去。康拉德·克内希郑重地收下了这些手稿，在游历泰拉的旅程中把它们编篡成册，并且结合她的所见所闻所感，续写着那些马佐夫和海森没能回答出来的问题。最后，她的旅行在她的出发点停住，1084年，当康拉德回到她记忆里已经模糊不堪的家乡时，卡兹戴尔内战爆发了。康拉德拉起了一支由工人和厌倦了战争的佣兵组成的队伍，她用血液的名字为这支军队命名，“红军”。这支反抗命运的队伍在摄政王的大军面前显得不堪一击，他们很快被击溃，与女王身边的其他进步势力一起退往卡兹戴尔北方，在那里的高山之间苟延残喘。康拉德·克内希清楚，红军不能在这片土地上坐以待毙，他们必须继续这段无穷无尽的旅程。她看向了北方，那片辽阔而荒芜的冻原。\n\n康拉德·克内希是一个叛徒。她背叛了萨卡兹的复仇大业，背叛了巫王的浩荡洪恩，她背叛了林贡斯的残垣断壁，背叛了卡瓦莱里亚季的灯红酒绿。在她漫长而短暂的人生中，她没有背叛过的只有一群人，那些人的名字叫工人、叫奴隶、叫普罗列塔利亚、叫无产阶级。§!"
 REU_mentor: "导师"
 REU_Gergo_Franz: "格尔戈·弗兰兹"
 REU_Gergo_Franz_desc: "人物肖像：\n\n\n\n\n\n\n\n£Gergo_Franz\n\n\n\n\n\n\n\n\n§L在格尔戈幼年的记忆里头，他唯一的亲人——他的父亲在把他匆匆交于了一位朋友之后便离开了，而他那时唯一的依靠便是名为“赫斯酷民”，这个名字由高卢语和莱塔尼亚语混合成的异类锈锤组织。跟哪些憎恶并疯狂的破坏着所有文明及其产物的锈锤组织不同，这群装备老式军用铠甲和自制铳械的流浪者更接近于文明的拾荒者，他们通过回收文明的遗骸壮大着自己的势力\n\n而在格尔戈24岁那年，通过父亲好友的帮助以及自身的资质和努力，他在一场血腥无比的晋升仪式当中击败了前任领袖和其他的挑战者，成为了赫斯酷民的新任领导人。并在不懈的努力之下，将原本松散的部族邦联，改组为了一个规模庞大的准国家规模的军事组织，并积极地投身于卡兹戴尔数次战争当中\n\n但是令人感到疑惑不解的是，即便在人力损失殆尽，落款和补给无法得到保证，他和他的队伍依然选择跟随着他们最后的雇主——卡兹戴尔红军。并在之后一同去到了乌萨斯寒冷的冰原，甚至还说服了老将军巴尔·凯林与自己一道前行\n\n而现在作为军队的总参谋、教官和政治宣传员，他不仅承担着将训练和培养一只强大的人民军队的职责，同时他还肩负着在军队当中宣传政治纲领和巩固思想理念。虽然在观念上他对于马佐夫主义的想法如同乱麻一般难以言说，但是他认为只要这可以让卡兹戴尔再度统一与繁荣，那这种意识形态便是正确且合适的§!"
 REU_Millanden_Engler: "米兰登·恩格勒"
 REU_Millanden_Engler_desc: "§L米兰登曾在卡兹戴尔的国境内经营着一座小型植物温室和面包房，作为学者的后裔，他对于战争并没有什么兴趣，他真正想要的是让卡兹戴尔贫瘠且破败的土地上再次长满金黄色的稻谷\n\n然而随着内战的到来，温室和面包房在战火当中不可避免的被毁。在跪倒在废墟上哭泣许久之后，她收拾行囊踏上了寻找新的绿洲的旅途。在偶遇了卡兹戴尔红军的队伍之后，她没有多想就选择加入到了这群满怀理想的战士当中\n\n虽然米兰登对于马佐夫主义以及其思想有些理解困难，不过在她看见整合运动为普通民众和感染者的福祉而不予余力的斗争之后，她就明白了自己加入这支队伍是她此生做出最正确的事情\n\n米兰登的祖辈穷尽一生只为了让卡兹戴尔再次长满金黄色的麦穗，并让卡兹戴尔的平民百姓不再被饥荒所困扰。虽然自己的父辈最好抱着麦种倒在了血泊当中，但是那时尚且年幼的自己发誓要完成家族和先辈们的梦想——卡兹戴尔会成为一片新的绿洲，一个没有饥荒的乌托邦§!"
 crisis_gardener: "危地园丁"
 REU_Rod_Bertharin: "罗德·柏萨林"
 REU_Rod_Bertharin_desc: "§L工匠对于卡兹戴尔来说曾经代表了社会上最聪明和博学的一批人，而罗德·柏萨林就是他们当中最出众的人之一。作为土石之子，她在不仅在如何建造一栋高楼大厦上面得心应手，同时更加擅长运用自己灵巧的双手制造各种工具和物品\n\n不过她更加喜欢将自己的技术和本领传授给那些满怀热情的年轻工人，而作为长期和底层劳工相处的工匠行会领袖，她在红军举起大义的旗帜反抗卡兹戴尔当局的残暴统治之时，没有过多思考便投身到了革命事业当中，并在红军溃败之后带领着一大批熟练工人跟着红军来到了乌萨斯的极寒之地\n\n而罗德在根据地的一天都是繁忙且充实。她白天培训工人们的职业技能，晚上则在夜校给工人们教授关于社会主义的思想和各种知识理论。即便这样与日共起，与月同眠的日子是无比艰苦的，但是总是微微一笑然后用一口充满了地方口音的卡兹戴尔语说道：“我只是做了分内之事而已，现在苦一点，好日子就来的早一点，人民就解放的快一点”\n\n不过令她感到有些惊奇的是，身为萨卡兹中的石翼魔的她竟能在异国他乡见到自己的同族——泥岩，她虽然并不熟悉这个名字，但是萨卡兹独有的心有灵犀让两人一下就知道了彼此的身份。虽然实际的交集不多，但是在这个极寒之地能够有一位可以相互排忧解难的朋友，她也相当的心满意足了§!"
 vocational_worker_trainer: "职业工人培训"
 REU_Ezemara_Umak: "以洗玛拉·乌玛克"
 REU_Ezemara_Umak_desc: "§L身为卡兹戴尔少有的接受科班教育的医护人员，其早年以“TOUCH”的代号活跃于名为巴别塔的组织。后来因为和领导人的理念不合而毅然决然和巴别塔决裂并推出其行列，而“TOUCH”的代号也被新的成员沿用\n\n在退出了巴别塔之后，其以自由行医的身份活动在卡兹戴尔的各个角落。虽然她总是竭力做到最好，但是限于能力和物质的有限，而时常只能看着那些或老或幼的病患及其家属在陷入不尽的悲痛和死亡的折磨\n\n而身为感染者的自己在缺乏了药物的治愈之下，只能用医疗法术这种拆东墙补西墙的方式维持着自己如同风中残烛般的生命。在那时，她不禁开始回想自己背离巴别塔是否是一个错误的决定，如果自己留下或许可以拯救更多人——如果自己能够不为了可悲的信仰问题而犯下了这个致命的错误\n\n而在她万念俱灰之时，一群被认为是全卡兹戴尔最残忍的暴徒——铁躯恶徒却在她将死之时，从死亡的深渊之中拽了出来。虽然她并不清楚当初格尔戈和他队伍是基于什么原因救助的自己，但是不可否认的是，如果不是他们，今天她自己就不会站在这里了\n\n而后来，她跟随着红军的队伍来到了乌萨斯的冻原，并在后方的医院和感染者疗养所里头作为医生和管理人活动。对她来说，这是一种熟悉而又陌生的感觉，她走过了漫长的岁月，最后再一次回到了病房里头§!"
 light_of_the_apocalypse: "天启之光"
 REU_Bal_Kailin: "巴尔·凯林"
 REU_Bal_Kailin_desc: "人物肖像：\n\n\n\n\n\n\n\n£Bal_Kailin\n\n\n\n\n\n\n\n\n§L这位面容形容枯槁但内心依然散发着爱国热情的老人，在目睹了卡兹戴尔内战这场萨卡兹人之间又一次互相残杀的被拒之后，彻底的心灰意冷并选择了就此退出军队归隐到了一处村庄当中\n\n但是没过多久，自己老友的儿子便敲门拜访自己并希望这位身经百战、见多识广的老将军可以再次出山为了卡兹戴尔的再度复国而努力。虽然老将军已经无数次的听过了类似的话语，但是当他看见年轻人眼中燃烧的火焰之时，他想起了他的父亲——再沉思了片刻之后，老将军重新披上了过去的军服和战甲，与那位年轻人一道跟上了卡兹戴尔红军的步伐\n\n老将军本人虽然对于马佐夫主义并没有什么兴趣，但——“如果我当初的队伍有这样的纪律性，再加上提卡兹工匠们铸造出的精良武装，我可能就能给卡兹戴尔的人们一个强大、繁荣且完整的国家了”他是对于卡兹戴尔红军如是称赞道\n\n红军士兵当中有的曾经也是这位将军的部下，或是其部下的后裔。他们都明白老将军或许不懂什么是社会主义，不懂什么是人民民主，不懂什么是天下大同。但是他明白只有统一的卡兹戴尔，才是卡兹戴尔人民想要的卡兹戴尔，而老将军这个愿望，也是大多数红军士兵的愿望§!"
 
