 REU_lud_supreme_spirit_tt: "§Y主席万岁§!追加效果："
 REU_ludmila_office_unlock_tt: "解锁§Y柳德米拉的主席办公室§!机制。"
REU_regicide_unlock_tt: "解锁§Y刺杀各国领导人§!的决议。"
REU_World_War_Category: "世界革命"
REU_declare_war_on_all: "世界革命的终章"
REU_declare_war_on_all_desc: "乌萨斯的烟囱已经连成了地平线。当最后一批工厂点火，我们握在手里的就不再是几支枪、几门炮，而是一台足以把旧世界连根拔起的工业机器。\n\n于是世界革命走到了它的终章：不再等待，不再退让。整合运动向泰拉之上一切尚未臣服于革命的国家，同时宣告全面征服——这不是请求开战的许可，而是替他们写好结局。\n\n§R启用条件：§!工厂总数大于 §Y300§!。"
REU_declare_war_on_all_tt: "为世界上所有尚未交战的国家（本国、附庸国与阵营成员除外）同时获得§Y全面征服§!的战争目标。"
 REU_crownslayer_fame: "弑君者威名！"
 REU_crownslayer_fame_desc: "§L对专制主义国家作战时：陆军突破 §G+20%§!。§!"
 REU_crownslayer_fame_modifier: "弑君者威名！"
 REU_crownslayer_fame_modifier_tt: "仅在§Y柳德米拉§!执政、且正与§Y专制主义国家§!作战时生效。"
 REU_Mikhail_Aleksandrovich_Koloshnikov: "米哈伊尔·亚历山德罗维奇·科洛什尼科夫"
 REU_Mikhail_Aleksandrovich_Koloshnikov_desc: ""
 REU_Pick_up_the_Saakaz: "接纳萨卡兹人"
 REU_Pick_up_the_Saakaz_desc: "虽然游击队内之前已经有萨卡兹人存在，但要让主体民族为乌萨斯、埃拉菲亚、卡特斯等冻原民族的游击队员们迅速地与一支全是萨卡兹的部队融合在一起，显然不是一件简单的事情，更何况他们之中还有很多人不是感染者。在博卓卡斯替的牵头下，一支专门的工作小组受命去引导游击队战士们，让他们尽快接纳新的战友的到来。"
 REU_The_Saakaz_weapon_manufacturing_science: "萨卡兹武器匠人"
 REU_The_Saakaz_weapon_manufacturing_science_desc: "一批萨卡兹工匠随着红军抵达了营地，他们拥有高超的铸造技术，手上还有几台现代的生产机械，我们已经开辟了一块区域来搭建他们的工坊，现在只需等待他们将新招揽的工人们培训完毕，我们新的兵工厂就可以开张了。"
 REU_Emergency_meeting: "反剿灭紧急会议"
 REU_Emergency_meeting_desc: "最坏的情况出现了。尽管康拉德时常提醒我们，进步势力将要面对反动派的联合绞杀，但贵族同盟和第三集团军的剿灭作战仍然超出了我们的应对能力。根据地边缘的友好村庄被敌人烧毁，几支游击部队也已经被打散建制，为了生存，我们急需召集所有干部和指挥官，商讨应对敌人的方法。"
REU_Regicide_Category: "丧钟为暴君而鸣"
REU_Regicide_Category_desc: "名单已经写好，坐标已经确认，处刑人与黑刃都已就位。接下来要做的，只是决定——先给哪一位暴君送去那口为他而鸣的钟。"
REU_regicide_intel_briefing: "「核心圈」情报简报"
REU_regicide_intel_briefing_desc: "把从各国宫廷、工厂与感染者聚居区汇集来的零碎情报，整理成一份可供主席案头翻阅的简报。外交人民委员部对此颇有微词，认为派人去为暴君们「记录起居」有失体面；柳德米拉的回答很干脆——体面换不来坐标，而简报可以。\n\n§G获得 25 点指挥点§!。每 90 天可进行一次。"
REU_regicide_intel_briefing_tt: "§G+25§! 指挥点"
REU_regicide_special_operation: "「弑君者」特别军事行动"
REU_regicide_special_operation_desc: "选定一个目标国家，交由处刑人与黑刃执行斩首。行动持续 §Y30 天§!：期间对方或许还能照常开会、照常演讲，只是不知道自己的座位底下早已被量好了尺寸。行动完成后，该国现任领导人将被清除，其国内秩序也会随之陷入一段短暂的混乱。\n\n为了不引起不必要的敌意，§R同一国家只会被「送钟」一次§!；目标国家的现任领导人一旦被清除，该目标便会从行动名单中消失。\n\n§Y可在行动面板中选择要送钟的国家。§!"
REU_regicide_special_operation_tt: "§Y30§!天后行动完成：目标国家的§R现任领导人将被清除§!。"
