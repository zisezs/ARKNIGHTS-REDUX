### 民主改革后续三分支（骨架） ###
	REU_emergency_measures: "紧急手段"
	REU_emergency_measures_desc: "同志们，乌萨斯革命正在处于它最大的危机之中！反动分子正在地方上加紧对抗我们。但是，在千锤百炼中战斗出来的红军是不会任由他们猖狂放肆的！叶莲娜同志、柳德米拉同志都已经做出了表态：前进！在塔露拉主席的领导下把革命进行到底！"
	REU_army_supports_the_left: "军队支左"
	REU_army_supports_the_left_desc: "整合运动《关于集中力量执行支左、支农、支工、军管、军训任务的决定》：红军中央军委各总部、各军兵种机关要视情况抽调三分之一至三分之二的人员，立即投入支左、支农、支工、军管、军训的工作。"
	REU_talulah_personality_cult: "树立塔露拉个人崇拜"
	REU_talulah_personality_cult_desc: "“与其让你独裁，不如我独裁好。”塔露拉知道乌萨斯皇帝总是好大喜功喜欢他人顶礼膜拜的——这种膜拜无疑是奴性十足而有害处的。但是，塔露拉同志的功绩凭心而论真的比伊戈尔大帝更低吗？既然大家都愿意相信一个值得被相信的人，那我们没有理由不去回应他们的呼声。塔露拉同志和她的战友们将被写入课本，被世世代代的乌萨斯新青年们传唱。"
	REU_savior_of_the_revolution: "革命的救主"
	REU_savior_of_the_revolution_desc: "“在革命危难之际，是塔露拉同志站了出来拯救了乌萨斯，拯救了苏联，她是革命的救主，是乌萨斯人民的救星。”——柳德米拉在军代会上的发言。"
	REU_slight_progress: "稍有进步"
	REU_slight_progress_desc: "拥有一定成就的民主改革也没法避免其弊端，我们需要继续贯彻耐心，对乌萨斯革命进行过渡时期的改造。"
	REU_socialist_education_movement: "社教运动"
	REU_socialist_education_movement_desc: "我们必须组织一场对民众的教育，让社会主义共产主义的思想深入民众内心，如此，我们下一代才可以继续我们未能完成的成果，继续未完成的事业。"
	REU_participate_in_politics: "参政议政"
	REU_participate_in_politics_desc: "就国家治理的核心问题，我们可以让专业团体进行专家式的闻询，让他们参与到政治治理中来。"
	REU_civilian_revolution: "平民革命"
	REU_civilian_revolution_desc: "我们可以尝试打破旧的政治架构，让普通百姓也有权利参与到国家的管理中来。正所谓，只有真正做到让民有所呼、政有所应，国家才能实现长治久安。"
	REU_great_success: "大获成功！"
	REU_great_success_desc: "山，快马加鞭未下鞍。惊回首，离天三尺三。山，倒海翻江卷巨澜。奔腾急，万马战犹酣。其三：山，刺破青天锷未残。天欲堕，赖以拄其间。"
	REU_people_democracy: "人民民主"
	REU_people_democracy_desc: "人民民主，大业竟成……"
	REU_democratic_centralism: "民主集中制"
	REU_democratic_centralism_desc: "我们将改组最上层，塔露拉同志将不再担任革命的领袖。"
	REU_dawn_of_ursus: "乌萨斯的黎明"
	REU_dawn_of_ursus_desc: "赤橙黄绿青蓝紫，谁持彩练当空舞？雨后复斜阳，关山阵阵苍。当年鏖战急，弹洞前村壁。装点此关山，今朝更好看。"

### 民主改革分支（event_reu.118 / REU_dem_reform） ###
 event_reu.118.t: "一份被判定为危害整合运动、半撕毁的右派大字报"
 event_reu.118.d: "乌萨斯全境统一战事彻底落幕，旧帝国残余军政体系已被整合运动武力彻底清算。境内保皇派残党、极端民族主义等团体均被取缔，同时哥伦比亚资本自由主义、维多利亚议会式西式民主渗透势力，亦被新政权权力机构严格肃清、限制活动空间。\n\n经由长期革命动员，旧乌萨斯延续数百年的源石病阶层偏见与制度化歧视被强力破除，感染者平权政策全面落地，为统一后乌萨斯的社会重构与国家现代化建设扫清了核心制度阻碍。\n\n我们必须客观承认：以塔露拉为核心，阿丽娜、叶莲娜、克内希同志构成的整合运动领导核心，完成了历史性的执政跨越。这支起源于贝加尔湖畔边区小型游击武装的革命力量，在长期高压围剿与残酷斗争中完成组织迭代，最终平定向西进军平定了乌萨斯的长期割据势力，完成了乌萨斯主体疆域统一，彻底终结了旧帝国的统治秩序。\n\n旧国家机器已然粉碎，但统一建制数月以来的基层摸排、政务巡察与队伍整风报告明确显示：乌萨斯旧社会遗留的文化糟粕、官僚习气、特权思维并未随旧政权一同消亡，仍深度渗透于基层治理与革命队伍内部。\n\n伴随统治疆域扩张、行政层级增设、人员编制扩容，整合运动内部官僚化趋势逐步显现。部分新晋委员与基层公职人员开始利用岗位权限攫取特殊便利，通过资源倾斜、待遇优先、行政变通等方式构建个人特权空间，革命队伍的纯洁性与群众性受到实质性侵蚀。\n\n同时，我们发现，适配战时动员、战时集权的自上而下垂直集中领导体制，在和平建设周期暴露出严重制度惯性。该治理模式的单向决策、层级固化、基层话语权缺失等特征，与旧乌萨斯帝国文官官僚体系的弊病高度趋同，行政僵化、脱离群众、权责失衡的问题持续凸显，严重制约新生政权的治理现代化。\n\n基于现有治理弊病，本文呼吁：整合运动建立的新苏联需在战后窗口期启动系统性民主改革，松绑战时集权体制残留，建立常态化民众监督机制，开放基层监督渠道、落实群众评议权力，破除官僚特权土壤、肃清旧时代遗留风气，重构适配平等革命纲领的全新治理体系，以制度化革新巩固革命成果……\n\n（海报下半部分被暴力撕毁，内容无法考证）"
 event_reu.118.a: "……最终，这份大字报放在了塔露拉的办公桌上。"

	REU_dem_reform.101.o1: "不管怎么说，揭露了问题，就是有意义的。"
	REU_dem_reform.101.o2: "好好的会开成这样，实在是……"
	REU_dem_reform.102.o1: "这种事儿总是要有理有据有节嘛……"
	REU_dem_reform.102.o2: "贫下中农就得是天不怕地不怕！"
	REU_dem_reform.103.o1: "好！要选，要大选特选！"
