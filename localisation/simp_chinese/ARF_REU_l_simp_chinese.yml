REU_Black_Blade_Task_Force: "组建黑刃特勤支队"
REU_Black_Blade_Task_Force_desc: "如果说处刑人是刀，黑刃就是那截最短、最冷、最不愿被人看见的刀尖。他们不守阵地、不打会战，只做两件事：把该消失的人带走，把不该活着的人送走。队员大多无名无姓，连档案都只留一个编号。有人问支队长，你们最大的战果是什么？他想了想：最大的战果，是让泰拉所有人都开始怀疑——到底还有没有人在替我们做事。"
 REU_Cleanse_the_Bloodied_Red_Flag: "清洗染血的红旗"
 REU_Cleanse_the_Bloodied_Red_Flag_desc: "旗子脏了，就得洗。红军在卡兹戴尔打的是内战，也是自己人之间的糊涂账：旧王庭的走狗、临阵脱逃的军官、把子弹卖给敌人的军需官，都在一点点磨掉这面旗的颜色。我们送过去的第一批东西不是枪，是人——两支满编的志愿军，替他们把首都的秩序重新攥紧。等到红旗重新红得干净，卡兹戴尔红军才配得上「红军」这两个字。"
 REU_Cleanse_the_Bloodied_Red_Flag_tt: "§Y卡兹戴尔红军§!的首都生成 §G2§! 支满编 8 步「整合运动志愿军」；卡兹戴尔红军稳定度 §G+10%§!。"
REU_Core_Circle_Leaders_List: "核心圈领导人名单"
REU_Core_Circle_Leaders_List_desc: "处刑人的名单需要指向，黑刃的刀锋需要坐标。柳德米拉命情报局汇总各国反动派首脑的全部档案——姓名、习惯、起居、软肋，乃至他们最信任的那条狗叫什么名字。于是，一份被称为「核心圈」的名单就此成形。它薄薄一册，翻开却重如千钧。有人提议在封面上题一个字，柳达摇头：不必——名单本身，就是最好的人生结论。"
REU_Court_Advisor_Program: "各国宫廷顾问计划"
REU_Court_Advisor_Program_desc: "要让名单上的名字随时更新，最好的办法不是派特工，而是让他们自己请你入宫。柳德米拉启动「宫廷顾问」计划：以学者、医师、乐师、占星家等体面身份，将我们的人送进各国宫廷。他们给暴君们讲授治国之道，也顺手记下每位暴君何时就寝、与谁反目、近来又为何失眠。有人质疑这太过危险，一位顾问却在信里答道：放心吧，柳达同志——离王座越近，刀反而越安全，因为王座上的那位，比我更怕死。"
REU_Death_Bell_for_Tyrants: "丧钟为暴君而鸣"
REU_Death_Bell_for_Tyrants_desc: "整合运动清洗了旧秩序的残渣，可放眼泰拉，暴君们依旧端坐于各自的王座之上——乌萨斯的皇帝、维多利亚的摄政、卡西米尔的骑士团、炎国的庙堂。柳德米拉比谁都清楚：只要这些人还在，革命就永远只是「南方的一场骚乱」。于是她提笔，在名单的第一行写下了一个问题——究竟该先聆听丧钟，还是先成为敲钟人？答案并不重要，因为钟声一旦响起，就再没人能假装听不见。"
REU_Deicide_Executioners: "培养「渎人之罪」处刑人"
REU_Deicide_Executioners_desc: "革命不需要刽子手，革命需要的是艺术家——只不过他们的画布是名单，颜料是沉默。柳德米拉为处刑人取了个体面的名字：「渎人之罪」，意指那些胆敢以人民的苦难为祭品、亵渎人伦者，终将由更专业的人来为其「主持公道」。他们学习解剖、伪装、审讯与销毁，也学习在动手之前先读懂一个人为何会走到这一步。第一堂课的结语让所有人记了很久：我们杀的不是人，是位置——那个位置换谁坐，结果都一样。"
 REU_Extreme_Urgency: "十万火急！"
 REU_Extreme_Urgency_desc: "卡兹戴尔的电报穿过整片冻原送到案头时，只剩下半行字：红军正在打仗。当年他们从卡兹戴尔的血泊里爬出来，一路走到东达利亚，把马佐夫主义的火种和一面残破的旗子一起交到我们手上。如今轮到我们回信了——是倾尽全力把这面旗重新扛起来，还是抢在合围合拢之前把火种带出来？没有第三条路，而且必须现在就决定。"
REU_In_the_name_of_the_Regicide: "以弑君者之名！"
REU_In_the_name_of_the_Regicide_desc: "柳德米拉与索科洛夫将肃清这片大地上所有的“暴君”！"
REU_Infected_Workers_Intelligence_Bureau: "建立核心圈感染者与工人情报局"
REU_Infected_Workers_Intelligence_Bureau_desc: "最危险的地方，往往藏着最可靠的眼睛。感染者蜷缩在城市的阴影里，工人们在流水线旁交换着最真实的抱怨——这些被主流社会视作「噪音」的群体，恰恰构成了无可替代的情报网络。柳德米拉把他们组织起来，给予面包、身份与一点点尊严，换来的是街巷尽头、厂区深处每一处风吹草动。有人担心情报局会失控，柳达只是笑道：一根绷得太紧的弦才需要担心；而我们，向来话多的是弦，不听话的也是弦。"
REU_Infiltrate_Ursus_Warlords: "渗透乌萨斯军阀与贵族"
REU_Infiltrate_Ursus_Warlords_desc: "帝国的疆域辽阔，皇帝的号令却未必能抵达每一座庄园。乌萨斯的军阀与贵族们一边高呼效忠，一边把粮仓、私兵与密信锁得严严实实。柳德米拉不急于动武——她给每个家族都备了一份「小礼物」：一本账、一剪家书、一张不为人知的合影。许多领主在收到礼物后的第二周便主动上缴了税款，还在信里盛赞革命政府的宽宏。柳达把这类信件统一归档，标签上写着：识时务者的悔过书。"
 REU_Kazdel_Urgency_tt: "§Y卡兹戴尔红军§!处于战争中，本节点自动完成；此后必须在左右两条互斥路线中择一：倾力支援，或保存火种。"
 REU_Keep_the_Revolutionary_Spark: "保留革命火种"
 REU_Keep_the_Revolutionary_Spark_desc: "人走了，火还在。留下的游击队会钻回山林、矿井和废弃的采石场，让每一座村庄都成为红军还活着的证据。他们守不住城市，只好去守人心——占领者可以用刺刀占下每一寸土地，却永远点不清这片土地上还藏了多少把镰刀、多少根引线。人力抽不干，工厂开不满，这就是革命留给敌人的遗产。"
 REU_Keep_the_Revolutionary_Spark_tt: "§Y卡兹戴尔红军§!的所有核心地带获得地区BUFF【红军游击队抵抗】：当地可用人力 §R-50%§!、可用工厂 §R-50%§!。"
 REU_Lift_Comrades_from_the_Blood: "拉起血泊中的同志"
 REU_Lift_Comrades_from_the_Blood_desc: "名单是昨天夜里送到的：三个连打光了，两个营只剩下番号，团长抱着机枪倒在最后一道战壕里。红军不缺勇气，缺的是能把倒在血泊里的人重新扶起来的东西——两万人，四支满编师，还有一句他们最需要听见的话：你们不是孤军。"
 REU_Lift_Comrades_from_the_Blood_tt: "§Y卡兹戴尔红军§!获得 §G20000§! 人力与 §G4§! 支满编 8 步「整合运动志愿军」。"
 REU_Lyudmila_bread_and_calm: "面包与安宁"
 REU_Lyudmila_bread_and_calm_desc: "柳德米拉向全体人民许诺两样东西：面包，与安宁。安宁，指的是没有人再敢议论面包。配给制下的日子谈不上富足，但宣传画上的麦穗画得格外饱满，广播里的歌谣唱得格外响亮。一位老妇人在空荡的货架前低声抱怨，立刻被人提醒：同志，要相信主席——面包的问题，明天就会解决。那明天真会有吗？会的，明天你会再听到一个「明天」。"
 REU_Lyudmila_commissar_eye: "政委的眼睛"
 REU_Lyudmila_commissar_eye_desc: "柳德米拉从制度上解决了「忠诚」这道古老难题：在每一个连队里安插一位只对主席办公室负责的政委。军官指挥士兵，政委监督军官，士兵之间互相监督——如此一来，军队里便再无秘密可言。面对「是否太多疑」的抱怨，柳达耸耸肩：在乌萨斯，连雪都会告密。"
 REU_Lyudmila_control_the_army: "掌控军队大权"
 REU_Lyudmila_control_the_army_desc: "红军的忠诚从不是理所当然的。柳德米拉不信任任何一位将军的誓言，她只信任把柄——军需账目、私下的信件，以及那些不该出现在阅兵名单上的名字。当每一支部队里都有人随时向她递话，枪杆子的归属便不再存疑。她讨厌勋章与仪式，却很清楚一个道理：要让军队听话，授勋往往比枪毙便宜。"
 REU_Lyudmila_laughs_last: "柳德米拉笑到最后！"
 REU_Lyudmila_laughs_last_desc: "塔露拉的清洗风暴终于平息，整合运动的尸骨未寒，权力的真空却已暴露无遗。作为情报部门的首脑，柳德米拉比谁都清楚如何填补这片真空——她从不出现在聚光灯下，只在暗处收拢每一根丝线。有人担心她是个「弑君者」，迟早要掀翻那张王座；她对此的回应很朴素：王座她未必想坐，但坐上去的人，最好学会看她的眼色。当所有人都以为清算已经结束时，真正笑到最后的人，才刚刚登场。"
 REU_Lyudmila_long_live_chairman: "柳德米拉主席万岁"
 REU_Lyudmila_long_live_chairman_desc: "枪杆听从她，公文讨好她，掌声属于她。当最后一处异议被无声地抹去，柳德米拉终于站在了权力的顶点。过去那个藏身幕后的情报官，如今已是这个国家唯一的意志。只是偶尔，在无人看见的深夜，她仍会想起叙拉古的老师教的那句话：把恨意化为力量，却不要仇恨。而她对着镜中那顶崭新的冠冕，只说了一句谁也没听见的话——看好了，我不会变成你们。然后，广播里响起了万岁的呼声。"
 REU_Lyudmila_loyal_guard: "近卫军效忠"
 REU_Lyudmila_loyal_guard_desc: "在正规军之外，柳德米拉亲手组建了一支只对主席办公室负责的近卫力量。他们精于渗透、潜伏与肃清，既是她的眼睛，也是悬在所有军官头顶的一把刀。有人质疑这支部队是否会架空红军，柳达只是反问：一支连存在都不必公开的部队，又怎会妨碍任何人？真正的刀，从不参加阅兵。"
 REU_Lyudmila_obedient_apparatus: "驯服的官僚机器"
 REU_Lyudmila_obedient_apparatus_desc: "清洗留下的空缺，被忠于主席办公室的人一一填满。公文流转的方向、人事任免的名单、政策的解释权，尽数汇入柳德米拉的案头。服从不再是美德，而成了唯一的生存法则。一位老官员想把位置留给儿子，柳达痛快地批准了——只把职务名称从「部长之子」改成了「部长助理」。"
 REU_Lyudmila_purge_the_bureaucracy: "整肃官僚集团"
 REU_Lyudmila_purge_the_bureaucracy_desc: "旧帝国的文官、摇摆的投机者、阳奉阴违的干部——柳德米拉用一纸名单便能决定他们的去留。整肃之下，官僚系统第一次学会了什么叫噤声。有人当面质问她可有确凿证据，她的回答相当得体：我们当然尊重证据，只是办事讲究个先后——先处理人，再处理证据。"
 REU_Lyudmila_rubber_stamp: "橡皮图章"
 REU_Lyudmila_rubber_stamp_desc: "如今，一份文件从起草到生效只需一眨眼的工夫，因为所有人都明白：主席办公室要的不是讨论，而是盖章。会场上再没有人投反对票——并非因为不存在分歧，而是因为提出分歧的人已经不在会场。柳德米拉对这效率颇为满意，唯一的抱怨是：为了让文件显得民主，还得找人把它当众念一遍。"
 REU_Lyudmila_voice_of_the_people: "人民的声音"
 REU_Lyudmila_voice_of_the_people_desc: "报纸、广播、集会——所有渠道都在重复同一个声音，而那个声音由主席办公室撰写。当人们以为自己在欢呼时，其实是被欢呼塑形。柳德米拉深谙此道：「人民的声音」这四个字，关键在于前面那三个字究竟是谁写的。军队、官僚与民众，三根支柱就此归于一体。"
 REU_Lyudmila_win_the_masses: "赢得民心"
 REU_Lyudmila_win_the_masses_desc: "柳德米拉深知，仅有刀锋与公文远远不够。她让宣传机器日夜不停地诉说着秩序与面包，把恐惧包装成安宁，把审查粉饰为守护。城市与冻原上的普通人，开始相信这位主席会带来他们渴望的一切。至于那些在队伍末尾排了很久的人——宣传会这样告诉他们：队伍越长，越说明供应的东西金贵。"
 REU_Mend_the_Broken_Antlers: "黏合断裂的鹿角"
 REU_Mend_the_Broken_Antlers_desc: "卡兹戴尔人常说，自己的国家是一只断了角的鹿——王庭也乐意这么传：断角的鹿，就等于亡了国。可断角底下还有骨头和血，就还能再长回来。我们不能替他们打仗，却能替他们把厂房盖起来：四座不标在任何地图上的军工厂，两千单位的步兵装备。武器不会从祷词里长出来，鹿角也不会——它们只能从熔炉里长出来。"
 REU_Mend_the_Broken_Antlers_tt: "§Y卡兹戴尔红军§!获得 §G4§! 座地图外军用工厂与 §G2000§! 单位步兵装备。"
 REU_Not_for_Fleeting_Glory: "不为一时之荣辱"
 REU_Not_for_Fleeting_Glory_desc: "今天咽下的这口气，是为了明天还能站起来。我们不为一场战争的荣辱下注，先把刀收回鞘里，把账记在纸上——卡兹戴尔王国，卡兹戴尔罗阇国，你们拿走的每一座城、折掉的每一面旗，我们都记着。清算不急于这一天，但一定会来。"
 REU_Not_for_Fleeting_Glory_tt: "我们获得对§Y卡兹戴尔王国§!与§Y卡兹戴尔罗阇国§!的宣战理由「傀儡」，有效期三年。"
REU_Operation_Regicide: "「弑君者」特别军事行动"
REU_Operation_Regicide_desc: "名单齐备，特战就位，坐标清晰。柳德米拉将最后的行动命名为「弑君者」——这既是敌人送给她的绰号，也是她亲手签下的判决书。行动的目标只有一个：让每一个坐在人民头骨堆成的王座上的暴君，都听见那口丧钟为自己而鸣。至于行动结束后会不会有人骂她残忍？柳达早已拟好了答复：残忍的是这个世界，不是我——我不过是个尽责的送钟人。"
 REU_Rendezvous_on_the_Snowfield: "雪原会师"
 REU_Rendezvous_on_the_Snowfield_desc: "为了让卡兹戴尔的火不至于灭在合围里，红军接受了王庭的收编：番号被拿走，旗子折起来收进怀里，名单上的名字一个一个划掉。而在冻原的另一端，一支仍然打着他们名字的部队跨过雪线，走进了我们的队列——满编十六个营，一个不少。会师那天没有礼炮，只有一场把天地都埋住的暴风雪。"
 REU_Rendezvous_on_the_Snowfield_tt: "§Y卡兹戴尔王国§!吞并§Y卡兹戴尔红军§!；我们获得 §G1§! 支满编 16 步「卡兹戴尔红军」师。"
 REU_Revolution_is_not_Blind_Sacrifice: "革命并非盲目牺牲"
 REU_Revolution_is_not_Blind_Sacrifice_desc: "革命者不怕死，但革命不能靠死人延续。两万人从红军的账上划掉，只有一万五千人走完了全程——剩下那五千，永远留在了雪里。这不叫怯懦，这叫算账：与其让最后一点力量在卡兹戴尔的血泊里沉下去，不如先把它埋进东达利亚的冻土，等下一个春天自己发芽。"
 REU_Revolution_is_not_Blind_Sacrifice_tt: "§Y卡兹戴尔红军§!人力 §R-20000§!；我们获得 §G15000§! 人力与 §G2000§! 单位步兵装备。"
REU_Revolutionary_Suppression_Work_Teams: "筹建全泰拉肃反武装工作队"
REU_Revolutionary_Suppression_Work_Teams_desc: "要推翻一个旧世界，光有热情是不够的，还需要一批专门和「热情」打交道的人。柳德米拉决定在全泰拉范围内筹建肃反武装工作队——名义上负责治安与清查，实际上则是革命最锋利的那把手术刀。招募标准只有三条：不怕黑、不怕脏、不怕在深夜被自己的良心叫醒。应征者络绎不绝，落选的同志则被安慰道：别灰心，你们还有更重要的岗位——被监视。"
 REU_Roar_for_Light: "怒号光明"
 REU_Roar_for_Light_desc: "如果光明不肯自己到来，那就把它吼出来。我们对所有正在同卡兹戴尔红军交战的国家宣战——这不是替别人打仗，只是承认一个谁都不肯说破的事实：今天被围剿的是他们，明天就轮到我们。让铳声、钟声和怒吼一起响起来，让那些坐在王座上的老爷们听清楚：这一次来的，不是又一支溃败的叛军。"
 REU_Roar_for_Light_tt: "我们对所有正与§Y卡兹戴尔红军§!交战中的国家宣战；§Y卡兹戴尔红军§!成为我们的§Y傀儡国§!；战争结束时，§Y卡兹戴尔王国§!与§Y卡兹戴尔罗阇国§!将由§Y卡兹戴尔红军§!吞并。"
REU_Tyrant_Watch_Network: "暴君行踪观测网"
REU_Tyrant_Watch_Network_desc: "情报的最高境界，不是知道你在想什么，而是知道你在哪里、和谁、什么时候。观测网将各国宫廷顾问、感染者、工人与商人零零碎碎的汇报，编织成一张密不透风的大网。从此，泰拉之上任何一位暴君的行程，都在柳德米拉的案头一览无余。参谋们惊叹于这张网的缜密，柳达只是平静地补了一句：别夸得太早——网是死的，人是活的，我们要做的，是让活人相信这张网从来就不存在。"
