 REU_dem_reform.16.t: "大会前的阶段报告"
 REU_dem_reform.16.d: "在今天，政治保卫局的柳德米拉同志已经整理好了这段时间民主改革的成果，并且决定将这些成果文件完完整整汇报给塔露拉同志。\n那么改革的结果是……"
 REU_dem_reform.16.a: "我们成绩不会说谎，但还是有不小问题。"
