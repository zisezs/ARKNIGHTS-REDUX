#人物
 REU_Talulah: "塔露拉·雅特利亚斯"
 young_idealist: "年轻的理想主义者"
 REU_Talulah_desc: "§L大地为什么还没有尽头。\n\n对于那个在东达利亚的冻原上辗转数年的游击队来说，他们的领袖，塔露拉，是整个冻原上最神秘的谜团。她的身世如何，她的力量为何如此强大，她所言的理想到底为何物？这些疑问并不只是游击队战士们所独有，塔露拉同样疑惑着。她短暂的童年在龙门度过，作为一个贵族家庭的孩子被抚养长大，然而在一场冲突后，她被她后来的养父和仇人，科西切公爵，带到了乌萨斯远东茫茫的冻原上。她仍然以贵族女孩的身份被养大，并且作为科西切公爵的继承人在各种宴会与沙龙中游荡。在看清了科西切与他的蛇鳞们的邪恶蓝图后，塔露拉以为自己看清了真相，她选择成为感染者，用自己的力量杀死了科西切的肉体，但她只成功了一半。科西切成为了一个阴魂不散的幽灵，在她的脑海中挥之不去，黑蛇告诉她，她不可能看清这片大地的面貌，否则便是落入她最恐惧的深渊——成为黑蛇。\n\n勇敢而茫然的塔露拉随后出逃，在一个村庄中遇见了她一生中最亲密的人，阿丽娜。当村庄遭到感染者纠察队的袭击后，塔露拉自以为她找到了另一条道路，一条不同于黑蛇那丑陋幻想的崭新道路，那就是带领感染者们夺回属于他们的公正。带着这样的理想，或是幻想，塔露拉聚集起了一支感染者队伍，并且找到了由“爱国者”领导的另一支游击队，并且成为了两支队伍共同的领袖。但在长久的流离和战斗中，塔露拉从小接受的贵族教育使得她无法真正融入其他感染者之中，而在无意义的血腥战斗中，她也不止一次怀疑自己理想的价值，加上科西切的鬼魂仍旧在她耳边不止地低语，也许让这个年轻领袖彻底的崩溃，只剩下最后一根弦。§!"
 young_socialist: "年轻的社会主义者"
 REU_Talulah_red_army_desc: "§L“反抗会为大地带去希望。”\n\n塔露拉·雅特里亚斯，一个在东达利亚的冻原上战斗了数年的战士，直到那一场意外的相遇后，她和她的队伍才找到了战斗的真正意义。萨卡兹红军的到来不只是让游击队获得了更强的力量，他们带来的最有价值的东西是一种思想，一种以启蒙运动为渊源，由亚历山大·马佐夫和韦伯·海森提出并完成，由康拉德·克内希继续发展，并传授给塔露拉·雅特里亚斯的思想。\n\n塔露拉幼时所接受的贵族教育帮上了她的忙，她得以比其他人更先一步地理解这个意在摧毁所有贵族和豪绅的思想，并且变成这个被称为“共产主义”的崭新理念的忠实卫道士。在新思潮的洗礼下，塔露拉之前的迷茫最终得到了解答，而黑蛇的诅咒也不知不觉中倒在了在批判的武器下。\n\n但是批判的武器代替不了武器的批判。游击队和萨卡兹红军开始主动扩张自己的势力，并且将理想的光芒播撒到冻原的村落之间。感染者纠察队所受到的袭击越来越频繁，临近的城市中也出现了幽灵的传闻，贵族们开始恐惧而谨慎地审视这个失控的“蛇鳞”，她已经成为了一个幽灵，一个共产主义的幽灵，在东达利亚的冻原上游荡。§!"
 REU_Buldrokkastee: "“爱国者”·博卓卡斯替"
 REU_Buldrokkastee_desc: "§L萨卡兹勇士中古老至极的血脉。乌萨斯最壮毅的战争化身。人民联合阵线的脊骨。叶莲娜的父亲。这些就是“爱国者”博卓卡斯替所拥有的名号。知道他过往经历的人少之又少，大部分人只知道这个老人曾经与其他温迪戈从卡兹戴尔离开，并且最终成为了乌萨斯帝国军中的一员。依靠他高超的战斗技艺和运筹帷幄的才华，博卓卡斯替在乌萨斯军队中步步高升，但就在他一步步接近一个军人最渴望的荣誉的途中，一场由他亲手制造的惨剧结束了他儿子的生命。悲痛的博卓卡斯替率部叛走，继承了儿子遗志的他带领自己的部下游走于东达利亚的冻原上，将后半生奉献给了对抗乌萨斯当局和解放感染者的事业中。\n\n在这场事业中，他救下了一个孤儿，并将她收为自己的养女；他遇到了一个年轻人，并帮助她建立起了新的组织；他遇到了另一个萨卡兹，并让自己老迈的大脑接受了她的思想。他和这些年轻人们从漫无目的地游荡到有计划地夺取胜利，从被敌人围剿的狼狈到攻下一座座城市的意气风发，博卓卡斯替终于第二次感受到了年轻的感觉。如今，他被选举为东达利亚苏维埃的临时主席，领导与乌萨斯帝国政府的最终决战。博卓卡斯替将为千千万万如他的儿子一般被迫害而死的乌萨斯人民复仇，并且为千千万万如他的养女一般年轻的乌萨斯青年赢得一个更美好的未来。§!"
 the_patriot: "爱国者"
 REU_Alina: "阿丽娜"
 REU_the_teacher: "孩子们的老师"
 socialist_mentor: "社会主义导师"
 REU_Alina_desc: "§L“你不许恨任何人。”\n\n阿丽娜并不是一个喜欢做梦的人，当多年以前，塔露拉与她在木屋的篝火旁绘声绘色地说着那些美好的蓝图时，阿丽娜只会温柔地笑着，并且在内心担忧着塔露拉的理想。毕竟，她从一开始就处于苦难之中，冻原中生存的艰难，帝国统治的残暴，她所见过的远比那个理想主义者更多。但是她们成功了，随着乌萨斯人民联合阵线荡平了东达利亚的所有军阀和贵族，在于乌萨斯帝国政府的最终决战中取胜，整个乌萨斯都被统一在了布尔什维主义，或者说，整合主义的旗帜之下，而在圣骏堡——现在她被称为马佐夫格勒——召开的第一届全乌萨斯苏维埃大会上，阿丽娜凭借她的温和与智慧，当选首任最高苏维埃主席。\n\n相比于联合阵线中的其他领袖，阿丽娜身上的硝烟气十分微弱，她在革命初期的身份便只是一个普通的感染者老师，而之后在组织规模扩大后，她因为不善作战而被塔露拉安排进行书记工作，在此期间，阿丽娜展现了惊人的行政天赋，在她的治理下，根据地的经济和民生水平不断发展，这也成为了人民阵线与帝国当局作战的丰厚资本。与此同时，阿丽娜并没有忽视她身为教师的本职，在革命期间，多部重要的理论著作在她的笔下写就，对布尔什维主义的完善发挥了不可替代的作用。如今，在阿丽娜的领导下，乌萨斯将在物质和精神上获得崭新的生命，成为阿丽娜老师最骄傲的一名学生。§!"
 REU_Alina_desc2: "§L“你不许恨任何人。”\n\n阿丽娜并不是一个喜欢做梦的人，当多年以前，塔露拉与她在木屋的篝火旁绘声绘色地说着那些美好的蓝图时，阿丽娜只会温柔地笑着，并且在内心担忧着塔露拉的理想。毕竟，她从一开始就处于苦难之中，冻原中生存的艰难，帝国统治的残暴，她所见过的远比那个理想主义者更多。§!"
 REU_Yelena: "叶莲娜“霜星”·博卓卡斯蒂娜 "
 ScarletNova: "红星"
 FrostNova: "霜星"
 REU_Yelena_desc: "§L作为“爱国者”博卓卡斯替的养女，“霜星”叶莲娜在他年事已高后便已经开始接管他的许多日常工作，因此，让叶莲娜接过自己的政治衣钵，在博卓卡斯替看来顺理成章。而叶莲娜也并未辜负老元帅的期望，不仅在乌萨斯人民联合阵线的革命战争中立下赫赫战功，并且在根据地建设中同样颇有建树。最后，随着最后一面乌萨斯帝国的旗帜落下，随着圣骏堡被改名为马佐夫格勒，在首届全乌萨斯苏维埃大会上，叶莲娜被选举为首任最高苏维埃主席。\n\n失去双亲的叶莲娜被爱国者给予了第二次生命，而霜星将通过给予乌萨斯第二次生命来回报爱国者的恩情。作为第四“雪怪”野战军的最高指挥官，她将把“雪怪精神”注入乌萨斯的血液中，一扫她所痛恨的乌萨斯军国主义遗毒，未来的乌萨斯，将是一个勇毅无畏而又善良无私的北境巨人，她将以最大的善意去帮助所有社会主义伙伴，并且给予泰拉大地上所有剥削者最残酷最坚决的打击。§!"
 the_teacher: "老师"
 REU_Alina_advisor_before_desc: "人物肖像：\n\n\n\n\n\n\n\n£Alina\n\n\n\n\n\n\n\n\n§L感染者们的老师，这是阿丽娜的职责，也是她自认为的使命所在。自从她与塔露拉一起逃亡，阿丽娜所见之景与她前半生在村庄中所见地狱景象无异，但生性温柔的她并不像塔露拉一般寄希望于战斗，她更相信教育的力量，感染者若要改变世界，首先是改变自己。阿丽娜现在仍然只是和其他人一起担任孩子们的老师，但她已经计划着给更多的感染者们讲课了。§!"
 peoples_teacher: "人民教师"
 REU_Alina_advisor_after_desc: "人物肖像：\n\n\n\n\n\n\n\n£Alina\n\n\n\n\n\n\n\n\n§L感染者们的老师，这是阿丽娜之前的身份，她现在的身份是乌萨斯共产党的书记和根据地的教育部长。这个农家姑娘从未设想过自己能够在政府中担任一官半职，更遑论是一个与当局分庭抗礼的政权中的高官。但是这位埃拉菲亚对此并无压力，阿丽娜谨记着塔露拉的理想和康拉德的教诲，她的书桌旁，除去书记需要处理的来自各地纷繁复杂的文件，还放着成堆的社会主义著作，一些是她翻译的，另一些是她写的。她告诉自己，同时也是告诫，她是为人民服务的，她来自于人民，那么她就要以最大的感恩去回报、去奉献乌萨斯人民。§!"
 REU_snow_monster: "雪怪"
 REU_Yelena_advisor_before_desc: "人物肖像：\n\n\n\n\n\n\n\n£Yelena\n\n\n\n\n\n\n\n\n§L叶莲娜的童年不值一提，无非就是作为异见者的亲属被扔进乌萨斯的感染者矿山，并且在抽杀制度下失去了双亲与祖母罢了。在博卓卡斯替将她救出后，叶莲娜将帝国对她造成的伤害转变成战斗的动力，她成为了“霜星”，雪怪小队的指挥官，同时也是雪怪们的大姐头，尽管他们之中的很多人比她更年长，叶莲娜就是在日复一日的枯燥而血腥的战斗中掌握了指挥和管理的技能。她被认为是最有希望接过爱国者旗帜的人选，并不是因为她是博卓卡斯替的养女，而是因为她冰霜一般的外表下，是一颗如星辰火热的心脏。§!"
 REU_Yelena_advisor_after_desc: "人物肖像：\n\n\n\n\n\n\n\n£Yelena\n\n\n\n\n\n\n\n\n§L也许在党内会有人说，博卓卡斯替让叶莲娜来担任临时副主席是任人唯亲，但没有人能否认叶莲娜天才般的行政技巧和指挥才能。她并不如群众眼中共产党员应当有的样子，热情而亲切，相反，她所作出的决策就如她的外表一般冷酷且果决，不带有一点感情色彩，一切都是为了联合阵线的最高利益。当然，叶莲娜实际上仍然是那个雪怪小队的大姐头，她一直会以最高效的方式让人们感受到她冰冷外表下的温暖，而在当前的局势下，她正是在贯彻着她一直以来的这一原则。§!"
 REU_Lyudmila: "柳德米拉“弑君者”·伊里尼奇娜"
 REU_crownslayer: "弑君者"
 REU_Lyudmila_desc: "人物肖像：\n\n\n\n\n\n\n\n£Lyudmila\n\n\n\n\n\n\n\n\n§L生于科学家家庭的柳德米拉在幼时接受了比常人更好的教育，但她的童年亦如其他乌萨斯百姓一般，被乌萨斯帝国的残暴统治所中断。她的父亲伊利亚被帝国杀死，而她也被迫离开她的家乡切尔诺伯格，被父亲在研究所的同事送往叙拉古。在叙拉古，她遇见了一个鲁珀人，后者扮演着柳德米拉的老师和家长的角色，教会她战斗和收集情报的方法，在柳德米拉认为足够了之后，她离开了叙拉古，回到了冻原上，加入了游击队。在游击队的日子里，柳德米拉所掌握的战斗技巧和情报技能让她很快得到了塔露拉的注意，她被派遣前往各地收集乌萨斯军警的情报，为游击队的作战提供先机，同时渗透进周边的移动城市之中，在城市感染者中散播反抗的种子。§!"
 REU_Misha: "米莎·谢尔盖耶维奇"
 young_scientist: "青年科学家"
 REU_Misha_desc: "§L米莎·谢尔盖耶维奇，又一个被迫害的知识分子后代，通过流亡到炎国边境贸易城市龙门才得以苟全性命，但这也不过是从地狱的底层爬到了上一层，米莎仍然只能生活在贫民窟的阴影之中，恐惧而期待着矿石病有一天能带走自己。转机出现在切尔诺伯格事件发生后，出于合作考虑，乌萨斯人民联合阵线带着一小支特遣部队入驻龙门，而米莎就是在此时认出了她失散多年的弟弟，那支部队中的其中一名指挥官，亚历克斯·谢尔盖耶维奇。亚历克斯在之后将他的姐姐带回了联合阵线的根据地，米莎的矿石病很快得到控制，而她的科学才能也很快得以展现。在以极快的速度完成了中学和大学的学业后，米莎如今成为了远东人民大学的一名高级研究员，领导着多项前沿科技的研究，她的梦想很简单，让这个拯救了她的新生国家在短时间内赶上泰拉列强的科技水平，最好像她读完大学的时间那么短。§!"
 REU_Faust: "萨沙“浮士德”"
 REU_Mudrock: "波希墨丝“泥岩”"
 REU_Mudrock_desc: "人物肖像：\n\n\n\n\n\n\n\n£Mudrock\n\n\n\n\n\n\n\n\n§L“泥岩”是这个神秘的萨卡兹前佣兵的代号，即使她早已脱离原有的佣兵团，这个萨卡兹女孩仍不愿意以真面目示人。在卡兹戴尔陷入混乱时，泥岩选择了独自离开，在漫无目的地游荡中，她收留了一些同样厌倦了战争的佣兵和无家可归的平民。一段时间后，她带领这支规模不小的队伍穿过了乌萨斯的边境，但北方的帝国不接纳感染者，他们只能继续躲藏和奔波。终于，另一支感染者队伍发现了他们，这支自称“整合运动”的游击队和他们一样，在穷苦的环境中奋力挣扎着。泥岩觉得自己可以为他们做些什么，她想起流淌在她血液中的能力。泥岩开始为游击队的战士们建造庇护所，运用她的源石技艺，泥土和岩石可以一瞬间变成一座毛坯房，营地周边的道路可以一转眼变得平坦。泥岩终于在战斗之外找到了新的归宿，不过话虽如此，如果有谁要来破坏她的新家，那么这位前雇佣兵也不会就此善罢甘休。§!"
 REU_kid_of_dirt_and_rock: "土石之子"
 REU_Big_Bob: "“大鲍勃”"
 REU_Skullshatterer: "亚历克斯“碎骨”"


 REU_Yevgenia_Sergeyevna_Michurina: "叶夫根尼娅·谢尔盖耶维夫娜·米丘林娜"
 REU_Yevgenia_Sergeyevna_Michurina_desc: "§L叶夫根尼娅是一名农业学家和食品加工业学家，她因为资助地下读书会的事情被叛徒败露而被流放到了乌萨斯的远东地区，后来其通过女扮男装和自己男性化的名字逃离了远东地区，并最后一路来到了罗奥尔斯克\n\n叶夫根尼娅的研究资料和植物样本虽然都被她自己尽数销毁了，但是作为一名精干的科学家，她把那些最重要的科研结构都记录在了她的大脑当中。所以哪怕到达罗奥尔斯克时他是一无所有的状态，但是依然在和众人的帮助之下，得以继续开展并应用自己的研究成果\n\n叶夫根尼娅对于耐寒、抗旱的玉米与土豆作物的研究使得困扰了根据地已久的饥荒问题得到了缓解，并且她还将自己在农业耕作方面的知识传授给了农民们。而就在她与众人不懈的努力之下，根据地的土壤上第一次长出了饱满大个的作物\n\n当她看见那些曾经消瘦无比的面庞再次焕发出红润之时，她明白这一切的辛苦与努力都是值得了。她或许并不懂整合运动的纲领为何物，但是她知道这群精神焕发的革命者同自己一样，都心系着那些贫苦的人们§!"
 REU_agricultural_expert: "农业专家"

