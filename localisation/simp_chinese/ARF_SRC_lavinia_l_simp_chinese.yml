############################################################
# 叙拉古 (SRC) · 拉维妮娅线「荆棘王座——大审判时代」
# 国策 / 五条成长与固定精神 / 七条限期精神 / 继任与终幕事件
# 定义：common/national_focus/SRC_lavinia_shared.txt
