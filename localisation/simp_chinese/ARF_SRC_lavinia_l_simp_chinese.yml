 SRC_lv_dyn_law_order: "法律即秩序"
 SRC_lv_dyn_law_order_desc: "法官、检察官、警察合成一个人，法槌与弩挂在同一条腰带上。这座城市的秩序只剩一种写法——它恰好是拉维妮娅写的。"
 SRC_lv_dyn_judgment_era: "大审判时代"
 SRC_lv_dyn_judgment_era_desc: "十二张被告席从灰厅搬进了特别法庭。清算名单每多一页，抄回的工厂、酒庄与码头就多一座，政府的余力与街上的恐惧也一起多一格。"
 SRC_lv_dyn_prison_nation: "人人有牢坐"
 SRC_lv_dyn_prison_nation_desc: "法院与改造营成为城市中心。铁丝网后的劳动力修路、建港、开矿、酿酒——这座城市的工程速度来自判决厚度，代价是没有人觉得自己安全。"
 SRC_lv_dyn_penitence_economy: "人人有罪赎"
 SRC_lv_dyn_penitence_economy_desc: "赎罪被折算成数字：纳税、作证、举报、服刑都记分。企业必须收下刑满的人，学校从十岁起教举报义务，利润的一部分自动划进司法改造基金。"
 SRC_lv_dyn_thorn_throne: "荆棘王座"
 SRC_lv_dyn_thorn_throne_desc: "1105 年，国旗上的家族徽记被抹去，换成一株荆棘与一把法槌。家族作为一个法律概念消失了，剩下的只有登记号、配额和一枚徽章。"
 SRC_lv_counterattack: "家族的激烈反扑"
 SRC_lv_counterattack_desc: "十二家族残余把最后的赌注压在\"让这座城没法治理\"上：顾问被威胁、账目被烧、地方上的效忠一夜之间换边。拉维妮娅的回应是把整座国家的稳定押在自己手上——治理从 0% 开始。"
 SRC_lv_timed_thorn_oath: "荆棘手套宣誓"
 SRC_lv_timed_thorn_oath_desc: "三百二十名司法执行官同一天戴上仿制荆棘手套。掌心的血孔让判决和执行之间多了一道疼。"
 SRC_lv_timed_texas_watch: "最后一排的旁听者"
 SRC_lv_timed_texas_watch_desc: "德克萨斯每天去特别法庭旁听，从不发言。法官们知道她在那里，因此把每一份判决书都写完。"
 SRC_lv_timed_dmitri_logistics: "物流与监狱总监"
 SRC_lv_timed_dmitri_logistics_desc: "德米特里同时握着经济命脉与监狱系统。他把两本账并成一本，于是全国的苦役第一次有了运费与工时。"
 SRC_lv_timed_madam_arms: "十二颗子弹"
 SRC_lv_timed_madam_arms_desc: "西西里夫人退掉弹匣，把铳锁进抽屉。旧叙拉古最后一次为新政权的城防让路。"
 SRC_lv_timed_wolf_pact: "狼群的旁观"
 SRC_lv_timed_wolf_pact_desc: "凯撒下令狼之主不得干预。三条商道上的哨探撤走，边境驻军因此被调回城里维持治安。"
 SRC_lv_timed_capital_flight: "资本外逃"
 SRC_lv_timed_capital_flight_desc: "卡西米尔的货架撤走，莱塔尼亚的刺客回国。空出来的厂房由联邦接管，短期物价上扬。"
 SRC_lv_timed_ri_medical: "不登记录罪，只记录体温"
 SRC_lv_timed_ri_medical_desc: "罗德岛医疗队留在改造营外围，只治不收。他们让这张床救活了更多人，也让它每天都在被使用。"
 SRC_lv_tt_counterattack: "获得民族精神 §R「家族的激烈反扑」§!：稳定度上限锁在 0%、顾问雇不动、每约 90 天流失一座非首都核心州，直到【荆棘王座】完成"
 SRC_lv_tt_counterattack_advisor: "§R政治顾问每月被罢免§!（军事与海空顾问的聘用费 ×100，实际雇不起）\n§Y白名单§!：荣誉顾问莱昂图索、联邦物流总裁德米特里"
 SRC_lv_tt_counterattack_core: "每约 §Y90 天§!，一座非首都核心州因家族的地方网络脱离效忠（重新挂上家族盘踞），直到【荆棘王座】完成"
 SRC_lv_tt_succession_polity: "政体转为 §Y司法威权共和国§!（专制主义 · 文官独裁），选举停止"
 SRC_lv_tt_succession_leader: "拉维妮娅·法尔科内就任总统（领袖特质 §Y「审判者」§!：政治点 +100% - 当前稳定度）；莱昂图索退休转 §Y荣誉顾问§!，德米特里保留企业与军事职务"
 SRC_lv_tt_special_court: "特别法庭：不设陪审团、不设上诉；§G情报网络获取 +20%§!（满档计入「法律即秩序」）"
 SRC_lv_tt_judge_police: "法官即警察：司法执行官制度确立，诺埃米·阿尔吉罗任执行官总长"
 SRC_lv_tt_gendarmerie: "首都拉起 §6 个「叙拉古司法执行官营」（6 民团 + 工兵连）"
 SRC_lv_tt_court_centralized: "城邦联合法院强制统一，民族精神 §R「城邦联合法院」§!结束；保守派法官接受司法再教育"
 SRC_lv_tt_emergency_trials: "紧急审判程序永久化：缺席判决、快速执行、财产没收；§Y2 座州§!摆脱家族盘踞"
 SRC_lv_tt_presumption_guilt: "宪法第三修正案：举证责任倒置。§R政治点 -30§!，在任政治顾问当场被罢免"
 SRC_lv_tt_thorn_glove: "荆棘手套列为国家圣物：§Y「荆棘手套宣誓」§!（365 天，组织度 +10% / 训练时间 -10% / 稳定度 -3%）"
 SRC_lv_tt_law_is_order: "灰厅「铳与秩序」废除，民族精神 §R「黑手党治下的国家」§!结束"
 SRC_lv_tt_twelve_settlement: "十二家族及其分支、代理人、企业、资产列入清算名单，§Y3 座州§!摆脱家族盘踞；§R在任的【家族】标签顾问一律去职§!"
 SRC_lv_tt_saluzzo_trial: "萨卢佐审判：阿尔贝托·萨卢佐四十七项罪名成立，终身监禁；§R永久撤掉他的顾问资格§!；拉普兰德出庭作证；§Y2 座州§!摆脱家族盘踞"
 SRC_lv_tt_venezia_trial: "威尼斯审判：法布里奇奥终身监禁（允在监狱酒窖度过余生），安东尼奥同案；§R威尼斯父子俩的顾问资格一并撤销§!；§Y船坞 +2§!（首都）"
 SRC_lv_tt_rossati_trial: "罗塞蒂审判：瓦拉赫死刑、乔万娜出庭作证；§R瓦拉赫的军事顾问资格与乔万娜的政治顾问资格撤销§!；剧团与酒坊并入联邦体系；工业研究加成 +60%"
 SRC_lv_tt_bellone_audit: "贝洛内自查：莱昂图索不起诉，企业改组为联邦物流公司；§Y首都共用工位 +2§!"
 SRC_lv_tt_corporate_prosecution: "企业化家族追溯起诉：罚款、没收非法所得、强制拆分；§Y民用工厂 +2、+2§!"
 SRC_lv_tt_grey_hall_dissolved: "灰厅解散：民族精神 §R「灰厅」§! 与 §R「城邦联合议事会」§! 结束，圆桌进法院地下室展出"
 SRC_lv_tt_national_registry: "《全民司法登记法》：不登记即无积分、无工作、无住房、无医疗；行政发展度升一档"
 SRC_lv_tt_points_punishment: "市民积分改造为赎罪积分：积分不足者列入待审判名单"
 SRC_lv_tt_points_civic: "若已推行 §Y市民积分体系§!（政治树），本格额外 +10 积分；两套刻度互不复用变量"
 SRC_lv_tt_labour_camps: "第一座司法改造营：§Y基建 +2、+2，民用工厂 +1§!"
 SRC_lv_tt_city_prison_plan: "每座移动城市配一座改造营：§Y首都与两座州共用工位各 +2§!；工业发展度升一档"
 SRC_lv_tt_quota: "赎罪配额：举报、作证、劳动、罚金按城市与企业摊派；§Y民用工厂 +2§!，§Y2 座州§!摆脱家族盘踞"
 SRC_lv_tt_association: "连坐：亲属、商业伙伴、前雇员知情不报同罪；§Y2 座州§!摆脱家族盘踞"
 SRC_lv_tt_everyone_a_cell: "全国议会集体自首：§Y政治点 +80§!，所有非首都州 §Y共用工位 +1§!"
 SRC_lv_tt_penitence_economy: "赎罪经济：企业配额雇佣释放人员、司法附加税；§Y政治点 +45§!，工业发展度升一档"
 SRC_lv_tt_forced_labour: "强迫劳动产业：§Y基建 +2、民用工厂 +2、钢 +4§!，农业发展度升一档"
 SRC_lv_tt_reeducation_school: "司法教育学校：刑期与考试挂钩；§Y工业研究加成 +70%§!，教育发展度升一档"
 SRC_lv_tt_thorn_education: "荆棘课程与模拟法庭：§Y教育 +0.5 步兵研究加成§!、稳定度 +4%"
 SRC_lv_tt_new_siracusan: "「新叙拉古人」认证与荆棘徽章：家族身份在法律上不再有位置"
 SRC_lv_tt_dialectic_sin: "阿格尼尔交出教堂：§Y首都共用工位 +2、民用工厂 +2§!，稳定度 §R-2%§!"
 SRC_lv_tt_everyone_pays: "高台演说：赎罪体系建成，§Y政治点 +80、稳定度 +6%§!，贫困发展度升一档"
 SRC_lv_tt_texas_position: "德克萨斯任联邦司法特别顾问：§Y「最后一排的旁听者」§!（730 天，核心防御 +10% / 政治点 +5% / 稳定 -2%）"
 SRC_lv_tt_dmitri_loyalty: "德米特里任联邦物流总裁兼改造营总监（自动入阁，无需雇佣）：§Y「物流与监狱总监」§!（730 天）"
 SRC_lv_tt_lappland_stance: "狼群不来，也不帮忙：§Y陆军经验 +40、战争支持度 +5%§!"
 SRC_lv_tt_madam_legacy: "西西里夫人退出弹匣：§Y「十二颗子弹」§!（730 天，核心州防御 +12%）"
 SRC_lv_tt_wolf_neutral: "狼之主中立：§Y「狼群的旁观」§!（730 天，驻军需求 -15%）"
 SRC_lv_tt_foreign_reaction: "卡西米尔撤出、莱塔尼亚闭关：没收在途资产换 §Y政治点 +80§!"
 SRC_lv_tt_capital_flight: "代价：§Y「资本外逃」§!（540 天，民用工厂产能 -10% / 消费品 +5% / 政治点 +10%）"
 SRC_lv_tt_rodus_ultimatum: "罗德岛医疗队只治不收：§Y「不登记录罪，只记录体温」§!（730 天，损耗 -10% / 组织度恢复 +15%）"
 SRC_lv_tt_throne_polity: "国号改为 §Y叙拉古司法共和国§!（外观名，tag 仍是 SRC），国旗上的家族徽记被法槌与荆棘取代"
 SRC_lv_tt_throne_spirits: "§R「家族的激烈反扑」§!结束，§Y「荆棘王座」§!挂上；旧秩序六精神同时退场，残余的【家族】标签顾问最后一次去职"
 SRC_lv_tt_throne_verdicts: "家族盘踞从全部本土摘除、全部控制州补核心；清算计数达标另有交代（见 src_lv.9）"
 SRC_lv_tt_zone_1: "§Y1 座州§!摆脱家族盘踞（可征兵人口与工厂不再被家族抽走一半）"
 SRC_lv_tt_zone_2: "§Y2 座州§!摆脱家族盘踞（可征兵人口与工厂不再被家族抽走一半）"
 SRC_lv_tt_zone_3: "§Y3 座州§!摆脱家族盘踞（可征兵人口与工厂不再被家族抽走一半）"
