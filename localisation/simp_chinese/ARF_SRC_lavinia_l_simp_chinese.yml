############################################################

 SRC_lv_evt_ok: "记下这一页"
 SRC_lv_succession: "莱昂图索总统被撞飞了！"
 SRC_lv_succession_desc: "新沃尔西尼港口的庆典刚结束，莱昂图索的车队在返回市政厅途中被一辆失控的卡车撞进护栏。德米特里第一个扒开废铁，把人拖出来时，莱昂图索只说了一句：“别让拉维妮娅……一个人……”\n\n三天后，联邦议会紧急推选新总统。拉维妮娅·法尔科内站在大厅中央，荆棘手套按在《联邦宪法》上：“我宣誓，我将以法律之名，审判一切罪人。无论他们姓什么，无论他们曾经拥有什么。”"
 src_lv.101.d: "市政厅顶层的灯亮了一整夜。桌上摆着三份文件：莱昂图索的退休令、拉维妮娅的宣誓稿、德米特里拟的过渡内阁名单。\n\n德克萨斯坐在最后一排，从头到尾没有说话。散会时她对身边的能天使说了一句：“她以前不是这样的。”\n\n“那她以前是什么样？”\n\n德克萨斯看着拉维妮娅的背影：“一个戴着荆棘手套、只想保护弱者的法官。现在……她要保护所有人。从他们自己手里。”\n\n第二天，宣誓仪式在法院广场举行。广场上没有人鼓掌，也没有人离开。"
 SRC_lv_special_court: "特别法庭成立"
 SRC_lv_special_court_desc: "拉维妮娅签署的第一道总统令：成立叙拉古特别法庭，专审内战期间与历史上所有家族相关罪行。不设陪审团，不设上诉，判决即为终审。家族可以请律师——但律师也要接受背景审查。"
 src_lv.102.d: "“新沃尔西尼的法院曾经被家族干预，法官们被威胁、被收买、被暗杀。”拉维妮娅在成立仪式上把法槌放在桌沿，“现在，法庭反过来。”\n\n特别法庭的第一批卷宗有四千二百份，法官只有九个人。首席法官问她要优先级，她指了指墙上的十二枚家族徽记——那是从灰厅搬来的，还没有取下。\n\n荒野边缘，拉普兰德听到消息时对扎罗说：“她疯了。”\n\n“比你还疯？”\n\n拉普兰德沉默了一会儿：“比我疯。至少我只是想毁掉叙拉古。她想审判叙拉古。”"
 SRC_lv_judge_police: "法官即警察"
 SRC_lv_judge_police_desc: "叙拉古没有警察系统的传统被彻底改写。法官、检察官、警察合并为「司法执行官」——一人持法槌与弩，既是判决者，也是执行者。诺埃米·阿尔吉罗被任命为首任执行官总长。"
 src_lv.103.d: "就职仪式上，诺埃米看着手里那两样东西：法槌，和一把制式弩。\n\n“我选了弩，现在您让我同时握住两样。”\n\n拉维妮娅回答：“因为在这个国家，判决和执行之间，不能再有家族塞进来的空隙。”\n\n第一批执行官三百二十人，编成六个营，驻在新沃尔西尼法院地下二层——那里以前是关押赌徒的拘押所，现在改成值勤室。墙上钉着一张城市地图，十二个家族的据点被红笔圈着，红圈旁边写着编号，像菜单。"
 SRC_lv_court_centralized: "城邦联合法院集权"
 SRC_lv_court_centralized_desc: "分裂的城邦联合法院被强制统一。蒙特卢佩的保守派法官召回新沃尔西尼接受司法再教育，拒绝者以妨碍司法统一罪起诉。旧司法体制「城邦联合法院」在这一格正式退场。"
 src_lv.104.d: "一个老法官在法庭上大喊：“你这是独裁！”\n\n拉维妮娅平静地回答：“不。独裁是一个人说了算。我给了你们法律，法律说了算。只是法律恰好是我写的。”\n\n再教育班第一期六十二人，教材是《新都市管理法案》和一九份被家族推翻的旧判决。结业考试只有一道题：写出你曾经因为谁的电话改过哪一份判决书。三分之一的人交了白卷，白卷也被记入档案。"
 SRC_lv_emergency_trials: "紧急审判程序永久化"
 SRC_lv_emergency_trials_desc: "《新都市管理法案》中的紧急审判程序原本只适用于极端情势，现在被永久化：凡涉及家族、黑帮、走私、叛国的案件，均可缺席判决、快速执行、财产没收。"
 src_lv.105.d: "拉维妮娅在签署令上批注了一行字：“叙拉古一直处于紧急状态。只是以前没人敢承认。”\n\n永久化后的第一个月，特别法庭受理一千一百件案子，缺席判决四百件。有人统计过：从逮捕到执行平均三十九天，而家族时代一场官司平均打四年。\n\n快，是她给这个国家的第二个礼物。第一个是账。"
 SRC_lv_presumption_guilt: "无罪推定废除"
 SRC_lv_presumption_guilt_desc: "联邦宪法第三修正案：涉及家族背景、黑帮关联、走私、叛国的案件，举证责任倒置——被告需自证清白，否则有罪。"
 src_lv.106.d: "修正案宣读那天，贝洛内企业总部静得能听见空调声。德米特里把文件放在病床上，莱昂图索读了很久。\n\n“她在审判所有人。”德米特里说。\n\n莱昂图索声音虚弱：“德米特……去看着她。别让她……变成她最恨的那种人。”\n\n德米特里沉默了很久：“我试试。”\n\n他没有去。他只是把贝洛内家的全部账册整理成三份目录，等着特别法庭来取。"
 SRC_lv_thorn_glove_law: "荆棘手套法则"
 SRC_lv_thorn_glove_law_desc: "贝纳尔多送她的荆棘手套被列为国家圣物。所有司法执行官必须佩戴仿制品——手套内侧有尖刺，握拳时刺入掌心，提醒执法者：正义之路以流血为代价。"
 src_lv.107.d: "诺埃米戴上手套的第一天，掌心被刺出七个血孔。她没有摘下来。\n\n仿制手套由威尼斯家族的皮匠坊赶制，一双手十八里拉，全国配给。领用登记表上要求填写：你打算用这只手做什么。大多数人写“开枪”，少数写“判决”，有一个人写“签字”。\n\n拉维妮娅把那个人的表格留了下来，夹进《国家圣物名录》第一页。"
 SRC_lv_law_is_order: "法律即秩序"
 SRC_lv_law_is_order_desc: "灰厅的「铳与秩序」被正式废除，黑手党作为秩序提供者的身份同时终结。叙拉古只有一种秩序：铳归国家，国家归法律，法律归我，而我只归法律。"
 src_lv.108.d: "阿格尼尔在教堂里听到这话时正在擦一个酒杯。他放下酒杯，对身边的西西里夫人说：“她比你当年还狠。”\n\n西西里夫人没有回答。她看着窗外的法院广场，那里竖起了拉维妮娅的雕像——一手持法槌，一手持弩。雕像底座还没刻字，石匠在等一个能刻上去的句子。"
 SRC_lv_twelve_settlement: "十二家族清算令"
 SRC_lv_twelve_settlement_desc: "总统令：十二家族及其分支、残余、代理人、企业、资产全部列入历史罪责清算名单。清算不设追溯期，不设豁免权——贝洛内家也在名单上。"
 src_lv.109.d: "萨卢佐的阿尔贝托在拘留所里收到起诉书时笑了一下：“十二家族清算？她自己就是贝洛内家养大的。”\n\n看守把起诉书放在桌上：“贝洛内家也在名单上。您排第三。”\n\n阿尔贝托的笑容消失了。\n\n名单一共四百一十七个姓氏。抄写员问要不要按字母排序，拉维妮娅说按罪名轻重排。抄到第三行他停了一下——那一行是 SRC 的执政家族。"
 SRC_lv_saluzzo_trial: "萨卢佐审判"
 SRC_lv_saluzzo_trial_desc: "阿尔贝托·萨卢佐被控谋杀、走私、策划暗杀、危害公共安全、组织黑帮等四十七项罪名。审判持续三个月，证词里最长的一段来自他的女儿。"
 src_lv.110.d: "拉普兰德站在证人席上，看着被告席上的父亲。\n\n“你问我恨不恨他？我不恨。他教我家族礼仪、危险驾驶、表演、调酒。他给了我一切，除了自由。”\n\n法官问：“你愿意为他作证吗？”\n\n她沉默了很久，然后说：“我作证——他教会了我所有东西，唯独没教会我怎么做一个人。因为他自己也不会。”\n\n终身监禁。宣判后阿尔贝托对她说：“永别了，女儿。”\n\n“永别了，父亲。”她转身走了，没有回头。"
 SRC_lv_venezia_trial: "威尼斯审判"
 SRC_lv_venezia_trial_desc: "法布里奇奥·威尼斯在自家酒窖被捕，请求把那瓶百年红酒喝完。他被判终身监禁，允许在监狱酒窖里度过余生——威尼斯家的码头与载具工坊同时收归联邦。"
 src_lv.111.d: "执行官同意了。老威尼斯喝完酒，站起来，整理了一下西装。\n\n“威尼斯家族能聚而不散，全仰仗一个词——体面。现在，让我体面地走。”\n\n拉维妮娅对这一判决的批注是：“体面不是免罪的理由。但监狱也可以有体面的牢房。”\n\n码头仓库的封条贴了三天就撕了——联邦海军部要船坞，港务局要吊车，最后两家用一条中线把码头分成两半，各挂各的牌。"
 SRC_lv_rossati_trial: "罗塞蒂审判"
 SRC_lv_rossati_trial_desc: "瓦拉赫在乔万娜遇刺后接任罗塞蒂首领，被控背叛、谋杀未遂、勾结外国势力。死刑。罗塞蒂的文化产业、剧团与酒坊并入联邦宣传与教育体系。"
 src_lv.112.d: "审判中，乔万娜出庭作证。她看着被告席上的瓦拉赫：“我曾经相信你。你说你是罗塞蒂的忠诚。现在我知道了，你只忠诚于你自己。”\n\n瓦拉赫被判处死刑。乔万娜在判决后对拉维妮娅说：“我曾经恨他。但现在……我只想写一个剧本，关于一个背叛者的故事。然后把它烧掉。”\n\n剧本后来还是排演了三场，票全部送给改造营的家属。烧掉的是手稿，第四场的观众散场时没有人鼓掌。"
 SRC_lv_bellone_audit: "贝洛内自查"
 SRC_lv_bellone_audit_desc: "贝洛内家列入清算名单，但莱昂图索本人不起诉——他主动放弃家族身份、参与建设新沃尔西尼。德米特里作为新家主，向特别法庭提交了家族全部档案。企业改组为联邦物流公司。"
 src_lv.113.d: "拉维妮娅在法庭上问德米特里：“你为什么这么做？”\n\n“因为我是军师。军师的职责是让家主做出最好的选择。莱昂选择了新沃尔西尼，我替他完成剩下的清算。”\n\n德米特里免于起诉，贝洛内企业强制改组为联邦物流公司，他任执行总裁，不再拥有家族头衔。\n\n挂牌那天，他对病床上的莱昂图索说：“贝洛内没了。”\n\n“贝洛内早就没了。从父亲服毒那天起就没了。现在没的……只是名字。”"
 SRC_lv_corporate_prosecution: "企业化家族追诉"
 SRC_lv_corporate_prosecution_desc: "萨卢佐酒业、贝洛内企业、罗塞蒂文化公司、威尼斯载具公司——所有企业化家族被追溯起诉。已注册的罚款、没收非法所得、强制拆分；未注册的直接没收。"
 src_lv.114.d: "清算局的第一份资产表：酒庄十七座、码头四座、剧团六家、运输公司两家、地下钱庄十七个、名义存款与实物折算合计十四亿里拉。\n\n第二份表写着这些资产原本雇了多少人：三万八千。第三份表是处置方案——拆成联邦企业，保留岗位，原股东一律不得任职。\n\n有人问拉维妮娅这样会不会吓跑资本。她说：“叙拉古的资本本来就是赃物。我们要做的是让它变成生产资料。”"
 SRC_lv_grey_hall_dissolved: "灰厅余孽扫除"
 SRC_lv_grey_hall_dissolved_desc: "灰厅正式解散，十二家族席位废除。任何自称家族代表者，以冒充公职人员罪起诉。圆桌被搬进法院地下室，作为历史罪证展出。"
 src_lv.115.d: "圆桌上的十二枚座椅铭牌被逐一撬下，只留下木屑和指印。讲解员给参观的学校班级发一份册子，封面写着：这里曾经坐着叙拉古的罪人。现在，他们坐在被告席上。\n\n有老师问能不能带走一块木屑。不能。\n\n同一层地下室另一端，展着改造营的监舍复原模型，一床、一桌、一副手套。两个展区共用一条参观线，出口在食堂。孩子们说这是他们见过最难走的博物馆。"
 SRC_lv_national_registry: "全民登记制度"
 SRC_lv_national_registry_desc: "《全民司法登记法》：每个公民必须登记家族背景、经济来源、社会关系、旅行记录。未登记或虚假登记以妨碍司法论处。没有登记，就没有积分、工作、住房、医疗与教育。"
 src_lv.116.d: "一个老卡车司机在登记站前排队时对伊雷妮说：“这比家族时代还严。”\n\n伊雷妮沉默了一会儿：“但至少登记的是所有人，不是只针对普通人。”\n\n她自己也是队伍里的一个。登记表的第十七栏写着「你曾为哪个家族工作」，她在这一栏停了很久，最后填的是「叙拉古」。窗口后面的办事员抬头看了她一眼，把这一份单独放进右边的抽屉——右边的抽屉专门放这种答案。"
 SRC_lv_points_and_punishment: "市民积分与刑罚挂钩"
 SRC_lv_points_and_punishment_desc: "市民积分体系改造成赎罪积分：纳税、社区服务、举报犯罪、出庭作证、服刑都计分。积分不足者自动列入待审判名单。"
 src_lv.117.d: "托希娅在黄金平原破产后回到新沃尔西尼，发现自己的积分因为「曾为外国资本服务」被清零。她站在登记站前，手里攥着那张积分卡。\n\n“我……现在是什么？”\n\n登记员头也不抬：“待审判人员。排右边的队。”\n\n右边的队比左边的短，因为右边的人不需要办事，只需要等。"
 SRC_lv_labour_camps: "劳改营建设"
 SRC_lv_labour_camps_desc: "新沃尔西尼城外第一座司法改造营建成。家族残余、黑帮分子、走私贩、叛国者被送进去修路、建港、开采源石、酿造公共葡萄酒。甘比诺与卡彭任警卫。"
 src_lv.118.d: "甘比诺看着铁丝网后的犯人，对卡彭说：“我以前差点进这里。”\n\n卡彭回答：“我以前差点死在这里。现在我是警卫。”\n\n甘比诺笑了一下：“新沃尔西尼真够神奇的。”\n\n那天他们排的是十二小时班。下班后甘比诺去领了自己的司法登记表，在「职业」一栏写「出租车司机」，在「职务」一栏写「警卫」。办事员问他两个都算吗。他说都算，一个是我干的，另一个是他们让我干的。"
 SRC_lv_city_prison_plan: "移动城市监狱化改造"
 SRC_lv_city_prison_plan_desc: "每座联邦移动城市必须建至少一座司法改造营。城市空间重新规划：法院与改造营成为城市中心，剧场与集市让位给队列与围墙。"
 src_lv.119.d: "布鲁奈罗城的代表抗议：“我们是城市，不是监狱！”\n\n拉维妮娅的回复只有一句话：“没有家族的城市，必须先清洗家族的罪。清洗之后，才是城市。”\n\n新城市规划图发下去时，法院画在城市正中心，改造营紧贴它的外环，第三环是工人住宅。布鲁奈罗的建筑师在图上补了一句批注：如果罪人的数量少于预期，第三环就要拆。"
 SRC_lv_penitence_quota: "赎罪配额制度"
 SRC_lv_penitence_quota_desc: "每座城市、每个企业、每个社区必须完成年度赎罪配额：举报数量、作证次数、改造营劳动时长、罚金额度。未完成配额的联邦拨款削减。"
 src_lv.120.d: "伊雷妮的运输保障署第一个完成配额。她在报告上批注：“我们的司机现在既是运输工，也是司法线人。索默尔，我不知道这是不是你想要的。”\n\n批注写完她自己也愣了一下——她已经很久不提索默尔了。她把纸翻过去，正面重新打印了一份没有名字的版本，两份都归档。档案员按顺序排列，把带名字的那一份放在了外面。"
 SRC_lv_guilt_by_association: "连坐制度"
 SRC_lv_guilt_by_association_desc: "家族残余的亲属、商业伙伴、前雇员，只要被证明知情不报，一律连坐。轻则罚金，重则入狱。"
 src_lv.121.d: "埃里奥在维尔蒂酒庄被收购后，因为「曾为萨卢佐酒业采购」被列入连坐名单。他在法庭上辩解：“我只是个采购员！”\n\n拉维妮娅亲自审理此案：“采购员经手的每一瓶酒，都可能成为家族贿赂的工具。你不知道？那是你的罪。你知道？那是更重的罪。”\n\n判罚金八千里拉，折抵十四个月劳动。他交了钱，然后登记成为线人——不是因为悔过，是因为罚金实在太高。"
 SRC_lv_everyone_a_cell: "人人有牢坐"
 SRC_lv_everyone_a_cell_desc: "拉维妮娅在联邦议会发表演说：叙拉古的每一个人都有罪，区别只在于有人赎完了，有人还在赎。演说结束后，议会大厅变成了自首大厅。"
 src_lv.122.d: "“家族有家族的罪，普通人有沉默的罪，法官有妥协的罪，我有我自己的罪。从今天起，叙拉古没有无罪之人——只有赎罪者，和待赎罪者。”\n\n议会大厅沉默了很久。然后一个议员站起来，伸出手：“我自首。我曾经收过罗塞蒂家的钱。”\n\n然后是第二个、第三个。\n\n拉维妮娅坐在总统席上，荆棘手套按在宪法上。她的掌心还在流血。"
 SRC_lv_penitence_economy: "赎罪经济"
 SRC_lv_penitence_economy_desc: "联邦经济改造为赎罪经济：企业必须雇佣一定比例的改造营释放人员，消费者缴纳司法附加税，利润的一部分自动划入司法改造基金。"
 src_lv.123.d: "德米特里的联邦物流公司第一个执行。他把公司会议室改名为「赎罪厅」，每次开会前先宣读上一季度的司法配额完成情况。\n\n莱昂图索在病床上看到那份报告时，对护士说：“他比我还像莱昂图索。”\n\n护士没有接话。她把托盘收走，回家填了自己的登记表——她以前是罗塞蒂家的侍女，档案里那一栏写得含糊，她决定自己写清楚。"
 SRC_lv_forced_labour: "强迫劳动产业"
 SRC_lv_forced_labour_desc: "改造营犯人为联邦建设提供免费劳动力：港口扩建、铁路铺设、源石开采、葡萄园种植。所有基础产业都依赖改造营。"
 src_lv.124.d: "一个外国记者问拉维妮娅：“这是否构成强迫劳动？”\n\n“这是赎罪。他们欠叙拉古的，他们在还。还清了，就自由了。”\n\n“有还清的人吗？”\n\n拉维妮娅沉默了一会儿：“有。但很少。”\n\n记者把这句话写进报道，标题是《还清就自由》。报道在叙拉古被列为煽动性材料，罚款三千里拉；在卡西米尔卖疯了，稿费刚好够缴罚金。"
 SRC_lv_reeducation_school: "思想改造学校"
 SRC_lv_reeducation_school_desc: "每座改造营配套建设司法教育学校。犯人在劳动之余学习《联邦宪法》、卢比奥演讲集与拉维妮娅判例法。考试不合格者，刑期延长。"
 src_lv.125.d: "卢奇诺·德蒙塔诺——翁贝托的孙子——在改造营学校里读到了卢比奥的日记。他在作文里写道：“我爷爷是个杀手，但他也是个好裁缝。我不知道怎么定义他。”\n\n老师批注：“不需要定义。需要赎罪。”\n\n作文后来被贴在学校走廊的优秀作品栏。卢奇诺每次路过都加快脚步。毕业那天他没有领毕业证，领的是一张新的登记表。"
 SRC_lv_thorn_education: "荆棘教育"
 SRC_lv_thorn_education_desc: "所有联邦学校开设荆棘课程：十岁起学法律、司法程序与举报义务，每学期末佩戴荆棘手套参加模拟法庭。"
 src_lv.126.d: "小贝蒂——维尔蒂酒庄工人的孙女——在模拟法庭上扮演法官。她判了一个同学「未举报家族残余罪」。同学哭了。贝蒂也哭了。\n\n老师问贝蒂为什么哭。贝蒂说：“因为我知道他是无辜的。但我必须判他有罪。”\n\n老师说：“这就是荆棘。你做得对。”\n\n那天放学，贝蒂把判决书折好放进口袋，回家路上经过法院广场，她停下来看了很久那座雕像，然后回家把判决书烧了。烧之前她签了自己的名字。"
 SRC_lv_new_siracusan: "新叙拉古人"
 SRC_lv_new_siracusan_desc: "叙拉古不再有家族成员，不再有普通人，只有叙拉古人。完成年度赎罪配额者，获发一枚荆棘徽章——佩在身上，证明你赎清了上一年的罪。"
 src_lv.127.d: "甘比诺和卡彭在巡逻时，看到满街的荆棘徽章，对彼此说：“我们是不是也该去领一枚？”\n\n卡彭回答：“我们已经是警卫了。警卫的罪比普通人大。配额更高。”\n\n他们后来还是去领了，一人一枚，编号在第一批。发徽章的办事员记得他们是排队时互相替对方签字的那两个。"
 SRC_lv_dialectic_of_sin: "罪与罚的辩证法"
 SRC_lv_dialectic_of_sin_desc: "阿格尼尔在教堂里最后一次见拉维妮娅。他把教堂钥匙放在桌上：我帮不了你，但我也不会阻止你。这是你的叙拉古。"
 src_lv.128.d: "“你知道你现在做的事，和家族有什么区别？”\n\n“家族是让人沉默。我是让人开口。家族是让人害怕。我是让人认罪。”\n\n阿格尼尔摇头：“都是让人活不下去。”\n\n拉维妮娅沉默了很久，然后说：“那我至少让他们死得有理由。”\n\n他转身离开。拉维妮娅拿起钥匙，握在掌心。荆棘手套的尖刺刺入皮肤，血滴在教堂地板上。第二天，教堂照常开放，只不再生孩子洗了——登记处接管了洗礼册。"
 SRC_lv_everyone_pays: "人人有罪赎"
 SRC_lv_everyone_pays_desc: "法院广场的高台上，拉维妮娅脱下手套，露出满是伤疤的掌心：从今天起叙拉古没有无辜者，但每一个罪人都有机会成为新人。代价是自由、财产与沉默。"
 src_lv.129.d: "“家族的罪、法官的罪、总统的罪、你们的罪——我们都有罪。但我们也有赎罪的权利。”\n\n她重新戴上手套，举起手。\n\n“把它们交出来，换回一个干净的叙拉古。”\n\n广场上，数万人同时举起荆棘徽章。阳光照在徽章上，反射出一片红色的光。有个外地来的商人问他旁边的司机：那是什么仪式。司机说：不是仪式，是账。"
 SRC_lv_texas_position: "德克萨斯的位置"
 SRC_lv_texas_position_desc: "德克萨斯被任命为联邦司法特别顾问——一个没有实权的荣誉职位。拉维妮娅要她留在叙拉古，也要她看着。"
 src_lv.130.d: "就职仪式上，德克萨斯问拉维妮娅：“你想让我看着你变成什么？”\n\n“看着我不变成你害怕的那种人。如果我变了——你的弩可以说话。”\n\n德克萨斯看着她的眼睛，然后说：“我会的。”\n\n她后来确实每天去法院旁听，坐在最后一排，从不发言。法警私下里管她叫「第七位法官」——特别法庭只有六名法官，第七个不写判决书。"
 SRC_lv_dmitri_loyalty: "德米特里的忠诚"
 SRC_lv_dmitri_loyalty_desc: "德米特里出任联邦物流总裁兼司法改造营总监，一手经济、一手监狱。拉维妮娅知道这是危险的权力，但她需要这份效率。"
 src_lv.131.d: "德米特里在就职演说上说：“莱昂图索制定了规则。拉维妮娅执行了规则。我负责让规则运转。三件事我都做，不是因为忠诚于某个人，而是因为忠诚于新沃尔西尼。”\n\n台下，莱昂图索坐在轮椅上，微微点头。\n\n演说结束后，德米特里去看了他。两个人没有说话，只把一份运营报表留在床头。报表的最后一页写着改造营的开支：人均每日三百二十里拉，比一个士兵的口粮便宜四十里拉。"
 SRC_lv_lappland_stance: "拉普兰德的态度"
 SRC_lv_lappland_stance_desc: "拉普兰德没有回叙拉古。她带着扎罗和狼群留在荒野边缘，只送来一封信：你比我更像狼。至少我吃人从不找理由。"
 src_lv.132.d: "信上只有一行字：“你比我更像狼。至少我吃人从不找理由。”\n\n拉维妮娅把信放进档案柜，在背面批注：“荒野不需要理由。叙拉古需要。”\n\n批注入档要两人签字。档案员签完自己那格，抬头问站在旁边的德米特里要不要看。德米特里说不看，然后补了一句：把它放在能取到的位置。"
 SRC_lv_madam_legacy: "西西里夫人的遗产"
 SRC_lv_madam_legacy_desc: "大审判期间西西里夫人始终沉默。直到阿尔贝托被判刑那天，她让文带了一句话：你做了我当年该做但没做的事。代价会很大。"
 src_lv.133.d: "拉维妮娅回话：“我知道。但我不是您。我不需要铳。我有法律。”\n\n西西里夫人听完回话，拿起那把从拉特兰带回的铳，退出弹匣，把子弹一颗一颗放在桌上。十二颗。然后她把铳放回抽屉，再也没有拿出来。\n\n抽屉的钥匙她交给了教堂。阿格尼尔没有收，他说：您留着，哪天要用得着它的时候，说明我的教堂也保不住了。"
 SRC_lv_wolf_lords_neutral: "狼之主的中立"
 SRC_lv_wolf_lords_neutral_desc: "凯撒召集狼之主会议讨论是否干预大审判。扎罗第一个表态：拉普兰德说这是人类自己的游戏，我们不参与。狼群因此不动手，叙拉古的边境不必驻兵。"
 src_lv.134.d: "大帝补充：“那个叫拉维妮娅的女人，比我们更了解什么叫『游戏』。她把整个国家变成了法庭。这种游戏，狼群玩不了。”\n\n凯撒点头：“那就看着。看人类能把自己审判到什么程度。”\n\n会后，狼群撤走了三条商道上所有的哨探。叙拉古的驻军因此从边境撤回两千人在城里修围墙——报告上写的是「治安需要」。"
 SRC_lv_foreign_reaction: "外部势力的反应"
 SRC_lv_foreign_reaction_desc: "卡西米尔商业联合会永久撤出叙拉古市场，莱塔尼亚「永恒恩典」召回全部刺客并关闭边境。外资撤离留下的空位由联邦接管，短期物价上扬。"
 src_lv.135.d: "沙雷在离开前对记者说：“那个国家疯了。他们审判所有人，包括他们自己。”\n\n莱塔尼亚的内部报告只有一句结论：“拉维妮娅政权不可预测。她不受贿，不妥协，不恐惧。建议：远离。”\n\n哥伦比亚大使递交国书时问：“您的国家还有自由吗？”\n\n“自由是赎罪的奖赏。不是天赋的权利。”\n\n大使把这句记在备忘录上，回国后成了对叙拉古贸易制裁的开场白。"
 SRC_lv_rodus_ultimatum: "罗德岛的最后通牒"
 SRC_lv_rodus_ultimatum_desc: "凯尔希要求停止把感染者送入改造营。拉维妮娅答：感染者不是罪人，但隐瞒感染状况、用感染逃避司法登记的人是。罗德岛留下医疗队，关系降至冰点。"
 src_lv.136.d: "凯尔希沉默了很久，然后说：“你会毁掉这个国家。”\n\n拉维妮娅回答：“或者，我会让它第一次干净。”\n\n通讯结束后，罗德岛的医疗队没有撤——他们把野战医院搬进了改造营外围，只治不收。军医在门口挂了块牌子：此处不登记录罪，只记录体温。这块牌子后来成了连坐名单上的一条罪名，又因为军队要用那张床，罪名被划掉了。"
 SRC_lv_thorn_throne: "荆棘王座"
 SRC_lv_thorn_throne_desc: "1105年，叙拉古联邦共和国更名为叙拉古司法共和国。国旗上的家族徽记被彻底抹去，取而代之的是一把法槌与一株荆棘。"
 src_lv.137.d: "“三年前，我说过：叙拉古没有无罪之人。今天，我可以告诉你们——叙拉古的罪，已经赎了一半。”\n\n广场上，十万人同时举起荆棘徽章。远处，德克萨斯站在港口塔吊上看着这一切。\n\n能天使问：“她在变成什么？”\n\n“她在变成叙拉古自己。家族时代，叙拉古用血来赎罪；拉维妮娅时代，叙拉古用法律来赎罪。方式变了，赎罪的本质没变。”\n\n“那这是好事还是坏事？”\n\n德克萨斯看着广场上十万人齐刷刷举起的手：“我不知道。但至少……他们举的是徽章，不是刀。”\n\n荒野边缘，拉普兰德看着新沃尔西尼的灯火。扎罗问：会逃出去吗？\n\n“当然会。因为牢里关的是叙拉古人。而叙拉古人……从来不会认命。”"
 SRC_lv_tt_need_succession: "需要 1101 年 9 月的继任事件中选择 §Y「拉维妮娅是亲密战友！」§!"
 SRC_lv_tt_era_open: "拉维妮娅·法尔科内宣誓就任叙拉古联邦共和国第二任总统：§Y荆棘王座线§!解锁"
 SRC_lv_tt_regency_dmitri: "德米特里·贝洛内组织护国委员会——拉维妮娅线本次不开"
 SRC_lv_tt_mourning: "全国哀悼一个月，戒严推迟——拉维妮娅线本次不开"
