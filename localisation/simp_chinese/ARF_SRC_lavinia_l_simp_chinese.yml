 SRC_lv_tt_dock_confiscate: "威尼斯家的码头收归联邦：§Y船坞 +2§!（首都）"
 src_lv.1.t: "莱昂图索总统被撞飞了！"
 src_lv.1.d: "新沃尔西尼港口的庆典刚结束，莱昂图索的车队在返回市政厅途中被一辆失控的卡车撞进护栏。德米特里第一时间赶到现场，把莱昂图索从废墟里拖出来时，莱昂图索只说了一句话：“别让拉维妮娅……一个人……”\n\n三天后，莱昂图索宣布因健康原因退休。联邦议会紧急推选新总统。拉维妮娅·法尔科内站在大厅中央，荆棘手套按在《联邦宪法》上。\n\n“我宣誓，我将以法律之名，审判一切罪人。无论他们姓什么，无论他们曾经拥有什么。”\n\n德克萨斯坐在最后一排，面无表情。"
 src_lv.1.a: "拉维妮娅是亲密战友！"
 src_lv.1.b: "让德米特里稳住局面"
 src_lv.1.c: "先办国葬，别急着选人"
 src_lv.2.t: "又一座州不再交税了"
 src_lv.2.d: "清算名单上的姓氏还有四百多个，可税册上的名字少了一个。地方官押着账本送来解释：不是丢了地，是镇上的人换了个称呼——他们不再说「家族收的税」，改成说「以前收的税」。\n\n拉维妮娅把这份说明归档，编号排在上一份后面。同一天，登记站多了一队人，他们来登记，也来问：那座州的人还算叙拉古人吗。"
 src_lv.9.t: "荆棘之后"
 src_lv.9.d: "改名令下达那天，裁缝先把旗帜上的家族徽记拆下来，再问绣什么。答案是两样东西：一把法槌，一株荆棘。绣工问荆棘要不要画出血。拉维妮娅说：不画。留白，让看的人自己算。\n\n法院地下室里，灰厅的圆桌摆在灯下，桌面还留着十二个人的指印。参观的班级排队走过，最后停在一块牌子前：这里曾经坐着叙拉古的罪人。现在，他们坐在被告席上。\n\n远处荒野，拉普兰德看着新沃尔西尼的灯火。扎罗问她：会逃出去吗？\n\n“当然会。因为牢里关的是叙拉古人。而叙拉古人……从来不会认命。”"
 src_lv.9.a: "把荆棘绣上去，不画血"
 src_lv_news.1.t: "叙拉古换了一位总统"
 src_lv_news.1.d: "莱昂图索·贝洛内在一场交通事故中重伤并宣布退休，法官拉维妮娅·法尔科内经联邦议会紧急推选就任第二任总统。她宣誓以法律之名审判一切罪人，并在就职首日签署成立特别法庭的总统令。观察者注意到，清算名单的第一页就写着贝洛内家的姓氏。"
 src_lv_news.1.a: "这就是我们的法律"
 src_lv_news.1.b: "看着他们把自己审判到什么程度"
 src_lv_news.2.t: "叙拉古成为司法共和国"
 src_lv_news.2.d: "联邦议会通过《第四号改名令》：叙拉古联邦共和国更名为叙拉古司法共和国，国旗上的家族徽记被法槌与荆棘取代。十二家族作为一个法律概念在同一天消失。各国使馆注意到，新政府的第一份照会里没有提到任何一位家族首领的名字——因为已经没有这样的人了。"
 src_lv_news.2.a: "法律即秩序"
 src_lv_news.2.b: "愿上帝宽恕他们，我们只负责记账"
 Siracusa_judicial_republic: "叙拉古司法共和国"
 Siracusa_judicial_republic_ADJ: "叙拉古司法"
 Siracusa_judicial_republic_DEF: "叙拉古司法共和国"
 SRC_lv_judger: "审判者"
 SRC_lv_judger_desc: "她写过叙拉古第一部把家族钉在被告席上的判决书，也读过自己签下的每一份没收令。法槌落下时她不看被告——她看旁听席，因为那里坐着的才是她要说服的人。\n\n政治点获取 §G+100%§!，再减去当前稳定度（§Y审判者的天平§!，每 10% 稳定度扣 10%）。"
 SRC_lv_dyn_judger_scale: "审判者的天平"
 SRC_Federal_Service: "【联邦任职】"
 SRC_Federal_Service_desc: "家族的头衔被联邦收回，换成一张任命书。他还是贝洛内家的人，但发工资的是国家——所以拉维妮娅的家族顾问清洗名单上没有他。"
 SRC_lv_dyn_judger_scale_desc: "审判者的权柄按这座城市的良心多寡来折价：稳定度越低，她越需要政治点去推动审判；稳定度回升，说明恐惧已经不需要那么多力气维持，扣减也就越重。§R当前扣减随稳定度每月刷新§!。"

