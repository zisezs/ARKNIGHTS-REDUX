l_simp_chinese:
 PEACE_POPUP_TITLE: "外交提醒"
 PEACE_POPUP_DESCRIPTION: "[GetWarStatus]"
 PEACE_POPUP_FLAVOR: "[GetFlavor]"
 PEACE_POPUP_CLOSE: "关闭"
 PEACE_POPUP_FLAG1_TT: "§G战胜国：§![winning_country.GetFlag]§Y[winning_country.GetName]§!"
 PEACE_POPUP_FLAG2_TT: "§R战败国：§![losing_country.GetFlag]§Y[losing_country.GetName]§!"
 PEACE_POPUP_COUNTRY_PLURAL: "及其盟友"
 PEACE_POPUP_COUNTRY_SINGULAR: ""
 PEACE_POPUP_COUNTRY_PLURAL_HAS: "及其盟友已"
 PEACE_POPUP_COUNTRY_SINGULAR_HAS: "已"
 PEACE_POPUP_WAR_CONCLUSION: "[GetWarConclusionLoc]"
 PEACE_POPUP_WAR_CONTINUING: "[GetWarContinuationLoc]"
 PEACE_POPUP_WAR_CONCLUSION_DEFAULT: "§Y[winning_country.GetNameWithFlag]§![GetWinnerAlliesWithHas]在战争中击败了§Y[losing_country.GetNameWithFlag]§![GetLoserAllies]。"
 PEACE_POPUP_WAR_CONCLUSION_URS: "在为§Y东乌萨斯的命运§!而战的过程中，§Y[winning_country.GetNameWithFlag]§!征服了§Y[losing_country.GetNameWithFlag]§!。"
 PEACE_POPUP_WAR_CONCLUSION_TAR_independence: "在§Y维多利亚内战§!中，§Y[losing_country.GetNameWithFlag]§![GetLoserAlliesWithHas]承认了§Y[winning_country.GetNameWithFlag]§!的独立。"
 PEACE_POPUP_WAR_CONCLUSION_CFC: "在§Y第二次世界大战§!的进程中，§Y[winning_country.GetNameWithFlag]§!已在无人荒野布置好了§Y前线司令部§!。"
 PEACE_POPUP_WAR_CONTINUING_DEFAULT: "在一场仍在进行的冲突中，\n§Y[winning_country.GetNameWithFlag]§!成功地击败了§Y[losing_country.GetNameWithFlag]§!。"
 PEACE_POPUP_FLAVOR_DEFAULT: "战争从未改变。"
 PEACE_POPUP_FLAVOR_FGL: "请陪在我身旁，因为斗争尚未止息。"
 PEACE_POPUP_FLAVOR_BRN: "被压迫人民得出的结论是：仁慈是无法根绝凶恶的。"
 PEACE_POPUP_FLAVOR_REU: "我希望时间能更慢一点，我们与同志们围在篝火旁。"
 PEACE_POPUP_FLAVOR_SKH: "要想让神灵满意——并非易事。"
 PEACE_POPUP_FLAVOR_UFE: "自由会在门口欢欣地迎接你们，弟兄们会把利剑送到你们手上。"
 PEACE_POPUP_FLAVOR_KMG: "然而，大忿怒的日子终将到来……谁又能逃脱？"
 PEACE_POPUP_FLAVOR_BAK: "他们知道一旦自己被审判，他们龌龊至极的贪欲，他们污秽无比的心思，这些都会暴露在乌萨斯国民面前！"
 PEACE_POPUP_FLAVOR_KRS: "失败了的时候，什么事情看起来都是愚蠢的！"
 PEACE_POPUP_FLAVOR_SGT: "保重啊，弟兄们，保重；保重啊，弟兄们，一定要活下去啊！"
 PEACE_POPUP_FLAVOR_CYB: "他们不知道为什么要生在世上，只得拼命地互相咬嚼，不给对方留余地地恶口相加。"
 PEACE_POPUP_FLAVOR_NAX: "由于这位暴君所实行的恐怖统治，他占据了他的臣民的心。"
 PEACE_POPUP_FLAVOR_OMN: "诸人皆未能成事，而半途终之……悲哀啊，悲哀。"
 PEACE_POPUP_FLAVOR_YAN: "魂而有知，无嗟久客。"
 PEACE_POPUP_FLAVOR_YYZ: "夜久语声绝，如闻泣幽咽。"
 PEACE_POPUP_FLAVOR_YAB: "赵客缦胡缨，吴钩霜雪明。"
 PEACE_POPUP_FLAVOR_TNT: "三界无安，犹如火宅。"
 PEACE_POPUP_FLAVOR_VIE: "没有什么比独立自由更可宝贵的了。"
 PEACE_POPUP_FLAVOR_ANA: "盖闻仁义之举，要在安民；吊伐之师，莫先去暴。"
 PEACE_POPUP_FLAVOR_HGS: "四十九年一睡梦，一朝荣华一杯酒。"
 PEACE_POPUP_FLAVOR_NHS: "悠悠天地事，鉴照在明神。"
 PEACE_POPUP_FLAVOR_LOS: "我自己是凡人，我只要求凡人的幸福。"
 PEACE_POPUP_FLAVOR_CAM: "我虽说涅槃，是亦非真灭，诸法从本来，常自寂灭相。"
 PEACE_POPUP_FLAVOR_TAR_independence: "塔拉独立"