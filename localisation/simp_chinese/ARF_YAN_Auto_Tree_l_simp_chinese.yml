YAN_auto_tree_tt:0 "§Y司岁台正在自行推进这棵国策树。§!\n根格「司岁台的观察日记」完成后，其余国策会自动依次完成。"
YAN_auto_tree_progress_tt:0 "§Y司岁台正在推进。§!\n已执行 §G$FLAG_DAYS$§! 天 / 每格 35 天。"
YAN_auto_1_desc:0 "工欲善其事，必先利其器。老话，可永远不过时。兵器好不好，先看家伙什顺不顺手。熔炼、浇铸、砥砺，工具差一步，成色差一截。都别嫌烦，把家当置办齐了，往后能少流多少血。\n——年，在锻坊开炉时发言"
YAN_auto_2_desc:0 "材料学大跳跃？听起来玄乎，其实就是炼得多、试得多、错得多。铠甲厚一分重十斤，薄一分要人命，这中间的分寸，是拿废料堆出来的。我的身体内部可是一千四百度喔。连我都觉得烫的东西，一定有前途。\n——年，在锻坊开炉时发言"
YAN_auto_3_desc:0 "拷打工造司？哈，我先声明，这词儿是他们说的，我只管问话。铁料去哪了？炉子为什么停？这个月的账为什么对不上？别紧张，我问话就这样。做工匠的不怕火，就怕心里有鬼。好好交代。\n——年，在锻坊开炉时发言"
YAN_auto_4_desc:0 "玄极巨兵，入列。念着真带劲。这大家伙从构想到落地，一炉一炉试出来的，中间炸了几个我就不说了。巨兵是死的，开它的人是活的，都给我爱惜着用。另外，睡觉离它远点，它会打呼噜。\n——年，在锻坊开炉时发言"
YAN_auto_5_desc:0 "百灶议事，众将聚于一堂，这样的场面久违了。会议不谈虚的，只谈三件事：兵练到什么程度、粮备到什么数目、关墙修到哪一段。我列席旁听，有话便说。武人议事，少些客套，多些实的。\n——重岳，在玉门城头练拳时发言"
YAN_auto_6_desc:0 "办军校，是老夫多年的心愿。打仗不能只靠血勇，得有学问：测绘、操典、军械、医官，样样要教。教官从各军里挑，学员从行伍里选，纨绔子弟一个不收。三年之后，老夫要看到一批能带兵的年轻人。\n——太尉，在军帐里批军报时发言"
YAN_auto_7_desc:0 "军中歪风，和案中邪气一个理：不趁早断，就要烂到骨子里。克扣粮饷、冒功请赏、私相授受，哪一条不是大罪？雷法不留情面，律法同样不留。诸位若行得正，不必怕我；若行不正，五雷轰顶。\n——惊蛰，在大理寺翻卷宗时发言"
YAN_auto_8_desc:0 "军魂是什么？老夫说不好大道理，只知道一件事：打不散、拖不垮、守得住。这支队伍从尸山血海里爬出来过，魂就是那时候攒下的。今日重提军魂，是给新兵立个样子，也给老卒提个醒：手里的魂，不能丢。\n——太尉，在军帐里批军报时发言"
YAN_auto_9_desc:0 "灯光、摄影、预备，开机。我跟你们讲，这部片子我想了很久了，讲的就是咱们自己的故事。剧本？剧本在我脑子里。预算？别提预算，提预算伤感情。放心，火候我拿捏得住。\n——年，在锻坊开炉时发言"
YAN_auto_10_desc:0 "淬炼二字，重在淬。好钢要入水，好兵要见阵。我带新兵不讲情面：三九三伏，桩功不许断；对练失手，疼了也得记住。一支部队的底子，是汗水泡出来的。半年之后，愿你们都能挺直腰杆说一句，我练过。\n——重岳，在玉门城头练拳时发言"
YAN_auto_11_desc:0 "勘测土地，先把地当活物看。哪里水脉通、哪里土层厚、哪里风沙大，得一步一步走出来、量出来。这活儿急不得，可也拖不得，种子下地要看时节。测绘的先生们辛苦些，你们的图纸，就是明年田里的收成。\n——黍，在大荒城的田里时发言"
YAN_auto_12_desc:0 "源石尘？那玩意儿我在北边见得多了，粘上就是麻烦。清理不难，难在防反复，扫干净了，风一吹又回来。我出个法子：净的地方管住，脏的地方烧透，人要轮班，扛不住就说。研究归研究，命是自己的。\n——老天师，在天师府炼丹时发言"
YAN_auto_13_desc:0 "庄稼人传下来的老规矩，就是物尽其用：壳能喂畜，秆能烧火，一粒都不许糟蹋。如今办工厂也一样，边角料有边角料的去处。慢些没关系，一步一步来，贪多嚼不烂。地力如此，人力也如此。\n——黍，在大荒城的田里时发言"
YAN_auto_14_desc:0 "邪魔来了，先把人心定住。庄稼人最明白这个理：地里的灾年年有，慌没有用，得提前备。我的意见是三条：存粮、修墙、安民。邪魔再凶，凶不过人心齐。守护好这片土地，让更多的人能吃饱饭。\n——黍，在大荒城的田里时发言"
YAN_auto_19_desc:0 "又到下田的时候了。今年走三个州，看苗情、问水情、查虫情。有人说这些事派人去就行，可我不放心。种子的事，隔着一层人就隔着一层真。闻道有先后，今年的功课，还是一步一步来。田里见。\n——黍，在大荒城的田里时发言"
YAN_auto_21_desc:0 "这册子记的是岁兽动静，也是人心动静。秉烛人随身带着，逐日记、逐事记，今日哪片云有异、哪个镇子有传闻，一字不落。有人问我记这些做什么，我答：忘了教训的人，迟早再吃一次亏。\n——左乐，在司岁台抄卷宗时发言"
