#民族精神
 IST_loose_surveillance: "较为宽松的内卫监视"
 IST_loose_surveillance_desc: "作为皇帝费奥多尔放置在东乌萨斯的桥头堡，科米公爵携着镇压叛乱的无上荣光坐镇于此，为圣骏堡打开东乌萨斯的窗口。为了奖赏他的忠诚，费奥多尔命令他的内卫放宽了对于科米公爵领的监视，这让其他旧贵族领地都暗暗恼恨嫉妒不已。\n§R如果我们的军队数量超过15个师，会引发严重的后果!§!"
 IST_rigorous_surveillance: "严苛的内卫监视"
 IST_rigorous_surveillance_desc: ""
 IST_new_economy: "新经济政策的荣光"
 IST_new_economy_desc: "由于对乌萨斯帝国局势的清醒认知，在大叛乱中一举翻盘，成为费奥多尔的忠臣的科米大公爵敏锐地意识到，属于先帝的时代已经逝去，各种扎根于北境帝国身躯上的毒瘤和痼疾如不尽早拔除，迟早会葬送乌萨斯的千年荣光，顺带着还有他全族的身家性命。为此，阿尔罗德不仅在大叛乱中背刺了旧贵族，更是在自己的新领地中推行和圣骏堡相似的经济政策，倡导相对自由的经济、经济私有化，和周边的其他贵族领地进行贸易谈判以获得经商特许权，有效促进了科米公爵领的经济发展。"
 IST_elegy_of_oldaristocracy: "旧贵族的哀歌"
 IST_elegy_of_oldaristocracy_desc: "新时代的序曲，旧贵族的哀歌。科米公爵对不服从于他的旧贵族的敌视和打压，让在他治下的诸多旧贵族的生活日益艰难。多项特权的被收回，让他们失去了在经济、政治和军事等诸多方面的优势。心有不甘的旧贵族试图在舆论上指责科米公爵的残忍无情，但被毫不留情地击败，被旧贵族掌控的部分出版社和广播电台也被充公。在科米的公爵议事会里，流传着这样一句话：“任何反对公爵阁下的人和事，都会被无情地碾碎。”"
 IST_honor_blade_of_ISTi: "荣耀的科米之刃"
 IST_honor_blade_of_ISTi_desc: "阿尔罗德对军事和源石工业的重视并没有超出他人对他的预估，因为这是他立足于此的根基。新经济政策产生的大量财富被倾注于此，铸造了实力雄厚的科米禁卫军。禁卫军不仅保障了公爵阁下全族的生命财产安全，更是南征北战、拓土开疆，为科米公爵带来了无尽的利益。强悍勇猛的士兵、船坚炮利的舰队，不仅能稳固疆土、还能震慑宵小，被阿尔罗德亲切地称赞为“荣耀的科米之刃”。"
 IST_council_of_dukes: "公爵议事会"
 IST_council_of_dukes_desc: "在领地筹建之初，阿尔罗德就仿照圣骏堡的帝国议会的结构，结合实际情况组建了属于他的公爵议事会。公爵议事会以科米公爵为议长，追随于他的诸位贵族担任议员，负责对全领地诸多事务的统筹安排，且拥有在特殊时期不经公爵本人允许的情况下调动军队的权力。在公爵议事会的领导下，公爵领日益兴旺。但谁又知道，这只是另一场乱世的序章？\n§R一旦老公爵逝去，事情可能会有变故...§!"
 
#国策
 IST_death_of_duke: "公爵之殇"
 IST_death_of_duke_desc: "自从公爵打猎身受重伤以来，整个科米就隐隐有所预感。科米的媒体上，开始连篇累牍地报导公爵的功绩，并为公爵祈福。而等到公爵薨逝的消息突然传来时，我们才惊愕地发现，原来我们真的没有做好公爵离去的准备。整座城市都陷入了巨大的悲恸之中。\n公爵的去世给科米的发展带来了沉重的打击，人们不知道，未来接手这座城市的主人，能否延续公爵时代的辉煌？"
 IST_emergency: "紧急状态"
 IST_emergency_desc: "自从公爵身死，科米城内的人心就开始动荡起来，市场价格开始剧烈波动，市民在酒吧饭馆窃窃私语，贵族们也频频互相联络……如果不做些什么，后果难料。\n在秘密进行了对公爵的收殓仪式后，公爵议事会就宣布进入了紧急状态，无论是弹压贵族，还是平抑物价，或者发表演讲安抚人心，至少我们真的有在为科米的稳定而努力。"
 IST_block_messages: "封锁消息"
 IST_block_messages_desc: "公爵在这二十多年的执政生涯里有无数的敌人，其中的大部分已经被碾碎为尘埃，而少数顽强的那些，还在边缘的角落里狺狺狂吠。为了更好地处理科米的局势，我们必须封锁消息流通渠道，设立哨卡、控制媒体、严查邮政，务必不能让任何公爵去世的消息在我们完全掌握局势之前泄露出去，防止某些毒蛇突然咬我们一口。纵然没什么大碍，但有小丑在一旁蹦跶，也足够让人烦心了。"
 IST_troubled: "困顿危局"
 IST_troubled_desc: "对于一个政权来说，开明而强势的君主能保证社会的稳定，但缺点也是显而易见的——若是权力交接的对象不是一个明君，或者没能及时找到这样一个继承人，那么随之而来的混乱会让整个社会都陷入漫长而迟缓的痛苦中。\n遗憾的是，公爵的子女们对于政事并不熟稔；而放眼望去，整个公爵府连一个称得上是守成之君的人都没有。这让整个公爵议事会都陷入了为难之中。\n但现在的局势已经容不得迟疑了，权力真空期的诱惑也不能阻止我们去面对并处理骤然紧张起来的局势。西边的圣骏堡还在观望着我们做出什么样的选择，而东边的萨文哥罗德还在虎视眈眈找寻我们的弱点，更何况宫廷之中也并不是一条心。作为公爵以下的最高权力机构，我们必须立刻处理这三个难题，然后收拢军权，为以后任何有可能发生的危机做预案。"
 IST_towering: "巍峨西岭"
 IST_towering_desc: "科米的西部边境，是巍峨的乌拉尔山脉，将乌萨斯的疆土凌厉划开。这里的高山终年积雪，这天然的冰雪屏障不知道埋葬了多少足以震动整个帝国的秘密。为了帝国的安宁，科米可谓是煞费苦心。而现在，为了保证公爵崩逝的消息只在可控的范围内传播，我们必须对这里进行相关的布置。"
 IST_assured_to_StChunsburg: "向圣骏堡保证"
 IST_assured_to_StChunsburg_desc: "公爵的薨逝必然已经被皇帝陛下的内卫看在眼里了，所以我们不能对圣骏堡有任何的隐瞒。在圣骏堡做出任何我们不希望看到的行动之前，我们必须立刻联系圣骏堡，向维特议长汇报此事，想必注重帝国稳定的维特议长必然会要求我们以最快的速度稳定下来并予以我们适当的支持。所以，现在就去起草一份充满保证意味的讣告吧，直连圣骏堡频道的大型基站已经准备好了。"
 IST_proposal_for_the_Ural_Line: "“乌拉尔防线”提案"
 IST_proposal_for_the_Ural_Line_desc: "乌拉尔山脉作为东西方的交界线，历来也是刺探和传递情报的战场。间谍、特工……无数的情报人员在这里来回穿梭、收集情报，而这正是我们所不能容忍的。借着整顿军防的机会，我们的军事专家维亚切斯拉夫·乌斯季诺维奇·布柳赫尔提出，可以派遣情报部门在乌拉尔山脉沿线的各个关卡和山口进行更加严密的部署，严查消息的流通渠道，剿灭敌方特工，并散布假消息以混淆视听。毕竟，科米的边防，也不是铁板一块。那么，现在就开始准备策划案吧。"
 IST_blood_sceptre: "血色权杖"
 IST_blood_sceptre_desc: "自从一千年前，乌萨斯的先祖从神民的手中夺来权柄，围绕至高王座的血腥杀伐就从来没有停止过。那宫殿上空猎猎飞舞的双头鹰王旗，见证了无数次罔顾人伦、无耻背叛的阴谋算计、刀光剑影。公爵崩逝，宫廷人心浮动，贵族们的眼光全部都投向了这座以精巧瑰丽著称的公爵府，试图得到更有用的第一手消息。权钱交易、腐败贪污，这腐朽肮脏的金币之河在公爵未曾瞑目之时就渗透进来，真是败坏了公爵的名誉。更不要提这其中可能蕴藏的阴谋了。"
 IST_cleansing_the_palace: "肃清宫闱"
 IST_cleansing_the_palace_desc: "侍卫与侍女私通传递情报、管家将公爵府的秘密明码标价，这些吃里扒外的蠹虫，他们的脑子里只有卢布和珠宝，一丝一毫都不曾想起过公爵给予他们的仁慈！还有公爵家族中的某些脑满肠肥的家伙，竟然偷偷与某些贵族藕断丝连，根本就不配享有普罗尼切夫家族的荣耀！帝国在上，以公爵议事会的名义，将这些叛徒全部肃清！"
 IST_noble_ball: "贵族舞会"
 IST_noble_ball_desc: "衣香鬓影，纸醉金迷。歌舞升平的舞会，被贵族们视为传递情报的好机会。\n在这段风雨飘摇的日子里，仍然有不少贵族频繁举行舞会，名义繁多，花样繁多。绅士们们举起酒杯，在酒杯碰撞声中谈判交锋；女士们折扇轻摇，在言笑晏晏间交换利益。精妙的谋算、残忍的清洗，人性的阴暗面在热闹而繁华的舞会中逐渐滋生，纠缠为逐渐覆盖整座城市的浓云。这样不受控制的多人集会在敏感时期是极为刺眼的。我们需要搞清楚那些贵族到底在盘算什么，不能让他们影响大局。必要时，无论是利益许诺还是停职调查，议事会皆可授权，最重要的是把躁动的贵族们都安抚下来，我们可没那么多精力与这些脑子里装满了金钱和权力的蠢猪们作过多纠缠。"
 IST_vast_east: "苍茫东原"
 IST_vast_east_desc: "北国的荒原，总是飘扬着漫天的雪花。那皑皑白雪之下，不知葬了多少冤魂？不过这一切不重要。科米与萨文哥罗德交战多年，烽烟已然焚遍了整个东部平原，北阿尔泰和斯塔夫罗波尔便是从中诞生的残渣，死伤的人多的真是难以计数。这些伤痕，也只不过是公爵称霸史上微不足道的一个注脚。现在，让我们把视线在这些伤痕上多驻留一会儿，调整防线、购买粮食、镇压锈锤、应对萨文哥罗德的试探，处理掉一切不安稳因素，我们才有机会在将来把东方的这一片沃土彻底纳入科米的掌控之中。"
 IST_adjust_the_eastern: "调整东部防线"
 IST_adjust_the_eastern_desc: "驻扎在公爵领东部的军队是公爵最忠实的鹰犬，时刻紧盯着敌人的动向，同时维护着一片地区的稳定。我们要想办法，以最小的代价将这支驻军的军心稳定下来，并根据最新的局势调整针对萨文哥罗德的防线。没有任何一个人希望看到军队哗变，对吧？"
 IST_buy_food: "购买粮食"
 IST_buy_food_desc: "虽然不是很愿意承认，但斯塔夫罗波尔确实控制了东乌萨斯唯一的大粮仓。鉴于目前暂且缓和下来的局势，议事会并没有针对这一地区的作战方案，但这并不代表我们就真的放弃了对这里的企图。现在，我们必须收起贪婪的心思，和斯塔夫罗波尔的领导人们好好谈一谈，争取谈下一笔不会让他们起疑的粮食订单，然后用这些粮食去慰问我们辛苦的东部驻军，让他们继续为科米的安全添砖加瓦。"
 IST_suppression: "镇压锈锤"
 IST_suppression_desc: "至于北阿尔泰这个锈锤国度，我们的评价是混乱无序，充斥着绝望与暴力。他们不承认科米公爵的权威，并杀光了我们派出的所有工作人员，光这一点我们就永远无法容忍他们。趁着这一次整顿军防，不妨好好教训他们一下，削弱他们的实力，让他们认识到科米的尊严不容挑衅。"
 IST_whose_probing: "萨文科罗德的试探"
 IST_whose_probing_desc: "也许是我们的工作出现了些许纰漏，又或者是敌人太过谨慎，总之萨文哥罗德方面也对军队进行了调整，甚至有数支伪装成商队的斥候试图穿过我们的防线，所幸的是被我们及时发现了。站在科米最东边的要塞城关之上，可以看到遥远的荒原对面，萨文哥罗德舰队缓缓移动的黑影。事态似乎开始变得严峻起来了。为了阻止局势恶化，外交大臣米哈伊尔·尼古拉耶维奇·伊万诺夫主动请缨前往周旋，相信他一定会带来好结果的。"
 IST_council_disputes: "议事会争端"
 IST_council_disputes_desc: "局势暂且安稳下来了，所有的阴谋与鲜血都消散在黑暗之中，至少表面上看是这样。至于公爵的后事，也在和公爵府商议后选择秘密发丧，将风险降到最低。\n接下来，该重新梳理内政了。我们需要审视科米的发展状况，召开议会，商讨接下来的发展路线。你说新任公爵？你确定普罗尼切夫家族还有能人吗？当然，老公爵的儿女还是有几个的，我们也需要对他们进行评估，至少不能选一个昏庸的人做了主君，败坏我科米的荣光。\n所以，这些就是议事会所商讨的议题，不出意料会吵得很凶。我们得早点多做些准备，免得到时候手忙脚乱。"
 IST_divergence_of_routes: "路线分歧"
 IST_divergence_of_routes_desc: "新一届议事会召开了，财政大臣和防卫大臣果不其然地互相撕了起来，他们各自所认为的科米发展路线截然不同，这也意味着自公爵去世后新政派和守旧派的矛盾被正式摆在了台面上。诸位中立的议员们紧闭嘴巴，担忧地看着两派的议员们唾沫横飞地讲述着己方的观点和逻辑论证，并对对方的观点予以毫不留情地驳斥。中央新闻署署长恩克勒·留里科维奇·萨甫库耶夫试图劝和，但也被喷得和孙子一样。新政派的财政大臣奥克纳·波里索维奇·扎罗夫坚持老公爵一贯以来的政策，认为科米要强盛就必须给社会松绑，让经济活跃起来，鼓励更多在可控范围内的竞争，这要才有更多的财富被投入到军工发展之中；而守旧派的防卫大臣克利弗兰·乌斯蒂诺维奇·泰尔勒则认为科米的发展成果是由他们旧贵族创造出来的，所以科米的未来必须由旧贵族和他们的后代所掌握。两派越吵越凶，甚至差点上演全武行，最后不欢而散。中立的议员们面面相觑，看着宫殿外阴沉的天空，心中十分担忧。太平的日子，该不会要结束了吧？"
 
#事件
 event_IST.1: "来自圣骏堡的疑虑"
 event_IST.1.t: "来自圣骏堡的疑虑"
 event_IST.1.d: "有人说他们是幽灵，有人说他们是黑暗中的阴影，有人说他们是这片冰封大地伺机而动的怪物；也有人说北境最恐怖的冰森地狱都不如他们冰冷的面罩下发出的梦魇吐息，不管如何稀奇古怪的称呼和传说，他们都被人们习惯称呼为一个名字——皇帝的利刃，乌萨斯帝国迄今为止的谜团。\n\n乌萨斯皇帝的鹰犬注视着东乌萨斯的一举一动，自“大叛乱”碾碎了先帝的旧秩序和乌萨斯的黄金岁月，这些精锐的内卫部队就随时监视着东方的一举一动，随时准备为议会报告某些旧贵族居心叵测的小动作。\n\n科米公爵领自1094年来膨胀的军力愈发引起来自圣骏堡的重视，他们正在疯狂扩充自己的武装力量。皇帝的内卫徘徊在这片土地上，注意到林立的军营内擦洗的明亮的步枪和法杖，排列整齐的人员在接受一定的战斗训练，此外他们甚至发现了在规定条例内被严格禁止的小型坦克，科米的武装部队数量迅速膨胀，达到了某个让内卫的心弦绷紧的数字。\n\n科米公爵领自1094年来膨胀的军力愈发引起来自圣骏堡的重视，他们正在疯狂扩充自己的武装力量。皇帝的内卫徘徊在这片土地上，注意到林立的军营内擦洗的明亮的步枪和法杖，排列整齐的人员在接受一定的战斗训练，此外他们甚至发现了在规定条例内被严格禁止的小型坦克，科米的武装部队数量迅速膨胀，达到了某个让内卫的心弦绷紧的数字。\n\n三天后，一封来自圣骏堡的书信抵达了科米公爵领，上面用漂亮工整的字体写下了短短几句话，要求新的监督专员进驻领地内的军事机构，确保当前公爵领的“全部战斗人员”的数量都在他们的预估之内，这种种条例堵上了所有的漏洞，无疑意味着新的枷锁。"
 event_IST.1.a: "......听起来不太走运。"


