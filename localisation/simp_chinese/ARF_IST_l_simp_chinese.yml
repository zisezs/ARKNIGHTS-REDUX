#国家领导人
 IST_Arrod_Yevmorovich_Pronichev: "阿尔罗德·叶夫莫罗维奇·普罗尼切夫"
 IST_Arrod_Yevmorovich_Pronichev_desc: "与东乌萨斯的其他贵族不同，阿尔罗德·叶夫莫罗维奇·普罗尼切夫确确实实是个能精准判断局势并永远选择去做拥有长远利益的事的人。在很久以前他就是旧贵族中的异类，对他人习以为常的陈腐事物有自己的见解。曾悄悄接触过哥伦比亚先进书籍的他，在当初旧贵族联合掀起叛乱的前夕，他就知道必输无疑，并果断在形势急转直下之时背弃同僚落井下石，获得了镇压叛乱的无上殊荣。在他接受了科米大公爵的册封之后便知道，这是费奥多尔对他的信赖，也是一次考验。但长久浸淫在政治名利场中的阿尔罗德又怎么会怕在圣骏堡和旧贵族之间周旋呢，只有做到最好，才能活下去，并迎接新时代的曙光。\n\n科米城中常年流传着一句谚语：“太阳东升西落，科米青松永驻。”千年以降，从来没有哪一位领袖能在西北东达拉提亚平原获得如此高的民心的，阿尔罗德便是第一个。他缓和了贵族与平民之间的阶级矛盾，推动了工商业的发展，对治下百姓相对宽容的政策使得他的民望高涨，是科米民众眼中最仁慈的君主。\n\n与此同时，为了维持领地的和平以及开拓疆土，他长期维持着绝对忠诚于他的禁卫军，对内肃清叛徒，对外征战四方，近二十年来从来没出现任何差错。轰鸣的炮火与凛冽的刀锋遍布全领，用荒野里残破的钢铁废墟与断头台上堆积如山的叛徒尸首震慑着心怀不轨的叛乱者们。为了支撑这笔庞大的开销，繁荣的工商业是他抽取税赋的重要来源。领地内的税务官们兢兢业业地在各地按照科米公爵颁布的法令收取税务并如数上交，因为禁卫军在时刻盯着他们，官逼民反这种破事阿尔罗德实在是反感极了。\n\n不过他也不是什么都能做到。他的军队仍然会受公爵议事会的掣肘，尽管现在的议事会几乎是他的一言堂。近来，某些议员们开始不安分了，有证据表明他们在私底下和旧贵族频频接触。阿尔罗德开始思考，该用什么方法，在这个乱世再次到来的前夕，整合内部的力量"
 IST_Orkna_Borisovich_Zarov: "奥克纳·波里索维奇·扎罗夫"
 IST_Orkna_Borisovich_Zarov_desc: "奥克纳·波里索维奇·扎罗夫出身于莱塔尼亚的一个乌萨斯移民家庭，接受过莱塔尼亚最杰出的教育；后又远赴哥伦比亚留学，接触过最先进的科技和思想。身为骏鹰族的他并没有忘记自己的祖国，但在刚回到乌萨斯时曾遭到过多次旧贵族的排挤和打压，甚至差点丧命。在某次死局之中，科米公爵对他伸出了援助之手。他来到了这片曾经荒芜破败的土地，并火速获得了公爵的信赖和提拔，成为新政的领头羊\n\n议事会的诸位议员在提起奥克纳的时候，第一印象永远是优雅。浸润了莱塔尼亚数百年贵族礼仪的他站在议事大厅的演讲台上时，永远都是那么文质彬彬，犀利但不失优雅的话语让与他争论的其他议员感觉自己就是跳梁小丑。当他清冷的目光透过金丝眼镜投向某处席位时，人们就知道，这位财政大臣找到了自己的猎物，而且永远都能获得胜利。\n\n作为科米公爵最信赖的掌握全领地财政大权的财政大臣，他知道这一切荣誉和职位都是公爵阁下赐予的。作为一个外人，他必须竭尽全力为公爵阁下服务，才能在他的羽翼下施展自己的抱负。近二十年来，他遭遇的风险挫折数不胜数，但都被一一化解。他不怕困难，一力辅佐着公爵施行新政，因为这不仅是为了报答公爵对他的救命之恩，而且他也想让他魂牵梦萦的祖国重新焕发生机。\n\n“只有科米公爵领才能带领我们探索出那条通往乌萨斯千年伟业的真理之路。”\n\n——奥克纳·波里索维奇·扎罗夫"
 IST_Clifrand_Ustinovich_Terle: "克利弗兰·乌斯蒂诺维奇·泰尔勒"
 IST_Clifrand_Ustinovich_Terle_desc: "克利弗兰其实是个纯粹的旧贵族，自幼成长于旧贵族生活中的他不可避免地养成了那些被科米公爵吐槽为“腐烂的猪圈气息”的旧贵族思维，缅怀先皇时代、厌恶新政、崇尚感染者奴隶制。但他的生死荣辱全在阿尔罗德的一念之间，又因为从小培养的忠诚刻在骨子里，所以当他察觉阿尔罗德试图背刺旧贵族时有了少许犹豫，并最终选择了遵从命令。在那之后他便蛰伏起来，陪着阿尔罗德出生入死，加官进爵，并思索着是否有机会制止执迷不悟的主人。\n\n在人们看来，作为一条忠犬的克利弗兰时刻都以阿尔罗德的命令为最高纲领，并对其他官员和贵族嗤之以鼻。他似乎十分清楚自己的身份定位，只要完全忠于科米公爵，他就高枕无忧。但事实并非如此。\n\n克利弗兰其实是个纯粹的旧贵族，自幼成长于旧贵族生活中的他不可避免地养成了那些被科米公爵吐槽为“腐烂的猪圈气息”的旧贵族思维，缅怀先皇时代、厌恶新政、崇尚感染者奴隶制。但他的生死荣辱全在阿尔罗德的一念之间，又因为从小培养的忠诚刻在骨子里，所以当他察觉阿尔罗德试图背刺旧贵族时有了少许犹豫，并最终选择了遵从命令。在那之后他便蛰伏起来，陪着阿尔罗德出生入死，加官进爵，并思索着是否有机会制止执迷不悟的主人。\n\n克利弗兰其实是个纯粹的旧贵族，自幼成长于旧贵族生活中的他不可避免地养成了那些被科米公爵吐槽为“腐烂的猪圈气息”的旧贵族思维，缅怀先皇时代、厌恶新政、崇尚感染者奴隶制。但他的生死荣辱全在阿尔罗德的一念之间，又因为从小培养的忠诚刻在骨子里，所以当他察觉阿尔罗德试图背刺旧贵族时有了少许犹豫，并最终选择了遵从命令。在那之后他便蛰伏起来，陪着阿尔罗德出生入死，加官进爵，并思索着是否有机会制止执迷不悟的主人。\n\n时至今日，他已经慢慢纠集了议事会中近半数开始厌恶新政的议员们，逐渐与以奥克纳为首的新政派分庭抗礼。而在科米公爵眼中，自己的两位肱骨心腹之间不那么和谐是正常现象，高高在上地俯视着两人之间的小小争斗。只要斗而不破，那斗争产生的结果或许就会对他的公爵领产生更为有用的作用。\n\n但谁又知道，忠心的侍卫，会不会变成刺向心脏的匕首？\n\n“天佑乌萨斯！我只为忠于先皇的主君服务。”\n\n——克利弗兰·乌斯蒂诺维奇·泰尔勒"
 IST_Enkle_Rurikovich_Savkuev: "恩克勒·留里科维奇·萨甫库耶夫"
 IST_Enkle_Rurikovich_Savkuev_desc: "恩克勒·留里科维奇·萨甫库耶夫出生于先帝时代中期，经历过乌萨斯最辉煌荣耀的年代，也是帝国官方批准的第一批公费留学生之一，去过泰拉世界绝大部分国家，也入职过知名媒体公司做记者和编辑，接触了泰拉各国各阶层，对社会现状有较为深刻的反思。\n\n归国后，恩克勒失望地发现，贵族势力盘根错节的首都是不可能会有民主滋生的土壤的。沉重的税赋、严苛的舆论管制以及强制的爱国洗脑教育将市民们几乎都驯化成了服从管教的奴隶。他曾尝试在圣骏堡开办新型的民主媒体，但很快就被号称“帝国喉舌”的传统官方媒体扼杀。不仅如此，他还被敌对势力陷害，只能被迫逃向东方。\n\n此时正值大叛乱结束，被流放的诸位旧贵族在东乌萨斯混战割据的时期。恩克勒看准了科米公爵领在东西乌萨斯双方之间的特殊地位，判断在这一片领地上施行改革或许会有不错的成果，便带着自己多年潜心研究的文稿投奔了科米公爵。科米公爵对此不置可否，但还是把他留了下来，批准其加入新设立的中央新闻署。数年后，便被拔擢为中央新闻署署长，负责统管全科米公爵领的新闻舆论行业。\n\n作为署长，他每天不仅要处理大量的行政工作，对新闻和舆论提出指导意见，还抽出时间去科米各个城市和乡村考察情况，并于深夜在自己的书房里撰写自己的思考。他认为必须保证公民能确确实实获得能保护自身利益的权利以及颁布并严厉贯彻实行遏制官员腐化的政策，必须保障司法独立性，必须实行市场经济、提供社会福利、建立丰厚的基本工资制度等等一系列庞大的社会计划，社会才能发展得更好。\n\n但他也明白，科米公爵领目前最强大的势力乃是财政大臣奥克纳和防卫大臣克利弗兰的两个派系，而认同他的理念的议员和利益集团非常的少，因此经常被两个强权人物当作受气包呼来喝去。但他并不气馁，因为改革没有一蹴而就的，发展是曲折但向上的，他相信社会的未来这样走才是更正确的。因此，他一直默默观望着局势，慢慢拉拢中间势力，等待某一刻的蓬勃燃着。\n\n“乌萨斯人只有走向真正的民主，才能拥抱自由的明天。”\n\n——恩克勒·留里科维奇·萨甫库耶夫"

