 UFE_hard_to_avoid_civilwar_tt:0 "§R这条路线几乎不可能避免反动派叛乱的内战！！§!"
 UFE_HuiFu_XuanJu_tt:0 "在来自§C乌萨斯革命民主党§!甚至§R乌萨斯共产党§!的众多候选人中§Y自主选择§!§G领导人§!和§G二把手§!。\n\n§L共产党人士最多只能担任二把手，且需要我国前期成功实现了与整合运动的和平统一时才会出现。§!"
 UFE_allow_declear_war_to_URS_flag:0 "已完成§Y准备对帝国作战§!国策"
 UFE_Dui_DiGuo_ZuoZhan_tt:0 "允许我们使用§Y决议§!来对[URS.GetFlag]§Y[URS.GetName]§!宣战。\n\n§R注意：一旦我们与帝国开战，一系列有关政治理念和国家统一方略的路线斗争就将在我国政界爆发，同时，剧烈的战争将极大激化社会矛盾并催生经济危机。开战后一月内，我们将解锁第三阶段国策树，以便在对帝国作战期间解决路线斗争和社会矛盾问题。§!"
 
