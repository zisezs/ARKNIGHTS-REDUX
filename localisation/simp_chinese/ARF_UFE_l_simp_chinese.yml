 UFE_war_state_modifier:0 "恐慌与骚乱"
 UFE_intelligence_agency:0 "中央军情部"
 UFE_war_mobilization_laws:0 "战争动员法案"
 UFE_disarmed_laws:0 "一盘散沙的动员系统"
 UFE_war_state_idea:0 "§W地区修正：§!恐慌与骚乱"
 UFE_ZhiAn_BuDui_tt:0 "地区修正§Y恐慌与骚乱§!将在§Y210§!天后自动移除。"
 UFE_AnFu_MinZhong_tt:0 "\n如果§Y奇廷卡斯克§!此时还存在地区修正§Y恐慌与骚乱§!，那么通过§Y合作协议§!时会将其立刻移除。"
 UFE_left_state_modifier:0 "集体农业"
 UFE_right_state_modifier:0 "土地私有化"
 UFE_right_state_modifier_tool:0 "§W地区修正：§!土地私有化"
 UFE_state_modifier_monthly_tt:0 "该§Y地区修正§!每月会传播到一块相邻的我国§Y核心地块§!。"
 UFE_military_production_idea:0 "军工复合体"
 UFE_military_production_idea_desc:0 "通过将军工组织的代表安排进决策机构和代议机构，我们能更好地协调军备生产，让更多资源向军队倾斜。不过，如果我们给了军工复合体太大的权势，他们就有可能反过来钳制我们了……我们必须做好平衡。"
 UFE_yeliqinna_idea:0 "耶里钦娜反对派"
 UFE_yeliqinna_idea_desc:0 "以耶里钦娜和恰达耶夫为代表的自由派政客极为反感平民派运动，认为这是集权主义暴政的前奏。为了不让这种超出宪政框架的暴民行径威胁到刚刚形成的民主制度，耶里钦娜等人打算勾结军队，发起政变。"
 UFE_special_army_idea:0 "军事现状"
 UFE_local_industry:0 "乌萨斯远东建筑公司"
 UFE_local_industry_desc:0 "早在大叛乱爆发之前，就有建筑商来到奇廷卡斯克，并且在这里经营建筑公司。历经数十年的沉淀与革新，远东建筑公司拥有着最丰富的冻土区建设经验，是乌萨斯唯一一个擅长在冻土上设计和建造建筑物的企业。"
 UFE_consumer_goods_factor_idea:0 "查获格伦沃夫赃款"
 UFE_consumer_goods_factor_idea_desc:0 "格伦沃夫还没来得及把他数额巨大的“私财”运出科雷马边疆区，我们很轻松地就拿到了这笔巨款。有了这些钱，我们发起建设和推行政策，就要轻松许多了。"
 UFE_consumer_goods_debuff_idea:0 "政府财政危机"
 UFE_consumer_goods_debuff_idea_desc:0 "格伦沃夫的贪污导致了政府资金短缺，我们发不起公务员薪水，也没有资源来推动政策的落实。"
 UFE_ChuLi_CaiZheng_tt:0 "使格伦沃夫造成的§Y政府财政危机§!在§Y270§!天后移除。"
 UFE_yuan_zhu_min:0 "原住民问题"
 UFE_yuan_zhu_min_desc: "在远东地区活跃着大量以渔猎为生的骏鹰原住民部落，还有一些自骏鹰帝国时期就迁徙至此地从事农牧业的土著乌萨斯人，这些群体普遍敌视帝国官僚的统治，因为他们已经被总督敲骨吸髓了太久太久。原住民们大多骁勇善战，是非常可靠的兵源，但他们观念保守，只在保卫家乡时士气高昂，若是背井离乡就会变成一盘散沙。如何在治理内政时和他们交涉、如何利用他们的军事价值、如何将他们坚决自卫的防御性与我们对外扩张的侵略性统一起来……这些都是我们必须认真思考的问题。"
 UFE_minbingtuan_idea:0 "基层生产建设民兵团"
 UFE_minbingtuan_idea_desc:0 "工会、农会将组建自己的行政班子和民兵团体，通过一套半军事化管理的方式，让民众在集体生活下参与经济建设。与此同时，政府和党将对这些基层机构进行领导和管控，以确保它们灵活多变但也一丝不苟地执行中央政府的政策。"
 UFE_wasteland_idea:0 "荒芜之地"
 UFE_wasteland_idea_desc: "乌萨斯的远东地区环境恶劣、人口稀少，甚至连最基础的公路都没有几条，在这样荒芜的地方发展农业和工业简直是不可能的。不过，这样的穷山恶水也塑造了当地人彪悍的民风，而当地的山脉、森林、沼泽和野生动物更是造就了一批天生的猎手。"
 UFE_far_east_tiger_idea:0 "远东猛虎"
 UFE_far_east_tiger_idea_desc:0 "我们彪悍的战斗力将令东达利亚的所有人感到恐惧，然而，更令他们恐惧的是我们的思想——民主革命的精神力量最为势不可挡！"
 UFE_tiger_country_idea:0 "共和国猛虎"
 UFE_tiger_country_idea_desc:0 "共和国必须以强悍的武力摧毁腐朽的乌萨斯帝国，同时阻止反动派复辟，不过这算得了什么？真正了不起的不是毁灭，而是建设——我们将在旧帝国的废墟和残肢断臂上建立起崭新的民主共和国。"
 UFE_stupid_leader_idea:0 "不可靠的总督"
 UFE_stupid_leader_idea_desc: "格伦沃夫是个只晓得敛财的皮草商和走私犯，他并不关心自己的辖区和军队，甚至连辖区的权力机构和武装力量在他看来也不过是促进皮草贸易的工具。如此不靠谱的总督已经让当地的驻军与民众甚为不满，若不是帝国政府罩着他，他早该被千刀万剐了。格伦沃夫的手下约瑟夫·卡列维奇尤其憎恨这位不称职的长官，巴不得由自己取而代之。"
 UFE_democracy_idea:0 "蓝色极光"
 UFE_democracy_idea_desc: "远东一直是乌萨斯帝国流放政治犯的地方，许多民主派人士被关押在当地的集中营里饱受折磨，但在被强迫劳动了一整天后，他们常在暗夜里互相鼓励和进行辩论。甚至一部分政治犯已经悄然越狱，挣脱了枷锁。他们潜入当地原住民的村落里，和那些反对地方总督的土著一起生活，得到了当地人的信任。"
 UFE_rev_democracy_idea:0 "乌萨斯共和革命"
 UFE_rev_democracy_idea_desc:0 "乌萨斯处心积虑为革命者打造的牢笼已经被撕碎，爆发出的力量将反过来打垮整个帝国。如果世间真的存在一种能让这场大革命停下来的力量，那么这股力量也只能来自于大革命本身。" 
 UFE_kill_leader_idea:0 "危机中的格伦沃夫"
 UFE_kill_leader_idea_desc: "格伦沃夫是个只晓得敛财的皮草商和走私犯，他并不关心自己的辖区和军队，甚至连辖区的权力机构和武装力量在他看来也不过是促进皮草贸易的工具。如此不靠谱的总督已经让当地的驻军与民众甚为不满，人们已经跃跃欲试，想要把他千刀万剐了。而格伦沃夫的手下约瑟夫·卡列维奇尤其憎恨这位不称职的长官，巴不得由自己取而代之。"
 UFE_modern_economy_idea:0 "迈向现代化的经济"
 UFE_modern_economy_idea_desc:0 "在经历了筚路蓝缕的初期奋斗后，我们的经济情况终于好了起来。早期在远东冰天雪地里那一穷二白的状况已经成为过去，但是我们在那时铸就的顽强精神却并不会消失。"
 UFE_PiCaoMaoYi_YiChan_tt:0 "我们将不再进行£ufe_picao_var_texticon §Y皮草§!贸易，并立刻获得与剩余£ufe_picao_var_texticon §Y皮草§!数额相当的经济产能盈余："
 UFE_lonely_democratic_power_idea:0 "孤悬的革命火种"
 UFE_lonely_democratic_power_idea_desc: "一直以来，革命民主派都是乌萨斯唯一一支主张革命的政治力量。我们是如此孤独，不仅在圣骏堡举目无援，在这东方的冰天雪地里也只能踽踽独行。然而，当一些同样有着革命诉求的力量来到我们附近时，我们也许就能第一次找到真正意义上的伙伴。\n§R当然，或许他们也会对我们的政治独立性构成威胁。§!"
 UFE_lonely_democratic_power_idea_tt:0 "\n如果在我们§Y周边地区§!出现了一个意识形态是§R共产主义§!的地方势力，则自动移除该精神，并且我方开始与该国§Y争夺革命领导权§!以推进未来的§Y和平统一§!。"
 UFE_new_currency_idea_1:0 "货币信用：§R极低§!"
 UFE_new_currency_idea_2:0 "货币信用：§R低§!"
 UFE_new_currency_idea_3:0 "货币信用：§R略低§!"
 UFE_new_currency_idea_4:0 "货币信用：§Y中等§!"
 UFE_new_currency_idea_5:0 "货币信用：§G略高§!"
 UFE_new_currency_idea_6:0 "货币信用：§G高§!"
 UFE_new_currency_idea_7:0 "货币信用：§G极高§!"
 UFE_new_currency_decisions_2_tt:0 "临时地图外§Y军用工厂§!: §G+6§!"
 UFE_XinHuoBi_tt:0 "设定我国货币§G初始信用§!："
 UFE_economic_problem_idea:0 "经济动荡"
 UFE_economic_problem_idea_desc: "囤货居奇的商人与试图破坏革命果实的旧势力走狗们勾结起来，对我们的政府发动了经济战。如果任由危机发展下去，我们的民生事业与军事生产都将被敌人彻底破坏。"
 UFE_pingminpai_yundong_flag:0 "平民派运动已经爆发"
 UFE_selfish_idea:0 "个人自由主义文化"
 UFE_selfish_idea_desc:0 "没有什么比个人的自由与幸福更加重要，革命诚然是进步，但它在许多方面却做得过犹不及了，我们不能为了革命而革命——革命是为了美好的生活，我们不能为了推动革命而放弃生活的幸福。现在，让我们发展消费、鼓励享乐吧，人民需要放松长期以来紧绷的神经、需要丰富多彩的摩登生活来代替充满恐惧而且单调至极的革命生活。"
 #民族精神（统一后）
 UFE_modern_army_idea:0 "军事重整"
 UFE_modern_industry_idea:0 "经济重整"
 UFE_modern_political_idea:0 "政治整合"
 #军事学院
 UFE_special_army_spirit:0 "坚韧不拔"
 UFE_special_army_spirit_desc:0 "我们保持着科雷马边民的顽强精神，这种精神已经成为了我国的军队文化，它鼓励士兵们用无与伦比的意志和决心来克服险恶的自然条件与战场环境。\n\n§G由于我们的国家，该精神可用。§!"
 
 #事件
 #通用事件
 EAST_URS_events.1.t:0 "民众响应我国政府"
 EAST_URS_events.1.desc:0 "东达利亚的长期战争已经令当地民不聊生，而如今我国一统东达利亚的中部和东部，已经让民众看到了和平的曙光。在混乱中饱受摧残的人们无不渴望秩序的回归，当他们得知我们正与西东达利亚的乌萨斯帝国爪牙作战时，纷纷选择支持我国政府。一支由民兵和猎手们自发组织起来的“军团”已经集结起来，随时准备奔赴前线支援我们的战斗。"
 EAST_URS_events.1.a:0 "我们代表着东达利亚的秩序与和平。"
 EAST_URS_events.2.t:0 "解散民兵"
 EAST_URS_events.2.desc:0 "在整个东达利亚都被我国统一后，那些曾在最后一战期间前来支援我们的民兵部队就成为了累赘，他们战斗力低下而且难以改编编制，而我们接下来的目标可是进攻乌萨斯帝国——这些散兵游勇恐怕无法胜任这样的作战任务。与其让这些可怜的老百姓在军中拖后腿和遭受战火折磨，不如将他们解散，使得他们能够回家参与生产。"
 EAST_URS_events.2.a:0 "谢谢你们的帮助，现在你们可以回家了"
 #国家事件
 focus_has_one_story_event_tt:0 "该§Y国策§!会触发一个§Y剧情事件§!。"
 effect_tooltip_by_event_tt:0 "该§Y事件§!可以为我国带来的效果："
 UFE_special_events.1.t:0 "格伦沃夫谋划金盆洗手"
 UFE_special_events.1.desc:0 "格伦沃夫总督在远东作威作福多年，当地人都对他恨之入骨。如今总督已经凭借垄断皮草贸易发了大财，而居民们对他的恨意也到达了高峰。当然，更大的危险在于，乌萨斯帝国已经走了很长一段时间下坡路，没人知道再过些时日会发生什么大事。要是没了帝国撑腰，格伦沃夫这样尸位素餐的贪官污吏必定是死无葬身之地，骏鹰原住民和乌萨斯族土著保准会扒了他的皮，再给他的遗骸安排一些颇有原始宗教色彩的酷刑。\n\n格伦沃夫精明了半辈子，他当然明白这些道理，所以他已经开始准备逃跑——大批金银财宝正在被他转移到帝国本土，跑路必备的载具他也全都准备妥当——只要叛乱的消息一传到奇廷卡斯克，格伦沃夫必定是一溜烟就没影了。\n\n不过，格伦沃夫准备得再充分，当地人会让他就这么跑了吗？难道他们不会先下手为强，直接在总督宝座上就把他给宰了吗？"
 UFE_special_events.1.a:0 "准备动手！"
 UFE_will_run_215_days_tt:0 "§Y瓦图丁·格伦沃夫§!将在§Y215§!天后逃离远东。请尽快完成那些可以增加§R领导人遇刺概率§!的国策来干掉他！"
 UFE_special_events.2.t:0 "格伦沃夫逃离远东"
 UFE_special_events.2.desc:0 "经过充分的准备，格伦沃夫总督顺利逃离了远东辖区。他没有在总督居所内留下任何有价值的东西，甚至连他从老家带来的家具都被搬走了。残留在他办公地和别墅里的，只有一些无关紧要的文件和垃圾。\n\n一片狼藉之后，格伦沃夫的下属约瑟夫·卡列维奇接管了政府。卡列维奇是一个更加开明而且注重民众生活的政治家，他决定尽全力治理格伦沃夫留下的种种祸端。\n\n相较于忠于帝国的格伦沃夫，卡列维奇对中央政府并无感情，他深信“天高皇帝远”的道理，决心无视帝国政府的存在，按照自己的想法改造远东这片土地。"
 UFE_special_events.2.a:0 "格伦沃夫这畜生！"
 UFE_special_events.3.t:0 "格伦沃夫遇刺身亡"
 UFE_special_events.3.desc:0 "人心丧尽的格伦沃夫总督终于遭了报应，他在外出打猎的途中被刺客杀死。一名骏鹰族老猎人潜伏在他回府的必经之路上，然后从树丛里伸出猎枪，打爆了格伦沃夫的脑袋。\n\n格伦沃夫的死带来了一场小小的骚乱，不过他的手下卡列维奇很快就控制住了局面。卡列维奇原本是格伦沃夫提拔的军官，但他暗地里一直想推翻格伦沃夫，甚至在军中和民间发展了自己的势力。格伦沃夫虽然有所察觉，但是还没来得及应付卡列维奇，自己就先命丧黄泉。现在卡列维奇已经夺取了远东的领导权，成为了无可置疑的统治者。\n\n相较于忠于帝国的格伦沃夫，卡列维奇对中央政府并无感情，他深信“天高皇帝远”的道理，决心无视帝国政府的存在，按照自己的想法改造远东这片土地。"
 UFE_special_events.3.a:0 "卡列维奇起码比格伦沃夫有能。"
 UFE_special_events.4.t:0 "格伦沃夫的遗留财产"
 UFE_special_events.4.desc:0 "在格伦沃夫死后，我们发现了他遗留下来的一些财物和存款，这笔钱的数目并不算小，将其有效利用起来，可以为我们的政府运作乃至产业投资提供不小的好处。反正是白白捡来的富贵，就让我们好好想想该怎么使用这笔钱吧。"
 UFE_special_events.4.a:0 "格伦沃夫活该出这笔钱。"
 UFE_special_events.5.t:0 "格伦沃夫制造的政府财政危机"
 UFE_special_events.5.desc:0 "格伦沃夫长期转移自己资产和贪污政府公款，甚至将许多公共财产都纳入了自己的腰包，现在我们的政府一贫如洗，连根毛都不剩下了。\n\n一番折腾下来，远东成了一头任人宰割的巨兽，被格伦沃夫这个贱人薅掉了全身上下的皮草，现在只能孤零零地在冰天雪地里受冻。那还能怎么办呢？我们现在只能靠自己解决财政危机了。"
 UFE_special_events.5.a:0 "难怪原住民那么恨他。"
 UFE_special_events.add.t:0 "组建民主政府"
 UFE_special_events.add.desc:0 "经过长期准备，我们完成了政府的过渡，现在革新军政府已经同意让革命民主派上台执政，一个全新的民主政府即将诞生。\n\n然而，民主派的元老们在政府组成的问题上却产生了分歧，有人认为应该由切尔尼雪夫斯基出任领导人，因为他经验丰富而且富有威望；也有人认为要给茹科娃一个机会，她是党内最杰出和最有人望的新一代革命者，按理说由她掌握实权最为合理——不仅能历练她，也能让年迈的元老们更好发挥精神领袖的作用，而不是在具体事务上疲于奔命。"
 UFE_special_events.add.a:0 "选择切尔尼雪夫斯基。"
 UFE_special_events.add.b:0 "选择茹科娃"
 UFE_special_events.7.t:0 "[FROM.GetName]要求我们接受领导"
 UFE_special_events.7.desc:0 "[FROM.GetName]作为东达利亚地区最有影响力的革命组织，已经在事实上成为了乌萨斯革命的领头羊。随着东部战事的平息，整个东达利亚东部已经只剩下[FROM.GetName]和我们两股势力，或许我们应该携手并进，亦或者……兄弟阋墙？"
 UFE_special_events.7.a:0 "这正是我们期待的！"
 UFE_special_events.7.b:0 "道不同不相为谋。"
 It_means_game_over_tt:0 "§R这对你来说意味着游戏结束。§!"
 It_must_cause_war_tt:0 "§R这将引发战争。§!"
 UFE_special_events.8.t:0 "[FROM.GetName]拒绝接受和平统一"
 UFE_special_events.8.desc:0 "共产主义者和革命民主主义者终归是无法走到一起，[FROM.GetName]已经拒绝了接受我们的提议。乌萨斯的革命道路只能有一条，如果革命者无法达成合作，那么就只有靠战争来贯彻自己的理想。"
 UFE_special_events.8.a:0 "那就用拳头说话吧。"
 UFE_special_events.9.t:0 "[FROM.GetName]同意接受和平统一"
 UFE_special_events.9.desc:0 "经过数论谈判，[FROM.GetName]方面和我国政府达成了共识，双方将组建一个革命联合政府，不过政府领导权主要掌握在我方手上。这意味着[FROM.GetName]已经被吸纳到了我们的革命队伍中，共产主义和民主主义的革命道路之争暂时宣告结束。"
 UFE_special_events.9.a:0 "我们将携手并进。"
 UFE_special_events.10.t:0 "争夺东部领导权"
 UFE_special_events.10.desc:0 "自乌萨斯帝国政府大规模流放境内的革命民主派人士以来，革命民主派就一直被视为乌萨斯境内最重要的“武装革命”力量。即便大多数革命民主派的领导人都被流放到了科雷马边疆区，他们也仍然是革命大业的领头者。\n\n不过，当共产主义通过感染者游击队“整合运动”传入乌萨斯时，这种情况就改变了，革命民主派不再是唯一的革命力量，共产主义者成为了他们的同伴兼竞争对手。而当两股势力不得不正面相对时，由谁领导谁、由谁来决定乌萨斯革命道路的问题，就必然被摆上台面。\n\n毫无疑问的是，缺少影响力的那一方将会陷入被动。"
 UFE_special_events.10.a:0 "看看谁才能主导乌萨斯的革命力量。"
 UFE_special_events.11.t:0 "威权保守派发动反革命叛乱"
 UFE_special_events.11.desc:0 "社会长期动荡、军队自行其是，我们的国家已经危如累卵。保守派的力量已经大到足以与共和政府分庭抗礼，他们代表着大银行家、大企业主和新贵族们的利益，同时也借着社会骚乱的势头，俘获了小市民和部分保守农民的支持。\n\n这股威权主义保守力量虽然也希望打倒乌萨斯帝国，但是他们的妥协性明显更强，而且相较于消灭帝国，他们更想消灭我们！他们要彻底摧毁革命政府的政治经济体制。"
 UFE_special_events.11.a:0 "誓死保卫革命！"
 UFE_special_events.11.b:0 "为自由乌萨斯而战！"
 UFE_special_events.11.c:0 "为祖国和秩序而战！"
 UFE_special_events_11_c_tt:0 "§R以威权民主主义叛军身份继续游戏。§!"
 UFE_special_events.12.t:0 "特鲁别茨克伊反对军队政治化"
 UFE_special_events.12.desc:0 "近段时间，特鲁别茨克伊元帅经常向中央政府提出尖锐的反对意见，他声称军事政治顾问严重干扰了他的正常指挥，使他的部队作战不利。军事政治顾问则坚称特鲁别茨克伊治军不严、部队匪气太重、只关注作战技巧而不培养士兵的政治忠诚。双方争执不下，中央政府只能派人前往特鲁别茨克伊的指挥部进行调查走访。\n\n然而，这一调查，竟然发现了特鲁别茨克伊与乌萨斯帝国官员书信往来的证据！特鲁别茨克伊坚称对方只是自己当年的老同学（特鲁别茨克伊曾是乌萨斯帝国亲王，后因主张改革而被流放），双方交流没有泄露情报，但政府的调查还在继续，随着更多信件被发现，事情的真相终将浮出水面。"
 UFE_special_events.12.a:0 "准备对他进行停职审查。"
 UFE_special_events.13.t:0 "尼基塔·穆拉维约夫散布邦联主义言论"
 UFE_special_events.13.desc:0 "在大革命战争进行过程中，尼基塔·穆拉维约夫认为革命政府太过专权，总是为了获取兵源和资源无限度地压榨地方。而在国民公会和政府召开会议提出要缓和央地矛盾后，尼基塔·穆拉维约夫还在自顾自地宣传他的反集权言论。\n\n我们注意到，穆拉维约夫提出的各种批评实际上并没有超出政府此前在会议上的反思与检讨，反倒是他打算趁机笼络一些摇摆分子和温和派，形成自己的政治派系。这股政治力量鼓吹地方自治，反对建立集权的联邦乌萨斯，他们要制造一个松散的邦联制乌萨斯。\n\n这些邦联分子不仅想方设法地反对革命战争（他们认为战争太过残酷且会导致集权和独裁）与共和政府，还不切实际地吹嘘地方民兵的战斗力——他们居然认为地方村社的民兵足以抵御乌萨斯帝国的正规军！"
 UFE_special_events.13.a:0 "他在玩弄政治投机和分离主义！"
 UFE_special_events.14.t:0 "社会动荡加剧"
 UFE_special_events.14.desc:0 "特鲁别茨克伊有可疑罪证并即将被革职审判的消息传到了全国各地，同样四处散播的还有尼基塔的邦联主义言论，这些消息越传越离谱，最后完全变成了谣言。许多老百姓甚至以为特鲁别茨克伊已经带领前线部队叛变，乌萨斯皇帝已经与特鲁别茨克伊亲王和解，打算让亲王担任东达利亚总督，而尼基塔·穆拉维约夫将担任总督政府的总理！\n\n谣言越传越广，巨大的恐慌席卷民间，许多老百姓上街游行，要求政府调查叛徒、维护社会稳定、保护民众的安全——他们害怕乌萨斯帝国的军队打来之后烧杀抢掠。这时候更糟糕的情况发生了，我国的警察部门首长普汀娜——她是一个来自格伦沃夫手下的老军官，由于支持革命而被民主派容忍——坚持认为放任民众游行会引发暴动甚至起义，于是她不顾政府形象和民主原则，悍然镇压了示威民众，在首都大街上制造了一场死伤千人的血案。\n\n这些破事充分暴露了我国政府面临的问题，我们对社会矛盾的管控能力太差、消化异见团体的水平太低、执政团队成分太杂、法律法规更是一团乱麻。不解决这些问题，我们根本不可能在大革命战争中坚持下去——我们现在唯一的选择就是直面社会矛盾。"
 UFE_special_events.14.a:0 "共和事业面临前所未有的挑战。"
 UFE_special_events.15.t:0 "组织专政委员会"
 UFE_special_events.15.desc:0 "在清洗掉邦联主义者和耶里钦娜反对派之后，我国政坛已经基本稳定，但是民间依然对政府充满担忧。为了让民众安心，我们应该选出最为可靠的革命元老，以他们为核心，组建专政委员会。\n\n委员会中的部分委员可以民主选举产生，就连平民出身者也有机会任职。\n有元老人物专政掌舵，我们就可以暂时不用担心阴谋家和煽动者夺权，而保障人民可以参与专政委员会的工作，也能让群众信任我们，而不是把专政委员会当成一个独裁小团体。"
 UFE_special_events.15.a:0 "让卡列维奇领导我们！"
 UFE_special_events.15.b:0 "卡列维奇应就任二把手，领导人另选！"
 UFE_special_events.78.t:0 "组织专政委员会（另选领导人）"
 UFE_special_events.78.a:0 "保持现有领导人。"
 UFE_special_events.78.b:0 "切尔尼雪夫斯基更适合领导革命！"
 UFE_special_events.78.c:0 "赫尔岑一直是我们的导师！"
 UFE_special_events.78.d:0 "应该支持新一代革命领导人！"
 UFE_special_events.79.t:0 "组织专政委员会（另选二把手）"
 UFE_special_events.79.a:0 "保持现有二把手"
 UFE_special_events.79.b:0 "切尔尼雪夫斯基的政治才能非常突出！"
 UFE_special_events.79.c:0 "赫尔岑可以作为精神领袖！"
 UFE_special_events.79.d:0 "应该支持新一代革命领导人！"
 UFE_special_events.16.t:0 "恐怖政策已经持续太久"
 UFE_special_events.16.desc:0 "漫无尽头的恐怖政策已经开始使民众感到不安，叛徒越抓越多，但局势一点不见缓和。一开始被逮捕的叛徒们还确实有个叛徒样，但是到政策后期，冤假错案也在明显增多，这些问题动摇了民众对恐怖政策的信心。\n\n恶性循环已经开始形成，越是继续逮捕叛徒，民众就越不安和慌乱，而越是恐慌，民众在生活中就越容易神经质地怀疑他人。这种无止境的猜疑与动荡将会瓦解我们的社会秩序，破坏革命以来建立起的一切社会共识。"
 UFE_special_events.16.a:0 "我们必须趁早结束这一切了。"
 UFE_special_events.17.t:0 "军队的独立倾向扩大"
 UFE_special_events.17.desc:0 "在减少了军队的政治化程度之后，我国政府发现自己已经越来越无法控制军方的野心和贪欲。高级军官的贪腐行为层出不穷，还拉帮结派和文官政府作对。而我们对军队在牟利经商一事上的放松，更是让他们有恃无恐——军队不需要中央批准就能获得资金，那他们凭什么还需要对政府唯命是从？"
 UFE_special_events.17.a:0 "这实在是太糟糕了。"
 UFE_special_events.20.t:0 "经济困境"
 UFE_special_events.20.desc:0 "紧随政治动荡而来的就是严重的经济危机。\n\n接连不断的动乱事件影响了各种商品的生产，也使得许多人开始囤货备荒，多种因素迅速推高了市场上大多数生活必需品的售价，于是又导致民众更加慌乱。一些不法分子打算借机囤货居奇，大发国难财。\n\n更何况由于战争的缘故，在我们控制区的许多工厂也因为无法进货、人手不足而不能维持运作，供应的减少让经济困境雪上加霜。"
 UFE_special_events.20.a:0 "我们要稳住物价、打击投机倒把。"
 UFE_special_events.21.t:0 "革命宪法"
 UFE_special_events.21.desc:0 "[GetYear]年[GetMonth]，共和国制宪大会通过了乌萨斯有史以来第一部正式的共和宪法，民众和政治家们将其称为革命宪法。\n\n革命宪法规定：乌萨斯是联邦制的民主共和国，共和国最高立法机构是普选产生的全国立法会议，最高执行机构是由立法会议任命的中央执行委员会。宪法保障人民有信仰、出版、集会、请愿乃至武装起义的权利。在乌萨斯，凡年满二十岁的男子都有选举权和被选举权，无财产门槛限制。\n\n对于立法会议的立法，全国人民拥有否决权——任何立法在公布四十天内如遭到大多数公民的反对就自动无效。新宪法还规定了共和国对外政策的基本原则：我国不干涉任何国家的内政，也决不允许任何国家干涉我国内政，任何国家的人民有权自主决定自己国家的制度。最后，革命宪法着重强调了私有财产神圣不可侵犯，但也提出要发展人民公有的产业，以造福全体乌萨斯人民。"
 UFE_special_events.21.a:0 "革命万岁！共和国万岁！"
 UFE_special_events.22.t:0 "耶里钦娜反对派"
 UFE_special_events.22.desc:0 "革命宪法的通过激起了许多传统自由主义者的不满，他们认为宪法中对于个人自由的规定太过含糊，使之更像一份宣言而非宪法文件。他们还指责宪法中那些涉及集体主义和公有制的内容是“共产主义暴政的序曲”，这些指责也得到了部分城市居民和小农民的认可，甚至一些银行家和企业主也打算为耶里钦娜站台。\n\n更严重的问题是，宪法中许多关于人民政治权利的内容因为无法解燃眉之急而遭到了批评，许多民众认为社会的当务之急是打击敌人而非保障自由，他们迫切地需要政治家们重新塑造社会秩序，而围绕这一问题，出现了两个派别——一派希望暂时悬置宪法实施专政，而另一派希望加强政府首脑的权利，并且尽快完成第一次大选，建立一个高度威权的政府领导全国完成革命战争。\n\n耶里钦娜很快就选择了“大选派”作为自己的民间基础——因为这一派系的人主要集中在首都，利于她在政斗时先发制人。她和温和派政客恰达耶夫联手，要求立刻大选并在威权总统的领导下全面修改革命宪法，尽快恢复秩序并建立起完善的资本主义制度。"
 UFE_special_events.22.a:0 "耶里钦娜公开反对革命民主派！"
 UFE_special_events.23.t:0 "平民派运动"
 UFE_special_events.23.desc:0 "就在革命政府为宪法的落实与否举棋不定时，一场声势浩大的群众运动席卷了全国各个城市。数十万工人和小生产者在社团、人民俱乐部的组织下走上大街，强烈要求现政府实施更加严厉的政策打击保守派。工人纠察队和村社民兵们大多支持这次运动，于是许多地区的示威甚至演变成了起义——毕竟《革命宪法》规定人民享有武装起义的权利。\n\n发生这样可怕的政治运动并不是没有原因的，革命前期不断发展的村社和城市基层组织已经具备了强大的动员宣传能力，当恐慌与谣言席卷全国之时，每个基层团体都能按他们对革命理论的朴素理解来动员人民。全国各地的示威者很快自发选举出他们的代表，而这些代表们齐聚首都后，又和首都的工人打成一片，催生出一个规模庞大的临时政治团体“平民派”。\n\n平民派的目标非常朴素——“耶里钦娜反对革命政府，那我们就反对耶里钦娜，耶里钦娜要选举，我们就支持悬置宪法！”。由于冲入城区的平民派示威者实在太多，为了维持首都的秩序，卫戍部队已经被调往城区拦截民兵们和示威者。然而，耶里钦娜派见到来势汹汹的示威群众，却没有被吓退，她亲自跑到街头，开始动员首都的小市民们阻拦示威者。她还心急如焚地找到首都卫戍部队的指挥官，并且联系了自己认识的一切军队高官，力图说服军方镇压平民派。\n\n“这些暴民的举动是非法的叛乱，绝对不是宪法规定的人民武装起义！军队若不镇压叛乱，那还有什么存在的意义？”耶里钦娜如是指责平民派，并煽动卫戍军人们去驱散“平民派”的民兵与群众。\n\n但是就在同一时间，来自中央政府的命令也下达了——切尔尼雪夫斯基指示卫戍部队有序疏散示威平民、政府将暂时同意平民派“悬置宪法”的诉求…………"
 UFE_special_events.23.a:0 "我们此刻的抉择将勾勒出政权未来的轮廓。"
 UFE_special_events.24.t:0 "共和国的第一次大选"
 UFE_special_events.24.desc:0 "在战胜了内外封建保守分子、推翻了乌萨斯帝国统治之后，共和国的处境转危为安。随着限价令、恐怖政策的解除，正式实行革命宪法的时机到了。\n\n按照宪法规定，我国开始了全国大选，乌萨斯革命民主党凭借巨大的威望一骑绝尘，共和国的总统宝座可以说已经注定属于革命民主党人。不过即便是作为同志，候选人之间的竞争也陷入了白热化。\n\n几位革命元老进行了激烈的辩论和拉票竞赛，并且在国家出资支持下游说全国。但是全国上下如此忙碌的，也不止总统候选人，每个地方的基层组织都在忙着选举人民代表和地方议会。\n\n乌萨斯人从未见过如此热闹和民主的政治选举，民众们也以惊人的热情投入到了选举中。驻扎在乌萨斯的哥伦比亚记者甚至在报道中写道：‘仿佛一夜之间，乌萨斯就让自己的政治制度脱胎换骨，她从泰拉大陆的吊车尾，一跃成为了最现代化的民主国家之一……尽管这里还存在大量偏僻而贫困的村落与小镇，但是没有一个人忽视正在进行的大选——当地的村社代表、工会代表还有负责政治教育的干部们一刻不停地向民众强调着选举的重要性，并且十分耐心地鼓励每一个公民参与选举。’\n\n在这热烈的气氛中，投票统计最终完成。共和国未来的总统是谁？这个问题的答案终于要揭晓了！\n\n那么获得票数最多的总统候选人是……"
 UFE_special_events.24.a:0 "尼古拉·切尔尼雪夫斯基！"
 UFE_special_events.24.b:0 "约瑟夫·卡列维奇！"
 UFE_special_events.24.c:0 "亚历山大·赫尔岑！"
 UFE_special_events.24.d:0 "代表新一代的茹科娃！"
 UFE_special_events.25.e:0 "才华横溢的茹科娃女士！"
 UFE_special_events.25.t:0 "由总统提名国家二把手"
 UFE_special_events.25.desc:0 "在成功赢得选举并确定担任未来的共和国总统后，[UFE.GetLeader]总统将会按照宪法规定提名国家二把手，二把手在经国民议会正式任命后就可宣誓就职。\n\n[UFE.GetLeader]总统提名的二把手人选是……"
 UFE_special_events.25.a:0 "尼古拉·切尔尼雪夫斯基！"
 UFE_special_events.25.b:0 "约瑟夫·卡列维奇！"
 UFE_special_events.25.c:0 "塔露拉·雅特利亚斯！"
 UFE_special_events.25.d:0 "亚历山大·赫尔岑！"
 UFE_special_events.26.t:0 "奇廷卡斯克爆发骚乱"
 UFE_special_events.26.desc:0 "大叛乱的爆发引起了民众恐慌，科雷马边疆区本就缺少农田，一旦开战必定粮食短缺，而且民众也非常害怕政府开始强制征兵和征收军粮，一旦家里没了壮劳力和余粮，在远东的冰天雪地里只有死路一条。\n\n来自周边敌对势力的探子也渗透到了科雷马境内，他们大量聚集在奇廷卡斯克，像火星点燃柴草般，煽动了本就惶惶不安的市民们。\n关于饥荒的谣言传遍全城，人们开始抢购甚至打劫物资，许多商铺都在骚乱中被破坏、许多工厂都因为罢工而停产……\n\n如果我们再不将奇廷卡斯克城中的骚乱镇压下去，那原本只存在于谣言里的饥荒与战乱，就真的要变成现实了！"
 UFE_special_events.26.a:0 "尽快解决问题！"
 UFE_special_events_26_tt:0 "\n请在§R第二次大叛乱§!爆发后解锁的§Y额外国策树§!中完成相关国策，以尽早消除§Y地区骚乱§!负面效果。"
 UFE_special_events.27.t:0 "[UFE.GetName]请求合作开发荒地"
 UFE_special_events.27.desc:0 "[UFE.GetName]政府希望与我们合作开发潘陆岛荒原，并且他们打算将当地的资源开采权交予我们。根据科考团队的报告，潘陆岛的地下确实埋藏了大量能源资源，开发当地矿产对我百利而无一害。那么我们要答应[UFE.GetName]吗？"
 UFE_special_events.27.a:0 "真是个好主意！"
 UFE_special_events.27.b:0 "这恐怕不合适。"
 UFE_special_events.28.t:0 "[FROM.GetName]同意开发"
 UFE_special_events.28.desc:0 "[FROM.GetName]欣然同意了我们的合作请求，两国的联合开拓团已经出发，准备在南方大荒原开垦农田、开辟牧场、探采矿产。"
 UFE_special_events.28.a:0 "我们互惠共赢。"
 UFE_special_events.29.t:0 "[FROM.GetName]拒绝开发"
 UFE_special_events.29.desc:0 "[FROM.GetName]断然拒绝了我们的请求，他们似乎对资源开采权毫无兴趣。难道他们是认为大炎帝国地大物博、无所不有，不需假借外国事物吗？"
 UFE_special_events.29.a:0 "真是可惜。"
 UFE_special_events.30.t:0 "特鲁别茨克伊越狱潜逃"
 UFE_special_events.30.desc:0 "我们的调查组在特鲁别茨克伊寓所的夹层里发现了一个金属柜，里面竟然藏满了他与帝国官员互相交流的密信，而密信的内容更是让人大跌眼镜——他居然真的试图与帝国政府达成合作协议！\n\n如此厚颜无耻的背叛激怒了革命政府，调查很快围绕特鲁别茨克伊的身边人和下属扩展开来，而他本人也被正式关押起来。案子的扩大化使得越来越多的证据被发掘出来，还有总额高达数十万的赃款被我们没收！\n\n就在我们整理证据、准备开庭审判特鲁别茨克伊时，他却在几位忠实下属的帮助下越狱潜逃了！我们尚不知道他是否逃入了帝国控制区，也不知道他是否打算停留在共和国境内准备煽动叛乱。\n\n特鲁别茨克伊叛变并且越狱的消息极大地引起了民众的恐慌与愤怒，共和国的政治氛围也紧张到了极点。"
 UFE_special_events.30.a:0 "他果然是叛徒！"
 UFE_special_events.31.t:0 "切尔尼雪夫斯基指责政府"
 UFE_special_events.31.desc:0 "短短数月内，共和政府统治下的东达利亚动荡不断：军队脱离政府管控，擅自镇压示威者；耶里钦娜异军突起，凭借军方支持架空了革命民主派的元老们；共和国首次大选中，耶里钦娜派为了赢得选举更是无所不用其极。\n\n尽管共和国的未来犹如大雾笼罩，可谁都知道，她已经背离了革命元老们最初构想的道路。\n\n但是切尔尼雪夫斯基、赫尔岑等人还没有退出政坛，他们早年就曾和帝国的秘密警察周旋，也曾在帝国的大狱里受尽折磨。如此比较之下，耶里钦娜对他们的威胁又算得了什么呢？\n\n元老们不屑于隐藏自己对耶里钦娜政府的态度，他们措辞严厉地指责耶里钦娜，并且尝试动员民众将耶里钦娜赶下台。切尔尼雪夫斯基甚至已经开始谋划一次针对耶里钦娜的总统弹劾。\n\n然而，这些久经政坛风雨的老政治家们或许低估了当前共和国权力斗争的残酷性，他们还以为这里至少不是腥风血雨的帝国官场，自己不会被敌人毫无底线地偷袭，而卑鄙无耻的耶里钦娜将撕碎他们的所有幻想。"
 UFE_special_events.31.a:0 "准备送他们上天堂吧……"
 UFE_special_events.32.t:0 "民众闯入监狱并杀死在押政治犯"
 UFE_special_events.32.desc:0 "自革命政府建立以来，无数反革命分子都落入法网。然而我们的司法体系建设尚不完善，没有充足的人手去清理积压的案件，导致大量危险的政治犯聚集在监狱里。\n\n这些反动分子有恃无恐，经常从窗口恐吓路过监狱的民众，扬言要反攻倒算，同时这些政治犯的聚首也让他们更容易越狱出逃了。这样的情况在民间引发了恐慌情绪，而随着革命战争的爆发与白热化，那些政治犯更加张狂，而民众的恐惧情绪也成为了谣言滋生的土壤。\n\n这越积越深的负面情绪最后变成了民众的集体行动，他们冲进监狱，推走试图劝阻他们的狱卒和典狱长，将那些政治犯杀得一个不剩。许多民间团体和民兵组织的领导者甚至临时组建起了人民法庭，在简单的审判之后，便将犯人定罪。\n\n被判有罪者会被立刻拖到监狱外处死，而被判无罪的人将在群众的欢呼声中接受他们热情的拥抱。"
 UFE_special_events.32.a:0 "立刻调集军队阻拦这种行为。"
 UFE_special_events.32.b:0 "我们睁一只眼闭一只眼。"
 UFE_special_events.33.t:0 "克缅哥罗德地区的官员制造大屠杀"
 UFE_special_events.33.desc:0 "作为被反动贵族萨文科娃统治过的地区，克缅哥罗德一带频频出现反革命分子的活动。他们将革命政府描述为乌萨斯文化的毁灭者和民族的叛徒，并且经常组织恐怖袭击杀伤我们的官员和人民。\n\n然而，我们派遣到当地的特派员面对这种局面却没有进行深入的调查和研究，而是简单粗暴地调集军队发起戒严。他还残酷对待那些曾出现过民粹分子活动的村庄，动辄以“包庇反革命”罪处决大量村民。\n\n前几天，他更是把民众因生活用品匮乏而发起的游行认定为萨文科娃支持者组织的反政府活动，并且不由分说地派兵镇压。此举造成数千名无辜市民惨遭杀害。一时间克缅哥罗德民怨沸腾，告状的文书接连发到中央政府，现在我们必须做出决断了。"
 UFE_special_events.33.a:0 "干得好！我们正缺乏这种杀伐果决的精神！"
 UFE_special_events.33.b:0 "无理取闹，把他革职审查了，看看有多少冤案。"
 UFE_special_events.34.t:0 "民众大规模破坏拉特兰教堂"
 UFE_special_events.34.desc:0 "由于外国间谍和国内反动分子经常跑进拉特兰教堂避难，我国民众对拉特兰教徒的态度急转直下。针对拉特兰教职人员的袭击事件时有发生，而革命战争的爆发更是使得情况雪上加霜。\n\n数周前，一名伪装成拉特兰修士的帝国间谍成功通过教堂帮助逃离革命政府的追捕，消息传出后更是被民间添油加醋，诸如“拉特兰人在教堂里面谋划恐怖袭击”、“拉特兰神父在水源里面下毒”之类的传言不胫而走。\n\n愤怒的人民很快就做出了行动，新阿列克谢耶夫斯克的市民第一个站出来，他们一把火焚烧了市区的拉特兰教堂，并且枪毙了所有的拉特兰籍教职人员。这一行为很快为全国各地民众所知，于是一时间各地人民纷纷效法，这专门针对拉特兰教徒和宗教设施的“人民暴力行动”在乌萨斯大地上蔓延开来。"
 UFE_special_events.34.a:0 "镇压暴民！他们违反了宗教自由原则。"
 UFE_special_events.34.b:0 "拉特兰人有罪在先，砸得好啊！"
 UFE_special_events.35.t:0 "奇廷卡斯克富商被民众处死"
 UFE_special_events.35.desc:0 "奇廷卡斯克富商雷维耶夫近日在一次区议会会场上发言道：“面包毕竟是我们国民经济的基础，应该放宽面包的分配，允许较低的价格。反过来，一般的工资也要从40戈比降低到15戈比，以较低的制造成本振兴消费。”此言一出，竟不知为何被谣传为“没有一个工人能值15戈比。”，一时间闹得全城人群情激愤。\n\n雷维耶夫的胆小如鼠更进一步加重了谣言的传播——他得知自己为千夫所指后，竟然不敢声辩，而是打算拖家带口逃离奇廷卡斯克。而悲惨的是他在携全家人和大量财物离开时，被把守关卡的民兵认了出来。\n\n这下雷维耶夫又背上了“外国间谍”的嫌疑，他百口莫辩，也不想再辩解，他只想从民兵的掌心里跑出来。被彻底惹毛的民兵将他关进郊区一家国营百货公司的库房里，并且召集人民法庭审判他的罪行，早就对他失去信任的民众纷纷支持判他死刑。就这样，富商雷维耶夫一命呜呼。"
 UFE_special_events.35.a:0 "我们不能谴责民众，给受害者发放抚恤金就行了。"
 UFE_special_events.35.b:0 "追究民兵组织和“人民法庭”的责任！"
 UFE_special_events.36.t:0 "切尔诺伯格校场的血案"
 UFE_special_events.36.desc:0 "近些时日，帝国间谍和破坏分子猖獗的活动使得各级政府风声鹤唳，切尔诺伯格市政府就错误地将当地民众在切尔诺伯格校场举行的节日集会判定为“参与者成分不明的可疑政治活动”。\n\n入夜之后，许多民众还在校场停留，市政府如临大敌，立刻派遣警察与军队前去驱逐。由于政府官员与民众交涉时过于粗鲁无礼，事件迅速激化。此时有士兵将场上气球爆炸的声响误听为枪声，于是鸣枪示警，结果更刺激到了民众。\n\n有些市民试图逃离，但是却引起了踩踏；有些人被军队激怒，于是和荷枪实弹的士兵爆发了冲突。但经过一番缠斗和混乱，军队和警察还是轻而易举地赢得了胜利，七八十名包括老人、妇女和小孩在内的市民被杀害，更有近千人受伤。\n\n受害者的家属将诉苦的信件送到了中央政府，还有人到政府大门前下跪求个公道。而此事在各地传开后也是引起了不小的震动，现在全社会都想知道，这场切尔诺伯格校场的血案将会如何收场。"
 UFE_special_events.36.a:0 "这是我们的失误，但除了忏悔我们什么也不会做。"
 UFE_special_events.36.b:0 "揪出那些屠夫！他们必须被判刑！"
 UFE_special_events.80.t:0 "新的投诚者"
 UFE_special_events.80.desc:0 "革命派近期的政策越来越偏激，引起了他们的内部斗争。激烈的冲突撕裂了他们的政坛，这导致一批原本主张激进革命的共和国官员叛逃到了我们这边。他们当中的代表就是耶里钦娜和恰达耶夫，这两人有着不错的行政才能，也很愿意为我们效力。然而，也有我方官员认为，他们这群人本质上仍然是激进分子——何况他们的跳反行为进一步证明了他们还有道德上的缺陷，因此坚决不能留用。"
 UFE_special_events.80.a:0 "欢迎他们加入。"
 UFE_special_events.80.b:0 "把他们送去枪毙！"
 UFE_special_events.81.t:0 "[UFE.GetName]号召我国民众进行反战暴乱"
 UFE_special_events.81.desc:0 "在[UFE.GetName]的煽动和破坏下，我国后方的民众发起了反对战争的暴动。暴民们袭击了军火库，还迫使我们调回部队镇压，而这一过程又引发了兵变且削弱了军人们的士气。当暴乱得到控制之后，我们发现自己已经承受了严重的损失！"
 UFE_special_events.81.a:0 "这群卖国的暴民！"
 UFE_special_events_81_tt:0 "由于[UFE.GetFlag]§Y[UFE.GetName]§!的宣传项目§Y人民战争不可战胜§!，我国部队失去了§Y5%§!的§Y装备§!、§Y人力§!和§Y组织度§!。"
 UFE_special_events.82.t:0 "[UFE.GetName]的共和主义宣传动摇人心"
 UFE_special_events.82.desc:0 "在[UFE.GetName]的意识形态煽动下，共和主义的思想如同瘟疫一样席卷了我国，无论是民间还是军中，甚至是政府中都有谈论共和主义的家伙出现！这显著动摇了我们的军心，许多士兵都对自己“为何而战”感到迷茫……"
 UFE_special_events.82.a:0 "惑乱人心！"
 UFE_special_events_82_tt:0 "由于[UFE.GetFlag]§Y[UFE.GetName]§!的宣传决议§Y宣扬共和主义§!，我国部队被施加了负面效果：对[UFE.GetFlag]§Y[UFE.GetName]§!的进攻修正: §R-10.00%§!，对[UFE.GetFlag]§Y[UFE.GetName]§!的防御修正: §R-10.00%§!。这一负面效果会持续§Y90§!天。"
 UFE_special_events.83.t:0 "统一的代价"
 UFE_special_events.83.desc:0 "统一全乌萨斯的大革命战争给祖国大地造成了严重的损失，帝国政府在败退过程中也没有忘记给我们使绊子——他们留下了一个经济崩溃、政治割裂、民不聊生的国家。\n\n现在共和国政府控制全国，也就挑起了帝国政府撂下的担子，巨大的负担削弱了我们的实力，可是为了实现革命的抱负、为了祖国母亲的将来，我们必须直面困境。"
 UFE_special_events.83.a:0 "我们将重建家园。"
 UFE_special_events.84.t:0 "政治割裂"
 UFE_special_events.84.desc:0 "东达利亚只有三千万人口，而帝国治下的人口远超这一数字。为了统治全国各地，我们旧的行政体系已经超负荷运作，这导致许多时候我们不得不任用旧帝国官僚来缓解压力。\n\n此外，在帝国领土上生活的许多人还不了解我们，起码他们不会像东达利亚人那样热烈地拥戴我们，而且他们对激进文化的接受程度也会更低。一道随着乌拉尔山脉延伸的裂隙割裂了我们的祖国、人民和政府，为了弥合这道裂口，我们究竟要付出多大的代价呢？"
 UFE_special_events.84.a:0 "真是个大难题！"
 UFE_special_events.85.t:0 "经济衰退"
 UFE_special_events.85.desc:0 "在旧帝国滥发纸币筹措军费的影响下，乌萨斯的经济严重衰退，不仅工商业一片哀鸿，农业也接近崩溃。为了避免饥荒和失业潮，政府已经被迫出台一系列基建工程带动就业，还把东方的粮食运来赈灾。\n\n然而，我们做的补救措施又引起了货币信誉的波动，使得全国的经济形势出现了另一种层面上的恶化——看来我们面对的经济问题并没有那么简单。"
 UFE_special_events.85.a:0 "幸好时间在我们这边，慢慢来。"
 UFE_special_events.86.t:0 "削减军费"
 UFE_special_events.86.desc:0 "在帝国倒下后，我们最大的敌人已经消失，军队的重要性因而下降不少。正好重建国家急需一大笔资金，我们就该顺水推舟，把一部分军费转付到经济建设领域上。\n\n当然了，这必然削弱我们的军事实力，可是就像切尔尼雪夫斯基先生所说：“一场雨的好坏要看它发生的时间——如果是干旱已久后下的第一场雨，那显然是好的，可如果是洪涝横行之际下的雨，那就是坏的”。军费也是如此，在战争时期保持高军费很好，可是现在如果不削减军费，那经济衰退的影响还会继续蔓延。"
 UFE_special_events.86.a:0 "我们得减少投给军队的资源"
 destroy_48_unit_tt:0 "我们将随机解散§Y48§!个师。"
 UFE_special_events.87.t:0 "乌萨斯共产主义者流亡到我国"
 UFE_special_events.87.desc:0 "由于乌萨斯政府近期开始系统性地迫害左翼人士，在乌萨斯活动的共产主义者已经无法留在境内。而我国又毗邻乌萨斯，是唯一一处能够接纳这批流亡共产主义者的避风港。\n\n共产主义战士没有祖国，他们在哪里投身革命事业，哪里就是他们的家。这批革命同志的能力不容小觑，他们将对我们正在进行的卡兹戴尔革命事业做出巨大贡献。"
 UFE_special_events.87.a:0 "欢迎回家！"
 
 #剧情事件
 UFE_special_events.37.t:0 "最后一桶金" 
 UFE_special_events.37.desc:0 "尽管格伦沃夫已经察觉到自己治下的科雷马边疆区正暗流涌动，但他还是打算再捞一笔——商人和政客的思维总是不同的，金钱收益最大化才是格伦沃夫最在乎的问题。\n\n他兴奋地趴在案台上写下一份又一份总督令，要求各个地方的行政官和乡绅族长再额外收缴一个季度的皮草。签完命令之后，他开始近乎迷狂地计算起皮草的总量，他在草稿纸上精准无误地计算着自己可以在离开前卖出多少皮草，而运输这些好货需要用到多少节车皮。\n\n他小心翼翼地编排这些皮草的销售方向，多少卖给近处的东国和炎国，多少买到东达利亚其他领主那里，多少则需要买到别列卡和圣骏堡。他要在有限的火车运力下卖光所有货物，同时还要把它们卖出最高的价格。他是如此沉迷于利润的计算，以至于忽略了他应该留出一些火车运力来给科雷马百姓购买粮食谷物。\n\n当然，格伦沃夫从来都不只从常规途径收获皮草，他还通知了一些依附于自己的土匪团伙，要求他们“上贡”——好处是给他们送去军火和粮食。这些匪徒为了满足格伦沃夫，又得把自己地盘上的老百姓搜刮一番。"
 UFE_special_events.37.a:0 "唉，我们何日才能摆脱这个瘟神？"
 UFE_special_events.38.t:0 "暗流"
 UFE_special_events.38.desc:0 "卡西莫夫在科雷马度过了六十五载苦寒岁月，他的妻子儿女已经全部和他阴阳两隔，他苍老的脸上只剩下一种近似于木刻的呆板和淡漠。\n\n或许有一天，他会像一棵雪中枯木一样倒在冰冷的冻土上，然后在层层雪花和冰块的掩盖下化成一具木偶般的干尸……但是格伦沃夫的暴行终究让他那早已封冻的心震颤起来。\n\n他坐在破破烂烂的木屋里，听着外面官吏和士兵的吼声。他听到一个女人在哭喊——她的丈夫交不上皮草和税金，正被士兵用枪托痛打。\n\n一阵阵沉闷的击打声，像是燧石碰撞一样。卡西莫夫默不作声，静静等着飞溅的火花落到自家门上——伴着冒犯性很强的锤门声，以及开门的“嘎吱”一声响。\n\n那些不速之客叽叽喳喳说的话几乎传不进卡西莫夫的耳朵，就像冰层下面的水流似的。\n\n“……哎，彼得，格伦沃夫长官这几天挺高兴的，肯定赚了不少……”\n\n“是啊，而且他很快就不用操心各种破事了，之前几个月他都忙疯了。”\n\n“听说他打算过几天去打猎放松……”\n\n卡西莫夫如木雕般听着这一切，但他的眼睛像是闪烁着炭火，先是看了看自己妻子和孩子生前最爱坐的椅子和最爱用的陶碗，然后就停在他那把已经用了四十年的老猎枪上……\n\n闯入者拿走了想要的皮草和钱，关门声如枪响传入耳际。"
 UFE_special_events.38.a:0 "猎人早已在心里扣下了扳机。"
 UFE_special_events.39.t:0 "格伦沃夫的头颅"
 UFE_special_events.39.desc:0 "卡列维奇听说格伦沃夫身亡时，他也在郊外打猎。不过，卡列维奇打猎并不是为了好玩，他是借此机会和自己的线人交流情报，谋划政变。总督突如其来的死讯让卡列维奇又惊又喜，他趁乱返回奇廷卡斯克，并且亲自去兵营调兵。\n\n虽然格伦沃夫在数周前解除了他的指挥权，以便让自己亲戚控制军队，但卡列维奇在军中拥有绝对的威望，而且还深得民心。他指示自己的老下属杀掉格伦沃夫派来的新官，然后带着士兵入驻总督府。\n\n总督府的格伦沃夫亲卫兵试图抵抗，但是被卡列维奇指挥下的正规军全部歼灭。卡列维奇随后处决了格伦沃夫留在总督府里的家人和其他属下，然后派人去殡仪馆夺走了格伦沃夫的尸首。\n\n数十分钟后，格伦沃夫全家老小的首级就被装上卡车，连着一封宣告卡列维奇夺权的“临时政府宣言书”一起被运到边疆区的各地——卡列维奇虽然在报纸和广播中宣告了自己上台的事实和未来的政策，可是科雷马的很多地区压根儿没有这些传媒手段。为了彻底树立自己的威信，卡列维奇才决定使用这种极为残忍的方法。\n\n等格伦沃夫的头颅被“巡展”一圈并回到奇廷卡斯克后，它缩水了一圈，还被冻成了黑灰色，跟发霉的土豆似的。"
 UFE_special_events.39.a:0 "格伦沃夫的惨死让民众欢呼雀跃……"
 UFE_special_events.39.b:0 "……他的头颅也令土匪和奸商心惊胆战。"
 UFE_special_events.40.t:0 "处理政府财政问题"
 UFE_special_events.40.desc:0 "格伦沃夫治下，科雷马边疆区的经济几近崩溃，政府内部贪污严重、效率低下，使得新政府面临着无钱可用的困难境地。\n\n经过技术官员和经济学者的建议，新政府准备开始发行新货币，以便重新获取金融主动权。当然，这就要求新的政府拥有足够的政治信誉和经济信用。\n\n政治信誉来自良好的政策和令行禁止的效率，而经济信用则来自政府手里掌握的足量硬通货……\n\n“等等！你们停一下！我没有违法！我们一家人……”一位不知名的商人在夜晚的旷野中撕心裂肺地哭喊着，但是当寒光闪闪的刺刀捅进他腹部之后，他的声音戛然而止了。\n\n在新财政政策的驱动下，政府开始了一场针对“异己商人”的无情镇压，任何不上缴皮草库存、不接受皮草官营的商户，都将消失在白雪皑皑的荒原中。\n\n这一过程当然伴随着一定程度的贪污和浪费，甚至部分有势力的商人为了止损，又把交税压力转嫁给自己的雇工和当地的牧民……只不过新政府并不在乎这种事情，因为只要你想做实事，就得明白“水至清则无鱼”的道理。"
 UFE_special_events.40.a:0 "得注意平衡，要加快政治改革了……"
 UFE_special_events.41.t:0 "解开革命的枷锁"
 UFE_special_events.41.desc:0 "切尔尼雪夫斯基在又黑又小的牢房中啃着像搓脚石一样坚硬的黑面包。\n\n“这是黑面包？实际上，这是一块搓脚石，看这蜂窝一样的构造，还有坚不可摧的质地。”他喃喃自语道——在长期被单独关押的情况下，切尔尼雪夫斯基已经养成了自言自语的习惯。\n\n自打半年前那位宽待革命者的卡列维奇长官被调离集中营，革命者的生存环境就陡然变得恶劣了起来，格伦沃夫派来的新官员残忍暴虐，已经害死了好几个同志。\n\n“呵，”切尔尼雪夫斯基满不在乎地耸了耸肩，“不死人哪能叫革命？”说罢他继续啃起面包来。坚硬的黑面包咯得他牙疼，那“咔咔”的震响弄得他的头盖骨像水壶盖子一样跳动。\n\n“我就说这不是面包！”\n\n当他把黑面包从嘴里取出来之后，牢房外面的动静终于传进了他的耳朵。\n\n“什么事？又要杀哪位同志了……？好吧！好吧！牺牲倒也不算坏事，起码在天国里……”切尔尼雪夫斯基皮痛苦地自言自语着，朝牢房的铁门凑了过去，试图把外面的声音听得更清楚一点点。谁知道那扇铁门居然打开了，“嘭”一声巨响撞在他的脑门上。\n\n“哦！总算轮到我了是吗？接下来是要枪毙我？”他捂着额头问道。\n\n“什么轮不轮到的？”来者竟然是他的老朋友赫尔岑。\n\n“赫尔岑？你为什么……”\n\n“格伦沃夫死了！”\n\n“哦，今天被枪毙的犯人是格伦沃夫……格伦沃夫是哪位？”\n\n赫尔岑闻言哈哈大笑了起来，差点没喘过气。\n\n“不是犯人，是格伦沃夫总督！他被推翻了！死了！全家都没能幸免！新政府说，要把我们都放出来!”\n\n切尔尼雪夫斯基惊讶地扶了扶自己的眼镜——当然，上面早就没有镜片了。"
 UFE_special_events.41.a:0 "革命自由了。"
 UFE_special_events.42.t:0 "和解"
 UFE_special_events.42.desc:0 "在山林里打了好几年游击的阿纳托利如今已满脸胡茬，根本看不出当年那英俊帅气的小伙模样了。他在岩洞里点了一堆柴，打算把随身携带的一点肉干煮软之后吃下去。\n\n“玛米娜怎么还不回来？”他喃喃道。\n\n前几周的正规军袭击导致他的队伍被打散了，许多兄弟被迫向南边的沼泽地撤退——那里有一个隐藏在苇丛中的据点可以藏身，而他和爱人玛米娜遭困，只能向东进入山区。如今他们二人已经快要山穷水尽，不过按理说正规军应该也放弃追击了，于是玛米娜决定下山打探情况，而阿纳托利留在洞穴里等她回来。\n\n当夕阳一点点沉入山谷，阿纳托利终于看见几粒晃动的人影出现在谷底的河滩上，斜阳的光辉把他们的影子拉得老长。阿纳托利警惕地熄灭了柴火，把防身的猎枪拿到身边。\n\n但是就在他即将举枪的时候，谷底传来了熟悉的声音——他的战友们正兴奋地呼唤他：“阿纳托利！快出来吧！格伦沃夫死了！现在是卡列维奇先生管事儿！我们被赦免了！快出来咯！”"
 UFE_special_events.42.a:0 "当政府改邪归正，他愿意再次为其效劳。"
 UFE_special_events.43.t:0 "扩建奇廷卡斯克大学"
 UFE_special_events.43.desc:0 "科雷马边疆区坐拥奇廷卡斯克大学，但科研发展却与其他东方军阀别无二致，这实在是滑稽。但是如果我们仔细考察奇廷卡斯克大学的状况，就能意识到这种现象完全是合情合理的。\n\n奇廷卡斯克大学草创之初偏向文科，而且场地不大，资金也很少，没有足够的条件建设实验场地和购置科研器材，再加上历届治理者都无心投资教育事业，这才导致这所大学“碌碌无为”。\n\n为了避免将教育资源和科学研究上的优势白白浪费，我们必须投资扩大奇廷卡斯克大学，为它添置楼宇和设备，使它能像一个正儿八经的综合大学一样运作。"
 UFE_special_events.43.a:0 "是啊，早该如此了。"
 UFE_special_events.44.t:0 "军事政治顾问"
 UFE_special_events.44.desc:0 "“当兵，为什么当兵，拿钱多呗。”\n\n“那还有别的理由吗？”\n\n“啥理由？当兵不也是职业？干个职业不就是考虑工资吗？还考虑别的，那不是疯了？”那个士兵讪笑着说道。\n\n帕维尔·比斯捷里沉默地看着眼前这个出身自油滑市民的士兵，一时语塞。\n\n在和麾下的大头兵与基层军官多次交谈后，比斯捷里对科雷马军队的“精神面貌”已经有了个大概的认识。\n\n“和其他地方的军阀部队并没有区别……这也是意料之中。”\n\n回到奇廷卡斯克的大本营后，帕维尔·比斯捷里在征兵工作会议上向卡列维奇讲解了情况：“现在我们的部队鱼龙混杂，许多城市油滑分子也来参军，我认为良家子弟和学生才是更好的兵源……这些人愿意接受教导，而且听从指挥，过于世故的家伙往往油盐不进，没有组织度可言。”\n\n“那现有部队应该如何处理？您是否有政策上的建议？”卡列维奇询问道，“毕竟我们也不好一口气把他们全复员了”。\n\n“先解散一些次要的部队吧，这些散兵游勇很难控制……之后留下相对较好的部队继续训练，随后我们在此之外额外新招一支部队作为教导师，以此为模板，一点点改造其他部队。”\n\n卡列维奇听罢略微笑了笑。\n\n“其实解散并不是特别好的办法。”\n\n比斯捷里有点疑惑：“难道要继续保留这些冗余的混子吗？”\n\n“那倒不是，”卡列维奇断然说道，“我想我们未来会和他们变成真正的敌人，早晚得杀掉他们。”\n\n卡列维奇那颗远东人的脑子里所装的粗犷点子吓了比斯捷里一大跳。\n\n卡列维奇见状，微微挑了一下他那灰色的眉毛，有条不紊地进行了解释：“这群杂兵失去军职之后是不会解甲归田的，他们一旦被解职，就会成为土匪！不过，除了让他们滚蛋之外，我们大概也没有别的法子了。”"
 UFE_special_events.44.a:0 "在远东，一切文明都穿着野蛮的外衣。"
 UFE_special_events.45.t:0 "刑罚"
 UFE_special_events.45.desc:0 "尤里·鲍里索维奇·瓦拉金本是一个濒临破产的牧民，而现在他的生活已经逐渐稳定下来。在格伦沃夫执政的最后几个月里，鲍里索维奇本来都打算带着一家人逃荒了，好在卡列维奇夺取了政权，一时间村民们拍手称快，而牧主也不得不收敛了一些。\n\n卡列维奇政府出台“降低租金、降低利息”的政策之后，鲍里索维奇终于不用担心破产了，现在他完全交得起养驮兽和源石虫的租子，还能有一点余粮拿去卖钱。\n\n在进城卖肉卖皮毛的路上，鲍里索维奇经常能看见有土匪的尸首被挂在树上和路标上。就连前些年令人闻风丧胆的暴徒沃罗比约夫也被击杀，鲍里索维奇亲眼看见沃罗比约夫被枭首示众，躯干还倒挂在奇廷卡斯克城郊的大树上——已经被冻成了冰棍。\n\n某天他从奇廷卡斯克赶集回家之后，发现自家牧主达夫列辛先生居然被一队士兵押走了。找人一问才知道，原来是他勾结外面的土匪，请他们帮忙刺杀地方官员。\n\n达夫列辛的牲畜，凡是正由牧民代养的，全部分给牧民，其余则直接充公。\n\n鲍里索维奇简直不敢想象，那作威作福的牧主老爷也会被抓。他思来想去，觉得达夫列辛先生应该只是被关几个月就会放出来吧，或者——他最大胆地设想了一下——被人鞭刑十下？不，应该是五下。\n\n不过么，下周他出门赶集的时候，就在村外一里多地的一个木桩子上，看到了达夫列辛那已经有点风干的人头。"
 UFE_special_events.45.a:0 "“哎哟！哎哟！吓死我了！”"
 UFE_special_events.46.t:0 "信贷储蓄社"
 UFE_special_events.46.desc:0 "“格伦沃夫那会儿，你要是没钱买驮兽犊子或者种子粮，就只能找地主、牧主借高利贷，买地和草料也是，最后利滚利越欠越多……现在不用了，直接找信贷储蓄社去借，利息可低多了……就是老爷们肯定看不惯。”\n\n“他们哪里敢看不惯？隔壁村的大牧主，听说还是贵族，他拉起外面的土匪，把地方官杀了、把进步的村民杀了，还威逼农民和牧民不准去信贷储蓄社，只能找他借高利贷……结果全家都被毙掉了，那帮土匪也是统统运进城里公开处决。”\n\n“你这么一说，我就想起那天看到了塞门诺维奇，他以前不是牧主吗？”\n\n“啊……他犯了事，牲畜被收了。”\n\n“他倒没犯大事，不算很坏，上面不杀他……那天我见他低着脑袋走路，结果撞到墙上了，那墙上正好贴个报纸，上面有卡列维奇的照片，他抬头一看，就吓得尿了一裤裆！”"
 UFE_special_events.46.a:0 "“哈哈哈哈哈！”"
 UFE_special_events.47.t:0 "土地改革"
 UFE_special_events.47.desc:0 "土改官把地契递到维塔利耶维奇手里，可没念过书的他横竖都看不懂写在上面的文字。苦命惯了的他甚至开始下意识地担心这上面是不是故意写错什么，以便未来做他的局。\n\n“维塔利耶维奇先生，从今往后，这片牧场就是您家的咯。”\n\n维塔利耶维奇倒是认得这片地的形状轮廓——这是他当了好多年牧民的地方……现在就这么归自己了？\n\n正在他分神的时候，一阵焦糊的味道远远飘来，出于牧民对火情本能的警惕，维塔利耶维奇立刻抬头张望——原来是土改官们正在烧毁牧主家的欠条和租契，那些曾压得他喘不上气的小纸条，现在正随着滚滚黑烟飘向天空，再也没法伤害他了。\n\n维塔利耶维奇回过神来，他释然地回身躺下，躺在属于自己的土地上，看着属于自己的驮兽环绕在身旁。"
 UFE_special_events.47.a:0 "而前方就是天空。"
 UFE_special_events.48.t:0 "本地军官"
 UFE_special_events.48.desc:0 "叶卡捷琳娜·彼得留克是一个纯粹的怪胎女兵，留着一头远东特色的黑头发，没人知道她本来的名字叫什么，她自己也不愿意说，大伙都只晓得她自己给自己改过姓名，而且她很乐意让自己的姓名听起来不男不女。\n\n虽然生在贫瘠的远东，但叶卡捷琳娜对车辆载具很感兴趣，甚至还经常在驾驶任务里故意“耍杂技”。\n\n可是，常在河边走，哪有不湿鞋？有回她负责运输军火物资的时候，因为试图炫技，一不小心把军车开进了山沟里，虽然她立刻跳车侥幸生还，但昂贵的车子和辎重却几近报废。于是叶卡捷琳娜遭到了严厉的惩罚——送入惩戒营戴罪立功。\n\n好在她确实有特殊的才能——在一次镇压土匪的行动中，叶卡捷琳娜修复了一辆略有损坏的友军汽车，并且驾驶它救出了一个班的友军。在撤离的路上，她又发现战机，利用汽车的机动性偷袭了敌人的迫击炮据点。\n\n久而久之，她的上司，惩戒营营长伊万·东达利亚克·沃尔科夫注意到了她的天赋，便直接向上级推荐她做自己的副手。\n\n这二人的组合在接下来的几次镇压行动里都建立了奇功。沃尔科夫擅长森林和雪地作战，而叶卡捷琳娜擅长战场机动，他们屡次歼灭叛乱的牧主地主武装，多次击败盘踞在北部山林里的匪徒。最高指挥部已经在考虑对他们进行提拔。"
 UFE_special_events.48.a:0 "让他们站上更高的平台吧！"
 UFE_special_events.49.t:0 "亡命者的末日"
 UFE_special_events.49.desc:0 "风雪之中的一间小木屋内，葛列格里正灌着伏特加。过去数日的经历告诉了他这样一个事实：属于不法之徒的时代快要结束了，文明曙光已经照到了科雷马的林海雪原。\n\n遥想过往，他已经快要忘记自己故乡的样子。葛列格里端起铳，缓缓擦拭。故乡、家乡、家园？这些词早就变得陌生。他很年轻时便参军入伍，去过很多地方，见过不少城市与村落——就是可惜忘记了自己故乡的名字。他依稀记得卡西米尔边境的样子；依稀记得参与阅兵时圣骏堡广场的宏伟；依稀记得极北的雪原与泰加林，也依然记得那场改变他人生的大叛乱。\n\n大约是1074年时，他不幸与大部队失散。当时的他还惧于会因此被视作逃兵，可没想到却因祸得福，逃过了“大叛乱”之劫。在一场足以改变一切的大潮中，当事人总是难以察觉到他们在经历着什么，而葛列格里正如无数重大事件的亲历者一样。如果说他对大叛乱的时代有什么印象的话，除了天天都在咕噜叫的肚子，就是在那些酒吧中流窜的谣言了——它们或真或假，难能辨别。\n\n流浪的葛列格里很快落草为寇。他起初试图做一个赏金猎人或者雇佣兵，却屡屡碰壁，而体力劳动太苦太穷，他消受不起，最终不得不去行“必要之恶”。他还记得自己最初偷窃的那只花瓶；也记得第一个受害者的惊恐表情；更记得这二十余年来他的整个犯罪生涯。\n\n从小偷到强盗，再到令人畏惧的可怖狂徒，他经历了许多。他对犯罪的看法也在这数十余年中渐生变化。最初，他不过认为这是一时之恶。可在漫长的“磨砺”中，葛列格里彻底将犯罪视为了他生活中的一部分，以其作为吃饭的“手艺”。可如今，随着卡列维奇政府对犯罪分子的无情追猎，一切不复过往。他逃避围捕已有一周多了，他不清楚自己到底该不该继续跑，如果该跑的话又该往哪儿去。东国？南方的荒原？还是向西逃到贝加尔湖畔？葛列格里放下铳，再度拿起酒瓶。\n\n可他还没喝下去，一个想法就窜上心头——要是自己弃暗投明，加入卡列维奇的军队呢？"
 UFE_special_events.49.a:0 "结束是新的开始。"
 UFE_special_events.50.t:0 "僻壤"
 UFE_special_events.50.desc:0 "“我一定是失心疯了才会想来这里”，与其他同行者一起走下卡车，伊琳娜·阿列克谢耶夫娜喃喃自语。她面前的村落满目破败，举目望去，多是老旧且污损的木屋。而她要去的校舍也大抵如此，这里没有宽广的广场，教室的天花板低矮且看起来似乎相当不稳。\n\n望着教室中眼神木讷的学生们，伊琳娜开始再度怀疑起自己为何要来这里……她只记得自己“因志愿”来到了这个穷乡僻壤支教，甚至可能一辈子都要困在这儿——面朝无尽的雪原与森林，永远默默无名地为国奉献。\n\n她还记得那辆卡车上的同行者们，这群人大多是被派到乡村的干部而非像她这样的支教教师。他们和伊琳娜一样都是在远东少有的文化分子，其中有不少人还对政治理论略有涉猎。伊琳娜对政治倒是不太感冒，但她很乐于倾听同行者们讲述关于马佐夫、罗素尔的著作，花语运动及林贡斯毁灭之类的故事，也钦佩于这些人选择离开大城市，去乡村支援基层的决心。如果是她，才不会甘愿来这样的地方\n\n思绪回到现实，她的第一堂课从此开始。默默看了眼背后那块颇具“时代痕迹”的黑板，伊琳娜执起教鞭，她将从每一个字母开始教会这群孩子他们所需知道的一切。"
 UFE_special_events.50.a:0 "“孩子们，我先做个自我介绍。”"
 UFE_special_events.51.t:0 "紧急征召"
 UFE_special_events.51.desc:0 "第三集团军土崩瓦解的消息传到奇廷卡斯克后，有人大惊失色，也有人蠢蠢欲动。没了第三集团军的威慑，整个东达利亚已经彻底不受乌萨斯帝国的控制，邻近的萨坎哈自治领宣布独立、更南边一些的感染者武装势力宣布成立苏维埃政府、克缅哥罗德方面整军备战、贝加尔大公准备进攻周边的军阀……\n\n接踵而至的谣言和新闻就像雷暴前的积雨云，提醒着人们：科雷马边疆区已经不可能偏安一隅，战争马上就要来临了。\n\n[UFE.GetLeader]并不担心战争，相反，他热切盼望用战争来解决问题。不过由于民间恐慌已经在奇廷卡斯克引爆了骚乱，他必须做两手工作。[UFE.GetLeader]召开会议，要求各地官员按照给定的指标开始征兵，同时他也下令控制粮食和日用品价格，避免恐慌扩大。\n\n当然，仅靠这些举措还不足以平息动乱和获得胜利……"
 UFE_special_events.51.a:0 "“我要把军队调入奇廷卡斯克！”"
 UFE_special_events.52.t:0 "镇压骚乱"
 UFE_special_events.52.desc:0 "暴乱已经持续了数月，奇廷卡斯克的空气中弥漫着不安与愤怒。新一轮大叛乱的消息点燃了这座城市的积怨和焦虑。不少关于物价和征兵法案的谣言传遍了大街小巷，它们就像一群看不见摸不着的蛆虫，可以从最幽暗的下水道闯进每一家每一户中。\n\n“凭什么富人交100卢布就能免役，而我们穷人就要去送死？”骏鹰族裔工人曼林一边挥着拳，一边跳到街边的石墩上，冲追随他的人群高声呼喊。\n\n过了几天，征兵法案的原文终于在人们中间传开，原来富人的免役税是三万卢布，而且每户最多免役一人，不过这些真相根本不足以安抚惊慌失措的人群。如今，奇廷卡斯克的街道上堆满碎砖乱石，几辆有轨电车被掀翻在地，冒着黑烟，还有人看见一群暴民将几名感染者拖进巷子群殴。施暴者的拳脚如雨点般落下——他们将无处锚定的质疑和怨恨发泄到了矿石病人身上。\n\n甚至有人试图冲击奇廷卡斯克的大学，他们愤怒地要求：“吊死那些养尊处优的学生和教授！”。暴徒数次围攻大学而没能攻入——大学知识分子免役的条例激怒了普通市民。民兵们试图维持秩序，但在汹涌的人潮面前节节败退……直到卡列维奇的嫡系军团带着火炮从军营中赶来。\n\n“散开！否则开枪了！”指挥官冷峻的声音在街道上回荡，“安抚政策早已宣布，你们的抗议已经超出了提出诉求的界限，请立刻回家去！”\n\n曼林站在最前面，手里攥着一块瓦片。他看见那些黝黑的枪口对准了人群，看见士兵们疲惫而坚定的面孔。\n\n一声枪响不知从何而来，似乎是个失去理智的示威者朝着军队发射了自制手枪。\n\n刹那就，步枪齐射，巨响轰鸣。曼林感到胸口被重重一击，倒下的瞬间，他看见自己手中的瓦片滚落在地，上面沾着自己的鲜血。"
 UFE_special_events.52.a:0 "我们不得不这么做！"
 UFE_special_events.53.t:0 "斩首"
 UFE_special_events.53.desc:0 "第三机动治安连的士兵们正在凌晨的雾气中飞快地穿过奇廷卡斯克的街道。曼日罗夫上尉紧紧攥着摩托车龙头，他感觉手心全是滑腻腻的汗水，要不是手套防滑，他大概已经握不住车把了。在科雷马，摩托车可是稀罕物，光是在大街上一骑就显得威风凛凛。曼日罗夫必须带人以最快速度赶到目标地点附近——线报说暴乱首领们正在珍珠街一间仓库里进行快速集会，机不可失。\n\n“就是那儿。“探子低声道，指着不远处的一栋砖石建筑。\n\n治安连的人立刻从卡车、摩托车和驮兽上面下来。曼日罗夫抬手示意，三十名士兵立即分成三队，一队堵后巷，一队守前门，他亲自带领十人翻墙进攻。\n\n破门槌撞开木门的巨响惊动了里面的人。烛光中，七八个男子惊慌起身，文件散落一地——其中有工人领袖、商会头目、黑帮老大，也有来自萨坎哈和乌萨斯帝国的间谍。\n\n“以临时政府的名义，你们被捕了！”曼日罗夫喝道。\n\n一场混战旋即爆发。暴徒首领们操起桌椅和手枪抵抗，有人试图从后门逃走，却迎面撞上士兵们的霰弹枪口。枪声和哀嚎声在仓库中回荡，不到十分钟，所有头目都被制服或击杀。\n\n黎明时分，士兵押着被捕者走出仓库。曼日罗夫看着这些满脸不甘的人，知道今天的行动阻止了更大规模的暴乱——斩去头颅的蛇，身体再强壮也无力进攻。"
 UFE_special_events.53.a:0 "奇廷卡斯克的清晨恢复了宁静。"
 UFE_special_events.54.t:0 "新的家园"
 UFE_special_events.54.desc:0 "马柳金用靴尖试探土地，这里的黑壤松软得像发酵面团似的——柔软得让他感觉不太真实。泥土那温暖的潮湿感让他感到惊喜。\n\n这里的每一寸土地都覆盖着绿植，裹着露水的草叶在晨光中闪闪发亮。\n\n无论是土质还是景色，都说明劝他移民到此的行政官员没有说谎。“这里太适合种地了，”他喃喃道，用手指碾碎了掌心的土块，“太好了！”\n\n从未被犁刃勾勒过的无垠草原一直延伸到极限，根本望不到边。风吹过时，草浪起起伏伏，时不时显出藏在洼地中的小水塘，白桦林在远处勾勒出苍翠的轮廓。这里没有北方的永冻层，没有那种连希望都能冻住的寒冷。\n\n马柳金高兴地看着自家临时搭建的木屋，已经开始畅想富足的未来生活了。政府说得没错，这片名为潘陆岛的土地更加仁慈。他想起北方那个小村庄，每年只有很短的时期能勉强种植耐寒的土豆，放牧也极为困难，一家人全年都在与严寒和饥饿抗争。\n\n现在，他有了长得多的生长期，有了肥沃的黑土，有了可以狩猎的森林和可以饮用的清澈河流。\n\n马柳金深吸一口充满草木清香的空气，感到一种许久未有的东西在胸腔中生长……"
 UFE_special_events.54.a:0 "那是对明年的期望。"
 UFE_special_events.55.t:0 "征兵动员"
 UFE_special_events.55.desc:0 "[Root.Capital.GetName]的空气中弥漫着革命的热情。在城里的一个小广场上，有位身着褪色制服、缺了条腿的老兵站上了临时搬来的木箱，他的声音像破钟一样嘶哑，但却能穿透一切。\n\n“公民们！乌萨斯帝国的部队正在边境集结、贵族手下的匪徒正在山野和乡村中侵害同胞！那些封建杂种、皇室走狗，要把锁链重新套回我们的脖颈！他们想让我们重新跪下去舔皇帝的靴子！只要不彻底消灭他们，他们就要一直谋划着侵占我们的家园！”\n\n围观者仔细一看，发现老兵身上正戴着义务宣传员的袖章——他是来组织征兵动员的。一些感到尴尬的市民只能摇摇头走开，不过还是有不少的人留了下来。\n\n“为什么他们要对我们备战？他们不是宣传说我们的部队只不过是乌合之众吗？公民们，因为那些贵族老爷们已经怕了！他们怕我们的刺刀，怕我们的炮声，怕我们已经过上的这种新生活……当然，他们更怕我们脑子里装着的新思想——”\n\n他扫了一眼人群，观众的留存率超出了他的期望，这让他的嘴角浮现出笑意，而他说话的语气也更激动了：“各位朋友，大方瞧，参加军队可以不是为了某个戴王冠的畜生，我们可以为自己、为了我们所有人而参军！参军是为了证明我们全体人民都可以站起来左右自己的命运、保护自己的利益！当牛做马的旧思想再也拴不住我们了。”\n\n“公民们，到军队中来吧，不仅是政府需要你们，更是你们需要一个敢于站出来抗争的崭新自己——这才能证明我们的权利和觉醒！请参加军队！加入革命！”"
 UFE_special_events.55.a:0 "人群用赞美和欢呼回应了他的演讲。"
 UFE_special_events.56.t:0 "革命军事学院"
 UFE_special_events.56.desc:0 "军校教官又在用那催眠的平淡声调讲解弹道学原理，黑板上的曲线与公式，随着教官的声音在曼德里卡脑中如麻线一样打结，让他完全忘记了时间的流逝。\n\n还记得几个月前上文化课那会儿，牧民出身的曼德里卡第一次勉强写全自己的名字——他握笔的样子滑稽透顶：手指僵硬得像被冻伤，使得迟疑的墨水在纸上晕开一个巨大的黑斑。不过，他那决绝的笔尖最终行动起来，甚至把纸都给划破了，这与其说是用笔写字，倒不如说是端着刺刀在捅敌人。\n\n只有战术课让他如鱼得水——这让他回想起在牧区与兽群和掠食动物周旋的日子。他能从地形图中看出最佳的伏击点，能在沙盘推演中预判敌军动向，连教官都直言“这家伙天资太棒了”。不过，来自政治课的那些知识，就是他自己一辈子都悟不出来的道理了——牧主不是天生就该富有，牧民不是命该受苦，人人生而平等，却有无往不在枷锁之中。\n\n“我们职责的表象是作战，但本质是为了解放祖国，”负责上课的军事政治委员曾这样说道，“我们要建立的，是一个新的乌萨斯，一个自由的乌萨斯共和国。”曼德里卡懵懂地听着“自由”、“共和”、“解放”之类的大词，他终有一日会明白这些词语的分量。"
 UFE_special_events.56.a:0 "我们要建立一支崭新的军队。"
 UFE_special_events.57.t:0 "关于新式聚能穿甲弹的报告"
 UFE_special_events.57.desc:0 "科雷马金属公司推出了一款划时代的新式弹药，它采用了一种全新的破甲原理——该弹的聚能装药战斗部撞击装甲时，大部分能量都会集中到一点上——这是通过精准排布炸药来实现的——使锥形药罩在微秒内被爆炸的力量射出。高密度金属——通常是铜——将被转化为一股极细的超音速射流，以惊人的力量击穿装甲。\n\n金属射流会像热刀切入黄油那样穿透钢板，留下孔径不过手指粗细的破口，射流后方跟进的金属残体会将破孔撕裂成拳头大小，在装甲背面迸发出铁花一样的喷溅物。\n\n由于射流还具备自锐效果，这又增加了它的穿甲能力。不过，由于其穿甲水平往往和药罩直径有关，不需要考虑飞行速度，所以用常规火炮发射这种弹药是不合适的，反倒是步兵反坦克武器非常适合采用这种弹药。\n\n除了聚能穿甲弹，科雷马金属公司也改进了传统的动能穿甲弹，铝热弹一类的新式武器也在开发进程中。"
 UFE_special_events.57.a:0 "乌萨斯帝国的走狗们会尝到它们的厉害。"
 UFE_special_events.58.t:0 "旧日遗产"
 UFE_special_events.58.desc:0 "“普汀娜，严肃地说，我们对你的容忍已经到头了，数年来，你从未跟上过革命的脚步，甚至现在还拖它的后腿——你等着被它碾碎吧！”说话的人是切尔尼雪夫斯基。\n\n由于事关重大，罢免普汀娜的会议聚集了革命政府内的所有高层人物，连暂时下野的卡列维奇也赶来参会。普汀娜战战兢兢，但也极不服气地等待着最终的判决。\n\n卡列维奇希望直接杀了她，而赫尔岑和切尔尼夫斯基则认为要按具体法条治罪——新政府需要建立起稳固的秩序，不能再用暴力举措了。\n\n“留着普汀娜是一种隐患，但是如果我们不经过完整的程序就处决她，对我们的法制建设同样是隐患，我们只能两害相权取其轻。”\n\n“可是她的罪责已经足以死刑，多关她一天，就增加一点她叛变的可能性……她是格伦沃夫留下的官员，虽然办事有力，可终归是不可靠的！越往后她的立场越反动，我们早已经证明了格伦沃夫留下的这些遗产全是定时炸弹！”\n\n“唉……我想她应该掀不起什么风浪了，她还能从监狱里跑出来吗？”"
 UFE_special_events.58.a:0 "希望监狱能把她盯牢了。"
 UFE_special_events.59.t:0 "穆拉维约夫被捕"
 UFE_special_events.59.desc:0 "穆拉维约夫已经被通缉一周了，他东躲西藏，最后还是在萨坎哈地区的一间小屋里被捕。他没有反抗，平和地看着两名戴着革命蓝五星的宪兵敲门进来，宣读了临时议会的法令。他们称他为“邦联派叛徒”。穆拉维约夫只是点头，伸手穿上外套。\n\n街道上有些居民在围观，但没有人说话。宪兵没有捆绑他，只是走在他两侧。石子路面在雨后泛着光，透出些许潮湿的腥气。\n\n监狱里的气味浑浊而污秽，穆拉维约夫被推入一间牢房，里面已有三四个人。一个面色苍白的男人抬头看他，苦笑着问道：“您终究还是被捕了。”穆拉维约夫凝眸细看，原来对方是他的追随者阿尔达舍夫。\n\n次日，穆拉维约夫被简短审讯，一名年轻官员记录了他的名字和职业，未抬头看他。“你是否反对革命政府的权威？”官员问。穆拉维约夫迟疑了一下，说：“如果这权威是统领乌萨斯的一切，不给具体的个人和地方留有余地，那么我反对这种权威，但是革命本身那种神圣的权威，我并不……”官员漫不经心地挥手，不等他说完就将他撵回了牢房。\n\n穆拉维约夫没有受刑，也未再见审讯者。一周后，他和其余囚犯被转移至北方一个不知名的集中营。沿途村庄寂静，田野间有人劳作，但无人注视囚车。在集中营，他们被要求从事伐木和捕鳞之类的劳动——在东达利亚刺骨的寒风中。"
 UFE_special_events.59.a:0 "他怀念起自己南方故乡的阳光。"
 UFE_special_events.60.t:0 "潜逃"
 UFE_special_events.60.desc:0 "普汀娜在冰冷的牢房里已经待了几个月，审讯断断续续，而安沙科夫是今晚负责提审她的官员。夜幕降临，安沙科夫带着副手来到了普汀娜所在的楼层，发现大门罕见地没有上锁。\n\n“完了！”安沙科夫几乎是咆哮着喊出了这句话。\n\n走廊空无一人，唯一的警卫瘫倒在椅子上，头不自然地歪着，旁边有个打翻的茶缸。安沙科夫命令副手拉响警报，而他狂奔到普汀娜所在的牢房。\n\n不出所料，她越狱了——还连带着好几个被关押在相邻区域的人一同越狱了！\n\n当这个糟糕的消息传到[UFE.GetLeader]办公桌上时，只是让其本就紧皱的眉头拧得更紧了一点点，因为就在几分钟前，[UFE.GetLeader]已经得知了好几个政治犯越狱的消息，这些该死的异见者就像是被东达利亚的暴风雪卷走了一样，消失得无影无踪。\n\n“这还能是巧合吗？”旁边的另一个委员用拳砸在桌上。\n\n“只有一个解释——一个组织严密、能量巨大的地下阴谋集团在内部运作，它不仅能弄到情报、买通关键人员，甚至能跨地域进行统一的行动，同时帮助多个敌人潜逃……”[UFE.GetLeader]严肃地说道。\n\n想到这个看不见的敌人，恐惧与愤恨攫住了房间里每一个人。"
 UFE_special_events.60.a:0 "清洗必须进一步加强了。"
 UFE_special_events.61.t:0 "得救"
 UFE_special_events.61.desc:0 "布达丁在监狱潮湿的单人牢房里辗转反侧，他已经能数清距离本月八号的行刑日还剩下几个日出。他不再思考化学公式，他什么都思考不下去了，只要大脑一运转，断头台可怕而阴森的影子就直接压了过来。\n\n不知过了多长时间，他听见牢门锁链稀里哗啦地响了起来，他以为是提审或转移。然而，随着烛光中出现的不是狱卒，而是一位身着革命政府制服、面容疲惫的官员。那人手中拿着一份文件。\n\n“布达丁·瓦列里扬诺维奇·伊戈尔，”官员的语气是公事公办的平直，“革命政府通过了《政治犯罪知识分子赎罪法案》，意味着像你这样的有罪科学家可以免于一死，进入科研机构来为革命效力……你的名字正好在名单上。”\n\n布达丁沉默着，他的罪状——压榨手下学生的过往、被指控的贪污和旧制度的烙印——早已将他钉死在耻辱柱上。\n\n官员继续道：“我们认为，你的头脑比你的头颅更有价值，你的死刑被特赦，你将在一个科研委员会里，用你的知识为革命和共和国服务，以此赎罪。”\n\n文件被递到布达丁眼前，上面确实盖着中央政府的红色大印。\n\n官员离开后，牢房重归寂静。布达丁缓缓坐回草铺，手指下意识地摩擦着腕上冰冷的镣铐。一种近乎眩晕的畅快感席卷了他，那是一种从万丈深渊被猛地拉回地面的失重感。他深吸了一口牢房里污浊的空气，第一次觉得它也能如此清新。"
 UFE_special_events.61.a:0 "“我得救了……暂时的。”"
 UFE_special_events.62.t:0 "共和国不需要学者"
 UFE_special_events.62.desc:0 "监牢的石壁湿润润的，反射出一点点黯淡的光，博尔德列夫·阿纳托利耶维奇·谢尔盖麻木地数着镣铐上的环扣——明天他便要赴断头台了。这是意料中的事，革命总要吞吃几个旧时代的人，只是轮到自己时，竟还有些许恍惚。\n\n他曾是一个贪污腐化的大学教授，掌握学生的前程并以此要挟他们送钱献媚，还因为性侵案件害得女学生自杀。当然，他确实也有真本事，但众人认定他榨取民脂民膏的罪责已经超过了他推进技术进步的功劳。\n\n也有友人为他奔走，陈情说博尔德列夫的英才关乎国家大用，却只得到官员冰冷的回应：“共和国不需要学者，只需要为国家而采取的正义行动！”博尔德列夫知道后，也只好苦笑起来。他一生探寻万物之理，末了却要死在最简单的机械原理之下——斜刃落下，头颅便与躯干分离。\n\n最后一夜，他怕得睡不着觉，他想起未竟的实验笔记，想起那些等待验证的和已经验证的东西。一种苦闷的懊悔漫上心头——但他可不是后悔自己以权谋私玷污了神圣的科学殿堂，而是悔自己竟以为躲在象牙塔里便可超然于乱世。\n\n革命洪流卷来时，谁会分辨你是学者还是凡人呢？有罪就必须死！\n\n到了刑场，他垂头丧气，似乎是因为在牢房里阴暗惯了，到室外反而不习惯阳光的直射。他眯眼瞥见了断头台，看见锃亮的斜刃在阳光下亮得刺眼。铡刀落下，他那颗天才的头颅最终与最愚昧的头颅一样……"
 UFE_special_events.62.a:0 "在篮子里滚作一处了。"
 UFE_special_events.63.t:0 "审判"
 UFE_special_events.63.desc:0 "邦达列夫是个纯粹的商人，在大革命战争刚刚爆发的时候，他就敢推着推车上前线去给军队卖东西。路过革命军关卡时，他就大喊“革命万岁”，路过帝国军关卡时，他又转而喊“皇帝万岁”。\n\n赚钱的那股劲儿给了他惊人的勇气，他从不怕被流弹击中，也不怕踩到地雷，有时他还敢扒尸体上的东西。不过这些办法来钱还是来得太慢，在赚够了启动资金后，邦达列夫就开始玩起了投机倒把、囤货居奇。\n\n他很清楚民主革命派中有相当一部分市场自由主义者，这些人影响力不小，而且力主“小政府”，邦达列夫可以肆意妄为地收购市场上的粮食和盐糖，然后坐看物价飙升，最后把手里的好货出完，赚个盆满钵满。\n\n借着革命战争的东风，邦达列夫给自己一家换了别墅，给妻子女儿换上了华丽的长裙，他自己也拄上了镶宝石的手杖——手杖的原主人是个被枪毙的贵族，邦达列夫从监狱官员那里淘到了这个宝。\n\n“革命好啊，我支持革命！我也是革命派！”邦达列夫经常如是说道。\n\n然而，最近一段时间，邦达列夫却开始感觉情况不太对劲了——他熟识的几位官员都因为物价管控不力而遭到逮捕和审讯，他也因为失去人脉，在生意上发展不顺，而且还打探不到未来的政策方向了。\n\n“不会出什么岔子吧？”邦达列夫正担心着，就听见有汽车停在自家大门前的动静。来者不善，他们粗暴地制服了邦达列夫雇的守门人，随后一路闯到主楼客厅。\n\n“你们干什么！我可是支持革命的！”\n\n“邦达列夫，根据物价控制委员会和革命保卫委员会的命令，你因有‘投机倒把’、‘破坏民生安全’的嫌疑，现已被批准逮捕，这里是逮捕令和搜查令！”"
 UFE_special_events.63.a:0 "他想要站起，却发现自己腿都吓软了。"
 UFE_special_events.64.t:0 "秋后算账"
 UFE_special_events.64.desc:0 "穆拉维约夫已经离开了劳动集中营，但他又在南方一个监狱里被关押了许久，他自己都数不上日期了。他并不期望自己能够得救，但是也对政府一直不处决他感到惊奇。\n\n同样被关在此地而一直没有处刑的还有很多人，其中不乏一些土匪和强硬保皇派。这些人又臭又硬，几次试图殴打穆拉维约夫，甚至经常讥笑他：“支持革命？你现在不也被革命者抓起来了？还支持吗？”\n\n这些人还经常半夜闹腾，从不知道哪里搞来烈酒喝——可能是民间一些同情他们的保守人士悄悄捎带的吧，反正要是被狱卒发现，他们就会被体罚，但若是没有发现，他们就不知羞耻地喝到烂醉，然后爬上牢房的采光小铁窗，冲着外面的路人大喊大叫。\n\n“等皇帝打回来，看老子杀了你们全家，把你家小孩炖来吃了！”\n\n被恐吓的路人总是又把这些粗鄙之语传播开来，闹得民心惶惶。这种事情几乎在每座城市都有发生，并且已经导致民愤爆发，据说奇廷卡斯克就有愤怒的民众联合民兵冲入监狱，在迫使狱卒同意后，原地召开人民法庭，审判了所有在押的囚犯，九成左右的人都被杀掉了。\n\n“照这样下去，早晚……”\n\n还没等穆拉维约夫想完，狱卒就来了。狱卒的神情异常严肃。\n\n同牢房的其他人还没读出狱卒脸上写着的阴沉讯息，他们还嬉皮笑脸地问：“哟，我们可老实了，没惹事也没打架，干嘛呀？”\n\n“奉革命政府清理各地政治犯之命，本监狱内的政治犯将被立刻审判，并且根据结果立刻处理……现在就开始，你们排好队去大堂。”\n\n“我们的辩护人呢？”\n\n狱卒哭笑不得地撇了一下嘴：“痴心妄想！审你们也是一次同时审五到十人，快速清理，还辩护人？”"
 UFE_special_events.64.a:0 "此言一出，那些讪笑者的脸都白了。"
 UFE_special_events.65.t:0 "灭亡"
 UFE_special_events.65.desc:0 "“快点！快开吧！”耶里钦娜惊慌失措地跳上了那辆卡车。\n\n“我们没有加满燃料……”\n\n“来不及了！”\n\n于是卡车在茫茫夜色里疾驰而去，它的目标是七十公里外的乌萨斯帝国据点。然而当他们开到半路，就发现革命政府早已在他们的必经之路上设下了新的关卡。于是耶里钦娜只得下车，和司机一同在荒野中步行。二人艰辛跋涉，中途还渡过了一条水流湍急的小河，当他们抵达岸边并且爬上高高的岩石河岸时，发现居然有一辆驮兽拉的小车在等着他们。\n\n“恰达耶夫！”耶里钦娜兴奋地喊着，“你怎么会知道我们的位置？”\n\n“请小声点！”恰达耶夫说道，“我向附近的村民打听了地形，猜到你们会到这附近，所以我预先等着，还带了夜用望远镜找你们。”\n\n耶里钦娜高兴坏了，但恰达耶夫却波澜不惊甚至有些严肃，他一路上都不怎么说话，面对耶里钦娜热切的询问和搭话也只顾着敷衍了事。他仿佛充满顾虑似的，满头大汗地拉住驮兽，让小车停在了一片尚未播种的旱田里。\n\n“为什么要停车呢？恰达耶夫先生？”耶里钦娜有点慌张了。\n\n恰达耶夫咽下一口唾沫，然后拉响了手里的信号弹。\n\n“恰达耶夫先生！你做什么？”\n\n“对不起啊……可是我还有老婆孩子，还有亲兄弟们……”\n\n革命政府的士兵和警察从远处的树林和沟壑中走了出来，他们是奉命前来抓捕耶里钦娜的，恰达耶夫充当了他们的助手。\n\n“虽然我也难逃一死……但我的家人不会有事了……”恰达耶夫流着眼泪说道。"
 UFE_special_events.65.a:0 "这是叛徒应得的下场！"
 UFE_special_events.66.t:0 "调遣特派员"
 UFE_special_events.66.desc:0 "大革命战争比我们此前经历的任何一次军事冲突都要巨大，在绵延数千公里的漫长战线上，上百万军队互相厮杀，我们以往的指挥系统已经不堪重负，中央政府也难以应对复杂的军务。\n\n而且，战区的扩大也导致将领不服管教和政治不可靠的问题被无限放大，此前发生的特鲁别茨克伊案已经证明了军队中的隐患。为了解决这些问题，共和国需要直接向军队派出直属于中央的官员，由他们全权负责各项原本需要军方于中央对接才能完成的军务。\n\n这意味着特派员们将拥有极大的权力，甚至可以插手地方行政，但很明显，为了保证战争胜利，国家必须容忍这种缺憾——起码比纵容军事叛乱要好。"
 UFE_special_events.66.a:0 "把革命的触角伸向各个角落！"
 UFE_special_events.67.t:0 "限价令"
 UFE_special_events.67.desc:0 "物价无休止上涨的日子不知何时才能到头，娜塔莉亚越来越焦虑了。她买不到面粉、买不到黄油，更别提早就限量供给的肉、糖、盐了，近些日子，连最廉价和低贱的红薯和土豆都贵了起来。\n\n“都是因为那些富商！他们囤货不卖，抬高物价！”她的丈夫愤怒地说。\n\n娜塔莉亚也是这样认为的，因为她和街坊邻居聊天的时候，也总听到这样的观点，而且她确实看到过富人吃穿不愁招摇过市的模样。\n\n当土豆都开始卖出高价后，这些不满和议论终于被民众的愤怒熔化成岩浆，然后从火山口喷发出来。娜塔莉亚在好友的邻居的鼓动下，参与了一次大游行。这次游行的主角是全城的八千多名家庭主妇，其中既有年过八旬的老太婆，也有还没成年就已经嫁人生子的年轻姑娘。她们浩浩荡荡地前往市政广场，要求政府解决物价飙升和物资紧缺的问题。\n\n娜塔莉亚参与的这次游行，只不过是“土豆示威”的冰山一角。在革命政府控制下的乌萨斯半壁江山，游行和暴动此起彼伏。当然，帝国那边的情况还要更糟糕一点。\n\n为了保障民生和平息骚乱，革命政府最终在民意主导下推出了全面限价令。然而令人意外的是，法令本身似乎并没有直接起到什么实际作用。由于限制价格实在太低（比成本还低），许多生产者宁可自己使用产品，也不愿售卖，反倒是黑市发展了起来。\n\n革命政府严厉打击黑市，结果反倒是让物资短缺加剧了。好在限价令起码确保了军需物资的稳定供应，而且与之同期发布的农业政策改善了粮食生产情况，在最糟糕的几个月过去之后，经济危机终于一点点缓解了。"
 UFE_special_events.67.a:0 "不算是坏事。"
 UFE_special_events.68.t:0 "推选"
 UFE_special_events.68.desc:0 "夕阳将远处的森林和雪山染得像正在燃烧的火，也让聚集起来的人们拉着老长的影子，几乎要投到山和森林上去了。镇上的市民们正在参加政治集会。\n\n说起来，他们曾在集会上决定过地主和贵族的生死、选举过本镇的自治代表、探讨过是否派代表去首都面见领导人、争论过要不要逮捕某个可疑的镇民、商量过在镇上哪个地方开一家公办的粮铺。\n\n但这一次，他们要商量的事情可谓是前无古人——他们要推举出一个人，而这个人将带着推荐信，直接进入共和国最好的大学读书。\n\n“哎，弗拉迪斯拉夫！他不错啊！”听见有人喊出自己名字时，弗拉迪斯拉夫大吃一惊。\n\n“可我只上过小学啊！”\n\n“你会算数啊，你可是我们这里最好的帐房先生。”\n\n镇民相继举手，森林般的手臂指向渐渐变暗的天空。\n\n弗拉迪斯拉夫手足无措地看着这一切，他完全不知道去大学读书意味着什么，他甚至感觉有些害怕。也许是看出了他的局促不安，当天晚上，镇里的革命派干部拜访他家和他彻夜长谈。\n\n第二天一早，弗拉迪斯拉夫总算在众人的鼓励下，就着同乡们凑的干粮，搭上一辆顺路的卡车离开了。他只是一个记账员，没什么文化水平，早年在农村里倒是会种地，他猜想自己大概率会被分到农学专业，学成之后……也许会回到家乡当农场工人吧。"
 UFE_special_events.68.a:0 "这是以前想都不敢想的事。"
 UFE_special_events.69.t:0 "集体创新"
 UFE_special_events.69.desc:0 "秋日的凉爽气氛并没有让工人瓦西连科感到放松。\n\n前几天，工厂车间在用磨床磨制一批凸轮轴车床的滚针时遇到了巨大的困难，所有技工都束手无策。这批零件是军备生产上的急需件，现在却半天赶不出来，所有人都急得像热锅上的蚂蚁。\n\n可是再着急又有什么用呢？加工所需的材料直径小、强度硬，大伙费了九牛二虎之力，一天也只能磨出十几件，质量还不过关。普通技工瓦西连科见状，突发奇想提出了用车床加工的建议，可是试了几次都失败了。有人笑话说：“磨床都磨不好的活，怎么可能用车刀车呢？”瓦西连科无可奈何，毕竟按常理，磨床的加工精度肯定比车床高，但磨床又不是万能的，有的零件肯定更适合车床加工。\n\n“或许改进一下加工方法，车床精度就能达到磨床的水平吧？”瓦西连科暗自想道。\n\n他整晚待在车间里琢磨问题，在车床上一次次地试验。瓦西连科发现，经过淬火的滚针与车床合金刀的硬度相差无几，车床刀具硬度不够，所以才不能切削工件。\n\n“嘶，能不能用硬度更高的材料来制作刀具呢？”瓦西连科意识到凭自己是想不明白这个问题的，不过他听说最近共和国出台了学院高级学者、工程师轮转下放的政策，在本地的技术交流委员会应该就能找到博学多识的专家。\n\n第二天一早，他顾不得一夜的疲惫，就跑到技委去找专家请教，他选择去咨询一位来自克缅哥罗德工科学院的教授。\n\n遗憾的是，学者教授并不太熟悉这些具体的加工事宜，但是却在材料上为瓦西连科指明了方向。瓦西连科用教授给他介绍的几种材料制作了不同牌号的刀头，经过试验，总算找到了最合适的一款。瓦西连科还自己动脑重新设计了刀头角度，终于帮助全厂攻下这个难关。"
 UFE_special_events.69.a:0 "生产任务如期完成。"
 UFE_special_events.70.t:0 "自由放任"
 UFE_special_events.70.desc:0 "在直接打击了投机者之后，经济衰退的阴云依旧笼罩着新生的共和国。首次大选形成的国会陷入了第一次严重的分裂，“自由放任”的呼声日益高涨，坚信市场能自我修正，然而要求政府扩大干预的声音也越来越大，希望国家能亲自出面处理困局。\n\n二把手彼得·恰达耶夫是一位古典自由主义的坚定信徒，在耶里钦娜的帮助下，他顶住了所有要求政府干预、救助濒危企业的压力。\n\n恰达耶夫在政策咨文中说道：“繁荣需要痛苦的洗礼。投机者的烂摊子，不该由勤劳的纳税公民承担。”他毅然推行了激进的自由放任政策：大幅削减关税、严格控制货币供应、拒绝纾困。\n\n但是再雄辩的修辞也掩饰不了短期内的经济灾难——无数依靠政府合同和保护性政策生存的低效企业倒闭，股市一度暴跌。报纸痛斥恰达耶夫为“冷血的刽子手”、“颠覆共和国的豺狼”。\n\n然而，正如他所预言的，市场开始了无情的自我清洗。资源从投机领域（如虚高的铁路股票）迅速流向更高效、更具创新性的实体产业。没有了政府救市的预期，投机者们血本无归，纷纷破产离场。\n\n尽管距离放任政策的效果显现还有一段时间，但是人们已经可以遇见前程的好转。"
 UFE_special_events.70.a:0 "恰达耶夫是正确的。"
 UFE_special_events.71.t:0 "军队经营产业"
 UFE_special_events.71.desc:0 "随着我们把政府的工作重心转向发展经济，过于臃肿的军队就开始拖后腿了。昂贵的军费让我们缺少足够的资金去投资实业，进一步限制了经济的发展，让我们一直无法摆脱经济萎缩的阴云。\n\n然而，在大革命战争的年代里，贸然削弱军队也是不合时宜的，既然我们陷入了这样的两难境地，就只能采取一种特殊办法了——允许军队经营产业。\n\n“省下的每一分军费都将转而发到人民的腰包里，”耶里钦娜如是说道，“而军队则要在这个时期保持克制，运用自己的独特条件自给自足，可以通过经营产业来满足自身需求，就像古代的屯田军一样运作。”\n\n但不可忽视的是，军队经商将会滋生严重的腐败。仅仅在这个政策推出后一个多月，就出现了好几起糟糕透顶的军队贪腐案——军火和军粮被倒卖、军工厂的产品粗制滥造……"
 UFE_special_events.71.a:0 "算了，别管了。"
 UFE_special_events.72.t:0 "白色恐怖"
 UFE_special_events.72.desc:0 "[Root.Capital.GetName]的街巷总是比官方的通告更早传出政治消息，因为空气中弥漫的味道是会变的——血与狂热交织的辛辣已经变成了……某种停滞、犹疑的潮湿气息。木匠瓦西里耶夫就在这种气息里，放下了他的刨子。\n\n窗外传来零星的语声，但不是往日游行示威时那种整齐划一、志气昂扬的呼喊，而是更杂乱、更压抑的嗡嗡声。他推开窗户，看到邻居正激动地对一小群人比划着。\n\n“听说了吗？革命派的人……被打倒了！”邻居压低了声音。\n\n瓦西里耶夫的心猛地一沉，随即又古怪地轻了一下。革命派被打倒了？切尔尼雪夫斯基、赫尔岑、茹科娃……还有卡列维奇？那些名字曾经代表着革命、代表着不可动摇的意志，是天上的阳光，也是断头台的阴影，是所有人公开场合必须脱帽致敬的对象。\n\n他们都倒了？瓦西里耶夫瓦下意识地摸了摸脖颈，那感觉如此虚幻，就像一直紧绷着准备迎接斧刃的肌肉突然失去了力气。\n\n街上的人们，脸上没有明显的喜悦，更多的是一种不知所措的茫然。恐怖并未散去，只是换了件白色的外衣。过去几年里，革命政府像一架精准而残酷的机器，每个人都知道它的规则，尽管这规则用鲜血书写——说错话，可能死；和错的人交往，可能死；甚至表现不够热情，也可能被怀疑。但至少，它有一种可怕的“秩序”。现在，机器的齿轮突然崩断了，接下来会怎样？\n\n瓦西里耶夫想起那些被押赴刑场的囚犯，想起熟识的面孔一夜之间消失，想起因为一句抱怨面包价格的话而惴惴不安的夜晚。他们这些普通人，被革命的洪流裹挟着，欢呼过，也战栗过，如今洪流似乎撞上了暗礁，前途莫测。\n\n但在那一片沉重的迷惘中，终究还是有一丝极其微弱的、近乎罪恶的侥幸心理，好似橡木桶裂隙中渗出的酒液——"
 UFE_special_events.72.a:0 "“也许……新政府真能做得更好？”"
 UFE_special_events.73.t:0 "切尔尼雪夫斯基遇刺"
 UFE_special_events.73.desc:0 "乌萨斯冬季的黄昏来得特别早。切尔尼雪夫斯基暂住在城郊一件谷仓里躲避监视。\n\n茹科娃风尘仆仆地赶来，身上还带着一层薄雪。她心急如焚地前来汇报近段日子的政治形势，最近的情况糟糕透顶。\n\n切尔尼雪夫斯基和他的警卫从谷仓里走出，由于切尔尼雪夫斯基需要抽烟，所以他们选了一块远离谷仓的空地见面。\n\n然而，切尔尼雪夫斯基刚掏出火柴和香烟，茹科娃也刚准备开口说话，一声枪响就从很近的地方传来。\n\n枪声并不响亮，沉闷得像是书本掉落在地。切尔尼雪夫斯基向前踉跄一步，刚刚点燃的烟卷从手头滑落，在泥土上溅起几点火星。凶手就是他的警卫，他手中那把转轮手枪还在冒着青烟。\n\n茹科娃想举起手里的公文包砸过去，但是枪手抢先一步扣动了扳机。\n\n她低吼一声，被子弹强烈的冲击打得弯下了腰。\n\n“完了……”她喃喃自语，抬眼看向凶手，任凭对方举枪继续射击。第二枪打中了她的额头，她感觉自己脑门上“咔嚓”响了一下，一股热流随之淌了下来。\n\n“结束了……”这是她意识消散前最后的想法。\n\n第二天早上，切尔尼雪夫斯基和茹科娃的死讯便见诸报端。这两位革命民主派的领导人的死标志着白色恐怖的结束，在此之前，失势的革命派虽然多次被耶里钦娜政府的暗杀者袭击，但还在组织公开的或地下的反抗活动，但随着主心骨死去，他们再也掀不起风浪了。"
 UFE_special_events.73.a:0 "说再见吧。"
 UFE_special_events.74.t:0 "取消政委"
 UFE_special_events.74.desc:0 "帕维尔·比斯捷里首先是一个职业军人，然后才是一名革命者。\n\n当政府取消军事政治顾问的消息传来，比斯捷里没有特别吃惊，他早就料到了。切尔尼雪夫斯基和赫尔岑那样的领袖人物都能被杀死，军事政治顾问这个职位又有啥不可能被取消的理由呢？比斯捷里唯一无法预料到的，是他自己的命运。\n\n他很清楚，耶里钦娜不信任他，因为他是个老革命，是切尔尼雪夫斯基那派的潜在支持者，但是耶里钦娜又离不开他，毕竟他在军中有人望、有人脉，还有出色的指挥能力。\n\n就像耶里钦娜最终也不敢动卡列维奇一样，她大概率也不会动比斯捷里。但是谁说得准呢？难道耶里钦娜授意暗杀切尔尼雪夫斯基不是一件极为大胆和极端的行为吗？一个这样可怕的领导人，到底会干出什么来，那可是完全猜不到。\n\n比斯捷里长叹口气，不再想这些令人难过的事情。"
 UFE_special_events.74.a:0 "“我仍然是一个将军，我还有自己的职责。”"
 UFE_special_events.75.t:0 "凋零"
 UFE_special_events.75.desc:0 "秋天的工业区总是阴雨绵绵，空气里混着煤烟的味道。沃洛辛坐在“马铃薯”酒馆里他常坐的角落，由于他一直发呆，所以面前那杯黑啤酒半天没下去多少。突然，吧台那边有个人的声音陡然拔高，把他从自己的思绪中拉了出来。\n\n“她就是个屠夫！穿裙子的屠夫！”那是个叫做瓦西尔琴科的焊工，沃洛辛认识他，但不是很熟。焊工狠狠捶了下桌面，让木头发出痛苦的闷响，酒杯们也被震得一跳。“矿上、钢厂、船厂……大片大片地关闭，福利也砍了，医院学校也要收钱了……”\n\n一旁的人见状试着劝解：“算了吧，战争打了那么多年，国家百废待兴，要是维持福利，共和国就抽不出钱去恢复经济了……短痛是为了长久的健康嘛。”\n\n“滚开！”瓦西尔琴科猛地转身，脸膛涨红，“住在[Root.Capital.GetName]的那些企业家和政客倒是可以笑到最后！我们呢？短痛就能把我们痛死！”\n\n沃洛辛浑浊的眼睛看着他们。他想起自己的儿子，也在北边的一个矿上工作，现在整天忧心忡忡，说政府要对他们开刀。\n\n酒馆里沉默下来。\n\n沃洛辛想起过去的战争岁月，那时还是配给制呢，但是在那个时期，人与人之间互相团结，而且无论遭遇什么困难，都能得到旁人或政府的关心。虽然上面给的政治压力也很大，但至少保证所有人的信念是一致的，而什么对什么错是清晰可辨的。\n\n现在……沃洛辛也说不出到底是过去好还是现在好，他只觉得现在的自己确实是更自由了，就像被扔掉的垃圾在自由落体一样，不过他也确信，经过艰难的大革命战争，自己确实也需要喘一口。\n\n沃洛辛不是反对改变，他只是…"
 UFE_special_events.75.a:0 "不想被当作垃圾一样扔掉。"
 UFE_special_events.76.t:0 "新货币"
 UFE_special_events.76.desc:0 "被称作新卢布的货币正式发行，所有来自乌萨斯帝国的旧币都被作废。不过，旧币仍然可以按照一定比例去银行兑换新卢布——当然每个人都有兑换上限。新政府的强力举措已经赢得了民众的尊重，而且它的手里确实也掌握了足够的硬通货，虽然新币目前还不够坚挺，但是人们基本上愿意接受它。\n\n信用低下的旧币正在被迅速驱逐，接下来政府要做的事情就是稳步搜集民间贵金属，同时抵制来自炎国、东国等周边国家和地区的杂乱外币。当然，按照远东惯例，任何政策的实施都要用人血来当润滑剂……\n\n“尼古拉·巴甫洛维奇·阿布拉莫夫，奇廷卡斯克商人，囤货居奇、投机倒把，制造物价波动，破坏货币政策，枪决……”\n\n“卢德米拉·尼古拉耶芙娜·阿布塔利波娃，科雷马地主和贵族，勾结帝国政府制造假币，制造谣言动摇新币信用，绞刑……”\n\n“瓦列里·亚历山德罗维奇·巴边科，科雷马匪徒，袭击运钞车、抢劫银行、杀害官员、窃取黄金和皮草，枭首示众……”"
 UFE_special_events.76.a:0 "千万不要心慈手软。"
 UFE_special_events.77.t:0 "恐怖政策"
 UFE_special_events.77.desc:0 "断头台的阴影在[Root.Capital.GetName]的石板街上延伸，它的威慑力可比枪决犯人的步兵班还要强烈一千倍。共和国公民波莉娜站在市中心的广场上，她的马尾辫像颗不安的心脏一样在风中颤动，而她闭着眼睛，任由头发在后颈上摩挲，那里传来的瘙痒感似乎在最后一次提示脖子的完好。\n\n“你为什么要犯罪？”审判官板着脸在法庭上问她。\n\n“因为我还有基本的人伦道德。”波莉娜答道。\n\n审判官摇了摇头：“你的道德酿成了恶果，它就不是真正的道德，却是一种软弱！你放走了一名被通缉的政治犯，而他很可能会在国内四处煽动叛乱，制造更多可怕的伤亡！”\n\n波莉娜并不服气：“那么请告诉我，审判官，我放走的那个家伙无非是个手无缚鸡之力的异见者，他也没有多大的影响力，只有嗷嗷待哺的家人，他拿什么制造伤亡？”\n\n“谁能保证他绝对没有威胁？没有威胁的人不会被通缉！”\n\n“难道我们的共和国已经脆弱到连这点负面的可能性都消化不了了吗？我不相信您所说的那种道德，真正的道德应该是强大的，是手中有剑而不轻易使用。”\n\n“共和国才创建不久，她难道还不够脆弱吗？稍有差池，就会万劫不复。”\n\n“你们有军队有警察，我看不出脆弱在哪里！你们都是暴君！”\n\n波莉娜最后的驳斥激怒了审判官，在陪审团中激起阵阵咒骂声。法庭走完规定的流程之后，下令立刻处决波莉娜。\n\n不一会，窗外就传来了斧刃坠落的闷响。审判官的手指在简易的木桌上蜷曲又舒展，他长舒一口气，又总感觉心里还憋点着什么。\n\n潇潇落雨击打在窗玻璃和外面广场的地面上，审判官站在窗前听着雨声，看着外面冒雨而行的人群——这些民众……乌萨斯的人民们，何尝不像现在的自己一样若有所思呢？"
 UFE_special_events.77.a:0 "故国人民有所思。"
 #世界新闻
 UFE_news_events.1.t:0 "[Get_newspaper_header]科雷马边疆区释放革命民主派政治犯" 
 UFE_news_events.1.desc:0 "在乌萨斯科雷马边疆区的前任总督遇刺身亡后，接过大权的革新派军官卡列维奇无视乌萨斯帝国政府的要求，将被囚禁于科雷马“劳役集中营”的数百名革命民主派政治犯悉数释放。政治犯们不仅重获自由，甚至还在卡列维奇的政府中获得了职位。\n\n乌萨斯帝国朝廷对此感到极度愤慨，但面对天高皇帝远的科雷马边疆区，帝国政府也实在是鞭长莫及。卡列维奇也是看准了这点，因此他根本不打算考虑乌萨斯帝国的态度，他将按照自己的想法来治理科雷马。\n\n更何况，约瑟夫·卡列维奇是远东骏鹰族裔和乌萨斯族的混血后代，是科雷马原住民，他亲眼目睹了帝国的官僚和驻军是如何残忍迫害当地原住民的，要他对帝国怀有半点忠心都是绝无可能的。\n\n至于重获政治权力的革命民主人士们，他们可能很快就要在卡列维奇的支持下，将科雷马边疆区改造成旨在摧毁乌萨斯帝国的革命根据地。"
 UFE_news_events.1.a:0 "这还远远不够！"
 UFE_news_events.1.b:0 "就凭他们？"
 UFE_news_events.1.c:0 "他们能改变乌萨斯吗？"
 UFE_news_events.2.t:0 "[Get_newspaper_header]乌萨斯革命民主派在远东执政"
 UFE_news_events.2.desc:0 "在革命民主派政治家的帮助下，科雷马政府已经完成了政治改革和经济改革，彻底站稳了脚跟。\n\n由于统治范围的空前扩张，原政府首脑卡列维奇认为自己暂时没有能力管理好如此大的地盘——毕竟他出身草莽，早年也是自学成才，没有接受过系统的教育；而革命民主派也希望自己能放开手脚，以便在新增的领土上推行改革。\n\n于是双方一拍即合，卡列维奇主动让贤，将政府交给了革命民主派的领袖切尔尼雪夫斯基，而他自己则暂时退出政坛，在政治顾问和经济学家的帮助下提升自己的执政水平，以便在未来更好地为国效力。\n\n远东政权的权力接力棒正式交到了革命民主派手上，乌萨斯帝国的统治真正意义上受到了威胁！"
 UFE_news_events.2.a:0 "我们离目标越来越近了。"
 UFE_news_events.2.b:0 "提高警惕！"
 UFE_news_events.2.c:0 "他们真敢挑战帝国吗？"
 UFE_news_events.3.t:0 "[Get_newspaper_header][REU.GetName]与[UFE.GetName]决定合作"
 UFE_news_events.3.desc:0 "经过一段时间的谈判，[REU.GetName]与[UFE.GetName]正式决定在乌萨斯革命中合作。双方的领导者欢聚一堂，在热烈而友好的氛围中商讨出了一份宣言性质的共同纲领，两边的士兵们也亲如兄弟般走到了一起。\n\n不过革命者的好消息，就是帝国的坏消息。[REU.GetName]与[UFE.GetName]的联合对帝国政府来说无异于当头一棒——革命民主派和共产党走到了一块儿，两股力量将联合成一股足以横扫东达利亚的强大势力，破坏帝国政府在当地的一切战略平衡政策。\n\n如果革命派的力量真的统一了东达利亚，那么乌萨斯帝国将如何处理国内改革问题呢？他们真的能在革命者发动进攻之前，稳住危如累卵的国内局势吗？这些问题，也许只有时间能解答了。"
 UFE_news_events.3.a:0 "为了新乌萨斯！"
 UFE_news_events.3.b:0 "该死的叛乱分子！"
 UFE_news_events.3.c:0 "帝国即将面临风暴。"
 UFE_news_events.4.t:0 "[Get_newspaper_header]革命者的内战"
 UFE_news_events.4.desc:0 "[REU.GetName]与[UFE.GetName]原本应该是志同道合的革命者，但最终还是因为意识形态的对立而兵戎相见。尽管在东达利亚东部地区，[win_leadership_target.GetName]的影响力和号召力已经远远超过[lose_leadership_target.GetName]，但[lose_leadership_target.GetName]坚决不接受[win_leadership_target.GetName]一方的领导，并谴责对方在本质上是“非革命的”。\n\n[win_leadership_target.GetName]一方则对和统谈判的破裂深表遗憾，并且批评[lose_leadership_target.GetName]既不考虑己方为什么在革命实践上落后于人，也不从现实出发进行决策，反而是教条式地指责他人，最终葬送了原本大有希望的“革命同盟”。\n\n无论双方怎么打口水战，两群革命者现在也只能像两支军阀一样，用纯粹的武力来决定谁生谁死了。"
 UFE_news_events.4.a:0 "我猜有人在说“这帮革命者自己放着就垮了”。"
 UFE_news_events.4.b:0 "这帮革命者自己放着就垮了。"
 UFE_news_events.5.t:0 "[Get_newspaper_header]乌萨斯大革命战争"
 UFE_news_events.5.desc:0 "在做了充足的准备之后，[UFE.GetName]于今日正式进攻[URS.GetName]。在东达利亚漫长的边境线上，无数火炮毫无预警地发射，在数小时短促而凶狠的炮火准备后，[UFE.GetName]的地面部队正式发动了全线进攻，而直到此时，乌萨斯帝国政府才收到了革命政府的宣战电报。\n\n尽管[UFE.GetName]在开战前进行了精心的准备，但战争造成的社会恐慌和政治动荡还是超出了革命民主派政治家们的想象，不过乌萨斯帝国那边的情况也没好到哪里去——实际上，双方政府都得在处理前线战事的同时，控制来自后方的叛乱和骚动。\n\n这是你死我活的革命战争，两方都必须倾举国之力确保胜利，因为输家必然万劫不复——不仅是在现实中万劫不复，连在历史叙事中也会万劫不复。\n\n这场革命者谋求推翻帝国政府的大革命战争将决定乌萨斯民族未来的命运，也会改变世界历史的行进方向。"
 UFE_news_events.5.a:0 "解放全国！"
 UFE_news_events.5.b:0 "保卫皇帝！"
 UFE_news_events.5.c:0 "乌萨斯要变天了？"
 UFE_news_events.6.t:0 "[Get_newspaper_header]乌萨斯平民派运动遭到血腥镇压"
 UFE_news_events.6.desc:0 "[UFE.GetName]内部激烈的社会矛盾和政治冲突引爆了声势浩大的“平民派运动”，平民派力求政府加强集权、镇压保守分子，尤其是要消灭掉一直在兴风作浪的“耶里钦娜反对派”。然而，已经与革命民主派元老们决裂的耶里钦娜根本不打算遵守任何原则，她厚颜无耻地指责平民派的示威是违宪的叛乱，并且要求军队立刻进行镇压。革命政府打算阻止她的残暴行为，但是耶里钦娜已经和军方保守派勾结，她联系上了正在潜逃的前共和国将军特鲁别茨克伊，还设法控制住了首都周边的卫戍部队。\n数天之后，耶里钦娜在军方支持下悍然发动“政变”，她派遣部队攻击首都市区内的“平民派”群众和工人民兵，同时包围封锁了政府大楼和国民议会驻地。在一番激烈的巷战后，政府和议会沦陷，而平民派代表们均遭杀害或逮捕。政府内的革命民主派元老们多被软禁，还被迫签署了交出权力的文书。\n耶里钦娜扫清了首都内的反对者后，又命令军方清理全国范围内的“平民派”叛军，她声称“平民派”的叛乱会破坏未来首次大选的基本秩序。\n要求立刻大选，反对悬置宪法是耶里钦娜的一贯主张，但是她这么做的原因可不是为了保卫民主自由，她是打算形成一届对自己有利的议会以修改宪法，并且尽快确立威权总统制。"
 UFE_news_events.6.a:0 "我们改变航向。"
 UFE_news_events.6.b:0 "这帮叛军挺会内斗。"
 UFE_news_events.6.c:0 "无止境的内耗。"
 UFE_news_events.7.t:0 "[Get_newspaper_header]乌萨斯专政委员会"
 UFE_news_events.7.desc:0 "在平民派运动的支持下，乌萨斯革命民主派政府粉碎了“耶里钦娜反对派”的阴谋，并且增强了对军队的控制力度。现在革命政府已经开始按照平民派的主张，暂时悬置宪法，并逐步加强自己在战争时期的权力。\n\n经历了三番五次的骚乱和阴谋事件，民主派的革命者们已经确信，民主共和有时候也离不开严格的专政政策——当看似反自由的“非常措施”真正符合民众的诉求时，专权也是“自由”的。\n\n“如果共和国在内外反对者面前露出了软肋，那它就会和民主的理想一同灭亡，人民甚至比我们更清楚这一点——在我们担忧实行恐怖政策是否会像普汀娜的暴力镇压事件一样破坏民主原则时，人民就已经意识到加强政府集权刻不容缓。人民显然有权力消灭人民之敌，而他们将这种权力集中地委托给了我们，我们若不行使之，那就是是背叛了人民。”\n     ——约瑟夫·卡列维奇"
 UFE_news_events.7.a:0 "必要之举。"
 UFE_news_events.7.b:0 "专政委员会的权利比帝国皇帝还大！"
 UFE_news_events.7.c:0 "前所未有的局面。"
 UFE_news_events.8.t:0 "[Get_newspaper_header]乌萨斯督政府叛乱"
 UFE_news_events.8.desc:0 "自共和国军队大清洗以来就背负叛徒骂名的特鲁别茨克伊将军终于等到了属于他的翻身机会。由于对乌萨斯帝国进行的大革命战争已经持续太久，[UFE.GetName]统治下的民众已经承受不住了，也许是社会问题的积累和引爆，也许是军队忠诚度的动摇，总之，一场叛乱来袭了。\n叛乱伊始，[UFE.GetName]的官员们以为，这次叛乱就像此前的任何一次一样，最终都会被轻而易举地镇压下去。然而现实并没按照他们的想象发展，叛军获得了民间反政府势力源源不断的增援，而国家的大叛徒特鲁别茨克伊也现身其中，共和国政府这才意识到大事不妙。特鲁别茨克伊早先因背叛革命民主派而被解职审查，后又主动支持耶里钦娜派系，并试图推动军方镇压“平民派运动”。\n虽然耶里钦娜好歹也算个民主派，但支持耶里钦娜不代表特鲁别茨克伊认同任何形式的自由主义，只是直到这次内乱时，特鲁别茨克伊才现出原形。\n就目前情况来说，虽然大多数民众依旧支持民主共和政府，但是特鲁别茨克伊的督政府依然有不少追随者，毕竟[UFE.GetName]在长期战争中也在慢慢失去民心。换句话说，能否消灭督政府，体现着[UFE.GetName]能否重新赢得乌萨斯最广大人民的信任。"
 UFE_news_events.8.a:0 "我们迎来了至暗时刻。"
 UFE_news_events.8.b:0 "还是那句话，他们自己放着就垮了。"
 UFE_news_events.8.c:0 "真可怕！"
 UFE_news_events.8.d:0 "维护乌萨斯祖国的稳定。"
 UFE_news_events.9.t:0 "[Get_newspaper_header]乌萨斯政局归于稳定"
 UFE_news_events.9.desc:0 "在战胜了乌萨斯帝国、结束了国内的社会动荡与政治冲突后，[UFE.GetName]终于稳定了下来。在国内战争期间被破坏的城市与村庄终于能够在和平中重建，而一直在高压政策下默默承受重担的人民们，也终于可以松一口气——政府已经承诺在短时间内取消非常政策，使得社会生活回归日常化的轨道。\n\n人们有时候很难相信，将时间回拨一年，乌萨斯还仍处在封建帝国的统治之下，而今却改天换日，变成了一个没有贵胄皇族的民主共和国。这一切就像清晨日出般，所有黑暗与沉寂一扫而空并被迅速遗忘，喧闹与光明猛地充斥了人们的感官，使人突然间以为生活本来就该如此——革命将真正的生命带给了全体乌萨斯人民。"
 UFE_news_events.9.a:0 "古老帝国终究覆灭。"


