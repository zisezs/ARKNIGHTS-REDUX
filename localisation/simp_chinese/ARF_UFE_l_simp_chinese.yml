 UFE_cheernixuefu_liberalism_leader_desc: "§L切尔尼雪夫斯基出生在帝国中部的一个信教家庭，幼时一度深受拉特兰教影响，因此对神秘学和哲学深感兴趣。在他考入圣骏堡大学文学系后，更是对莱塔尼亚的唯心主义哲学推崇备至，以至于花费了大量心血去研究莱塔尼亚观念论。然而在他二十岁出头时，他机缘巧合地接触到了圣骏堡大学内的“彼特拉舍夫斯基小组”，该小组成员都是激进的民主主义者，并且经常谈论空想社会主义和感性唯物主义哲学。深受该小组影响的切尔尼雪夫斯基最终转向了唯物主义，并且彻底抛弃了自己的宗教信仰，为此他甚至与自己的父母宗亲彻底决裂。\n\n站到民主派一边的切尔尼雪夫斯基开始阅读高卢共和运动期间的高卢政治著作，在完成学业后，他也放弃了在帝都的高薪工作，而是回到故乡，在一所中学中担任语文老师。然而，甘心忍受匮乏不意味着他不关心政治大事，在此期间他参与了多部民主派杂志的创办，还曾秘密前往维多利亚会见当时被驱逐出境的亚历山大·赫尔岑。也正是在维多利亚，切尔尼雪夫斯基正式加入到了革命民主派的革命团队中。\n\n回国之后，切尔尼雪夫斯基作为革命派的骨干，在帝国中部进行革命组织工作，他试图在大学和军校中发展进步青年加入组织，以求未来发动革命推翻帝国。\n\n不幸的是，在民主派发动第一次革命行动的前夜，叛徒出卖了他们。切尔尼雪夫斯基被监禁，随后被判处侮辱性质强烈的“假死刑”，然后流放科雷马。革命民主派的其他人物也多被流放此地，但是还是有近半数的革命者惨遭杀害。\n\n切尔尼雪夫斯基没有被流放吓倒，他牢牢记住了革命同志被杀害的血海深仇，哪怕身处冰天雪地的科雷马，他也立志要把革命之火烧回帝国。§!"
 UFE_heercen_liberalism_leader_desc: "§L亚历山大·赫尔岑出生在历史悠久且地位显赫的帝国官僚贵族家庭中，是雅克夫列夫家族的私生子，虽然不能继承父亲的姓，但他却获得了父亲独特的偏爱——他的姓氏“赫尔岑”就是父亲起的，来自莱塔尼亚语单词“Herz”，意思是“心”。赫尔岑的父亲给予了他良好的教育，在就读大学时，赫尔岑和朋友一起加入了研究共和政体政治和空想社会主义思想的学术小组，一个革命民主主义者的轮廓开始在他身上显现出来。\n\n完成学业后的赫尔岑因屡次出版煽动性刊物而遭到帝国警察逮捕，后来在父亲的帮助下免于牢狱之灾，改判流放六年。在流放岁月里，他看遍了帝国边远地区贫苦人民的悲惨生活和封建官僚的腐败无能，更加坚定了革命的信念。流放结束后他回到圣骏堡，再次开始宣传革命思想，这次他又因为出版“危害乌萨斯社会的自由思想著作”而被驱逐出境，于是不得不拖家带口流亡维多利亚。\n\n身居海外并不能阻止赫尔岑煽动革命的努力，他在维多利亚、哥伦比亚和莱塔尼亚联络其他流亡思想家，大量印刷革命刊物并秘密运回乌萨斯，还和乌萨斯本土革命组织建立了联系。\n\n数年后，革命民主派组织决定在帝国中部发动起义，由于事关重大，赫尔岑秘密回到乌萨斯，他得到了维多利亚大使馆的“承诺保护”，打算亲自指挥。然而，叛徒破坏了起义，大多数革命者因而被捕，维多利亚方面本就不愿与乌萨斯直接对抗，见状也违背承诺，拒绝协助赫尔岑出国，于是他也遭到监禁。\n\n赫尔岑一开始被判死刑，但由于他还有着莱塔尼亚崔林特尔梅大学和维多利亚伦蒂尼姆大学荣誉教授的身份，因此莱维激烈抗议乌萨斯的判决，最终使赫尔岑改判为流放科雷马。§!"
 UFE_liberalism_third_in_command_desc:0 "§L路易莎·茹科娃生于1056年，她从小就不服管教，十分顽皮。她的父亲是个退役的骑兵军官，而母亲则是帝国公务员，这样奇妙的家庭组合很难说没有对茹科娃的成长带来影响——她日后确实成为了一个既能妥善处理军务，又能同时管好政务的英才。\n\n在她十三岁时，父亲突然病逝，母亲因而特别注意管教她，毕竟她是家里的独女。茹科娃在1069-1072年间就读于一所教会学校，那里严格的宗教训练导致她日后极为痛恨宗教人士。到了1073年，茹科娃再也受不了母亲的管束，出逃圣骏堡，还偷了家中一些现金。愤怒的母亲因此要求将她关进少年管教所，茹科娃于是就在管教所里被关押了一年多。重获自由之后，茹科娃已经和母亲疏远，虽然她确实对自己的做法怀有歉意，但她也不愿再见母亲。\n\n自由的茹科娃在圣骏堡半工半读，自食其力地完成了法律学校的课程，并且成为一名经常帮助穷人的律师。但是在一次和信教贵族的法律冲突中，茹科娃当庭羞辱对方，甚至差点大打出手，结果被吊销律师资格证。\n\n茹科娃一不做二不休，干脆以此为契机，投身民主革命派，成为了职业革命家。她处理事务的出色能力使得她很得革命派元老们欣赏。在那次失败的起义中，茹科娃也表现得很有党性——她成功掩护许多同志撤离，自己被捕后面对酷刑也守口如瓶……当然，其他同志出卖了情报，使得她的坚持失去了意义。\n\n被流放到科雷马边疆区后，茹科娃已经算是革命民主派的新锐领导者，一是因为许多重要人物在此前的失败中损失掉了，二则是因为她确实赢得了所有同志的认可。§!"
 UFE_despotism_leader_desc: "瓦图丁·格伦沃夫的父亲是乌萨斯中部的地主，当年用卖官鬻爵的方式给儿子搞到了一官半职，于是格伦沃夫几乎没费什么功夫就当上了一名远东地区的小地方官，什么过关税、保护费、地租抽成收到手软。不过，格伦沃夫并不是一个安于现状的人，他发现东方领土盛产皮草，而皮草在帝国西部的售价相当可观。于是他和当地的猎人、士兵打成一片，并且通过父亲的渠道向帝国政府申请到了进行武装殖民和“科学考察”的许可。就这样，格伦沃夫拉着他的队伍进入了远东的林海雪原，他们试探当地的原始部落、建立哨所和堡垒、以帝国名义设下税卡中饱私囊，赚得盆满钵满。格伦沃夫利用手头的资金拉拢当地部落充当自己的打手，又持续从其他地区招募雇佣兵，迅速成长为地方一霸。\n\n垄断了当地皮草贸易和武装力量的格伦沃夫终于能够放心发大财了，他向当地的皮草商人征收重税，同时自己也在帝国西部寻找代理人来销售皮草，而他手头的武力又能很好地“打击”竞争对手并确保皮草“产量充足”。\n\n三年前，格伦沃夫终于迎来了自己最辉煌的时刻——在亲戚的帮助和几位皇族贵人的提携下，格伦沃夫的公司成了乌萨斯皇宫的皮草供应商，而他本人也被封爵，并被中央政府“正式”任命为帝国远东总督——尽管他已经在那儿当了六七年事实上的总督了。\n\n然而，辉煌的顶点也包藏着衰落的隐患，格伦沃夫明白自己迟早得金盆洗手。他数年来屡次盘剥土著部落，已经惹得对方民怨沸腾，同时他得罪友商的行为也让他结怨不少。最不妙的是，帝国政府对边疆的控制力正在持续削弱，这意味着他在当地作威作福的最大靠山已经摇摇欲坠。当然，还有一些隐患是格伦沃夫没有注意到的，那就是大批被流放到远东地区的“民主派”政治犯。虽然这些人在远东农牧民和原住民中间没有多大的影响力，但是当帝国的铁爪从远东大地上松开时，谁又知道会发生什么呢？"
 UFE_authoritarianism_leader_desc: "§L卡列维奇终于获得了自己梦寐以求的领导人地位，现在他可以按照自己的想法治理远东了。前总督格伦沃夫给卡列维奇留下了一个烂摊子，不过卡列维奇并不为此灰心丧气，他对未来有充足的信心。\n\n卡列维奇打算逐步建立起民主制度，并且改善当地人的生活条件，最重要的则是要消灭当地的匪徒、奸商乃至贪官污吏。这些目标可不容易实现，除非卡列维奇能够建立起一套强有力的基层组织来动员民众的力量。卡列维奇自己显然没有这个本事，但是他把目光投向了远东集中营里的民主派政治犯——如果能与这些优秀的政治煽动家和社会活动家并肩协作，还有什么是办不到的呢？§!"
 UFE_kalieweiqi_liberalism_leader_desc: "§L作为底层出身的军人，卡列维奇对劳苦群众的苦难感同身受，他同情民主革命者、支持共产党活动、蔑视乌萨斯帝国和贵族群体。同时他作为骏鹰族与乌萨斯族混血的后代，祖祖辈辈生活在遥远的边疆，几乎没有受到过乌萨斯帝国的“文明熏陶”，这反而使他免受许多腐朽思想的荼毒。在他主动接触革命民主派和知识分子以弥补自身短板后，那些新鲜而富有生命力的进步思想更是如“在白纸上勾勒任意的图画”般融入了他的灵魂。\n\n回归政坛的卡列维奇不仅享有很高的政治威望，还在军队中颇有影响力，这一点是其他革命民主派政治家所不能企及的。在非常时期，“卡列维奇”这个名字就意味着军队的忠诚——没有任何一个军人愿意背叛“卡列维奇老将军”。§!"
 UFE_yeliqinna_leader_desc: "§L塔季扬娜·耶里钦娜生在一个工程师家庭，后来出国留学，在哥伦比亚待过数年。回国之后，耶里钦娜强烈地反对乌萨斯帝国的封建帝制，希望乌萨斯能像哥伦比亚那样实行自由主义政策，然后再建立有民主选举的共和制度。这些激进的主张使得她像本土的革命民主派一样被流放到了远东的冰天雪地，但是很显然，她和本土的革命者在思想上有本质性的不同。§!"
 #人物介绍（二把手，不加人物肖像）
 UFE_authoritarianism_second_pure_desc: "约瑟夫·卡列维奇是骏鹰与乌萨斯混血的远东土著人，他的家庭一贫如洗，而且相当不和睦。和大多数远东穷孩子一样，卡列维奇很早就离家出走，外出干活谋生了。他在奇廷卡斯克当过猎人、搬运工、小贩和厨子，后来格伦沃夫在当地招兵买马，卡列维奇就因此从了军。令人意外的是，卡列维奇有相当出色的学习能力，他在当小贩的时候就擅长算账，当兵后更是只靠自己便学会了读写。格伦沃夫看他聪明，就让他去管远东的集中营。然而这并不是一个很好的决定，因为卡列维奇很快就和集中营里的民主派流放犯产生了接触。卡列维奇受到了这些政治犯的影响，其思想日益转向进步的一方，而且他的出身也决定了，他会更同情那些被乌萨斯帝国压榨的原住民，而不是愚忠于格伦沃夫这个皮草商。当然，卡列维奇天生的聪颖和精明使他行事谨小慎微，他总是能站好队，并且巧妙地伪装自己的面貌——格伦沃夫直到近两年才开始怀疑卡列维奇是否可靠，因为最近的原住民暴动实在太多，而卡列维奇一直对镇压行动持消极态度。格伦沃夫的怀疑显然是对的，只不过为时已晚。"
 UFE_liberalism_advisor_2_pure_desc:0 "彼得·恰达耶夫是乌萨斯境内远近闻名的温和派思想家，曾因力主实行君主立宪改革而被帝国政府监禁，后来他也在一定程度上支持革命派的行动，并最终因为参与赫尔岑和切尔尼雪夫斯基的起义而被流放边疆。在经历了帝国顽固的反对和镇压后，恰达耶夫终于从立宪派变成了革命派，只不过在革命派里他也是最保守的人。"
 UFE_liberalism_advisor_7_pure_desc: "弗拉基米拉·普汀娜是格伦沃夫总督提拔的奇廷卡斯克执政官，她出生在圣骏堡，曾经考上过帝国警察学院，但是在担任警察后没多久，就因为贪污和虐待囚犯的问题而被开除——不过似乎是上司把罪行推给了她。失业后的普汀娜又因为参加街头流氓组织抢劫富人而被捕，最后被流放到贝加尔延达谢斯克。但是她在那里又跑到一个地主家中行窃，最后又被驱逐到了科雷马边疆区。时任科雷马总督格伦沃夫在她身上发现了杀伐果决、精明胆大的优点，干脆将她拉入亲兵部队培养，最后让她混成了奇廷卡斯克的执政官。"
 UFE_field_marshal_second_in_command_pure_desc: "谢尔盖·彼得罗维奇·特鲁别茨科伊是乌萨斯帝国的贵族亲王，他的父亲是四国战争的英雄，但也因参与对高卢作战而深受高卢革命思想的影响，于是特鲁别茨克伊自幼就产生了对进步派的同情。\n\n在特鲁别茨克伊步入成年后，也经常和军校里的进步青年军官保持联系，所以许多立宪派乃至革命派政治家都认为这位亲王是可以争取的对象。正因如此，当赫尔岑和切尔尼雪夫斯基试图在乌萨斯帝国中部组织革命时，革命民主派立即联络了当时担任中将的特鲁别茨克伊，希望他能带领部队响应起义。\n\n虽然特鲁别茨克伊是一个相对温和的君主立宪派，但是他理想化地认为暴力革命的发生有助于迫使皇帝陛下接受改革，于是便草草同意加入起义。然而就在革命的前夜，特鲁别茨克伊却突然拒绝露面，他认为起义时机并不成熟，因此不敢出面领导军队。与此同时，起义的消息也被叛徒转告给了帝国政府，秘密警察迅速逮捕了所有涉事者，当然也包括特鲁别茨克伊。\n\n特鲁别茨克伊由于拥有亲王身份，因此并没有遭受拷打，关押地点也不在监狱，而是在皇帝的度假别墅里。不过他最后还是被剥夺贵族身份、判处流放科雷马边疆区，和革命民主派政治家们殊途同归。\n\n然而奇怪的是，大部分革命者的家属也受到了牵连，被没收财产或软禁在家，可特鲁别茨克伊的子女和妻子却得到了帝国政府的优待，因此不少人猜测他就是出卖起义的叛徒，但特鲁别茨克伊总是反驳称这只是政府照顾他的“前亲王”身份罢了。不过无论特鲁别茨克伊说些什么，在革命派眼里，他的灵魂已经被打上了保守怯懦、摇摆不定的烙印。"
 #人物介绍（二把手与顾问，要加人物肖像）
 REU_Alina_UFE_desc: "人物肖像：\n\n\n\n\n\n\n\n£Alina\n\n\n\n\n\n\n\n\n§L感染者们的老师，这是阿丽娜之前的身份，她现在的身份是乌萨斯共产党的书记和根据地的教育部长。这个农家姑娘从未设想过自己能够在政府中担任一官半职，更遑论是一个与当局分庭抗礼的政权中的高官。但是这位埃拉菲亚对此并无压力，阿丽娜谨记着塔露拉的理想和康拉德的教诲，她的书桌旁，除去书记需要处理的来自各地纷繁复杂的文件，还放着成堆的社会主义著作，一些是她翻译的，另一些是她写的。她告诉自己，同时也是告诫，她是为人民服务的，她来自于人民，那么她就要以最大的感恩去回报、去奉献乌萨斯人民。§!"
 REU_Talulah_red_army_desc_second_desc:0 "人物肖像：\n\n\n\n\n\n\n\n£portrait_REU_Talulah\n\n\n\n\n\n\n\n\n§L“反抗会为大地带去希望。”\n\n塔露拉·雅特里亚斯，一个在东达利亚的冻原上战斗了数年的战士，直到那一场意外的相遇后，她和她的队伍才找到了战斗的真正意义。萨卡兹红军的到来不只是让游击队获得了更强的力量，他们带来的最有价值的东西是一种思想，一种以启蒙运动为渊源，由亚历山大·马佐夫和韦伯·海森提出并完成，由康拉德·克内希继续发展，并传授给塔露拉·雅特里亚斯的思想。\n\n塔露拉幼时所接受的贵族教育帮上了她的忙，她得以比其他人更先一步地理解这个意在摧毁所有贵族和豪绅的思想，并且变成这个被称为“共产主义”的崭新理念的忠实卫道士。在新思潮的洗礼下，塔露拉之前的迷茫最终得到了解答，而黑蛇的诅咒也不知不觉中倒在了在批判的武器下。\n\n但是批判的武器代替不了武器的批判。游击队和萨卡兹红军开始主动扩张自己的势力，并且将理想的光芒播撒到冻原的村落之间。感染者纠察队所受到的袭击越来越频繁，临近的城市中也出现了幽灵的传闻，贵族们开始恐惧而谨慎地审视这个失控的“蛇鳞”，她已经成为了一个幽灵，一个共产主义的幽灵，在东达利亚的冻原上游荡。§!"
 UFE_liberalism_third_picture_desc:0 "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_third_in_command\n\n\n\n\n\n\n\n\n§L路易莎·茹科娃生于1056年，她从小就不服管教，十分顽皮。她的父亲是个退役的骑兵军官，而母亲则是帝国公务员，这样奇妙的家庭组合很难说没有对茹科娃的成长带来影响——她日后确实成为了一个既能妥善处理军务，又能同时管好政务的英才。\n\n在她十三岁时，父亲突然病逝，母亲因而特别注意管教她，毕竟她是家里的独女。茹科娃在1069-1072年间就读于一所教会学校，那里严格的宗教训练导致她日后极为痛恨宗教人士。到了1073年，茹科娃再也受不了母亲的管束，出逃圣骏堡，还偷了家中一些现金。愤怒的母亲因此要求将她关进少年管教所，茹科娃于是就在管教所里被关押了一年多。重获自由之后，茹科娃已经和母亲疏远，虽然她确实对自己的做法怀有歉意，但她也不愿再见母亲。\n\n自由的茹科娃在圣骏堡半工半读，自食其力地完成了法律学校的课程，并且成为一名经常帮助穷人的律师。但是在一次和信教贵族的法律冲突中，茹科娃当庭羞辱对方，甚至差点大打出手，结果被吊销律师资格证。\n\n茹科娃一不做二不休，干脆以此为契机，投身民主革命派，成为了职业革命家。她处理事务的出色能力使得她很得革命派元老们欣赏。在那次失败的起义中，茹科娃也表现得很有党性——她成功掩护许多同志撤离，自己被捕后面对酷刑也守口如瓶……当然，其他同志出卖了情报，使得她的坚持失去了意义。\n\n被流放到科雷马边疆区后，茹科娃已经算是革命民主派的新锐领导者，一是因为许多重要人物在此前的失败中损失掉了，二则是因为她确实赢得了所有同志的认可。§!"
 UFE_UFE_liberalism_second_early_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_leader\n\n\n\n\n\n\n\n\n§L切尔尼雪夫斯出生在帝国中部的一个信教家庭，幼时一度深受拉特兰教影响，因此对神秘学和哲学深感兴趣。在他考入圣骏堡大学文学系后，更是对莱塔尼亚的唯心主义哲学推崇备至，以至于花费了大量心血去研究莱塔尼亚观念论。然而在他二十岁出头时，他机缘巧合地接触到了圣骏堡大学内的“彼特拉舍夫斯基小组”，该小组成员都是激进的民主主义者，并且经常谈论空想社会主义和感性唯物主义哲学。深受该小组影响的切尔尼雪夫斯基最终转向了唯物主义，并且彻底抛弃了自己的宗教信仰，为此他甚至与自己的父母宗亲彻底决裂。\n\n站到民主派一边的切尔尼雪夫斯基开始阅读高卢共和运动期间的高卢政治著作，在完成学业后，他也放弃了在帝都的高薪工作，而是回到故乡，在一所中学中担任语文老师。然而，甘心忍受匮乏不意味着他不关心政治大事，在此期间他参与了多部民主派杂志的创办，还曾秘密前往维多利亚会见当时被驱逐出境的亚历山大·赫尔岑。也正是在维多利亚，切尔尼雪夫斯基正式加入到了革命民主派的革命团队中。\n\n回国之后，切尔尼雪夫斯基作为革命派的骨干，在帝国中部进行革命组织工作，他试图在大学和军校中发展进步青年加入组织，以求未来发动革命推翻帝国。\n\n不幸的是，在民主派发动第一次革命行动的前夜，叛徒出卖了他们。切尔尼雪夫斯基被监禁，随后被判处侮辱性质强烈的“假死刑”，然后流放科雷马。革命民主派的其他人物也多被流放此地，但是还是有近半数的革命者惨遭杀害。\n\n切尔尼雪夫斯基没有被流放吓倒，他牢牢记住了革命同志被杀害的血海深仇，哪怕身处冰天雪地的科雷马，他也立志要把革命之火烧回帝国。§!"
 UFE_liberalism_second_in_command_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_second_in_command\n\n\n\n\n\n\n\n\n§L亚历山大·赫尔岑出生在历史悠久且地位显赫的帝国官僚贵族家庭中，是雅克夫列夫家族的私生子，虽然不能继承父亲的姓，但他却获得了父亲独特的偏爱——他的姓氏“赫尔岑”就是父亲起的，来自莱塔尼亚语单词“Herz”，意思是“心”。赫尔岑的父亲给予了他良好的教育，在就读大学时，赫尔岑和朋友一起加入了研究共和政体政治和空想社会主义思想的学术小组，一个革命民主主义者的轮廓开始在他身上显现出来。\n\n完成学业后的赫尔岑因屡次出版煽动性刊物而遭到帝国警察逮捕，后来在父亲的帮助下免于牢狱之灾，改判流放六年。在流放岁月里，他看遍了帝国边远地区贫苦人民的悲惨生活和封建官僚的腐败无能，更加坚定了革命的信念。流放结束后他回到圣骏堡，再次开始宣传革命思想，这次他又因为出版“危害乌萨斯社会的自由思想著作”而被驱逐出境，于是不得不拖家带口流亡维多利亚。\n\n身居海外并不能阻止赫尔岑煽动革命的努力，他在维多利亚、哥伦比亚和莱塔尼亚联络其他流亡思想家，大量印刷革命刊物并秘密运回乌萨斯，还和乌萨斯本土革命组织建立了联系。\n\n数年后，革命民主派组织决定在帝国中部发动起义，由于事关重大，赫尔岑秘密回到乌萨斯，他得到了维多利亚大使馆的“承诺保护”，打算亲自指挥。然而，叛徒破坏了起义，大多数革命者因而被捕，维多利亚方面本就不愿与乌萨斯直接对抗，见状也违背承诺，拒绝协助赫尔岑出国，于是他也遭到监禁。\n\n赫尔岑一开始被判死刑，但由于他还有着莱塔尼亚崔林特尔梅大学和维多利亚伦蒂尼姆大学荣誉教授的身份，因此莱维激烈抗议乌萨斯的判决，最终使赫尔岑改判为流放科雷马。§!"
 UFE_authoritarianism_second_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_authoritarianism_leader\n\n\n\n\n\n\n\n\n§L约瑟夫·卡列维奇是骏鹰与乌萨斯混血的远东土著人，他的家庭一贫如洗，而且相当不和睦。和大多数远东穷孩子一样，卡列维奇很早就离家出走，外出干活谋生了。他在奇廷卡斯克当过猎人、搬运工、小贩和厨子，后来格伦沃夫在当地招兵买马，卡列维奇就因此从了军。令人意外的是，卡列维奇有相当出色的学习能力，他在当小贩的时候就擅长算账，当兵后更是只靠自己便学会了读写。格伦沃夫看他聪明，就让他去管远东的集中营。然而这并不是一个很好的决定，因为卡列维奇很快就和集中营里的民主派流放犯产生了接触。卡列维奇受到了这些政治犯的影响，其思想日益转向进步的一方，而且他的出身也决定了，他会更同情那些被乌萨斯帝国压榨的原住民，而不是愚忠于格伦沃夫这个皮草商。当然，卡列维奇天生的聪颖和精明使他行事谨小慎微，他总是能站好队，并且巧妙地伪装自己的面貌——格伦沃夫直到近两年才开始怀疑卡列维奇是否可靠，因为最近的原住民暴动实在太多，而卡列维奇一直对镇压行动持消极态度。格伦沃夫的怀疑显然是对的，只不过为时已晚。§!"
 UFE_authoritarianism_second_two_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_authoritarianism_leader\n\n\n\n\n\n\n\n\n§L作为底层出身的军人，卡列维奇对劳苦群众的苦难感同身受，他同情民主革命者、支持共产党活动、蔑视乌萨斯帝国和贵族群体。同时他作为骏鹰族与乌萨斯族混血的后代，祖祖辈辈生活在遥远的边疆，几乎没有受到过乌萨斯帝国的“文明熏陶”，这反而使他免受许多腐朽思想的荼毒。在他主动进入高等学府进修以弥补知识短板后，那些新鲜而富有生命力的进步思想更是如“在白纸上勾勒任意的图画”般深深刻进了他的灵魂。\n\n回归政坛的卡列维奇不仅享有很高的政治威望，还在军队中颇有影响力，这一点是其他革命民主派政治家所不能企及的。在非常时期，“卡列维奇”这个名字就意味着军队的忠诚——没有任何一个军人愿意背叛“卡列维奇老将军”。§!"
 UFE_field_marshal_second_in_command_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_field_marshal_1\n\n\n\n\n\n\n\n\n§L谢尔盖·彼得罗维奇·特鲁别茨科伊是乌萨斯帝国的贵族亲王，他的父亲是四国战争的英雄，但也因参与对高卢作战而深受高卢革命思想的影响，于是特鲁别茨克伊自幼就产生了对进步派的同情。\n\n在特鲁别茨克伊步入成年后，也经常和军校里的进步青年军官保持联系，所以许多立宪派乃至革命派政治家都认为这位亲王是可以争取的对象。正因如此，当赫尔岑和切尔尼雪夫斯基试图在乌萨斯帝国中部组织革命时，革命民主派立即联络了当时担任中将的特鲁别茨克伊，希望他能带领部队响应起义。\n\n虽然特鲁别茨克伊是一个相对温和的君主立宪派，但是他理想化地认为暴力革命的发生有助于迫使皇帝陛下接受改革，于是便草草同意加入起义。然而就在革命的前夜，特鲁别茨克伊却突然拒绝露面，他认为起义时机并不成熟，因此不敢出面领导军队。与此同时，起义的消息也被叛徒转告给了帝国政府，秘密警察迅速逮捕了所有涉事者，当然也包括特鲁别茨克伊。\n\n特鲁别茨克伊由于拥有亲王身份，因此并没有遭受拷打，关押地点也不在监狱，而是在皇帝的度假别墅里。不过他最后还是被剥夺贵族身份、判处流放科雷马边疆区，和革命民主派政治家们殊途同归。\n\n然而奇怪的是，大部分革命者的家属也受到了牵连，被没收财产或软禁在家，可特鲁别茨克伊的子女和妻子却得到了帝国政府的优待，因此不少人猜测他就是出卖起义的叛徒，但特鲁别茨克伊总是反驳称这只是政府照顾他的“前亲王”身份罢了。不过无论特鲁别茨克伊说些什么，在革命派眼里，他的灵魂已经被打上了保守怯懦、摇摆不定的烙印。§!"
 UFE_field_marshal_2_idea_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_field_marshal_2\n\n\n\n\n\n\n\n\n§L帕维尔·比斯捷里是一位平民出身的前帝国军官，因为积极组织军中的青年革命组织而遭到帝国政府迫害。他被关入监狱后，又于狱中组织地下学习小组，在政治犯人中间讨论民主革命和空想社会主义。1089年冬，他在组织退伍军人进行示威时再次被捕，并被流放到科雷马边疆区。来到科雷马的比斯捷里继续暗地里从事革命活动，并最终逃出集中营，寄宿在了当地一座教堂里。§!"
 UFE_liberalism_advisor_1_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_1\n\n\n\n\n\n\n\n\n§L维萨里昂·比林斯基是乌萨斯圣骏堡大学的哲学教授和文学教授，但在自然科学领域也有不错的造诣。他在乌萨斯学术圈子的名气很大，当初他因为支持革命派而要被流放科雷马时，大学里超过半数的教授都为他求情。\n\n这种明星般的名气使得他很容易把学术人才组织到一起，也非常擅长和工业科研领域的才干之士打交道。§!"
 UFE_liberalism_advisor_2_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_2\n\n\n\n\n\n\n\n\n§L彼得·恰达耶夫是乌萨斯境内远近闻名的温和派思想家，曾因力主实行君主立宪改革而被帝国政府监禁，后来他也在一定程度上支持革命派的行动，并最终因为参与赫尔岑和切尔尼雪夫斯基的起义而被流放边疆。在经历了帝国顽固的反对和镇压后，恰达耶夫终于从立宪派变成了革命派，只不过在革命派里他也是最保守的人。§!"
 UFE_liberalism_advisor_3_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_3\n\n\n\n\n\n\n\n\n§L尼基塔·穆拉维约夫是一位狂热的邦联主义共和派，他希望能将高度封建集权的乌萨斯帝国彻底拆分成大大小小的共和邦，各个邦再组成松散的邦联以实现共同自卫。他是一个热衷于兜售观点而缺少耕耘耐心的人——他从不参与组织建设工作，而是喜欢拜访权贵，求他们支持自己，他之前甚至想劝说科雷马边疆区的格伦沃夫总督接受他的邦联主义思想。§!"
 UFE_liberalism_advisor_4_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_4\n\n\n\n\n\n\n\n\n§L伏尔庚·列维茨基绝对是革命民主主义者中经历最为戏剧化的那个，他曾是乌萨斯帝国的秘密警察，被派到切尔尼雪夫斯基身边监视他。然而在切尔尼雪夫斯基朴素的生活作风和强大的人格魅力面前，伏尔庚被深深折服，他是个爱国主义者，深切地希望乌萨斯祖国能够走向富强，在与切尔尼雪夫斯基多次长谈和一同走访各地后，他开始意识到共和制度是唯一一种能拯救乌萨斯民族的道路。在这之后他向切尔尼雪夫斯基坦白了自己的间谍身份，并在获得原谅后成为了革命民主派组织的情报委员会领导者。§!"
 UFE_liberalism_advisor_5_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_5\n\n\n\n\n\n\n\n\n§L孔德拉季·雷利耶夫是一位学识渊博、擅长雄辩术的文学家，不过他的诗集大多已因“宣传危害社会和皇帝的思想”被帝国政府查禁。\n\n雷利耶夫的小说、议论、诗歌还有报告文学都具备很强的感染力和煽动性，关键是还通俗易懂。切尔尼雪夫斯基甚至夸赞他道：“只要朗诵一首雷利耶夫先生的诗，连谷仓里的老农都会热血沸腾，站出来为革命慷慨赴死。”……不过这话真的是纯粹的夸赞吗？§!"
 UFE_liberalism_advisor_6_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_6\n\n\n\n\n\n\n\n\n§L塔季扬娜·耶里钦娜生在一个工程师家庭，后来出国留学，在哥伦比亚待过数年。回国之后，耶里钦娜强烈地反对乌萨斯帝国的封建帝制，希望乌萨斯能像哥伦比亚那样实行自由主义政策，然后再建立有民主选举的共和制度。这些激进的主张使得她像本土的革命民主派一样，被流放到了远东的冰天雪地，但是很显然，她和本土的革命者在思想上有本质性的不同。§!"
 UFE_liberalism_advisor_7_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_7\n\n\n\n\n\n\n\n\n§L弗拉基米拉·普汀娜是格伦沃夫总督提拔的奇廷卡斯克执政官，她出生在圣骏堡，曾经考上过帝国警察学院，但是在担任警察后没多久，就因为贪污和虐待囚犯的问题而被开除——不过似乎是上司把罪行推给了她。失业后的普汀娜又因为参加街头流氓组织抢劫富人而被捕，最后被流放到贝加尔延达谢斯克。但是她在那里又跑到一个地主家中行窃，最后又被驱逐到了科雷马边疆区。时任科雷马总督格伦沃夫在她身上发现了杀伐果决、精明胆大的优点，干脆将她拉入亲兵部队培养，最后让她混成了奇廷卡斯克的执政官。§!"
 UFE_liberalism_advisor_8_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_8\n\n\n\n\n\n\n\n\n§L米哈伊尔·斯佩兰斯基曾是皇帝宫中的法学家，在帝国早期改革过程中大量出力献策。然而在乌萨斯这样保守而野蛮的地方，“改革家”从来都是高危职业，斯佩兰斯基很快因为得罪了一名亲王而惨遭流放。在他抵达新阿列克谢耶夫斯克后，又有贵族造谣说斯佩兰斯基曾经骚扰他的女儿，于是皇帝大怒，转而让他“滚去奇廷卡斯克”。于是这位学识渊博而头脑精明的法学家，就像条街边死狗一样被随意地踢到了乌萨斯帝国最藏污纳垢的“墙角”。§!"
 UFE_liberalism_advisor_9_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_9\n\n\n\n\n\n\n\n\n§L阿纳托利·佩里耶夫绝对是远东原住民中的异类——他金发碧眼、相貌英俊，完全不像其他原住民那样长得粗俗臃肿。或许是在生他时耗掉了所有的福气，佩里耶夫的母亲早早就生病死去了。为了自谋生路，佩里耶夫年纪轻轻就参加了乌萨斯陆军。然而他的原住民身份使他在军中饱受欺凌，而且他还经常目睹乌萨斯军队对本地人的暴行。\n\n佩里耶夫没有能力阻止自己的战友作威作福，而乡亲们也因此把他当成是乌萨斯人的帮凶，这样“里外不是人”的处境将他逼入了崩溃的边缘。终于，在一个下着暴雪的夜晚，佩里耶夫下定了报复的决心，他用自己的步枪杀掉了战友和长官，从此落草为寇。\n\n为了向同胞们证明自己的清白，他在接下来的数年里绑架和抢劫乌萨斯贵族、谋杀帝国军官和行政官，而夺得的金钱几乎全被他送给了贫民。许多原住民仰慕他的作为，纷纷赶来投奔，而佩里耶夫也正是在这个过程中发现了自己打游击和鼓舞人心的天分。他和他的队伍神出鬼没，像幽灵一样潜伏在远东的雪境中，令乌萨斯帝国的走狗们闻风丧胆。§!"
 UFE_liberalism_advisor_10_desc:0 "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_advisor_10\n\n\n\n\n\n\n\n\n§L作为奇廷卡斯克最大皮草商人维塔利·博科夫的独女，埃琳娜·博科娃从父亲那里继承了整个皮草公司和生产销售方面的人脉。她为人处世八面玲珑，既没招致格伦沃夫反感，也尽量照顾了当地原住民的生活。据说她还经常资助卡列维奇，每逢重要的日子就会给他送去礼品和礼金——当然也得给格伦沃夫送。\n\n许多人因而怀疑她是不是有某种政治上的野心，不过埃琳娜·博科娃真的只打算当一辈子皮草商人。她对任何无关于皮草生意的事情都不感兴趣，而她之所以和政界关系密切，不过是因为远东畸形的经济过于依赖皮草产业，而她又家大业大，不得不谨小慎微罢了。§!"
 UFE_liberalism_theorist_1_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_theorist_1\n\n\n\n\n\n\n\n\n§L阿里克谢·霍米亚科夫是奇廷卡斯克地区的一名主教，他早年自学成才，在一边当木工一边学习的情况下考进了奇廷卡斯克大学的神学系。不过由于他出身并非科班，使得他在宗教哲学上走了野路子，继而被同学和同事排挤。\n\n心怀愤懑的他干脆在学成后离开了奇廷卡斯克，回到自己的家乡，投身于乡村教育事业。§!"
 UFE_liberalism_theorist_2_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_liberalism_theorist_2\n\n\n\n\n\n\n\n\n§L季莫菲·葛拉诺夫斯基是奇廷卡斯克大学最为杰出的教授，他素来与比林斯基等人交好，在后者被流放到科雷马边疆区后，他也对其提供了专门的照顾，帮助对方在学校中谋取了职位。许多人都十分困惑，为什么这样一位能在帝国心脏地带的学府中排名中上的学者，非要跑到奇廷卡斯克这偏僻之地呢？\n\n其实原因简单到出人意料：季莫菲·葛拉诺夫斯基是自幼跟随自己的商人父亲来到奇廷卡斯克的，而他不善交际，害怕去到任何人生地不熟的地方，因此一直不愿意离开科雷马边疆区……就这么简单。§!"
 UFE_field_marshal_3_idea_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_field_marshal_3\n\n\n\n\n\n\n\n\n§L伊万·阿波斯托尔是一位非常老派和固执的军人，他资历很老，但军事实力并不出众，似乎经常在参谋部推演中吃败仗。然而这样一个看起来人畜无害、一板一眼的普通将军，竟参与到了革命民主派的密谋中。\n\n在伊万·阿波斯托尔与其他革命派成员一同被捕后，他的同事们都难以置信——这家伙居然想要造反？人们猜测这大概与阿波斯托尔贫苦的家庭出身有关系，也有人认为他是受到了那些革命派年轻下属的感召……§!"
 UFE_corps_commander_1_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_corps_commander_1\n\n\n\n\n\n\n\n\n§L佩特拉·卡霍夫斯卡娅出生在乌萨斯帝国中部的农村，她自幼就很聪明，但家里没钱供她读书，于是她早早就去村子附近的伊万诺夫伯爵庄园里当女佣人了。\n\n在一次清扫伯爵长子书房的时候，卡霍夫斯卡娅忙里偷闲，抓了一本《乌卡战争纪录》在手里偷看，谁知道被前来视察的伯爵撞了个正着。\n\n伯爵惊得一时半会儿说不出话来，因为一个识字而且还对战争书籍感兴趣的女佣实在是太过罕见。换做一般的保守贵族，他们大多会在最初的惊讶后意识到女仆读书是一件多么伤风败俗的事情，继而把卡霍夫斯卡娅扫地出门，但伊万诺夫伯爵是个非常开明的知识分子，他当即询问卡霍夫斯卡娅是否愿意去大城市读书。在得到肯定的答复后，伯爵便把她介绍给了自己在城市里任中学教师的晚辈。\n\n于是，卡霍夫斯卡娅移居城市，住在人家空置的杂物间里，白天出去打工，傍晚去老师家里上课。卡霍夫斯卡娅在学习中展现出了非常不错的算术天赋，在完成学业后，她决定去军队的后勤管理部门求职，成了一个记账算数的后勤小兵，而她的上司正是大名鼎鼎的“老顽固”伊万·阿波斯托尔。\n\n由于阿波斯托尔的暗中影响，卡霍夫斯卡娅也卷入了革命派的行动，最终遭到帝国政府流放。在流放的半途中，卡霍夫斯卡娅正式加入革命民主派的组织，革命派干部们看重她的计算和规划才能，打算在合适的时机给予她指挥少量部队权力。§!"
 UFE_corps_commander_2_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_corps_commander_2\n\n\n\n\n\n\n\n\n§L瓦西里·伊凡绍夫是约瑟夫·卡列维奇的好朋友，早在卡列维奇当小贩的时候二人就认识了——伊凡绍夫那会儿是个小警察，经常奉命前来驱逐小贩。\n\n二人不打不相识，在双双参军后也互帮互助。伊凡绍夫正是在卡列维奇的帮助下才获得了施展自己战斗天赋的机会——他是个极为敏锐和勇敢的轻步兵指挥官，就是性格过于张狂，要是没卡列维奇帮他，他肯定得不到提拔的机会……§!"
 UFE_corps_commander_3_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_corps_commander_3\n\n\n\n\n\n\n\n\n§L格里高利·比斯特尔出生在圣骏堡的一个军事贵族家庭中，自幼便接受军事传统的熏陶，对炮兵有着特别浓厚的兴趣。他的算术成绩和物理成绩也一直不错，家里人非常支持他进入军校专门学习炮兵理论。\n\n或许是祖父参与四国战争时的见闻在比斯特尔心里埋下了向往进步的种子，他刚进入军校就参加了校内的“宪法与革新俱乐部”。这是一个由立宪主义进步学生组建的神秘社团，比斯特尔很喜欢那里的氛围。\n\n不过，好景不长，随着帝国政策的变化，社团内部出现了分歧，一些人开始转而宣传革命派的主张，比斯特尔也因此接触到了比立宪派还要神秘的乌萨斯革命民主派。他从一开始的旁听演讲，到后来的帮对方传递资料，再到跟随对方退出立宪社团，最后甚至开始帮革命者盗取情报。\n\n比斯特尔最后也和大多数革命民主派人士一样，在那次失败的起义后被流放到了科雷马边疆区。卡列维奇看上了他的军事能力，破格将他放出集中营，让他指挥一个炮兵营保护奇廷卡斯克……卡列维奇似乎很同情这些被流放过来的革命分子。§!"
 UFE_corps_commander_4_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_corps_commander_4\n\n\n\n\n\n\n\n\n§L菲利普·米罗诺夫是约瑟夫·卡列维奇的部下，出身于工匠家庭，特别擅长维修和改造机械载具。他在指挥装甲车辆作战上也颇有天资，可惜科雷马边疆区没有什么像样的机械化部队和装甲部队，菲利普·米罗诺夫几乎找不到机会施展自己的才华。§!"
 UFE_corps_commander_5_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_corps_commander_5\n\n\n\n\n\n\n\n\n§L谢尔盖·穆拉维约夫是少数几个逃离了帝国政府追捕的革命民主派，他原是帝国军队中的普通军官，负责招募训练新兵，但革命的烈火使他踏上了不同寻常的道路。\n\n在逃脱帝国秘密警察的追捕后，穆拉维约夫隐姓埋名，换了许多个身份，最终追随那些被流放的同志们一同来到了科雷马。他伪造了自己退伍军官的身份，从而在总督府那里谋得一官半职。就这样，他与自己的革命同志重新建立了联系。§!"
 UFE_air_chief_1_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_air_chief_1\n\n\n\n\n\n\n\n\n§L自从乌东战争结束后，乌萨斯帝国便在科雷马地区加强了军事防御，直到无休止的叛乱破坏了帝国中央政府对当地的控制力。\n\n米哈伊·索科洛夫斯基便是一名原本被帝国任命到当地就职的防空部队指挥官。在帝国对当地的控制崩溃后，领不到薪水的索科洛夫斯基只能求助于格伦沃夫和卡列维奇。\n\n卡列维奇看中了索科洛夫斯基对各类飞行器参数和结构的熟悉——作为防空部队指挥官，只有熟悉这些知识，才知道需要运用何种武器、以什么样的方式、去击落何种飞行器——于是卡列维奇把他任命为奇廷卡斯克防空炮营的营长，还允许他指挥只有一架老式教练机的科雷马空军部队。§!"
 UFE_navy_chief_1_desc: "人物肖像：\n\n\n\n\n\n\n\n£portrait_UFE_navy_chief_1\n\n\n\n\n\n\n\n\n§L在乌东战争之前，乌萨斯帝国一直有夺取东部出海口的计划，帝国政府希望碾碎整个东国的北部，把国土一路延伸到泰拉大陆的东海岸。\n\n米舍夫·格拉祖诺夫便是这种野心的牺牲品，他早年被军方安排前去哥伦比亚和维多利亚接受海军陆战队培训，系统学习如何组建海军步兵部队。但是乌萨斯帝国建成自己第一支海军步兵部队的计划在乌东战争失败后泡汤了。米舍夫·格拉祖诺夫遭受上级冷落，又被祖国的失败刺痛——他发现自己的国家已经烂到了骨子里，居然连东国这样的蕞尔小邦都无法战胜。\n\n当帝国的海军计划停摆后，格拉祖诺夫只能无所事事。整日赋闲的他很快就在啤酒馆和沙龙里接触到了立宪和革命的思想。就像是干草垛撞上了火星子，格拉祖诺夫一跃进入了革命的时代洪流。\n\n不过极为滑稽的是，当他被帝国秘密警察抓捕后，竟然被流放到了当年他本来要去的乌萨斯远东——按照原先的扩展计划，帝国正是要在远东海岸建立海军基地和海军陆战队训练地。格拉祖诺夫深以为这正是命运之神对他的暗示，暗示他走对了路。§!"
 
