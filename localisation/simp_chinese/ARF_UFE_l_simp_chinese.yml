 UFE_TePaiYuan_tt:0 "决议§Y革命形势§!不再导致£in_combat §Y军队控制度§!变化。"
 UFE_ShouCiDaXuan_tt:0 "\n决议§Y革命形势§!不再导致£pol_violence §Y社会矛盾张力§!变化，且其时长延长到§Y45§!天，但每次会使£in_combat §Y军队控制度§!§R-5%§!。\n如果我们没有在§G365§!天内完成§Y扩大特务机关§!国策，过于软弱的政府就将难以驾驭越发专横的£in_combat §Y军队§!。"
 UFE_KongBuZhengCe_tt:0 "决议§Y革命形势§!不再导致£pol_violence §Y社会矛盾张力§!变化，但每次会使£in_combat §Y军队控制度§!§G+5%§!。\n如果我们没有在§G365§!天内完成§Y结束恐怖政策§!国策，持续过长的恐怖政策就会重新激起£pol_violence §Y社会动乱§!。"
 UFE_special_events_16_tt:0 "决议§Y革命形势§!将重新导致£pol_violence §Y社会矛盾张力§!变化，每次§G+5%§!。"
 UFE_special_events_17_tt:0 "£in_combat 军队控制度：§R-10%§!"
