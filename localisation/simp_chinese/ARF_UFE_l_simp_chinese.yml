 UFE_picao_trade_decisions_category:0 "远东皮草贸易"
 UFE_picao_trade_decisions_category_desc:0 "远东有着寒冷的气候、独特的生物种群、经验丰富的牧民与猎人，这些条件使当地人每年都能收获丰富而优质的皮草。在一代又一代皮草商人和走私团体的经营下，如今的远东皮草产业已经十分发达——乌萨斯本土超过一半的皮草都产自远东，甚至连遥远的泰拉中陆也有远东皮草的踪影。如果我们打算在气候恶劣、人烟稀少的远东地区发展经济、武装部队，就一定不能忽视皮草产业的巨大收益，这是我们唯一可以依靠的经济来源，如果不好好利用这笔资源，我们是不可能与其他乌萨斯东部军阀抗衡的。\n\n我们当前持有的£ufe_picao_var_texticon §Y皮草§!数量：[?UFE.picao_var|G0]"
