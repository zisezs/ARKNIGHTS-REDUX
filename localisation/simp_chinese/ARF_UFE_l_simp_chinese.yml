 #共和
 urs_republicanism_ready_tt:0 "§Y共和主义§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_republicanism_propagating_tt:0 "§Y共和主义§!\n\n所有§Y反动敌对国家§!对我国进攻修正: §G-10.0%§!\n所有§Y反动敌对国家§!对我国防御修正: §G-10.0%§!"
 urs_republicanism_cd_tt:0 "§Y共和主义§!\n\n§R冷却中：§![?urs_propagating_republicanism_CD_flag:days|Y0]/45 天"
 constitution_spirit_1_delayed_text:0 "§L共和主义强调人民是国家的主人，反对君主制。共和主义反对封建专制的观念对人民有巨大的启发作用，这可以让我们在和蒙昧的敌人作战时占据精神优势。§!"
 feudal_monarchism_religiosity_feudal_aristocratic_autocratic_centralism_tt:0 "\n§Y下列意识形态的政权可被视为反动国家：§!\n§g威权主义、保守主义、专制主义、法西斯主义、神秘主义。§!"
 any_enemy_country_is_feudal_country_tt:0 "任一敌国：被认为是§Y反动国家§!"
 constitution_spirit_1_text:0 "[GetUrsConSpr1Tooltip]"
 #法治
 urs_legalism_ready_tt:0 "§Y法治精神§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_legalism_propagating_tt:0 "§Y法治精神§!\n\n稳定度: §G+5.00%§!\n生活消费品工厂: §Y-2.0%§!\n每周战争支持度: §G+0.30%§!"
 urs_legalism_cd_tt:0 "§Y法治精神§!\n\n§R冷却中：§![?urs_propagating_legalism_CD_flag:days|Y0]/45 天"
 constitution_spirit_2_text:0 "[GetUrsConSpr2Tooltip]"
 constitution_spirit_2_delayed_text:0 "§L法治精神要求乌萨斯政府依照法律体系治国，并且充分发挥法律的效力。现代化的法律系统将能够一改旧帝国以来乌萨斯的社会风貌，从而广泛赢得国民的支持。§!"
 #革命
 urs_revolutionism_ready_tt:0 "§Y革命热情§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_revolutionism_propagating_tt:0 "§Y革命热情§!\n\n单位攻击: §G+5.0%§!\n移动中组织度损失: §G-10.0%§!\n抵抗目标: §G-10%§!\n驻军所受伤害: §G-15.00%§!"
 urs_revolutionism_cd_tt:0 "§Y革命热情§!\n\n§R冷却中：§![?urs_propagating_revolutionism_CD_flag:days|Y0]/45 天"
 constitution_spirit_3_text:0 "[GetUrsConSpr3Tooltip]"
 constitution_spirit_3_delayed_text:0 "§L新乌萨斯必须建立在乌萨斯大革命的胜利之上，我们将怀揣革命精神，打倒反动派，并且阻止旧帝国的拥护者复辟腐朽的皇冠。革命带给我们每个人的不仅有新的生活，更包括一种攻坚克难的战斗热情。§!"
 #爱国
 urs_patriotism_ready_tt:0 "§Y爱国主义§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_patriotism_propagating_tt:0 "§Y爱国主义§!\n\n核心领土单位单位攻击和防御: §G+5.0%§!\n单位强度: §G+10.0%§!\n陆军损耗: §G-10.0%§!\n训练时间: §G-10.0%§!"
 urs_patriotism_cd_tt:0 "§Y爱国主义§!\n\n§R冷却中：§![?urs_propagating_patriotism_CD_flag:days|Y0]/45 天"
 constitution_spirit_4_text:0 "[GetUrsConSpr4Tooltip]"
 constitution_spirit_4_delayed_text:0 "§L乌萨斯人向来有着热爱祖国母亲的文化，这种传统经过百年的积淀，已成为我们的灵魂符号。在一个消灭了旧帝国糟粕的新乌萨斯，我们的爱国精神也要发挥全新的价值——即保卫现代化祖国的热情。§!"
 #平等
 urs_egalitarianism_ready_tt:0 "§Y平等观念§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_egalitarianism_propagating_tt:0 "§Y平等观念§!\n\n对主要国家的防御力: §G+5.0%§!\n对主要国家的突破: §G+5.0%§!\n工厂和海军船坞产出: §G+5.00%§!\n非核心人口: §G+5.00%§!"
 urs_egalitarianism_cd_tt:0 "§Y平等观念§!\n\n§R冷却中：§![?urs_propagating_egalitarianism_CD_flag:days|Y0]/45 天"
 constitution_spirit_5_text:0 "[GetUrsConSpr5Tooltip]"
 constitution_spirit_5_delayed_text:0 "§L革命将人人平等的理念送到了冰封的乌萨斯雪原，虽然这样一种观念还很难真正深入每个乌萨斯人的内心，但是只要加以时日，我们早晚能够改造国民的思想，完成伟大的壮举。§!"
 #人权
 urs_individualism_ready_tt:0 "§Y天赋人权§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_individualism_propagating_tt:0 "§Y天赋人权§!\n\n适役人口: §Y-0.50%§!\n有经验士兵的损失: §G-25.0%§!\n陆军经验增长: §G+0.25§! 每日"
 urs_individualism_cd_tt:0 "§Y天赋人权§!\n\n§R冷却中：§![?urs_propagating_individualism_CD_flag:days|Y0]/45 天"
 constitution_spirit_6_text:0 "[GetUrsConSpr6Tooltip]"
 constitution_spirit_6_delayed_text:0 "§L天赋人权是共和制的精髓，我们认为每个人生来就有为人的权利，任何人都不能够剥夺。当然，这种思潮在传播中也可能因被利用和曲解而造成弊端，但总体来说，它对人的启蒙作用是极为巨大的。§!"
 #自由
 urs_liberalism_ready_tt:0 "§Y自由主义§!\n\n准备完毕，通过决议点选以激活其效果"
 urs_liberalism_propagating_tt:0 "§Y自由主义§!\n\n贸易关系修正: §Y+20%§!\n工厂和海军船坞产出: §G+5.00%§!\n建造速度: §G+5.00%§!"
 urs_liberalism_cd_tt:0 "§Y自由主义§!\n\n§R冷却中：§![?urs_propagating_liberalism_CD_flag:days|Y0]/45 天"
 constitution_spirit_7_text:0 "[GetUrsConSpr7Tooltip]"
 constitution_spirit_7_delayed_text:0 "§L自由主义强调贸易自由与低关税，不过我国作为一个商贸和制造业相对落后于外国的国家，贸然执行贸易自由政策可能会对国内市场造成冲击。然而，从另一面看，也许这种冲击也不是坏事，这反而能促进我国市场和工业的成熟。§!"
 #额外宣传项目
 #左线
 urs_propagating_extra_1:0 "鼓励群众支援前线"
 urs_propagating_extra_1_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n我们在工业产能上落后于敌人，这导致了我们军队缺少输送补给的载具，但是我们拥有人民衷心的爱戴！只要发出支援前线的号召，无数民工就将奔赴战场，将宝贵的粮食和衣物送到革命战士们的手上！"
 urs_propagating_extra_2:0 "发动人民纠察间谍"
 urs_propagating_extra_2_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n敌人的探子和眼线渗透到了全国各地，仅凭我们政府的人手是无法监视和阻止他们的。不过，如果我们广泛动员人民，让他们打起精神，时刻关注身边的可疑分子，那就能极大地打击外国间谍。"
 urs_propagating_extra_3:0 "人民战争不可战胜"
 urs_propagating_extra_3_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n我们政府的政策在国内外都得到了广泛认可，全世界的劳动人民都对我们的斗争表示同情。我们理把这种同情转化为优势：主动激发敌国广大人民的反战义愤，在敌人的后花园里给他们一记意想不到的重拳！"
 urs_propagating_extra_4:0 "全面发展基础教育"
 urs_propagating_extra_4_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n知识从来不是贵族和富人们垄断的资本，而是广大劳动者改造世界的趁手工具。但千百年来的愚昧导致普通群众普遍缺乏科学知识，我们必须要全力推动基础教育发展，才能广泛启迪民智、提高人民素质。"
 every_enemy_country_army_desertions_tt:0 "所有与我国交战的国家：其部队失去§Y5%§!的§Y装备§!、§Y人力§!和§Y组织度§!，无视距离和方位。\n"
 #右线
 urs_propagating_extra_5:0 "弘扬个人英雄主义"
 urs_propagating_extra_5_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n伟大的人物从不会屈服于威权，他们敢于反抗一切，敢于为民主而献身。任何世俗的条条框框都限制不住他们，甚至反而要被他们打破，他们将把文明的火种传承下去，并且还要将其播撒到世界各地。"
 urs_propagating_extra_6:0 "科研去意识形态化"
 urs_propagating_extra_6_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n过去的革命历程中，我们对知识分子过于残酷，甚至居然把自然科学领域纳入到意识形态管辖范围中，连科学理论都要分革命的和反革命的，这样的做法简直是荒唐。幸运的是，我们总算拨乱反正了。"
 urs_propagating_extra_7:0 "要传颂企业家精神"
 urs_propagating_extra_7_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n企业家也是革命者，与革命斗士在战场上冲锋陷阵不同，企业家们在市场上披荆斩棘，为祖国的经济繁荣立下了汗马功劳。没有他们的全力以赴，我们的经济不可能发展得如此之快！全社会都应学习他们。"
 urs_propagating_extra_8:0 "社会分化与原子化"
 urs_propagating_extra_8_desc:0 "\n§Y额外宣传项目§!§W不会引发特殊动画效果，并且将持续更长时间，带来的增幅效果也会更加强大，但是事后也需要长得多的时间恢复，方能使用下一次。§!\n\n革命激进化的教训之一就是，一个过于“板结”的社会很容易被乌合之众的洪流裹挟，我们应该鼓励个人主义，瓦解人与人的连结，用少数族群概念分解社会。这样既保障了个人人权，又能避免暴力革命"
 urs_times_limit_of_propagating_text:0 "上限使用\n§Y[?UFE.ufe_times_using_of_propagating|0]§!/[?UFE.ufe_times_limit_of_propagating|0]"
 
 ##革命形势决议
