 UFE_army_control_decision_var_sub_tt:0 "£in_combat 军队控制度：§R-5%§!"
 UFE_stability_bar_modifier_tt:0 "当前£pol_violence §Y社会矛盾张力§!带来的修正效果：\n[GetSSModifier1][GetSSModifier2][GetSSModifier3]"
 UFE_stability_bar_modifier_desc_tooltip:0 "§L激烈的社会矛盾会冲击我国的经济和稳定，但是也会为群众的激进化创造条件。过于和谐的社会氛围容易造成保守派崛起并发动叛乱，并且要求我们提供更多消费品以供民众享受；而较高的社会矛盾水平容易导致工业生产受损，还会使民众对政府失去信任。§!\n\n§Y内战§!爆发时，敌军获取的国土面积与民兵师数量可受£pol_violence §Y社会矛盾张力§!的影响，最多占据我国§Y40%§!的国土。"
 UFE_army_control_modifier_desc_tooltip:0 "§L我们政府对军队的控制度太低时，容易引爆兵变，而且军队控制水平还会影响到内战爆发时现役部队在内战双方之间的分配比例。此外，一支骄傲自满、不听从中央指挥的军队也将是缺乏战斗力的，我们对军队的控制越严格，其战斗力越可靠。§!\n\n§Y内战§!爆发时，被敌军分走的军队比例可受£in_combat §Y军队控制度§!的影响，最多将§Y60%§!的军队分配到敌人一方。"
 UFE_army_control_bar_modifier_tt:0 "当前£in_combat §Y军队控制度§!带来的修正效果：\n[GetACModifier1][GetACModifier2][GetACModifier3]"
