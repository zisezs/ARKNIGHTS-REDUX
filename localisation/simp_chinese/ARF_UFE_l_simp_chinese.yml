 #####国策#####
 UFE_GeLunWoFu_de_MingYun:0 "格伦沃夫的命运"
 UFE_GeLunWoFu_de_MingYun_desc:0 "格伦沃夫已经在科雷马边疆区当了将近十年总督，但是他敲骨吸髓的政策已经搞得当地民怨沸腾。格伦沃夫并不在乎这些问题，他当初来到远东就是为了利用当地的皮草贸易发财，而他现在早已积累了足够的钱财和政治资本，只需要适时跑路、金盆洗手便万事大吉……但当地人真会放他跑吗？"
 UFE_ZuiHouYiTongJin:0 "最后一桶金"
 UFE_ZuiHouYiTongJin_desc:0 "虽然格伦沃夫已经下决心离开，但在这之前，他还想再捞最后一把。也许这种竭泽而渔的做法反而还能增加他被当地人刺杀的概率……毕竟，在此多事之秋还想着压榨民众，无异于火上浇油。"
 UFE_ChuLi_CaiZheng:0 "处理政府财政问题"
 UFE_ChuLi_CaiZheng_desc:0 "在卡列维奇取代格伦沃夫后，科雷马辖区政府的财政已经出现了严重的问题。乌萨斯帝国的经济本就不景气，许多科雷马居民都不愿意使用官方货币，而是直接进行物物交换，而格伦沃夫的残酷统治又让经济上的困境雪上加霜。"
 UFE_XinHuoBi:0 "发行新货币"
 UFE_XinHuoBi_desc:0 "我们掌握着边远苦寒之地的硬通货——皮草，这使得我们可以发行自己的货币以取代信誉低下的乌萨斯帝国官方货币。"
 UFE_YinDao_YuanZhuMin_CiSha:0 "引导原住民刺杀"
 UFE_YinDao_YuanZhuMin_CiSha_desc:0 "在科雷马地区生活的原住民大都以放牧为生，格伦沃夫压低皮草收购价格、放高利贷剥削牧民的做法已经激怒了原住民。长期积累的怨恨如今已经到达了最高点，此时只要对这些愤怒的原住民稍加鼓动和支持，他们就会站出来制裁格伦沃夫。"
 UFE_TongZhang:0 "适度增发"
 UFE_TongZhang_desc:0 "奇廷卡斯克是我国境内唯一的城市，也是我们的工业心脏、经济中心。这意味着大部分货币都会流向奇廷卡斯克，而农村就会陷入“钱荒”。我们必须在开展农村基层土改牧改工作的同时增发货币，以增加农牧民的储蓄，盘活农村的经济。"
 UFE_XinYong:0 "巩固信用"
 UFE_XinYong_desc:0 "在发行新币伊始，我们必须确保它的信用，以便让人民信任它。这意味着我们必须采用稳健、谨慎的货币政策。"
 UFE_NongCunXinDai:0 "农村信贷储蓄社"
 UFE_NongCunXinDai_desc:0 "农村信贷储蓄社是一种最为基层、最为亲民的金融机构。在农村地区和牧区，大型银行往往处于各项成本考虑而不能提供服务，农村信贷储蓄社就填补了这块空白。"
 UFE_KaLieWeiQi:0 "卡列维奇夺权"
 UFE_KaLieWeiQi_tt:0 "一旦§Y乌萨斯第二次大叛乱§!爆发，我们将§G解锁§!用于增强§Y动员能力§!和对敌§Y作战能力§!的§Y额外国策树§!。"
 UFE_KaLieWeiQi_desc:0 "亲近革命民主派的约瑟夫·卡列维奇已经接管了格伦沃夫留下的烂摊子。他拒绝协助格伦沃夫镇压民众和搜刮民脂的作风都被老百姓看在眼里，因此当地人对他的上台表示热烈欢迎。原本被格伦沃夫掣肘的卡列维奇终于能够大展拳脚了。"
 UFE_TuZhuHuanHe:0 "与原住民和解"
 UFE_TuZhuHuanHe_desc:0 "我们政府必须一改此前压榨原住民的政策，重新赢得他们的尊重与信任。在民主派政治活动家的帮助下，相信我们一定能做到这点。"
 UFE_SheHuiWenDing:0 "终结动荡"
 UFE_SheHuiWenDing_desc:0 "前任总督格伦沃夫面对远东地区的匪患时不仅听之任之，有时候还利用他们盘剥牧民和农民。现在，为了维护社会的稳定和经济的发展，我们必须打击不法分子。"
 UFE_ShiFang_ZhengZhiFan:0 "释放民主派政治犯"
 UFE_ShiFang_ZhengZhiFan_desc:0 "卡列维奇一直对民主派的政治犯们抱有深切的同情，而掌权后的他也十分需要这些政治人才的帮助。何况卡列维奇作为原住民出身的将领，本身也瞧不起乌萨斯帝国的权威——他压根儿不信乌萨斯帝国有本事干预科雷马政府的政策——把民主派人士全部放出集中营，帝国中央管得着么？"
 UFE_KaLieWeiQi_GangLing:0 "卡列维奇的纲领"
 UFE_KaLieWeiQi_GangLing_desc:0 "虽然仅凭卡列维奇一人很难完成对改革计划的全盘设计，但是他愿意与民主派合作。在切尔尼雪夫斯基等人的帮助下，卡列维奇拟定了“土地改革、牧业改革、削减地租、降低利息、组建农会、选拔人才、兴办学校”的纲领。新的政治纲领将确保民主派的权力，并且允许底层人民进入政府和群众团体参与政治。"
 UFE_BenDiBaoKan:0 "本地报刊"
 UFE_BenDiBaoKan_desc:0 "在通讯不便、社会发展度低下的远东，许多居民都没有了解政策和新闻的渠道，使得他们的生活完全处于自然状态。为了能将人民动员组织起来以推进社会现代化，我们需要包括报刊广播在内的宣传手段，还要配以识字的基层干部去从事宣传工作。"
 UFE_TongZhang_tt:0 "决议§Y超额发行货币§!的持续时间§G延长§!§Y90§!天。"
 UFE_XinYong_tt:0 "决议§Y提升货币信用§!的持续时间§G缩短§!§Y90§!天"
 UFE_UFE_new_currency_idea_sub_tt:0 "§R降低§!一级§Y货币信用§!。"
 UFE_UFE_new_currency_idea_sub_sub_tt:0 "§R降低§!两级§Y货币信用§!。"
 UFE_UFE_new_currency_idea_add_tt:0 "§G提升§!一级§Y货币信用§!。"
 UFE_JiCengZuZhi:0 "村社基层组织"
 UFE_JiCengZuZhi_desc:0 "通过在每个村落和牧民补给站派遣基层干部，我们将可以把政府权力的触须伸到每家每户那里去。这不仅有利于我们汲取资源和资金，也便于我们将政治权利和福利分配给民众，并充分地组织和动员他们。"
 UFE_DangDiGanBu:0 "当地干部"
 UFE_DangDiGanBu_desc:0 "政府机构的迅速扩张导致官僚机构人手短缺，为了确保每个基层单位都有干部负责，我们必须放手从当地人中选拔干部。革命民主派的官员会定期巡检并向他们讲解政策与思想，以确保这些本土干部能够跟上中央政府的脚步。"
 UFE_CunShe_MinBing:0 "组建村社民兵"
 UFE_CunShe_MinBing_desc:0 "在构建起完善的村社基层组织之后，我们就可以通过这些组织来动员群众。通过向基层组织发放武器，他们将能够训练和维持一批村社民兵，此举不仅有利于抵御土匪，也能为我国正规军提供一定的兵源。"
 UFE_TuGai:0 "土地改革与牧业改革"
 UFE_TuGai_desc:0 "远东地区的土地和牲畜长期以来总是集中在地主和牧主的手上，这导致一般的贫困农民和贫困牧民受尽了剥削，而牧主和地主对土地、牲畜的控制，也导致了大量资源闲置或浪费。现在我们已经建立起了属于群众的村社基层组织，又武装了村社民兵，地主和牧主没有能力与我们对抗，是时候强制推行土改了。"
 UFE_DiFangMinBing:0 "地方民兵"
 UFE_DiFangMinBing_desc:0 "村社民兵仍然是传统色彩浓厚的武装力量，它很难适应日益走向现代化的社会。为了让村社民兵能够接入我国的国防体系，我们必须从地方到中央建立起一套完善的民兵系统。"
 UFE_ZhengZhiHeZuo:0 "政治合作"
 UFE_ZhengZhiHeZuo_desc:0 "在成效显著的革新运动后，我们的面貌已经焕然一新，随着领土的扩张和人口的增加，越来越多的政治力量也加入了我们。现在我们的社会状况已经变得十分复杂，不能再依赖威权军政府强制推进改革，我们必须正式建立一个民主政府，并开始拟定宪法。"
 UFE_SaoMangBan:0 "开设扫盲班"
 UFE_SaoMangBan_desc:0 "在文盲遍地的远东，要开展政治工作是十分困难的，同时，民众文化素质的低下也导致我们缺乏发展现代工业农业的优质劳动力和技术人才。为了逐步解决这一问题，我们必须广泛开展扫盲运动。"
 UFE_ZhengZhiGuWen:0 "军事政治顾问"
 UFE_ZhengZhiGuWen_desc:0 "传统的军队要么只忠于专制君主，要么就是为钱行事的雇佣军，我们必须打造一支忠于国家本身的职业军队，而国家就意味着政治体制与信念信仰。于军队中设置政治顾问，在不干预军事首长行使权力的前提下进行政治教育与政治动员，有利于我们打造一支忠诚而专业的军队。"
 UFE_BenDiJunGuan:0 "本地军官"
 UFE_BenDiJunGuan_desc:0 "在远东地区，既有因大叛乱而被迫留居的前帝国军人，也有骁勇善战的原住民头领，我们应该主动与他们接触、赢得他们的信任并将他们纳入我们的统一战线当中。这批来自本地的人才非常适合被培养成我们军队的军官。"
 UFE_KongZhi_TuFei:0 "控制土匪问题"
 UFE_KongZhi_TuFei_desc:0 "在大叛乱后，许多被迫流亡或居留远东的前乌萨斯帝国军人无以谋生，他们要么变成总督手下的雇佣军、要么就是落草为寇。我们若能妥善处置这股势力，就能将他们的力量吸纳到正规军当中去，而且还能顺带改善领土范围内的治安状况。"
 UFE_BenDiZhaoMu:0 "本地征募系统"
 UFE_BenDiZhaoMu_desc:0 "我们对乡村和牧民聚落的控制力还很弱，在征召其中的善战者从军时，往往无从下手、毫无头绪。通过在各级村社基层组织设置征兵机构，我们将能够把每个居民的身体状况、作战能力、品德作风记录在案，这样一来，在征召动员部队时就有了凭依。"
 UFE_ZhengGuiJun:0 "正规军系统"
 UFE_ZhengGuiJun_desc:0 "我们的军事体系还十分稚嫩，包括宪兵、军事法庭、军校等在内的现代正规军体系还没有建立起来。虽然我们能够动员大量兵力，但是却没有与之匹配的军事制度，所以我们的当务之急就是推动正规军的体系化和现代化。"
 UFE_QiTingKaSiKe:0 "奇廷卡斯克城市建设"
 UFE_QiTingKaSiKe_desc:0 "奇廷卡斯克是我们境内唯一的城市，绝大多数工业都集中于此，在当地投资的效益是最高的，没有其他地区可与之匹敌。"
 UFE_CuJin_JiShi:0 "促进集市贸易"
 UFE_CuJin_JiShi_desc:0 "许多农民和牧民会组织自发的集市以互通有无，但是社会的动荡严重干扰了他们正常的贸易活动，这可不是好事情。我们必须为老百姓的经济活动提供保护。"
 UFE_XiuBuTieLu:0 "修补铁路"
 UFE_XiuBuTieLu_desc:0 "乌萨斯的叛乱风波导致远东境内的铁路多已失修，还有不少匪徒和刁民偷盗铁轨上的钢材拿去卖钱，这严重影响了我们运输工业原料和投送军事力量的能力，我们必须修补破败的铁路网。"
 UFE_KuoJianDaXue:0 "扩建奇廷卡斯克大学"
 UFE_KuoJianDaXue_desc:0 "奇廷卡斯克大学是我们唯一的高等学府，我们所需的一切高级人才都只能指望由它来培养。"
 UFE_YuanLiaoGongYe:0 "基础原料工业"
 UFE_YuanLiaoGongYe_desc:0 "虽然在落后的远东发展先进的工业是十分困难的，但是我们可以凭借当地的矿产、牧产优势来发展初级的原料加工工业。"
 UFE_GongRenJieShe:0 "允许工人结社"
 UFE_GongRenJieShe_desc:0 "在全新政治纲领的推动下，科雷马的工人们积极热情地参与政治活动，这是因为他们在旧制度下也和贫农一样遭到了残酷的压迫——在奇廷卡斯克的许多工厂里，甚至雇佣了大量的童工和包身工！为了彻底发动工人，让工人敢于挺直腰杆去斗争反动的企业主，从而参与到革命民主主义的事业当中，我们要给工人合法结社的权利。"
 UFE_GongHui:0 "工会代表与工人纠察队"
 UFE_GongHui_desc:0 "工人若想要进一步参与政治事业，就必须形成自己的政党和工会，这与我们促进民主和推动革命的追求不谋而合。我们可以将工人组织与各级党部、基层政府单位结合起来，继而从工人群体中汲取强大的支持力量。同时，我们还要将民兵制度推广到工厂里，以便像农村民兵震慑地主一样，让工人纠察队震慑城市反动派。"
 UFE_PiCaoMaoYi_YiChan:0 "皮草时代的终结"
 UFE_PiCaoMaoYi_YiChan_desc:0 "我国经济曾经高度依赖皮草贸易，但现在我们已经基本建成了相对现代化的国民经济体系，过于推崇皮草贸易反而阻碍了我们的发展，是时候改变经济战略了。"
 UFE_JianQingFuDan:0 "减轻牧民负担"
 UFE_JianQingFuDan_desc:0 "在格伦沃夫治下，科雷马地区的牧民们承受着重压，他们中的许多人已经濒临破产甚至家破人亡，我们必须立刻拯救他们，并彻底解决他们的生存问题。"
 UFE_KuoDaShiChang:0 "扩大皮草市场"
 UFE_KuoDaShiChang_desc:0 "皮草贸易可以给我国带来巨大的经济效益，我们得想办法扩大销路，同时让贸易收益更多地惠及广大人民。"
 UFE_JinJi_ZhengZhao:0 "紧急征召"
 UFE_JinJi_ZhengZhao_desc:0 "我们长期依赖于雇佣兵和地方民兵，严重缺乏征召一支较大规模部队的能力。这种松松垮垮的招募模式已经不能适应乌萨斯第二次大叛乱的危局，我们必须做出改变。"
 UFE_DongBuZuoZhan:0 "东部作战计划"
 UFE_DongBuZuoZhan_desc:0 "在东达利亚东部地区进行秘密渗透和民间宣传，争取敌人一侧民众的民心，同时为我们的军队作战提供情报支持。"
 UFE_ZhongBuZuoZhan:0 "中部作战计划"
 UFE_ZhongBuZuoZhan_desc:0 "在东达利亚中部地区进行秘密渗透和民间宣传，争取敌人一侧民众的民心，同时为我们的军队作战提供情报支持。"
 UFE_XiBuZuoZhan:0 "西部作战计划"
 UFE_SanBingYouYong:0 "告全乌萨斯同胞书"
 UFE_SanBingYouYong_desc:0 "我们从未打算偏安一隅，在东达利亚充当一个割据一方的军阀，我们的志向是统一全国，并且建立一个民主的、共和的乌萨斯国家。我们必须将自己对农民、工人、小市民、有产者、贵族和地主的政策和态度广为宣传，从而最大限度地争取民众支持、震慑保守力量。"
 UFE_XiBuZuoZhan_desc:0 "在东达利亚西部地区进行秘密渗透和民间宣传，争取敌人一侧民众的民心，同时为我们的军队作战提供情报支持。"
 UFE_KuoDa_ZhengBing:0 "扩大征兵"
 UFE_KuoDa_ZhengBing_desc:0 "随着我国领土的增长与战争规模的扩大，我国的现有兵力已经不能满足将军们的需求。我们必须调整适役年龄，将更多人送入军队。"
 UFE_QingBao_HuoQu:0 "情报部门"
 UFE_QingBao_HuoQu_desc:0 "要想战争得胜，就离不开高效的情报部门。"
 UFE_QuanMin_DongYuan:0 "全民动员"
 UFE_QuanMin_DongYuan_desc:0 "我们已经在国内建立起了民主体制，现在全国上下的目标就是击败其他军阀、打倒乌萨斯帝国，从而在全乌萨斯建立起崭新的共和国。而这般革命事业若想胜利，就必须依靠人民，要充分将他们动员起来。"
 UFE_YingDuiSapLuan:0 "应对骚乱问题"
 UFE_YingDuiSapLuan_desc:0 "出于对饥荒和战乱的恐惧，奇廷卡斯克爆发了大规模骚乱，我们必须尽全力安抚民众，并把带头闹事的坏家伙们绳之以法……否则，没了奇廷卡斯克的工业和兵源支持，我们一定会战败，那么谣言所说的一切都将变成现实。"
 UFE_QingLi_KeYi:0 "清理可疑人物"
 UFE_QingLi_KeYi_desc:0 "在奇廷卡斯克的骚乱中，有不少领头分子是流落城中的破产地主和前土匪头子，他们早先在政府的打击下失去了自己作威作福的资本，而现在就想趁火打劫，谋求推翻我们。看来我们推进土改和平息匪患时还是太过手软，我们根本就不该给他们留生路！好在亡羊补牢为时未晚，我们现在捉拿他们，也还来得及。"
 UFE_ZhenYa_ShouDuan:0 "调整镇压手段"
 UFE_ZhenYa_ShouDuan_desc:0 "奇廷卡斯克的骚乱不是暴力镇压就能解除的，我们必须软硬兼施，还得依靠忠于政府的广大民众，如此灵活行事，方能遏制动荡的蔓延。"
 UFE_ZhiAn_BuDui:0 "机动治安部队"
 UFE_ZhiAn_BuDui_desc:0 "我们可以在奇廷卡斯克城区内部署机动治安部队，全天候警戒，从而确保能及时扑灭市区里的任何骚动。"
 UFE_AnFu_MinZhong:0 "与南方朋友协商"
 UFE_AnFu_MinZhong_desc:0 "奇廷卡斯克骚乱的根本原因还是民众恐惧饥荒和战乱，毕竟我国没有可靠的粮食产地，也缺少战略纵深。那么对此问题的根治之法，当然就是开发一片能够产出粮食和承载人口的新土地。当然，由于我们羸弱的经济实力，单凭自己是无法办成这事的，我们可以与炎国方面商议此事，以让渡当地资源开采权的方式，换得开发资金。"
 UFE_YouDai_ZhengCe:0 "南方开发"
 UFE_YouDai_ZhengCe_desc:0 "我们获取的新土地气候凉爽，相较于冰天雪地的科雷马地区，确实更适合畜牧与种植了。而且这片处女地以平坦的草原为主，简直是开垦田地和牧场的理想场所，我们得加快开发的脚步。"
 UFE_JunShi_XueYuan:0 "军事学院"
 UFE_JunShi_XueYuan_desc:0 "任何现代化军队都离不开思维现代化的军事人才，而要培养这种人才，当然就要有属于自己的军事学院。"
 UFE_BuBing_ChuanTong:0 "突击传统"
 UFE_BuBing_ChuanTong_desc:0 "利用大量步兵穿越复杂地形、进行英勇无畏的渗透突击是乌萨斯的军事传统，更是东达利亚战士的天赋所在，我们不能放弃这一点。"
 UFE_PaoBing_ZhuYi:0 "炮兵主义"
 UFE_PaoBing_ZhuYi_desc:0 "许多思想现代化的指挥官和战术理论家都非常重视火炮的作用，他们认为精准、猛烈的炮火打击，要比让步兵送命更能帮助我们赢得胜利。"
 UFE_ZhuangJia:0 "装甲研究"
 UFE_ZhuangJia_desc:0 "想要增强部队的突破能力，我们就必须重视装甲单位的作用，这些钢铁猛兽可以成为尖锐的矛头，帮助我们在敌人的防线上撕开口子。"
 UFE_BuBing_ZhuangBei:0 "步兵装备"
 UFE_BuBing_ZhuangBei_desc:0 "为我们的军队配备更好的步枪和更多的子弹。"
 UFE_HuoPao_GaiLiang:0 "火炮改良"
 UFE_HuoPao_GaiLiang_desc:0 "性能优秀的火炮不论在什么条件下都是战争利器，不管我们选择何种战略战术方针，都离不开好用的大炮。"
 UFE_ZhongPao:0 "研发重炮"
 UFE_ZhongPao_desc:0 "随着更多资金和设计人才的投入，我们已经有可能设计出一款有史以来射程最远、精度最高、威力最大的新式重炮。"
 UFE_JunShi_GongYe:0 "军事工业园"
 UFE_JunShi_GongYe_desc:0 "我国本就缺乏工业基础，要是还让工厂各自为政、散落各地，那么本就不高的产能更是雪上加霜。我们必须把军事工业集中起来，组建一个工业园区，以提升生产效率。"
 UFE_ShengChanXian:0 "重视反装甲"
 UFE_ShengChanXian_desc:0 "在资金、技术、人才高度集中的前提下，我们可以把军事装备的研发重点集中到反装甲上。我们的敌人乌萨斯帝国拥有强大的工业实力以编制大量装甲部队，如果不能克制它们，我们必败无疑。"
 UFE_Dui_DiGuo_ZuoZhan:0 "准备对帝国作战"
 UFE_Dui_DiGuo_ZuoZhan_desc:0 "万事俱备，只欠东风。不过，我们一旦与帝国政府开战，就意味着统一全国的理想目标已经近在咫尺。那么接下来，关于建国方针、经济政策、何者当因何者当革的路线斗争，就将毫无保留地爆发出来。而强大的帝国也会彻底吓住我们政府内部的投机分子和摇摆派，使他们纷纷跳出来和革命事业作对，我们必将面临严峻的挑战。"
 UFE_ZhengGui_YinHang:0 "建立正规银行"
 UFE_ZhengGui_YinHang_desc:0 "我们已经不再是割据一方的军阀势力，而是与帝国政府一争高下的“另一个”合法政府。我们必须将自己的金融机构正规化、官方化，以便和帝国政府进行彻底的金融战争。"
 UFE_DaJi_TouJi:0 "打击投机倒把"
 UFE_DaJi_TouJi_desc:0 "许多破坏分子在国内囤货居奇、投机倒把，借着战争的机会发财。这些人已经严重危害了社会稳定，并且使老百姓们面临生存危机。现在政府必须出手，用暴力消灭投机倒把者。"
 UFE_JunFei_ZiZhu:0 "军费自主"
 UFE_JunFei_ZiZhu_desc:0 "为了缓和政府与军队之间的矛盾，我们打算允许军方不经议会批准，就可以确定军费预算，当然，这也会弱化国家对军队势力的控制力。"
 UFE_ShouJiao_GuiJinShu:0 "收缴民间贵金属"
 UFE_ShouJiao_GuiJinShu_desc:0 "许多富人见到我们对帝国政府开战，都想骑墙摇摆，他们不知道最终鹿死谁手，也不知道战争会持续多久，于是干脆就囤积、购买贵金属以求资产保值。但是这种行为显然不利于革命政府进行金融管理，我们必须把民间的“多余”贵金属全部收缴。当然，政府在收缴贵金属时，也会向原主发放大体等值的官方货币以示补偿……"
 UFE_ZiYouFangRen:0 "自由放任"
 UFE_ZiYouFangRen_desc:0 "没有资本市场的自由和贸易的自由，就不可能保障人的自由，我们应该减少国家权力对市场的干预，确保财富和货物能够自由流动。"
 UFE_ZhiChiShiYe:0 "支持实业投资"
 UFE_ZhiChiShiYe_desc:0 "在缺少民用产品的乌萨斯，投资实业的利润空间是比较大的，我们可以用有限的政策激励投资者投资实业。"
 UFE_ShengChanJianShe_MinBingTuan:0 "生产建设民兵团"
 UFE_ShengChanJianShe_MinBingTuan_desc:0 "在落后的农村地区，公社与民兵团体充当了国家权力的“细胞”，但是它们的负责范围还比较有限，我们应该适当地向它们放权，使它们可以自主决定本地的经济发展方针、动员民众投入集体劳动。"
 UFE_QingXi_BangLianZhuYi:0 "清洗邦联主义分子"
 UFE_QingXi_BangLianZhuYi_desc:0 "在中央和地方矛盾尖锐时，邦联主义者趁势作乱，四处宣传他们的歪理学说，妄图在乌萨斯大地上散播分离主义思想。这种分离主义完全不从工业化社会的全局考虑问题，而是沉迷于村社自治、企业自治的乌托邦，我们必须严厉镇压和肃清邦联主义煽动者。"
 UFE_DiFang_QuanLi:0 "地方权力问题"
 UFE_DiFang_QuanLi_desc:0 "统治范围的空前扩大带来了日益严重的地方-中央矛盾，一些煽动家也打算趁机作乱。我们得以最快速度缓和央地矛盾，以便让煽动者无话可说，当然更重要的是解决地方到中央的权力分配和资源分配问题，为革命事业提供坚实的根基。"
 UFE_GuanChe_YuanZe:0 "贯彻共和民主原则"
 UFE_GuanChe_YuanZe_desc:0 "在不久前的社会动荡中，一些格伦沃夫时代的残留官员丝毫不顾及政府形象，残忍无情地镇压民众。他们不从社会矛盾的根源出发去思考问题，也不遵守共和民主的基本原则，而是像封建统治者一样没有底线地伤害群众，严重损害了共和政府的公信力。我们得开除这批官员，并且重新赢得民众的尊敬。"
 UFE_QueBao_JunDui:0 "确保军队忠诚"
 UFE_QueBao_JunDui_desc:0 "随着对帝国作战的开始，老将军特鲁别茨克伊不停假借“政治顾问干扰指挥”的借口，抵制共和国政府对军队的政治控制。许多人都怀疑他是失败主义者，想暗中与乌萨斯帝国媾和，而政治顾问显然是“碍事”的存在。在这一背景下，一场针对特鲁别茨克伊的政治审查已经展开，让我们看看他到底是什么货色。"
 UFE_TePaiYuan:0 "特派员制度"
 UFE_TePaiYuan_desc:0 "由中央政府任命和委托，特派员将被派往各个省份或军区，他们享有极大的权力，以直接代表中央政府行事。他们可以不经请示直接罢免将领和官员，也能组织政治教育活动和司法审判活动。"
 UFE_QiDong_ZhiXian:0 "启动制宪进程"
 UFE_QiDong_ZhiXian_desc:0 "在广大民众的呼声之下，制定宪法的大会终于召开了。所有群体都希望新宪法能够体现他们的意志，但很显然这是不可能的——尽管制宪可以缓和社会矛盾，但是斗争终究会再起，尤其是当一部分人发现新宪法不符合他们的利益时。"
 UFE_LeftWings:0 "关注左翼政治团体"
 UFE_LeftWings_desc:0 "工人、贫农、城市小雇员们在政治领域里发挥的作用与日俱增，他们结成了大大小小的数百个政治社团，甚至还有数个规模较大的党派已经形成。不得不承认，以底层公民为主体的左翼组织，已经是我国境内一股不可忽视的政治力量。"
 UFE_ZhiChiPinMin:0 "支持平民派"
 UFE_ZhiChiPinMin_desc:0 "共和民主制度意味着人人平等而自由，很显然平等不仅仅应该是法律面前平等，人与人在经济上也应该追求平等；同样，人的自由也不是资本流动的自由，免于饥饿和恐惧、免于匮乏和愚昧也是人的自由。我们必须重视最广大国民的利益与诉求，力求惠及共和国全体人民，只有全国人民的集体自由和普遍平等，才是真正的自由和平等。"
 UFE_ZhenYaPinMin:0 "镇压平民派"
 UFE_ZhenYaPinMin_desc:0 "平民派力主扩大基层政治组织，增加民众干预公共政治事务的渠道，这样的做法已经破坏了法的精神，也是对社会运作规律的践踏。为了实现自由与共和的理想，我们必须确保僭主或暴民不会干扰到制度的运作。社会发展自有一套神创的铁律，这种纯净的理念不容凡人干预，我们只有使自己的制度和法规符合这理念，才能保障人的自由平等。"
 UFE_JiTiCunShe:0 "集体制村社"
 UFE_JiTiCunShe_desc:0 "如果放任一般小农自耕，那么脆弱的自然经济必然再次导致农村出现土地兼并，于是地主和牧主将卷土重来，葬送革命果实。我们必须在农村深入推广村社集体所有制，用规模化集体劳动取代低效而脆弱的独立耕种。这既可以抗风险，还能够以最低成本引入新的农业技术，当然更重要的是，这种大农业模式也能助力我们的工业化。"
 UFE_ZhongYangYinHang:0 "共和国中央银行"
 UFE_ZhongYangYinHang_desc:0 "我们与乌萨斯帝国以及旧势力的战争不仅仅发生在国境上，市场和金融机构也是另一种战场，而在这个战场上驰骋的士兵，就是我们的货币。为了更好调控货币政策，我们应该设立并改进中央银行。"
 UFE_GanBuNianQingHua:0 "革命干部年轻化"
 UFE_GanBuNianQingHua_desc:0 "长期担任革命派领袖的同志大多年老，他们的精力正一天天下降，而且还占住了重要职务，使得年轻有为的新人无法得到充分的历练，为了革命胜利和乌萨斯祖国的解放事业，我们要大力推进革命干部的年轻化。"
 UFE_YueShu_JunGong:0 "约束军工企业"
 UFE_YueShu_JunGong_desc:0 "我们注意到一些军工企业已经开始与军方势力勾肩搭背，如果放任其发展，一定会造成严重的贪腐。我们应该阻止军工复合体做大，就算要保留它，也得把它放到文官政府的监控之下。"
 UFE_ZhengDunDuiWu:0 "清洗革命队伍"
 UFE_ZhengDunDuiWu_desc:0 "在平民派运动期间，耶里钦娜和恰达耶夫等人居然为了宣传自己的政治理念而公然破坏革命政府的团结，何况他们的思想也是戕害百姓以满足少数人之自由的“封建自由主义”。我们绝对不能容忍这种政客还能在共和国的土地上呼吸，他们必须被革命法庭判刑处死。"
 UFE_ZanShi_XuanZhi:0 "暂时悬置宪法"
 UFE_ZanShi_XuanZhi_desc:0 "动荡不安的内部局势和岌岌可危的前线战事，使我们不能在民主选举一事上分心，我们不得不暂时悬置刚刚制定的宪法，优先确保社会稳定和作战顺利。"
 UFE_ShouCiDaXuan:0 "首次大选"
 UFE_ShouCiDaXuan_desc:0 "在压倒平民派势力，并且趁机与军方保守派达成合作后，耶里钦娜和恰达耶夫已经可以无视革命民主派元老们的意见，强行平反已被打倒的政治犯，从而彻底主导政坛。但是为了更合理且更快速地重组政府、掌控政局，他们还需要举行一场合法的全国大选。"
 UFE_SiYouNongChang:0 "私有化农场"
 UFE_SiYouNongChang_desc:0 "小而低效的自耕农经济无法为工业商业发展提供足量的原料和劳动力，我们必须推进土地的集中经营，并迫使一部分农民进入城市务工。这种情况下，只需要少量员工就能维持下去的私有制大农场就成了最佳的农业发展形式。"
 UFE_GuLi_QiYeJia:0 "鼓励企业家"
 UFE_GuLi_QiYeJia_desc:0 "在耶里钦娜派系执掌大权后，我们可以废除一系列反对垄断、反对收入差距扩大的过时法令，从而极大激发企业家的热情，并促进资本的自由流动和快速配置。"
 UFE_JiuGuoWeiYuanHui:0 "专政委员会"
 UFE_JiuGuoWeiYuanHui_desc:0 "与帝国开战后，国内一系列严重的政治变动使我们确信，如果不保证革命民主派的绝对权威，那么保守势力就会反攻倒算。我们暂时不能进行全国大选，而是必须成立一个成分可靠的“专政委员会”，专政委员会的主要领导者必须是最忠诚的革命派人物，而其他委员可以由民主程序选举产生。"
 UFE_JiuGuoWeiYuanHui_tt:0 "邀请§Y约瑟夫·卡列维奇§!重返革命政府。\n "
 UFE_progressivism_road_tt:0 "所有§C进步自由主义（自由主义）§!领导人同时成为§R雅各宾主义（进步主义）§!的领导人。"
 UFE_FanDui_ShiBai:0 "反对失败主义"
 UFE_FanDui_ShiBai_desc:0 "在与强大的帝国开战之后，不少曾经幻想改良主义或是和平发展的软弱分子走到了我们的对立面，还有一些立场不稳的投机派也显露了原形，把他们从政府和军队中肃清干净，可以保障我们的战斗力。"
 UFE_DuZhanDui:0 "组织督战队"
 UFE_DuZhanDui_desc:0 "由于我们实行了广泛的征兵，士兵素质大不如前，许多训练不足的新兵会临阵脱逃，而一个人逃了就会带跑一大批，形成恶劣的连锁反应。针对这种情况，可以设置有权击毙战场逃兵的督战队，震慑那些懦夫，督促士兵们完成作战任务。"
 UFE_BaoWei_WeiYuanHui:0 "[GetBaoWeiJunName]"
 UFE_BaoWei_WeiYuanHui_desc:0 "[GetBaoWeiJunDesc]"
 baiweiju_rev:0 "革命保卫委员会"
 baiweiju_rev_desc:0 "我国时刻面临反动分子的渗透和破坏，乌萨斯帝国和支持帝国的旧势力也蓄意要颠覆革命民主政府。为了保卫革命大局，我们将组建革命保卫委员会，委员会的基层组织将下到每个村落和社区，动员全体人民来对抗探子和间谍。"
 baiweiju_dem:0 "国家秘密警察部"
 baiweiju_dem_desc:0 "我们经过长时间的镇压，已经基本稳住了社会大局，但是还有激进分子和帝国保守派势力在暗中作乱。我们必须建立专门的特工学校，培养出一批能力极强的秘密警察和间谍特工，凭借他们来时刻监控社会激进团体、震慑保守势力。"
 UFE_TeWu_JiGuan:0 "扩大特务机关"
 UFE_TeWu_JiGuan_desc:0 "发展秘密警察的方针被证明是无比正确的，这项举措成功帮助我们控制住了社会动乱，并在战争期间保障了谍战的胜利。不过我们并不打算在战争与动荡结束后解散秘密警察，我们还应该把特务部门的规模扩大，以便彻底控制全局。"
 UFE_XuanYang_Fa:0 "宣扬法的精神"
 UFE_XuanYang_Fa_desc:0 "在时局动荡之际，一切旧时代的规范都土崩瓦解，民众很容易感到无所凭依，继而陷入简单而直接的恐慌中，这种情形很容易使得社会的激进化程度超出控制，继而使革命事业乃至共和事业陷入被动。为了重塑人民的信念与社会的基本规范，我们要着重强调法的精神。"
 UFE_LiYong_XueZhe:0 "利用专家学者"
 UFE_LiYong_XueZhe_desc:0 "虽然许多来自旧社会的专家学者在政治观念上反对我们，但只要他们不跳出来和革命政府作对，我们就没必要追究到底。我们可以与这些人达成协议，只要他们承诺不参与政治且为共和国服务，我们就保障他们的人身安全和生活水准。"
 UFE_ZuiGao_FaYuan:0 "最高法院"
 UFE_ZuiGao_FaYuan_desc:0 "宪法和法律再完美无瑕，也不过是停留在纸上和天上的空洞理念，如果要让它获得在地性，就必须要有各级司法机构、执法机构保障它的实施。而这当中最重要的一环就是最高法院，因为最高法院对宪法和法律享有直接的解释权。"
 UFE_GuanLiaoJiGou:0 "完善官僚机构"
 UFE_GuanLiaoJiGou_desc:0 "我国政府正经历着与军队势力的政治博弈，估计得费九牛二虎之力才能保障军队的政治忠诚，这让我们意识到“强化文官权力、改革官僚机构”是多么的重要。"
 UFE_JinJiFaLing:0 "限价令"
 UFE_JinJiFaLing_desc:0 "由于产出有限和不法商贩囤货居奇，许多维持人民生存的必要商品已经涨到了天价。尽管我们已经对投机行为进行了严厉打击，但是仅仅这么做还远不足以保障人民的生存，我们要实施更严厉的法律，一来完全限制部分商品的售价，使其价格合理，二来限购限屯，禁止大量购买和囤积特定商品。"
 UFE_KongBuZhengCe:0 "革命恐怖政策"
 UFE_KongBuZhengCe_desc:0 "限价令的实施将革命政府的社会干预推到了最高潮，大量忠于革命民主派的人民团体也自发地组建起来。这给我们提供了一劳永逸地扼制破坏分子、帝国间谍和地主贵族势力的机会——我们可以从上到下地贯彻恐怖政策，凭借广大基层组织，彻查大多数公民的政治倾向，揪出所有支持或准备支持保皇派的人、监视那些曾与保皇派有联系的人。"
 UFE_DiZhiZuoYi:0 "白色恐怖"
 UFE_DiZhiZuoYi_desc:0 "切尔尼雪夫斯基指责政府一事差点撕裂了政坛，耶里钦娜和她的支持者发现，如果不彻底清除“激进派”，他们就不可能平稳地实施任何政策。而来自帝国、贵族、地主等守旧势力的破坏分子，也不可以姑息纵容。为了消灭所有抵抗共和国政府的个人与团体，我们不得不采取恐怖措施。"
 UFE_WenHuaGaiZao:0 "社会文化改造"
 UFE_WenHuaGaiZao_desc:0 "人类是具有充分理性的存在，然而腐朽的旧文化和过于偏激的革命文化破坏了这种理性，使人类偏离了造物主的道路。这种理性只有通过全社会的文化改造，才能根植于每个人的大脑。"
 UFE_GongChanDang:0 "共产党合法化"
 UFE_GongChanDang_desc:0 "共产党人在平民派运动中是无产阶级的杰出代表，他们在捍卫革命、进行政治教育、参与基层动员和维持社会公益事业的活动中做出了非常出色的贡献，我们应该保证共产党在我国享有合法地位，哪怕他们的最终目标是消灭资本主义制度。"
 UFE_GeMing_JiaoYu:0 "革命教育"
 UFE_GeMing_JiaoYu_desc:0 "随着革命战争的结束，未来的社会将会十分太平，那时候人们有可能遗忘旧时代的可怕与革命精神的可贵。我们必须非常重视革命教育，让下一代人也能了解到民主革命的历史、传承民主革命的精神。"
 UFE_QiangDiao_XiaoLv:0 "强调效率"
 UFE_QiangDiao_XiaoLv_desc:0 "在大战面前，任何拖拉磨洋工的行为都是反革命的、都将破坏我们的事业，效率必须被放在第一位。"
 UFE_QunZhong_ZhengZi:0 "群众政治"
 UFE_QunZhong_ZhengZi_desc:0 "激进政策看似悬置或破坏了宪政民主派眼里那些重要无比的选举制度和个人政治权利，但也彻底激发了民众的热情。大量自发组建的民众政治团体如雨后春笋般涌现，这些组织大多能与基层政府紧密合作，形成了牢不可破的横向网络，大大加强了全国的团结，也在另一层面上确保了全国人民的基本权利。"
 UFE_ZhiChi_JiGuan:0 "支持精英技官"
 UFE_ZhiChi_JiGuan_desc:0 "民众对民主、共和、自由的理解是混乱而不可靠的，而且非常容易陷入激情和感性、造成严重破坏，只有深谋远虑的精英技官能够引领他们实现自由。"
 UFE_BuXuYao_XueZhe:0 "“共和国不需要学者”"
 UFE_BuXuYao_XueZhe_desc:0 "许多所谓的精英学者都曾担任过帝国或军阀政府要职，手上沾了不少人民的鲜血与脂膏；也有人原本和我们站在一起，却在激烈的政治冲突中迷失了方向，转而反对共和、大肆破坏。这些人中有意认错悔改的，我们还将他们接纳到“人民”的队伍中，而那些依旧高高在上、蔑视人民的，我们对他们说——“共和国不需要学者,而只需要为国家而采取的正义行动！”"
 UFE_RenMIn_JuLeBu:0 "人民俱乐部"
 UFE_RenMIn_JuLeBu_desc:0 "许多知识分子、普通市民、雇工贫农都习惯到特定场合举行集会，他们渐渐围绕这些地点形成了“俱乐部”式的政治团体。这些人民团体宣讲共和主义、民主主义的政治理念，也向群众转述革命政府的政策和前线战争现状。他们还能组织民众开展游行示威和请愿，使得民众获得了介入公共政治事务的有效渠道。"
 UFE_JiTi_ChuangXin:0 "鼓励集体创新"
 UFE_JiTi_ChuangXin_desc:0 "当知识被少数人垄断时，创新也总是被垄断为“天才的灵光一闪”，而不是社会发展的果实与全体人类智慧的结晶。我们主张在全国范围内普及教育，并且鼓励高等学府开门办学、接纳那些由人民团体推举入学的工农出身者；我们主张那些高级学者也应该参与到普通市民经常参与的劳动事业中去，并且关注平民的生活，在民众的生活中寻找灵感。只有当知识平等地属于所有人时，创新所带来的荣誉和好处才能惠及全体人民。"
 UFE_ZiYou_ShiChang:0 "坚持自由市场政策" 
 UFE_ZiYou_ShiChang_desc:0 "解决问题的人就是制造问题的人，解决一切经济危机和经济差距的最佳方案，就是打造一个充分自由的市场。只要市场可以实现资源和资金的高效配置，那么任何问题从长远角度看都能得到解决。"
 UFE_DaPo_JiCeng:0 "打破基层网络"
 UFE_DaPo_JiCeng_desc:0 "革命前期遗留的各种社会基层组织阻挠了自由市场的运行，它们的集体制经济也阻碍了资本主义经济的发展，最糟糕的是，被这些基层组织连结起来的人很难成为资本主义的自由个体，甚至还会团结起来反对政府的政策。不把基层组织这块“绊脚石”砸碎，我们的自由市场战略肯定没法实施。"
 UFE_ZhiXing_XianJia:0 "清理政治犯"
 UFE_ZhiXing_XianJia_desc:0 "许多因为政治犯罪而被关押的罪人还没有被审理判刑，但是他们仅仅是被关押在监狱里就已经叫人民不安。每当战事不利或是政治波动时，群众就害怕这些罪犯越狱出逃、卷土重来，并对革命者反攻倒算。为了永绝后患，我们将在短时间内审清所有积压的案件，并且立刻处决那些威胁较大的罪犯。"
 UFE_JieShu_KongBu:0 "结束恐怖政策"
 UFE_JieShu_KongBu_desc:0 "战争的胜利和经济的恢复使得恐怖政策已经没有必要再持续下去，它的使命已经完成了。"
 UFE_ZhongZhi_XianJia:0 "终止限价令"
 UFE_ZhongZhi_XianJia_desc:0 "我们的生产能力已经有了大幅度的提升，现在市场上商品充足，各种民用品的供应也不再会中断，限价限购的法令已经可以放宽甚至取消了。"
 UFE_HuiFu_XuanJu:0 "恢复选举"
 UFE_HuiFu_XuanJu_desc:0 "恐怖政策和它的敌人乌萨斯帝国一样，已经变成了过去式，战时的专政委员会专政也完成了自己的使命。众人已经将目光投向了那被悬置至今的革命宪法——正式执行宪法、开始全国大选的时刻到了。"
 UFE_JinBuZiYou:0 "进步自由主义"
 UFE_JinBuZiYou_desc:0 "革命民主派带领乌萨斯人民推翻了帝国的腐朽统治，并将乌萨斯的工人、农民、知识分子们紧密团结在一起——使贫困大众免于匮乏和愚昧；也使学者们走出象牙塔而拥抱社会。当然更重要的是，我们真正实现了乌萨斯全体人民的自由——使他们成为了国家的主权者而自由发展、自由行使政治权利并免受饥饿、战乱和匮乏的侵害。我们的功绩证明了进步自由主义的威力和正确性，并让那些原教旨自由主义者无话可说了。现在，进步自由主义不再是令人晕头转向的大话空话，而是能够改变乌萨斯的科学理念。"
 UFE_JiTi_ZiYou:0 "强调集体自由"
 UFE_JiTi_ZiYou_desc:0 "没有各种人民团体和基层组织的保障，个体公民很难直接参与到公共政治事务中去，也就无法自由行使政治经济权利，这说明自由只有作为集体自由时才是现实的。我们应当着重突出自由的集体性，反对脱离社会现实的个人主义自由。"
 UFE_QiangDiao_GeRenZiYou:0 "强调个人自由"
 UFE_QiangDiao_GeRenZiYou_desc:0 "若没有神圣不可侵犯的个人自由权利提供庇护，任何普通公民都可能会遭到社会组织或是国家暴力机关的倾轧。为了消除多数人的暴政和少数人的独裁，我们要从制度层面解决问题，对个人自由严加保护。" 
 UFE_WuMingHua:0 "取消特派员与军事政治顾问"
 UFE_WuMingHua_desc:0 "特派员和军事政治顾问已经和“政治迫害”高度绑定，他们是侵害军官和士兵人权的急先锋，这种野蛮的暴政必须被彻底取消。"
 UFE_QuYiShiXingTai:0 "去意识形态化"
 UFE_QuYiShiXingTai_desc:0 "国家机构的运作和公民的日常生活应该由人的理性决定，人应该发展其独立思考的理性，而不是盲从某一意识形态的煽动或暴政。"
 UFE_JingDian_ZiYou:0 "经典自由主义"
 UFE_JingDian_ZiYou_desc:0 "人因拥有理性而自由，作为理性人的公民其权利神圣不可侵犯。政府只需要保护个人权利即可，而经济文化等领域，则要让人用理性的、独立思考的方式去开拓和发展。"
 UFE_YouXian_FuLi:0 "有限福利政策"
 UFE_YouXian_FuLi_desc:0 "我们在革命前期设立的种种社会保障制度已经显得有些累赘，现在应该精简福利内容，鼓励人们通过工作致富。"
 UFE_RenQuan:0 "人权法案"
 UFE_RenQuan_desc:0 "感染者应该获得平等权益，而且他们作为弱势群体，如果不能得到专门的救治和保护，就很容易面临生命危险和他人歧视，我们应该优待感染者。"
 UFE_JunDui_JingShang:0 "允许军队经营产业"
 UFE_JunDui_JingShang_desc:0 "我们正在全方位收缩政府开支并扩大市场自由，这意味着我们对军队的控制也应该减弱，并且要容许军队经营产业以增加收入。"
 
