 UFE_anti_armor_idea:0 "非对称反装甲作战"
 UFE_anti_armor_idea_desc: "我们没有能力产出与帝国等量的坦克装备或陆行舰，因此我们必须集中所有资源来提升步兵和炮兵的反装甲能力。唯有如此，才不会在遭遇敌方装甲师时一触即溃。"
 UFE_oil_for_YAB_idea:0 "给予安北都护府资源开采权"
 UFE_focus_war_idea:0 "国策作战增益"
 UFE_XiBuZuoZhan_tt:0 "§Y国策持续§!期间我国获得修正：\n(§Y所有西东达利亚军阀§!)：我国对其进攻修正: §G+15.0%§!\n(§Y所有西东达利亚军阀§!)：我国对其突破修正: §G+15.0%§!\n(§Y所有西东达利亚军阀§!)：我国对其防御修正: §G+15.0%§!\n "
