 UFE_vs_REU_leadership_decisions_category:0 "争夺革命领导权"
 UFE_vs_REU_leadership_decisions_category_desc:0 "远东民主派原本是乌萨斯极东唯一的革命力量，但随着萨卡兹北进并在整合运动中培养出新一批共产主义革命者，远东民主派已经不再是当地唯一的革命核心。两群革命者拥有不同的目标和道路，但总的来说还是共同点大于不同点，依然可以走向联合——不过，所谓联合，到底是整合运动领导下的联合，还是远东民主派领导下的联合呢？\n\n[REU.GetFlag]§Y[REU.GetName]§!当前胜点：[?REU.win_points|G0]\n[UFE.GetFlag]§Y[UFE.GetName]§!当前胜点：[?UFE.win_points|G0]\n\n这是一个简易的§Y比大小§!游戏，双方利用决议来赚取游戏分数，在分数大于对方时，就会§G取胜§!并获得革命领导权。为了确保没有平局出现，[REU.GetFlag]§Y[REU.GetName]§!在游戏开始时拥有§Y5§!点基础分数。\n\n游戏将进行§Y160§!天以决出最终赢家，赢家将获得§Y和统§!对方的机会（§g仍然可以拒绝并§R开战§!，但ai总是会同意玩家的和统要求，而如果双方都由ai操控，则有§R50%§!概率触发拒绝事件§!）\n\n[GetREUUFEWinner]"
