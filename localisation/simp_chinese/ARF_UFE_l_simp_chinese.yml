 industrial_capacity_factory_dockyard_005_1_tt:0 "工厂和海军船坞产出: §G+5.00%§!"
 UFE_revolutionary_propaganda_decision_decision_category_desc:0 "民主共和的思想为乌萨斯带来了全新的可能性，但是考虑到我们国土环境的复杂和人口的众多，共和主义的落实是需要外力不断推动的。乌萨斯是一个地区差异巨大的国家，我们有必要通过包括广播、电视、报刊、信件在内的一切手段，把民主共和的精神带给每一个人。\n§Y每进行一次宪法宣传，所有宣传决议的花费就会翻倍，最高消耗80政治点。§!\n "
