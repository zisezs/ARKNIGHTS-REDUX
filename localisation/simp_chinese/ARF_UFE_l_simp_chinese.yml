 UFE_special_units_decisions_desc:0 "我国继承了一部分旧乌萨斯的军事遗产，但是由于生产能力有限和军事人才培养不足之类的限制，一度面临比较大的国防问题。不过只要我们能引入先进的现代军事理论、因地制宜发展适合我们的武装部队和军事装备，强军之梦也是触手可及的。\n\n§Y将鼠标悬停在左侧图片上以查看当前§G修正效果§!。§!"
