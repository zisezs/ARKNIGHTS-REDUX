 UFE_social_stability_charactors_tt:0 "在我国政坛上存在着[?UFE.UFE_targeted_for_purge_var|Y0]名具有影响力的叛徒，他们将在未来的§R反动派叛乱§!中加入叛军，使叛军招募到额外的陆军师§Y（每个叛徒可招募6个师）§!。我们可以完成§Y相关国策§!来§R处决§!或§R解职§!他们，以避免他们在内战中发挥作用。当前有影响力的叛徒§Y名单及职位§!如下："
 UFE_social_stability_decision_end_tt:0 "从我国移除£pol_violence §Y社会矛盾张力§!与£in_combat §Y军队控制度§!机制，同时终止§Y革命形势§!决议。§G我国政局走向稳定了。§!\n "
