# ---------------- 动态民族精神 ----------------
YAN_mil_reform_spirit:0 "大炎帝国军事改革"
YAN_mil_reform_spirit_desc:0 "\n\n\n\n\n\n£GFX_YAN_mil_suiwu_banner£\n\n\n\n\n\n\n\n§R“百氏之乱以来，天下烽烟未歇，经此战火百炼犹不灭不陨者，是为大炎。”§!\n\n岁陵之乱中，山海众、邪魔信徒、盗匪并起，陈旧的宣政司募兵制早已落伍，而玉门边军的操练成果与戡乱水平在战火的淬炼中展露锋芒。\n\n为此，太尉邀人类武道宗师§R重岳§!、精通军械的导演§R年§!、善算谋划的棋圣§R望§!主持大炎帝国陆军改革。"
YAN_mil_reform_spirit_final:0 "岁岁今朝·武"
YAN_mil_reform_spirit_final_desc:0 "\n\n\n\n\n\n£GFX_YAN_mil_suiwu_banner£\n\n\n\n\n\n\n\n§R“百氏之乱以来，天下烽烟未歇，经此战火百炼犹不灭不陨者，是为大炎。”§!\n\n岁陵之乱中，山海众、邪魔信徒、盗匪并起，陈旧的宣政司募兵制早已落伍，而玉门边军的操练成果与戡乱水平在战火的淬炼中展露锋芒。\n\n为此，太尉邀人类武道宗师§R重岳§!、精通军械的导演§R年§!、善算谋划的棋圣§R望§!主持大炎帝国陆军改革。"

# 隐藏装备 idea 的显示名（不占政治面板；add_ideas 日志与调试用）
YAN_mil_rf_equip_costume:0 "大炎帝国军事改革·服化道"
YAN_mil_rf_equip_colossus:0 "大炎帝国军事改革·玄极巨兵"
YAN_mil_rf_equip_holy_king:0 "大炎帝国军事改革·明王圣帝"

# 民族精神里的装备条款：装备类效果由隐藏 idea 的 equipment_bonus 实际生效，
# 这里用变量插值把当前数值显示在精神 tooltip 中（写法同猩红剧团/莱茵生命的 custom_modifier_tooltip）。
YAN_mil_reform_equip_tt:0 "\n§Y装备条款：§!\n§Y所有装甲单位§!：生产花费 §G[?YAN_mil_rf_equip_armor_cost|+%0]§!，装甲厚度 §G[?YAN_mil_rf_equip_armor_value|+%0]§!，突破 §G[?YAN_mil_rf_equip_armor_bt|+%0]§!\n§Y所有空军单位§!：生产花费 §G[?YAN_mil_rf_equip_air_cost|+%0]§!\n§Y所有步兵装备§!：生产花费 §R[?YAN_mil_rf_equip_inf_cost|+%0]§!，防御 §G[?YAN_mil_rf_equip_inf_def|+%0]§!"

