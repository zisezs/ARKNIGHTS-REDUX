# ---------------- 国策事件 ----------------
yan_mil.20.t:0 "说话！"
yan_mil.20.d:0 "§W〔旁白〕§!：宗师步入大殿时并未佩剑，只带着一身塞外风沙。太傅手边的清茶已经换过一轮。\n§Y重岳§!：「久违了。」\n§R太尉§!：「宗师在玉门苦守百年，今日奉诏入京，这百年来的边防得失，当真一句也不肯向兵部交底？」\n§Y重岳§!：「无他，唯『勤』而已。」\n§R太尉§!：「……百年戍边，就只一个字？」\n§Y重岳§!：「将士用命，日夜操演，本就只有一个『勤』字。太尉想听的若是排兵布阵的实策，我们不妨看图说话；若想听别的，朔无话可讲。」\n§Y真龙§!：「不必拘礼，让他把玉门的防务一五一十问清楚。」\n§W〔旁白〕§!：重岳行至巨大的九畿舆图前，指节稳稳按在西北玉门的方位——那里的羊皮图纸早已因常年摩挲而泛白。"

yan_mil.21.t:0 "大爆炸！"
yan_mil.21.d:0 "§W〔旁白〕§!：轰隆一声巨响，影视基地的第 9 次实景爆破直接把半座布景棚掀上了天。\n§C年§!：「怎么样！就问你们这一炸够不够味、好不好看？！」\n§Y重岳§!：「声势尚可。至于炸塌的半条街……账单记在我名下便是。」\n§C年§!：「哎呀大哥你别摆这副表情！要不是那群爆破师死活不敢加满真火药，我至于亲自动手改引线吗——」\n§M太傅§!：「年小姐雅兴不浅。不过老夫有一言相劝：下回拍戏，劳驾离城郊的兵部火药库远上十里地。」\n§C年§!：「太傅你这就不懂行了！武侠片嘛，火光就得贴着脸炸才叫真功夫！」\n§W〔旁白〕§!：年大咧咧地蹲在焦黑的台基旁，捡起一块被气浪拧成麻花的玄铁阵盘左看右看，啧了一声，又宝贝似的揣回怀里。"

yan_mil.22.t:0 "搞么子？"
yan_mil.22.d:0 "§W〔旁白〕§!：龙门防区递来的军报上，批红的「搞么子」三字被重重圈了数道，浓墨力透纸背。\n§C望§!：「你们递这份阵图过来，无非是想问前线防线守不守得住。我已经推演过了——守不住。」\n§R龙门将领§!：「『搞么子』？！你在这军报上批三个字——两军还未接阵，你坐在屋里拨弄几颗棋子，倒先判了老子的败局！」\n§C望§!：「三路粮道，两路必折在秋汛的河滩上。同样的沙盘我推了七遍，没有一回能撑过半月。」\n§R龙门将领§!：「那依你之见，这仗还怎么打？！」\n§M太傅§!：「莫急。既然他把死局算出来了，自然留着活路。」\n§C望§!：「砍掉东侧那路佯攻，主力后撤三十里，辎重改走旧盐道。」\n§R龙门将领§!：「改走盐道？那山路崎岖，大军至少要多绕十天！」\n§C望§!：「多走十天，总好过全军喂鱼。」"

yan_mil.23.t:0 "北望邪魔"
yan_mil.23.d:0 "§W〔旁白〕§!：三军方阵刚过校场，北方的天际却沉沉压了下来，黑云凝滞，如同一堵未曾合拢的铁墙。\n§Y老天师§!：「北边的气数不对，污秽得很。今日这演武大阵，莫要朝着正北摆。」\n§R太尉§!：「天师此言差矣，三军大阅乃国之重典，岂有因天色微变便改换阵向之理？」\n§C望§!：「她说的不是天色，是北边界外那些不干净的东西。」\n§Y老天师§!：「莫要胡乱窥探！塞外邪魔，岂是你凭目力望上一眼就能善罢甘休的？」\n§Y真龙§!：「无妨。大炎的铁甲既然列了阵，看一眼又如何。」\n§C望§!：「安心吧天师，今年北边躁动的那股祸水，冲的还不是玉门，是北原的草场。」\n§W〔旁白〕§!：校场上的牛皮大鼓再次轰然擂响。太尉按剑抬手，披坚执锐的军阵调转锋芒，浩浩荡荡开向校场北端。"
