# ==============================================================================
#  大炎 · 军事国策树重制版 —— 动态精神 / 决议 / 法案 / 事件
#  国策名称与效果 tooltip 在 ARF_YAN_Military_Rework_l_simp_chinese.yml（生成器产物）
#  国策描述（_desc）暂时留空；民族精神【大炎帝国军事改革】与终幕【岁岁今朝·武】共用同一段 banner 描述。
