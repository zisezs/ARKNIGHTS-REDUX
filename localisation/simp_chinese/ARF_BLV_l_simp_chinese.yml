 BLV_King_of_Bolivar: "玻利瓦尔国王"
 BLV_Unrecognized_dynasty: "不受认可的辛嘉斯王朝"
 BLV_Unrecognized_dynasty_desc: "虽说在大多数人看来，辛嘉斯王朝的进步性虽不如被他们鄙弃为“匪徒”、“恐怖分子”的真正玻利瓦尔人解放运动，但确是事实上的玻利瓦尔正统政府，但真正生活辛嘉斯治下的人们想法绝非如此。\n\n回顾当年的“第一次国难”，辛嘉斯王朝的祖先最初不过是个受莱塔尼亚支持的小小军阀，用潦草抄来的莱塔尼亚制度管理领中民众，凭莱塔尼亚的“平叛军”援助才统一全国。民众普遍对这个新政府毫无认可，人们都认为大辛德卡拉托中央政府不过是莱塔尼亚的傀儡，对辛嘉斯王室更是没有半分好感可言。\n\n也许辛嘉斯王朝能够通过某种方法获取合法性——或是集中君权，或是建立一个真正受认可的新体制，但那已经是后话了。"
 BLV_Bolivar_melancholy: "永恒孤独"
 BLV_Bolivar_melancholy_desc: "纵观这片大地，没有任何一个其他国家曾经历过如玻利瓦尔人所经历过那般刻骨铭心的的痛苦。殖民时期的短暂辉煌在当今王国子民眼中已好比黄金时代，而自治领时代的混乱在他们眼里也足以算得上凑活能过。如今若提起玻利瓦尔，人们绝无法绕开玻利瓦尔人口中的“两次国难”。\n\n第一次国难由众多渴望将玻利瓦尔纳入势力圈的核心圈国家挑起，它摧毁了平均三年更迭一位领导人的玻利瓦尔自治领，为玻利瓦尔带来了新的统治者——由莱塔尼亚扶植的辛嘉斯王朝；而第二次国难则由新兴强权哥伦比亚引发，致使国家再一次陷入内战深渊。如今，这场动荡仍未结束，玻利瓦尔王国仍同真正玻利瓦尔人与联合政府相互敌对。也许在某一天，国难终将走到尾声，但没人知道那究竟是“莱塔尼亚之傀”的复苏，还是一个新政权的崛起。"
 BLV_Economy_controlled_by_Leithanien: "受莱塔尼亚控制的经济"
 BLV_Economy_controlled_by_Leithanien_desc: "不得不承认的是，玻利瓦尔王国的经济自主性与没有差不了多少。莱塔尼亚企业牢牢主宰我们的市场，而这片土地之下开采出的珍贵资源也都被成批次地运向崔林特尔梅，以换取莱塔尼亚皇帝或女皇的支持。这一切都使得玻利瓦尔的经济状况十分畸形：国民经济极度依靠资源产业——特别是源石开采与经济作物的出口，而工业发展却陷入停滞与倒退。玻利瓦尔的消费市场被莱塔尼亚货所占领，国家完全沦为经济殖民地。玻利瓦尔王国欲想挣脱高塔枷锁，必先完成经济独立。"
 BLV_Well_trained_army: "训练有素的军队"
 BLV_Well_trained_army_desc: "在如今割据玻利瓦尔的三方势力中，王国政府的武装力量无疑最为强大。相比于真正玻利瓦尔人由各路武装拼凑而成的部队，联合政府草草组织的民兵与士气低落的正规军，它拥有全方位的优势——王国境内尚可运作的工业能够为其提供充分补给，而莱塔尼亚的支援则确保了军官充盈。这支纪律严明的军队是辛嘉斯王朝存续至今的强力保障，而它也将继续守护王国的稳定，并击败一切内外敌人。"
 BLV_Agricultural_time_bomb: "农业定时炸弹"
 BLV_Agricultural_time_bomb_desc: "庄园和种植园——这两种旧时代的制度近乎完全覆盖了玻利瓦尔的农业体系。为大地主所拥庄园耕作的佃农们生活条件极其艰难，遭遇监工言语辱骂与体罚暴力好似家常便饭，而部分最惨的佃农地位甚至与农奴无异。至于在各类种植园中工作的农业工人们也好不到那里去。其待遇可谓触目惊心：他们每日至少要结结实实地干上十数个钟头；休息日完全没有，想放假只能祈求上天开恩；工作环境糟糕至极，安全标准相当糟糕，甚至一旦遭受工伤就可能被当场解雇。\n\n玻利瓦尔农民所处的困境在过去便常激起动乱，而如今则引发了更多不安。真正玻利瓦尔人的极左分子利用他们那套“耕者有其田”的诱人话术煽动了不少农民罢工甚至叛逃，而阴影中的敌人们也在不断组织农民运动反抗政府。这颗名为“旧制度”的定时炸弹倒计时每刻都在走动，若不下定决心改革，它终有一日会走向归零。"
 BLV_Well_trained_army_tt: "§R征兵法案将锁定为按要求服兵役§!" 
