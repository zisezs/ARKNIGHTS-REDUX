l_simp_chinese:

# ==============================================================================
#  大炎 · 画中人（事件链 · 10 环）
#  · 原作 act16d5，地点勾吴地界灰齐山 / 画中婆山镇，时间景祚七年除夕
#  · 视角：登记在册的代理人「夕」擅离山头，司岁台要追，年先一步托了罗德岛
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 擅离
# ------------------------------------------------------------------
 yan_hzr.1.t: "未归山"
 yan_hzr.1.d: "司岁台的册子上，夕的名字下面注着三个字：未归山。\n\n她离开山头已经三年。代理人里，令无官身，不受调遣；年四处游荡，向来不算数；只有夕是有编制的——她在册，领衔，职责是看住某样东西。这三年来她什么也没看住，因为她不在。\n\n左乐主张除岁。这是司岁台里最年轻的一位秉烛人，主张一向最硬。\n\n椿把折子压下了。她是监正，压得住。她只批了一句：再等等。\n\n同一个月，年拿出了一批价值千万的实验材料，交给罗德岛，换他们跑一趟。任务书上写的是：把我的妹妹带回来。\n\n年还额外塞给领队一件改造过的戏服，和一枚用途不明的「护身符」。她没有解释。"
 yan_hzr.1.a: "命司岁台限期追回"
 yan_hzr.1.b: "由年去办。司岁台不必插手"
 yan_hzr.1.c: "批准除岁"

# ------------------------------------------------------------------
# 2 灰齐山
# ------------------------------------------------------------------
 yan_hzr.2.t: "一个月没有讯号"
 yan_hzr.2.d: "灰齐山在勾吴地界，产美玉的地方。山脚有座泥翁镇。\n\n罗德岛的三个人上了山。半山腰有一间茅屋，水渍斑驳，落叶堆到门槛上。喊了几声，无人应答。他们推门进去了。\n\n此后一个月，司岁台再没有收到这三个人的讯号。\n\n钦天监的人去看过，回来说：山上一切如常，日照、风向、土质，都对。就是那间茅屋不见了。\n\n不是塌了。是不见了。原地长着一片草。\n\n左乐把这份回报看了两遍，然后写了一份新的折子，要求把灰齐山一带全部划为禁地，任何人不得靠近。\n\n椿没有批。她说，如果那里面还有人活着，封山就是杀人。"
 yan_hzr.2.a: "派禁军入山搜救"
 yan_hzr.2.b: "封山。其余一概不问"
 yan_hzr.2.c: "不派人。等他们自己出来"

# ------------------------------------------------------------------
# 3 说书
# ------------------------------------------------------------------
 yan_hzr.3.t: "我们在听人说书"
 yan_hzr.3.d: "讯号回来了。一个月来第一次。\n\n只有一句：我们在听人说书。\n\n他们身处一片园林。讲书的人自称煮伞居士，是个说书人，讲的是一段旧事——一个跛脚书生画出了世间从未有过之物，然后冻毙在雪里。\n\n故事不长，他们听完了。回过神的时候，日头还在原处。\n\n他们以为自己刚坐下。\n\n后来克洛丝在记录里写：我们好像已经在这里待了两三日，但没有一个人说得出来这两三日做了什么。\n\n这份记录被送到司岁台。司岁台的分类里有一栏叫「迷」。这一栏三年没有添过东西了。\n\n年拿到同一份记录的时候，看了很久，说了一句：她还是在画那些东西。"
 yan_hzr.3.a: "全文入档，交天经阁核对"
 yan_hzr.3.b: "判为讹传，销毁记录"
 yan_hzr.3.c: "令钦天监遣人勘验其地"

# ------------------------------------------------------------------
# 4 日月
# ------------------------------------------------------------------
 yan_hzr.4.t: "日恒在东，月恒在西"
 yan_hzr.4.d: "那地方的天是坏的。\n\n太阳永远在东边，月亮永远在西边，谁也不落。从东走到西，就算过了一日。\n\n钟声一响，一种东西从鸿洞山那边进镇。镇民管它叫墨魉——黑乎乎的，像打翻的墨，中箭就化成一滩黑水。镇民一听见钟声就往日光那一头跑，跑得很熟练，像做过很多遍。\n\n司岁台的档里没有这个物种。钦天监的档里也没有。\n\n唯一动了一下的，是天经阁。阁里那位管书刀的老天师翻了一夜的旧卷，第二天早上递出来一句话，只有七个字：\n\n这不是灾。这是画。"
 yan_hzr.4.a: "定为新灾种，通谕各城邦"
 yan_hzr.4.b: "压下。不许外传"
 yan_hzr.4.c: "令勾吴各城岁末备墨魉之防"

# ------------------------------------------------------------------
# 5 婆山镇
# ------------------------------------------------------------------
 yan_hzr.5.t: "查不到的年号"
 yan_hzr.5.d: "那地方叫婆山镇。\n\n镇口的石碑上刻着纪年：景祚七年。\n\n钦天监把三百年的年号翻了一遍。没有景祚。地方志里也没有。勾吴的旧档里更没有。\n\n可景祚七年的除夕，这里是有人的。镇口有灶，灶里有灰；街上有人，人穿着当季的衣裳；东边的河在流，西边的山在起雾。\n\n镇上的人说，七十年前有个富商重金买回一幅画，那幅画在火场里没烧掉。富商照着画里的山水建了这座镇。\n\n这里没有天灾，没有源石，也没有人离开过。\n\n当铺的掌柜姓黎。她听见这些的时候，只是笑了一下，说：水中月，终归是水中月罢了。"
 yan_hzr.5.a: "彻查「景祚」年号，遍索天下藏书"
 yan_hzr.5.b: "认作地方私建，下令拆除"
 yan_hzr.5.c: "不动。让它自己待着"

# ------------------------------------------------------------------
# 6 点睛
# ------------------------------------------------------------------
 yan_hzr.6.t: "徐夫人的那一笔"
 yan_hzr.6.d: "说书人又讲了一段。\n\n说从前有个女画家，姓徐。她画什么都差一笔，差的都是眼睛。后来她从一只待宰的羽兽眼里，求得了那一笔。\n\n从那以后，她画的东西活了过来。她也从此成了画的囚徒。\n\n故事讲到这里，钟又响了。这一次墨魉来了很多，比前几回都多。\n\n炎熔跟说书人立了一个约：我们保这个镇平安，你送我们离开。\n\n说书人想了想，答应了。\n\n同一天，有人背着一个小女孩往外冲。那女孩叫阿然，她母亲刚没了。\n\n克洛丝没有说话，她只是把箭搭上了弦，然后一箭一箭地清路。\n\n乌有背着一个孩子跑了几里地，跑完才想起来，自己这一路上都是在藏拙的。"
 yan_hzr.6.a: "允其立约，另调人手接应"
 yan_hzr.6.b: "斥其擅专，命即刻撤离"
 yan_hzr.6.c: "不表态。只看"

# ------------------------------------------------------------------
# 7 一日之祸
# ------------------------------------------------------------------
 yan_hzr.7.t: "死掉的人变回来了"
 yan_hzr.7.d: "太阳忽然移了位。\n\n昼夜开始流转了。这本该是好事，可随着日头正常起来，墨魉不再怕光了。它们开始吃人。\n\n一夜之后，镇子完好如初。\n\n石板路上的血没有了，塌掉的屋架立回去了，连阿然的母亲都「变回来了」——她站在门口，招手叫女儿回家吃饭。\n\n只有四个画外人记得昨天发生了什么。\n\n黎找上说书人，反讲了一段书。她说，这个镇子当年遭了天灾，水源被源石污染，镇民弃乡逃难，一个瘦弱的女孩被亲族丢在寒夜的峭壁间。\n\n然后，她见到了一个奇妙的人。\n\n说书人只对那个游方僧留了一句：在画中久矣，点到为止。"
 yan_hzr.7.a: "命全力救人。人命不问真假"
 yan_hzr.7.b: "不救。那本就是画"
 yan_hzr.7.c: "只准救画外人，画中人不得带出"

# ------------------------------------------------------------------
# 8 爆竹
# ------------------------------------------------------------------
 yan_hzr.8.t: "镇口垒灶烧竹"
 yan_hzr.8.d: "办法是黎想出来的。\n\n她向说书人讨来一批竹子。众人在镇口垒起土灶，把竹节一节节丢进去烧。\n\n噼啪作响。\n\n墨魉退了。退得很干脆，像被烫到一样。\n\n炎熔当场就愣住了。她想起六年前在龙门守年关的那一夜，那也是一场爆竹。她一直以为那是民俗。\n\n同一日，那个东国来的游方僧已经把自己关在屋里七日。他叫嵯峨，游历过一百多幅画卷，在这幅里待了十年。他敲钟守岁，谁也不知道他为什么敲。\n\n而说书人在这一天听见了一个名字。\n\n是年。"
 yan_hzr.8.a: "通令各城邦，年关一律备爆竹"
 yan_hzr.8.b: "视为孤例，不必推及"
 yan_hzr.8.c: "彻查这批竹子从何而来"

# ------------------------------------------------------------------
# 9 大梦
# ------------------------------------------------------------------
 yan_hzr.9.t: "你我皆是画中人"
 yan_hzr.9.d: "嵯峨推开了那扇门。\n\n他说：该醒了。\n\n说书人告诉他，她在这幅画里已经十年。画外只从秋天走到了冬天。\n\n她说起一幅图，叫《拙山尽起图》。图的最末尾有一道飞瀑，只画了一半，底下是白的。嵯峨问她为什么留白，她答：兴起而起，败兴而停。\n\n嵯峨又问：何为真。\n\n她答：错，你我皆是画中人。\n\n然后她现出了本相。\n\n那是夕。\n\n她不是被囚在画里，她是把自己画进了画里。她怕的不是司岁台。她怕的是有一天醒来，发现自己不再是夕。"
 yan_hzr.9.a: "令夕归山受册。朝廷给它一个名分"
 yan_hzr.9.b: "除夕。代理人如此，留之何用"
 yan_hzr.9.c: "不问。由它去"

# ------------------------------------------------------------------
# 10 洪炉
# ------------------------------------------------------------------
 yan_hzr.10.t: "大号二踢脚"
 yan_hzr.10.d: "回到灰齐山之后，年做了一件很没有分寸的事。\n\n她弄来一支八尺长的爆竹——她管它叫「大号二踢脚」，点着了，烧穿了那幅画卷。\n\n姐妹俩动了手。\n\n打到最后，年说出了真正的理由。\n\n她说：当「我们」苏醒，重新成为「我」的时候，现在的你和我，都会消失。\n\n她说：在它醒来之前，必须做好准备。兄弟里已经有人彻底疯了。\n\n夕不肯接受。\n\n嵯峨从画卷里自己走了出来。他走过一百多幅画，跟画里许许多多个自己并肩同行过，走到最后，对着镜子明白了一件事：看山还是山，见水仍是水。\n\n年赢下了很多年前那场赌约。夕认输。\n\n她说：我跟着你走一段，近处看看你能做到哪一步。\n\n后来年把这件事写进给朝廷的呈文，呈文里只有一句实话：\n\n大炎，还是很可怕的呀。"
 yan_hzr.10.a: "认下「苏醒即消亡」。改司岁台章程，代理人在册"
 yan_hzr.10.b: "只记年之功。画卷封存，此事不再提"
 yan_hzr.10.c: "以年为质，令其受司岁台节制"
