l_simp_chinese:

 # ============================================================
 #  卡兹戴尔（KAZ）tag 介绍事件链
 # ============================================================

 kaz_intro.1.t: "萨卡兹、源石和双王时代"
 kaz_intro.1.d: "萨卡兹，泰拉大陆歧视性的将其称之为“丧家之人”的种族，它的内部包括数个亚种，如血魔、独眼巨人、女妖，以及无数在漫长进化中丧失了血脉纯种性质的杂血种类。它们的外观差异如此巨大，却最终都被外界归为“萨卡兹”这个似乎与整个泰拉文明优秀品质不共戴天的种族称呼。\n\n卡兹戴尔，这个被泰拉上千年反复围剿却反复重建的国家正是由萨卡兹种族建立而独属的。从远逐者在银色山脉捡到所谓的黑色王冠“文明的存续”并自封为初代萨卡兹（提卡兹）魔王后，卡兹戴尔即以强势和崎岖的姿态出现在泰拉大陆之上。\n\n提卡兹将卡兹戴尔捡起来，于是历经数次流亡，重建，再流亡，再重建……直到血脉不在纯粹，直到卡兹戴尔帝国在战争中一败涂地。这是萨卡兹生来的诅咒，萨卡兹对源石特殊敏感的体质使得他们掌握了强而有力的源石技艺的同时又饱受源石病缠身的困恼，卡兹戴尔帝国的暴力扩张又使得它得罪了周围所有的邻居，而这些邻居日后都成为了奠定泰拉如今政治面貌的大国。于是卡兹戴尔被围攻，再被毁灭，萨卡兹们被屠杀，然后流亡，然后再次复国……进入源石科技革命而追求所谓“文明开化”的诸国更是将身患源石病彻底萨卡兹种族视作彻头彻尾的异类而加以刻意排斥。在毁灭循环中，卡兹戴尔仍在，但它再也无法恢复帝国时代的荣光，而是缓慢的下沉而没入泰拉大陆隐秘的尘埃之中，成为各国加以严格封锁和监视的蛮荒之地——一旦卡兹戴尔有所越矩，泰拉诸国都不惜组成同盟动用武力而干涉之。\n\n卡兹戴尔在阴影中踽踽独行，并且最终来到了对它如今命运至关重要的一年——泰拉898年，彼时的四国勋爵凯尔希率领维多利亚、莱塔尼亚和高卢三国联军进攻卡兹戴尔，魔王以勒什身死，但凯尔希并未获得最终的胜利，她和联军受到了被后世称为萨卡兹“六英雄”的特雷西斯、特蕾西娅、菈玛莲、无名歌利亚、贝尔莎和孽茨雷带领的反击，其中，特雷西斯斩首凯尔希而为这场战争落下帷幕。此后泰拉各国松动了对卡兹戴尔的围攻，而只对其进行有限度的封锁。\n\n然而卡兹戴尔在战争中再一次化为废墟，大批萨卡兹人不可避免的流亡海外，博卓卡斯提带领温迪戈集体去往乌萨斯，菈玛莲在战后带领女妖王庭躲向河谷几乎不再过问卡兹戴尔的政治，此外还有无数人前往新大陆哥伦比亚和玻利瓦尔等地。为了拯救卡兹戴尔同胞，六英雄在战后成立了卡兹戴尔战争议会，用于统合卡兹戴尔多年以来征战四方的军事贵族战争王庭。而六英雄之一的特蕾西娅则被选召为魔王，此后的两百余年被称作萨卡兹的“英雄时代”、“双王时代”。"
 kaz_intro.1.a: "继续"

 kaz_intro.2.t: "意想不到的访客"
 kaz_intro.2.d: "泰拉900年，当满目疮痍的卡兹戴尔和新晋魔王特蕾西娅还在进行艰难重建的时候，一个意外的菲林女人前来拜访她。她居然是复活了的凯尔希。没人知道特蕾西娅和凯尔希见面那天二人到底说了什么，但自那以后，凯尔希和卡兹戴尔化敌为友，并且很快就在特蕾西娅授意下进入了卡兹戴尔的高层，而凯尔希及她提拔的一些属于她的人脉干臣也在重大议题和卡兹戴尔内政上几乎无条件的支持于魔王本人的决策。\n\n特蕾西娅是个怎样的人——悲伤，仁慈，善良，果敢……无数美好却看似完全相反的词语却能够在纵观她的历史上被全部归纳她的身上。但萨卡兹内部有一点是肯定的：特蕾西娅对卡兹戴尔来说是一个伟大的人。\n\n在她的第一个十年内，萨卡兹们即在她的领导下实现了卡兹戴尔城市的初步恢复，而第二个十年后，卡兹戴尔就从几乎无法容纳人类居住的废土恢复回了战前的状态。而特蕾西娅也逐渐开始将她的理想付诸于她独特的魔王路线实践——巴别塔在凯尔希和特雷西斯的协助下最终成为了特蕾西娅派支持者们的统一组织。\n\n这些成就到今天为止都是极其惊人的：作为一座城市的卡兹戴尔也迎来了它的又一次重建，萨卡兹的第一座移动城市将在未来的两百年中成为卡兹戴尔的工业心脏。在特蕾西娅统治卡兹戴尔的两百年中，尽管萨卡兹的家园仍旧动荡不安，天灾频发但是移动医院、移动农牧平台，还有流动学校开始出现在萨卡兹的生活中。"
 kaz_intro.2.a: "继续"

 kaz_intro.3.t: "军事改革，军事委员会路线和巴别塔路线"
 kaz_intro.3.d: "泰拉历 1031 年，高卢帝国覆灭，有 “世界之都” 称号的林贡斯在炮火中彻底化为齑粉，消息震动整个大陆。卡兹戴尔的特蕾西娅与特雷西斯，也很快通过信使得知了这一噩耗。彼时卡兹戴尔的源石工业化试点已初见成效，可特蕾西娅始终忧心：卡兹戴尔的复苏，终有一日会引来完成科技革命的诸国，以现代化战争的方式再度围剿。\n\n于是，在特雷西斯与卡兹戴尔战争王庭的提议下，原战争王庭改组为军事委员会。特雷西斯将军毫无争议地出任委员会最高统帅。此后，特蕾西娅则一面继续深耕基建、教育与医疗，一面着力改善卡兹戴尔的外交处境，先后与炎国、哥伦比亚、萨尔贡等国恢复外交，竭尽所能让更多萨卡兹人摆脱蒙昧与源石病的折磨。\n\n可以说，特蕾西娅以开明的施政立场与体恤平民的政策，最终赢得了萨卡兹民众由衷的爱戴。而特雷西斯则将全部心血倾注于卡兹戴尔军事力量的现代化：继数座移动城市之后，火炮、现代化通讯设备相继列装，卡兹戴尔再度崛起，成为泰拉东陆一支不可小觑的半现代化强权。萨卡兹人都盼着，能在有生之年看到故土完成彻底的工业化。\n\n然而随着魔王丝线流转的还有卡兹戴尔的命运。当卡兹戴尔成长为半工业化强国、接连挫败邻国的几次试探之后，内部的阶级矛盾也骤然尖锐。巴别塔始终坚持以国家近代化、源石病救治为核心的民生路线，可军事委员会与背后的王庭贵族，对萨卡兹世代热衷的征战事业，兴趣不可避免地再度抬头；国家建设中长期积压的矛盾，也随之不断激化。\n\n底层的工农不满工业化后依旧恶劣的生存环境，不满长期计划经济下因封锁而始终匮乏的物资；而另一边，萨卡兹的大贵族集团却在建设与改革中攫取了海量利益。那些世代把持权柄的军事贵族，更盼着卡兹戴尔重现帝国荣光，好为自己的名衔再添勋章。特蕾西娅既不愿屈从贵族的诉求，再将卡兹戴尔绑上战争的战车；也没有足够的魄力与根基，去彻底根治萨卡兹内部的阶级矛盾，打碎沿袭千年的王庭体系。两头拉扯之下，两类矛盾同步激化，卡兹戴尔渐渐陷入了进退维谷的混乱迷局。"
 kaz_intro.3.a: "继续"

 kaz_intro.4.t: "萨卡兹红军和萨卡兹国防军"
 kaz_intro.4.d: "萨卡兹国防军始建于泰拉历 1040 年。四皇会战之后，特雷西斯将军改组王庭战争议会，推动卡兹戴尔的国防力量向近代化常备军转型。军事委员会承接了原战争议会的行政中枢与总参谋部职能，传统的王庭军虽保留了部分建制，但主力大多编入了新的国防军体系。\n\n国防军的传统大多承袭原先的卡兹戴尔各大王庭军。建军之初尚且以效忠卡兹戴尔、效忠魔王为信条，可由于特蕾西娅长期负责民政，军事改革多由特雷西斯一力进行。久而久之，国防军内的激进军官集团与王庭军事贵族纷纷向特雷西斯靠拢，拉拢他作为军方的代言人。特雷西斯也渐渐接受了这个身份，开始为整个军事委员会发声。\n\n萨卡兹红军与萨卡兹共产党，是莱塔尼亚等地的共产主义思潮传入卡兹戴尔后的产物。这股思潮一踏入阶级矛盾早已激化的卡兹戴尔，便在底层工人、农民与青年学生中迅速蔓延。追根溯源，这些激进团体的诞生，恰恰得益于特蕾西娅主导的教育普及。他们最终凝聚成了卡兹戴尔最为激进的武装 —— 萨卡兹红军，在康拉德克内希的带领下，从最初巴别塔麾下的激进派系中独立出来，建起了自己的武装与根据地。特蕾西娅对其采取默许态度，任由他们在移动城市间活动、扩张，尝试改造社会。\n\n他们主张：卡兹戴尔必须以马主义思想为指导，坚持国际主义立场，铲除王庭与贵族势力，通过工农革命建立社会主义新国家，唯有如此，卡兹戴尔才能迎来真正脱胎换骨的复兴，。\n\n红军的国际主义主张与反王庭立场自然引得卡兹戴尔的传统王庭势力暴跳如雷。特蕾西娅包容红军的态度，也让她承受着越来越多来自王庭保守派与军事委员会的压力。更棘手的是，红军内部的激进派势头渐长，甚至喊出了“打倒魔王” 的口号，让特蕾西娅的处境愈发两难。\n\n在这样的僵局里，凯尔希于泰拉历 1076 年唤醒了博士。这位前文明的遗孤苏醒后，得到了特蕾西娅与凯尔希的盛情相待，可在了解了当世局势后，他对巴别塔与卡兹戴尔却表现出了迟疑与冷淡。他向凯尔希提出，要离开卡兹戴尔去泰拉各处游历，待到他认定的 “关键时刻”，自会回来与众人并肩。\n\n最终，特蕾西娅不得已将已成众矢之的的萨卡兹红军暂时划出了自己的阵营。泰拉历 1081 年，军事委员会趁机对发展多年的红军武装发动了突袭。红军虽遭重创，却很快退入卡兹戴尔北部的小片区域，以农村为依托，与军事委员会打起了游击战。这场内战一直持续到 1086 年伦蒂尼姆方向生变。其间，特蕾西娅一派在确保战火不波及卡兹戴尔核心区与巴别塔势力范围的前提下，选择作壁上观，甚至在一定程度上配合了王庭势力对红军控制区的围剿与封锁。\n\n到 1086 年，红军已元气大伤，随后几年间更是大幅缩编，绝大多数组织转入地下活动。在萨卡兹王国政府看来，连年内战早已让红军控制区失去了独立运转、乃至威胁中央的能力；而红军领袖康拉德克内希，正谋划着率部离开卡兹戴尔，转进乌萨斯邻国继续打游击。无论他们回不回来，对焦头烂额的王国政府而言，都算不上坏事 —— 毕竟，政府内部的矛盾，也快要压不住了……"
 kaz_intro.4.a: "继续"

 kaz_intro.5.t: "伦蒂尼姆事件和双头政权"
 kaz_intro.5.d: "泰拉历 1086 年，维多利亚的斯塔福德公爵为在公爵内斗中占据上风，竟向卡兹戴尔求援，邀请萨卡兹部队以 “佣兵” 身份前往伦蒂尼姆助战。这份邀请传回卡兹戴尔，立刻在国内掀起了轩然大波。魔王忧心忡忡：一旦出兵，卡兹戴尔本就恶劣的外交环境只会雪上加霜，战火也会消耗掉来之不易的工农业积累。可特雷西斯与军事委员会却按捺不住，迫切想抓住这次军事冒险的机会，拿下与卡兹戴尔积怨已久的维多利亚首都。\n\n几番争执，双方各退一步：特蕾西娅同意军事委员会率领主力前往伦蒂尼姆，但巴别塔不参与此次行动。而正因军方主力外调，巴别塔与军事委员会在王国政府内的势力对比，反倒形成了一种微妙的平衡。特蕾西娅与凯尔希借着军队调离的由头，反而致力于扩大了巴别塔在本土的影响力，蛰伏并等待着削弱军事委员会本土力量的时机。\n\n正是借着军方主力远走的空当，巴别塔才真正将触手伸进了长期被特雷西斯与王庭贵族把持的国防军。军事委员会进驻伦蒂尼姆后不久，博士也适时回到卡兹戴尔，在魔王的安排下，接任了随军出征的孽茨雷留下的国防军参谋长一职。\n\n对于军事委员会武力占领伦蒂尼姆、反手除掉斯塔福德公爵、自行建立伦蒂尼姆萨卡兹军政府的举动，巴别塔始终保持缄默，却也为军方提供了部分后勤补给。特蕾西娅无意直接激化国内矛盾，对军事委员会的行动抱着几分投机主义心态：她既想借此消耗保守派与军方的本土势力，又不愿立刻撕破脸让冲突全面爆发。\n\n时至泰拉历 1091 年，军事委员会进驻伦蒂尼姆已是第七年。事实证明，作为外来占领者，萨卡兹最多也只能勉强掌控伦蒂尼姆这座巨大的城市。而在这几年间博士凭着手腕与能力已经拉拢了相当一批国防军军官重新凝聚起他们对魔王的忠诚。\n\n随着维多利亚各路公爵的内战渐歇，他们终于将目光重新投向了被萨卡兹占据数年的首都。此时的军委会，在城内陷入了与伦蒂尼姆市民的长期治安战，在城外似乎也无力主动突破各路公爵的合围。巴别塔一方则等着：一旦军委会在维多利亚公爵们的围剿下兵败，便趁势瓦解军委会的权威，清洗军队里的激进军官与军事贵族。博士与凯尔希都清楚，是时候行动了。可特雷西斯也并非毫无察觉，他早已料到，军事委员会终有一日要撤出伦蒂尼姆，回卡兹戴尔直面巴别塔。只是，若有人以为他们会像巴别塔预想的那般轻易退场，那就大错特错了。"
 kaz_intro.5.a: "前进，掌握卡兹戴尔的命运！"
