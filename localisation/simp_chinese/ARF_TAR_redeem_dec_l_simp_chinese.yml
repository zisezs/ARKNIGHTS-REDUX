l_simp_chinese:

 TAR_rd_redeem: "塔拉复国"
 TAR_rd_redeem_desc: "灰烬里的六件事：立名、清算、封锁、火账、赤铁、归乡。"
 TAR_rd_decision_start: "把名字还给我们"
 TAR_rd_decision_start_desc: "塔拉在地图上从未被标注过。这道命令不宣战、不结盟，它只做一件事：让「塔拉」成为一个可以被写进公文的名词。完成后载入复国树。"
 TAR_rd_relic_beetle: "赐出金甲虫"
 TAR_rd_relic_beetle_desc: "「只要它还愿意停留在你身边，你就可以执掌征收谷物的权力。」甲虫会自己挑人，也会自己走掉。"
 TAR_rd_relic_beetle_tt: "金甲虫愿意停留"
 TAR_rd_relic_beetle_tt_desc: "本地资源产出 §G+5.00%§!，政治点数 §G+20§!。"
 TAR_rd_relic_sword: "赐出刑律宝剑"
 TAR_rd_relic_sword_desc: "刑律不再由占领者的口令决定。塔拉人第一次用母语念出判决。"
 TAR_rd_relic_sword_tt: "宝剑愿意停留"
 TAR_rd_relic_sword_tt_desc: "抵抗度 §G-10.00%§!，组织度 §G+5.00%§!。"
 TAR_rd_relic_beast: "赐出申诉云兽"
 TAR_rd_relic_beast_desc: "云兽听过的申诉，比议会十年听过的都多。"
 TAR_rd_relic_beast_tt: "云兽愿意停留"
 TAR_rd_relic_beast_tt_desc: "政治点数每日获取 §G+10.00%§!。"
 TAR_rd_relic_knot: "赐出记事绳结"
 TAR_rd_relic_knot_desc: "历史不写在纸上，写在绳上——绳子不会自己烧起来。"
 TAR_rd_relic_knot_tt: "绳结愿意停留"
 TAR_rd_relic_knot_tt_desc: "抵抗衰减 §G+10.00%§!，研究速度 §G+5.00%§!。"
 TAR_rd_relic_tear: "赐出悲悯泪滴"
 TAR_rd_relic_tear_desc: "悲悯是有预算的。这一件花得最贵，也最难收回。"
 TAR_rd_relic_tear_tt: "泪滴愿意停留"
 TAR_rd_relic_tear_tt_desc: "稳定度 §G+10.00%§!，士气 §R-5.00%§!。"
 TAR_rd_relic_ritual: "赐出仪式剑"
 TAR_rd_relic_ritual_desc: "镶嵌萨尔贡宝石的仪式剑。它不属于任何一位王，只属于被它承认的战场。"
 TAR_rd_relic_ritual_tt: "仪式剑愿意停留"
 TAR_rd_relic_ritual_tt_desc: "突破 §G+10.00%§!，陆军进攻 §G+5.00%§!。"
 TAR_rd_relic_recall: "召回圣物"
 TAR_rd_relic_recall_desc: "召回不是撤职，是让所有人看见：昨夜还能发号施令的人，今晨连门都进不来。"
 TAR_rd_relic_recall_tt: "甲虫不见了"
 TAR_rd_relic_recall_tt_desc: "政治点数 §G+40§!，稳定度 §R-5.00%§!，§Y怨恨记账 +1§!。"
 TAR_rd_returning_fire: "还火"
 TAR_rd_returning_fire_desc: "致辞、点柴、亲眼确认、投烛、对火说话、守到火熄。规程走完，复仇就变成了纪念日。"
 TAR_rd_returning_fire_tt: "火被交还给死者"
 TAR_rd_returning_fire_tt_desc: "稳定度 §G+5.00%§!，战争支持度 §R-5.00%§!，抵抗衰减 §G+5.00%§!，染火计数 §G-1§!。"
 TAR_rd_lend_fire: "借出火"
 TAR_rd_lend_fire_desc: "火可以分出去。分出去的火会在原野、遗迹和人的心里自己增殖。"
 TAR_rd_lend_fire_tt: "火被借出"
 TAR_rd_lend_fire_tt_desc: "民用工厂产出 §G+10.00%§!，抵抗度 §R+5.00%§!，染火计数 §R-1§!。"
 TAR_rd_call_in_fire: "收回火"
 TAR_rd_call_in_fire_desc: "「简直就像在放高利贷。」她说这话时并不羞愧。"
 TAR_rd_call_in_fire_tt: "火被收回"
 TAR_rd_call_in_fire_tt_desc: "稳定度 §R-10.00%§!，陆军进攻 §G+5.00%§!，染火计数 §R+2§!。"
 TAR_rd_keep_curfew: "钟继续敲"
 TAR_rd_keep_curfew_desc: "城里确实还藏着没有落网的人。灯留到九点，也许就够他们走完一条街。"
 TAR_rd_keep_curfew_tt: "钟继续敲"
 TAR_rd_keep_curfew_tt_desc: "抵抗度 §G-5.00%§!，消费品消费 §R+5.00%§!。"
 TAR_rd_lift_curfew: "零点之后再无宵禁"
 TAR_rd_lift_curfew_desc: "没了宵禁，大家想喝到几点都行。第二天早上，酒馆门口少了两个人。"
 TAR_rd_lift_curfew_tt: "钟被拆了"
 TAR_rd_lift_curfew_tt_desc: "摘除精神「熄火钟之下」，稳定度 §G+10.00%§!，抵抗度 §R+10.00%§!。"
 TAR_rd_proclaim_holy_tara: "宣告神圣塔拉"
 TAR_rd_proclaim_holy_tara_desc: "文书官说「塔拉」已经写进公文了，可公文还缺一样东西：一个让人愿意为它去死的名词。有人提议在前面加上「神圣」二字——不为供奉哪位神，只为当场讲清楚：这片土地不再属于任何一位公爵。"
 TAR_rd.1.t: "塔拉，写进公文的名词"
 TAR_rd.1.d: "文书官把一沓空白表格抱进王城废墟：出入境申请、土地登记、死亡证明。他说，一个国家是从表格开始存在的。殿下要立的旗，先要有人肯为它填表。"
 TAR_rd.1.a: "那就开始填。"
 TAR_rd.3.t: "棺中没有遗体"
 TAR_rd.3.d: "盖子被撬开时，所有人都看清了：里面只躺着那杆喷吐火焰的枪。有人开始哭，有人开始算——算这座城还能撑住几个说法。"
 TAR_rd.3.a: "宣布神迹：红龙复生。"
 TAR_rd.3.a.tt: "神迹不需要证据，只需要有人肯讲第二遍。§R讲到第三遍时，会有人要求开棺。§!"
 TAR_rd.3.b: "宣布退位：她把王座让给了活着的人。"
 TAR_rd.3.c: "宣布死亡：承认她死了。"
 TAR_rd.3.c.tt: "承认死亡，也就承认了另一些事：§Y是谁开的枪，谁抬的棺，谁至今还不知道真相。§!"
 TAR_rd.4.t: "没了宵禁的第三夜"
 TAR_rd.4.d: "酒馆散得比想象中早。有人在巷口被人用锄头打死，凶器据说是当年砸向维多利亚士兵的那一把。城里的探子还没落网，而愤怒已经先一步开始自己抓人。"
 TAR_rd.4.a: "公开审判，一个都不许私刑。"
 TAR_rd.4.b: "让名单先安静下来。"
 TAR_rd.4.b.tt: "§R「名单」会被记住，也迟早会被清算。§!"
 TAR_rd.5.t: "火不肯回到一个人手里"
 TAR_rd.5.d: "收回来的火比借出去的更多。它们在牧场、遗迹与死者的名字之间乱撞；驮兽不吃草，鳞兽不产奶，新生的频频夭折。"
 TAR_rd.5.a: "办一场全城还火。"
 TAR_rd.5.a.tt: "火被交还给火之主。§G染火计数 -2§!。"
 TAR_rd.5.b: "让火继续烧。"
 TAR_rd.5.b.tt: "§Y怨恨记账 +1§!。稳定度下降，但前线会听见这件事。"
 TAR_rd.6.t: "甲虫不见了"
 TAR_rd.6.d: "空了的展柜前站着三个人，谁都不肯先说那件圣物曾经停在谁的手边。他们记得的不是俸禄，是在被召回的那晚自己仍然跪着。"
 TAR_rd.6.a: "把库房锁上，明天照常收粮。"
 TAR_rd.6.a.tt: "§Y怨恨记账 +1§!。清洗可以换来政治点数，换不来一个愿意替你收粮的人。"
