# ==============================================================================
#  大炎 · SideStory 事件链 —— 五条链共用的机制提示键
#  · 四大机制变量的 add_to_variable 在游戏里只会显示裸 ID，所以一律配
#    custom_effect_tooltip，键名规则：yan_ss_<机制>_<p|m><数值>_tt
#      p = 加，m = 减
#  · 颜色按「对玩家好坏」上色，不按数值正负：
#      岁兽苏醒度 涨=§R 降=§G      代理人信任 涨=§G 降=§R
#      书刀完整度 涨=§G 降=§R      不反准备度 涨=§G 降=§R
#  · 五条链（洪炉示岁/将进酒/画中人/登临意/相见欢）都从这里取键，
#    要加新档位就在这张表里补，别在各链的 loc 里另起炉灶。
# ==============================================================================

