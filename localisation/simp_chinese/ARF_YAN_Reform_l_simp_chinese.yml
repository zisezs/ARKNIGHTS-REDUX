# ---- 国策名称 ----
YAN_reform_1:0 "炎佑千年"
YAN_reform_2:0 "龙门惨案"
YAN_reform_3:0 "山海众大串联！"
YAN_reform_4:0 "感染者非法集结！"
YAN_reform_5:0 "国难思良将"
YAN_reform_6:0 "为大炎..增援近卫局！"
YAN_reform_7:0 "司岁台在行动"
YAN_reform_8:0 "狠踹他妈的睚！"
YAN_reform_9:0 "为大炎...炮打贫民窟！"
YAN_reform_10:0 "为大炎...调动玉门守军！"
YAN_reform_11:0 "乱世用重典"
YAN_reform_12:0 "皆为利往"
YAN_reform_13:0 "猛揍操蛋的矩！"
YAN_reform_14:0 "榨干狗日的岁！"
YAN_reform_15:0 "炎祚恢弘..."

# ---- 国策描述 ----
 YAN_reform_1_desc:0 "岁序更新，丹墀之下还站得齐人，这一年就算熬过去了。"
 YAN_reform_2_desc:0 "还有什么事情是比屠杀躲在下水道里面的感染者更有趣的吗？"
 YAN_reform_3_desc:0 "接下来的起义会很疯狂。"
 YAN_reform_4_desc:0 "唉，大炎百姓跟邪恶的魔族佬学坏了…"
 YAN_reform_5_desc:0 "要不是左乐他们年纪太小，我也不会把这三位拉出来… "
YAN_reform_6_desc:0 "龙门吃紧，玉门的兵该动就得动。八队机动步兵、四队重装，都是跟老夫守过边关的，拉去巷战是屈才，可战局不等人。兵派出去，城就得有人守，两头都不能空。\n——太尉，在军帐里批军报时发言"
 YAN_reform_7_desc:0 "明烛以驱巨兽之影，巡游以察社稷之患。"
 YAN_reform_8_desc:0 "那条痨病兽也敢闯我的地盘？*炎国粗口*！岁老二不安生，连带这些小畜生都学会龇牙了。放火烧！烧干净了我亲自去陇山走一趟，看看还有几个没死透的往哪儿爬。残山剩水，经得住我几把火？"
 YAN_reform_9_desc:0 "还有什么事情是比屠杀躲在下水道里面的感染者更有趣的吗？\n答：用炮轰 😋"
 YAN_reform_10_desc:0 "§Y “唉。”\n——重岳§!"
YAN_reform_11_desc:0 "乱世用重典，我这几日也想过了。重典不在刑加三等，在让每一条律都有人去执行。篡改有罪，可事出有因的，治罪之余也要看清缘由；借乱世之名行私刑之实的，炎律一寸不让。五音正德，一日不忘。\n——均，在公堂听审时发言"
YAN_reform_12_desc:0 "天下熙熙，皆为利来；天下攘攘，皆为利往。乱世里人心最实，利在哪，人就在哪。要做成事，先把账算明白：谁出资、谁担险、谁分红，两边背一样的风险，买卖才做得长久。谁都会讲，肯照着做的没几个。\n——绩，在账房拨算盘时发言"
 YAN_reform_13_desc:0 "我是无辜的… "
 YAN_reform_14_desc:0 "岁老二，该展现你的忠诚了！ "
 YAN_reform_15_desc:0 " 我们的大炎正在落蒸日上哦。"

# ---- 事件：标题 / 正文 / 选项 ----
yan_reform.1.t:0 "千年帝国的又一年"
yan_reform.1.d:0 "§W〔旁白〕§!：百灶的除夕，竟落了薄雪。宫灯自黄昏燃起，一直亮到子时。丹墀下两列朝臣，靴底早已冻透，却无人敢挪动半步。\n§Y真龙§!：「又是一年了。」\n§M太傅§!：「回陛下，又是一年。」\n§Y真龙§!：「每逢今夕，朕都要站在这儿说同一番话。说完了，这雪也就该停了。」\n§M太傅§!：「瑞雪何时停，不看陛下的金口。」\n§Y真龙§!：「那看什么？」\n§M太傅§!：「看明岁此时，这丹墀之下，是否还站得齐这满朝朱紫。」\n§W〔旁白〕§!：真龙默然片刻，抬了抬手，示意开宴。\n§Y真龙§!：「……那就站齐了给朕看。」\n§W〔旁白〕§!：殿外乐声起了。太傅没接这句话。"
yan_reform.1.a:0 "愿大炎岁岁如此。"

yan_reform.2.t:0 "为帝三十载"
yan_reform.2.d:0 "§W〔旁白〕§!：真龙在百灶登极，那是三十五年前的正月。今夜御案东角堆起玉门、龙门、大荒的八百里加急。朱笔搁在笔山上，一夜未动。\n§Y真龙§!：「三十五年了。」\n§M太傅§!：「是，陛下御极已三十五载。」\n§Y真龙§!：「朕初登大宝那年，这案上的折子，也是垒得这般高。」\n§M太傅§!：「当年折子压案，是因为先帝病重。而今折子不发——」\n§Y真龙§!：「是因为朕老了？」\n§M太傅§!：「……当年先帝也曾问过老臣同一句话。」\n§Y真龙§!：「先帝怎么说的？」\n§M太傅§!：「先帝说，他是把这江山看老的。」\n§Y真龙§!：「……朕知道了。」"
yan_reform.2.a:0 "朕知道了。"

yan_reform.3.t:0 "严惩下水道的感染者！"
yan_reform.3.d:0 "§W〔旁白〕§!：龙门下城区的暗渠里，藏匿的感染者被连夜锁拿，铁索连环，押出地面。天未亮，定罪的榜文便已贴上城门，浆糊犹湿。\n§Y龙门官吏§!：「罪名拟了三条：私聚、传疫、图谋不轨。」\n§G左乐§!：「『图谋不轨』四字，可有实证？」\n§Y龙门官吏§!：「上头定的。秉烛人若是嫌罪名轻了，下官还能再添几笔。」\n§G左乐§!：「……再添，这暗渠里就更没人肯自己走出来了。」\n§Y龙门官吏§!：「那依左大人之见？」\n§G左乐§!：「按律，照榜文办。只一条——名册上的人，一个都别漏。姓甚名谁，家住哪条巷，全记清楚。」\n§Y龙门官吏§!：「记这么细做什么？」\n§G左乐§!：「将来若有人要翻案，总得知道该替谁翻。」\n§W〔旁白〕§!：晨风穿堂而过，城门下的行人匆匆扫过榜文，皆低头快步离去。左乐把那本名册收进袖中，指节捏得发白。"
yan_reform.3.a:0 "乱世须用重典。"

yan_reform.4.t:0 "多处军械库遇袭！"
yan_reform.4.d:0 "§W〔旁白〕§!：五更时分，龙门外围七座冶造司武库同时断了梆声。待天明查验，守卒皆尸首不全，唯余玄铁大门上几道被源石技艺生生熔穿的焦口。\n§G左乐§!：「秉烛人左乐回禀：一夜之间，七座武库尽毁，戍卫无一生还。」\n§R太尉§!：「何人所为？」\n§G左乐§!：「现场未留活口，也未留徽记。库中军械箭矢，分毫无损。只是那几道熔口——不似寻常源石技艺，倒像有人拿巨兽的骨头做了引子。」\n§R太尉§!：「破库而不劫掠，那是奔着杀人立威来的。」\n§M太傅§!：「只怕不止于此。贼人这是在向朝廷递话——大炎的武库重地，他们如入无人之境。」\n§G左乐§!：「明烛以驱巨兽之影，巡游以察社稷之患。此事已记入司岁台卷宗，臣请彻查。」\n§Y真龙§!：「查。给朕一查到底。」"
yan_reform.4.a:0 "查，一查到底。"

yan_reform.5.t:0 "整合运动死灰复燃！"
yan_reform.5.d:0 "§W〔旁白〕§!：白底黑纹的残破旧旗，一夜之间又挂上了龙门贫民窟的断壁。前月才清剿过的死胡同里，有人趁夜挨门塞入油印的传单，墨迹粗劣，却扎眼得很。\n§Y近卫局官员§!：「传单上只有四个字：『砸碎镣铐』。落款画了九道杠。」\n§R太尉§!：「九道杠？什么东西？」\n§Y近卫局官员§!：「整合运动龙门支部的记号。领头的那个叫九——三年前从近卫局走的，当年她的警衔，比陈组长还高一级。」\n§M太傅§!：「近卫局的人，反过来领着感染者打近卫局。」\n§Y近卫局官员§!：「这半年，下城区十几处暗渠的感染者，是她一家一家串起来的。」\n§R太尉§!：「哼，一群苟延残喘的乌合之众，也配谈这四个字？」\n§M太傅§!：「太尉此言差矣。正因为是光脚的乌合之众，一旦聚沙成塔，才最是棘手。」\n§Y真龙§!：「龙门那边，是个什么章程？」\n§Y近卫局官员§!：「近卫局上表请旨：调兵，封城。」\n§M太傅§!：「封城容易。只是城门落了锁，那些塞进砖缝里的纸页，可不会自己烂掉。」"
yan_reform.5.a:0 "调兵，封城。"

yan_reform.6.t:0 "吾日三省吾身"
yan_reform.6.d:0 "§W〔旁白〕§!：龙门的伤亡折子呈上御案时，真龙并未动怒摔笔。他只是将折页翻至末尾，盯着那行朱笔小字，看了许久。\n§Y真龙§!：「这末页的抚恤数目，是户部核的，还是兵部录的？」\n§M太傅§!：「回陛下，是兵部录的。」\n§Y真龙§!：「传旨，叫他们重新核录。」\n§M太傅§!：「陛下的意思是……」\n§Y真龙§!：「朕想知道，究竟是朕看错了行，还是他们点错了人头。」\n§M太傅§!：「……老臣这便去问。」\n§Y真龙§!：「问清了再告诉朕：填平龙门这个窟窿，朕还得往里头填多少大炎儿郎。」\n§M太傅§!：「老臣遵旨。」\n§Y真龙§!：「传朕旨意，继续进兵。」\n§W〔旁白〕§!：太傅退到殿门时，听见身后传来一句极轻的话。\n§Y真龙§!：「数目对不上，比吃了败仗还难看。」"
yan_reform.6.a:0 "传朕旨意，继续进兵。"

yan_reform.7.t:0 "谈天师大破山海众！"
yan_reform.7.d:0 "§W〔旁白〕§!：陇山道口，山海众北窜的退路被彻底截断。两军阵前既无旗号，亦无劝降。\n§Y传令兵§!：「报——！天师府老天师亲至，随行仅三人！」\n§R太尉§!：「胡闹！区区四人去截山海众，与送死何异？」\n§Y传令兵§!：「回太尉，非也！老大人只说了一句『借这山道烧一炉炭』，便开了法坛。真火自午时一直烧到日落。如今……如今整条陇山道上的碎石，全化作琉璃了！」\n§W〔旁白〕§!：大殿之内，落针可闻。\n§R太尉§!：「……好！山海孽党，亦不过如此！」\n§M太傅§!：「太尉喜色太早了。这火烧得越干净，漏网的那些畜生，往后反扑起来便越是疯魔。」\n§G左乐§!：「臣请往陇山走一趟。火烧完，人还在。总得有人去清点，那些没烧死的人，往哪儿去了。」\n§Y真龙§!：「准。」"
yan_reform.7.a:0 "山海众，不过如此。"

yan_reform.8.t:0 "矩兽不对袭击负责"
yan_reform.8.d:0 "§W〔旁白〕§!：矩兽趁夜越过界碑，一脚便踏平了半座县城。天亮后，幸存的百姓抬着门板与尸首，将县署大门堵得水泄不通。\n§Y县署主簿§!：「《大炎律》只管人祸，不管巨兽。这状纸，本官立不了案。」\n§W〔旁白〕§!：第三日，老天师提着一把旧扇子，独自寻到了矩兽栖身的废矿。\n§Y老天师§!：「矩！你那一脚，半座县城没了。天师府替你记着这笔账。」\n§B矩§!：「……我记得。那几日浑浑噩噩，踩下去多沉，我记得。」\n§Y老天师§!：「记得管什么用？山海众打着你的旗号烧城、杀官，连驿道都给断了，你倒躲得清净。」\n§B矩§!：「他们早不听我的了。」\n§Y老天师§!：「那就让他们听！今日给老身一句准话：你亲自下山，当着天下人的面说清楚，山海众不再是你矩的东西。要是不肯——老身这就拆了你这副壳子，一块一块丢进岁陵底下，让你慢慢想。」\n§W〔旁白〕§!：废矿里静了很久。\n§B矩§!：「不必拆。我下山。」\n§B矩§!：「我会告诉他们：矩不认山海众如今这条路。他们借我的名，做的是我最不齿的事。」\n§Y老天师§!：「……早这么说不就完了。」\n§W〔旁白〕§!：老天师把扇子一合，走了两步，又停下。\n§Y老天师§!：「记着，你这条命，如今捏在老身手里。」\n§W〔旁白〕§!：奏报递进百灶。真龙看完折子，把朱笔搁下。\n§Y真龙§!：「肯开口就好。省得朕的兵跑去跟一头畜生较劲。」"
yan_reform.8.a:0 "那就把它当畜生打。"

yan_reform.9.t:0 "搞么子...说话！"
yan_reform.9.d:0 "§W〔旁白〕§!：龙门派来哭穷的通判跪在殿槛外，骈四俪六的套话背了一盏茶的工夫，愣是没敢提一个「钱」字。\n§Y龙门通判§!：「……是以龙门百业凋敝，黎庶仰赖天恩，臣泣血伏惟圣上——」\n§W〔旁白〕§!：真龙不耐烦地抬手，截断了他的吟诵。\n§Y真龙§!：「少背那些酸文。朕只问你，龙门到底缺多少银子？」\n§Y龙门通判§!：「这、这个……回陛下，臣需先按户部的章程，自前岁算起——」\n§C望§!：「搞么子？一句话的数目，翻什么老账？」\n§Y重岳§!：「说话。」\n§W〔旁白〕§!：青瓷茶盏被重重扣在御案上，发出一声脆响。通判吓得浑身一颤，死死伏在金砖上，半晌，才哆哆嗦嗦地报出了一个实数。\n§M太傅§!：「陛下息怒。」\n§Y真龙§!：「朕没怒。朕是听不得废话。」"
yan_reform.9.a:0 "说人话。"

yan_reform.10.t:0 "当变则变！"
yan_reform.10.d:0 "§W〔旁白〕§!：近卫局的蓝旗重新升上龙门钟楼。城外的残火余烟，整整飘了三天三夜才彻底散尽。\n§B陈晖洁§!：「龙门近卫局特别督察组组长，陈晖洁。回禀陛下：整合运动残部已不成建制，正仓皇北窜。」\n§R太尉§!：「退得好！臣请旨趁势掩杀，定要将其斩草除根！」\n§M太傅§!：「太尉打算追到何处？莫非要率大炎边军，一路追进乌萨斯的冻土里去？」\n§R太尉§!：「你——！难道就放任这群反贼喘过这口气？！」\n§B陈晖洁§!：「太尉。龙门这一仗，近卫局折了四百七十六人，下城区烧了三条街。」\n§W〔旁白〕§!：殿上一静。\n§B陈晖洁§!：「追出去容易。可追出去的兵，是从哪座城调的？那座城，又由谁来守？」\n§Y真龙§!：「众卿。」\n§W〔旁白〕§!：真龙开口，殿上的争执戛然而止。\n§Y真龙§!：「龙门之事，朕今日不问任何人的罪。」\n§M太傅§!：「那陛下意欲何为？」\n§Y真龙§!：「朕想问问诸位爱卿，经此一役，大炎往后的路，该怎么走。」\n§W〔旁白〕§!：太傅深深躬下身去，良久未曾抬头。\n§M太傅§!：「……大厦既见裂痕，便唯有，查漏补缺，更张旧制。」"
yan_reform.10.a:0 "那就变。"

yan_reform.11.t:0 "邪恶的非法组织流亡乌萨斯"
yan_reform.11.d:0 "§W〔旁白〕§!：最后一支整合运动残部蹚过冰冷的界河，彻底没入乌萨斯南境的暴风雪中。近卫局的警司们驻足于大炎界碑一侧，手按刀柄，终究未越雷池一步。\n§Y近卫局官员§!：「大人，当真就这么放他们走了？」\n§B陈晖洁§!：「界碑以外，不是龙门的辖地。」\n§Y近卫局官员§!：「可他们手上，还沾着我们不少弟兄的血！」\n§B陈晖洁§!：「我知道。」\n§W〔旁白〕§!：河对岸，一个穿旧制服的女人回过头来。她隔着风雪，朝界碑这边看了一眼。\n§C九§!：「陈。」\n§B陈晖洁§!：「……Only-1。」\n§C九§!：「这个代号，我早就不用了。」\n§B陈晖洁§!：「在我这儿，还没销号。」\n§C九§!：「那就销了吧。」\n§W〔旁白〕§!：九拢了拢被风掀起的衣角，没有往前走。\n§C九§!：「我带走的人，往后不叫龙门人了。可他们到底是从龙门走出去的——你记着这一点。」\n§B陈晖洁§!：「我会记着。」\n§C九§!：「总得有人给他们留一点点敬意。」\n§W〔旁白〕§!：九转身走进风雪，没有再回头。\n§W〔旁白〕§!：三日后，百灶收到龙门奏报，只有八个字：残部北遁，界河已清。\n§M太傅§!：「走了干净。」\n§R太尉§!：「可他们手上，还沾着我们不少弟兄的血！」\n§M太傅§!：「北边的雪原会替你们讨这笔血债的。冻死在乌萨斯的孤魂，与死在刀下的亡魂，到头来，都在同一本生死簿上。」"
yan_reform.11.a:0 "由他们去。"

# ---- 动态民族精神 ----
YAN_reform_infected_crisis:0 "感染者问题积重难返..."
YAN_reform_infected_crisis_desc:0 "龙门的血渗进下水道，也渗进朝堂。感染者问题不再是几份卷宗，而是每月都在流失的民心与军心。"
YAN_reform_infected_solved:0 "大炎不存在感染者问题！"
YAN_reform_infected_solved_desc:0 "近卫局的旗重新插上城头，朝廷终于可以对内外宣称：大炎不存在感染者问题。至于这句话有几分是真的，只有写诏书的人知道。"

