YAN_reform_tunnel_warfare_desc:0 "龙门街巷被改成了战场：断墙、地道、暗门，守军熟悉每一处转角。代价是他们再也打不了一场堂堂正正的进攻。"
YAN_reform_naval_bombardment_org:0 "遭到舰炮轰炸！"
YAN_reform_naval_bombardment_org_desc:0 "舰炮把整片街区犁了一遍。补给线断了，部队在瓦砾与硝烟里重新集结，组织度一时难以恢复。"

