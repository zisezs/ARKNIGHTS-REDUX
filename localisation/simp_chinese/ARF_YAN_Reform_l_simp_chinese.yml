# ---- 国策名称 ----
YAN_reform_1:0 "炎佑千年"
YAN_reform_2:0 "龙门惨案"
YAN_reform_3:0 "山海众大串联！"
YAN_reform_4:0 "感染者非法集结！"
YAN_reform_5:0 "国难思良将"
YAN_reform_6:0 "为大炎..增援近卫局！"
YAN_reform_7:0 "司岁台在行动"
YAN_reform_8:0 "狠踹他妈的睚！"
YAN_reform_9:0 "为大炎...炮打贫民窟！"
YAN_reform_10:0 "为大炎...调动玉门守军！"
YAN_reform_11:0 "乱世用重典"
YAN_reform_12:0 "皆为利往"
YAN_reform_13:0 "猛揍操蛋的矩！"
YAN_reform_14:0 "榨干狗日的岁！"
YAN_reform_15:0 "炎祚恢弘..."

# ---- 国策描述 ----
YAN_reform_1_desc:0 "真龙在位三十年，百灶的钟声仍按旧历敲响。朝臣跪在丹墀下称颂盛世，没人敢提龙门下水道里那些还没冷透的尸体。"
YAN_reform_2_desc:0 "近卫局封了下水道，火把照进去，墙上的血比砖还厚。感染者被拖出来时还在喊「我们也是大炎子民」，回答他们的是枪托。"
YAN_reform_3_desc:0 "军械库一间接一间地失守，山海众的旗子从山里插到官道上。朝廷清点损失，发现丢的不只是枪，还有人心。"
YAN_reform_4_desc:0 "整合运动在龙门废墟里重新聚拢，旧日的口号被刷上墙。守军退进街垒，才发现脚下的地皮早已不属于自己。"
YAN_reform_5_desc:0 "龙门起义爆发，朝廷这才想起那些被冷落的将领。兵符连夜送出百灶，可接令的人先问了一句：现在才想起来？"
YAN_reform_6_desc:0 "近卫局的防线缩到总督府门前，玉门的军械与壮丁沿驿道南下。朝廷要的不是一场胜仗，是让龙门人看见谁还站着。"
YAN_reform_7_desc:0 "司岁台的灯连着几夜没灭，卷宗从岁陵搬到朝堂。他们不再只盯着代理人，也开始清点那些被感染者问题拖垮的州县。"
YAN_reform_8_desc:0 "睚的爪印留在军械库的墙上，也留在阵亡名册的边角。天师府接了令，这一回不谈安抚，只谈怎么把它从城里撵出去。"
YAN_reform_9_desc:0 "舰炮调转炮口，轰的不是敌军阵地，是龙门最密的贫民窟。第一轮齐射过后，巷道被瓦砾填平，活下来的人开始往外爬。"
YAN_reform_10_desc:0 "玉门守军拔营时，边关的雪还没化。重装师沿着官道开进龙门，履带碾过的地方，百姓自动让出一条路。"
YAN_reform_11_desc:0 "诏令一道接一道：宵禁、连坐、就地正法。朝堂上有人拍手称快，也有人低头数着，这一回又要填进去多少人。"
YAN_reform_12_desc:0 "龙门一乱，东陆的生意全乱了。朝廷终于明白，喊了多年的「教化」，不如一张能兑现的税单，和一队肯护商的兵。"
YAN_reform_13_desc:0 "矩兽在城外留下新的焦痕，灾民说它比整合运动更像天灾。天师府不再等它开口，先把符阵布到了它常出没的山口。"
YAN_reform_14_desc:0 "岁片被一尊尊请出祠堂，安置进朝廷新设的「供奉」里。香火照旧，只是这一次，香火钱和术式都归了司岁台。"
YAN_reform_15_desc:0 "龙门近卫局的旗插回城头，整合运动的残部往北退去。百灶的钟声再响时，没有人再提下水道里的那场清洗。"

# ---- 事件：标题 / 正文 / 选项 ----
yan_reform.1.t:0 "千年帝国的又一年"
yan_reform.1.d:0 "除夕的百灶落了一场薄雪。宫城上的灯从黄昏亮到子时，朝臣在丹墀下站成两排，等着真龙说出那句每年都要说的话。"
yan_reform.1.a:0 "愿大炎岁岁如此。"

yan_reform.2.t:0 "为帝三十载"
yan_reform.2.d:0 "三十年前的今日，真龙在百灶即位。三十年后，玉门、龙门、大荒的奏折堆满御案，每一本都在说同一件事：这个帝国病了。"
yan_reform.2.a:0 "朕知道了。"

yan_reform.3.t:0 "严惩下水道的感染者！"
yan_reform.3.d:0 "龙门下水道里藏着的感染者被连夜拖出，罪名写在告示上：非法聚集、传播矿石病、图谋不轨。城门口的告示栏前，没人敢站太久。"
yan_reform.3.a:0 "乱世须用重典。"

yan_reform.4.t:0 "多处军械库遇袭！"
yan_reform.4.d:0 "一夜之间，龙门周边七座军械库同时遇袭。守库的兵要么死了，要么不见了，库门上只留下一道道被源石技艺烧穿的痕迹。"
yan_reform.4.a:0 "查，一查到底。"

yan_reform.5.t:0 "整合运动死灰复燃！"
yan_reform.5.d:0 "整合运动的旗子重新出现在龙门旧城区。那些本该被清干净的巷道里，又有人开始分发传单，传单上写着四个字：砸碎镣铐。"
yan_reform.5.a:0 "调兵，封城。"

yan_reform.6.t:0 "吾日三省吾身"
yan_reform.6.d:0 "龙门战报送到御案上时，真龙没有发火。他只是把折子翻到最后一页，看了很久那个数字，然后问身边的人：朕是不是听错了什么。"
yan_reform.6.a:0 "传朕的话，继续进兵。"

yan_reform.7.t:0 "谈天师大破山海众！"
yan_reform.7.d:0 "天师府的老天师在陇山道上截住了山海众的主力。没有列阵，没有劝降，只有一场从午后烧到天黑的雷火。"
yan_reform.7.a:0 "山海众，不过如此。"

yan_reform.8.t:0 "矩兽不对袭击负责"
yan_reform.8.d:0 "矩兽又一次从山里出来，撞塌了半座县城。灾民抬着尸体去衙门讨说法，衙门的回答很干脆：那东西不是人，没法问责。"
yan_reform.8.a:0 "那就把它当畜生打。"

yan_reform.9.t:0 "搞么子...说话！"
yan_reform.9.d:0 "龙门来的使者跪在殿外，说了半天的官话，没有一句说到点子上。真龙把茶盏放下，问他：搞么子，说话。"
yan_reform.9.a:0 "说人话。"

yan_reform.10.t:0 "当变则变！"
yan_reform.10.d:0 "龙门近卫局的旗重新插上城头，整合运动的残部向北退去。百灶的朝会上，真龙第一次没有问「谁的责任」，只问「接下来怎么办」。"
yan_reform.10.a:0 "那就变。"

yan_reform.11.t:0 "龙门整合运动流亡乌萨斯"
yan_reform.11.d:0 "整合运动的残部越过边境，消失在乌萨斯的雪原里。龙门人没有追，他们忙着清理废墟，也忙着忘掉这场起义曾经离自己多近。"
yan_reform.11.a:0 "由他们去。"

# ---- 动态民族精神 ----
YAN_reform_infected_crisis:0 "感染者问题积重难返..."
YAN_reform_infected_crisis_desc:0 "龙门的血渗进下水道，也渗进朝堂。感染者问题不再是几份卷宗，而是每月都在流失的民心与军心。"
YAN_reform_infected_solved:0 "大炎不存在感染者问题！"
YAN_reform_infected_solved_desc:0 "近卫局的旗重新插上城头，朝廷终于可以对内外宣称：大炎不存在感染者问题。至于这句话有几分是真的，只有写诏书的人知道。"

# ---- 民族精神 ----
YAN_reform_broken_shackles:0 "砸碎镣铐"
YAN_reform_broken_shackles_desc:0 "补给靠抢，阵地靠人命填。起义军没有后方，也就没有退路。"

# ---- 决议 ----
YAN_Reform:0 "变革"
YAN_Reform_desc:0 "龙门惨案之后的善后与镇压。"
YAN_mission_purge_infected:0 "扫清一切害人虫..."
YAN_mission_purge_infected_desc:0 "六十天内清干净龙门的下水道。清不干净，龙门就会替朝廷清。"

# ---- 动态修正 ----
YAN_reform_tunnel_warfare:0 "地道战"
YAN_reform_tunnel_warfare_desc:0 "龙门街巷被改成了战场：断墙、地道、暗门，守军熟悉每一处转角。代价是他们再也打不了一场堂堂正正的进攻。"
YAN_reform_naval_bombardment_org:0 "遭到舰炮轰炸！"
YAN_reform_naval_bombardment_org_desc:0 "舰炮把整片街区犁了一遍。补给线断了，部队在瓦砾与硝烟里重新集结，组织度一时难以恢复。"

