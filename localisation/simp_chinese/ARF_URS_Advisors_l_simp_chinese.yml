 # ---- 萨米雪原的战鼓雷鸣 / 老天师的疑虑 ----
 SAM_eternal_hunt: "永恒狩猎"
 SAM_eternal_hunt_desc: "萨米不种地，不铸币，不筑城。萨米在雪原上追逐兽群，一追就是三千年。\n\n§Y陆军攻击 +100%§!／§Y补给消耗 -90%§!／§Y组织度 +100%§!"
 YAN_purge_demonic_threat: "清除邪魔威胁"
 YAN_purge_demonic_threat_desc: "岁兽的气息变了。那里面混进了不属于泰拉的东西。大炎不能坐视一个被邪魔占据的帝国横亘在北境。\n\n出兵的时机已经到了。"
 YAN_Fool_Threat_Category: "清除邪魔威胁"
 YAN_Fool_Threat_Category_desc: "大炎·司岁台\n\n§Y邪魔易主，其国可伐。§!"
