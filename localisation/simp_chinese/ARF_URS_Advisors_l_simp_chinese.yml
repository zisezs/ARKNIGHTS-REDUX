 # ---- 隐藏事件 ----
 fool_urs.1.t: "阿洛伊泽的选择"
 fool_urs.1.d: "命令送出去之后，阿洛伊泽把门锁上，从制服内袋里取出一枚铁徽章——和别乔克那枚一模一样。\n\n她把它放在桌上，盯着看了很久。窗外是圣愚卫队巡逻的脚步声，均匀、整齐、没有一丝多余的杂音。\n\n她还有一条线可以拉。拉下去，也许能撬动什么；不拉，她就还是那个「把命令送到三个集团军的人」。"
 fool_urs.1.a: "把徽章收回去"
 fool_urs.1.b: "把徽章送出去"
 fool_urs.2.t: "第三局地下室"
 fool_urs.2.d: "地下室的门是铁的，锁是第三局自己打的。局长把钥匙放在桌上，没有说它通向哪里。\n\n档案就在里面：邪魔的原始记录，第一份锚定报告，以及一份署名为「凯尔希」的封锁指令抄本。圣愚翻过了第三局的墙——但它没找到楼梯。"
 fool_urs.2.a: "把档案烧掉"
 fool_urs.2.b: "把档案留着"
 fool_urs.3.t: "邻国的恐惧"
 fool_urs.3.d: "莱塔尼亚的质问信写得很客气，维多利亚的写得很短，卡西米尔的没有写——他们只是把边境的商队全部撤了回去。\n\n沃伦佐娃夫人在回信里用了三个「遗憾」，两个「理解」，和一个谁都不会当真但谁都必须接受的「未来」。\n\n她把最后一封放进抽屉时，手停了一下。抽屉最深处，是她自己家族的旧族徽。"
 fool_urs.3.a: "照常回信"
 fool_urs.3.b: "不再回信"
 fool_urs.4.t: "敲钟者"
 fool_urs.4.d: "那口钟还挂在矿井口。三十年没人动过它，铁锈已经把它和支架长在了一起。\n\n别乔克每天去看它一次。她伸手够过钟绳，然后又收回来。\n\n「你敲不响的。」那个声音还在。她已经开始怀疑，到底是钟敲不响，还是她已经不想敲了。"
 fool_urs.4.a: "把钟绳割断"
 fool_urs.4.b: "每天都去看它"
 fool_urs.5.t: "源石计划"
 fool_urs.5.d: "石棺深处的流体停止了翻涌。普瑞赛斯的声音落下来，像一句判词，又像一句邀请：\n\n「源石计划将继续。乌萨斯是第一个，但不是最后一个。」\n\n凯尔希问她：「你还要继续找吗？」\n\n「我会继续找。」她说，「但这一次，我不会再相信任何空壳。」"
 fool_urs.5.a: "记下这句话"
 fool_urs.5.b: "把这一页撕掉"
 fool_urs.6.t: "萨米雪原的战鼓雷鸣"
 fool_urs.6.d: "雪原的尽头响起了鼓声。不是乌萨斯的军鼓——那是一种更古老、更原始的节奏，鼓面是用兽皮和骨头缝的。\n\n萨米的猎人们放下了雪橇，拿起了祖辈的弓。他们的眼睛不是灰色，也不是黑色——是雪原本身的颜色。\n\n萨米不皈依。萨米不跪下。萨米狩猎。"
 fool_urs.6.a: "应战"
 fool_urs.6.b: "以为那只是风声"
 fool_urs.7.t: "老天师的疑虑"
 fool_urs.7.d: "岁兽的气息变了。原来那是一头巨兽的呼吸，而现在——那呼吸里混进了别的东西，一种不属于泰拉的、灰色的东西。\n\n老天师在司岁台里坐了三天。第四天，他写下了八个字：\n\n「邪魔易主，其国可伐。」\n\n但司岁台的老人们提醒他：大炎的边疆还没有修好，军队也没有完成整编。出兵的时机，还差两年。"
 fool_urs.7.a: "等待时机"
 fool_urs.7.b: "立刻出兵"

