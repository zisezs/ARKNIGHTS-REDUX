l_simp_chinese:
 # ===== 乌萨斯 · 顾问簇（开局顾问 / 陆军部长 / 圣愚帝国顾问） 2026-09-15 =====
 # 15 个角色 / 16 个顾问位 / 16 条特质 / 5 个隐藏事件 / 3 条档位读数

 # ---- 角色名称与描述 ----

 # 阿洛伊泽·戈尔奇科娃 —— 近卫军皇家直属营中尉 · 维特的人
 URS_Aloyze_Gorchikova: "阿洛伊泽·戈尔奇科娃"
 URS_Aloyze_Gorchikova_desc: "她杀过间谍，带过别乔克进议会，在圣愚加冕那天站在教堂最后一排。\n\n§Y隐藏含义§!：她是旧秩序安插在圣愚帝国内部的最后一根钉子。她还没有决定要不要拔出来。"

 # 第三局局长 —— 情报与科技机构负责人
 URS_Director_Third_Bureau: "第三局局长"
 URS_Director_Third_Bureau_desc: "第三局的墙很高。圣愚翻过去了。但第三局的地下室，圣愚还没有找到。\n\n§Y隐藏含义§!：第三局保存着关于邪魔的原始档案。这些档案是圣愚唯一害怕的东西。"

 # 卡托加区厂长 —— 经济部长
 URS_Katoga_Factory_Manager: "卡托加区厂长"
 URS_Katoga_Factory_Manager_desc: "第三机械厂复产那天只来了三成工人。他说剩下的人要么死了，要么进了监狱，要么加入了无缚者同盟。\n\n§Y隐藏含义§!：他是圣愚帝国里少数还在「做事」的人。但「做事」和「活下来」是两回事。"

 # 沃伦佐娃夫人 —— 外交部长
 URS_Foreign_Minister_Vorontsova: "沃伦佐娃夫人"
 URS_Foreign_Minister_Vorontsova_desc: "她在听证会上读了娜塔莉娅的忏悔信。现在她在圣愚帝国外交部里，读着来自莱塔尼亚和维多利亚的质问信。\n\n§Y隐藏含义§!：她是旧贵族中少数活下来的人。她活下来，是因为她学会了在灰色的天空下，保持沉默。"

 # 艾丽塔·瓦卢耶娃 —— 科研部长
 URS_Research_Minister_Elita: "艾丽塔·瓦卢耶娃"
 URS_Research_Minister_Elita_desc: "她在报告中写道：「石棺现在运行所燃烧的，是无数被带走的、被肢解的感染者的生命。」维特没有回复。圣愚回复了。\n\n§Y隐藏含义§!：她是古米的母亲。她不知道自己的女儿还活着。她只知道，石棺在燃烧。"

 # 斯韦特兰纳·卜提里娜 —— 军事部长 · 第一集团军元帅
 URS_War_Minister_Svetlana: "斯韦特兰纳·卜提里娜"
 URS_War_Minister_Svetlana_desc: "她在试爆报告上签了字，然后问了一句：「这东西的残留物，会不会污染矿脉？」工程师回答：「理论上不会。」\n\n§Y隐藏含义§!：她忠于帝国，不是圣愚。但帝国已经变成了圣愚。她还没有做出选择。"

 # 叶甫根尼 —— 陆军总司令 · 第四集团军总司令
 URS_Army_Commander_Evgeny: "叶甫根尼"
 URS_Army_Commander_Evgeny_desc: "他在泽尔格勒收到维特的命令时，把文件撕了。现在他在泽尔格勒的灰色雪中，把命令捡了起来。\n\n§Y隐藏含义§!：他是军头中最后一个还在抵抗的人。但灰色雪已经落进了他的指挥部。"

 # 海军总司令（空缺） —— 海军总司令 · 空缺
 URS_Navy_Commander_Vacant: "海军总司令（空缺）"
 URS_Navy_Commander_Vacant_desc: "乌萨斯没有海军。但有一个人适合这个位置——如果圣愚帝国需要海军的话。\n\n§Y隐藏含义§!：空缺本身就是一种叙事。乌萨斯没有海。乌萨斯只有雪原，和灰色的天空。"

 # 斯乔帕·拉辛 —— 空军总司令 · 谢钦兵团首领
 URS_Air_Commander_Razin: "斯乔帕·拉辛"
 URS_Air_Commander_Razin_desc: "他驾驶「利沃诺夫号」撞击第四集团军旗舰时，没有回头。现在他坐在空军司令部的椅子上，看着窗外灰色的天空。\n\n§Y隐藏含义§!：他是自由民。他曾经为自由而战。现在他为圣愚而战。他不确定这两者有什么区别。"

 # 圣愚卫队指挥官 —— 圣愚卫队统领
 URS_Fool_Guard_Commander: "圣愚卫队指挥官"
 URS_Fool_Guard_Commander_desc: "他的眼睛是灰色的。他不再恐惧。他也不再需要恐惧。\n\n§Y隐藏含义§!：他是皈依仪式的第一个成功者。他的名字已经被圣愚吃掉了。"

 # 内卫指挥官 —— 内务部长
 URS_Interior_Minister_Guards: "内卫指挥官"
 URS_Interior_Minister_Guards_desc: "他单膝跪地，把佩剑放在圣愚脚下。圣愚没有捡起剑。他只是把手放在指挥官头上。\n\n§Y隐藏含义§!：内卫效忠乌萨斯而非皇帝。现在圣愚代表乌萨斯。但「乌萨斯」这个词，正在被圣愚吃掉。"

 # 娜迦（锚定形态） —— 圣愚的「声音」
 URS_Naga_Anchored: "娜迦（锚定形态）"
 URS_Naga_Anchored_desc: "她坐在火中。别乔克冲进去拉她时，发现她的身体是冷的，眼睛是亮的。\n\n§Y隐藏含义§!：她是圣愚的第一锚定。她的存在证明圣愚依赖他人的认知。"

 # 别乔克 —— 敲钟者（未敲响）
 URS_Bielchok: "别乔克"
 URS_Bielchok_desc: "她手里握着奶奶留下的铁徽章。她站在矿井口，准备敲钟。她的手停在了半空。\n\n§Y隐藏含义§!：她是唯一能让圣愚消失的人。但她还没有敲响那口钟。"

 # 雷尔金 —— 远北矿区矿工领袖（被监视中）
 URS_Rerkin: "雷尔金"
 URS_Rerkin_desc: "他说过：「当你睁眼看到发生在我们周围的一切时，你难道不会愤怒吗？」现在他愤怒了，但愤怒的方向已经不由他决定了。\n\n§Y隐藏含义§!：他是矿工的领袖，也是圣愚的囚徒。他的愤怒正在被圣愚吃掉。"

 # 普瑞赛斯的声音 —— 石棺深处的辩论者
 URS_Priestess_Voice: "普瑞赛斯的声音"
 URS_Priestess_Voice_desc: "她的声音从石棺深处传来，以多种语言传递同一个词：辩论。\n\n§Y隐藏含义§!：她不是乌萨斯人。她不是邪魔。她是前文明。她向博士发出邀请，向圣愚发出判决。"

