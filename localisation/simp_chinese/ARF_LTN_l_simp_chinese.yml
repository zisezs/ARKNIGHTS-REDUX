#决议分类（4 页签）—— 由 common/decisions/categories/LTN_categories.txt 引用
 LTN_court_decisions: "帝国宫廷"
 LTN_court_decisions_desc: "双塔之下的日常政务都归这一页。议事、庆典、采谱与传谕，都从这张桌子上发出去。"
 LTN_secret_decisions: "金律殿堂"
 LTN_secret_decisions_desc: "庆典之前的探查不公开进行。委托从殿堂发出，回执也交回殿堂。"
 LTN_treasury_decisions: "帝国金库"
 LTN_treasury_decisions_desc: "钱从哪里来，账又记在谁的头上。这一页只算两件事。"
 LTN_host_decisions: "点兵册"
 LTN_host_decisions_desc: "名册上有多少人，国境线上就站多少人。多出来的名字要划掉。"
 LTN_law_decisions: "金律乐章 · 调律台"
 LTN_law_decisions_desc: "国家对《金律乐章》的持续调律。每一次改动都会在九个大区留下余波。"
 LTN_reform_decisions: "军制革新"
 LTN_reform_decisions_desc: "军队的事务不是一次演习就能办完。参谋、术师营、法卫与军需各自要有一直办下去的章程。"
 LTN_score_prep_decisions: "修律筹备"
 LTN_score_prep_decisions_desc: "新金律要先把抄本对齐，再把选帝侯的签字凑齐。颁布之前，这一步省不掉。"
 LTN_atelier_decisions: "文艺产业"
 LTN_atelier_decisions_desc: "剧本、版权、巡演与赞助都是可以经营的行当。剧院的门开着，账也开着。"

#决议 21 条 —— 由 common/decisions/LTN_decisions.txt 引用（三段式：complete/modifier/remove）
 LTN_dec_twin_council: "召开双塔议事"
 LTN_dec_twin_council_desc: "两位女皇的班子坐到同一张桌前，把两边的日程并成一份。事情还是那些事情，只是如今要吵完了才去办。"
 LTN_dec_festival_guard: "加派金律法卫"
 LTN_dec_festival_guard_desc: "庆典的观众一天比一天多，从各区涌向塔前剧场。金律法卫的岗哨跟着一路排过去，面罩一律朝外。"
 LTN_dec_festival_orchestra: "扩充乐团编制"
 LTN_dec_festival_orchestra_desc: "乐团从二十二座乐器塔上抽调乐手，排练从清晨开始。全城都听得见，也都知道庆典快到了。"
 LTN_dec_festival_invite: "邀请九区观礼"
 LTN_dec_festival_invite_desc: "请柬送往九个大区，落款用的是双塔。来观礼的人越多，庆典之后要还的人情也越多。"
 LTN_dec_collect_score: "采谱"
 LTN_dec_collect_score_desc: "女皇之声随时可以取用民间的曲子，不必打招呼。采回来的乐谱先送进宫廷，再决定给谁听。"
 LTN_dec_herald: "女皇之声传谕"
 LTN_dec_herald_desc: "一名谕使带着女皇的话上路，快马走两天。地方上争了半年的那件事，往往在他到场之前就平了。"
 LTN_dec_nine_regions_diet: "选帝侯会议"
 LTN_dec_nine_regions_diet_desc: "九位选帝侯在崔林特尔梅坐了一整天，席位按大区排。会议记录写得体面，正事一件也没谈成。"
 LTN_dec_spy_sweep: "密探查访"
 LTN_dec_spy_sweep_desc: "书店老板、咖啡店主与跑腿的老人都在留意街上的动静。他们都是密探，只对双塔一个人交差。"
 LTN_dec_arrest: "拘押嫌疑人"
 LTN_dec_arrest_desc: "双塔为各个阶层的嫌疑犯准备了符合身份的拘押处。进了门的人，出来时通常已经签好了字。"
 LTN_dec_decode: "译谱"
 LTN_dec_decode_desc: "乐谱与密码表凑在一起，音符就变成了句子。译出来的那一页，足够让很多人睡不着觉。"
 LTN_dec_destroy_files: "销毁案卷"
 LTN_dec_destroy_files_desc: "查到的证据被一份份封进箱底，钥匙交回殿堂。它不再指向任何人，也就不会再惊动任何人。"
 LTN_dec_annihilate_warrant: "动用湮灭授权"
 LTN_dec_annihilate_warrant_desc: "金律法卫带着女皇的最终授权进了城。这片街区此后只会留在旧地图上，名字也不再有人提。"
 LTN_dec_border_patrol: "边境巡逻"
 LTN_dec_border_patrol_desc: "军团沿着航线来回走，粮车跟在队伍后面。没有登记的武装，会在国境线之外被拦下来。"
 LTN_dec_raise_tax: "加税"
 LTN_dec_raise_tax_desc: "税吏带着新册子下乡，一户一户地核。国库的账面好看了，村子里的怨气也跟着一起涨。"
 LTN_dec_borrow: "举债"
 LTN_dec_borrow_desc: "帝国银行先替国库垫上这笔钱，不必等到秋天收税。借据压在账房手里，利息一个月一个月往上滚。"
 LTN_dec_attract_investment: "招商"
 LTN_dec_attract_investment_desc: "宫廷把地皮、航线和名分摆上桌，等行会与贵族报价。来的人越多，最后的价就越低。"
 LTN_dec_bank_credit: "帝国银行的信用"
 LTN_dec_bank_credit_desc: "双塔第一次用自己的名字借到了钱，没有抵押。这笔账不用地契担保，只压着一个承诺。"
 LTN_dec_muster: "点验名册"
 LTN_dec_muster_desc: "名册摊在桌上，一个个名字点过去，官与兵都要应声。有人早就死了，有人从来没上过册子。"
 LTN_dec_expand_guard: "扩编金律法卫"
 LTN_dec_expand_guard_desc: "测试院的新人领到无面的面罩，从此不再有名字。他们只属于金律乐章与莱塔尼亚。"
 LTN_dec_disband_hosts: "裁撤私兵"
 LTN_dec_disband_hosts_desc: "诸侯的私兵按名册遣散，武器收进库房。人回家去，账记在双塔头上，诸侯记在心里。"
 LTN_law_dec_open: "登上调律台"
 LTN_law_dec_open_desc: "打开调律台面板，开始对金律乐章逐条调律。"
 LTN_law_dec_close: "离开调律台"
 LTN_law_dec_close_desc: "合上乐章，把调律台封存起来，等待下一次动手。"
 LTN_dec_drill: "操演"
 LTN_dec_drill_desc: "军团在演武场上练阵，练的是术师与步兵之间的配合。队列走得好看不好看，没有一个人会在意。"
 LTN_reform_staff_drill: "参谋本部演习"
 LTN_reform_staff_drill_desc: "参谋们把地图铺开，按假想敌走一遍号令与补给。演习不打仗，演习只让真正打仗时少绕两段路。"
 LTN_reform_caster_drill: "术师营法术试炼"
 LTN_reform_caster_drill_desc: "术师营在自己人身上试新源石技艺，记录每一次失准。试炼场上受的伤不上战报，但上了训练大纲。"
 LTN_reform_guard_expansion: "金律法卫战备轮换"
 LTN_reform_guard_expansion_desc: "法卫按名册分批撤下哨位回营轮换，留下一半人在岗。轮换表由测试院审定，逾期不补。"
 LTN_reform_quartermaster: "军需总监整备"
 LTN_reform_quartermaster_desc: "军需把仓库、车队与野战医院一并清点，重排补给优先级。账目理顺之后，部队才可能在雪地里多撑几天。"
 LTN_reform_consolidate_hosts: "收编裁撤的私兵"
 LTN_reform_consolidate_hosts_desc: "遣散的私兵有一半没回到家，他们带着武器进了官军营册。这笔账记在双塔头上，诸侯心里有数。"
 LTN_prep_copy_audit: "抄本校勘"
 LTN_prep_copy_audit_desc: "各区教堂与书院保存的《金律乐章》抄本文字互有出入。校勘逐字比对，改动的地方要留档待查。"
 LTN_prep_elector_pact: "与选帝侯会签"
 LTN_prep_elector_pact_desc: "改律要选帝侯签字，签字要先把各自的价钱谈完。会签文本比律文本体更厚。"
 LTN_prep_rehearsal: "乐章预演"
 LTN_prep_rehearsal_desc: "颁布之前先在宫内预演一次，听的是流程是否顺当。预演不出错，正式场合就少出错。"
 LTN_prep_new_law_proclaim: "新金律颁布"
 LTN_prep_new_law_proclaim_desc: "新律在伊维格娜德大厅宣读，各区同时挂出抄本。从这一天起，旧的条文只留在档案里。"
 LTN_atelier_copyright_sweep: "版权清查"
 LTN_atelier_copyright_sweep_desc: "剧院与书商联名申诉他人翻演自己的剧目。清查按登记先后判归属，罚金入库。"
 LTN_atelier_tour_route: "移动城镇旅游线"
 LTN_atelier_tour_route_desc: "移动城镇改走固定巡演线，沿途售票并设茶棚。人来得多，货品反而便宜了几分。"
 LTN_atelier_masterwork: "镇馆之作"
 LTN_atelier_masterwork_desc: "院里出钱请几位作曲家作一部新戏，作为常设演出。一部好戏能撑十年票房。"
 LTN_atelier_patron: "招募赞助人"
 LTN_atelier_patron_desc: "院方向各区殷实人家出卖包厢与署名权。赞助人不出席排练，但要求账目可查。"

#决议的额度/读数说明行（引擎渲染不了的部分才自己写）
 LTN_reform_caster_drill_quota_tt: "本条决议每次为§Y律剑§!的陆军经验获取追加 §G+5%§!，累计至多 §Y40%§!（国策封顶 §Y25%§!）。当前值：[?ROOT.LTN_irn_exp|%]"
 LTN_atelier_copyright_sweep_quota_tt: "本条决议每次为§Y双轨工坊§!的科研速度追加 §G+5%§!，累计至多 §Y40%§!（国策封顶 §Y25%§!）。当前值：[?ROOT.LTN_atl_res|%]"
 LTN_prep_copy_audit_quota_tt: "抄本校勘累计到 §Y6§! 份即止，每份都要重新调集抄书手。当前已得：[?ROOT.LTN_score_insight|Y0]"
 LTN_score_insight_p1_tt: "§Y校勘所得§! §G+1§! 份（供调律台预演页查阅）"

#成长型民族精神（数值写成变量，由国策喂养；见 common/dynamic_modifiers/LTN_political_dynamic_modifiers.txt）
 LTN_dyn_twin_rule: "双塔共治"
 LTN_dyn_twin_rule_desc: "一白一黑两座塔由廊桥相连，两位女皇共用一座宝座。政府里因此坐着两套班底，分别效忠伊维格娜德与赫琳玛特，至今仍一同出席庆典。"
 LTN_dyn_golden_law: "金律乐章"
 LTN_dyn_golden_law_desc: "这个国家诞生自一篇乐章，它是宪法、是术式，也是一首真能奏响的曲子。一千多年来它只被改动过一次，改它的人已经死了。"
 LTN_dyn_old_echo: "尘世遗响"
 LTN_dyn_old_echo_desc: "巫王的意志还在人民间游荡，国内仍有许多人向往巫王时代。崇拜旋角的青年聚在咖啡店里，抓着残党的宪兵能因此升官。"
 LTN_dyn_electors_fetter: "先有诸侯，再有皇帝"
 LTN_dyn_electors_fetter_desc: "九个大区各有完整的政府、法律与军队，每个级别的贵族先是大区的最高领导人。俗语说，先有诸侯，再有皇帝。"
 LTN_one_voice: "二者唯一"
 LTN_one_voice_desc: "赫琳玛特把自己封进了漆黑丰碑，从此不再发声。伊维格娜德成为莱塔尼亚唯一能够发声的女皇，双塔只剩一塔有人。"
 LTN_grimm_regency: "铁腕摄政"
 LTN_grimm_regency_desc: "伊维格娜德交出权柄，退居幕后。赫琳玛特以莱塔尼亚最锋利的剑的身份独自执政，双印从此只用一枚。"
 LTN_dyn_treasury: "帝国金库"
 LTN_dyn_treasury_desc: "钱、税、铸币与银行都归双塔管。国库里第一次有了一笔不必向诸侯开口去要的钱，数目还在往上长。"
 LTN_dyn_atelier: "双轨工坊"
 LTN_dyn_atelier_desc: "乐器、法术用品与新式军械都出自这里。不精法术的人用机械操纵，熟悉法术的人稍加施术就能完成复杂动作。"
 LTN_dyn_ironlaw: "律剑"
 LTN_dyn_ironlaw_desc: "金律法卫、女皇之声与新建的术师营都只对双塔负责。他们的剑与法术，都只属于金律乐章与莱塔尼亚。"
 LTN_dyn_host: "九区兵制"
 LTN_dyn_host_desc: "九个大区各出定额的兵，军饷与调令却渐渐改由双塔下发。这支军队的规模写在册子上，随册子一起长。"
 LTN_dyn_outreach: "四境通达"
 LTN_dyn_outreach_desc: "使节、商队与义从在四条边界上同时走动。这套对外关系不写在某一份条约里，写在四境的通行册上。"
 agreement_with_Kazdel: "与卡兹戴尔的协定"
 agreement_with_Kazdel_desc: "萨卡兹人并非是最好的盟友——强力既可以是可靠也可以是祸患的代名词。但是显然与他们进行利益交换也是相当不错的买卖，特别是以此进一步削弱维多利亚这个曾经的巨人。既无代价，利益更手到擒来。"
	earthly_relic: "尘世遗响"
	earthly_relic_desc: "虽然巫王的统治已然远去，但他的意志还在莱塔尼亚的人民间游荡，在国内尚有许多人向往着过去的巫王时代，这无疑对现在的女皇的统治埋下了巨大的隐患。若是我们对此不加以重视，过去的影子必将会把我们拖回那不堪回首的黑暗时代。\n\n §R不要让稳定度低于30%§"
	Black_Wihte_blance_0: "二者唯一"
	Black_Wihte_blance_0_desc: "在黑女皇失声之后，政府的事务完全由白女皇殿下领导，同时政府中出现的分别支持两位女皇的莱尼党与昂格党两党随着时间的推移，两党间的冲突已经难以弥合，除非黑女皇能够再次发出声音。否则政府的完全分裂，只是时间问题。"
	the_art_country: "艺术之国"
	the_art_country_desc: "莱塔尼亚以智慧之发源地而自豪，不论是艺术还是科技都达到了前列乃至领跑的地位，高水平的教育带来了大量人才与无限灵感泉涌，更带来了巨大的思想潮流与新机遇。每一个莱塔尼亚人都相信，只要智慧之光尚存，莱塔尼亚的荣光将会悠久不息。"
