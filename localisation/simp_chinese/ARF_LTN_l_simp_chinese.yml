#人物
 LTN_Lieselotte_EwigeGnade: "莉泽洛特·伊维格娜德"
 LTN_Lieselotte_EwigeGnade_desc: "莱塔尼亚双子女皇之一，白塔的主人，封号「永恒恩典」，本名莉泽洛特。她与妹妹希尔德加德一同诞生于术式——体内既有赫尔昏佐伦的术式，也有高卢的技术与巫妖的祝福——也在二十三年前那个黎明一同走下染血的巫王塔。她主持每年的女皇庆典，设计了能让整座崔林特尔梅数十年不变的共鸣术式，把艺术赞助、剧院配额与平民入学写进帝国的日常。她从不赞同妹妹的做法，总说太过激进的手段会使得人类逆反；她要的是调性宽容一些，旧俗留着，平民与贵族坐在同一间教室，只要乐章不停。双塔之间的裂痕一天比一天宽，她仍想把这片晚霞留住——她要令它恒久不变。"
 LTN_Hildegard_GrimmMacht: "希尔德加德·赫琳玛特"
 LTN_Hildegard_GrimmMacht_desc: "莱塔尼亚双子女皇之一，黑塔的主人，封号「无情权威」，本名希尔德加德。双塔里她是剑，妹妹是盾。她说话短、下命令、几乎不解释——「我只关注结果」。二十三年前的九月，她与伊维格娜德一同杀进巫王塔，砍下赫尔昏佐伦的双角，此后便把金律法卫、宪兵与密探织成一张网：她清楚摘下面具之后，巫王的余音里站着的都是伯爵与选帝侯的继承人，也知道选帝侯怕的从来不是「巫王」这个名号，而是双塔会走上赫尔昏佐伦的老路，把权力与利益从他们手中分走。所以她比所有人都更早握紧剑柄。在她看来，金律乐章的和谐不容破坏——因为她亲眼见过，一个男人的旋律怎样把整个莱塔尼亚撕开。"
 LTN_Unger_Minks: "昂格·明克斯"
 LTN_Unger_Minks_desc: ""
 LTN_Lenny_Movico: "莱尼·莫维科"
 LTN_Lenny_Movico_advisor_desc: "莱尼党的首领，与昂格·明克斯各事一位女皇。黑女皇失声之后，两党就在同一个宫里把架吵到了难以弥合。"
 LTN_Loris_Bordin: "洛里斯·博尔丁"
 LTN_Loris_Bordin_advisor_desc: "崔林特尔梅的宪兵队长官，前拉特兰公民，二十三年前第一个踏进巫王塔的士兵。他追查一桩十五年没结的旧案，靠自嘲与心软之间那点分寸撑着。"
 LTN_Cora_Lowenstein: "珂拉·洛文斯坦"
 LTN_Cora_Lowenstein_advisor_desc: "皇家乐团的调音师。哪一段旋律不稳，她就伸手去扶——二十三年来，她扶过的远不止琴弦。"
 LTN_Brandt_Reiner: "布兰特·赖纳"
 LTN_Brandt_Reiner_desc: "金律法卫，从小与霍赫贝格家的兄弟们一同长大。他只效忠金律乐章与莱塔尼亚——而当这句话与具体的人冲突时，没有人可以永远不做选择。"

#国家精神

#国策树 · 双塔共治政治线（26 格）—— 由 docs/gen_ltn_loc.cjs 生成，勿手改
 LTN_twin_rule: "双塔共治"
 LTN_twin_rule_desc: "一白一黑两座塔之间只有一道廊桥，两位女皇共用一座宝座。文书上至今写着两个签名，没有人说过这种安排能持续多久。"
 LTN_bridge_of_towers: "廊桥"
 LTN_bridge_of_towers_desc: "两座女皇塔之间只由一道廊桥相连，每年的庆典合奏都在那里举行。宫廷把它改成常设的议事厅，两份日程从此合到一张桌上。"
 LTN_empress_festival: "女皇庆典"
 LTN_empress_festival_desc: "庆典从皇家乐团奏响金律乐章开始，到双子女皇的合奏结束。筹备从一次性的差事变成常设事务，开始有自己的预算与编制。"
 LTN_royal_orchestra: "皇家乐团"
 LTN_royal_orchestra_desc: "皇家乐团恢复到了巫王时代的编制，乐手同时是法术大师。这支队伍既是庆典的执行者，也是女皇之声的兵源。"
 LTN_twin_resonance: "双塔齐鸣"
 LTN_twin_resonance_desc: "两塔的共鸣术式被接到同一套管线上，连同全城二十二座乐器塔。庆典当晚，崔林特尔梅会作为一支完整的乐队发声。"
 LTN_endless_sunset: "晚霞恒久"
 LTN_endless_sunset_desc: "伊维格娜德要把黄昏留在莱塔尼亚。宫廷的宣传不再只面向贵族，露天演奏会与平民学校的课本都换上了新曲目。"
 LTN_resonance_sigils: "共鸣术式"
 LTN_resonance_sigils_desc: "首都的建筑与街道本身就是乐器，共鸣管线就埋在路面之下。女皇为它们重新调音，让这座城在演奏的同时也承担防务。"
 LTN_art_patronage: "艺术赞助"
 LTN_art_patronage_desc: "音乐家的赞助人从贵族换成了宫廷。资助合同统一由女皇签署，作品与演出随之进入官方目录，剧院不再看某位伯爵的脸色。"
 LTN_designated_repertoire: "指定剧目"
 LTN_designated_repertoire_desc: "全国剧院每季度上演同一批剧目，暴君原乡乌提卡领的演出率翻倍。文化界颇有微词，但票房的数字很好看。"
 LTN_ivignad_hall: "伊维格娜德音乐厅"
 LTN_ivignad_hall_desc: "一座以女皇之名命名的音乐厅在首都落成。它同时是学府、剧院与法术讲堂，平民学生第一次有了固定的排练场地。"
 LTN_eternal_grace: "永恒恩典"
 LTN_eternal_grace_desc: "伊维格娜德把自己封为帝国永恒的象征。宫廷的每一次公开活动都围绕她展开，庆典从一日延长为一年。"
 LTN_apex_of_resonance: "共鸣之极"
 LTN_apex_of_resonance_desc: "白塔一系的术式与人事全部到位，莱尼党把持了宫廷的文书与礼乐。伊维格娜德的名字从此出现在帝国每一份公开文书上。"
 LTN_grimm_authority: "无情权威"
 LTN_grimm_authority_desc: "赫琳玛特只用短句发令，也几乎不作解释。金律法卫与宪兵队开始按她的口径重新登记编制，昂格党的人接管了操典。"
 LTN_sword_of_the_guard: "金律法卫的剑"
 LTN_sword_of_the_guard_desc: "金律法卫的誓言只属于金律乐章与莱塔尼亚。编制扩至庆典所需规模之后，他们的训练与调令直归双塔。"
 LTN_annihilation_warrant: "湮灭授权"
 LTN_annihilation_warrant_desc: "对城区实施湮灭的最终授权，从女皇本人下放到随行的金律法卫手中。宫廷对此不作公开说明，也不设复核。"
 LTN_gendarme_and_spy: "宪兵与密探"
 LTN_gendarme_and_spy_desc: "宪兵按区设点，密探则公开经营书店与咖啡馆。两类人都持女皇的委任状，都只对双塔负责，谁也管不着对方的辖区。"
 LTN_kill_at_the_start: "扼杀在起点"
 LTN_kill_at_the_start_desc: "赫琳玛特不留谈判的余地。边境军团的巡逻范围扩大到全部航线，任何未登记的武装都会在进入国境前被截停。"
 LTN_hall_of_the_law: "金律殿堂"
 LTN_hall_of_the_law_desc: "金律法卫在崔林特尔梅设下驻所，情报在此上交。庆典前的探查不再公开进行，委托从殿堂发出，回执也交回殿堂。"
 LTN_apex_of_the_sword: "剑锋之极"
 LTN_apex_of_the_sword_desc: "黑塔一系的军队、宪兵与密探全部到位，昂格党把住了每一处哨所。从这一年起，帝国境内再也没有双塔不知道的集会。"
 LTN_imperial_court: "帝国宫廷"
 LTN_imperial_court_desc: "宫廷原本只是皇帝还是选帝侯时的班子。双子女皇把它扩成常设机构，文书、传旨与禁卫从此各有专署。"
 LTN_fix_the_capital: "定都崔林特尔梅"
 LTN_fix_the_capital_desc: "帝国没有固定首都，皇帝当选后应迁往治所。这道旧例被正式废止，崔林特尔梅成为永久的宫廷所在。"
 LTN_nine_copies: "九份抄本"
 LTN_nine_copies_desc: "金律乐章的九份抄本原分藏于九大区，除女皇与选帝侯本人外无人能靠近。第一份抄本被送回了双塔。"
 LTN_the_nine_regions: "九区奉行"
 LTN_the_nine_regions_desc: "九大区仍保留自己的法律与军队，但征兵与工程的文牒开始由宫廷先签发。宫廷为此在选帝侯会议上留出了一整天。"
 LTN_solo_of_the_white: "白塔独奏"
 LTN_solo_of_the_white_desc: "赫琳玛特把自己封进了漆黑丰碑，从此不再发声。伊维格娜德成为莱塔尼亚唯一能够发声的女皇，双塔只剩一塔有人。"
 LTN_duet: "合奏"
 LTN_duet_desc: "双塔在庆典的最后一刻同时奏响，两位女皇都留在了台上。共治因此延续，双印、双谕与两套班底照旧并行。"
 LTN_solo_of_the_black: "黑塔独奏"
 LTN_solo_of_the_black_desc: "伊维格娜德交出权柄，退居幕后。赫琳玛特以莱塔尼亚最锋利的剑的身份独自执政，双印从此只用一枚。"
 LTN_read_the_score: "校勘乐章"
 LTN_read_the_score_desc: "一千多年来，金律乐章只有过一次变动。宫廷把九份抄本摊在长桌上，第一次逐句比对它们之间的差别。"
 LTN_electors_consent: "诸侯的同意"
 LTN_electors_consent_desc: "改乐章不是双塔一家的事。九位选帝侯被请回崔林特尔梅，座位按大区排开，话要一个一个慢慢地说。"
 LTN_first_annotation: "第一处注释"
 LTN_first_annotation_desc: "校勘的人在第三份抄本上找到了一处旧注，笔迹不属于任何一位已知的抄写者。这件事被压了下来，没有人再提。"
 LTN_the_rehearsal: "九区复奏"
 LTN_the_rehearsal_desc: "修改后的段落被送往九个大区逐一试奏，台上照旧按谱子往下走。回来的报告说，没有人察觉到任何不同。"
 LTN_rewrite_the_voice: "重写声部"
 LTN_rewrite_the_voice_desc: "要做的事千年前有人做过一次：从乐章里拿掉一整段旋律。宫廷开始讨论，要不要动其中某一个声部。"
 LTN_fixing_the_pitch: "定音"
 LTN_fixing_the_pitch_desc: "最后的一遍由双塔自己奏。两位女皇坐在同一架管风琴前，各伸出一只手，把新的那一段音一起定下来。"
 LTN_new_golden_law: "新金律"
 LTN_new_golden_law_desc: "一千多年来，金律乐章第二次被改写。改动只有寥寥几个音符，可是懂行的人一眼就看出它删掉了什么。"
 LTN_imperial_treasury: "帝国金库"
 LTN_imperial_treasury_desc: "战争与巫王统治留下的窟窿还挂在账上。国库需要的是一笔自己能长出来的钱，而不是又一纸摊到平民头上的加税。"
 LTN_ducat_standard: "杜卡特本位"
 LTN_ducat_standard_desc: "法定货币是杜卡特，边远城镇却还在流通老旧贵族领的私铸。宫廷下令逐炉回收，全国的银库此后只认一种钱。"
 LTN_land_tax: "丈量地税"
 LTN_land_tax_desc: "帝国的税册上，大部分产业还挂在贵族名下。这一回的丈量有女皇之声随行，数字第一次由宫廷自己记。"
 LTN_reclaim_the_mints: "收回铸币权"
 LTN_reclaim_the_mints_desc: "老旧贵族领的铸币炉被一座座贴上了封条，炉匠转由宫廷雇用。诸侯少了一项世代相传的进项，国库多了一项。"
 LTN_imperial_bank: "帝国银行"
 LTN_imperial_bank_desc: "帝国银行在崔林特尔梅开张，杜卡特的发行与借贷都归它。战争再打起来时，双塔第一次有了可以透支的账户。"
 LTN_instrument_guilds: "乐器行会"
 LTN_instrument_guilds_desc: "乐器行与法术用品作坊遍布首都的每一条街。宫廷把它们编成特许行会，新出厂的每一件都要过一道品质认证。"
 LTN_dual_track_design: "双轨制设计"
 LTN_dual_track_design_desc: "莱塔尼亚的工业品一向有两套用法：不精法术的人用机械操纵，熟悉法术的人稍加施术就能完成复杂动作。"
 LTN_crystal_industry: "结晶工业"
 LTN_crystal_industry_desc: "结晶工业的产业链早在巫王时代就已完整，如今大半闲置在贵族手里。宫廷把停工的炉子一家家重新点起来。"
 LTN_instrument_export: "乐器出口"
 LTN_instrument_export_desc: "泰拉最大的美术馆与音乐厅都在莱塔尼亚，乐器也是。商队把琴与法术装置运出国境，换回源石与金属。"
 LTN_factory_zones: "工厂区"
 LTN_factory_zones_desc: "卢滕区那样的工厂区被推广到每一座移动城邦。厂墙之外是宿舍与香肠摊，厂墙之内是三班不停的炉子。"
 LTN_artisan_schools: "匠人学校"
 LTN_artisan_schools_desc: "雕刻师、制琴师与法术装置工匠一向在高塔之外接活。宫廷给他们办学籍，手艺第一次可以名正言顺地传给外人。"
 LTN_apex_of_the_workshop: "工坊之极"
 LTN_apex_of_the_workshop_desc: "从琴弦到法术装置，帝国的每一道工序都有了名册与标准。行会与宫廷各拿一半，到了这一步谁也不肯先松手。"
 LTN_engine_core: "主动力炉"
 LTN_engine_core_desc: "移动城镇的动力源是命脉，沃伦姆德那样的镇子速度只有城邦的八分之一。宫廷把炉子的检修收归国有。"
 LTN_granary_network: "粮仓网络"
 LTN_granary_network_desc: "粮仓与供给设施一旦被天灾割断，一座移动城镇撑不过一个冬天。宫廷按航线把储粮点重新排了一遍。"
 LTN_trade_routes: "商路重开"
 LTN_trade_routes_desc: "莱塔尼亚北部的城镇曾是最璀璨的商业聚落，后来一个个从航线图上消失。这一回，被划掉的名字又补了回来。"
 LTN_relief_rail: "补给铁道"
 LTN_relief_rail_desc: "铁路把河谷平原的粮与山区的矿连成同一条线。运价由宫廷定，贵族不再能卡住其中某一段坐地起价。"
 LTN_mobile_city_works: "移动城邦工程"
 LTN_mobile_city_works_desc: "十二座高塔围着一座城走，地块本身就是家底。宫廷开始自己造移动城邦，而不是处处向贵族租地块。"
 LTN_storm_relief: "天灾云的清理"
 LTN_storm_relief_desc: "四皇会战过去了几十年，施彤领上空仍满是源石碎屑组成的天灾云。术师队奉命去清理那片天空，一年清一段。"
 LTN_apex_of_the_routes: "航线之极"
 LTN_apex_of_the_routes_desc: "商路把关口、粮仓与动力炉接成了同一张网。这张网铺到哪里，双塔的政令就能一路跟着铺到那里去。"
 LTN_copyright_act: "版权法"
 LTN_copyright_act_desc: "去年还有音乐家被人骗着签下极不公平的合同，作品再也拿不回来。帝国把版权与录音发行权一起写进了法律。"
 LTN_tourism_towns: "旅游城镇"
 LTN_tourism_towns_desc: "一部分移动城镇靠游客吃饭，纪念馆的门票是两杜卡特一人。宫廷把这类地方列进官方路线，门票收入分成。"
 LTN_art_market: "美术馆与拍卖"
 LTN_art_market_desc: "帝国的美术馆与音乐厅是泰拉最大的两座，藏品堆到快放不下。展出与拍卖都开始抽税，画价一路往上走。"
 LTN_cultural_export: "文化输出"
 LTN_cultural_export_desc: "剧院、乐团与画作被成批送出国境，随行的还有一整套乐谱与教材。莱塔尼亚卖出去的从来不只是货。"
 LTN_state_monopoly: "国营经济"
 LTN_state_monopoly_desc: "帝国银行、特许行会与新建的工厂都归到同一个衙门下。此后每一笔大生意，都要先问过宫廷的一句话。"
 LTN_chartered_guilds: "特许行会"
 LTN_chartered_guilds_desc: "宫廷把经营权按特许状一纸纸发下去，换回稳定的税与不打折的秩序。行会比贵族听话，也比贵族更贵。"
 LTN_free_market: "自由市集"
 LTN_free_market_desc: "铸币、运价与票价一并放开，商队从此不再需要一纸路引。钱流得比从前快，也再也不完全听宫廷的话。"
 LTN_muster_roll: "点兵册"
 LTN_muster_roll_desc: "帝国的军队由九个大区的私兵拼成，每个贵族都是自己那支队伍的领袖。双塔手上只有两道名册：女皇之声与金律法卫。"
 LTN_private_host_limits: "私兵限额"
 LTN_private_host_limits_desc: "每一级贵族能养多少私兵，法律上写得很清楚，只是几十年没人真的去查。宫廷开始照着名册一个个点名。"
 LTN_military_schools: "军籍与测训"
 LTN_military_schools_desc: "所有军人建军时都要过一遍军事法术适应性测试。宫廷把这道测试挪到入伍之前，先看清人，再发枪。"
 LTN_standing_army: "常备军"
 LTN_standing_army_desc: "帝国第一次有了不属于任何大区的常备编制。军饷由国库直发，调令由双塔直下，军官不再两头汇报。"
 LTN_general_staff: "帝国总参谋部"
 LTN_general_staff_desc: "九区的兵与双塔的令，第一次被画在了同一张图上。参谋部只管怎么打仗，不管哪一支部队是谁的人。"
 LTN_expand_the_guard: "金律法卫扩编"
 LTN_expand_the_guard_desc: "金律法卫的誓言只属于金律乐章与莱塔尼亚。扩编后的名册第一次超过了庆典所需的规模，而且还在往上加。"
 LTN_voice_of_the_empress: "女皇之声"
 LTN_voice_of_the_empress_desc: "女皇之声只听从双塔调遣，不受任何一个大区的法律制约。他们首先是御前乐师，然后是谕使与禁卫。"
 LTN_veil_ritual: "帷幕"
 LTN_veil_ritual_desc: "十名以上的金律法卫才能张开的护盾术式。宫廷把它写进操典，也写进了每一支野战纵队的编成表里。"
 LTN_golden_melody: "黄金旋律"
 LTN_golden_melody_desc: "莱塔尼亚的辉光，守卫金律乐章的力量。这道光如今也守在每一处边境哨所与检查站的门前，日夜不熄。"
 LTN_caster_battalions: "术师营"
 LTN_caster_battalions_desc: "军中一向有全部由源石技艺使用者组成的部队。宫廷把它们从各贵族的私兵里一一抽出来，单独编成营。"
 LTN_trial_academy: "测试院"
 LTN_trial_academy_desc: "测训结果好的人被抽离原部队，送进单独的训练场所操练。这所院子里出来的人，此后只对双塔负责。"
 LTN_apex_of_the_blade: "律剑之极"
 LTN_apex_of_the_blade_desc: "双塔手上第一次有了一支不数大区、只数编制的军队。它的剑与法术，都只属于金律乐章与莱塔尼亚。"
 LTN_listening_machine: "留声机"
 LTN_listening_machine_desc: "城防装置由自律施术单元驱动，受过高等教育的人就有办法操纵它。宫廷索性把操作课开进了平民学校。"
 LTN_border_posts: "边区哨所"
 LTN_border_posts_desc: "边区宪兵一向由最近的移动城邦调派，一场贵族婚礼就能把他们全调走。宫廷给边地留了自己的驻军。"
 LTN_field_corps: "边区军团"
 LTN_field_corps_desc: "冬灵山脉与施彤领之间的那条走廊，从此有了常驻的军团。粮道与兵道走的是同一条航线，谁也不等谁。"
 LTN_shard_curtain: "天灾云防线"
 LTN_shard_curtain_desc: "施彤领上空的天灾云挡下过高卢人的舰队，如今也挡住了自己人的补给。军团沿着这道幕布一路布防。"
 LTN_rift_blockade: "大裂谷封锁"
 LTN_rift_blockade_desc: "大裂谷封死了东南方向的全部航线，也封死了从那个方向来的敌军。宫廷在裂谷两侧钉下了一串哨塔。"
 LTN_mobile_fortress: "移动要塞"
 LTN_mobile_fortress_desc: "移动城邦本身就是一座会走的工事。宫廷给十二座高塔都加了炮位，让整座城市在搬迁的路上也能打。"
 LTN_apex_of_the_frontier: "边地之极"
 LTN_apex_of_the_frontier_desc: "从北方的冬灵山脉到东南的裂谷，帝国第一次有了一条连续的防线。守这道防线的人拿的是双塔的饷。"
 LTN_mass_production_units: "法术装置量产"
 LTN_mass_production_units_desc: "军官用的施术单元一向由高塔的工匠单件打造，坏一件要等半年。宫廷把图纸收上来，交给工厂区按批次做。"
 LTN_dual_track_ordnance: "双轨制军械"
 LTN_dual_track_ordnance_desc: "不会施术的士兵也能操作的新式军械，在结晶工业的炉子里成型。会法术的人拿到它，能做的事多一倍。"
 LTN_stone_dice: "源石骰子的研究"
 LTN_stone_dice_desc: "比勒菲尔德的施术单元曾指引风雷击沉过旗舰，那颗骰子如今还缺一角。帝国把这类遗物收拢起来研究。"
 LTN_quartermaster_general: "军需总局"
 LTN_quartermaster_general_desc: "粮、弹、装置与运力都归同一个衙门管。前线的团长不用再拿着条子，一家家去问贵族的仓房要东西。"
 LTN_army_of_the_empire: "帝国的军队"
 LTN_army_of_the_empire_desc: "军籍、军饷与调令都归双塔。诸侯手里仍有私兵，但那些人数第一次被写死在册子上，超额就是犯法。"
 LTN_sword_of_the_towers: "双塔的剑"
 LTN_sword_of_the_towers_desc: "常备军只保留金律法卫与女皇之声，其余的编制一律裁撤。这支军队不大，但每一处国境线上都能看到它。"
 LTN_hosts_of_the_nine: "九区的联军"
 LTN_hosts_of_the_nine_desc: "九个选帝侯各出定额，组成一支只在战时才会集结的联军。它便宜、够用，而且随时都可以解散回家。"
 LTN_foreign_towers: "双塔之下的宾客"
 LTN_foreign_towers_desc: "使节的名单从廊桥这头一路递到那头，两位女皇在同席接见，不问谁先开口。外国从此知道莱塔尼亚只有一个声音。"
 LTN_twin_pact_rite: "协定之仪"
 LTN_twin_pact_rite_desc: "双塔协定的文本重新誊一份，两枚印玺并排盖在同一页上。仪式不产生新条款，只确认旧约仍然有效。"
 LTN_open_the_gate: "敞开廊桥"
 LTN_open_the_gate_desc: "廊桥的门放开，塔外的使者不必再等通报。西部几个小邦被请进席位的这一侧，代价是交出各自的兵籍。"
 LTN_border_lords: "册封边境领"
 LTN_border_lords_desc: "边境的总督由双塔直接册封，七城的上缴额改按比例计算。贵族在厅里抗议，边防线上的哨位却多了。"
 LTN_crown_of_bolivar: "辛嘉斯之冠"
 LTN_crown_of_bolivar_desc: "玻利瓦尔的君主戴上由双塔赐下的冠，保独从此改成同盟。这位新盟友在地图上只占一角，位置却要紧。"
 LTN_kazdel_protocol: "东向协定"
 LTN_kazdel_protocol_desc: "与卡兹戴尔的互不侵犯写在纸上，边界两侧的军队各自后撤一日行程，辎重原地不动。协议不管对面由谁当家。"
 LTN_steppe_road: "草原商路"
 LTN_steppe_road_desc: "商队与使团共用一条草原通道，通行文书在两侧都有效。货担里夹着图纸与样品，跑一趟带回的不只是税。"
 LTN_aid_pool: "义从与军火"
 LTN_aid_pool_desc: "军械库腾出一批余货，登记在册的义从可以越境领装。这批货记在协定名下，取用的一方要按期回报数目。"
 LTN_eastern_leverage: "东向支点"
 LTN_eastern_leverage_desc: "东边的营寨连成一线，卡兹戴尔正式站到双塔这一侧。它在南方还有未了的家事，这一笔要记到以后。"
 LTN_northern_watch: "北境瞭望"
 LTN_northern_watch_desc: "边境的瞭望塔换成常设哨所，地图上没写归属的村镇被逐个标注。宣称抄自旧疆界的条目，一份也不撤。"
 LTN_river_debt: "河谷的债"
 LTN_river_debt_desc: "河谷几州的债务并入国库清算，债主的名字改成双塔。这笔钱买来的不是粮食，是河防线上多出的两个月。"
 LTN_war_industry: "战时工业"
 LTN_war_industry_desc: "民用线转产军需，厂房改成三班倒。消费品短缺先出现在配额表上，工厂的数目却在朝一条门槛线靠。"
 LTN_second_continent: "第二次大陆战争"
 LTN_second_continent_desc: "北线的大门推开，宣战文书在同一个上午送进各国公使馆。这一场仗在档案里的名字是第二次大陆战争。"
 LTN_south_claim: "南方的宣称"
 LTN_south_claim_desc: "南方各州的旧册被重新抄出，凡莱塔尼亚曾经宣称之地一律入档。这一步不下行军的命令，只留下依据。"
 LTN_hold_the_net: "扛住收网"
 LTN_hold_the_net_desc: "南线的要塞、铁路与粮站同时加固，投降的口径压到最低。网总要有人来收，先把手里这根绳子攥紧。"
 LTN_siracusa_card: "叙拉古牌"
 LTN_siracusa_card_desc: "南方的商路与侨民册子摆上桌，敌意在桌面之下计量。这张牌换不来和平，只换对方动手前多算的一晚。"
 LTN_federal_toll: "联邦的代价"
 LTN_federal_toll_desc: "为守住南方，国库把最后的储备换成军饷。若这道堤塌了，国号会在别人的文件里被改成另一个名字。"
 LTN_concert_of_four: "四方协奏"
 LTN_concert_of_four_desc: "四方的使节同坐一厅，各自的条款被并成一部总谱。这套秩序靠声望维持，而维持它的成本每年都要重谈。"
 LTN_golden_world: "金律的天下"
 LTN_golden_world_desc: "金律的抄本分发到新附庸的官署，文书格式全国统一。天下并不因此太平，只是争执改用同一套条文来吵。"
 LTN_lord_of_continent: "大陆之主"
 LTN_lord_of_continent_desc: "大陆两侧的战线在同一年收住，军队驻进缴获来的营地。这个称号由别人写下，写的人心里各有算盘。"

