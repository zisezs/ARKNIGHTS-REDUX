 KAZ_bop_pressure_desc: "我们选择了卡兹戴尔的命运，但我们的敌人同样不肯罢休——若我们不设法压制，这座天平迟早会彻底倒向他们。"
 kaz_civilwar.1.t: ""
 kaz_civilwar.1.d: ""
 kaz_civilwar.1.a: ""
 kaz_civilwar.2.t: "放行"
 kaz_civilwar.2.d: "军委会的部队在伦蒂尼姆驻扎了七年。七年里换过三批人，打过两场仗。营房的墙上还留着维多利亚人刷的标语，被新漆盖了三层，冬天一到，又从石灰底下透出来。\n\n现在他们回来了。运兵列车一列接一列开过南部边界，车皮上蒙着防雪的油布，炮管从油布底下伸出来，像一排没有收好的手指。\n\n边境哨所没有开枪。命令是从上面下来的，只有两个字：放行。\n\n守哨的年轻军官后来问过为什么不拦。回答是：拦不住。七个年头，一支军队在外面打了七年的仗，它回家的那一天，谁也拦不住。\n\n可南方几座城的守军在第三天早上才发现，军委会的部队没有在边境停下——他们直接接管了铁路枢纽、军械库和粮仓，宣布南方三州进入军管。\n\n特雷西斯没有等任何人批准。他是先动手的那一个。\n\n消息传到中部的时候，特蕾西娅正在看一份学校的名单。她看完，把名单折好，说：全线收缩，不抵抗，把部队集中到中部来。\n\n幕僚提醒她，南方三州就这样丢了。\n\n「丢了就丢了。」她说，「南方是他要的。他要的是边界，是粮仓，是能让他在谈判桌上坐得比我高的东西。给他。」\n\n「那中部呢？」\n\n「中部他拿不走。」她把名单递回给幕僚，「这里每一所学校、每一间诊所，都有巴别塔的人。他进了南方，就得替南方管饭、管水、管过冬的煤。他越往南，越是在替我们看着南方的门。」\n\n那年冬天，南下的列车和北上的列车在同一个岔道口错开。车窗上结了霜，两边的人都看不清对面那些脸。"
 kaz_civilwar.2.a: "她把那份名单重新打开，接着往下看。"
 kaz_civilwar.3.t: "我们是红军"
 kaz_civilwar.3.d: "卡兹戴尔北部是离乌萨斯最近的地方。这里的气候和乌萨斯更北的地区差不多：一年里有半年是雪，雪化了是泥，泥冻上了又是雪。白桦林一片接着一片，从边境这头一直铺到冻土那头。林子里没有路，只有踩出来的道——猎人走的道，走私犯走的道，还有游击队走的道。\n\n秋天的时候，红军从这里走了。他们走得安静：营地的灶坑用雪埋了，墙上刷的字用石灰盖了，村子里的人站在门口看，谁也没有说话。有人说他们去了乌萨斯，有人说他们散了，还有人说他们根本没走，只是钻进林子里去了。\n\n政府军随后南下。南方的城要人守，铁路要人看，三州的粮仓要人清点。北部的驻军一批批抽走，最后只剩下几处哨卡，守着一条没有人来的公路。\n\n然后，游击队又出现了。\n\n先是一个村子在早上发现灶台上的锅是热的——夜里有人来过，烤了火，喝光了锅里的水，把柴码回了原处。接着是第二个村子，第三个。到第五天，哨卡上的人从望远镜里看见白桦林边缘有红旗在动。\n\n不是一面，是一串。\n\n红军回来了。他们从乌萨斯边疆区回来，带着乌萨斯人给的棉衣、弹药和几十辆卡车；他们一鼓作气穿过白桦林，把秋天丢掉的那些游击区一个接一个重新拿了回来。北部的政府军没有兵力抵抗，撤得比来得还快。\n\n到目前为止，他们没有继续南下的意思。他们在做秋天做过的事——只不过这一次，是把灶坑重新挖开。"
 kaz_civilwar.3.a: "林子里的道，又有人走了。"
 kaz_civilwar.3.tt: "萨卡兹红军已经回到萨卡兹北方并占领了北部一些地区，但目前来看他们没有继续南进的打算"
