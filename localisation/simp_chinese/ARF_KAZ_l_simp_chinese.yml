#民族精神
 KAZ_aftermath_of_civil_war: "内战的阴影"
 KAZ_aftermath_of_civil_war_desc: "自从卡兹戴尔保持和平状态迄今已有二百余年，虽然大部分萨卡兹们还是从这种和平中享受到了极大的好处，但如今，卡兹戴尔正在被巴别塔和军事委员会实质上奉行的两种路线撕裂。军事委员会内部窃窃私语，或许已经有阴谋家提出了在关键时刻“不排除”使用未被开启的潘多拉魔盒决定卡兹戴尔的命运……但至少在当下，这些事情都只是卡兹戴尔人心中不怎么外化的阴影。"
 KAZ_Kazdel_revanchism: "卡兹戴尔帝国的幽灵"
 KAZ_Kazdel_revanchism_desc: "几乎所有萨卡兹青年都会唱“我们魔王，首创革命，革命血如花，粉碎了联军，建设了巴别塔，产生了自由之国，卡兹戴尔新成，国事如麻，魔王详加计划，重新改造国家……”，不错，既然卡兹戴尔已经在勉强跻身了近代化国家的序列之中，那么建设之后呢？尽管魔王从来没在公开场合表态过很多事情，但一些跃跃欲试的军事贵族们已经准备投入战争向曾经和萨卡兹有血债的国家复仇并光复他们想象中那个萨卡兹最伟大的国家——被毁灭的卡兹戴尔帝国了。"
 KAZ_Kazdel_revanchism_tt: "当前复仇主义狂热：低\n当前伤亡：0K"
 KAZ_blood_of_Tikaz: "提卡兹之血"
 KAZ_blood_of_Tikaz_desc: "在漫长的历史长河中，古萨卡兹——提卡兹的血脉被稀释的不再纯粹，但如今的萨卡兹内部的王庭依旧保留着许多纯血的萨卡兹种族，拥有尊贵的提卡兹血脉传承，他们几乎无一不是身经百战的老兵，加上萨卡兹本就是一个尚武种族的因素，我们的军队素养和传统依旧在泰拉大陆堪称顶尖，这是不可否认的事实。"
 KAZ_country_of_infected: "感染者国家"
 KAZ_country_of_infected_desc: "萨卡兹先天就是全员源石病，尽管特蕾西娅陛下已经在过去数十年间极大的改善了卡兹戴尔的医疗和卫生环境，但无可置疑的是源石病在目前仍然是民族健康和国家现代化建设中的巨大阻碍……"
 KAZ_abandoned_by_Terra: "泰拉弃民"
 KAZ_abandoned_by_Terra_desc: "虽然卡兹戴尔依靠着陛下的计划经济政策实现了恢复，但是卡兹戴尔的外交国际声望却因为过去的历史而很难迅速改观了。特蕾西娅尽力争取，但除了炎国和哥伦比亚愿意与我们进行一些最小限度的交流，几乎没有国家愿意主动和我国往来。再加上军事委员会对我们外交几乎起到完全的副作用，目前来看，卡兹戴尔只能做到这样了。"
 KAZ_Kazdel_interference_army: "卡兹戴尔国防军"
 KAZ_Kazdel_interference_army_desc: "军事委员会带走了卡兹戴尔国家内部的主力前往伦蒂尼木，但卡兹戴尔的军队依旧是巴别塔和军事委员会争夺的焦点。随着伦蒂尼姆战事的不利，卡兹戴尔的军队日益成为敏感的政治关注点。"
 KAZ_Kazdel_interference_army_tt: "§R无法训练、解散部队或编辑部队编制§!"
 KAZ_babel_plan: "巴别塔计划"
 KAZ_babel_plan_desc: "巴别塔是特蕾西娅陛下意识形态和思想路线的集大成者，它成功的恢复了卡兹戴尔的经济，尽管这一成果依旧脆弱且效果有限，它还是为卡兹戴尔的近代化做出了巨大贡献。"

#事件
 event_kaz.1.t: "驱逐异见者"
 event_kaz.1.d: "在军事委员会各个将领的联合围剿下下，由“背叛者”康拉德·克内希领导的，自称为红军的叛乱者已经被我们击溃，但战场并未发现康拉德本人的尸体，根据后续侦察到的残部的逃离方向，推测他们已经跨过我们与乌萨斯的边境进入乌萨斯布拉戈维申斯克地区。\n\n但根据前线指挥部的分析，这支残兵败将已经不会再对我们造成任何的威胁。\n\n同时对于先前对叛乱者提供支持的民众的处理工作也正在展开。"
 event_kaz.1.a: "背叛萨卡兹意志者终将被毁灭"
 
