#国家元首
 KAZ_King_Theresis: "特雷西斯"
 KAZ_King_Theresis_desc: "特雷西斯将军是卡兹戴尔军事委员会的委员长，同时也是魔王特蕾西娅的兄长和最为坚定的维护者……吗？既然在其位而谋其政，特雷西斯自然也要为他麾下的将领，贵族和王庭们说好话。他不自觉地被代表了，然后接受了这种作为萨卡兹另外一种路线的代言人和引领者。特雷西斯已经成了特蕾西娅的最大拥护者和最大反对者，而他本人正坐阵伦蒂尼姆城市中指挥……此时密信传来巴别塔方面似乎有所动作，特雷西斯似乎已经意识到了什么，而他和支持他的代表卡兹戴尔的另外一种命运的人都不会甘于接受这样的结局的。"
 KAZ_gen_Theresia_desc: "该用怎样的语言，才能完全形容特蕾西娅——这位哥伦比亚《时代》杂志的三次封面主题人物、全大地萨卡兹最合法的魔王，巴别塔组织的创立者、罗德岛创始者、卡兹戴尔移动都市建立者，卡兹戴尔六英雄之一，卡兹戴尔军事委员会创始人之一、卡兹戴尔王国的最高领导者呢？千言万语，也无法概述出新一代萨卡兹青年对特蕾西娅的拥护和爱戴，卡兹戴尔的移动城市里，特蕾西娅的画像和摄政王一起被挂在墙壁上，她的雕像被建立在每一座城市的中央，感谢她带领了卡兹戴尔战胜联军，感谢她接过黑王冠并担任魔王二百年，感谢她开启了卡兹戴尔的工业化和科技革命……\n特蕾西娅站在高台之上不言。她的双手延展出丝线，丝线又蜿蜒为河流。魔王的双眼看向远方，回首却依然是忧伤和彷徨。进入泰拉1000年第一个世纪以来，卡兹戴尔在她的手上一度汇聚成一件精密的衣服，却又被河流撕裂成一团团稀碎的布料。工人农民在抱怨卡兹戴尔恶劣卑微的待遇，王庭享受发展红利而意图争取帝国的赫赫功业，日益走向激进化的萨卡兹红军和军事委员会趋向两极，乃至让魔王本人夹于中间当作卡兹戴尔的裁缝为这一踽踽独行的新生近代化国家胡裱外衣。特蕾西娅既不能完全对抗于王庭建制的力量，以至于半默许甚至是一定程度上推动了军事委员会对红军的围剿和红军的最终流亡，又不能完全满足于军委会狮子大开口般的征服欲望而将国家命运绑上军国主义的战争。于是魔王只能更加审慎，更加稳健，将继续推进国家建设的厚望共同交到拥护她却又不拥护她的人手中承担起来，用这样的慈悲愿景继续维持着卡兹戴尔的团结和统一。\n1086年，军事委员会意图参与伦蒂尼姆的军事冒险行动，特蕾西娅和巴别塔内部成员为此讨论数个日月，但最终达成了一个巨大的共识：事到如今，巴别塔已经对军事委员会的独走行为无能为力。最终在魔王只能选择维持卡兹戴尔的完整性。但她也清晰的意识到随着军事委员会主力的外移，这正是在本土节制军委会和更好清洗其军国主义支持者的好时机……\n如今，军事委员会在伦蒂尼姆仅仅也只能作困守姿态，补给不足，占领区的自生产力几乎被降至最低，维多利亚帝国的各大公爵似乎已经联合起来对军事委员会发动一次最大的进军，特蕾西娅、凯尔希和博士已经决意就此次可以遇见的兵败来做出削弱军事委员会的力量的大动作。\n然而，现实会如她想的如此简单吗？"
