#民族精神
 KAZ_aftermath_of_civil_war: "内战的余波"
 KAZ_aftermath_of_civil_war_desc: "残酷而旷日持久的内战刚刚结束，但它残留的影响依然挥之不去。闭上眼，一切仿佛还是昨日的样子。"
 KAZ_Kazdel_revanchism: "卡兹戴尔复仇主义"
 KAZ_Kazdel_revanchism_desc: "萨卡兹这个种族在可记录的历史中始终是被世界所仇恨的存在，生存的窘境与长久的战乱将无数仇恨铭刻在了萨卡兹人的血脉之中。现在，内战的胜利者们选择了憎恨与复仇，选择带领卡兹戴尔将这片大地拖入战争的深渊。\n不过切记，战争的残酷将会让人们心底的火焰渐渐降温。或许我们需要不断地给复仇之火添上柴薪。"
 KAZ_Kazdel_revanchism_tt: "当前复仇主义狂热：低\n当前伤亡：0K"
 KAZ_blood_of_Tikaz: "提卡兹之血"
 KAZ_blood_of_Tikaz_desc: "在一千多年前，提卡兹们凭借着强悍的源石技艺使得卡兹戴尔几乎成为了泰拉的同义词。此后，虽然卡兹戴尔的强权在大叛乱后彻底灰飞烟灭，但无家可归的萨卡兹们依旧有着远超普通种族的法术天赋和源石亲和性。这份力量使得萨卡兹个体的战力极为强悍，也让萨卡兹几乎成为了感染者的同义词。"
 KAZ_country_of_infected: "感染者国家"
 KAZ_country_of_infected_desc: ""
 KAZ_abandoned_by_Terra: "泰拉弃民"
 KAZ_abandoned_by_Terra_desc: "萨卡兹在这片大地上的绝大部分国家和地区都相当不受欢迎。由萨卡兹重建的卡兹戴尔亦然。没有太多势力愿意与我们进行正常的贸易，更别提对卡兹戴尔进行投资了。至少在当下，我们必须自己想想办法。不过好在泰拉各地的冲突正在愈演愈烈，在肉眼可见的将来这种状况应该会有所好转。毕竟当利益够大，对萨卡兹的厌恶与警惕也就不值一提了。"
 KAZ_Kazdel_interference_army: "卡兹戴尔干涉军"
 KAZ_Kazdel_interference_army_desc: "伟大领袖特雷西斯即将前往维多利亚为萨卡兹争取宝贵的喘息时间。需要注意的是，他带走了绝大部分军队和军官，留在卡兹戴尔本土的只有堪堪够用的各王庭卫戍部队。虽然不太可能有意外变故发生，但我们最好保持应有的警惕。"
 KAZ_Kazdel_interference_army_tt: "§R无法训练、解散部队或编辑部队编制§!"

#事件
 event_kaz.1.t: "驱逐异见者"
 event_kaz.1.d: "在军事委员会各个将领的联合围剿下下，由“背叛者”康拉德·克内希领导的，自称为红军的叛乱者已经被我们击溃，但战场并未发现康拉德本人的尸体，根据后续侦察到的残部的逃离方向，推测他们已经跨过我们与乌萨斯的边境进入乌萨斯布拉戈维申斯克地区。\n\n但根据前线指挥部的分析，这支残兵败将已经不会再对我们造成任何的威胁。\n\n同时对于先前对叛乱者提供支持的民众的处理工作也正在展开。"
 event_kaz.1.a: "背叛萨卡兹意志者终将被毁灭"
 
