 KAZ_bop_pressure_desc: "我们选择了卡兹戴尔的命运，但我们的敌人同样不肯罢休——若我们不设法压制，这座天平迟早会彻底倒向他们。"
 kaz_civilwar.1.t: "噩耗"
 kaz_civilwar.1.d: "巴别塔顶层的参谋长办公室里，烟灰缸里已经横七竖八躺了四五个烟蒂，博士手上却还烦躁地夹着半截燃着的纸烟。\n\n兵力最多的威灵顿公爵要挟联军拿到塔拉地区独立自治的承诺后，居然当晚就带着嫡系部队撒丫子跑路和爱布拉娜会合去了；温德米尔与开斯特公爵的军队从开战之初就出工不出力，炮兵阵地迟迟不推进，陆行舰遇到萨卡兹火炮一哄而散。然后眼见威灵顿跑路，两个公爵紧跟着收拾行装准备退兵；高多汀公爵从联军组建到开战自始至终没派一兵一卒过来，全程在作壁上观。\n\n就这么一帮各怀鬼胎的酒囊饭袋，撑了不到几个月便一哄而散。所谓的维多利亚联军分崩离析，各大公爵领兵退回各自势力范围内，原本好不容易才凝聚的临时议会现在彻底名存实亡，整个维多利亚帝国再度陷入多方角逐的混战局面。\n\n博士狠狠吸了一口烟，缓缓吐出来。原本的全盘计划被这帮维多利亚贵族搅得粉碎。他猛然按灭烟蒂，随后推开办公室的门顺着楼梯往下走。\n\n刚走到作战指挥室，博士就听见里面传来凯尔希的声音。博士推门进去时，正看见她站在长桌前，面前站着垂头丧气的维多利亚方向情报主管。\n\n“我要你们的情报网是干什么用的？”凯尔希少有的失态传到博士的耳朵里，“维多利亚官方说联军兵强马壮、同仇敌忾，你们就原封不动地报回来吗？这几个大公爵心里打的什么算盘，你们打探过吗？连最基本的内部派系矛盾都摸不清楚，就敢断言联军能一战压垮伦蒂尼姆防线？”\n\n情报主管低着头，一句话也不敢辩解。凯尔希按着眉心：\n\n“现在好了？！一仗打下来，特雷西斯他们反倒打出了虽败犹荣的声势。我们本来还能计划削他们的兵权，现在是半点理由都没有了。等军事委员会部队回撤回来，他们第一件事就是拿着之前我批给他们的补给清单指责巴别塔拖战争后腿。你们知不知道？！特雷西斯将军一定一定会借大胜的势头向陛下发难的！到时候被动的是我们。”\n\n“凯尔希。”\n\n博士开口叫停了她。他冲屋里其余几名情报人员抬了抬下巴，“你们先出去，通知各部门负责人，半小时后到议事厅参会。”\n\n几名参谋如蒙大赦，匆匆低头退出了房间，通讯室里只剩下他们两人。\n\n博士走到桌前，点了点伦蒂尼姆的位置，语气已经恢复了一贯的胸有成竹，仿佛从未烦躁过：\n\n“我算过了。特雷西斯他们赢了一次，但他们已经没有办法继续守在伦蒂尼姆了。城区大半打成了废墟，还有公民军的袭扰，再耗下去，对他们反而不利。这场仗打完，军委会的主力必然回撤卡兹戴尔。”\n\n他抬眼看向凯尔希，指尖缓缓向南划过地图：\n\n“现在谈完全收回权力，已经不现实了。我们当下最该做的，是提前划清边界——不能让他们带着大胜的势头，回撤之后顺势挤占南部更多的聚居地与矿区。绝不能再让。”"
 kaz_civilwar.1.a: "山雨欲来啊……"
 kaz_civilwar.2.t: "放行"
 kaz_civilwar.2.d: "军委会的部队在伦蒂尼姆驻扎了很久了。尽管一些人永远留在了异国他乡，但大部分人带着更多的荣誉、更丰富的作战经验回到了他们的故乡。\n\n运兵列车一列接一列从维多利亚方向开过南部边界，一节节车皮上蒙着防雪的油布，炮管在油布底下若隐若现，车厢里坐着满载荣誉的各大战争王庭士兵。\n\n南方王庭本来就支持特雷西斯，边境哨所的士兵没有开枪，直接放行。\n\n军委会的部队当然也没有在边境停下——他们直接接管了特雷西斯派传统占据优势的几个州的铁路枢纽、军械库和粮仓，宣布南方几个州暂时进入军管。\n\n特雷西斯没有等任何人批准。他是先动手的那一个。\n\n消息传到中部的时候，特蕾西娅正在阅读一份新的报纸。她看完，把报纸折好，说：按照计划执行吧，把所有魔王派的部队集中到卡兹戴尔城来。\n\n“南方丢了就丢了。”博士在军事会议上对着魔王派的军官们说道，“南方在很多年前本来就是军委会和王庭保守派的地盘，不是很意外的事情。”\n\n“但是，卡兹戴尔城和卡兹戴尔中部地区，已经完全属于我们了。”凯尔希冷静地对着医疗部的人分析道，“这里的学校和诊所全都是巴别塔我们的人开的。他进了南方，就得继续维持我们巴别塔以前经营的公共事业来笼络人心。”\n\n南下的列车和北上的列车在同一个岔道口错开。卡兹戴尔的局势变得非常微妙，但双方谁也没拦住谁。只是车窗上结了霜，让两边的萨卡兹同胞都看不清对面那些脸。"
 kaz_civilwar.2.a: "特蕾西娅打开一本杂志，正是哥伦比亚时代杂志她的那版。"
 kaz_civilwar.3.t: "我们是红军"
 kaz_civilwar.3.d: "卡兹戴尔离乌萨斯最近的地方，气候和乌萨斯更北的地区差不多：一年里有半年是雪，雪化了是泥，泥冻上了又是雪。\n\n白桦林一片接着一片，从边境的这头一直铺到冻土那头。林子里有不少踩出来的道路——只有那些猎人、走私犯还有游击队会用到，除此之外，萨卡兹的村民大多只是躲在村子里过活。\n\n不过这里确实成为了政府军和红军对抗的游击战场。红军躲进林中，政府军追上来，红军探出头去，政府军又被拔掉些据点，然后双方猛烈交火，留下一地狼藉被雪掩埋后又重复了一遍又一遍，再被雪掩埋一层又一层。\n\n那年春天，红军终于从这里走了。他们把隐藏的营地灶台和坑用雪掩埋了，村庄墙壁上刷的字没有动，但后来也给政府军删改或者涂掉了。红军走的那天，村子里所剩不多的人站在门口看，最终谁也不再说话——他们对此感到了厌倦。有人说他们去了乌萨斯，有人说他们散了，还有人说他们根本没走，只是钻进林子里去了。\n\n政府军随后南下，听说卡兹戴尔政府里也起了内讧，于是北部的驻军被一批批抽走了，最后只剩下几处边境的哨卡做样子。\n\n然后，游击队又出现了。\n\n哨卡上的人从望远镜里看见，白桦林边缘有无数红旗在动。\n\n一些萨卡兹红军回来了。他们带着乌萨斯的棉衣、弹药和几十辆卡车，一鼓作气穿过白桦林，把那些丢掉的游击区一个接一个重新拿了回来，甚至完全控制了北方几个小城镇。北部的政府军已经没有兵力抵抗，眼见事态无法控制，于是直接撤退了。\n\n到目前为止，他们没有继续南下的意思。"
 kaz_civilwar.3.a: "林子里的道路，又有人走了。"
 kaz_civilwar.3.tt: "萨卡兹红军已经回到萨卡兹北方并占领了北部一些地区，但目前来看他们没有继续南进的打算"
 kaz_civilwar.4.t: "决裂"
 kaz_civilwar.4.d: "魔王宫的门开着。\n\n特雷西斯带了三十个人进去。都是王庭出身的老兵，跟了他二十年以上的那种，佩刀，不佩枪——进宫佩枪是失礼。他自己走在前头，军靴踩在大理石上的声音在整个前厅里回响。他本来是准备好要发火的。\n\n前厅两边的卫兵全换了。原来是国防军第一卫队的礼兵，红披风，持戟；现在是一身灰的巴别塔护卫，短铳挂在胯上，手一直放在铳柄上。\n\n他们没有行礼。\n\n特雷西斯走到第二道门前停了一下，回头数了一眼：三十个人，一个不少。门里有脚步声，很轻，不像一个人的脚步。\n\n他推门进去。\n\n魔王宫的正殿很大。穹顶上画着历代魔王的加冕图，一盏一盏的吊灯从梁上垂下来，眼下只点了三盏。正对着门的九级台阶上，那把椅子空着。\n\n台阶最下面一级，坐着博士。\n\n他穿着一身国防军的军装，风纪扣松着，帽檐压得很低，正拿着一支烟抽。看见特雷西斯进来，他也没站起来，只是把烟从嘴里拿下来，在靴跟上磕了磕。\n\n「特雷西斯将军。」他说，「好久不见。」\n\n阿斯卡纶站在第三根柱子旁边的阴影里，背靠着柱子，什么也没拿，脸上什么表情也没有。凯尔希在另一侧，捧着一份文件，站得很直，像一根桩子。\n\n再往外圈，是兵。特雷西斯是军人，他不需要看第二眼就知道：正殿的回廊上有两排人，左边十七个，右边十九个，枪口都朝下，保险都开着。正门上方那个拱窗后面还有，他数不清。\n\n「魔王陛下在哪里。」特雷西斯问。\n\n博士抽了一口烟，把烟吐向侧面——那个方向站着阿斯卡纶。阿斯卡纶没有动，连眉头都没动一下。\n\n「陛下已经在特蕾西娅施塔特了。」博士说，「前天夜里走的。您进城的马车，我们给它让了道。您没注意？」\n\n特雷西斯的下颌绷了一下。\n\n「所以，」博士把烟按在台阶上，慢慢站起来，「您今天来，是来请安的，还是来接管这座城的？」\n\n殿里没人说话。回廊上有个兵换了一下重心，靴底在石头上响了一声。\n\n「将军，」博士说，「我不打算在这儿杀您。」\n\n他往前走了两步，走到台阶边上。\n\n「不是因为做不到。您带进来的这三十个人，我认得其中十一个——都是打过硬仗的，一个能顶五个。可这座殿里现在有九十多个人，而且他们站着，您的人得先转过半个身。三十对九十，还要仰着头打上面的回廊。这个账，您自己会算。」\n\n「我不杀您，是因为杀了更麻烦。您死在这儿，南边那几座王庭明天早上就会各自称王，剩下几万人在卡兹戴尔和我们之间来回拉锯，拉三年。三年，我们耗得起，这座城耗不起。」\n\n他停了一下。\n\n「所以我奉劝您，将军，好好想一想：现在争这座城，值得不值得。」\n\n特雷西斯没有立刻回答。\n\n他在心里把账算了一遍，算得很快——因为他在战场上算过一千遍。他能带进来的只有三十个人，回廊上有三十六支枪，拱窗后面还有。他的精锐能打，可在这样一座殿里，能打是最不值钱的一样东西：这里没有展开的余地，没有侧翼，没有预备队，只有站着的人和躺着的人。\n\n他还算了另一件：如果他现在动手，死在这里，南边的王庭会怎么样。\n\n那几座王庭这几年之所以还听他的，不是因为他姓什么，是因为他手里有兵。兵在他身上。他死了，兵就散了，散了的兵守不住任何一座王的位子。他们会先互相打，然后各自去跟巴别塔谈条件，谈得成的留着，谈不成的死。\n\n这笔账，他算得很清楚。\n\n「参谋长说得是。」特雷西斯说。\n\n他的声音很平，平得几乎听不出什么来。\n\n「我今天来，是来向陛下述职的。陛下既然不在，我改日再来。」\n\n博士看着他，看了有几秒钟，然后笑了一下——不是那种赢了之后的笑，是那种已经知道结果、只是确认了一下的笑。\n\n「那我送您。茶还热着，喝完再走？」\n\n「不必。」\n\n特雷西斯转身，走出正殿。他走得很稳，一步都没有快。三十个人跟着他出去，一个人也没有回头。\n\n出魔王宫的门，下十七级台阶，上车。车门关上的那一瞬间，他脸上那层平的东西全部掉了下来。他在心里骂了一句很难听的话，骂的是那个坐在台阶上抽烟的人。\n\n随行的副官问：「将军，我们回南边吗？」\n\n「不回。」\n\n他把地图从座位底下抽出来，摊在膝盖上，手指直接点在卡兹戴尔城的位置。\n\n「传我的命令。第三军、第五军，所有能动的部队，天黑之前集结到西郊。重炮全部留下，只带轻装。」\n\n副官愣了一下：「不带炮？」\n\n「不带炮。炮要三天才能运到，三天以后这座城就变成一座堡垒了。」\n\n特雷西斯的手指从西郊划到城心。\n\n「三个团夜里进城。先拿动力室，再拿轨道闸口。城开不动，就关在里头打。不等南边的援军，不宣战，不通报，天亮之前，我要看到魔王宫的旗子换下来。」\n\n车厢里安静了一会儿。\n\n「将军，」副官小声说，「这是……开战。」\n\n「这是让他们没有时间开会。」\n\n特雷西斯把地图折起来。\n\n同一天傍晚，博士站在魔王宫的正门口，看着那辆马车拐过街角。\n\n阿斯卡纶从阴影里出来，站到他旁边。\n\n「他会回来吗。」\n\n「今晚。」博士说，「他不会等。他在伦蒂尼姆等了七年，等的就是这个。」\n\n凯尔希走过来，把手里的文件递给他：「信已经发去特蕾西娅施塔特了。陛下问，需不需要她回来。」\n\n博士接过文件，没有看，抬头看了一会儿天。\n\n「不用。让她在那边等消息。」\n\n「那这座城怎么办？」\n\n博士把文件卷起来，塞进大衣口袋，转身往宫里走。\n\n「把城开起来。」\n\n凯尔希在原地站住：「轨道闸口要四个小时预热。」\n\n「那就现在开始。」"
 kaz_civilwar.4.a: "把这座城开起来。"
