#国家元首
 KAZ_King_Theresis: "“魔王”特雷西斯"
 KAZ_King_Theresis_desc: "他是萨卡兹的拯救者，自内战中脱颖而出的魔王，只有他才能团结起萨卡兹人们。也是萨卡兹意志的践行者。外国的媒体曾评价他为王庭中最冷血的混蛋，这片大陆上最恶劣的阴谋家与战争恶疾的携带者。但不论如何，在萨卡兹人的眼里，他会做出最英明的决断以引领这个民族走向最终的命运。"
 KAZ_Sarrick_Warrenworth: "萨里克·沃伦沃斯"
 KAZ_Sarrick_Warrenworth_desc: ""
 KAZ_Conrad_Kernesch: "康拉德·克内希"
 KAZ_Conrad_Kernesch_desc: ""
 
