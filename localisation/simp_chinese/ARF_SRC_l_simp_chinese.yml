#国家领导人/将领/内阁
 SRC_Madam_Sicily: "西西里夫人"
 SRC_Madam_Sicily_desc: "西西里家族从未想象过，自己的领袖可以达到西西里夫人如今的高度，也从未预料到，这名从外界归来的女子会亲手摧毁她所领导的家族。西西里夫人曾经也是一个满腔热血的少女，她也曾经尝试远赴拉特兰，将“铳与秩序”带回叙拉古。她成功了，但也没完全成功。名为国家的暴力机器短暂地压制住了家族，但家族的根系也迅速扎进国家之中，叙拉古从原始的野蛮蜕变成了文明的野蛮。西西里夫人疲惫了，她不再试图改造叙拉古，只想维护来之不易但收效甚微的改革成果，曾经的狂热女孩变成了一个现实主义的老人。然而，随着整个泰拉重新开始脉动，变革的机遇再次出现在这片沉寂的群山之间，嗅觉灵敏的老狼，也将再次亮出她许久未用的獠牙。"
 SRC_Agenir: "阿格尼尔"
 SRC_Agenir_desc: "当叙拉古崩塌，她的缔造者西西里夫人选择了自我放逐。在这个危机时刻，西西里夫人的战友，阿格尼尔神父选择挺身而出。既然是他帮助西西里夫人将铳与秩序带到了叙拉古，那么他就有义务再帮一次。"
 SRC_Agenir_second_in_command_desc: "阿格尼尔，萨科塔出身的神父，叙拉古统一秩序的建立者之一。作为西西里夫人的最亲密战友，阿格尼尔神父在政府中承担了许多职责，主要是那些既不需要抛头露面，也不需要弄脏手套的工作。"
 SRC_Alberto_Saluzzo: "阿尔贝托·萨卢佐"
 SRC_Bernardo_Bellone: "贝纳尔多·贝洛内"
 SRC_Giovanna_Rossati: "乔万娜·罗塞蒂"
 SRC_Fabrizio_Venezia: "法布里奇奥·威尼斯"
 SRC_Leontuzzo_Bellone: "莱昂图索·贝洛内"
 SRC_Mario_Segale: "马里奥·谢加列"
 SRC_Anton_Garencio: "安东·嘉兰西奥"
 SRC_Benedetta_Napolini: "贝妮黛塔·那玻利尼"
 SRC_Benedetta_Napolini_desc: "如果褪去信徒和她本人对“贝妮黛塔·那玻利尼”的包装，这个文弱女子的经历似乎与叙拉古的领袖不太匹配。贝妮黛塔曾经是逃离叙拉古的移民的一员，但她最终选择了从哥伦比亚返回，抑或是第二次逃离。在旅程中，她先后接触了工团主义和法西斯主义，最终在拉克玛瓦蒂城的古墓广场创造出了民族工团主义。再之后，也许是民族工团主义的主张能够俘获人心，也许是贝妮黛塔有着某些独特的人格魅力，她所创建的“战斗民族工团”在叙拉古社会的混乱中迅速扩张，在权钱交易与街头暴力中成长为一支规模巨大的准军事组织。而这支身着黑衫的民兵部队，成为了叙拉古内战的最后生还者，贝妮黛塔·那玻利尼，也随之蜕变为了这片土地最具有权势的女人。贝妮黛塔·那玻利尼如今已经无法分清，移民、文学少女、帮派头子，哪一个她才是自己真正想成为的人，但鉴于目前只有一个选项，那么自己最好扮演好“Duce”所指代的那个贝妮黛塔。"
 SRC_Lappland_Saluzzo: "拉普兰德·萨卢佐"
 SRC_Lappland_Saluzzo_desc: "她是什么？\n没有人知道拉普兰德在想什么，甚至没人知道她到底是“什么”。萨卢佐家族曾经最优秀的杀手，狼主的主人，情绪稳定的精神病人。这些标签对如今的拉普兰德都无关紧要。她恨家族吗？拉普兰德无法回答。她的人生确实在家族争斗中变得面目全非，可是那些倒在血泊中的打手也曾给过萨卢佐家的大小姐塞过糖果。她爱叙拉古吗？拉普兰德自己也说不清楚。这片土地被家族吸走了太多的血，可如今她只是让叙拉古流下更多的血。但无论如何，家族的统治都在灰厅的那场惊天爆炸中土崩瓦解，而拉普兰德只是想为这次行动进行一个完美的收尾。"
 SRC_Alberto_Saluzzo_desc: "萨卢佐家族的家主，把持着叙拉古葡萄酒的命脉。他惯于在每一场风暴里谨慎下注，从不把筹码一次押光——从沃尔西尼的争夺到新沃尔西尼的周旋，萨卢佐的酒庄始终开着门。即便身陷囹圄，他的账本仍在暗处决定许多人的酒杯。"
 SRC_Giovanna_Rossati_desc: "前罗塞蒂家主。她曾远走哥伦比亚，整合家族残部重返叙拉古，也为这片土地带回了移动城市的技术。如今的她放下账本、拿起鹅毛笔，以剧作家的身份留在公众视野里——罗塞蒂这个名字，依旧是一种政治象征。"
 SRC_Walach: "瓦拉赫"
 SRC_Walach_desc: "罗塞蒂家族在沃尔西尼的领袖。他从乔万娜手中接过罗塞蒂，也把家族私兵牢牢攥在手里——在沃尔西尼的街头，他的名字比市政厅的公章更管用。"
 SRC_Dmitri_Bellone: "德米特里·切塔尔多·贝洛内"
 SRC_Dmitri_Bellone_desc: "贝洛内家的新家主，同时也是萨卢佐酒业的实际掌权者。他与莱昂图索分执新沃尔西尼“铳与秩序”的两端，一边是账本，一边是法槌——政与经的两条线，在他手里拧成同一根绳子。"
 SRC_Fabrizio_Venezia_desc: "威尼斯家族的家主，人称“老威尼斯”。他果断切割了安东尼奥与家族的牵连，向市政厅示好，用最小的代价维持着威尼斯的体面——只要名字还挂在灰厅的名单上，家族就还没输。"
 SRC_Leontuzzo_Bellone_desc: "新沃尔西尼市长，曾经的贝洛内少爷。他推动“无家族城市”，用《新都市管理法案》及修正案一点点撬动旧秩序——一个贝洛内家的人，正在亲手拆掉贝洛内们的世界。人称“伺夜”。"
 SRC_Lavinia_Falcone: "拉维妮娅·法尔科内"
 SRC_Lavinia_Falcone_desc: "新沃尔西尼大法官，前叙拉古城邦法官。她戴着荆棘手套走进黑暗，用《管理法案》修正案为改革派开路——在这座以家族为骨的城市里，她是少有的、真的相信法槌的人。人称“斥罪”。"
 SRC_Irene: "伊雷妮"
 SRC_Irene_desc: "卡车工会与卡车互助会主席，如今的运输保障署署长。她代表着叙拉古最沉默也最结实的力量——方向盘后的劳动者。公路是她的战场，物流是她的语言。"
 SRC_Bernardo_Bellone_desc: "前贝洛内家主。他比任何人都更清楚家族的病在哪里，也比任何人都更舍得下注——为了一个“没有家族的叙拉古”，他愿意点燃整张棋盘。"
 SRC_Rubio: "卢比奥"
 SRC_Rubio_desc: "建设部官员。他的名字常年只出现在公文的末尾，直到他决定把积压多年的怨气在演说里一次说完——那句话至今仍在新沃尔西尼的街头回荡。"
 SRC_Caracci: "卡拉奇"
 SRC_Caracci_desc: "食品安全部官员。他清楚这座城市消化不良的病因，也知道面包的价格连着多少人的良心——于是他选择把这件事说给所有人听。"
 SRC_Antonio_Venezia: "安东尼奥·威尼斯"
 SRC_Antonio_Venezia_desc: "他策划控制新沃尔西尼，在全城最安静的地方推进着最喧闹的野心——只要棋盘还在，他就永远有下一步。"
 SRC_Silva_Moretti: "席尔瓦·莫雷蒂"
 SRC_Silva_Moretti_desc: "莫雷蒂家族的家主。家族的旧宅还立在城里，名字还挂在灰厅的墙上——他很清楚，坐在这两样东西中间的滋味。"
 SRC_Texas: "德克萨斯"
 SRC_Texas_desc: "德克萨斯家族的末裔，企鹅物流的特别顾问。她很少说话，但她的剑在新沃尔西尼说得很多——无论象征还是实际，这座城市都绕不开她的名字。"
 SRC_Shalay: "沙雷"
 SRC_Shalay_desc: "卡西米尔“黄金平原”酒业的老板，商业联合会成员。他并非叙拉古人，却比许多叙拉古人更深地介入了新沃尔西尼的政经博弈——商人没有祖国，只有生意。"
