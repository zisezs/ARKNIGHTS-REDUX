#国策

#民族精神
 SRC_Wild_Hunt: "狼之主的狂猎"
 SRC_Wild_Hunt_desc: "在叙拉古的家族、法官与移动城市之上，还盘踞着一层更古老的非人秩序。狼之主自荒野而来，不死不灭，挑选人类作为“獠牙”，令其彼此狩猎；拥有未折断獠牙者，被尊为“头狼”。这场游戏不写入灰厅法典，却能让贝纳尔多、扎罗、拉普兰德、红等人的命运偏转。凡人以为自己在争夺城市，实则有时只是狼群游戏中的棋子。狂猎无声，却始终在叙拉古的阴影里奔跑。"
 SRC_Grey_Hall: "灰厅-铳与秩序"
 SRC_Grey_Hall_desc: "西西里夫人自拉特兰带回“铳与秩序”，并以此创建灰厅。灰厅由西西里夫人与十二家族共同参与，决定叙拉古重大事务；其核心戒律，是十二家族不得互相倾轧。铳代表不可挑战的暴力，秩序代表家族必须遵守的底线。巨狼之口则是这份秩序的牙齿。它让叙拉古免于彻底碎成二十二座城邦，却也将所有冲突压入地下。灰厅不是议会，而是悬在家族头顶的铳口。"
 SRC_Grey_Hall_ws_tt: "战争支持度越高，稳定度越高：每 20% 战争支持度提供 §G+20%§! 稳定度"
 SRC_Twelve_Families: "十二家族的蛰伏"
 SRC_Twelve_Families_desc: "十二家族是叙拉古真正的地方权力。它们各自掌握移动城市，控制产业、财富、私兵与地方网络，并在灰厅中分享国家重大事务。因“不得互相倾轧”的规则，家族不能公然开战，于是明面蛰伏、暗地渗透、结盟、背叛、清算。莫雷蒂被灭，贝洛内覆灭又重建，萨卢佐、罗塞蒂、威尼斯各怀心思。新沃尔西尼宣称不允许家族入驻，但蛰伏的家族从未真正退场，只是在等待下一次撕咬。"
 SRC_Joint_Council: "形同虚设的城邦联合议事会"
 SRC_Joint_Council_desc: "城邦联合议事会名义上是叙拉古的中央行政机关：各城邦派出代表，再从代表中产生议事会主席，即名义上的国家领导人；下设部门处理政务。然而，真正决定叙拉古命运的是西西里夫人、灰厅与十二家族。议事会提供现代国家的外壳，却常被家族利益架空。部长可以被收买、威胁或替换，主席难越雷池半步。它像盖在灰厅圆桌上的桌布，遮住底下铳与家族的博弈。"
 SRC_United_Court: "名头响亮的城邦联合法院"
 SRC_United_Court_desc: "城邦联合法院名义上掌握叙拉古最高立法权与司法权，实际运行中大多只是中央司法机构。叙拉古没有警察系统，法官甚至要负责维护社会治安。法院是西西里夫人秩序的代理，负责监视并预防十二家族斗争；但家族干预、替罪者、威胁与暗杀，使法槌常常落向早已写好的结局。即便如此，仍有拉维妮娅这样的法官，戴着荆棘手套走入黑暗。法院名头响亮，公正却需以血开路。"
 SRC_Mafia_State: "秩序井然的黑帮之国"
 SRC_Mafia_State_desc: "叙拉古有议会、法院、货币、移动城市与发达服务业，表面像一座秩序井然的国家；但真正支配它的是家族、灰厅与“铳与秩序”。家族像黑帮一样控制城市、产业与暴力，却必须在规则下维持表面和平。暗杀、调停、灭迹、背叛，都在秩序的名义下进行。白天是披萨与歌剧，夜晚是家族与铳。对普通人而言，这就是秩序井然的黑帮之国：法律与暴力共生，家族即牢笼，也即秩序。"
#事件