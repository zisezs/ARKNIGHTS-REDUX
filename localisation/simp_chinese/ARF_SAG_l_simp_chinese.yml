#民族精神
 SAG_southern_patient: "南境病夫"
 SAG_southern_patient_desc: "萨尔贡帝国如同一片迷雾，笼罩在泰拉大陆的南部，尽管这片土地的实际主人多次易主，但所有在混战中得以幸存的胜利者，都不约而同地选择沿用“萨尔贡”之名，加之泰拉其他国家对他们的了解实在太少，这个神秘而强盛的帝国便一直存在于童话故事与旅者的夸夸其谈之中。然而当历史进入近代，伊比利亚利用阿戈尔科技建造的萨尔贡大坝和运河如同一道伤口，切开了帝国的动静脉。运河沿岸的生态环境被永远改变，而被人为扩大的扎伊尔湖更是彻底从良田变为沧海。在伊比利亚之后，维多利亚、高卢、莱塔尼亚，乃至新生的哥伦比亚，都争先恐后地前往这个泰拉大陆最南边的国度，试图在她的身躯上榨取尽可能多的利益。萨尔贡已经坠入深渊，这片土地的新主人即将在旧日帝国的尸体上诞生。"
 SAG_young_emperor: "年幼的皇帝"
 SAG_young_emperor_desc: "五年前，尚在壮年的阿西特斯八世离奇地死于宫女的暗杀之中，他十二岁的儿子即位成为阿尔达费尼斯十一世，而先皇的弟弟阿尔达弗涅斯则组织起“帝国军政委员会”，宣称在阿尔达费尼斯十一世成年前，他将承担起摄政的职责，统领整个帝国。但皇帝一天天长大，到了十七岁的年纪，阿尔达弗涅斯仍然没有准备交接权力的迹象，皇帝的政令仍然走不出黄金之城，而各地的帕夏都只宣布对军政委员会效忠。"
 SAG_Pasha_Sheik_system: "帕夏-王酋制度"
 SAG_Pasha_Sheik_system_desc: "按照泰拉其他国家的标准，萨尔贡帝国并不值得被称为一个现代意义上的国家，将她称作一个松散的邦联，或许更加适合。由于中央政府的命令常常无法送达边远地区，萨尔贡各王酋领地实际上就是一个个的独立小国，除了需要向帝国上贡和推行帕夏传递的政令之外，这些王酋可以在自己的领地为所欲为。而萨尔贡当前政府所任命的大部分帕夏，只对各地进行最低限度的监控而非管理，除非某些王酋真的做了一些出格的事……"