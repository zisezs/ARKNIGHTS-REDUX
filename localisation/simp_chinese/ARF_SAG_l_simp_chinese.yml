 SAG_Aldafenis_XI: "阿尔达费尼斯十一世"
 SAG_Aldafenis_XI_desc: ""
 SAG_Aldafenis: "阿尔达弗涅斯"
 SAG_Aldafenis_desc: "摄政王\n\n阿尔达弗涅斯，先皇阿西特斯八世同父异母的弟弟，他由一位王酋家族出身的妃子所生，在年纪很小的时候便被送去军队中“历练”，实则是远离宫廷，以防止他在黄金之城内构建起属于自己的人脉网。然而随着阿特西斯八世离奇去世，阿尔达弗涅斯年幼的侄子被迫接过父亲的皇冠，已经成为一名将军的阿尔达弗涅斯决定回到首都，组织起军政委员会，担当起摄政的职责。五年过去了，有人说阿尔达弗涅斯早有异心，一手策划谋杀了自己的哥哥，为的就是窃取帝位；也有人说阿尔达弗涅斯是一等一的大忠臣，在他的治理下，萨尔贡面临的诸多问题都得到了解决，这是他在为归还权力铺路。不管别人怎么说，阿尔达弗涅斯最终会做出自己的选择，而他相信，也只能相信，这个选择是最有利于萨尔贡的。"
