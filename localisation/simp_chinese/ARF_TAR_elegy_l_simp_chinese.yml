l_simp_chinese:

 # ══════ 《挽歌燃烧殆尽》事件组 · events/TAR_elegy.txt ══════

 TAR_ea.1.t: "涉过寒夜"
 TAR_ea.1.d: "从石高原野回来的路上，归乡者排成一条线走到纳斯尔纱城外。城里刚刚光复，暂时无力接纳这么多人；守灵人拒绝为庆功会出借祭器，只递出来一枚再普通不过的哨笛。§Y「守灵人不和生者团结，也不需要生者的尊重，除非他们已经死去。」§!"
 TAR_ea.1.oa: "在城外先搭棚安置"
 TAR_ea.1.oa.tt: "政治点数 §G+25§!，稳定 §G+3.00%§!；获得定时精神「空仓之冬」（180 天）。"
 TAR_ea.1.ob: "开门，塔拉人不等塔拉人"
 TAR_ea.1.ob.tt: "政治点数 §R−15§!，战争支持度 §G+4.00%§!，人力 §G+45,000§!；首都因黑雾入街而承受「黑雾入街」修正。"
 TAR_ea.1.oc: "收下哨笛，记下这条家规"
 TAR_ea.1.oc.tt: "政治点数 §R−20§!，稳定 §G+2.00%§!；守灵人一家记住这份克制——后文请他们进城时不必再从头解释。"

 TAR_ea.2.t: "雕像是碗盆"
 TAR_ea.2.d: "报童在街上喊维多利亚人不战自退、塔拉领土全部光复。宴席上的炖肉、烤鳞、燕麦粥是同一种东西；打造雕像的铁要挨家挨户收集，有人把假腿也搬了出来，铁匠只肯收旧义肢：§Y「不行，这都是吃饭的家伙。」§!"
 TAR_ea.2.oa: "收下砍刀与碗盆"
 TAR_ea.2.oa.tt: "战争支持度 §G+8.00%§!，政治点数 §G+15§!，稳定 §R−4.00%§!；广场上从此立着一尊会被人质问的钢铁红龙。"
 TAR_ea.2.ob: "吃饭的家伙不熔"
 TAR_ea.2.ob.tt: "政治点数 §R−30§!，稳定 §G+6.00%§!；纪念物少了一半分量，作坊却保住了工具。"
 TAR_ea.2.oc: "逐件登记，战后归还"
 TAR_ea.2.oc.tt: "政治点数 §G+20§!，战争支持度 §G+3.00%§!；留下「献纳名册」，日后可以按单发还。"

 TAR_ea.3.t: "堡垒顶上的颜色"
 TAR_ea.3.d: "从堡垒往下看，整座城灯火可亲。只是每一盏腰间的灯都透着同一种颜色：紫。他们以为那是红龙的祝福，还特意把禁了百年的挎火习俗换成了源石灯。§Y「现在城里人一开灯就是这个颜色。」§!"
 TAR_ea.3.oa: "说破它：这是瘟疫"
 TAR_ea.3.oa.tt: "稳定 §R−8.00%§!，战争支持度 §R−4.00%§!；获得定时精神「紫火缠身」（240 天）。恐慌是解局的唯一入口。"
 TAR_ea.3.ob: "什么都不说"
 TAR_ea.3.ob.tt: "稳定 §G+5.00%§!，战争支持度 §G+5.00%§!；获得定时精神「紫火缠身」（300 天）。火不会因为无人提起而退。"
 TAR_ea.3.oc: "只告诉守灵人一家"
 TAR_ea.3.oc.tt: "政治点数 §R−25§!，稳定 §G+2.00%§!；守灵人知道了，等于葬礼的规程也知道了。"

 TAR_ea.4.t: "握手抽火"
 TAR_ea.4.d: "她把那点火从对方身体里抽回去，紫色确实退了一寸，紧接着是一声喊：§Y「我的手没知觉了！」§!旁边的人赶着把话圆过去——基于源石技艺的医术，偶尔也会有一些副作用。"
 TAR_ea.4.oa: "设医馆，一个一个悄悄治"
 TAR_ea.4.oa.tt: "政治点数 §R−40§!，稳定 §G+6.00%§!；若城中已染紫火，把「紫火缠身」的剩余时间压到 120 天。"
 TAR_ea.4.ob: "街面上当众祛火"
 TAR_ea.4.ob.tt: "政治点数 §R−10§!，稳定 §R−6.00%§!，战争支持度 §R−6.00%§!；那只失去知觉的手被所有人看见了，此后无人再敢称它为祝福。"
 TAR_ea.4.oc: "停止祛火，让祝福留着"
 TAR_ea.4.oc.tt: "战争支持度 §G+8.00%§!，稳定 §G+3.00%§!；获得定时精神「紫火缠身」（200 天）。"

 TAR_ea.5.t: "按往年的正常产量报"
 TAR_ea.5.d: "南部的农业地块正式进入收获期，可城里的熟练农业工人都不在了。有人问产量预估多少，答话的是同一套口气：§Y「手册上怎么说，你们就怎么做，明白吗?」「那不就是一切正常吗?按往年的正常产量报！」§!"
 TAR_ea.5.oa: "照旧上报"
 TAR_ea.5.oa.tt: "政治点数 §G+25§!，稳定 §G+4.00%§!；账面先过这个冬天，虚数会自己长出一笔债。"
 TAR_ea.5.ob: "按实数报，少多少写多少"
 TAR_ea.5.ob.tt: "政治点数 §R−35§!，稳定 §G+6.00%§!；获得定时精神「空仓之冬」（150 天）。"
 TAR_ea.5.oc: "先查是谁逼着报假数"
 TAR_ea.5.oc.tt: "政治点数 §R−15§!，战争支持度 §G+3.00%§!；记下「经手人」，清洗仆臣那一格提前解锁。"

 TAR_ea.6.t: "把手放到火上"
 TAR_ea.6.d: "夏末节前的广场，验间谍的办法是让人把手伸进篝火。§Y「你看我腰上灯的颜色，我是塔拉人，我受过红龙的祝福。」「难道间谍想不到要伪造灯的颜色吗?别磨磨蹭蹭的！」§!"
 TAR_ea.6.oa: "收押，只审有据者"
 TAR_ea.6.oa.tt: "政治点数 §R−45§!，稳定 §G+8.00%§!；刑讯的口子被堵住，也堵住了所有人的出气口。"
 TAR_ea.6.ob: "让街坊自己清账"
 TAR_ea.6.ob.tt: "政治点数 §G+20§!，战争支持度 §G+8.00%§!，稳定 §R−10.00%§!，人力 §R−60,000§!；获得定时精神「紫火缠身」（240 天）。被打死的人是同胞。"
 TAR_ea.6.oc: "交出真探子的名单"
 TAR_ea.6.oc.tt: "政治点数 §R−25§!，稳定 §G+4.00%§!，战争支持度 §G+3.00%§!；名册上的人本可以更早交出来。"

 TAR_ea.7.t: "无人肯救的孩子"
 TAR_ea.7.d: "他被驮兽车撞倒，拖到半路又被丢下，最后爬向相熟的粮店。那里的回答很平静：§Y「找其他人去帮你叫库林吧。他们不像我，他们都是好人。」§!全城唯一那个维多利亚血统的孩子，死在无人处。"
 TAR_ea.7.oa: "广场边上立一块不刻名字的碑"
 TAR_ea.7.oa.tt: "稳定 §G+6.00%§!，战争支持度 §R−6.00%§!，政治点数 §R−15§!；一块没有名字的碑，比有名字的更难拆。"
 TAR_ea.7.ob: "记进无名册，不发一语"
 TAR_ea.7.oc: "挨家挨户问那天谁走开了"
 TAR_ea.7.oc.tt: "政治点数 §R−25§!，稳定 §G+3.00%§!，战争支持度 §R−3.00%§!；问出来的东西通向仆臣的账。"

 TAR_ea.8.t: "庆功会上的六件珍宝"
 TAR_ea.8.d: "纯金甲虫、执掌刑律的宝剑、倾听申诉的云兽、记录历史的绳结、象征悲悯的水晶泪滴，还有镶满萨尔贡宝石的仪式剑——它们被放归原位不久。§Y「将自己最想要的东西握在手中。」§!话音未落，珍宝全部活了过来，往厅门外奔逃。"
 TAR_ea.8.oa: "让珍宝自己挑人"
 TAR_ea.8.oa.tt: "政治点数 §R−20§!，稳定 §G+4.00%§!；随后随机发生：战争支持度 §G+5.00%§!，或人力 §G+30,000§!，或有一件圣物当场走掉。"
 TAR_ea.8.ob: "由领袖亲手按在桌上"
 TAR_ea.8.ob.tt: "政治点数 §G+30§!；获得定时精神「指派的官职」（365 天）。圣物不会自己走，因为有人按着它。"
 TAR_ea.8.oc: "锁回旧址的库房"
 TAR_ea.8.oc.tt: "政治点数 §R−35§!，稳定 §G+6.00%§!，战争支持度 §R−5.00%§!。"

 TAR_ea.9.t: "去你们该去的地方吧"
 TAR_ea.9.d: "§Y「你们是我的仆臣，而你们似乎比我还贪婪得多。……再见，去你们该去的地方吧。」§!财宝于无路处凭空铺成一条闪光的路，送彻底癫狂的人群走出巢穴，走向那残忍地张开大口的黑林。"
 TAR_ea.9.oa: "凭空铺一条路"
 TAR_ea.9.oa.tt: "政治点数 §G+30§!，稳定 §G+8.00%§!；获得定时精神「清洗之账」（365 天）。没有审判，也没有尸体。"
 TAR_ea.9.ob: "公开审判，罪名一条条念"
 TAR_ea.9.ob.tt: "政治点数 §R−55§!，稳定 §G+5.00%§!，战争支持度 §R−5.00%§!；全城听见了自己被谁饿过。"
 TAR_ea.9.oc: "账先记下，人先留着"
 TAR_ea.9.oc.tt: "政治点数 §G+15§!，稳定 §R−5.00%§!；获得定时精神「空仓之冬」（200 天）。"

 TAR_ea.10.t: "粮车自己回来了"
 TAR_ea.10.d: "那一夜之后，粮车在天亮前自己回到了农业地块，没有人说清是谁把它赶回来的。§Y「校官却没有从黑林中回来，尽管这没有得到任何人的关心。」§!那一夜之后再也没能回来的人，绝不仅仅只有一个。"
 TAR_ea.10.oa: "再派一个人走进雾里"
 TAR_ea.10.oa.tt: "政治点数 §G+15§!，稳定 §R−3.00%§!；若城中正缺粮，「空仓之冬」立即解除。有人换回了粮，也就此从名册上消失。"
 TAR_ea.10.ob: "不再用人换粮，改征存粮"
 TAR_ea.10.ob.tt: "政治点数 §R−20§!，战争支持度 §G+6.00%§!，稳定 §R−8.00%§!；一个省份被挂上「黑雾入街」。"
 TAR_ea.10.oc: "向封锁的一方要一条通道"
 TAR_ea.10.oc.tt: "政治点数 §R−35§!，稳定 §G+4.00%§!；撤掉一个省份的「黑雾入街」。对面只是还没把领地搬走而已。"

 TAR_ea.11.t: "拖像上广场"
 TAR_ea.11.d: "一个人把整尊钢铁红龙拖过整条街，肩上磨出血，然后喊停暴力：§Y「停手吧，同胞们。在杀死更多的同胞之前，停手吧。」§!接着他开始一件件撤回自己的故事：「库林不是英雄，他只是一个沽名钓誉的骗子。」"
 TAR_ea.11.oa: "让他把话说完"
 TAR_ea.11.oa.tt: "政治点数 §G+25§!，稳定 §R−6.00%§!，战争支持度 §R−8.00%§!；真话换来的体面不体面，但站得住。"
 TAR_ea.11.ob: "打断他，把人带回堡垒"
 TAR_ea.11.ob.tt: "政治点数 §R−15§!，战争支持度 §G+6.00%§!，稳定 §G+2.00%§!；广场上的话被掐断，就会在别处重播。"
 TAR_ea.11.oc: "让近卫队清场"
 TAR_ea.11.oc.tt: "政治点数 §G+10§!，战争支持度 §G+4.00%§!，稳定 §R−8.00%§!，人力 §R−35,000§!；获得定时精神「紫火缠身」（200 天）。"

 TAR_ea.12.t: "在杀死更多同胞之前"
 TAR_ea.12.d: "人群给他的回答是「我只要维多利亚人死」。他死在自己人手里，紫火从他身上腾起；那尊雕像伸展翅膀，几欲起身，飞向广场中央空着的台座。§Y「多遗憾啊，我来迟了，这座城市里仅剩的英雄。」§!"
 TAR_ea.12.oa: "以煽动暴乱者之名记档"
 TAR_ea.12.oa.tt: "政治点数 §G+20§!，战争支持度 §G+4.00%§!，稳定 §R−6.00%§!。"
 TAR_ea.12.ob: "以英雄之礼下葬"
 TAR_ea.12.ob.tt: "政治点数 §R−20§!，稳定 §G+7.00%§!，战争支持度 §G+6.00%§!；自曝那一段从记录里删掉，删掉的东西会自己长回来。"
 TAR_ea.12.oc: "木匣交给守灵人"
 TAR_ea.12.oc.tt: "政治点数 §R−35§!，稳定 §G+4.00%§!，战争支持度 §R−4.00%§!；「我救不了库林，只能以这种方式给他安息。」"

 TAR_ea.13.t: "营地只开一条缝"
 TAR_ea.13.d: "§Y「守灵人既不挑起冲突，也不试图消弭冲突。生者的争端非我们所能干涉，我们只守望逝者的灵魂。」「如果的确如此，守灵人的营地会向您敞开，但也仅限葬礼。」§!他们不喝酒、不开宴、不吃过分烹饪的东西，每天从天不亮直到半夜，做什么都要有仪式。"
 TAR_ea.13.oa: "只办葬礼，别的都别谈"
 TAR_ea.13.oa.tt: "政治点数 §R−20§!，稳定 §G+5.00%§!；还火的规程正式可用。"
 TAR_ea.13.ob: "请他们进城"
 TAR_ea.13.ob.tt: "政治点数 §R−55§!，战争支持度 §R−6.00%§!；获得定时精神「守灵人入城」（400 天）。"
 TAR_ea.13.ob.tt2: "此前已把死去的同胞交给他们，或提前告知过紫火——这一次他们答应得不那么勉强，稳定另计 §G+6.00%§!。"
 TAR_ea.13.oc: "先把祭器借来，事后归还"
 TAR_ea.13.oc.tt: "政治点数 §G+15§!，稳定 §R−6.00%§!；获得定时精神「借走的祭器」（365 天）。他们没有来要回，也没有再来。"

 TAR_ea.14.t: "把火还给死者"
 TAR_ea.14.d: "六步：亲友致辞、点燃柴堆、用自己的眼确认死者已在火中得享安宁、把烛火摆到离火堆尽可能近的地方、有话就对着火焰大声说、守到火焰自己熄灭。悼词末尾是：§Y「别了，或者很快再见，库林。愿你我最终在温暖的火中重逢。」§!"
 TAR_ea.14.oa: "悼词由她写，由领袖念"
 TAR_ea.14.oa.tt: "稳定 §G+10.00%§!，战争支持度 §R−6.00%§!，政治点数 §G+20§!；获得定时精神「还火规程」（365 天）。"
 TAR_ea.14.ob: "谁的话，谁自己对火焰说"
 TAR_ea.14.ob.tt: "稳定 §G+7.00%§!，政治点数 §R−15§!；无论赞美还是斥责，那都是记忆。"
 TAR_ea.14.oc: "点起柴堆就走"
 TAR_ea.14.oc.tt: "政治点数 §G+15§!，战争支持度 §G+4.00%§!，稳定 §R−5.00%§!；话没说完的火，会自己去找人说。"

 TAR_ea.15.t: "祭台就是祭台"
 TAR_ea.15.d: "§Y「祭台就是祭台，只不过比其他祭台庞大。王城的核心就围着它建立，盖尔王加冕时的仪式石阵即是它的前身。」「老红龙死去的时候，人们也会在这里为他还火。」§!再往上追溯，据说很久很久以前，新王的兄弟姐妹要一起在火里殉葬。"
 TAR_ea.15.oa: "承认那底下埋着殉葬的旧账"
 TAR_ea.15.oa.tt: "政治点数 §G+25§!，稳定 §R−6.00%§!，战争支持度 §R−6.00%§!；王权的原罪一旦被写下，就能被引用。"
 TAR_ea.15.ob: "只认祭台，不认王城"
 TAR_ea.15.ob.tt: "政治点数 §G+15§!，稳定 §G+3.00%§!。"
 TAR_ea.15.oc: "请这位局外人离开塔拉"
 TAR_ea.15.oc.tt: "政治点数 §R−10§!，稳定 §G+5.00%§!，战争支持度 §G+4.00%§!；六百年的口信也就此无人肯传。"

 TAR_ea.16.t: "把拉布雷德送上绝路的人"
 TAR_ea.16.d: "§Y「我们的先祖是塔拉王城内掌管典礼的祭司……而我们正是把拉布雷德送上绝路的人。」§!他死后，胞弟指使手下将他的棺椁在王城中拖行示众，每一处曾带族人停留过的牧场都燃起紫火；七日之后，祭司们在黑林外的旷野为他还火，火才退去。"
 TAR_ea.16.oa: "替他们把六百年的账销掉"
 TAR_ea.16.oa.tt: "政治点数 §R−40§!，稳定 §G+10.00%§!；「已经六百多年，早就没人怨你们了。」"
 TAR_ea.16.ob: "让守灵人自己赎"
 TAR_ea.16.ob.tt: "战争支持度 §G+6.00%§!，稳定 §R−4.00%§!。"
 TAR_ea.16.oc: "把这段族史印出来，全城都读"
 TAR_ea.16.oc.tt: "政治点数 §G+20§!，稳定 §R−6.00%§!，战争支持度 §R−3.00%§!；纸上的旧账比祭司更难驱赶。"

 TAR_ea.17.t: "拖棺"
 TAR_ea.17.d: "她把那杆从不离身的长枪扎进棺椁，以枪尖之火点燃，然后拖着它下阶，逐屋敲门，唱《金色原野》。§Y「现在才是我对你的复仇啊。」§!几乎走遍了整座城，然而没有一扇门因她而打开。"
 TAR_ea.17.oa: "允许拖棺昭告死讯"
 TAR_ea.17.oa.tt: "战争支持度 §R−8.00%§!，稳定 §R−6.00%§!，政治点数 §R−15§!；全城被迫直面一件事：那条红龙真的死了。"
 TAR_ea.17.ob: "秘葬，只发一张不写死因的告示"
 TAR_ea.17.ob.tt: "政治点数 §G+25§!，稳定 §G+4.00%§!；获得定时精神「紫火缠身」（200 天）。未告知的死讯会自己敲门。"
 TAR_ea.17.oc: "让报章与广播逐屋念一遍"
 TAR_ea.17.oc.tt: "政治点数 §R−20§!，稳定 §G+6.00%§!，战争支持度 §R−4.00%§!；若宵禁已废，念到的门都会开，稳定另计 §G+4.00%§!。"

 TAR_ea.18.t: "在真正的黑暗到来之前"
 TAR_ea.18.d: "城门外，她对着黑雾举起枪，在满城紫色里点亮一簇明黄：§Y「来这里，来温暖的、光亮的、还有生命留存的地方。在真正的黑暗到来之前，我决不会熄灭这盏灯火。」§!雾的回答只有一句：时间是你的敌人，而非朋友。"
 TAR_ea.18.oa: "一个人守住城门到天亮"
 TAR_ea.18.oa.tt: "稳定 §G+8.00%§!，战争支持度 §G+5.00%§!；获得定时精神「一夜不熄」（200 天）。"
 TAR_ea.18.ob: "与雾谈条件"
 TAR_ea.18.ob.tt: "政治点数 §R−30§!，稳定 §G+4.00%§!；若城中正缺粮，「空仓之冬」立即解除；全部省份的「黑雾入街」一并撤除。"
 TAR_ea.18.oc: "撤回火堆，关门过夜"
 TAR_ea.18.oc.tt: "政治点数 §G+10§!，稳定 §R−7.00%§!；一个省份被挂上「黑雾入街」。"

 TAR_ea.19.t: "夜尽之时"
 TAR_ea.19.d: "门终于开了，人们提着烛涌向广场，火仍是紫色却柔和下来。漩涡底部升起一轮小而炽烈的太阳，从幽深的紫化为明亮的黄——棺中没有任何人的尸体，只有那杆喷吐火焰的枪。§Y「这一次，我不会再驱策你们死去……我只是希望，你们能像先祖曾做的那样，将那火焰变成一盏灯。」§!"
 TAR_ea.19.oa: "将那火焰变成一盏灯"
 TAR_ea.19.oa.tt: "稳定 §G+14.00%§!，政治点数 §G+25§!，战争支持度 §R−10.00%§!；获得定时精神「一盏灯」（730 天）；「紫火缠身」与开局精神「血税之账」一并解除。塔拉从此不再向活人征税以血。"
 TAR_ea.19.oa.tt2: "还火时念过悼词、或让每句话都对火焰说过——城记得自己是怎么醒的，稳定另计 §G+6.00%§!。"
 TAR_ea.19.oa.tt3: "但这座城还替红龙圆过一个谎——删掉的自曝、秘不发丧的死讯，此刻都要一并还回去：政治点数另计 §R−25§!。"
 TAR_ea.19.ob: "把火收归己身"
 TAR_ea.19.ob.tt: "战争支持度 §G+14.00%§!，政治点数 §R−20§!，稳定 §R−8.00%§!；获得定时精神「紫火缠身」（400 天）；若已建立火的账本，账上多记两笔。"
 TAR_ea.19.oc: "宣布红龙已死，塔拉交给活着的人"
 TAR_ea.19.oc.tt: "政治点数 §G+40§!，稳定 §G+8.00%§!，战争支持度 §R−5.00%§!；开局精神「两位火星」解除。此后塔拉只有一位领袖，也只剩一份谎言要守。"

 TAR_ea.20.t: "封底纪事"
 TAR_ea.20.d: "一年后：塔拉全境戒严于零点正式解除，出版题材限制放宽，酒馆老板说今天我过生日、要给所有人免单。五朔节——又称火焰节——原已濒临失传，不日将要重启，火焰传递的起点位于橡林郡。公文抬头「告开斯特公爵领知」，落款「塔拉王国」，随信附一份移动城市出入境申请模板。"
 TAR_ea.20.oa: "无限期推迟加冕"
 TAR_ea.20.oa.tt: "稳定 §G+12.00%§!，战争支持度 §R−6.00%§!，政治点数 §R−25§!；王座空着，反而没人能来抢。对面读到的是：这封信从头到尾未曾否认自己是冠冕之一。"
 TAR_ea.20.ob: "现在就戴上那顶熔过的冠"
 TAR_ea.20.ob.tt: "战争支持度 §G+10.00%§!，政治点数 §G+30§!，稳定 §R−8.00%§!；一顶浸染了血的王冠，戴上就是宣言。"
 TAR_ea.20.oc: "把五朔节写进历法"
 TAR_ea.20.oc.tt: "稳定 §G+8.00%§!，政治点数 §G+15§!，人力 §G+40,000§!；获得定时精神「一盏灯」（400 天）。春季结束那天熄灭家中所有的火，再聚到一处重新点起。"

 # ══════ 配套精神 · common/ideas/TAR_elegy_ideas.txt ══════

 TAR_ea_deadfire: "紫火缠身"
 TAR_ea_deadfire_desc: "紫色的火焰只属于死者。人们在不知不觉间，把自己的火让太多的死亡与失去染成了紫色——腰上挂着灯，灯开着，人就安心了。"
 TAR_ea_granary_short: "空仓之冬"
 TAR_ea_granary_short_desc: "账好报，胃不好受。熟练的农业工人都不在了，剩下的口粮要供着整座城的体面。"
 TAR_ea_wake_rite: "还火规程"
 TAR_ea_wake_rite_desc: "致辞、点柴、亲眼确认、把烛火递到火边、对着火焰大声说话、守到天亮。悲伤一旦有了步骤，就不再需要找人陪葬。"
 TAR_ea_purge_debt: "清洗之账"
 TAR_ea_purge_debt_desc: "没有审判，没有尸体，只有一份再也不会回来的名册。城里的人觉得粮荒缓解了，也说不出是谁换回来的。"
 TAR_ea_lantern_lit: "一盏灯"
 TAR_ea_lantern_lit_desc: "首先温暖自己，然后替所有人照亮前路——让塔拉人能在故土真正开始欢笑、开始歌唱、开始生活的，明亮的、温柔的灯。"
 TAR_ea_sleepless: "一夜不熄"
 TAR_ea_sleepless_desc: "有人在城门口举着火，其他人因此睡了。举火的那个人第二天照常上任，谁也没问那一夜。"
 TAR_ea_relic_appointed: "指派的官职"
 TAR_ea_relic_appointed_desc: "甲虫被按在桌上，就不会自己走掉。征收谷物的权力依然有效，只是从此靠人守着，不靠它。"
 TAR_ea_wake_in_city: "守灵人入城"
 TAR_ea_wake_in_city_desc: "不与生者团结的那一家破了例。他们仍在做什么都要有仪式：不喝酒，不开宴，不大声说笑。"
 TAR_ea_wake_offended: "借走的祭器"
 TAR_ea_wake_offended_desc: "祭器还回去了，擦得很干净。此后城里的丧事，守灵人不再过问。"

