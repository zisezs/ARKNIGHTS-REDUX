 #政党
 VFI_despotism_party: "法夫公爵府"
 VFI_authoritarianism_party: "法夫政务委员会"

 #人物
 VFI_Alexander_Fife: "亚历山大·法夫"
 VFI_Alexander_Fife_desc: "亚历山大·法夫，第六代法夫公爵。在过去，法夫公爵一度是维多利亚教育界的开明贵族代表。他提倡“知识改变命运”，主张提升高等教育事业在帝国本土乃各至殖民地的水平与规模，为不少人所称赞。法夫公爵也常常在家中宴请改革派精英与教育界人士，深得知识分子的拥护。\n\n但在萨卡兹魔族入侵后，法夫公爵却意识到一个重要的事实——团结在他身边的所谓社会名流们，在乱世中毫无用处。陷入困境的他既无大军可调，也无权柄可使。如今，法夫公爵已然失去昔日的影响力与号召力，成为了帝国乱局中的一枚小小走卒。至于他的命运，则将全数寄于他所效忠的开斯特公爵身上。"
 VFI_Civilian_government_clique: "文官集团"

 #人物特质
 VFI_Enlightened_aristocracy: "开明派贵族"

 #国家精神
 VFI_Fragile_neutrality: "脆弱的中立"
 VFI_Fragile_neutrality_desc: "亚历山大·法夫麾下只有屈指可数的少量兵团与军需物资，这令他从未拥有跻身最高决策层的政治影响力，也令法夫公爵领在联合进军失败后必须保持谨小慎微的观望状态。但在目前，这片领地之内的物资短缺正如野火般蔓延，来自开斯特公爵的压力也与日俱增。法夫公爵领虽并不情愿，却依旧在滑向开斯特势力圈的战争机器。"
 VFI_Focus_on_defense: "专注防御"
 VFI_Focus_on_defense_desc: " 联合进军失败后，法夫公爵将余数不多的军事资源全数用于本土防御，并决定采取主动收缩、静态防御的战术姿态。忠于公爵的将军们虽有不甘，却也无奈于眼下左支右绌的陆上军力，只得被迫从命行事，专注防御工作。"