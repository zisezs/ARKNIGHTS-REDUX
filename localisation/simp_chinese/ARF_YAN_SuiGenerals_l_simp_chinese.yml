# 大炎 · 岁家十二将领（出山格招募）
# 生成器：E:/tmp/sui12/gen_sui_generals.js
# 2026-10-26：将领特质介绍文本已按要求清空（保留键，悬停只显示特质名与修正）

YAN_gen_zhongyue:0 "重岳"
YAN_gen_zhongyue_desc:0 "他在玉门城头教人握刀，一教许多年；屏风卫升起的日子，他总站在最前面。"
YAN_sui_zhongyue:0 "玉门为屏"
YAN_sui_zhongyue_desc:0 ""
YAN_gen_wang:0 "望"
YAN_gen_wang_desc:0 "他把古寺里那盘没下完的棋带进了中军；纵横十九道，每一步都先替三军算过。"
YAN_sui_wang:0 "落子无悔"
YAN_sui_wang_desc:0 ""
YAN_gen_ling:0 "令"
YAN_gen_ling_desc:0 "尚蜀那些山头，她自认半个主人；如今这些山要替大炎挡一阵风。"
YAN_sui_ling:0 "尚蜀有主"
YAN_sui_ling_desc:0 ""
YAN_gen_jun:0 "均"
YAN_gen_jun_desc:0 "《炎律》修毕，她把律条一并带进军法：不循私怨，也不许侥幸。"
YAN_sui_jun:0 "律不循私"
YAN_sui_jun_desc:0 ""
YAN_gen_jie:0 "颉"
YAN_gen_jie_desc:0 "太史阁的旧牒补成了完璧；那位早已不在册上的人，这一回替十二个人记军功。"
YAN_sui_jie:0 "笔削不欺"
YAN_sui_jie_desc:0 ""
YAN_gen_shu:0 "黍"
YAN_gen_shu_desc:0 "她记得每一个农时；军中有人饿肚子，她总是第一个知道。"
YAN_sui_shu:0 "农不失时"
YAN_sui_shu_desc:0 ""
YAN_gen_ji:0 "绩"
YAN_gen_ji_desc:0 "他的账本随军走：缴获、损耗、脚钱，一笔一笔算平了才肯收兵。"
YAN_sui_ji:0 "账无不平"
YAN_sui_ji_desc:0 ""
YAN_gen_yi:0 "易"
YAN_gen_yi_desc:0 "界园的图籍摊在中军帐里：哪座山能过、哪座城能守，他都画得出。"
YAN_sui_yi:0 "博物多识"
YAN_sui_yi_desc:0 ""
YAN_gen_nian:0 "年"
YAN_gen_nian_desc:0 "十二楼五城的火候她盯着，军械的成色她亲手验——炉火不熄，前线就不断。"
YAN_sui_nian:0 "洪炉百炼"
YAN_sui_nian_desc:0 ""
YAN_gen_fang:0 "方"
YAN_gen_fang_desc:0 "他把戥秤带进医务帐：药按钱分，伤按轻重，谁也别想在他这儿蒙混。"
YAN_sui_fang:0 "分毫必称"
YAN_sui_fang_desc:0 ""
YAN_gen_xi:0 "夕"
YAN_gen_xi_desc:0 "她把江山画下来，也把它翻过来用——敌人永远看不见笔落在哪。"
YAN_sui_xi:0 "画里江山"
YAN_sui_xi_desc:0 ""
YAN_gen_yu:0 "余"
YAN_gen_yu_desc:0 "行军的饭点他盯得比谁都紧：桌子坐满，士气才坐得满。"
YAN_sui_yu:0 "桌无虚席"
YAN_sui_yu_desc:0 ""
