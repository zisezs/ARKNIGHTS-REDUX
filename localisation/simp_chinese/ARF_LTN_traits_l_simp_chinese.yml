l_simp_chinese:

 LTN_eternal_grace: "永恒恩典"
 LTN_eternal_grace_desc: "她要的是乐章不停、晚霞不散。调性可以宽一些，只要没有人把它撕开。"
 LTN_zwillingstuerme_gold: "崔林特尔梅之金"
 LTN_zwillingstuerme_gold_desc: "阿尔图罗这样称呼她：莱塔尼亚唯一的女皇，永恒恩典。城是她调的音，人是她的听众。"
 LTN_ruthless_authority: "无情权威"
 LTN_ruthless_authority_desc: "她只关注结果。剑一旦举起就要见血——这笔账先记在帝国的稳定度上。"
 LTN_melody_blade: "黄金旋律之刃"
 LTN_melody_blade_desc: "金律法卫把法术代代相传，像传一套剑谱；她只是那个下令出鞘的人。"
 LTN_adv_movico: "莱尼党的账房"
 LTN_adv_movico_desc: "两党之间的事，他用政治点来办。"
 LTN_adv_bordin: "宪兵队长官"
 LTN_adv_bordin_desc: "崔林特尔梅的夜里出了事，第一个敲门的永远是他的人。"
 LTN_adv_lowenstein: "调音师"
 LTN_adv_lowenstein_desc: "音不准的可以调，秩序不准的也可以。"
