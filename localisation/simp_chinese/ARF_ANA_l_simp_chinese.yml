 ANA_despotism_party: "黎朝王室"
 
#国家元首
 ANA_Ly_Co: "黎榫"
 ANA_Ly_Co_desc: "当黎榫在水稻田里度过他的童年和青年时，他从来没有想过，自己有朝一日会成为安南的国王。命运的改变来自于他的父亲，当黎元历在青水地区起兵，宣布支持陈朝对炎国扶持的胡朝的战争时，炎国的密探找到了黎元历。黎榫不知道那个晚上，父亲与炎国人谈了什么，他只知道他父亲领导的义军一路势如破竹，从青水的乡村一直打到罗京城，然后陈朝的少主便在一次离奇的船难后失踪，黎元历受不住群臣的劝谏，在罗京城登基为黎朝太祖，随后立即向北方的炎国再次称臣纳贡。黎榫便在短短的一年内，完成了从农民到义军军官，再到太子的身份转变。而随着黎元历统治了国家二十年后驾崩，作为长子的黎榫便顺理成章地登基，成为黎朝的第二位国王。面对着黎元历留下的遗产，这个农民的孩子能否像他的枭雄父亲一样，在正确的时候，做出正确的抉择呢？只有他自己知道。"

#民族精神
 ANA_rebel_threat: "叛军的威胁"
 ANA_rebel_threat_desc: "黎朝以反抗炎国统治起家，但最终还是对炎国俯首称臣，这样的背叛是安南的民族主义者们无法忍受的。而陈朝的少主陈诵在乘船前往钦城与炎国谈判的路上离奇失踪，忠于陈氏的义军同样无法信任黎元历的虚假言辞。尽管黎元历在自己去世前的二十年内一直不遗余力地打击这些反叛者，叛军的势力依然存在在安南的街巷与田野中。如果对黎朝来说有什么好消息，那就是不同派别的反对派依然没有合作的迹象。但与此同时，一个安南朝廷无法意识到的坏消息也悄然出现，随着炎国的资本给安南带来了越来越发达的工业，一种来自西陆的思潮迎来了属于它的机遇……"
 ANA_Sarkaz_refugees: "萨卡兹难民"
 ANA_Sarkaz_refugees_desc: "安南作为与卡兹戴尔有陆路连通的国家，在过去的十几年中，无数的萨卡兹难民因战乱或天灾涌入安南，虽然其中大部分人只是将安南作为前往炎国或哈拉帕帝国的跳板，但依然有大量的萨卡兹选择停在安南境内。他们的文化与安南社会格格不入，而其中大量的矿石病患者更是让安南的百姓恐慌万分。管理这些萨卡兹难民，对于国家的财政来说，无疑是一笔巨大的开销，而管理之中的漏洞，更是让我们头疼的问题。"