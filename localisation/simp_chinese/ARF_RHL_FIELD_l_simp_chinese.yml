# ══════════════════ 决议分类 ══════════════════
 RHL_field_decisions: "莱茵生命 · 安保部门外勤部队"

# ══════════════════ 决议 ══════════════════
 RHL_field_decision_establish: "组建安保部门外勤部队"
 RHL_field_decision_establish_desc: "防卫科的沙龙上从来只有两种人：写代码的，和写讣告的。现在需要第三种——把莱茵生命的实验室、矿区与收治区真正攥在手里的外勤部队。\n\n第一期编制：六个步兵连组成的外勤分队，上限十个。此后每六十天，特里蒙的校场会多出一支成建制的新分队。\n§Y上限 10 队（6×步兵）。招募每队消耗 50 政治点，60 天成军。§!"

 RHL_field_decision_firepower: "外勤部队 · 扩编与火力强化"
 RHL_field_decision_firepower_desc: "国防部淘汰下来的牵引炮便宜得像白送，工程师只需要两周就能学会操作。把九连制编制和炮兵支连写进条令——从今天起，外勤分队不再是保安，是炮兵丈量过的阵地。\n§Y上限扩至 15 队（9×步兵+工兵/炮兵支连），全军换装。§!"

 RHL_field_decision_motorize: "外勤部队 · 摩托化改装"
 RHL_field_decision_motorize_desc: "能量科的新引擎批产线日夜不停，商务科把哥伦比亚每一笔过剩的卡车产能都吃了下来。轮子取代靴子，油门取代口令——当外勤分队开始沿着移动城市的公路疾驰，联邦的边防巡逻队看起来就像上个时代的遗物。\n§Y上限扩至 20 队（10×摩托化+3 支援连），全军换装。§!"

 RHL_field_decision_mechanize: "外勤部队 · 机械化整编"
 RHL_field_decision_mechanize_desc: "递质导管在装甲内壁里发着微光，动力甲的下一代平台终于轮到了履带。十二个机械化连——每一辆运兵车都由特里蒙的图纸焊接，每一台电台都由防卫科调试。莱茵生命不再需要军队，因为莱茵生命本身就是。\n§Y上限扩至 25 队（12×机械化+4 支援连），全军换装。§!"

 RHL_field_decision_final: "外勤部队 · 完全机械化"
 RHL_field_decision_final_desc: "最后一份《外勤部队编成条例》在塞雷娅的桌上签了字。三十支机械化分队，五个支援连，一套完全由特里蒙定义的战争机器。布莱克在验收单上留下一行小字：他们管这个叫安保部门。\n§Y上限扩至 30 队（12×机械化+5 支援连：工兵/侦察/炮兵/后勤/维护），全军换装。§!"

 RHL_field_decision_recruit: "招募外勤分队"
 RHL_field_decision_recruit_desc: "从安保学院与退伍军官协会筛选兵员，由防卫科教官按莱茵条令训练六十天，成军后列入外勤部队序列。\n§Y消耗 50 政治点；60 天成军一队（当前编制），受编制上限约束。§!"

# ══════════════════ tooltip ══════════════════
 RHL_field_tt_slots: "§Y现役外勤分队数量低于编制上限§!"
