l_simp_chinese:
 # ===== 乌萨斯军事国策树「军团浴火重生」 2026-09-15 =====
 # 国策 25 条（起点 1 + 四主线各 6）/ 共享民族精神 1 个 / 军事决议 7 条
 # 分类 URS_military_decisions 的名称与描述复用 ARF_URS_l_simp_chinese.yml
 # 的既有键（旧军改决议遗留的孤儿键，其 _desc 内嵌忠诚度实时读数），此处不重复定义。

 # ---- 共享民族精神 ----
 URS_legion_reborn: "乌萨斯军团浴火重生！"
 URS_legion_reborn_desc: "边境战争的失败不是终点，是账本的第一页。四个集团军的矛盾、蒙尘的军旗、空掉的番号——全部折算成这支军团重生的本钱。改革推进多少，这支军团就长出多少。"

 # ---- 国策 ----
 URS_legion_dishonored: "蒙尘的军团荣誉"
 URS_legion_dishonored_desc: "边境战争的失败必须有人负责。维特把战报摊在桌上，上面写满了相互矛盾的汇报：第一集团军说第四集团军擅自撤退，第四集团军说第二集团军没有按时支援，第二集团军说他们从未收到命令。没有人承认失败，也没有人否认失败。\n\n番号一个个空缺，军旗一面面蒙尘——改革从清理这堆矛盾开始。\n\n§Y民族精神§!：乌萨斯军团浴火重生！（随国策推进原地成长）\n§Y帝国军忠诚度§!：40（满腹牢骚）——边境战败后的军心现状\n§G+50§! 陆军经验\n§Y解锁决议面板§!：乌萨斯帝国军"
 URS_mil_aristocrat_audit: "军事贵族审查"
 URS_mil_aristocrat_audit_desc: "费奥多尔下令彻查军功贵族，第一批被调查的是三位在战争中失去部队却保住私产的将军。审查持续三个月，卷宗越来越厚，而前线的空缺番号也越来越多。\n\n维特说：陛下，我们是在清理军队，不是在清理敌人。\n\n§Y民族精神§!（§G政治点 +0.10/日§!／§R稳定 -5%§!）\n§Y帝国军忠诚度§!（§R-10§!）\n§Y解锁决议§!：扩大贵族审查"
 URS_mil_army_reorganized: "集团军编制重整"
 URS_mil_army_reorganized_desc: "骏鹰王朝留下的集团军编制，让每个集团军都像一个小王国——自己的兵源、税收、军法官和补给线。维特提出重编：削减第四集团军三成编制，第二集团军并入中央调度，第一集团军保持优先但接受议会监督。\n\n叶甫根尼在泽尔格勒把命令撕了。斯韦特兰纳没有撕，她只是把命令放在桌上，问了一句：谁来执行？维特回答：阿洛伊泽中尉。斯韦特兰纳笑了。\n\n§Y民族精神§!（§G陆军组织度 +10%§!／§G动员能力 +10%§!）\n§Y帝国军忠诚度§!（§R-10§!）\n§Y解锁决议§!：削编第四集团军"
 URS_mil_guards_act: "内卫忠诚条例"
 URS_mil_guards_act_desc: "「内卫效忠乌萨斯，而非皇帝」——这句话在和平年代是一句誓言，在皇帝失踪之后变成了一把刀。条例要求内卫在皇帝缺席期间接受议会与近卫军联合指挥。\n\n内卫指挥官没有拒绝，也没有同意：我们效忠的是乌萨斯。如果议会代表乌萨斯，我们就服从议会。如果圣愚代表乌萨斯，我们就服从圣愚。\n\n§Y民族精神§!（§G占领抵抗度 -10%§!／§G政治点 +0.10/日§!）\n§Y帝国军忠诚度§!（§G+5§!）"
 URS_mil_capital_garrison: "首都卫戍整编"
 URS_mil_capital_garrison_desc: "圣骏堡的卫戍军团是帝国最后的盾牌，也是最不可靠的盾牌：他们从未参加过边境战争，从未在雪原上行军，却在皇帝失踪后第一时间封锁了冬宫。\n\n裁撤三名与旧贵族有往来的团长，从第一集团军抽调军官填补空缺。新团长上任第一天，维特问他：如果圣愚明天走进圣骏堡，你会怎么做？团长沉默了很久，回答：我会执行命令。维特没有追问是哪条命令。\n\n§Y民族精神§!（§G稳定 +10%§!／§G动员能力 +5%§!）\n§Y帝国军忠诚度§!（§G+10§!）"
 URS_mil_freecorps: "谢钦兵团改制"
 URS_mil_freecorps_desc: "谢钦是第四集团军下属的特殊战术兵团，由自由民组成——非乌萨斯种族的士兵，没有贵族血统，没有政治靠山，只有战场上的生存本能。维特提出把它从第四集团军剥离，划归中央直接指挥。\n\n斯乔帕·拉辛在泽尔格勒收到两份命令，一份来自叶甫根尼，一份来自维特。他把两份都放在桌上，对全队说：我们投票。没有人离开。\n\n§Y民族精神§!（§G动员能力 +15%§!／§G陆军组织度 +5%§!／§G陆军经验获取 +5%§!）\n§Y帝国军忠诚度§!（§G+15§!）"
 URS_mil_general_staff: "总参谋部集权"
 URS_mil_general_staff_desc: "乌萨斯没有真正的总参谋部，只有一群各自为战的集团军司令。方案提交议会那天，三个集团军的代表坐在同一排，彼此没有交谈。投票结果是勉强通过。\n\n散会时斯韦特兰纳从维特身边走过，低声说了一句：你建立了一个参谋部，却得罪了三个集团军。你觉得哪个更危险？维特没有回答——他正在看阿洛伊泽递来的纸条，上面写着：第四集团军调动异常。\n\n§Y民族精神§!（§G陆军组织度 +10%§!／§G指挥点数 +0.10/日§!）\n§Y帝国军忠诚度§!（§R-10§!）\n§Y解锁决议§!：统一指挥\n§Y主线完成§!：陆军制度改革"
 URS_mil_bolt_industry: "源石弩箭量产"
 URS_mil_bolt_industry_desc: "乌萨斯的制式弩箭仍沿用骏鹰王朝的设计，箭簇以源石碎片打磨。源石枯竭让箭簇成本翻了四倍。第三局的替代方案：以奥卡——失去能量的源石——作箭簇材料，配合军用火药推进。射程缩短到一百二十步，成本降低六成。\n\n第一批新弩箭送到前线时，士兵们抱怨射程不够。军需官回答：够不够，看的是你离敌人多近。\n\n§Y民族精神§!（§G陆军攻击 +5%§!／§G军工产出 +5%§!）"
 URS_mil_caster_gear: "术师装备升级"
 URS_mil_caster_gear_desc: "战争术师装备的施术单元已经十年没有更新。新方案把源石回路从外置改为内置，减少施术时的能量损耗，同时增加防护层，防止术师在施术过程中被反噬。\n\n一名术师在连续施术三小时后说：我感觉自己还能再打一天。但测试报告的最后一行写着：内置回路对感染者的副作用未知。\n\n§Y民族精神§!（§G突破 +10%§!／§G陆军攻击 +5%§!）\n§Y邪魔污染度§!（§R+5%§!）\n§Y帝国军忠诚度§!（§R-5§!）"
 URS_mil_landship: "陆行舰改造"
 URS_mil_landship_desc: "陆行舰是边境战争的骄傲，也是失败的象征：第一集团的陆行舰被第四集团军抛弃，在雪原上瘫痪了两个月，最终被源石虫啃食了外壳。改造方案削减装甲厚度、增加引擎功率，使其适应北部的冻土与雪原。\n\n航速提升四成，装甲只能抵御轻型武器。工程师说：我们是在造运输车，不是造堡垒。维特说：现在不需要堡垒，需要能把人送到前线的车。\n\n§Y民族精神§!（§G冬季损耗 -10%§!／§G补给消耗 -5%§!）"
 URS_mil_secure_net: "加密通讯网络"
 URS_mil_secure_net_desc: "各集团军之间的通讯协议互不兼容：第一集团军无法直接呼叫第四集团军，第二集团军必须通过中央交换机才能联络圣骏堡。新网络在测试中成功连通了圣骏堡、卡托加区和布列斯克。\n\n泽尔格勒拒绝接入。叶甫根尼说：我的通讯，不需要议会监听。工程师在报告里写道：技术问题已解决，政治问题待处理。\n\n§Y民族精神§!（§G指挥点数 +0.10/日§!／§G情报网增长 +10%§!）\n§Y帝国军忠诚度§!（§G+5§!）"
 URS_mil_kutsukina: "库茨金娜试制"
 URS_mil_kutsukina_desc: "第一集团军的新型武器「库茨金娜」，不使用源石能源，而是以石棺技术为基础、利用奥卡作为反应介质。试爆在远北无人区进行，爆炸当量相当于三百吨源石炸药，但残留物中检测到了未知的活性物质。\n\n斯韦特兰纳在试爆报告上签字时问：这东西的残留物，会不会污染矿脉？工程师回答：理论上不会。她把报告递回去，说：理论上，我们本来不该输掉边境战争。\n\n§Y民族精神§!（§G陆军攻击 +10%§!／§G突破 +5%§!）\n§Y邪魔污染度§!（§R+10%§!）"
 URS_mil_sarcophagus: "石棺武器化"
 URS_mil_sarcophagus_desc: "石棺是前文明遗产：凯尔希曾封锁它，伊利亚曾为它而死，第一集团军曾把它变成零号项目。现在重启武器化模块——把奥卡转化为高密度能量，用于驱动库茨金娜或其他武器。代价是：每次启动都会释放微量邪魔污染。\n\n维特在批准文件上写道：先解决源石枯竭，再解决污染。但他没有写的是：如果污染先失控，谁来负责？\n\n§Y民族精神§!（§G陆军攻击 +15%§!）\n§Y邪魔污染度§!（§R+15%§!）\n§Y帝国军忠诚度§!（§R-5§!）\n§Y主线完成§!：装备迭代"
 URS_mil_griffin_rites: "骏鹰传统复兴"
 URS_mil_griffin_rites_desc: "乌萨斯的军队传统来自骏鹰王国，伊戈尔大帝的十六名将领追随他建立了帝国。维特下令复兴骏鹰传统：恢复旧式军礼，重印《骏鹰法典》，在每一座军营设立骏鹰祭坛。\n\n第一集团军照做了，第四集团军没有。叶甫根尼说：骏鹰王朝已经死了，现在是集团军的时代。维特没有强迫第四集团军——他知道，传统可以复兴仪式，但复兴不了忠诚。\n\n§Y民族精神§!（§G战争支持 +5%§!／§G稳定 +5%§!）\n§Y帝国军忠诚度§!（§G+10§!）"
 URS_mil_blade_creed: "皇帝的利刃教条"
 URS_mil_blade_creed_desc: "重印内卫教条手册，分发给每一位内卫士兵。新手册增加了一段话：当皇帝与乌萨斯不一致时，以乌萨斯为准。当议会与乌萨斯不一致时，以乌萨斯为准。当圣愚与乌萨斯不一致时，以乌萨斯为准。\n\n内卫指挥官看完手册后问了一句：谁来定义什么是乌萨斯？维特回答：历史会定义。内卫指挥官把手册收进抽屉，没有下发。\n\n§Y民族精神§!（§G稳定 +5%§!／§G占领抵抗度 -5%§!）\n§Y帝国军忠诚度§!（§G+10§!）"
 URS_mil_merit_ranks: "军功贵族再造"
 URS_mil_merit_ranks_desc: "乌萨斯的军事贵族正在凋零，不是因为他们不忠诚，而是因为他们没有足够的士兵和矿脉。以战功而非血统授予军衔，以能力而非姓氏授予指挥权：第一批晋升名单里有三名出身平民的团长、两名自由民军官。\n\n第四集团军拒绝执行，第一集团军部分执行，第二集团军全盘接受。斯韦特兰纳在晋升仪式上说：军队不是贵族的私产，是帝国的骨架。但她没有说的是，骨架需要血肉，而血肉正在枯竭。\n\n§Y民族精神§!（§G陆军经验获取 +10%§!／§G指挥点数 +0.05/日§!）\n§Y帝国军忠诚度§!（§G+15§!）"
 URS_mil_preachers: "圣愚宣讲入营"
 URS_mil_preachers_desc: "圣愚在广场上的演讲传遍整座城市，也传进了军营。维特下令禁止宣讲入营，违者军法处置：第一集团军执行了，第二集团军打了折扣，第四集团军把命令扔进了火炉。\n\n叶甫根尼在泽尔格勒对部下说：如果圣愚能让士兵打仗，那就让他来。如果议会能让士兵吃饱，那就让议会来。如果都不行，就让我来。\n\n§Y民族精神§!（§G战争支持 +10%§!／§R稳定 -5%§!）\n§Y圣愚支持度§!（§R+10%§!）\n§Y帝国军忠诚度§!（§R-15§!）\n§Y解锁决议§!：军营清场"
 URS_mil_caster_code: "战争术师守则"
 URS_mil_caster_code_desc: "战争术师是帝国最危险的武器，也是最不稳定的士兵。第三局制定的守则规定了术师的战场使用规则、施术上限，以及失控时的处置方式。其中有一条被多次涂改：当术师失控时，由内卫执行处置。\n\n没有人愿意讨论这一条的具体含义，术师们自己也不愿意。一名术师在读完守则后说：他们是在告诉我们，我们也是可以被牺牲的。\n\n§Y民族精神§!（§G陆军攻击 +5%§!／§G陆军组织度 +5%§!）\n§Y帝国军忠诚度§!（§R-10§!）"
 URS_mil_warcry: "乌萨斯战吼"
 URS_mil_warcry_desc: "恢复那种在冲锋时发出的、撕裂喉咙的呼喊——据说能让敌人胆寒，也能让士兵忘记恐惧。战吼的歌词已经失传，只剩下音节：乌拉，乌拉，乌萨斯。\n\n第一集团军在训练中恢复了战吼，第四集团军拒绝，第二集团军敷衍。但圣愚的宣讲中，也开始出现类似的呼喊。士兵们发现，圣愚的战吼比军令更容易记住。维特在报告中写道：战吼恢复了，但它喊的是谁的名字，已经不由我们决定了。\n\n§Y民族精神§!（§G战争支持 +15%§!）\n§Y圣愚支持度§!（§R+5%§!）\n§Y帝国军忠诚度§!（§G+10§!）\n§Y主线完成§!：思想品德建设"
 URS_mil_katoga_reopened: "卡托加军工复产"
 URS_mil_katoga_reopened_desc: "卡托加区是圣骏堡的老工业区，被封锁后停产三年：管道生锈，工人流散，机器停转。解除部分封锁，恢复弩箭、弹药和陆行舰零件生产。\n\n第一批复产的第三机械厂开工那天只来了三成工人——剩下的人要么死了，要么进了监狱，要么加入了无缚者同盟。维特没有追究，他下令从远北矿区调拨矿工填补空缺。矿工到达卡托加区那天，圣骏堡下着雪。\n\n§Y民族精神§!（§G军工产出 +10%§!）\n§Y帝国军忠诚度§!（§G+5§!）\n§Y解锁决议§!：卡托加复产动员"
 URS_mil_ore_rationing: "源石配给制"
 URS_mil_ore_rationing_desc: "源石是乌萨斯军工的血液，现在血液正在枯竭。配给制：第一集团军优先，第二集团军保障，第四集团军削减三成，民用源石压缩到最低限度。\n\n实施第一个月，圣骏堡的居民区开始出现冻死案例，而第四集团军的仓库里仍然堆满了源石炸药。维特派阿洛伊泽去泽尔格勒核查，阿洛伊泽回来报告：第四集团军在囤积物资，准备长期对抗。维特批注：先解决眼前，再解决将来。但他知道，将来已经来了。\n\n§Y民族精神§!（§G军工产出 +10%§!／§R消费品需求 +5%§!／§R稳定 -5%§!）\n§Y帝国军忠诚度§!（§R-10§!）"
 URS_mil_originium_sub: "奥卡替代材料"
 URS_mil_originium_sub_desc: "奥卡是失去能量的源石，是矿脉枯竭后留下的黑色流体。第三局的研究表明，奥卡可以作为通用溶剂，用于制造炸药、推进剂和部分源石技艺的替代介质。\n\n第一批奥卡炸药威力略低于源石炸药，但成本降低了七成。工程师在报告结尾写道：奥卡会加重感染者的病情。维特在批示中只写了一句话：优先保障非感染者士兵。\n\n§Y民族精神§!（§G军工产出 +10%§!／§G科研速度 +5%§!）"
 URS_mil_bureau_tech: "第三局技术下放"
 URS_mil_bureau_tech_desc: "第三局掌握着军用加密通讯、新型材料、独立无线电和军用设施识别码。维特下令向军工企业下放部分技术，允许卡托加区的工厂生产加密终端和新型合金。\n\n第三局局长拒绝了三次，第四次同意了，但只下放了通讯协议，没有下放核心算法。维特没有追究——他知道，第三局不仅是技术机构，也是情报机构，而情报机构的忠诚从来不是靠命令获得的。他在日记里写道：第三局的墙太高，我暂时翻不过去。\n\n§Y民族精神§!（§G科研速度 +10%§!／§G情报网增长 +5%§!）"
 URS_mil_project_zero: "零号项目"
 URS_mil_project_zero_desc: "零号项目是第一集团军主导的石棺研究项目，成果是库茨金娜武器。维特下令扩大规模：把石棺能源转化模块并入军事工业体系，为卡托加区提供电力，为第一集团军提供新型武器。\n\n项目负责人艾丽塔·瓦卢耶娃在报告中写道：石棺现在运行所燃烧的，是无数被带走的、被肢解的感染者的生命。维特没有回复这份报告——他把它锁进了保险柜，和阿洛伊泽的检举报告放在同一层。\n\n§Y民族精神§!（§G军工产出 +15%§!）\n§Y邪魔污染度§!（§R+10%§!）\n§Y帝国军忠诚度§!（§R-5§!）\n§Y解锁决议§!：石棺能源并网"
 URS_mil_winter_law: "冬季资源调配紧急法"
 URS_mil_winter_law_desc: "紧急法以一票之差通过，立刻实行：帝国的全部源石储备、燃料、粮食、运输力量，进入战时配给体制。卡托加区的工厂获得优先供电，第一集团军获得优先补给，第四集团军被削减三成，第二集团军接受中央调度。\n\n维特在议会宣布结果时，台下没有人鼓掌。他回到办公室，看到桌上放着两份报告：一份是卡托加区军工复产的进展，一份是远北矿区矿脉枯竭的确认——结论互相矛盾。他把它们叠在一起，放进了同一个文件夹。\n\n§Y民族精神§!（§G军工产出 +15%§!／§R消费品需求 +10%§!／§R稳定 -10%§!）\n§Y主线完成§!：军事工业改革"

 # ---- 军事决议 ----
 URS_mil_dec_aristocrat_expand: "扩大贵族审查"
 URS_mil_dec_aristocrat_expand_desc: "审查不会因为卷宗变厚而停下。把名单扩展到军法官与后勤官：空出的位置由中央派人接替，代价是军官层的怨气再深一层。\n\n§R需要忠诚度高于 25§!——军队彻底离心时，没人替你执行审查。"
 URS_mil_dec_aristocrat_expand_tt: "§G+50§! 政治点\n§R稳定 -5%§!\n§Y帝国军忠诚度§!（§R-15§!）"
 URS_mil_dec_fourth_army: "削编第四集团军"
 URS_mil_dec_fourth_army_desc: "把泽尔格勒的编制表撕到底：第四集团军的独立补给线收归中央，叶甫根尼麾下三个师直接改隶总参谋部。\n\n军队从此只有一个调动权——但泽尔格勒的怨言，也从此有了一整条边境线作听众。"
 URS_mil_dec_fourth_army_tt: "§Y军团·陆军组织度§!（§G+5%§!）\n§Y帝国军忠诚度§!（§R-20§!）\n§Y宫廷·政变风险§!（§R+10%§!）"
 URS_mil_dec_barrack_clearing: "军营清场"
 URS_mil_dec_barrack_clearing_desc: "内卫进驻每一座军营，把宣讲的人请出去，把听过的人登记下来。军营重新只听得见军令——至少在内卫站着的时候。"
 URS_mil_dec_barrack_clearing_tt: "§G稳定 +5%§!\n§Y帝国军忠诚度§!（§G+20§!）\n§Y圣愚支持度§!（§G-10%§!）"
 URS_mil_dec_unified_command: "统一指挥"
 URS_mil_dec_unified_command_desc: "总参谋部第一次以单一命令调动三个集团军：参谋席位按功绩重排，集团军司令从「下令者」变成「执行者」。\n\n得罪的人很多，但拿到指挥权的是参谋部——而参谋部效忠的是中央。"
 URS_mil_dec_unified_command_tt: "§Y军团·指挥点数§!（§G+0.05/日§!）\n§Y帝国军忠诚度§!（§G+20§!）"
 URS_mil_dec_katoga_mobilize: "卡托加复产动员"
 URS_mil_dec_katoga_mobilize_desc: "从远北矿区继续抽调矿工，三班倒填满卡托加区的车间。雪不停，炉子也不停。"
 URS_mil_dec_katoga_mobilize_tt: "§Y动员期间（180 天）§!（§G军工产出 +10%§!）"
 URS_mil_dec_sarcophagus_grid: "石棺能源并网"
 URS_mil_dec_sarcophagus_grid_desc: "把石棺的对外通道接进卡托加区的电网：一批工厂熄了灯，另一批亮起来。工程师只在交接单上写了一行——通道开启期间，请勿在附近驻扎。"
 URS_mil_dec_sarcophagus_grid_tt: "§Y军团·军工产出§!（§G+10%§!）\n§Y邪魔污染度§!（§R+10%§!）\n§Y帝国军忠诚度§!（§R-10§!）"
 URS_mil_dec_loyalty_review: "忠诚阅兵"
 URS_mil_dec_loyalty_review_desc: "全军进城阅兵，军旗一面不缺，番号一个不少。忠诚度足够高时，这一场阅兵本身就是战力。\n\n§R需要帝国军忠诚度高于 79（忠心耿耿以上）§!。"
 URS_mil_dec_loyalty_review_tt: "§Y阅兵期间（180 天）§!（§G陆军攻击 +10%§!／§G陆军组织度 +10%§!）"

