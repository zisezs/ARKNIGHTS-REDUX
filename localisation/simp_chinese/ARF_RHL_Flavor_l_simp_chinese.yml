l_simp_chinese:

# ══════════════════ 趣味事件通用 tooltip ══════════════════
 RHL_flavor_tt_skyfever_p10: "§Y天空热 +10§!"

# ══════════════════ 限时精神 ══════════════════
 RHL_flavor_idea_blacktea: "黑豆茶团建"
 RHL_flavor_idea_blacktea_desc: "三百箱黑豆茶从生态科走廊流向了每一个部门例会。会议效率未变，茶水间的抱怨变少了。"
 RHL_flavor_idea_overtime: "全员加班周"
 RHL_flavor_idea_overtime_desc: "四小时十秒的效率讲座之后，没有人再谈论效率，但所有人都提前到了。"
 RHL_flavor_idea_sand: "莱茵幸运沙"
 RHL_flavor_idea_sand_desc: "出现在糖罐与打印机里的实验沙粒被包装成了周边产品。对微振动敏感，对钱包更敏感。"
 RHL_flavor_idea_mascot: "编外吉祥物「士气」"
 RHL_flavor_idea_mascot_desc: "一只从围栏里走出来的嵌合实验体，工牌部门一栏写着「士气」。工作内容：待在食堂，被投喂。"
 RHL_flavor_idea_marketing: "「总辖同款」营销潮"
 RHL_flavor_idea_marketing_desc: "水源标注曾被生态科纠正，随后修正为「即将有」。产品一周售罄，事实的重要性让位于标语的节奏。"
 RHL_flavor_idea_coffee: "十台新咖啡机"
 RHL_flavor_idea_coffee_desc: "联名请愿的结果。现在每一层楼都能听到研磨声，像一台运转平稳的小型源石引擎。"

# ══════════════════ 1 生态科 · 水分身考勤 ══════════════════
 rhl_flavor.1.t: "考勤表上的「蒸发」"
 rhl_flavor.1.d: "生态科点名。三分之一的签到表是湿的。\n\n缪尔赛思主任的水分身们同时在会议室、实验农场与「再来一杯」酒吧三处作业，其中一位在喷泉池边「待机」了四个小时，被安保记录为「一滩安静的水」。生态科的考勤系统随后新增了一个请假事由：蒸发。审批流程还不知道由谁来做，因为审批人可能也在酒吧。\n\n缪尔赛思本人对此的回应是微笑：「分身即本体。它们的业绩，都算我的。」"
 rhl_flavor.1.a: "补签考勤，水分身按半价计算工作量。"
 rhl_flavor.1.b: "给喷泉池装门禁，至少保住这一处水源。"

# ══════════════════ 2 生态科 · 黑豆茶产能过剩 ══════════════════
 rhl_flavor.2.t: "黑豆茶的三百箱"
 rhl_flavor.2.d: "生态科实验农场的黑豆茶本季度产量超出预估四倍，负责人的解释是「温室的新湿度方案过于成功」。\n\n商务科拒绝为黑豆茶在总部超市设立货架，理由是「员工自发购买意愿的数据不支持」。于是三百箱黑豆茶被码在生态科走廊尽头，附一张打印标语：免费自取，感谢关注莱茵生态。\n\n第二天上午，走廊比食堂还拥挤。"
 rhl_flavor.2.a: "移交人事科：作为季度团建伴手礼发放。"
 rhl_flavor.2.b: "移交商务科：贴上「特里蒙限定」标签重新评估。"

# ══════════════════ 3 工程科 · 「树」上筑巢 ══════════════════
 rhl_flavor.3.t: "「树」的住户"
 rhl_flavor.3.d: "工程科的装置树在待机状态下被一群羽兽选中，于第三层咒言模块外沿筑巢。工程科的技术报告确认此举「不影响运行，但影响庄严」。\n\n娜斯提主任在「移除」与「保留」两个批注之间犹豫了一周——期间巢中新增了三枚卵。最终批注只有一行字：等它们自己搬走。\n\n安保部门指出，按照企业资产条例，羽兽属于擅闯者。工程科回复，擅闯者已提交入住申请，审批人为娜斯提本人。"
 rhl_flavor.3.a: "保留鸟巢：宣布为「园区生物多样性标杆」。"
 rhl_flavor.3.b: "温和迁离：向羽兽出示越权占用资产的书面通知。"

# ══════════════════ 4 能量科 · 三秒钟的黑暗 ══════════════════
 rhl_flavor.4.t: "三秒钟"
 rhl_flavor.4.d: "能量科的季度电网演示出现了三秒钟的误差。在这三秒钟里，特里蒙十一区、七号地块与总部大楼的三千余台咖啡机同时停止了工作。\n\n损失评估会议持续了六个小时。会议纪要的结论只有一行：无人受伤，但没有人愿意再谈论那三秒。\n\n事后统计，当天下午的文明用语使用率降至季度最低。"
 rhl_flavor.4.a: "演示会改期至凌晨，喝咖啡的人已经醒了。"
 rhl_flavor.4.b: "自费请全楼喝一个月咖啡，修复关系。"

# ══════════════════ 5 能量科 · 效率讲座 ══════════════════
 rhl_flavor.5.t: "《前进，不断前进》"
 rhl_flavor.5.d: "能量科主任在礼堂发表题为《前进，不断前进》的演讲。原定二十分钟，实际四小时十秒。\n\n行政科的统计显示，演讲期间总部电力消耗下降了百分之十二——没有人离开座位去开灯，后排的研究员靠意志力维持了清醒，据说这也是一种效率。\n\n演讲的最后一页幻灯片写着「节约时间」，全场报以礼貌而疲惫的掌声。"
 rhl_flavor.5.a: "定为月度例会内容：前进需要重复。"
 rhl_flavor.5.b: "下不为例：时间也是燃料。"

# ══════════════════ 6 应用科 · 沙粒外泄 ══════════════════
 rhl_flavor.6.t: "沙粒的去向"
 rhl_flavor.6.d: "源石技艺应用科的实验沙粒出现在了总部通风系统、三号食堂的糖罐，以及商务科全部九台打印机的进纸口。\n\n多萝西主任为此正式致歉，并强调沙粒「无毒、无放射性、对微振动敏感」。商务科闻讯后在打印机旁贴出告示：卡纸时请先摇晃——激活施术媒介。\n\n告示贴出的当天下午，打印机故障率上升了，打印质量也没有任何变化，但没有人再去报修。"
 rhl_flavor.6.a: "全楼大扫除，费用从应用科的茶水预算里扣。"
 rhl_flavor.6.b: "顺势发布周边产品「莱茵幸运沙」。"

# ══════════════════ 7 应用科 · 五百六十九页 ══════════════════
 rhl_flavor.7.t: "限时阅读挑战"
 rhl_flavor.7.d: "受试者知情同意书更新至第五百六十九页。人事科在总部发起了「限时阅读挑战」。\n\n冠军是结构科的一名实习生，用时两小时四十分钟，并真的读完了全部五百六十九页。评审委员会核对后确认无跳页、无略读，随后为他颁发奖品：一份新的知情同意书，五百七十页，附赠签字笔。\n\n实习生当场签了字，表示「反正已经知道结局了」。"
 rhl_flavor.7.a: "增设摘要页：一页纸，加粗，发人深省。"
 rhl_flavor.7.b: "将挑战列为季度固定活动，冠军奖金翻倍。"

# ══════════════════ 8 结构科 · 四点茶 ══════════════════
 rhl_flavor.8.t: "下午四点的茶"
 rhl_flavor.8.d: "结构科主任的日程表上，每天下午四点都写着「喝茶」。本周受邀者包括三名研究员、一名人事科主管，以及一名走错门的电工。\n\n电工回来后向同事转述：「聊了聊人生。」没有人知道结构科主任和一位电工的人生有什么可聊的。第三天，结构科为他办理了转正。\n\n人事科试图复制这一流程，发现关键不在于茶，而在于有人愿意在下午四点放下手里的实验。"
 rhl_flavor.8.a: "在全公司推广「四点茶」制度。"
 rhl_flavor.8.b: "保密处理：这件事不必写进总辖的简报。"

# ══════════════════ 9 结构科 · 编外吉祥物 ══════════════════
 rhl_flavor.9.t: "部门栏写着「士气」"
 rhl_flavor.9.d: "一只从嵌合实验围栏里走失的小型实验体在员工食堂安顿了下来，主要生计为员工投喂。\n\n安保部门依据条例进行滞留评估，结论是「外形可爱，无攻击性，建议保留」。人事科为它登记了临时工牌，姓名一栏空着，部门一栏写着「士气」，负责人的签字是食堂全体员工。\n\n总辖办公室的问询函次日到达，人事科回函附上工牌复印件。此后再无下文，据说总辖看了一眼就批了。"
 rhl_flavor.9.a: "正式收编为总部吉祥物，工牌转正。"
 rhl_flavor.9.b: "送回围栏，并给围栏升级门禁。"

# ══════════════════ 10 防卫科 · 年会节目 ══════════════════
 rhl_flavor.10.t: "《收缴演示》"
 rhl_flavor.10.d: "年会彩排中，一台参演的自律机甲将主持人手中的话筒判定为缴获物资，并在观众面前完成了标准化的收缴流程，动作干净利落，全程无多余伤害。\n\n节目单连夜修改，该节目更名为《收缴演示》，并在开场白中加入一句「本节目为完全预设之战术动作，与话筒的私人恩怨无关」。\n\n门票当晚售罄。"
 rhl_flavor.10.a: "组建防卫科技能展示团，各移动城市巡回演出。"
 rhl_flavor.10.b: "门票收入上缴，用于更换更好的话筒。"

# ══════════════════ 11 防卫科 · 穿反的动力甲 ══════════════════
 rhl_flavor.11.t: "着装方向问题"
 rhl_flavor.11.d: "新一批外勤学员在首次着装训练中集体将动力甲前后穿反。教官的复盘指出：说明书第一页写着「请勿在无人指导下独自着装」。\n\n学员代表举手回应：说明书共二百页，第一页那句话在第两百页的附录里再次出现，附录标题为《常见错误》。两者的距离恰好是全部常见错误的总和。\n\n教官沉默片刻，在训练日志里写下了本次复盘的唯一结论。"
 rhl_flavor.11.a: "印制一页纸速查图，贴在库房门口。"
 rhl_flavor.11.b: "说明书全面改版为图文版，成本翻倍。"

# ══════════════════ 12 商务科 · 总辖同款 ══════════════════
 rhl_flavor.12.t: "「即将有」"
 rhl_flavor.12.d: "商务科以「总辖同款」为卖点推出瓶装水，水源标注为「特里蒙地下一百米」。\n\n生态科迅速指出：该深度没有水源。商务科连夜修正表述为「即将有」，并解释这既是对生态科的尊重，也是对集团勘探能力的信心。\n\n产品一周售罄。购买者中包括生态科自己人，备注栏写着「看看它到底哪来的」。"
 rhl_flavor.12.a: "追加产品线：「莱茵牌空气」，来自五十米上空。"
 rhl_flavor.12.b: "悄悄下架，此事在年报中从未发生。"

# ══════════════════ 13 商务科 · 天空贷推销员 ══════════════════
 rhl_flavor.13.t: "预审批通过"
 rhl_flavor.13.d: "三家金融机构的推销员同时出现在总部大堂，向员工推介「天空贷」，年化利率的小字印在名片背面。\n\n人事科发布公告提醒全体员工：莱茵生命的薪酬体系无法承担这种荣誉。当天傍晚，推销员们被保安客气地请了出去。最后一位离开时留下一沓名片，每张背面都印着同一行字：恭喜您已被预审批。\n\n行政科清点后确认，名片总数恰好等于大堂监控里出现过的员工人数。"
 rhl_flavor.13.a: "每月设「推销员接待日」，让他们一次说完。"
 rhl_flavor.13.b: "全面禁止，并通报全体合作企业引以为戒。"

# ══════════════════ 14 人事科 · 荒野团建 ══════════════════
 rhl_flavor.14.t: "健康，无痛"
 rhl_flavor.14.d: "人事科组织的中层干部荒野求生团建结束于第三天。结束的原因不是任务完成，而是紧急医疗环在两天内用光了全部止痛剂配额。\n\n参与者的返程体检报告全部显示「健康，无痛」。这句话被原样写进了活动总结的标题，下附一行小注：请勿将本结论用于宣传。\n\n下一期的报名人数不降反升。"
 rhl_flavor.14.a: "团建改回室内：十科会议室密室逃脱。"
 rhl_flavor.14.b: "维持荒野方案，医疗环配额增加三倍。"

# ══════════════════ 15 人事科 · 履历太长的人 ══════════════════
 rhl_flavor.15.t: "她是特工吗"
 rhl_flavor.15.d: "员工论坛出现热帖：人事科主任的抽屉里锁着一份梅兰德基金的旧工作证。帖子的投票区里，「她是特工」与「她只是履历太长」两个选项的票数交替领先。\n\n雅拉本人对此的回应，是给全楼层订了下午茶。账单备注栏写着：多喝点，少想点。\n\n下午茶送到的那个下午，帖子的投票人数下降为零。不是没有票，是投票按钮消失了。没有人知道是谁关的。"
 rhl_flavor.15.a: "发布正式声明：履历属于个人隐私。"
 rhl_flavor.15.b: "不辟谣：神秘感是免费的企业福利。"

# ══════════════════ 16 科考科 · XG-07 ══════════════════
 rhl_flavor.16.t: "XG-07 的本职工作"
 rhl_flavor.16.d: "科考科库房年度盘点发现，编号「XG-07」的上个时代圆形巨构碎片，过去三年在标本区担任镇纸，压着一张始终未获批准的打车报销单。\n\n马里亚姆主任亲自检视后出具了双重结论：碎片无异常，可安全使用；打车票依然不能报。\n\n如今碎片有了新的岗位说明，职责包括镇纸、门挡与「提醒我们抬头看天」。"
 rhl_flavor.16.a: "给碎片办一个小型展览，门票免费。"
 rhl_flavor.16.b: "归还库房，重申报销制度第三条。"

# ══════════════════ 17 科考科 · 远征土特产 ══════════════════
 rhl_flavor.17.t: "就地食用"
 rhl_flavor.17.d: "科考科远征队归队，带回四十七箱「具有科研价值的当地物产」。\n\n检疫部门连夜工作，将物产分为三类：三十一箱可入库存档，九箱需隔离观察，七箱建议就地食用。远征队表示，第三类结论是他们此行最大的收获。\n\n食堂大厨随后收到了一份来自荒野的配方手稿，落款是远征队全员。"
 rhl_flavor.17.a: "设立「远征风味日」食堂专柜，每周更新。"
 rhl_flavor.17.b: "四十七箱全部入库，包括建议食用的七箱。"

# ══════════════════ 18 总辖 · 红色警戒线 ══════════════════
 rhl_flavor.18.t: "地板上的抽象派旗帜"
 rhl_flavor.18.d: "行政科在采购清单上发现一笔持续十二个月的重复支出：同款红色警戒线胶带，每月一箱。\n\n追查结果令人肃然起敬——总辖办公室的「科学可控范围」每季度重划一次，旧线从不铲除。十二年下来，结构科实验区的地板拼出了一面抽象派旗帜，新员工入职培训的最后一项，是辨认哪条线是本月生效的。\n\n没有一条线是错的，只是所有线都算数。"
 rhl_flavor.18.a: "改用全息投影警戒线，每月自动更新。"
 rhl_flavor.18.b: "保留现状：这已经是结构科的传统。"

# ══════════════════ 19 总辖 · 会议室战争 ══════════════════
 rhl_flavor.19.t: "会议室预订战"
 rhl_flavor.19.d: "十科联席会议连续三次改期。理由分别是：会议室被商务科的营销例会占用；被生态科的植物认养仪式占用；被人事科的团建复盘占用。\n\n总辖办公室随后发布通告：预订系统新增「总辖优先」选项。该选项上线当天，所有会议室恰好都有人，预订记录显示「优先权不溯及既往」。\n\n行政科建议总辖考虑站着开会，该建议目前处于搁置状态。"
 rhl_flavor.19.a: "设立总辖专用会议室：顶楼，带闸门。"
 rhl_flavor.19.b: "反向优化：所有会议压到三十分钟以内。"

# ══════════════════ 20 总辖 · 天花板上的星图 ══════════════════
 rhl_flavor.20.t: "6152.31，还差 819.69"
 rhl_flavor.20.d: "保洁部门在总辖层的旧办公室天花板夹层里，发现了一架手工制作的星象仪。残缺的星图边缘，有人用细笔标注着一行小字：6152.31，还差 819.69。\n\n行政科为此召开评估会，结论为「无安全风险，有纪念意义」。星象仪如今陈列在总辖厅的走廊里，没有说明牌，玻璃罩上每周都被人擦得很干净。\n\n擦玻璃的是谁，保密条例没有写，但保洁部门的排班表上多了一个不领薪水的名字。"
 rhl_flavor.20.a: "补一块说明牌，只写一句话：「她还欠我们一场雨。」"
 rhl_flavor.20.b: "不解释，让新员工自己猜。"

# ══════════════════ 21 洛肯 · 一杯咖啡的预算 ══════════════════
 rhl_flavor.21.t: "编号在列的项目：咖啡"
 rhl_flavor.21.d: "特聘顾问洛肯·威廉姆斯提交了一份采购申请，申请正文只有两个字：咖啡。审批意见栏很快写满了「必要性存疑」「预算纪律」「请附论证」。\n\n转机出现在第三天——有人注意到他的办公桌上摞着三份手稿，其中任何一份都足以推翻能量科半数的图纸。申请在四小时内获批，附加条款只有一条：咖啡因摄入后果自负。\n\n洛肯在回执上签了字，并补充了一行：谢谢，加糖。"
 rhl_flavor.21.a: "顺手把他的轮椅通道也修好。"
 rhl_flavor.21.b: "供应上限：每天三杯，科学应有节制。"

# ══════════════════ 22 鸭爵 · 未遂的参观 ══════════════════
 rhl_flavor.22.t: "「下次带朋友来」"
 rhl_flavor.22.d: "鸭爵参观了总部。邀请函是谁发出的，至今没有科室承认，行政科只查到当天的访客登记栏写着「应约」。\n\n参观历时两小时。生态科的观赏荷塘减员三株，商务科的样品间减员一顶帽子，评估结论为「损失可控，帽子活该」。鸭爵离开时留下了名片与一根羽毛，名片背面写着：下次带朋友来。\n\n安保部门在报告中注明：无法拦截，因为对方全程遵守了所有访客条例。"
 rhl_flavor.22.a: "荷塘加装围栏，帽子列为禁售品。"
 rhl_flavor.22.b: "发出年度贵宾卡，至少下次能提前知道。"

# ══════════════════ 23 高登 · 特供角 ══════════════════
 rhl_flavor.23.t: "「在下一个州的手里」"
 rhl_flavor.23.d: "管理局前官员高登申请在总部开设「员工特供角」，主营进口咖啡机与健身器材，宣传语为「来源合法、手续正在路上」。\n\n审批材料齐全，唯独缺少一页：货物来源说明。高登对该页的去向给出的解释是「在下一个州的手里」，并补充「上周还在上一个州，总体趋势是越来越近」。\n\n保卫部门认为这构成了某种形式的坦诚。"
 rhl_flavor.23.a: "驳回申请，材料原样退还。"
 rhl_flavor.23.b: "特供角开张，账目由商务科代管。"

# ══════════════════ 24 锡人 · 年度除锈 ══════════════════
 rhl_flavor.24.t: "最像人的夸奖"
 rhl_flavor.24.d: "梅兰德驻莱茵联络官的盔甲迎来年度除锈。保养师傅对着工单愣了半个小时——「客户」一栏填的是一具盔甲，「沟通对象」一栏填的还是一具盔甲。\n\n保养进行到一半，盔甲开口指出了三处焊缝的年份，语气平和，像在聊天气。完工后，联络官对保养师傅的评价是四个字：手艺不错。\n\n师傅后来对工友说，这是他入行以来听过最像人的夸奖。"
 rhl_flavor.24.a: "续订全年除锈套餐。"
 rhl_flavor.24.b: "升级为镜面抛光：亮得能干扰侦察。"

# ══════════════════ 25 霍尔海雅 · 换羽期 ══════════════════
 rhl_flavor.25.t: "《风往哪里吹》"
 rhl_flavor.25.d: "特聘历史学者进入换羽期，三号通风管道因此堵塞。清洁部门在工单登记时首次使用了新分类：「溢出物为生物源性，具占卜价值」。\n\n管道恢复当天，历史学者的新专栏《风往哪里吹》在内部刊物开载，第一期标题为《论通风管道的风向与国运的偏差》，编辑部的注解是「本栏观点不代表本刊立场，本刊也没有立场」。\n\n订阅量创内部刊物历史新高。"
 rhl_flavor.25.a: "专栏维持连载，稿费按羽毛结算。"
 rhl_flavor.25.b: "换羽期免打扰：给所有通风口加装滤网。"

# ══════════════════ 26 梅希亚 · 同一个下午 ══════════════════
 rhl_flavor.26.t: "事由：记忆整理"
 rhl_flavor.26.d: "人事科注意到，秘书梅希亚在同一个下午出席了两场相距两千公里的会议，两场都留下了完整的会议记录，字迹相同。\n\n深入调查在一份递交到一半的请假条面前结束。请假条的事由一栏写着：记忆整理。批准栏空着，但人事科觉得已经不需要批了。\n\n从此人事科的考勤条例新增一条：无法同时出现两次的员工，不必同时出现两次。"
 rhl_flavor.26.a: "加薪：能者多劳，劳者多得。"
 rhl_flavor.26.b: "不予深究，但别再派她同时去两个地方。"

# ══════════════════ 27 埃琳娜 · 流行语 ══════════════════
 rhl_flavor.27.t: "你被我开除了"
 rhl_flavor.27.d: "能量科研究员埃琳娜在周会上对其上司使用了一句新的表述：你被我开除了。会议纪要如实记录，未加评论。\n\n三天之内，这句话出现在总部七个科室的电梯间白板上，配套的各种主语宾语替换版本共十一种。人事科随后印发内部提示：「开除」一词请慎用，除非你真的是主任。\n\n提示的下方有人手写了一行小字：除非你确定自己是对的。"
 rhl_flavor.27.a: "做成马克杯周边，利润归员工活动基金。"
 rhl_flavor.27.b: "擦掉白板，通报表扬周会纪要的诚实。"

# ══════════════════ 28 斯凯 · 检修通道 ══════════════════
 rhl_flavor.28.t: "应急值班室"
 rhl_flavor.28.d: "安保巡检在检修通道尽头发现了一张床、一盏灯与一份排班表。助理研究员斯凯把「随时响应检修呼叫」这一职责执行得过于彻底。\n\n人事科就「宿舍与工位的边界」与她进行谈话。谈话地点最终定在检修通道，因为谈到一半她又去修东西了，人事科的干事在旁边递了四十分钟扳手。\n\n谈话结论：边界问题暂时搁置，扳手归还仓库。"
 rhl_flavor.28.a: "将检修通道正式登记为「应急值班室」。"
 rhl_flavor.28.b: "推广方案：所有通道加装员工休息舱。"

# ══════════════════ 29 递质 · 趋光性事故 ══════════════════
 rhl_flavor.29.t: "递质熄灯"
 rhl_flavor.29.d: "能量科的一批递质样品在转移途中偏离路线，汇入了总部大楼的外立面灯光系统，并在当晚的「光污染投诉」排行榜上登顶。\n\n样品最终在顶楼航空障碍灯处被发现，呈完整的球状，检测报告的备注栏写着「状态良好」。自那以后，总部夜间照明整体调暗两档，员工们把这个安静的夜晚称为「递质熄灯」。\n\n天文爱好者协会为此发来了感谢信。"
 rhl_flavor.29.a: "灯光管制常态化，省下的电入账。"
 rhl_flavor.29.b: "为样品建一间暗房实验室，正式收编。"

# ══════════════════ 30 动力甲 · 最年轻操作员 ══════════════════
 rhl_flavor.30.t: "最小年龄最佳操作员"
 rhl_flavor.30.d: "防卫科库房里的一台动力甲在无人值守状态下自主完成了二十分钟战术机动，动作标准，教科书级别。\n\n调查还原了全过程：「始作俑者」是保安主管八岁的孩子，他把调试手柄当成了游戏机。孩子事后对这台动力甲的评价是：比我爸的强。保卫主管对此不予置评。\n\n防卫科为其颁发了「最小年龄最佳操作员」荣誉证书，并于同一日完成了库房门禁的第三次升级。"
 rhl_flavor.30.a: "把荣誉证书寄到孩子的学校去。"
 rhl_flavor.30.b: "默默销毁证书，门禁升级的事按流程报销。"

# ══════════════════ 31 紧急医疗环 · 无痛上班 ══════════════════
 rhl_flavor.31.t: "工伤申报为零"
 rhl_flavor.31.d: "一批召回批次的紧急医疗环经由员工内购渠道流入总部。使用该批次的员工在两周内全员保持「极佳的身心状态」：工伤申报数为零，请假率为零，工位平均停留时长创历史新高。\n\n健康部门发布提示：无痛不等于无伤，请及时就医。该提示成为当年转发量最高的内部通知，评论区第一条写道：知道了，但真的不疼。\n\n生产部门表示，从产线数据看，这两个星期是全年最平稳的两周。"
 rhl_flavor.31.a: "按规回收销毁，通知健康部门跟进复查。"
 rhl_flavor.31.b: "转配外勤部队：战地止痛是刚需。"

# ══════════════════ 32 行政 · 咖啡机停机 ══════════════════
 rhl_flavor.32.t: "像在等一台引擎重启"
 rhl_flavor.32.d: "总部三台咖啡机在同一个上午集体停机。故障原因至今成谜，三台机器不同型号、不同楼层、不同供电线路。\n\n两小时内，一份联署了十科代表签名的请愿书送抵行政科。签名栏里包括两位从不喝咖啡的主任，他们的理由分别是「出于团结」与「我喝的茶也是它烧的」。\n\n维修工程师赶到时，现场秩序井然：没有人插队，所有人都在安静地排队等待，像在等一台源石引擎重启。"
 rhl_flavor.32.a: "采购十台新咖啡机，每层楼一台。"
 rhl_flavor.32.b: "把「请勿插队」写入员工手册第一章。"

# ══════════════════ 33 生态科 · 共生发电 ══════════════════
 rhl_flavor.33.t: "接入生态"
 rhl_flavor.33.d: "城区电网例行检修导致总部停电六小时。停电第九十分钟，生态科宣布其温室的「植物—菌类共生发电单元」可应急供电，功率足以支撑十一个楼层。\n\n各科室随即排队申请「接入生态」，顺序由办公区绿植覆盖率决定，商务科因窗台上唯一一盆多肉进入候补名单。\n\n来电之后，又有三个科室以「预防性接入」为由保留了申请，理由栏写着：万一呢。"
 rhl_flavor.33.a: "立项研究：共生发电扩大化。"
 rhl_flavor.33.b: "给每个工位发一盆绿植，覆盖率决定命运。"

# ══════════════════ 34 法务 · 爆米花机专利战 ══════════════════
 rhl_flavor.34.t: "贵方引用的是贵方自己"
 rhl_flavor.34.d: "法务部收到竞争对手的律师函，指控我方「全自动家用爆米花机」侵犯其专利，函件引用了我方尚未发布的产品宣传语。\n\n法务部回函附上三份设计图纸、五份实验记录与一盒爆米花样品，并注明：产品尚未发布；贵方引用的宣传语出自贵方自己的产品发布会；爆米花请趁热食用。\n\n对面沉默了两周，随后采购了两台样机，货款已到账。"
 rhl_flavor.34.a: "顺势发布，预订量打破厨房电器类纪录。"
 rhl_flavor.34.b: "继续保密，等对面先发布，再看谁像谁。"

# ══════════════════ 35 公关 · 危机演习 ══════════════════
 rhl_flavor.35.t: "预案成熟，无需演练"
 rhl_flavor.35.d: "公关部举行年度危机演习，模拟情景为「某实验基地登上新闻头条」。\n\n演习进行了四十分钟即宣告结束。原因：措辞库里备选的十三条声明中，有十一条与历次真实声明逐字相同，剩下两条是同一条的反问句。\n\n评估结论只有八个字：预案成熟，无需演练。签名栏里的笔迹非常熟练。"
 rhl_flavor.35.a: "明年换一批情景：比如「总部登上头条」。"
 rhl_flavor.35.b: "把「预案成熟」四个字写进年度报告。"

# ══════════════════ 36 市场 · 楼顶热气球 ══════════════════
 rhl_flavor.36.t: "风中的「一个答案」"
 rhl_flavor.36.d: "市场部在总部楼顶部署了巨型热气球广告，球体标语：天空会给所有向往未来的人一个答案。\n\n三天后，气球被十几个投诉电话与一场大风共同终止了飞行。坠落点的照片上，标语被吹得只看得清最后三个字——一个答案。照片在员工论坛获得了当月最高赞，配文：它说对了。\n\n市场部随即申请追加预算，制作防风款。"
 rhl_flavor.36.a: "批准防风款：狂热也是生产力。"
 rhl_flavor.36.b: "项目终止，气球残骸内部拍卖，价高者得。"

# ══════════════════ 37 商务科 · 拓荒队的期权 ══════════════════
 rhl_flavor.37.t: "乘法还是除法"
 rhl_flavor.37.d: "外包拓荒队提交了联合加薪申请，附名册四十七页。\n\n商务科的回应是一份期权协议：未来十年，荒野上每一个莱茵项目的千分之一。拓荒队队长逐条看完条款，问出了全场唯一的问题：千分之一，是乘法还是除法？\n\n会议记录在此处中断。行政科的备注写着：中断原因，双方都在等待对方先笑。"
 rhl_flavor.37.a: "追加现金补贴，期权协议作废。"
 rhl_flavor.37.b: "追加一份术语表：乘法与除法的区别。"

# ══════════════════ 38 人事科 · 第五百七十页 ══════════════════
 rhl_flavor.38.t: "以页数为准"
 rhl_flavor.38.d: "员工保险合同更新。第五百七十页的脚注由「不含旷野失踪」改为「含旷野失踪，赔付上限以页数为准」。\n\n人事科的解释：以页数为准，即以该页页码为上限，五百七十。有较真的员工核算后指出，这一解释意味着赔付额度比旧版更高。人事科确认了这一点。\n\n此后再没有人逐字阅读第五百七十页，但离职面谈多了一个固定问题：你读到第几页了？"
 rhl_flavor.38.a: "维持现状，把这笔账算作诚意。"
 rhl_flavor.38.b: "把赔付条款挪到第一页，让大家安心。"

# ══════════════════ 39 外勤 · 战地热饮支架 ══════════════════
 rhl_flavor.39.t: "「批准，但架上不许印标语」"
 rhl_flavor.39.d: "前线工程分队提交战地改装申请：为动力甲加挂单手可开合的热饮支架。\n\n防卫科以「影响战术动作」驳回。外勤部队以「影响士气」重新提交，并附上三天内两次因热饮烫手而放弃饮用导致的士气抱怨记录，附言：战场上有比烫更严重的事，但不多。\n\n批复意见最终只有一行字，如今它被印在了第一批支架的包装上。"
 rhl_flavor.39.a: "批准，架上印上「莱茵生命与您同在」。"
 rhl_flavor.39.b: "批准，不印标语，军人只需要热的。"

# ══════════════════ 40 科考科 · 观星之夜 ══════════════════
 rhl_flavor.40.t: "明日，特里蒙，晴"
 rhl_flavor.40.d: "科考科在顶楼举办「观星之夜」，海报角落印着一行小字：本活动与任何已升空资产无关。\n\n到场人数超出预期三倍，其中包括三位自称「只是路过」的主任。活动最后一项是全体默哀十秒，为了一台仍在更高处飞行的机器，和一句也许没人听过的晚安。\n\n默哀结束的瞬间，园区广播准时响起，播报的却是天气预报：明日，特里蒙，晴。\n\n有人说这是节目组的安排，也有人说，这是它自己的问候方式。"
 rhl_flavor.40.a: "观星之夜改为季度活动，扩容场地。"
 rhl_flavor.40.b: "给广播加一段固定结尾：「晚安。」"
