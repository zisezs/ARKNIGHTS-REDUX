 #政党
 VVI_despotism_party: "文森特伯爵府"

 #人物
 VVI_John_Vincent: "约翰·文森特"
 VVI_John_Vincent_desc: "约翰·文森特本是多伦郡主，却在开斯特公爵的授意下被外派至位于文森特地区的新封地，负责督管北方边境防务。而就在文森特刚刚抵达南特时，他的人生乃至帝国命运的转折时刻骤然到来——一夕之间，维多利亚陷入全面动荡，大小贵族纷纷自立门户或选边站队。但文森特十分清楚，无论哪种选择都无法换取自身封地的和平，更逞论保卫北境的安宁。因此，他选择戴上名为中庸的假面，在四大公爵之间竭力维持着中立地位。\n然而，现实却并不尽如伯爵所愿。维多利亚的混乱局面非但全无缓和之势，反倒有愈演愈烈的危险苗头；出没于高卢故土的叛军日益强大，复国主义的星火也在北方边境重燃。文森特本想寻求诺曼底公爵与各集团军司令的援助，却发现前者一毛不拔、后者自顾不暇。两相交困之下，他已开始怀疑自己的坚守是否还有意义可言。"

 #人物特质
 VVI_Lonely_neutral: "孤独的中立者"

 #国家精神
 VVI_Developed_industry: "发达的产业"
 VVI_Developed_industry_desc: " 文森特伯爵旗下拥有数家规模较大的化工产业，他的封地也同样具备雄厚的工业基础。而在维多利亚帝国日渐崩溃之际，它们的重要性不言而喻。屹立天际的烟囱与工厂为文森特伯爵带来了巨大的战时利润，但也引来了周遭野心家的鹯视狼顾。"