#人物
 LOS_Reinhard_Strollo: "莱茵哈德·斯特罗洛"
 LOS_Reinhard_Strollo_desc: "如果不是自己的远房亲戚，前维谢海姆伯爵弄出的幺蛾子，莱茵哈德·斯特罗洛根本不应该坐在大卡尔纳特简陋的办公室里，感受着日复一日的灼热日光和不知何时就会袭来的台风天灾。莱茵哈德·斯特罗洛本来是莱塔尼亚军中一个前途无量的将军，然而当维谢海姆伯爵，他的远房亲戚，被发现与巫王残党勾结，然后就在女皇之声的调查过程中离奇去世。莱茵哈德三番五次地向女皇之声求情，声称自己和巫王残党还有那个远房亲戚没有任何往来，应该说他的求情成功了，莱茵哈德总算没有被算作巫王残党的一员，但他的高升之路也就此结束，被发配到偏远的殖民地去度过余生。莱茵哈德·斯特罗洛还没有放弃回到本土的尝试，但在这片贫瘠的殖民地，到底怎么干出一番名堂，他自己也没有头绪。"
 LOS_Louis_Levillanier: "路易斯·莱维拉涅尔"
 LOS_Oliveira_Torres: "奥利维拉·托雷斯"
 LOS_Dauk_Chen: "达乌克·陈"

#国家精神
 LOS_Chaotic_colonial_government: "混乱的殖民政府"
 LOS_Chaotic_colonial_government_desc: "吕宋地区在过去的不到一百年内，总共在四个政权间易手。起初，伊比利亚帝国向东方拓展航路时，击败了努珊西亚王国，夺取了吕宋作为殖民的支点，但北进的尝试被甘武者帝国阻止，伊比利亚转而深度经营吕宋。而在大静谧摧毁了伊比利亚帝国后，新崛起的高卢趁机接管了这一块被忽视的殖民地。当高卢在四皇战争中被彻底摧毁后，根据后续条约规定，吕宋地区又被划给莱塔尼亚。多次易主的结果便是，殖民地就这么大，而接受过良好教育的中陆官员就这么点，因此伊比利亚、高卢和莱塔尼亚的殖民官员只能掐着鼻子，在政府中开展合作。而任何人都清楚，这种合作的效率，不会特别有效。"
 LOS_Growing_Partisan_threat: "日益增长的游击队威胁"
 LOS_Growing_Partisan_threat_desc: "吕宋地区并不是传统意义上的殖民地，起初她是一个由伊比利亚建立的贸易站，但伊比利亚的野心日益膨胀，开始以卡尔纳特角为中心向其他沿海地区扩张，因此这里爆发了多次伊比利亚与努珊西亚王国的战争，最终形成了吕宋殖民地如今的边界。问题在于，除去殖民者建立的几个殖民城镇和移动城市，广大的丛林农村地区根本不是殖民政府能够控制的，而随着当地人民族意识的不断觉醒，由努珊西亚王国支持的几支游击队开始在吕宋境内活动。虽然目前这些装备草率的游击队无法对莱塔尼亚驻军造成实质上的威胁，但这种情况是暂时性的，如果哪个大国发现了这个给莱塔尼亚造成麻烦的机会，那么吕宋殖民政府的日子就不再好过了。"