 #民族精神
 BGD_Land_of_Neutrality_and_Prosperity: "中立与富足之地"
 BGD_Land_of_Neutrality_and_Prosperity_desc: "在四皇会战以莱塔尼亚及其盟友大获全胜而告终后，一纸和平协定将原高卢与莱塔尼亚相邻的边境地区独立划出，冠以“勃艮第非军事区”之名，作为莱塔尼亚与维多利亚的缓冲地带存在。\n\n得益于其特殊的国际中立地位，再加之以历届督管委员会的精明头脑。国际股票、证券交易与物流中转业在勃艮第非军事区蓬勃发展，并迅速成为了这片土地的经济支柱。大批金融投机家随即涌入非军事区，成就了此地颇为壮观的经济奇迹。\n\n尽管曾遭受过核心圈经济危机的数次冲击，但非军事区境内的繁荣景气仍旧持续至今。但在这暗潮涌动的全新世代，小小的非军事区又能继续将中立与和平维系多久呢？"