l_simp_chinese:

# ══════════════════ 决议分类 ══════════════════
 RHL_bal_committee: "莱茵生命·泰拉平衡委员会"

# ══════════════════ 决议 · 泰拉平衡委员会（1098 年解锁）══════════════════
 RHL_bal_found_committee: "成立泰拉平衡委员会"
 RHL_bal_found_committee_desc: "莱茵生命在特里蒙召集「泰拉平衡委员会」，把十科的实验室成果折算成可以签字的地缘筹码。入会不设门槛，只有合同。\n\n「我们不选边，我们称重。」"
 RHL_bal_found_committee_tt: "§Y效果：§!创建阵营 §Y泰拉平衡委员会§!，莱茵生命为阵营领袖（一次性决议）"

 RHL_bal_invite_kjerag: "邀请谢拉格加入"
 RHL_bal_invite_kjerag_desc: "恩希欧迪斯·希瓦艾什要的是技术与市场，委员会要的是雪境的门户。喀兰贸易的合同摊在蔓珠院的桌上，条款比雪还干净。\n\n「谢拉格缺的是时间。委员会恰好可以卖时间。」"
 RHL_bal_invite_kjerag_tt: "§Y效果：§!谢拉格（KJG）加入 §Y泰拉平衡委员会§!"

 RHL_bal_invite_gaul: "邀请高卢共和国加入"
 RHL_bal_invite_gaul_desc: "高卢共和国正在重建林贡斯，缺的是钱和承认，委员会两样都有——只要高卢肯在委员会的表盘上占去一格刻度。\n\n「共和国的旗帜重新升起时，需要有人站在旁边鼓掌。」"
 RHL_bal_invite_gaul_tt: "§Y效果：§!高卢共和国（GUL）加入 §Y泰拉平衡委员会§!"

 RHL_bal_invite_troupe: "邀请猩红剧团加入"
 RHL_bal_invite_troupe_desc: "猩红剧团的邀约从不落在纸上。幕布升起时，委员会的名字已经写进了节目单的赞助栏。\n\n「观众不必知道谁在幕后付钱。」"
 RHL_bal_invite_troupe_tt: "§Y效果：§!猩红剧团（SCR）加入 §Y泰拉平衡委员会§!"

 RHL_bal_zzz_access: "取得废土军事通行权"
 RHL_bal_zzz_access_desc: "废土的边界没有哨所，只有能走的路和不能走的路。莱茵生命买下了前者的地图。\n\n「荒原不讲主权，只讲补给线。」"
 RHL_bal_zzz_access_tt: "§Y效果：§!获得废土（ZZZ）的军事通行权"

 RHL_bal_free_wargoal: "越过程序"
 RHL_bal_free_wargoal_desc: "理事会通过第十八号备忘录：凡有碍委员会判断的既有条款，一律视为可忽略项。战争目标不再需要理由，只需要表决。\n\n「规则是我们写的，我们当然可以改。」"
 RHL_bal_free_wargoal_tt: "§Y效果：§!解除正当化战争目标的规则限制：§G可对不构成威胁的国家正当化§!、§G可对同意识形态国家宣战§!、§G允许生成战争目标§!"
