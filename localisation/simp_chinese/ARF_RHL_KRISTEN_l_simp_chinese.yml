# ══ 【克丽斯腾归来！】共享国策树 本地化 ══ 【由 docs/gen_rhl_kristen.cjs 生成，勿手改】
 RHL_decision_kristen_chancellor: "请她回来担任总辖"
 RHL_decision_kristen_chancellor_desc: "十科合议厅的名单上只有一个名字。她此刻在三十七号地块的旧车间里，替一台没人认领的试车台换螺栓。\n把她请回来，等于把「不惜一切代价」这句话签在自己名下——从此每一次点火、每一次坠毁，都记在这张桌子上。"
 RHL_kr_breach: "撕开一道缝"
 RHL_kr_breach_desc: "在 6972 米以上，电离反应终于不再干扰那台机器——只维持了一百四十秒。"
 RHL_kr_drawings: "没人肯看的图纸"
 RHL_kr_drawings_desc: "四十份复印件送进四十间会议室，一半被原样退了回来。"
 RHL_kr_dyn_fool: "追星星的傻子"
 RHL_kr_dyn_fool_desc: "「人们生活在这枚被豆荚轻柔包裹的豌豆上，并对此漠不关心。」\n十科起初把这股劲头叫作「追星星的傻子」，是讥讽：一群人不惜举国之力，去撞一层所有人都说撞不开的东西。\n后来它变成了别的意思。每一条产线、每一座试车台、每一次烧到自动停机的全时长试车，都被记在同一张表上——那张表的抬头写着 6152.31 米。"
 RHL_kr_dyn_lone_star: "孤星"
 RHL_kr_dyn_lone_star_desc: "她上任之后每一次点火的账。每发射一次火箭，科研速度 +1%，累计在这里。\n\n一枚一枚打上去的账本没有封面。她说过那只是一双看向陌生深空的眼睛——现在这双眼睛记着每一次点火，包括摔下来的那些。"
 RHL_kr_external_power: "外源动力"
 RHL_kr_external_power_desc: "能量从地下的井里引来，经导能电缆直接灌进喷管。一座石棺撑不住，那就多接几座。"
 RHL_kr_full_burn: "全时长试车"
 RHL_kr_full_burn_desc: "每一台机器出厂之前都要烧满一次全时长——不是烧到设计值，是烧到它自己停下来。"
 RHL_kr_knock_shell: "叩击星荚"
 RHL_kr_knock_shell_desc: "仪器第一次记录到那种东西：阻隔层不是墙，它是一层会回应你的东西。"
 RHL_kr_low_flight: "低空试飞"
 RHL_kr_low_flight_desc: "这一次它没有掉回来。四十一秒，是人类在泰拉上空站稳过的最长时间。"
 RHL_kr_nation_power: "举国之力"
 RHL_kr_nation_power_desc: "「不惜一切代价」写在预算表上是有形状的：三条产线、两座电厂、一个季度的消费品配额。"
 RHL_kr_nominate: "推举她为总辖"
 RHL_kr_nominate_desc: "没有候选人演说，也没有第二个人报名。"
 RHL_kr_one_grain: "一粒尘埃"
 RHL_kr_one_grain_desc: "记录仪只带回来一张照片：一颗行星的一部分，蓝得让人不敢认。"
 RHL_kr_persuade: "说服十科"
 RHL_kr_persuade_desc: "她只提了一个请求：不要把「不可能」当成结论，那只是一个还没算完的中间值。"
 RHL_kr_plan_dead: "计划已死"
 RHL_kr_plan_dead_desc: "地平弧光计划被正式除名，弧光一号进了教科书的反面例子栏。整座能量井划到莱茵生命名下——因为再没有别人敢接手。"
 RHL_kr_reclaim: "收回能量配额"
 RHL_kr_reclaim_desc: "军方留下的最后一份文件是能量井的配给表，我们把它一页一页改了过来。"
 RHL_kr_reopen_construct: "重开总辖构件科"
 RHL_kr_reopen_construct_desc: "专为一个项目设立的科室重新挂牌，这一次它先有了名字。"
 RHL_kr_seven_fifty_three: "七百五十三种"
 RHL_kr_seven_fifty_three_desc: "生态科要在上面造一座会呼吸的园子，七百五十三种，明知它们多半活不下来。"
 RHL_kr_shame: "可耻的失败"
 RHL_kr_shame_desc: "失败并不可耻，可耻的是它被写成了一次成功。"
 RHL_kr_silence: "塞雷娅的沉默"
 RHL_kr_silence_desc: "防卫科是唯一还关得住这件事的科室，而它的主任只签了三个字：不反对。"
 RHL_kr_testsite: "荒原上的试验场"
 RHL_kr_testsite_desc: "选址只有一条原则：砸下来的时候，砸到人的概率要足够小。"
 RHL_kr_vanished: "消失在人群里"
 RHL_kr_vanished_desc: "她没有辞职，也没有被解职——她只是从每一份公开名单上消失了。"
 RHL_kr_vtt_air_p05: "§G追星星的傻子：空军攻击 +5%§!"
 RHL_kr_vtt_air_p10: "§G追星星的傻子：空军攻击 +10%§!"
 RHL_kr_vtt_arms_p05: "§G追星星的傻子：军用工厂建设速度 +5%§!"
 RHL_kr_vtt_arms_p10: "§G追星星的傻子：军用工厂建设速度 +10%§!"
 RHL_kr_vtt_fuel_p05: "§G追星星的傻子：燃料产出 +5%§!"
 RHL_kr_vtt_fuel_p10: "§G追星星的傻子：燃料产出 +10%§!"
 RHL_kr_vtt_ind_p05: "§G追星星的傻子：民用工厂产能 +5%§!"
 RHL_kr_vtt_ind_p10: "§G追星星的傻子：民用工厂产能 +10%§!"
 RHL_kr_vtt_pp_p05: "§G追星星的傻子：每日政治点 +5%§!"
 RHL_kr_vtt_pp_p10: "§G追星星的傻子：每日政治点 +10%§!"
 RHL_kr_vtt_research_p05: "§G追星星的傻子：研究速度 +5%§!"
 RHL_kr_vtt_research_p10: "§G追星星的傻子：研究速度 +10%§!"
 RHL_kr_vtt_research_p15: "§G追星星的傻子：研究速度 +15%§!"
 RHL_kr_vtt_stab_p05: "§G追星星的傻子：稳定度 +5%§!"
 RHL_kr_vtt_stab_p10: "§G追星星的傻子：稳定度 +10%§!"
 RHL_kr_vtt_ws_p05: "§G追星星的傻子：战争支持度 +5%§!"
 RHL_kr_vtt_ws_p10: "§G追星星的傻子：战争支持度 +10%§!"
 RHL_lone_star: "孤星"
 RHL_lone_star_desc: "§Y【孤星】§! 莱茵生命每发射一次火箭，科研速度 §G+1%§!；在她担任领导人期间持续累计，不清零。\n当前累计层数看国家精神「孤星」的那行「科研速度」——打十次就是 +10%。\n\n「科学家不相信梦是假的。因为他们会向全人类证明，所有的梦都可能成真。」\n她在合议厅讲了四个小时，唯一许下的东西是一张表：每往上打一次，人类就多知道一点。"
 rhl_kr.1.a: "把它归档。"
 rhl_kr.1.d: "「军方要的那件东西，据说能替玻利瓦尔挽回颜面。最后它只挽回了一份合同。」\n联邦的旗子降下去以后，联合议会做的第一件事是重新清点账目：地平弧光计划被正式除名，弧光一号被写进教科书的反面例子栏，而特里蒙城外那座谁也关不掉的能量井，被划到了莱茵生命名下——因为再没有别人敢接手。\n十科合议厅把「太空」两个字从议事日程上摘了下来。摘掉它的人心里清楚：这不是判决，只是不想再听见它。"
 rhl_kr.10.a: "照办。"
 rhl_kr.10.d: "「不惜一切代价」这句话写在预算表上是有形状的：三条产线改产备件，两座电厂改做试车台，一个季度的消费品配额改列运输专用件。\n商务科主任把报表递上去的时候问了一句：代价这两个字，最后由谁来付。没有人回答她。"
 rhl_kr.11.a: "把功率再抬一档。"
 rhl_kr.11.d: "「不依赖你们所熟知的源石能源。」\n能量从地下的能量井里引来，经导能电缆直接灌进喷管。这样的能量，一座石棺撑不住——那就多接几座。源石技艺应用科始终不肯承认这台机器是她们画的，因为它的功率损耗曲线完全不像话。\n斐尔迪南说过，能量井是莱茵的心脏。一颗心脏跳得太快，是要出事的。"
 rhl_kr.12.a: "立塔架。"
 rhl_kr.12.d: "选址只有一条原则：砸下来的时候，砸到人的概率要足够小。\n最后选中的地方在垃圾场的下风向。塔架基座浇下第一方混凝土那天，风从冰原那边一直吹进来，图纸的四个角得用石头压住。"
 rhl_kr.13.a: "烧到自动关机。"
 rhl_kr.13.b: "留一点余量。"
 rhl_kr.13.d: "「推进装置的效能有问题。」\n这句话第一次说出口的时候，没有人愿意接。于是每一台机器出厂之前都要烧满一次全时长——不是烧到设计值，是烧到它自己停下来。第三号试车台是在第二次爆炸之后加的。"
 rhl_kr.14.a: "把它们带上去。"
 rhl_kr.14.d: "生态科的主任要在上面造一座会呼吸的园子：七百五十三种生命，连同光照、水循环和空气净化装置——全都不依赖源石科技。\n所有人都清楚，突破阻隔层之后的极短时间内，这些植物的死亡率会超过九成。她们还是把清单排进了载荷计划。\n「如果那里活不下来，那就先看看能死多久。」"
 rhl_kr.15.a: "再来一次，更高。"
 rhl_kr.15.d: "这一次它没有掉回来。\n遥测曲线爬到设计高度之后，安静地维持了四十一秒，然后按指令落进荒原。打捞队把它抬回来的时候，全车间的人都在鼓掌——四十一秒，一百二十年来人类在泰拉上空站稳过的最长时间。"
 rhl_kr.16.a: "算出要多快。"
 rhl_kr.16.d: "6152.31 米——这是泰拉天空的高度，也是莱特夫妇那架飞行器最后的记录。\n箭在 5037 米开始抖，在 6152 米开始掉高度，最后在 3454.7 米的高度上重新变回一堆零件。但仪器第一次记录到了那种东西：阻隔层不是墙，它是一层会回应你的东西。\n自从最后一个拉特兰的法术探测球在阻隔层下方五百米坠落，各国学界就几乎放弃了这项研究。今天有人把它重新捡了起来。"
 rhl_kr.17.a: "把窗口全部用光。"
 rhl_kr.17.b: "优先保载荷回来。"
 rhl_kr.17.d: "「汇聚的光芒舍弃大地，向更高空刺去。」\n「虚假的天空终于被扯碎。」\n「亘古的双月露出真容。」\n在 6972 米以上，电离反应终于不再干扰那台机器——只维持了一百四十秒。这一百四十秒里没有一个人说话，因为所有人都知道：这只是一瞬，它随时会重新合上。\n一百二十年来第一次，有人从阻隔层之上看见了真实。"
 rhl_kr.18.a: "把照片挂上去。"
 rhl_kr.18.d: "遥感记录仪只带回来一样东西：一张照片。照片上是某颗行星的一部分，蓝得让人不敢认。\n泰拉所在的那颗星球，第一次被人从外面看了一眼——只看到一个角，只有一粒尘埃那么大。\n「如若此后百年千年，来人漫步于繁星身侧，人们便要赞颂她的名。」\n「那么，晚安，泰拉的诸位。晚安，宇宙。」"
 rhl_kr.2.a: "继续盯着。"
 rhl_kr.2.d: "她没有辞职，也没有被解职——她只是不再出现在任何一份公开名单上。\n人事档案里写着「总辖构件科·已解散」，商务科的宴请名单上再也没有那个名字。有人在三十七号地块的旧车间见过她：正替一台没人认领的试车台换螺栓。\n梅兰德的观察员在报告末尾写了一句：目标不构成任何风险。这句话后来被证明是整个哥伦比亚那一年最错的一句。"
 rhl_kr.3.a: "把数字留下。"
 rhl_kr.3.d: "失败本身并不可耻。可耻的是它被写成了一次成功。\n遥测在最高点之后中断了十一秒。军方要的是那十一秒的解释，设计局给不出。于是所有人一起把「差一点」说成了「本来就不该做」。\n黑匣子记录的最高高度是 3454.7 米。泰拉天空的高度是 6152.31 米。两个数字之间，隔着一百二十年。"
 rhl_kr.4.a: "再印一份。"
 rhl_kr.4.d: "她把那沓图纸复印了四十份，一份一份送进十科的会议室，然后在门外等着。\n送出去的有半数被原样退了回来，另一半压在文件堆的最底下。真正的问题从来不是图纸不可信——是没有人愿意再为一次注定失败的发射签字。\n复印机的计数器停在四十上。四十，她说，总比三十九好。"
 rhl_kr.5.a: "把话说完。"
 rhl_kr.5.b: "只谈钱。"
 rhl_kr.5.d: "「科学家不相信梦是假的。因为他们会向全人类证明，所有的梦都可能成真。」\n她在合议厅讲了四个小时。中间有二十分钟没有一个人说话，那段沉默后来被每一家报社解释成了完全不同的意思。\n她只提了一个请求：不要把「不可能」当成结论——它只是一个还没算完的中间值。"
 rhl_kr.6.a: "够了。"
 rhl_kr.6.d: "防卫科是唯一还有能力关掉这件事的科室，而它的主任一句话都没有说。\n委员会要她表态。她只是把笔放下，在「不反对」那一栏签了名。所有人都读得懂那三个字：她不是同意了，她是不再拦了。\n散会之后，有人在走廊尽头看见她站了很久，然后转身下到地下三层的原能研究室。"
 rhl_kr.7.a: "全体推举。"
 rhl_kr.7.b: "仍走一次投票。"
 rhl_kr.7.d: "没有候选人演说，没有辩论，甚至没有第二个人报名。\n人力资源科的主任把名单念了一遍。念到最后一个名字时她停了两秒——那两秒里，会议室里每个人都想起了同一件事：上一次她站在这个位置上，也是这些人在同一张桌子上签的字。\n「我只是一双眼睛。」她说，「一双看向陌生深空的眼睛。」"
 rhl_kr.8.a: "接上导能电缆。"
 rhl_kr.8.d: "军方留下的最后一份文件，是特里蒙城外那座能量井的配给表。\n新的理事会把它一页一页改了过来：先改用途，再改署名，最后改的是「谁有权在事故之后过问」。它确实关不掉——这件事军方早就知道，只是没有人愿意写进报告。"
 rhl_kr.9.a: "开工。"
 rhl_kr.9.d: "一个专为某个项目而设的科室，集合了几乎全部主任的头脑。上一次它挂牌的时候，那个项目还没有名字；这一次，它先有了名字。\n工程科让出了最好的台架，结构科把公差从「能用」收紧到「能互换」。车间一开始骂娘，后来发现返工少了。"
 rhl_kr_tt_need_dead_clb: "需要哥伦比亚联邦已经不存在。\n莱茵生命把合众国整个吞下去之后，那笔被除名的预算才重新变得可以讨论。"
 rhl_kr_tt_need_launch: "万星园必须先成功发射一次。\n把东西送上去、并且让它留在上面，之后才有资格谈「撕开」和「之后」的事。"

#国策效果数值行（引擎渲染，句式照原版 GER_modify_*_tt）
 RHL_kr_dyn_fool_modify_tt: "§Y$RHL_kr_dyn_fool$§!追加效果："
