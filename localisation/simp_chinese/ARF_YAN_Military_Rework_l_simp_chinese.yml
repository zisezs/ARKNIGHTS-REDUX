YAN_mil_three_armies:0 "懋戒三军"
 YAN_mil_three_armies_desc:0 "懒得想了，假装这里有文案吧，都差球不多。"
YAN_mil_three_armies_tt:0 "§Y获得民族精神【大炎帝国军事改革】：§!"
YAN_mil_chongyue_arrives:0 "重岳宗师莅临！"
 YAN_mil_chongyue_arrives_desc:0 "宗师二字，我愧不敢当，不过是个稍擅拳脚的凡夫俗子。既然朝廷相邀，我便来教几手：武道在「意」，受限于花哨的形式便再难突破。诸位若有心，先练练桩功。"
YAN_mil_chongyue_arrives_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_martial_codex:0 "编撰《武籍令》"
 YAN_mil_martial_codex_desc:0 "玉门的将士，从炎国各地来，百战白头，九死一生，终究不是为了战功。可我也见过太多人，是被衙门从田里拉出来、连家里的地都没来得及交代清楚就送上了城头的。这样的兵，到了塞上第一个冬天就要想家，想家的人握不稳刀。\n\n征募一事，我有三点浅见。一是募兵与征发当分开，边军重长役，募自愿；内地守备重轮戍，可征发，但要让人知道几年能回。二是入营先问家事，谁家中有老人、谁是独子，造册留档，轮调与出战时心里要有数。三是感染者。玉门城里有不少，他们守城不比旁人差。军中不该因此将人拒之门外，只是营房、饮食、医治要另有章程，不能一句“照旧”就敷衍过去。"
YAN_mil_martial_codex_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_cleanse_frontier:0 "洗濯边疆烟尘"
 YAN_mil_cleanse_frontier_desc:0 "将士在城头站了十年二十年，回到家乡，田荒了，手艺生了，亲人也未必还在。朝廷不能只管人来，不管人去。退伍的兵，当由地方衙门优先安排做城防、驿卒、乡勇教头，让他的本事还有用处。伤残的，上一节说过了。战死的，家中子女的读书与婚嫁，朝廷当有一份照应。\n\n我送走过太多同袍。过去一同举杯言笑、在塞上栽树刻石的人，如今一个都寻不到了。我所求的不多，只是希望后来的人，走的时候不要走得那么寂寥。"
YAN_mil_cleanse_frontier_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_wulin_court:0 "武林朝堂一体化"
 YAN_mil_wulin_court_desc:0 "玉门以军事建城，城里的百姓大都是江湖性情中人，心中多的是热血，少的是筹谋。这样的人，用好了是城墙，用不好便是隐患。\n\n我以为朝廷对江湖，不可一味收编，也不可一味提防。可行的法子是立“客卿”之制：江湖中愿为一城出力的，登记在册，战时听守将调遣，平时各安其业，不授官、不发饷，但伤亡抚恤与将士同等。既不让他们觉得被朝廷束缚，也不让他们觉得被朝廷当作耗材。槐天裴那样的人，便是这样留在玉门的。"
YAN_mil_wulin_court_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_martial_spirit:0 "尚武精神"
 YAN_mil_martial_spirit_desc:0 "这些年我见过的将领，左宣辽那样第一次将整支军队的安危扛在肩上却没有丝毫怯意的，平生仅见。更多的人，是在战功与朝堂之间磨成了另一副模样。\n\n选将，武功只是第一道考验。剑总归是要托付给合适的人，而非合适的局势。我以为升迁当看三样东西：一看他手下的兵伤亡几何，而非他斩获几何；二看他败过没有，败了之后怎么收拾残局；三看他敢不敢在军令与实情相悖时据实上报。一个只会报捷的将领，迟早要害死一营的人。\n\n另外，年轻人升得快不是坏事，左乐那样的孩子，有几分当年左宣辽的气魄。只是手握权柄便是手握杀伐重器，升得越快，身边越要有个敢说话的老卒。兵部若能定下规矩，主将身边必配一名资历深、无升迁之望的副手，专司劝谏，比写十条军纪都管用。"
YAN_mil_martial_spirit_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_stop_war:0 "止戈为武"
 YAN_mil_stop_war_desc:0 "早年我途经萨尔贡，曾指点过当地人一些武技用于防身。后来听说他们恃勇斗狠，掀起了不少动乱。从那以后，我传功授业便格外谨慎。\n武学是杀伐之术，正因离杀伐最近，才最不该沦为恃强凌弱的器物。在玉门的一百多年里，我送走过太多同袍。见死难，是征夫武人的日常。可正因为日日见死难，仍能动心忍性，不泯道义，而不是麻木地搪塞一句“世道如此”，这才是武人真正的功课。\n人的手就这么长，走不完天地，看不透人心，也护不周全世上所有的人。习武之人穷尽一生打磨这一身气力，所求的，不过是在风沙与灾祸迎面压来的时候，能替身后的城池、替身边的人挡上一挡。做到“无愧于心，尽力而为”，便足够了。"
YAN_mil_stop_war_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_nian_studio:0 "年的武侠影视基地！"
 YAN_mil_nian_studio_desc:0 "怎么着，刚才听我大哥在那儿一板一眼地讲完他的《武典》和军制，你们听犯困了，跑我这儿来找乐子啦？事先声明啊，要是工部或者兵部那几个糟老头子派你们来套我话、想骗我去给他们当什么总工程师的，趁早免开尊口！我这儿是独立电影剧组，闲杂公务不得入内哈。\n\n不过嘛……既然你都这么诚心诚意地请教本导演了，那我就勉为其难，跟你们唠唠这两样东西。别拿小本子记啊，被司岁台看见了又要找我麻烦。"
YAN_mil_nian_studio_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_challenge_lykawood:0 "挑战莱卡坞"
 YAN_mil_challenge_lykawood_desc:0 "你们要是真觉得日子太寡淡、非要宣泄一下“剥离社会和理性的纯粹野蛮”，听本导演的——来拍电影啊！\n\n把战争放到银幕上去！你看我设计的终极兵器**“玄极巨兵”**，把整座城市的物质和热量炼化成一台超级大机甲，再配上我最新研发的量子二踢脚、量子大地红、量子地滚雷、量子冲天炮——虽然我本人是很讨厌爆竹那个动静啦，但只要离我三十米远开火就行！\n\n到时候让大哥来做动作指导，让陈晖洁当主角，打光暗一点，镜头晃一点，血浆多一点，再来几句“火种”啊“轮回”啊之类苦大仇深的台词，哐——砰——啪——！一通大爆炸，既解气，又壮观，还能创造全泰拉最赚钱的娱乐商品！"
YAN_mil_challenge_lykawood_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_costume_reform:0 "服化道体系革新"
 YAN_mil_costume_reform_desc:0 "冶铸这门手艺，最早的时候，明明只是一种非常生活化的凡俗工艺啊。它是往日生活的某种起源——打一口能涮毛肚的铜锅，铸一把翻土的铁犁，做一只盛酒的爵、一枚挂在腰上的小玩意儿。我擅长的，原先明明是这些东西。\n\n至于为什么后来满地都是兵器？那得问你们自己咯。干戈之事，在哪个时代都避不过，你们一言不合就要打打杀杀，我也很绝望的好不好！"
YAN_mil_costume_reform_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_colossus_concept:0 "玄极巨兵构想"
 YAN_mil_colossus_concept_desc:0 "§R打造武器的工匠，必须承担它们带来的血腥。§!"
YAN_mil_colossus_concept_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_golden_halberd:0 "金戈日月光"
 YAN_mil_golden_halberd_desc:0 "§R“伐谋百世，一朝毁之。国蚀器锈，如梦似电，无踪泡影。”§!\n我最讨厌东西消失了。明明是大家花了百八十年一锤一锤敲出来的城池、辛辛苦苦搭起来的楼房、好不容易凑在一起能吃辣打麻将的活生生的人，“哐”的一声，全没了，连个响儿都留不下。每次在庆典上，光是看着那些平时跟我插科打诨的家伙背着刀枪上战场，我就觉得可惜。\n"
YAN_mil_golden_halberd_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_life_death:0 "生杀之机不相让"
 YAN_mil_life_death_desc:0 "跟你们讲，论起打仗，你们教科书上写的那些根本不够看。在工业、人口、源石技术都远没有今天发达的古代，我可是亲眼见过大炎那位年轻的真龙，是怎么倾全国之力、带着满天下的江湖奇人去围猎真正的“神明”的。血流成河，伏尸万里啊。但人家图什么？图的是“为天地立心，为生民立命”，图的是大炎国祚只在大炎子民之手。(首绷)"
YAN_mil_life_death_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_holy_king_peace:0 "明王圣帝去兵灾"
 YAN_mil_holy_king_peace_desc:0 "所以我也不是什么迂腐的和平主义者。“明王圣帝，谁能去兵哉？”生杀之机，焉能拱手相让？大家都是这片大地上的求生者，面对北边那些啃噬意识的邪魔，或者地底下那个随时会醒过来掀桌子的疯物，你不造出“十二楼五城”，不摆下三千座机关、百万台兵俑，难道坐以待毙吗？"
YAN_mil_holy_king_peace_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_furnace_driver:0 "烘炉御者"
 YAN_mil_furnace_driver_desc:0 "……哎呀，说了这么多，嘴都干了！\n不聊了不聊了！我刚把幺弟抓到厨房去打火锅，红油锅底，加了双倍花椒和朝天椒——谁也不许给我往里头塞冰淇淋啊！走走走，陪我吃锅子去，今天谁要是被辣哭了上担架，我下回拍战争大片就让他演第一个炮灰！快点跟上！"
YAN_mil_furnace_driver_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_chess_calculus:0 "臭棋篓子算尽一切！"
 YAN_mil_chess_calculus_desc:0 "你若是因我平日里对着这方棋枰，便以为能从棋道中问出什么治军用兵的妙法，那便找错人了。棋道玄妙，终归只是棋而已，在棋盘上学不会用兵之道、权术人心。世人喜好穿凿附会，总爱编排些“将军端坐营帐、手谈间轻松破敌”的佳话……殊不知，为将者战时行乐，依炎律当斩。\n\n不过，你既诚心相问，我若一味推脱，倒显得生分。你先前大约已经听过我那位兄长的治军之策了。他那一套，是堂堂正正的“本手”。只是世事如棋，有时执黑先行、贴七目半，从落子那一刻起便无半分可胜之机。这时候，光靠堂堂正正，是赢不下来的。\n\n我所说的，只是一个曾经满盘皆输之人的劝诫。你姑且听之。"
YAN_mil_chess_calculus_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_audit_old_debts:0 "清查陈年旧账"
 YAN_mil_audit_old_debts_desc:0 "兄长看重的是三万多个日夜、是城头一砖一石的打磨。这固然可敬，却是守成之将的算法。若站在庙堂之上统御三军，你首先要算的，是国力与生灵的盈亏。\n\n纷纷世事，看似混沌无序，但只要掌握了其中的规则，就能计算出最终的结局。用兵之前，账目必须清白：平定北方一处无力扩张的叛乱，需要整备五万甲士、半年份的粮草，少一分则迁延日久，多一分则糜费国帑；若是君主贪功冒进，执意以强硬手腕去啃动摇国本的硬骨头，那要付出的代价，便是七成的军队、一成的人口，以及接下来五十年内无休止的动乱。"
YAN_mil_audit_old_debts_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
 YAN_mil_inspector:0 "除蠹于后"
 YAN_mil_inspector_desc:0 "我那位兄长，不管在哪都乐意做宅心仁厚的正人君子。当年他在前线行军，因突遇天灾不得不另外扎营，不曾按时回营。在他看来，主将知晓，兵部自有公论，便不必放在心上。\n\n可他看不见——或者说不屑去看——朝堂之上有多少人用心险恶。两月之后，新上任的兵部右侍郎便连同礼部共参了他一本“拥兵独断”。这罪名，足够要了一军主将的性命。\n\n我后来让人查了那位侍郎。他收受贿赂，手伸到了前线的军需用度上，最终死在了候审的狱中。兄长事后指责我多管闲事、逾越规矩……呵，事关生死，哪里是一句“求同存异”或“清者自清”就能带过去的？对这一人手软，便是对前线数万将士的性命手软，后患无穷。\n\n治军之道，从来不止在军营之内。军需粮饷的脉络握在谁手里，朝中谁在借战事排除异己，主帅若对此一无所知，将士在沙场上流尽了血，也不过是旁人棋盘上的弃子。"
YAN_mil_inspector_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_zero_error:0 "不容毫厘差池"
 YAN_mil_zero_error_desc:0 "眼观全局，胜负不在一处。有时候，弃掉三颗黑子，是为了换对方一次确凿无疑的死亡；让出一片腹地，是为了在角部留下一手足以翻盘的劫材。\n\n这听起来凉薄，却是战场上最实在的慈悲。昔日炎国大军围剿山海众的一支残部，那群乌合之众还能支撑两日。若按常理强攻，两日后贼寇全军覆没，炎国军队也会折损三成。我当时放走了他们的首领——因为首领若留下来赴死，贼寇只会更加狂热、死战不退；首领一走，余众必逃，炎国军队也会因达成目的而罢兵。\n\n舍小取大，各取所需，如此而已。用最小的折损达成战略的终局，哪怕背上骂名，也胜过让三成将士白白填进沙场。至于军中用探，亦是同理。莫要用那些只凭一腔忠勇的“好人”——一个不称职的探子，除了送命与打草惊蛇，于大局毫无益处。"
YAN_mil_zero_error_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_computing_center:0 "大炎军事算力中心"
 YAN_mil_computing_center_desc:0 "这个没想好，假装有文案吧！"
YAN_mil_computing_center_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_shared_calamity:0 "天下共此劫"
 YAN_mil_shared_calamity_desc:0 "话说到这里，也就够了。这些道理，多半是迕道违理的险招。在太平岁月里，还是听我那位兄长的“本手”更为妥当；只有到了山穷水尽、非赌上全部身家性命不可的时候，再去想我今日说的话吧。\n\n茶凉了，这局棋也已作罢。你不必再替旁人挽留我，我该回宿舍去了——今日是余弟下厨，去晚了，他又该多心。"
YAN_mil_shared_calamity_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_great_chivalry:0 "侠之大者"
 YAN_mil_great_chivalry_desc:0 "早在二十年前，平祟侯便找过我。他在那时就意识到，岁兽也罢，其他巨兽也罢，依然是炎国的一大隐患。而到了真正决战的那一天，边关不能依赖我，也不能只依赖那些江湖义士。到最后，所有人都是要走的。\n所以这军制也好，武学也罢，总归是要托付给合适的人，交到凡人将士自己的手里。好在这些年我看得很清楚，不管多少年过去，只要这里的人们还能团结一心，大炎的城池便还是原来的城池。“人定胜天”，不是虚言。\n\n§R……只是过去一同举杯言笑、在塞上栽树刻石的人，如今一个都寻不到了吧。§!"
YAN_mil_great_chivalry_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_civil_virtue:0 "文德武备"
 YAN_mil_civil_virtue_desc:0 "这是我在玉门做录武官那些年的一点体会。军中不识字的人多，军令靠口传，传三道便走了样。我在玉门时，令过的兵，闲时便教几个字，几年下来，营里能看懂军令、能写家书的多了不少。写得了家书的人，心里安稳，刀也握得稳。兵部若能在各营设一名文书，白日管文牍，夜里教识字，花费不多，受益的是整支军队。"
YAN_mil_civil_virtue_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_tianshu_treasury:0 "澄澈天枢府库"
 YAN_mil_tianshu_treasury_desc:0 "你的兵力、你的军械、你的战法，若是全都摆在明面上让兵部造册、让敌人摸透，这仗便没法打了。\n\n我曾与北境的天师打过交道。那位老天师为了心智不受邪魔侵染，常年装作一副疯疯癫癫的样子，外人皆以为天机阁已不足虑，他却从未忘了自己真正该做的事。治军亦当如此。大军在外，明面上按部就班，暗地里必须有一支不入常册的奇兵，或是几件连朝廷都未必尽知的底牌。\n\n不是为了拥兵自重，而是当真正的灭顶之灾降临时——当那些按规矩办事的人束手无策时，你手里还得有一把能刺穿死局的刀。"
YAN_mil_tianshu_treasury_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_purge_habits:0 "荡涤积年陋习"
 YAN_mil_purge_habits_desc:0 "我在百灶见过帝王，在塞外见过名将，也见过那些自诩神明的荒蛮之物。太多人把“赢”当作终局，把赶尽杀绝当作武功。\n\n可兵戈之事，唯一与棋理相通的地方，恰恰在于“求和”。\n\n人们在种种不堪的争斗中寻找出路，不是为了在一片死寂的废墟上分出高下，而是为了在收官之后，活着的人还能有未来可言。为此，执棋的人必须算尽每一种可能，哪怕是……将自己也算作需要被牺牲掉的那枚劫材，去换取全局的“大利”。"
YAN_mil_purge_habits_tt:0 "§Y民族精神【大炎帝国军事改革】追加效果：§!"
YAN_mil_grand_parade:0 "大炎帝国三军阅兵式"
 YAN_mil_grand_parade_desc:0 "§O日落飞锦绣长河，天地壮我行色。§!"
