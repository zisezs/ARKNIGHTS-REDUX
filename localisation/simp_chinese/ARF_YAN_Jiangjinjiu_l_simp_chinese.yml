l_simp_chinese:

# ==============================================================================
#  大炎 · 将进酒（事件链 · 10 环）
#  · 原作 act15side，地点尚蜀，时间早春
#  · 视角：一只黑色酒盏入境，礼部与司岁台争管辖，玩家以朝廷身份裁定
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 黑盏
# ------------------------------------------------------------------
 yan_jjj.1.t: "一只黑盏"
 yan_jjj.1.d: "那只盏是从龙门进来的。\n\n黑釉，无款，盏底有一枚极小的刻痕，像棋子。带它入境的人姓鲤，龙门人，做私家侦探，同行的是个快要散架的木匣子。\n\n司岁台一年前就有密令追这只盏。梁洵在尚蜀接到密令的时候，司岁台的人已经在渡口等了两天。\n\n礼部的人也来了。\n\n宁辞秋是礼部左侍郎，从二品的钦差，三年前就派驻尚蜀监管那个「令」。她的说法很简单：司岁台本属礼部，凭什么绕过礼部行文。\n\n左乐是司岁台最年轻的秉烛人，他父亲是玉门守将左宣辽。他的说法更简单：你们礼部，管不了这件事。\n\n梁洵夹在中间。他做了尚蜀知府一年，清楚这两家谁都不能得罪。\n\n他递上来的折子只有一句话：请朝廷定夺。"
 yan_jjj.1.a: "归司岁台办，礼部不得干预"
 yan_jjj.1.b: "归礼部办，司岁台只出人不出名"
 yan_jjj.1.c: "不定归属。许梁洵便宜行事"

# ------------------------------------------------------------------
# 2 无理手
# ------------------------------------------------------------------
 yan_jjj.2.t: "一记无理手"
 yan_jjj.2.d: "梁洵没有接盏。\n\n他把那个龙门人雇了下来，托他第二件事：找出盏的主人。\n\n他不知道那人姓什么，也不知道是什么种族。只知道那个人偶尔会在山腰的酒铺买酒，从来没有下过山。\n\n送盏入府这件事，他做得光明正大；查盏之主人这件事，他做得悄无声息。一盏明棋，一记暗子。司岁台盯的是盏，礼部盯的是人，他就把盏和人拆开，让他们各盯各的。\n\n当夜宁辞秋夜访梁府，撞了个正着。\n\n她站在阶下看了很久，没有上前，也没有说话。\n\n第二天她照旧送了一份节礼过来，附帖上写着：尚蜀风高，慎之。\n\n梁洵把帖子收进抽屉，没有回。"
 yan_jjj.2.a: "准他所请。用人不疑"
 yan_jjj.2.b: "斥其越权，命即刻交盏"
 yan_jjj.2.c: "准，但另遣司岁台的人盯住那个龙门人"

# ------------------------------------------------------------------
# 3 行裕
# ------------------------------------------------------------------
 yan_jjj.3.t: "行裕客栈"
 yan_jjj.3.d: "行裕客栈的掌柜姓郑，从前是镖局总镖头，挂刀十年，改行开饭馆。\n\n这一日店里打起来了。\n\n动手的是他的养女杜遥夜。她认错了人，一脚挑飞一张木椅，转过来就向那个龙门人索盏。桌边两个外乡人卷了进来——罗德岛的干员，一个叫乌有，一个叫克洛丝。三个人缠了几合，从窗口翻了出去，没有伤人，只打碎了三只碗。\n\n郑清钺从后厨出来，先看了看地上的碎瓷，再看了看女儿，然后免了全店的赔，把客人一个个送出去。\n\n他一句重话也没说。\n\n转天，尚蜀城里就有了话：行裕的郑掌柜，这十年是白挂刀了。"
 yan_jjj.3.a: "缉拿动手者，按律办"
 yan_jjj.3.b: "只记档。尚蜀的事，先看着"
 yan_jjj.3.c: "借机清点城中所有外来人口"

# ------------------------------------------------------------------
# 4 旧账
# ------------------------------------------------------------------
 yan_jjj.4.t: "十年上下山"
 yan_jjj.4.d: "泥泥峰下有个挑夫，人称挑山人。\n\n他上山挑货，一日一趟，十年没断过。可他没有家，山上也没有货栈——他挑的是自己，上去是为了在两块石头中间坐一会儿。那下面埋着他的儿子。\n\n他接了那个龙门人的活，把山里的废亭一一标出来。\n\n标完之后，他去了趟行裕客栈，找到伙计刘二。他没有打人，只是把扁担横在门框上，站着，问了三句话。\n\n刘二把「酒盏」两个字说了出来。\n\n挑山人听完，把扁担收了回去，说了一句：十年前那只，原来也在尚蜀。\n\n他从此不再上山了。"
 yan_jjj.4.a: "提挑山人来问话"
 yan_jjj.4.b: "传郑清钺到衙，问他十年前的事"
 yan_jjj.4.c: "都不动。这桩旧账与朝廷无关"

# ------------------------------------------------------------------
# 5 器伥
# ------------------------------------------------------------------
 yan_jjj.5.t: "器伥"
 yan_jjj.5.d: "梁府夜里报了失窃。\n\n有人抱着同样的木匣子飞檐而去，巡夜的追到墙头就断了线。天亮后开匣一看，里头是一只染黑的茶壶。\n\n那只真盏，早在前一夜就被换走了。\n\n同一夜，尚蜀城里的器物开始活。茶壶自己走，挂画里的人会眨眼，镇纸在书案上挪了半寸。最先发现的人以为是眼花，到第二户、第三户也这么说的时候，府衙门口的鼓就没停过。\n\n司岁台的旧档里管这东西叫「器伥」。\n\n档上说：盏所过之处，器物皆活。上一次出现，是二十五年前。上上次，是一甲子前。\n\n档上没说的是，它们为什么活。"
 yan_jjj.5.a: "全城宵禁，官署带兵器巡街"
 yan_jjj.5.b: "只封梁府，其余不许惊动"
 yan_jjj.5.c: "请司岁台入城主持"

# ------------------------------------------------------------------
# 6 除岁
# ------------------------------------------------------------------
 yan_jjj.6.t: "除岁"
 yan_jjj.6.d: "五纺阁的楼上，左乐把话交到了底。\n\n司岁台盯着三个人：年、夕，和在尚蜀藏了很久的那一位。夕擅离山头，已经让台里很不高兴。而那只盏里寄宿的东西，他们认为必须除掉。\n\n他要罗德岛劝那个龙门人交盏，一起「除岁」。\n\n克洛丝拒绝了。她说，她见过年，那不是该被「除掉」的东西。\n\n另一头，太合找上了梁洵。太合是肃政院副监察御史，信条四个字：取忠舍义。他把台里的原计划摊开——盏一到手，就佯装遭劫，交给左乐，以瞒过某些人的眼。\n\n梁洵听完了，只问了一句：\n\n是谁让左宣辽亲自操劳一只盏？\n\n太合没有答。"
 yan_jjj.6.a: "支持司岁台。准其除岁"
 yan_jjj.6.b: "驳回。岁之代理人另有大用"
 yan_jjj.6.c: "不表态。让他们自己去争"

# ------------------------------------------------------------------
# 7 忘水坪
# ------------------------------------------------------------------
 yan_jjj.7.t: "忘水坪"
 yan_jjj.7.d: "攥江峰顶有片空地，古名忘水坪。\n\n这一日，该到的人都到了。\n\n左乐站在一处，说出了一个没人愿意说的事实：那只盏里寄宿着凶兽的意识。造盏的人是个大罪人，而现在的主人——\n\n他说到这里停了一下。\n\n「是一个诗人。」\n\n另一边，郑清钺和挑山人已经不必再说话了。两人在峰顶交手，招式都是十年前那一套，只是使的人老了十年。刀风扫过，那只盏被磕飞出崖。\n\n罗德岛的人站到了年那一边。年现了身。它看了看底下的人，说：我想干掉那个玩意。\n\n眼看要收不住了。\n\n老船夫慎楼往前走了两步，抬起手，指着雨。\n\n雨就落了。落得像剑。\n\n两把兵器同时垂了下去。"
 yan_jjj.7.a: "即刻追盏，不计代价"
 yan_jjj.7.b: "追人。技艺可用，人才难得"
 yan_jjj.7.c: "封山。谁也别上去"

# ------------------------------------------------------------------
# 8 岁相
# ------------------------------------------------------------------
 yan_jjj.8.t: "我是我，与它何干"
 yan_jjj.8.d: "凉亭是凭空来的。\n\n上一刻那里还是空的，下一刻就有了柱子、檐角、和一盘摆好的棋。\n\n令坐在里面。她是岁之代理人里的长姐，无官身，不受调遣，朝廷的册子上关于她的那一栏一向是空的。\n\n她看了一眼那个「龙门人」，笑了。\n\n那不是老鲤。那是个借了老鲤面孔的东西——岁相，寄在盏中，有形无神。\n\n太傅的手谕也在这一夜到了尚蜀。梁洵认得上面的字迹。那不是太傅的。那是颉的——已经消失了很多年的颉。\n\n岁相悬在半空，俯视着整座尚蜀城。它没有说话，它只是在看。\n\n令拨了一下琴。\n\n她说：我是我，与它何干。人间已醉万年，还不许我大梦一场？\n\n琴音过处，那个东西碎了。\n\n碎得像一盘被打翻的棋。"
 yan_jjj.8.a: "命史官如实记。一字不改"
 yan_jjj.8.b: "削去此段。这一夜不存在"
 yan_jjj.8.c: "追问令：下一次，谁来挡"

# ------------------------------------------------------------------
# 9 再弈
# ------------------------------------------------------------------
 yan_jjj.9.t: "一百八十一枚黑子"
 yan_jjj.9.d: "画中的天地上，黑白对局。\n\n岁相拉了几个人陪它下：梁洵、宁辞秋、克洛丝、左乐。它一面落子，一面说话。\n\n它说，它失去过一位妹妹。它说，它的棋篓里少了一枚黑子。它说，它要落一百八十一枚子在这个人间。\n\n那不是威胁，那是算术。\n\n真正赢下这盘棋的是老鲤——那个做私家侦探的人。他不会下棋，他只会看人。他看了几十年的脸色，知道对面每一步落在哪里、为什么落、落给谁看。\n\n岁相投子认输了。\n\n它留给令「一份小礼」，然后散了。\n\n令把棋盘收了。她说，这东西不算输，它只是决定换个地方继续下。"
 yan_jjj.9.a: "信。即日修边备、筑隘口"
 yan_jjj.9.b: "不信。一盘棋而已"
 yan_jjj.9.c: "把这一局的每一步，原样记进天经阁"

# ------------------------------------------------------------------
# 10 五五之间
# ------------------------------------------------------------------
 yan_jjj.10.t: "五五之间"
 yan_jjj.10.d: "太傅是自己来的，没带仪仗。\n\n他在尚蜀待了三日，见了几个人，听了几段书，最后给这件事判了四个字：五五之间。\n\n既不算司岁台对，也不算礼部错。既不能说那只盏无害，也不能说它可留。\n\n他带梁洵入京。\n\n他遣宁辞秋先赴玉门。\n\n他和年谈了一件事——十二楼五城，机关三千座，兵俑百万台。为的是换回一个戍守北境三百七十余年的老前辈。年听完没有拒绝，也没有答应，只说了一句：良辰美景方为山顶。\n\n令把那只黑盏掷向阴云。\n\n三十年前尚蜀那场天灾的旧景，在云里重现了一次。\n\n郑清钺和挑山人的恩怨「暂缓」。杜遥夜宣布，带尚蜀的年轻人去玉门。\n\n太傅临走前对送行的官吏说了一句话：大炎疆土之内，我只怕百姓不得安生。我还怕什么。"
 yan_jjj.10.a: "准太傅所请：造十二楼五城"
 yan_jjj.10.b: "只准入京一节。尚蜀之事到此为止"
 yan_jjj.10.c: "全部驳回。迁梁洵他任，遣散闲人"
