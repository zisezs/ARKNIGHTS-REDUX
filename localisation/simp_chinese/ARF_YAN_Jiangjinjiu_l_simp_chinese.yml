l_simp_chinese:

# ==============================================================================
#  大炎 · 将进酒（事件链 · 10 环）
#  · 原作 act15side，地点尚蜀，时间早春
#  · 视角：一只黑色酒盏入境，礼部与司岁台争管辖，玩家以朝廷身份裁定
#  · 机制数值提示键统一走 ARF_YAN_Sidestory_Shared_l_simp_chinese.yml
# ==============================================================================

# ------------------------------------------------------------------
# 1 黑盏
# ------------------------------------------------------------------
 yan_jjj.1.t: "一只黑盏"
 yan_jjj.1.d: "那只盏是从龙门进来的。黑釉，无款，盏底有一枚极小的刻痕，像棋子。带它入境的人姓鲤，龙门人，做私家侦探，同行的是个快要散架的木匣子。\n\n司岁台一年前就有密令追这只盏。梁洵在尚蜀接到密令时，司岁台的人已经在渡口等了两天。礼部的人也到了。宁辞秋是礼部左侍郎，从二品钦差，三年前派驻尚蜀监管那个「令」，她的说法很简单：司岁台本属礼部，凭什么绕过礼部行文。左乐是司岁台最年轻的秉烛人，父亲是玉门守将左宣辽，他的说法更简单：你们礼部管不了这件事。\n\n梁洵夹在中间，做尚蜀知府一年，清楚这两家谁都不能得罪。他递上来的折子只有一句话：请朝廷定夺。"
 yan_jjj.1.a: "归司岁台办，礼部不得干预"
 yan_jjj.1.b: "归礼部办，司岁台只出人不出名"
 yan_jjj.1.c: "不定归属，许梁洵便宜行事"

# ------------------------------------------------------------------
# 2 无理手
# ------------------------------------------------------------------
 yan_jjj.2.t: "一记无理手"
 yan_jjj.2.d: "梁洵没有接盏。他把那个龙门人雇了下来，托他第二件事：找出盏的主人。他不知道那人姓什么，也不知道是什么种族，只知道那人偶尔会在山腰的酒铺买酒，从来没有下过山。\n\n送盏入府这件事他做得光明正大，查盏主这件事他做得悄无声息。一盏明棋，一记暗子；司岁台盯盏，礼部盯人，他就把盏和人拆开，让他们各盯各的。当夜宁辞秋夜访梁府，撞了个正着。她站在阶下看了很久，没有上前，也没有说话。第二天照旧送了一份节礼，附帖上写着：尚蜀风高，慎之。梁洵把帖子收进抽屉，没有回。"
 yan_jjj.2.a: "准他所请。用人不疑"
 yan_jjj.2.b: "斥其越权，命即刻交盏"
 yan_jjj.2.c: "准，但另遣司岁台的人盯住那个龙门人"

# ------------------------------------------------------------------
# 3 行裕
# ------------------------------------------------------------------
 yan_jjj.3.t: "行裕客栈"
 yan_jjj.3.d: "行裕客栈的掌柜姓郑，从前是镖局总镖头，挂刀十年，改行开饭馆。这一日店里打了起来。\n\n动手的是他的养女杜遥夜。她认错了人，一脚挑飞木椅，转过来向那个龙门人索盏。桌边两个外乡人卷了进来，是罗德岛的干员乌有和克洛丝，三人缠了几合，从窗口翻出去，没有伤人，只打碎了三只碗。\n\n郑清钺从后厨出来，先看地上的碎瓷，再看女儿，然后免了全店赔，把客人一个个送出去，一句重话也没说。转天，尚蜀城里就有了话：行裕的郑掌柜，这十年是白挂刀了。"
 yan_jjj.3.a: "缉拿动手者，按律办"
 yan_jjj.3.b: "只记档，先看着"
 yan_jjj.3.c: "借机清点城中所有外来人口"

# ------------------------------------------------------------------
# 4 旧账
# ------------------------------------------------------------------
 yan_jjj.4.t: "十年上下山"
 yan_jjj.4.d: "泥泥峰下有个挑夫，人称挑山人。他上山挑货一日一趟，十年没断过，可他没有家，山上也没有货栈。他挑的是自己，上去是为了在两块石头中间坐一会儿，那下面埋着他的儿子。\n\n他接了那个龙门人的活，把山里的废亭一一标出来。标完之后，他去了行裕客栈找伙计刘二，没有打人，只把扁担横在门框上，站着问了三句话。刘二把「酒盏」两个字说了出来。挑山人听完，把扁担收回去，说：十年前那只，原来也在尚蜀。他从此不再上山。"
 yan_jjj.4.a: "提挑山人来问话"
 yan_jjj.4.b: "传郑清钺到衙，问他十年前的事"
 yan_jjj.4.c: "都不动，此案与朝廷无关"

# ------------------------------------------------------------------
# 5 器伥
# ------------------------------------------------------------------
 yan_jjj.5.t: "器伥"
 yan_jjj.5.d: "梁府夜里报了失窃。有人抱着同样的木匣子飞檐而去，巡夜的追到墙头就断了线。天亮后开匣一看，里头是一只染黑的茶壶，那只真盏早在夜里就被换走了。\n\n同一夜，尚蜀城里的器物开始活。茶壶自己走，挂画里的人会眨眼，镇纸在书案上挪了半寸。最先发现的人以为眼花，到第二户、第三户也这么说的时候，府衙门口的鼓就没停过。\n\n司岁台的旧档里管这东西叫「器伥」：盏所过之处，器物皆活。上一次出现是二十五年前，上上次是一甲子前。档上没说的是，它们为什么活。"
 yan_jjj.5.a: "全城宵禁，官署带兵器巡街"
 yan_jjj.5.b: "只封梁府，其余不许惊动"
 yan_jjj.5.c: "请司岁台入城主持"

# ------------------------------------------------------------------
# 6 除岁
# ------------------------------------------------------------------
 yan_jjj.6.t: "除岁"
 yan_jjj.6.d: "五纺阁的楼上，左乐把话交到了底。司岁台盯着三个人：年、夕，和在尚蜀藏了很久的那一位。夕擅离山头已经让台里很不高兴，而那只盏里寄宿的东西，他们认为必须除掉。他要罗德岛劝那个龙门人交盏，一起除岁。克洛丝拒绝了，她说自己见过年，那不是该被除掉的东西。\n\n另一头，太合找上梁洵。太合是肃政院副监察御史，信条四个字：取忠舍义。他把台里的原计划摊开：盏一到手，就佯装遭劫，交给左乐，瞒过某些人的眼。梁洵听完只问了一句：是谁让左宣辽亲自操劳一只盏？太合没有答。"
 yan_jjj.6.a: "支持司岁台，准其除岁"
 yan_jjj.6.b: "驳回，代理人另有大用"
 yan_jjj.6.c: "不表态，让他们自己去争"

# ------------------------------------------------------------------
# 7 忘水坪
# ------------------------------------------------------------------
 yan_jjj.7.t: "忘水坪"
 yan_jjj.7.d: "攥江峰顶有片空地，古名忘水坪。这一日，该到的人都到了。\n\n左乐站在一处，说出了一个没人愿意说的事实：盏里寄宿着凶兽的意识，造盏的人是个大罪人，现在的主人是一个诗人。\n\n另一边，郑清钺和挑山人已经不必再说话。两人在峰顶交手，招式都是十年前那一套，只是使的人老了十年。刀风扫过，盏被磕飞出崖。罗德岛的人站到年那一边，年现了身，看看底下的人，说：我想干掉那个玩意。眼看要收不住，老船夫慎楼往前走两步，抬手，指着雨。雨就落了，落得像剑。两把兵器同时垂了下去。"
 yan_jjj.7.a: "即刻追盏，不计代价"
 yan_jjj.7.b: "追人。技艺可用，人才难得"
 yan_jjj.7.c: "封山，谁也别上去"

# ------------------------------------------------------------------
# 8 岁相
# ------------------------------------------------------------------
 yan_jjj.8.t: "我是我，与它何干"
 yan_jjj.8.d: "凉亭是凭空来的。上一刻那里还是空的，下一刻就有了柱子、檐角，和一盘摆好的棋。\n\n令坐在里面。她是岁之代理人里的长姐，无官身，不受调遣，朝廷册子上关于她的那一栏一向是空的。她看了一眼那个龙门人，笑了。眼前的人并非老鲤，只是个借了老鲤面孔的东西，岁相，寄在盏中，有形无神。\n\n太傅的手谕也在这一夜到了尚蜀。梁洵认得上面的字迹。写字的人并非太傅，是颉，已经消失了很多年的颉。岁相悬在半空，俯视整座尚蜀城，没有说话，只是在看。令拨了一下琴，说：我是我，与它何干。人间已醉万年，还不许我大梦一场？琴音过处，那个东西碎了，碎得像一盘被打翻的棋。"
 yan_jjj.8.a: "命史官如实记，一字不改"
 yan_jjj.8.b: "削去此段，这一夜不存在"
 yan_jjj.8.c: "追问令：下一次，谁来挡"

# ------------------------------------------------------------------
# 9 再弈
# ------------------------------------------------------------------
 yan_jjj.9.t: "一百八十一枚黑子"
 yan_jjj.9.d: "画中的天地上，黑白对局。岁相拉了几个人陪它下：梁洵、宁辞秋、克洛丝、左乐。它一面落子，一面说话。\n\n它说它失去过一位妹妹，说它的棋篓里少了一枚黑子，说它要落一百八十一枚子在这个人间。它说这些话时没有威胁的意思，只是在算一笔账。\n\n最后赢下这盘棋的是老鲤，那个做私家侦探的人。他不会下棋，只会看人。他看了几十年脸色，知道对面每一步落在哪里、为什么落、落给谁看。岁相投子认输，留给令一份小礼，然后散了。令把棋盘收了，说这东西不算输，它只是决定换个地方继续下。"
 yan_jjj.9.a: "信。即日修边备、筑隘口"
 yan_jjj.9.b: "不信，不过一盘棋"
 yan_jjj.9.c: "把这一局的每一步，原样记进天经阁"

# ------------------------------------------------------------------
# 10 五五之间
# ------------------------------------------------------------------
 yan_jjj.10.t: "五五之间"
 yan_jjj.10.d: "太傅是自己来的，没带仪仗。他在尚蜀待了三日，见了几个人，听了几段书，最后给这件事判了四个字：五五之间。既不算司岁台对，也不算礼部错；既不能说那只盏无害，也不能说它可留。\n\n他带梁洵入京，遣宁辞秋先赴玉门。他和年谈了一件事：十二楼五城，机关三千座，兵俑百万台，为的是换回一个戍守北境三百七十余年的老前辈。年听完没有拒绝，也没有答应，只说了一句：良辰美景方为山顶。\n\n令把那只黑盏掷向阴云。三十年前尚蜀那场天灾的旧景在云里重现了一次。郑清钺和挑山人的恩怨暂缓。杜遥夜宣布带尚蜀的年轻人去玉门。太傅临走前对送行的官吏说：大炎疆土之内，我只怕百姓不得安生，我还怕什么。"
 yan_jjj.10.a: "准太傅所请：造十二楼五城"
 yan_jjj.10.b: "只准入京一节，尚蜀之事到此为止"
 yan_jjj.10.c: "全部驳回，迁梁洵他任"
