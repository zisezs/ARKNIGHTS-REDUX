# 大炎 · 五路线（路线头与新增国策）
YAN_Route_Court:0 "百灶龙腾"
YAN_Route_Court_desc:0 "朝堂上的事很少是是非问题，多半是谁先熬不住。宫门一扇扇关上，奏疏从紫宸殿阶下堆到廊上。要办大事，先得把这些账算清。"
YAN_Route_Sui:0 "岁岁今朝"
YAN_Route_Sui_desc:0 "秉烛人的册子上有十二个名字。前头几页是监视记录，后头几页是空的，留给还没谈拢的人。"
YAN_Route_Army:0 "止戈为武"
YAN_Route_Army_desc:0 "大炎数百年没主动开过战，武备却一日没停。校场上的号声、军需库的封条、船坞里的龙骨，各归各的衙门。要打之前，先得把这些衙门理成一条线。"
YAN_Route_Civil:0 "大炎智造"
YAN_Route_Civil_desc:0 "百灶城底下的矿脉养着整座都城，也养着十九州的灶火。工坊、学宫、州县三处各记各的账，合起来才是大炎的家底。"
YAN_Route_Diplomacy:0 "炎与泰拉"
YAN_Route_Diplomacy_desc:0 "四方馆的牌子是新的，馆里的档案是旧的。礼部把历年国书排了一遍，发现断了几十年，接得上的只剩商路上的几个人名。"
YAN_Dali_Temple_Retrial:0 "大理寺重审"
YAN_Dali_Temple_Retrial_desc:0 "太师案的卷宗重新打开。大理寺会同御史台、肃政院同审，卷牍虽烧过一回，当年过堂的证人还有活着的。"
YAN_Three_Laws_Check:0 "三法司制衡"
YAN_Three_Laws_Check_desc:0 "大理寺断案，御史台纠察，肃政院覆核，三司不相统属。审得慢，但没人能一句话定人生死。"
YAN_Censorate_Purge:0 "御史台整肃"
YAN_Censorate_Purge_desc:0 "御史出巡十九州，弹章直递紫宸殿。风声一起，百灶夜里跑的车都少了。"
YAN_Agent_Chongyue:0 "朔·重岳"
YAN_Agent_Chongyue_desc:0 "大哥把「朔」这个名字封进剑里，换了一具人的身子。玉门的教席辞了，剑还挂在墙上，都知道那面墙不能靠。"
YAN_Agent_Ling:0 "令"
YAN_Agent_Ling_desc:0 "长姐爱酒，也爱在夜里写诗。她在玉门守过一百年，回来只留了一句话：城还在，人换了几茬。"
YAN_Agent_Jun:0 "均"
YAN_Agent_Jun_desc:0 "四姐治过狱，修过《炎律》，闲下来就抚琴。她说律条和曲谱是一回事，都讲究个先后。"
YAN_Agent_Xie:0 "颉"
YAN_Agent_Xie_desc:0 "五姐的名字从所有文书里都找不到了。天镜阁顶楼那把书刀还在原位，谁也不敢去取。"
YAN_Agent_Shu:0 "黍"
YAN_Agent_Shu_desc:0 "六姐在大荒城教书、育种，一身甲胄下田也不换。她跟望、令最亲，谁劝她回百灶都不成。"
YAN_Agent_Ji:0 "绩"
YAN_Agent_Ji_desc:0 "七哥早年跟着黍长大，后来走商路，四海都有他的织机。他算的不是账，是谁还欠着谁。"
YAN_Agent_Yi:0 "易"
YAN_Agent_Yi_desc:0 "八弟守着界园，年年主持镇抚。园里的草木他记得比谁都清，问他哪一株动过，他能说出去年几月。"
YAN_Agent_Nian:0 "年"
YAN_Agent_Nian_desc:0 "九妹的炉子从不熄。她造的兵器在龙门、尚蜀、百灶都见过血，她自己最爱看电影。"
YAN_Agent_Fang:0 "方"
YAN_Agent_Fang_desc:0 "十弟在萨尔贡行医，连巨兽也肯听他的。家里的宴席他一次没到过，信倒是年年写。"
YAN_Agent_Xi:0 "夕"
YAN_Agent_Xi_desc:0 "十一妹躲在画里，画的是世间从未有过的东西。灰齐山下那间屋子，门从来没锁过。"
YAN_Agent_Yu:0 "余"
YAN_Agent_Yu_desc:0 "幺弟在余味居熬汤，说汤要够时辰，人才回得来。兄妹里数他最会做饭，也数他最会等人。"
YAN_Army_Discipline:0 "军纪整肃"
YAN_Army_Discipline_desc:0 "校场上重新立起军法柱。这一回先记后斩，记档挂在营门口，谁都看得见。"
YAN_Dragon_Keel_Dockyard:0 "龙骨船坞"
YAN_Dragon_Keel_Dockyard_desc:0 "东部海港新起船坞。龙骨用源石锻接，首尾相接长过三艘楼船，附近渔户夜里都绕着走。"
YAN_Military_Audit:0 "军需审计"
YAN_Military_Audit_desc:0 "兵部、户部与御史台同核军需。缺的粮、少的甲，一件件对回账上；对不上的，写上名字。"
YAN_Judge_Advocate:0 "军法官署"
YAN_Judge_Advocate_desc:0 "军法官不再由将门自派，改归都督府直领。刀归刀，账归账。"
YAN_Giant_Warship_Design:0 "巨舰设计"
YAN_Giant_Warship_Design_desc:0 "图纸改到第九稿。设计堂的说法是：这船不为打仗，为的是让人知道大炎有海。"
YAN_Originium_Main_Gun:0 "源石主炮"
YAN_Originium_Main_Gun_desc:0 "主炮只能朝海开后门，别处放不下。第一炮试射那天，近处渔村以为是雷，家家点了灯。"
YAN_Xuanji_Armada:0 "玄极巨舰"
YAN_Xuanji_Armada_desc:0 "陆上有玄极巨兵，海里有这艘巨舰。两件东西同一天成军，观礼的人站了两岸。"
YAN_Four_Quarters_House:0 "四方馆"
YAN_Four_Quarters_House_desc:0 "译官、通事、驿马备齐。来的都是客，账记在礼部，眼线记在别处。"
YAN_Victoria_Embassy:0 "维多利亚使团"
YAN_Victoria_Embassy_desc:0 "使团沿商路西行，带去茶叶与丝，带回图纸和一肚子问题。"
YAN_Lungmen_Guard_Reform:0 "近卫局改制"
YAN_Lungmen_Guard_Reform_desc:0 "近卫局不再只管穷巷里的械斗。码头、货栈、税关一并接手，人手不够就招，新招来的先学会闭嘴。"
YAN_Disaster_Relief_Office:0 "天灾应急司"
YAN_Disaster_Relief_Office_desc:0 "天灾不等奏报。应急司有先开仓、后补报的权，也有事后被追责的准备。"
YAN_Yumen_Colonization:0 "玉门屯垦"
YAN_Yumen_Colonization_desc:0 "玉门外的荒地划成屯田，军户与流民同编。头一年种不活也种，第二年地就认人了。"
YAN_Dahuang_New_City:0 "大荒新城"
YAN_Dahuang_New_City_desc:0 "大荒城往东拓出一片新城。图纸上先画了三条街，动工时先修的是粮仓。"
YAN_Shanhaizhong_Subjugation:0 "山海众清剿令"
YAN_Shanhaizhong_Subjugation_desc:0 "清剿令下到各州，赏格贴在城门。有人叫好，有人连夜把刀藏进米缸。"
YAN_Shanhaizhong_Resettlement:0 "山海众编遣"
YAN_Shanhaizhong_Resettlement_desc:0 "编遣不是招安，是给一条活路：发田、发籍，再加一句「既往不咎」。"
YAN_Border_Garrison_Rotation:0 "边军轮戍"
YAN_Border_Garrison_Rotation_desc:0 "边军三年一轮。回京的带边情，出塞的带家书，两样东西都不许落在路上。"

