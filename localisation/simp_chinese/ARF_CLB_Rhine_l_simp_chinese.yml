# ============ 国策描述（第二步生成） ============
 CLB_life_11th_year_desc: "第十一年。特里蒙的灯照常亮着，实验室照常通宵，总辖办公室的门在凌晨还开着。塞雷娅在门外站了一会儿——如果克丽斯腾的研究计划里写着「天空」，那天空就不是她的手段，而是她的目标。总得有人替这片大地看着它。"
 CLB_ten_departments_council_desc: "十科的主任第一次坐到同一张桌子前：结构科、能量科、源石技艺应用科、工程科、生态科、商务科、人力资源科、防卫科、科考科、总辖构件科。十张椅子，十个方向。帕尔维斯散会时留下一句——科学属于超人，庸众可以去选择政客、崇拜领袖，但唯有科学，他们不配染指。没人反驳，这句话后来被记进了会议纪要。"
 CLB_yara_connections_desc: "雅拉在莱茵的人事档案之外，还留着一本梅兰德时期的旧联络簿。她知道哪个议员欠着谁的人情，哪家报社的主编可以被说服，哪个主任的抽屉里锁着一份不该存在的合同。她把这些一页页摊在桌上说：他们和你一样，都是这家公司的基石。"
 CLB_parliament_majority_desc: "联合议会与国防部的对立已经持续了十年，玻利瓦尔的败仗让议员们第一次攥住了军方的把柄。莱茵生命不站队，只把该送的礼物送到该去的地方。多数席位不是买来的，是等来的。"
 CLB_jackson_ambition_desc: "副总统在特里蒙的讲台上说出那句话：天空是哥伦比亚的下一个开拓区。记者们记下了，福拉尔街的股价记下了，莱茵生命也记下了。雅拉后来在进步大厦与他对谈，只劝了一句——把目光放回哥伦比亚这片土壤。他听进去了一半。"
 CLB_president_neutered_desc: "大总统马克·麦克斯在文件上签了字。他说，我们会统筹所有的意志，我们会收缴全部的真理。签字的手很稳——因为真正的意志从来不在他手里。所有人都以为总统是那个发号施令的人，只有极少数人知道他坐在谁的肩膀上。"
 CLB_defense_dept_expansion_desc: "防卫科的编制从安保扩到准军事。塞雷娅在遴选名单上划掉了大半名字，只留下一句批注：你太过安于现状且没有坚持，我的手下不需要这样的人。"
 CLB_defense_ministry_contract_desc: "国防部需要一件能挽回玻利瓦尔颜面的东西。克丽斯腾递上「地平弧光计划」与「弧光一号」——一沓塞雷娅后来称之为从来就不具备可行性的废纸的图纸。军方砸进去多少钱没人算得清，莱茵生命拿到了核心技术顾问的身份，和此后十年用不完的政策支持。"
 CLB_black_colonel_desc: "布莱克上校相信军队的权威不容挑战。他在封锁线上说，没人能在哥伦比亚的土地上挑战哥伦比亚军队。莱茵生命需要这样一个人——一个把耻辱当燃料的人，比一个没有欲望的人好控制得多。"
 CLB_mobile_cavalry_loyalty_desc: "边境地带的机动骑兵部队名义上隶属国防部，补给、零件、家属的医疗却都走在莱茵的账上。塞雷娅说机动骑兵是联邦的精锐——她没说的是，精锐也要有人发饷。"
 CLB_mejia_orphans_desc: "梅希亚姓塞勒涅。塞勒涅孤儿院是梅兰德基金会的前身，塞勒涅先生被称作联邦之父，信条是只有新事物，旧事物都该为前进所用。她在孤儿院里学会了怎么记住别人想忘掉的事，也学会了什么时候该忘掉自己听见的东西。"
 CLB_maylander_split_desc: "梅兰德的准则写得很干净：实际情况与计划发生重大偏差时立即停止行动。问题在于，这一次的重大偏差正是他们自己制造的。应急管理监督协会进驻那天，基金会内部的电报机响了整夜——有人在删档案，有人在改口径，有人只是把钥匙留在了桌上。"
 CLB_tinman_acquiescence_desc: "锡人寄身一副空盔甲，人称铁皮游侠。他说，变化和喧嚣是哥伦比亚的常态，永远在拓荒、永远在前进的国度不会停下来等任何人，哪怕一秒。所以当莱茵生命开始前进时他没有伸手拦——他只是把表放在桌上，算清这一次的偏差究竟有多大。"
 CLB_holhayya_intel_desc: "霍尔海雅是黎博利，也是斐迪亚——羽蛇的血脉追了四百五十一年，要取回风与雷。她挂着哥伦比亚占星研究协会名誉会长的名头，自称历史学者，同时替莱茵生命跑腿。她说过两句让人记很久的话：不要急着与我为敌，不要急着与任何人为敌；以及在哥伦比亚，人们至少应该拥有拥抱死亡的自由。"
 CLB_skyloan_pilot_desc: "特殊贷款政策落地那年，三分之一的企业增设了天空事业部门。「幸运瘤兽」的经理雅斯彭借了一笔以天空为名的高息贷款，把餐馆搬进了园区——他不是相信天空，他只是想让招牌出现在直播镜头里。天空贷就是这样开始流通的。"
 CLB_beast_lord_duck_duke_desc: "天空之上并非无人看管。兽主鸭爵对莱茵的工程既没有表示反对，也没有表示同意——它只是来看了一眼那座环，留下一个几乎算不上注视的注视。对这种存在而言，默许比批准更难得，也更贵。"
 CLB_beast_lord_pact_desc: "缔约的条款没有写在纸上。莱茵生命交出去的是「以后每一次坠落都要足够好看」这一类东西——不是承诺，是姿态。兽主的默许度从此成为一项国家资源，也从此成为一项国家负债。"
 CLB_offer_wonders_desc: "哥伦比亚人相信进步要看得见。于是一切的答案都被造成建筑：垃圾场里藏起来的万星园、六百米高处浮着的螺旋桨天堂、地底无法关闭的能量井、以咒言与生物技术长出的「树」。把它们献上去，换来的东西从不写在合同里。"
 CLB_justin_board_desc: "小贾斯汀的家族有一种罕见的血液遗传病，患者一般活不过四十五岁。他给自己开的药方是权与利——用行贿提走监狱里的科学家，用期权收编创业者，用几家报纸的头版换国防部的订单。他说，我想把自己的命运，把所有人的命运把握在手里。"
 CLB_skyloan_desc: "天空贷是把未来的收益抵押给今天的狂热。福拉尔街的细分门类超过两百个，登记的最长生效年份已经到了三百年后；但凡沾上「天空」二字的股票保准一路大涨。钱来得比风还快——稳定度是抵押品。"
 CLB_originium_insurance_desc: "在哥伦比亚，保险是刻在所有感染者脑子里的词语。合同有五百六十九页，解雇通知书只有薄薄半张纸——付不起保费的人被迁进感染者收治区，从此与城市准入管制隔墙相望。玛丽警长管这叫一笔罚款、一条隐藏的规则，用来变相逼迫感染者走上被设定好的道路。莱茵生命把它做成了产品。"
 CLB_pioneer_contract_desc: "拓荒队的名单上写着：对当前生活不满的年轻人，欠了债日子过不下去的中年夫妇，小偷小摸被抓了又不想坐牢的罪犯，还有付不起保险又不甘心被关进收治区的感染者。莱茵生命不直接做高风险的实验，它把这些人和一座建在城郊荒野上的基地签在一起。桑尼问过一句——凭什么我们的机会，只能等着你们来给。"
 CLB_energy_well_desc: "特里蒙城外地下挖出的那座能量井，军方以为是自己掌握的设施。它确实无法关闭——但原因并不是军方以为的那个。真正在下面供能的东西，是成百上千座石棺。"
 CLB_sarcophagus_energy_desc: "石棺不烧源石。它提供的能量足够维持整个哥伦比亚所有移动城市至少半年的消耗，而且还在继续吸收。守护地下石棺大厅的是「保存者」——一个自称行将就木、说自己就是文明消亡本身的人格模拟。凯尔希在地下看到它时只说了四个字：抓稳一些。"
 CLB_dept_structure_desc: "帕尔维斯研究的是灵魂层面上的嵌合——用递质当土壤，造出人造意识。赫默是他的学生，也是唯一敢在会议上说这种实验从头到尾都不该存在的人。老山羊不生气，他只是把公式推过去，说我们背负科学，我们被它命令，供它驱策。"
 CLB_dept_energy_desc: "递质对微振动极其敏感，能接收并编码神经信号；它理论上能让源石技艺适应性普通的人摇身一变成为优秀的术师。多萝西想得更远——把受试者的意识接进「中枢」，让所有人平等地感受世界。她说，在哥伦比亚，我希望我们生来平等。"
 CLB_dept_engineering_desc: "娜斯提用词句的力量造东西。柔性钢缆、球形缆车、高空电梯——她把这些叫作天空的血管。有人问她为什么一个萨卡兹要替哥伦比亚造浮空层，她用萨卡兹语答了一句，然后自己译过来：天空，亦是萨卡兹的应许之地。"
 CLB_dept_ecology_desc: "生态科主任缪尔赛思是精灵。她的法术不是源石技艺，操纵的是水分子——分身、幻象，以及后来在深空里张开的那堵水墙。她在万星园里复刻了一座生态园，也是她最后用尽全身的水，把从紧急逃生门掉下去的塞雷娅接住。"
 CLB_dept_business_desc: "商务科买下的不只是公司。《科技评论》《拯救者报》《进步之声》的官方频道、晚间电台、连贫民窟垃圾桶盖上都印着的宣传标语——一个说法只要重复得足够久，就会变成常识。"
 CLB_dept_hr_desc: "人力资源科把感染者、拓荒者、移民和难民编成同一张名册。雅拉的原话是「他们和你一样，都是这家公司的基石」——这句话对公司和对他们而言，含义并不相同。"
 CLB_dept_defense_desc: "第一批动力甲原型出厂时，防卫科的人发现它最可怕的地方不是装甲，而是它对使用者没有要求——任何能维持一般运动状态的个体都可以驾驭它。杰斯顿的皮肤下层也埋着莱茵生命科技的结晶：一些小小的金属板。"
 CLB_dept_expedition_desc: "科考科主任马里亚姆带队去了因非冰原的最深处。他带回来的东西不大——一块圆形巨构的碎片。上个时代的人给这种东西起过一个名字，马里亚姆把它写在了报告的第一行。"
 CLB_dept_construct_desc: "总辖构件科是专为一个项目设立的科室，集合了几乎全部主任的智慧，去造一座藏在垃圾场里的环形巨构。项目结束那天科室就解散了——它造的东西有一个真名，叫万星园。"
 CLB_emergency_authorization_act_desc: "特区的特批管理法案原本规定，紧急事件发生后十二小时内相关部门必须召开听证会。莱茵生命没有废除这一条——它只是把「紧急事件」的定义权握到了自己手里。法案通过那天，联合议会留了一本规章手册，让出了攥了八十年的审核权。"
 CLB_rhine_united_states_desc: "从这一天起，莱茵生命就是哥伦比亚。十科不再是公司的科室，而是国家的部委；股东不再是投资者，而是选民。企业紧急授权法盖了章，黄昏与筹备两块牌子被摘下来收进档案室。"
 CLB_ten_departments_system_desc: "十科合议制写进宪法之后，每一笔国家预算都要先在主任们的桌子上过一遍。帕尔维斯说这是莱茵的大脑；赫默后来说，大脑不该只有十个人。"
 CLB_shareholder_parliament_desc: "选民改叫股东。席位按持股比例分配，议案以回报率排序，选举日变成了股东大会。小贾斯汀说，这就是哥伦比亚的新民主。"
 CLB_charter_of_directorate_desc: "宪法把总辖写成了国家的最高职务。塞雷娅就任时没有宣誓，她只是把克丽斯腾留下的那句话放进了序言——真正的先驱者，应当为全人类开道，而不是率先跳进深渊，有去无回。"
 CLB_purge_defense_ministry_desc: "玻利瓦尔的败仗和地平弧光计划的丑闻一起压在国防部头上。莱茵生命没有清算它，只是把它变成了一间空办公室——花名册上留着名字，电话线已经拔了。"
 CLB_recruit_black_desc: "布莱克上校被编进了莱茵国防军。他仍然相信军队的权威不容挑战，只是现在这份权威由特里蒙签发。一个一无所有的失败者，比任何人都更好用。"
 CLB_maylander_reform_desc: "梅兰德被改成了一支只对档案负责的机构。锡人保住了他的考勤表和准则，代价是不再问那些不该问的问题。"
 CLB_maylander_purge_desc: "清理梅兰德的那一周，特里蒙有三家报纸换了主编，两个部门的档案室失了火。没有人被起诉——在哥伦比亚，让人消失从来不需要起诉。"
 CLB_deal_with_tinman_desc: "与锡人的交易没有合同。莱茵生命得到一张通行证和一份沉默；锡人得到他真正想要的东西——一个稳定的、可预测的哥伦比亚，哪怕它的名字叫莱茵。"
 CLB_infected_shareholders_desc: "感染者被允许持有股份。这不是慈善，是把最不稳定的那群人绑到同一张财报上——工资可能拖欠，分红不会。"
 CLB_treatment_zone_reform_desc: "收治区的高墙被拆掉两段，换成招聘广告和保险柜台。赫默说，科学是真切地看向每一个人；莱茵把它翻译成了一句更便宜的话——每一个人都是劳动力。"
 CLB_suppress_treatment_zone_desc: "另一条路要短得多。武装进驻收治区，名册重新登记，广播只播一种声音。稳定度上去了，异见也上去了——哥伦比亚的感染者，永远是莱茵的燃料。"
 CLB_rhine_defense_force_desc: "从今天起，莱茵的保安就是国家的军队。防卫科的自律机甲、无人机、动力装甲突击队被编成正式的国防军——国防部那套东西，莱茵生命本来就有。"
 CLB_power_armor_standardization_desc: "动力甲的导管里流着银色液体——递质。切断它的神经中枢，甲就瘫了；不切断，它就连人带甲一起走。标准化解决的正是这个问题：让每一具甲都只听一个人的话。"
 CLB_airship_fleet_desc: "浮空舰队是娜斯提的浮空结构第一次被装上武器。西泰拉防空司令部接管了它的指挥权——雷达站、拦截机联队、民航管制中心在同一张网里。"
 CLB_focusing_generator_deployment_desc: "那个大圆环在军方手册里叫聚焦发生器。它本该是弧光一号的核心部件，负责在极限高度升起并聚焦能量；至于聚焦之后指向哪里，图纸上从来没有写过。"
 CLB_ten_departments_perfect_desc: "十科合议厅完全体落成后，莱茵生命拿到了第一件不在任何人手里的权力：定义什么叫紧急事件、什么叫进步、什么叫代价。建设期从此开始。"
 CLB_intelligence_bureau_desc: "莱茵的商务科和梅兰德的特工在同一个屋檐下办公。一边算账，一边删档案；同一份报告两个人看，会得出两个结论。"
 CLB_beast_lord_playground_desc: "国家成了游乐场。奇观一座接一座地落成，默许度一节一节地往上走，代价记在消费品和稳定度上——没人知道下一场游戏的开幕是什么时候。"
 CLB_sarcophagus_energy_well_desc: "能量井改用石棺供能之后，军方再也说不清它究竟是能源设施还是别的东西。凯尔希在地下的原话是：抓稳一些，我看到了石棺。"
 CLB_energy_well_overload_desc: "过载实验拿到了整整一批能量，也拿到了国际紧张。斐尔迪南说能量井是莱茵的心脏——一颗心脏跳得太快，是要出事的。"
 CLB_construction_charter_desc: "宪法的第一条写的不是权力，而是口径：什么叫进步，什么叫代价，由十科合议厅定义。塞雷娅在序言里留下了克丽斯腾那句话，其余部分交给法务科去磨。"
 CLB_shareholder_democracy_desc: "股东民主落地后，特里蒙的选举广告牌换成了财报摘要。投票率创新高——持有股份的人比持有选票的人更愿意出门。"
 CLB_technocratic_system_desc: "技术官僚体系把录用标准从党籍改成了论文与项目清单。帕尔维斯很满意，评价是：终于不必再和庸众讨论预算了。"
 CLB_infected_citizenship_desc: "感染者公民权法案在议会只辩论了四个小时。它保住的不是尊严，是劳动力的流动性——赫默读完条文后说了一句：科学是真切地看向每一个人。旁边的人以为她在支持这项法案。"
 CLB_pioneer_act_desc: "拓荒者法案承认了荒野上的既成事实：开垦过的土地归开垦的人，前提是他先把合同续上。桑尼当年问的那句凭什么，现在是法条里的一个附件编号。"
 CLB_media_empire_desc: "媒体帝国建成之后，特里蒙只剩两种新闻：莱茵生命做成了什么，以及莱茵生命将要做什么。第一版《进步之声》的社论标题是——哥伦比亚今天没有「进步」之声。"
 CLB_skyloan_expansion_desc: "天空贷扩张到第二轮时，园区注册大厅的企业流动量已经堪比特里蒙中心广场的十字路口。进来的公司比出去的多，谁都觉得自己不会是最后接棒的那个。"
 CLB_sky_concept_stock_desc: "天空概念股细分门类超过两百个，登记的最长生效年份到了三百年后。福拉尔街的交易员不再问公司做什么，只问它沾不沾「天空」二字。"
 CLB_floating_industrial_belt_desc: "浮空工业带把生产线搬到了娜斯提的浮空结构上。物流半径缩短了，事故半径拉长了——掉下来的东西不再只砸到一家工厂。"
 CLB_neurotransmitter_nationwide_desc: "递质网络铺到全国之后，特里蒙第一次能实时感到其他城市的情绪波动。官方口径叫民意感知系统；白面鸮借助脑内的九号装置接进去时，说的是四个字——既难过又幸福。"
 CLB_sarcophagus_energy_grid_desc: "石棺能源网把成百上千座石棺接进了同一张电网。军方再也不敢问电力从哪来——他们只被要求记住一件事：读数不许关。"
 CLB_wanxingyuan_phase2_desc: "万星园二期把服务舱、观测廊桥和星象间补齐了。1099 年 11 月 21 日 19 时 11 分，那座环形巨构从垃圾场里升空——虚假的天空终于被扯碎，亘古的双月露出真容。"
 CLB_propeller_paradise_rebuild_desc: "螺旋桨天堂重建在一层新的浮空平台上。当初那十一座主平台和二十座辅助平台一起坠落的时候，只有那棵「树」升了上去；这一次，园区自己决定航向。"
 CLB_rhine_tree_complete_desc: "莱茵「树」的完全形态可以汇集哥伦比亚全境的能量与信息，再集中处理——它既是能量井，也是双向运行的服务器。娜斯提把抹除预载数据的那一晚留给了自己，让母亲成为「树」的第一位住客。"
 CLB_stargate_project_desc: "星门计划拼上了最后一块图纸。因非冰原最深处那块圆形巨构的碎片，孤星般的灯火，和一句写在报告页脚的判断——上个时代的人称它为星门，现在，它是我们的。"
 CLB_rhine_army_expansion_desc: "莱茵国防军扩编到集团军规模。征兵海报上的标语是「守护哥伦比亚的下一步」，配图是一座正在起飞的环形平台。"
 CLB_power_armor_legion_desc: "动力甲军团成建制列装。它的战术价值不在装甲厚度，而在于任何能跑动的士兵，训练两周就能开——军队的门槛第一次被技术抹平了。"
 CLB_airship_fleet_expansion_desc: "浮空舰队扩编后，西泰拉防空司令部的雷达站第一次覆盖了整条边境。娜斯提说天空是血管，军方把这句话理解成了航道图。"
 CLB_focusing_generator_mass_desc: "聚焦发生器进入量产。军方手册上它是超级武器；在莱茵的账本上，它是万星园推进装置的一条产线。"
 CLB_mobile_cavalry_elite_desc: "机动骑兵被编成精锐。塞雷娅亲自带过第一批选拔——她只挑两种人：说得出自己为什么来的，和说不出但做得到的。"
 CLB_border_great_wall_desc: "边防长城沿着开拓区的边缘铺开，城防炮系统与索道站点共用同一套供电。它对付的与其说是外敌，不如说是荒野本身的秩序。"
 CLB_intervene_bolivar_desc: "玻利瓦尔的内战是国防部最不愿提的旧账。莱茵国防军的做法不同：不派顾问团，直接接管航道与能源节点——干预的账目从军费变成了投资。"
 CLB_intervene_sargon_desc: "萨尔贡的资源是下一块拼图。保存者当年留下的那句预言写得很直白——他们会增大食欲，把虚伪的刀叉伸向玻利瓦尔、萨米与萨尔贡。"
 CLB_arts_breakthrough_desc: "源石技艺研究跨过了实用化的门槛。多萝西用沙粒、塞雷娅用钙质、缪尔赛思用水分子——三份毫无共通之处的报告，在同一期期刊上发表了。"
 CLB_neurotransmitter_military_desc: "递质军用化之后，动力甲终于可以远程操控，而操控者不必在现场。斐尔迪南当年向军方要的那件东西——能够跨越距离、精准把武器送到任意地点的技术——在这里合上了最后一环。"
 CLB_sarcophagus_analysis_desc: "石棺解析让莱茵第一次读懂了那种不依赖源石供能的装置。保存者说得客气：源石曾是无数答案中的一种；而石棺意味着，哥伦比亚找到了另一种。"
 CLB_stargate_research_desc: "星门研究把因非冰原的碎片、万星园的推进数据和无尽冰原尽头的那扇门写在了一份文件里。文件的第一句是克丽斯腾的原话——我不相信人类永远无法穿透星荚。"
 CLB_floating_tech_breakthrough_desc: "浮空科技突破后，娜斯提终于能回答那个她一直在问自己的问题——从来没人说过移动城市只能在地上匍匐。"
 CLB_power_armor_iteration_desc: "动力甲迭代到第三代，操作门槛降到了训练一周。军方发现这意味着一个班可以顶过去一个连，而莱茵发现这意味着一个连的采购单可以卖一个师的价钱。"
 CLB_maylander_agreement_desc: "梅兰德协议把情报交换写成了固定日程：每周三，两份档案，一次会面。锡人坚持要一个纸质签名，理由是——电子件改起来太容易了。"
 CLB_rhodes_island_cooperation_desc: "罗德岛合作是一份很难解释的协议。赫默、梅尔、塞雷娅都曾在两家之间来回；凯尔希答应销毁情报，交换条件是莱茵生命承认某些实验从不存在。"
 CLB_victoria_revenge_desc: "维多利亚的碎片大厦是哥伦比亚研发超级武器最直接的诱因。锡人提醒过一句：如果没有对自由的狂热，就不会有八十多年前开拓区的反抗，哥伦比亚至今仍会被维多利亚人踩在靴子底下。"
 CLB_leithanien_tech_exchange_desc: "莱塔尼亚的技术交流从一封女皇亲笔来函开始。换回来的东西里包括金律法卫用于军事训练的秘密装置——它在海关的报关单上写的是教学器材。"
 CLB_laterano_sky_summit_desc: "拉特兰的天空峰会筹备了半个世纪。莱茵生命收到请柬时，万星园的升空记录已经摆在各国代表的桌上了——那场撕开天空的事，从此不只是哥伦比亚的内政。"
 CLB_aegir_contact_desc: "阿戈尔的接触从一份无法破译的回函开始。大静谧之后他们不再沉默，而莱茵生命是哥伦比亚最先把回声编成数据的那一方。"
 CLB_beast_lord_diplomacy_desc: "兽主外交没有使团、没有条约、没有翻译。莱茵生命只是按时把奇观造好，把坠落安排得好看一点，然后等——等来的东西通常比谈判结果更实在。"
 CLB_sky_convention_desc: "天空公约把哥伦比亚的浮空权写成了国际条目。副总统在签署仪式上引用了他自己那句话——如果孕育哥伦比亚下个时代的土壤就是天空，那么它未必容不下一棵飞天的树。"
 CLB_stargate_open_desc: "星门开启的那一刻，因非冰原的风向变了。马里亚姆站在圆形巨构前看着它缓缓分开，报告里只写了一句：上个时代的人称之为星门。现在，它是我们的。"

