# ============ 第一次内部推选（1094 大选） ============
 election_clb.1.rhine: "十科合议厅内定人选：塞雷娅"
 inauguration_clb.29.t: "就职日 · 十科合议厅"
 inauguration_clb.29.d: "选票照旧点完，选举人票一张不少地记进公报——只是公报上那个名字，在投票日之前就已经由特里蒙写定。莱茵生命第一次越过联合议会，把自己的人推上了总统席位。\n\n塞雷娅没有准备长篇演说。她只留下一句话就转身走进办公室：「真正的先驱者，应当为全人类开道，而不是率先跳进深渊，有去无回。」台下没有人鼓掌——十科的人听得懂这句话的另一半意思：从今往后，哥伦比亚不再问路，只问结果。"
 inauguration_clb.29.a: "塞雷娅，哥伦比亚联邦总统。"
