# ══════════════════ 【企业国家！】共享国策集 本地化 ║ 【由 docs/gen_rhl_corp.cjs 生成】══════════════════
# 本树只写简体中文（与 ARF_RHL_TD / ARF_RHL_WT / ARF_RHL_CO 同一口径）。

# ── 闸门 ──
 RHL_cp_tt_gate: "需要「莱茵生命企业国」已经建立：吞并哥伦比亚联邦，\n企业国建立超事件播过之后，这三条线才会亮起。"

# ── undefined ──
 RHL_cp_root: "我们才是哥伦比亚！"
 RHL_cp_root_desc: "联邦的退位公报还在广播里念，十科已经把自己的印章盖上了海关、户籍与货币。宣称不是请求：这片土地从来没有这么像一个国家，也从来没有这么像一家公司。\n\n「我们不是继承了哥伦比亚。我们就是哥伦比亚——只是终于有人开始认真经营它。」"
 RHL_cp_root_tt: "三条支线在此打开\n立刻获得 §G120§! 政治点数、§G10%§! 稳定"
# ── 行政体系重建 ──
 RHL_cp_a1: "临时董事会改组"
 RHL_cp_a1_desc: "联邦解散后的第一个早晨，董事会的议程表被划掉了「季度报表」四个字，写上了「法令」。十科主任在同一间会议室里既是股东又是部长，而会议纪要开始有了法律效力。\n\n「我们还在开会。只是从现在起，没有人可以中途离席。」"
 RHL_cp_a1_tt: "挂载民族精神「公司即政府」\n每日政治点数获得速率 §G+10%§!\n立刻获得 §G80§! 政治点数"
 RHL_cp_a2: "特里蒙市政并入"
 RHL_cp_a2_desc: "特里蒙市政厅搬进了莱茵生命南塔的三层。市长的印章没有被没收，只是要求在下班前交上来复印一份。从此这座城市的下水道、路灯与户籍，归同一家公司的同一个部门管。\n\n「欢迎来到特里蒙。本市由莱茵生命赞助。」"
 RHL_cp_a2_tt: "稳定 §G+10%§!（精神累计）\n首都基础设施 §G+2§! 级\n立刻获得 §G10%§! 稳定"
 RHL_cp_a3: "十科职权法定化"
 RHL_cp_a3_desc: "十个科室的管辖范围第一次被写进条文：谁管源石、谁管人事、谁有权在夜里放行一辆出城的货车。条文很长，但每一条都查得到落款，而落款只有一个人的名字。\n\n「权力总算有了边界。边界是我们自己画的。」"
 RHL_cp_a3_tt: "每日政治点数获得速率 §G+10%§!\n立刻获得 §G60§! 政治点数"
 RHL_cp_a4: "员工档案总署"
 RHL_cp_a4_desc: "过去只有为莱茵生命工作的人才有一份档案，现在每一个生活在莱茵生命土地上的人都有。户籍与工牌合并成同一种卡片，卡上的编号决定你能坐哪一路车、挂哪一科门诊。\n\n「没有编号的人，不算住在这里。」"
 RHL_cp_a4_tt: "稳定 §G+10%§!（精神累计）\n获得 §G4000§! 人力"
 RHL_cp_a5: "合规与审计总署"
 RHL_cp_a5_desc: "审计组进驻九个科室，查了三个月，最后交上来的报告只有一份，标题叫《关于合规的合规性说明》。所有人都清楚它在说什么，所以所有人都签了字。\n\n「我们不是要查出谁在贪。我们是要让贪变得可以被查。」"
 RHL_cp_a5_tt: "每日政治点数获得速率 §G+10%§!\n立刻获得 §G120§! 政治点数"
 RHL_cp_a6: "企业国家章程大纲"
 RHL_cp_a6_desc: "第一部成文的治国文件。扉页上没有写「人民」，写的是「全体在册人员」。它规定合议厅为最高权力机关，规定总辖由推选产生，也规定每一条权利后面都跟着一句「以在岗为限」。\n\n有人说这是把公司规章换了个封面。起草的人听到了，回答说：那也得看谁敢照着它起诉我们。\n\n「从此我们不再只是一家公司。这是一件需要有人反复提醒自己的事。」"
 RHL_cp_a6_tt: "稳定 §G+10%§!（精神累计）\n立刻获得 §G15%§! 稳定、§G10%§! 战争支持度"
# ── 经济体系重建 ──
 RHL_cp_e1: "天空贷债务重整"
 RHL_cp_e1_desc: "天空贷到期那天，账单确实比天空先落了地。债务被重新摊成十六年，利息改与产能挂钩，债权人从银行变成了员工自己。没有人真正还清了什么，但城市第二天照常开了门。\n\n「坏账也是一种资产——只要它足够大。」"
 RHL_cp_e1_tt: "挂载民族精神「企业经济」\n民用工厂产能 §G+10%§!\n首都民用工厂 §G+2§! 座"
 RHL_cp_e2: "供应链并轨"
 RHL_cp_e2_desc: "原先给十条产线供货的十七家物流商，现在只给一个部门供货。调度表从四份并成一份，仓库钥匙从二十七把收成一束，运费账单的小数点后面少了一位。\n\n「以前我们比价。现在由我们直接指定。」"
 RHL_cp_e2_tt: "建筑建造速度 §G+10%§!\n一处控制州获得 §G2§! 座民用工厂"
 RHL_cp_e3: "标准工时与薪酬表"
 RHL_cp_e3_desc: "全境的工时被统一成一张表：十五个等级、三套加班口径，以及一个没有人解释的备注栏。工会没有反对，因为表格第一行写的是「莱茵生命员工适用」，而其余的人正为了挤进这一行排队。\n\n「同工同酬。前提是你得先同工。」"
 RHL_cp_e3_tt: "民用工厂产能 §G+10%§!\n立刻获得 §G5%§! 稳定、§G2500§! 人力"
 RHL_cp_e4: "特里蒙工业走廊"
 RHL_cp_e4_desc: "从南塔到旧港区，三十公里的地带被重新划成厂区。填海的驳船还没有撤走，打桩机已经开了上去。夜里从螺旋桨天堂往下看，这条亮着的缝像一道刚刚愈合的疤。\n\n「我们要的不是一座工厂。是一条不会断的线。」"
 RHL_cp_e4_tt: "建筑建造速度 §G+10%§!\n首都军用工厂 §G+2§! 座"
 RHL_cp_e5: "股东配发与分红"
 RHL_cp_e5_desc: "每一个在册家庭分到二十股。股票不能卖、不能抵押、不能带走，但可以投票——投的是十科主任的连任。第一次分红到账那天，很多人去查了自己的账户，然后回去上夜班。\n\n「他们终于开始关心这家公司了。这是设计出来的效果。」"
 RHL_cp_e5_tt: "民用工厂产能 §G+10%§!\n立刻获得 §G5%§! 战争支持度、§G3500§! 人力"
 RHL_cp_e6: "企业税制统一"
 RHL_cp_e6_desc: "十七种税、九种附加与三种「自愿捐助」并成一条：按产出计，按岗位扣，年终一次清算。收税的人从此不再敲门——因为工资本就是从他们手里发出来的。\n\n「我们省下了一整个税务署。顺便也省下了反抗它的理由。」"
 RHL_cp_e6_tt: "建筑建造速度 §G+10%§!\n立刻获得 §G400§! 燃料、§G100§! 政治点数"
# ── 科教文化体系重建 ──
 RHL_cp_s1: "十科研究所转制"
 RHL_cp_s1_desc: "研究所不再需要对董事会负责，它们换上了一个更长的名字和一份更短的预算表。保密等级从「商业机密」改成了「国家机密」——纸还是那种纸，只是盖的章换了。\n\n「同样的实验室，换了个体面点的借口。」"
 RHL_cp_s1_tt: "挂载民族精神「科教立国」\n科研速度 §G+10%§!\n立刻获得 §G40§! 政治点数"
 RHL_cp_s2: "义务教育令"
 RHL_cp_s2_desc: "十二岁以前不上工——这条法令的全部内容就是这一句。为此全国新建了四百间教室，而四百间教室只需要四百个不打算做实验的老师。第一批课本的封面印着莱茵生命的标志，第二页印版权，第三页印「本节不考」。\n\n「先教会他们读字，再决定让他们读什么。」"
 RHL_cp_s2_tt: "战争支持度 §G+10%§!\n立刻获得 §G5%§! 稳定"
 RHL_cp_s3: "源石工学与乙太教席"
 RHL_cp_s3_desc: "两所学院挂牌那天没有人来剪彩，因为到场的十二个人里有八个正在做实验。聘任书上写着「以课题为单位」，而课题的评审人、资助方与受益方是同一家公司。\n\n「我们不培养兴趣。我们培养能签验收单的人。」"
 RHL_cp_s3_tt: "科研速度 §G+10%§!\n立刻获得 §G60§! 政治点数"
 RHL_cp_s4: "企业日报与文化网"
 RHL_cp_s4_desc: "三份企业内刊并成一份日报，同时供上了广播、公共屏幕与员工终端。版面上半是产能，下半是剧院。影评开始出现在财报旁边，读的人分不清哪一半是广告。\n\n「我们报道文化。我们也报道你为什么需要这点文化。」"
 RHL_cp_s4_tt: "战争支持度 §G+10%§!\n立刻获得 §G10%§! 稳定"
 RHL_cp_s5: "塞勒涅学院扩编"
 RHL_cp_s5_desc: "新校舍盖在孤儿院的原址上，收生条件只有一条：父母栏空白。院方保留了原来的课程表，只是在最下面添了一门不对外公开的歌剧课。\n\n「我们这些无处可去的孤儿，都能成为哥伦比亚的孩子。」——这句话被刻在门楣上，据说是提出者本人要求保留原文的。"
 RHL_cp_s5_tt: "科研速度 §G+10%§!\n获得 §G5000§! 人力"
 RHL_cp_s6: "星荚观测台与科学院"
 RHL_cp_s6_desc: "全国最高的那栋建筑，用途栏写的是「气象」。它每天记录同一件事：头顶那道看不见的墙，厚度有没有变化。科学院的其他人不知道这个数字最终被谁看，观测台的人也不知道除了自己还有谁在算。\n\n「有人曾经把它撕开过一道口子。我们的工作是量出它多久愈合。」"
 RHL_cp_s6_tt: "战争支持度 §G+10%§!\n立刻获得 §G150§! 政治点数、§G10%§! 战争支持度"
# ── undefined ──
 RHL_cp_final: "莱茵生命企业国"
 RHL_cp_final_desc: "章程、税制与学院都齐了，剩下的只是把名字写进国书。公报里国名从「哥伦比亚联邦共和国」改成「莱茵生命企业国」——没有人解释，也没有人问。护照在当天下午重印了一版。\n\n有人提醒起草者：国家还是那个国家，公章上换了一行字而已。起草者回答，一行字能让所有人重新学会怎么自我介绍，那就不是小事。\n\n「一个国家长成了公司的样子，而它的人第一次觉得，这样也挺好的。」"
 RHL_cp_final_tt: "更名为「莱茵生命企业国」\n挂载民族精神「莱茵生命企业国」（四项各 +10%）\n立刻获得 §G200§! 政治点数、§G15%§! 稳定、§G15%§! 战争支持度"

# ── 民族精神（显示名取的就是这些键；键名 = dynamic_modifier 的块 id） ──
 RHL_cp_dyn_admin: "公司即政府"
 RHL_cp_dyn_admin_desc: "董事会的议事规则第一次被套用在一座城市身上：提案、附议、表决、执行，没有一项需要选民参与。运转得意外地好——好到没有人愿意去追问它为什么能这么好。\n\n每天多出来的那点政治点数，是从上一道命令还没有传达完就开始计的。"
 RHL_cp_dyn_econ: "企业经济"
 RHL_cp_dyn_econ_desc: "国家的账本并进了公司的账本，从此没有一笔开支需要向两个地方解释。工厂的产能、工地的进度、仓库的周转，全部落在同一张表上，而那张表每天凌晨自动重算。\n\n「唯一没有被量化的，是表上那些人到底愿不愿意。」"
 RHL_cp_dyn_sci: "科教立国"
 RHL_cp_dyn_sci_desc: "研究所不再向董事会解释为什么要花钱，它们改为向国家解释为什么要花钱——这两句话的区别，比听起来要小。学校、报纸与观测台被编进了同一份五年规划。\n\n一座企业国家能给出的最有说服力的承诺，是它的孩子将来会去做什么。"

# ── 终幕格的固定精神（idea） ──
 RHL_cp_idea_corporate_state: "莱茵生命企业国"
 RHL_cp_idea_corporate_state_desc: "国书、税表、章程与课本终于指向同一个名字。它不解释自己从哪里来，只规定从这里往后的每一件事怎么记账、怎么审批、怎么验收。\n\n外界把这叫做企业国家。里面的人把这叫做正常上班。"

