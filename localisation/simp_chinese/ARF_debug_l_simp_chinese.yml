 Emergency_meeting: "紧急会议国策树"
 REU_debug_show_dem_reform_tree: "REU调试：显示整个民主改革国策树（前半段推进至分支点，三条结局分支全解锁）"
 REU_debug_show_dem_reform_tree_desc: "（调试用）置位「东达利亚（东乌萨斯）统一」与「大字报已送达」两个前置旗标，并直接完成「理想的拂晓」，并直接完成民主改革前半段（基层民主改革运动 → 折衷大师 → 民主的原则 / 组织的原则 → 更重要的事），使「一切荣誉归于我们／你」变为可选；\n\n同时一次性置位紧急手段、稍有进步、大获成功三条结局分支的全部六个旗标，让三条分支在国策树上同时显示出来。本决议只负责解锁与显示，不会替你推进任何一条结局。"
 REU_debug_unlock_emergency_branch: "REU调试：解锁并推进「紧急手段」分支至「革命的救主」"
 REU_debug_unlock_emergency_branch_desc: "（调试用）先清掉稍有进步、大获成功两条分支的旗标，再置位「民主改革失败」与「失败路线」旗标，并完成民主改革前半段；随后直接完成「紧急手段」「军队支持左派」「塔露拉个人崇拜」。\n\n完成后「革命的救主」即变为可选，可手动点选查看结局。"
 REU_debug_unlock_slight_progress_branch: "REU调试：解锁并推进「稍有进步」分支至「平民革命」"
 REU_debug_unlock_slight_progress_branch_desc: "（调试用）先清掉紧急手段、大获成功两条分支的旗标，再置位「民主改革成功」与「成功路线」旗标，并完成民主改革前半段；随后直接完成「稍有进步」「社会主义教育运动」「参与政治」。\n\n完成后「平民革命」即变为可选，可手动点选查看结局。"
 REU_debug_unlock_great_success_branch: "REU调试：解锁并推进「大获成功」分支至「乌萨斯的黎明」"
 REU_debug_unlock_great_success_branch_desc: "（调试用）先清掉紧急手段、稍有进步两条分支的旗标，再置位「民主改革大获成功」与「大获成功路线」旗标，并完成民主改革前半段；随后直接完成「大获成功」「人民民主」「民主集中制」。\n\n完成后「乌萨斯的黎明」即变为可选，可手动点选查看结局。"
 REU_debug_reset_dem_reform: "REU调试：复位民主改革旗标（重新隐藏三条结局分支）"
 REU_debug_reset_dem_reform_desc: "（调试用）清除民主改革的三组结局旗标：失败、稍有进步、大获成功，以及它们各自的路线旗标，让三条结局分支重新隐藏回国策树。\n\n注意：前半段已经点掉的国策不会被撤销，「东达利亚统一」与「大字报已送达」两个前置旗标也会保留。"
