#人物
 TNT_Ali_Sinsigar: "阿里·辛锡伽"
 TNT_Ali_Sinsigar_desc: "在哈拉帕收服南方各邦后，卡什密尔王公阿里·辛锡伽便成为了哈拉帕统一大业的最后一块绊脚石。意识到危险的王公赶快向炎国寻求庇护，刚平定山海众叛乱的炎国中央以为卡什密尔会像南方诸邦一样倒在哈拉帕的大军之下，因而王公的求助几乎石沉大海。然而，时任幽州都护张守珪绕过炎国兵部，偷偷派出了一支精兵，同意了王公守备卡什密尔的边境的请求。哈拉帕因此出现战略误判，搁置了征服卡什密尔的计划。而后知后觉的大炎朝廷只好把生米煮成熟饭，宣布保障卡什密尔邦的独立，并且在之后扶持阿里·辛锡伽登基为天竺国王，宣称天竺国的正统地位。此举激怒了哈拉帕，也让两国的关系彻底跌入谷底。而故事一开始的主角，卡什密尔王公、天竺王国国王、阿里·辛锡伽，到最后发现自己只是各方势力之间的提线木偶。幸运的是，他倒是很满足这样的状况，从他依旧穷奢极欲的生活中就能看得出来。"
 TNT_Aya_Freedo: "阿雅·弗里多"
 TNT_Viller_Prakamba: "维莱尔·普拉坎巴"

#国家精神
 TNT_Tintu_defensive_line: "天竺防线"
 TNT_Tintu_defensive_line_desc: "当炎国对天竺国的保护已成定局后，幽州都护府选择将炎国的边境防线延申至天竺国境内，在军事意义上，天竺国的山脉更有利于阻挡可能的哈拉帕入侵，而在政治意义上，无论是对于炎国朝廷还是幽州都护，此举都有利于提高自己对于这个名义上独立的王国的控制力。"
 TNT_Messy_politics: "混乱的政治"
 TNT_Messy_politics_desc: "作为大炎和哈拉帕的核心利益所在，两国都积极地“参与”到天竺国的政治中来。出于对辛锡伽王家忠诚度的怀疑，炎国在王家之外还扶持了阿雅·弗里多的宗教联盟，试图通过笼络宗教势力加强对天竺国的控制。而哈拉帕的行动则更加直接，一支由帝国国库直接供养的反抗军在天竺国与哈拉帕的边境活动，而他们的领袖，据说是一位因为虐待俘虏和屠杀平民而被踢出哈拉帕军队的军官。"