YAN_civ_reorder_court:0 "重整朝纲"
YAN_civ_reorder_court_desc:0 "大厦既见裂痕，唯有查漏补缺、更张旧制。朝纲二字，拆开看就六个字：谁做事，谁担责。老臣不求诸君个个贤良，只求该递的折子按时递，该认的错痛快认。至于别的，来日方长；后手，老臣已经留了。\n——太傅，在朝房批折子时发言"
YAN_civ_reorder_court_tt:0 "§Y获得民族精神【岁陵之乱的余波】：§!"
YAN_civ_reorder_court_note_tt:0 "【界园模块未实装】"
YAN_civ_xi_drowsy:0 "夕瓜睡眼惺忪..."
YAN_civ_xi_drowsy_desc:0 "吵什么，我困。你说朝政？朝政与我何干，我不过是个被困在宫里的画家。要我点评？行，秩序如画，留白处见功夫；可你们把留白都填满了，还嫌不够，又往上涂。最是凹糟。别喊我。\n——夕，在画室泼墨时发言"
YAN_civ_xi_drowsy_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_xi_drowsy_note_tt:0 "【界园模块未实装】"
YAN_civ_hero_father:0 "老子英雄儿好汉..."
 YAN_civ_hero_father_desc:0 "1"
YAN_civ_hero_father_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_hero_father_note_tt:0 "【界园模块未实装】"
YAN_civ_ling_hungover:0 "令姐宿醉未醒..."
YAN_civ_ling_hungover_desc:0 "唔，几时了？哦，问我政见。我醉着说，你们清醒着听：人间已醉万年，还不许我大梦一场？朝堂上的事，翻来覆去不过兴亡二字，可兴亡之外还有山川风月、杯中物。管它作甚。\n——令，在檐下饮酒时发言"
YAN_civ_ling_hungover_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_ling_hungover_note_tt:0 "【界园模块未实装】"
YAN_civ_tianshi_junior:0 "天师府里小资历"
YAN_civ_tianshi_junior_desc:0 "小资历怎么了？我那帮徒子徒孙，一个个眼高手低，炼丹炼炸了炉，还问我为什么不怕炸。哼，天师府的资历是烧出来的、劈出来的，熬年头的可不算。谁有本事谁上，没本事的就去给炉子添火。\n——老天师，在天师府炼丹时发言"
YAN_civ_tianshi_junior_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_tianshi_junior_note_tt:0 "【界园模块未实装】"
YAN_civ_rule_by_inaction:0 "垂拱而治..."
YAN_civ_rule_by_inaction_desc:0 "垂拱而治四个字，多少人只读懂一半。垂拱，是把对的人搁在对的位置上。陛下若事事亲为，底下人便事事推诿；陛下只看三步，臣下便要走出五步。治道如弈，不在落子多少，在每子落在何处。\n——太傅，在朝房批折子时发言"
YAN_civ_rule_by_inaction_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_sycophants:0 "邪佞在何处"
YAN_civ_sycophants_desc:0 "邪佞在何处？不在人心里，在卷宗里。我刚当秉烛人时，三个月读完了司岁台的全部卷宗，谁的账目不清、履历有缝、门生故吏一夜升官，一笔一笔都在上头。查，一个一个查。\n——左乐，在司岁台抄卷宗时发言"
YAN_civ_sycophants_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_collect_ballads:0 "采诗观风"
YAN_civ_collect_ballads_desc:0 "采诗观风，这差事好。诗从民间来，最真，百姓不打诳语，把苦乐都唱在歌里。我年轻时爱写气象万千的句子，如今倒更爱听田埂上的调子。你们也去听听，风里有什么，比折子里写得清楚。\n——令，在檐下饮酒时发言"
YAN_civ_collect_ballads_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_map_sketch:0 "舆图写生"
YAN_civ_map_sketch_desc:0 "舆图？我当山水画来画便是。山川走不完、看不透，可落在纸上，便能收进袖中。你们画舆图只认尺寸方位，我画的还要认气韵，哪里是活水，哪里是死地，画里瞒不住人。要图准，先学会看。\n——夕，在画室泼墨时发言"
YAN_civ_map_sketch_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_map_sketch_note_tt:0 "【界园模块未实装】"
YAN_civ_aesthetic_forge:0 "大炼审美"
YAN_civ_aesthetic_forge_desc:0 "我讨厌「品味」这词，开口就把人堵在门外，谁给他们的自信？只要尽兴，就是得意；想要进取，就不准有门户之见。你们要大炼审美，好，把门槛拆了，让贩夫走卒也能看画、论画。天上双月，可曾自私自利过？\n——夕，在画室泼墨时发言"
YAN_civ_aesthetic_forge_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_aesthetic_forge_note_tt:0 "【界园模块未实装】"
YAN_civ_literary_mastery:0 "文墨通彻"
YAN_civ_literary_mastery_desc:0 "文墨通彻，我教学生时总说，先别管字漂不漂亮。落笔时心里要有秤，这句话该不该写，写了要担什么干系。竹简能存几十年，纸张能存数百年，可真正让文字不朽的，是记住它的人。我修史多年，只认一个真字。\n——颉，在灯下修史时发言"
YAN_civ_literary_mastery_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_literary_mastery_note_tt:0 "【界园模块未实装】"
YAN_civ_pacification_rite:0 "主持镇抚仪式"
YAN_civ_pacification_rite_desc:0 "镇抚仪式？我主持过几百场，翻来覆去就四个字：镇得住、抚得下。岁兽也好，人心也罢，压得太狠要反弹，放得太松要翻天。我这把老骨头别的本事没有，火候拿捏还行。放心，烧不到你们。\n——老天师，在天师府炼丹时发言"
YAN_civ_pacification_rite_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_pacification_rite_note_tt:0 "【界园模块未实装】"
YAN_civ_suishu_bureau:0 "整顿司岁台"
YAN_civ_suishu_bureau_desc:0 "先从卷宗起。三个月读完所有卷宗，是秉烛人上任第一课，如今倒要回头重查一遍。下官只提一条：账目要实，行程要明，烛火照不到的地方，就是出事的地方。此事我来办，办不好，你们拿我问话。\n——左乐，在司岁台抄卷宗时发言"
YAN_civ_suishu_bureau_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_suishu_bureau_note_tt:0 "【界园模块未实装】"
YAN_civ_palace_thunder:0 "宫闱卷滚雷"
YAN_civ_palace_thunder_desc:0 "宫闱之中滚过雷声，那是人心积了怨气。雷法的本质，是我的内在与大地合为一体；可若宫里的人心里都不干净，天雷下来，先劈谁还说不准。查案讲究证据，我先看看这雷，是从哪片云里落下的。\n——惊蛰，在大理寺翻卷宗时发言"
YAN_civ_palace_thunder_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_inspect_guard:0 "巡视禁军营"
YAN_civ_inspect_guard_desc:0 "禁军那帮小子，老夫不亲自看一眼，心里不踏实。营房齐不齐、刀枪锈没锈、夜里口令换没换，都是小事，可小事堆起来就是大事。老夫带兵只认两个字：令行。做不到的趁早回家。\n——太尉，在军帐里批军报时发言"
YAN_civ_inspect_guard_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_inspect_guard_note_tt:0 "【界园模块未实装】"
YAN_civ_officials_thunder:0 "僚属闻惊霆"
YAN_civ_officials_thunder_desc:0 "僚属们被雷声吓着了？不必惊慌，那是我在试手。不过嘛，你们做事若规矩，何惧雷霆？身在其位，当谋其政。文件按事项分类、轻重缓急排列。不不，那是你们的工作。\n——惊蛰，在大理寺翻卷宗时发言"
YAN_civ_officials_thunder_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_free_roaming:0 "逍遥游"
YAN_civ_free_roaming_desc:0 "我身既是逍遥身，谁说用尾巴写诗就不成？逍遥游三个字，我不跟人争辩，只说自己的解法：心里没有挂碍。你们在朝堂上把自己捆得太紧，绳子松一松，路反而宽。不写了不写了，先喝一杯。\n——令，在檐下饮酒时发言"
YAN_civ_free_roaming_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_great_dream:0 "大梦谁先觉"
YAN_civ_great_dream_desc:0 "大梦谁先觉？平生我自知。可这一梦八千年，醒与不醒，都由不得我。你们问我治国的念头，我在梦里见过太多兴亡，唯一记得的教训是：梦会磨损，人不会。只要梦里还有我们十二个，就还没有输。\n——令，在檐下饮酒时发言"
YAN_civ_great_dream_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_thunder_quells:0 "雷霆镇乾坤"
YAN_civ_thunder_quells_desc:0 "五雷震邪佞，破！收。方才那句是术法要诀，诸位听听便好。雷霆镇乾坤，镇的是乾坤里的脏东西。有罪无赦，五雷轰顶，这话我说得出口，也做得到。你们站得直，雷就落不到头上。\n——惊蛰，在大理寺翻卷宗时发言"
YAN_civ_thunder_quells_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_self_knowing:0 "平生我自知"
YAN_civ_self_knowing_desc:0 "平生我自知，这五个字我算过，值七目半。人最难的是把自己也算了进去。我这一生下过的棋，赢的输的都记着，账面上看，输多赢少。可知道了自己几斤几两，落子才算本手。\n——望，在棋盘前落子时发言"
YAN_civ_self_knowing_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_self_knowing_note_tt:0 "【界园模块未实装】"
YAN_civ_bless_yan:0 "佑序有炎"
YAN_civ_bless_yan_desc:0 "佑序有炎，大狩维天，这句话司岁台人人会背，可背得出来，还要做得到。佑是护佑，序是秩序，护的是百姓的秩序，衙门的脸面要往后放。秉烛人随身带着册子，记的就是谁在佑序、谁在坏序。\n——左乐，在司岁台抄卷宗时发言"
YAN_civ_bless_yan_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_bless_yan_note_tt:0 "【界园模块未实装】"
YAN_civ_heaven_judgment:0 "恭听天裁"
 YAN_civ_heaven_judgment_desc:0 "2"
YAN_civ_heaven_judgment_tt:0 "§Y民族精神【岁陵之乱的余波】改名为【岁岁今朝】§!"
YAN_civ_hmph:0 "哼！"
 YAN_civ_hmph_desc:0 "1"
YAN_civ_hmph_tt:0 "§Y获得民族精神【当变则变】：§!"
YAN_civ_hmph_note_tt:0 "解锁决议组§Y【行政重组】§!：①忠于君？忠于国？\n§8效果：§Y【当变则变】§!追加 —— 政治点数获取 +10%，内阁任命花费 +50%§!"
YAN_civ_blood_burden:0 "血脉重担"
 YAN_civ_blood_burden_desc:0 "2"
YAN_civ_blood_burden_note_tt:0 "解锁决议组§Y【行政重组】§!：②大炎根基在何处？\n§8效果：§Y【当变则变】§!追加 —— 政治点数获取 +10%，稳定度 -20%§!"
YAN_civ_light_breaks_clouds:0 "如视天光破云"
 YAN_civ_light_breaks_clouds_desc:0 "3"
YAN_civ_light_breaks_clouds_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_decisive:0 "当断则断！"
 YAN_civ_decisive_desc:0 "4"
YAN_civ_decisive_tt:0 "§Y民族精神【岁陵之乱的余波】追加效果：§!"
YAN_civ_suixiang_cabinet:0 "岁相临阁"
 YAN_civ_suixiang_cabinet_desc:0 "最喜欢的一集"
YAN_civ_suixiang_cabinet_note_tt:0 "解锁决议§Y【皇帝轮流做，今年到我家！】§!：可令十二岁片出任国家领导人"
YAN_civ_upright_court:0 "众正盈朝"
 YAN_civ_upright_court_desc:0 "3"
