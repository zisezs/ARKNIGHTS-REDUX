 special_unit_token_1: "特殊兵种招募令"
 arf_special_unit_token_tech: "特殊兵种招募令"
 arf_special_unit_token_tech_desc: "一张盖着军务部门印信的调令。它本身不装填任何弹药，却能把那些平时只向家族、教团或某一个人效忠的部队，名正言顺地写进作战序列。"

 # ===== 通用决议 =====
 ARF_special_units_category: "特殊兵种"
 ARF_recruit_special_unit_decision: "征调特殊兵种招募令"
 ARF_recruit_special_unit_decision_desc: "有些部队不会出现在任何一本编制表上：他们的番号由家训写成，由祷词写成，或者只由某个人的名字写成。要把他们成建制地送上战场，军务部门的印章只是形式，真正需要点头的，是那些握着他们名字的人。\n\n我们一次调出五份招募令，剩下的，看谁愿意接。"

