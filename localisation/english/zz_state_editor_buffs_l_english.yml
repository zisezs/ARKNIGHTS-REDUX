l_english:
 se_buff_longmen: "龙门"
 se_buff_longmen_desc: "黄沙尽处起层楼，上国边门锁暮秋。\n灯火三重连海市，货泉万贯走商舟。\n近卫旌旗明夜月，下城风雨暗潜流。\n安魂节里人如织，谁问贫街冻骨愁。\n\n\n\n\n\n£se_buff_longmen_desc\n\n\n"
 se_buff_yumen: "玉门"
 se_buff_yumen_desc: "§R铁城千载镇穷边，沙渠吞吐走风烟。\n屏风四壁当风立，烽火三更照雪眠。\n铸剑坊前逢旧客，擂台榜上问新年。\n望烽鼓罢人回首，一寸山河一寸天。§!\n\n\n\n\n\n£se_buff_yumen_desc\n\n\n⚪"
 se_buff_cr4o53z8fa: "尚蜀"
 se_buff_cr4o53z8fa_desc: "§R城如星斗散峰青，索道横空接杳冥。\n十里茶烟浮客梦，一樽酒盏动官星。\n镖旗旧字风犹在，石径新苔雨未停。\n莫问山深何处是，蜀音软软最堪听。§!\n\n\n\n\n\n£se_buff_cr4o53z8fa_desc"
 se_buff_s3grxa1aj1: "勾吴"
 se_buff_s3grxa1aj1_desc: "勾吴城下水云乡，花茶一盏客中尝。\n武馆门前旗半卷，药商账上价三张。\n灰齐山远藏仙画，廉氏门孤守旧枪。\n莫道江湖无正气，扇底风雷不肯藏\n\n\n\n\n\n£se_buff_s3grxa1aj1_desc\n\n\n"
 se_buff_baizao: "百灶"
 se_buff_baizao_desc: "九重宫阙接云烟，五十三载筑城全。\n照拂人间千灶火，深藏地下万年眠。\n学宫墙外书声远，禁苑灯前宴席鲜。\n莫道京城无雪色，一城烟火即春天。\n\n\n\n\n\n£se_buff_baizao_desc\n\n\n"
 se_buff_c367503tx9: "丹燕"
 se_buff_c367503tx9_desc: "丹燕城头雪压关，驰道千军凿冻山。\n一地块开生万命，三更火照死生间。\n梨香入药医寒疾，牍字争名问旧班。\n莫道功成碑上少，北风犹哭未归颜。\n\n\n\n\n\n£se_buff_c367503tx9_desc\n\n\n"
 se_buff_ysljg65not: "大荒"
 se_buff_ysljg65not_desc: "十六连城接大荒，稻云万顷作天仓。\n天师布种分寒暑，职农扶犁课雨旸。\n社鼓声声祈岁穰，神灯处处照田庄。\n天机阁外风沙远，十二楼头日月长。\n\n\n\n\n\n£se_buff_ysljg65not_desc\n\n\n"
 se_buff_kf91cfll2k: "姜齐"
 se_buff_kf91cfll2k_desc: "姜齐水国枕汀流，寨影横波半锁秋。\n白茗一瓯春到市，青锋三尺夜登舟。\n官军列炬收残垒，孤女衔冤向玉州。\n莫问当年恩与怨，芦花风起满汀洲。\n\n\n\n\n\n£se_buff_kf91cfll2k_desc\n\n\n"
 se_buff_yuanshi: "璟屿主矿脉"
 se_buff_yuanshi_desc: "源石主矿脉深埋地下，是灾难之源也是崛起之基。\n\n\n\n\n\n£se_buff_yuanshi_desc\n\n\n"
 se_buff_wfha5tft69: "余烬不息之地"
 se_buff_wfha5tft69_desc: "§R在春天到来前，我将自己埋入土里。\n听醋栗萌芽，花楸的果实坠地。\n我数着，一、二、三、四……多么安静、多么贫瘠。\n离家的士兵，唱着从未听过的歌儿来临。\n他从树上摘走鲜红的一枝，说它诚实，说它美丽。\n而后年轻的脚步远去，仿佛地下有河流淌，经年不息。\n它说：时间啊，我听见你。已逝去的存在，不会被忘记。§!\n\n\n\n\n\n£se_buff_wfha5tft69_desc"
 se_buff_thbpb2qt14: "狮王之傲，世界帝国"
 se_buff_thbpb2qt14_desc: "§O“先王的遗孤回到故土，以王的姿态驱逐魔族”——\n剑与王权的故事在此完结，维娜迈入书页之外的未知。\n沉默着的旧王与阴影中的仙子，呼喊着的人民与回首处的故友，\n都在等她做出一个选择，踏出一个未来。§!\n\n\n\n\n\n£se_buff_thbpb2qt14_desc\n\n\n⚪"
 se_buff_1r3qiw6x1e: "耶拉冈德，巨神心脏"
 se_buff_1r3qiw6x1e_desc: "§T是的，先生，这辆列车的终点站就在银心湖边。\n出站后，您就能近距离地瞻仰耶拉冈德像的容姿。\n不过，距离落成仪式还有一段时间，现在还有些需要修整的地方，请您理解。\n您想找一个能俯瞰城市的地方？那您可要费些功夫去爬附近的弗根山。\n不过，您也不用太担心，车站旁边一定有“跑跑驮兽”可以代步，而到了山脚下，也有缆车可以送您前往山顶。\n我的维多利亚语很好？啊，谢谢您的夸奖，掌握至少一门外语是现在的乘务员必备的技能。\n您来自维多利亚吗？谢拉格欢迎您。§!\n\n\n\n\n\n£se_buff_1r3qiw6x1e_desc\n\n\n⚪"
 se_buff_yl0e47d581: "绥靖模范"
 se_buff_yl0e47d581_desc: "该州顺从度增长迅速，抵抗度下降。"
 se_buff_7951lzdkzt: "抵抗据点"
 se_buff_7951lzdkzt_desc: "该州抵抗组织活跃，占领方难以控制。"
 se_buff_0y1x2uvkya: "人口大省"
 se_buff_0y1x2uvkya_desc: "该州人口稠密，兵源充足。"
 se_buff_39zr95eodt: "塔拉复国之基"
 se_buff_39zr95eodt_desc: "§B路，为人所踏出。火，为人所驱使。\n所以，若你所行的路并非通向理想的道路，你所见的火不是照亮寒夜的暖源——\n你也当回到那里，继续寻找。\n找一束光、一个方向、一阵声响……\n即使那只是一盏灯、一条艰难的路，和一首将尽的歌。§!\n\n\n\n\n\n£se_buff_39zr95eodt_desc\n\n\n⚪"
 se_buff_1bjngvmd0q: "荣耀与狂欢·大竞技场！"
 se_buff_1bjngvmd0q_desc: "§R剔除污秽的脏腑，要将我们的秩序填入，\n古老的传统焕然一新，花车与彩灯的游行庆祝叙拉古迈入新时代。\n可阴谋究竟能否被烟火烧尽，罪人的身影究竟能否被华服隐匿？\n狂欢之夜要留心，那恶狼仍在都市巡弋。§!\n\n\n\n\n\n£se_buff_1bjngvmd0q_desc\n\n\n⚪"
 se_buff_tuycxuoms2: "良港"
 se_buff_tuycxuoms2_desc: "该州港口与造船设施发达。"
 se_buff_snxlpxv3vm: "”我们的伊比利亚“"
 se_buff_snxlpxv3vm_desc: "§B伊比利亚，伊比利亚。\n人们甚至不知如何哀悼她，连悲伤都成了愤怒和仇恨。\n她的身躯在海床上沉睡，她的灵魂在咸水中腐烂。\n只是把这些都打捞起来，一切就都能复归原样吗？\n伊比利亚人也好、岛民也好、异乡的阿戈尔来客也好，没人知道。\n但他们看得到，海一直都是同一副模样，\n昨日也好，今天也罢。§!\n\n\n\n\n\n£se_buff_snxlpxv3vm_desc\n\n\n⚪"
 se_buff_rs5g2907cy: "基建狂魔"
 se_buff_rs5g2907cy_desc: "该州基础设施建设速度大幅提升。"
 se_buff_0j0lco3qv7: "极夜天曦"
 se_buff_0j0lco3qv7_desc: "§Y时代。时代在卡西米尔浓缩为了一个词，我们叫它卡瓦莱利亚基，我们也叫它大骑士领。\n新一届卡西米尔骑士特别锦标赛即将打响，我们用荣耀的模具，浇灌出了一场又一场闹剧。\n城市流光溢彩，霓虹灯征服了天空。金币叮叮作响，闪闪发亮，让人看不清那些小人物的面目。\n黎明还未升起。\n但长夜将尽。§!\n\n\n\n\n\n£se_buff_0j0lco3qv7_desc\n\n\n■"
 se_buff_7wj6vicyxv: "真理襁褓，蒙昧天敌"
 se_buff_7wj6vicyxv_desc: "§Y所有人都知道，359号基地只是一个开始，却没有人料到，克丽斯腾的行动来得如此迅速。\n从天而降的“流星”，不知去向的递质，急迫的军方，别有所图的梅兰德，凯尔希与意料之外的访客……一切都预示着有什么即将发生。\n没有人看得清，在迷雾的背后究竟隐藏着怎样的秘密，正如没有人料得到，未来离我们如此之近。\n试着抬头吧，答案近在眼前。§!\n\n\n\n\n\n£se_buff_7wj6vicyxv_desc\n\n■"
 se_buff_rhjg00d794: "乌萨斯人的最严厉的母亲"
 se_buff_rhjg00d794_desc: "§R圣骏堡阴郁的天幕下，他们曾谈论着明天，\n直到伟大的城市也被划为牢笼，扼死了所有幻想。\n乌萨斯不会听到，那些精妙的修辞，和喑哑的哭号。\n暴虐、阴谋、蔑视……回敬这些的，只有汹涌的怒火。\n你在哪里，雷霆——我听见自由的灵魂，那声嘶力竭的咆哮。§!\n\n\n\n\n\n£se_buff_rhjg00d794_desc"
