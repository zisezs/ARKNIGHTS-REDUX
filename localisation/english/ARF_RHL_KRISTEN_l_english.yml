# RHL "Kristen Returns" shared focus tree
 RHL_decision_kristen_chancellor: "Bring Her Back as Chancellor"
 RHL_decision_kristen_chancellor_desc: "Only one name is left on the Council’s list. She is at the old workshop in Block Thirty-Seven, changing bolts on a test stand nobody claimed.\nCalling her back means signing “whatever it costs” in your own name — from here on, every ignition and every crash is on this table."
 RHL_kr_breach: "A Hand’s Width"
 RHL_kr_breach_desc: "Above 6,972 metres the ionisation finally let go — for one hundred and forty seconds."
 RHL_kr_drawings: "Drawings Nobody Will Read"
 RHL_kr_drawings_desc: "Forty copies into forty rooms; half came back unread."
 RHL_kr_dyn_fool: "The Fool Who Chased Stars"
 RHL_kr_dyn_fool_desc: "“People live on this pea, gently wrapped in its pod, and could not care less.”\nTen Departments first called it the Fool Who Chased Stars, and meant it as mockery: a pack of people spending a nation’s whole strength against a thing everyone says cannot be opened.\nLater it came to mean something else. Every production line, every test stand, every full-duration burn that ends when the engine stops itself is entered on the same table — and the heading of that table reads 6,152.31 metres."
 RHL_kr_dyn_lone_star: "Lone Star"
 RHL_kr_dyn_lone_star_desc: "Every ignition since she took office, one line each: +1% research speed per launch.\n\nThis ledger has no cover page. She called herself only a pair of eyes looking into an unfamiliar deep sky — and those eyes have written down every launch, including the ones that came back as scrap."
 RHL_kr_external_power: "Externally Fed"
 RHL_kr_external_power_desc: "Power drawn up from the well through conduits. One sarcophagus is not enough, so feed it more."
 RHL_kr_full_burn: "Burn to Cutoff"
 RHL_kr_full_burn_desc: "Every unit is run to shutdown, not to its rated figure."
 RHL_kr_knock_shell: "Knocking on the Shell"
 RHL_kr_knock_shell_desc: "For the first time the recorder showed the barrier is not a wall — it answers you."
 RHL_kr_low_flight: "Low Flight"
 RHL_kr_low_flight_desc: "This time it did not come down. Forty-one seconds, a record above Terra."
 RHL_kr_nation_power: "The Whole Country’s Weight"
 RHL_kr_nation_power_desc: "Spend whatever it costs, written out as lines, plants and a quarter of consumer goods."
 RHL_kr_nominate: "Nominate Her Chancellor"
 RHL_kr_nominate_desc: "No campaign, and no second name on the sheet."
 RHL_kr_one_grain: "One Grain of Dust"
 RHL_kr_one_grain_desc: "One photograph came back: part of a planet, blue enough to be unbearable."
 RHL_kr_persuade: "Convincing Ten Departments"
 RHL_kr_persuade_desc: "One request only: do not treat “impossible” as a conclusion."
 RHL_kr_plan_dead: "The Programme Is Dead"
 RHL_kr_plan_dead_desc: "The programme was struck off the register and the well handed to us, because nobody else would take it."
 RHL_kr_reclaim: "Take Back the Allocation"
 RHL_kr_reclaim_desc: "The ministry left one file: the well’s allocation table. We rewrote it page by page."
 RHL_kr_reopen_construct: "Reopen the Construction Directorate"
 RHL_kr_reopen_construct_desc: "The directorate founded for one project is re-chartered, and this time the project has a name."
 RHL_kr_seven_fifty_three: "Seven Hundred and Fifty-Three"
 RHL_kr_seven_fifty_three_desc: "A breathing garden of seven hundred and fifty-three kinds, knowing most will not live."
 RHL_kr_shame: "A Disgraceful Failure"
 RHL_kr_shame_desc: "Failure was not the disgrace; writing it up as a success was."
 RHL_kr_silence: "Saria Says Nothing"
 RHL_kr_silence_desc: "Only Defense could still shut this down. Its head signed three words: no objection."
 RHL_kr_testsite: "Test Site on the Wasteland"
 RHL_kr_testsite_desc: "One siting rule: the odds of it landing on someone must be very small."
 RHL_kr_vanished: "Gone Into the Crowd"
 RHL_kr_vanished_desc: "She never resigned and was never dismissed; she simply left every public list."
 RHL_kr_vtt_air_p05: "§GThe Fool Who Chased Stars: Air Attack +5%§!"
 RHL_kr_vtt_air_p10: "§GThe Fool Who Chased Stars: Air Attack +10%§!"
 RHL_kr_vtt_arms_p05: "§GThe Fool Who Chased Stars: Military Factory Construction +5%§!"
 RHL_kr_vtt_arms_p10: "§GThe Fool Who Chased Stars: Military Factory Construction +10%§!"
 RHL_kr_vtt_fuel_p05: "§GThe Fool Who Chased Stars: Fuel Gain +5%§!"
 RHL_kr_vtt_fuel_p10: "§GThe Fool Who Chased Stars: Fuel Gain +10%§!"
 RHL_kr_vtt_ind_p05: "§GThe Fool Who Chased Stars: Civilian Factory Output +5%§!"
 RHL_kr_vtt_ind_p10: "§GThe Fool Who Chased Stars: Civilian Factory Output +10%§!"
 RHL_kr_vtt_pp_p05: "§GThe Fool Who Chased Stars: Daily Political Power +5%§!"
 RHL_kr_vtt_pp_p10: "§GThe Fool Who Chased Stars: Daily Political Power +10%§!"
 RHL_kr_vtt_research_p05: "§GThe Fool Who Chased Stars: Research Speed +5%§!"
 RHL_kr_vtt_research_p10: "§GThe Fool Who Chased Stars: Research Speed +10%§!"
 RHL_kr_vtt_research_p15: "§GThe Fool Who Chased Stars: Research Speed +15%§!"
 RHL_kr_vtt_stab_p05: "§GThe Fool Who Chased Stars: Stability +5%§!"
 RHL_kr_vtt_stab_p10: "§GThe Fool Who Chased Stars: Stability +10%§!"
 RHL_kr_vtt_ws_p05: "§GThe Fool Who Chased Stars: War Support +5%§!"
 RHL_kr_vtt_ws_p10: "§GThe Fool Who Chased Stars: War Support +10%§!"
 RHL_lone_star: "Lone Star"
 RHL_lone_star_desc: "§Y[Lone Star]§! Each rocket Rhine Lab launches grants §G+1%§! research speed, accumulating while she leads and never reset.\nThe running total is the “Research Speed” line of the national spirit Lone Star — ten launches, ten percent.\n\n“Scientists do not believe that dreams are false. They will prove to all of humanity that every dream can come true.”\nFour hours in the Council chamber, and the only thing she promised was a table: every metre won upward is a little more knowledge for everyone."
 rhl_kr.1.a: "File it away."
 rhl_kr.1.d: "“What the ministry wanted, they said, was something to salvage Bolívar’s face. What it salvaged in the end was a contract.”\nOnce the Federation’s colours came down, the Joint Council’s first act was to re-open the books: the Horizon Arclight Programme was struck from the register, Arc One was filed in the textbooks under Cautionary Examples, and the well outside Trimounts — the one nobody can switch off — was signed over to Rhine Lab, because nobody else would take it.\nTen Departments took the word “space” off the agenda. Whoever did it knew perfectly well this was not a verdict. It was a refusal to hear the word again."
 rhl_kr.10.a: "Do it."
 rhl_kr.10.d: "“Whatever it costs” has a shape once it is a line in a budget: three production lines retooled for spares, two power plants rebuilt as test stands, one quarter of the consumer-goods quota reassigned to transport-grade parts.\nWhen Commerce handed up the tables she asked one question: who, in the end, pays the cost. Nobody answered her."
 rhl_kr.11.a: "Raise the output."
 rhl_kr.11.d: "“It does not run on the Originium energy you know.”\nPower is drawn up out of the well below, through conduits, straight into the nozzle. No single sarcophagus can carry that much — so connect more of them. Originium Arts refuses to admit it drew this machine; the power-loss curve is frankly indecent.\nFerdinand used to say the well is Rhine’s heart. A heart that beats too fast is going to cause an accident."
 rhl_kr.12.a: "Raise the tower."
 rhl_kr.12.d: "There was one siting rule: the odds of it landing on someone had to be very small.\nThe spot they chose is downwind of the rubbish tip. On the day the first concrete went into the tower footing, the wind came in off the icefields hard enough that all four corners of the drawings needed stones on them."
 rhl_kr.13.a: "Burn to cutoff."
 rhl_kr.13.b: "Keep a margin."
 rhl_kr.13.d: "“There is something wrong with the performance of the propulsion unit.”\nNobody wanted to pick that sentence up the first time it was said out loud. So every unit is burned to full duration before it leaves the shop — not to its rated figure, but until it stops itself. Test Stand Three was added after the second explosion."
 rhl_kr.14.a: "Take them up."
 rhl_kr.14.d: "Ecology intends to build a breathing garden up there: seven hundred and fifty-three kinds of life, plus lighting, water cycling and air scrubbing — none of it dependent on Originium technology.\nEveryone knows that within minutes of breaching the barrier, more than nine in ten of those plants will be dead. They put the manifest into the payload plan anyway.\n“If nothing can live up there, then let us first see how long it takes to die.”"
 rhl_kr.15.a: "Again, higher."
 rhl_kr.15.d: "This time it did not come back down.\nThe telemetry curve climbed to the design altitude, held there quietly for forty-one seconds, and then dropped into the wasteland on command. When the recovery team carried it in, the whole shop floor applauded — forty-one seconds, the longest anyone has stood upright above Terra in a hundred and twenty years."
 rhl_kr.16.a: "Compute the speed needed."
 rhl_kr.16.d: "6,152.31 metres — the height of the sky over Terra, and the last entry in the Wrights’ log.\nThe vehicle began to shake at 5,037 metres, began losing altitude at 6,152, and became a pile of parts on the ground again at 3,454.7. But for the first time the instruments recorded that thing: the barrier is not a wall. It is something that answers you.\nSince the last Lateran probe ball fell five hundred metres short of the barrier, the academies of every nation had all but abandoned the question. Today somebody picked it up again."
 rhl_kr.17.a: "Use the whole window."
 rhl_kr.17.b: "Bring the payload home."
 rhl_kr.17.d: "“The gathered light forsakes the earth and thrusts towards the higher sky.”\n“The false sky is torn apart at last.”\n“The ancient twin moons show their true faces.”\nAbove 6,972 metres the ionisation finally stopped interfering with the machine — and held for one hundred and forty seconds. Nobody spoke for any of them, because everyone knew: this is a moment only, and it will close again.\nFor the first time in a hundred and twenty years, someone has seen the truth from above the barrier."
 rhl_kr.18.a: "Hang the photograph."
 rhl_kr.18.d: "The remote recorder brought back exactly one thing: a photograph. Part of a planet, blue enough to be hard to look at.\nThe world Terra stands on was seen from outside for the first time — one corner of it, one grain of dust across.\n“If in the hundred years and thousand years to come, those who follow walk beside the stars, they will praise her name.”\n“So then. Good night, everyone on Terra. Good night, universe.”"
 rhl_kr.2.a: "Keep watching."
 rhl_kr.2.d: "She did not resign and she was not dismissed — she simply stopped appearing on any public list.\nThe personnel file reads “Construction Directorate — dissolved”. The name is gone from Commerce’s guest lists. Someone saw her at the old workshop in Block Thirty-Seven, changing the bolts on a test stand nobody had claimed.\nThe Maylander observer closed his report with one line: the subject presents no risk. It would prove to be the single wrongest sentence written in Columbia that year."
 rhl_kr.3.a: "Keep the numbers."
 rhl_kr.3.d: "The failure was not the disgrace. The disgrace was writing it up as a success.\nTelemetry cut out for eleven seconds past apogee. The ministry wanted those eleven seconds explained, and the design bureau could not explain them. So everyone agreed to call “almost” a thing that should never have been attempted.\nThe recorder’s highest figure was 3,454.7 metres. The sky over Terra is 6,152.31 metres high. Between the two numbers lie a hundred and twenty years."
 rhl_kr.4.a: "Print one more."
 rhl_kr.4.d: "She ran forty copies of the drawings, carried them into forty meeting rooms one at a time, and waited outside.\nHalf came back unread. The other half went to the bottom of the pile. The problem was never that the drawings could not be trusted — it was that nobody would sign for a launch that was bound to fail.\n‘The copier stopped at forty. Forty,’ she said, ‘is better than thirty-nine.’"
 rhl_kr.5.a: "Let her finish."
 rhl_kr.5.b: "Talk money only."
 rhl_kr.5.d: "“Scientists do not believe that dreams are false. They will prove to all of humanity that every dream can come true.”\nShe spoke in the Council chamber for four hours. For twenty minutes in the middle nobody said anything, and every newspaper in the country later explained that silence in a different way.\nShe asked for one thing: do not treat “impossible” as a conclusion. It is an intermediate value nobody has finished computing."
 rhl_kr.6.a: "That is enough."
 rhl_kr.6.d: "Defense was the only department still able to shut this down, and its director said nothing at all.\nThe committee asked her to take a position. She put down her pen and signed the column marked No Objection. Everyone could read those three words: not agreement — she had simply stopped blocking.\nAfter the meeting someone saw her standing a long time at the end of the corridor, then turning down to the Originium Research Room on the third basement level."
 rhl_kr.7.a: "Acclaim her."
 rhl_kr.7.b: "Hold the vote anyway."
 rhl_kr.7.d: "No campaign speech. No debate. No second candidate.\nHuman Resources read the list aloud. At the last name she paused for two seconds — and in those two seconds everyone in the room remembered the same thing: the last time this woman stood in this position, these same people had signed the same table.\n“I am only a pair of eyes,” she said. “A pair of eyes looking into an unfamiliar deep sky.”"
 rhl_kr.8.a: "Run the conduits."
 rhl_kr.8.d: "The last file the ministry left behind was the allocation table for the well outside Trimounts.\nThe new directorate rewrote it page by page: first the purpose, then the signature, and last the clause about who may ask questions after an accident. It cannot be shut down — the ministry had known that for years and simply never put it in writing."
 rhl_kr.9.a: "Break ground."
 rhl_kr.9.d: "A directorate founded for a single project, holding nearly every director’s best thinking. The last time it was chartered, the project had no name; this time the project had a name first.\nEngineering gave up its best test stand; Structures tightened tolerances from serviceable to interchangeable. The shop floor cursed for a week and then noticed the rework had gone away."
 rhl_kr_tt_need_dead_clb: "Requires the Columbian Federation to no longer exist."
 rhl_kr_tt_need_launch: "The Wanxingyuan must have one successful launch first."

