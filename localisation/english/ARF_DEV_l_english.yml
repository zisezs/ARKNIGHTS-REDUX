l_english:
 # 发展度共享国策树（DEV）· agri
 DEV_agri_1:0 "Reclaim the Fields"
 DEV_agri_1_desc:0 "Canals dug and fields measured, every inch of soil put to work."
 DEV_agri_2:0 "Better Seeds and Tools"
 DEV_agri_2_desc:0 "Better seed, green manure and crop rotation reach the villages; yields begin to climb."
 DEV_agri_3:0 "Machines and Fertilizer"
 DEV_agri_3_desc:0 "Tractors and fertilizer arrive; farming gains an industrial backbone for the first time."
 DEV_agri_4:0 "Collective Farms"
 DEV_agri_4_desc:0 "Large farms and cooperatives work as one, and the harvest no longer depends on luck."
 DEV_agri_5:0 "Fields of Plenty"
 DEV_agri_5_desc:0 "Granaries are full, and famine becomes a word found only in old books."
 DEV_tt_agri:0 "Agricultural development §Y+1 level§!, sustained automatically so it never decays. Completes on its own once industry meets the threshold."
 # 发展度共享国策树（DEV）· ind
 DEV_ind_1:0 "Merge the Workshops"
 DEV_ind_1_desc:0 "Scattered workshops are merged into common plants; the clatter of machines joins into one sound."
 DEV_ind_2:0 "Electrification"
 DEV_ind_2_desc:0 "Power grids and steam mains spread, freeing factories from the riverbank."
 DEV_ind_3:0 "Assembly Lines"
 DEV_ind_3_desc:0 "Standard parts and conveyor belts double output as workers learn to move with the beat."
 DEV_ind_4:0 "Heavy Industry"
 DEV_ind_4_desc:0 "Steel, machinery and chemicals interlock: the nation has an industrial skeleton of its own."
 DEV_ind_5:0 "Industrial Depth"
 DEV_ind_5_desc:0 "From raw material to finished goods, everything closes the loop at home."
 DEV_tt_ind:0 "Industrial development §Y+1 level§!, sustained automatically so it never decays. Completes on its own once industry meets the threshold."
 # 发展度共享国策树（DEV）· edu
 DEV_edu_1:0 "Literacy Drive"
 DEV_edu_1_desc:0 "Night schools and literacy classes reach the villages; more than half can write their own names."
 DEV_edu_2:0 "Primary Schools for All"
 DEV_edu_2_desc:0 "Every township gets a schoolhouse, and lessons no longer pass only by word of mouth."
 DEV_edu_3:0 "Secondary Education"
 DEV_edu_3_desc:0 "Secondary and vocational schools spread; factories and chanceries both find people who can read."
 DEV_edu_4:0 "Higher Education Network"
 DEV_edu_4_desc:0 "Universities and institutes form a network, and the nation begins training its own scholars."
 DEV_edu_5:0 "A Land of Academies"
 DEV_edu_5_desc:0 "Study and argument take root in the cities, and talent no longer has to be invited in from abroad."
 DEV_tt_edu:0 "Educational development §Y+1 level§!, sustained automatically so it never decays. Completes on its own once industry meets the threshold."
 # 发展度共享国策树（DEV）· adm
 DEV_adm_1:0 "Grassroots Administration"
 DEV_adm_1_desc:0 "Local offices are re-established and households registered; orders finally travel past the capital."
 DEV_adm_2:0 "Records and Archives"
 DEV_adm_2_desc:0 "Household rolls, deeds and dispatches are archived, and the state starts to remember its own books."
 DEV_adm_3:0 "Standardized Bureaucracy"
 DEV_adm_3_desc:0 "Performance reviews and standing rules reach every office; doing business no longer depends on faces."
 DEV_adm_4:0 "Professional Civil Service"
 DEV_adm_4_desc:0 "An examined professional civil service holds up the machine of state."
 DEV_adm_5:0 "Precision Governance"
 DEV_adm_5_desc:0 "Statistics, budgets and audits close their gaps: the state on paper matches the state on the ground."
 DEV_tt_adm:0 "Administrative development §Y+1 level§!, sustained automatically so it never decays. Completes on its own once industry meets the threshold."
 # 发展度共享国策树（DEV）· pov
 DEV_pov_1:0 "Relief and Alms"
 DEV_pov_1_desc:0 "Soup kitchens and relief granaries open; the very bottom is caught first."
 DEV_pov_2:0 "Food and Shelter"
 DEV_pov_2_desc:0 "Rations and winter clothing become standing provisions, and bodies vanish from the streets."
 DEV_pov_3:0 "Work and Resettlement"
 DEV_pov_3_desc:0 "Work-for-relief schemes and resettlement farms give the displaced a trade again."
 DEV_pov_4:0 "Welfare for All"
 DEV_pov_4_desc:0 "Pensions, medicine and compensation are written into law; poverty is no longer a crime."
 DEV_pov_5:0 "No More Hunger"
 DEV_pov_5_desc:0 "Even the poorest live with dignity, and the nation proves worthy of its people."
 DEV_tt_pov:0 "Poverty reduction §Y+1 level§!, sustained automatically so it never decays. Completes on its own once industry meets the threshold."
