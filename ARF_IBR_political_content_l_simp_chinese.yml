# ===== 伊比利亚政治线 · 民族精神与决议组【审判庭大净化】（手改） =====
# 国策名与正文在 ARF_IBR_political_l_simp_chinese.yml（生成器 docs/gen_ibr_political.cjs 产出，勿在此重复）

 IBR_broken_garrisons: "溃散的地方驻军"
 IBR_bandits_and_warlords: "盗匪与军阀横行"
 IBR_aegir_malicious_interference: "阿戈尔的恶意干涉"

 IBR_inquisition_reforming: "重整中的惩戒军"
 IBR_inquisition_reforming_desc: "点名册重新抄过一遍，逃兵的栏位空着。惩戒军还在，只是还没找回自己的样子。"
 IBR_countryside_regathering: "收拢中的乡野"
 IBR_countryside_regathering_desc: "官道上的关卡重新立了起来，镇子里能收到税、也能收到状纸——至少名义上是这样。"
 IBR_mirialium_cautious_contact: "谨慎接触中的弥利亚留姆"
 IBR_mirialium_cautious_contact_desc: "海底的船队愿意再谈一次，条件是伊比利亚先把自己港口的规矩写清楚。"

 IBR_pol_pure_heart_dm: "伊比利亚·纯白之心"
 IBR_pol_pure_heart_dm_desc: "审判庭不再只是审人，也开始审自己。提灯照亮的范围，一格一格往外挪。"
 IBR_pol_unity_nation_dm: "团结之国"
 IBR_pol_unity_nation_dm_desc: "岛民与陆民的名字开始出现在同一份名册上。承认彼此做过什么，是这件事的第一步。"
 IBR_pol_golden_century_dm: "黄金世纪"
 IBR_pol_golden_century_dm_desc: "废铁重新进了炉子，账本重新有人记。黄金时代的船队还没回来，但造船的人已经在船台上了。"

 IBR_crushed_brigands: "被镇压的恶徒"
 IBR_crushed_brigands_desc: "路边的绞架还没拆完，商队已经敢走夜路了。剩下的恶徒学会了低头。"
 IBR_reassured_defence_army: "暂且安心的国防军"
 IBR_reassured_defence_army_desc: "兵营重新点起了火，军饷按季发。他们不再提防自己的长官，虽然也还谈不上信任。"

 IBR_purge_remnants_category: "余烬清算"
 IBR_purge_remnants_category_desc: "两条路都走到了尽头，剩下的溃局可以花钱换个轻档——代价不小，换来的也只是『没那么糟』。"

 IBR_crush_the_disloyal: "碾碎不忠者！"
 IBR_crush_the_disloyal_desc: "调惩戒军与国防军合围山道，把还能打的恶徒一次性碾平。要花的是库房里的步枪和街面上的安静。"
 IBR_imperial_progress: "女皇陛下的全国巡礼！"
 IBR_imperial_progress_desc: "女皇用半年时间走遍全境，让每个城镇都亲眼看见王冠。这半年里，国防军会暂且安下心来。"

 IBR_purification_category: "审判庭大净化"
 IBR_purification_category_desc: "审判官纯洁性 §G[?IBR_pur_purity|0]%§!　｜　惩戒军纪律性 §G[?IBR_pur_discipline|0]%§!　｜　民众信任度 §G[?IBR_pur_trust|0]%§!\n每 7 天各回落 §R1%§!。"

 IBR_purification_status: "净化状况"
 IBR_purification_status_desc: "审判官纯洁性 §G[?IBR_pur_purity|0]%§!　｜　惩戒军纪律性 §G[?IBR_pur_discipline|0]%§!　｜　民众信任度 §G[?IBR_pur_trust|0]%§!\n这三项每 7 天各回落 §R1%§!；决议只能把它们重新推上去。"

 IBR_reassert_founding_ideal: "重申审判庭建立初衷"
 IBR_suppress_extremist_inquisitors: "镇压极端派审判官"
 IBR_open_inquisition_archives: "公开审务档案"
 IBR_crack_down_on_vigilantes: "清理走私与私刑"
 IBR_inventory_church_arms: "点验各教堂的铳械"
 IBR_inventory_church_arms_desc: "各堂口的火器逐支登记入册，编号与领用签押一并归档。花的是政治点，收回来的是纪律。"
 IBR_review_fencing_masters: "考核剑术教习"
 IBR_review_fencing_masters_desc: "让每一位教习当着同僚的面走完一套剑路。能不能教人，看的是手上，不是名册上。"
 IBR_reopen_old_blood_cases: "开棺重审陈年血案"
 IBR_reopen_old_blood_cases_desc: "把几十年前那些草草结案的卷宗重新摊开，该翻的坟也翻。街上会不安，但活着的人会开始相信这份审判。"

 IBR_pur_purity_tt: "审判官纯洁性"
 IBR_pur_discipline_tt: "惩戒军纪律性"
 IBR_pur_trust_tt: "民众信任度"

# ===== 两个终幕的领袖与特质 =====
 IBR_Estefania: "埃斯特菲尼娅·科隆·德·托莱多"
 IBR_Estefania_desc: "十年前还在广场上用故事换一顿饭的黎博利姑娘。她记得每一个沉没城镇的名字，也记得自己没有任何姓氏——现在这两件事都成了国事。"
 IBR_toledo_legitimist: "德·托莱多家族正统"
 IBR_toledo_legitimist_long: "德·托莱多家族正统·审判庭"

 IBR_fire_of_judgement: "审判之火"
 IBR_fire_of_judgement_desc: "她把审判庭从复仇的手里接回来，代价是再没有人能靠政治点把事情推下去。"
 IBR_false_crown_true_king: "假王室，真国王"
 IBR_false_crown_true_king_desc: "一个没有姓氏的骗子戴上了真王冠——而议会发现，愿意签字的反而只有她。"

 IBR_pol_saint_irene_tt: "§Y国家领袖§!变更为§Y圣徒艾丽妮§!，获得领袖特质§Y审判之火§!（稳定度 §G+20%§!、政治点数获取 §R−10%§!）。"
 IBR_pol_empress_estefania_tt: "执政党改名为§Y德·托莱多家族正统§!，§Y国家领袖§!变更为§Y埃斯特菲尼娅·科隆·德·托莱多§!，获得领袖特质§Y假王室，真国王§!（政治点数获取 §G+10%§!）。"
